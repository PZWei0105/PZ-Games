# 《解包 UNPACKED》資料管線：Steam 台灣區價格、同上人數、評價、預告與截圖，加上每日寫稿用的選題候選。
# 只動 apps/unpacked/data/ 底下的 live.json＋live/（即時資料分兩層）、wish.json、hist/、candidates.json、board.json／board-d.json（行情板）、free.json（免費補給站）、
# calendar.ics、inbox.json（點播台收件）；專題、推坑、週報、問答（qa.json）由排程推上來。
# 願望單：Steam 代號放在 repo 的 Actions 密碼 UNP_STEAM（Settings → Secrets and variables → Actions），不會公開。
name: unpacked-live

on:
  schedule:
    - cron: '41 * * * *'        # 每小時（第 41 分，避開整點塞車；GitHub 偶爾會跳過排程，所以排密一點）
  push:
    branches: [main]
    paths:
      - 'apps/unpacked/data/track.json'
      - 'apps/unpacked/data/wish-cfg.json'
      - 'apps/unpacked/data/events.json'
      - '_build/apps/unpacked/tools/inbox.py'
      - '_build/apps/unpacked/tools/live.py'
  workflow_dispatch:
    inputs:
      selftest:
        description: '點播台收件自我測試（送一筆 ping 到轉發站再收回來）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: unpacked-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓 Steam 資料
        env:
          UNP_STEAM: ${{ secrets.UNP_STEAM }}
        run: python3 _build/apps/unpacked/tools/live.py --data apps/unpacked/data
      - name: 點播台收件
        run: python3 _build/apps/unpacked/tools/inbox.py --data apps/unpacked/data ${{ inputs.selftest && '--selftest' || '' }} || echo '收件這輪失敗，下一輪再收'
      - name: 有變動才 commit
        run: |
          git config user.name 'unpacked-bot'
          git config user.email 'unpacked-bot@users.noreply.github.com'
          # 一個一個加：還沒產生的檔案不能讓整個 git add 失敗
          for f in live.json live wish.json calendar.ics hist candidates.json board.json board-d.json free.json inbox.json info names.json; do
            if [ -e "apps/unpacked/data/$f" ]; then git add "apps/unpacked/data/$f"; fi
          done
          if git diff --cached --quiet; then echo '沒有變動'; exit 0; fi
          git commit -q -m '解包：更新 Steam 即時資料'
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            echo "push 失敗，重試 $i"; sleep $((i * 7))
          done
          exit 1
