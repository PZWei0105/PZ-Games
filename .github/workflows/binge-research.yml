# 《補番 BINGE》找動畫頻道：改 _build/apps/binge/research/queue.json 推上去（或手動觸發）就跑一次，
# 照關鍵字搜 YouTube 頻道與影片、看 RSS 與頻道分頁（片長、合輯、播放清單），結果推到 binge-research 分支。只給維護片源名單參考用。
name: binge-research

on:
  push:
    branches: [main]
    paths:
      - '_build/apps/binge/research/queue.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binge-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 yt-dlp
        run: pip install -q -U yt-dlp
      - name: 研究
        run: python3 _build/apps/binge/tools/research.py --queue _build/apps/binge/research/queue.json --out /tmp/research
      - name: 推 binge-research 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/research
          git init -q -b binge-research
          git config user.name 'binge-bot'
          git config user.email 'binge-bot@users.noreply.github.com'
          git add -A
          git commit -q -m '補番：頻道調查'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:binge-research
