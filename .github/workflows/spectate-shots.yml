# 《觀戰 SPECTATE》上線檢查：在 GitHub 的機器上打開已上線的網站截圖（真縮圖、真播放器、真資料），
# 截圖推到 spectate-shots 分支（強制推送、只留最新一版）。只有手動觸發。
name: spectate-shots

on:
  workflow_dispatch:
    inputs:
      url:
        description: '要截圖的網址'
        default: 'https://pzwei0105.github.io/PZ-Games/apps/spectate/'

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 Playwright 與中文字型
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-cjk > /dev/null
      - name: 截圖
        run: python3 _build/apps/spectate/tests/remote_shots.py --url "${{ inputs.url }}" --out /tmp/shots
      - name: 推 spectate-shots 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/shots
          git init -q -b spectate-shots
          git config user.name 'spectate-bot'
          git config user.email 'spectate-bot@users.noreply.github.com'
          git add -A
          git commit -q -m '觀戰：上線截圖'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:spectate-shots
