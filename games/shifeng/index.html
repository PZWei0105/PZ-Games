<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>拾鋒</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0a0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: full-bleed battlefield canvas; bronze-edged lacquer plaques float over it; modal screens are lacquer panels over a dimmed field. One dark world by design. */
:root{
  --ink:#0c0a0d; --lac:#18121a; --lac2:#221923; --lac3:#2e2231;
  --bronze:#c19456; --bronze-dim:#6e5434; --paper:#f2e7d0; --paper-dim:#b4a68e; --mute:#857a6c;
  --rust:#e2552f; --blood:#e0444e; --jade:#7fe3c4;
  --t0:#b4b9be; --t1:#4fd1b5; --t2:#bd92ff; --t3:#ffcf5a;
  --display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;padding-left:0;padding-right:0}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--t3);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.htop{display:flex;align-items:flex-start;gap:10px}
.vit{display:flex;gap:9px;align-items:center;flex:1 1 0;min-width:0;max-width:300px}
.lvseal{width:44px;height:46px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 28%,#43262f,#1a0f16 70%);border:1.5px solid var(--bronze);border-radius:7px;
  transform:rotate(-4deg);box-shadow:0 3px 10px rgba(0,0,0,.65);font-family:var(--display);line-height:1}
.lvseal b{font-size:17px;font-weight:900;color:var(--paper)}
.lvseal small{font-size:9px;color:var(--bronze);letter-spacing:.25em;margin-top:3px;padding-left:.25em}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hp{position:relative;height:17px;background:#1b0c10;border:1px solid #5d2a2c;border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.hp i,.hp em{position:absolute;inset:0;transform-origin:left center}
.hp em{background:rgba(255,214,190,.42);transition:transform .7s .25s}
.hp i{background:linear-gradient(180deg,#ff7466,#cc2a3c 60%,#8a1323);transition:transform .12s}
.hp b{position:absolute;inset:0;font:700 11px/17px var(--body);text-align:center;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.xp{height:6px;background:#0d1614;border:1px solid #24443c;border-radius:3px;overflow:hidden}
.xp i{display:block;height:100%;transform-origin:left center;background:linear-gradient(90deg,#3cbf9d,#c4ffee);transition:transform .15s}
.clock{flex:none;text-align:center;padding-top:1px;min-width:92px}
.clock .tm{font:900 23px/1 var(--display);letter-spacing:.05em;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000}
.clock .ob{font-size:11px;color:var(--paper-dim);margin-top:5px;white-space:nowrap;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.clock .ob.hot{color:#ff9a6a}
.hright{flex:1 1 0;display:flex;justify-content:flex-end;gap:10px;align-items:center}
.kills{font:900 17px/1 var(--display);text-shadow:0 1px 4px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.kills small{font-size:10px;color:var(--bronze);margin-left:2px}
#pauseBtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(24,18,26,.85);border:1px solid var(--bronze-dim);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#pauseBtn span{display:flex;gap:4px}
#pauseBtn span i{width:4px;height:14px;background:var(--paper);border-radius:1px}
#bossBar{margin:12px auto 0;width:min(520px,100%);text-align:center}
#bossBar .bn{font:900 15px/1 var(--display);letter-spacing:.35em;padding-left:.35em;color:#ffd9a8;text-shadow:0 0 12px rgba(255,90,40,.7),0 2px 4px #000}
#bossBar .bb{margin-top:7px;height:11px;background:#1b0c10;border:1px solid #7a3a22;border-radius:2px;overflow:hidden;box-shadow:0 0 14px rgba(226,85,47,.25)}
#bossBar .bb i{display:block;height:100%;transform-origin:left center;background:linear-gradient(90deg,#7e1020,#e2552f,#ffbb66);transition:transform .15s}
#banners{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px}
.bnr{width:min(360px,100%);position:relative;background:linear-gradient(180deg,rgba(32,23,34,.88),rgba(15,10,17,.88));
  border:1px solid var(--bc);border-radius:6px;padding:8px 10px 8px 8px;display:flex;gap:9px;
  box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 24px var(--bg2);animation:bin .4s cubic-bezier(.2,1.35,.4,1) both}
.bnr.out{animation:bout .35s ease-in forwards}
@keyframes bin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bout{to{opacity:0;transform:translateY(-10px)}}
.bnr img{width:40px;height:40px;flex:none}
.bnr .bt{min-width:0;flex:1}
.bnr .bh{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.bnr .bh strong{font:900 15px/1.2 var(--display);color:var(--bc)}
.tierlab{font-size:10px;letter-spacing:.2em;color:var(--bc);border:1px solid var(--bc);border-radius:2px;padding:1px 4px 1px 6px;line-height:1.3}
.tags{display:inline-flex;gap:4px}
.tg{font:700 10px/1 var(--body);padding:3px 5px;border-radius:2px;background:rgba(255,255,255,.07);color:var(--tc)}
.bnr p{margin:3px 0 0;font-size:12px;line-height:1.38;color:var(--paper)}
.bnr p.cost{color:#ff8f86}
.bnr p.res{color:var(--t3);font-weight:700}
.bnr p.need{color:var(--paper-dim)}
.bnr p.tip{color:var(--jade);font-size:11.5px}
.bnr.ann{--bc:#e2552f;--bg2:rgba(226,85,47,.2);justify-content:center;text-align:center;padding:7px 12px}
.bnr.ann strong{color:#ffcfa8}
.spacer{flex:1}
.hbot{display:flex;align-items:flex-end;gap:12px}
.pack{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
#tagRow{display:flex;gap:5px;flex-wrap:wrap;min-height:20px}
.tchip{font:700 11px/1 var(--body);padding:4px 6px;border-radius:3px;background:rgba(18,13,20,.82);border:1px solid rgba(255,255,255,.08);color:var(--tc);text-shadow:0 1px 2px #000}
.tchip.on{border-color:var(--tc);box-shadow:0 0 10px color-mix(in srgb,var(--tc) 40%,transparent)}
.tchip.max{background:color-mix(in srgb,var(--tc) 22%,#120d14)}
#slots{display:flex;gap:6px}
.slot{width:44px;height:44px;border-radius:6px;background:rgba(14,10,16,.8);border:1px dashed rgba(193,148,86,.3);display:grid;place-items:center;position:relative}
.slot.full{border:1.5px solid var(--bc);background:radial-gradient(circle,color-mix(in srgb,var(--bc) 22%,#141018),#100c12 75%)}
.slot img{width:40px;height:40px}
#ultBtn{pointer-events:auto;position:relative;flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 35%,#3a2a1e,#140e10 72%);border:2px solid var(--bronze-dim);box-shadow:0 6px 18px rgba(0,0,0,.6)}
#ultBtn .ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--t3) var(--p,0%),rgba(255,255,255,.06) 0);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
#ultBtn .ut{font:900 20px/1 var(--display);letter-spacing:.1em;padding-left:.1em;color:var(--paper-dim);position:relative}
#ultBtn.ready{border-color:var(--t3);animation:ultp 1.1s ease-in-out infinite}
#ultBtn.ready .ut{color:#fff4d6;text-shadow:0 0 12px rgba(255,200,90,.9)}
@keyframes ultp{50%{box-shadow:0 0 0 6px rgba(255,207,90,.18),0 0 30px rgba(255,190,80,.55)}}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  background:rgba(7,5,8,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.panel{width:min(560px,100%);margin:auto;background:linear-gradient(180deg,var(--lac2),var(--lac));border:1px solid var(--bronze-dim);border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,220,160,.08);padding:20px 18px;box-sizing:border-box;animation:pin .3s ease-out both}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ph{text-align:center;margin-bottom:14px}
.ph .eb{font-size:11px;letter-spacing:.4em;padding-left:.4em;color:var(--bronze)}
.ph h2{margin:6px 0 0;font:900 26px/1.2 var(--display);letter-spacing:.08em;text-wrap:balance}
.ph p{margin:6px 0 0;font-size:13px;color:var(--paper-dim);line-height:1.5}
.choices{display:flex;flex-direction:column;gap:10px}
.sk{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:8px;background:rgba(255,255,255,.035);border:1px solid rgba(193,148,86,.25);transition:transform .12s,border-color .12s,background .12s}
.sk:hover,.sk:active{border-color:var(--bronze);background:rgba(193,148,86,.08);transform:translateY(-1px)}
.seal{width:50px;height:50px;flex:none;display:grid;place-items:center;border-radius:6px;font:900 24px/1 var(--display);
  color:#1a1012;background:var(--sc,#c19456);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.4);transform:rotate(-3deg)}
.sk .st{min-width:0;flex:1}
.sk .sn{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sk .sn b{font:900 18px/1.2 var(--display)}
.sk .lvd{font-size:11px;color:var(--bronze);font-variant-numeric:tabular-nums}
.sk .lvd.new{color:var(--jade)}
.sk .sd{margin-top:4px;font-size:13px;color:var(--paper-dim);line-height:1.45}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.12)}
.dots i.on{background:var(--bronze)}
.icard{display:flex;gap:12px;padding:12px;border-radius:8px;background:rgba(255,255,255,.035);border:1px solid color-mix(in srgb,var(--bc) 45%,transparent);text-align:left;width:100%;box-sizing:border-box;position:relative}
button.icard{transition:transform .12s,background .12s}
button.icard:active,button.icard:hover{background:color-mix(in srgb,var(--bc) 10%,transparent)}
.icard.sel{background:color-mix(in srgb,var(--bc) 16%,transparent);border-color:var(--bc);box-shadow:0 0 0 1px var(--bc),0 0 22px color-mix(in srgb,var(--bc) 30%,transparent)}
.icard img{width:58px;height:58px;flex:none}
.icard .it{min-width:0;flex:1}
.icard .ih{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.icard .ih b{font:900 17px/1.2 var(--display);color:var(--bc)}
.icard p{margin:5px 0 0;font-size:12.5px;line-height:1.45}
.icard p.cost{color:#ff8f86}
.icard p.lore{color:var(--mute);font-family:var(--display);font-size:12px}
.icard .gone{position:absolute;right:10px;top:10px;font-size:11px;color:var(--rust);letter-spacing:.1em}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.btn{min-height:46px;padding:0 22px;border-radius:7px;font:900 16px/1 var(--display);letter-spacing:.12em;
  background:linear-gradient(180deg,#d9ab62,#a87838);color:#1c120a;box-shadow:0 4px 0 #6d4b22,0 8px 18px rgba(0,0,0,.45);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #6d4b22}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--bronze-dim);box-shadow:none}
.btn.red{background:linear-gradient(180deg,#e5664a,#a8301f);color:#fff2e6;box-shadow:0 4px 0 #5e1a10,0 8px 18px rgba(0,0,0,.45)}
.btn[disabled]{opacity:.4;pointer-events:none}
.sect{margin-top:16px}
.sect h3{margin:0 0 8px;font:900 13px/1 var(--display);letter-spacing:.3em;color:var(--bronze)}
.reso{display:flex;flex-direction:column;gap:6px}
.rs{font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:5px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.rs b{color:var(--tc,var(--t3));margin-right:6px}
.rs.off{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.stats div{text-align:center;padding:9px 4px;border-radius:6px;background:rgba(255,255,255,.035)}
.stats b{display:block;font:900 20px/1 var(--display);font-variant-numeric:tabular-nums}
.stats small{display:block;margin-top:5px;font-size:10.5px;color:var(--paper-dim);letter-spacing:.1em}
.note{font-size:12px;color:var(--paper-dim);text-align:center;margin-top:10px;line-height:1.5}

/* ---------- Title ---------- */
#title{position:absolute;inset:0;z-index:15;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.tbox{width:min(560px,100%);display:flex;flex-direction:column;gap:18px}
.logo{text-align:center;margin-top:4vh}
.logo h1{margin:0;font:900 clamp(64px,22vw,118px)/1 var(--display);letter-spacing:.12em;padding-left:.12em;color:#f6ead2;
  text-shadow:0 0 30px rgba(255,140,60,.25),0 6px 0 #3a1a12,0 10px 30px rgba(0,0,0,.8)}
.logo .sub{margin-top:12px;font-size:13px;letter-spacing:.5em;padding-left:.5em;color:var(--bronze)}
.logo p{margin:16px auto 0;max-width:30em;font-family:var(--display);font-size:14.5px;line-height:1.8;color:var(--paper-dim);text-wrap:balance}
.stage{background:linear-gradient(180deg,rgba(34,25,35,.9),rgba(20,14,22,.92));border:1px solid var(--bronze-dim);border-radius:10px;padding:16px}
.stage .sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stage .sh b{font:900 20px/1.2 var(--display);letter-spacing:.1em}
.stage .sh span{font-size:12px;color:var(--paper-dim)}
.stage .sd{margin:6px 0 12px;font-size:13px;color:var(--paper-dim);line-height:1.55}
.carry{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.cslot{flex:none;width:60px;text-align:center;font-size:10.5px;color:var(--paper-dim)}
.cslot button{width:56px;height:56px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);display:grid;place-items:center}
.cslot button.sel{border:2px solid var(--bc);box-shadow:0 0 16px color-mix(in srgb,var(--bc) 45%,transparent);background:color-mix(in srgb,var(--bc) 14%,transparent)}
.cslot button img{width:46px;height:46px}
.cslot .none{font:900 20px/1 var(--display);color:var(--mute)}
.cslot div{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.codex{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cx{aspect-ratio:1;max-width:100%;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;position:relative}
.cx img{width:84%;height:84%}
.cx.unk img{filter:brightness(0) opacity(.35)}
.cx em{position:absolute;right:2px;bottom:1px;font:700 10px/1 var(--body);font-style:normal;color:var(--paper-dim)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta .mt{font-size:13px;color:var(--paper-dim);line-height:1.5}
.meta .mt b{color:var(--paper);font-family:var(--display)}
.scrap{font:900 15px/1 var(--display);color:#d8c7a6}
.go{width:100%;min-height:56px;font-size:20px}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%);pointer-events:none;
  font-size:13px;color:var(--paper);background:rgba(10,8,12,.7);padding:8px 14px;border-radius:20px;border:1px solid rgba(193,148,86,.3);white-space:nowrap;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){.bnr,.panel{animation:none}#ultBtn.ready{animation:none}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="htop">
      <div class="vit">
        <div class="lvseal"><b id="lvTxt">一</b><small>重</small></div>
        <div class="bars">
          <div class="hp"><em id="hpLag"></em><i id="hpFill"></i><b id="hpTxt">100 / 100</b></div>
          <div class="xp"><i id="xpFill"></i></div>
        </div>
      </div>
      <div class="clock"><div class="tm" id="timeTxt">00:00</div><div class="ob" id="objTxt">斷戟原</div></div>
      <div class="hright"><div class="kills"><span id="killTxt">0</span><small>斬</small></div><button id="pauseBtn" aria-label="暫停"><span><i></i><i></i></span></button></div>
    </div>
    <div id="bossBar" hidden><div class="bn" id="bossName"></div><div class="bb"><i id="bossFill"></i></div></div>
    <div id="banners"></div>
    <div class="spacer"></div>
    <div class="hbot">
      <div class="pack" id="pack"><div id="tagRow"></div><div id="slots"></div></div>
      <button id="ultBtn" aria-label="劍決"><span class="ring" id="ultRing"></span><span class="ut">劍決</span></button>
    </div>
  </div>
  <div id="hint" class="hint" hidden>按住畫面任意處拖曳移動，出刀自動</div>
  <div id="title" hidden></div>
  <div id="screen" class="screen" hidden></div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,ZOOM=1;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ZOOM=Math.max(.8,Math.min(1.7,Math.min(W,H)/450));}
addEventListener('resize',resize);resize();
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>{const x=ax-bx,y=ay-by;return x*x+y*y};
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return Math.abs(d)};

function placeNear(dist){for(let k=0;k<12;k++){const a=rand(0,TAU),x=G.p.x+Math.cos(a)*dist,y=G.p.y+Math.sin(a)*dist;if(x>120&&x<WORLD-120&&y>120&&y<WORLD-120)return[x,y]}return[clamp(G.p.x+dist,120,WORLD-120),clamp(G.p.y,120,WORLD-120)]}
function spawnEvent(type,o){let x=o.x,y=o.y;if(x==null)[x,y]=placeNear(o.dist||300);x=clamp(x,140,WORLD-140);y=clamp(y,140,WORLD-140);

 if(type==='tomb'){const id=rollItem([0,.5,.5,0]);if(id)spawnLoot(x,y+8,id,{risk:'ambush',silent:1});ev.done=true}

  if(ev.type==='chest'){if(dd<70){ev.prog+=dt/1;if(ev.prog>=1){ev.done=true;sfx('open');burst(ev.x,ev.y,'#e0bb6c',18);const w=ev.tier===1?[0,1,0,0]:(G.t>200&&!G.found.some(id=>IT[id].t>=2)?[0,0,1,0]:[.45,.47,.08,0]);const id=rollItem(w);if(id)spawnLoot(ev.x,ev.y-6,id,{pop:1})}}else ev.prog=Math.max(0,ev.prog-dt)}
  else if(ev.type==='stone'){const R=120;if(dd<R){ev.prog+=dt/6;ev.sp=(ev.sp||0)-dt;if(ev.sp<=0){ev.sp=.55;const[x,y]=edgePos();spawnEnemy(Math.random()<.7?'rust':'crow',x,y)}if(ev.prog>=1){ev.done=true;sfx('drop2');G.shake=8;burst(ev.x,ev.y-30,'#e2e6eb',30);const id=rollItem([0,.5,.5,0]);if(id)spawnLoot(ev.x,ev.y+20,id,{pop:1})}}else ev.prog=Math.max(0,ev.prog-dt/14)}
  else if(ev.type==='altar'){if(dd<70){ev.prog+=dt/1.4;if(ev.prog>=1){ev.done=true;const cost=Math.round(p.maxHp*.3);p.hp=Math.max(1,p.hp-cost);sfx('blood');G.shake=10;G.flash={col:'#c0101e',t:.45,m:.45};burst(ev.x,ev.y-30,'#e0303c',40);num(p.x,p.y-60,'-'+cost,'#ff6a6a',22);const id=rollItem([0,.05,.68,.27]);if(id)spawnLoot(ev.x,ev.y+26,id,{pop:1})}}else ev.prog=Math.max(0,ev.prog-dt)}
 }}

function rollItem(w){let r=Math.random()*w.reduce((a,b)=>a+b,0),t=0;while(t<3&&r>w[t]){r-=w[t];t++}
 const owned=id=>G.own.has(id)||G.loots.some(L=>L.id===id)||id===G.carry;
 for(const dt of[0,1,-1,2,-2,3,-3]){const tt=t+dt;if(tt<0||tt>3)continue;const pool=ITEMS.filter(i=>i.t===tt&&!i.boss&&!owned(i.id));if(pool.length)return pick(pool).id}
 return null}

 sfx('drop'+it.t);if(it.t>=3){G.slow=Math.max(G.slow,.7);G.flash={col:'#ffcf5a',t:.5,m:.35};G.shake=Math.max(G.shake,6)}else if(it.t===2){G.shake=Math.max(G.shake,3)}
 return L}

function updateLoots(dt){const p=G.p;
 for(const L of G.loots){L.t+=dt;if(L.pop<1)L.pop=Math.min(1,L.pop+dt*2.2);

 }
 G.loots=G.loots.filter(L=>!L.taken)}

 else{L.ignore=true;queueModal('swap',L)}}

 if(!G.items.includes(id))G.items.push(id);G.own.add(id);if(id!==G.carry&&!G.found.includes(id))G.found.push(id);

/* ================= COMBAT ================= */
function lowHp(){return G.p.hp<G.p.maxHp*.5}
function dmgMul(){return G.s.dmg*(has('xuehe')&&lowHp()?1.6:1)}
function nearest(x,y,maxR,excl){let best=null,bd=maxR*maxR;for(const e of G.enemies){if(e.dead||(excl&&excl.has(e)))continue;const dd=d2(x,y,e.x,e.y)-e.r*e.r;if(dd<bd){bd=dd;best=e}}return best}
function nearestN(x,y,n,maxR){const arr=[];for(const e of G.enemies){if(e.dead)continue;const dd=d2(x,y,e.x,e.y);if(dd<maxR*maxR)arr.push([dd,e])}arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1])}
function hurt(e,base,o={}){
 if(e.dead||base<=0)return;const p=G.p;let dmg=base;let crit=o.crit||(!o.burn&&!o.noCrit&&Math.random()<G.s.crit);if(crit)dmg*=2;
 if(o.melee&&has('qianjun')&&d2(p.x,p.y,e.x,e.y)<(75+e.r)**2)dmg*=1.3;
 if(e.invuln)return;
 e.hp-=dmg;e.flash=.09;
 if(o.kx!=null){const k=(o.kb||160)*G.s.kb/Math.max(.5,e.d.mass);e.kx+=o.kx*k;e.ky+=o.ky*k}
 if(o.melee&&G.s.life>0){let ls=G.s.life;if(combo('xuehai')&&lowHp())ls*=2;heal(dmg*ls)}
 if(o.burn)num(e.x+rand(-8,8),e.y-e.r-10,Math.round(dmg),'#ffa04a',12);else num(e.x+rand(-6,6),e.y-e.r-12,Math.round(dmg),crit?'#ffd25a':'#fff',crit?24:15,crit);
 if(!o.burn){if(crit)sfx('crit');else sfx('hit');if(o.melee&&G.hsCD<=0){G.hs=crit?.06:.035;G.hsCD=.11}}
 if(o.ignite)ignite(e,o.ignite,2.2);
 if(e.hp<=0){e.dead=true;onKill(e)}
}
function ignite(e,dps,dur){if(e.dead)return;e.burn=Math.max(e.burn,dur);e.bdps=Math.max(e.bdps,dps*G.s.burn)}
function heal(n){const p=G.p;if(n<=0)return;p.hp=Math.min(p.maxHp,p.hp+n*G.s.heal)}
function hurtPlayer(d,src){const p=G.p;if(p.inv>0||G.over)return;
 let m=G.s.taken;if(has('jifeng')&&!p.moving)m*=1.25;const dmg=d*m;p.hp-=dmg;p.inv=.5;G.shake=Math.max(G.shake,6);G.hurtT=.35;sfx('hurt');num(p.x,p.y-56,'-'+Math.round(dmg),'#ff5a5a',18);
 if(G.tc.鐵>=3&&(G.cd.iron||0)<=0){G.cd.iron=3;shock(p.x,p.y,140,18*dmgMul(),'#d9c497')}
 if(p.hp<=0){p.hp=0;endRun('dead')}}
function onKill(e){
 const d=e.d;G.kills++;
 G.p.ult=Math.min(G.s.ultNeed,G.p.ult+(d.boss?30:d.elite?12:1.15)*G.s.ultGain);
 const sl=G.skills.shixue||0;if(sl)heal(.3+.2*sl);if(G.tc.血>=2)heal(.5);
 dropXP(e.x,e.y,d.xp);
 if(has('yinhun')&&Math.random()<(combo('baigui')?.5:.25)&&!d.boss)ghostFire(e.x,e.y);
 if(G.tc.火>=3&&e.burn>0)explode(e.x,e.y,70,20*dmgMul(),false);
 ash(e);sfx('kill');
 if(d.elite){const id=rollItem([.15,.55,.3,0]);if(id)spawnLoot(e.x,e.y,id,{pop:1});G.shake=8}
 if(e.type==='crowking'){G.bossKilled.crowking=1;G.boss=null;G.slow=.9;G.shake=14;const id=rollItem([0,0,1,0]);if(id)spawnLoot(e.x,e.y,id,{pop:1});for(let i=0;i<6;i++)dropXP(e.x+rand(-60,60),e.y+rand(-60,60),10);G.ann={t:2,title:'千羽 伏誅',sub:''};}
 if(e.type==='general'){G.boss=null;victory(e)}
}
function dropXP(x,y,v){while(v>0){const val=v>=10?10:v>=3?3:1;v-=val;G.orbs.push({x:x+rand(-12,12),y:y+rand(-12,12),v:val,mag:false,t:0})}if(G.orbs.length>420){const o=G.orbs.shift();G.orbs[0].v+=o.v}}
function addXP(v){const p=G.p;p.xp+=v;while(p.xp>=xpNeed(p.lvl)){p.xp-=xpNeed(p.lvl);p.lvl++;G.levelQ=(G.levelQ||0)+1;sfx('lvl');burst(p.x,p.y-30,'#7fe3c4',26);queueModal('level')}}
function xpNeed(l){return Math.floor(6+(l-1)*5+(l-1)*(l-1)*.55)}

/* ---- attacks ---- */
function swing(){
 const p=G.p,tgt=nearest(p.x,p.y,360);if(!tgt)return false;
 const ang=Math.atan2(tgt.y-p.y,tgt.x-p.x);p.face=Math.cos(ang)>=0?1:-1;p.aim=ang;p.swingT=.2;G.swings++;
 let crit=false;const jf=has('jifeng')&&p.moveT>=(combo('zhuifeng')?1:2);if(jf){crit=true;p.moveT=0}
 if(has('tiangang')){swordVolley(ang,crit)}
 else{slashArc(p.x,p.y,ang,1,crit,true);if(has('shuanggu'))slashArc(p.x,p.y,ang+Math.PI,1,crit,true);sfx('slash')}
 if(G.tc.風>=3)fireWave(p.x,p.y,ang,14*dmgMul(),{speed:900,life:.5,pierce:5,w:14,col:'#8fe8c2'});
 if(jf){shock(p.x,p.y,160,30*dmgMul(),'#8fe8c2');sfx('crit')}
 if(has('jingzhe')&&G.swings%(combo('tianlei')?2:4)===0)strike(tgt,28);
 if(has('leiji')&&Math.random()<.12)strike(tgt,20);
 if(has('suixing')&&G.swings%(combo('shanbeng')?2:3)===0)groundSlam(p.x,p.y,combo('shanbeng')?1.4:1);
 for(const c of G.clones){const t2=nearest(c.x,c.y,360);if(t2){const a2=Math.atan2(t2.y-c.y,t2.x-c.x);c.face=Math.cos(a2)>=0?1:-1;c.swingT=.2;slashArc(c.x,c.y,a2,.7,false,false)}}
 return true}
function slashArc(x,y,ang,mul,crit,main){
 const big=has('xuehe')&&lowHp();const R=105*G.s.range*(big?1.3:1),arc=2.4;const base=13*mul*dmgMul();
 inRadius(x,y,R,e=>{const a=Math.atan2(e.y-y,e.x-x);const dd=Math.sqrt(d2(x,y,e.x,e.y));if(angDiff(a,ang)<arc/2+Math.atan2(e.r,Math.max(1,dd)))hurt(e,base,{crit,melee:main,kx:Math.cos(a),ky:Math.sin(a),kb:170})});
 G.fx.push({k:'slash',x,y,a:ang,R,t:0,life:.16,col:main?'#ffffff':'#a48cff',big});
 fireWave(x+Math.cos(ang)*30,y+Math.sin(ang)*30,ang,10*mul*dmgMul(),{speed:640,life:.55,pierce:2,w:30,col:main?'#e9f6ff':'#a48cff',crit,melee:main});
 if(main&&has('chixiao')){for(const o of[-.55,0,.55]){addZone('fire',x+Math.cos(ang+o)*R*.72,y+Math.sin(ang+o)*R*.72,36,2.2,10)}}
}
function fireWave(x,y,ang,dmg,o){G.shots.push({k:'wave',x,y,vx:Math.cos(ang)*o.speed,vy:Math.sin(ang)*o.speed,a:ang,life:o.life,max:o.life,dmg,pierce:o.pierce,w:o.w,col:o.col,hit:new Set(),crit:o.crit,melee:o.melee})}
function swordVolley(ang,crit){const p=G.p;const n=combo('jianzhen')?8:5;const tg=nearestN(p.x,p.y,n,460);if(!tg.length)return;sfx('swords');
 for(let i=0;i<n;i++){const back=(combo('jianzhen')||has('shuanggu'))&&i%2===1;const a0=(back?ang+Math.PI:ang)+(i-(n-1)/2)*.28;const t=tg[i%tg.length];
  G.shots.push({k:'sword',x:p.x+Math.cos(a0+Math.PI)*16,y:p.y-26+Math.sin(a0+Math.PI)*10,vx:Math.cos(a0)*420,vy:Math.sin(a0)*420,a:a0,life:1.1,max:1.1,dmg:22*dmgMul(),pierce:3,w:16,tg:t,home:9,spd:820,hit:new Set(),crit,melee:true,col:'#e9f6ff'})}}
function strike(tgt,base){if(!tgt||tgt.dead)return;const list=[tgt];let chain=(has('leiji')?3:0)+(G.tc.雷>=2?1:0);let last=tgt;const ex=new Set([tgt]);
 while(chain-->0){const n=nearest(last.x,last.y,240,ex);if(!n)break;list.push(n);ex.add(n);last=n}
 const dmg=base*dmgMul();G.bolts.push({pts:bolt(list[0].x,list[0].y-380,list[0].x,list[0].y-10),t:0,life:.22,w:3.2});
 for(let i=1;i<list.length;i++)G.bolts.push({pts:bolt(list[i-1].x,list[i-1].y-14,list[i].x,list[i].y-14),t:0,life:.22,w:2.2});
 list.forEach(e=>{hurt(e,dmg,{kx:0,ky:0,kb:0});G.fx.push({k:'ring',x:e.x,y:e.y,r0:6,r1:40,t:0,life:.25,col:'#bcd6ff'})});sfx('thunder')}

  else if(z.k==='slow'){ctx.strokeStyle=`rgba(194,172,255,${.6*k})`;ctx.lineWidth=2;ctx.setLineDash([10,8]);ctx.beginPath();ctx.ellipse(z.x,z.y,z.r,z.r*.6,0,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=`rgba(120,90,220,${.12*k})`;ctx.fill();for(let i=0;i<7;i++){const a=i/7*TAU;ctx.fillStyle=`rgba(200,190,220,${k})`;ctx.fillRect(z.x+Math.cos(a)*z.r*.92-2,z.y+Math.sin(a)*z.r*.55-14,4,14)}}}

 const n=40;for(let i=0;i<n;i++){const ang=i/n*TAU,px=a.x+Math.cos(ang)*(a.r+10),py=a.y+Math.sin(ang)*(a.r+10);const rise=Math.min(1,Math.max(0,(a.t-i*.02)*3));if(rise<=0)continue;ctx.save();ctx.translate(px,py);ctx.strokeStyle='#3d2e24';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-70*rise);ctx.stroke();ctx.fillStyle='#8a8e94';ctx.beginPath();ctx.moveTo(0,-70*rise);ctx.quadraticCurveTo(16,-70*rise,13,-52*rise);ctx.lineTo(2,-58*rise);ctx.closePath();ctx.fill();ctx.restore()}ctx.restore()}

function queueModal(kind,data){G.mq.push({kind,data});if(!G.modal)nextModal()}
function nextModal(){const m=G.mq.shift();if(!m){G.modal=null;screen.hidden=true;screen.innerHTML='';return}G.modal=m;input.joy=null;
 if(m.kind==='level')showLevel();else if(m.kind==='swap')showSwap(m.data);else if(m.kind==='pause')showPause()}
function closeModal(){G.modal=null;nextModal()}
function levelOptions(){const avail=SKILLS.filter(s=>(G.skills[s.id]||0)<5);const actives=avail.filter(s=>['feijian','gangqi','leifa','fenxiang','juhun','shixue'].includes(s.id));const out=[];const owned=avail.filter(s=>G.skills[s.id]);
 const pool=[...avail];if(G.p.lvl<=3){const a=actives.filter(s=>!G.skills[s.id]);if(a.length)out.push(a.splice(Math.floor(Math.random()*a.length),1)[0])}
 if(owned.length&&Math.random()<.65){const o=pick(owned);if(!out.includes(o))out.push(o)}
 while(out.length<3&&out.length<pool.length){const s=pick(pool);if(!out.includes(s))out.push(s)}
 if(!out.length)return[{id:'_heal',n:'回氣',ch:'氣',c:'#7fe3c4',d:()=>'恢復四成生命'},{id:'_ult',n:'凝勢',ch:'勢',c:'#ffcf5a',d:()=>'劍決立即蓄滿'}];return out}
function showLevel(){const opts=levelOptions();G.lvOpts=opts;screen.hidden=false;
 screen.innerHTML=`<div class="panel"><div class="ph"><div class="eb">境界突破</div><h2>第${cn(G.p.lvl)}重 · 擇一功法</h2></div><div class="choices">${opts.map((s,i)=>{const cur=G.skills[s.id]||0;return`<button class="sk" data-i="${i}"><span class="seal" style="--sc:${s.c}">${s.ch}</span><span class="st"><span class="sn"><b>${s.n}</b>${s.id[0]==='_'?'':`<span class="lvd ${cur?'':'new'}">${cur?`第 ${cur} → ${cur+1} 層`:'新功法'}</span><span class="dots">${[1,2,3,4,5].map(n=>`<i class="${n<=cur?'on':''}"></i>`).join('')}</span>`}</span><span class="sd" style="display:block">${s.d(cur+1)}</span></span></button>`}).join('')}</div></div>`;
 screen.querySelectorAll('.sk').forEach(b=>b.onclick=()=>pickLevel(+b.dataset.i))}
function pickLevel(i){const s=G.lvOpts[i];if(!s)return;if(s.id==='_heal')heal(G.p.maxHp*.4);else if(s.id==='_ult')G.p.ult=G.s.ultNeed;else{G.skills[s.id]=(G.skills[s.id]||0)+1;recalc()}G.levelQ--;sfx('pick');closeModal()}
function itemCard(id,o={}){const it=IT[id],c=TIERS[it.t].c;const tag=o.btn?'button':'div';return`<${tag} class="icard ${o.sel?'sel':''}" style="--bc:${c}" ${o.attr||''}><img src="${iconURL(id)}" alt=""><div class="it"><div class="ih"><b>${it.n}</b><span class="tierlab" style="--bc:${c}">${TIERS[it.t].n}</span>${tagsHTML(it.tags)}</div><p>${it.rw}</p>${it.cost?`<p class="cost">代價：${it.cost}</p>`:''}${o.lore?`<p class="lore">${it.lore}</p>`:''}</div>${o.mark?`<span class="gone">${o.mark}</span>`:''}</${tag}>`}
function showSwap(L){screen.hidden=false;const cc=completesCombo(L.id);
 screen.innerHTML=`<div class="panel"><div class="ph"><div class="eb">行囊已滿</div><h2>換下一件，或放著不拿</h2>${L.risk==='ambush'?'<p style="color:#ff8a70">拾起它會驚動伏兵</p>':''}</div>${itemCard(L.id,{lore:1})}${cc.length?`<p class="note" style="color:#ffcf5a">◆ 可成器鳴「${cc[0].n}」：${cc[0].d}</p>`:''}<div class="sect"><h3>點一件換下（會留在地上）</h3><div class="stack">${G.items.map(id=>itemCard(id,{btn:1,attr:`data-id="${id}"`})).join('')}</div></div><div class="row"><button class="btn ghost" id="swNo">放著不拿</button></div></div>`;
 screen.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const old=b.dataset.id;removeItem(old,true);L.taken=true;G.loots=G.loots.filter(x=>x!==L);applyRisk(L);addItem(L.id);closeModal()});
 $('#swNo').onclick=()=>{L.ignore=true;closeModal()}}
function showPause(){screen.hidden=false;const p=G.p;
 const tags=TAG_ORDER.map(k=>{const n=G.tc[k]||0;return`<div class="rs ${n>=2?'':'off'}" style="--tc:${TAGC[k]}"><b>${k} ${n}</b>二件：${TAG_BONUS[k][0]}　三件：${TAG_BONUS[k][1]}</div>`}).join('');
 const cmb=COMBOS.filter(c=>has(c.a)||has(c.b)).map(c=>`<div class="rs ${G.combos.has(c.id)?'':'off'}"><b>◆ ${c.n}</b>【${IT[c.a].n}】＋【${IT[c.b].n}】：${c.d}</div>`).join('');
 const sk=Object.keys(G.skills).map(id=>{const s=SK[id],l=G.skills[id];return`<div class="rs"><b style="color:${s.c}">${s.n} ${l} 層</b>${s.d(l)}</div>`}).join('');
 screen.innerHTML=`<div class="panel"><div class="ph"><div class="eb">暫歇</div><h2>魏子葳 · 第${cn(p.lvl)}重</h2><p>${fmt(G.t)} · 斬 ${G.kills} · 生命 ${Math.ceil(p.hp)}/${p.maxHp}</p></div>
 <div class="sect"><h3>行囊</h3><div class="stack">${G.items.length?G.items.map(id=>itemCard(id,{lore:1})).join(''):'<p class="note">尚未拾得器物。打倒掌旗官、開遺匣、拔試劍石都能得手。</p>'}</div></div>
 ${cmb?`<div class="sect"><h3>器鳴</h3><div class="reso">${cmb}</div></div>`:''}
 <div class="sect"><h3>屬性共鳴</h3><div class="reso">${tags}</div></div>
 ${sk?`<div class="sect"><h3>功法</h3><div class="reso">${sk}</div></div>`:''}
 <div class="row"><button class="btn" id="psGo">繼續</button><button class="btn ghost" id="psSnd">${AU.on?'音效：開':'音效：關'}</button><button class="btn ghost" id="psQuit">撤離</button></div></div>`;
 $('#psGo').onclick=()=>closeModal();$('#psSnd').onclick=()=>{setMute(!AU.on);$('#psSnd').textContent=AU.on?'音效：開':'音效：關'};
 $('#psQuit').onclick=()=>{const b=$('#psQuit');if(b.dataset.c){G.modal=null;G.mq=[];endRun('retreat')}else{b.dataset.c=1;b.textContent='再點一次撤離';b.classList.add('red')}}}
function showResults(kind){if(!G||G.ended)return;G.ended=true;G.modal={kind:'results'};hud.hidden=true;screen.hidden=false;
 save.runs++;if(kind==='win')save.wins++;
 const found=G.found.filter(id=>id!==G.carry);G.pickRes=null;
 const head=kind==='win'?['凱旋','斷戟原 · 平定','將軍的斷戟落在你腳邊。']:kind==='dead'?['身隕','魏子葳 倒在斷戟原','魂歸之前，還來得及攥住一件器物。']:['撤離','魏子葳 退出斷戟原','能帶走的，只有一件。'];
 const scrapAll=found.reduce((a,id)=>a+TIERS[IT[id].t].scrap,0);
 screen.innerHTML=`<div class="panel"><div class="ph"><div class="eb">${head[0]}</div><h2>${head[1]}</h2><p>${head[2]}</p></div>
 <div class="stats"><div><b>${fmt(G.t)}</b><small>歷時</small></div><div><b>${G.kills}</b><small>斬敵</small></div><div><b>${cn(G.p.lvl)}</b><small>境界</small></div><div><b>${found.length}</b><small>得器</small></div></div>
 ${found.length?`<div class="sect"><h3>擇一件帶出斷戟原</h3><div class="stack" id="resList">${found.map(id=>itemCard(id,{btn:1,lore:1,attr:`data-id="${id}"`,mark:(G.bossDrops||[]).includes(id)?'將軍遺物':''})).join('')}</div><p class="note">未選的器物熔為鐵屑。帶出的器物收進拾鋒錄，下次出征可隨身攜帶。</p></div>`:`<p class="note">此行未得器物。</p>`}
 <div class="row"><button class="btn" id="rsOk" ${found.length?'disabled':''}>${found.length?'選一件帶走':'回營'}</button></div></div>`;
 screen.querySelectorAll('#resList [data-id]').forEach(b=>b.onclick=()=>{G.pickRes=b.dataset.id;screen.querySelectorAll('#resList .icard').forEach(x=>x.classList.toggle('sel',x===b));const ok=$('#rsOk');ok.disabled=false;ok.textContent='帶走【'+IT[b.dataset.id].n+'】'});
 $('#rsOk').onclick=()=>{let scrap=scrapAll;if(G.pickRes){save.col[G.pickRes]=(save.col[G.pickRes]||0)+1;scrap-=TIERS[IT[G.pickRes].t].scrap}save.scrap+=scrap;persist();
  const got=G.pickRes;screen.innerHTML=`<div class="panel"><div class="ph"><div class="eb">收錄</div><h2>${got?'【'+IT[got].n+'】收進拾鋒錄':'空手而回'}</h2><p>熔得鐵屑 ${scrap}</p></div>${got?itemCard(got,{lore:1}):''}<div class="row"><button class="btn" id="again">再入斷戟原</button><button class="btn ghost" id="home">回營</button></div></div>`;
  if(got)save.carry=got,persist();
  $('#again').onclick=()=>{screen.hidden=true;startRun(save.carry)};$('#home').onclick=()=>{screen.hidden=true;G=null;showTitle()}}}

/* ===== title ===== */
function showTitle(){hud.hidden=true;titleEl.hidden=false;screen.hidden=true;
 const col=Object.keys(save.col).filter(id=>IT[id]);if(save.carry&&!save.col[save.carry])save.carry=null;
 const tCost=20+save.temper*15;
 titleEl.innerHTML=`<div class="tbox"><div class="logo"><h1>拾鋒</h1><div class="sub">SHIFENG</div><p>天爐崩裂那夜，萬器如雨墜入人間。器有魂，也有債。拾鋒人魏子葳，走進斷戟原。</p></div>
 <div class="stage"><div class="sh"><b>第一關 · 斷戟原</b><span>約八分鐘 · 兩名首領</span></div><div class="sd">鏽兵、屍鴉與燐火罐盤踞的古戰場。千羽盤旋其上，無首的將軍守在最深處。</div>
 <div class="sect" style="margin-top:4px"><h3>攜器出征</h3><div class="carry">${`<div class="cslot"><button data-c="" class="${!save.carry?'sel':''}" style="--bc:#c19456"><span class="none">空</span></button><div>不攜帶</div></div>`+col.map(id=>`<div class="cslot"><button data-c="${id}" class="${save.carry===id?'sel':''}" style="--bc:${TIERS[IT[id].t].c}"><img src="${iconURL(id)}" alt=""></button><div>${IT[id].n}</div></div>`).join('')}</div>${!col.length?'<p class="note" style="text-align:left;margin-top:0">每關結束可帶走一件器物，收進拾鋒錄後就能在此選擇隨身攜帶。</p>':''}</div>
 <button class="btn go" id="goBtn">出征</button></div>
 <div class="stage"><div class="meta"><div class="mt">淬體 <b>${save.temper}</b> / 10　生命上限 +${save.temper*6}</div><div style="display:flex;gap:10px;align-items:center"><span class="scrap">鐵屑 ${save.scrap}</span><button class="btn ghost" id="tmpBtn" ${save.scrap<tCost||save.temper>=10?'disabled':''} style="min-height:38px;font-size:14px;padding:0 14px">${save.temper>=10?'已圓滿':'淬體 · '+tCost}</button></div></div></div>
 <div class="stage"><div class="sh"><b>拾鋒錄</b><span>${col.length} / ${ITEMS.length}</span></div><div class="codex" style="margin-top:10px">${ITEMS.map(it=>{const n=save.col[it.id]||0;return`<div class="cx ${n?'':'unk'}" title="${n?it.n:'未得'}" ${n?`style="border-color:${TIERS[it.t].c}55"`:''}><img src="${iconURL(it.id)}" alt="">${n>1?`<em>×${n}</em>`:''}</div>`}).join('')}</div></div>
 </div>`;
 titleEl.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{save.carry=b.dataset.c||null;persist();titleEl.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('sel',x===b))});
 $('#goBtn').onclick=()=>{auInit();if(AU.c&&AU.c.state==='suspended')AU.c.resume();droneStart();titleEl.hidden=true;startRun(save.carry)};
 const tb=$('#tmpBtn');if(tb)tb.onclick=()=>{if(save.scrap>=tCost&&save.temper<10){save.scrap-=tCost;save.temper++;persist();auInit();sfx('slam');showTitle()}}}
function startRun(carry){auInit();if(AU.c&&AU.c.state==='suspended')AU.c.resume();droneStart();newRun(carry);for(const k in hc)delete hc[k];hud.hidden=false;screen.hidden=true;titleEl.hidden=true;bannersEl.innerHTML='';BQ=[];bShow=null;bGen++;renderSlots();
 hintEl.hidden=false;hintEl.style.opacity=1;
 if(carry&&IT[carry])setTimeout(()=>{if(G&&!G.over)pickupBanner(carry,[...G.combos].map(id=>COMBOS.find(c=>c.id===id)))},400)}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown',e=>{if(!G||G.modal||G.over)return;auInit();if(AU.c&&AU.c.state==='suspended')AU.c.resume();if(input.joy)return;input.joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{const j=input.joy;if(!j||j.id!==e.pointerId)return;j.x=e.clientX;j.y=e.clientY;const dx=j.x-j.ox,dy=j.y-j.oy,l=Math.hypot(dx,dy);if(l>80){j.ox=j.x-dx/l*80;j.oy=j.y-dy/l*80}});
const endJoy=e=>{if(input.joy&&input.joy.id===e.pointerId)input.joy=null};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
addEventListener('keydown',e=>{input.keys[e.code]=true;if(e.code==='Space'&&G){ult();e.preventDefault()}if(e.code==='Escape'&&G&&!G.over){if(G.modal&&G.modal.kind==='pause')closeModal();else if(!G.modal)queueModal('pause')}});
addEventListener('keyup',e=>{input.keys[e.code]=false});
ultBtn.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();ult()});
$('#pauseBtn').addEventListener('click',()=>{if(G&&!G.modal&&!G.over)queueModal('pause')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.modal&&!G.over)queueModal('pause')});

/* ================= BOT (testing only) ================= */
function botMove(){const p=G.p;let fx=0,fy=0;
 for(const e of G.enemies){if(e.dead)continue;const dx=p.x-e.x,dy=p.y-e.y,dd=dx*dx+dy*dy;if(dd<260*260){const l=Math.sqrt(dd)||1,w=(e.d.boss?3:1)*(260-l)/260;fx+=dx/l*w;fy+=dy/l*w}}
 for(const o of G.tele){if(teleHit(o)){const dx=p.x-o.x,dy=p.y-o.y,l=Math.hypot(dx,dy)||1;if(o.k==='line'){fx+=-Math.sin(o.a)*4;fy+=Math.cos(o.a)*4}else{fx+=dx/l*5;fy+=dy/l*5}}}
 let goal=null,gd=1e12;for(const L of G.loots){if(L.ignore)continue;const dd=d2(p.x,p.y,L.x,L.y);if(dd<gd){gd=dd;goal=L}}for(const ev of G.events){if(ev.done)continue;const dd=d2(p.x,p.y,ev.x,ev.y);if(dd<gd){gd=dd;goal=ev}}
 if(goal){const dx=goal.x-p.x,dy=goal.y-p.y,l=Math.hypot(dx,dy)||1;if(l>30){fx+=dx/l*1.6;fy+=dy/l*1.6}}
 const c=G.arena||{x:WORLD/2,y:WORLD/2};const dx=c.x-p.x,dy=c.y-p.y,l=Math.hypot(dx,dy)||1;if(l>(G.arena?300:900)){fx+=dx/l*1.2;fy+=dy/l*1.2}
 const L=Math.hypot(fx,fy);if(L<.05){const a=G.t*.7;return[Math.cos(a),Math.sin(a)]}return[fx/L,fy/L]}
function botModal(){const m=G.modal;if(!m)return;if(m.kind==='level')pickLevel(0);else if(m.kind==='swap'){const L=m.data;const worst=G.items.slice().sort((a,b)=>IT[a].t-IT[b].t)[0];if(IT[L.id].t>=IT[worst].t){removeItem(worst,true);L.taken=true;G.loots=G.loots.filter(x=>x!==L);applyRisk(L);addItem(L.id);closeModal()}else{L.ignore=true;closeModal()}}else if(m.kind==='pause')closeModal()}
window.__SF={modal:k=>queueModal(k),results:k=>showResults(k),start:c=>{startRun(c)},G:()=>G,step:(n,dt=1/60)=>{for(let i=0;i<n;i++){if(!G||G.ended)return;if(G.modal){botModal();continue}if(G.p.ult>=G.s.ultNeed)ult();update(dt)}},save:()=>save};

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){let rdt=Math.min(.05,(now-last)/1000);last=now;
 if(G&&!G.modal&&!G.ended){if(G.hs>0){G.hs-=rdt}else{let ts=1;if(G.slow>0){G.slow-=rdt;ts=.3}update(rdt*ts)}updHud()}
 render(now);requestAnimationFrame(frame)}
function boot(){buildSprites();for(const k in DECK){const[w,h,ay]=DECK[k];const c=mk(w,h,dDecor,k);c.ay=ay;DEC[k]=c}for(const k in EVK){const[w,h,ay]=EVK[k];const c=mk(w,h,dEvent,k);c.ay=ay;EVS[k]=c}buildGround();showTitle();requestAnimationFrame(frame)}
const fontsReady=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load(`900 20px 'Noto Serif TC'`,'拾鋒斷戟'),document.fonts.load(`700 12px 'Noto Sans TC'`,'代價')]),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.then(boot,boot);
})();
</script>

</body></html>
