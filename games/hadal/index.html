<style>
/* Layout: one-screen instrument — battle viewport above, brass crate grid below; DOM panels float over the viewport. */
:root {
  --abyss: #03101a;
  --deep: #071b29;
  --glass: rgba(5, 20, 30, 0.88);

  --ink: #d9e8ef;
  --mute: #8aa3b1;
  --line: rgba(140, 190, 210, 0.18);
  --brass: #c9933f;
  --brass-hi: #ffd28a;
  --brass-dk: #5d3e16;
  --bio: #59f3e2;
  --lure: #ff5fd2;

  --o2: #7ff0b0;

  --f-stencil: "Big Shoulders Stencil Display", "Big Shoulders Display", Impact, sans-serif;

  color-scheme: dark;
}
html, body { height: 100%; }
html { overflow: hidden; }
body {

  overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#game { position: fixed; inset: 0; display: block; touch-action: none; }
#insetProbe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--bio); outline-offset: 2px; }

/* ---------- buttons ---------- */
.btn {
  appearance: none; border: 1px solid rgba(255, 210, 138, 0.35); background: rgba(255, 255, 255, 0.04);
  color: var(--ink); border-radius: 12px; padding: 11px 18px; font-weight: 700; font-size: 15px; letter-spacing: 0.04em;
  cursor: pointer; touch-action: manipulation; transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
}
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: linear-gradient(180deg, #e6b468 0%, #b17a2c 55%, #7a5016 100%); color: #1d1205; border-color: #2a1a08;
  box-shadow: inset 0 1px 0 rgba(255, 240, 200, 0.6), 0 6px 18px rgba(0, 0, 0, 0.35);
}
.btn.primary.danger { background: linear-gradient(180deg, #ff8a8a, #c73345 60%, #7a1a26); color: #fff3f3; }
.btn.ghost { background: rgba(10, 28, 38, 0.6); border-color: var(--line); }
.btn.ghost.danger { color: #ffb1b9; border-color: rgba(255, 77, 94, 0.35); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn.big { min-height: 58px; font-size: 18px; flex-direction: column; gap: 2px; }
.btn .bsub { font-size: 12px; font-weight: 500; opacity: 0.75; letter-spacing: 0; }
.btn .price { margin-left: 6px; font-family: var(--f-num); font-weight: 900; color: var(--brass-hi); }

/* ---------- panel over the battle viewport ---------- */
.panel {
  position: fixed; z-index: 5; overflow-y: auto; overflow-x: hidden;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(3, 14, 22, 0.55), rgba(3, 14, 22, 0.88) 30%, rgba(3, 14, 22, 0.94));
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);

  touch-action: pan-y; animation: panelIn 0.28s ease-out both;

.panel > * { max-width: 640px; width: 100%; margin-inline: auto; box-sizing: border-box; }
.runhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rh-l { display: flex; flex-direction: column; }
.eyebrow { font-family: var(--f-stencil); font-weight: 800; letter-spacing: 0.14em; font-size: 12px; color: var(--bio); text-transform: uppercase; }
.depth { font-family: var(--f-mono); font-size: 20px; color: var(--ink); }

/* routes */
.routes { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.routes.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.routes.n1 { grid-template-columns: minmax(0, 1fr); }
.route {

  background: linear-gradient(180deg, color-mix(in srgb, var(--nc) 14%, rgba(6, 22, 32, 0.9)), rgba(6, 18, 26, 0.95));
  padding: 12px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0;
  transition: transform 0.1s ease, box-shadow 0.2s; color: var(--ink);
}
.route:active { transform: scale(0.97); }

.ricon { width: 46px; height: 46px; color: var(--nc); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--nc) 60%, transparent)); }

.cico { width: 64px; height: 64px; object-fit: contain; }

/* mod badge */
.modbadge { width: 52px; height: 52px; display: grid; place-items: center; flex: none;
  clip-path: polygon(25% 4%, 75% 4%, 98% 50%, 75% 96%, 25% 96%, 2% 50%); background: var(--mbg, #2a4655); }

.modbadge.r1 { --mbg: linear-gradient(160deg, #cfe6ef, #6c8fa0); }

/* shop */
.shoptop { display: flex; align-items: baseline; justify-content: space-between; }
.wallet { font-family: var(--f-num); font-weight: 900; font-size: 24px; color: #ffe3b0; display: flex; align-items: center; gap: 6px; }
.scrapico { width: 14px; height: 11px; background: var(--brass-hi); border-radius: 2px; transform: rotate(16deg); box-shadow: inset 0 -3px 0 #7a5220; }
.shopgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.sitem { appearance: none; border: 1px solid var(--line); border-radius: 12px; background: rgba(8, 26, 36, 0.92); padding: 8px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; color: var(--ink); }

.sold { opacity: 0.35; pointer-events: none; }
.price { font-family: var(--f-num); font-weight: 900; color: var(--brass-hi); font-size: 15px; }
.shopmods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.smod { appearance: none; border: 1px solid var(--line); border-radius: 12px; background: rgba(8, 26, 36, 0.92); padding: 10px; cursor: pointer; display: grid; grid-template-columns: 44px 1fr auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-align: left; color: var(--ink); min-width: 0; }
.smod .modbadge { width: 42px; height: 42px; grid-row: span 2; }
.smod .modbadge span { font-size: 18px; }
.smn { font-weight: 900; font-size: 14px; }
.smd { font-size: 11.5px; color: #b9cbd4; line-height: 1.45; grid-column: 2; }
.smod .price { grid-row: 1 / span 2; grid-column: 3; }
.services { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btn.svc { min-height: 44px; padding: 8px 6px; font-size: 13px; flex-wrap: wrap; }

/* events */
.evtext { font-family: var(--f-serif); font-size: 17px; line-height: 1.85; color: #e6eef2; }
.evtext p { margin: 0 0 4px; }
.evchoices { display: flex; flex-direction: column; gap: 8px; }
.evc { appearance: none; text-align: left; border: 1px solid rgba(255, 210, 138, 0.3); border-radius: 12px; padding: 12px 14px; background: rgba(10, 30, 40, 0.9); cursor: pointer; display: flex; flex-direction: column; gap: 3px; color: var(--ink); }
.evc:active { transform: scale(0.98); }

.evd { font-size: 12.5px; color: var(--mute); }

/* full screens */
.screen {
  position: fixed; inset: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; box-sizing: border-box;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 14px; touch-action: pan-y;
}
.screen > * { max-width: 680px; width: 100%; box-sizing: border-box; }
.screen.title { justify-content: center; background: radial-gradient(ellipse at 50% 120%, rgba(89, 243, 226, 0.08), transparent 60%); }
.titlewrap { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: panelIn 0.8s ease-out both; }
.tstencil { font-family: var(--f-stencil); font-weight: 800; letter-spacing: 0.22em; font-size: 12px; color: rgba(255, 210, 138, 0.75); }
.tmain { margin: 4px 0 0; font-family: var(--f-serif); font-weight: 900; font-size: clamp(76px, 22vw, 150px); line-height: 1; letter-spacing: 0.12em;
  background: linear-gradient(180deg, #fff6e0 0%, #ffd28a 38%, #b17a2c 70%, #5d3e16 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 30px rgba(255, 180, 80, 0.25)); padding-left: 0.12em; }
.ten { font-family: var(--f-stencil); font-weight: 800; font-size: clamp(22px, 6vw, 34px); letter-spacing: 0.6em; color: var(--bio); padding-left: 0.6em; text-shadow: 0 0 18px rgba(89, 243, 226, 0.5); }
.ttag { color: #b9ccd6; font-size: 15px; margin: 6px 0 14px; line-height: 1.7; text-wrap: balance; }

.trow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.screen.lines { justify-content: center; background: rgba(1, 6, 10, 0.94); cursor: pointer; }

.ln { margin: 0; font-family: var(--f-serif); font-size: 19px; line-height: 1.8; color: #dbe8ee; animation: lnIn 0.4s ease-out both; text-wrap: pretty; }
@keyframes lnIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ln.sys { font-family: var(--f-mono); font-size: 13px; color: var(--bio); letter-spacing: 0.04em; }

.gap { height: 12px; }

@keyframes blink { 50% { opacity: 0.3; } }
.btn.skip { position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; }
.screen.endcard { justify-content: center; background: #010407; text-align: center; }
.endno { font-family: var(--f-stencil); letter-spacing: 0.3em; color: var(--mute); font-size: 14px; }
.endname { font-family: var(--f-serif); font-weight: 900; font-size: clamp(64px, 18vw, 120px); letter-spacing: 0.2em; color: #f4efe0; padding-left: 0.2em; text-shadow: 0 0 40px rgba(255, 240, 200, 0.25); animation: panelIn 1.6s ease-out both; }

.screen.results { background: rgba(2, 8, 13, 0.96); }
.reshead { text-align: center; display: flex; flex-direction: column; gap: 4px; margin-top: 6vh; }

.resgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rg { background: rgba(10, 30, 40, 0.8); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.rg span { font-size: 11px; color: var(--mute); letter-spacing: 0.08em; }

.restop, .resunl { display: flex; flex-direction: column; gap: 6px; }

.screen.kits, .screen.settingsS, .screen.codex { background: rgba(2, 10, 16, 0.96); }

.kit { appearance: none; border: 1px solid var(--line); border-radius: 14px; background: rgba(10, 30, 40, 0.85); padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: left; color: var(--ink); min-width: 0; }

.mrow { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 8px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }

.srow { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; cursor: pointer; }

/* =========================================================
   ART — helpers, glow sprites, particles, backgrounds, hero
   ========================================================= */
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.01, r), 0, TAU); }
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function lg(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function rg(c, x, y, r0, r1, stops, fx, fy) { const g = c.createRadialGradient(fx ?? x, fy ?? y, r0, x, y, Math.max(r0 + 0.01, r1)); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function line(c, x0, y0, x1, y1) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); }

/* ---------- glow sprite cache ---------- */
const _glowCache = new Map();
function glowSprite(col) {
  let s = _glowCache.get(col);
  if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 128;
  const g = s.getContext('2d');
  const [r, gg, b] = hexToRgb(col);
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, `rgba(255,255,255,1)`);
  grd.addColorStop(0.12, `rgba(${r},${gg},${b},0.95)`);
  grd.addColorStop(0.35, `rgba(${r},${gg},${b},0.42)`);
  grd.addColorStop(0.7, `rgba(${r},${gg},${b},0.1)`);
  grd.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  _glowCache.set(col, s);
  return s;
}
const _softCache = new Map();
function softSprite(col) { // no white core — for ambient light
  let s = _softCache.get(col);
  if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 128;
  const g = s.getContext('2d');
  const [r, gg, b] = hexToRgb(col);
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, `rgba(${r},${gg},${b},0.9)`);
  grd.addColorStop(0.5, `rgba(${r},${gg},${b},0.3)`);
  grd.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  _softCache.set(col, s);
  return s;
}
function glow(c, x, y, r, col, a = 1, soft = false) {
  if (a <= 0 || r <= 0) return;
  const pa = c.globalAlpha, pc = c.globalCompositeOperation;
  c.globalCompositeOperation = 'lighter'; c.globalAlpha = pa * Math.min(1, a);
  c.drawImage(soft ? softSprite(col) : glowSprite(col), x - r, y - r, r * 2, r * 2);
  c.globalAlpha = pa; c.globalCompositeOperation = pc;
}

/* ---------- particles (world space unless .ui) ---------- */
const PARTS = [];
function addPart(p) { if (PARTS.length > 900) PARTS.shift(); p.t = 0; PARTS.push(p); return p; }
function burst(x, y, n, col, opt = {}) {
  const spr = opt.spread ?? 1;
  for (let i = 0; i < n; i++) {
    const a = opt.dir != null ? opt.dir + rand(-spr, spr) : rand(0, TAU);
    const sp = rand(opt.smin ?? 60, opt.smax ?? 260);
    addPart({ k: opt.k || 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(opt.lmin ?? 0.25, opt.lmax ?? 0.6), col, size: rand(opt.szmin ?? 2, opt.szmax ?? 5), drag: opt.drag ?? 3.5, grav: opt.grav ?? 0 });
  }
}
function bubbles(x, y, n, spread = 10, big = 1) {
  for (let i = 0; i < n; i++) addPart({ k: 'bubble', x: x + rand(-spread, spread), y: y + rand(-spread, spread), vx: rand(-15, 15), vy: rand(-90, -40), life: rand(0.8, 1.8), size: rand(2, 6) * big, wob: rand(0, TAU) });
}
function ring(x, y, r0, r1, col, life = 0.45, w = 4) { addPart({ k: 'ring', x, y, r0, r1, col, life, w }); }
function floatText(x, y, txt, col, size = 22, opt = {}) {
  x = clamp(x, 34, L.FW - 34); y = clamp(y, 30, L.FH - 20);
  addPart({ k: 'text', x, y, vx: opt.vx ?? rand(-20, 20), vy: opt.vy ?? -70, life: opt.life ?? 0.9, txt, col, size, bold: opt.bold, stroke: opt.stroke ?? '#03101a', pop: 1 });
}
function updateParts(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i];
    p.t += dt;
    if (p.t >= p.life) { PARTS.splice(i, 1); continue; }
    if (p.k === 'bubble') { p.wob += dt * 5; p.x += (p.vx + Math.sin(p.wob) * 18) * dt; p.y += p.vy * dt; p.vy -= 20 * dt; continue; }
    if (p.vx !== undefined) {
      const d = Math.exp(-(p.drag || 0) * dt);
      p.vx *= d; p.vy = p.vy * d + (p.grav || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
}
function drawParts(c, layer) {
  for (const p of PARTS) {
    if ((p.ui ? 'ui' : 'world') !== layer) continue;
    const k = p.t / p.life;
    switch (p.k) {
      case 'spark': {
        const a = 1 - k;
        c.globalAlpha = a; c.fillStyle = p.col;
        c.beginPath(); c.arc(p.x, p.y, p.size * (1 - k * 0.6), 0, TAU); c.fill();
        c.globalAlpha = 1;
        glow(c, p.x, p.y, p.size * 4, p.col, a * 0.5);
        break;
      }
      case 'streak': {
        const a = 1 - k; c.globalAlpha = a; c.strokeStyle = p.col; c.lineWidth = p.size; c.lineCap = 'round';
        line(c, p.x, p.y, p.x - p.vx * 0.04, p.y - p.vy * 0.04); c.stroke(); c.globalAlpha = 1; break;
      }
      case 'bubble': {
        const a = Math.min(1, (1 - k) * 2) * 0.75;
        c.globalAlpha = a; c.strokeStyle = 'rgba(200,240,255,0.9)'; c.lineWidth = 1.2;
        circ(c, p.x, p.y, p.size); c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.8)'; circ(c, p.x - p.size * 0.35, p.y - p.size * 0.35, p.size * 0.25); c.fill();
        c.globalAlpha = 1; break;
      }
      case 'ring': {
        const e = easeOutCubic(k); const r = lerp(p.r0, p.r1, e);
        c.globalAlpha = (1 - k) * 0.9; c.strokeStyle = p.col; c.lineWidth = p.w * (1 - k * 0.7);
        circ(c, p.x, p.y, r); c.stroke(); c.globalAlpha = 1; break;
      }
      case 'glow': { glow(c, p.x, p.y, p.size * (1 + k), p.col, (1 - k) * (p.a ?? 1)); break; }
      case 'ink': {
        c.globalAlpha = (1 - k) * 0.7; c.fillStyle = p.col || '#0a0612';
        circ(c, p.x, p.y, p.size * (1 + k * 1.6)); c.fill(); c.globalAlpha = 1; break;
      }
      case 'debris': {
        c.save(); c.translate(p.x, p.y); c.rotate(p.t * (p.spin || 6)); c.globalAlpha = 1 - k;
        c.fillStyle = p.col; c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); c.restore(); break;
      }
      case 'text': {
        const pop = k < 0.15 ? easeOutBack(k / 0.15) : 1;
        const a = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
        c.globalAlpha = a;
        const sz = p.size * pop;
        c.font = `${p.bold ? 900 : 700} ${sz}px "Big Shoulders Display","Noto Sans TC",system-ui,sans-serif`;
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.lineWidth = Math.max(3, sz * 0.18); c.strokeStyle = p.stroke; c.lineJoin = 'round';
        c.strokeText(p.txt, p.x, p.y); c.fillStyle = p.col; c.fillText(p.txt, p.x, p.y);
        c.globalAlpha = 1; break;
      }
    }
  }
}

/* ---------- marine snow & ambient ---------- */
const SNOW = [];
function initSnow() {
  SNOW.length = 0;
  for (let i = 0; i < 90; i++) SNOW.push({ x: rand(0, 1), y: rand(0, 1), z: rand(0.3, 1.4), s: rand(0.5, 2.2), ph: rand(0, TAU) });
}
initSnow();

/* ---------- backgrounds (cached far layer) ---------- */
const BG = { cache: null, key: '' };
const ACT_PAL = {
  0: { top: '#0b3c58', mid: '#072a40', bot: '#05192a', sand: ['#2b4651', '#173039'], far: '#0a3047', accent: '#59f3e2' },
  1: { top: '#0b3c58', mid: '#072a40', bot: '#05192a', sand: ['#2b4651', '#173039'], far: '#0a3047', accent: '#59f3e2' },
  2: { top: '#04121e', mid: '#020a12', bot: '#01060b', sand: ['#141d22', '#0a1013'], far: '#06121c', accent: '#59f3e2' },
  3: { top: '#0b0612', mid: '#07040b', bot: '#040206', sand: ['#1b1418', '#0d0a0c'], far: '#120914', accent: '#ff4d6a' },
};
function buildBackground(act) {
  const W = Math.ceil(L.vp.w * L.dpr), H = Math.ceil(L.vp.h * L.dpr);
  const key = `${act}|${W}|${H}`;
  if (BG.key === key && BG.cache) return BG.cache;
  const cv = BG.cache || document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const pal = ACT_PAL[act] || ACT_PAL[1];
  const s = L.s * L.dpr;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = lg(c, 0, 0, 0, H, [[0, pal.top], [0.55, pal.mid], [1, pal.bot]]);
  c.fillRect(0, 0, W, H);
  c.setTransform(s, 0, 0, s, 0, 0);
  const FW = L.FW, FH = L.FH, gy = L.groundY;
  // far silhouettes
  const seed = act * 1000 + 7;
  let rs = seed; const rnd = () => { rs = (rs * 16807) % 2147483647; return rs / 2147483647; };
  if (act <= 1) {
    // distant rock spires & a sunken ship
    c.fillStyle = rgba(pal.far, 0.9);
    for (let i = 0; i < 7; i++) {
      const x = rnd() * FW, w = 40 + rnd() * 90, h = 80 + rnd() * 160;
      c.beginPath(); c.moveTo(x - w, gy + 10); c.quadraticCurveTo(x - w * 0.3, gy - h * 0.8, x, gy - h); c.quadraticCurveTo(x + w * 0.4, gy - h * 0.6, x + w, gy + 10); c.fill();
    }
    // sunken ship silhouette
    c.save(); c.translate(FW * 0.62, gy - 18); c.rotate(-0.12);
    c.fillStyle = rgba('#082638', 0.95);
    c.beginPath(); c.moveTo(-170, 0); c.lineTo(150, 0); c.lineTo(190, -40); c.lineTo(-150, -46); c.closePath(); c.fill();
    c.fillRect(-60, -86, 50, 42); c.fillRect(30, -120, 8, 76); c.fillRect(-120, -100, 6, 56);
    c.restore();
    // kelp far
    c.strokeStyle = rgba('#0d3a3a', 0.8); c.lineWidth = 3;
    for (let i = 0; i < 14; i++) {
      const x = rnd() * FW, h = 60 + rnd() * 140;
      c.beginPath(); c.moveTo(x, gy + 6);
      for (let k = 1; k <= 6; k++) c.lineTo(x + Math.sin(k * 1.3 + i) * 8, gy - h * (k / 6));
      c.stroke();
    }
  } else if (act === 2) {
    c.fillStyle = rgba(pal.far, 1);
    for (let i = 0; i < 5; i++) {
      const x = rnd() * FW, w = 60 + rnd() * 120, h = 60 + rnd() * 120;
      c.beginPath(); c.moveTo(x - w, gy + 10); c.lineTo(x - w * 0.2, gy - h); c.lineTo(x + w * 0.3, gy - h * 0.7); c.lineTo(x + w, gy + 10); c.fill();
    }
    // whale-fall skeleton far
    c.strokeStyle = rgba('#1b2a33', 0.9); c.lineWidth = 5;
    const bx = FW * 0.55;
    c.beginPath(); c.moveTo(bx - 160, gy - 8); c.quadraticCurveTo(bx, gy - 30, bx + 170, gy - 6); c.stroke();
    c.lineWidth = 3;
    for (let i = 0; i < 12; i++) { const xx = bx - 130 + i * 24; c.beginPath(); c.moveTo(xx, gy - 18); c.quadraticCurveTo(xx - 6, gy - 60 - (i % 3) * 8, xx + 10, gy - 70 + Math.abs(6 - i) * 4); c.stroke(); }
  } else {
    // station ruins
    c.fillStyle = rgba('#150b16', 1);
    const sx = FW * 0.5;
    c.fillRect(sx - 240, gy - 120, 140, 120); c.fillRect(sx - 90, gy - 190, 180, 190); c.fillRect(sx + 110, gy - 90, 120, 90);
    c.fillRect(sx - 20, gy - 260, 18, 80); c.fillRect(sx + 40, gy - 240, 10, 60);
    c.strokeStyle = rgba('#1d1020', 1); c.lineWidth = 6;
    c.beginPath(); c.moveTo(sx - 100, gy - 160); c.quadraticCurveTo(sx - 180, gy - 220, sx - 300, gy - 140); c.stroke();
    c.beginPath(); c.moveTo(sx + 90, gy - 150); c.quadraticCurveTo(sx + 200, gy - 200, sx + 320, gy - 120); c.stroke();
    // windows (dim; flicker drawn live)
    c.fillStyle = rgba('#3a1a22', 1);
    for (let i = 0; i < 6; i++) c.fillRect(sx - 70 + i * 26, gy - 150, 12, 9);
  }
  // seabed
  c.fillStyle = lg(c, 0, gy - 10, 0, FH, [[0, pal.sand[0]], [1, pal.sand[1]]]);
  c.beginPath(); c.moveTo(0, gy);
  for (let x = 0; x <= FW + 20; x += 20) c.lineTo(x, gy + Math.sin(x * 0.02 + act) * 4 + Math.sin(x * 0.07) * 2);
  c.lineTo(FW + 20, FH + 10); c.lineTo(0, FH + 10); c.closePath(); c.fill();
  // silt ripples & rocks
  c.strokeStyle = rgba('#ffffff', act <= 1 ? 0.05 : 0.025); c.lineWidth = 1.5;
  for (let i = 0; i < 18; i++) { const x = rnd() * FW, y = gy + 12 + rnd() * (FH - gy - 16); c.beginPath(); c.moveTo(x - 30, y); c.quadraticCurveTo(x, y - 4, x + 30, y); c.stroke(); }
  for (let i = 0; i < 9; i++) {
    const x = rnd() * FW, y = gy + 4 + rnd() * 10, r = 6 + rnd() * 14;
    c.fillStyle = act <= 1 ? '#22394200' : '#0e131600';
    c.fillStyle = act <= 1 ? 'rgba(20,40,48,1)' : (act === 2 ? 'rgba(12,18,22,1)' : 'rgba(22,14,18,1)');
    ell(c, x, y, r * 1.5, r * 0.8); c.fill();
  }
  c.setTransform(1, 0, 0, 1, 0, 0);
  BG.key = key;
  return cv;
}

function drawBattleBackground(c, act, t) {
  const bg = buildBackground(act);
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(bg, Math.round((L.vp.x + FX.shakeX) * L.dpr), Math.round((L.vp.y + FX.shakeY) * L.dpr));
  c.restore();
}

/* god rays & snow — world-space, drawn after bg */
function drawAmbient(c, act, t, dt) {
  const FW = L.FW, FH = L.FH;
  if (act <= 1) {
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const x = (i * 0.23 + 0.05) * FW + Math.sin(t * 0.15 + i * 2) * 40;
      const a = 0.05 + Math.sin(t * 0.4 + i * 1.7) * 0.025;
      c.fillStyle = lg(c, 0, 0, 0, FH * 0.9, [[0, `rgba(160,235,255,${a})`], [1, 'rgba(160,235,255,0)']]);
      c.beginPath(); c.moveTo(x - 30, -10); c.lineTo(x + 30, -10); c.lineTo(x + 120 + i * 10, FH * 0.9); c.lineTo(x - 10 + i * 10, FH * 0.9); c.closePath(); c.fill();
    }
    c.restore();
  }
  if (act === 3) {
    // flickering station windows
    const sx = FW * 0.5, gy = L.groundY;
    for (let i = 0; i < 6; i++) {
      const on = Math.sin(t * (1.3 + i * 0.37) + i * 9) > (i === 2 ? -0.2 : 0.4);
      if (on) glow(c, sx - 64 + i * 26, gy - 146, 16, '#ff6a4a', 0.35);
    }
  }
  // marine snow
  const col = act <= 1 ? 'rgba(220,245,255,' : act === 2 ? 'rgba(170,220,235,' : 'rgba(255,190,200,';
  for (const p of SNOW) {
    p.y += (0.012 * p.z) * dt; p.x -= 0.004 * p.z * dt;
    if (p.y > 1.02) { p.y = -0.02; p.x = Math.random(); }
    if (p.x < -0.02) p.x = 1.02;
    const x = p.x * FW + Math.sin(t * 0.6 + p.ph) * 6, y = p.y * FH;
    c.fillStyle = col + (0.25 + p.z * 0.25) + ')';
    c.fillRect(x, y, p.s, p.s);

/* abyss tentacle */
EART.tentacle = {
  draw(c, e, t) {
    const em = e.emerge ?? 1; if (em <= 0) return;
    const sw = e.slam ? Math.sin(Math.min(1, e.slamT || 0) * Math.PI) : 0;
    c.save(); c.translate(e.x, L.groundY + 6);
    const H = 150 * em;
    const segs = 14;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const k = i / segs;
      const bend = Math.sin(t * 1.5 + e.ph + k * 2) * 18 * k - sw * 120 * k * k;
      pts.push([bend, -H * k, (1 - k) * 26 + 4]);

      const [px, py, w] = pts[i];
      c.fillStyle = mixHex('#5a2348', '#c46a9a', i / segs * 0.7);

    for (let i = 1; i < segs; i += 2) { const [px, py, w] = pts[i]; circ(c, px - w * 0.6, py, Math.max(1.5, w * 0.22)); c.fill(); }

  emit(c, e, t) {

};

    c.fillStyle = lg(c, -300, 0, 0, 60, [[0, '#e6e4e0'], [1, '#8f8d96']]);

/* sprite cache: icon only, at cell px size */
const _iconCache = new Map();
function getItemSprite(type, tier, cellPx) {
  const def = ITEMS[type];
  const key = `${type}|${tier}|${Math.round(cellPx * L.dpr)}`;
  let cv = _iconCache.get(key);
  if (cv) return cv;
  cv = document.createElement('canvas');
  const scale = (cellPx * L.dpr) / 100;
  cv.width = Math.ceil(def.w * 100 * scale); cv.height = Math.ceil(def.h * 100 * scale);
  const c = cv.getContext('2d');
  c.setTransform(scale, 0, 0, scale, 0, 0);
  const pad = 8; // inner padding in unit space
  c.translate(pad * def.w * 0.5, pad * def.h * 0.5);
  c.scale((def.w * 100 - pad * def.w) / (def.w * 100), (def.h * 100 - pad * def.h) / (def.h * 100));
  try { ICON[type](c, tier, def.w * 100, def.h * 100); } catch (err) { console.error('icon', type, err); }
  _iconCache.set(key, cv);
  if (_iconCache.size > 400) { const first = _iconCache.keys().next().value; _iconCache.delete(first); }
  return cv;
}
/* draw icon fitted into square at (x,y) with size (world or screen) */
function drawItemIconSmall(c, type, tier, x, y, size) {
  const def = ITEMS[type]; if (!def) return;
  const k = size / (Math.max(def.w, def.h) * 100);
  c.save(); c.translate(x + (size - def.w * 100 * k) / 2, y + (size - def.h * 100 * k) / 2); c.scale(k, k);
  try { ICON[type](c, tier, def.w * 100, def.h * 100); } catch (err) { /* ignore */ }
  c.restore();
}

/* =========================================================
   BAG — crate grid, occupancy, adjacency, tray
   ========================================================= */
let _uid = 1;
const newId = () => _uid++;

function makeItem(type, tier) {
  return { id: newId(), type, tier, r: -1, c: -1, charge: 0, pips: 0, ink: 0, icd: 0, stacks: 0, flash: 0, pop: 0, fired: 0, rust: 0 };
}

const Bag = {
  occ: null, // occ[r][c] = item | null
  nb: new Map(), // id -> [items]
  dirty: true,
  get run() { return G.run; },
  rebuild() {
    const run = G.run; if (!run) return;
    this.occ = [];
    for (let r = 0; r < BAG_ROWS; r++) { this.occ.push(new Array(BAG_COLS).fill(null)); }
    for (const it of run.bag.items) for (const [r, c] of cellsOf(it)) if (this.occ[r]) this.occ[r][c] = it;
    this.nb.clear();
    for (const it of run.bag.items) {
      const set = new Set();
      for (const [r, c] of cellsOf(it)) {
        for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const o = this.at(r + dr, c + dc);
          if (o && o !== it) set.add(o);
        }
      }
      this.nb.set(it.id, [...set]);
    }
    // corner & top-row flags
    let minR = 99, maxR = -1, minC = 99, maxC = -1;
    for (let r = 0; r < BAG_ROWS; r++) for (let c = 0; c < BAG_COLS; c++) if (run.bag.active[r][c]) { minR = Math.min(minR, r); maxR = Math.max(maxR, r); minC = Math.min(minC, c); maxC = Math.max(maxC, c); }
    this.box = { minR, maxR, minC, maxC };
    for (const it of run.bag.items) {
      const cells = cellsOf(it);
      it.corner = cells.some(([r, c]) => (r === minR || r === maxR) && (c === minC || c === maxC));
      it.top = cells.some(([r]) => r === minR);
    }
    this.dirty = false;
  },
  at(r, c) { if (r < 0 || c < 0 || r >= BAG_ROWS || c >= BAG_COLS) return null; return this.occ ? this.occ[r][c] : null; },
  neighbors(it) { if (this.dirty) this.rebuild(); return this.nb.get(it.id) || []; },
  isActiveCell(r, c) { const run = G.run; return r >= 0 && c >= 0 && r < BAG_ROWS && c < BAG_COLS && run.bag.active[r][c]; },
  canPlace(type, r, c, ignore) {
    const def = ITEMS[type];
    for (let dr = 0; dr < def.h; dr++) for (let dc = 0; dc < def.w; dc++) {
      const rr0 = r + dr, cc = c + dc;
      if (!this.isActiveCell(rr0, cc)) return false;
      const o = this.at(rr0, cc);
      if (o && o !== ignore) return false;
    }
    return true;
  },
  place(it, r, c) {
    it.r = r; it.c = c;
    if (!G.run.bag.items.includes(it)) G.run.bag.items.push(it);
    this.dirty = true; this.rebuild();
  },
  remove(it) {
    const arr = G.run.bag.items; const i = arr.indexOf(it);
    if (i >= 0) arr.splice(i, 1);
    it.r = -1; it.c = -1;
    this.dirty = true; this.rebuild();
  },
  firstFit(type) {
    for (let r = BAG_ROWS - 1; r >= 0; r--) for (let c = 0; c < BAG_COLS; c++) if (this.canPlace(type, r, c, null)) return [r, c];
    return null;
  },
  emptyActiveCells() {
    const out = [];
    for (let r = 0; r < BAG_ROWS; r++) for (let c = 0; c < BAG_COLS; c++) if (G.run.bag.active[r][c] && !this.at(r, c)) out.push([r, c]);
    return out;
  },
  expansionCandidates() {
    const out = [];
    const act = G.run.bag.active;
    for (let r = 0; r < BAG_ROWS; r++) for (let c = 0; c < BAG_COLS; c++) {
      if (act[r][c]) continue;
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dr, dc]) => act[r + dr] && act[r + dr][c + dc])) out.push([r, c]);
    }
    return out;
  },
  activeCount() { let n = 0; for (const row of G.run.bag.active) for (const v of row) if (v) n++; return n; },
};

function cellsOf(it) {
  const def = ITEMS[it.type]; const out = [];
  for (let dr = 0; dr < def.h; dr++) for (let dc = 0; dc < def.w; dc++) out.push([it.r + dr, it.c + dc]);
  return out;

/* ---------- item rolls ---------- */

/* ---------- wave building ---------- */
function buildWaves(kind, run) {
  const act = ACTS[run.act - 1];
  const waves = [];
  if (kind === 'boss') return [{ boss: act.boss, spawns: [] }];
  const base = [0, 14, 30, 50][run.act] + run.step * [0, 6.5, 5.5, 9][run.act];
  const nW = kind === 'elite' ? 2 : 3;
  for (let w = 0; w < nW; w++) {
    let budget = base * (1 + w * 0.32) * (run.nextHarder ? 1.45 : 1);
    if (kind === 'elite') budget *= w === 0 ? 0.75 : 0.45;
    const list = [];
    if (kind === 'elite' && w === nW - 1) list.push(act.elite);
    let pool = Object.entries(act.pool);
    const first = run.act === 1 && run.step === 0;
    if (first) { pool = pool.filter(([k]) => k === 'lanternfish' || (k === 'boxjelly' && w > 0) || (k === 'hermit' && w > 0) || (k === 'inksquid' && w === 2)); budget *= 0.7; }
    let guard = 0;
    while (budget > 0.9 && guard++ < 80) {
      const ok = pool.filter(([k]) => ENEMIES[k].cost <= budget + 1);
      if (!ok.length) break;
      const k = weightedPick(ok);
      // thieves only if we have something worth stealing; max 1 per wave
      if (k === 'thief' && list.includes('thief')) continue;
      if ((k === 'inksquid' || k === 'barnacler') && list.filter((x) => x === k).length >= 2) continue;
      if (first && k !== 'lanternfish' && list.filter((x) => x === k).length >= 1) continue;
      if (run.act === 1 && k === 'hermit' && list.filter((x) => x === k).length >= 1 + Math.floor(run.step / 2)) continue;
      list.push(k); budget -= ENEMIES[k].cost;
    }
    // schedule: group small fry
    const dur = 8 + w * 2 + run.act;
    const spawns = []; let t = 0.6;
    shuffle(list);
    if (kind === 'elite' && w === nW - 1) { const i = list.indexOf(act.elite); list.splice(i, 1); list.unshift(act.elite); }
    let i = 0;
    while (i < list.length) {
      const k = list[i];
      if (k === 'lanternfish') {
        const n = Math.min(run.act === 1 && run.step <= 1 ? randi(2, 3) : randi(3, 5), list.slice(i).filter((x) => x === 'lanternfish').length);
        const y0 = rand(80, L.groundY - 120);
        let taken = 0;
        for (let j = i; j < list.length && taken < n; j++) if (list[j] === 'lanternfish') { spawns.push({ t: t + taken * 0.18, type: 'lanternfish', y: y0 + rand(-40, 40) }); list.splice(j, 1); j--; taken++; }
        t += dur / Math.max(4, list.length + 2);
        continue;
      }
      spawns.push({ t, type: k }); i++;
      t += dur / Math.max(4, list.length + 1) * rand(0.7, 1.25);
    }
    spawns.sort((a, b) => a.t - b.t);

  }

  return waves;
}

/* ---------- item charging & firing ---------- */
function updateItems(dt) {
  const run = G.run;
  const low = run.o2 < run.maxO2 * 0.3;
  const hasT = liveTargets().length > 0;
  for (const it of run.bag.items) {
    if (it.ink > 0) it.ink -= dt;
    if (it.icd > 0) it.icd -= dt;
    if (!isActive(it.type)) continue;
    let mul = 1;
    for (const n of Bag.neighbors(it)) if (n.type === 'valve') mul += tv(ITEMS.valve.pct, n.tier) / 100;
    if (it.top && has('topvent')) mul += 0.35;
    if (low && has('emergency')) mul += 0.5;
    if (B.freeze > 0) mul *= 2;
    if (it.ink > 0) mul *= 0.4;
    it.charge += mul * dt / itemCd(it.type, it.tier);
    if (it.charge >= 1) {
      const needsTarget = isWeapon(it.type) || it.type === 'horn';
      if (needsTarget && !hasT) { it.charge = 1; continue; }
      if (it.type === 'o2tank' && run.o2 >= run.maxO2 && !(it.tier >= 5)) { it.charge = 1; continue; }
      it.charge -= 1;

function itemMult(it, ctx) {

  if (it.corner && has('corners')) m *= 1.5;
  if (ctx.chain > 0) m *= 1 + (ctx.link || 0.25) * ctx.chain;
  if (ctx.fusion) m *= ctx.fusion;

}

/* ---------- main battle update ---------- */
function updateBattle(dt) {
  if (!B) return;
  B.t += dt;
  const run = G.run;
  const act = ACTS[B.act - 1];
  if (B.echoLine) { B.echoLine.t += dt; if (B.echoLine.t > B.echoLine.life) B.echoLine = null; }
  if (B.state === 'won' || B.state === 'lost') {
    B.outcomeT += dt;
    updateProjectiles(dt); updateEnemiesVisual(dt);
    if (B.outcomeT > (B.state === 'won' ? 1.6 : 2.2)) endBattle(B.state === 'won');
    return;
  }
  if (B.freeze > 0) B.freeze -= dt;
  if (B.globalLight > 0) B.globalLight -= dt;
  if (B.darkPulse > 0) B.darkPulse -= dt;
  if (B.sonarT > 0) B.sonarT -= dt;
  if (B.comboT > 0) { B.comboT -= dt; if (B.comboT <= 0) B.combo = 0; }
  B.react = Math.max(0, B.react - dt * 2);
  for (let i = 0; i < 8; i++) B.crate[i] = Math.max(0, B.crate[i] - dt * 3);
  const h = B.hero;
  h.recoil = Math.max(0, h.recoil - dt * 4); h.cast = Math.max(0, h.cast - dt * 3); h.hurt = Math.max(0, h.hurt - dt * 3);
  h.lowO2 = run.o2 < run.maxO2 * 0.3;
  // waves
  updateWaves(dt);
  // lights
  for (const l of B.lights) l.t += dt;
  B.lights = B.lights.filter((l) => l.t < l.life);
  computeLit(act);
  // items
  runScheduled();
  updateItems(dt);
  // projectiles
  updateProjectiles(dt);
  updateEnemyProjectiles(dt);
  // enemies
  updateEnemies(dt);
  updateThreats(dt);
  updateLoot(dt);
  // vortex
  if (B.vortex) { const v = B.vortex; v.t += dt; for (const e of liveTargets()) if (!e.d.boss && e.d.speed > 0 && dist(e.x, e.y, v.x, v.y) < 170) { e.x = lerp(e.x, v.x, dt * 2); if (!e.d.ground) e.y = lerp(e.y, v.y, dt * 2); } if (v.t > v.life) B.vortex = null; }
  for (const c of B.conduits) c.t += dt;
  B.conduits = B.conduits.filter((c) => c.t < c.life);
  // supply during boss
  if (B.kind === 'boss') { B.supplyT += dt; if (B.supplyT > 14) { B.supplyT = 0; supplyDrop(); } }
  // focus cleanup
  if (B.focus && (B.focus.dead || !targetable(B.focus))) { if (B.focus.dead) B.focus = null; }
}
function updateWaves(dt) {
  if (B.kind === 'boss') return;
  const wave = B.waves[B.wave];
  B.waveT += dt;
  while (B.spawnIdx < wave.spawns.length && wave.spawns[B.spawnIdx].t <= B.waveT) {
    const s = wave.spawns[B.spawnIdx++];
    if (s.surge) { setBanner('', '更多東西從黑暗裡游過來了。', 1.8); Audio2.sfx('elite'); }
    spawnEnemy(s.type, s.y != null ? { y: s.y } : {});
  }
  const alive = B.enemies.some((e) => !e.dead && e.type !== 'decoy');

    if (B.wave < B.waves.length - 1) {
      B.wave++; B.spawnIdx = 0; B.waveT = -2.2;
      setBanner(B.kind === 'elite' && B.wave === B.waves.length - 1 ? '菁英出現' : `第 ${B.wave + 1} 波`, '', 1.8);

function computeLit(act) {

  if (B.darkPulse > 0) lampR *= 0.5;
  B.lampR = lampR;
  const lx = h.x + 30, ly = h.y - 120;
  for (const e of B.enemies) {
    if (e.dead) continue;
    if (act.ambient >= 1 || B.globalLight > 0 || e.d.glow || e.st.burn > 0 || e.selfLit) { e.lit = true; continue; }
    let lit = false;
    const dx = (e.x - lx) / 1.5, dy = e.y - ly;
    if (Math.hypot(dx, dy) < lampR + e.r) lit = true;
    if (!lit) for (const l of B.lights) if (dist(e.x, e.y, l.x, l.y) < l.r + e.r) { lit = true; break; }

/* ---------- battle viewport ---------- */
function drawScene(c, act, dt) {
  const dpr = L.dpr, s = L.s;

  hero.x = L.heroX; hero.y = L.groundY;

    const list = B.enemies.filter((e) => !e.dead).sort((a, b) => b.r - a.r);

  }

  // darkness

  if (actD.ambient < 1 || (B && B.darkPulse > 0)) {

    c.save(); c.translate(hero.x + 60, hero.y - 120); c.scale(1.5, 1);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, lr * 0.9);
    g.addColorStop(0, 'rgba(255,190,100,0.08)'); g.addColorStop(1, 'rgba(255,190,100,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, lr, 0, TAU); c.fill();
    c.restore();
    const flick = B && B.hero.lowO2 ? (Math.sin(G.t * 23) > 0.2 ? 1 : 0.4) : 1;
    lampBeam(c, hero, lr, flick);
    c.restore();
  }
  // emissive pass (above darkness)
  if (B) {
    for (const e of B.enemies) if (!e.dead) {
      const a = EART[e.type];
      if (a && a.emit) { c.save(); if (e.ds && e.ds !== 1) { c.translate(e.x, e.y); c.scale(e.ds, e.ds); c.translate(-e.x, -e.y); } a.emit(c, e, G.t); c.restore(); }
      drawStatusFx(c, e);
    }
    drawProjectileGlows(c);
    for (const l of B.lights) { const k = l.t / l.life; glow(c, l.x, l.y, l.r * 0.5, '#ffb070', (1 - k) * 0.25, true); }
  }

  // focus reticle

    c.strokeStyle = '#ff5fd2'; c.lineWidth = 3;
    for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(e.x, e.y, r, i * Math.PI / 2 + 0.25 + G.t, i * Math.PI / 2 + 1.1 + G.t); c.stroke(); }
    glow(c, e.x, e.y - r, 8, '#ff5fd2', 0.8);
  }
  // telegraph lines (sawfish/gulper)

    c.strokeStyle = `rgba(255,77,94,${0.4 + Math.sin(G.t * 25) * 0.2})`; c.lineWidth = 6; c.setLineDash([16, 10]);
    line(c, e.x - e.r, e.y, hero.x + 30, e.y); c.stroke(); c.setLineDash([]);
  }

  if (B && B.echoLine && B.boss) {

    c.save(); c.globalAlpha = a;
    c.font = `700 ${28}px ${FONT_SERIF}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    const jx = rand(-1.2, 1.2), jy = rand(-1.2, 1.2);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillText(B.echoLine.txt, B.boss.x - 140 + jx * 4, B.boss.y - 170 + jy * 4);
    c.fillStyle = '#e8eef5'; c.fillText(B.echoLine.txt, B.boss.x - 140 + jx, B.boss.y - 170 + jy);

  c.fillStyle = eg; c.fillRect(vp.x, vp.y + vp.h - 26, vp.w, 26);

  // boss bar, banners

}

function drawEnemy(c, e) {
  const a = EART[e.type];
  if (!a) { c.fillStyle = '#c33'; circ(c, e.x, e.y, e.r); c.fill(); return; }
  c.save();
  if (e.ds && e.ds !== 1) { c.translate(e.x, e.y); c.scale(e.ds, e.ds); c.translate(-e.x, -e.y); }
  a.draw(c, e, e.st.frozen > 0 || e.st.stun > 0 || e.stunned > 0 ? e.ph : G.t);
  c.restore();

  if (e.st.frozen > 0) { c.save(); c.globalAlpha = 0.55; c.fillStyle = '#bfefff'; ell(c, e.x, e.y, e.r * 1.05, e.r * 0.9); c.fill(); c.restore(); }
  // hp bar for damaged non-boss

    const w = Math.max(30, e.r * 1.4), x = e.x - w / 2, y = e.y - e.r - 14;

}
function drawStatusFx(c, e) {

  if (st.frozen > 0) glow(c, e.x, e.y, e.r * 1.3, '#8fe3ff', 0.35);
  if (st.shock > 0 && Math.random() < 0.3) { const a = rand(0, TAU); const x0 = e.x + Math.cos(a) * e.r * 0.7, y0 = e.y + Math.sin(a) * e.r * 0.7; c.strokeStyle = '#d6c6ff'; c.lineWidth = 1.6; line(c, x0, y0, x0 + rand(-14, 14), y0 + rand(-14, 14)); c.stroke(); }

}

function drawDarkness(c, act, hero) {
  const W = Math.ceil(L.vp.w * L.dpr), H = Math.ceil(L.vp.h * L.dpr);
  if (DARK.cv.width !== W || DARK.cv.height !== H) { DARK.cv.width = W; DARK.cv.height = H; }
  const d = DARK.cv.getContext('2d');
  d.setTransform(1, 0, 0, 1, 0, 0);
  d.globalCompositeOperation = 'source-over';
  d.clearRect(0, 0, W, H);
  let alpha = act.id === 3 ? 0.93 : act.id === 2 ? 0.9 : 0.6;
  if (B && B.globalLight > 0) alpha *= Math.max(0, 1 - Math.min(1, B.globalLight));
  d.fillStyle = act.id === 3 ? `rgba(5,0,8,${alpha})` : `rgba(0,4,9,${alpha})`;
  d.fillRect(0, 0, W, H);
  d.globalCompositeOperation = 'destination-out';
  const k = L.s * L.dpr;
  const ox = FX.shakeX * L.dpr, oy = FX.shakeY * L.dpr;
  const lampR = (B ? B.lampR : act.lamp) || 300;
  if (lampR < 5000) {
    d.save(); d.translate((hero.x + 60) * k + ox, (hero.y - 120) * k + oy); d.scale(1.5, 1);
    const R = lampR * k;
    const g = d.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,0.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g; d.beginPath(); d.arc(0, 0, R, 0, TAU); d.fill(); d.restore();
  }
  // beam cone carve
  { const bx = (hero.x + 17) * k + ox, by = (hero.y - 121) * k + oy; const len = lampR * 1.45 * k;
    d.save(); d.translate(bx, by); d.rotate(0.06);
    const gg = d.createLinearGradient(0, 0, len, 0); gg.addColorStop(0, 'rgba(0,0,0,0.95)'); gg.addColorStop(0.7, 'rgba(0,0,0,0.55)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = gg; d.beginPath(); d.moveTo(0, -6 * k); d.lineTo(len, -len * 0.36); d.lineTo(len, len * 0.36); d.lineTo(0, 6 * k); d.closePath(); d.fill(); d.restore(); }
  // hero body visibility
  { const g = d.createRadialGradient(hero.x * k + ox, (hero.y - 70) * k + oy, 0, hero.x * k + ox, (hero.y - 70) * k + oy, 110 * k); g.addColorStop(0, 'rgba(0,0,0,0.9)'); g.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = g; d.beginPath(); d.arc(hero.x * k + ox, (hero.y - 70) * k + oy, 110 * k, 0, TAU); d.fill(); }
  if (B) {
    for (const l of B.lights) {
      const f = 1 - Math.pow(l.t / l.life, 3);
      const R = l.r * k * f; if (R < 2) continue;
      const g = d.createRadialGradient(l.x * k + ox, l.y * k + oy, 0, l.x * k + ox, l.y * k + oy, R);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.6, 'rgba(0,0,0,0.8)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      d.fillStyle = g; d.beginPath(); d.arc(l.x * k + ox, l.y * k + oy, R, 0, TAU); d.fill();
    }
    for (const e of B.enemies) {
      if (e.dead) continue;
      let R = 0;
      if (e.st.burn > 0) R = e.r * 1.6;
      if (e.selfLit) R = e.r * 1.4;
      if (e.st.mark > 0) R = Math.max(R, e.r * 1.2);
      if (R <= 0) continue;
      const g = d.createRadialGradient(e.x * k + ox, e.y * k + oy, 0, e.x * k + ox, e.y * k + oy, R * k);
      g.addColorStop(0, 'rgba(0,0,0,0.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      d.fillStyle = g; d.beginPath(); d.arc(e.x * k + ox, e.y * k + oy, R * k, 0, TAU); d.fill();
    }
    if (B.sonarT > 0) { // sonar sweep reveals briefly
      d.fillStyle = `rgba(0,0,0,${B.sonarT * 0.5})`; d.fillRect(0, 0, W, H);
    }
  }
  c.drawImage(DARK.cv, Math.round(L.vp.x * L.dpr), Math.round(L.vp.y * L.dpr));
}

/* ---------- projectiles ---------- */
function drawProjectiles(c) {
  for (const p of B.projs) {
    const big = p.big || 1;
    if (p.kind === 'rivet') {
      const a = Math.atan2(p.vy, p.vx);
      c.save(); c.translate(p.x, p.y); c.rotate(a); c.scale(big, big);
      c.fillStyle = '#e8f4fb'; rr(c, -9, -3, 16, 6, 3); c.fill(); c.fillStyle = '#7f98a6'; c.fillRect(-9, -3, 5, 6);
      c.restore();
    } else if (p.kind === 'harpoon') {
      const cp = cratePos();
      c.strokeStyle = 'rgba(220,200,150,0.6)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(cp.x, cp.y); c.quadraticCurveTo((cp.x + p.x) / 2, (cp.y + p.y) / 2 + 30, p.x - 20, p.y); c.stroke();
      const a = Math.atan2(p.vy, p.vx);
      c.save(); c.translate(p.x, p.y); c.rotate(a); c.scale(big, big);
      c.strokeStyle = '#d7dfe4'; c.lineWidth = 4; line(c, -46, 0, 0, 0); c.stroke();
      c.fillStyle = '#ffe6b0'; poly(c, [16, 0, -4, -9, 0, 0, -4, 9]); c.fill();
      c.strokeStyle = '#ffe6b0'; c.lineWidth = 2.5; line(c, -8, 0, -16, -7); c.stroke(); line(c, -8, 0, -16, 7); c.stroke();
      c.restore();
    } else if (p.kind === 'cannon') {
      const a = Math.atan2(p.vy, p.vx);
      c.save(); c.translate(p.x, p.y); c.rotate(a); c.scale(big * 1.3, big * 1.3);
      c.strokeStyle = '#c9a25a'; c.lineWidth = 7; line(c, -54, 0, 0, 0); c.stroke();
      c.fillStyle = '#fff1c8'; poly(c, [22, 0, -6, -14, 2, 0, -6, 14]); c.fill();
      c.restore();
    } else if (p.kind === 'prop') {
      c.save(); c.translate(p.x, p.y); c.rotate(p.t * 26); c.scale(big, big);
      for (let i = 0; i < 3; i++) { c.rotate(TAU / 3); c.fillStyle = '#dbeaf4'; ell(c, 0, -11, 5, 12); c.fill(); }
      c.fillStyle = '#c9933f'; circ(c, 0, 0, 5); c.fill();
      c.restore();
    } else if (p.kind === 'flare') {
      c.fillStyle = '#ffd2a0'; circ(c, p.x, p.y, 6 * big); c.fill();
    } else if (p.kind === 'depth') {
      c.save(); c.translate(p.x, p.y); c.rotate(p.t * 6); c.scale(big, big);
      c.fillStyle = '#4f735f'; rr(c, -10, -12, 20, 24, 5); c.fill();
      c.fillStyle = '#ffcf5c'; c.fillRect(-10, -2, 20, 5);
      c.restore();
    } else if (p.kind === 'cryo') {
      c.fillStyle = '#e6f8ff'; circ(c, p.x, p.y, 7 * big); c.fill();
    }
  }
  // enemy projectiles
  for (const p of B.eprojs) {
    const x = p.cx ?? p.x, y = p.cy ?? p.y;
    if (p.kind === 'ink') { c.fillStyle = '#1a0a24'; circ(c, x, y, 9); c.fill(); }
    else if (p.kind === 'spore') { c.fillStyle = '#d6c48a'; circ(c, x, y, 7); c.fill(); }
    else if (p.kind === 'debris') { c.save(); c.translate(x, y); c.rotate(p.t * 8); c.fillStyle = '#7c7f86'; rr(c, -16, -8, 32, 16, 3); c.fill(); c.restore(); }
    else if (p.kind === 'erivet') { c.fillStyle = '#ff9a9a'; rr(c, x - 8, y - 3, 16, 6, 3); c.fill(); }
    else if (p.kind === 'copy') { c.save(); c.globalAlpha = 0.85; drawItemIconSmall(c, p.copy, 2, x - 18, y - 18, 36); c.restore(); }
    else if (p.kind === 'orb') { c.fillStyle = '#e6ffff'; circ(c, x, y, 7); c.fill(); }
  }
  // particle-based beams/bolts (world)
  for (const p of PARTS) {
    if (p.ui) continue;

      c.strokeStyle = p.col; c.globalAlpha = a; c.lineWidth = p.w * 2.2; c.lineJoin = 'round';

      c.strokeStyle = '#ffffff'; c.lineWidth = p.w * 0.8; c.stroke(); c.globalAlpha = 1;
    } else if (p.k === 'beam') {
      const a = 1 - p.t / p.life;
      c.strokeStyle = p.col; c.globalAlpha = a * 0.8; c.lineWidth = p.w * 2; c.lineCap = 'round'; line(c, p.x0, p.y0, p.x1, p.y1); c.stroke();
      c.strokeStyle = '#ffffff'; c.lineWidth = p.w * 0.6; c.stroke(); c.globalAlpha = 1;
    }
  }
}
function drawProjectileGlows(c) {

    else if (p.kind === 'cryo') glow(c, p.x, p.y, 28 * big, '#8fe3ff', 0.8);
    else if (p.kind === 'depth') glow(c, p.x, p.y - 12, 12, '#ffcf5c', 0.8);

  const s = $('screen'); s.className = 'screen lines' + (opts.ending ? ' ending' : '') + (opts.act ? ' act' + opts.act : ''); s.innerHTML = ''; s.hidden = false;

  function finish() { if (finished) return; finished = true; clearInterval(typing); clearTimeout(auto); s.hidden = true; s.innerHTML = ''; done && done(); }
  let auto = null;

    clearTimeout(auto);
    if (typing) { clearInterval(typing); typing = null; const last = box.lastChild; if (last && last.dataset.full) last.textContent = last.dataset.full; auto = setTimeout(next, 1100); return; }

/* ---------- logs & mods ---------- */
function giveLog(id) {
  const run = G.run;
  if (!G.meta.codex.logs[id]) { G.meta.codex.logs[id] = 1; saveMeta(); run && (run.newLogs = run.newLogs || []).push(id); toast(`取得錄音：${LOGS[id].title}`); return true; }
  return false;
}
function giveNextLog() {
  const pool = ['log1', 'log2', 'log3', 'log4', 'log5', 'log7', 'log8', 'log9', 'log10', 'log11'];
  const id = pool.find((k) => !G.meta.codex.logs[k]);
  if (!id) return false;
  return giveLog(id);
}
function rollMods(n, rarW) {
  const owned = new Set(G.run.mods);
  const pool = MOD_IDS.filter((k) => !owned.has(k));
  const out = [];
  for (let i = 0; i < n && pool.length; i++) {
    const entries = pool.filter((k) => !out.includes(k)).map((k) => [k, rarW[MODS[k].rar - 1] || 0]);
    const k = weightedPick(entries); if (!k) break; out.push(k);
  }
  return out;
}
function giveMod(id) {
  const run = G.run;
  if (run.mods.includes(id)) return;
  run.mods.push(id);
  G.meta.codex.mods[id] = 1;
  if (id === 'walls') { run.maxO2 += 20; run.o2 += 20; }
  if (id === 'quick' || id === 'bottomless') syncTraySize();
  if (id === 'bottomless') { const c = Bag.expansionCandidates(); shuffle(c).slice(0, 2).forEach(([r, cc]) => { run.bag.active[r][cc] = true; }); Bag.dirty = true; Bag.rebuild(); }
  Bag.rebuild();
  saveMeta();
}
function giveRandomMod(rar) { const ids = rollMods(1, rar === 1 ? [1, 0, 0] : rar === 2 ? [0, 1, 0] : [0, 0, 1]); const id = ids[0] || rollMods(1, [1, 1, 1])[0]; if (id) giveMod(id); return id; }

/* ---------- new run ---------- */
function newRun(kitId = 'salvager', depthLevel = 0) {
  const kit = KITS.find((k) => k.id === kitId) || KITS[0];
  const active = []; for (let r = 0; r < BAG_ROWS; r++) { active.push([]); for (let c = 0; c < BAG_COLS; c++) active[r].push(r >= 1 && c >= 1 && c <= 4); }
  G.run = {
    act: 1, step: 0, o2: 100, maxO2: 100, scrap: 0, mods: [], bag: { active, items: [] }, tray: [null, null, null],
    kit: kit.id, depthLevel, stats: { kills: 0, merges: 0, fusions: 0, perfect: 0, battles: 0, scrap: 0, fires: {}, dmg: {}, reacts: 0 },
    nextHarder: 0, forceElite: false, soldWatch: false, watchAwake: false, cleared: false, choices: null, seenEvents: [], shopBuys: 0, unlocks: [], newLogs: [],
    startedAt: Date.now(),
  };
  Bag.dirty = true; Bag.rebuild();
  for (const [type, tier, r, c] of kit.items) { const it = makeItem(type, tier); Bag.place(it, r, c); markFound(type, tier); }
  const w = makeItem('watch', 1); Bag.place(w, 1, 1);
  syncTraySize();
  G.meta.runs++; saveMeta();
  saveRun();
}

  const run = G.run; if (!run) return;

}

/* ---------- map / route ---------- */
function genChoices() {
  const run = G.run;
  if (run.forceElite) { run.forceElite = false; return ['elite']; }
  if (run.step >= 6) return ['boss'];
  if (run.step === 5) return ['rest', 'shop'];
  const pool = run.step <= 1 ? [['battle', 4], ['wreck', 2.5], ['shop', 1]] : [['battle', 3.2], ['elite', 1.6], ['wreck', 2.4], ['shop', 1.4], ['rest', 1.1]];
  const n = run.step === 0 ? 2 : 3;
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 40) {
    const k = weightedPick(pool);
    if (out.includes(k) && !(k === 'battle' && out.filter((x) => x === 'battle').length < 1)) continue;
    out.push(k);
  }
  if (!out.includes('battle') && !out.includes('elite')) out[0] = 'battle';
  return out;
}
function goMap() {
  const run = G.run;
  G.mode = 'map';
  if (!run.choices) run.choices = genChoices();
  saveRun();
  Audio2.music('map', run.act);
  openMapPanel();
}
function chooseNode(kind) {
  const run = G.run;
  run.choices = null; run.node = kind;
  Audio2.sfx('page');
  if (kind === 'battle') startBattle('battle');
  else if (kind === 'elite') startBattle('elite');
  else if (kind === 'boss') startBattle('boss');
  else if (kind === 'shop') openShop();
  else if (kind === 'rest') openRest();
  else if (kind === 'wreck') openEvent();
}
function completeNode() {
  const run = G.run;
  run.step++;
  run.choices = null;
  goMap();
}

/* ---------- after battle ---------- */
function afterBattle(kind) {
  const run = G.run;
  if (run.act > G.meta.bestAct) G.meta.bestAct = run.act;
  G.meta.bestDepth = Math.max(G.meta.bestDepth, depthNow());
  saveMeta();
  if (kind === 'boss') {
    if (run.act === 1) { unlockMeta('prop'); unlockMeta('kit_demo'); }
    if (run.act === 3) { runEnding(); return; }
    const mods = rollMods(3, [0, 1, 1.2]);
    if (!mods.some((m) => MODS[m].rar === 3)) { const l = rollMods(1, [0, 0, 1]); if (l[0]) mods[2] = l[0]; }
    run.o2 = run.maxO2;
    giveNextLog();
    openReward({ title: '深處的戰利品', sub: '氧氣已補滿。選一個改裝帶走。', cards: mods.map((id) => ({ kind: 'mod', id })), after: () => actTransition() });
    return;
  }
  if (kind === 'elite') {
    gainScrap(20);
    const mods = rollMods(3, [0.6, 1, 0.22 + run.act * 0.05]);
    const bonus = run.pendingBonus; run.pendingBonus = null;
    openReward({ title: '菁英擊破', sub: '+20 廢料。選一個改裝。', cards: mods.map((id) => ({ kind: 'mod', id })), after: () => { if (bonus === 'rareMod') { const m = giveRandomMod(2); toast(`信標旁還留著「${MODS[m].name}」`); } completeNode(); } });
    return;
  }
  // normal battle
  const cards = [];
  const a = rollItem(run.act, 0.12); cards.push({ kind: 'item', type: a.type, tier: a.tier });
  if (chance(0.45)) { const m = rollMods(1, [1, 0.35 + run.act * 0.1, 0.04])[0]; if (m) cards.push({ kind: 'mod', id: m }); }
  if (cards.length < 2) { const b = rollItem(run.act, 0.2); cards.push({ kind: 'item', type: b.type, tier: b.tier }); }
  if (Bag.expansionCandidates().length) cards.push({ kind: 'expand', n: 2 });
  else { const b = rollItem(run.act, 0.3); cards.push({ kind: 'item', type: b.type, tier: b.tier }); }
  openReward({ title: '打撈品', sub: '選一份帶走。', cards, skip: 12, after: () => completeNode() });
}
function actTransition() {
  const run = G.run;
  run.act++; run.step = 0; run.choices = null;
  if (run.act === 2) unlockMeta('kit_demo');
  saveRun();
  const a = ACTS[run.act - 1];
  const lines = [...(STORY.actRadio[run.act] || []), { t: '', cls: 'gap' }, { t: `${a.name}・${a.depth[0]} 公尺`, cls: 'act' }, ...a.intro.map((t) => ({ t, cls: 'line' }))];
  playLines(lines, () => goMap(), { act: run.act });
}

/* ---------- defeat / ending / results ---------- */
function runDefeat() {
  const run = G.run;
  G.meta.bestDepth = Math.max(G.meta.bestDepth, depthNow());
  unlockMeta('torch');
  if (run.act >= 2) unlockMeta('kit_demo');
  saveMeta();
  clearRun();
  showResults(false);
}
function runEnding() {
  const run = G.run;
  const surface = !!run.watchAwake;
  const key = surface ? 'surface' : 'echo';
  G.meta.endings[key] = 1; G.meta.clears++;
  G.meta.depthMax = Math.min(5, Math.max(G.meta.depthMax, (run.depthLevel || 0) + 1));
  if (surface) giveLog('log12');
  unlockMeta('kit_whaler');
  G.meta.bestDepth = Math.max(G.meta.bestDepth, 10920);
  saveMeta(); clearRun();
  const E = ENDINGS[key];
  G.mode = 'ending';
  Audio2.music(surface ? 'watch' : 'title', 3);
  playLines(E.lines.map((t) => ({ t, cls: t.startsWith('「') ? 'voice' : 'line' })), () => {
    showEndingCard(E, () => showResults(true, key));
  }, { ending: key, slow: true });
}

/* =========================================================
   MAIN — boot, loop, resize, hot-reload
   ========================================================= */
function onLayoutChanged() {
  BG.key = '';
  _iconCache.clear();
  if (typeof positionOverlays === 'function') positionOverlays();
}
let _lastTs = 0;
function frame(ts) {
  const now = ts / 1000;
  const realDt = Math.min(0.05, Math.max(0, now - (_lastTs || now)));
  _lastTs = now;
  G.t += realDt;
  const s = computeTimeScale(realDt);
  const dt = realDt * s;
  try {
    if (G.mode === 'battle' && B) {
      if (B.banner) B.banner.t += realDt;
      let rem = dt;
      while (rem > 1e-6 && B) { const st = Math.min(rem, 1 / 60); updateBattle(st); rem -= st; }
    }
    updateParts(G.mode === 'battle' ? dt : realDt);
    updateHint(realDt);
    updateCard(realDt);
    render(realDt);

}
function boot(data) {

  window.addEventListener('orientationchange', () => setTimeout(computeLayout, 200));

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { _iconCache.clear(); BG.key = ''; });
  const saved = data && data.resume ? loadRun() : null;
  if (saved) { G.run = saved; Bag.dirty = true; Bag.rebuild(); syncTraySize(); goMap(); }
  else showTitle();
  requestAnimationFrame(frame);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => { if (G.run) saveRun(); return { resume: !!G.run && G.mode !== 'title' }; }); } catch (e) { /* ignore */ }
  }
}
window.__hadal = { G, get B() { return B; }, T, L, ITEMS, ENEMIES, startBattle, newRun, Bag, makeItem, mergeInto, spawnEnemy, goMap, chooseNode };
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(boot) : boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
