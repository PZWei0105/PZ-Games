<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>鋼骸 STEELBONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Ops+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* layout concept: full-bleed night canvas; comic-panel overlays with ink borders, slanted cuts, halftone and hard offset shadows */
:root {
  --ink: #14101f; --paper: #f3e9d3; --paper2: #e6d8b8; --yellow: #ffc21f; --yellow-hi: #ffe27a; --orange: #ff5b1f; --ember: #ff2e12;
  --cyan: #5cf2e8; --red: #e8352e; --night: #1b1729; --panel: #241d36; --panel2: #2f2645; --muted: #a49cb8; --white: #fffaf0;
  --f-cjk: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
  --f-comic: "Bangers", "Impact", "Arial Black", sans-serif;
  --f-stencil: "Black Ops One", "Arial Black", Impact, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--white); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body { font-family: var(--f-cjk); font-size: 15px; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; display: block; background: var(--night); }
#safeProbe { position: fixed; left: 0; top: 0; width: 0; height: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); visibility: hidden; pointer-events: none; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#ui > * { pointer-events: auto; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px); box-sizing: border-box; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
#ui > .screen.passthru, .screen.passthru { pointer-events: none; }
.screen.passthru > * { pointer-events: auto; }
.dim { background: rgba(10, 7, 18, .72); backdrop-filter: blur(2px); }
.halftone { background-image: radial-gradient(rgba(255,255,255,.06) 1.2px, transparent 1.4px); background-size: 7px 7px; }

/* buttons */
.btn { --c: var(--yellow); --t: var(--ink); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 22px; border: 3px solid var(--ink); background: var(--c); color: var(--t);
  font: 900 17px/1.1 var(--f-cjk); letter-spacing: .08em; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); box-shadow: none; cursor: pointer; transition: transform .08s; filter: drop-shadow(4px 4px 0 var(--ink)); }
.btn:active { transform: translate(2px, 2px); filter: drop-shadow(2px 2px 0 var(--ink)); }
.btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.btn.dark { --c: var(--panel2); --t: var(--white); }
.btn.cyan { --c: var(--cyan); }
.btn.red { --c: var(--red); --t: var(--white); }
.btn.ghost { --c: transparent; --t: var(--white); border-color: var(--white); filter: none; }
.btn[disabled] { --c: #4a4458; --t: #8f88a0; cursor: default; }
.btn .en { font-family: var(--f-comic); letter-spacing: .06em; font-weight: 400; font-size: 1.05em; }
.btn.big { min-height: 64px; font-size: 24px; padding: 10px 34px; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--panel2); color: var(--white); font: 900 18px var(--f-cjk); display: grid; place-items: center; cursor: pointer; filter: drop-shadow(3px 3px 0 var(--ink)); }

/* comic panels */
.panel { position: relative; background: var(--panel); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 14px; }
.panel.paper { background: var(--paper); color: var(--ink); }
.caption { display: inline-block; background: var(--yellow); color: var(--ink); border: 3px solid var(--ink); padding: 4px 12px; font-weight: 900; transform: rotate(-1.5deg); box-shadow: 3px 3px 0 var(--ink); }
.title { font: 900 28px/1.1 var(--f-cjk); letter-spacing: .06em; text-wrap: balance; margin: 0; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); }
.sub { color: var(--muted); font-size: 13px; letter-spacing: .06em; }
.en-title { font-family: var(--f-comic); letter-spacing: .08em; font-weight: 400; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border: 2px solid var(--ink); font: 900 12px var(--f-cjk); color: var(--ink); background: var(--c, #ddd); border-radius: 2px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.money { display: flex; gap: 8px; align-items: center; }
.money span { display: inline-flex; align-items: center; gap: 5px; background: var(--ink); padding: 4px 10px 4px 8px; border: 2px solid #3a3150; font: 15px var(--f-stencil); }
.money i { width: 14px; height: 14px; display: inline-block; border-radius: 50%; background: #c3c9d6; border: 2px solid #6a7284; }
.money i.tk { border-radius: 2px; background: var(--orange); border-color: var(--ink); transform: rotate(8deg); }

/* hangar */
#hangar { justify-content: space-between; }
.logo { margin-top: 6px; text-align: center; pointer-events: none; }
.logo .cn { font: 900 clamp(54px, 15vw, 96px)/.95 var(--f-cjk); letter-spacing: .02em; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--ink), 8px 8px 0 rgba(255,91,31,.9); transform: skew(-8deg) rotate(-3deg); display: inline-block; }
.logo .en { font: clamp(22px, 6vw, 34px)/1 var(--f-comic); letter-spacing: .2em; color: var(--white); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); transform: skew(-8deg); display: block; margin-top: 4px; }
.season-ribbon { display: inline-block; margin-top: 10px; background: var(--red); color: var(--white); border: 3px solid var(--ink); padding: 4px 16px; font-weight: 900; letter-spacing: .1em; transform: rotate(-2deg); box-shadow: 4px 4px 0 var(--ink); font-size: 14px; }
.menu { display: flex; flex-direction: column; gap: 12px; align-items: stretch; width: min(520px, 100%); margin: 0 auto; }
.menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { position: relative; min-height: 64px; border: 3px solid var(--ink); background: var(--panel2); color: var(--white); font: 900 15px var(--f-cjk); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 4px 4px 0 var(--ink); transform: rotate(var(--r, 0deg)); }
.tile small { font: 11px var(--f-comic); letter-spacing: .1em; color: var(--muted); }
.tile:active { transform: translate(2px, 2px) rotate(var(--r, 0deg)); box-shadow: 2px 2px 0 var(--ink); }
.tile .badge { position: absolute; top: -8px; right: -6px; background: var(--red); color: #fff; border: 2px solid var(--ink); font: 900 11px var(--f-cjk); padding: 0 6px; }
.tile.locked { color: #6f6880; }
.hint-tap { text-align: center; font-size: 12px; color: var(--muted); margin-top: -4px; pointer-events: none; }

/* chapter list */
.chap { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: center; cursor: pointer; margin-bottom: 14px; transform: rotate(var(--r, 0deg)); }
.chap .num { font: 46px/1 var(--f-stencil); color: var(--yellow); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); text-align: center; }
.chap h3 { margin: 0 0 2px; font: 900 19px var(--f-cjk); }
.chap.locked { opacity: .55; cursor: default; }
.chap .status { margin-top: 6px; }

/* level up */
#levelup { align-items: center; justify-content: center; gap: 14px; }
.lv-burst { font: clamp(40px, 11vw, 64px)/1 var(--f-comic); letter-spacing: .06em; color: var(--yellow); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink), 7px 7px 0 var(--orange); transform: rotate(-4deg); text-align: center; animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
.lv-sub { text-align: center; color: var(--white); font-weight: 900; letter-spacing: .1em; margin-top: -8px; }
.cards { display: flex; gap: 12px; width: min(980px, 100%); }
@media (max-aspect-ratio: 1/1) { .cards { flex-direction: column; } }
.card { flex: 1; min-width: 0; display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; align-items: start; text-align: left; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 12px; cursor: pointer; transform: rotate(var(--r, 0deg)); animation: deal .35s both; font-family: var(--f-cjk); }
.card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; } .card:nth-child(4) { animation-delay: .18s; }
.card:hover, .card:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
.card:active { transform: translate(3px, 3px) rotate(var(--r, 0deg)); box-shadow: 3px 3px 0 var(--ink); }
.card img { width: 64px; height: 64px; grid-row: span 3; }
.card .nm { font: 900 18px/1.2 var(--f-cjk); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .lv { font: 14px var(--f-stencil); color: #6a5a40; }
.card .ds { font-size: 14px; line-height: 1.45; color: #2a2236; }
.card .syn { grid-column: 1 / -1; margin-top: 6px; background: var(--ink); color: var(--yellow); padding: 5px 9px; font-weight: 900; font-size: 13px; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.card .new { background: var(--red); color: #fff; padding: 0 6px; font-size: 11px; border: 2px solid var(--ink); }
.tagbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.tagbar .chip { font-size: 13px; }
.reroll { margin-top: 2px; }

/* dialogue */
#dialog { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 112px); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); pointer-events: none; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
#dialog.low { top: calc(env(safe-area-inset-top, 0px) + 172px); }
.balloon { position: relative; background: var(--white); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 9px 14px; font-weight: 700; font-size: 15px; line-height: 1.45; box-shadow: 4px 4px 0 rgba(20, 16, 31, .9); animation: pop .22s cubic-bezier(.2, 1.6, .4, 1); max-width: 100%; }
.balloon.radio { border-style: dashed; background: #e9fbff; }
.balloon .who { position: absolute; top: -14px; left: 12px; background: var(--ink); color: var(--c, #fff); font: 900 12px var(--f-cjk); padding: 1px 8px; letter-spacing: .08em; }
.balloon.boss { background: #2a0e12; color: #ffd0c8; }

/* hint caption */
#hint { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); transform: rotate(-1.5deg); white-space: nowrap; font-size: 14px; pointer-events: none; background: var(--yellow); color: var(--ink); border: 3px solid var(--ink); padding: 7px 14px; font-weight: 900; box-shadow: 4px 4px 0 var(--ink); max-width: calc(100% - 40px); text-align: center; animation: pop .25s; }

/* toast */
#toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 160px); transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast { background: var(--ink); color: var(--yellow); border: 2px solid var(--yellow); padding: 6px 14px; font-weight: 900; animation: pop .25s; text-align: center; }
.toast b { color: var(--white); }

/* results */
.result-head { text-align: center; margin: auto 0 12px; }
#results { justify-content: center; }
#results > .row { margin-bottom: auto; }
.result-head .big { font: clamp(40px, 10vw, 64px)/1 var(--f-comic); letter-spacing: .06em; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
.statgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--ink); padding: 8px 10px; border: 2px solid #3a3150; }
.stat b { display: block; font: 22px var(--f-stencil); color: var(--yellow); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }
.loot { display: flex; gap: 10px; flex-wrap: wrap; }

/* relic */
.relic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.relic { position: relative; aspect-ratio: 1 / 1.15; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 4px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); font-size: 12px; font-weight: 900; text-align: center; line-height: 1.2; }
.relic canvas, .relic img { width: 58px; height: 58px; }
.relic.locked { background: #3a3448; color: #7c7490; }
.relic .lvb { position: absolute; top: -8px; left: -6px; background: var(--ink); color: var(--yellow); font: 11px var(--f-stencil); padding: 1px 5px; }
.relic.eq { outline: 4px solid var(--cyan); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { aspect-ratio: 1; border: 3px dashed #5a5070; display: grid; place-items: center; color: #6f6880; font-weight: 900; font-size: 12px; background: rgba(0,0,0,.2); cursor: pointer; }
.slot.f { border-style: solid; border-color: var(--ink); background: var(--paper); }
.lore { font-size: 14px; line-height: 1.6; color: #3a2e2a; background: rgba(0,0,0,.05); padding: 8px 10px; border-left: 4px solid var(--ink); }
.setline { font-size: 13px; padding: 6px 8px; background: rgba(0,0,0,.25); margin-top: 4px; }
.setline.on { background: var(--ink); color: var(--yellow); }

/* modal */
.modal-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal { width: min(460px, 100%); max-height: calc(100% - 24px); overflow-y: auto; }

/* season */
.track { display: flex; gap: 10px; overflow-x: auto; padding: 8px 4px 16px; touch-action: pan-x; scroll-snap-type: x proximity; }
.tier { flex: 0 0 104px; scroll-snap-align: start; border: 3px solid var(--ink); background: var(--panel2); padding: 8px 6px; text-align: center; box-shadow: 3px 3px 0 var(--ink); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.tier .n { font: 20px var(--f-stencil); color: var(--muted); }
.tier.reached { background: var(--paper); color: var(--ink); }
.tier.reached .n { color: var(--ink); }
.tier .rw { font-size: 12px; font-weight: 900; min-height: 34px; display: grid; place-items: center; }
.xpbar { height: 14px; background: var(--ink); border: 2px solid #3a3150; position: relative; }
.xpbar i { position: absolute; inset: 2px auto 2px 2px; background: var(--cyan); }

/* affixes */
.affix { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px; border: 3px solid var(--ink); background: var(--panel2); cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
.affix.on { background: var(--red); }
.affix b { font-size: 16px; }
.affix small { grid-column: 1; color: #ddd3ee; font-size: 12px; }
.affix .heat { grid-row: span 2; font: 18px var(--f-stencil); color: var(--yellow); }

/* gacha */
.machine { height: 200px; position: relative; }
.odds { font-size: 12px; color: #d8d0e8; width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.odds td { padding: 3px 6px; border-bottom: 1px solid #3a3150; }
.reveal { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.reveal .relic { width: 96px; animation: flip .5s both; }
.reveal .relic.rare { background: linear-gradient(160deg, #fff6c8, #ffc21f); }

/* settings */
.setrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #3a3150; }
.setrow input[type=range] { width: 160px; accent-color: var(--yellow); }
.toggle { min-width: 64px; }

/* comic (story) */
#comicUI { justify-content: flex-end; align-items: flex-end; pointer-events: none; }
#comicUI .row { pointer-events: auto; }

@keyframes pop { from { transform: scale(.4) rotate(-6deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes deal { from { transform: translateY(40px) rotate(8deg); opacity: 0; } to { opacity: 1; } }
@keyframes flip { from { transform: rotateY(90deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }

</style>

<script>
/* ---- 00_util.js ---- */
'use strict';
/* ===== 鋼骸 STEELBONE — utilities ===== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smooth = t => t * t * (3 - 2 * t);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = (t, s = 1.7) => { t -= 1; return t * t * ((s + 1) * t + s) + 1; };
const easeInOutBack = (t, s = 1.4) => {
  const c2 = s * 1.525;
  return t < .5 ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
               : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
};
const easeOutElastic = t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s = 0) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 1442695041;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  const u = smooth(xf), v = smooth(yf);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, s = 0, oct = 4) {
  let v = 0, a = .5, f = 1;
  for (let i = 0; i < oct; i++) { v += a * vnoise(x * f, y * f, s + i * 17); f *= 2.03; a *= .5; }
  return v / (1 - Math.pow(.5, oct));
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
function hexRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbHex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return rgbHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
function rgba(hex, a) { const c = hexRgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

/* ---- comic palette ---- */
const PAL = {
  ink: '#14101f',
  paper: '#f3e9d3',

/* ---- halftone pattern tiles (cached per ctx) ---- */
const _patternCache = new Map();
function halftoneTile(size = 6, r = 1.4, color = PAL.ink) {
  const key = size + '|' + r + '|' + color;
  if (_patternCache.has(key)) return _patternCache.get(key);
  const c = makeCanvas(size * 2, size * 2), g = c.getContext('2d');
  g.fillStyle = color;
  const pts = [[size * .5, size * .5], [size * 1.5, size * 1.5]];
  for (const [x, y] of pts) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
  _patternCache.set(key, c);
  return c;
}

/* ---- tiny object pool helper ---- */
class Pool {
  constructor(make, n = 64) { this.make = make; this.free = []; for (let i = 0; i < n; i++) this.free.push(make()); }
  get() { return this.free.pop() || this.make(); }
  put(o) { this.free.push(o); }
}

/* ---- spatial hash for ground-plane queries ---- */
class SpatialHash {
  constructor(cell = 64) { this.cell = cell; this.map = new Map(); }
  clear() { this.map.clear(); }
  key(cx, cy) { return (cx & 0xffff) | ((cy & 0xffff) << 16); }
  insert(o) {
    const cx = Math.floor(o.x / this.cell), cy = Math.floor(o.y / this.cell);
    const k = this.key(cx, cy);
    let b = this.map.get(k);
    if (!b) { b = []; this.map.set(k, b); }
    b.push(o);
  }
  query(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const b = this.map.get(this.key(cx, cy));
      if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
    return out;
  }
}

/* ---- crop transparent margins ---- */
function trimCanvas(c, pad = 2) {
  const g = c.getContext('2d');
  const { width: w, height: h } = c;
  let data;
  try { data = g.getImageData(0, 0, w, h).data; } catch (e) { return { c, x0: 0, y0: 0 }; }
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    const row = y * w * 4;
    for (let x = 0; x < w; x++) {
      if (data[row + x * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
  }
  if (x1 < 0) return { c: makeCanvas(1, 1), x0: 0, y0: 0 };
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  const o = makeCanvas(x1 - x0 + 1, y1 - y0 + 1);
  o.getContext('2d').drawImage(c, -x0, -y0);
  return { c: o, x0, y0 };
}

/* ---- safe storage ---- */
const Store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};

'use strict';
/* ===== SAVE: local storage + optional per-viewer cloud doc (artifact db capability) ===== */
const SAVE = (() => {
  const KEY = 'steelbone.save.v1';
  const defaults = () => ({
    v: 1, savedAt: 0,
    scrap: 0, tickets: 1,
    chapters: { 1: { unlocked: true, cleared: false, best: 0 }, 2: { unlocked: false, cleared: false, best: 0 }, 3: { unlocked: false }, 4: { unlocked: false }, 5: { unlocked: false } },
    night: { unlocked: false, best: 0, bestHeat: 0 },
    seen: {},
    relics: {}, // id -> {lv, copies}
    equipped: [],
    unlocked: ['cannon', 'flame', 'coil', 'rocket', 'ram', 'exhaust', 'armor', 'cooling', 'magnet'],
    season: { xp: 0, claimed: [] },
    paint: 'yellow', paints: ['yellow'],
    pity: 0,
    settings: { sfx: .8, music: .55, shake: true, vibe: true, hints: true, quality: 'auto' },
    stats: { runs: 0, kills: 0, deaths: 0, bosses: 0 },
  });
  let data = defaults();
  let cloud = null, uid = null, writing = false, dirty = false, saveTimer = null;
  function merge(base, src) {
    for (const k in src) {
      if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], src[k]);
      else base[k] = src[k];
    }
    return base;
  }
  function load() {
    const s = Store.get(KEY);
    if (s && s.v === 1) data = merge(defaults(), s);
    return data;
  }
  function save(immediate) {
    data.savedAt = Date.now();
    Store.set(KEY, data);
    if (!cloud) return;
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushCloud, immediate ? 50 : 1500);
  }
  async function pushCloud() {
    if (!cloud || !uid || writing || !dirty) return;
    writing = true; dirty = false;
    try { await cloud.doc('data/users/' + uid + '/steelbone').set({ json: JSON.stringify(data), savedAt: data.savedAt }); }
    catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) cloud = null; }
    writing = false;
    if (dirty) pushCloud();
  }
  async function connectCloud(onUpdate) {
    try {
      if (!window.claude || !window.claude.use) return;
      const user = await window.claude.use('user');
      const db = await window.claude.use('db');
      if (!user || !db) return;
      uid = await user.id();
      if (!uid) return;
      cloud = db;
      const snap = await db.doc('data/users/' + uid + '/steelbone').get();
      if (snap && snap.exists) {
        const body = snap.data();
        if (body && body.json && (body.savedAt || 0) > (data.savedAt || 0)) {
          const remote = JSON.parse(body.json);
          if (remote && remote.v === 1) { data = merge(defaults(), remote); Store.set(KEY, data); if (onUpdate) onUpdate(); }
        } else if ((data.savedAt || 0) > 0) { dirty = true; pushCloud(); }
      } else if ((data.savedAt || 0) > 0) { dirty = true; pushCloud(); }
    } catch (e) { cloud = null; }
  }
  function reset() { data = defaults(); save(true); }
  return { load, save, connectCloud, reset, get data() { return data; }, set data(v) { data = v; } };
})();

    g.fillRect(tx - 3 * d, tb - th - 40 * d, 6 * d, 40 * d);
    g.fillStyle = 'rgba(92,242,232,.5)';
    for (let i = 0; i < 30; i++) g.fillRect(tx - 10 * d + (i % 3) * 8 * d, tb - th + 20 * d + Math.floor(i / 3) * 26 * d, 3 * d, 8 * d);
    // floor
    const fy = fy0;
    const fg = g.createLinearGradient(0, fy, 0, Hh); fg.addColorStop(0, '#2a2438'); fg.addColorStop(1, '#141020');
    g.fillStyle = fg; g.fillRect(0, fy, W, Hh - fy);
    g.fillStyle = PAL.ink; g.fillRect(0, fy - 3 * d, W, 6 * d);
    g.save(); g.beginPath(); g.rect(0, fy + 3 * d, W, 12 * d); g.clip();
    for (let x = -20 * d; x < W; x += 28 * d) { g.fillStyle = PAL.yellow; g.beginPath(); g.moveTo(x, fy + 15 * d); g.lineTo(x + 14 * d, fy + 15 * d); g.lineTo(x + 26 * d, fy + 3 * d); g.lineTo(x + 12 * d, fy + 3 * d); g.fill(); }
    g.restore();
    H.sky = c;
  }
  function hangarLayout() {
    const d = Cam.dpr, W = Cam.W, Hh = Cam.H;
    H.layT = (H.layT || 0) - 1;
    if (H.lay && H.layT > 0 && H.lay.key === W + 'x' + Hh) return H.lay;
    H.layT = 20;
    const st = document.querySelector('#hangar .hangar-stage'), hint = document.querySelector('#hangar .hint-tap');
    let top = Hh * .3, bot = Hh * .74;
    if (st && hint) { const r = st.getBoundingClientRect(), rh = hint.getBoundingClientRect(); top = r.top * d; bot = (rh.top - 4) * d; }
    const avail = Math.max(120 * d, bot - top);
    const f = Math.min(W / 250, avail / 150, 3.4 * d);
    const lay = { key: W + 'x' + Hh, feet: bot - 6 * d, f, top };
    if (!H.lay || Math.abs(H.lay.feet - lay.feet) > 2 || H.lay.key !== lay.key) H.skyKey = '';
    H.lay = lay;
    return lay;
  }
  function drawHangar(g, now, dt) {
    const lay = hangarLayout();
    buildSky();
    g.drawImage(H.sky, 0, 0);
    const W = Cam.W, Hh = Cam.H, d = Cam.dpr;
    // tower beacon sweep
    const tx = W * .5, ty = Hh * .1 - 40 * d;
    H.sweepT += dt;
    const sw = Math.sin(H.sweepT * .5) * .9;
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const s of [-1, 1]) {
      const a = -Math.PI / 2 + sw * s * .8 + (s > 0 ? .6 : -.6);
      const L = Math.max(W, Hh);
      const gr = g.createLinearGradient(tx, ty, tx + Math.cos(a) * L, ty + Math.sin(a) * L);
      gr.addColorStop(0, 'rgba(92,242,232,.35)'); gr.addColorStop(1, 'rgba(92,242,232,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + Math.cos(a - .06) * L, ty + Math.sin(a - .06) * L); g.lineTo(tx + Math.cos(a + .06) * L, ty + Math.sin(a + .06) * L); g.closePath(); g.fill();
    }
    Render.glow(tx, ty, 26 * d, 'rgba(160,255,250,.9)');
    g.restore();
    // spotlight on mech
    const mx = W / 2, my = lay.feet;
    g.save(); g.globalCompositeOperation = 'lighter';
    const sg = g.createRadialGradient(mx, my, 0, mx, my, Math.min(W, Hh) * .4);
    sg.addColorStop(0, 'rgba(255,200,120,.22)'); sg.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = sg; g.beginPath(); g.ellipse(mx, my, Math.min(W, Hh) * .45, Math.min(W, Hh) * .14, 0, 0, TAU); g.fill();
    g.restore();
    // mech
    if (H.morph) { H.mt += dt / .6; if (H.mt >= 1) { H.morph = false; H.form = H.dir > 0 ? 'tank' : 'robot'; FX.state.flash = 0; } }
    H.k = H.morph ? (H.dir > 0 ? clamp(H.mt, 0, 1) : 1 - clamp(H.mt, 0, 1)) : (H.form === 'tank' ? 1 : 0);
    H.rot += dt * .35;
    const f = lay.f;
    const hop = H.morph ? Math.sin(clamp(H.mt, 0, 1) * Math.PI) * 18 : 0;
    g.fillStyle = 'rgba(6,4,12,.55)'; g.beginPath(); g.ellipse(mx, my, 80 * f, 80 * f * R3D.SA * .7, 0, 0, TAU); g.fill();
    const pose = MECH.pose(H.model, { k: H.k, dir: H.dir, t: now, walk: 0, walkAmt: 0, wheelSpin: now * 3 * H.k });
    // keep the whole silhouette standing on the floor line (the truck form is longer toward the camera)
    const ry = my + (H.yOff || 0);
    R3D.render(g, H.model, pose, { x: mx, y: ry, f, h: Math.PI / 2 + Math.sin(H.rot) * .7, zOff: hop });
    const bb = H.model._bounds;
    if (bb) { const want = Math.min(0, (H.yOff || 0) + (my + 12 * d - bb[3])); H.yOff = (H.yOff || 0) + (want - (H.yOff || 0)) * Math.min(1, dt * 9); }
    if (H.k < .5) { const hp = R3D.partPoint(H.model, 'head', [0, 12, 1], { x: mx, y: ry, f }); Render.glow(hp[0], hp[1], 18 * f, 'rgba(255,140,40,.6)'); }
    const bp = R3D.partPoint(H.model, 'beacon', [3, 0, 0], { x: mx, y: ry, f }); Render.glow(bp[0], bp[1], 26 * f, `rgba(255,150,40,${.3 + .35 * Math.max(0, Math.sin(now * 6))})`);
    // dust motes
    if (H.dust.length < 40) H.dust.push({ x: Math.random() * W, y: Math.random() * Hh, v: rnd(4, 14) * d, s: rnd(1, 2.6) * d });
    g.fillStyle = 'rgba(255,230,190,.4)';
    for (const p of H.dust) { p.y -= p.v * dt; p.x += Math.sin(now + p.y * .01) * .3; if (p.y < 0) { p.y = Hh; p.x = Math.random() * W; } g.fillRect(p.x, p.y, p.s, p.s); }
  }

  /* ================= CHAPTERS ================= */

  function showChapters() {

  const fmt = t => { t = Math.floor(t || 0); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

  function baseCfg() {

  /* ================= RUN EVENTS ================= */

      case 'lowHp': say('low_hp'); break;
      case 'synergy': toast(`模組連動：<b>${esc(data.name)}</b>　${esc(data.desc)}`, 3200); FX.text('COMBO!', Game.P.x, Game.P.y, 150, { style: 'krak', size: 1 }); AUDIO.sfx('relic'); break;
      case 'relicBox': toast('取得<b>藏品箱</b>：結算時開啟'); break;
      case 'death': setTimeout(() => endRun(false), 2300); break;
      case 'runOver': break;
      case 'kill':
        if (data.elite && S.relicFx.eliteOl) Game.P.overload = Math.min(100, Game.P.overload + S.relicFx.eliteOl);

  /* --- results --- */
  function endRun(victory, retreat) {
    const S = Game.S;
    if (!S.active) return;
    S.active = false;
    AUDIO.stopMusic();
    // the run's chatter and tutorial hints end with the run
    dialogQ = []; curDialog = null; hintT = 0;
    { const dl = $('#dialog'); if (dl) dl.innerHTML = ''; const hn = $('#hint'); if (hn) hn.remove(); }
    const fx = S.relicFx || {};
    const d = SAVE.data;
    let scrap = S.scrap;
    let bonus = 0, seasonXp = 0, firstClear = false;
    const loot = [];
    if (S.mode === 'chapter') {
      const ch = d.chapters[S.chapter];
      if (victory) {
        firstClear = !ch.cleared;
        bonus = 150 + (firstClear ? 300 : 0);
        ch.cleared = true; ch.best = ch.best ? Math.min(ch.best, S.t) : S.t;
        if (d.chapters[S.chapter + 1]) d.chapters[S.chapter + 1].unlocked = true;
        d.night.unlocked = true;
        // story relics
        const story = S.chapter === 1 ? ['badge', 'handle'] : S.chapter === 2 ? ['recorder', 'receipt'] : [];
        for (const id of story) if (!META.owned(id)) { META.grant(id); loot.push(id); }
        d.stats.bosses++;
      }
      seasonXp = Math.round(30 + S.t / 8 + S.kills / 25 + (victory ? 60 : 0));
    } else {
      bonus = Math.round(S.t / 60 * 22);
      seasonXp = Math.round((S.t / 60 * 26) * (1 + S.heat * .25) * (1 + (fx.nightBonus || 0)));
      if (S.t > d.night.best) d.night.best = S.t;
      d.night.bestHeat = Math.max(d.night.bestHeat || 0, S.heat);
    }
    if (!victory) scrap = Math.round(scrap * (retreat ? .6 : .8));
    scrap = Math.round((scrap + bonus) * (1 + (fx.scrapGain || 0)));
    // relic boxes: each gives a gacha-pool relic
    for (let i = 0; i < S.relicBoxes; i++) { const r = META.pull(1)[0]; loot.push(r.id); }
    const tierBefore = META.seasonTier();
    d.scrap += scrap; d.season.xp += seasonXp;
    d.stats.runs++; d.stats.kills += S.kills; if (!victory) d.stats.deaths++;
    SAVE.save(true);
    const tierAfter = META.seasonTier();
    const after = () => showResults({ victory, retreat, scrap, seasonXp, loot, firstClear, tierBefore, tierAfter });
    if (victory && S.mode === 'chapter') {
      const comicId = 'ch' + S.chapter + 'end';
      if (COMIC.has(comicId)) { playComic(comicId, after); return; }
    }
    after();
  }

    const n = screen('results', `
      <div class="result-head"><div class="big" style="color:${r.victory ? 'var(--yellow)' : 'var(--red)'}">${big}</div><div class="title" style="font-size:22px;margin-top:6px">${title}</div></div>

  function drawMachine(cv, shake) {
    const r = cv.getBoundingClientRect(); const d = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(10, r.width * d); cv.height = Math.max(10, r.height * d);
    const g = cv.getContext('2d'); g.scale(d, d);
    const W = r.width, Hh = r.height;
    g.fillStyle = '#1d1828'; g.fillRect(0, 0, W, Hh);
    // press
    const cx = W / 2, by = Hh * .82;
    g.fillStyle = '#3a3f52'; g.strokeStyle = PAL.ink; g.lineWidth = 3;
    g.fillRect(cx - 120, by, 240, 16); g.strokeRect(cx - 120, by, 240, 16);
    g.fillRect(cx - 110, 14, 20, by - 14); g.strokeRect(cx - 110, 14, 20, by - 14);
    g.fillRect(cx + 90, 14, 20, by - 14); g.strokeRect(cx + 90, 14, 20, by - 14);
    const py = shake ? by - 46 : 34;
    g.fillStyle = PAL.yellow; g.fillRect(cx - 90, py, 180, 34); g.strokeRect(cx - 90, py, 180, 34);
    g.save(); g.beginPath(); g.rect(cx - 88, py + 2, 176, 30); g.clip(); g.fillStyle = PAL.ink; for (let x = cx - 110; x < cx + 100; x += 22) { g.beginPath(); g.moveTo(x, py + 34); g.lineTo(x + 11, py + 34); g.lineTo(x + 30, py); g.lineTo(x + 19, py); g.fill(); } g.restore();
    g.fillStyle = '#aab2c2'; g.fillRect(cx - 8, 0, 16, py); g.strokeRect(cx - 8, -4, 16, py + 4);
    // scrap pile
    const R = mulberry32(5);
    for (let i = 0; i < 14; i++) { g.fillStyle = ['#7a7f90', '#9b4f2c', '#4fa3d9', '#5a5f70'][i % 4]; const w = 20 + R() * 30, hh = 8 + R() * 12; const x = cx - 80 + R() * 150, y = by - hh - (shake ? 0 : R() * 30); g.fillRect(x, y, w, hh); g.strokeRect(x, y, w, hh); }
    if (shake) { g.font = '40px Bangers, Impact, sans-serif'; g.fillStyle = PAL.yellow; g.strokeStyle = PAL.ink; g.lineWidth = 6; g.textAlign = 'center'; g.strokeText('KRSSH!', cx, Hh * .4); g.fillText('KRSSH!', cx, Hh * .4); }
  }

      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="close">完成</button></div>
    </div></div>`);
    root.appendChild(n);
    $('#vSfx', n).addEventListener('input', e => { s.sfx = +e.target.value; AUDIO.setVol('sfx', s.sfx); SAVE.save(); });
    $('#vMus', n).addEventListener('input', e => { s.music = +e.target.value; AUDIO.setVol('music', s.music); SAVE.save(); });
    click(n, '[data-t]', b => { s[b.dataset.t] = !s[b.dataset.t]; SAVE.save(); n.remove(); showSettings(back); });
    click(n, '[data-q]', b => { s.quality = b.dataset.q; SAVE.save(); App.resize(); n.remove(); showSettings(back); });
    click(n, '[data-act=fs]', () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => toast('這個瀏覽器不允許全螢幕')); } catch (e) { } setTimeout(() => { n.remove(); showSettings(back); }, 350); });
    click(n, '[data-act=install]', async () => { const ev = App.installPrompt; if (!ev) return; App.installPrompt = null; try { ev.prompt(); await ev.userChoice; } catch (e) { } n.remove(); showSettings(back); });
    let armed = false;
    click(n, '[data-act=reset]', b => { if (!armed) { armed = true; b.textContent = '再按一次確認'; return; } SAVE.reset(); n.remove(); showHangar(); toast('存檔已重置'); });
    click(n, '[data-act=close]', () => { n.remove(); if (back) back(); });
  }

  /* ================= COMIC hook ================= */
  function playComic(id, done) {
    clear();
    App.setState('comic');
    AUDIO.init();
    COMIC.play(id, () => { SAVE.data.seen[id] = true; SAVE.save(); clear(); done && done(); });
  }
  function onResize() { H.skyKey = ''; }
  return { init, showHangar, startChapter, startNight, pause, playComic, drawHangar, drawRunOverlay, refresh, onResize, say, hint, toast, endRun, screen, clear, h, click };
})();

/* ---- 12_main.js ---- */
'use strict';
/* ===== App: boot, resize, main loop, run flow ===== */
const App = (() => {
  let canvas, g, last = 0, state = 'boot', running = false;
  const qs = new URLSearchParams(location.search);
  const dev = qs.get('dev');
  let fpsAcc = 0, fpsN = 0, fps = 60, lowFpsT = 0, qualityScale = 1;

  function computeZoom(cw, ch) {
    // keep the mech big: ~12-13% of screen height, never narrower than ~400 world units across
    return clamp(Math.min(ch / 844, cw / 400), .72, 1.55);
  }
  function resize() {
    const cw = window.innerWidth, ch = window.innerHeight;
    const q = SAVE.data.settings.quality;
    const maxDpr = q === 'low' ? 1 : q === 'high' ? 2.5 : 2;
    const dpr = Math.min(window.devicePixelRatio || 1, maxDpr) * qualityScale;
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    Cam.dpr = dpr; Cam.W = canvas.width; Cam.H = canvas.height;
    Cam.baseZ = computeZoom(cw, ch);
    if (!Game.S.active) Cam.z = Cam.baseZ;
    HUD.layout();
    if (UI.onResize) UI.onResize();
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (ts - last) / 1000 || .016);
    last = ts;
    const now = ts / 1000;
    // fps tracking for auto quality
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; autoQuality(); }
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (state === 'run' || state === 'pause' || state === 'levelup') {
      if (state === 'run') {
        Game.setInput(HUD.readInput());
        const steps = dev ? Math.max(1, +(qs.get('ts') || 1)) : 1;
        for (let i = 0; i < steps && state === 'run'; i++) { Game.update(dt); Director.tick(dt); }
      }
      Render.scene(now);
      HUD.draw(g, now);
      if (UI.drawRunOverlay) UI.drawRunOverlay(g, now);
    } else if (state === 'results' && Game.S.t > 0) {
      Render.scene(now);
    } else if (state === 'hangar' || state === 'menu') {
      UI.drawHangar(g, now, dt);
    } else if (state === 'comic') {
      COMIC.draw(g, now, dt);
    } else {
      g.fillStyle = PAL.night; g.fillRect(0, 0, Cam.W, Cam.H);
    }
  }
  function autoQuality() {
    if (SAVE.data.settings.quality !== 'auto' || state !== 'run') return;
    if (fps < 42) { lowFpsT++; if (lowFpsT >= 3 && qualityScale > .6) { qualityScale = Math.max(.6, qualityScale - .15); resize(); lowFpsT = 0; } }
    else lowFpsT = 0;
  }
  function setState(s) {
    state = s;
    HUD.enabled = s === 'run';
    document.body.dataset.state = s;
  }
  async function boot() {
    canvas = document.getElementById('game');
    g = canvas.getContext('2d');
    Render.init(canvas);
    SAVE.load();
    AUDIO.vol.sfx = SAVE.data.settings.sfx; AUDIO.vol.music = SAVE.data.settings.music;
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    resize();
    HUD.attach(canvas, () => UI.pause());
    document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') UI.pause(); });
    // fonts
    try { await Promise.race([Promise.all([document.fonts.load('16px "Black Ops One"'), document.fonts.load('900 16px "Noto Sans TC"', '鋼骸')]), new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
    UI.init();
    requestAnimationFrame(t => { last = t; frame(t); });
    SAVE.connectCloud(() => UI.refresh && UI.refresh());
    if (dev === 'run') UI.startChapter(Number(qs.get('ch') || 1), { skipStory: true });
    else if (dev === 'night') {
      UI.startNight((qs.get('aff') || '').split(',').filter(Boolean));
      if (qs.get('t')) Game.S.t = +qs.get('t');
      if (qs.get('lv')) { const L = +qs.get('lv'); for (const m of ['cannon', 'flame', 'coil', 'rocket', 'ram', 'armor']) Game.S.mods[m] = Math.min(5, Math.ceil(L / 3)); Game.recomputeTags(); Game.P.hp = Game.P.maxHp; }
    }
    else if (dev === 'comic') UI.playComic(qs.get('id') || 'prologue', () => UI.showHangar());
    else UI.showHangar();
  }
  return { boot, setState, resize, get state() { return state; }, get fps() { return fps; }, get canvas() { return canvas; }, dev };
})();
window.addEventListener('DOMContentLoaded', () => App.boot());
// standalone web build: install prompt + offline cache (inert inside the artifact frame, which has no manifest)
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); App.installPrompt = e; });
window.addEventListener('load', () => {
  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.top === window && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { }
});
