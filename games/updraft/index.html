<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>扶搖 UPDRAFT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: ticket-glass panels floating over a live real-time sky; one task per screen; thumb-zone dock and action bar */
:root {
  --ink: #0D1A47;
  --ink-2: #3A4C86;
  --ink-3: #6B7AA6;
  --royal: #1D4ED8;
  --royal-deep: #0F2C8A;
  --sky: #5BB4FF;
  --gold: #FFC531;
  --gold-2: #FFE08A;
  --gold-deep: #D98E00;
  --gold-ink: #6E4300;
  --glass: rgba(248, 251, 255, 0.9);
  --glass-2: rgba(236, 244, 255, 0.82);
  --glass-line: rgba(255, 255, 255, 0.96);
  --hair: rgba(29, 78, 216, 0.13);
  --up: #E5364F;
  --down: #0C9D63;
  --term: #0A1842;
  --term-2: #12296A;
  --term-line: rgba(140, 170, 255, 0.16);
  --r0: #8D9BB8;
  --r1: #3E8BFF;
  --r2: #A35BFF;
  --r3: #F2A900;
  --bg: #3F8FE6;
  --shadow: 0 14px 30px -16px rgba(13, 26, 71, 0.55);
  --f-display: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-body: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "Noto Sans CJK TC", sans-serif;
  --f-seal: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC", serif;
  --hud-h: 64px;
  --dock-h: 66px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input, textarea { font: inherit; user-select: text; -webkit-user-select: text; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.ic { width: 22px; height: 22px; flex: none; }
[hidden] { display: none !important; }

/* ---------- stage layers ---------- */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }

/* ---------- HUD ---------- */
#hud {
  position: relative; z-index: 20; flex: none;
  padding: calc(8px + env(safe-area-inset-top, 0px)) var(--gut-r) 8px var(--gut-l);
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, rgba(10, 24, 72, 0.55), rgba(10, 24, 72, 0));
}
.hud-me { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.hud-me .emb { filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.35)); flex: none; }
.hud-name { display: flex; flex-direction: column; min-width: 0; }
.hud-rank {
  align-self: flex-start; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--gold-ink);
  background: linear-gradient(180deg, #FFE9A6, #FFC531); padding: 1px 8px; border-radius: 99px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset;
}
.hud-title { color: #fff; font-weight: 900; font-size: 16px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); white-space: nowrap; }
.hud-cash {
  display: flex; flex-direction: column; align-items: flex-end; padding: 5px 12px 5px 10px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(228, 239, 255, 0.92)); box-shadow: var(--shadow);
  border: 1px solid var(--glass-line); min-width: 0;
}
.hud-cash .row { display: flex; align-items: center; gap: 6px; }
.hud-cash b { font-family: var(--f-num); font-weight: 800; font-size: 25px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.hud-cash small { font-size: 11px; color: var(--ink-2); font-weight: 700; }
.hud-cash small .num { font-size: 12.5px; }
.hud-cash.bump b { animation: bump 0.45s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.14); color: var(--gold-deep); } 100% { transform: scale(1); } }
.hud-btn {
  width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; color: #fff;
  background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.35); flex: none;
}

/* ---------- screens ---------- */
#screens { position: relative; flex: 1; min-height: 0; }
.screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding: 4px var(--gut-r) 24px var(--gut-l); scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.enter { animation: scrIn 0.28s cubic-bezier(.2, .8, .2, 1); }
@keyframes scrIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ---------- poster titles ---------- */
.ptitle { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 6px 2px 2px; }
.poster {
  position: relative; display: inline-block; font-family: var(--f-display); font-weight: 900; font-size: 34px; line-height: 1;
  letter-spacing: 0.04em; transform: skewX(-8deg); white-space: nowrap;
}
.poster > span { position: relative; z-index: 1; background: linear-gradient(180deg, #2E62E8 10%, #0B2A86 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.poster::before {
  content: attr(data-t); position: absolute; left: 0; top: 0; z-index: 0; color: #fff;
  -webkit-text-stroke: 7px #fff; filter: drop-shadow(0 4px 8px rgba(10, 30, 100, 0.35));
}
.poster.gold > span { background: linear-gradient(180deg, #FFF3C4 0%, #FFC531 55%, #D98E00 100%); -webkit-background-clip: text; background-clip: text; }
.poster.gold::before { -webkit-text-stroke: 7px #0B1A44; }
.ptag {
  display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-weight: 900; font-size: 13px; color: var(--ink);
}
.ptag em { font-style: normal; background: var(--royal-deep); color: #fff; padding: 1px 8px; letter-spacing: 0.08em; transform: skewX(-8deg); }
.ptag span { letter-spacing: 0.12em; color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45); }

/* ---------- glass cards ---------- */
.card {
  position: relative; background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(236, 244, 255, 0.9));
  border: 1px solid var(--glass-line); border-radius: 20px; box-shadow: var(--shadow);
}
.card.pad { padding: 14px; }
.ticket::after {
  content: ""; position: absolute; inset: 6px; border: 1.5px dashed rgba(29, 78, 216, 0.22); border-radius: 15px; pointer-events: none;
}
.label { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: var(--ink-2); }
.sub { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 800;
  background: rgba(29, 78, 216, 0.1); color: var(--royal-deep); white-space: nowrap;
}
.chip.gold { background: linear-gradient(180deg, #FFEDB3, #FFD15A); color: var(--gold-ink); }
.chip.red { background: rgba(229, 54, 79, 0.12); color: var(--up); }
.chip.green { background: rgba(12, 157, 99, 0.12); color: var(--down); }
.chip.dark { background: var(--ink); color: #fff; }
.bar { position: relative; height: 8px; border-radius: 99px; background: rgba(13, 26, 71, 0.1); overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, #FFB800, #FFE07A); }
.bar.blue > i { background: linear-gradient(90deg, #2E62E8, #6FB2FF); }
.bar.thin { height: 5px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 16px; border-radius: 15px;
  font-weight: 900; font-size: 15px; letter-spacing: 0.02em; position: relative; transition: transform 0.08s ease, filter 0.2s;
}
.btn:active { transform: translateY(2px) scale(0.98); }
.btn-gold {
  color: var(--gold-ink); background: linear-gradient(180deg, #FFF0B8 0%, #FFD24D 45%, #F5B400 100%);
  box-shadow: 0 3px 0 #C48200, 0 10px 18px -8px rgba(196, 130, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.8);
}
.btn-blue {
  color: #fff; background: linear-gradient(180deg, #4F86FF 0%, #1D4ED8 60%, #1640B8 100%);
  box-shadow: 0 3px 0 #0F2C8A, 0 10px 18px -8px rgba(15, 44, 138, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.btn-red { color: #fff; background: linear-gradient(180deg, #FF6A7E, #E5364F 60%, #C42139); box-shadow: 0 3px 0 #96142A, inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.btn-green { color: #fff; background: linear-gradient(180deg, #3FD497, #0C9D63 60%, #08834F); box-shadow: 0 3px 0 #05623A, inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.btn-ghost { color: var(--royal-deep); background: rgba(29, 78, 216, 0.08); border: 1px solid rgba(29, 78, 216, 0.16); }
.btn-dark { color: #fff; background: rgba(13, 26, 71, 0.85); }
.btn[disabled], .btn.off { filter: grayscale(0.85) brightness(1.05); opacity: 0.55; box-shadow: none; pointer-events: none; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 12px; }
.btn .num { font-size: 1.12em; font-weight: 800; }
.btn small { font-weight: 700; font-size: 11px; opacity: 0.9; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 197, 49, 0.0), 0 3px 0 #C48200; } 50% { box-shadow: 0 0 0 8px rgba(255, 197, 49, 0.35), 0 3px 0 #C48200; } }
.hilite { animation: hilite 1.6s ease-in-out 2; }
@keyframes hilite { 0%, 100% { box-shadow: var(--shadow); } 50% { box-shadow: 0 0 0 4px var(--gold), var(--shadow); } }

/* ---------- segmented ---------- */
.seg { display: flex; padding: 4px; gap: 4px; border-radius: 15px; background: rgba(13, 26, 71, 0.32); backdrop-filter: blur(8px); }
.seg button { flex: 1; min-height: 38px; border-radius: 11px; font-weight: 800; font-size: 13.5px; color: rgba(255, 255, 255, 0.86); position: relative; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.35); }
.seg button .dot { position: absolute; top: 6px; right: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 2px #fff; display: inline-block; }

/* ---------- dock ---------- */
#dock {
  position: relative; z-index: 20; flex: none; display: flex; gap: 2px;
  padding: 6px var(--gut-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gut-l);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(232, 241, 255, 0.97));
  border-top: 1px solid #fff; box-shadow: 0 -10px 30px -18px rgba(13, 26, 71, 0.6);
}
#dock button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0 3px; border-radius: 14px; color: var(--ink-3); position: relative; min-width: 0; }
#dock .ic { width: 25px; height: 25px; }
#dock span { font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; }
#dock button.on { color: var(--ink); }
#dock button.on::before { content: ""; position: absolute; inset: 0 6px; border-radius: 14px; background: linear-gradient(180deg, #FFF1BF, #FFD24D); z-index: -1; box-shadow: 0 6px 14px -8px rgba(196, 130, 0, 0.9); }
#dock button.locked { opacity: 0.45; }
#dock button.locked .lk { position: absolute; top: 2px; right: calc(50% - 20px); width: 15px; height: 15px; color: var(--ink-2); }
#dock button .dot { position: absolute; top: 4px; right: calc(50% - 17px); }

/* ---------- home ---------- */
.city-wrap { position: relative; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l)); height: 262px; }
#city { width: 100%; height: 100%; display: block; }
.city-top { position: absolute; left: var(--gut-l); right: var(--gut-r); top: 4px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.act-chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 12px; border-radius: 99px; color: #fff; font-weight: 900;
  background: rgba(10, 24, 72, 0.55); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); font-size: 13px;
}
.act-chip em { font-style: normal; color: var(--gold-2); font-family: var(--f-num); letter-spacing: 0.12em; font-size: 11px; }
.mk-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: rgba(10, 24, 72, 0.55); color: #fff; font-size: 12px; font-weight: 800; border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); }
.mk-chip i { width: 8px; height: 8px; border-radius: 50%; background: #9AA6BA; }
.mk-chip i.open { background: #2EE59A; box-shadow: 0 0 0 3px rgba(46, 229, 154, 0.25); }
.advisor { display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; width: 100%; }
.advisor .ad-ic { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; flex: none; color: var(--gold-ink); background: linear-gradient(180deg, #FFF0B8, #FFC531); box-shadow: inset 0 1px 0 #fff, 0 6px 12px -6px rgba(196, 130, 0, 0.8); }
.advisor .ad-ic .ic { width: 26px; height: 26px; }
.advisor .ad-t { flex: 1; min-width: 0; }
.advisor .ad-t .label { color: var(--gold-deep); }
.advisor .ad-t b { display: block; font-size: 17px; font-weight: 900; line-height: 1.25; }
.advisor .ad-t .sub { display: block; margin-top: 1px; }
.advisor > .ic { color: var(--ink-3); }
.advisor .ad-go { flex: none; padding: 9px 14px; border-radius: 13px; font-weight: 900; font-size: 14px; color: var(--gold-ink); background: linear-gradient(180deg, #FFF0B8, #FFC531); box-shadow: inset 0 1px 0 #fff, 0 3px 0 #C48200; }
.advisor.inert { cursor: default; }
.advisor.inert:active { transform: none; }
.stat2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { padding: 12px 14px; }
.tile .v { font-family: var(--f-num); font-weight: 800; font-size: 26px; line-height: 1.05; color: var(--ink); margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 14px; color: var(--ink-3); font-weight: 700; }
.tile .bar { margin-top: 8px; }
.goal { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.goal-h { display: flex; align-items: center; gap: 10px; }
.goal-h .emb { flex: none; }
.goal-h b { font-size: 16px; font-weight: 900; display: block; }
.goal-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.goal-row .num { font-size: 16px; font-weight: 800; color: var(--ink); }
.rich { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; }
.rich .rk { font-family: var(--f-num); font-weight: 800; font-size: 32px; line-height: 1; color: var(--royal-deep); min-width: 52px; text-align: center; }
.rich .rk small { display: block; font-size: 11px; font-family: var(--f-body); color: var(--ink-3); font-weight: 800; letter-spacing: 0.1em; }
.actionbar {
  /* the scroller's 24px bottom padding deflates the sticky area, so offset by the same amount to sit flush on the dock */
  position: sticky; bottom: -24px; z-index: 5; margin: 6px calc(-1 * var(--gut-r)) -24px calc(-1 * var(--gut-l));
  padding: 10px var(--gut-r) 12px var(--gut-l); background: linear-gradient(180deg, rgba(232, 241, 255, 0), rgba(232, 241, 255, 0.94) 30%, #E8F1FF 72%);
}
.collect { width: 100%; min-height: 62px; border-radius: 20px; display: flex; flex-direction: column; gap: 4px; padding: 8px 16px; }
.collect .top { display: flex; align-items: center; gap: 8px; font-size: 17px; }
.collect .top .num { font-size: 24px; }
.collect .bar { width: 100%; height: 6px; background: rgba(110, 67, 0, 0.18); }
.collect .bar > i { background: linear-gradient(90deg, #8A5200, #C47A00); }
.event-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 2px solid rgba(255, 197, 49, 0.8); }
.event-card b { font-size: 16px; font-weight: 900; }
.event-card .row { display: flex; gap: 8px; }
.event-card .row .btn { flex: 1; flex-direction: column; gap: 0; line-height: 1.2; padding: 6px 8px; }

/* ---------- business cards ---------- */
.bulk { margin: 2px 0 2px; }
.dist-h { display: flex; align-items: center; gap: 8px; margin: 6px 2px -2px; color: #fff; font-weight: 900; font-size: 15px; letter-spacing: 0.08em; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35); }
.dist-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0)); }
.biz { display: flex; align-items: stretch; gap: 12px; padding: 10px; }
.biz .bi { position: relative; width: 76px; height: 76px; border-radius: 16px; flex: none; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8); background: #8EC5F5; }
.biz .bi .lv { position: absolute; left: 4px; bottom: 4px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
.biz .bi canvas { width: 100%; height: 100%; display: block; }
.biz .bm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.biz .bn { display: flex; align-items: center; gap: 6px; min-width: 0; }
.biz .bn b { font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv { font-family: var(--f-num); font-weight: 800; font-size: 13px; color: #fff; background: var(--royal-deep); border-radius: 7px; padding: 0 6px; line-height: 19px; flex: none; }
.biz .inc { font-family: var(--f-num); font-weight: 800; font-size: 21px; color: var(--ink); line-height: 1.05; }
.biz .inc small { font-size: 13px; color: var(--ink-3); font-weight: 700; }
.biz .ms { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--ink-3); }
.biz .ms .bar { flex: 1; }
.biz .bb { display: flex; flex-direction: column; justify-content: center; width: 104px; flex: none; }
.biz .bb .btn { flex-direction: column; gap: 1px; min-height: 60px; padding: 4px 6px; line-height: 1.12; font-size: 14px; }
.biz .bb .btn .cst { font-family: var(--f-num); font-size: 17px; font-weight: 800; }
.biz .bb .btn small { font-family: var(--f-num); font-size: 12px; font-weight: 700; opacity: .85; }
.biz.locked { opacity: 0.72; }
.btn.nocash { filter: grayscale(0.85) brightness(1.05); opacity: 0.55; box-shadow: none; }
.btn.carbuy { flex-direction: column; gap: 0; line-height: 1.15; }
.btn.carbuy .num { white-space: nowrap; }
@media (max-width: 380px) {
  .biz { gap: 10px; padding: 9px; }
  .biz .bi { width: 64px; height: 64px; border-radius: 14px; }
  .biz .bb { width: 96px; }
  .biz .inc { font-size: 19px; }
}
.biz.locked .bi { filter: grayscale(0.7) brightness(0.9); }
.mgr-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--down); }
.capbar { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--ink-3); }
.capbar .bar { flex: 1; height: 4px; }

/* ---------- staff ---------- */
.idc {
  position: relative; display: flex; gap: 10px; padding: 10px; border-radius: 18px; overflow: hidden; width: 100%; text-align: left;
  background: linear-gradient(160deg, #FFFFFF, #EEF4FF); border: 2px solid var(--rc, var(--r0)); box-shadow: var(--shadow);
}
.idc.r1 { --rc: var(--r1); } .idc.r2 { --rc: var(--r2); } .idc.r3 { --rc: var(--r3); }
.idc.r3::before { content: ""; position: absolute; inset: -40%; background: conic-gradient(from 0deg, rgba(255, 220, 120, 0) 0deg, rgba(255, 220, 120, 0.35) 40deg, rgba(160, 120, 255, 0.25) 90deg, rgba(255, 220, 120, 0) 140deg); animation: holo 6s linear infinite; pointer-events: none; }

.seal {
  width: 54px; height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative;
  font-family: var(--f-seal); font-weight: 900; font-size: 27px; color: #fff;

}

.idc .im { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; position: relative; }

.rar { font-size: 10.5px; font-weight: 900; padding: 1px 7px; border-radius: 99px; color: #fff; background: var(--rc, var(--r0)); letter-spacing: 0.06em; }
.idc .trait { font-size: 12px; color: var(--ink-3); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 2px; }
.stats4 div { display: flex; flex-direction: column; gap: 2px; font-size: 10.5px; font-weight: 800; color: var(--ink-3); }
.stats4 b { font-family: var(--f-num); font-size: 15px; color: var(--ink); font-weight: 800; line-height: 1; }
.stats4 .bar { height: 3px; }
.idc .role { position: absolute; right: 10px; top: 8px; }
.slots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.slots.s3 { grid-template-columns: repeat(3, minmax(0, 52px)); gap: 10px; }
.slots.s2 { grid-template-columns: repeat(2, minmax(0, 52px)); gap: 10px; }
.slot { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 2px dashed rgba(29, 78, 216, 0.25); color: var(--ink-3); position: relative; max-width: 100%; }
.slot .seal { width: 100%; height: 100%; font-size: 18px; }
.slot .seal::after { inset: 3px; }
.slot .slv { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); font-family: var(--f-num); font-size: 10px; font-weight: 800; background: var(--ink); color: #fff; border-radius: 6px; padding: 0 4px; }
.team-score { display: flex; align-items: baseline; gap: 6px; }
.team-score .num { font-size: 30px; font-weight: 800; color: var(--royal-deep); line-height: 1; }
.sect-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.sect-h b { font-size: 16px; font-weight: 900; }
.cand .btn { margin-top: 6px; }
.timer { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--ink-2); }
.timer .ic { width: 15px; height: 15px; }

/* ---------- trade ---------- */
.mkbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
.mkbar .st { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 14px; }
.mkbar .st i { width: 10px; height: 10px; border-radius: 50%; background: #9AA6BA; flex: none; }
.mkbar .st i.open { background: var(--down); box-shadow: 0 0 0 4px rgba(12, 157, 99, 0.18); animation: blink 1.6s infinite; }
@keyframes blink { 50% { box-shadow: 0 0 0 7px rgba(12, 157, 99, 0.05); } }
.mkbar .ix { text-align: right; }
.mkbar .ix b { font-family: var(--f-num); font-size: 19px; font-weight: 800; display: block; line-height: 1.05; }
.up { color: var(--up) !important; } .dn { color: var(--down) !important; } .fl { color: var(--ink-3) !important; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; width: 100%; text-align: left; border-bottom: 1px solid var(--hair); }
.qrow:last-child { border-bottom: 0; }
.qrow .qn { flex: 1; min-width: 0; }
.qrow .qn b { display: block; font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .qn span { font-size: 11px; font-weight: 800; color: var(--ink-3); }
.qrow canvas { width: 64px; height: 30px; flex: none; }
.qrow .qp { text-align: right; min-width: 78px; }
.qrow .qp b { display: block; font-family: var(--f-num); font-size: 20px; font-weight: 800; line-height: 1.05; }
.pill { display: inline-block; font-family: var(--f-num); font-weight: 800; font-size: 13px; padding: 1px 7px; border-radius: 8px; color: #fff; background: var(--ink-3); min-width: 58px; text-align: center; }
.pill.up { background: var(--up); color: #fff !important; } .pill.dn { background: var(--down); color: #fff !important; } .pill.fl { background: var(--ink-3); color: #fff !important; }
.pill.lim { box-shadow: 0 0 0 2px #fff, 0 0 0 4px currentColor; }
.qrow.own { background: linear-gradient(90deg, rgba(255, 197, 49, 0.18), rgba(255, 197, 49, 0)); }
.news-it { display: flex; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--hair); }
.news-it:last-child { border-bottom: 0; }
.news-it time { font-family: var(--f-num); font-weight: 800; color: var(--ink-3); font-size: 14px; flex: none; width: 40px; }
.news-it .nt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.news-it .nt b { font-size: 14px; font-weight: 800; line-height: 1.35; }
.news-it .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.news-it .meta button.chip { min-height: 32px; padding: 0 12px; font-size: 12.5px; border: 1px solid rgba(29, 78, 216, 0.22); }
.pos { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--hair); width: 100%; text-align: left; }
.pos:last-child { border-bottom: 0; }
.pos .r { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pos .r b { font-size: 15px; font-weight: 900; }
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 6px; }
.kv div { display: flex; flex-direction: column; font-size: 11px; font-weight: 800; color: var(--ink-3); }
.kv b { font-family: var(--f-num); font-size: 16px; color: var(--ink); font-weight: 800; }
.term { background: linear-gradient(180deg, var(--term-2), var(--term)); border-radius: 18px; color: #DCE6FF; padding: 10px; box-shadow: var(--shadow); border: 1px solid rgba(140, 170, 255, 0.25); }
.term canvas { width: 100%; height: 210px; display: block; }
.term .seg { background: rgba(255, 255, 255, 0.08); }
.term .seg button { color: #AFC3F5; }
.term .seg button.on { background: #DCE6FF; color: var(--term); }
.book { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hair); border-radius: 12px; overflow: hidden; font-family: var(--f-num); font-size: 14px; }
.book div { background: #fff; display: flex; justify-content: space-between; padding: 3px 8px; font-weight: 700; }
.book .h { font-family: var(--f-body); font-size: 11px; font-weight: 800; color: var(--ink-3); background: #F2F6FF; }

/* ---------- sheets ---------- */
#sheets { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.sheet-wrap { position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: rgba(7, 16, 48, 0.52); animation: fadeIn 0.22s; }
@keyframes fadeIn { from { opacity: 0; } }
.sheet {
  position: relative; max-height: 92%; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #F7FAFF, #E7F0FF); border-radius: 26px 26px 0 0; box-shadow: 0 -18px 40px -14px rgba(0, 0, 0, 0.5);
  animation: sheetIn 0.32s cubic-bezier(.2, .9, .25, 1); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.full { height: 100%; max-height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); }
@keyframes sheetIn { from { transform: translateY(100%); } }
.sheet.out { animation: sheetOut 0.22s ease-in forwards; }
@keyframes sheetOut { to { transform: translateY(100%); } }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 14px var(--gut-r) 8px var(--gut-l); }
.sheet-h b { flex: 1; font-size: 18px; font-weight: 900; min-width: 0; }
.sheet-h .x { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: rgba(13, 26, 71, 0.07); flex: none; }
.grab { width: 44px; height: 5px; border-radius: 9px; background: rgba(13, 26, 71, 0.18); margin: 8px auto 0; flex: none; }
.sheet-b > * { flex-shrink: 0; }
.sheet-b { overflow-y: auto; padding: 4px var(--gut-r) 16px var(--gut-l); display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
.sheet-f { padding: 10px var(--gut-r) 12px var(--gut-l); display: flex; gap: 10px; border-top: 1px solid var(--hair); background: rgba(255, 255, 255, 0.7); }
.sheet-f .btn { flex: 1; min-height: 54px; font-size: 17px; }

/* order ticket */
.otog { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.otog button { min-height: 44px; border-radius: 13px; font-weight: 900; font-size: 16px; background: rgba(13, 26, 71, 0.06); color: var(--ink-2); }
.otog button.on.buy { background: var(--up); color: #fff; }
.otog button.on.sell { background: var(--down); color: #fff; }
.stepper { display: flex; align-items: stretch; gap: 8px; }
.stepper button { width: 52px; border-radius: 14px; background: rgba(13, 26, 71, 0.07); font-size: 24px; font-weight: 700; color: var(--ink); }
.stepper .val { flex: 1; text-align: center; border-radius: 14px; background: #fff; border: 1px solid var(--hair); padding: 6px; }
.stepper .val b { display: block; font-family: var(--f-num); font-size: 26px; font-weight: 800; line-height: 1.1; }
.stepper .val span { font-size: 11px; font-weight: 800; color: var(--ink-3); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { flex: 1; min-height: 34px; border-radius: 11px; background: rgba(29, 78, 216, 0.08); color: var(--royal-deep); font-weight: 800; font-size: 13px; white-space: nowrap; padding: 0 6px; }
.quick button.on { background: var(--royal-deep); color: #fff; }
.sumgrid { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.sumgrid b { font-family: var(--f-num); font-size: 16px; text-align: right; color: var(--ink); }

/* ---------- board ---------- */
.dice-row { display: flex; align-items: center; gap: 4px; }
.dice-row i { width: 14px; height: 14px; border-radius: 4px; background: rgba(255, 255, 255, 0.35); border: 1.5px solid rgba(255, 255, 255, 0.7); }
.dice-row i.on { background: linear-gradient(180deg, #FFF0B8, #FFC531); border-color: #fff; }
.boardw { position: relative; width: 100%; aspect-ratio: 1; max-width: 520px; margin: 0 auto; }
.board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 4px; }
.tile-b {
  position: relative; border-radius: 12px; background: linear-gradient(180deg, #FFFFFF, #E6EEFF); border: 1px solid #fff;
  box-shadow: 0 4px 10px -6px rgba(13, 26, 71, 0.6); display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; font-size: 10.5px; font-weight: 900; color: var(--ink); text-align: center; line-height: 1.1; padding: 2px;
}
.tile-b::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 22%; background: var(--tc, #9AB0D8); }
.tile-b .ti { font-size: 17px; line-height: 1; margin-top: 8px; color: var(--tc, var(--ink)); }
.tile-b .ti .ic { width: 20px; height: 20px; }
.tile-b .tn { margin-top: 2px; white-space: nowrap; }
.tile-b .lvst { position: absolute; top: 1px; right: 3px; z-index: 1; font-size: 10px; line-height: 1; color: #FFE08A; letter-spacing: -1px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55); }
.tile-b.corner { background: linear-gradient(180deg, #213C9A, #0F2C8A); color: #fff; }
.tile-b.corner .ti { color: var(--gold-2); }
.tile-b.land { box-shadow: 0 0 0 3px var(--gold), 0 6px 16px -4px rgba(196, 130, 0, 0.8); }
.board-center { grid-column: 2 / 6; grid-row: 2 / 6; border-radius: 18px; background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.95), rgba(220, 232, 255, 0.9)); border: 1px solid #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 0 0 1px rgba(29, 78, 216, 0.08); padding: 8px; text-align: center; }
.board-center .res { min-height: 40px; font-size: 13px; font-weight: 800; color: var(--ink-2); padding: 0 6px; }
.board-center .res b { display: block; font-size: 16px; color: var(--ink); font-weight: 900; }
.token { position: absolute; width: 14.5%; z-index: 3; transition: left 0.18s ease, top 0.18s ease; pointer-events: none; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35)); }
.token.hop { animation: hop 0.18s ease; }
@keyframes hop { 50% { transform: translateY(-14px); } }
.die-scene { width: 64px; height: 64px; perspective: 400px; }
.die { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(.2, .9, .2, 1); }
.die .f { position: absolute; inset: 0; border-radius: 14px; background: radial-gradient(circle at 30% 25%, #FFFFFF, #E9EEF6 70%, #C9D2E0); box-shadow: inset 0 0 0 1px rgba(13, 26, 71, 0.12); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 9px; }
.die .f i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4A5568, #0D1A47); place-self: center; }
.die .f.red i { background: radial-gradient(circle at 35% 30%, #FF7A8C, #C42139); }
.die .f1 { transform: rotateY(0deg) translateZ(32px); } .die .f2 { transform: rotateY(90deg) translateZ(32px); } .die .f3 { transform: rotateX(90deg) translateZ(32px); }
.die .f4 { transform: rotateX(-90deg) translateZ(32px); } .die .f5 { transform: rotateY(-90deg) translateZ(32px); } .die .f6 { transform: rotateY(180deg) translateZ(32px); }

/* ---------- cars ---------- */
.showcase { position: relative; padding: 14px 14px 12px; overflow: hidden; text-align: center; }
.showcase .stagebg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 92%, rgba(255, 213, 90, 0.55), rgba(255, 213, 90, 0) 55%), linear-gradient(180deg, #13286E, #0A1842); }
.showcase > * { position: relative; }
.showcase .car-art { width: 100%; max-width: 380px; height: auto; display: block; margin: 6px auto 0; }
.showcase .plat { width: 76%; height: 18px; margin: -14px auto 0; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(255, 220, 130, 0.9), rgba(255, 220, 130, 0) 70%); }
.showcase .cn { color: #fff; font-weight: 900; font-size: 22px; letter-spacing: 0.04em; }
.showcase .cb { display: inline-flex; margin-top: 6px; }
.carg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.carc { display: flex; flex-direction: column; gap: 6px; padding: 10px; text-align: left; }
.carc .car-art { width: 100%; height: auto; display: block; background: linear-gradient(180deg, #E4EEFF, #C9DCFA); border-radius: 12px; padding: 4px 2px 0; }
.carc b { font-size: 14.5px; font-weight: 900; }
.carc .cbon { font-size: 12px; font-weight: 800; color: var(--royal-deep); min-height: 32px; }
.carc .btn { min-height: 40px; font-size: 13px; }

/* ---------- overlays: story / act / duel / modal ---------- */
#overlay { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#overlay > * { pointer-events: auto; }
.story { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(180deg, rgba(5, 10, 30, 0.62), rgba(5, 10, 30, 0.3) 28%, rgba(5, 10, 30, 0.78)); animation: fadeIn 0.3s; }
.story.dark { background: #03060F; }
.story.choosing { background: rgba(3, 6, 18, 0.86); }
.story.choosing .narr p { font-size: 22px; color: #fff; }
.story .skip { position: absolute; z-index: 4; top: calc(10px + env(safe-area-inset-top, 0px)); right: var(--gut-r); min-height: 46px; min-width: 84px; color: rgba(255, 255, 255, 0.92); font-weight: 800; font-size: 14px; padding: 8px 16px; border-radius: 99px; background: #0B1433; border: 1px solid rgba(255, 255, 255, 0.28); box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.6); }
.dlg { margin: 0 var(--gut-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gut-l); padding: 16px 18px 18px; border-radius: 22px; background: linear-gradient(180deg, rgba(14, 28, 80, 0.94), rgba(8, 16, 52, 0.96)); border: 1px solid rgba(140, 170, 255, 0.35); color: #fff; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6); min-height: 128px; position: relative; max-width: 560px; align-self: center; width: calc(100% - var(--gut-l) - var(--gut-r)); box-sizing: border-box; }
.dlg .who { display: flex; align-items: center; gap: 8px; margin-top: -40px; margin-bottom: 8px; }
.dlg .who .emb { filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.dlg .who b { font-size: 15px; font-weight: 900; padding: 3px 12px; border-radius: 99px; background: var(--cc, #3E6BE0); box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.5); }
.dlg .who span { font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.7); }
.dlg p { margin: 0; font-size: 17.5px; line-height: 1.6; font-weight: 700; letter-spacing: 0.02em; min-height: 56px; }
.dlg .more { position: absolute; right: 16px; bottom: 10px; color: var(--gold); animation: nudge 1s infinite; }
@keyframes nudge { 50% { transform: translateY(3px); } }
.narr { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 28px; text-align: center; }
.narr p { color: #EAF0FF; font-size: 20px; line-height: 1.75; font-weight: 700; letter-spacing: 0.06em; max-width: 520px; animation: narrIn 0.6s ease; }
@keyframes narrIn { from { opacity: 0; transform: translateY(8px); } }
.choices { display: flex; flex-direction: column; gap: 10px; margin: 0 var(--gut-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gut-l); max-width: 560px; align-self: center; width: calc(100% - var(--gut-l) - var(--gut-r)); }
.choices .btn { min-height: 56px; font-size: 17px; }
.actcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 40%, #1A3A9A, #050B26 70%); animation: fadeIn 0.4s; text-align: center; padding: 20px; }
.actcard .an { font-family: var(--f-num); letter-spacing: 0.5em; color: var(--gold-2); font-weight: 700; font-size: 14px; animation: narrIn 0.6s 0.1s both; }
.actcard .act-n { color: #fff; font-weight: 900; font-size: 22px; letter-spacing: 0.4em; margin-right: -0.4em; animation: narrIn 0.6s 0.15s both; }
.actcard .poster { font-size: clamp(54px, 19vw, 92px); animation: actIn 0.8s cubic-bezier(.2, .9, .2, 1.2) 0.25s both; }
.actcard .poster::before { -webkit-text-stroke: 9px #0B1A44; }
.actcard .q { color: #DCE6FF; font-size: 17px; font-weight: 700; letter-spacing: 0.1em; animation: narrIn 0.6s 0.7s both; }
.actcard .lines { width: 70%; max-width: 360px; height: 2px; background: linear-gradient(90deg, rgba(255, 197, 49, 0), #FFC531, rgba(255, 197, 49, 0)); animation: narrIn 0.6s 0.5s both; }
@keyframes actIn { from { opacity: 0; transform: skewX(-8deg) scale(1.6); filter: blur(6px); } to { opacity: 1; transform: skewX(-8deg) scale(1); filter: none; } }
.modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px var(--gut-r) 20px var(--gut-l); background: rgba(5, 12, 40, 0.6); animation: fadeIn 0.25s; }
.modal .card { width: 100%; max-width: 420px; padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: popIn 0.35s cubic-bezier(.2, .9, .2, 1.3); max-height: 100%; overflow-y: auto; }
@keyframes popIn { from { transform: scale(0.85); opacity: 0; } }

/* duel */
.duel { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; color: #fff; animation: fadeIn 0.3s; }
.duel canvas.stage { position: absolute; inset: 0; width: 100%; height: 100%; }
.duel .dtop { position: relative; background: linear-gradient(180deg, rgba(3, 6, 18, 0.75), rgba(3, 6, 18, 0)); display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) var(--gut-r) 6px var(--gut-l); }

  /* ---------- main render ---------- */
  Scene.prototype.render = function (ctx, W, H, dpr, S, now, dt) {

    const v0 = Math.floor(Math.min(...corners.map((c) => c[1]))) - 1, v1 = Math.ceil(Math.max(...corners.map((c) => c[1]))) + 1;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  Scene.prototype.drawWater = function (ctx, pl, t, n) {

    }
    ctx.stroke();
  };

  /* ---------- objects ---------- */
  Scene.prototype.collect = function (S, now) {
    const out = [];

    const inV = (u, v, m) => u >= vis.u0 - m && u <= vis.u1 + 1 && v >= vis.v0 - m && v <= vis.v1 + 1;

    for (const b of S.city.bld) {
      const z = C.sz(b);
      if (!inV(b.x, b.y, 30)) continue;
      if (this.mode === 'move' && b.id === this.moveId) continue;
      const sp = this.sprOf(b), [x, y] = P(b.x, b.y, 0);
      const l = x - sp.ox / sp.s, t = y - sp.oy / sp.s;
      if (l > wr || l + sp.cv.width / sp.s < wl || t > wb || t + sp.cv.height / sp.s < wt) continue;
      out.push({ k: 'b', b, d: b.x + b.y + 2 * z - 1, e: b.x });
    }
    if ((this.mode === 'place' || this.mode === 'move') && this.pick) {
      const sz = C.T[this.placeType].sz;
      out.push({ k: 'ghost', x: this.pick.x, y: this.pick.y, d: this.pick.x + this.pick.y + 2 * sz - 1, e: this.pick.x });
    }
    for (let blk = 0; blk < 25; blk++) {

      if (!inV(x0, y0, 40)) continue;
      if (B.sp && !(blk === C.LOT1 && o === 'me')) { out.push({ k: 'lm', blk, t: B.sp, d: x0 + y0 + 5, e: x0 }); continue; }
      if (!o && C.unlocked(S, blk)) out.push({ k: 'sale', blk, d: x0 + y0 + 5.9, e: x0 + 3 });
      else if (!o) out.push({ k: 'lock', blk, d: x0 + y0 + 5.9, e: x0 + 3 });
      else if (o !== 'me') out.push({ k: 'flag', blk, o, d: x0 + y0 + 5.9, e: x0 + 3 });

  };

  Scene.prototype.drawBld = function (ctx, b, S, now, n, tnow) {

  };
  Scene.prototype.fence = function (ctx, b, n) {

  Scene.prototype.crane = function (ctx, b, hp, t, n) {

  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  /* ---------- hit testing ---------- */
  function inPoly(x, y, pts) {
    let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  // is there a painted pixel of this sprite (drawn with its anchor at world ax, ay) near world point wx, wy?
  function solid(sp, ax, ay, wx, wy, r) {
    const ctx = sp.cv.getContext && sp.cv.getContext('2d'); if (!ctx) return true;
    const px = Math.round((wx - (ax - sp.ox / sp.s)) * sp.s), py = Math.round((wy - (ay - sp.oy / sp.s)) * sp.s);
    const R = Math.max(1, Math.round(r * sp.s));
    const x0 = Math.max(0, px - R), y0 = Math.max(0, py - R), x1 = Math.min(sp.cv.width, px + R + 1), y1 = Math.min(sp.cv.height, py + R + 1);
    if (x1 <= x0 || y1 <= y0) return false;
    try {
      const d = ctx.getImageData(x0, y0, x1 - x0, y1 - y0).data;

  /* ================= gestures ================= */
  CU.attach = function (cv) {
    const pts = new Map();
    let start = null, moved = false, last = null, pinch = null, vel = { x: 0, y: 0 };
    const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; };
    cv.addEventListener('pointerdown', (e) => {
      try { cv.setPointerCapture(e.pointerId); } catch (x) {}
      const p = pos(e); pts.set(e.pointerId, p);
      scene.stopFly(); inertia = null;
      if (pts.size === 1) { start = p; last = p; moved = false; vel = { x: 0, y: 0 }; }
      else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; moved = true;
      }
    });
    cv.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      const p = pos(e); pts.set(e.pointerId, p);
      if (pts.size === 1 && start) {
        if (!moved && Math.hypot(p.x - start.x, p.y - start.y) > 9) moved = true;
        if (moved) {
          const dx = p.x - last.x, dy = p.y - last.y, dt = Math.max(1, p.t - last.t);
          scene.pan(dx, dy);
          vel = { x: 0.8 * vel.x + 0.2 * (dx / dt), y: 0.8 * vel.y + 0.2 * (dy / dt) };
        }
        last = p;
      } else if (pts.size >= 2 && pinch) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        if (pinch.d > 0) scene.zoomAt(mx, my, d / pinch.d);
        scene.pan(mx - pinch.mx, my - pinch.my);
        pinch = { d, mx, my };
      }
    });
    const up = (e) => {
      if (!pts.has(e.pointerId)) return;
      const p = pos(e); pts.delete(e.pointerId);
      if (pts.size === 0) {
        if (!moved && start && p.t - start.t < 600) { SFX.unlock(); CU.tap(p.x, p.y); }
        else if (moved && !pinch && (Math.abs(vel.x) + Math.abs(vel.y)) > 0.12) inertia = { x: vel.x, y: vel.y };
        start = null; pinch = null;
      } else if (pts.size === 1) { const q = [...pts.values()][0]; start = q; last = q; moved = true; pinch = null; }
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);

  };

<p class="sub" style="margin:0">九格空地，買下後在城市地圖上就能蓋房子${sea ? '。臨海，第一排有海景加成' : ''}。對手停在你的地上，要付你過路費。</p></div>`,

  BD.card = function (kind, next) {

      case 'intel': {

        const dir = (z >= 0) === (Math.random() < 0.85) ? 1 : -1;
        S.board.intel = (S.board.intel || []).filter((x) => x.di >= di).concat([{ i, di: ed, dir }]);
        eff = `${U.STOCKS[i].name}下次財報「${dir > 0 ? '可能優於預期' : '可能不如預期'}」`; break;
      }

    const ov = $('overlay');
    const wrap = document.createElement('div');
    wrap.className = 'story' + (beat.bg === 'dark' ? ' dark' : '');

    ov.appendChild(wrap);
    let i = 0, typing = null, full = '';
    const narr = wrap.querySelector('.narr'), dlg = wrap.querySelector('.dlg'), ch = wrap.querySelector('.choices');
    const finish = (res) => {
      wrap.remove(); busy = false; UI.open = !!document.querySelector('#sheets > *') || !!document.querySelector('#overlay > *');
      const after = () => { if (cb) cb(res); St.drain(); };
      if (beat.act && !St._noAct) { St.actCard(beat.act, after); } else after();
    };
    const show = () => {
      if (i >= lines.length) return finish(St._choice);

        ch.hidden = false; wrap.classList.add('choosing');

        ch.onclick = (e) => { const b = e.target.closest('[data-c]'); if (!b) return; SFX.tap(); S.choice[l.key] = b.dataset.c; St._choice = b.dataset.c; ch.hidden = true; wrap.classList.remove('choosing'); i++; St.onChoice(l.key, b.dataset.c); show(); };
        wrap.querySelector('.skip').hidden = true;

      }

      const [who, text] = l;
      full = text;

        const p = narr.querySelector('p'); p.textContent = text; p.style.animation = 'none'; void p.offsetWidth; p.style.animation = '';
