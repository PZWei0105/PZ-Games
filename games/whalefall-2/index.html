<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>鯨落 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：全螢幕棋盤畫布在下，頂部「船票」狀態列＋玩家籌碼列，底部拇指區操作台；決定一律用由下滑出的面板 */
:root {
  --ink: #213052;
  --ink-2: #55617D;
  --ink-3: #8A94AB;
  --paper: #FFFFFF;
  --paper-2: #EEF4FB;
  --paper-3: #DCE7F3;
  --sky: #CFE8FF;
  --sky-deep: #8FC3EE;
  --sun: #FFC83D;
  --sun-edge: #D99412;
  --coral: #FF6B6B;
  --coral-edge: #CF464C;
  --mint: #2DBE88;
  --mint-edge: #1B9168;
  --song: #42C9C0;
  --song-deep: #147A84;
  --violet: #8E6CF0;
  --gold: #F2B640;
  --veil: rgba(22, 32, 58, .46);
  --shadow: 0 10px 28px rgba(28, 42, 78, .22);
  --shadow-s: 0 3px 10px rgba(28, 42, 78, .16);
  --f-display: "Huninn", "jf-openhuninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Fredoka", "Huninn", "PingFang TC", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --r-sheet: 26px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #BFDFFB; color: var(--ink); font-family: var(--f-body);
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; overflow: hidden; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
[hidden] { display: none !important; }

/* ---------- 按鈕 ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer; border-radius: 16px; padding: 12px 16px; min-height: 50px;
  font-family: var(--f-display); font-size: 17px; line-height: 1.15; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; background: var(--paper); color: var(--ink);
  box-shadow: 0 4px 0 var(--paper-3), var(--shadow-s); transform: translateY(0); transition: transform .08s, box-shadow .08s, filter .15s;
  position: relative; text-align: center;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--paper-3), var(--shadow-s); }
.btn:focus-visible { outline: 3px solid var(--song); outline-offset: 2px; }
.btn[disabled] { filter: grayscale(.9) opacity(.55); pointer-events: none; }
.btn-sun { background: var(--sun); box-shadow: 0 4px 0 var(--sun-edge), var(--shadow-s); }
.btn-sun:active { box-shadow: 0 1px 0 var(--sun-edge), var(--shadow-s); }
.btn-coral { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-edge), var(--shadow-s); }
.btn-coral:active { box-shadow: 0 1px 0 var(--coral-edge), var(--shadow-s); }
.btn-mint { background: var(--mint); color: #fff; box-shadow: 0 4px 0 var(--mint-edge), var(--shadow-s); }
.btn-mint:active { box-shadow: 0 1px 0 var(--mint-edge), var(--shadow-s); }
.btn-song { background: var(--song); color: #fff; box-shadow: 0 4px 0 var(--song-deep), var(--shadow-s); }
.btn-song:active { box-shadow: 0 1px 0 var(--song-deep), var(--shadow-s); }
.btn-ghost { background: rgba(255,255,255,.7); box-shadow: 0 3px 0 rgba(33,48,82,.12); }
.btn > svg, .btn .ico svg { width: 22px; height: 22px; flex: none; }
.btn small { font-family: var(--f-body); font-size: 12px; opacity: .78; display: block; margin-top: 2px; }
.btn .stack { display: flex; flex-direction: column; align-items: center; }
.btn-big { min-height: 62px; font-size: 19px; border-radius: 18px; }
.ib {
  appearance: none; border: 0; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
  background: rgba(255,255,255,.88); box-shadow: 0 3px 0 rgba(33,48,82,.14); cursor: pointer; color: var(--ink); flex: none;
}
.ib:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(33,48,82,.14); }
.ib svg { width: 22px; height: 22px; }
.ib .tag { font-family: var(--f-num); font-weight: 600; font-size: 14px; }

/* ---------- 頂部 HUD ---------- */
#hud { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) 0 var(--gutter-l); display: flex; flex-direction: column; gap: 6px; }
#hud > * { pointer-events: auto; }
.topbar { display: flex; align-items: center; gap: 8px; }
.ticket {
  flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: rgba(255,255,255,.92); border-radius: 14px; box-shadow: 0 3px 0 rgba(33,48,82,.12);
  position: relative; overflow: hidden;
}
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: rgba(191,223,251,.9); }
.ticket::before { left: -6px; } .ticket::after { right: -6px; }
.ticket b { font-family: var(--f-display); font-size: 16px; white-space: nowrap; }
.ticket .xun { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.ticket .left { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-family: var(--f-num); }
.ticket .season { margin-left: auto; font-family: var(--f-display); font-size: 13px; padding: 3px 9px; border-radius: 999px; color: #fff; white-space: nowrap; }
.vitbar { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.9); font-size: 12px; font-family: var(--f-display); align-self: flex-start; box-shadow: 0 2px 0 rgba(33,48,82,.12); }
.vitbar .track { width: 110px; height: 8px; border-radius: 6px; background: var(--paper-3); overflow: hidden; }
.vitbar .fill { height: 100%; background: linear-gradient(90deg, #ff7a7a, #42c9c0); border-radius: 6px; transition: width .5s; }

.destbar {
  display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 12px 4px 6px; border-radius: 999px;
  background: linear-gradient(90deg, #153D5C, #1E6A80); color: #EFFFFD; align-self: flex-start; max-width: 100%;
  box-shadow: 0 3px 0 rgba(10,30,50,.25); cursor: pointer; font-size: 13px;
}
.destbar .ico { width: 26px; height: 26px; border-radius: 50%; background: var(--song); display: grid; place-items: center; flex: none; }
.destbar .ico svg { width: 18px; height: 18px; }
.destbar b { font-family: var(--f-display); font-weight: 400; font-size: 14px; white-space: nowrap; }
.destbar .rw { font-family: var(--f-num); font-weight: 600; color: #FFE08A; white-space: nowrap; }
.destbar .dd { opacity: .8; white-space: nowrap; }
.destbar.wait { background: rgba(255,255,255,.85); color: var(--ink-2); }
.destbar.wait .ico { background: var(--paper-3); }

.chips { display: flex; gap: 5px; }
.chip {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 5px; border-radius: 16px;
  background: rgba(255,255,255,.9); box-shadow: 0 3px 0 rgba(33,48,82,.12); position: relative; cursor: pointer;
  transition: transform .2s, box-shadow .2s, background .2s; border: 2px solid transparent;
}
.chip.on { background: #fff; transform: translateY(2px); box-shadow: 0 0 0 3px var(--c), 0 6px 14px rgba(33,48,82,.22); }
.chip.dead { opacity: .45; filter: grayscale(1); }
.chip .pt { width: 32px; height: 32px; border-radius: 50%; flex: none; background: var(--c); position: relative; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
.chip .pt img { width: 100%; height: 100%; display: block; }
.chip .tx { min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
.chip .nm { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .cs { font-family: var(--f-num); font-weight: 600; font-size: 15px; white-space: nowrap; }
.chip .cs.neg { color: var(--coral-edge); }
.chip .rk { position: absolute; top: -6px; left: -4px; min-width: 18px; height: 18px; border-radius: 9px; font-family: var(--f-num); font-weight: 700; font-size: 11px; display: grid; place-items: center; background: var(--ink); color: #fff; padding: 0 4px; }
.chip .rk.r1 { background: var(--gold); color: var(--ink); }
.chip .badges { position: absolute; right: 2px; top: -8px; display: flex; gap: 2px; }
.chip .badges i { width: 20px; height: 20px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: var(--shadow-s); font-style: normal; }
.chip .badges i img { width: 18px; height: 18px; }
.chip .you { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 10px; font-family: var(--f-display); background: var(--ink); color: #fff; padding: 0 6px; border-radius: 8px; white-space: nowrap; }

/* ---------- 底部操作台 ---------- */
#deck {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; pointer-events: none;
  padding: 0 var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gutter-l);
}
.deck-in { pointer-events: auto; max-width: 560px; margin: 0 auto; background: rgba(255,255,255,.95); border-radius: 24px; padding: 10px 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 9px; }
.deck-msg { display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 0 4px; font-size: 14px; }
.deck-msg .pt { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: var(--c, var(--paper-3)); flex: none; }
.deck-msg .pt img { width: 100%; height: 100%; }
.deck-msg b { font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.deck-msg .sub { color: var(--ink-2); font-size: 12px; margin-left: auto; white-space: nowrap; }
.deck-row { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
.deck-row.tools { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.deck-row.tools[style*="--n:5"] .tool { flex-direction: column; gap: 1px; font-size: 12.5px; min-height: 50px; }
.deck-row.tools[style*="--n:5"] .tool svg { width: 21px; height: 21px; }
.tool { appearance: none; border: 0; background: var(--paper-2); border-radius: 14px; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--f-display); font-size: 14px; cursor: pointer; color: var(--ink); position: relative; }
.tool:active { background: var(--paper-3); }
.tool svg { width: 20px; height: 20px; }
.tool .ct { position: absolute; top: 3px; right: 6px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--coral); color: #fff; font-family: var(--f-num); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; }
.tool[disabled] { opacity: .45; pointer-events: none; }
.dice-btn .pips { display: flex; gap: 4px; }
.dice-btn .pip { width: 22px; height: 22px; border-radius: 6px; background: #fff; box-shadow: inset 0 -2px 0 rgba(33,48,82,.15); display: grid; place-items: center; }
.dice-btn .pip::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.thinking { display: flex; align-items: center; gap: 6px; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: bob 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }

/* ---------- 面板（由下滑出） ---------- */
.veil { position: absolute; inset: 0; background: var(--veil); z-index: 41; opacity: 0; transition: opacity .2s; }
.veil.on { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 42; max-height: min(82vh, 760px); display: flex; flex-direction: column;
  background: var(--paper); border-radius: var(--r-sheet) var(--r-sheet) 0 0; box-shadow: 0 -10px 40px rgba(20,30,60,.3);
  transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.25,1.05); max-width: 620px; margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.on { transform: translateY(0); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--paper-3); margin: 8px auto 2px; flex: none; }
.sh-head { padding: 6px 18px 4px; display: flex; align-items: flex-start; gap: 12px; flex: none; }
.sh-head h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 21px; line-height: 1.25; text-wrap: balance; }
.sh-head p { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.sh-head .x { margin-left: auto; }
.sh-body { padding: 8px 18px 6px; overflow: auto; flex: 1 1 auto; -webkit-overflow-scrolling: touch; user-select: text; }
.sh-foot { padding: 10px 16px 14px; display: grid; gap: 10px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); flex: none; }
.sh-foot.one { grid-template-columns: 1fr; }

.tilecard { display: flex; gap: 12px; align-items: stretch; padding: 12px; border-radius: 18px; background: var(--paper-2); }
.tilecard .sw { width: 10px; border-radius: 6px; background: var(--dc, var(--paper-3)); flex: none; }
.tilecard .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tilecard .dn { font-size: 12px; color: var(--ink-2); }
.tilecard .tn { font-family: var(--f-display); font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-top: 6px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-num); font-weight: 600; font-size: 14px; }
.dots { display: flex; gap: 5px; align-items: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--paper-3); }
.lvbar { display: flex; gap: 4px; }
.lvbar i { flex: 1; height: 8px; border-radius: 4px; background: var(--paper-3); }
.lvbar i.on { background: var(--c, var(--sun)); }
.delta { display: flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 22px; margin: 6px 0 2px; }
.delta .ar { color: var(--ink-3); font-size: 18px; }
.delta .up { color: var(--mint-edge); }
.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; margin: 8px 2px 2px; }
.warn { color: var(--coral-edge); }

.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 16px; background: var(--paper-2);
  min-height: 56px;
}
.row .sw { width: 8px; align-self: stretch; border-radius: 5px; background: var(--dc, var(--paper-3)); flex: none; }
.row .mid { flex: 1; min-width: 0; }
.row .t1 { font-family: var(--f-display); font-size: 15.5px; line-height: 1.25; }
.row .t2 { font-size: 12px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }
.row .btn { min-height: 42px; padding: 8px 12px; font-size: 15px; border-radius: 13px; flex: none; }
.row.pick { cursor: pointer; }
.row.pick:active { background: var(--paper-3); }
.row .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #fff; flex: none; overflow: hidden; }
.row .ic img, .row .ic svg { width: 36px; height: 36px; }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: 14px; background: var(--paper-2); margin-bottom: 10px; }
.seg button { flex: 1; appearance: none; border: 0; background: transparent; border-radius: 11px; min-height: 38px; font-family: var(--f-display); font-size: 15px; cursor: pointer; color: var(--ink-2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-s); }
.sec-t { font-family: var(--f-display); font-size: 15px; color: var(--ink-2); margin: 12px 2px 8px; display: flex; align-items: center; gap: 8px; }
.sec-t .r { margin-left: auto; font-family: var(--f-num); font-size: 14px; color: var(--ink); }

/* 卡片 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.card {
  position: relative; border-radius: 18px; padding: 10px 10px 12px; background: #fff; box-shadow: inset 0 0 0 3px var(--rc), var(--shadow-s);
  display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; border: 0; font: inherit; color: inherit; min-width: 0;
}
.card .art { height: 74px; border-radius: 12px; background: linear-gradient(160deg, var(--rc2), #fff); display: grid; place-items: center; }
.card .art svg, .card .art img { width: 64px; height: 64px; }
.card .cn { font-family: var(--f-display); font-size: 16px; }
.card .cd { font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.card .cp { font-family: var(--f-num); font-weight: 600; font-size: 14px; }
.card.off { opacity: .45; }
.card.lock { filter: grayscale(1); opacity: .5; }
.card.sel { box-shadow: inset 0 0 0 3px var(--rc), 0 0 0 3px var(--ink), var(--shadow-s); }
.r1c { --rc: #8FD3CF; --rc2: #DDF5F3; } .r2c { --rc: #8DB6F2; --rc2: #E1ECFC; } .r3c { --rc: #B49BF5; --rc2: #EEE7FE; } .r4c { --rc: #F2C04A; --rc2: #FFF2CF; }
.numgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.numgrid button { appearance: none; border: 0; border-radius: 14px; background: var(--paper-2); min-height: 62px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
.numgrid button b { font-family: var(--f-num); font-size: 22px; font-weight: 600; }
.numgrid button span { font-size: 10.5px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.numgrid button.hot { background: #E3FAF7; box-shadow: inset 0 0 0 2px var(--song); }
.numgrid button.bad { background: #FFECEC; }

/* ---------- 特效層 ---------- */
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.banner {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; text-align: center;
  transition: transform .32s cubic-bezier(.2,1.6,.4,1), opacity .2s; width: min(88vw, 460px);
}
.banner.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.banner.out { transform: translate(-50%, -60%) scale(.95); opacity: 0; transition: transform .3s, opacity .3s; }
.banner .rib {
  display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 26px 14px; border-radius: 22px;
  background: var(--bg, var(--ink)); color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.15), 0 16px 34px rgba(20,30,60,.3);
}
.banner .k { font-family: var(--f-display); font-size: 15px; opacity: .9; }
.banner .big { font-family: var(--f-display); font-size: 30px; line-height: 1.15; text-wrap: balance; }
.banner .amt { font-family: var(--f-num); font-weight: 700; font-size: 34px; }
.banner .sub { font-size: 13px; opacity: .9; margin-top: 2px; line-height: 1.4; max-width: 340px; }
.banner .art { width: 72px; height: 72px; margin-bottom: 4px; }
.banner .art svg, .banner .art img { width: 72px; height: 72px; }
.toasts { position: absolute; z-index: 60; pointer-events: none; left: 0; right: 0; top: calc(var(--hud-b, 140px) + 8px); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 var(--gutter-r) 0 var(--gutter-l); }
.toast { background: rgba(33,48,82,.88); color: #fff; font-size: 13px; padding: 7px 14px; border-radius: 999px; max-width: 92vw; display: flex; align-items: center; gap: 6px; animation: tin .25s ease-out; line-height: 1.35; }
.toast img { width: 20px; height: 20px; border-radius: 50%; }
.toast.out { animation: tout .3s ease-in forwards; }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }
@keyframes tout { to { transform: translateY(-8px); opacity: 0; } }

/* 骰子 */
.dicebox { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); display: flex; gap: 14px; perspective: 600px; }
.die { width: 62px; height: 62px; position: relative; transform-style: preserve-3d; }
.die .f { position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(145deg, #fff, #e9eef7); box-shadow: inset 0 -4px 0 rgba(33,48,82,.15); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 9px; box-sizing: border-box; backface-visibility: hidden; }
.die .f i { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); align-self: center; justify-self: center; visibility: hidden; }
.die .f i.on { visibility: visible; }
.die .f.f1 i.on { background: var(--coral); width: 15px; height: 15px; }
.die .f1 { transform: translateZ(31px); } .die .f6 { transform: rotateY(180deg) translateZ(31px); }
.die .f2 { transform: rotateY(90deg) translateZ(31px); } .die .f5 { transform: rotateY(-90deg) translateZ(31px); }
.die .f3 { transform: rotateX(90deg) translateZ(31px); } .die .f4 { transform: rotateX(-90deg) translateZ(31px); }
.dicesum { position: absolute; left: 50%; top: calc(36% + 62px); transform: translateX(-50%); font-family: var(--f-num); font-weight: 700; font-size: 34px; color: #fff; text-shadow: 0 3px 0 rgba(20,30,60,.35), 0 0 18px rgba(20,30,60,.35); opacity: 0; transition: opacity .2s; }
.dicesum.on { opacity: 1; }

/* 小提示 */
.tip { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 190px); width: min(92vw, 440px); z-index: 25;
  background: #FFF8E1; color: var(--ink); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; pointer-events: auto; animation: tin .25s; }
.tip .tx { flex: 1; font-size: 13.5px; line-height: 1.55; }
.tip .btn { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 12px; }

/* ---------- 全螢幕畫面 ---------- */
.screen { position: absolute; inset: 0; z-index: 40; overflow: auto; -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.screen.dim { background: linear-gradient(180deg, rgba(207,232,255,.86), rgba(240,247,255,.94)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.scr-head { display: flex; align-items: center; gap: 10px; }
.scr-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.panel { background: rgba(255,255,255,.95); border-radius: 22px; padding: 16px; box-shadow: var(--shadow-s); }
.panel h4 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.muted { color: var(--ink-2); font-size: 13px; line-height: 1.6; }

/* 標題畫面 */
.title { display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100%; gap: 18px; }
.logo { margin-top: 5vh; text-align: center; color: #1B3A5E; }
.logo .zh { font-family: var(--f-display); font-size: clamp(68px, 23vw, 118px); line-height: 1.05; letter-spacing: .06em; text-shadow: 5px 0 0 #fff, -5px 0 0 #fff, 0 5px 0 #fff, 0 -5px 0 #fff, 3.5px 3.5px 0 #fff, -3.5px 3.5px 0 #fff, 3.5px -3.5px 0 #fff, -3.5px -3.5px 0 #fff, 0 12px 0 rgba(27,58,94,.16), 0 20px 40px rgba(27,58,94,.28); }
.logo .en { font-family: var(--f-num); font-weight: 600; letter-spacing: .55em; font-size: 14px; margin-top: 10px; padding-left: .55em; color: #fff; text-shadow: 0 2px 0 rgba(27,58,94,.45); }
.logo .tag { display: inline-block; font-size: 13.5px; margin-top: 14px; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.78); color: #1B3A5E; }
.menu { width: min(100%, 380px); display: flex; flex-direction: column; gap: 11px; margin-bottom: 4vh; }
.menu .btn { width: 100%; justify-content: space-between; padding: 12px 18px; }
.menu .btn .r { font-family: var(--f-body); font-size: 12px; opacity: .75; }
.menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.menu-row .btn { justify-content: center; }

/* 章節 */
.chap { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 20px; background: rgba(255,255,255,.95); box-shadow: var(--shadow-s); cursor: pointer; border: 0; text-align: left; font: inherit; color: inherit; width: 100%; }
.chap .no { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; background: var(--paper-2); flex: none; }
.chap.done .no { background: var(--song); color: #fff; }
.chap.lock { opacity: .55; cursor: default; }
.chap .mid { flex: 1; min-width: 0; }
.chap .t1 { font-family: var(--f-display); font-size: 18px; }
.chap .t2 { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.frag { width: 22px; height: 22px; flex: none; opacity: .25; }
.frag.on { opacity: 1; }
.frags { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.frags svg { width: 26px; height: 26px; }
.fragb { appearance: none; border: 0; background: none; padding: 6px; min-width: 38px; min-height: 44px; border-radius: 12px; cursor: pointer; opacity: .25; display: grid; place-items: center; }
.fragb.on { opacity: 1; background: rgba(66, 201, 192, .12); }
.fragb:focus-visible { outline: 2px solid var(--song-deep); }
.ends { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.ends .btn { min-height: 40px; font-size: 14px; padding: 0 14px; }
.duo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.duo-row .btn { flex: 1 1 140px; min-height: 44px; justify-content: center; font-size: 15px; }

/* 鯨歌殘譜：一頁從鯨心裡送出來的樂譜，正面是歌，背面是字 */
.frag-read { display: flex; flex-direction: column; gap: 12px; }
.fr-give { display: flex; gap: 10px; align-items: flex-start; }
.fr-give .pt { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex: none; background: var(--c); }
.fr-give .pt img { width: 42px; height: 42px; display: block; }
.fr-give p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--ink); min-width: 0; }
.fr-paper { border-radius: 16px; background: #FBF5E6; color: #3B3324; box-shadow: inset 0 0 0 1px rgba(120, 96, 50, .18), 0 6px 18px rgba(80, 60, 20, .12); padding: 16px 16px 14px; }
.fr-verse { font-family: var(--f-display); font-size: 19px; line-height: 2.05; text-align: center; padding: 6px 0 12px;
  background: repeating-linear-gradient(180deg, transparent 0 18px, rgba(120, 96, 50, .16) 18px 19px, transparent 19px 24px) center 10px / 100% 120px no-repeat; }
.fr-back { border-top: 1.5px dashed rgba(120, 96, 50, .3); padding-top: 10px; }
.fr-back span { font-size: 12px; color: #8A7650; letter-spacing: .04em; }
.fr-back p { margin: 4px 0 0; font-size: 14.5px; line-height: 1.75; color: #4A4030; }
.truth { margin-top: 8px; font-size: 13px; line-height: 1.6; color: var(--ink); background: var(--paper-2); border-radius: 12px; padding: 8px 10px; }
.truth b { display: inline-block; font-family: var(--f-display); font-weight: 400; font-size: 12px; color: #fff; background: var(--song-deep); border-radius: 999px; padding: 1px 8px; margin-right: 6px; }
.truth.lock { color: var(--ink-3); background: transparent; border: 1px dashed var(--paper-3); }

/* 設定列 */
.opt { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--paper-2); }
.opt:last-child { border-bottom: 0; }
.opt .lb { flex: 1; min-width: 0; }
.opt .lb b { font-family: var(--f-display); font-weight: 400; font-size: 15.5px; display: block; }
.opt .lb span { font-size: 12px; color: var(--ink-2); }
.opt .duo { display: flex; gap: 6px; flex: none; }
.code-box { display: block; width: 100%; min-height: 132px; resize: none; border-radius: 14px; border: 1.5px solid var(--paper-3); background: var(--paper-2); color: var(--ink); padding: 12px; font: 16px/1.45 var(--f-body); word-break: break-all; outline: none; }
.code-box:focus { border-color: var(--sky-deep); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { appearance: none; border: 0; border-radius: 999px; padding: 8px 13px; background: var(--paper-2); font-family: var(--f-display); font-size: 14px; cursor: pointer; color: var(--ink-2); min-height: 38px; }
.pill.on { background: var(--ink); color: #fff; }
.tgl { appearance: none; width: 52px; height: 30px; border-radius: 15px; background: var(--paper-3); position: relative; cursor: pointer; border: 0; flex: none; transition: background .2s; }
.tgl::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-s); transition: left .2s; }
.tgl.on { background: var(--mint); }
.tgl.on::after { left: 25px; }
.seats { display: flex; flex-direction: column; gap: 8px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 16px; background: var(--paper-2); }
.seat .pt { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: var(--c); flex: none; cursor: pointer; }
.seat .pt img { width: 100%; height: 100%; }
.seat .mid { flex: 1; min-width: 0; }
.seat .t1 { font-family: var(--f-display); font-size: 15px; }
.seat .t2 { font-size: 11.5px; color: var(--ink-2); }
.seat select { appearance: none; border: 0; border-radius: 12px; padding: 8px 10px; background: #fff; font: inherit; font-size: 13px; color: var(--ink); min-height: 36px; }
.charpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.charpick button { appearance: none; border: 0; border-radius: 16px; background: var(--paper-2); padding: 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; color: inherit; }
.charpick button img { width: 58px; height: 58px; border-radius: 50%; background: var(--c); }
.charpick button b { font-family: var(--f-display); font-weight: 400; font-size: 14px; }
.charpick button span { font-size: 11px; color: var(--ink-2); }
.charpick button.on { background: #fff; box-shadow: inset 0 0 0 3px var(--c); }
.charpick button.lock { opacity: .4; pointer-events: none; }

/* 結算 */
.podium { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--paper-2); }
.prow.w { background: linear-gradient(90deg, #FFF3CC, #fff); box-shadow: inset 0 0 0 2px var(--gold); }
.prow .rk { font-family: var(--f-num); font-weight: 700; font-size: 20px; width: 26px; text-align: center; }
.prow .pt { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: var(--c); flex: none; }
.prow .pt img { width: 100%; height: 100%; }
.prow .mid { flex: 1; min-width: 0; }
.prow .t1 { font-family: var(--f-display); font-size: 16px; }
.prow .t2 { font-size: 12px; color: var(--ink-2); }
.prow .v { font-family: var(--f-num); font-weight: 600; font-size: 18px; }
.chart { width: 100%; height: 170px; display: block; }
.hl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.hl div { background: var(--paper-2); border-radius: 14px; padding: 10px; }
.hl b { display: block; font-family: var(--f-num); font-weight: 600; font-size: 18px; }
.hl span { font-size: 12px; color: var(--ink-2); }

/* 劇情 */
#hud, #deck, #fx, #screen { transition: opacity .25s; }
#app.scening #hud, #app.scening #deck, #app.scening #fx, #app.scening #screen { opacity: 0; pointer-events: none; }
.scene { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer;
  background: linear-gradient(180deg, rgba(14,24,48,0) 35%, rgba(14,24,48,.42) 100%);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px)); }
.scene .tint { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.scene .who { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 170px); width: 52vw; max-width: 300px; transition: transform .35s, opacity .35s; }
.scene .who img { width: 100%; display: block; filter: drop-shadow(0 10px 20px rgba(10,20,40,.35)); }
.scene .who.l { left: 4vw; } .scene .who.r { right: 4vw; }
.scene .who.dim { opacity: .4; transform: scale(.94); }
.scene .box { position: relative; max-width: 620px; width: 100%; margin: 0 auto; background: rgba(255,255,255,.96); border-radius: 22px; padding: 16px 18px 18px; box-shadow: var(--shadow); min-height: 118px; }
.scene .box .nm { position: absolute; top: -16px; left: 18px; background: var(--c, var(--ink)); color: #fff; font-family: var(--f-display); font-size: 15px; padding: 5px 14px; border-radius: 12px; }
.scene .box .tx { font-size: 16px; line-height: 1.75; margin-top: 6px; min-height: 56px; }
.scene .box.nar { background: rgba(21,40,66,.9); color: #F1F6FF; }
.scene .box.nar .tx { font-family: var(--f-display); font-size: 16.5px; }
.scene .skip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 2; }
.scene .more { position: absolute; right: 16px; bottom: 10px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid currentColor; opacity: .5; animation: bob 1s infinite; }
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

.handoff { position: absolute; inset: 0; z-index: 45; background: rgba(22,32,58,.82); display: grid; place-items: center; color: #fff; text-align: center; padding: 24px; }
.handoff img { width: 120px; height: 120px; border-radius: 50%; background: var(--c); }
.handoff h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 12px 0 18px; }

@media (min-width: 720px) {
  .chips { max-width: 620px; }
  #hud { align-items: flex-start; }
  .topbar { width: min(620px, 100%); }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .banner, .toast { transition: none !important; animation: none !important; }
}

@media (max-width: 459px) {
  .chip { padding: 4px 6px 4px 4px; gap: 5px; }
  .chip .nm { display: none; }
  .chip .cs { font-size: 14px; }
  .ticket { padding: 0 10px; gap: 6px; }
  .ticket b { font-size: 15px; }
  .ticket .xun { display: none; }
  .ticket .season .bz { display: none; }
}

/* ============================================================
   v2：新的鯨、交易、拍賣、委託、特寫、連線、挑戰、收藏
   ============================================================ */
.mt { margin-top: 10px !important; } .mt2 { margin-top: 16px !important; }
.center { text-align: center; }
.lead { margin: 0; font-size: 15.5px; line-height: 1.6; color: var(--ink); }
.rowc { display: flex; gap: 8px; align-items: center; }
.panel .muted { margin: 0; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: 14.5px; border-radius: 13px; }
.scr-head > :last-child:not(h2):not([data-back]) { margin-left: auto; }
.tagc { display: inline-block; font-family: var(--f-display); font-size: 11.5px; line-height: 1; padding: 4px 7px; border-radius: 999px; background: var(--paper-3); color: var(--ink); vertical-align: 2px; }
.tagc.ally { background: #DDF5EC; color: var(--mint-edge); }
.tagc.you { background: var(--ink); color: #fff; }
.tagc.t0 { background: #FFE1E1; color: var(--coral-edge); }
.tagc.t1 { background: #E1EBFF; color: #2F5CC0; }

/* 頂部：地圖機制列、計時 */
.mapbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; min-height: 28px; padding: 4px 12px; border-radius: 14px;
  background: rgba(255,255,255,.88); box-shadow: 0 2px 0 rgba(33,48,82,.12); font-size: 12px; align-self: flex-start; max-width: 100%; cursor: pointer; line-height: 1.35; }
.mapbar b { font-family: var(--f-display); font-weight: 400; font-size: 12.5px; color: var(--song-deep); margin-right: 3px; }
.mapbar i { font-style: normal; color: var(--coral-edge); }
.mapbar .sep { color: var(--paper-3); }
.timer { margin-left: auto; font-family: var(--f-num); font-weight: 600; font-size: 13px; color: var(--ink-2); min-width: 38px; text-align: right; white-space: nowrap; }
.timer:empty { display: none; }
.timer.hot { color: var(--coral-edge); animation: bob 1s infinite; }
.sh-head .timer { align-self: center; font-size: 15px; }
.chip.team0 { border-color: #F2A0A0; }
.chip.team1 { border-color: #93B4F2; }
.chip.off .pt { filter: grayscale(1) opacity(.55); }
.chip.off .you.net { background: var(--coral-edge); }
.chip .badges i.tx { font-family: var(--f-display); font-size: 10.5px; color: var(--coral-edge); }
.chip .badges i.pact { color: var(--mint-edge); }
.sheet.wide { max-width: 760px; }

/* 人潮、建築種類 */
.tr { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 7px; border-radius: 999px; background: var(--paper-3); color: var(--ink-2); font-family: var(--f-body); font-weight: 400; vertical-align: 1px; }
.tr.hi { background: #FFE6B8; color: #8A5A00; }
.tr.lo { background: #E6EBF2; color: var(--ink-3); }
.cards.bts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.btc .art { height: 96px; background: linear-gradient(170deg, #F3F7FD, #fff); }
.btc .art img { width: 84px; height: 96px; object-fit: contain; }
.bt { display: inline-block; font-family: var(--f-body); font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #F1E7FF; color: #5B3A8C; vertical-align: 2px; }

/* 拍賣出價 */
.bidbox { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; margin-top: 12px; }
.bidbox .btn { min-height: 44px; padding: 6px 8px; font-size: 14px; border-radius: 12px; }
.bidbox b { text-align: center; font-size: 26px; font-weight: 700; }
.bidrange { width: 100%; margin: 12px 0 6px; accent-color: var(--sun-edge); height: 30px; }
.bidq { justify-content: center; }

/* 秘密委託 */
.mission { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: #FBF5E6; box-shadow: inset 0 0 0 1px rgba(120,96,50,.18); }
.m-seal { width: 44px; height: 44px; border-radius: 50%; background: #7A4E2D; color: #FFE8C2; display: grid; place-items: center; flex: none; }
.m-seal svg { width: 24px; height: 24px; }
.m-n { font-family: var(--f-display); font-size: 18px; }
.m-d { font-size: 14px; line-height: 1.55; margin-top: 4px; }
.m-r { font-size: 13px; color: var(--ink-2); margin-top: 6px; }

/* 賭坊 */
.gamble { display: flex; justify-content: center; gap: 18px; font-size: 64px; line-height: 1; padding: 6px 0 2px; }
.die3d { display: inline-block; animation: wob 1.1s ease-in-out infinite; }
.die3d:nth-child(2) { animation-delay: .2s; }
@keyframes wob { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-6px); } }

/* 交易 */
.trade .tq { margin-bottom: 10px; }
.pill img { width: 24px; height: 24px; border-radius: 50%; background: var(--pc); vertical-align: middle; margin: -4px 6px -4px -4px; }
.trade .tcol { background: var(--paper-2); border-radius: 16px; padding: 10px; margin-bottom: 10px; }
.trade h4 { font-family: var(--f-display); font-weight: 400; font-size: 15px; margin: 0 0 8px; }
.tks { display: flex; flex-wrap: wrap; gap: 6px; }
.tks + .stepper, .stepper + .tks { margin-top: 8px; }
.tk { appearance: none; border: 0; border-radius: 12px; padding: 7px 10px; background: #fff; font: 13px/1.3 var(--f-body); color: var(--ink); box-shadow: inset 4px 0 0 var(--dc, var(--paper-3)); min-height: 36px; text-align: left; }
.tk.sel { cursor: pointer; }
.tk.on { background: var(--ink); color: #fff; }
.tk.cash { font-family: var(--f-num); font-weight: 600; box-shadow: inset 4px 0 0 var(--gold); }
.tk.card { box-shadow: inset 4px 0 0 var(--violet); }
.stepper { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; gap: 5px; align-items: center; }
.stepper .btn { min-height: 38px; padding: 6px 7px; font-size: 13px; border-radius: 12px; }
.stepper b { text-align: center; font-size: 18px; }
.will { margin: 0 0 12px; padding: 8px 10px; border-radius: 12px; background: #FFF8E1; }
.will span { font-size: 13px; color: var(--ink-2); }
.will .bar { height: 10px; border-radius: 6px; background: var(--paper-3); overflow: hidden; margin-top: 5px; }
.will .bar i { display: block; height: 100%; border-radius: 6px; transition: width .3s; }
.offer { display: flex; flex-direction: column; gap: 8px; }
.offer > div { background: var(--paper-2); border-radius: 14px; padding: 10px; }
.offer b { font-family: var(--f-display); font-weight: 400; font-size: 14px; display: block; margin-bottom: 6px; }
.offer .note { background: none; padding: 0; }

/* 表情、規則 */
.emotes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.emotes .btn { min-height: 52px; font-size: 16px; padding: 8px 4px; }
.rules p { font-size: 14px; line-height: 1.7; margin: 0 0 10px; }
.rules b { font-family: var(--f-display); font-weight: 400; color: var(--song-deep); }

/* 骰子外觀（收藏） */
.die .f { background: linear-gradient(145deg, rgba(255,255,255,.6), rgba(255,255,255,0) 62%), var(--die, #fff); }
.die .f i { background: var(--pip, var(--ink)); }

/* 大場面特寫：角色從左邊衝進斜帶，右邊打出一句話 */
.cutin { position: absolute; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
.ci-band { position: absolute; left: -12%; right: -12%; top: 33%; height: 168px; background: var(--c); background-image: linear-gradient(90deg, rgba(255,255,255,.18), rgba(10,20,40,.32));
  transform: skewY(-6deg) scaleX(0); transform-origin: left center; transition: transform .26s cubic-bezier(.2,.9,.3,1); box-shadow: 0 0 0 4px #fff, 0 18px 40px rgba(20,30,60,.35); }
.cutin.on .ci-band { transform: skewY(-6deg) scaleX(1); }
.ci-st { position: absolute; left: max(2%, calc(50% - 300px)); top: calc(33% - 104px); height: 272px; transform: translateX(-130%); transition: transform .34s .05s cubic-bezier(.2,1.25,.4,1);
  filter: drop-shadow(0 10px 18px rgba(10,20,40,.35)); }
.cutin.on .ci-st { transform: translateX(0); }
.ci-tx { position: absolute; left: max(42%, calc(50% - 60px)); right: 4%; top: 33%; height: 168px; display: flex; flex-direction: column; justify-content: center; gap: 2px; color: #fff;
  transform: translateX(46px); opacity: 0; transition: transform .3s .14s, opacity .3s .14s; text-shadow: 0 2px 0 rgba(10,20,40,.3); }
.cutin.on .ci-tx { transform: none; opacity: 1; }
.cutin.out { opacity: 0; transition: opacity .26s; }
.ci-k { font-family: var(--f-display); font-size: clamp(26px, 8vw, 40px); line-height: 1.1; }
.ci-tx b { font-family: var(--f-display); font-weight: 400; font-size: 17px; opacity: .95; }
.ci-tx q { font-size: 14.5px; line-height: 1.45; quotes: "「" "」"; max-width: 22em; }
.ci-sub { font-size: 12.5px; opacity: .9; }

/* ---------- 畫面 ---------- */
.menu-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.menu-row .btn small { font-family: var(--f-num); }
.menu .menu-row .btn { min-height: 56px; padding: 8px 10px; font-size: 16px; }
.menu .menu-row .btn svg { width: 20px; height: 20px; }
.seg button svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 3px; }
.seg button.locked { color: var(--ink-3); }
.timeline { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--paper-2); font-size: 13px; line-height: 1.5; }
.timeline .btn { min-height: 38px; font-size: 13.5px; padding: 0 12px; flex: none; margin-left: auto; }
.row.on { box-shadow: inset 0 0 0 2px var(--ink); }

/* 樁帳：萬樁行的帳頁 */
.ledger-page { border-radius: 16px; background: #F7F0E1; color: #3B3324; box-shadow: inset 0 0 0 1px rgba(120,96,50,.2), 0 6px 18px rgba(80,60,20,.12); padding: 14px 16px; }
.lp-top, .lp-rows { margin-left: 22px; padding-left: 12px; border-left: 1.5px solid rgba(188,108,37,.4); }
.lp-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: #8A7650; padding-top: 2px; }
.lp-rows { margin-bottom: 12px; padding-top: 8px; }
.lp-row { font-family: var(--f-display); font-size: 18px; line-height: 2; border-bottom: 1px solid rgba(120,96,50,.18); }
.lp-note { border-top: 1.5px dashed rgba(120,96,50,.3); padding-top: 10px; }
.lp-note span { font-size: 12px; color: #8A7650; }
.lp-note p { margin: 4px 0 0; font-size: 14.5px; line-height: 1.75; color: #4A4030; }

/* 地圖、角色 */
.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; }
.mapcard { appearance: none; border: 0; text-align: left; cursor: pointer; border-radius: 16px; background: var(--paper-2); padding: 8px; display: flex; flex-direction: column; gap: 3px; font: inherit; color: inherit; min-width: 0; }
.mapcard img { width: 100%; aspect-ratio: 240 / 150; border-radius: 10px; background: linear-gradient(180deg, #DCEEFF, #F4FAFF); display: block; }
.mapcard b { font-family: var(--f-display); font-weight: 400; font-size: 16px; margin-top: 3px; }
.mapcard span { font-size: 11.5px; color: var(--ink-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mapcard.on { background: #fff; box-shadow: inset 0 0 0 3px var(--ink); }
.mapline { display: flex; gap: 12px; align-items: center; }
.mapline img { width: 118px; max-width: 38%; flex: none; border-radius: 12px; background: linear-gradient(180deg, #DCEEFF, #F4FAFF); }
.mapline > div { min-width: 0; }
.mapline h4 { margin: 0 0 4px; }
.charinfo { display: flex; gap: 12px; align-items: center; }
.charinfo img { width: 84px; flex: none; border-radius: 50% 50% 18px 18px; background: radial-gradient(circle at 50% 70%, var(--c) 0 58%, transparent 59%); }
.charinfo > div { min-width: 0; }
.charinfo b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.charinfo > div > span { display: block; font-size: 12px; color: var(--ink-2); }
.charinfo p { margin: 6px 0 0; font-size: 13px; line-height: 1.55; }
.charinfo p b { font-size: 13.5px; }
.charpick.big { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.charpick img.sil, .row .ic img.sil { filter: brightness(0) opacity(.28); background: none; border-radius: 0; object-fit: contain; }
.charpick button.lock { pointer-events: auto; cursor: default; }
.seat .pt { appearance: none; border: 0; padding: 0; display: grid; place-items: center; }
.seat .pt[disabled] { cursor: default; }
.seat .plus { font-size: 22px; color: #fff; font-family: var(--f-display); }
.seat.me { background: #FFF6D6; box-shadow: inset 0 0 0 2px var(--sun); }
.opts { margin-top: 6px; }
.opt .tgl[disabled] { opacity: .4; cursor: default; }

/* 列表細節 */
.row.slim { min-height: 0; padding: 8px 12px; }
.row.top { align-items: flex-start; }
.row.off { opacity: .55; }
.row .ic.face { width: 56px; height: 56px; border-radius: 50%; }
.row .ic.face img { width: 56px; height: 56px; }
.row .ic.mapic { width: 64px; height: 42px; border-radius: 10px; background: linear-gradient(180deg, #DCEEFF, #F4FAFF); }
.row .ic.mapic img { width: 64px; height: 40px; }

/* 挑戰星星 */
.stars { display: inline-flex; gap: 1px; flex: none; }
.stars i { width: 20px; height: 20px; color: #D5DDE8; display: grid; place-items: center; }
.stars i svg { width: 19px; height: 19px; }
.stars i.on { color: var(--gold); }
.hstars { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--ink-2); padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.9); }
.hstars svg { width: 18px; height: 18px; color: var(--gold); }
.hstars b { font-size: 18px; color: var(--ink); }
.panel h4 .need { float: right; font-family: var(--f-body); font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
.panel h4 .need svg { width: 14px; height: 14px; }
.starline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.starline > div { background: var(--paper-2); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.starline > div.on { background: #FFF4D2; box-shadow: inset 0 0 0 2px var(--gold); }
.starline b { font-size: 15px; }
.starline .stars i { width: 16px; height: 16px; } .starline .stars i svg { width: 15px; height: 15px; }

/* 收藏 */
.cosgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.cos { appearance: none; border: 0; cursor: pointer; border-radius: 18px; background: rgba(255,255,255,.95); box-shadow: var(--shadow-s); padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; color: inherit; text-align: center; min-width: 0; }
.cos img { width: 92px; height: 92px; border-radius: 14px; background: linear-gradient(180deg, #E7F3FF, #fff); }
.cos b { font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.cos span { font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }
.cos.on { box-shadow: inset 0 0 0 3px var(--mint), var(--shadow-s); }
.cos.on span { color: var(--mint-edge); }
.cos.lock img { filter: grayscale(1) opacity(.45); }

/* 輸入框 */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.field span { font-family: var(--f-display); font-size: 15px; }
.field input, .codein { appearance: none; border: 1.5px solid var(--paper-3); background: var(--paper-2); color: var(--ink); border-radius: 14px; padding: 12px 14px; font: 16px var(--f-body); outline: none; min-height: 48px; width: 100%; user-select: text; -webkit-user-select: text; }
.field input:focus, .codein:focus { border-color: var(--sky-deep); background: #fff; }
.joinrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.codein { font-family: var(--f-num); font-weight: 600; font-size: 24px; letter-spacing: .35em; text-transform: uppercase; text-align: center; }
.joinrow .btn { min-width: 96px; }

/* 連線房間 */
.roomcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.roomcard > div span { font-size: 13px; color: var(--ink-2); display: block; }
.roomcode { font-family: var(--f-num); font-weight: 700; font-size: 44px; letter-spacing: .18em; line-height: 1.05; color: var(--ink); }
.roomcard .btn svg { width: 18px; height: 18px; }
.roomcard .muted { grid-column: 1 / -1; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #C9D2E0; flex: none; margin: 0 6px; }
.dot.on { background: var(--mint); box-shadow: 0 0 0 4px rgba(45,190,136,.18); }
.netst { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: #fff; }
.netst.bad { color: var(--coral-edge); }
.pills.ro .pill { pointer-events: none; }
.pills.ro .pill:not(.on) { opacity: .5; }

/* 結算 */
.restitle { font-family: var(--f-display); font-size: 30px; line-height: 1.2; text-wrap: balance; }
.teamsum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.teamsum > div { border-radius: 14px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
.teamsum .t0 { background: #FFE8E8; } .teamsum .t1 { background: #E6EEFF; }
.teamsum .w { box-shadow: inset 0 0 0 2px var(--gold); }
.teamsum span { font-family: var(--f-display); font-size: 15px; }
.teamsum b { font-size: 18px; }
.scene.endcard { justify-content: center; align-items: center; text-align: center; }
.scene.endcard .box { max-width: 440px; }
.scene.endcard .tx { font-size: 22px; }
.scene.endcard .ln { margin: 12px 0 0; font-size: 15.5px; line-height: 1.65; }
.scene.endcard .fin { margin: 12px 0 0; opacity: .7; font-size: 13px; }

@media (max-width: 380px) {
  .menu .menu-row .btn { font-size: 15px; }
  .roomcode { font-size: 38px; }
  .ci-tx q { font-size: 13.5px; }
}

.frags.l8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; max-width: 400px; margin: 0 auto; }
.frags.l8 .fragb { min-width: 0; padding: 6px 0; }

/* ============================================================
   故事模式三幕制
   ============================================================ */
.storybar { display: flex; flex-direction: column; gap: 3px; padding: 6px 12px 6px 6px; border-radius: 16px; background: rgba(255,255,255,.95);
  box-shadow: 0 3px 0 rgba(30,50,90,.14); cursor: pointer; max-width: 100%; align-self: flex-start; min-width: 0; }
.storybar .sb-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.storybar .sb-act { flex: none; font-family: var(--f-display); font-size: 13px; color: #fff; background: var(--ink); border-radius: 10px; padding: 3px 9px; }
.storybar .sb-act.fin { background: linear-gradient(90deg, #8E3B46, #C2512D); }
.storybar .sb-goal { font-size: 13px; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.storybar .sb-goal b { font-family: var(--f-num); font-weight: 600; color: var(--coral-edge); margin-left: 2px; }
.storybar .sb-goal b.ok { color: var(--mint-edge); }
.storybar .sb-goal i { font-style: normal; color: var(--ink-3); margin-left: 6px; font-size: 12px; }
.storybar .sb-goal.done { color: #9A6B00; font-family: var(--f-display); display: inline-flex; align-items: center; gap: 4px; }
.storybar .sb-goal.done svg, .storybar svg { width: 16px; height: 16px; color: var(--gold); }
.storybar .sep { color: var(--ink-3); margin: 0 2px; }
.storybar .sb-st { flex: none; font-family: var(--f-display); font-size: 12px; padding: 2px 8px; border-radius: 8px; background: var(--paper-2); color: var(--ink-2); }
.storybar .sb-st.up { background: #DDF6EA; color: var(--mint-edge); }
.storybar .sb-st.down { background: #FFE3E3; color: var(--coral-edge); }
.storybar .sb-sub { font-size: 12.5px; color: var(--ink-2); padding-left: 2px; }
.storybar .sb-req { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.storybar .sb-req img { width: 22px; height: 22px; border-radius: 50%; flex: none; background: var(--paper-2); }
.storybar .sb-req i { font-style: normal; color: var(--ink-3); margin-left: 4px; }
.storybar .sb-req.on { color: #7A4E2D; }

/* 幕列表（劇本面板、章節頁） */
.acts { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 4px; }
.act-row { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--paper-2); }
.act-row .no { grid-row: 1 / span 2; font-family: var(--f-display); font-size: 13px; color: #fff; background: var(--ink-2); border-radius: 9px; padding: 4px 8px; }
.act-row b { font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.act-row small { grid-column: 2; color: var(--ink-2); font-size: 12.5px; }
.act-row .star { grid-column: 3; grid-row: 1 / span 2; width: 28px; height: 28px; }
.act-row .star svg { width: 28px; height: 28px; color: #D3DAE6; }
.act-row .star.on svg { color: var(--gold); }
.act-row .star.miss svg { color: #E8C6C6; }
.act-row.cur { background: #FFF3CC; box-shadow: inset 0 0 0 2px var(--sun); }
.act-row.cur .no { background: var(--ink); }
.act-row.later { opacity: .6; }
.gline { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin: 8px 0; font-size: 14px; }
.gline b { font-family: var(--f-num); font-weight: 600; color: var(--coral-edge); }
.gline.ok b { color: var(--mint-edge); }
.gline .bar { grid-column: 1 / -1; height: 8px; border-radius: 6px; background: var(--paper-3); overflow: hidden; }
.gline .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), var(--gold)); border-radius: 6px; }
.gline.ok .bar i { background: linear-gradient(90deg, #6FE0B0, var(--mint)); }
.fin-now { font-size: 15px; margin-top: 6px; }
.fin-now b { font-family: var(--f-num); font-weight: 600; }
.reqrow { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; text-align: left; font: inherit; color: inherit; padding: 8px; border-radius: 14px; background: var(--paper-2); margin-top: 6px; cursor: pointer; }
.reqrow img { width: 44px; height: 44px; border-radius: 50%; flex: none; background: #fff; }
.reqrow span { font-size: 13.5px; line-height: 1.45; }
.reqrow b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.reqrow.done { opacity: .6; }
.reqrow.fail { opacity: .5; }
.reqrow.on { background: #FFF3CC; }
.reqcard { display: flex; gap: 14px; align-items: flex-start; }
.reqcard > img { width: 80px; height: 80px; border-radius: 50%; flex: none; background: var(--paper-2); box-shadow: 0 0 0 4px var(--c); }
.reqcard b { font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--ink-2); }
.reqcard .rq-t { margin: 4px 0 8px; font-family: var(--f-display); font-size: 20px; line-height: 1.35; }
.choices2 { display: flex; flex-direction: column; gap: 10px; }
.choices2 .btn { width: 100%; justify-content: flex-start; text-align: left; padding: 12px 16px; min-height: 68px; }
.choices2 .btn small { font-size: 13px; color: var(--ink-2); font-family: var(--f-body); }
.who-c { display: inline-flex; align-items: center; gap: 6px; color: var(--c); font-family: var(--f-display); }
.who-c img { width: 26px; height: 26px; border-radius: 50%; background: var(--paper-2); }
.cstars { display: inline-flex; gap: 1px; margin-left: 8px; vertical-align: -2px; }
.cstars i svg { width: 15px; height: 15px; color: #D3DAE6; }
.cstars i.on svg { color: var(--gold); }
.actstars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.actstars > div { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 14px; background: var(--paper-2); }
.actstars .st svg { width: 34px; height: 34px; color: #D3DAE6; }
.actstars .on .st svg { color: var(--gold); filter: drop-shadow(0 2px 0 var(--sun-edge)); }
.actstars b { font-family: var(--f-display); font-weight: 400; font-size: 14px; }
.actstars small { font-size: 12px; color: var(--ink-2); }

/* 全螢幕卡片：幕卡、幕末、大戲 */
.scard { position: absolute; inset: 0; z-index: 46; display: grid; place-items: center; padding: 24px var(--gutter-r) 24px var(--gutter-l);
  background: rgba(18,28,54,.62); opacity: 0; transition: opacity .3s; }
.scard.on { opacity: 1; }
.scard.out { opacity: 0; }
.scard .sc-in { width: min(100%, 440px); background: #FFFDF6; border-radius: 28px; padding: 26px 22px 20px; text-align: center; box-shadow: 0 18px 50px rgba(10,20,50,.4);
  transform: translateY(24px) scale(.96); transition: transform .35s cubic-bezier(.2,1.3,.4,1); max-height: 100%; overflow: auto; }
.scard.on .sc-in { transform: none; }
.scard .sc-k { font-size: 13px; color: var(--ink-2); letter-spacing: .04em; }
.scard .sc-big { font-family: var(--f-display); font-size: 40px; line-height: 1.15; margin-top: 6px; }
.scard .sc-name { font-family: var(--f-display); font-size: 24px; color: var(--song-deep); margin-top: 2px; }
.scard .sc-months { display: inline-block; margin-top: 8px; font-size: 12.5px; padding: 3px 10px; border-radius: 9px; background: var(--paper-2); color: var(--ink-2); }
.scard .sc-goal { list-style: none; margin: 16px 0 6px; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.scard .sc-goal li { position: relative; padding: 10px 12px 10px 40px; border-radius: 14px; background: var(--paper-2); font-size: 16px; line-height: 1.4; }
.scard .sc-goal li::before { content: ''; position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 6px; border: 2.5px solid var(--ink-3); }
.scard .sc-goal li.ok::before { border-color: var(--mint); background: var(--mint); box-shadow: inset 0 0 0 3px #fff; }
.scard .sc-hint, .scard .sc-desc { font-size: 14px; color: var(--ink-2); line-height: 1.6; margin: 10px 0 0; }
.scard .sc-desc { font-size: 16px; color: var(--ink); text-align: left; }
.scard .sc-fin { margin-top: 16px; padding: 14px; border-radius: 18px; background: linear-gradient(160deg, #FFE9D6, #FFF6E8); text-align: left; }
.scard .sc-fin span { font-size: 12.5px; color: #A0522D; }
.scard .sc-fin b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; color: #8E3B46; }
.scard .sc-fin p { margin: 6px 0 0; font-size: 15px; line-height: 1.6; }
.scard .sc-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.scard .sc-btns .btn { width: 100%; }
.scard .sc-star { margin: 10px auto 0; width: 92px; height: 92px; }
.scard .sc-star svg { width: 92px; height: 92px; color: #D3DAE6; transition: transform .4s; }
.scard .sc-star.on svg { color: var(--gold); filter: drop-shadow(0 4px 0 var(--sun-edge)); animation: starpop .7s cubic-bezier(.2,1.6,.4,1); }
@keyframes starpop { 0% { transform: scale(.2) rotate(-40deg); } 100% { transform: none; } }
.scard.fin .sc-big, .scard.finstart .sc-big { color: #8E3B46; }
.scard.finstart .sc-in { background: linear-gradient(180deg, #FFF4E4, #FFFDF6 60%); }
.scard .fr-rows { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 6px; }

  /* 擲骰前：用卡、賣股、交易，最後擲骰 */
  P.prePhase = async function (p, mods) {
    for (var guard = 0; guard < 16; guard++) {
      if (!p.alive || this.G.over) return;
      var act = await this.ask(p, 'pre', { mods: mods, opts: this.diceOptions(p, mods) });
      if (!act || act.k === 'roll') {
        var opts = this.diceOptions(p, mods);
        mods.n = (act && opts.indexOf(act.n) >= 0) ? act.n : opts[opts.length > 1 ? 1 : 0];
        if (act && act.remote) mods.remote = act.remote;
        return;
      }
      if (act.k === 'card') {
        await this.useCard(p, act.cid, act.tgt, mods);
        if (mods.flown || !p.alive) return;
        if (mods.remote) return;
        continue;
      }
      if (act.k === 'sell') { this.sellShares(p, act.d, act.n); continue; }
      if (act.k === 'trade' && this.G.rules.trade) { await this.proposeTrade(p, act.offer); continue; }
      if (act.k === 'repay') { this.repay(p, act.amt); continue; }
    }
    mods.n = 2;
  };

  P.post = async function (p, moved) {
    var G = this.G;
    if (!p.alive || G.over) return;
    if (G.rules.curse && G.curse.h === p.id) await this.curseAct(p);
    if (!p.alive || G.over) return;
    if (G.storm.h === p.id) await this.stormAct(p);
    if (!p.alive || G.over) return;
    if (p.comp) {
      p.comp.t--;
      if (p.comp.t <= 0) { var c = p.comp.id; p.comp = null; await this.fx('comp-end', { p: p, comp: c }); }
    }
    if (p.passed && p.alive) await this.portPhase(p);
    if (p.cash < 0) await this.raise(p, null);
    if (!p.alive || G.over) return;
    this.checkMission(p);
    if (this.challengeCheck) await this.challengeCheck(p);
    if (G.over) return;
    if (G.story && this.storyPost) await this.storyPost(p);
    if (!p.alive || G.over) return;
    // 提前勝利
    if (G.rules.target > 0 && p.passed && this.nw(p) >= G.rules.target * this.econ()) {
      await this.finish(p.id);
    }
  };

  /* ---------- 移動 ---------- */
  P.move = async function (p, path, reverse) {
    var G = this.G, met = {};
    for (var i = 0; i < path.length; i++) {
      var tid = path[i], from = p.pos;
      p.pos = tid;
      await this.fx('step', { p: p, tid: tid, i: i, n: path.length, reverse: reverse });
      var t = this.tile(tid);
      if (t.bridge && !this.tile(from).bridge) { p.st.bridges++; }
      if (!reverse && t.t === 'start') {
        p.passed = true;
        await this.salary(p, i === path.length - 1);
      }
      // 撿金鱗精
      if (G.rules.spirits && G.gold.tile === tid && G.gold.h < 0) await this.goldTake(p, null, 'pick');
      if (G.story && this.storyStep) { await this.storyStep(p, tid, i === path.length - 1); if (!p.alive || G.over) return; }
      var others = G.players.filter(function (q) { return q.alive && q.id !== p.id && q.pos === tid; });
      for (var k = 0; k < others.length; k++) {
        var q = others[k];
        if (met[q.id]) continue;
        met[q.id] = 1;
        await this.passBy(p, q, i === path.length - 1);
        if (!p.alive || G.over) return;
      }
      if (G.rules.dest && tid === G.dest) { await this.arrive(p); break; }
    }
  };
  /* 經過別人時發生的事 */
  P.passBy = async function (p, q, landing) {
    var G = this.G, e = this.econ();
    var enemy = !this.ally(p, q);
    if (enemy && p.char === 'nichang' && q.cash > 0) {
      var amt = r10(Math.min(q.cash * 0.025, 600 * e));
      if (amt > 0) { q.cash -= amt; p.cash += amt; await this.fx('steal', { from: q, to: p, amt: amt }); }
    }
    if (enemy && p.comp && p.comp.id === 'fox' && q.cash > 0) {
      var fa = r10(Math.min(q.cash * 0.03, 800 * e));
      if (fa > 0) { q.cash -= fa; p.cash += fa; await this.fx('steal', { from: q, to: p, amt: fa, why: '霧狐' }); }
    }
    if (q.char === 'pang' && !this.ally(p, q) && !p._pangPaid[q.id] && !landing) {
      p._pangPaid[q.id] = 1;
      var pf = r10(300 * e);
      this.log(p.name + ' 經過' + q.name + '，付縴費 ' + pf);
      await this.fx('toll', { from: p, to: q, amt: pf, tid: p.pos, why: '縴費' });
      await this.charge(p, pf, q);
      if (!p.alive) return;
    }
    if (enemy && G.rules.curse && G.curse.h === p.id && !p._spiritMoved.curse && q.char !== 'lan' && !(q.fl.vaccine > G.round)) {
      p._spiritMoved.curse = true;
      await this.passCurse(p, q, 'pass');
    }
    if (enemy && G.rules.spirits && G.storm.h === p.id && !p._spiritMoved.storm) {
      p._spiritMoved.storm = true;
      G.storm.h = q.id; p.st.stormPass++;
      if (p.human) this.ach(p, 'storm_pass');
      this.log(p.name + ' 把雷雲精甩給了 ' + q.name);
      await this.fx('stormpass', { from: p, to: q });
    }
    if (enemy && G.rules.spirits && G.gold.h === q.id && !p._spiritMoved.gold && G.round >= (G.gold.lock || 0)) {
      p._spiritMoved.gold = true;
      await this.goldTake(p, q, 'steal');
    }
  };

  P.teleport = async function (p, tid, how) {
    var from = p.pos;
    p.pos = tid;
    await this.fx('fly', { p: p, from: from, tid: tid, how: how || 'air' });
    if (p.char === 'tie' && (how === 'air' || how === 'train')) { var tf = r10(300 * this.econ()); p.cash += tf; this.fxNow('income', { p: p, amt: tf, why: '車馬費' }); }
    if (this.tile(tid).t === 'start' && how !== 'swap') { p.passed = true; await this.salary(p, true); }
    if (this.G.rules.spirits && this.G.gold.tile === tid && this.G.gold.h < 0) await this.goldTake(p, null, 'pick');
    if (this.G.rules.dest && tid === this.G.dest && how !== 'swap') await this.arrive(p);
  };

  P.salary = async function (p, landed) {
    var amt = K.SALARY * this.econ();
    if (p.comp && p.comp.id === 'manta') amt *= 2;
    if (p.comp && p.comp.id === 'sheep') amt *= 1.5;
    if (p.char === 'bojin') amt *= 1.5;
    if (this.mod('salaryx2')) amt *= 2;
    if (this.mod('salaryhalf')) amt *= 0.5;
    if (this.G.gold.h === p.id) amt *= 1.2;
    if (landed) amt *= 1.5;
    amt = r100(amt);
    p.cash += amt;
    p.st.ports++;
    if (p.char === 'dove') p.fl.express = 1;
    this.log(p.name + ' 回到渡口，領薪水 ' + amt);
    await this.fx('salary', { p: p, amt: amt, landed: landed });
    // 港務局
    var G = this.G, self = this;
    for (var i = 0; i < this.map.tiles.length; i++) {
      var m = this.map.tiles[i], s = G.tiles[i];
      if (m.t === 'mark' && s.mk === 'harbor' && s.o >= 0 && s.o !== p.id && !this.friendly(p, G.players[s.o]) && G.players[s.o].alive) {
        var hf = r10([0, 300, 500, 800][s.lv] * this.econ());
        await this.fx('toll', { from: p, to: G.players[s.o], amt: hf, tid: i, why: '港務費' });
        await this.charge(p, hf, G.players[s.o]);
        if (!p.alive) return;
      }
    }
  };

  /* ---------- 落點 ---------- */
  P.land = async function (p, depth) {
    var G = this.G, t = this.tile(p.pos), s = this.st(p.pos);
    switch (t.t) {
      case 'lot': await this.landLot(p, t, s); break;
      case 'mark': if (G.rules.marks) await this.landMark(p, t, s); break;
      case 'station': await this.landStation(p, t, s, depth); break;
      case 'forge': await this.landForge(p, t, s); break;
      case 'card':
        await this.drawCard(p);
        if (p.alive && p.comp && p.comp.id === 'owl') await this.drawCard(p, '夜梟');
        if (p.alive && this.mod('cardrain')) await this.drawCard(p, '卡片雨');
        break;
      case 'event': await this.event(p, depth || 0); break;
      case 'shop': await this.shop(p); break;
      case 'tax': {
        var amt = r10(Math.max(300 * this.econ(), p.cash * 0.1));
        G.pool += amt;
        this.log(p.name + ' 繳稅 ' + amt);
        await this.fx('tax', { p: p, amt: amt });
        await this.charge(p, amt, null);
        break;
      }
      case 'pool': {
        if (G.pool > 0) {
          var got = G.pool; G.pool = 0; p.cash += got; p.st.pools++;
          if (got > p.st.poolMax) p.st.poolMax = got;
          this.log(p.name + ' 領走許願池 ' + got);
          await this.fx('pool', { p: p, amt: got });
          if (p.human && got >= 5000) this.ach(p, 'pool5k');
        } else await this.fx('pool', { p: p, amt: 0 });
        break;
      }
      case 'nest': p.st.nests++; await this.nest(p); break;
      case 'air': {
        if (depth > 0) break;
        var opts = this.flyOptions(p.pos);
        var fee = p.char === 'tie' ? 0 : r10(600 * this.econ());
        if (opts.length && p.cash >= fee) {
          var to = await this.ask(p, 'fly', { opts: opts, fee: fee });
          if (to != null && to >= 0 && opts.indexOf(to) >= 0) {
            p.cash -= fee; G.pool += fee;
            await this.teleport(p, to, 'air');
            if (this.tile(to).t !== 'air') await this.land(p, depth + 1);
          }
        }
        break;
      }
      case 'storm': p.stuck = 1; this.log(p.name + ' 被風暴困住一回合'); await this.fx('storm', { p: p }); break;
      case 'exch': if (G.rules.stocks) await this.exchPhase(p); break;
      case 'oil': await this.landOil(p); break;
      case 'casino': await this.casino(p); break;
      case 'start': break;
    }
  };
  P.flyOptions = function (from) {
    var out = [];
    var self = this;
    this.map.tiles.forEach(function (t) { if ((t.t === 'air' || t.t === 'start') && t.id !== from && self.reach(t.id)) out.push(t.id); });
    return out;
  };

  P.landLot = async function (p, t, s) {
    var G = this.G;
    if (s.o < 0) {
      var price = this.buyPrice(p, t.id);
      var yes = false;
      if (G.rules.auction && this.mod('auctionall')) { await this.auction(t.id, null, null, p); return; }
      if (p.cash >= price) {
        await this.tip(p, 'buy');
        yes = await this.ask(p, 'buy', { tid: t.id, price: price });
        if (yes && p.cash >= price) this.doBuy(p, t.id, price);
        else yes = false;
      } else await this.fx('cantafford', { p: p, tid: t.id, price: price });
      if (!yes && G.rules.auction && s.o < 0) await this.auction(t.id, p, null);
      return;
    }
    if (s.o === p.id) {
      if (this.canUp(p.id, t.id)) {
        var cost = this.upCost(p, t.id);
        if (p.cash >= cost) {
          var up = await this.ask(p, 'up', { tid: t.id, cost: cost, needType: !!(G.rules.btypes && s.lv === 0) });
          if (up && p.cash >= cost) await this.doUpgrade(p, t.id, false, up);
        }
      } else await this.fx('home', { p: p, tid: t.id });
      return;
    }
    var owner = G.players[s.o];
    var amt = this.toll(t.id, { payer: p });
    await this.tip(p, 'toll');
    if (amt > 0) await this.payOwner(p, owner, amt, t.id);
    else await this.fx('toll', { from: p, to: owner, amt: 0, tid: t.id, free: true, ally: this.friendly(p, owner) });
    if (!p.alive || G.over) return;
    // 強制收購
    if (G.rules.buyout && s.o >= 0 && s.o !== p.id && G.round >= s.prot && !this.immune(t.id) && !this.ally(p, owner) && !(owner.fl.wall > G.round)) {
      var bp = this.buyoutPrice(t.id);
      if (p.cash >= bp) {
        await this.tip(p, 'buyout');
        var b = await this.ask(p, 'buyout', { tid: t.id, price: bp });
        if (b && p.cash >= bp && s.o >= 0 && s.o !== p.id) await this.doBuyout(p, t.id, bp);
      }
    }
  };

  P.payOwner = async function (p, owner, amt, tid, why) {
    var G = this.G;
    if (p.comp && p.comp.id === 'misteel') {
      this.log(p.name + ' 的霧鰻吞掉了過路費');
      await this.fx('toll', { from: p, to: owner, amt: amt, tid: tid, waived: 'misteel' });
      return;
    }
    var wi = p.cards.indexOf('waiver');
    if (wi >= 0) {
      p.cards.splice(wi, 1);
      this.log(p.name + ' 用免單券躲過 ' + amt);
      await this.fx('toll', { from: p, to: owner, amt: amt, tid: tid, waived: 'waiver' });
      return;
    }
    if (p.comp && p.comp.id === 'glassfish') amt = r10(amt * 0.5);
    if (p.fl.insurance > 0 && amt >= 3000 * this.econ()) { p.fl.insurance--; amt = r10(amt * 0.5); await this.fx('insured', { p: p }); }
    if (p.char === 'dice') {
      var heads = this.rnd() < 0.5;
      p.st.gambles++;
      await this.fx('coinflip', { p: p, heads: heads, amt: amt });
      if (heads) { p.st.gambleWin++; this.log(p.name + ' 擲出正面，過路費免付'); return; }
      amt = r10(amt * 1.5);
    }
    p.st.tollPaid += amt; owner.st.tollGot += amt; owner.st.tollCount++;
    if (amt > p.st.maxPaid) p.st.maxPaid = amt;
    if (amt > owner.st.maxGot) owner.st.maxGot = amt;
    this.log(p.name + ' 付給 ' + owner.name + (why ? ' ' + why : ' 過路費') + ' ' + amt);
    var big = amt >= Math.max(3000, p.cash * 0.25);
    await this.fx('toll', { from: p, to: owner, amt: amt, tid: tid, big: big, why: why });
    if (Math.random() < 0.55) await this.bark(big ? p : owner, big ? 'payB' : 'get');
    if (owner.human && amt >= 10000) this.ach(owner, 'big_toll');
    if (p.human && amt >= 10000) this.ach(p, 'ouch');
    var tile = this.tile(tid);
    if (tile.t === 'lot' && G.rules.stocks) this.dividends(tile.d, amt);
    if (tile.t === 'lot' && G.rules.btypes && G.tiles[tid].bt === 'workshop' && G.tiles[tid].lv > 0 && owner.cards.length < K.HAND) { owner.cards.push(this.randCard(owner)); this.fxNow('income', { p: owner, amt: 0, why: '工坊產出一張卡' }); }
    await this.charge(p, amt, owner);
  };

  P.dividends = function (d, amt) {
    var G = this.G, self = this, paid = 0;
    G.players.forEach(function (q) {
      var n = q.shares[d] || 0;
      if (!q.alive || n <= 0) return;
      var v = amt * K.DIV * n;
      if (q.char === 'ji') v *= 2.5;
      if (q.comp && q.comp.id === 'manta') v *= 2;
      v = Math.min(v, amt - paid);
      v = r10(v);
      if (v <= 0) return;
      paid += v;
      q.cash += v;
      q.st.stockGain += v; q.st.divGot += v;
      self.fxNow('dividend', { p: q, amt: v, d: d });
    });
  };

  /* 付款（可欠款，之後變賣） */
  P.charge = async function (p, amt, to) {
    p.cash -= amt;
    if (to) to.cash += amt;
    if (p.cash < 0) await this.raise(p, to);
  };

  P.doBuy = function (p, tid, price) {
    var G = this.G, t = this.tile(tid), s = this.st(tid);
    p.cash -= price;
    if (p.fl.discount) p.fl.discount = 0;
    s.o = p.id; s.lv = 0; s.inv = 0; s.bt = null;
    this.log(p.name + ' 買下 ' + this.dname(tid) + '（' + price + '）');
    this.fxNow('buy', { p: p, tid: tid, price: price });
    if (Math.random() < 0.45) this.fxNow('bark', { p: p, key: 'buy' });
    // 照影抽仲介費
    var self = this;
    G.players.forEach(function (q) {
      if (q.alive && q.char === 'twins' && q.id !== p.id) { var c = r10(price * 0.08); if (c > 0) { q.cash += c; self.fxNow('income', { p: q, amt: c, why: '仲介費' }); } }
    });
    if (t.d) this.checkMono(p, t.d);
    this.holdAch(p);
  };
  P.checkMono = function (p, d) {
    if (!d || !this.map.dists[d]) return;
    if (this.isMono(p.id, d)) {
      p.st.mono = true;
      this.log(p.name + ' 壟斷了「' + this.map.dists[d].name + '」');
      this.fxNow('mono', { p: p, d: d });
      if (p.human) this.ach(p, 'monopoly');
    }
  };
  /* 加蓋：type 是第一次加蓋時選的建築種類 */
  P.doUpgrade = function (p, tid, free, type) {
    var G = this.G, s = this.st(tid);
    if (!this.canUp(p.id, tid)) return false;
    var cost = free ? 0 : this.upCost(p, tid);
    if (p.cash < cost) return false;
    p.cash -= cost;
    if (s.lv === 0) {
      var bt = (typeof type === 'string' && K.BT[type]) ? type : null;
      if (G.rules.btypes && !bt) bt = 'inn';
      s.bt = G.rules.btypes ? bt : null;
    }
    s.inv += r10(this.price(tid) * K.UPC[s.lv]);
    s.lv++;
    p.st.builds++;
    if (s.lv > p.st.maxLv) p.st.maxLv = s.lv;
    if (p.human && s.lv === 4) this.ach(p, 'max_build');
    if (G.rules.vitality) { if (s.lv === 3) this.vitHit(2); if (s.lv === 4) this.vitHit(3); }
    this.log(p.name + ' 把 ' + this.dname(tid) + ' 蓋到第 ' + s.lv + ' 層');
    this.fxNow('upgrade', { p: p, tid: tid, lv: s.lv, cost: cost, free: !!free, bt: s.bt });
    if (s.lv === 1) this.holdAch(p);
    this.afterBuild(p, cost);
    return true;
  };
  /* 蓋完：樁價、熔爐佣金、范璃佣金 */
  P.afterBuild = function (p, cost) {
    var G = this.G, self = this;
    if (this.map.pile) G.pile = Math.min(1.8, Math.round((G.pile + 0.03) * 100) / 100);
    if (cost <= 0) return;
    for (var i = 0; i < this.map.tiles.length; i++) {
      var t = this.map.tiles[i], s = G.tiles[i];
      if (t.t === 'forge' && s.o >= 0 && s.o !== p.id && G.players[s.o].alive && !this.friendly(p, G.players[s.o])) {
        var c = r10(cost * 0.1);
        if (c > 0) { G.players[s.o].cash += c; G.players[s.o].st.forgeGot = (G.players[s.o].st.forgeGot || 0) + c; this.fxNow('income', { p: G.players[s.o], amt: c, why: '熔爐佣金' }); }
      }
    }
    G.players.forEach(function (q) {
      if (q.alive && q.char === 'fan' && q.id !== p.id) { var c2 = r10(cost * 0.03); if (c2 > 0) { q.cash += c2; self.fxNow('income', { p: q, amt: c2, why: '包工佣金' }); } }
    });
  };
  P.doBuyout = async function (p, tid, price) {
    var G = this.G, s = this.st(tid), owner = G.players[s.o];
    p.cash -= price; owner.cash += price;
    s.o = p.id; s.prot = G.round + 2;
    p.st.buyouts++;
    this.log(p.name + ' 強制收購 ' + owner.name + ' 的 ' + this.dname(tid) + '（' + price + '）');
    await this.fx('buyout', { p: p, from: owner, tid: tid, price: price });
    if (p.human) this.ach(p, 'buyout');
    await this.bark(p, 'buyout');
    if (Math.random() < 0.6) await this.bark(owner, 'victim');
    this.checkMono(p, this.tile(tid).d);
  };

  P.landMark = async function (p, t, s) {
    var G = this.G;
    if (s.o < 0) {
      var price = this.markPrice(p, t.id);
      if (p.cash >= price) {
        await this.tip(p, 'mark');
        var type = await this.ask(p, 'mark', { tid: t.id, price: price, opts: this.markOptions() });
        if (type && WF.MARKS[type] && p.cash >= price && this.markOptions().indexOf(type) >= 0) {
          p.cash -= price;
          s.o = p.id; s.mk = type; s.lv = 1; s.inv = 0;
          p.st.marks++;
          if (p.human && p.st.marks >= 2) this.ach(p, 'landmark2');
          if (G.rules.vitality) this.vitHit(4);
          this.log(p.name + ' 在 ' + t.n + ' 蓋起「' + WF.MARKS[type].n + '」');
          await this.fx('mark', { p: p, tid: t.id, type: type });
          await this.bark(p, 'up');
          this.afterBuild(p, price);
        }
      } else await this.fx('cantafford', { p: p, tid: t.id, price: price });
      return;
    }
    if (s.o === p.id) {
      if (s.lv < 3) {
        var c = this.markUpCost(p, t.id);
        if (p.cash >= c) {
