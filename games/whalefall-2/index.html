  P.shop = async function (p) {
    var pool = this.cardPool(), offers = [];
    while (offers.length < 3 && offers.length < pool.length) {
      var c = this.wpick(pool, function (id) { return offers.indexOf(id) >= 0 ? 0 : WF.RAR_W[WF.CARDS[id].rar]; });
      if (offers.indexOf(c) < 0) offers.push(c);
    }
    var bought = {};
    for (var g = 0; g < 6; g++) {
      var a = await this.ask(p, 'shop', { offers: offers, bought: Object.keys(bought) });
      if (!a || a.k === 'done') break;
      if (a.k === 'buy' && offers.indexOf(a.cid) >= 0 && !bought[a.cid] && p.cards.length < K.HAND && this.buyCard(p, a.cid)) bought[a.cid] = 1;
    }
  };
  P.cardPrice = function (cid) { return r10(WF.CARDS[cid].price * (this.mod('salaryhalf') ? 0.5 : 1)); };
  P.buyCard = function (p, cid) {

    p.cards.push(cid);
    this.log(p.name + ' 在補給舖買了「' + WF.CARDS[cid].n + '」');

    if (p.human) this.io.codex && this.io.codex('cards', cid, p);
    return true;
  };

  /* ---------- 伴靈 ---------- */

  /* ---------- 鯨歌目的地 ---------- */
  P.newDest = async function () {
    var G = this.G, self = this, al = this.alive();
    if (G.destPick >= 0) { var pk = G.destPick; G.destPick = -1; await this.setDest(pk, '指定'); return; }
    var cands = this.map.tiles.filter(function (t) { return (t.t === 'lot' || t.t === 'mark' || t.t === 'station') && t.id !== G.dest && !t.bridge && self.reach(t.id); })
      .map(function (t) {
        var md = 999;
        al.forEach(function (p) { md = Math.min(md, self.dist(p.pos, t.id)); });
        return { t: t, md: md };
      })
      .sort(function (a, b) { return b.md - a.md; });
    var top = cands.slice(0, Math.max(3, Math.round(cands.length * 0.3)));
    await this.setDest(this.pick(top).t.id);
  };
  P.setDest = async function (tid, how) {
    var G = this.G, self = this, al = this.alive();
    G.dest = tid;
    var avg = 0; al.forEach(function (p) { avg += Math.min(self.dist(p.pos, tid), 40); }); avg /= Math.max(1, al.length);
    var rw = (2500 + 120 * Math.min(avg, 30)) * this.econ();
    if (this.mod('songx2')) rw *= 2;
    G.destReward = r100(rw);
    this.log('鯨歌響起：目的地是 ' + this.dname(tid));
    await this.fx('dest', { tid: tid, reward: G.destReward, how: how || '' });
  };
  P.arrive = async function (p) {
    var G = this.G, self = this;
    var reward = G.destReward;
    if (p.comp && p.comp.id === 'babywhale') reward *= 2;
    if (p.char === 'chuan') reward = r100(reward * 1.3);
    for (var i = 0; i < this.map.tiles.length; i++) {
      var mt = this.map.tiles[i], ms = G.tiles[i];
      if (mt.t === 'mark' && ms.mk === 'observatory' && ms.o === p.id) reward = r100(reward * (1 + [0, 0.2, 0.35, 0.5][ms.lv]));
    }
    p.cash += reward;
    p.st.dest++;
    if (G.story && G.story.fin) { G.story.fin.at = G.story.fin.at || {}; G.story.fin.at[p.id] = G.round * 10 + G.turn; }
    this.log(p.name + ' 搶先抵達鯨歌目的地，拿下 ' + reward);
    await this.fx('arrive', { p: p, tid: G.dest, amt: reward });
    await this.bark(p, 'dest');
    if (p.human && p.st.dest >= 3) this.ach(p, 'dest3');
    // 魏長川：每次有人靠岸，他也分到一成
    G.players.forEach(function (q) {
      if (q.alive && q.char === 'chuan' && q.id !== p.id) { var cs = r100(G.destReward * 0.1); if (cs > 0) { q.cash += cs; self.fxNow('income', { p: q, amt: cs, why: '鯨歌分紅' }); } }
    });
    // 鯨歌塔分紅
    for (var j = 0; j < this.map.tiles.length; j++) {
      var t = this.map.tiles[j], s = G.tiles[j];
      if (t.t === 'mark' && s.mk === 'songtower' && s.o >= 0) {
        var ow = G.players[s.o];
        if (ow.alive) {
          var sh = r10(WF.MARKS.songtower.share[s.lv - 1] * this.econ());
          ow.cash += sh;
          this.fxNow('income', { p: ow, amt: sh, why: '鯨歌塔分紅' });
        }
      }
    }
    await this.drawCard(p, '鯨歌');
    // 藤壺精：給離目的地最遠的人
    if (G.rules.curse) {
      var dest = G.dest;
      var cands = this.alive().filter(function (q) { return q.id !== p.id && q.char !== 'lan' && !self.ally(p, q) && !(q.fl.vaccine > G.round); });
      if (cands.length) {
        var far = -1, who = [];
        cands.forEach(function (q) {

        var prev = G.curse.h;

        G.curse = { h: victim.id, lv: keepLv, t: 0, k: 0 };
        this.log('藤壺精纏上了 ' + victim.name);
        await this.fx('curse', { p: victim, prev: prev });

        if (Math.random() < 0.7) await this.bark(victim, 'cursed');
      }
    }
    // 魏長川：指定下一首鯨歌
    if (p.char === 'chuan') {

      var pk = await this.ask(p, 'songdest', { opts: opts });

    }
    G.dest = -1;

  /* ---------- 藤壺精 ---------- */
  P.passCurse = async function (from, to, how) {

  P.curseAct = async function (p) {
    var G = this.G, c = G.curse, self = this, e = this.econ();
    if (p.comp && p.comp.id === 'starfish') { await this.fx('curseact', { p: p, kind: 'nap', amt: 0, lv: c.lv, info: {} }); return; }
    c.t++;
    var need = this.mod('cursefast') ? 3 : 4;
    if (c.t >= need && c.lv < 3) {
      c.lv++; c.t = 0;
      if (c.lv === 3) p.st.king = true;
      this.log('藤壺精進化成「' + (c.lv === 2 ? '大藤壺' : '藤壺王') + '」');
      await this.fx('cursevo', { p: p, lv: c.lv });
    }
    if (c.lv === 3) {
      c.k = (c.k || 0) + 1;
      if (c.k > 5) {
        c.lv = 1; c.t = 0; c.k = 0;
        this.log('藤壺王吃飽了，縮回一隻小藤壺精');
        await this.fx('cursevo', { p: p, lv: 1, full: true });
      }
    }
    var lv = c.lv;
    var table = lv === 1 ? [['nap', 40], ['eat', 25], ['junk', 15], ['card', 10], ['fee', 10]]
      : lv === 2 ? [['nap', 20], ['eat', 30], ['junk', 20], ['wreck', 15], ['sell', 15]]
        : [['nap', 10], ['eat', 30], ['wreck', 25], ['sell', 20], ['feast', 15]];
    var kind = this.wpick(table, function (r) { return r[1]; })[0];
    var amt = 0, info = {};
    switch (kind) {
      case 'nap': break;
      case 'eat': amt = r10(Math.max(200 * e * lv, Math.max(0, p.cash) * [0, 0.06, 0.12, 0.25][lv])); break;
      case 'junk': amt = r10(this.ri(500, 1200) * e * (lv === 2 ? 2 : 1)); break;
      case 'card':
        if (p.cards.length) { var ci = this.ri(0, p.cards.length - 1); info.cid = p.cards.splice(ci, 1)[0]; } else kind = 'nap';
        break;
      case 'fee': {
        var n = this.lotsOf(p.id).length;
        if (!n) kind = 'nap'; else amt = r10(150 * e * n);
        break;
      }
      case 'wreck': {
        var built = this.lotsOf(p.id).filter(function (id) { return self.tile(id).t === 'lot' && G.tiles[id].lv > 0 && !self.immune(id); });
        if (!built.length || (p.comp && p.comp.id === 'turtle')) { kind = 'eat'; amt = r10(Math.max(300 * e, Math.max(0, p.cash) * 0.12)); break; }
        var cnt = lv === 3 ? Math.min(3, built.length) : 1;
        info.tiles = [];
        for (var i = 0; i < cnt; i++) {
          var j = this.ri(0, built.length - 1), tid = built.splice(j, 1)[0];

        }
        if (!info.tiles.length) { kind = 'eat'; amt = r10(Math.max(300 * e, Math.max(0, p.cash) * 0.12)); }
        break;
      }
      case 'sell': {
        var lots = this.lotsOf(p.id).filter(function (id) { return self.tile(id).t === 'lot' && !self.immune(id); });
        if (!lots.length) { kind = 'eat'; amt = r10(Math.max(300 * e, Math.max(0, p.cash) * 0.12)); break; }
        var tid2 = this.pick(lots), v = r10(this.value(tid2) * 0.5);
        var s2 = G.tiles[tid2]; s2.o = -1; s2.lv = 0; s2.inv = 0; s2.bt = null;
        p.cash += v; info.tid = tid2; info.got = v;
        break;
      }
      case 'feast': amt = r10(1000 * e); info.each = amt; break;
    }
    await this.fx('curseact', { p: p, kind: kind, amt: amt, lv: lv, info: info });
    if (kind === 'feast') {
      var rv = this.rivals(p);
      for (var k = 0; k < rv.length; k++) { await this.charge(p, amt, rv[k]); if (!p.alive || G.over) return; }
    } else if (amt > 0) {
      await this.charge(p, amt, null);
    }
  };

  /* ---------- 精怪：金鱗精、雷雲精 ---------- */
  P.goldSpawn = async function () {

  /* ---------- 拍賣 ---------- */
  function bidAsk(p, data, done) {

      '<div class="bidbox"><button class="btn" data-d="-500">−500</button><button class="btn" data-d="-100">−100</button><b class="num" id="bidv"></b><button class="btn" data-d="100">＋100</button><button class="btn" data-d="500">＋500</button></div>' +
      '<input type="range" class="bidrange" min="' + min + '" max="' + maxB + '" step="10" aria-label="出價">' +
      '<div class="pills bidq"><button class="pill" data-q="min">底價</button><button class="pill" data-q="0.8">八成</button><button class="pill" data-q="1">地價</button><button class="pill" data-q="1.3">1.3 倍</button></div>' +
      '<p class="note">' + (seller ? '這塊地是 ' + esc(seller.name) + ' 的，成交的錢歸他。' : '每個人都只能暗中出一次價，最高的人得標。') + (p.char === 'twins' ? '「一錘定音」：得標只付第二高價。' : '') + '</p></div>');

    body.querySelectorAll('[data-q]').forEach(function (b) { b.onclick = function () { AU.sfx('tap'); var q = b.dataset.q; set(q === 'min' ? min : price * (+q)); }; });
    openSheet({ title: '拍賣：' + esc(t.n), sub: '暗中出價。', body: body, timer: !!NET(),
      foot: [{ label: '出價', cls: 'btn-sun', onClick: function () { AU.sfx('gavel'); done(v); } }, { label: '不出價', onClick: function () { done(0); } }] });

  /* ---------- 迴圈型決策：回港、交易所、補給舖 ---------- */
  function loopAsk(kind, p, data, done) {
    var resolve = function (v) { if (v && v.k === 'done') { loop = null; closeSheet(true); } done(v); };
    if (loop && loop.kind === kind && sheetCur === loop.ctl) {

    var title = kind === 'port' ? '回到渡口' : kind === 'exch' ? '交易所' : '補給舖';
    var foot = [{ label: kind === 'port' ? '出港' : '離開', cls: 'btn-sun', onClick: function () { L.resolve({ k: 'done' }); } }];
    L.ctl = openSheet({ title: title, sub: ' ', body: body, foot: foot, timer: !!NET() });
    L.render = function () {
      body.innerHTML = '';
      if (kind === 'shop') body.appendChild(shopBody(L));
      else if (kind === 'exch') { body.appendChild(stockList(p, true, function (a) { L.resolve(a); })); }
      else body.appendChild(portBody(L));
      setSub('現金 <b class="num">' + fmt(p.cash) + '</b>' + (p.debt > 0 ? '・負債 <b class="num">' + fmt(p.debt) + '</b>' : '') + (kind === 'shop' ? '・手牌 ' + p.cards.length + ' / 5' : ''));

  function willMeter(q, p, offer) {

    var w = WF.AI.tradeWill(E(), q, p, offer), e = E().econ();
    var pct = Math.max(0, Math.min(100, Math.round(50 + w.score / (40 * e))));
    var txt = w.ok ? (pct > 80 ? '很想答應' : '願意成交') : (pct > 35 ? '還差一點' : pct > 15 ? '不太願意' : '不可能');
    return '<div class="will"><span>' + esc(q.name) + '：' + txt + '</span><div class="bar"><i style="width:' + pct + '%;background:' + (w.ok ? '#2DBE88' : pct > 35 ? '#F2B640' : '#E04E55') + '"></i></div></div>';

  function offerHtml(o, from, to) {

      (x.cards || []).forEach(function (c) { bits.push('<span class="tk card">' + WF.CARDS[c].n + '</span>'); });
      return bits.length ? bits.join('') : '<span class="muted">（什麼都不給）</span>';
    }
    return '<div class="offer"><div><b>' + esc(from.name) + ' 給</b><div class="tks">' + side(o.give) + '</div></div><div><b>' + esc(to.name) + ' 給</b><div class="tks">' + side(o.get) + '</div></div>' +

    function offer() { return { to: st.q.id, give: { lots: st.give.lots.slice(), cash: st.give.cash, cards: st.give.cards.slice() }, get: { lots: st.get.lots.slice(), cash: st.get.cash, cards: st.get.cards.slice() }, pact: st.pact }; }

      }

      case 'sally': AU.sfx('deal'); return B({ k: '盟友', big: esc(d.t || ''), art: d.p ? '<img alt="" src="' + ART.portrait(d.p.char, 'happy', 72) + '">' : '', bg: '#2E8B57', dur: 1800, human: true });
      case 'sprice': AU.sfx('notify'); if (mp.dists[d.d]) mp.dists[d.d].lots.forEach(function (t) { R.burstTile(t, 'spark', 6, '#FFD25E'); }); return B({ k: '地價', big: esc(d.t || ''), bg: '#1B9168', dur: 1500, human: true });
      case 'sraze': AU.sfx('quake'); R.shake(10); (d.tiles || []).forEach(function (t) { R.burstTile(t, 'dust', 16, '#fff'); }); return B({ k: '', big: esc(d.t || ''), bg: '#55617D', dur: 1700, human: true });

          .then(function () { return B({ k: '新的一區', big: esc(d.t || ''), bg: '#147A84', dur: 1900, human: true }); });
      }
      case 'scard': AU.sfx('card'); toast('得到卡片「' + WF.CARDS[d.cid].n + '」' + (d.why ? '（' + esc(d.why) + '）' : '')); return wait(400);
      case 'svit': AU.sfx(d.v < 0 ? 'quake' : 'whale'); if (d.v < 0) R.quake(); return d.t ? B({ k: '鯨息 ' + d.vit, big: esc(d.t), bg: d.v < 0 ? '#55617D' : '#147A84', dur: 1500, human: true }) : wait(200);

      case 'finale': return d.phase === 'start' ? finStart() : finEnd(d);
      case 'auction': return d.phase === 'open' ? auOpen(d) : d.phase === 'hammer' ? auHammer(d) : auClose(d);
    }

  };
})();

  /* ============================================================

     ============================================================ */
  S.scene = function (lines, opt) {
    opt = opt || {};
    if (!lines || !lines.length) return Promise.resolve();
    return new Promise(function (res) {
      var sc = el('<div class="scene"><div class="tint"></div><button class="btn btn-ghost skip">略過</button><div class="who l"><img alt=""></div><div class="who r"><img alt=""></div><div class="box"><span class="nm"></span><div class="tx"></div><span class="more"></span></div></div>');
      $('#app').appendChild(sc); sceneOn();
      var stopBg = sceneBg(sc.querySelector('.tint'), opt.bg || 'day');
      var i = -1, typing = null, full = '';
      var L = sc.querySelector('.who.l'), Rt = sc.querySelector('.who.r');
      var left = null, right = null;
      L.hidden = true; Rt.hidden = true;
      function next() {
        if (typing) { clearInterval(typing); typing = null; sc.querySelector('.tx').textContent = full; return; }
        i++;
        if (i >= lines.length) { end(); return; }
        var ln = lines[i], box = sc.querySelector('.box');
        var who = ln.s, art = who === 'father' ? 'chuan' : who;
        box.classList.toggle('nar', who === 'nar');
        var nm = sc.querySelector('.nm');
        if (who === 'nar') { nm.hidden = true; }
        else {
          nm.hidden = false;
          var C = WF.CHARS[art] || { name: '？', color: '#6B7A99' };
          nm.textContent = C.name; box.style.setProperty('--c', C.color);
          if (art === 'wei') { left = art; L.querySelector('img').src = ART.stand(art, ln.e || 'normal'); }
          else { right = art; Rt.querySelector('img').src = ART.stand(art, ln.e || 'normal'); }
        }
        L.hidden = !left; Rt.hidden = !right;
        L.classList.toggle('dim', art !== left); Rt.classList.toggle('dim', art !== right);
        full = ln.t;
        var tx = sc.querySelector('.tx'); tx.textContent = '';
        var k = 0;
        AU.sfx('tap');
        typing = setInterval(function () { k++; tx.textContent = full.slice(0, k); if (k >= full.length) { clearInterval(typing); typing = null; } }, 26);
      }
      function end() { if (typing) clearInterval(typing); stopBg(); sc.remove(); sceneOff(); res(); }
      sc.onclick = function (e) { if (e.target.closest('.skip')) return; next(); };
      sc.querySelector('.skip').onclick = function (e) { e.stopPropagation(); AU.sfx('close'); end(); };
      next();
    });
  };
  function sceneOn() { $('#app').classList.add('scening'); }
  function sceneOff() { if (!document.querySelector('#app > .scene')) $('#app').classList.remove('scening'); }
  function sceneBg(tint, kind) {
    var tints = {
      day: 'linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0))',
      dawn: 'linear-gradient(180deg, rgba(255,170,140,.28), rgba(255,220,190,.05))',
      dusk: 'linear-gradient(180deg, rgba(90,60,140,.32), rgba(240,150,120,.18))',
      night: 'linear-gradient(180deg, rgba(8,14,40,.35), rgba(40,40,90,.15))',
      ground: 'linear-gradient(180deg, rgba(255,236,190,.35), rgba(120,190,110,.35))',
      spring: 'linear-gradient(180deg, rgba(255,190,215,.30), rgba(255,255,255,.05))'
    };
    if (tint) tint.style.background = tints[kind] || tints.day;
    var prev = R.getNight();
    if (kind === 'night') R.setNight(1);
    return function () { R.setNight(prev); };

    return true;
  }

  S.challenges = function () {

      '<p class="muted">每一關都有特別的開局和計分方式。贏下來，再看分數拿一到三顆星。</p>';
    for (var g = 1; g <= 5; g++) {
      var open = tot >= GROUP_NEED[g];

        WF.CHALLENGES.filter(function (c) { return c.g === g; }).map(function (c) {

  S.online = function () {

        '<div class="panel"><h4>這個版本不能連線</h4><p class="muted">Claude 裡的版本不能連到外部伺服器，所以連線對戰要用網頁版。把網頁版放上 Cloudflare 之後，用手機打開那個網址、加到主畫面，就能開房間找朋友一起玩。</p>' +

      '<div class="panel"><label class="field"><span>你的名字</span><input type="text" maxlength="8" data-name placeholder="最多 8 個字" value="' + esc(st.netName || '') + '"></label></div>' +

      '<div class="panel"><h4>加入房間</h4><div class="joinrow"><input type="text" class="codein" maxlength="4" data-code placeholder="房號" autocapitalize="characters" autocomplete="off" spellcheck="false"><button class="btn btn-sun" data-join>加入</button></div><p class="muted mt" data-err></p></div>' +
      '</div>', 'online');
    bindBack(s, S.title);
    var nameIn = s.querySelector('[data-name]'), codeIn = s.querySelector('[data-code]'), err = s.querySelector('[data-err]');
    function nm() { var v = nameIn.value.trim().slice(0, 8) || WF.CHARS[P().lastChar || 'wei'].name; st.netName = nameIn.value.trim().slice(0, 8); WF.saveProfile(); return v; }

    s.querySelector('[data-new]').onclick = function (e) {

  };
  function netErr(x) {
    var m = (x && x.message) || String(x || '');
    if (/full/.test(m)) return '這個房間已經滿了。';

  function drawChart(cv, G) {

      var y = padT + (H - padT - padB) * (1 - i / 4);
      c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y); c.stroke();

      c.strokeStyle = p.color; c.lineWidth = p.human ? 3.2 : 2; c.lineJoin = 'round';

    c.fillStyle = '#8A94AB'; c.textAlign = 'left'; c.fillText('開局', padL, H - 3); c.textAlign = 'right'; c.fillText('結束', W - padR, H - 3);

/* ---- net.js ---- */
/* ============================================================
   鯨落 WHALEFALL v2 — 連線：房間大廳與同步
   每台裝置用同一個種子跑同一局，只同步「玩家的決定」；
   電腦對手每台各自算（結果一樣），逾時或斷線時由伺服器宣布「電腦代打」，每台再各自算出同一步。
   ============================================================ */
(function () {
  var NET = WF.NET = { on: false, seat: -1, room: null, mySeat: -1, code: null, status: 'off', replaying: false, E: null };
  var ws = null, token = null, myName = '', want = false, retry = 0, retryT = null, joinWait = null;
  var dn = 0, have = {}, pending = {}, timers = {}, myDecs = {}, gameId = null, setup = null, tick = null, curTimer = 0;
  var KEY_ROOM = 'wf_net_room';
  NET.trace = [];
  function tr(k, n, x) { NET.trace.push([Date.now() % 1000000, k, n, x]); if (NET.trace.length > 400) NET.trace.shift(); }

  function st(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } return null; }
  function inArtifact() { return !!window.claude || /claudeusercontent\.com$|(^|\.)claude\.ai$/.test(location.hostname); }
  // 只有獨立網頁版能連線（Claude 裡的版本連不到外部伺服器）
  NET.available = function () { return !!WF.STANDALONE && typeof WebSocket !== 'undefined' && /^https?:$/.test(location.protocol) && !inArtifact(); };
  function base() {
    var s = (WF.PROFILE && WF.PROFILE.settings.netServer || '').trim();
    if (s) { if (!/^https?:\/\//.test(s)) s = 'https://' + s; return s.replace(/\/+$/, ''); }
    return location.origin;
  }
  NET.inRoom = function () { return !!(want && NET.code); };
  NET.isMine = function (pid) { return NET.on && pid === NET.seat; };

  /* ---------- 進出房間 ---------- */
  NET.create = function (name) {
    return fetch(base() + '/api/new', { method: 'POST' }).then(function (r) {
      if (!r.ok) throw new Error('new ' + r.status);
      return r.json();
    }).then(function (j) { if (!j || !j.code) throw new Error('new'); return NET.join(j.code, name); });
  };
  NET.join = function (code, name) {
    code = String(code || '').toUpperCase();
    if (NET.code && NET.code !== code) NET.leave();
    NET.code = code; myName = name || ''; want = true;
    token = st('wf_net_tok_' + code) || null;
    return new Promise(function (res, rej) {
      joinWait = { res: res, rej: rej };
      connect();
    });
  };
  NET.leave = function () {
    want = false;
    if (retryT) { clearTimeout(retryT); retryT = null; }
    if (ws) { try { send({ t: 'leave' }); ws.close(); } catch (e) {} ws = null; }
    stopGame();
    NET.room = null; NET.code = null; NET.mySeat = -1; NET.status = 'off';
    st(KEY_ROOM, null);
  };
  // 重新整理頁面後，自動回到剛剛的房間
  NET.boot = function () {
    if (!NET.available()) return;
    try {
      var r = JSON.parse(st(KEY_ROOM) || 'null');
      if (r && r.code && Date.now() - r.at < 6 * 3600 * 1000) NET.join(r.code, r.name).then(function () { if (!WF.inGame() && WF.SCR.cur !== 'lobby') WF.SCR.lobby(); }, function () { st(KEY_ROOM, null); });
    } catch (e) {}
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && want && (!ws || ws.readyState > 1)) { if (retryT) clearTimeout(retryT); retry = 0; connect(); }
    });
  };
  function connect() {
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
    var url = base().replace(/^http/, 'ws') + '/api/room/' + NET.code + '/ws';
    var sock;
    try { sock = new WebSocket(url); } catch (e) { fail(e); return; }
    ws = sock;
    NET.status = retry ? 'retry' : 'connecting';
    sock.onopen = function () {
      if (ws !== sock) return;
      send({ t: 'hello', token: token, name: myName, cos: WF.PROFILE.cos, char: WF.PROFILE.lastChar, ver: WF.BUILD || 'dev', gameId: gameId, got: maxHave() });
    };
    sock.onmessage = function (e) { if (ws !== sock) return; var m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
    sock.onclose = function () {
      if (ws !== sock) return;
      ws = null;
      if (joinWait && retry >= 2) { var jw = joinWait; joinWait = null; want = false; NET.code = null; jw.rej(new Error('connect')); return; }
      if (!want) return;
      NET.status = 'retry'; refreshViews();
      if (retry === 1 && NET.on) UI().toast('連線中斷，正在重新連線…');
      retryT = setTimeout(connect, Math.min(8000, 700 * Math.pow(2, retry++)));
    };
    sock.onerror = function () {};
  }
  function fail(e) { if (joinWait) { var jw = joinWait; joinWait = null; want = false; NET.code = null; jw.rej(e); } }
  function send(o) { if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(o)); return true; } catch (e) {} } return false; }
  function UI() { return WF.UI; }
  function refreshViews() {
    if (WF.SCR.cur === 'lobby') WF.SCR.lobby();
    if (NET.on && WF.inGame()) presence();
  }

  /* ---------- 伺服器訊息 ---------- */
  function onMsg(m) {
    switch (m.t) {
      case 'welcome':
        token = m.token; NET.mySeat = m.seat; retry = 0; NET.status = 'on';
        st('wf_net_tok_' + NET.code, token);
        st(KEY_ROOM, JSON.stringify({ code: NET.code, name: myName, at: Date.now() }));
        if (joinWait) { var jw = joinWait; joinWait = null; jw.res(); }
        // 斷線時送不出去的決定，重送一次
        Object.keys(pending).forEach(function (n) { var pd = pending[n]; if (!pd.done) send({ t: 'need', n: +n, pid: pd.p.id, kind: pd.kind }); });
        Object.keys(myDecs).forEach(function (n) { if (!have[n]) send({ t: 'dec', n: +n, v: myDecs[n] }); });
        break;
      case 'room':
        NET.room = m.room;
        refreshViews();
        break;
      case 'start':
        startGame(m.gameId, m.setup, []);

    G.players.forEach(function (p) { if (!p.human || UI.local(p)) WF.codexSee('chars', p.char); });
    UI.onExit = function (abandon) {
      if (!CUR || CUR.E !== E) return;
      if (online) { E.halted = true; CUR = null; UI.stop(); WF.NET.leave(); S.title(); return; }
      if (abandon) clearSave(); else WF.saveGame();
      E.halted = true; CUR = null;
      UI.stop(); S.title();
    };
    UI.onGameOver = function () { if (CUR && CUR.E === E) gameOver(E, ctx); };
    if (opt.replay) WF.NET.onCaughtUp = function () { if (CUR && CUR.E === E) UI.start(E); };
    else UI.start(E);
    if (opt.retryAct != null) { UI.pause(true); UI.actCard(opt.retryAct, true).then(function () { UI.pause(false); }); }
    if (!online) WF.saveGame();
    E.run().then(function () {
      // 連線重播時，這局在重播途中就結束了
      if (online && WF.NET.replaying && CUR && CUR.E === E) { WF.NET.replaying = false; gameOver(E, ctx); }
    }).catch(function (err) {
      console.error(err);
      UI.toast('發生錯誤：' + (err && err.message));
    });
  }
  function myCos() { return JSON.parse(JSON.stringify(WF.PROFILE.cos)); }
  WF.startStory = function (id) {
    var ch = WF.CHAPTERS[id - 1];
    store(KEY_C, null);
    var G = WF.newGame({
      mapId: ch.map, months: ch.months, startMonth: ch.startMonth || 1, mode: 'story', chapter: id, night: !!ch.night, rules: ch.rules,
      seats: WF.storySeats(ch)
    });
    play(G, { mode: 'story', chapter: id });
  };
  WF.startFree = function (o) {
    var seats = o.seats.map(function (s, i) { return Object.assign({}, s, s.human && i === 0 ? { cos: myCos() } : {}); });
    var G = WF.newGame({ mapId: o.mapId, months: o.months, seats: seats, rules: o.rules, mode: 'free' });
    play(G, { mode: 'free', opts: o });
  };
  WF.startDaily = function (cfg) {
    var G = WF.newGame({
      mapId: cfg.map, months: 6, seed: cfg.seed, mode: 'daily', daily: cfg.date,
      rules: { mods: cfg.mods.map(function (m) { return m.id; }) },
      seats: [{ char: cfg.me, human: true, cos: myCos() }].concat(cfg.rivals.map(function (c) { return { char: c, ai: 'normal' }; }))
    });
    play(G, { mode: 'daily', date: cfg.date, me: cfg.me });
  };
  WF.startChallenge = function (id, me) {
    var c = WF.CHAL_BY_ID[id];
    var seats = WF.chalSeats(c, me);
    seats[0].cos = myCos();
    var G = WF.newGame({ mapId: c.map, months: c.months, startMonth: c.startMonth || 1, mode: 'challenge', challenge: id,
      rules: Object.assign({}, c.rules || {}, { mods: c.mods || [] }), seats: seats });
    play(G, { mode: 'challenge', id: id, me: me });
  };
  WF.resume = function () {
    var sv = WF.loadSave(); if (!sv) { S.title(); return; }
    play(sv.G, sv.ctx || { mode: sv.G.mode, chapter: sv.G.chapter });
  };
  // 連線對局：每台裝置用同一個種子建立同一局；replay＝斷線回來，先把錯過的決定重跑一次
  WF.netStart = function (setup, replay) {
    if (CUR) { CUR.E.halted = true; UI.stop(); CUR = null; }
    var G = WF.newGame({ mapId: setup.mapId, months: setup.months, seed: setup.seed, rules: setup.rules, mode: 'online',
      seats: setup.seats.map(function (s) { return { char: s.char, human: !!s.human, ai: s.ai || 'normal', name: s.name || null, cos: s.cos || null, net: s.lobby }; }) });
    play(G, { mode: 'online', gameId: setup.gameId }, { replay: !!replay });
  };
  WF.inGame = function () { return !!CUR; };

  /* ---------- 結算 ---------- */
  function gameOver(E, ctx) {
    var G = E.G, P = WF.PROFILE;
    clearSave();
    var me = UI.mainHuman() || G.players.find(function (p) { return p.human; });
    var winner = G.players[G.result.winner];
    var won = !!me && (G.rules.teams ? me.team === G.result.winTeam : winner === me);
    var before = cosSnap();
    var humansN = G.players.filter(function (p) { return p.human; }).length;
    if (me && (humansN === 1 || ctx.mode === 'online')) {
      P.stats.games++;
      if (won) {
        P.stats.wins++;
        P.stats.winMaps[G.mapId] = 1;
        P.stats.winChars[me.char] = 1;
        // 贏過的對手，從此可以用
        G.players.forEach(function (q) { if (!q.human && q.char !== 'chuan') P.unlocked[q.char] = 1; });
      }
      P.stats.best = Math.max(P.stats.best || 0, E.nw(me));
      if (ctx.mode === 'online') { P.stats.online = (P.stats.online || 0) + 1; if (won) { P.stats.onlineWins = (P.stats.onlineWins || 0) + 1; WF.unlockAch('online1'); } }
    }
    WF.saveProfile();
    setTimeout(function () {
      var info = { G: G, E: E, me: me, buttons: [] };
      if (ctx.mode === 'story') storyResult(E, ctx, info, me);
      else if (ctx.mode === 'daily') dailyResult(E, ctx, info, me);
      else if (ctx.mode === 'challenge') challengeResult(E, ctx, info, me);
      else if (ctx.mode === 'online') onlineResult(E, ctx, info, me, winner, won);
      else freeResult(E, ctx, info, me, winner, won);
      checkMeta();
      var after = cosSnap();
      Object.keys(after).forEach(function (k) { if (!before[k]) setTimeout(function () { UI.toast('新收藏：' + after[k]); }, 600); });
    }, 300);
  }
  function finishView() { UI.stop(); CUR = null; }
  function teamTitle(G, me) {
    if (!me) return (G.result.winTeam ? '藍隊' : '紅隊') + '獲勝';
    return me.team === G.result.winTeam ? '你們這隊贏了！' : '你們這隊輸了';
  }
  function freeResult(E, ctx, info, me, winner, won) {
    var G = E.G, humansN = G.players.filter(function (p) { return p.human; }).length;
    if (G.rules.teams) info.title = humansN > 1 ? (G.result.winTeam ? '藍隊' : '紅隊') + '獲勝' : teamTitle(G, me);
    else info.title = humansN > 1 ? winner.name + ' 獲勝' : (won ? '你贏了！' : winner.name + ' 獲勝');
    info.sub = G.result.early ? '提前達成目標' : '時間到，總資產最高的' + (G.rules.teams ? '那一隊' : '人') + '獲勝';
    finishView();
    info.buttons = [
      { label: '再來一局', cls: 'btn-sun', onClick: function () { WF.startFree(ctx.opts); } },
      { label: '回主選單', onClick: function () { S.title(); } }
    ];
    S.results(info);
  }
  function dailyResult(E, ctx, info, me) {
    var P = WF.PROFILE, d = P.daily, score = me && me.alive ? E.nw(me) : 0;
    var prev = d.best[ctx.date];
    d.best[ctx.date] = Math.max(prev || 0, score);
    if (d.last !== ctx.date) {
      var y = new Date(Date.now() - 86400000), ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
      d.streak = d.last === ys ? (d.streak || 0) + 1 : 1;
      d.last = ctx.date;
    }
    WF.saveProfile();
    var rank = E.rankOf(me);
    info.title = '今日成績 ' + UI.fmt(score);
    info.sub = '第 ' + rank + ' 名・今日最佳 ' + UI.fmt(d.best[ctx.date]) + (prev == null || score > prev ? '（新紀錄）' : '') + '・連續 ' + d.streak + ' 天';
    finishView();
    info.buttons = [
      { label: '再挑戰一次', cls: 'btn-sun', onClick: function () { WF.startDaily(WF.dailyConfig(ctx.me)); } },
      { label: '回主選單', onClick: function () { S.title(); } }
    ];
    S.results(info);
  }
  function challengeResult(E, ctx, info, me) {
    var P = WF.PROFILE, c = WF.CHAL_BY_ID[ctx.id];
    var r = WF.chalStars(E, c, me);
    var rec = P.chal[c.id] || { stars: 0, best: 0 };
    var newBest = r.won && r.score > (rec.best || 0);
    var gained = Math.max(0, r.stars - (rec.stars || 0));
    if (r.won) { rec.stars = Math.max(rec.stars || 0, r.stars); rec.best = Math.max(rec.best || 0, r.score); }
    P.chal[c.id] = rec; WF.saveProfile();
    var unit = function (v) { return c.metric.money ? UI.fmt(v) : v + (c.metric.unit || ''); };
    info.title = r.won ? (r.stars ? '★'.repeat(r.stars) + '　' + c.name : c.name + '　完成') : c.name + '　失敗';
    info.sub = r.won ? c.metric.label + ' ' + unit(r.score) + (newBest ? '（新紀錄）' : '') + (gained ? '・多拿了 ' + gained + ' 顆星' : '') : (c.win === 'team' ? '你們這隊沒有贏。' : c.win === 'rank1' ? '要拿下第一名，星星才算數。' : '這一局沒撐到最後。');
    info.top = '<div class="panel"><div class="starline">' + c.stars.map(function (t, i) { return '<div class="' + (r.won && r.score >= t ? 'on' : '') + '"><span class="stars">' + [0, 1, 2].map(function (k) { return '<i class="' + (k <= i ? 'on' : '') + '">' + ART.I.star + '</i>'; }).join('') + '</span><b class="num">' + unit(t) + '</b></div>'; }).join('') + '</div></div>';
    finishView();
    info.buttons = [
      { label: '再挑戰', cls: 'btn-sun', onClick: function () { WF.startChallenge(c.id, ctx.me); } },
      { label: '回挑戰列表', onClick: function () { S.challenges(); } }
    ];
    S.results(info);
  }
  function onlineResult(E, ctx, info, me, winner, won) {
    var G = E.G;
    info.online = true;
    info.title = G.rules.teams ? teamTitle(G, me) : (won ? '你贏了！' : winner.name + ' 獲勝');
    info.sub = G.result.early ? '提前達成目標' : '時間到，總資產最高的' + (G.rules.teams ? '那一隊' : '人') + '獲勝';
    finishView();
    if (WF.NET.gameDone) WF.NET.gameDone(ctx.gameId);
    info.buttons = [
      { label: '回到房間', cls: 'btn-sun', onClick: function () { S.lobby(); } },
      { label: '離開房間', onClick: function () { WF.NET.leave(); S.title(); } }
    ];
    S.results(info);
  }
  function storyResult(E, ctx, info, me) {
    var P = WF.PROFILE, ch = WF.CHAPTERS[ctx.chapter - 1], part2 = ch.part === 2, G = E.G, SS = G.story;
    var win = !!me && (SS ? WF.storyWin(E, ch, me) : (ch.teams ? G.result.winTeam === me.team && me.alive : WF.storyWin(E, ch, me)));
    var acts = SS ? SS.acts.map(function (v) { return v === 1 ? 1 : 0; }) : [];
    var all = win && acts.length && acts.every(function (v) { return v === 1; });
    var got = false, store2 = part2 ? P.story.ledger : P.story.frags;
    if (win) {
      P.story.cleared[ch.id] = 1;
      ch.rivals.forEach(function (c) { if (c !== 'lan' || ch.id >= 6) P.unlocked[c] = 1; });
      var old = P.story.stars[ch.id] || [];
      P.story.stars[ch.id] = acts.map(function (v, i) { return v || old[i] ? 1 : 0; });
      if (SS) P.story.fl = Object.assign({}, P.story.fl || {}, SS.fl);
      if (all && !store2[ch.id]) { store2[ch.id] = 1; got = true; }
    }
    WF.saveProfile();
    var stars = acts.length ? '<div class="panel"><div class="actstars">' + ch.acts.map(function (a, i) {
      return '<div class="' + (acts[i] ? 'on' : '') + '"><span class="st">' + ART.I.star + '</span><b>' + ['第一幕', '第二幕', '第三幕'][i] + '</b><small>' + esc(i === ch.acts.length - 1 ? (E.fin().name || a.n) : a.n) + '</small></div>';
    }).join('') + '</div>' + (SS ? '<p class="muted center">委託完成 ' + Object.keys(SS.req).filter(function (id) { return SS.req[id].st === 'done'; }).length + ' / ' + Object.keys(ch.reqs || {}).length + '</p>' : '') + '</div>' : '';
    if (got) {
      info.top = stars + '<div class="panel"><h4>' + (part2 ? '取得〈樁帳・第' + '一二三四五六七八'[ch.id - 7] + '頁〉' : '取得〈鯨歌殘譜・' + '一二三四五六'[ch.id - 1] + '〉') + '</h4>' + (part2 ? S.ledgerHtml(ch.id - 7) : S.fragHtml(ch.id - 1)) + '</div>';
    } else {
      var have = store2[ch.id];
      info.top = stars;
      info.extra = '<div class="panel rowc"><span class="frag ' + (have ? 'on' : '') + '" style="width:30px;height:30px">' + (part2 ? ART.LEDGER : ART.FRAG) + '</span><div class="muted">' +
        (have ? '這一章的' + (part2 ? '樁帳' : '殘譜') + '已經拿到了，可以在故事模式裡重讀。' : (part2 ? '樁帳' : '殘譜') + '：三幕的星星全部拿到才會出現。' + (win ? '這次還差一點。' : '')) + '</div></div>';
    }
    var F = SS ? E.fin() : null;
    info.title = win ? '第 ' + ch.id + ' 章・' + ch.name + '　完成' : (SS && SS.fin.bust ? '破產了' : '落敗');
    var fs = F && UI.finSummary ? UI.finSummary(E) : '';
    info.sub = SS && SS.fin.bust ? '錢用完了。從這一幕的開頭再來一次？' : (fs || (win ? ch.goal : WF.STORY.lose));
    finishView();
    if (win) info.buttons = [{ label: '繼續劇情', cls: 'btn-sun', onClick: function () { afterStory(ch, SS ? SS.fl : null); } }];
    else {
      info.buttons = [];
      var at = SS ? SS.act : -1;
      if (at > 0 && WF.hasCheckpoint(ch.id, at)) info.buttons.push({ label: '重來' + ['第一幕', '第二幕', '第三幕'][at], cls: 'btn-sun', onClick: function () { WF.retryAct(at); } });
      info.buttons.push({ label: '整章重來', cls: info.buttons.length ? '' : 'btn-sun', onClick: function () { WF.startStory(ch.id); } });
      info.buttons.push({ label: '回章節', onClick: function () { S.story(ch.part); } });
    }
    S.results(info);
  }
  function afterStory(ch, fl) {
    var P = WF.PROFILE;
    S.scene(WF.storyLines('c' + ch.id + '_out', fl || null), { bg: ch.night ? 'night' : 'dusk' }).then(function () {
      if (ch.id !== 6 && ch.id !== 14) { S.story(ch.part); return; }
      var part = ch.id === 6 ? 1 : 2;
      var secret = part === 1 ? [1, 2, 3, 4, 5, 6].every(function (i) { return P.story.frags[i]; }) : [7, 8, 9, 10, 11, 12, 13, 14].every(function (i) { return P.story.ledger[i]; });
      var firstP2 = part === 1 && !WF.p2Open();
      return S.endingChoice(part, secret).then(function (k) {
        P.story.endings[k] = 1;
        if (part === 1) { P.story.p1 = k; P.unlocked.lan = 1; if (k === 'c') P.unlocked.chuan = 1; }
        else P.unlocked.chuan = 1;
        WF.saveProfile();
        return S.scene(WF.storyLines('end_' + k), { bg: S.endingBg(k) }).then(function () { return S.endingCard(k); }).then(function () {
          S.story(firstP2 ? 2 : part);
          // 成就等結局演完再跳，不打斷結局
          WF.unlockAch(WF.ENDINGS[k].ach); WF.unlockAch(part === 1 ? 'story' : 'story2');
          checkMeta();
          if (firstP2) setTimeout(function () { UI.toast('第二部〈萬樁〉開啟了'); }, 900);
        });
      });
    });
  }

  /* ---------- 啟動 ---------- */
  function boot(data) {
    WF.PROFILE = WF.loadProfile();
    R.init(document.getElementById('board'));
    WF.applySettings();
    // 第一次碰觸就開啟聲音（必須在使用者手勢裡同步建立）
    var unlock = function () { AU.init(); WF.applySettings(); document.removeEventListener('pointerdown', unlock, true); };
    document.addEventListener('pointerdown', unlock, true);
    if (data && data.save && data.save.G && !WF.loadSave()) store(KEY_S, JSON.stringify(data.save));
    if (WF.NET && WF.NET.boot) WF.NET.boot();
    S.title();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { UI.refresh && UI.refresh(); });
    try {
      if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
        window.claude.hot.snapshot(function () { return CUR && CUR.E && !CUR.E.G.over && CUR.ctx.mode !== 'online' ? { save: { G: CUR.E.G, ctx: CUR.ctx } } : {}; });
      }
    } catch (e) {}
    document.addEventListener('visibilitychange', function () { if (document.hidden) WF.saveGame(); });
    window.addEventListener('pagehide', function () { WF.saveGame(); });
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();

</script>
