<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>再上膛 RELOAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: full-bleed pixel battlefield; UI = taped pages of a night-patrol notebook floating over it */
:root {
  color-scheme: dark;
  --ink: #0c0b1a; --paper: #17152b; --paper2: #211e3a; --rule: #2c2850; --moon: #eaf1ff; --dim: #9aa0c8; --faint: #5d6190;
  --cyan: #5fe8ff; --gold: #ffd447; --rose: #ff3f6c; --lime: #86ff96; --ember: #ff8a3d; --tape: rgba(236, 224, 196, .16);
  --f-hand: 'LXGW WenKai TC', 'Noto Serif CJK TC', 'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
  --f-pix: 'Pixelify Sans', 'Noto Sans Mono CJK TC', ui-monospace, monospace;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--moon); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-hand); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.layer { position: absolute; inset: 0; pointer-events: none; }
#vig { background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 55%, rgba(4,3,14,.55) 100%); }
#hurtvig { background: radial-gradient(ellipse at 50% 50%, rgba(255,40,80,0) 50%, rgba(255,40,80,.38) 100%); opacity: 0; transition: opacity .25s; }
#flash { opacity: 0; }
button { font-family: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.pix { font-family: var(--f-pix); letter-spacing: .04em; }
/* ---------- HUD ---------- */
#hud { opacity: 0; transition: opacity .4s; }
#hud.on { opacity: 1; }
#topbar { position: absolute; left: calc(10px + var(--sal)); right: calc(10px + var(--sar)); top: calc(8px + var(--sat)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; }
#round { font-size: 13px; color: var(--dim); line-height: 1.2; text-shadow: 0 1px 0 #000; }
#round b { color: var(--moon); font-family: var(--f-pix); font-size: 16px; font-weight: 600; }
#round .tally { display: block; font-family: var(--f-pix); font-size: 10px; color: var(--faint); letter-spacing: 1px; }
#clock { text-align: center; font-family: var(--f-pix); line-height: 1; text-shadow: 0 0 10px rgba(95,232,255,.45), 0 2px 0 #000; }
#clock .hm { font-size: 30px; font-weight: 600; color: var(--moon); }
#clock .s { font-size: 15px; color: var(--cyan); margin-left: 2px; }
#clock.tide .hm { color: #ffb0cf; text-shadow: 0 0 12px rgba(255,90,150,.6), 0 2px 0 #000; }
#clock.freeze .hm { color: #fff; }
#pausebtn { justify-self: end; pointer-events: auto; width: 38px; height: 38px; border-radius: 8px; background: rgba(23,21,43,.72); box-shadow: inset 0 0 0 1px var(--rule); display: grid; place-items: center; }
#pausebtn i { display: block; width: 12px; height: 14px; border-left: 4px solid var(--moon); border-right: 4px solid var(--moon); box-sizing: border-box; }
#xpwrap { position: absolute; left: calc(10px + var(--sal)); right: calc(10px + var(--sar)); top: calc(50px + var(--sat)); display: flex; align-items: center; gap: 8px; }
#lv { font-family: var(--f-pix); font-size: 12px; color: var(--cyan); min-width: 42px; text-shadow: 0 1px 0 #000; }
#xpbar { flex: 1; height: 5px; background: rgba(10,9,24,.8); box-shadow: inset 0 0 0 1px #2a2850; position: relative; overflow: hidden; }
#xpbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, #2aa8de, #5fe8ff); box-shadow: 0 0 8px #5fe8ff; transition: width .12s; }
#bossbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(64px + var(--sat)); width: min(82vw, 420px); }
#bossbar .nm { font-size: 14px; text-align: center; color: #ffd0dc; text-shadow: 0 0 8px rgba(255,63,108,.6), 0 1px 0 #000; margin-bottom: 3px; letter-spacing: .1em; }
#bossbar .bar { height: 7px; background: rgba(10,9,24,.85); box-shadow: inset 0 0 0 1px #4a1830; position: relative; overflow: hidden; }
#bossbar .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #b4174b, #ff3f6c); transition: width .15s; }
#bossbar .bar b { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.55); transition: width .6s .25s; }
#bossbar .bar s { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ffe7b0; opacity: .85; z-index: 2; }
#bossbar.guard .bar { box-shadow: inset 0 0 0 1px #c9a46a, 0 0 8px rgba(255,212,71,.45); }
#bossbar.guard .bar i { background: linear-gradient(90deg, #9b6a24, #ffd447); }
#bossbar.guard .nm::after { content: '・外殼'; color: #ffd447; text-shadow: 0 0 8px rgba(255,212,71,.6), 0 1px 0 #000; }
#squad { position: absolute; left: calc(8px + var(--sal)); top: calc(66px + var(--sat)); display: grid; gap: 6px; }
.chip { display: grid; grid-template-columns: 36px 64px; grid-template-rows: auto auto; column-gap: 6px; align-items: center; background: rgba(15,13,32,.62); padding: 3px 6px 4px 3px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(60,56,110,.6); }
.chip img { grid-row: 1 / span 2; width: 36px; height: 36px; image-rendering: pixelated; border-radius: 4px; background: #241f40; }
.chip .n { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; }
.chip .n em { font-style: normal; font-family: var(--f-pix); color: var(--gold); font-size: 10px; }
.chip .hp { height: 4px; background: #0a0918; position: relative; }
.chip .hp i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lime); transition: width .15s; }
.chip.down { opacity: .55; } .chip.down .hp i { background: var(--rose); }
.chip.low .hp i { background: var(--rose); }
#btns { position: absolute; right: calc(10px + var(--sar)); bottom: calc(14px + var(--sab)); display: flex; gap: 8px; pointer-events: auto; }
.hbtn { min-width: 58px; height: 52px; padding: 0 10px; border-radius: 10px; background: rgba(23,21,43,.78); box-shadow: inset 0 0 0 1px var(--rule), 0 3px 0 rgba(0,0,0,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--dim); }
.hbtn img { width: 22px; height: 22px; image-rendering: pixelated; }
.hbtn b { font-family: var(--f-pix); color: var(--moon); font-size: 15px; font-weight: 600; }
.hbtn:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px var(--cyan); }
#bark { position: absolute; left: 50%; bottom: calc(80px + var(--sab)); transform: translateX(-50%) translateY(10px); width: min(88vw, 460px); display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity .25s, transform .25s; }
#bark.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#hud.modal #bark, #hud.modal #carvetext, #hud.modal #toast { opacity: 0 !important; transition: none; }
#bark img { width: 36px; height: 36px; image-rendering: pixelated; border-radius: 6px; background: #241f40; box-shadow: 0 0 0 2px rgba(12,11,26,.8); flex: none; }
#bark p { margin: 0; font-size: 16px; line-height: 1.35; padding: 6px 10px; background: rgba(12,11,26,.78); border-radius: 8px; text-shadow: 0 1px 0 #000; }
#bark p small { display: block; font-size: 11px; color: var(--dim); }
#toast { position: absolute; left: 0; right: 0; top: 22%; text-align: center; opacity: 0; transform: scale(.94); transition: opacity .3s, transform .3s; }
#toast.on { opacity: 1; transform: scale(1); }
#toast.low { top: 33%; }
#toast h2 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .14em; text-shadow: 0 0 18px rgba(95,232,255,.5), 0 3px 0 #000; }
#toast p { margin: 6px 0 0; font-size: 14px; color: var(--dim); text-shadow: 0 1px 0 #000; }
#toast.warn h2 { color: #ffc0cf; text-shadow: 0 0 18px rgba(255,63,108,.65), 0 3px 0 #000; }
#toast.tide h2 { color: #ffb0d8; font-size: 46px; text-shadow: 0 0 26px rgba(255,90,170,.8), 0 3px 0 #000; }
#toast.clock h2 { font-family: var(--f-pix); font-size: 58px; font-weight: 600; letter-spacing: .05em; color: #fff; }
#toast.gold h2 { color: var(--gold); text-shadow: 0 0 18px rgba(255,212,71,.55), 0 3px 0 #000; }
#toast.rewind h2 { color: #bff6ff; font-style: italic; }
#toast.evolve h2 { color: var(--cyan); }
#mini { position: absolute; left: 50%; bottom: calc(138px + var(--sab)); transform: translateX(-50%); display: grid; gap: 4px; justify-items: center; width: min(86vw, 420px); }
#mini span { font-size: 13px; padding: 4px 12px; background: rgba(12,11,26,.82); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--rule); animation: minifade 2.6s forwards; text-align: center; }
@keyframes minifade { 0% { opacity: 0; transform: translateY(-4px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#carvetext { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: min(86vw, 440px); text-align: center; font-size: 21px; line-height: 1.4; color: #e8eeff; text-shadow: 0 0 12px rgba(150,180,255,.7), 0 2px 0 #000; opacity: 0; transition: opacity .5s; }
#carvetext.on { opacity: 1; }
#carvetext small { display: block; font-size: 11px; color: var(--dim); letter-spacing: .3em; margin-bottom: 4px; text-shadow: 0 1px 0 #000; }
#bosscard { position: absolute; left: 0; right: 0; top: 12%; text-align: center; opacity: 0; transition: opacity .5s; }
#bosscard.on { opacity: 1; }
#bosscard h3 { margin: 0; font-size: 40px; letter-spacing: .3em; color: #ffd8e2; text-shadow: 0 0 20px rgba(255,63,108,.7), 0 3px 0 #000; }
#bosscard p { margin: 8px 0 0; font-size: 15px; color: #c8b8d8; text-shadow: 0 1px 0 #000; }
#bosscard hr { width: 120px; border: 0; height: 1px; background: linear-gradient(90deg, transparent, #ff3f6c, transparent); margin: 10px auto 0; }
#joy { position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(201,216,255,.22); background: radial-gradient(circle, rgba(201,216,255,.06), rgba(201,216,255,0) 70%); opacity: 0; transition: opacity .15s; }
#joy.on { opacity: 1; }
#joy i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(201,216,255,.18); box-shadow: inset 0 0 0 2px rgba(95,232,255,.6); }
/* ---------- pages (notebook) ---------- */
.page { position: absolute; inset: 0; display: grid; place-items: center; padding: calc(12px + var(--sat)) 14px calc(12px + var(--sab)); background: rgba(6,5,16,.55); pointer-events: auto; overflow: auto; }
.page[hidden] { display: none !important; }
.sheet { position: relative; width: min(92vw, 560px); max-height: 100%; overflow: auto; background:
  repeating-linear-gradient(180deg, transparent 0 27px, rgba(60,56,120,.28) 27px 28px), linear-gradient(180deg, #1b1932, #15132a); border-radius: 4px 10px 8px 6px; box-shadow: 0 18px 40px rgba(0,0,0,.6), inset 0 0 0 1px #2e2a52; padding: 26px 20px 20px; }
.sheet::before { content: ''; position: absolute; left: 28px; top: -9px; width: 86px; height: 22px; background: var(--tape); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.sheet::after { content: ''; position: absolute; right: 22px; top: -7px; width: 62px; height: 20px; background: var(--tape); transform: rotate(4deg); }
.sheet h2 { margin: 0 0 4px; font-size: 26px; letter-spacing: .08em; text-wrap: balance; }
.sheet .sub { color: var(--dim); font-size: 13px; margin: 0 0 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font-size: 16px; padding: 10px 18px; border-radius: 8px; background: #252148; box-shadow: inset 0 0 0 1px #3c3870, 0 3px 0 #0b0a18; color: var(--moon); }
.btn.main { background: linear-gradient(180deg, #2a6f9a, #1d4e75); box-shadow: inset 0 0 0 1px #5fe8ff, 0 3px 0 #0b0a18; }
.btn.warn { box-shadow: inset 0 0 0 1px #8a2a48, 0 3px 0 #0b0a18; color: #ffc0cf; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 1px #5fe8ff, 0 1px 0 #0b0a18; }
.btn[disabled] { opacity: .4; pointer-events: none; }
/* ---------- level-up cards ---------- */
#lvl { background: rgba(6,5,16,.66); }
#lvl .wrap { width: min(94vw, 980px); display: grid; gap: 10px; }
#lvl .head { text-align: center; }
#lvl .head h2 { margin: 0; font-size: 28px; letter-spacing: .1em; text-shadow: 0 0 14px rgba(95,232,255,.5), 0 2px 0 #000; }
#lvl .head p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
#cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-aspect-ratio: 4/5) { #cards { grid-template-columns: 1fr; } }
.card { position: relative; text-align: left; min-height: 25vh; display: grid; grid-template-columns: 54px 1fr; grid-template-rows: auto 1fr auto; column-gap: 12px; row-gap: 6px; padding: 16px 14px 14px; border-radius: 6px 12px 8px 10px; background: repeating-linear-gradient(180deg, transparent 0 23px, rgba(60,56,120,.25) 23px 24px), linear-gradient(170deg, #1f1c38, #161429); box-shadow: inset 0 0 0 1px #34306a, 0 6px 0 rgba(0,0,0,.45); transition: transform .12s, box-shadow .12s; animation: cardin .35s backwards; }
.card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
@keyframes cardin { from { opacity: 0; transform: translateY(16px) rotate(-1deg); } }
.card::before { content: ''; position: absolute; left: 50%; top: -8px; width: 70px; height: 18px; margin-left: -35px; background: var(--tape); transform: rotate(-2deg); }
.card:hover { box-shadow: inset 0 0 0 1px var(--cyan), 0 6px 0 rgba(0,0,0,.45); }
.card:active { transform: translateY(3px); }
.card .ic { grid-row: 1 / span 2; width: 54px; height: 54px; image-rendering: pixelated; background: #12102a; border-radius: 6px; box-shadow: inset 0 0 0 1px #34306a; padding: 3px; box-sizing: border-box; }
.card .who { position: absolute; right: 8px; top: 8px; width: 36px; height: 36px; image-rendering: pixelated; border-radius: 4px; background: #241f40; }
.card .tt { align-self: end; padding-right: 34px; }
.card .tt small { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #2a2650; color: var(--dim); margin-bottom: 3px; }
.card .tt h3 { margin: 0; font-size: 21px; line-height: 1.2; }
.card .tt h3 span { font-family: var(--f-pix); font-size: 13px; color: var(--gold); margin-left: 6px; font-weight: 400; }
.card .bd { grid-column: 2; font-size: 14px; line-height: 1.5; color: #cfd6f4; }
.card .bd .num { font-family: var(--f-pix); color: var(--cyan); }
.card .bd .old { color: var(--faint); text-decoration: line-through; font-family: var(--f-pix); margin-right: 4px; }
.card .bd em { font-style: normal; color: var(--gold); }
.card .ft { grid-column: 1 / span 2; font-size: 12px; color: var(--faint); border-top: 1px dashed #2e2a52; padding-top: 6px; }
.card.cat-gun small { background: #4a2a10; color: #ffcf9a; } .card.cat-mod small { background: #123448; color: #9ff0ff; } .card.cat-auto small { background: #3e3410; color: #ffe58a; }
.card.cat-team small { background: #143a22; color: #a8ffb4; } .card.cat-sig small { background: #3a1a40; color: #f0b8ff; } .card.cat-syn small { background: #401838; color: #ffb0e8; } .card.cat-heal small { background: #143a22; color: #a8ffb4; }
.card.brk { box-shadow: inset 0 0 0 1px var(--gold), 0 0 22px rgba(255,212,71,.25), 0 6px 0 rgba(0,0,0,.45); }
.card.brk .ft { color: var(--gold); }
.card.evo { box-shadow: inset 0 0 0 1px #ffb070, 0 0 22px rgba(255,138,61,.25), 0 6px 0 rgba(0,0,0,.45); }
.card.evo .ft { color: #ffcf9a; }
#lvl .tools { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
#lvl .tools .btn { font-size: 14px; padding: 8px 14px; }
#lvl.banish .card { box-shadow: inset 0 0 0 1px var(--rose), 0 6px 0 rgba(0,0,0,.45); }
#lvl.banish .head p { color: var(--rose); }
/* breakthrough */
#brk .wrap { width: min(94vw, 760px); display: grid; gap: 12px; }
#brk .head { text-align: center; }
#brk .head small { color: var(--gold); letter-spacing: .4em; font-size: 12px; }
#brk .head h2 { margin: 2px 0; font-size: 30px; }
#brk .head p { margin: 0; color: var(--dim); font-size: 13px; }
#brkopts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-aspect-ratio: 4/5) { #brkopts { grid-template-columns: 1fr; } }
.bopt { text-align: left; padding: 18px 16px; border-radius: 8px; background: linear-gradient(170deg, #221e3e, #161429); box-shadow: inset 0 0 0 1px #4a4486, 0 6px 0 rgba(0,0,0,.45); min-height: 22vh; display: grid; align-content: start; gap: 6px; animation: cardin .35s backwards; }
.bopt:nth-child(2) { animation-delay: .08s; }
.bopt .k { font-family: var(--f-pix); font-size: 12px; letter-spacing: .2em; color: var(--dim); }
.bopt h3 { margin: 0; font-size: 24px; }
.bopt p { margin: 0; color: #cfd6f4; font-size: 15px; line-height: 1.5; }
.bopt.a { box-shadow: inset 0 0 0 1px #5fe8ff, 0 6px 0 rgba(0,0,0,.45); } .bopt.a .k { color: var(--cyan); }
.bopt.b { box-shadow: inset 0 0 0 1px #ff8a3d, 0 6px 0 rgba(0,0,0,.45); } .bopt.b .k { color: var(--ember); }
.bopt:active { transform: translateY(3px); }
/* dialog */
#dlg { align-items: end; background: linear-gradient(180deg, rgba(6,5,16,0) 30%, rgba(6,5,16,.8)); }
#dlg .box { width: min(94vw, 640px); margin-bottom: calc(10px + var(--sab)); display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: rgba(15,13,30,.92); border-radius: 8px; box-shadow: inset 0 0 0 1px #34306a; padding: 14px; position: relative; }
#dlg .box::before { content: ''; position: absolute; left: 40px; top: -8px; width: 70px; height: 18px; background: var(--tape); transform: rotate(-3deg); }
#dlg img { width: 96px; height: 96px; image-rendering: pixelated; border-radius: 6px; background: #241f40; }
#dlg .nm { font-size: 14px; color: var(--gold); margin-bottom: 4px; letter-spacing: .1em; }
#dlg .tx { font-size: 19px; line-height: 1.55; min-height: 3em; }
#dlg .hint { position: absolute; right: 12px; bottom: 8px; font-size: 11px; color: var(--faint); }
#dlg .skip { position: absolute; right: 10px; top: -36px; font-size: 13px; color: var(--dim); padding: 6px 12px; background: rgba(15,13,30,.8); border-radius: 16px; box-shadow: inset 0 0 0 1px #34306a; }
#dlg .shieldpic { grid-column: 1 / span 2; justify-self: center; image-rendering: pixelated; width: min(70vw, 300px); border-radius: 6px; box-shadow: 0 0 0 1px #34306a; }
/* title */
#title { display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: calc(18px + var(--sat)) 16px calc(18px + var(--sab)); pointer-events: auto; background: linear-gradient(180deg, rgba(6,5,16,.05) 40%, rgba(6,5,16,.55)); }
#title .logo { align-self: center; text-align: center; margin-top: 14vh; }
#title .logo h1 { margin: 0; font-size: clamp(54px, 15vw, 96px); font-weight: 700; letter-spacing: .12em; line-height: 1; color: #f4f8ff; text-shadow: 0 0 24px rgba(95,232,255,.55), 0 4px 0 #050412, 4px 0 0 rgba(255,63,108,.25); }
#title .logo .en { font-family: var(--f-pix); letter-spacing: .9em; font-size: 14px; color: var(--cyan); margin: 10px 0 0 .9em; }
#title .logo .meta { margin-top: 18px; font-size: 15px; color: var(--dim); }
#title .logo .meta b { color: var(--moon); font-family: var(--f-pix); }
#title .tap { font-size: 18px; letter-spacing: .3em; color: var(--moon); animation: blink 1.6s infinite; text-shadow: 0 0 10px rgba(95,232,255,.5), 0 2px 0 #000; margin: 26px 0 0 .3em; }
@keyframes blink { 50% { opacity: .35; } }
#title .menu { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#title .menu .btn { font-size: 15px; padding: 9px 16px; background: rgba(23,21,43,.8); }
#title .done { margin-top: 10px; font-size: 13px; color: var(--gold); }

<script>
(function(){'use strict';

// ===================== core utilities =====================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sat = v => v < 0 ? 0 : v > 1 ? 1 : v;
const sign = v => v < 0 ? -1 : 1;
const hypot = Math.hypot;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function approachAng(a, b, maxStep) { const d = angDiff(a, b); return Math.abs(d) <= maxStep ? b : a + Math.sign(d) * maxStep; }
function approach(v, t, s) { return v < t ? Math.min(v + s, t) : Math.max(v - s, t); }
function easeOutCubic(t) { t = sat(t); return 1 - (1 - t) * (1 - t) * (1 - t); }
function easeInOut(t) { t = sat(t); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function easeOutBack(t) { t = sat(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

// seeded RNG (mulberry32)
function makeRng(seed) {

}

const rnd = (a = 1, b) => b === undefined ? RNG() * a : a + RNG() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const chance = p => RNG() < p;
const pick = arr => arr[(RNG() * arr.length) | 0];

function rgba32(r, g, b, a) { return ((a & 255) << 24 | (b & 255) << 16 | (g & 255) << 8 | (r & 255)) >>> 0; }
function hex32(h, a = 255) { const c = hexToRgb(h); return rgba32(c[0], c[1], c[2], a); }
const WHITE32 = 0xffffffff >>> 0;
function mixRgb(a, b, t) { return [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))]; }
function col32a(c, a) { return ((c & 0x00ffffff) | ((a & 255) << 24)) >>> 0; }

// ===================== spatial grid =====================
class Grid {
  constructor(w, h, cell, maxN) {
    this.cell = cell; this.inv = 1 / cell;
    this.cols = Math.ceil(w / cell) + 4; this.rows = Math.ceil(h / cell) + 4;
    this.ox = -2 * cell; this.oy = -2 * cell;
    this.head = new Int32Array(this.cols * this.rows);
    this.next = new Int32Array(maxN);
    this.head.fill(-1);
  }
  clear() { this.head.fill(-1); }
  cx(x) { const c = ((x - this.ox) * this.inv) | 0; return c < 0 ? 0 : c >= this.cols ? this.cols - 1 : c; }
  cy(y) { const c = ((y - this.oy) * this.inv) | 0; return c < 0 ? 0 : c >= this.rows ? this.rows - 1 : c; }
  insert(i, x, y) { const c = this.cy(y) * this.cols + this.cx(x); this.next[i] = this.head[c]; this.head[c] = i; }
}

// time formatting
function fmtClock(sec) { sec = Math.max(0, sec); const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return { hm: '00:0' + Math.min(9, m), s: (s < 10 ? '0' : '') + s }; }
function fmtTime(sec) { sec = Math.max(0, Math.floor(sec)); const m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

// ===================== WebGL sprite batcher =====================
const GL = (() => {
  const VS = `
attribute vec2 a_pos; attribute vec2 a_uv; attribute vec4 a_col; attribute vec4 a_add;
uniform vec2 u_res;
varying vec2 v_uv; varying vec4 v_col; varying vec4 v_add;
void main(){
  vec2 p = a_pos / u_res * 2.0 - 1.0;
  gl_Position = vec4(p.x, -p.y, 0.0, 1.0);
  v_uv = a_uv; v_col = a_col; v_add = a_add;
}`;
  const FS = `
precision mediump float;
uniform sampler2D u_tex; uniform float u_desat; uniform vec3 u_tint; uniform vec3 u_mul;
varying vec2 v_uv; varying vec4 v_col; varying vec4 v_add;
void main(){
  vec4 t = texture2D(u_tex, v_uv);
  vec4 c = t * v_col;
  c.rgb = mix(c.rgb, v_add.rgb, v_add.a) ;
  float g = dot(c.rgb, vec3(0.299, 0.587, 0.114));
  c.rgb = mix(c.rgb, g * u_tint, u_desat) * u_mul;
  gl_FragColor = c;
}`;
  const MAXQ = 16000;
  const FLOATS = 6; // x y u v col add
  let gl = null, prog = null, vbo = null, ibo = null, canvas = null;
  let buf, vf, vu, nq = 0;
  let curTex = null, curBlend = 0; // 0 normal 1 add
  let uRes, uDesat, uTint, uMul, uTex;
  const tex = {}; // name -> {t, w, h, src}
  let W = 1, H = 1;
  const api = { camX: 0, camY: 0, ok: false, drawCalls: 0, quads: 0, desat: 0, tint: [1, 1, 1], mul: [1, 1, 1] };

  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function setup() {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.bindAttribLocation(prog, 0, 'a_pos'); gl.bindAttribLocation(prog, 1, 'a_uv');
    gl.bindAttribLocation(prog, 2, 'a_col'); gl.bindAttribLocation(prog, 3, 'a_add');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    uRes = gl.getUniformLocation(prog, 'u_res'); uDesat = gl.getUniformLocation(prog, 'u_desat');
    uTint = gl.getUniformLocation(prog, 'u_tint'); uMul = gl.getUniformLocation(prog, 'u_mul');
    uTex = gl.getUniformLocation(prog, 'u_tex');
    gl.uniform1i(uTex, 0);
    buf = new ArrayBuffer(MAXQ * 4 * FLOATS * 4);
    vf = new Float32Array(buf); vu = new Uint32Array(buf);
    vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, buf.byteLength, gl.DYNAMIC_DRAW);
    const idx = new Uint16Array(MAXQ * 6);
    for (let i = 0, v = 0; i < MAXQ * 6; i += 6, v += 4) { idx[i] = v; idx[i + 1] = v + 1; idx[i + 2] = v + 2; idx[i + 3] = v; idx[i + 4] = v + 2; idx[i + 5] = v + 3; }
    ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
    const stride = FLOATS * 4;
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, stride, 8);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.UNSIGNED_BYTE, true, stride, 16);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.UNSIGNED_BYTE, true, stride, 20);
    gl.enable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    for (const k in tex) upload(k, tex[k].src);
  }
  function upload(name, src) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    tex[name] = { t, w: src.width, h: src.height, src };
    curTex = null;
  }
  api.init = function (cv) {
    canvas = cv;
    const opts = { alpha: false, antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance', depth: false, stencil: false };
    gl = cv.getContext('webgl', opts) || cv.getContext('experimental-webgl', opts);
    if (!gl) return false;
    setup();
    cv.addEventListener('webglcontextlost', e => { e.preventDefault(); api.ok = false; }, false);
    cv.addEventListener('webglcontextrestored', () => { setup(); api.ok = true; }, false);
    api.ok = true;
    return true;
  };
  api.texture = function (name, src) { if (tex[name]) { gl.deleteTexture(tex[name].t); } upload(name, src); };
  api.resize = function (w, h) { W = w; H = h; if (!gl) return; gl.viewport(0, 0, w, h); gl.uniform2f(uRes, w, h); };
  api.begin = function (r, g, b) {
    gl.clearColor(r, g, b, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uDesat, api.desat); gl.uniform3f(uTint, api.tint[0], api.tint[1], api.tint[2]);
    gl.uniform3f(uMul, api.mul[0], api.mul[1], api.mul[2]);
    api.drawCalls = 0; api.quads = 0; nq = 0;
  };
  api.uniformsWorld = function () { flush(); gl.uniform1f(uDesat, api.desat); gl.uniform3f(uTint, api.tint[0], api.tint[1], api.tint[2]); gl.uniform3f(uMul, api.mul[0], api.mul[1], api.mul[2]); };
  api.uniformsPlain = function () { flush(); gl.uniform1f(uDesat, 0); gl.uniform3f(uMul, 1, 1, 1); };
  function flush() {
    if (!nq) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, vf.subarray(0, nq * 4 * FLOATS));
    gl.drawElements(gl.TRIANGLES, nq * 6, gl.UNSIGNED_SHORT, 0);
    api.drawCalls++; api.quads += nq; nq = 0;
  }
  api.flush = flush;
  function state(texName, blend) {
    const t = tex[texName];
    if (t !== curTex || blend !== curBlend) {
      flush();
      if (t !== curTex) { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, t.t); curTex = t; }
      if (blend !== curBlend) { curBlend = blend; if (blend === 1) gl.blendFunc(gl.SRC_ALPHA, gl.ONE); else gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); }
    }
    if (nq >= MAXQ) flush();
  }
  api.blend = 0; api.texName = 'atlas';
  // raw quad: 4 corners (screen coords) + uv rect
  function quad(x0, y0, x1, y1, x2, y2, x3, y3, u0, v0, u1, v1, col, add) {
    state(api.texName, api.blend);
    let o = nq * 4 * FLOATS;
    vf[o] = x0; vf[o + 1] = y0; vf[o + 2] = u0; vf[o + 3] = v0; vu[o + 4] = col; vu[o + 5] = add; o += FLOATS;
    vf[o] = x1; vf[o + 1] = y1; vf[o + 2] = u1; vf[o + 3] = v0; vu[o + 4] = col; vu[o + 5] = add; o += FLOATS;
    vf[o] = x2; vf[o + 1] = y2; vf[o + 2] = u1; vf[o + 3] = v1; vu[o + 4] = col; vu[o + 5] = add; o += FLOATS;
    vf[o] = x3; vf[o + 1] = y3; vf[o + 2] = u0; vf[o + 3] = v1; vu[o + 4] = col; vu[o + 5] = add;
    nq++;

  api.spr = function (s, x, y, flip, sx, sy, rot, col, add) {

        px + rx * c - by * n, py + rx * n + by * c,
        px + lx * c - by * n, py + lx * n + by * c, u0, s.v0, u1, s.v1, col, add);
    }
  };
  // solid rect using the atlas white pixel

// ---------------- helpers ----------------
function liveMembers() { return G.squad.filter(m => m.alive && !m.down); }
function nearestMember(x, y) {
  let best = null, bd = 1e9;
  for (const m of G.squad) { if (!m.alive || m.down) continue; const d = (m.x - x) ** 2 + (m.y - y) ** 2; if (d < bd) { bd = d; best = m; } }
  return best;
}
function shake(a) { G.trauma = Math.min(1, G.trauma + a * (SAVE.settings.shake === undefined ? 1 : SAVE.settings.shake)); }
// directional recoil of the whole view (opposite to the shot)
function camKick(ang, amt) {
  const s = SAVE.settings.shake === undefined ? 1 : SAVE.settings.shake; if (!s) return;
  G.kickX -= Math.cos(ang) * amt * s; G.kickY -= Math.sin(ang) * amt * s;
  const m = Math.hypot(G.kickX, G.kickY); if (m > 4.5) { G.kickX *= 4.5 / m; G.kickY *= 4.5 / m; }
}
function hitstop(sec) { if (G.hsCool > 0) return; G.hitstop = Math.max(G.hitstop, sec); G.hsCool = .22; }
function view() { const [w, h] = GL.size(); return { x: G.camX, y: G.camY, w, h }; }
function onScreen(x, y, pad) { const [w, h] = GL.size(); return x > G.camX - pad && x < G.camX + w + pad && y > G.camY - pad && y < G.camY + h + pad; }
function skLv(m, k) { return m ? (m.sk[k] || 0) : 0; }
function teamLv(k) { return G.team.sk[k] || 0; }

  const L = G.leader;
  for (const c of G.carvings) {
    c.pulse += dt;
    if (!c.read && Math.hypot(L.x - c.x, L.y - c.y) < 18) {
      c.read = true; G.readCarvings.push(c);
      UI.carving(c.text);
      AUDIO.sfx('carving');
      if (!SAVE.carvings[c.key]) { SAVE.carvings[c.key] = c.text; G.newCarving = c.text; }
      if (c.intel && !SAVE.intel[c.intel]) { SAVE.intel[c.intel] = true; G.newIntel.push(c.intel); UI.mini('情報：' + INTEL[c.intel].name); }
      if (!SAVE.flags.readCarving) { SAVE.flags.readCarving = true; bark('carving', true); }
      saveGame();
    }
  }
}

// ---------------- barks ----------------
function bark(key, force) {
  if (!G) return;
  if (!force && G.barks >= 6) return;
  const once = !['lowhp', 'revive', 'evolve_any'].includes(key);
  if (once && G.barked[key]) return;
  if (!once && G.barked[key] && G.real - G.barked[key] < 25) return;
  const list = BARKS[key]; if (!list) return;
  const [who, text] = pick(list);
  if (!G.squad.find(m => m.id === who && m.alive && !m.down) && key !== 'freeze1') return;
  G.barked[key] = G.real; G.barks++;
  UI.bark(who, text);
}

// ---------------- main step ----------------
function step(dt) {
  G.real += dt;
  if (G.rewinding > 0) { updateRewind(dt); updateFx(dt); return; }
  if (G.hitstop > 0) { G.hitstop -= dt; updateFx(dt * .2); return; }
  if (G.phase === 'run') {
    G.t += dt;
    if (G.t >= CH1.len) { G.t = CH1.len; beginFreeze(); }
  }
  G.flowT -= dt; if (G.flowT <= 0) { G.flowT = .25; flowUpdate(G.leader.x, G.leader.y); }
  updateSquad(dt);
  if (G.phase === 'run' || G.phase === 'boss') director(dt);
  updateSweep(dt); updateGoo(dt);
  updateEnemies(dt);
  if (G.phase === 'run' || G.phase === 'boss') { updateGuns(dt); }
  updateBullets(dt);
  updatePickups(dt);
  updateCarvings(dt);
  if (G.phase === 'freeze') updateFreeze(dt);
  if (G.phase === 'bossIntro') updateBossIntro(dt);
  if (G.phase === 'clear') updateClear(dt);
  if (G.phase === 'dead') { G.deadT += dt; }
  updateFx(dt);
  cleanup();
  // evolution tracking
  for (const m of G.squad) { const f = gunForm(m.gunLv); if (f > G.bestForm) G.bestForm = f; }
}

  for (const b of ENV.OBST) { if (!b.tall) continue; if (x > b.x0 && x < b.x1 && y > b.y0 - b.h + 6 && y < b.y1 - 3) return b; }
  return null;
}

// ---------- flow field toward the squad (Dijkstra on a 16px grid, 8-connected) ----------
const FLOW = { cell: 16, cols: 0, rows: 0, dist: null, block: null, t: 0, heap: null, built: false, tx: 0, ty: 0 };
function flowInit() {
  FLOW.cols = Math.ceil(ARENA.w / FLOW.cell); FLOW.rows = Math.ceil(ARENA.h / FLOW.cell);
  const N = FLOW.cols * FLOW.rows;
  FLOW.dist = new Float32Array(N); FLOW.block = new Uint8Array(N); FLOW.heap = new Int32Array(N * 8 + 16);
  for (let j = 0; j < FLOW.rows; j++) for (let i = 0; i < FLOW.cols; i++) {
    const x = (i + .5) * FLOW.cell, y = (j + .5) * FLOW.cell;
    if (x < ARENA.x0 || x > ARENA.x1 || y < ARENA.y0 || y > ARENA.y1 || insideObst(x, y, 6)) FLOW.block[j * FLOW.cols + i] = 1;
  }
  FLOW.built = true;
}
function flowUpdate(tx, ty) {
  if (!FLOW.built) flowInit();
  const C = FLOW.cols, R = FLOW.rows, D = FLOW.dist, B = FLOW.block, H = FLOW.heap;
  D.fill(1e9);
  let ci = clamp((tx / FLOW.cell) | 0, 0, C - 1), cj = clamp((ty / FLOW.cell) | 0, 0, R - 1);
  // if the target stands on a blocked cell, seed the nearest free one
  if (B[cj * C + ci]) { let best = -1, bd = 1e9; for (let dj = -3; dj <= 3; dj++) for (let di = -3; di <= 3; di++) { const i = ci + di, j = cj + dj; if (i < 0 || j < 0 || i >= C || j >= R || B[j * C + i]) continue; const d = di * di + dj * dj; if (d < bd) { bd = d; best = j * C + i; } } if (best < 0) return; ci = best % C; cj = (best / C) | 0; }
  // binary heap of cell indices keyed by D
  let n = 0;
  const push = c => { let k = n++; H[k] = c; while (k > 0) { const p = (k - 1) >> 1; if (D[H[p]] <= D[H[k]]) break; const t = H[p]; H[p] = H[k]; H[k] = t; k = p; } };
  const pop = () => { const top = H[0]; H[0] = H[--n]; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < n && D[H[l]] < D[H[m]]) m = l; if (r < n && D[H[r]] < D[H[m]]) m = r; if (m === k) break; const t = H[m]; H[m] = H[k]; H[k] = t; k = m; } return top; };
  const s = cj * C + ci; D[s] = 0; push(s);
  while (n > 0 && n < H.length - 8) {
    const c = pop(); const ci2 = c % C, cj2 = (c / C) | 0; const dc = D[c];
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue; const i = ci2 + di, j = cj2 + dj; if (i < 0 || j < 0 || i >= C || j >= R) continue;
      const q = j * C + i; if (B[q]) continue;
      if (di && dj && (B[cj2 * C + i] || B[j * C + ci2])) continue; // no corner cutting
      const nd = dc + (di && dj ? 1.414 : 1);
      if (nd < D[q]) { D[q] = nd; push(q); }
    }
  }
  FLOW.tx = tx; FLOW.ty = ty;
}
// direction (unit) to step along the field from a world point; null when off-grid or unreachable
const _fd = [0, 0];
function flowDir(x, y) {
  const C = FLOW.cols, R = FLOW.rows, D = FLOW.dist; if (!D) return null;
  const i = clamp((x / FLOW.cell) | 0, 0, C - 1), j = clamp((y / FLOW.cell) | 0, 0, R - 1);
  const c = j * C + i; let best = D[c], bi = 0, bj = 0;
  for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
    if (!di && !dj) continue; const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= C || jj >= R) continue;
    const q = jj * C + ii; if (FLOW.block[q]) continue; if (di && dj && (FLOW.block[j * C + ii] || FLOW.block[jj * C + i])) continue;
    if (D[q] < best) { best = D[q]; bi = di; bj = dj; }
  }
  if (!bi && !bj) return null;
  // aim at the centre of the chosen neighbour so agents don't hug corners
  const tx = (i + bi + .5) * FLOW.cell, ty = (j + bj + .5) * FLOW.cell; const dx = tx - x, dy = ty - y; const l = Math.hypot(dx, dy) || 1;
  _fd[0] = dx / l; _fd[1] = dy / l; return _fd;
}

// ===================== chapter-1 pressure: dial sweep, goo, second-hands, moth flocks, forward spawns =====================

// ---------- the plaza dial's minute hand sweeps a full turn every so often ----------
const SWEEP = { first: 44, every: 30, warn: 2.6, dur: 2.2, hub: 17, dmgSquad: 34, dmgEnemy: 380 };
function sweepInit() { G.sweep = { next: SWEEP.first, state: 'idle', t: 0, a0: 0, a: 0, prevA: 0, hits: new Set(), told: false }; }
function updateSweep(dt) {
  const S = G.sweep; if (!S) return;
  if (G.phase !== 'run' || G.duel) { if (S.state !== 'idle') { S.state = 'idle'; S.next = G.t + 8; } return; }
  if (S.state === 'idle') {
    if (G.t >= S.next) {
      S.state = 'warn'; S.t = 0; S.a0 = -Math.PI / 2 + G.t / 3600 * TAU; AUDIO.sfx('windup');
      if (!S.told) { S.told = true; UI.toast('分針要掃過來了', 'warn', '離開鐘面，或站進正中央的圓圈'); }
    }
  } else if (S.state === 'warn') {
    S.t += dt;
    if (S.t >= SWEEP.warn) { S.state = 'sweep'; S.t = 0; S.a = S.prevA = S.a0; S.hits.clear(); AUDIO.sfx('hands'); shake(.18); }
  } else {
    S.t += dt; S.prevA = S.a; S.a = S.a0 + easeInOut(Math.min(1, S.t / SWEEP.dur)) * TAU;
    const span = S.a - S.prevA;
    const crossed = (x, y, r) => {
      const dx = x - DIAL.x, dy = (y - DIAL.y) / .86; const d = Math.hypot(dx, dy);
      if (d < SWEEP.hub || d > DIAL.r + r + 2) return 0;
      const pad = (r + 4) / d; const da = angDiff(S.prevA, Math.atan2(dy, dx));
      return da >= -pad && da <= span + pad ? d : 0;
    };
    for (const m of G.squad) {
      if (!m.alive || m.down || S.hits.has(m.id)) continue;
      const d = crossed(m.x, m.y, m.hero.hr); if (!d) continue;
      S.hits.add(m.id);
      const nx = -Math.sin(S.a), ny = Math.cos(S.a);
      if (hurtMember(m, SWEEP.dmgSquad, 'sweep', nx, ny)) { m.x += nx * 16; m.y += ny * 14; }
    }
    for (const e of G.E) {
      if (e.dead || e.boss || e.rise > 0 || S.hits.has(e.uid)) continue;
      const d = crossed(e.x, e.y, e.r); if (!d) continue;
      S.hits.add(e.uid);
      hitEnemy(e, SWEEP.dmgEnemy, { m: null, dx: -Math.sin(S.a), dy: Math.cos(S.a), kb: 160, noBlast: true, cross: true });
    }
    if (S.t >= SWEEP.dur) { S.state = 'idle'; S.next = G.t + SWEEP.every - Math.min(10, G.t / 40); }
  }
}

// ---------- murk goo: slimes leave puddles that slow the squad ----------
function dropGoo(x, y, r) {
  if (G.GOO.length > 150) G.GOO.shift();
  G.GOO.push({ x: x + rnd(-2, 2), y: y + rnd(-1, 1), r: r * rnd(.85, 1.15), life: 7.5, max: 7.5 });
}
function updateGoo(dt) { const L = G.GOO; let w = 0; for (let i = 0; i < L.length; i++) { const g = L[i]; g.life -= dt; if (g.life > 0) L[w++] = g; } L.length = w; }
function gooAt(x, y) {
  for (const g of G.GOO) { const dx = x - g.x, dy = (y - g.y) / .6; if (dx * dx + dy * dy < g.r * g.r) return true; }
  return false;
}

// ---------- 秒針: hops to where the leader is about to be ----------
function handTick(e, dt) {
  const L = G.leader;
  if (e.land > 0) e.land -= dt;
  if (e.state === 'move' || e.state === 'rise') { e.state = 'wait'; e.st = .4 + RNG() * .5; }
  if (e.state === 'wait') {
    e.st -= dt; e.mvx = e.mvy = 0;
    if (e.st <= 0) {
      const lead = .85; let tx = L.x + L.vx * lead + rnd(-6, 6), ty = L.y + L.vy * lead + rnd(-6, 6);
      const dx = tx - e.x, dy = ty - e.y; const d = Math.hypot(dx, dy) || 1; const hop = Math.min(d, 58);
      const o = { x: e.x + dx / d * hop, y: e.y + dy / d * hop }; pushOutObst(o, e.r + 1);
      o.x = clamp(o.x, ARENA.x0 + 4, ARENA.x1 - 4); o.y = clamp(o.y, ARENA.y0 + 4, ARENA.y1 - 4);
      e.hx0 = e.x; e.hy0 = e.y; e.hx1 = o.x; e.hy1 = o.y; e.face = dx >= 0 ? 1 : -1;
      e.state = 'aim'; e.st = .32;
      if (onScreen(o.x, o.y, 20)) telegraph({ kind: 'tick', x: o.x, y: o.y, life: .32, e });
    }
  } else if (e.state === 'aim') {
    e.st -= dt; e.mvx = e.mvy = 0;
    if (e.st <= 0) { e.state = 'hop'; e.st = 0; if (onScreen(e.x, e.y, 0)) AUDIO.sfx('tock'); }
  } else if (e.state === 'hop') {
    e.st += dt; const k = Math.min(1, e.st / .15);
    const nx = lerp(e.hx0, e.hx1, k), ny = lerp(e.hy0, e.hy1, k);
    e.mvx = (nx - e.x) / dt; e.mvy = (ny - e.y) / dt; e.x = nx; e.y = ny;
    if (k >= 1) { e.state = 'wait'; e.st = .6 + RNG() * .2 - Math.min(.12, G.t / 2500); e.land = .12; if (onScreen(e.x, e.y, 0)) burst(e.x, e.y - 1, 4, hex32('#efe4c4', 200), 40, .25, { add: false, spr: 'p1' }); }
  }
}

// ---------- moth flocks: gather, circle the squad, then dive together ----------
function spawnFlock(n, x, y) {
  const F = { id: G.uid++, phase: 'gather', t: 0, ang: rnd(TAU), dur: rnd(1.8, 2.6), n: 0 };
  for (let i = 0; i < n; i++) { const e = spawnEnemy('moth', x + rnd(-14, 14), y + rnd(-14, 14)); e.flock = F; e.slotA = i / n * TAU; F.n++; }
  return F;
}
function mothFlock(e, dt, sp) {
  const F = e.flock, L = G.leader;
  // the first moth to act each frame advances the shared flock clock
  if (F.tick !== G.real) {
    F.tick = G.real; F.t += dt;
    if (F.phase === 'gather' && F.t > 7) { F.phase = 'orbit'; F.t = 0; }
    else if (F.phase === 'orbit') { F.ang += dt * 1.5; if (F.t > F.dur) { F.phase = 'warn'; F.t = 0; F.dx = L.x + L.vx * .35; F.dy = L.y + L.vy * .35; if (G.E.some(o => o.flock === F && onScreen(o.x, o.y, 0))) AUDIO.sfx('windup'); } }
    else if (F.phase === 'warn' && F.t > .5) { F.phase = 'dive'; F.t = 0; }
    else if (F.phase === 'dive' && F.t > .62) { F.phase = 'scatter'; F.t = 0; }
    else if (F.phase === 'scatter' && F.t > .7) { F.phase = 'orbit'; F.t = 0; F.dur = rnd(1.8, 2.8); }
  }
  let tx, ty, s = sp;
  if (F.phase === 'gather') {
    tx = L.x; ty = L.y;
    if (Math.hypot(e.x - L.x, e.y - L.y) < 110) { F.phase = 'orbit'; F.t = 0; }
  } else if (F.phase === 'orbit' || F.phase === 'warn') {
    const a = F.ang + e.slotA; tx = L.x + Math.cos(a) * 82; ty = L.y + Math.sin(a) * 66; s = sp * (F.phase === 'warn' ? .25 : 1.25);
  } else if (F.phase === 'dive') {
    tx = F.dx; ty = F.dy; s = sp * 2.4;
  } else { tx = e.x + (e.x - L.x); ty = e.y + (e.y - L.y); s = sp * 1.2; }
  const dx = tx - e.x, dy = ty - e.y; const d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, d / 8);
  return [dx / d * s * k, dy / d * s * k];
}

// ---------- spawn placement: ahead of the squad, not only trailing behind ----------
function spawnAhead(pad) {
  const L = G.leader; const v = Math.hypot(L.vx, L.vy);
  if (v < 25) return null;
  const [W, H] = GL.size();
  const base = Math.atan2(L.vy, L.vx);
  for (let tries = 0; tries < 6; tries++) {
    const a = base + rnd(-.95, .95);
    const c = Math.cos(a), s = Math.sin(a);
    // walk from the view centre to just past the view edge in that direction
    const cx = G.camX + W / 2, cy = G.camY + H / 2;
    const tx = c > 0 ? (G.camX + W + pad - cx) / c : c < 0 ? (G.camX - pad - cx) / c : 1e9;
    const ty = s > 0 ? (G.camY + H + pad - cy) / s : s < 0 ? (G.camY - pad - cy) / s : 1e9;
    const k = Math.min(tx, ty);
    const x = cx + c * k, y = cy + s * k;
    if (x > ARENA.x0 + 4 && x < ARENA.x1 - 4 && y > ARENA.y0 + 4 && y < ARENA.y1 - 4 && !insideObst(x, y, 10)) return [x, y];
  }
  return null;
}
// rising from the cobbles a short way ahead (with a warning mark on the ground first)
function riseAhead(type) {
  const L = G.leader; const v = Math.hypot(L.vx, L.vy); if (v < 25) return null;
  const base = Math.atan2(L.vy, L.vx);
  for (let tries = 0; tries < 5; tries++) {
    const a = base + rnd(-.6, .6), r = rnd(105, 150);
    const x = L.x + Math.cos(a) * r, y = L.y + Math.sin(a) * r * .9;
    if (x < ARENA.x0 + 8 || x > ARENA.x1 - 8 || y < ARENA.y0 + 8 || y > ARENA.y1 - 8 || insideObst(x, y, 10)) continue;
    if (G.squad.some(m => m.alive && Math.hypot(m.x - x, m.y - y) < 80)) continue;
    const e = spawnEnemy(type, x, y, { rise: .95, state: 'rise' });
    telegraph({ kind: 'rise', x, y, life: .95, r: e.r + 4 });
    return e;
  }
  return null;
}

let FRAME = 0;
function updateCamera(dt, mode) {

// ---------- resize ----------
function resize() {

// ---------- loop ----------

        if (INPUT.bot) setTimeout(() => { const b = document.querySelector('#cards .card'); if (b) b.click(); setTimeout(() => { const o = document.querySelector('.bopt'); if (o) o.click(); }, 50); }, 30);

      if (chance(dt * 3)) part({ x: rnd(G.camX, G.camX + GL.size()[0]), y: G.camY + GL.size()[1] + 4, vx: rnd(-4, 4), vy: -rnd(10, 22), life: rnd(4, 7), spr: 'p1', col: hex32('#c9d8ff', 160), add: true, mote: true });
    }

    if (G.introPan > 0) { G.introPan -= dt; updateCamera(dt * .45, null); } else updateCamera(dt, mode);
    renderWorld();

let errShown = false;
function showError(err) {

  d.textContent = '錯誤：' + (err && err.message) + ' ' + ((err && err.stack) || '').split('\n')[1]; document.body.appendChild(d);
}
window.addEventListener('error', e => showError(e.error || e));

function boot(hot) {
  cv = document.getElementById('cv');
  loadGame(hot && hot.save);
  if (!GL.init(cv)) { document.getElementById('loading').textContent = '這台裝置不支援 WebGL，無法執行遊戲。'; return; }
  resize();
  window.addEventListener('resize', resize);
  ATLAS.build();
  ENV.buildGround();
  GL.texture('ground', ENV.ground()); GL.texture('sky', ENV.sky());
  UI.init(); setupInput();
  newRun(); STATE = 'title'; UI.showTitle();
  snapCamera();
  updateCamera(1, 'title'); G.camX = G.camX;
  document.getElementById('loading').hidden = true;
  setTimeout(() => AUDIO.synthProgressive(), 60);
  try { window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function' && window.claude.hot.snapshot(() => ({ save: SAVE })); } catch (e) { }

}

  jump(t) { G.t = t; while (G.evIdx < CH1.events.length && CH1.events[G.evIdx].t < t) G.evIdx++; },
  spawn(type, n) { for (let i = 0; i < (n || 1); i++) { const [x, y] = spawnPointOutside(10); spawnEnemy(type, x, y); } },
  lv(n) { for (let i = 0; i < n; i++) { const o = genOffers(false); const c = o[0]; applyOffer(c, c.brk ? (chance(.5) ? 'A' : 'B') : null); } G.pending = 0; },
  gun(id, L) { const m = G.squad.find(x => x.id === id); m.gunLv = L; m.gs = GUNS[m.gun].stats(L); },
  skill(id, key, L, br) { const m = G.squad.find(x => x.id === id); if (m) { m.sk[key] = L; if (br) m.br[key] = br; } else { G.team.sk[key] = L; if (br) G.team.br[key] = br; } },
  god() { for (const m of G.squad) { m.maxHp = m.hp = 99999; } },
  sim(sec, pickFn) { const n = Math.round(sec / STEP); const t0 = performance.now(); for (let i = 0; i < n; i++) { readInput(); step(STEP); updateCamera(STEP, null); if (G.phase === 'boss' && G.boss && G.boss.hp <= 0 && !G.boss.dying) bossDefeated(G.boss); while (G.pending > 0) { const o = genOffers(G.chestPending > 0); const c = pickFn ? pickFn(o) : o[0]; applyOffer(c, c.brk ? (chance(.5) ? 'A' : 'B') : null); G.pending--; if (G.chestPending > 0) G.chestPending--; } if (G.phase === 'dead') break; } return { ms: performance.now() - t0, t: G.t, phase: G.phase, lv: G.level, dmgIn: Math.round(G.dmgIn || 0), dmgLead: Math.round(G.dmgLead || 0), bossHp: G.boss ? Math.round(G.boss.hp) : null, E: G.E.length, kills: G.kills, hp: G.squad.map(m => Math.round(m.hp)), guns: G.squad.map(m => m.gunLv), sk: G.squad.map(m => JSON.stringify(m.sk)).concat(JSON.stringify(G.team.sk)) }; },
  perf(frames) { const t0 = performance.now(); for (let i = 0; i < frames; i++) { step(STEP); } const t1 = performance.now(); for (let i = 0; i < frames; i++) renderWorld(); const t2 = performance.now(); return { update: (t1 - t0) / frames, render: (t2 - t1) / frames, enemies: G.E.length, bullets: G.B.length, parts: G.P.length, quads: GL.quads }; },
};
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') { try { window.claude.hot.ready(d => boot(d || {})); } catch (e) { boot({}); } }
else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot(window.claude && window.claude.hot && window.claude.hot.data || {}));
else boot(window.claude && window.claude.hot && window.claude.hot.data || {});
