<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>一瓶晴灣</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* layout: one portrait column (phone first); canvases span the window so bottles can fly over the paper slip */
:root {
  --ink: #0c171e;
  --ink-2: #13232c;
  --paper: #efe5cf;
  --paper-2: #e3d6b8;
  --paper-ink: #2e241b;
  --lamp: #ffcf8f;
  --seal: #b8392c;
  --fg: #f1eadc;
  --fg-dim: #a9b4b8;
  --line: rgba(241, 234, 220, 0.14);
  --f-sign: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-hand: "LXGW WenKai TC", "Iansui", "Kaiti TC", "STKaiti", "DFKai-SB", serif;
  --f-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --colw: min(100vw, max(390px, calc(100vh * 0.64)), 720px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--f-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
#bgc, #fgc, #stc { position: fixed; left: 0; top: 0; }
#stc { z-index: 3; pointer-events: none; }
#bgc { z-index: 0; }
#fgc { z-index: 4; pointer-events: none; }
#app { position: fixed; inset: 0; z-index: 2; display: flex; justify-content: center; }
.col { position: relative; width: var(--colw); height: 100%; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.screen.on { opacity: 1; pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; border-radius: 8px; }

/* ---------- title ---------- */
#title { justify-content: center; align-items: center; text-align: center; padding-inline: 24px; }
#title .veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(12,23,30,.35), rgba(12,23,30,.92) 78%); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sign { position: relative; z-index: 2; display: grid; gap: 14px; justify-items: center; }
.sign .board { position: relative; padding: 26px 30px 22px; background: linear-gradient(180deg, #4b3322, #33221a); border-radius: 10px; box-shadow: 0 1px 0 rgba(255,230,190,.25) inset, 0 18px 40px rgba(0,0,0,.55), 0 0 0 3px #22160f, 0 0 0 4px rgba(255,214,150,.25); }
.sign .board::before, .sign .board::after { content: ""; position: absolute; top: -46px; width: 2px; height: 46px; background: linear-gradient(#000, #8d7a5c); }
.sign .board::before { left: 34px; } .sign .board::after { right: 34px; }
.sign h1 { margin: 0; font-family: var(--f-sign); font-weight: 900; font-size: clamp(46px, 15vw, 76px); letter-spacing: .12em; line-height: 1.05; text-wrap: balance; }
.sign h1 span { display: inline-block; color: #8d9396; transition: color 1.6s ease, text-shadow 1.6s ease; }
.sign h1.lit span:nth-child(1) { color: #ff8a6e; text-shadow: 0 0 22px rgba(255,120,90,.35); transition-delay: .2s; }
.sign h1.lit span:nth-child(2) { color: #ffd76a; text-shadow: 0 0 22px rgba(255,210,100,.35); transition-delay: .55s; }
.sign h1.lit span:nth-child(3) { color: #8fb6ff; text-shadow: 0 0 22px rgba(120,160,255,.35); transition-delay: .9s; }
.sign h1.lit span:nth-child(4) { color: #c79dff; text-shadow: 0 0 22px rgba(190,140,255,.35); transition-delay: 1.25s; }
.sign .en { font-family: var(--f-sign); font-size: 12px; letter-spacing: .42em; color: #d9c7a3; opacity: .8; margin-top: 10px; }
.sign .shop { font-family: var(--f-hand); color: var(--fg-dim); font-size: 15px; letter-spacing: .2em; }
.btn-main { position: relative; z-index: 2; margin-top: 34px; padding: 14px 44px; border-radius: 999px; background: linear-gradient(180deg, #f4d39b, #d9a65b); color: #2c1d0f; font-weight: 700; font-size: 17px; letter-spacing: .3em; box-shadow: 0 6px 0 #8a5f2a, 0 14px 30px rgba(0,0,0,.45); transition: transform .12s, box-shadow .12s; }
.btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a5f2a, 0 8px 18px rgba(0,0,0,.4); }
.btn-ghost { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); font-size: 14px; letter-spacing: .12em; background: rgba(12,23,30,.4); }
#title .ver { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; font-size: 11px; color: rgba(241,234,220,.35); letter-spacing: .2em; z-index: 2; }

/* ---------- city ---------- */
#city .map { position: absolute; inset: 0; overflow: hidden; background: #c9c3b6; }
#city .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#city .hud { position: relative; z-index: 3; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chap { display: grid; gap: 2px; padding: 8px 14px; border-radius: 12px; background: rgba(12,23,30,.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chap b { font-family: var(--f-sign); font-weight: 700; font-size: 15px; letter-spacing: .14em; }
.chap small { font-size: 11px; color: var(--fg-dim); letter-spacing: .1em; }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pips i { width: 7px; height: 12px; border-radius: 2px 2px 3px 3px; background: rgba(241,234,220,.18); }
.pips i.done { background: var(--c, var(--lamp)); }
.pips i.seal { box-shadow: 0 0 0 1px var(--lamp); }
.icons { display: flex; gap: 8px; }
.ibtn { width: 42px; height: 42px; border-radius: 12px; background: rgba(12,23,30,.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: center; }
.ibtn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ibtn.dot::after { content: ""; position: absolute; transform: translate(14px, -14px); width: 8px; height: 8px; border-radius: 50%; background: #e4473a; }
#city .next { position: absolute; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 3; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 16px; background: rgba(12,23,30,.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#city .next .t { flex: 1; min-width: 0; }
#city .next small { display: block; font-size: 11px; color: var(--fg-dim); letter-spacing: .14em; }
#city .next b { display: block; font-family: var(--f-sign); font-size: 17px; letter-spacing: .08em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#city .next em { font-style: normal; font-family: var(--f-hand); font-size: 13px; color: #d9c7a3; }
#city .next .btn-main { margin: 0; padding: 12px 22px; font-size: 15px; letter-spacing: .2em; }
.bloomtxt { position: absolute; left: 24px; right: 24px; top: 30%; z-index: 3; text-align: center; font-family: var(--f-hand); font-size: 19px; line-height: 1.7; color: #fff8e8; text-shadow: 0 2px 12px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.6); opacity: 0; transition: opacity .8s; pointer-events: none; text-wrap: balance; }
.bloomtxt.on { opacity: 1; }

/* ---------- play ---------- */
#play .top { position: relative; z-index: 3; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 6px; }
#play .top .ttl { flex: 1; min-width: 0; text-align: center; }
#play .top .ttl small { display: block; font-size: 10.5px; letter-spacing: .3em; color: var(--fg-dim); }
#play .top .ttl b { display: block; font-family: var(--f-sign); font-size: 16px; letter-spacing: .12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.15; }
.steps b { font-size: 18px; font-weight: 700; }
.steps small { display: block; font-size: 10.5px; color: var(--fg-dim); letter-spacing: .08em; }
.steps.over small { color: #e8907f; }
.order { position: relative; z-index: 3; margin: 2px 14px 0; padding: 10px 14px 10px; border-radius: 6px 10px 8px 12px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 8px 18px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.6) inset; transform: rotate(-.6deg); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; background-image: var(--paper-tex); }
.order .who { font-size: 11px; letter-spacing: .18em; color: #7a6a55; }
.order .line { grid-column: 1 / -1; font-family: var(--f-hand); font-size: 15px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.order.dark { background: #1c1f24; color: #e8e3d8; background-image: none; box-shadow: 0 8px 18px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08) inset; }
.order.dark .who { color: #9aa0a8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip svg { width: 15px; height: 26px; overflow: visible; }
.chip.jar svg { width: 24px; height: 24px; }
.chip.ok { opacity: .5; }
.chip.ok .ck { opacity: 1; }
.chip .ck { opacity: 0; color: var(--seal); font-size: 14px; margin-left: -2px; transition: opacity .3s; }
.chip.pop { animation: pop .5s ease; }
@keyframes pop { 30% { transform: scale(1.35); } }
#play .board { position: relative; flex: 1; min-height: 0; }
#play .bot { position: relative; z-index: 3; display: flex; justify-content: center; gap: 12px; padding: 6px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.tool { display: grid; justify-items: center; gap: 2px; min-width: 64px; padding: 8px 12px; border-radius: 14px; background: rgba(241,234,220,.06); border: 1px solid var(--line); font-size: 11.5px; letter-spacing: .12em; color: var(--fg); }
.tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool:disabled { opacity: .35; }
.tool.nudge { animation: nudge 1.2s ease infinite; border-color: var(--lamp); }
@keyframes nudge { 50% { box-shadow: 0 0 0 6px rgba(255,207,143,.18); } }
.toast { position: absolute; left: 50%; top: 6px; transform: translate(-50%, -8px); z-index: 6; padding: 8px 14px; border-radius: 999px; background: rgba(8,14,18,.9); color: var(--fg); font-size: 13px; letter-spacing: .06em; white-space: nowrap; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.note { position: absolute; left: 18px; right: 18px; z-index: 6; top: 64px; padding: 12px 16px; border-radius: 4px 12px 10px 12px; background: var(--paper); background-image: var(--paper-tex); color: var(--paper-ink); font-family: var(--f-hand); font-size: 15.5px; line-height: 1.55; box-shadow: 0 12px 30px rgba(0,0,0,.45); transform: translateY(14px) rotate(.8deg); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
.note.on { opacity: 1; transform: translateY(0) rotate(.8deg); pointer-events: auto; }
.note { transform: translateY(-14px) rotate(.8deg); }
.note::before { content: "師傅的字條"; display: block; font-family: var(--f-ui); font-size: 10.5px; letter-spacing: .25em; color: #8a7760; margin-bottom: 2px; }
.note.boss { background: #1c1f24; color: #e2ddd2; background-image: none; }
.note.boss::before { content: "收色人"; color: #8d939b; }
.note.warn::before { content: "鋪子裡的自言自語"; }
.note .act { display: inline-block; margin-top: 8px; font-family: var(--f-ui); font-size: 13px; padding: 6px 14px; border-radius: 999px; background: var(--paper-ink); color: var(--paper); letter-spacing: .1em; }
.hand { position: fixed; z-index: 7; width: 46px; height: 46px; pointer-events: none; opacity: 0; transition: opacity .3s; }
.hand.on { opacity: 1; animation: tapme 1.1s ease-in-out infinite; }
@keyframes tapme { 0%, 100% { transform: translate(-6px, 4px) scale(1); } 45% { transform: translate(-6px, -4px) scale(.92); } }

/* ---------- overlays ---------- */
.ov { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); background: rgba(6,11,14,.72); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .35s; }
.ov.on { opacity: 1; pointer-events: auto; }
.narr { max-width: 30em; margin: 0 0 14px; text-align: center; font-family: var(--f-hand); font-size: 15.5px; line-height: 1.7; color: #d8ccb6; text-wrap: balance; }
.slip { position: relative; width: min(100%, 420px); padding: 22px 22px 18px; border-radius: 4px 14px 8px 12px; background: var(--paper); background-image: var(--paper-tex); color: var(--paper-ink); box-shadow: 0 20px 50px rgba(0,0,0,.55); transform: rotate(-1.2deg); }
.slip .who { font-size: 12px; letter-spacing: .26em; color: #7a6a55; margin-bottom: 8px; }
.slip .body { font-family: var(--f-hand); font-size: 19px; line-height: 1.75; min-height: 4em; }
.slip .body p { margin: 0 0 4px; opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s; }
.slip .body p.in { opacity: 1; transform: none; }
.slip.kid .body { font-size: 20px; letter-spacing: .02em; }
.slip.shaky .body p { letter-spacing: .06em; }
.slip.shaky .body p:nth-child(2) { transform: rotate(-.6deg); }
.slip.shaky::after { content: ""; position: absolute; right: 22px; top: 36px; width: 70px; height: 54px; border-radius: 50%; background: radial-gradient(ellipse, rgba(120,140,160,.18), rgba(120,140,160,0) 70%); }
.slip.grey { background: #16191d; background-image: none; color: #e6e1d6; border-radius: 6px; box-shadow: 0 20px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.1) inset; }
.slip.grey .who { color: #8f959d; }
.slip.grey .body { font-family: var(--f-sign); font-size: 17px; letter-spacing: .08em; }
.slip.self { transform: rotate(.8deg); }
.slip .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(46,36,27,.25); }
.slip.grey .foot { border-color: rgba(255,255,255,.15); }
.slip .token { width: 54px; height: 54px; flex: none; }
.slip .token svg { width: 100%; height: 100%; }
.stamp { position: absolute; right: 18px; top: 14px; width: 92px; height: 92px; display: grid; place-items: center; border: 4px double var(--seal); border-radius: 50%; color: var(--seal); font-family: var(--f-sign); font-weight: 900; font-size: 30px; letter-spacing: .05em; transform: rotate(-14deg) scale(2.2); opacity: 0; mix-blend-mode: multiply; }
.stamp.on { animation: slam .42s cubic-bezier(.2,1.4,.4,1) forwards; }
.stamp.master { right: auto; left: 18px; top: auto; bottom: 64px; width: 64px; height: 64px; font-size: 22px; border-width: 3px; border-style: solid; border-radius: 10px; transform: rotate(9deg) scale(2.2); }
.stamp.master.on { animation-name: slam2; }
@keyframes slam { to { opacity: .9; transform: rotate(-14deg) scale(1); } }
@keyframes slam2 { to { opacity: .85; transform: rotate(9deg) scale(1); } }
.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; justify-content: center; align-items: center; }
.actions .btn-main { margin-top: 0; }
.after { max-width: 28em; margin: 18px 0 0; text-align: center; font-family: var(--f-hand); font-size: 17px; line-height: 1.7; color: #f1e7d2; text-wrap: balance; opacity: 0; transition: opacity .6s; }
.after.on { opacity: 1; }
.meta { margin-top: 8px; font-size: 12px; color: var(--fg-dim); letter-spacing: .14em; font-variant-numeric: tabular-nums; }
.receipt { width: min(100%, 320px); padding: 20px 22px; background: #f3eee2; background-image: var(--paper-tex); color: #2b2621; font-family: var(--f-sign); box-shadow: 0 20px 50px rgba(0,0,0,.55); transform: rotate(1.4deg); clip-path: polygon(0 0, 100% 0, 100% 96%, 92% 100%, 84% 96%, 76% 100%, 68% 96%, 60% 100%, 52% 96%, 44% 100%, 36% 96%, 28% 100%, 20% 96%, 12% 100%, 4% 96%, 0 100%); }
.receipt h3 { margin: 0 0 12px; text-align: center; letter-spacing: .6em; font-size: 18px; }
.receipt dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
.receipt dt { color: #7d746a; letter-spacing: .3em; }
.receipt dd { margin: 0; font-family: var(--f-hand); font-size: 17px; }
.receipt .sg { margin-top: 14px; text-align: right; font-family: var(--f-hand); color: #5e5a55; }
.final { margin-top: 22px; font-family: var(--f-sign); font-size: 22px; letter-spacing: .3em; color: #fff3df; opacity: 0; transition: opacity 1.2s; }
.final.on { opacity: 1; }

/* sheets */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 86%; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; background: #121e25; box-shadow: 0 -20px 50px rgba(0,0,0,.5); transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.9,.3,1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.on { transform: none; }
.sheet .hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; }
.sheet .hd b { font-family: var(--f-sign); font-size: 18px; letter-spacing: .16em; }
.sheet .bd { overflow-y: auto; padding: 4px 18px 22px; -webkit-overflow-scrolling: touch; }
.scrim { position: absolute; inset: 0; z-index: 8; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row label { font-size: 15px; letter-spacing: .08em; }
.row small { display: block; font-size: 12px; color: var(--fg-dim); margin-top: 2px; letter-spacing: .04em; }
.sw { position: relative; width: 50px; height: 30px; border-radius: 999px; background: rgba(241,234,220,.18); transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.sw[aria-checked="true"] { background: #c9934d; }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.lv { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lv .n { font-family: var(--f-sign); font-size: 13px; color: var(--fg-dim); text-align: center; }
.lv b { display: block; font-family: var(--f-sign); font-size: 15px; letter-spacing: .08em; }
.lv small { font-size: 11.5px; color: var(--fg-dim); letter-spacing: .06em; }
.lv .st { display: flex; gap: 6px; align-items: center; }
.seal-s { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 2px solid var(--seal); border-radius: 5px; color: #ff9c8a; font-family: var(--f-sign); font-size: 12px; font-weight: 900; transform: rotate(8deg); }
.lv.locked { opacity: .35; }
.pg { display: grid; gap: 14px; }
.page { position: relative; padding: 18px 18px 16px; border-radius: 4px 12px 8px 10px; background: var(--paper); background-image: var(--paper-tex); color: var(--paper-ink); box-shadow: 0 8px 20px rgba(0,0,0,.35); display: grid; grid-template-columns: 1fr 52px; gap: 10px; }
.page:nth-child(odd) { transform: rotate(-.5deg); } .page:nth-child(even) { transform: rotate(.5deg); }
.page .q { font-family: var(--f-hand); font-size: 18px; line-height: 1.6; }
.page small { grid-column: 1 / -1; font-size: 11px; letter-spacing: .2em; color: #8a7760; }
.page.lock { background: rgba(241,234,220,.06); background-image: none; color: var(--fg-dim); box-shadow: none; border: 1px dashed var(--line); }
.page.lock .q { font-size: 15px; }
.confirm { display: none; gap: 10px; margin-top: 10px; }
.confirm.on { display: flex; }
.danger { color: #ffb4a6; border-color: rgba(255,140,120,.35); }
@media (prefers-reduced-motion: reduce) { .screen, .ov, .sheet { transition: none; } .hand.on { animation: none; } }

/* ---------- chapters, regulars, letters ---------- */
button.chap { text-align: left; color: var(--fg); }
.icons .ibtn { position: relative; }
.ibtn.dot::after { left: 50%; top: 50%; }
#city .next { flex-wrap: wrap; }

<script>
/* 一瓶晴灣 — rules engine + solver (shared by the game and the level tools) */
(function (G) {
  'use strict';
  const PRIMARY = { R: 1, Y: 1, B: 1 };
  const MIX = { RY: 'O', YR: 'O', YB: 'G', BY: 'G', RB: 'P', BR: 'P' };
  const GREY = 'A';
  // 補色法（第二章起）：燒瓶也收橙、綠、紫；補色相遇調成棕
  const CHROMA = { R: 1, Y: 1, B: 1, O: 1, G: 1, P: 1 };
  const MIX2 = { RG: 'N', GR: 'N', YP: 'N', PY: 'N', BO: 'N', OB: 'N' };
  // 墨（第五章起）：很重，倒進瓶子會沉到最底下
  const HEAVY = { I: 1 };

  // ---------- state helpers ----------
  // vessel: { t:'vial'|'flask'|'jar'|'urn', cap, s:string(bottom→top), h:string('1' hidden / '0'), pat?, done, g:gate, tl:sealTurns }
  function makeState(level) {
    const v = level.vessels.map(x => ({
      t: x.t, cap: x.cap || (x.t === 'urn' ? 8 : 4), s: x.s || '',
      h: x.h || '0'.repeat((x.s || '').length), pat: x.pat || null, done: false, g: x.gate || 0, tl: 0, f: x.f ? 1 : 0,
    }));
    let jars = 0;
    v.forEach(x => { if (x.t === 'jar') jars++; });
    let need = Object.assign({}, level.need || {});
    if (level.order) { need = {}; for (const c of level.order) need[c] = (need[c] || 0) + 1; }
    return { v, need, jars, mc: 0, atk: 0, dn: 0, oq: 0, wv: 0, adv: !!level.adv };
  }
  function cloneState(st) {
    return {
      v: st.v.map(x => ({ t: x.t, cap: x.cap, s: x.s, h: x.h, pat: x.pat, done: x.done, g: x.g, tl: x.tl, f: x.f })),
      need: Object.assign({}, st.need), jars: st.jars, mc: st.mc, atk: st.atk, dn: st.dn, oq: st.oq, wv: st.wv, adv: st.adv,
    };
  }
  function topRun(s) {
    const n = s.length;
    if (!n) return [null, 0];
    const c = s[n - 1];
    let r = 1;
    while (r < n && s[n - 1 - r] === c) r++;
    return [c, r];
  }
  // heavy units always sit at the bottom; turning a vessel over keeps them there and reverses the rest
  function flipS(s) {
    let n = 0;
    while (n < s.length && HEAVY[s[n]]) n++;
    return s.slice(0, n) + s.slice(n).split('').reverse().join('');
  }
  function flipH(s, h) {
    let n = 0;
    while (n < s.length && HEAVY[s[n]]) n++;
    return h.slice(0, n) + h.slice(n).split('').reverse().join('');
  }
  function isMono(s) {
    for (let q = 1; q < s.length; q++) if (s[q] !== s[0]) return false;
    return true;
  }

  // ---------- rules ----------
  function lockOf(st, x) { // null | { kind:'gate'|'seal', n }
    if (x.g > 0 && st.dn < x.g) return { kind: 'gate', n: x.g - st.dn };
    if (x.tl > 0) return { kind: 'seal', n: x.tl };
    return null;
  }
  function check(st, i, j) {
    if (i === j) return { ok: false, why: 'same' };
    const a = st.v[i], b = st.v[j];
    if (!a || !b) return { ok: false, why: 'none' };
    if (a.done) return { ok: false, why: 'srcDone' };
    if (b.done) return { ok: false, why: 'dstDone' };
    const la = lockOf(st, a), lb = lockOf(st, b);
    if (la || lb) { const l = la || lb; return { ok: false, why: l.kind === 'gate' ? 'lockedGate' : 'lockedSeal', want: l.n }; }
    if (a.t === 'jar') return { ok: false, why: 'jarSource' };
    const s = a.s;
    if (!s.length) return { ok: false, why: 'empty' };
    const [c, r] = topRun(s);
    if (a.t === 'urn' && c === GREY) return { ok: false, why: 'urnGrey' };
    const space = b.cap - b.s.length;
    if (space <= 0) return { ok: false, why: 'full' };
    let k = Math.min(r, space), mix = null, sink = false;
    if (HEAVY[c] && b.s.length && b.t !== 'urn') {

/* ---------- 瓶子幾何：內腔多邊形、依體積求液面、傾倒角度表 ---------- */
const Geo = (() => {
  const smooth = u => u * u * (3 - 2 * u);
  function sCurve(x0, y0, x1, y1, n, out) {
    for (let k = 1; k <= n; k++) { const u = k / n; out.push([x0 + (x1 - x0) * smooth(u), y0 + (y1 - y0) * u]); }
  }
  function arc(cx, cy, r, a0, a1, n, out) {
    for (let k = 1; k <= n; k++) { const a = a0 + (a1 - a0) * k / n; out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  }
  // profile-based (symmetric) polygon from [y, halfWidth] list (bottom→top), catmull-rom smoothed
  function profilePoly(prof, spoutR) {
    const sm = [];
    for (let i = 0; i < prof.length - 1; i++) {
      const p0 = prof[Math.max(0, i - 1)], p1 = prof[i], p2 = prof[i + 1], p3 = prof[Math.min(prof.length - 1, i + 2)];
      for (let k = 0; k < 6; k++) {
        const t = k / 6, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        sm.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    sm.push(prof[prof.length - 1]);
    const left = [], right = [];
    for (const [y, w] of sm) { left.push([-w, y]); right.push([w, y]); }
    const pts = left.reverse(); // top-left → bottom-left
    for (const p of right) pts.push(p); // bottom-right → top-right
    if (spoutR) pts.push(spoutR);
    return pts;
  }

  // cap 4 is the everyday vial; the snow-line huts also blow tall (6) and small (2) ones — every unit is the same height
  function vial(cap) {
    cap = cap || 4;
    const U = 26.25, top = -U * cap;
    const hw = 20, neck = 11.5, rB = 11, shY = top - 9, nkY = top - 23, mY = top - 39;
    const p = [[-neck, mY], [-neck, nkY]];
    sCurve(-neck, nkY, -hw, shY, 8, p);
    p.push([-hw, -rB]);
    arc(-hw + rB, -rB, rB, Math.PI, Math.PI / 2, 6, p);
    p.push([hw - rB, 0]);
    arc(hw - rB, -rB, rB, Math.PI / 2, 0, 6, p);
    p.push([hw, shY]);
    sCurve(hw, shY, neck, nkY, 8, p);
    p.push([neck, mY]);
    return { poly: p, capY: top, cap, w: 46, h: -mY + 2, mouthY: mY, mouthHW: neck, bodyHW: hw };
  }
  // 沙漏瓶: a straight bottle, round at both ends, held in a turning frame
  function hour() {
    const hw = 19, rB = 10, H = 114;
    const p = [[-(hw - rB), -H]];
    arc(-hw + rB, -H + rB, rB, -Math.PI / 2, -Math.PI, 6, p);
    p.push([-hw, -rB]);
    arc(-hw + rB, -rB, rB, Math.PI, Math.PI / 2, 6, p);
    p.push([hw - rB, 0]);
    arc(hw - rB, -rB, rB, Math.PI / 2, 0, 6, p);
    p.push([hw, -H + rB]);
    arc(hw - rB, -H + rB, rB, 0, -Math.PI / 2, 6, p);
    return { poly: p, capY: -105, cap: 4, w: 44, h: H + 2, mouthY: -H, mouthHW: hw - rB, bodyHW: hw, hour: true, midY: -H / 2 };
  }
  function flask() {
    const R = 29.5, cy = -30.5, neck = 9, mY = -118;
    const yi = cy - Math.sqrt(R * R - neck * neck);
    const p = [[-neck, mY], [-neck, yi]];
    const a0 = Math.atan2(yi - cy, -neck), a1 = Math.atan2(yi - cy, neck) - Math.PI * 2;
    arc(0, cy, R, a0, a1, 44, p);
    p[p.length - 1] = [neck, yi];
    p.push([neck, mY]);
    return { poly: p, capY: -52, cap: 4, w: 68, h: 120, mouthY: mY, mouthHW: neck, bodyHW: R, bulb: { cy, R } };
  }
  function jar() {
    const hw = 31, mouth = 25, rB = 14, shY = -90, nkY = -97, mY = -104;
    const p = [[-mouth, mY], [-mouth, nkY]];
    sCurve(-mouth, nkY, -hw, shY, 5, p);
    p.push([-hw, -rB]);
    arc(-hw + rB, -rB, rB, Math.PI, Math.PI / 2, 6, p);
    p.push([hw - rB, 0]);
    arc(hw - rB, -rB, rB, Math.PI / 2, 0, 6, p);
    p.push([hw, shY]);
    sCurve(hw, shY, mouth, nkY, 5, p);
    p.push([mouth, mY]);
    return { poly: p, capY: -86, cap: 4, w: 72, h: 106, mouthY: mY, mouthHW: mouth, bodyHW: hw };
  }
  function urn() {
    const prof = [[0, 18], [-6, 26], [-26, 33], [-66, 36], [-116, 33], [-156, 26], [-176, 17], [-190, 14], [-202, 16]];
    const p = profilePoly(prof);
    return { poly: p, capY: -168, cap: 8, w: 78, h: 204, mouthY: -202, mouthHW: 16, bodyHW: 36 };
  }
  function pitcher() {
    const prof = [[0, 21], [-8, 27], [-46, 30], [-86, 25], [-108, 20], [-122, 22]];
    const p = profilePoly(prof, [34, -131]);
    // drop the last right point (replaced by spout)
    return { poly: p, w: 70, h: 132, mouthY: -122, mouthHW: 22, spout: [34, -131] };
  }

  // ---- polygon math ----
  function rot(poly, th) {
    const c = Math.cos(th), s = Math.sin(th), out = new Array(poly.length);
    for (let i = 0; i < poly.length; i++) { const [x, y] = poly[i]; out[i] = [x * c - y * s, x * s + y * c]; }
    return out;
  }
  function rotPt(p, th) { const c = Math.cos(th), s = Math.sin(th); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }
  function area(poly) {
    let a = 0;
    for (let i = 0, n = poly.length; i < n; i++) { const p = poly[i], q = poly[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }
    return Math.abs(a) / 2;
  }
  // part of polygon with y >= L (below the line, since y points down)
  function clipBelow(poly, L) {
    const out = [];
    for (let i = 0, n = poly.length; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n];
      const pin = p[1] >= L, qin = q[1] >= L;
      if (pin) out.push(p);
      if (pin !== qin) { const t = (L - p[1]) / (q[1] - p[1]); out.push([p[0] + (q[0] - p[0]) * t, L]); }
    }
    return out;
  }
  function areaBelow(poly, L) { const c = clipBelow(poly, L); return c.length < 3 ? 0 : area(c); }
  function yRange(poly) { let a = Infinity, b = -Infinity; for (const p of poly) { if (p[1] < a) a = p[1]; if (p[1] > b) b = p[1]; } return [a, b]; }
  function xRange(poly) { let a = Infinity, b = -Infinity; for (const p of poly) { if (p[0] < a) a = p[0]; if (p[0] > b) b = p[0]; } return [a, b]; }
  function levelFor(rpoly, target, yr) {
    if (target <= 0) return yr[1];
    let lo = yr[0], hi = yr[1];
    for (let k = 0; k < 26; k++) { const m = (lo + hi) / 2; if (areaBelow(rpoly, m) > target) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }

  // prepare a shape: unit area + pour-angle table
  function prep(sh) {
    sh.capArea = areaBelow(sh.poly, sh.capY);
    sh.unit = sh.capArea / sh.cap;
    sh.lipR = sh.poly[sh.poly.length - 1];
    sh.lipL = sh.poly[0];
    // A(θ): units the vessel can hold when tilted right by θ (deg 0..178)
    const tab = [];
    for (let d = 0; d <= 178; d++) {
      const th = d * Math.PI / 180;
      const rp = rot(sh.poly, th);
      const lip = rotPt(sh.lipR, th);
      tab.push(areaBelow(rp, lip[1]) / sh.unit);
    }
    for (let d = 1; d < tab.length; d++) tab[d] = Math.min(tab[d], tab[d - 1]);
    sh.atab = tab;
    sh.cache = new Map();
    return sh;
  }
  // the smallest tilt (radians) at which `units` reaches the lip
  function angleFor(sh, units) {
    const t = sh.atab;
    if (units >= t[0]) return 0;
    for (let d = 1; d < t.length; d++) {
      if (t[d] <= units) { const a = t[d - 1], b = t[d]; const f = a === b ? 0 : (a - units) / (a - b); return (d - 1 + f) * Math.PI / 180; }
    }
    return 178 * Math.PI / 180;
  }
  function unitsAt(sh, th) { // units remaining at tilt th (radians, magnitude)
    const d = Math.abs(th) * 180 / Math.PI, t = sh.atab;
    if (d <= 0) return t[0];
    if (d >= 178) return 0;
    const i = Math.floor(d), f = d - i;
    return t[i] + (t[i + 1] - t[i]) * f;
  }
  // world-independent liquid levels for cumulative unit amounts at tilt th
  function levels(sh, th, cum) {
    const q = Math.round(th * 573); // ~0.1°
    let rp = null, yr = null;
    const out = new Array(cum.length);
    for (let k = 0; k < cum.length; k++) {
      const key = q + ':' + Math.round(cum[k] * 400);
      let v = sh.cache.get(key);
      if (v === undefined) {
        if (!rp) { rp = rot(sh.poly, th); yr = yRange(rp); }
        v = levelFor(rp, cum[k] * sh.unit, yr);
        if (sh.cache.size > 6000) sh.cache.clear();
        sh.cache.set(key, v);
      }
      out[k] = v;
    }

  // ---------- drawing vessels ----------
  function drawShadow(d) {

    fg.restore();

  function drawVessel(d) {
    const sh = d.sh, P = pivot(d), th = d.rot;
    const wp = worldPoly(d, P);
    const path = polyPath(wp);
    fg.save();
    if (d.alpha != null && d.alpha < 1) fg.globalAlpha = d.alpha;
    if (d.f) drawFrame(d, [d.home.x, d.home.y], false);

    if (d.lift > 0.05 && !flying.has(d.i)) {
      const gx = P[0], gy = P[1] + sh.mouthY * S * 0.5;
      const R0 = sh.h * 0.6 * S;

      gg.addColorStop(0, `rgba(255,214,150,${0.16 * d.lift})`); gg.addColorStop(1, 'rgba(255,214,150,0)');
      fg.fillStyle = gg; fg.fillRect(gx - R0, gy - R0, R0 * 2, R0 * 2);
    }
    if (d.glow > 0) {
      const gx = P[0], gy = P[1] + sh.mouthY * S * 0.45;
      const R1 = sh.h * 0.75 * S;
      const gg = fg.createRadialGradient(gx, gy, 4, gx, gy, R1);
      const c = d.layers.length ? col(d.layers[d.layers.length - 1].c).l : '#ffffff';
      gg.addColorStop(0, rgba(c, 0.35 * d.glow)); gg.addColorStop(1, rgba(c, 0));

    fg.translate(P[0], P[1]); fg.rotate(th); fg.scale(S, S);
    const bk = fg.createLinearGradient(-sh.bodyHW, 0, sh.bodyHW, 0);
    if (d.t === 'urn') { bk.addColorStop(0, 'rgba(40,44,52,0.75)'); bk.addColorStop(0.5, 'rgba(60,66,76,0.55)'); bk.addColorStop(1, 'rgba(30,32,38,0.8)'); }

  function drawJarGhost(d, P, path) {
    const sh = d.sh, pat = d.pat;

    const bottom = P[1];

    const xr = [P[0] - sh.bodyHW * S - 4, P[0] + sh.bodyHW * S + 4];

      fg.beginPath(); fg.moveTo(xr[0], yTop + 0.5); fg.lineTo(xr[1], yTop + 0.5); fg.stroke();

  const FONT_HAND = '"LXGW WenKai TC", "Iansui", "Kaiti TC", "STKaiti", serif';

  function surfaceFn(d, yTop, top) {
    const tilt = Math.tan(d.slosh) * (top ? 1 : 0.7);
    const amp = top ? (d.ripple * 2.2 * S) : 0;
    const cx = pivot(d)[0];
    const t = tnow * 0.012;
    return x => yTop + tilt * (x - cx) + (amp ? amp * Math.sin((x - cx) / (6 * S) + t * 1.7) * Math.cos((x - d.ripX) / (11 * S) - t) : 0);
  }

  function drawLiquid(d, P, path, wp) {

    const lv = Geo.levels(sh, d.rot, cum).map(y => P[1] + y * S - dp);

    const N = 18;
    fg.save(); fg.clip(path);
    let prevF = null;
    for (let k = 0; k < L.length; k++) {
      const l = L[k];
      if (l.u <= 0.0005) continue;
      const top = k === L.length - 1;
      const f = surfaceFn(d, lv[k], top);
      const p = new Path2D();
      p.moveTo(x0, f(x0));
      for (let s = 1; s <= N; s++) { const x = x0 + (x1 - x0) * s / N; p.lineTo(x, f(x)); }

        fogPat.setTransform(m1); fg.globalAlpha = l.fog * breathe; fg.fill(p);
        const m2 = new DOMMatrix(); m2.translateSelf(-(tnow * 0.006) % (128 * S), (tnow * 0.003) % (128 * S)); m2.scaleSelf(S * 1.1, S * 1.1); m2.rotateSelf(30);
        fogPat.setTransform(m2); fg.globalAlpha = l.fog * 0.75; fg.fill(p);

        fg.font = `600 ${Math.round(11 * S)}px ${FONT_UI}`; fg.textAlign = 'center'; fg.textBaseline = 'middle';
        const mid = (yTop + yBot) / 2;
        const per = (yBot - yTop) / Math.max(1, Math.round(l.u));
        for (let q = 0; q < Math.round(l.u); q++) fg.fillText(col(l.c).n, P[0] + Math.sin(d.rot) * 0, yBot - per * (q + 0.5));
        fg.restore();

    lp.moveTo(x0, topF(x0));

    fg.save(); fg.clip(lp);
    fg.translate(P[0], P[1]); fg.rotate(d.rot); fg.scale(S, S);
    const hw = sh.bodyHW;
    const cg = fg.createLinearGradient(-hw, 0, hw, 0);
    cg.addColorStop(0, 'rgba(0,0,0,0.30)'); cg.addColorStop(0.18, 'rgba(0,0,0,0.04)'); cg.addColorStop(0.32, 'rgba(255,255,255,0.20)');
    cg.addColorStop(0.42, 'rgba(255,255,255,0.0)'); cg.addColorStop(0.8, 'rgba(0,0,0,0.06)'); cg.addColorStop(1, 'rgba(0,0,0,0.36)');

  function drawDust(p, x0, x1, yTop, yBot) {
    fg.save(); fg.clip(p);
    const n = 9;
    for (let k = 0; k < n; k++) {
      const fx = (Math.sin(k * 12.9898 + dustT * 0.0004 * (k % 3 + 1)) * 0.5 + 0.5);

  }

  function drawSwirl(d, P, yTop, yb) {
    const m = d.mix, p = m.p;

    const cx = P[0], cy = (yTop + yb) / 2 - 4 * S;

    fg.fillStyle = mixHex(A.c, B.c, 0.5);
    fg.globalAlpha = 1 - eIn(p);
    fg.fillRect(cx - 60 * S, yTop - 10, 120 * S, yb - yTop + 20);
    fg.globalAlpha = eIn(p);
    fg.fillStyle = M.c;
    fg.fillRect(cx - 60 * S, yTop - 10, 120 * S, yb - yTop + 20);
    // spiral arms

  function drawGlassFront(d, P, path) {

    hg.addColorStop(0, 'rgba(255,255,255,0.0)'); hg.addColorStop(0.3, 'rgba(255,255,255,0.42)'); hg.addColorStop(1, 'rgba(255,255,255,0.06)');

      fg.fillStyle = sg; fg.fillRect(-hw - 10, -sh.h - 10, hw * 2 + 20, sh.h + 20);
      fg.restore();

    fg.restore();
  }

  function drawCork(d) {
    const sh = d.sh, p = d.cork;

    cg.addColorStop(0, '#7c5634'); cg.addColorStop(0.35, '#c79a63'); cg.addColorStop(0.7, '#a37748'); cg.addColorStop(1, '#6a4527');

    fg.fillStyle = 'rgba(255,235,200,0.35)'; roundRect(fg, -w / 2 + 1, y + 1, w - 2, 2.5, 1.2); fg.fill();

    fg.restore();

  function drawSeal(d) {

    fg.fillStyle = '#a7322a';
    fg.beginPath();
    for (let k = 0; k <= 16; k++) { const a = k / 16 * Math.PI * 2, r = 11 + (k % 2 ? 1.6 : 0); fg.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    fg.closePath(); fg.fill();
    fg.fillStyle = '#c94a3d'; fg.beginPath(); fg.arc(0, 0, 8, 0, Math.PI * 2); fg.fill();
    fg.fillStyle = '#f3d7c4'; fg.font = `700 10px ${FONT_HAND}`; fg.textAlign = 'center'; fg.textBaseline = 'middle';

    fg.beginPath(); fg.moveTo(-6, 0); fg.lineTo(6, 0); fg.lineTo(6, 15); fg.lineTo(-6, 15); fg.closePath(); fg.fill();

    fg.restore();
  }

  // ---------- stream ----------
  const streams = [];
  function drawStream(f) {
    const { x0, y0, x1, y1, w, c, dir } = f;
    if (f.head <= f.tail) return;
    const C = col(c);
    const pts = [];
    const n = 16;
    const c1x = x0 + dir * 7 * S, c1y = y0 + 2 * S, c2x = x1, c2y = y0 + (y1 - y0) * 0.3;
    for (let k = 0; k <= n; k++) {
      const t = f.tail + (f.head - f.tail) * k / n;
      const u = 1 - t;
      const x = u * u * u * x0 + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * x1;
      const y = u * u * u * y0 + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * y1;
      const wob = 1 + Math.sin(t * 22 - tnow * 0.035) * 0.12;
      pts.push([x, y, w * (1 - t * 0.35) * wob]);
    }
    const L = [], R = [];
    for (let k = 0; k < pts.length; k++) {
      const a = pts[Math.max(0, k - 1)], b = pts[Math.min(pts.length - 1, k + 1)];
      let nx = -(b[1] - a[1]), ny = b[0] - a[0];
      const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
      L.push([pts[k][0] + nx * pts[k][2] / 2, pts[k][1] + ny * pts[k][2] / 2]);
      R.push([pts[k][0] - nx * pts[k][2] / 2, pts[k][1] - ny * pts[k][2] / 2]);
    }
    fg.save();
    fg.fillStyle = C.c;
    fg.beginPath(); fg.moveTo(L[0][0], L[0][1]);
    for (const p of L) fg.lineTo(p[0], p[1]);
    for (let k = R.length - 1; k >= 0; k--) fg.lineTo(R[k][0], R[k][1]);
    fg.closePath(); fg.fill();
    fg.strokeStyle = rgba(C.l, 0.7); fg.lineWidth = Math.max(1, w * 0.22); fg.lineCap = 'round';
    fg.beginPath(); fg.moveTo(pts[0][0] - 0.2 * w, pts[0][1]); for (const p of pts) fg.lineTo(p[0] - 0.18 * p[2], p[1]); fg.stroke();
    fg.restore();
  }

  // ---------- particles ----------
  function spawn(p) { if (parts.length < 400) parts.push(p); }
  function splash(x, y, c, n, power, floor) {
    const C = col(c);
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
      const v = (40 + Math.random() * 120) * (power || 1) * S;
      spawn({ k: 'drop', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.35 + Math.random() * 0.3, r: (0.8 + Math.random() * 1.6) * S, c: Math.random() < 0.3 ? C.l : C.c, floor: floor || 1e9 });
    }
  }
  function sparkle(x, y, c, n, spread) {

      const a = Math.random() * Math.PI * 2, v = (30 + Math.random() * 110) * S * (spread || 1);
      spawn({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40 * S, life: 0, max: 0.6 + Math.random() * 0.6, r: (1.2 + Math.random() * 2) * S, c: Math.random() < 0.5 ? C.l : '#fff6dc' });
    }
  }
  function ring(x, y, c, r0, r1, dur) { spawn({ k: 'ring', x, y, life: 0, max: dur || 0.6, r0: r0 * S, r1: r1 * S, c: col(c).l }); }
  function puff(x, y, n) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = (10 + Math.random() * 30) * S;
      spawn({ k: 'puff', x: x + (Math.random() - 0.5) * 20 * S, y: y + (Math.random() - 0.5) * 8 * S, vx: Math.cos(a) * v, vy: -Math.abs(Math.sin(a)) * v - 12 * S, life: 0, max: 0.9 + Math.random() * 0.6, r: (6 + Math.random() * 10) * S });
    }
  }
  function stepParts(dt) {
    for (const p of parts) {
      p.life += dt;
      if (p.k === 'drop') { p.vy += 900 * S * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > p.floor) p.life = p.max; }
      else if (p.k === 'spark') { p.vx *= 0.94; p.vy = p.vy * 0.94 + 30 * S * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
      else if (p.k === 'puff') { p.x += p.vx * dt; p.y += p.vy * dt; p.r += 14 * S * dt; }
      else if (p.k === 'rain') { p.y += p.vy * dt; if (p.y >= p.floor) { p.life = p.max; if (Math.random() < 0.3) splash(p.x, p.floor, p.sc || 'A', 1, 0.4, p.floor + 2 * S); } }
      else if (p.k === 'flake') { p.y += p.vy * dt; p.x += Math.sin(p.life * 5 + p.ph) * 18 * S * dt; if (p.y >= p.floor) p.life = p.max; }
      else if (p.k === 'ink') { p.vy *= Math.pow(0.4, dt); p.y += p.vy * dt; p.x += Math.sin(p.life * 4 + p.ph) * 6 * S * dt; if (p.y >= p.floor) p.life = p.max; }
    }

  }
  function drawParts() {
    for (const p of parts) {
      const t = p.life / p.max;
      if (p.k === 'drop') { fg.fillStyle = p.c; fg.globalAlpha = 1 - t * 0.6; fg.beginPath(); fg.arc(p.x, p.y, p.r, 0, Math.PI * 2); fg.fill(); }
      else if (p.k === 'spark') {

        const r = p.r * (1 - t * 0.5);
        fg.beginPath(); fg.moveTo(p.x, p.y - r * 2); fg.lineTo(p.x + r * 0.5, p.y - r * 0.5); fg.lineTo(p.x + r * 2, p.y); fg.lineTo(p.x + r * 0.5, p.y + r * 0.5); fg.lineTo(p.x, p.y + r * 2); fg.lineTo(p.x - r * 0.5, p.y + r * 0.5); fg.lineTo(p.x - r * 2, p.y); fg.lineTo(p.x - r * 0.5, p.y - r * 0.5); fg.closePath(); fg.fill();
      } else if (p.k === 'ring') {

  const isWorld = () => !!(level && (level.boss || level.wave));

  const WORLD = new Set(['unseal', 'flip', 'wave', 'waveMiss', 'bossPour', 'bossSeal', 'bossBlocked']);

  // ---------- play ----------
  function lookFor() {

  }

  const LEARN = { flask: ['flask1', () => HINTS.flask1], fog: ['fog', () => HINTS.fog], jar: ['jar', () => HINTS.jar], grey: ['grey', () => HINTS.grey], gate: ['h_gate', () => HINTS2.gate], adv: ['h_adv', () => HINTS2.adv], wave: ['h_wave', () => HINTS2.wave], order: ['h_order', () => HINTS2.order], helper: ['h_helper', () => HINTS2.helper], ink: ['h_ink', () => HINTS3.ink], flip: ['h_flip', () => HINTS3.flip], flipInk: ['h_flipink', () => HINTS3.flipInk], size: ['h_size', () => HINTS3.size] };

  // ---------- back in town ----------
  async function backToCity(bloomId) {
    Board.clear(); hideNote(); hideHand();
    show('city');
    if (pendingGift) { const g = pendingGift; pendingGift = null; await giftBloom(g); return; }
    if (!bloomId) { if (mode === 'story' && cur && chOf(cur)) view = chOf(cur); renderCity(); return; }
    if (bloomId === 'D12') { await ending(); return; }
    if (bloomId === 'O12') { await ending2(); return; }
    const s = STORY[bloomId], ch = chOf(bloomId);
    view = ch;
    const before = cityState(ch);
    if (ch === 1) { if (s.drain) before.drained = false; else delete before.restored[s.group]; }
    if (ch === 2) { if (s.crate != null && before.crates) before.crates[s.crate] = true; if (s.refill) before.drained = true; if (bloomId === 'M12') before.ship = true; }
    if (s.node != null && ch >= 3) { delete before.restored['n' + s.node]; before.node = Math.max(0, before.node - 1); }
    if (s.sec != null && ch >= 4) delete before.restored['g' + s.sec];
    City.render(before);
    Snd.setTheme('c' + ch, false); Snd.setLayer(layerFor(ch));
    renderHud();
    $('#next').style.opacity = 0;
    const bt = $('#bloomTxt');
    await sleep(700);
    const say = t => { bt.textContent = t; bt.classList.add('on'); };
    if (ch === 1) {
      if (s.drain) {
        say(s.after); Snd.drain(); await City.drain(3400);
        await sleep(900); bt.classList.remove('on'); await sleep(700);
        say(s.keep); await sleep(3600);
      } else {
        Snd.bloom(); say(bloomId === 'L12' ? '燈塔亮了。' : s.after);
        await City.bloom(s.group, bloomId === 'L12' ? 3600 : 2600);
        await sleep(1600);
      }
    } else if (ch === 2) {
      if (s.refill) { Snd.bloom(); say(s.after); await City.refill(4600); await sleep(1000); }
      else if (s.crate != null) { Snd.unlock(); say(s.after); if (s.snow) City.snow(8000); await City.openCrate(s.crate, COLORS[s.c].c); await sleep(1700); }
      else if (bloomId === 'M12') { say('收色人的船起了錨，往北邊去了。'); Snd.drain(); await City.shipLeave(6500); await sleep(600); }
      else { Snd.bloom(); say(s.after); await sleep(3600); }
    } else if (s.node != null) {
      Snd.bloom(); say({ S12: '雲散了。', U12: '河清了。', P12: '雪停了。' }[bloomId] || s.after);
      await City.bloom('n' + s.node, 2600); await sleep(1500);
    } else {
      Snd.bloom(); say(bloomId === 'H12' ? '沙暴過去了。' : s.after);
      await City.bloom('g' + s.sec, bloomId === 'H12' ? 3600 : 2600); await sleep(1500);
    }
    bt.classList.remove('on');
    renderCity();
    $('#next').style.transition = 'opacity .6s'; $('#next').style.opacity = 1;
    if (bloomId === 'L1') setTimeout(() => toast2('配方簿多了一頁：師傅的規矩。'), 600);
  }

    Snd.startMusic();
    $('#title').classList.remove('on');
    show('city');
    if (!Save.d.opened) {
      $('#next').style.opacity = 0;
      const bt = $('#bloomTxt');
      for (const line of OPENING) { bt.textContent = line; bt.classList.add('on'); await sleep(2300); bt.classList.remove('on'); await sleep(650); }
      Save.d.opened = true; Save.write();
      $('#next').style.opacity = 1;
      openLevel('L1');
    }
  }

  function wire() {
    $('#bStart').onclick = begin;
    $('#bBack').onclick = () => { tapSound(); Board.end(); master = false; backToCity(null); };
    $('#bUndo').onclick = () => { tapSound(); if (master) { toast('師傅級不能退一步'); return; } if (Board.undo()) hideNote(); };
    $('#bRestart').onclick = () => { tapSound(); restartPlay(); };
    $('#bSet2').onclick = () => { tapSound(); openSettings(); };
    $('#bBook').onclick = () => { tapSound(); openBook(); };
    $('#bList').onclick = () => { tapSound(); openList(); };
    $('#bSet').onclick = () => { tapSound(); openSettings(); };
    $('#bRegs').onclick = () => { tapSound(); openRegs(); };
    $('#bChap').onclick = () => { tapSound(); openChapters(); };
    $('#shX').onclick = closeSheet; $('#scrim').onclick = closeSheet;
    $('#order').onclick = () => { if (mode !== 'daily' && cur) { const s = mode === 'story' ? STORY[cur] : specialStory(cur); note(s.slip.join(''), null); } };
    $('#note').onclick = hideNote;
    const bd = $('#board');
    bd.addEventListener('pointerdown', e => {
      Snd.resume();
      if (handStep === 1) { hideHand(); handStep = 2; }
      Board.tap(e.clientX, e.clientY);
      if (handStep === 2) hideHand();
    });
    window.addEventListener('resize', () => { if ($('#play').classList.contains('on')) measure(); else Board.resize(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Snd.resume(); });
  }

  function start(hot) {
    paperTexture();
    Save.load();
    if (hot && hot.save) Save.merge(hot.save);
    migrate();
    view = latest();
    City.mount($('#map'));
    Board.init($('#bgc'), $('#fgc'), boardCb, $('#stc'));
    Board.resize();
    wire();
    renderCity();
    show('city');
    $('#title').classList.add('on');
    setTimeout(() => $('.sign h1').classList.add('lit'), 400);
    Cloud.init(remote => { Save.merge(remote); migrate(); view = latest(); renderCity(); });
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({ save: Save.d })); } catch (e) { /* ignore */ } }
    window.__game = { Board, Save, openLevel, openDaily, openChapter, openRegs, openBook, openList, openChapters, switchView, backToCity, showResult: r => showResult(r), totalStars, starsOf, get cur() { return cur; }, get lv() { return curLv; }, get view() { return view; }, get master() { return master; }, Daily, City };
  }
  return { start };
})();

(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(App.start) : App.start((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
