/* 字型：俐方體11號（Cubic 11）改名子集，SIL Open Font License 1.1 */
:root {
  color-scheme: dark;
  --ink: #0a0d14; --panel: #131925; --panel2: #1b2331; --line: #2c3649; --line2: #45526b;
  --paper: #ece6da; --dim: #9aa4b5; --amber: #ffb347; --amber-d: #7a4410; --blood: #d8423c; --teal: #6fd0e8; --green: #8fdc6a;
  --px: 'LOPixel', ui-monospace, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  --lat: 'Silkscreen', 'LOPixel', ui-monospace, monospace;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--px); font-size: 16px; line-height: 1.5; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: none; -moz-osx-font-smoothing: unset; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
.px, canvas, .slot img, .pix { image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; }
.pbox { background: var(--panel); box-shadow: 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line), -3px 0 0 0 var(--line), 3px 0 0 0 var(--line); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 10px 18px; margin: 3px; background: var(--panel2); font-size: 20px; line-height: 1.2; box-shadow: 0 -3px 0 0 var(--line2), 0 3px 0 0 var(--line2), -3px 0 0 0 var(--line2), 3px 0 0 0 var(--line2), inset 0 -4px 0 0 rgba(0,0,0,.35); transition: transform .06s, background .12s; text-align: left; }
.btn:hover { background: #232d3f; }
.btn:active { transform: translateY(2px); box-shadow: 0 -3px 0 0 var(--line2), 0 3px 0 0 var(--line2), -3px 0 0 0 var(--line2), 3px 0 0 0 var(--line2), inset 0 -1px 0 0 rgba(0,0,0,.35); }
.btn:focus-visible, .slot:focus-visible, .act:focus-visible, .card:focus-visible { outline: 2px solid var(--amber); outline-offset: 5px; }
.btn.primary { background: var(--amber); color: #1d1206; box-shadow: 0 -3px 0 0 var(--amber-d), 0 3px 0 0 var(--amber-d), -3px 0 0 0 var(--amber-d), 3px 0 0 0 var(--amber-d), inset 0 -4px 0 0 rgba(0,0,0,.2); }
.btn.primary:hover { background: #ffc266; }
.btn[disabled], .btn.locked { opacity: .45; }
.btn small { font-size: 12px; color: var(--dim); margin-left: auto; }
.btn.primary small { color: #5a3408; }
[hidden] { display: none !important; }

/* ---------- 背景插圖畫布 ---------- */
#scv { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
.screen { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; padding: calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px); box-sizing: border-box; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- 標題 ---------- */
.title { justify-content: space-between; background: linear-gradient(180deg, rgba(5,7,12,.55) 0%, rgba(5,7,12,0) 30%, rgba(5,7,12,0) 52%, rgba(5,7,12,.82) 78%); }
.logo-wrap { display: flex; flex-direction: column; gap: 4px; }
.order-tag { font-size: 12px; color: var(--dim); letter-spacing: .08em; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.order-tag b { color: var(--amber); font-weight: normal; }
.logo { margin: 0; font-size: 48px; line-height: 1.1; letter-spacing: .08em; font-weight: normal; color: #fff4e2; text-shadow: 0 4px 0 #4a1e06, 0 0 28px rgba(255,150,50,.45); text-wrap: balance; }
.logo-en { font-family: var(--lat); font-size: 16px; color: var(--amber); letter-spacing: .32em; }
.menu { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 380px; }
.menu .btn { justify-content: flex-start; }
.foot { margin-top: 10px; font-size: 12px; color: var(--dim); line-height: 1.6; max-width: 380px; }
@media (min-aspect-ratio: 5/4) {
  .title { justify-content: flex-start; background: linear-gradient(90deg, rgba(5,7,12,.86) 0%, rgba(5,7,12,.55) 32%, rgba(5,7,12,0) 55%); }
  .title .menu { margin-top: 28px; }
  .logo { font-size: 64px; }
}

/* ---------- 章節、成就 ---------- */
.sub-screen { background: rgba(7,9,14,.86); gap: 14px; }
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar-top h2 { margin: 0; font-size: 28px; font-weight: normal; letter-spacing: .06em; }
.bar-top .count { font-family: var(--lat); color: var(--amber); font-size: 16px; }
.ch-list { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); max-width: 980px; }

const Save = {
  d: null,

  ping() { const c = this.ctx; if (!c) return; try { if (c.state === 'suspended') c.resume(); const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch (e) { } },

/* ===== 輸入：鍵盤 + 觸控搖桿 ===== */
const Input = {
  keys: Object.create(null), jx: 0, jy: 0, joyId: null, ox: 0, oy: 0, R: 46,
  init() {
    addEventListener('keydown', e => {
      const block = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
      if (App.screen === 'play' && block.includes(e.code)) e.preventDefault();
      if (e.repeat) return;
      this.keys[e.code] = true;
      App.onKey(e);
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = Object.create(null); this.endJoy(); });
    const z = $('touch');
    z.addEventListener('pointerdown', e => {
      if (App.screen !== 'play' || !G || G.state !== 'play') return;
      if (this.joyId !== null) return;
      this.joyId = e.pointerId; this.ox = e.clientX; this.oy = e.clientY; this.jx = this.jy = 0;
      try { z.setPointerCapture(e.pointerId); } catch (_) { }
      $('joy').hidden = false; this.drawJoy(0, 0); e.preventDefault();
      Game.onMoveInput();

      if (e.pointerId !== this.joyId) return;

      if (m < 5) { this.jx = this.jy = 0; } else { this.jx = dx / this.R; this.jy = dy / this.R; }
      this.drawJoy(dx, dy); e.preventDefault();
    });

    z.addEventListener('pointerup', end); z.addEventListener('pointercancel', end); z.addEventListener('lostpointercapture', end);
  },
  endJoy() { this.joyId = null; this.jx = this.jy = 0; const j = $('joy'); if (j) j.hidden = true; },
  drawJoy(dx, dy) { $('joy').style.transform = `translate(${this.ox}px,${this.oy}px)`; $('joyKnob').style.transform = `translate(${dx}px,${dy}px)`; },
  vec() {
    let x = 0, y = 0; const k = this.keys;
    if (k.KeyA || k.ArrowLeft) x -= 1; if (k.KeyD || k.ArrowRight) x += 1;
    if (k.KeyW || k.ArrowUp) y -= 1; if (k.KeyS || k.ArrowDown) y += 1;

function rollUpgrades(n) {
  const p = G.p, pool = UPG.filter(u => (p.lv[u.id] || 0) < u.max && (!u.need || u.need(p))), out = [];
  const tmp = pool.slice();
  while (out.length < n && tmp.length) {
    let tot = 0; for (const u of tmp) tot += (u.w || 1);
    let r = Math.random() * tot, i = 0; for (; i < tmp.length - 1; i++) { r -= (tmp[i].w || 1); if (r <= 0) break; }
    out.push(tmp[i]); tmp.splice(i, 1);
  }
  if (!out.length) out.push(UPG.find(u => u.id === 'heal'));
  return out;
}

/* ---------- 劇情播放器 ---------- */
const Story = {
  lines: null, i: 0, done: null, typing: false, full: '', shown: 0, mode: '',
  play(lines, done) { this.lines = lines; this.i = -1; this.done = done; App.go('story'); this.next(); },
  hideAll() { $('stPhone').hidden = true; $('stCard').hidden = true; $('stChoice').hidden = true; $('stEnd').hidden = true; $('stBox').hidden = true; },
  next() {
    while (true) {
      this.i++;
      if (this.i >= this.lines.length) return this.finish();
      const L = this.lines[this.i];
      if (L && typeof L === 'object' && !Array.isArray(L)) { if (L.s) { Scene.set(L.s); continue; } if (L.sfx) { Sound.play(L.sfx); continue; } }
      break;
    }
    this.hideAll();
    const L = this.lines[this.i];
    if (typeof L === 'string') this.say(null, L);
    else if (Array.isArray(L)) this.say(L[0], L[1]);
    else if (L.phone) this.phone(L.phone);
    else if (L.card) this.card(L.card);
    else if (L.choice) this.choice(L.choice);
    else if (L.end) this.endCard(L.end);
  },
  say(who, text) {
    this.mode = 'say'; const box = $('stBox'); box.hidden = false;
    const sp = who ? SPEAKERS[who] : null;
    box.classList.toggle('narr', !sp);
    $('stName').textContent = sp ? sp.name : ''; $('stName').style.color = sp ? sp.col : '';
    $('stName').hidden = !sp; $('stFace').hidden = !sp; if (sp) $('stFace').src = portraitURL(sp.face);
    this.full = text; this.shown = 0; this.typing = true; $('stText').textContent = ''; $('stNext').hidden = true;
  },
  phone(ph) {
    this.mode = 'phone'; this.typing = false;
    const el = $('stPhone');
    el.innerHTML = `<div class="ph-top"><span>外送</span><span>${ph.time}</span></div><b class="ph-title${ph.late ? ' late' : ''}">${ph.title}</b>` + (ph.stars ? `<div class="ph-stars">${'★'.repeat(ph.stars)}</div>` : '') + ph.rows.map(r => `<p>${r}</p>`).join('') + `<p class="ph-note">${ph.note}</p><p class="ph-who">${ph.who}</p><span class="tap">點一下繼續</span>`;
    el.hidden = false; el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
  },
  card(c) {
    this.mode = 'card'; this.typing = false;
    const el = $('stCard');
    el.innerHTML = `<div class="cc-order">訂單 #0923-2341　外送中</div><div class="cc-no">${c.no}</div><div class="cc-title">${c.title}</div><div class="cc-meta"><span>${c.place}</span><span>${c.time}</span></div><div class="cc-late">${c.late}</div><span class="tap">點一下開始</span>`;
    el.hidden = false; el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
  },
  choice(list) {
    this.mode = 'choice'; this.typing = false;
    const el = $('stChoice'); el.innerHTML = '';
    for (const c of list) { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn choice'; b.innerHTML = `<b>${c.t}</b><small>${c.d}</small>`; b.addEventListener('click', e => { e.stopPropagation(); Sound.play('click'); this.finish(c.k); }); el.appendChild(b); }
    el.hidden = false;
  },
  endCard(t) { this.mode = 'end'; this.typing = false; const el = $('stEnd'); el.textContent = t; el.hidden = false; el.classList.remove('in'); void el.offsetWidth; el.classList.add('in'); },
  advance() {
    if (!this.lines || this.mode === 'choice') return;
    if (this.typing) { this.typing = false; this.shown = this.full.length; $('stText').textContent = this.full; $('stNext').hidden = false; return; }
    Sound.play('click'); this.next();
  },
  skip() {
    if (!this.lines) return;
    for (let j = this.i + 1; j < this.lines.length; j++) { const L = this.lines[j]; if (L && L.choice) { for (let k = this.i + 1; k < j; k++) if (this.lines[k] && this.lines[k].s) Scene.set(this.lines[k].s); this.i = j - 1; this.next(); return; } }
    this.finish();
  },
  finish(v) { const d = this.done; this.done = null; this.lines = null; this.hideAll(); if (d) d(v); },
  frame(dt) {
    Scene.frame(dt);
    if (this.typing) {
      const before = this.shown | 0; this.shown += dt * 30; const n = Math.min(this.full.length, this.shown | 0);
      if (n !== before) { $('stText').textContent = this.full.slice(0, n); if (n % 2 === 0) Sound.play('type'); }
      if (n >= this.full.length) { this.typing = false; $('stNext').hidden = false; }
    }
  }
};

/* ===== 介面：畫面切換、選單、升級、暫停、結算、啟動 ===== */
let PSPR = null;
const SCREENS = { title: 'scrTitle', chapters: 'scrChapters', ach: 'scrAch', story: 'scrStory', end: 'scrEnd' };
const App = {
  screen: '',
  go(s) {
    this.screen = s;
    for (const k in SCREENS) $(SCREENS[k]).hidden = k !== s;
    const playing = s === 'play';
    $('stage').hidden = !playing; $('scv').hidden = playing;
    HUD.show(playing);
    for (const id of ['mLv', 'mPause', 'mDead', 'mClear']) $(id).hidden = true;
    if (!playing) Input.endJoy();
  },
  onKey(e) {
    if (this.screen === 'play' && G) {
      if (G.state === 'play') {
        if (e.code === 'Space') doDodge();
        else if (e.code === 'KeyF' || e.code === 'KeyE') throwMolotov();
        else if (e.code === 'KeyQ') cycleGun();
        else if (/^Digit[1-3]$/.test(e.code)) switchGun(+e.code.slice(5) - 1);
        else if (e.code === 'Escape' || e.code === 'KeyP') UI.pause();
        else Game.onMoveInput();
      } else if (G.state === 'paused' && (e.code === 'Escape' || e.code === 'KeyP')) UI.resume();
      else if (G.state === 'levelup' && /^Digit[1-3]$/.test(e.code)) UI.pickCard(+e.code.slice(5) - 1);
    } else if (this.screen === 'story') {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); Story.advance(); }
      else if (e.code === 'Escape') Story.skip();
    }
  }
};

function startChapter(n) { Story.play(CHAPTERS[n].intro, () => beginPlay(n, { fromStory: true })); }
function playFinal() {
  Story.play(FINAL, (k) => {
    if (k === 'go') { Save.d.endGo = true; Save.d.ending = 'go'; Save.save(); checkAch(); Story.play(END_GO, () => UI.credits('go')); }
    else { Save.d.endStay = true; Save.d.ending = 'stay'; Save.save(); checkAch(); Story.play(END_STAY, () => beginPlay('E', { fromStory: true })); }
  });
}

const Title = {
  show() { App.go('title'); Scene.set('title'); this.render(); },
  render() {
    const d = Save.d, allDone = !!d.cleared[5];
    const next = Math.min(5, d.unlocked);
    $('bStart').textContent = allDone ? '重溫故事' : d.unlocked > 1 ? '繼續故事・' + CHAPTERS[next].no : '開始故事';
    $('bChN').textContent = Object.keys(d.cleared).filter(k => k !== 'E').length + ' / 5';
    $('bEnN').textContent = d.endlessOpen ? (d.endless ? '最佳 ' + fmtTime(d.endless) : '無盡模式') : '通關第一章解鎖';
    $('bEndless').classList.toggle('locked', !d.endlessOpen);
    $('bAchN').textContent = Object.keys(d.ach).length + ' / ' + ACH.length;
    $('bSoundN').textContent = d.sound ? '開' : '關';
  },
  frame(dt) { Scene.frame(dt); }
};
function renderChapters() {
  const box = $('chList'); box.innerHTML = '';
  const d = Save.d;
  for (let n = 1; n <= 5; n++) {
    const c = CHAPTERS[n], open = n <= d.unlocked, done = !!d.cleared[n];
    const card = S1_IN && [S1_IN, S2_IN, S3_IN, S4_IN, S5_IN][n - 1].find(l => l && l.card).card;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'card' + (open ? '' : ' lock');
    b.innerHTML = `<span class="c-no">${c.no}</span><span class="c-time">${card.time}</span><span class="c-title">${open ? c.title : '？？？'}</span><span class="c-place">${open ? c.place : '通關上一章解鎖'}</span><span class="c-st">${done ? '已通關・最佳 ' + fmtTime(d.best[n] || 0) : open ? '未通關' : '未解鎖'}</span>`;
    b.addEventListener('click', () => { if (!open) { Toast.show('先通關' + CHAPTERS[n - 1].no); return; } Sound.play('click'); startChapter(n); });
    box.appendChild(b);
  }
  const e = document.createElement('button'); e.type = 'button'; e.className = 'card dark' + (d.endlessOpen ? '' : ' lock');
  e.innerHTML = `<span class="c-no">終章・無盡</span><span class="c-time">06:04</span><span class="c-title">最後的碼頭</span><span class="c-place">和子晴一起守住碼頭</span><span class="c-st">${d.endless ? '最佳 ' + fmtTime(d.endless) : d.endlessOpen ? '可挑戰' : '通關第一章解鎖'}</span>`;
  e.addEventListener('click', () => { if (!d.endlessOpen) { Toast.show('先通關第一章'); return; } Sound.play('click'); beginPlay('E'); });
  box.appendChild(e);
}
function renderAch() {
  const box = $('achList'); box.innerHTML = '';
  const icons = { first: 'drop', k100: 'skull', k1000: 'skull', k5000: 'skull', c50: 'bolt', c100: 'bolt', c200: 'bolt', bat: 'bat', fire: 'fire', lv20: 'box', ch1: 'pistol', ch2: 'shotgun', ch3: 'bowl', ch4: 'rifle', ch5: 'box', clean: 'helmet', e5: 'molotov', e10: 'molotov', go: 'eye', stay: 'heart' };
  let n = 0;
  for (const a of ACH) {
    const on = !!Save.d.ach[a.id]; if (on) n++;
    const el = document.createElement('div'); el.className = 'ach pbox' + (on ? ' on' : '');
    el.innerHTML = `<img class="pix" alt="" src="${iconURL(icons[a.id] || 'box')}"><b>${a.n}</b><small>${a.d}</small>`;
    box.appendChild(el);
  }
  $('achCount').textContent = n + ' / ' + ACH.length;
}

const UI = {
  opts: null,
  openLevelUp() {
    const g = G; if (!g || g.state !== 'play' || g.pendingLv <= 0) return;
    g.state = 'levelup'; Input.endJoy();
    const opts = this.opts = rollUpgrades(3), p = g.p;
    const intro = g.pickIntro > 0;
    $('lvTitle').textContent = intro ? '起始強化 ' + (g.pickIntro - g.pendingLv + 1) + ' / ' + g.pickIntro : '升級！LV ' + (p.level - g.pendingLv + 1);
    $('lvSub').textContent = intro ? '帶著前面幾章的經驗上場。' : '挑一個。';
    const box = $('lvCards'); box.innerHTML = '';
    opts.forEach((u, i) => {
      const cur = p.lv[u.id] || 0, mx = Math.min(u.max, 5);
      let pips = ''; if (u.max < 90) for (let k = 0; k < mx; k++) pips += `<i class="${k < cur ? 'on' : k === cur ? 'new' : ''}"></i>`;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'upg';
      b.innerHTML = `<img class="pix" alt="" src="${iconURL(u.icon)}"><div class="nm"><span>${u.name}</span><span class="tag t-${u.tag}">${u.tag}</span></div><div class="pips">${pips}</div><p>${u.d}</p>`;
      b.addEventListener('click', () => this.pickCard(i));
      box.appendChild(b);
    });
    $('lvReroll').textContent = '重抽（剩 ' + g.rerolls + ' 次）'; $('lvReroll').disabled = g.rerolls <= 0;
    $('mLv').hidden = false; Sound.play('level');
  },
  pickCard(i) {
    const g = G, u = this.opts && this.opts[i]; if (!u || !g || g.state !== 'levelup') return;
    const p = g.p; u.a(p); p.lv[u.id] = (p.lv[u.id] || 0) + 1;
    g.pendingLv--; if (g.pendingLv <= 0) g.pickIntro = 0;
    $('mLv').hidden = true; g.state = 'play'; Sound.play('click'); HUD.syncSlots(true);
    if (g.pendingLv > 0) g.lvDelay = 0.12;
  },
  reroll() { const g = G; if (!g || g.state !== 'levelup' || g.rerolls <= 0) return; g.rerolls--; g.state = 'play'; this.openLevelUp(); },
  pause() {
    const g = G; if (!g || g.state !== 'play') return;
    g.state = 'paused'; Input.endJoy();
    const p = g.p;
    $('pInfo').textContent = (g.ch.no + '　' + g.ch.title) + '｜' + fmtTime(g.t) + '｜擊倒 ' + g.kills;
    const box = $('pBuild'); box.innerHTML = '';
    for (const u of UPG) { const l = p.lv[u.id]; if (!l) continue; const c = document.createElement('span'); c.className = 'chip'; c.innerHTML = `<img class="pix" alt="" src="${iconURL(u.icon)}">${u.name} ${u.max < 90 ? 'Lv' + l : '×' + l}`; box.appendChild(c); }
    if (!box.childElementCount) box.innerHTML = '<span class="chip">還沒有強化</span>';
    $('pSound').textContent = '音效：' + (Save.d.sound ? '開' : '關');
    $('pKeys').textContent = IS_TOUCH ? '按住畫面任一處拖曳移動；槍和鋁棒會自己找目標。' : 'WASD／方向鍵 移動｜空白鍵 翻滾｜F 汽油彈｜Q、1–3 換槍｜Esc 暫停';
    $('mPause').hidden = false;
  },
  resume() { const g = G; if (!g || g.state !== 'paused') return; $('mPause').hidden = true; g.state = 'play'; },
  restart() { const id = G.chId, fs = G.fromStory; commitStats(); beginPlay(id, { fromStory: fs }); },
  quit() { if (G) commitStats(); G = null; Sound.stopAmb(); Scene.amb = null; Title.show(); },
  statsHTML(rows) { return rows.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join(''); },
  showDead() {
    const g = G;
    if (g.endless) {
      const best = Save.d.endless;
      $('dTitle').textContent = '守住碼頭 ' + fmtTime(g.t);
      $('dLine').textContent = g.t >= best - 0.5 ? '新紀錄。' : '最佳紀錄 ' + fmtTime(best) + '。';
      $('dRetry').textContent = '再守一次';
      $('dMenu').textContent = g.fromStory ? '看結局' : '回主選單';
    } else {
      $('dTitle').textContent = '你倒下了';
      $('dLine').textContent = g.deadLine || g.ch.deadLine || '';
      $('dRetry').textContent = '再來一次'; $('dMenu').textContent = '回主選單';
    }
    $('dStats').innerHTML = this.statsHTML([['撐了', fmtTime(g.t)], ['擊倒', g.kills], ['最高連殺', g.maxCombo], ['等級', 'LV ' + g.p.level]]);
    $('mDead').hidden = false;
  },
  deadMenu() {
    const g = G;
    if (g && g.endless && g.fromStory) { const t = g.t; G = null; Story.play(endStayEpilogue(t), () => UI.credits('stay')); return; }
    this.quit();
  },
  showClear() {
    const g = G, ch = g.ch;
    $('cTitle').textContent = ch.no + '　' + ch.title;
    $('cSub').textContent = g.chId === 5 ? '船長倒下了。汽笛響了。' : '完成。訂單還在跑。';
    $('cStats').innerHTML = this.statsHTML([['用時', fmtTime(g.t)], ['擊倒', g.kills], ['最高連殺', g.maxCombo], ['等級', 'LV ' + g.p.level], ['受到傷害', Math.round(g.dmgTaken)]]);
    const box = $('cAch'); box.innerHTML = '';
    for (const id of g.newAch) { const a = ACH.find(x => x.id === id); if (!a) continue; const c = document.createElement('span'); c.className = 'chip gold'; c.textContent = '成就｜' + a.n; box.appendChild(c); }
    $('cNext').textContent = g.fromStory ? '繼續劇情' : '看這章的結尾';
    $('mClear').hidden = false; Sound.play('level');
  },
  continueAfterClear() {
    const id = G.chId, ch = CHAPTERS[id];
    G = null; Sound.stopAmb(); Scene.amb = null;
    if (id === 5) { playFinal(); return; }
    Story.play(ch.outro, () => startChapter(id + 1));
  },
  credits(kind) {
    App.go('end'); Scene.set(kind === 'go' ? 'boat' : 'pier');
    $('endLine').textContent = kind === 'go' ? '他沒有回頭。' : '他們一起守住了碼頭。';
    const both = Save.d.endGo && Save.d.endStay;
    $('endHint').textContent = both ? '兩個結局都看過了。' : kind === 'go' ? '碼頭上，還有另一個選擇。' : '如果那天他上了船呢？';
  }
};

function frame(now) {
  requestAnimationFrame(frame);
  if (!frame.last) frame.last = now;
  let dt = (now - frame.last) / 1000; frame.last = now;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  if (App.screen === 'play' && G) {
    if (G.state === 'play' || G.state === 'dying' || G.state === 'clearing') {
      frame.acc = (frame.acc || 0) + dt; const step = 1 / 60; let n = 0;
      while (frame.acc >= step && n < 5) { update(step); frame.acc -= step; n++; if (!G) break; }
      if (n >= 5) frame.acc = 0;
    } else frame.acc = 0;
    if (G) { render(dt); HUD.sync(dt); }
  } else if (App.screen === 'story') Story.frame(dt);
  else Scene.frame(dt);
}

function boot() {
  Save.load(); Sound.on = Save.d.sound;
  if (IS_TOUCH) document.body.classList.add('touch');
  VC.cv = $('cv'); VC.ctx = VC.cv.getContext('2d'); VC.light = mkCanvas(8, 8); VC.lctx = VC.light.getContext('2d');
  Scene.cv = $('scv'); Scene.ctx = Scene.cv.getContext('2d');
  PSPR = charSprite('player', ['player']);
  resizeView(); Scene.resize();
  addEventListener('resize', () => { resizeView(); Scene.resize(); });
  Input.init();
  const unlock = () => Sound.init();
  for (const ev of ['pointerdown', 'touchend', 'click', 'keydown']) document.addEventListener(ev, unlock, true);
  const on = (id, fn) => $(id).addEventListener('click', e => { e.stopPropagation(); fn(e); });
  on('bStart', () => { Sound.play('click'); const d = Save.d; startChapter(d.cleared[5] ? 1 : Math.min(5, d.unlocked)); });
  on('bChapters', () => { Sound.play('click'); renderChapters(); App.go('chapters'); });
  on('bEndless', () => { if (!Save.d.endlessOpen) { Toast.show('先通關第一章'); return; } Sound.play('click'); beginPlay('E'); });
  on('bAch', () => { Sound.play('click'); renderAch(); App.go('ach'); });
  on('bSound', () => { Save.d.sound = !Save.d.sound; Save.save(); Sound.setOn(Save.d.sound); Title.render(); Sound.play('click'); });
  on('bChBack', () => { Sound.play('click'); Title.show(); });
  on('bAchBack', () => { Sound.play('click'); Title.show(); });
  on('bEndBack', () => { Sound.play('click'); Sound.stopAmb(); Scene.amb = null; Title.show(); });
  on('stSkip', () => Story.skip());
  $('scrStory').addEventListener('click', e => { if (e.target.closest('button')) return; Story.advance(); });
  on('lvReroll', () => UI.reroll());
  on('pResume', () => UI.resume());
  on('pRestart', () => UI.restart());
  on('pQuit', () => UI.quit());
  on('pSound', () => { Save.d.sound = !Save.d.sound; Save.save(); Sound.setOn(Save.d.sound); $('pSound').textContent = '音效：' + (Save.d.sound ? '開' : '關'); });
  on('dRetry', () => UI.restart());
  on('dMenu', () => UI.deadMenu());
  on('cNext', () => UI.continueAfterClear());
  const act = (id, fn) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fn(); });
  act('btnDodge', doDodge); act('btnMolo', throwMolotov); act('btnPause', () => UI.pause());
  document.addEventListener('visibilitychange', () => { if (document.hidden && App.screen === 'play' && G && G.state === 'play') UI.pause(); });
  $('hudFace').src = portraitURL('ziwei'); $('moloIco').src = iconURL('molotov');
  Title.show();
  requestAnimationFrame(frame);
}
boot();

</script>
