<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>殘局 LAST GAMBIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&family=Teko:wght@500;600&display=swap">

<style>
/* 版面：全螢幕棋盤畫布，上方轉播列、下方商店；面板走賽事轉播的斜切造型 */
:root {
  color-scheme: dark;
  --bg: #07060e; --panel: rgba(13, 11, 24, 0.9); --panel2: rgba(22, 18, 38, 0.94);
  --line: rgba(242, 193, 78, 0.38); --gold: #f2c14e; --gold2: #ffe08a; --cyan: #49d6ff; --red: #ff4d5e;
  --text: #efe8da; --mute: #9b94ab; --ink: #0b0914;
  --c1: #9aa4b2; --c2: #5fd38a; --c3: #49a6ff; --c4: #b77bff; --c5: #ffcf4d;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --num: "Teko", "Oswald", "Arial Narrow", sans-serif;
  --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px);
  --safeL: env(safe-area-inset-left, 0px); --safeR: env(safe-area-inset-right, 0px);
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
body { margin: 0; overflow: hidden; font-family: var(--body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font-family: var(--body); color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; overflow: clip; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.num { font-family: var(--num); font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.cut { clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }

/* ── 上方 HUD ── */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safeT) + 6px) max(10px, var(--safeR)) 0 max(10px, var(--safeL)); display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
.live { display: flex; align-items: center; gap: 4px; background: #c8102e; color: #fff; font: 600 14px/1 var(--num); padding: 4px 6px 2px; letter-spacing: 0.08em; flex: none; }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.rnd { background: var(--panel); border-bottom: 2px solid var(--gold); padding: 3px 10px 1px; display: flex; align-items: baseline; gap: 4px; white-space: nowrap; flex: none; }
.rnd .lbl { font: 600 13px var(--num); color: var(--mute); letter-spacing: 0.1em; }
.rnd b { font: 600 24px/1 var(--num); color: var(--gold2); }
.rnd small { font-size: 11px; color: var(--mute); max-width: 7em; overflow: hidden; text-overflow: ellipsis; }
.stat { display: flex; align-items: center; gap: 3px; background: var(--panel); padding: 3px 9px 1px; flex: none; }
.stat b { font: 600 22px/1 var(--num); }
.stat .ic { width: 16px; height: 16px; flex: none; }
#hHpBox b { color: #6dffb0; }
#hGoldBox b { color: var(--gold2); }
.lvbox { background: var(--panel); padding: 4px 8px 3px; min-width: 64px; flex: none; }
.lvbox .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--mute); }
.lvbox .t b { font: 600 19px/1 var(--num); color: var(--text); }
.xpbar { height: 4px; background: rgba(255,255,255,0.1); margin-top: 2px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #5aa0ff, #9fd0ff); width: 0; transition: width .3s; }
.spacer { flex: 1; }
.iconbtn { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; font-size: 17px; flex: none; }
@media (max-width: 420px) { .rnd .lbl, #hRType { display: none; } #hud { gap: 5px; } }
@media (max-width: 350px) { .live { display: none; } }

/* ── 執棋者列 ── */
#lobby { position: absolute; left: 0; right: 0; top: calc(var(--safeT) + 48px); padding: 0 max(8px, var(--safeR)) 0 max(8px, var(--safeL)); display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; z-index: 5; }
#lobby::-webkit-scrollbar { display: none; }
.chip { flex: 1 0 40px; max-width: 76px; background: var(--panel); border: 1px solid rgba(255,255,255,0.08); padding: 2px 3px 3px; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
.chip canvas { width: 26px; height: 26px; border-radius: 50%; display: block; }
.chip .hpn { font: 600 15px/1 var(--num); }
.chip .hpbar { width: 100%; height: 3px; background: rgba(255,255,255,0.1); }
.chip .hpbar i { display: block; height: 100%; background: #6dffb0; }
.chip.me { border-color: var(--cyan); }
.chip.opp { border-color: var(--red); box-shadow: 0 0 10px rgba(255,77,94,0.5); }
.chip.dead { opacity: 0.35; filter: grayscale(1); }
.chip.dead::after { content: "落幕"; position: absolute; inset: 0; display: grid; place-items: center; font: 900 12px var(--display); color: #ffb0b8; }

/* ── 羈絆 ── */
#traits { position: absolute; left: max(4px, var(--safeL)); top: calc(var(--safeT) + 100px); display: flex; flex-direction: column; gap: 2px; z-index: 4; max-height: 40vh; overflow: hidden; }
.trait { display: flex; align-items: center; gap: 3px; background: rgba(13,11,24,0.78); border: 0; border-left: 3px solid #555; padding: 1px 6px 1px 2px; font-size: 11px; min-width: 0; height: 22px; }
.trait canvas { width: 15px; height: 15px; }
.trait .n { font: 600 14px/1 var(--num); color: var(--mute); }
.trait:not(.on) span:not(.n) { color: var(--mute); }
.trait.on { border-left-color: var(--gold); background: rgba(40, 30, 10, 0.88); }
.trait.on .n { color: var(--gold2); }
.trait.on2 { border-left-color: #ff9a3d; background: rgba(60, 26, 6, 0.9); box-shadow: 0 0 12px rgba(255, 154, 61, 0.35); }

/* ── 熱度、鏡頭 ── */
#hype { position: absolute; right: max(6px, var(--safeR)); top: calc(var(--safeT) + 100px); width: 98px; background: var(--panel); padding: 5px 7px; z-index: 4; border-top: 2px solid #ff9a3d; }
#hype .t { display: flex; justify-content: space-between; font-size: 11px; color: var(--mute); }
#hype .bar { height: 6px; background: rgba(255,255,255,0.08); margin-top: 3px; position: relative; overflow: hidden; }
#hype .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #ff6b2a, #ffd36b); transition: width .4s; }
#hype button { margin-top: 5px; width: 100%; border: 0; background: linear-gradient(90deg, #ff9a3d, #ffd36b); color: #1a0e04; font: 900 12px var(--body); padding: 4px 0; animation: pulse 1s infinite; }
@keyframes pulse { 50% { filter: brightness(1.3); } }
#camCtl { position: absolute; right: max(4px, var(--safeR)); top: calc(var(--safeT) + 154px); display: flex; flex-direction: column; gap: 4px; z-index: 4; align-items: flex-end; }
#camCtl button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); background: rgba(13,11,24,0.78); font-size: 14px; display: grid; place-items: center; }
#camCtl button.on { border-color: var(--gold); color: var(--gold2); }
#camCtl .more { display: none; flex-direction: column; gap: 4px; }
#camCtl.open .more { display: flex; }
#camCtl #cTog { width: auto; border-radius: 16px; padding: 0 9px; font: 700 12px var(--body); }

/* ── 商店 ── */
#shop { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px max(8px, var(--safeR)) calc(var(--safeB) + 8px) max(8px, var(--safeL)); background: linear-gradient(180deg, rgba(7,6,14,0) 0, rgba(7,6,14,0.9) 18px, rgba(7,6,14,0.97)); z-index: 6; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
#shop.hide { transform: translateY(110%); }
#shop.sellzone { box-shadow: inset 0 3px 0 var(--red); background: linear-gradient(180deg, rgba(60,6,14,0) 0, rgba(60,6,14,0.92) 18px, rgba(40,4,10,0.97)); }
#shop.sellzone::before { content: "放開以賣出"; position: absolute; left: 50%; top: -6px; transform: translate(-50%, -100%); background: var(--red); color: #fff; font: 900 13px var(--body); padding: 4px 10px; }
.shopin { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.bar { display: flex; gap: 6px; align-items: stretch; }
.btn { border: 1px solid var(--line); background: var(--panel2); padding: 6px 10px; font: 700 13px var(--body); display: flex; align-items: center; gap: 6px; justify-content: center; }
.btn .num { font-size: 18px; line-height: 1; color: var(--gold2); }
.btn:disabled { opacity: 0.4; }
.btn.lock.on { border-color: var(--gold); background: rgba(60,44,10,0.9); }
.btn.go { flex: 1; background: linear-gradient(90deg, #b8102e, #ff4d5e); border-color: #ff8a96; font: 900 17px var(--display); letter-spacing: 0.2em; color: #fff; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
.cnt { display: flex; align-items: center; padding: 0 6px; font-size: 12px; color: var(--mute); gap: 3px; }
.cnt b { font: 600 20px var(--num); color: var(--text); }
.cnt.over b { color: var(--red); }
.cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.card { position: relative; height: 104px; border: 1px solid rgba(255,255,255,0.12); background: #100d1c; overflow: hidden; padding: 0; display: block; text-align: left; }
.card canvas { position: absolute; inset: 0 0 auto 0; width: 100%; height: 76px; display: block; }
.card .nm { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: rgba(8,6,14,0.94); padding: 2px 5px 0; }
.card .nm b { display: block; font: 900 13px/1.2 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .nm small { display: block; font-size: 10px; color: var(--mute); white-space: nowrap; overflow: hidden; }
.card .cost { position: absolute; right: 0; top: 0; font: 600 18px/1 var(--num); padding: 3px 6px 0; color: #0b0914; }
.card .own { position: absolute; left: 4px; top: 4px; display: flex; gap: 2px; }
.card .own i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold2); box-shadow: 0 0 4px var(--gold); }
.card.up { box-shadow: inset 0 0 0 2px var(--gold2), 0 0 14px rgba(255,214,107,0.6); animation: pulse 0.9s infinite; }
.card.up::after { content: "升星"; position: absolute; left: 0; top: 52px; background: var(--gold); color: #1a1004; font: 900 11px var(--body); padding: 1px 5px; }
.card.empty { opacity: 0.18; }
.card.poor { filter: grayscale(0.8) brightness(0.6); }
.c1 { border-color: var(--c1); } .c1 .cost { background: var(--c1); }
.c2 { border-color: var(--c2); } .c2 .cost { background: var(--c2); }
.c3 { border-color: var(--c3); } .c3 .cost { background: var(--c3); }
.c4 { border-color: var(--c4); } .c4 .cost { background: var(--c4); }
.c5 { border-color: var(--c5); } .c5 .cost { background: var(--c5); }
.items { display: flex; gap: 4px; min-height: 30px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.items .lbl { font-size: 11px; color: var(--mute); white-space: nowrap; }
.item { width: 30px; height: 30px; border: 1px solid rgba(255,255,255,0.15); background: #141022; padding: 0; flex: none; }
.item canvas { width: 100%; height: 100%; display: block; }
.item.sel { border-color: var(--gold2); box-shadow: 0 0 10px var(--gold); }
.item.leg { border-color: #ffe08a; }

/* ── 戰鬥列 ── */
#battleBar { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px max(10px, var(--safeR)) calc(var(--safeB) + 10px) max(10px, var(--safeL)); display: flex; gap: 8px; align-items: center; justify-content: center; z-index: 6; transform: translateY(120%); transition: transform .35s; }
#battleBar { visibility: hidden; }
#battleBar.show { transform: none; visibility: visible; }
#battleBar .timer { font: 600 30px/1 var(--num); min-width: 54px; text-align: center; background: var(--panel); padding: 6px 10px 2px; }
#battleBar .timer.ot { color: var(--red); }

/* ── 浮層 ── */
.ov { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: calc(var(--safeT) + 12px) max(14px, var(--safeR)) calc(var(--safeB) + 12px) max(14px, var(--safeL)); background: rgba(4,3,8,0.72); animation: fadein .25s; overflow-y: auto; }
@keyframes fadein { from { opacity: 0; } }
.panel { width: min(560px, 100%); background: var(--panel2); border: 1px solid var(--line); padding: 16px; position: relative; max-height: 100%; overflow-y: auto; }
.panel h2 { font: 900 24px var(--display); margin: 0 0 4px; letter-spacing: 0.06em; text-wrap: balance; }
.panel .sub { color: var(--mute); font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mt { margin-top: 12px; }
.chipw { font-size: 11px; padding: 2px 7px; border: 1px solid currentColor; display: inline-flex; gap: 4px; align-items: center; }
.big-btn { border: 1px solid var(--gold); background: linear-gradient(180deg, rgba(60,44,10,0.95), rgba(30,22,6,0.95)); padding: 11px 18px; font: 900 16px var(--display); letter-spacing: 0.15em; color: var(--gold2); }
.big-btn.red { border-color: #ff8a96; background: linear-gradient(90deg, #8a0c22, #d8283a); color: #fff; }
.big-btn.ghost { border-color: rgba(255,255,255,0.25); background: transparent; color: var(--text); }

/* 標題 */
#title { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(var(--safeT) + 7vh) max(16px, var(--safeR)) calc(var(--safeB) + 6vh) max(16px, var(--safeL)); pointer-events: none; }
#title > * { pointer-events: auto; }
.logo { text-align: center; }
.logo h1 { margin: 0; font: 900 clamp(64px, 22vw, 132px)/1 var(--display); letter-spacing: 0.1em; background: linear-gradient(180deg, #fff6dc, #f2c14e 55%, #8a5a10); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.8)); padding-left: 0.1em; }
.logo .en { font: 600 clamp(20px, 6vw, 30px)/1 var(--num); letter-spacing: 0.5em; color: var(--text); margin-top: 6px; padding-left: 0.5em; }
.logo .tag { margin-top: 14px; font-size: 13px; color: var(--mute); letter-spacing: 0.08em; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
.menu .big-btn { width: 100%; }
.foot { font-size: 11px; color: var(--mute); text-align: center; }

/* 選角卡 */
.pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pcard { border: 1px solid var(--line); background: #110e1e; padding: 0 0 8px; text-align: left; display: flex; flex-direction: column; }
.pcard canvas { width: 100%; aspect-ratio: 3 / 4; display: block; max-width: 100%; }
.pcard b { font: 900 17px var(--display); padding: 6px 8px 0; }
.pcard small { padding: 0 8px; color: var(--mute); font-size: 11px; }
.pcard p { font-size: 12px; line-height: 1.5; padding: 4px 8px 0; margin: 0; color: #d8d0c0; }

/* 角色卡 */
.sheet { width: min(620px, 100%); display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; }
.sheet .art { background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.08), transparent 70%); }
.sheet .art canvas { width: 150px; height: 200px; display: block; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.stats div { background: rgba(255,255,255,0.04); padding: 3px 6px; font-size: 10px; color: var(--mute); }
.stats div b { display: block; font: 600 18px/1 var(--num); color: var(--text); }
.ultbox { margin-top: 10px; border-left: 3px solid var(--gold); padding: 6px 10px; background: rgba(242,193,78,0.06); }
.ultbox b { font: 900 16px var(--display); color: var(--gold2); }
.ultbox p { margin: 4px 0 0; font-size: 13px; line-height: 1.6; }
.quote { margin-top: 10px; font: 700 14px/1.6 var(--display); color: #e8dcc4; }
.lore p { font-size: 13px; line-height: 1.75; margin: 6px 0 0; color: #d8d0c0; }
.lore h4 { margin: 10px 0 0; font: 900 14px var(--display); color: var(--gold2); }
.lock { color: var(--mute); font-size: 12px; }
@media (max-width: 520px) { .sheet { grid-template-columns: 1fr; } .sheet .art { display: flex; justify-content: center; } }

/* VS */
#vs { position: absolute; inset: 0; z-index: 15; pointer-events: auto; overflow: hidden; }
#vs .half { position: absolute; top: 0; bottom: 0; width: 62%; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 6%; }
#vs .l { left: 0; background: linear-gradient(100deg, rgba(10,40,60,0.96) 60%, transparent); align-items: flex-start; clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); animation: inl .35s cubic-bezier(.2,.9,.2,1); }
#vs .r { right: 0; background: linear-gradient(260deg, rgba(60,10,20,0.96) 60%, transparent); align-items: flex-end; text-align: right; clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%); animation: inr .35s cubic-bezier(.2,.9,.2,1); }
@keyframes inl { from { transform: translateX(-100%); } } @keyframes inr { from { transform: translateX(100%); } }
#vs canvas { width: min(42vw, 220px); height: min(42vw, 220px); }
#vs .nm { font: 900 clamp(22px, 7vw, 40px) var(--display); }
#vs .wd { font-size: 12px; color: var(--mute); }
#vs .ln { font: 700 14px/1.6 var(--display); max-width: 82%; color: #f2e6d0; }
#vs .vsx { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 clamp(60px, 22vw, 120px)/1 var(--num); color: #fff; text-shadow: 0 0 30px var(--gold), 0 4px 0 #000; animation: vspop .5s; }
@keyframes vspop { from { transform: translate(-50%, -50%) scale(3); opacity: 0; } }

/* 結算 */
.res-head { display: flex; align-items: center; gap: 12px; }
.res-head canvas { width: 64px; height: 64px; border: 1px solid var(--line); }
.res-big { font: 900 34px/1 var(--display); letter-spacing: 0.15em; }
.win { color: var(--gold2); } .lose { color: #ff8a96; } .draw { color: var(--mute); }
.mvp { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.04); padding: 8px; margin-top: 10px; }
.mvp canvas { width: 52px; height: 52px; flex: none; }
.fallen { margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; }
.fallen .f { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.fallen canvas { width: 40px; height: 40px; filter: grayscale(0.7); flex: none; }
.fallen q { font: 700 13px/1.5 var(--display); color: #e6d6c6; quotes: "「" "」"; }

/* 劇情 */
#story { position: absolute; inset: 0; z-index: 30; background: rgba(2,1,6,0.94); display: flex; flex-direction: column; justify-content: center; padding: calc(var(--safeT) + 20px) max(22px, var(--safeR)) calc(var(--safeB) + 20px) max(22px, var(--safeL)); animation: fadein .5s; }
#story .ttl { font: 900 13px var(--body); color: var(--gold); letter-spacing: 0.4em; margin-bottom: 18px; }
#story .lines { max-width: 620px; display: flex; flex-direction: column; gap: 16px; }
#story .ln { font: 700 clamp(16px, 4.6vw, 22px)/1.7 var(--display); color: #efe6d2; animation: rise .5s both; }
#story .ln.wei { color: #9ff0ff; }
#story .ln.who { color: #ffd9a8; }
#story .ln small { display: block; font: 700 12px var(--body); color: var(--mute); letter-spacing: 0.1em; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
#story .tap { margin-top: 26px; font-size: 12px; color: var(--mute); }

/* 圖鑑 */
.tabs { display: flex; gap: 4px; margin: 10px 0; flex-wrap: wrap; }
.tabs button { border: 1px solid rgba(255,255,255,0.15); background: transparent; padding: 5px 10px; font-size: 13px; }
.tabs button.on { border-color: var(--gold); color: var(--gold2); background: rgba(60,44,10,0.6); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.gcell { border: 1px solid rgba(255,255,255,0.1); background: #110e1e; padding: 0 0 4px; font-size: 11px; text-align: center; }
.gcell canvas { width: 100%; aspect-ratio: 1; display: block; max-width: 100%; }
.gcell.locked canvas { filter: brightness(0) opacity(0.5); }

/* 傷害公式：PvP 落敗扣血 */
LG.lossDamage = function (round, survivors) {
  var base = round < 8 ? 4 : round < 12 ? 6 : round < 16 ? 9 : round < 20 ? 12 : 16;
  var s = 0;
  survivors.forEach(function (u) { s += 1 + (u.star - 1) * 1.5 + (u.cost >= 4 ? 1 : 0); });
  s = Math.round(s);
  return base + s;
};

/* 數值工具 */
LG.unitStats = function (id, star) {
  var d = LG.UNITS[id];
  var b = LG.CLASS_BASE[d.cls];
  var m = d.mod || {};
  var cm = 1 + 0.16 * (d.cost - 1), am = 1 + 0.13 * (d.cost - 1);
  var sm = [1, 1.8, 3.24][star - 1];
  return {
    hp: Math.round(b.hp * cm * (m.hp || 1) * sm),
    ad: Math.round(b.ad * am * (m.ad || 1) * sm),
    as: m.as || b.as,
    range: m.range || b.range,
    armor: b.armor + (d.cost - 1) * 3,
    mr: b.mr + (d.cost - 1) * 3,
    mana: m.mana || b.mana,
    start: m.start != null ? m.start : b.start,
    crit: b.crit
  };
};
LG.ultText = function (id, star) {
  var u = LG.UNITS[id].ult;
  return u.desc.replace(/\{(\w+)\}/g, function (_, k) {
    var arr = u.v[k]; if (!arr) return k;
    return arr.map(function (x, i) {
      var t = (k === 'adp' || k === 'exec') ? Math.round(x * 100) + '%' : (x >= 99999 ? '∞' : x + '');
      return (star && i === star - 1) ? '【' + t + '】' : t;
    }).join('/');
  });
};

  function bindPointer() {
    var cv = $('stage');
    var pts = {}, start = null, lastTap = 0, pinch = null;
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    cv.addEventListener('wheel', function (e) { e.preventDefault(); R.zoom(e.deltaY > 0 ? 1.08 : 0.92); }, { passive: false });
    cv.addEventListener('pointerdown', function (e) {
      SFX.init();
      cv.setPointerCapture(e.pointerId);
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pts);
      if (ids.length === 2) {
        var a = pts[ids[0]], b = pts[ids[1]];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x) };
        if (drag) { drag = null; R.hl = null; }
        return;
      }
      start = { x: e.clientX, y: e.clientY, t: performance.now(), btn: e.button, moved: false, unit: null };
      if (state === 'plan' && scoutIdx < 0 && e.button === 0) {
        var u = R.unitAtScreen(e.clientX, e.clientY);
        if (u && u.ref) start.unit = u.ref;
      }
    });
    cv.addEventListener('pointermove', function (e) {
      if (!pts[e.pointerId]) return;
      var prev = pts[e.pointerId];
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pts);
      if (ids.length === 2 && pinch) {
        var a = pts[ids[0]], b = pts[ids[1]];
        var d = Math.hypot(a.x - b.x, a.y - b.y), ang = Math.atan2(b.y - a.y, b.x - a.x);
        if (d > 10) R.zoom(pinch.d / d);
        var da = ang - pinch.ang; if (da > Math.PI) da -= Math.PI * 2; if (da < -Math.PI) da += Math.PI * 2;
        R.cam.yaw += da; R.userCam();
        pinch = { d: d, ang: ang };
        return;
      }
      if (!start) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!start.moved && Math.hypot(dx, dy) > 7) start.moved = true;
      if (!start.moved) return;
      if (start.unit && state === 'plan') {
        var g = R.unproj(e.clientX, e.clientY);
        if (!drag) drag = { uid: start.unit.uid, on: true };
        if (g) { drag.wx = g.x; drag.wy = g.y; }
        var overShop = overShopPanel(e.clientX, e.clientY);
        var tg = overShop ? null : R.pickGround(e.clientX, e.clientY);
        if (tg && (tg.type === 'cell' || tg.type === 'bench')) {
          var ok = true;
          if (tg.type === 'cell') { var me = human(); var f = G.findUnit(me, start.unit.uid); var occ = me.board.some(function (x) { return x.c === tg.c && x.r === tg.lr; }); ok = !(f.where === 'bench' && !occ && me.board.length >= me.level); }
          R.hl = { type: tg.type, c: tg.c, r: tg.r, i: tg.i, ok: ok };
        } else R.hl = null;
        $('shop').classList.toggle('sellzone', overShop);
        return;
      }
      if (e.buttons === 4 || (e.buttons === 1 && e.shiftKey)) { R.pan(e.clientX - prev.x, e.clientY - prev.y); return; }
      R.orbit(e.clientX - prev.x, e.clientY - prev.y);
    });
    var up = function (e) {
      delete pts[e.pointerId];
      if (Object.keys(pts).length < 2) pinch = null;
      if (!start) return;
      var s = start; start = null;
      if (drag && s.unit) {
        var me = human();
        if (overShopPanel(e.clientX, e.clientY)) sellUnit(s.unit.uid);
        else {
          var tg = R.pickGround(e.clientX, e.clientY);
          if (tg && tg.type === 'cell') { if (G.move(me, s.unit.uid, { board: { c: tg.c, r: tg.lr } })) SFX.play('click'); else { toast('上場人數已滿（升級可增加）'); SFX.play('error'); } }
          else if (tg && tg.type === 'bench') { if (G.move(me, s.unit.uid, { bench: tg.i })) SFX.play('click'); }
        }
        drag = null; R.hl = null; $('shop').classList.remove('sellzone');
        refresh(); saveRun();
        return;
      }
      if (!s.moved) {
        var now = performance.now();
        if (s.unit && state === 'plan') {
          if (selItem >= 0) {
            var me2 = human();
            var it = me2.items[selItem];
            if (G.equip(me2, selItem, s.unit.uid)) { SFX.play('buy'); toast(UNITS[s.unit.id].name + ' 裝備了 ' + LG.ITEMS[it].name); selItem = -1; refresh(); saveRun(); }
            else { toast('最多裝備 3 件遺物'); SFX.play('error'); }
          } else openSheet(s.unit, true);
          return;
        }
        if (now - lastTap < 320) { R.cam.userT = 0; R.resetCam(false); }
        lastTap = now;
      }
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
  }
  function overShopPanel(x, y) {
    var sh = $('shop'); if (sh.hidden || sh.classList.contains('hide')) return false;
    var r = sh.getBoundingClientRect();
    return y > r.top + 30 && x >= r.left && x <= r.right;
  }

  /* ── 主迴圈 ── */
  var lastT = performance.now(), acc = 0, hudT = 0;
  function loop(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    try {
      if (state === 'battle' && B) {
        var sc = FX.engineScale() * speed;
        acc += dt * sc;
        var n = 0;
        while (acc >= LG.DT && n < 16 && !B.ended) { B.tick(); acc -= LG.DT; n++; pump(); }
        pump();
        if (B.ended) {
          endT += dt;
          if (R.director && R.cam.userT <= 0) R.cam.yaw += dt * 0.25;
          if (endT > 1.8) finishBattle();
        }
        hudT += dt;
        if (hudT > 0.2) {
          hudT = 0;
          var tl = Math.floor(B.t);
          $('bTimer').textContent = tl;
          $('bTimer').classList.toggle('ot', B.t > 30);
        }
      } else acc = 0;
      if (state === 'title') R.cam.yaw += dt * 0.12;
      R.frame(dt);
    } catch (err) {
      if (!loop.err) { loop.err = 1; console.error(err); toast('發生錯誤：' + err.message); }
    }
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  LG.debug = { get G() { return G; }, get B() { return B; }, get state() { return state; }, newGame: newGame, goBattle: goBattle, refresh: refresh, prof: prof, startRound: startRound, skip: skipBattle, buy: buy };
})();
