<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>熄燈之後</title>
<meta name="theme-color" content="#08090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed WebGL scene with a diegetic overlay — radio-style dialog, emergency-tape alerts, flashlight-cone menus */
:root {
  --ink: #08090b; --panel: rgba(10, 12, 15, 0.78); --panel-2: rgba(18, 21, 26, 0.92); --paper: #ebe4d4; --mute: #8f97a0; --dim: #5b636c;
  --beam: #ffd98a; --siren: #e2412f; --fire: #ff6a3d; --line: #59b4ff; --caution: #f2c230; --ok: #6fd18a; --edge: rgba(235, 228, 212, 0.14);
  --f-display: "Chiron Sung HK", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); overflow: hidden; }
body { font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); }
.layer { position: absolute; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; display: flex; pointer-events: auto; }
button { font-family: var(--f-ui); color: var(--paper); cursor: pointer; }
button:focus-visible, .menu-item:focus-visible { outline: 2px solid var(--beam); outline-offset: 3px; }
/* ---------------- title ---------------- */
#title { flex-direction: column; justify-content: flex-end; padding: max(28px, env(safe-area-inset-top)) clamp(16px, 5vw, 64px) max(28px, env(safe-area-inset-bottom)); background: radial-gradient(120% 90% at 70% 10%, rgba(8, 9, 11, 0) 0%, rgba(8, 9, 11, 0.55) 55%, rgba(8, 9, 11, 0.92) 100%); }
.t-cap { font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.18em; color: var(--mute); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.t-cap b { color: var(--siren); font-weight: 600; }
.t-name { font-family: var(--f-display); font-weight: 900; font-size: clamp(64px, 14vw, 168px); line-height: 0.92; letter-spacing: 0.04em; margin: 10px 0 4px; color: var(--paper); text-shadow: 0 0 30px rgba(255, 217, 138, 0.18); animation: flick 7s infinite steps(1); }
.t-name span { display: inline-block; }
.t-name span:nth-child(3) { animation: flick2 4.3s infinite steps(1); }
@keyframes flick { 0%, 100% { opacity: 1 } 41% { opacity: 1 } 42% { opacity: 0.35 } 43% { opacity: 1 } 44% { opacity: 0.2 } 46% { opacity: 1 } 80% { opacity: 1 } 81% { opacity: 0.6 } 82% { opacity: 1 } }
@keyframes flick2 { 0%, 100% { opacity: 1 } 63% { opacity: 1 } 64% { opacity: 0.1 } 68% { opacity: 0.1 } 69% { opacity: 1 } }
.t-sub { font-family: var(--f-mono); font-size: clamp(12px, 1.6vw, 16px); letter-spacing: 0.5em; color: var(--beam); opacity: 0.8; margin-bottom: 26px; }
.menu { display: flex; flex-direction: column; gap: 4px; max-width: 520px; }
.menu-item { position: relative; display: grid; grid-template-columns: 2.2em 1fr; align-items: baseline; gap: 10px; text-align: left; background: transparent; border: 0; padding: 12px 14px; font-size: clamp(18px, 2.4vw, 23px); font-weight: 700; letter-spacing: 0.06em; border-radius: 2px; overflow: hidden; }
.menu-item::before { content: ""; position: absolute; inset: 0; background: radial-gradient(160px 60px at var(--mx, 10%) 50%, rgba(255, 217, 138, 0.22), transparent 70%); opacity: 0; transition: opacity .25s; }
.menu-item:hover::before, .menu-item:focus-visible::before { opacity: 1; }
.menu-item small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--mute); letter-spacing: 0.02em; }
.menu-item .k { font-family: var(--f-mono); font-size: 12px; color: var(--dim); }
.menu-item[disabled] { opacity: 0.45; cursor: default; }
.t-foot { margin-top: 20px; font-size: 12px; color: var(--dim); line-height: 1.7; max-width: 640px; }
/* ---------------- generic panels ---------------- */
.modal { margin: auto; width: min(760px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 6px; padding: clamp(18px, 3vw, 32px); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
.modal h2 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 4vw, 38px); margin: 0 0 6px; letter-spacing: 0.05em; text-wrap: balance; }
.modal .lead { color: var(--mute); margin: 0 0 18px; line-height: 1.7; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { background: rgba(235, 228, 212, 0.08); border: 1px solid var(--edge); padding: 11px 18px; border-radius: 4px; font-size: 15px; font-weight: 700; letter-spacing: 0.05em; }
.btn:hover { background: rgba(235, 228, 212, 0.14); }
.btn.primary { background: var(--beam); color: #1a1408; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: rgba(226, 65, 47, 0.6); color: #ffb3a8; }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 14px; line-height: 1.5; }
.keys kbd { font-family: var(--f-mono); font-size: 12px; background: rgba(235, 228, 212, 0.1); border: 1px solid var(--edge); border-bottom-width: 2px; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
.sect { font-size: 12px; letter-spacing: 0.2em; color: var(--beam); margin: 18px 0 8px; font-weight: 700; }
/* ---------------- lobby ---------------- */
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.role { position: relative; text-align: left; border: 1px solid var(--edge); background: rgba(235, 228, 212, 0.04); border-radius: 6px; padding: 16px 16px 14px; min-width: 0; }
.role.fire { --rc: var(--fire); } .role.line { --rc: var(--line); }
.role::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; background: var(--rc); border-radius: 2px; }
.role h3 { margin: 0; font-family: var(--f-display); font-size: 24px; letter-spacing: 0.06em; }
.role .tt { color: var(--rc); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; margin: 2px 0 8px; }
.role p { margin: 0 0 10px; color: var(--mute); font-size: 13.5px; line-height: 1.65; }
.role .who { font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: rgba(235, 228, 212, 0.1); border: 1px solid var(--edge); }
.chip.on { background: rgba(111, 209, 138, 0.15); border-color: rgba(111, 209, 138, 0.5); color: #bff0cc; }
.chip.ai { background: rgba(143, 151, 160, 0.12); color: var(--mute); }
.role.mine { border-color: var(--rc); background: rgba(235, 228, 212, 0.07); }
.invite { display: grid; gap: 8px; margin-top: 6px; }
.inv { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 10px; align-items: center; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--edge); border-radius: 4px; padding: 8px 10px; min-width: 0; }
.inv .lbl { font-size: 12px; color: var(--mute); }
.inv code { font-family: var(--f-mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--beam); min-width: 0; user-select: text; -webkit-user-select: text; }
.inv button { font-size: 12px; padding: 6px 10px; }
/* ---------------- HUD ---------------- */
#hud { opacity: 0; transition: opacity .4s; }
#hud.on { opacity: 1; }
.team { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); display: grid; gap: 8px; width: min(250px, 42vw); }
.pc { background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; padding: 7px 9px 8px; position: relative; overflow: hidden; }
.pc .nm { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; gap: 6px; }
.pc .nm i { font-style: normal; font-weight: 400; color: var(--mute); font-size: 11.5px; white-space: nowrap; }
.pc .bar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.pc .bar b { display: block; height: 100%; background: var(--rc); width: 100%; transition: width .2s; }
.pc .bat { height: 3px; margin-top: 4px; background: rgba(255, 255, 255, 0.06); border-radius: 2px; overflow: hidden; }
.pc .bat b { display: block; height: 100%; background: var(--beam); width: 100%; }
.pc.fire { --rc: var(--fire); } .pc.line { --rc: var(--line); }
.pc .st { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 0.12em; font-size: 13px; background: rgba(120, 10, 4, 0.72); }
.pc.down .st, .pc.dead .st, .pc.hid .st { display: flex; }
.pc.hid .st { background: rgba(10, 30, 20, 0.72); color: #bff0cc; }
.obj { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center; width: min(520px, 46vw); }
.obj .ot { font-family: var(--f-display); font-weight: 900; font-size: clamp(16px, 2.2vw, 22px); letter-spacing: 0.08em; text-shadow: 0 2px 10px #000; }
.obj .os { font-size: 12.5px; color: #d2cbbb; margin-top: 3px; text-shadow: 0 1px 6px #000; line-height: 1.5; }
.obj .op { height: 4px; background: rgba(255, 255, 255, 0.1); margin: 7px auto 0; width: 60%; border-radius: 2px; overflow: hidden; display: none; }
.obj .op b { display: block; height: 100%; background: var(--beam); width: 0; }
.obj .otm { font-family: var(--f-mono); font-size: 20px; color: var(--beam); margin-top: 4px; display: none; font-variant-numeric: tabular-nums; }
.obj.danger .ot { color: #ff8a78; }
.clock { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); text-align: right; }
.clock .tm { font-family: var(--f-mono); font-size: 22px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.clock .pl { font-size: 11.5px; color: var(--mute); letter-spacing: 0.1em; }
.clock .lv { margin-top: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
.clock .xp { height: 3px; width: 120px; margin-left: auto; margin-top: 3px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; }
.clock .xp b { display: block; height: 100%; width: 0; background: var(--paper); }
.clock .net { font-family: var(--f-mono); font-size: 11px; color: var(--dim); margin-top: 4px; }
.skills { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.sk { width: 58px; height: 58px; border-radius: 6px; background: var(--panel); border: 1px solid var(--edge); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; overflow: hidden; }
.sk .ic { font-size: 17px; font-weight: 900; font-family: var(--f-display); }
.sk .kb { position: absolute; top: 3px; left: 5px; font-family: var(--f-mono); font-size: 10px; color: var(--dim); }
.sk .ct { position: absolute; bottom: 3px; right: 5px; font-family: var(--f-mono); font-size: 11px; color: var(--beam); }
.sk .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.66); height: 0; }
.sk.off { opacity: 0.4; }
.prompt { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--edge); border-radius: 99px; padding: 7px 16px 7px 8px; font-size: 14px; display: none; align-items: center; gap: 10px; white-space: nowrap; }
.prompt kbd { font-family: var(--f-mono); background: var(--beam); color: #1a1408; border-radius: 99px; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.prompt .pr { width: 60px; height: 4px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; overflow: hidden; }
.prompt .pr b { display: block; height: 100%; background: var(--beam); width: 0; }
.subs { position: absolute; left: 50%; bottom: 168px; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sub { background: rgba(6, 7, 9, 0.82); border-radius: 4px; padding: 8px 14px; font-size: clamp(15px, 1.9vw, 18px); line-height: 1.6; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); text-wrap: balance; }
.sub .sp { font-weight: 900; margin-right: 8px; letter-spacing: 0.06em; }
.sub.radio { font-family: var(--f-ui); border-color: rgba(201, 179, 122, 0.35); }
.sub.radio .sp::before { content: "◉ "; font-size: 10px; animation: blink 1s infinite; }
.sub.sys { background: rgba(30, 26, 12, 0.85); border-color: rgba(242, 194, 48, 0.35); font-size: 14.5px; color: #f3e6bd; }
@keyframes blink { 50% { opacity: 0.2 } }
.horde { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 2px; }
.horde .tape { background: repeating-linear-gradient(-45deg, var(--caution) 0 14px, #121212 14px 28px); padding: 4px; border-radius: 2px; }
.horde .tape div { background: #120606; color: #ffcfc6; font-family: var(--f-display); font-weight: 900; font-size: clamp(18px, 3vw, 26px); letter-spacing: 0.2em; padding: 6px 22px; }
.horde .hs { font-size: 13px; color: #ffcfc6; text-shadow: 0 1px 4px #000; margin-top: 4px; }
.boss { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); width: min(520px, 70vw); display: none; text-align: center; }
.boss .bn { font-family: var(--f-display); font-weight: 900; letter-spacing: 0.3em; font-size: 15px; color: #ffd7c9; text-shadow: 0 1px 6px #000; }
.boss .bb { height: 8px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); margin-top: 4px; border-radius: 2px; overflow: hidden; }
.boss .bb b { display: block; height: 100%; background: linear-gradient(90deg, #8e1c12, #e2412f); width: 100%; transition: width .2s; }
.edgeind { position: absolute; transform: translate(-50%, -50%); display: none; flex-direction: column; align-items: center; font-size: 11px; font-weight: 700; text-shadow: 0 1px 4px #000; }
.edgeind .ar { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 14px solid var(--rc); }
.edgeind.fire { --rc: var(--fire); color: #ffc6b4; } .edgeind.line { --rc: var(--line); color: #c8e6ff; } .edgeind.obj { --rc: var(--beam); color: #ffeac0; }
.aw { position: absolute; transform: translate(-50%, -100%); font-weight: 900; font-size: 15px; color: #ffcf6a; text-shadow: 0 0 6px #000; pointer-events: none; }
.aw.red { color: #ff5a44; }
.toast { position: absolute; top: 26%; left: 50%; transform: translate(-50%, -50%); font-family: var(--f-display); font-weight: 900; font-size: clamp(24px, 4.4vw, 46px); letter-spacing: 0.18em; text-shadow: 0 4px 22px #000; opacity: 0; transition: opacity .5s; text-align: center; }
.toast small { display: block; font-family: var(--f-ui); font-size: 14px; letter-spacing: 0.1em; color: var(--mute); margin-top: 6px; }
/* ---------------- overlays ---------------- */
#story { background: rgba(4, 5, 6, 0.94); flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
.st-wrap { width: min(660px, 100%); max-height: 100%; overflow: auto; }
.st-head { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 13px; color: var(--mute); letter-spacing: 0.16em; border-bottom: 1px solid var(--edge); padding-bottom: 10px; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
.st-head b { color: var(--siren); font-weight: 600; }
.st-ch { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 4.5vw, 40px); letter-spacing: 0.12em; margin-bottom: 18px; }
.st-body p { font-family: var(--f-display); font-size: clamp(17px, 2.2vw, 20px); line-height: 2.0; margin: 0 0 14px; color: #e4ddcc; }
.st-body p.cur::after { content: "▍"; color: var(--beam); animation: blink .8s infinite; }
.st-next { margin-top: 18px; color: var(--mute); font-size: 14px; letter-spacing: 0.1em; }
.st-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 12px; flex-wrap: wrap; }
.st-foot .wait { font-size: 13px; color: var(--mute); }
#lvl { background: radial-gradient(80% 60% at 50% 50%, rgba(6, 7, 9, 0.6), rgba(6, 7, 9, 0.92)); flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; gap: 16px; }
.lv-h { font-family: var(--f-display); font-weight: 900; font-size: clamp(22px, 3.4vw, 32px); letter-spacing: 0.16em; text-align: center; }
.lv-h small { display: block; font-family: var(--f-ui); font-size: 13px; color: var(--mute); letter-spacing: 0.08em; font-weight: 400; margin-top: 4px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 12px; width: min(700px, 100%); justify-content: center; }
.card { text-align: left; background: #12151a; border: 1px solid var(--edge); border-radius: 6px; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 196px; position: relative; transition: transform .15s, border-color .15s; min-width: 0; }
.card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--beam); }
.card .ck { font-family: var(--f-mono); font-size: 11px; color: var(--dim); }
.card .cn { font-family: var(--f-display); font-weight: 900; font-size: 21px; letter-spacing: 0.05em; }
.card .cr { font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; }
.card.fire .cr { color: var(--fire); } .card.line .cr { color: var(--line); } .card.any .cr { color: var(--mute); }
.card .cd { font-size: 13.5px; line-height: 1.65; color: #cfc8b8; }
.card .lvdots { margin-top: auto; display: flex; gap: 4px; }
.card .lvdots i { width: 14px; height: 4px; background: rgba(255, 255, 255, 0.14); border-radius: 2px; }
.card .lvdots i.f { background: var(--beam); }
.lv-wait { color: var(--mute); font-size: 14px; }
#wipe, #end, #pause, #help, #settings, #lobby, #msg { background: rgba(4, 5, 6, 0.8); }
.end-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
.end-stats div { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--edge); border-radius: 4px; padding: 10px 12px; }
.end-stats b { display: block; font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.end-stats span { font-size: 12px; color: var(--mute); }
.set-row { display: grid; grid-template-columns: 6em 1fr; gap: 12px; align-items: center; margin: 10px 0; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 14px; font-size: 13px; }
.seg button.on { background: var(--beam); color: #1a1408; font-weight: 700; }
input[type=range] { width: 100%; accent-color: var(--beam); }
input[type=text] { font-family: var(--f-ui); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--edge); color: var(--paper); border-radius: 4px; padding: 8px 10px; font-size: 14px; width: 12em; max-width: 100%; }
/* ---------------- touch ---------------- */
#touch { display: none; }
#touch.on { display: block; }
.stick { position: absolute; bottom: calc(26px + env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.04); pointer-events: auto; }
.stick.l { left: calc(22px + env(safe-area-inset-left)); } .stick.r { right: calc(22px + env(safe-area-inset-right)); }
.stick .nub { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }
.tb { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(10, 12, 15, 0.6); color: var(--paper); font-size: 13px; font-weight: 700; pointer-events: auto; display: flex; align-items: center; justify-content: center; }
.tb.big { width: 66px; height: 66px; font-size: 14px; background: rgba(255, 217, 138, 0.18); border-color: rgba(255, 217, 138, 0.5); }
.tb.act { background: rgba(255, 217, 138, 0.45); }
#tpause { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 50%; transform: translateX(260px); pointer-events: auto; }
.rot { display: none; }
@media (max-width: 760px) {
  .obj { width: min(360px, 58vw); top: calc(74px + env(safe-area-inset-top)); }
  .team { width: 168px; } .pc .nm i { display: none; }
  .clock .xp { width: 90px; }
  .skills { display: none; }

<script>

defT(T.FENCE, 1, 0, 2, 'wall');

G.resolveCircle = function (map, e, r, hideSolid) {

// ---------------- flow fields (BFS, 4-neighbour, portal aware) ----------------
G.Field = class {
  constructor(map) { this.map = map; this.d = new Int16Array(map.w * map.h); this.q = new Int32Array(map.w * map.h); this.t = 0; }

      const oy = k === 0 ? 0 : k === 1 ? 0 : k === 2 ? 1 : k === 3 ? -1 : k === 4 ? 1 : k === 5 ? -1 : k === 6 ? 1 : -1;

G.Grid = class {

// ---- maps.js
// ============================================================
//  Stage maps (built in code, verified by preview renders)
// ============================================================
G.prop = function (m, kind, x, y, w, h, tile, opts) {

    if (face && r() < 0.5) m.set(x, y, T.SHUTTER);
  }
}
function puddles(m, seed, rate) {
  const r = G.mulberry(seed);
  for (let i = 0; i < m.t.length; i++) {
    const t = m.t[i];
    if ((t === T.ROAD || t === T.MARKET || t === T.CONC) && r() < rate) {
      m.t[i] = T.PUDDLE;
      if (r() < 0.5) { const j = i + 1; if (m.t[j] === t) m.t[j] = T.PUDDLE; }
      if (r() < 0.4) { const j = i + m.w; if (j < m.t.length && m.t[j] === t) m.t[j] = T.PUDDLE; }
    }
  }
}
function scooterRow(m, y, xs) { for (const x of xs) if (G.isFloorTile(m.get(x, y))) m.set(x, y, T.SCOOTER); }
function car(m, x, y, vertical) { if (vertical) { m.set(x, y, T.CAR); m.set(x, y + 1, T.CAR); } else { m.set(x, y, T.CAR); m.set(x + 1, y, T.CAR); } m.props.push({ kind: 'car', x: x, y: y, w: vertical ? 1 : 2, h: vertical ? 2 : 1, c: (x * 7 + y * 13) % 5 }); }

  g.flags.shut = 1; g.say('s2_shut'); g.ev('shutter');
}

G.bossDamageMod = function (g, z, d, sx, sy, kind) {
  if (z.bst === 'stun') return d * 1.35;
  const a = Math.atan2(sy - z.y, sx - z.x), diff = Math.abs(G.angDiff(z.face, a));
  if (kind === 'boom' || kind === 'zap' || kind === 'shock') return d * 0.6;
  if (diff < 1.15) return d * 0.18;
  if (diff > 2.05) return d * 1.65;
  return d * 0.6;
};
G.bossUpdate = function (g, z, dt) {
  if (z.dead) return;
  const Z = G.ZT.boss;
  z.hitT -= dt; z.chargeCd -= dt; z.swingCd = (z.swingCd || 0) - dt;
  // phase thresholds
  const hpf = z.hp / z.maxHp;
  if (z.phase === 0 && hpf < 0.66) { z.phase = 1; z.bst = 'roar'; z.bt = 1.6; g.ev('broar'); }
  else if (z.phase === 1 && hpf < 0.5) { z.phase = 2; g.say('s3_boss50'); }
  else if (z.phase === 2 && hpf < 0.33) { z.phase = 3; z.bst = 'roar'; z.bt = 1.6; g.ev('broar'); }
  else if (z.phase === 3 && hpf < 0.25) { z.phase = 4; z.enraged = 1; g.say('s3_boss25'); }
  // pick target: whoever is lighting him, else nearest
  let tgt = null, bd = 1e9;
  for (const p of g.players) {
    if (p.dead || p.hidden >= 0) continue;
    let d = G.d2(p.x, p.y, z.x, z.y);
    if (g.inBeam(p, z.x, z.y)) d *= 0.35;
    if (p.down) d *= 3;
    if (d < bd) { bd = d; tgt = p; }
  }
  if (tgt) z.tgt = tgt.id;
  z.windup = 0; z.charging = 0;
  const spdMul = z.enraged ? 1.35 : 1;
  switch (z.bst) {
    case 'stun':
      z.bt -= dt; if (z.bt <= 0) { z.bst = 'walk'; }
      break;
    case 'roar':
      z.bt -= dt;
      if (z.bt <= 0) {
        z.bst = 'walk';
        for (let i = 0; i < 6; i++) { const a = g.rng() * G.TAU; const x = z.x + Math.cos(a) * 3, y = z.y + Math.sin(a) * 3; if (!g.map.isSolid(x, y) && tgt) g.spawnZombie('walker', [x, y], { chase: tgt }); }
      }
      break;
    case 'swing':
      z.windup = 1; z.bt -= dt;
      if (z.bt <= 0) {
        g.ev('bswing', Math.round(z.x * 100), Math.round(z.y * 100), Math.round(z.face * 100));
        for (const p of g.players) {
          if (p.dead || p.hidden >= 0) continue;
          const d2 = G.d2(p.x, p.y, z.x, z.y); if (d2 > 2.7 * 2.7) continue;
          if (Math.abs(G.angDiff(z.face, Math.atan2(p.y - z.y, p.x - z.x))) > 1.1) continue;
          g.hurtPlayer(p, Z.dmg, z.x, z.y, 1.2);
        }
        z.bst = 'walk'; z.swingCd = 0.9;
      }
      break;
    case 'aim':
      z.windup = 1; z.bt -= dt;
      if (tgt) { const a = Math.atan2(tgt.y - z.y, tgt.x - z.x); if (z.bt > 0.35) z.face += G.angDiff(z.face, a) * Math.min(1, dt * 5); }
      if (z.bt <= 0) { z.bst = 'charge'; z.bt = 1.5; z.cdx = Math.cos(z.face); z.cdy = Math.sin(z.face); z.hitP = {}; g.ev('bcharge', 1); }
      break;
    case 'charge': {
      z.charging = 1; z.bt -= dt;
      const ox = z.x, oy = z.y, sp = 9.5 * spdMul;
      const hit = G.moveCircle(g.map, z, z.cdx * sp * dt, z.cdy * sp * dt, z.r);
      for (const p of g.players) {
        if (p.dead || p.hidden >= 0 || z.hitP[p.id]) continue;
        const rr = z.r + 0.45; if (G.d2(p.x, p.y, z.x, z.y) < rr * rr) { z.hitP[p.id] = 1; g.hurtPlayer(p, 32, z.x, z.y, 2.4); }
      }
      for (const o of g.zombies) { if (o === z || o.dead) continue; const rr = z.r + o.r; if (G.d2(o.x, o.y, z.x, z.y) < rr * rr) { g.damageZombie(o, 60, z.x, z.y, null, 'boss'); g.knock(o, z.cdx, z.cdy, 1.4); } }
      const moved = Math.hypot(z.x - ox, z.y - oy);
      if (hit && moved < sp * dt * 0.45) {
        const tx = Math.floor(z.x + z.cdx * (z.r + 0.5)), ty = Math.floor(z.y + z.cdy * (z.r + 0.5));
        const tt = g.map.get(tx, ty);
        if (tt === G.T.XFMR && g.flags.power) { z.bst = 'stun'; z.bt = 5; g.ev('bshock', Math.round(z.x * 100), Math.round(z.y * 100)); g.damageZombie(z, 220, z.x + z.cdx, z.y + z.cdy, null, 'shock'); }
        else { z.bst = 'stun'; z.bt = 2.6; g.ev('bslam', Math.round(z.x * 100), Math.round(z.y * 100)); }
        z.chargeCd = z.enraged ? 4.5 : 6.5;
        for (const p of g.players) if (!p.dead && G.d2(p.x, p.y, z.x, z.y) < 4) g.hurtPlayer(p, 10, z.x, z.y, 1);
      } else if (z.bt <= 0) { z.bst = 'walk'; z.chargeCd = z.enraged ? 4.5 : 6.5; }
      break;
    }
    default: { // walk
      if (!tgt) break;
      const d = Math.sqrt(G.d2(tgt.x, tgt.y, z.x, z.y));
      if (d < 2.4 && z.swingCd <= 0) { z.bst = 'swing'; z.bt = z.enraged ? 0.5 : 0.7; z.face = Math.atan2(tgt.y - z.y, tgt.x - z.x); g.ev('bwind'); break; }
      if (z.chargeCd <= 0 && d > 3.5 && d < 14 && G.los(g.map, z.x, z.y, tgt.x, tgt.y)) { z.bst = 'aim'; z.bt = 1.15; g.ev('bcharge', 0); break; }
      let dx, dy;
      if (G.los(g.map, z.x, z.y, tgt.x, tgt.y) && d < 8) { dx = (tgt.x - z.x) / d; dy = (tgt.y - z.y) / d; }
      else { g.pfield.dir(z.x, z.y, g._dir); dx = g._dir[0]; dy = g._dir[1]; }
      const sp = Z.chase * spdMul;
      G.moveCircle(g.map, z, dx * sp * dt, dy * sp * dt, z.r);
      if (dx || dy) z.face += G.angDiff(z.face, Math.atan2(dy, dx)) * Math.min(1, dt * 3.2);
    }
  }
};

const AI_PRIORITY = {
  fire: ['f_whirl', 'f_axe', 'f_coat', 'f_quick', 'f_rescue', 'f_charge', 'f_hose', 'a_team', 'a_med', 'f_lamp', 'f_roar', 'a_shoes', 'a_fc', 'f_barricade', 'a_eyes', 'a_hush'],
  line: ['l_rate', 'l_nail', 'l_pierce', 'l_zap', 'l_far', 'a_team', 'l_gloves', 'a_med', 'l_master', 'l_wl', 'l_bank', 'a_shoes', 'l_wl2', 'a_fc', 'a_eyes', 'a_hush'],
};
G.aiPickCard = function (g, p, cards) {
  const pr = AI_PRIORITY[p.role];
  let best = cards[0], bi = 99;
  for (const c of cards) { const i = pr.indexOf(c); if (i >= 0 && i < bi) { bi = i; best = c; } }

//  Input: keyboard + mouse, gamepad, touch twin-sticks

(function () {

          if (k === 'v') this.edges |= E.PING;
          if (this.onKey) this.onKey(k, e);

        if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab'].includes(k)) e.preventDefault();

      canvas.addEventListener('mousedown', (e) => { this.mouse.down[e.button] = true; if (e.button === 2) this.edges |= E.SKILL; if (e.button === 1) { this.edges |= E.PING; e.preventDefault(); } });

        const nub = el.querySelector('.nub');
        const upd = (t) => { const r = el.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2; let dx = (t.clientX - cx) / (r.width / 2), dy = (t.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } S.x = dx; S.y = dy; nub.style.transform = `translate(${dx * 40}px,${dy * 40}px)`; if (isR) S.active = l > 0.25; };
