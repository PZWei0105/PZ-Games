<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="竊夢者">
<title>竊夢者 DREAMTHIEF</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07060c; --lacquer:#110d18; --panel:rgba(17,13,25,.94); --panel2:rgba(26,20,37,.96);
  --gold:#d8b46a; --gold2:#f3dca0; --silver:#e3e7f6; --mute:#8d88a6; --dim:#5b5672;
  --teal:#53f0d6; --amber:#ffb24a; --red:#e8473d; --violet:#a184ff;
  --r0:#9aa0b4; --r1:#6fd18a; --r2:#5fb6ff; --r3:#b98aff; --r4:#ffc94a; --r5:#ff4d5e;
  --serif:"Noto Serif TC","Songti TC","STSong","Source Han Serif TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--silver);overflow:hidden;
  font-family:var(--sans);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}

/* ---------- 通用元件 ---------- */
.serif{font-family:var(--serif)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:46px;padding:0 1.3em;border:1px solid rgba(216,180,106,.55);border-radius:3px;
  background:linear-gradient(180deg,rgba(48,38,58,.92),rgba(22,17,30,.95));
  color:var(--gold2);font-family:var(--serif);font-size:16px;letter-spacing:.18em;
  box-shadow:inset 0 1px 0 rgba(255,235,190,.08),0 6px 18px rgba(0,0,0,.35);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(1px) scale(.985);filter:brightness(1.2)}
.btn.primary{border-color:rgba(83,240,214,.75);color:#dffff8;
  background:linear-gradient(180deg,rgba(26,74,72,.95),rgba(12,32,36,.97));
  box-shadow:0 0 22px rgba(83,240,214,.18),inset 0 1px 0 rgba(200,255,245,.15)}
.btn.danger{border-color:rgba(232,71,61,.7);color:#ffd9d4;background:linear-gradient(180deg,rgba(78,26,30,.95),rgba(34,12,16,.97))}
.btn.ghost{background:rgba(255,255,255,.03);border-color:rgba(227,231,246,.18);color:var(--silver)}
.btn.small{min-height:36px;font-size:14px;padding:0 .9em;letter-spacing:.1em}
.btn[disabled]{opacity:.38;pointer-events:none}
.gold{color:var(--gold2)} .teal{color:var(--teal)} .mute{color:var(--mute)} .red{color:#ff7d72} .amber{color:var(--amber)}
.money{font-family:var(--serif);color:var(--gold2);letter-spacing:.04em}
.money::before{content:"";display:inline-block;width:.78em;height:.78em;margin-right:.32em;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff3c8,#e6b450 45%,#8a5d1c);box-shadow:0 0 6px rgba(255,200,90,.6);vertical-align:-.05em}

/* 當票（記憶卡） */
.ticket{position:relative;display:flex;gap:12px;align-items:stretch;padding:12px 12px 12px 18px;border-radius:4px;
  background:linear-gradient(135deg,rgba(38,30,48,.96),rgba(20,15,28,.97));border:1px solid rgba(216,180,106,.22);
  box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ticket::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;border-left:2px dotted rgba(216,180,106,.35)}
.ticket .orb{flex:0 0 44px;height:44px;border-radius:50%;align-self:center;position:relative}
.ticket .body{flex:1;min-width:0}
.ticket .nm{font-family:var(--serif);font-size:16px;letter-spacing:.06em;line-height:1.3}
.ticket .fl{font-size:12.5px;color:#b5b0c9;line-height:1.5;margin-top:3px}
.ticket .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px;font-size:12px;color:var(--mute)}
.ticket .meta span{white-space:nowrap}
.ticket .acts{display:flex;flex-direction:column;gap:6px;justify-content:center}
.seal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:4px;
  font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;transform:rotate(-8deg);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 0 10px currentColor}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid rgba(255,255,255,.14);color:#c9c4dc}
.slotpips{display:flex;gap:3px}
.slotpips i{width:8px;height:10px;border-radius:2px;background:rgba(255,255,255,.18)}

/* ---------- 遊戲中 HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .pe{pointer-events:auto}
#wake{position:absolute;left:50%;top:calc(var(--sat) + 10px);transform:translateX(-50%);width:min(64vw,330px);text-align:center}
#wake .row{display:flex;align-items:center;gap:8px}
#wake svg{flex:0 0 30px;height:20px;overflow:visible}
#wake .bar{flex:1;height:10px;border-radius:6px;background:rgba(10,8,16,.78);border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}
#wake .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;
  background:linear-gradient(90deg,#5d4dd6,#a07cff 45%,#ff5d8a 80%,#ff3b30);box-shadow:0 0 12px rgba(180,120,255,.6)}
#wake .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28)}
#wake .lbl{margin-top:3px;font-family:var(--serif);font-size:12.5px;letter-spacing:.3em;color:#cfc8ec;text-shadow:0 1px 4px #000}
#wake.collapse .lbl{color:#ff8b80;font-size:15px;animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:.65}to{opacity:1}}
#hp{position:absolute;left:calc(var(--sal) + 12px);top:calc(var(--sat) + 10px);width:min(24vw,120px)}
#hp .nm{font-family:var(--serif);font-size:11px;letter-spacing:.25em;color:#c5bfdc;margin-bottom:3px;text-shadow:0 1px 3px #000}
#hp .bar{height:9px;border-radius:5px;background:rgba(10,8,16,.8);border:1px solid rgba(255,255,255,.14);overflow:hidden;position:relative}
#hp .fill{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#3fd7b8,#7af5d9);transition:width .15s}
#hp .lag{position:absolute;inset:0;width:100%;background:rgba(255,120,110,.65)}
#hp .num{font-size:11px;color:#9fe9da;margin-top:2px;text-shadow:0 1px 3px #000}
#depth{position:absolute;left:calc(var(--sal) + 12px);top:calc(var(--sat) + 62px);font-family:var(--serif);font-size:12px;letter-spacing:.22em;color:#d8cff5;text-shadow:0 1px 4px #000}
#pauseBtn{position:absolute;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 8px);width:38px;height:38px;border-radius:50%;
  background:rgba(14,11,22,.7);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
#pauseBtn i{display:block;width:3px;height:13px;background:#ddd;margin:0 2px;border-radius:1px}
#mini{position:absolute;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 54px);width:92px;height:92px;border-radius:6px;
  background:rgba(8,6,14,.62);border:1px solid rgba(255,255,255,.14)}
#radio{position:absolute;left:50%;top:calc(var(--sat) + 84px);transform:translateX(-50%);width:min(78vw,420px);
  padding:8px 12px;border-radius:4px;background:linear-gradient(180deg,rgba(14,11,22,.86),rgba(14,11,22,.72));
  border-left:2px solid var(--teal);font-size:13.5px;line-height:1.55;color:#ece8ff;opacity:0;transition:opacity .25s;text-shadow:0 1px 2px #000;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
#radio.show{opacity:1}
#radio b{font-family:var(--serif);font-weight:600;margin-right:.5em;letter-spacing:.12em}
#xp{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.5)}
#xp .fill{height:100%;width:0;background:linear-gradient(90deg,#3fd7b8,#b9fff0);box-shadow:0 0 8px #53f0d6}
#lvl{position:absolute;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 12px);font-family:var(--serif);font-size:12px;color:#aef3e4;letter-spacing:.15em;text-shadow:0 1px 3px #000}
#bag{position:absolute;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 34px);padding:7px 10px;border-radius:6px;
  background:rgba(14,11,22,.72);border:1px solid rgba(216,180,106,.35);display:flex;flex-direction:column;gap:4px;min-width:84px}
#bag .t{font-family:var(--serif);font-size:12px;letter-spacing:.15em;color:var(--gold2);display:flex;justify-content:space-between;gap:8px}
#bag .pips{display:flex;flex-wrap:wrap;gap:3px;max-width:112px}
#bag .pips i{width:9px;height:11px;border-radius:2px;background:rgba(255,255,255,.12)}
#bag .pips i.lock{outline:1px solid #fff}
#bag.full{border-color:rgba(255,120,100,.8)}
#btns{position:absolute;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 18px);width:170px;height:170px}
.rb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 50% 35%,rgba(60,48,80,.85),rgba(16,12,24,.88));border:1.5px solid rgba(255,255,255,.22);
  color:#efeaff;font-family:var(--serif);letter-spacing:.1em;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.rb .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(var(--cdc,rgba(0,0,0,.35)) calc(var(--p,0) * 1%),transparent 0)}
.rb .k{position:relative;font-size:15px}
.rb .s{position:relative;font-size:10px;color:#bdb6d6;letter-spacing:0}
.rb:active{filter:brightness(1.35)}
#bDash{right:0;bottom:0;width:78px;height:78px;border-color:rgba(83,240,214,.65)}
#bTool{right:86px;bottom:6px;width:58px;height:58px}
#bCandy{right:22px;bottom:90px;width:48px;height:48px}
#bAct{right:84px;bottom:86px;width:78px;height:78px;border-color:rgba(255,201,74,.9);background:radial-gradient(circle at 50% 35%,rgba(110,80,30,.9),rgba(40,26,8,.92));animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 6px rgba(255,201,74,.3)}to{box-shadow:0 0 22px rgba(255,201,74,.75)}}
#hint{position:absolute;left:50%;bottom:calc(var(--sab) + 130px);transform:translateX(-50%);padding:6px 12px;border-radius:14px;
  background:rgba(10,8,16,.78);border:1px solid rgba(255,255,255,.16);font-size:13px;color:#e8e3ff;white-space:nowrap;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.show{opacity:1}
#banner .a{font-family:var(--serif);font-size:30px;letter-spacing:.42em;color:#f2ecff;text-shadow:0 0 18px rgba(160,120,255,.8),0 2px 6px #000}
#banner .b{margin-top:8px;font-size:13px;letter-spacing:.5em;color:#b9b0dc}

/* ---------- 畫面（覆蓋層） ---------- */
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column}
.scrim{position:absolute;inset:0;background:rgba(5,4,9,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:relative;margin:auto;width:min(94vw,520px);max-height:calc(100% - 40px - var(--sat) - var(--sab));display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(216,180,106,.3);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet .hd{padding:16px 54px 10px 18px;border-bottom:1px solid rgba(216,180,106,.16);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sheet .hd h2{margin:0;font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.3em;color:var(--gold2)}
.sheet .hd .sub{font-size:12px;color:var(--mute);letter-spacing:.1em}
.sheet .bd{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;touch-action:pan-y}
.sheet .ft{padding:12px 16px calc(12px + var(--sab));border-top:1px solid rgba(216,180,106,.16);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;color:#cfc8ea;font-size:20px;line-height:36px;text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
.sec{font-family:var(--serif);font-size:13px;letter-spacing:.35em;color:var(--gold);margin:16px 2px 8px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(216,180,106,.4),transparent)}
.note{font-size:13px;line-height:1.7;color:#bdb7d4;text-wrap:pretty}

/* 標題 */
#title{align-items:center;justify-content:flex-end;padding-bottom:calc(9vh + var(--sab))}
#title .logo{position:absolute;left:0;right:0;top:calc(14vh + var(--sat));text-align:center;pointer-events:none}
#title .logo .cn{font-family:var(--serif);font-size:min(18vw,92px);font-weight:700;letter-spacing:.12em;color:#f4efff;
  text-shadow:0 0 30px rgba(140,110,255,.55),0 0 2px #fff,0 6px 20px #000;padding-left:.12em}
#title .logo .en{margin-top:4px;font-size:min(3.6vw,15px);letter-spacing:1.1em;color:#b8b0e0;padding-left:1.1em}
#title .logo .tl{margin-top:22px;font-family:var(--serif);font-size:min(3.9vw,16px);letter-spacing:.32em;color:#d9cfa8;opacity:.9}
#title .menu{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(78vw,300px)}
#title .menu .btn{width:100%}
#title .tap{font-family:var(--serif);letter-spacing:.6em;color:#d7cff7;font-size:15px;animation:pulse 1.2s infinite alternate;padding-left:.6em}
#title .ver{position:absolute;right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 8px);font-size:11px;color:#5d587a;letter-spacing:.1em}

/* 夜當 */
#hub{justify-content:flex-end}
#hub .top{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hub .top .place{font-family:var(--serif);letter-spacing:.4em;font-size:22px;color:#f1e3c0;text-shadow:0 0 14px rgba(255,180,80,.45),0 2px 6px #000}
#hub .top .place small{display:block;font-size:11px;letter-spacing:.3em;color:#a99b78;margin-top:2px}
#hub .top .cash{pointer-events:auto;padding:6px 12px;border-radius:16px;background:rgba(14,11,22,.75);border:1px solid rgba(216,180,106,.35);font-size:16px}
#hub .talk{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 78px);display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#hub .talk .bubble{max-width:min(80vw,420px);padding:10px 14px;border-radius:4px;background:rgba(12,9,18,.82);border-left:2px solid var(--amber);
  font-size:14px;line-height:1.65;color:#f3ecdc;box-shadow:0 6px 20px rgba(0,0,0,.4);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
#hub .talk .bubble b{font-family:var(--serif);color:var(--amber);letter-spacing:.15em;margin-right:.4em}
#hub .dock{position:relative;padding:12px 14px calc(14px + var(--sab));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  background:linear-gradient(180deg,transparent,rgba(5,4,9,.85) 30%)}
#hub .dock .go{grid-column:1/-1;min-height:58px;font-size:20px;letter-spacing:.5em}
.dockbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;border-radius:4px;
  background:linear-gradient(180deg,rgba(40,31,50,.9),rgba(18,14,26,.94));border:1px solid rgba(216,180,106,.3);position:relative}
.dockbtn .ic{font-family:var(--serif);font-size:20px;color:var(--gold2)}
.dockbtn .lb{font-size:11.5px;letter-spacing:.2em;color:#cfc6e4}
.dockbtn .dot{position:absolute;right:6px;top:6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}

/* 夢主檔案 */
.dossier{position:relative;display:flex;gap:12px;padding:14px;border-radius:5px;border:1px solid rgba(216,180,106,.25);
  background:linear-gradient(135deg,rgba(36,28,46,.95),rgba(18,13,25,.96));overflow:hidden}
.dossier.locked{opacity:.5}
.dossier.sel{border-color:var(--teal);box-shadow:0 0 0 1px rgba(83,240,214,.4),0 0 24px rgba(83,240,214,.15)}
.dossier canvas{flex:0 0 74px;height:96px;border-radius:3px}
.dossier .nm{font-family:var(--serif);font-size:18px;letter-spacing:.12em}
.dossier .who{font-size:12px;color:var(--mute);margin-top:2px}
.dossier .ds{font-size:12.5px;line-height:1.6;color:#c5bfda;margin-top:6px}
.dossier .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.contract{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:4px;background:rgba(255,255,255,.035);border:1px dashed rgba(216,180,106,.3);font-size:13px}
.loadrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x}
.pick{flex:0 0 auto;min-width:96px;padding:10px;border-radius:4px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);text-align:left}
.pick.sel{border-color:var(--teal);background:rgba(83,240,214,.08)}
.pick.off{opacity:.35}
.pick .n{font-family:var(--serif);font-size:15px;letter-spacing:.1em}
.pick .d{font-size:11px;color:var(--mute);margin-top:3px;line-height:1.45}

/* 工作台 */
.upg{display:flex;gap:12px;align-items:center;padding:12px;border-radius:4px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1)}
.upg .ic{flex:0 0 42px;height:42px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;
  color:#1a1222;background:linear-gradient(135deg,#f3dca0,#c89b4a);box-shadow:0 0 12px rgba(216,180,106,.3)}
.upg .tx{flex:1;min-width:0}
.upg .tx .n{font-family:var(--serif);font-size:15px;letter-spacing:.1em}
.upg .tx .d{font-size:12px;color:#b8b2cf;margin-top:2px;line-height:1.5}
.pipsL{display:flex;gap:3px;margin-top:5px}
.pipsL i{width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.pipsL i.on{background:var(--gold)}

/* 靈感三選一 */
#lvup{align-items:center;justify-content:center;padding:20px}
#lvup .t{font-family:var(--serif);font-size:24px;letter-spacing:.6em;color:#e9fff9;text-shadow:0 0 18px rgba(83,240,214,.7);padding-left:.6em}
#lvup .s{font-size:12px;color:#9fd8cc;letter-spacing:.3em;margin:6px 0 16px}
#lvup .cards{display:flex;flex-direction:column;gap:10px;width:min(92vw,440px)}
.card{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:5px;text-align:left;
  background:linear-gradient(135deg,rgba(30,44,52,.96),rgba(14,18,26,.97));border:1px solid rgba(83,240,214,.35);
  box-shadow:0 8px 24px rgba(0,0,0,.45);transform:translateY(14px);opacity:0;animation:cardIn .35s forwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cardIn{to{transform:none;opacity:1}}
.card .ic{flex:0 0 50px;height:50px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:26px;font-weight:700;color:#08201c;background:linear-gradient(135deg,#bffff0,#3fd7b8);box-shadow:0 0 16px rgba(83,240,214,.45)}
.card .n{font-family:var(--serif);font-size:17px;letter-spacing:.12em;color:#eafffa}

    seed,
    next() { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; },

/* 收集要排序的物件 */
function collectDrawables(vx0, vx1, vy0, vy1) {
  const out = [], m = W.m, p0 = W.players[0];
  const inView = (x, y, pad = 2) => x > (vx0 - pad) * T && x < (vx1 + pad) * T && y > (vy0 - pad) * T && y < (vy1 + pad) * T;
  const visAt = (x, y) => { const tx = Math.floor(x / T), ty = Math.floor(y / T); if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return false; return W.vis[ty * m.w + tx] === 1; };
  const seenAt = (x, y) => { const tx = Math.floor(x / T), ty = Math.floor(y / T); if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return false; return W.seen[ty * m.w + tx] === 1; };
  for (const c of m.containers) if (inView(c.x, c.y) && seenAt(c.x, c.y)) out.push({ y: (c.ty + 1) * T - 4, f: ctx => drawContainer(ctx, c) });
  for (const d of m.decor) if (inView(d.x, d.y) && seenAt(d.x, d.y)) out.push({ y: d.k === 'rug' || d.k === 'papers' || d.k === 'puddle' ? d.y - 40 : d.y, f: ctx => drawDecor(ctx, d) });
  for (const e of m.exits) if (inView(e.x, e.y, 3) && seenAt(e.x, e.y)) out.push({ y: e.type === 'stairs' ? e.y - 40 : e.y - 10, f: ctx => drawExit(ctx, e) });
  for (const mi of m.mirrors) if (inView(mi.x, mi.y) && seenAt(mi.x, mi.y)) out.push({ y: mi.y - 1, f: ctx => drawMirror(ctx, mi) });
  for (const c of m.cams) if (inView(c.x, c.y) && seenAt(c.x, c.y + 10)) out.push({ y: c.y - 2, f: ctx => drawCam(ctx, c) });
  if (W.bags) for (const g of W.bags) if (!g.dead && inView(g.x, g.y)) out.push({ y: g.y, f: ctx => drawIVBag(ctx, g) });
  for (const k of W.picks) if (inView(k.x, k.y) && (visAt(k.x, k.y) || dist(k.x, k.y, p0.x, p0.y) < 1.5 * T)) out.push({ y: k.y, f: ctx => drawPick(ctx, k) });
  for (const d of W.decoys) if (inView(d.x, d.y)) out.push({ y: d.y, f: ctx => drawDecoy(ctx, d) });
  for (const e of W.foes) {
    if (!inView(e.x, e.y, 3)) continue;
    if (!e.boss && !visAt(e.x, e.y) && dist(e.x, e.y, p0.x, p0.y) > 1.6 * T) continue;
    if (e.boss && !seenAt(e.x, e.y)) continue;
    if (e.dead) continue;
    out.push({ y: e.y, f: ctx => drawFoe(ctx, e) });
  }
  if (W.ferry && !W.ferry.gone && inView(W.ferry.x, W.ferry.y) && visAt(W.ferry.x, W.ferry.y)) out.push({ y: W.ferry.y, f: ctx => drawFerry(ctx, W.ferry) });
  if (W.qing && !W.qing.carried && inView(W.qing.x, W.qing.y)) out.push({ y: W.qing.y, f: ctx => drawQing(ctx, W.qing.x, W.qing.y, false) });
  for (const f of W.fx) if (f.k === 'dissolve' || f.k === 'ghost' || f.k === 'smear') out.push({ y: f.y, f: ctx => drawFxSprite(ctx, f) });
  for (const p of W.players) if (p.state === 'alive' || p.state === 'out') out.push({ y: p.y, f: ctx => drawPlayer(ctx, p) });
  return out;
}

/* ---------- 光影 ---------- */
function renderLight(ox, oy, z) {
  const l = R.lctx, ls = R.ls, th = W.ch.th, p = W.players[0];
  l.setTransform(1, 0, 0, 1, 0, 0);
  l.globalCompositeOperation = 'source-over';
  let amb = th.amb;
  if (W.stage >= 2) amb = mixHex(amb, '#4a1830', (W.stage - 1) * .18);
  if (W.collapse) amb = mixHex(amb, '#5a0f1a', .35 + .15 * Math.sin(R.t * 6));
  l.fillStyle = amb; l.fillRect(0, 0, R.lcv.width, R.lcv.height);
  l.setTransform(ls * z, 0, 0, ls * z, ox * ls, oy * ls);
  l.globalCompositeOperation = 'lighter';
  const m = W.m;
  // 房間燈
  for (const L of m.lights) {
    const rm = m.rooms[L.room]; if (!rm) continue;
    const ck = Math.floor(L.y / T) * m.w + Math.floor(L.x / T); if (!W.seen[ck]) continue;
    let I = .95;
    if (L.flick) { const f = Math.sin(R.t * 13 + L.ph) + Math.sin(R.t * 31 + L.ph * 2); if (f > 1.55 * (1 - L.flick * .3)) I = .2; }
    if (W.collapse) I *= .6 + .4 * Math.sin(R.t * 9 + L.ph);
    l.save(); l.beginPath(); l.rect((rm.x - .5) * T, (rm.y - 1.5) * T, (rm.w + 1) * T, (rm.h + 1.8) * T); l.clip();
    l.globalAlpha = I; l.drawImage(glow(L.c), L.x - L.r, L.y - L.r, L.r * 2, L.r * 2); l.globalAlpha = 1;
    l.restore();
  }
  // 夢燈（陰影）
  if (W.visPoly.length) {
    const R0 = 7.6 * T * p.st.lantern;
    l.save(); l.beginPath(); const vp = W.visPoly; l.moveTo(vp[0], vp[1]); for (let i = 2; i < vp.length; i += 2) l.lineTo(vp[i], vp[i + 1]); l.closePath(); l.clip();
    const g = l.createRadialGradient(p.x, p.y - 20, 10, p.x, p.y - 20, R0);
    g.addColorStop(0, rgba('#fff0d8', 1)); g.addColorStop(.28, rgba('#ffe1b4', .85)); g.addColorStop(.6, rgba('#b8a2d8', .34)); g.addColorStop(1, rgba('#000', 0));
    l.fillStyle = g; l.fillRect(p.x - R0, p.y - 20 - R0, R0 * 2, R0 * 2);
    l.restore();
  }
  l.globalAlpha = .55; l.drawImage(glow('#ffd8a0'), p.x - 70, p.y - 90, 140, 140); l.globalAlpha = 1;
  // 視野錐
  for (const e of W.foes) {
    if (e.dead || e.type !== 'watcher' || e.state === 'sleep' || e.spawn > 0) continue;
    if (dist(e.x, e.y, p.x, p.y) > 14 * T) continue;
    const col = e.state === 'alert' ? '#ff5a5a' : e.aw > .05 ? mixHex('#ffe39a', '#ff7a3a', clamp(e.aw, 0, 1)) : '#ffe39a';
    coneLight(l, e.x, e.y - 30, e.face, FOES.watcher.fov, FOES.watcher.cone * T, col, e.state === 'alert' ? .5 : .62);
  }
  for (const c of m.cams) if (!c.dead && c.a != null && dist(c.x, c.y, p.x, p.y) < 14 * T) coneLight(l, c.x, c.y + 10, c.a, .42, 6.2 * T, c.aware > .05 ? mixHex('#9fd4ff', '#ff4a4a', clamp(c.aware, 0, 1)) : '#9fd4ff', .5);
  // 出口
  for (const e of m.exits) {
    const ck = Math.floor(e.y / T) * m.w + Math.floor(e.x / T); if (!W.seen[ck]) continue;
    const c = e.type === 'bell' ? '#ffc070' : e.type === 'window' ? '#b8d8ff' : '#b394ff', r = e.type === 'window' ? 3.4 * T : 2.6 * T;
    const off = (e.type === 'bell' && W.collapse && W.finalPhase < 2) ? .25 : 1;
    l.globalAlpha = (.7 + .15 * Math.sin(R.t * 2)) * off; l.drawImage(glow(c), e.x - r, e.y - r * .7, r * 2, r * 2); l.globalAlpha = 1;
  }
  // 發光物
  for (const k of W.picks) if (k.k === 'mem') { const c = RAR[k.item.rar].c, r = 50 + k.item.rar * 22; l.globalAlpha = .8; l.drawImage(glow(c), k.x - r, k.y - 20 - r, r * 2, r * 2); l.globalAlpha = 1; }
  for (const L of W.tl) { const a = (1 - L.t / L.life) * (L.i || 1); l.globalAlpha = a; l.drawImage(glow(L.c), L.x - L.r, L.y - L.r, L.r * 2, L.r * 2); l.globalAlpha = 1; }
  for (const b of W.bullets) { l.drawImage(glow('#ffd59a'), b.x - 28, b.y - 46, 56, 56); }
  for (const b of W.ebul) { l.drawImage(glow(b.c), b.x - 34, b.y - 52, 68, 68); }
  for (const d of W.decoys) { const r = 70 + 30 * Math.sin(R.t * 8); l.drawImage(glow('#53f0d6'), d.x - r, d.y - r, r * 2, r * 2); }
  if (W.ferry && !W.ferry.gone) l.drawImage(glow('#ffcf7a'), W.ferry.x - 90, W.ferry.y - 130, 180, 180);
  if (W.qing && !W.qing.carried) l.drawImage(glow('#ff8f8f'), W.qing.x - 120, W.qing.y - 120, 240, 240);
  for (const e of W.foes) if (!e.dead && (e.boss ? e.awake || dist(e.x, e.y, p.x, p.y) < 8 * T : e.type === 'eel' || e.type === 'cocoon' || e.burnT > 0)) { const c = e.burnT > 0 ? '#ff9a4a' : W.ch.th.foe.glow, r = e.boss ? 200 : 60; l.globalAlpha = e.boss ? .55 : .5; l.drawImage(glow(c), e.x - r, e.y - 40 - r, r * 2, r * 2); l.globalAlpha = 1; }
  if (W.bags) for (const g of W.bags) if (!g.dead) l.drawImage(glow('#bff6ff'), g.x - 60, g.y - 90, 120, 120);
  for (const mi of m.mirrors) if (!mi.broken) { const ck = Math.floor(mi.y / T) * m.w + Math.floor(mi.x / T); if (W.seen[ck]) { l.globalAlpha = .45; l.drawImage(glow('#bff6ff'), mi.x - 60, mi.y - 60, 120, 120); l.globalAlpha = 1; } }
  l.globalCompositeOperation = 'source-over';
}
function coneLight(l, x, y, a, fov, len, col, alpha) {
  const N = 18;
  l.save(); l.beginPath(); l.moveTo(x, y);
  for (let i = 0; i <= N; i++) { const aa = a - fov + 2 * fov * i / N; const d = rayDist(x, y + 20, aa, len); l.lineTo(x + Math.cos(aa) * d, y + 20 + Math.sin(aa) * d); }
  l.closePath(); l.clip();
  const g = l.createRadialGradient(x, y, 4, x, y, len);
  g.addColorStop(0, rgba(col, alpha)); g.addColorStop(.6, rgba(col, alpha * .45)); g.addColorStop(1, rgba(col, 0));
  l.fillStyle = g; l.fillRect(x - len, y - len, len * 2, len * 2);
  l.restore();
}

    else if (f.k === 'boom') { ctx.globalAlpha = 1 - k; ctx.drawImage(glow('#ffb06a'), f.x - f.r * 1.3, f.y - 20 - f.r * 1.3, f.r * 2.6, f.r * 2.6); ctx.globalAlpha = 1; }

    <div class="bd">${body}</div>${foot != null ? `<div class="ft">${foot}</div>` : ''}${opt.noX ? '' : '<button class="x" data-x>✕</button>'}</div>`;
  $('#ui').appendChild(s);
  const x = s.querySelector('[data-x]'); if (x) x.onclick = () => { AU.sfx('ui'); closeSheet(id); opt.onClose && opt.onClose(); };
  if (!opt.noScrim) s.querySelector('.scrim').onclick = () => { if (opt.modal) return; closeSheet(id); opt.onClose && opt.onClose(); };
  AU.sfx('uiOpen');
  return s;
}
function closeSheet(id) { const s = document.getElementById(id); if (s) s.remove(); }
function confirmBox(title, text, yes, no, onYes, danger) {
  const s = sheet('confirm', title, '', `<div class="note">${text}</div>`, `<button class="btn ghost" data-n>${no}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-y>${yes}</button>`, { modal: true });
  s.querySelector('[data-n]').onclick = () => closeSheet('confirm');
  s.querySelector('[data-y]').onclick = () => { closeSheet('confirm'); onYes(); };
}

  /* 當鋪：賣、留、買回 */
  pawn() {
    const pend = G.pending, sold = G.sold;
    const cheap = pend.filter(i => i.rar <= 1 && i.kind === 'gen');
    let body = `<div class="note">每一段記憶都可以「賣」換錢，或「留」進記憶匣。人生記憶集滿一組，會解鎖那個人的故事。</div>`;

    if (!pend.length) body += `<div class="note mute">櫃台上沒有東西。</div>`;
    else {
      if (cheap.length > 1) body += `<button class="btn small ghost" data-bulk style="margin-bottom:10px">碎憶、淡憶全部賣掉（+${fmt(cheap.reduce((s, i) => s + sellPrice(i), 0))}）</button>`;
      body += `<div class="list">` + pend.map(it => ticket(it, `<button class="btn small" data-sell="${it.id}">賣 ${fmt(sellPrice(it))}</button><button class="btn small ghost" data-keep="${it.id}">留</button>`)).join('') + `</div>`;
    }
    if (sold.length) {
      body += `<div class="sec">回購櫃</div><div class="note">人生記憶這類東西，夜當會替你收在後面的櫃子，隨時能買回來。價錢是三倍。</div><div class="list" style="margin-top:8px">`;
      body += sold.map(it => ticket(it, `<button class="btn small" data-buy="${it.id}" ${G.money < it.val * 3 ? 'disabled' : ''}>買回 ${fmt(it.val * 3)}</button>`)).join('') + `</div>`;
    }
    const s = sheet('pawn', '當鋪', `<span class="money">${fmt(G.money)}</span>`, body, null, { onClose: () => UI.hub([]) });
    const doSell = (it) => {
      G.pending = G.pending.filter(x => x.id !== it.id);
      G.money += sellPrice(it); G.stats.earned += sellPrice(it);
      if (it.kind !== 'gen') G.sold.push(it);
      AU.sfx('sell'); saveGame(); UI.pawn();
    };
    s.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
      const it = G.pending.find(x => x.id === b.dataset.sell); if (!it) return;
      if (it.kind === 'qing') confirmBox('要賣嗎？', `「${esc(it.n)}」<br><br><span class="mute">……我盯著它看了很久。</span><br><br>賣掉的話，之後要用三倍價錢（${fmt(it.val * 3)}）才買得回來。`, '賣', '不賣了', () => doSell(it));
      else if (it.kind === 'life') confirmBox('要賣嗎？', `「${esc(it.n)}」是${esc(CH[it.ch].dreamer)}人生的一部分。集滿一組才看得到${heOf(CH[it.ch])}的故事。<br>賣掉的話，之後要用三倍價錢才買得回來。`, '賣', '不賣了', () => doSell(it));
      else doSell(it);
    });
    s.querySelectorAll('[data-keep]').forEach(b => b.onclick = () => {
      const it = G.pending.find(x => x.id === b.dataset.keep); if (!it) return;
      G.pending = G.pending.filter(x => x.id !== it.id); G.archive.push(it); AU.sfx('keep');
      const before = Object.keys(G.perks).length; refreshPerks();
      if (Object.keys(G.perks).length > before && it.kind === 'life') { const ch = CH[it.ch]; toast(`集滿了「${ch.life.set}」：${ch.life.perk.n}`, 'gold'); }
      saveGame(); UI.pawn();
    });
    const bulk = s.querySelector('[data-bulk]'); if (bulk) bulk.onclick = () => { let sum = 0; for (const it of cheap) { sum += sellPrice(it); } G.pending = G.pending.filter(x => !cheap.includes(x)); G.money += sum; G.stats.earned += sum; AU.sfx('sell'); saveGame(); UI.pawn(); };
    s.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      const it = G.sold.find(x => x.id === b.dataset.buy); if (!it || G.money < it.val * 3) return;
      G.money -= it.val * 3; G.sold = G.sold.filter(x => x.id !== it.id); G.archive.push(it); refreshPerks(); AU.sfx('buy'); saveGame(); toast('買回來了：' + it.n, 'good'); UI.pawn();
    });
  },

  /* 記憶匣 */
  archive(tab) {
    tab = tab ?? (UI._atab || 0); UI._atab = tab;
    const ch = CH[tab];
    const tabs = CH.map((c, i) => `<button class="btn small ${i === tab ? 'primary' : 'ghost'}" data-tab="${i}" style="padding:0 .6em">${i === 4 ? '晴' : c.nick}</button>`).join('');
    let body = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">${tabs}</div>`;
    const kept = G.archive.filter(i => i.ch === tab);
    if (tab < 4) {
      const core = G.archive.find(i => i.key === 'core_' + ch.id);
      body += `<div class="sec">核心記憶</div>` + (core ? ticket(core, `<button class="btn small ghost" data-replay="${tab}">重看</button>`) : `<div class="note mute">還沒拿到。在${esc(ch.dreamer)}的夢核，由心魔看守。</div>`);
      body += `<div class="sec">人生記憶・${esc(ch.life.set)}</div><div class="list">`;
      ch.life.items.forEach((x, i) => { const it = G.archive.find(a => a.key === ch.id + '_life' + i); body += it ? ticket(it) : `<div class="ticket" style="opacity:.45"><div class="orb" style="background:#1a1622;border:1px dashed #555"></div><div class="body"><div class="nm">？？？</div><div class="fl">在深眠以下的櫃子裡。</div></div></div>`; });
      body += `</div>`;
      const done = G.perks[ch.id];
      body += done ? `<div class="sec">夢語</div><div class="note" style="white-space:pre-wrap;color:#e8e2d4">${esc(ch.life.story)}</div><div class="note gold" style="margin-top:8px">永久加成「${ch.life.perk.n}」：${ch.life.perk.d}</div>` : `<div class="note mute" style="margin-top:8px">集滿四段，會看見${esc(ch.dreamer)}的故事，並得到永久加成「${ch.life.perk.n}」。</div>`;
      const q = ch.qing || null;
      const qs = (ch.qingSet || (q ? [q] : [])).map(x => G.archive.find(a => a.key === x.key)).filter(Boolean);
      if (qs.length) body += `<div class="sec">不是${esc(ch.nick)}的東西</div><div class="list">` + qs.map(it => ticket(it)).join('') + `</div>`;
    } else {
      const n = qingKept();
      body += `<div class="sec">那一夜</div><div class="note">${CH.slice(0, 4).map((c, i) => G.chapters[i].core ? `<span class="gold">「${c.core.n}」</span>` : '<span class="mute">「？？？」</span>').join('　')}</div>`;
      body += `<div class="sec">晴的記憶（${n}/5）</div><div class="list">`;
      QING.forEach(q => { const it = G.archive.find(a => a.key === q.key); body += it ? ticket(it) : `<div class="ticket" style="opacity:.4"><div class="orb" style="background:#1a1622;border:1px dashed #555"></div><div class="body"><div class="nm">？？？</div></div></div>`; });
      body += `</div>`;
      if (G.endings.length) body += `<div class="sec">結局</div><div class="note">${G.endings.map(k => '「' + ENDINGS[k].n + '」').join('、')}</div>`;
    }
    const others = kept.filter(i => i.kind === 'gen');
    if (others.length) body += `<div class="sec">收著的記憶（${others.length}）</div><div class="list">` + others.map(it => ticket(it, `<button class="btn small ghost" data-sellk="${it.id}">賣 ${fmt(sellPrice(it))}</button>`)).join('') + `</div>`;
    const s = sheet('arch', '記憶匣', `${G.archive.length} 段`, body, null, { onClose: () => UI.hub([]) });
    s.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { AU.sfx('ui'); UI.archive(+b.dataset.tab); });
    s.querySelectorAll('[data-replay]').forEach(b => b.onclick = () => { const c = CH[+b.dataset.replay]; UI.playScene(c.core, () => UI.archive()); });
    s.querySelectorAll('[data-sellk]').forEach(b => b.onclick = () => { const it = G.archive.find(x => x.id === b.dataset.sellk); if (!it) return; G.archive = G.archive.filter(x => x.id !== it.id); G.money += sellPrice(it); G.stats.earned += sellPrice(it); AU.sfx('sell'); saveGame(); UI.archive(); });
  },

  /* 工作台 */
  workshop() {
    const lvPips = (l, m) => `<div class="pipsL">${Array.from({ length: m }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('')}</div>`;
    let body = `<div class="sec">夢器</div><div class="list">`;
    for (const id of WEAPON_ORDER) {
      const w = WEAPONS[id], st = G.weapons[id];
      let act;
      if (!st.owned) act = `<button class="btn small" data-wu="${id}" ${G.money < w.cost ? 'disabled' : ''}>解鎖 ${fmt(w.cost)}</button>`;
      else if (st.lvl < 5) act = `<button class="btn small" data-wl="${id}" ${G.money < WEAPON_LV_COST[st.lvl] ? 'disabled' : ''}>升級 ${fmt(WEAPON_LV_COST[st.lvl])}</button>`;
      else act = `<span class="gold" style="font-size:12px">滿級</span>`;
      body += `<div class="upg"><div class="ic">${w.n[0]}</div><div class="tx"><div class="n">${w.n} <span class="mute" style="font-size:11px">${w.en}</span></div><div class="d">${w.d}<br><span class="mute">3 級：${w.lv3}・5 級：${w.lv5}</span></div>${st.owned ? lvPips(st.lvl, 5) : ''}</div>${act}</div>`;
    }
    body += `</div><div class="sec">夢具</div><div class="list">`;
    for (const id of TOOL_ORDER) {
      const t = TOOLS[id], own = G.tools[id];
      body += `<div class="upg"><div class="ic">${t.n[0]}</div><div class="tx"><div class="n">${t.n}</div><div class="d">${t.d}${t.cd ? `（冷卻 ${t.cd} 秒）` : ''}</div></div>${own ? '<span class="mute" style="font-size:12px">已有</span>' : `<button class="btn small" data-tu="${id}" ${G.money < t.cost ? 'disabled' : ''}>解鎖 ${fmt(t.cost)}</button>`}</div>`;
    }
    body += `</div><div class="sec">身體與裝備</div><div class="list">`;
    for (const id of META_ORDER) {
      const m = META[id], l = G.meta[id];
      body += `<div class="upg"><div class="ic">${m.ic}</div><div class="tx"><div class="n">${m.n}</div><div class="d">${m.d(l)}${l < m.max ? `<br><span class="mute">下一級：${m.d(l + 1)}</span>` : ''}</div>${lvPips(l, m.max)}</div>${l < m.max ? `<button class="btn small" data-mu="${id}" ${G.money < m.cost[l] ? 'disabled' : ''}>${fmt(m.cost[l])}</button>` : '<span class="gold" style="font-size:12px">滿級</span>'}</div>`;
    }
    const maxC = 3 + G.meta.candy * 2;
    body += `</div><div class="sec">醒神糖</div><div class="upg"><div class="ic">糖</div><div class="tx"><div class="n">醒神糖 × ${G.candyStock}</div><div class="d">潛入時吃一顆回 45 生命。每次最多帶 ${maxC} 顆；迷失的話，帶進去的會掉光。</div></div><button class="btn small" data-candy ${G.money < CANDY_PRICE ? 'disabled' : ''}>買 ${CANDY_PRICE}</button></div>`;

      body += `<div class="dossier ${st.unlocked ? '' : 'locked'} ${i === sel ? 'sel' : ''}" data-ch="${i}"><canvas width="148" height="192"></canvas><div style="flex:1;min-width:0">
        <div class="nm">${st.unlocked ? esc(c.title) : '？？？'}</div><div class="who">${st.unlocked ? esc(c.who) : '還沒有人留下委託'}</div>
        ${st.unlocked ? `<div class="ds">${esc(c.desc)}</div><div class="ds" style="color:#c9b6ff">蛾：「${esc(c.moth)}」</div>
        <div class="st"><span class="tag">夢的規則：${esc(c.rule.n)}</span>${i < 4 ? `<span class="tag" style="${st.core ? 'color:#ff8a94;border-color:#ff8a94' : ''}">核心記憶 ${st.core ? '✓' : '—'}</span><span class="tag">人生記憶 ${lifeN}/4</span>` : ''}${st.best >= 0 ? `<span class="tag">最深：${['淺眠', '深眠', '夢核'][st.best]}</span>` : ''}</div>` : ''}

    body += `<div class="sec">夢器</div><div class="loadrow">` + WEAPON_ORDER.map(id => `<button class="pick ${G.loadout.weapon === id ? 'sel' : ''} ${G.weapons[id].owned ? '' : 'off'}" data-w="${id}"><div class="n">${WEAPONS[id].n}</div><div class="d">${G.weapons[id].owned ? 'Lv ' + G.weapons[id].lvl : '工作台解鎖'}</div></button>`).join('') + `</div>`;
    body += `<div class="sec">夢具</div><div class="loadrow">` + TOOL_ORDER.map(id => `<button class="pick ${G.loadout.tool === id ? 'sel' : ''} ${G.tools[id] ? '' : 'off'}" data-t="${id}"><div class="n">${TOOLS[id].n}</div><div class="d">${G.tools[id] ? (TOOLS[id].cd ? '冷卻 ' + TOOLS[id].cd + ' 秒' : '一次') : '工作台解鎖'}</div></button>`).join('') + `</div>`;
    body += `<div class="sec">醒神糖</div><div style="display:flex;align-items:center;gap:12px"><button class="btn small ghost" data-c="-1">−</button><span class="serif" style="font-size:18px">${G.loadout.candies}</span><button class="btn small ghost" data-c="1">＋</button><span class="mute" style="font-size:12px">庫存 ${G.candyStock}・最多帶 ${3 + G.meta.candy * 2}</span></div>`;
    const s = sheet('prep', '入夢', '選一個夢主', body, `<button class="btn primary" data-go style="flex:1">潛入${esc(c.dreamer)}的夢</button>`, { wide: true });
    s.querySelectorAll('.dossier canvas').forEach((cv, i) => drawDreamerCard(cv, i));
    s.querySelectorAll('[data-ch]').forEach(d => d.onclick = () => { const i = +d.dataset.ch; if (!G.chapters[i].unlocked) { toast('還沒有這個人的委託', 'bad'); return; } G.sel = i; AU.sfx('ui'); const sc = s.querySelector('.bd').scrollTop; UI.prep(); $('#prep .bd').scrollTop = sc; });
    s.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const id = b.dataset.w; if (!G.weapons[id].owned) { toast('在工作台解鎖', 'bad'); return; } G.loadout.weapon = id; AU.sfx('ui'); const sc = s.querySelector('.bd').scrollTop; UI.prep(); $('#prep .bd').scrollTop = sc; });
    s.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const id = b.dataset.t; if (!G.tools[id]) { toast('在工作台解鎖', 'bad'); return; } G.loadout.tool = id; AU.sfx('ui'); const sc = s.querySelector('.bd').scrollTop; UI.prep(); $('#prep .bd').scrollTop = sc; });

  /* ---------- 遊戲中 ---------- */
  hudInit() {
    const p = W.players[0];
    $('#bTool .k').textContent = TOOLS[p.tool.id].n;
    UI._hud = {};
    let bb = $('#bossbar'); if (bb) bb.remove(); $('#mini').style.visibility = ''; $('#radio').style.top = '';
  },
  hud(dt) {
    if (!W) return;
    const p = W.players[0], h = UI._hud || (UI._hud = {});
    const set = (k, v, fn) => { if (h[k] !== v) { h[k] = v; fn(v); } };
    set('hp', Math.ceil(p.hp) + '/' + p.hpMax, () => { $('#hp .fill').style.width = (p.hp / p.hpMax * 100) + '%'; $('#hp .num').textContent = Math.ceil(p.hp) + ' / ' + p.hpMax; });
    h.lag = lerp(h.lag ?? 1, p.hp / p.hpMax, Math.min(1, dt * 2.5)); $('#hp .lag').style.width = (h.lag * 100) + '%';
    const wk = Math.round(W.wake * 2) / 2;
    set('wake', wk + ':' + (W.collapse ? Math.ceil(W.collapse) : 0), () => {
      $('#wake .fill').style.width = W.wake + '%';
      const lbl = W.collapse ? `夢崩　${Math.ceil(W.collapse)}` : ['熟睡', '淺睡', '輾轉', '將醒'][W.stage];
      $('#wake .lbl').textContent = lbl; $('#wake').classList.toggle('collapse', !!W.collapse);
      const o = clamp(W.wake / 100, 0, 1); $('#eyeLid').setAttribute('d', `M1 10 Q15 ${10 - o * 9} 29 10 Q15 ${10 + o * 9} 1 10Z`); $('#eyePup').setAttribute('r', (o * 4.2).toFixed(2));
    });
    set('depth', W.depth + W.ch.dreamer, () => $('#depth').textContent = W.ch.nick + '・' + ['淺眠', '深眠', '夢核'][W.depth]);
    const used = bagUsed(p);
    set('bag', used + '/' + p.cap + ':' + p.bag.map(i => i.rar + (i.pocket ? 'p' : '')).join(','), () => {
      $('#bag .c').textContent = used + '/' + p.cap; $('#bag').classList.toggle('full', used >= p.cap);
      let pips = ''; for (const it of p.bag) for (let k = 0; k < it.size; k++) pips += `<i class="${it.pocket ? 'lock' : ''}" style="background:${RAR[it.rar].c}"></i>`; for (let k = used; k < p.cap; k++) pips += '<i></i>';
      $('#bag .pips').innerHTML = pips;
      if (p.carry) $('#bag .c').textContent = '背著晴';
    });
    set('lvl', p.lvl + ':' + p.xp, () => { $('#lvl').textContent = 'Lv ' + p.lvl; $('#xp .fill').style.width = (p.xp / xpNeed(p.lvl) * 100) + '%'; });
    set('dash', p.dash + ':' + p.dashMax, () => $('#bDash .s').textContent = p.dashMax > 1 ? '×' + p.dash : '');
    set('candy', p.candies, () => { $('#bCandy .s').textContent = p.candies; $('#bCandy').style.opacity = p.candies ? 1 : .45; });
    const tl = p.tool.id === 'incense' ? (p.tool.uses ? '' : '用完') : p.tool.cd > 0 ? Math.ceil(p.tool.cd) + '' : '';
    set('tool', tl, v => $('#bTool .s').textContent = v);
    cdSweep($('#bDash .cd'), p.dash < p.dashMax && p.dashCd > 0 ? p.dashCd / (3 * p.st.dashCd) : 0, p.dash <= 0);
    cdSweep($('#bTool .cd'), p.tool.cd > 0 ? p.tool.cd / TOOLS[p.tool.id].cd : (p.tool.id === 'incense' && !p.tool.uses ? 1 : 0), true);
    const act = p.act ? p.act.label : '';
    set('act', act, v => { const b = $('#bAct'); b.classList.toggle('hidden', !v); $('#bAct .k').textContent = v; });
    // 頭目血條
    const b = W.boss;
    if (b && b.awake && !b.dead) {
      let bb = $('#bossbar');
      if (!bb) { bb = el('div', '', `<div style="font-family:var(--serif);letter-spacing:.3em;font-size:13px;color:#ffb3ba;text-align:center;text-shadow:0 1px 4px #000">${esc(W.ch.boss.n)}</div><div style="height:7px;background:rgba(0,0,0,.6);border:1px solid rgba(255,120,130,.5);border-radius:4px;overflow:hidden;margin-top:3px"><div class="f" style="height:100%;background:linear-gradient(90deg,#ff3b4f,#ff9aa4);width:100%"></div></div>`); bb.id = 'bossbar'; bb.style.cssText = 'position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 62px);width:min(70vw,360px);pointer-events:none'; $('#hud').appendChild(bb); $('#radio').style.top = 'calc(var(--sat) + 114px)'; }
      bb.querySelector('.f').style.width = (b.hp / b.hpMax * 100) + '%'; $('#mini').style.visibility = 'hidden';
    } else { const bb = $('#bossbar'); if (bb) { bb.remove(); $('#radio').style.top = ''; $('#mini').style.visibility = ''; } }
    AU.setTension(W.collapse ? 4 : W.stage + (p.hp < p.hpMax * .3 ? 1 : 0));
  },
  hint(text, dur = 3) { const h = $('#hint'); h.textContent = text; h.classList.add('show'); clearTimeout(UI._hint); UI._hint = setTimeout(() => h.classList.remove('show'), dur * 1000); },
  banner(a, b, boss) { const bn = $('#banner'); bn.querySelector('.a').textContent = a; bn.querySelector('.b').textContent = b || ''; bn.querySelector('.a').style.color = boss ? '#ffd0d4' : ''; bn.classList.add('show'); clearTimeout(UI._bn); UI._bn = setTimeout(() => bn.classList.remove('show'), 2600); },
  fadeTo(fn) {
    let f = $('#fade'); if (!f) { f = el('div'); f.id = 'fade'; f.style.cssText = 'position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s;pointer-events:none;z-index:40'; $('#app').appendChild(f); }

    setTimeout(() => { try { fn(); } catch (e) { console.error(e); } setTimeout(() => { f.style.opacity = 0; f.style.pointerEvents = 'none'; }, 80); }, 380);
  },
  pause() {
    if (S.mode !== 'dive' || !W || W.out) return;
    S.paused = true;
    const s = sheet('pause', '暫停', W.ch.title, `<div class="list">
      <button class="btn primary" data-r>繼續</button>
      <button class="btn" data-b>背包與保險格</button>
      <button class="btn danger" data-w>緊急甦醒（只留保險格）</button>

    s.querySelector('[data-w]').onclick = () => confirmBox('緊急甦醒', '馬上醒來。背包裡只有保險格裡的東西帶得走，其他的會留在夢裡。', '醒來', '取消', () => { closeSheet('pause'); S.paused = false; extract(W.players[0], 'wake'); }, true);
  },
  bag() {
    if (!W) return;
    S.paused = true;
    const p = W.players[0];
    const used = bagUsed(p), pu = pocketUsed(p);
    let body = `<div class="note">放進<b class="gold">保險格</b>的記憶，就算迷失也帶得走（保險格 ${pu}/${p.pocketCap}）。丟掉的記憶會留在地上。</div><div class="bagGrid" style="margin-top:10px">`;
    if (!p.bag.length) body += `<div class="note mute">背包是空的。</div>`;
    const sorted = p.bag.slice().sort((a, b) => (b.pocket - a.pocket) || b.rar - a.rar);
    for (const it of sorted) body += `<div class="itemrow"><div class="orb" style="${orbStyle(it.rar)}"></div><div class="tx"><div class="n" style="color:${mixHex(RAR[it.rar].c, '#fff', .3)}">${it.pocket ? '<span class="tag" style="border-color:#53f0d6;color:#53f0d6;margin-right:4px">保險</span>' : ''}${esc(it.n)}</div><div class="m">${RAR[it.rar].n}・${it.size} 格${it.val ? '・' + fmt(it.val) : ''}</div></div>
      <button class="btn small ${it.pocket ? 'primary' : 'ghost'}" data-pk="${it.id}" ${!it.pocket && pu + it.size > p.pocketCap ? 'disabled' : ''}>${it.pocket ? '取出' : '保險'}</button><button class="btn small ghost" data-dr="${it.id}">丟</button></div>`;
    body += `</div>`;
    const s = sheet('bagS', '背包', `${used}/${p.cap} 格`, body, null, { onClose: () => S.paused = false });
    s.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { const it = p.bag.find(x => x.id === b.dataset.pk); if (!it) return; if (!it.pocket && pocketUsed(p) + it.size > p.pocketCap) return; it.pocket = !it.pocket; AU.sfx('ui'); UI.bag(); });
    s.querySelectorAll('[data-dr]').forEach(b => b.onclick = () => { const it = p.bag.find(x => x.id === b.dataset.dr); if (!it) return; p.bag = p.bag.filter(x => x !== it); it.pocket = false; W.picks.push({ k: 'mem', x: p.x + fx(-20, 20), y: p.y + 24, z: 0, vz: null, vx: 0, vy: 0, t: 0, item: it, beam: 1, ign: W.t + 2 }); AU.sfx('drop', it.rar); UI.bag(); });
  },
  openSwap(p, k) {
    UI.swapOpen = true; S.paused = true;
    const it = k.item, sel = new Set();
    const loose = p.bag.filter(x => !x.pocket).sort((a, b) => a.val / a.size - b.val / b.size);
    const done = () => { UI.swapOpen = false; S.paused = false; closeSheet('swap'); };
    const render = () => {
      const used = bagUsed(p), freed = loose.filter(x => sel.has(x.id)).reduce((a, x) => a + x.size, 0), need = it.size - (p.cap - used), ok = freed >= need;
      let body = `<div class="note">背包滿了。新的這段要 <b class="gold">${it.size} 格</b>：</div>` + ticket(it) + `<div class="sec">要丟下哪幾段？（${freed}/${need} 格）</div><div class="bagGrid">`;
      if (!loose.length) body += `<div class="note mute">背包裡都是保險格的東西，換不了。</div>`;
      for (const x of loose) body += `<div class="itemrow ${sel.has(x.id) ? 'new' : ''}" data-k="${x.id}"><div class="orb" style="${orbStyle(x.rar)}"></div><div class="tx"><div class="n">${esc(x.n)}</div><div class="m">${RAR[x.rar].n}・${x.size} 格・${fmt(x.val)}</div></div><span class="serif">${sel.has(x.id) ? '丟下' : '留著'}</span></div>`;
      body += `</div>`;
      const s = sheet('swap', '要換嗎？', `${used}/${p.cap} 格`, body, `<button class="btn ghost" data-no>不拿</button><button class="btn primary" data-y ${ok ? '' : 'disabled'}>換</button>`, { modal: true, noX: true });
      s.querySelector('[data-no]').onclick = done;
      s.querySelectorAll('[data-k]').forEach(r => r.onclick = () => { const id = r.dataset.k; if (sel.has(id)) sel.delete(id); else sel.add(id); AU.sfx('ui'); const sc = s.querySelector('.bd').scrollTop; render(); $('#swap .bd').scrollTop = sc; });
      s.querySelector('[data-y]').onclick = () => {
        for (const x of loose) if (sel.has(x.id)) { p.bag = p.bag.filter(y => y !== x); W.picks.push({ k: 'mem', x: p.x + fx(-26, 26), y: p.y + fx(14, 30), z: 0, vz: null, vx: 0, vy: 0, t: 0, item: x, beam: 1, ign: W.t + 3 }); }
        takeMemory(p, k); done();
      };
    };
    render();
  },
  openPutDown(p, k) {
    UI.swapOpen = true; S.paused = true;
    const s = sheet('swap', '放下她？', '', ticket(k.item) + `<div class="note" style="margin-top:12px">背著晴就拿不了東西。要先把她放下來嗎？</div>`, `<button class="btn ghost" data-no>不要</button><button class="btn danger" data-y>放下她</button>`, { modal: true, noX: true });
    const done = () => { UI.swapOpen = false; S.paused = false; closeSheet('swap'); };
    s.querySelector('[data-no]').onclick = done;
    s.querySelector('[data-y]').onclick = () => { putDownQing(p); k.ign = 0; done(); };
  },
  openWindowPick(p) {
    S.paused = true;
    const loose = p.bag.filter(i => !i.pocket).sort((a, b) => b.val / b.size - a.val / a.size);
    const keep = new Set(); let sz = 0; for (const it of loose) if (sz + it.size <= 6) { keep.add(it.id); sz += it.size; }
    const render = () => {
      let used = 0; loose.forEach(i => { if (keep.has(i.id)) used += i.size; });
      let body = `<div class="note">跳下去的人，只抱得住 6 格的東西（保險格裡的不算）。選要帶走的：<b class="gold">${used}/6</b></div><div class="bagGrid" style="margin-top:10px">`;
      for (const it of loose) body += `<div class="itemrow ${keep.has(it.id) ? 'new' : ''}" data-k="${it.id}"><div class="orb" style="${orbStyle(it.rar)}"></div><div class="tx"><div class="n">${esc(it.n)}</div><div class="m">${RAR[it.rar].n}・${it.size} 格・${fmt(it.val)}</div></div><span class="serif">${keep.has(it.id) ? '帶走' : '留下'}</span></div>`;
      body += `</div>`;
      const s = sheet('winp', '跳窗', '', body, `<button class="btn ghost" data-no>先不跳</button><button class="btn primary" data-y>跳下去</button>`, { modal: true, noX: true });
      s.querySelectorAll('[data-k]').forEach(r => r.onclick = () => { const id = r.dataset.k, it = loose.find(x => x.id === id); if (keep.has(id)) keep.delete(id); else if (used + it.size <= 6) keep.add(id); else { toast('抱不住了', 'bad'); return; } AU.sfx('ui'); render(); });
      s.querySelector('[data-no]').onclick = () => { closeSheet('winp'); S.paused = false; };

    };

  },
  openFerry(p) {
    S.paused = true;
    const ok = p.bag.filter(i => i.rar >= 2 && i.kind !== 'core');
    let body = `<div class="note">渡夢人不說話，只是伸出手。給他一段<b style="color:${RAR[2].c}">鮮憶</b>以上的記憶，他就載你出去。</div><div class="bagGrid" style="margin-top:10px">`;
    if (!ok.length) body += `<div class="note mute">你身上沒有他要的東西。</div>`;

        c.globalCompositeOperation = 'lighter'; c.drawImage(glow('#ffc94a'), ox - 40 * S0, oy - 40 * S0, 80 * S0, 80 * S0); c.globalCompositeOperation = 'source-over';
        if (li >= 5) { c.globalAlpha = li >= 6 ? .35 + .2 * Math.sin(t * 3) : .9; silhouetteGirl(c, w * .2, h * .9, 2.2 * S0, 'stand', { reach: true }); c.globalAlpha = 1; }
        rain(.25);
      } else {

        c.globalCompositeOperation = 'lighter'; c.drawImage(glow('#cfe0ff'), w * .1, h * .05, w * .8, h * .7); c.globalCompositeOperation = 'source-over';
        c.fillStyle = '#d8dde8'; c.fillRect(w * .1, h * .62, w * .8, 30 * S0);

    }
    case 'end_repeat': {

      const cy = h * .62; c.fillStyle = '#2a180c'; c.fillRect(0, cy, w, h - cy);
      for (let i = 0; i < 9; i++) { const ox = w * (.3 + hash2(i, 1) * .4), oy = cy - (6 + hash2(i, 2) * 20) * S0; c.globalCompositeOperation = 'lighter'; c.drawImage(glow('#ffc94a'), ox - 30 * S0, oy - 30 * S0, 60 * S0, 60 * S0); c.globalCompositeOperation = 'source-over'; }
      if (li >= 6) { const fx2 = w * .75, fy = cy - 10 * S0; c.fillStyle = '#5a3a20'; c.beginPath(); c.ellipse(fx2, fy, 26 * S0, 9 * S0, 0, 0, TAU); c.fill(); for (let i = 0; i < 8; i++) { const k = (t * 1.2 + i / 8) % 1; c.fillStyle = rgba(i % 2 ? '#ffb040' : '#ff6a20', .8 * (1 - k)); c.beginPath(); c.ellipse(fx2 + Math.sin(i + t * 3) * 8 * S0, fy - k * 60 * S0, (8 - k * 6) * S0, (12 - k * 8) * S0, 0, 0, TAU); c.fill(); } }

      const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, mixHex('#0a0e1a', '#c8d8f0', k * .8)); g.addColorStop(1, mixHex('#05060a', '#5a6a80', k * .6)); c.fillStyle = g; c.fillRect(0, 0, w, h);
      if (k < .9 && !ep) rain(.3 * (1 - k));
      if (k > 0) { c.globalCompositeOperation = 'lighter'; c.globalAlpha = k; for (let i = 0; i < 4; i++) { c.fillStyle = 'rgba(255,240,200,.08)'; c.beginPath(); c.moveTo(w * (.5 + i * .1), 0); c.lineTo(w * (.7 + i * .1), 0); c.lineTo(w * (.3 + i * .1), h); c.lineTo(w * (.1 + i * .1), h); c.fill(); } c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; }
      if (!ep && li >= (sunny ? 6 : 7)) {
        if (sunny) { c.fillStyle = '#e8ecf4'; c.fillRect(w * .08, h * .7, w * .55, 30 * S0); c.fillStyle = '#c8ccd8'; c.fillRect(w * .08, h * .7 + 30 * S0, w * .55, 8 * S0); silhouetteGirl(c, w * .3, h * .7, 2.4 * S0, 'sit', { smile: li >= 9 }); silhouetteMan(c, w * .76, h * .82, 2.2 * S0, { c: '#1c1f33', lining: '#53f0d6', flip: true }); }
        else { c.fillStyle = '#2a2e3a'; c.fillRect(w * .58, h * .3, w * .22, h * .52); c.fillStyle = 'rgba(255,240,200,.15)'; c.fillRect(w * .6, h * .32, w * .18, h * .5); silhouetteMan(c, w * .74, h * .82, 2.2 * S0, { c: '#1c1f33', lining: '#53f0d6', flip: true }); silhouetteGirl(c, w * .34, h * .82, 2.3 * S0, 'stand'); }
      }
      vign(.6); break;
    }
    default: c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
  }
}

'use strict';
/* ====== 存檔：本機＋Claude 雲端＋存檔碼 ====== */
const SAVE_KEY = 'dreamthief.save.v1';
const CLOUD = { ref: null, ready: false, busy: false, pending: null, remote: null };
let G = null;

function newG() {
  return {
    v: 1, at: 0, money: 300, archive: [], pending: [], sold: [],
    chapters: CH.map((c, i) => ({ unlocked: i === 0, core: false, dives: 0, best: -1 })),
    meta: { bag: 0, pocket: 0, hp: 0, lantern: 0, dash: 0, candy: 0, start: 0 },
    weapons: { revolver: { owned: true, lvl: 1 }, crossbow: { owned: false, lvl: 1 }, shotgun: { owned: false, lvl: 1 }, needle: { owned: false, lvl: 1 } },
    tools: { decoy: true, incense: false, mirror: false, stun: false },
    loadout: { weapon: 'revolver', tool: 'decoy', candies: 2 }, candyStock: 3,
    side: {}, flags: {}, perks: {}, endings: [], sel: 0, lastResult: null,
    stats: { dives: 0, extracts: 0, lost: 0, kills: 0, assassins: 0, earned: 0, time: 0 },
    settings: { sfx: true, music: true, shake: true },
  };
}
function fixG(g) {
  const d = newG();
  for (const k in d) if (g[k] === undefined) g[k] = d[k];
  for (const k in d.meta) if (g.meta[k] === undefined) g.meta[k] = 0;
  for (const k in d.weapons) if (!g.weapons[k]) g.weapons[k] = d.weapons[k];
  for (const k in d.tools) if (g.tools[k] === undefined) g.tools[k] = false;
  while (g.chapters.length < CH.length) g.chapters.push({ unlocked: false, core: false, dives: 0, best: -1 });
  for (const k in d.settings) if (g.settings[k] === undefined) g.settings[k] = d.settings[k];
  return g;
}
function saveGame() {
  if (!G) return false;
  G.at = Date.now();
  const ok = LS.set(SAVE_KEY, G);
  cloudSave(G);
  return ok;
}
function loadLocal() { const g = LS.get(SAVE_KEY, null); return g && g.v ? g : null; }
function bestSave() {
  const l = loadLocal(), r = CLOUD.remote;
  if (l && r) return (r.at || 0) > (l.at || 0) ? r : l;
  return l || r || null;
}
async function cloudInit() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return null;
    const db = await window.claude.use('db'), user = await window.claude.use('user');
    if (!db || !user) return null;
    const id = await user.id(); if (!id) return null;
    CLOUD.ref = db.doc('data/users/' + id + '/save'); CLOUD.ready = true;
    const snap = await Promise.race([CLOUD.ref.get(), new Promise((_, rej) => setTimeout(() => rej('timeout'), 8000))]);
    if (snap && snap.exists) { const d = snap.data(); if (d && d.json) { CLOUD.remote = JSON.parse(d.json); return CLOUD.remote; } }
  } catch (e) { CLOUD.ready = !!CLOUD.ref; }
  return null;
}
async function cloudSave(data) {
  if (!CLOUD.ready || !CLOUD.ref) return;
  const json = JSON.stringify(data);
  if (json.length > 240000) return;
  if (CLOUD.busy) { CLOUD.pending = json; return; }
  CLOUD.busy = true;
  try { await CLOUD.ref.set({ json, at: data.at }); } catch (e) { if (e && e.code === 'invalid_argument') CLOUD.ready = false; }
  CLOUD.busy = false;
  if (CLOUD.pending) { const p = CLOUD.pending; CLOUD.pending = null; cloudSave(JSON.parse(p)); }
}
function b64e(s) { const u = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < u.length; i += 0x8000) o += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(o); }
function b64d(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new TextDecoder().decode(u); }
function exportCode() { return 'DT1:' + b64e(JSON.stringify(G)); }
function importCode(code) {
  code = (code || '').trim();
  if (!code.startsWith('DT1:')) throw new Error('格式不對');
  const g = JSON.parse(b64d(code.slice(4)));
  if (!g || !g.v) throw new Error('讀不出來');
  return fixG(g);
}

/* 記憶匣相關 */
const qingKept = () => QING_KEYS.filter(k => G.archive.some(i => i.key === k)).length;
function refreshPerks() {
  G.perks = {};
  CH.forEach(c => { if (!c.life) return; const all = c.life.items.every((x, i) => G.archive.some(it => it.key === c.id + '_life' + i)); if (all) G.perks[c.id] = true; });
}
function sideFor(chi) {
  if (!G.side[chi] || G.side[chi].length < 2) { const pool = SIDE.slice(); const a = pool.splice((Math.random() * pool.length) | 0, 1)[0]; const b = pool[(Math.random() * pool.length) | 0]; G.side[chi] = [a.id, b.id]; }
  return G.side[chi];
}

'use strict';
/* ====== 啟動、操作、主迴圈 ====== */
const IN = { joy: { on: false }, joyR: 58, keys: {} };

function bindInput() {
  const app = $('#app');
  app.addEventListener('pointerdown', e => {
    if (S.mode !== 'dive' || S.paused || !W || W.out) return;
    if (e.target !== R.cv) return;
    if (IN.joy.on) return;
    IN.joy = { on: true, id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, kx: e.clientX, ky: e.clientY };
    AU.init();
  });
  addEventListener('pointermove', e => {
    const j = IN.joy; if (!j.on || e.pointerId !== j.id) return;
    j.x = e.clientX; j.y = e.clientY;
    let dx = j.x - j.ox, dy = j.y - j.oy, l = Math.hypot(dx, dy);
    if (l > IN.joyR * 1.25) { const k = (l - IN.joyR * 1.25) / l; j.ox += dx * k; j.oy += dy * k; dx = j.x - j.ox; dy = j.y - j.oy; l = Math.hypot(dx, dy); }
    const m = Math.min(l, IN.joyR); j.kx = j.ox + (l ? dx / l * m : 0); j.ky = j.oy + (l ? dy / l * m : 0);
  }, { passive: true });
  const up = e => { if (IN.joy.on && e.pointerId === IN.joy.id) IN.joy = { on: false }; };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  const btn = (sel, fn) => { const b = $(sel); b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (S.mode !== 'dive' || !W || W.out) return; if (S.paused && sel !== '#pauseBtn') return; AU.init(); fn(W.players[0]); }); };
  btn('#bDash', p => playerDash(p));
  btn('#bTool', p => useTool(p));
  btn('#bCandy', p => useCandy(p));
  btn('#bAct', p => doAct(p));
  btn('#pauseBtn', () => { if (!S.paused) UI.pause(); });
  btn('#bag', () => UI.bag());
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    IN.keys[k] = true;
    if (S.mode !== 'dive' || !W || W.out) return;
    if (k === 'escape') { if (S.paused) { const s = $('#ui .screen:last-child'); if (s && s.id === 'pause') { s.remove(); S.paused = false; } else if (s && s.id === 'bagS') { s.remove(); S.paused = false; } } else UI.pause(); return; }
    if (S.paused) return;
    const p = W.players[0];
    if (k === ' ') { e.preventDefault(); playerDash(p); }
    else if (k === 'e') useTool(p);
    else if (k === 'q') useCandy(p);
    else if (k === 'f' || k === 'enter') doAct(p);
    else if (k === 'b' || k === 'tab') { e.preventDefault(); UI.bag(); }
  });
  addEventListener('keyup', e => { IN.keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { IN.keys = {}; IN.joy = { on: false }; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (S.mode === 'dive' && W && !W.out && !S.paused) UI.pause(); if (G) saveGame(); }
  });
}
function readInput() {
  const p = W.players[0]; const inp = p.input;
  let mx = 0, my = 0, mag = 0;
  const K = IN.keys;
  const kx = (K['d'] || K['arrowright'] ? 1 : 0) - (K['a'] || K['arrowleft'] ? 1 : 0), ky = (K['s'] || K['arrowdown'] ? 1 : 0) - (K['w'] || K['arrowup'] ? 1 : 0);
  if (kx || ky) { const l = Math.hypot(kx, ky); mx = kx / l; my = ky / l; mag = K['shift'] ? .5 : 1; }
  else if (IN.joy.on) {
    const dx = IN.joy.x - IN.joy.ox, dy = IN.joy.y - IN.joy.oy, l = Math.hypot(dx, dy);
    if (l > IN.joyR * .1) { mx = dx / l; my = dy / l; mag = Math.min(1, l / IN.joyR); }
  }
  inp.mx = mx; inp.my = my; inp.mag = mag;
}

let _last = performance.now();
function frame(ts) {
  const dt = Math.min(.05, Math.max(0, (ts - _last) / 1000)); _last = ts;
  try {
    const c = R.ctx;
    if (S.mode === 'title' || S.mode === 'boot') { c.setTransform(1, 0, 0, 1, 0, 0); drawTitleBG(c, ts / 1000); }
    else if (S.mode === 'hub') { c.setTransform(1, 0, 0, 1, 0, 0); drawHubBG(c, ts / 1000); }
    else if ((S.mode === 'dive' || S.mode === 'result') && W) {
      if (S.mode === 'dive') readInput();
      if (!S.paused && S.mode === 'dive') stepWorld(dt);
      renderDive(S.paused || S.mode !== 'dive' ? 0 : dt);
      if (S.mode === 'dive') { UI.hud(dt); updateRadio(S.paused ? 0 : dt); }
    }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

function boot() {
  initRender(); initBG(); bindInput();
  G = fixG(bestSave() || newG()); refreshPerks();
  UI.title();
  const tryCloud = n => {
    if (window.claude && typeof window.claude.use === 'function') cloudInit().then(r => { if (r && S.mode === 'title') { const l = loadLocal(); if (!l || (r.at || 0) > (l.at || 0)) { G = fixG(r); refreshPerks(); UI.title(); } } });
    else if (n < 24) setTimeout(() => tryCloud(n + 1), 250);
  };
  tryCloud(0);
  requestAnimationFrame(frame);
}

/* 測試用（不會出現在畫面上） */
window.__dt = {
  get W() { return W; }, get G() { return G; }, get S() { return S; },
  money(n) { G.money += n; saveGame(); },
  unlockAll() { G.chapters.forEach(c => c.unlocked = true); saveGame(); },
  start(chi) { G = G || newG(); S.mode = 'hub'; UI.startDive(chi || 0); },
  wake(v) { W.wake = v; },
  god() { const p = W.players[0]; p.hpMax = 99999; p.hp = 99999; },
  tp(x, y) { const p = W.players[0]; p.x = x; p.y = y; R.snap = true; },
  toBoss() { const b = W.boss; if (!b) return; const p = W.players[0]; p.x = b.room.cx; p.y = (b.room.y + b.room.h - 1.5) * T; R.snap = true; },
  depth(d) { W.depth = d - 1; descend(); },
  lvl(n) { const p = W.players[0]; for (let i = 0; i < n; i++) { const k = rnd.pick(UP_IDS); if ((p.ups[k] || 0) < 5) p.ups[k] = (p.ups[k] || 0) + 1; } calcStats(p); },
};
window.addEventListener('load', boot);
