const POWER_DESC = {
  shaji: n => `每回合第一張殺牌額外造成 ${n} 傷害。`, shafa: () => '每觸發一個計，勢 +1。', gurou: () => '守不會在回合開始時消失。',
  fubing: n => `每回合開始獲得伏兵 ${n}。`, yunchou: n => `每回合開始佈局 +${n}。`, dongruo: n => `每觸發一個計，抽 ${n} 張。`,
  shee: n => `每回合開始，隨機一名敵人破綻 ${n}。`, jiandie: n => `每回合開始，所有敵人離心 ${n}。`, jiandieDraw: n => `每回合開始多抽 ${n} 張。`,
  yaoyan: n => `每打出一張亂牌，所有敵人流言 ${n}。`, wufeng: n => `每回合結束，隨機一名敵人流言 ${n}。`,
  wujian: () => '離心門檻降為 2。', koushe: () => '敵人的流言不再減少。', budong: n => `每回合開始獲得 ${n} 守。`, hongyan: () => '施加破綻時抽 1 張（每回合最多 3 張）。',
};

/* ============================================================
   E — enemy-side API used by enemy moves
   ============================================================ */
const E = {
  get cb() { return G.cb; },
  get p() { return G.cb.p; },
  get rng() { return G.cb.rng; },
  get turn() { return G.cb.turn; },
  hasComp,
  all: aliveEnemies,
  minions(e) { return aliveEnemies().filter(x => x !== e); },
  boss() { return aliveEnemies().find(x => x.boss); },
  async attack(e, d, n = 1) { return enemyAttack(e, d, n); },
  gainBlock(e, n) { e.block += n; UIC.float(e, '+' + n, 'block'); },
  buff(e, st, n) { addStatus(e, st, n); UIC.float(e, st + ' +' + n, 'buff'); },
  buffAll(st, n) { for (const x of aliveEnemies()) E.buff(x, st, n); },
  blockAll(n) { for (const x of aliveEnemies()) E.gainBlock(x, n); },
  heal(e, n) { const v = Math.min(n, e.maxHp - e.hp); e.hp += v; UIC.float(e, '+' + v, 'heal'); },
  healAll(n) { for (const x of aliveEnemies()) E.heal(x, n); },
  debuff(st, n) {
    const p = G.cb.p;
    if (typeof n === 'string') { p.st[st] = n; return; }
    addStatus(p, st, n);
    p.fresh[st] = (p.fresh[st] || 0) + n;
    UIC.float(p, st + ' ' + n, 'debuff');
  },
  addCardToPlayer(id, where, count = 1) { for (let i = 0; i < count; i++) B.addCard(id, where); },
  async summon(id) {
    const cb = G.cb;
    if (aliveEnemies().length >= 5) return null;
    const e = mkEnemy(id, cb);
    cb.enemies.push(e);
    chooseMove(e);
    markSeen('enemy', id);
    await UIC.summon(e);
    return e;
  },
  stealGold(e, n) {
    if (!G.run) return 0;
    const g = Math.min(G.run.gold, n);
    G.run.gold -= g;
    e.mem.stolen = (e.mem.stolen || 0) + g;
    if (g) UIC.float(e, '偷 ' + g + ' 兩', 'gold');
    return g;
  },
  async flee(e) { e.fled = true; await UIC.flee(e); },
  say(e, txt) { UIC.say(e, txt); },
  pickW(e, weights, opts = {}) {
    const maxRep = opts.maxRepeat || 2;
    const noRep = opts.noRepeat || [];
    const h = e.hist;
    let w = weights.filter(([m]) => {
      if (noRep.includes(m) && h[h.length - 1] === m) return false;
      if (h.length >= maxRep && h.slice(-maxRep).every(x => x === m)) return false;
      return true;
    });
    if (!w.length) w = weights;
    return G.cb.rng.weighted(w);
  },
  lastKind() {
    const k = G.cb.lastTurnKinds || {};
    let best = null, bn = 0;
    for (const [kk, n] of Object.entries(k)) if (n > bn) { best = kk; bn = n; }
    return best;
  },
  setOmen() {
    const keys = Object.keys(OMENS).filter(k => k !== G.cb.omen);
    const k = G.cb.rng.pick(keys);
    G.cb.nextOmen = k;
  },
  prophecy() {
    const cnt = {};
    const cb = G.cb;
    for (const c of cb.draw.concat(cb.discard, cb.hand)) for (const k of cardKinds(c)) cnt[k] = (cnt[k] || 0) + 1;
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 2);
    if (!top.length) return;
    const k = cb.rng.pick(top)[0];
    cb.p.st['預言'] = k;
    UIC.float(cb.p, '預言：' + k, 'debuff');
  },
  sealKind() {
    const cnt = {};
    const cb = G.cb;
    for (const c of cb.draw.concat(cb.discard)) for (const k of cardKinds(c)) cnt[k] = (cnt[k] || 0) + 1;
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    if (!top) return;
    cb.p.st['封型'] = top[0];
    UIC.float(cb.p, '封型：' + top[0], 'debuff');
  },
  async rawHitPlayer(n, src) { await damagePlayer(n, src, { attack: false }); },
};

/* ============================================================
   combat construction
   ============================================================ */
function enemyHpScale(ch) {
  let m = 1;
  const y = yeshen();
  if (y >= 1) m += 0.06;
  if (y >= 3) m += 0.06;
  if (y >= 5) m += 0.08;
  return m;
}
function mkEnemy(id, cb) {
  const d = ENEMIES[id];
  let hp = cb.rng.int(d.hp[0], d.hp[1]);
  const tier = d.boss ? 'boss' : d.elite ? 'elite' : 'normal';
  const ch = Math.max(1, Math.min(6, cb.ch || d.ch || 1));
  hp = Math.round(hp * CH_HP[tier][ch] * enemyHpScale(d.ch) * (d.boss && yeshen() >= 2 ? 1.08 : 1) * (d.elite && yeshen() >= 1 ? 1.05 : 1));
  const e = { uid: uid(), id, name: d.name, title: d.title || '', hp, maxHp: hp, block: 0, st: {}, mem: {}, move: null, dead: false, fled: false, boss: !!d.boss, elite: !!d.elite, seqIdx: 0, hist: [], forceNext: null, dmgMul: CH_DMG[tier][ch] * (yeshen() >= 2 && !d.boss ? 1.08 : 1) };
  if (!cb.sandbox && d.ch && yeshen() >= 4 && !d.boss) e.st['勢'] = 1;
  return e;
}
function chooseMove(e) {
  const d = ENEMIES[e.id];
  let m;
  if (e.forceNext) { m = e.forceNext; e.forceNext = null; }
  else if (!e.hist.length && !e.move && d.first) m = d.first;
  else if (d.seq) { m = d.seq[e.seqIdx % d.seq.length]; e.seqIdx++; }
  else if (d.ai) m = d.ai(e, E);
  else m = Object.keys(d.moves)[0];
  if (!d.moves[m]) m = Object.keys(d.moves)[0];
  e.move = m;
  e.mem.lastMove = m;
  const mv = d.moves[m];
  if (mv.roll) mv.roll(e, E);
}

let _combatResolve = null;
async function runCombat(opts) {
  const run = G.run;
  const seed = opts.seed || (run ? (run.combatSeed = (run.combatSeed || run.seed) + 7919) : newSeed());
  const rng = new RNG(seed);
  const cb = G.cb = {
    rng, kind: opts.kind || 'normal', isBoss: opts.kind === 'boss' || opts.kind === 'final', isElite: opts.kind === 'elite',
    sandbox: !!opts.sandbox, tutorial: opts.tutorial || null, ch: opts.ch || (run ? run.ch : 1),
    turn: 0, enemies: [], p: null,
    draw: [], hand: [], discard: [], exhaust: [],
    chain: [], turnStat: freshTurnStat(), flags: {}, over: false, result: null, phase: 'setup', busy: false,
    pendingDraw: 0, omen: null, nextOmen: null, lastTurnKinds: {}, schemes: 0, comps: [], returnToTop: null,
    title: opts.title || '', escaped: false,
  };
  const deck = opts.deck || run.deck;
  const baseEnergy = 3 + (run ? run.relics.reduce((a, r) => a + (RELICS[r].energy || 0), 0) : 0);
  cb.p = {
    isPlayer: true, name: '魏子葳', uid: 'p',
    hp: opts.hp != null ? opts.hp : run.hp, maxHp: opts.maxHp || run.maxHp,
    block: 0, st: {}, powers: {}, energy: 0, baseEnergy, fresh: {},
    nextDraw: 0, nextEnergy: 0, delayed: 0, nextStrikeDouble: false, doubleNextArmed: false, doubleNextPending: false,
  };
  cb.draw = rng.shuffle(deck.map(c => ({ uid: uid(), id: c.id, up: c.up })));
  // innate: none currently; tutorial stacks the draw pile
  if (opts.tutorial === 'jiedao') {
    const want = ['tiaobo', 'youdi', 'xiujian', 'cangshen', 'xiujian'];
    for (const w of want.slice().reverse()) {
      const i = cb.draw.findIndex(c => c.id === w && !c._t);
      if (i >= 0) { const [c] = cb.draw.splice(i, 1); c._t = 1; cb.draw.push(c); }
    }
  }
  const comps = opts.party || (run ? run.party : []);
  cb.comps = comps.map(id => ({ id, charge: Math.min(3, star('kaiyang')), need: (id === 'yan' && run && run.relics.includes('yanling')) ? 4 : 5 }));
  for (const id of opts.enemies) {
    const e = mkEnemy(id, cb); cb.enemies.push(e); markSeen('enemy', id);
  }
  for (const e of cb.enemies) chooseMove(e);

  UIC.mount(opts);
  if (AUTO.on) AUTO.combatStart(cb);
  const done = new Promise(res => { _combatResolve = res; });
  await wait(300);
  // enemy starts
  for (const e of cb.enemies.slice()) { const d = ENEMIES[e.id]; if (d.onStart) await d.onStart(E, e); }
  // relic combat start
  if (run && !cb.sandbox) {
    for (const r of run.relics) { const R = RELICS[r]; if (R.combatStart) R.combatStart(B); }
    if (hasRelic('yuxi') && (cb.isBoss || cb.isElite)) { B.applyAll('疑心', 2); B.applyAll('破綻', 2); }
    if (hasRelic('liuxing')) await B.atkAll(10, { noStr: true });
    if (hasRelic('tuibei')) { const k = SCHEME_LIST.filter(s => knowsScheme(s.id)); if (k.length) cb.flags.tuibei = rng.pick(k).id; }
    if (hasRelic('zhushao')) for (const c of cb.comps) c.charge = Math.min(c.need, c.charge + 1);
    if (yeshen() >= 5) B.addCard('huangkong', 'draw');
  }
  if (opts.onStart) await opts.onStart(B);
  UIC.render();
  await playerTurnStart();
  return done;
}

/* ============================================================
   turn flow
   ============================================================ */
async function playerTurnStart() {
  const cb = G.cb, p = cb.p;
  if (cb.over) return;
  cb.turn++;
  cb.phase = 'player-start';
  if (!p.powers.gurou) p.block = 0;
  delete p.st['伏兵'];
  delete p.st['裝瘋'];
  cb.turnStat = freshTurnStat();
  if (!hasRelic('qipan')) cb.chain = [];
  cb.omen = cb.nextOmen; cb.nextOmen = null;
  if (cb.omen === 'ziwei') { const b = aliveEnemies().find(e => e.id === 'yuantianji'); if (b) E.gainBlock(b, 20); }
  if (cb.omen === 'huixing') { for (const e of aliveEnemies()) addStatus(e, '流言', 3); addStatus(p, '流言', 3); }
  UIC.render();
  if (cb.omen) await UIC.omen(cb.omen);
  // delayed attack (暗渡陳倉)
  if (p.delayed) { const d = p.delayed; p.delayed = 0; await UIC.banner('暗渡陳倉'); await B.atkAll(d, { noStr: true }); if (cb.over) return; }
  // poison on player
  if ((p.st['流言'] || 0) > 0) {
    await playerLoseHp(p.st['流言'], { why: '流言' });
    if (cb.over) return;
    addStatus(p, '流言', -1);
  }
  // energy
  p.energy = p.baseEnergy + (p.nextEnergy || 0);
  p.nextEnergy = 0;
  if (cb.turn === 1 && G.run && !cb.sandbox) {
    if (hasRelic('lingpai')) p.energy += 1;
    if (star('tianji') >= 3) p.energy += 1;
  }
  // powers
  if (p.powers.budong) B.block(p.powers.budong, { raw: true });
  if (p.powers.fubing) B.selfApply('伏兵', p.powers.fubing);
  if (p.powers.yunchou) B.setup(p.powers.yunchou);
  if (p.powers.shee) { const a = aliveEnemies(); if (a.length) B.apply(cb.rng.pick(a), '破綻', p.powers.shee); }
  if (p.powers.jiandie) B.applyAll('離心', p.powers.jiandie);
  if (hasComp('qin')) B.block(3, { raw: true });
  if (hasRelic('jinxiu') && p.block === 0) B.block(6, { raw: true });
  // draw
  let n = 5 + (p.nextDraw || 0) + (hasRelic('yemingzhu') ? 1 : 0) + (p.powers.jiandieDraw || 0) - (p.st['宵禁'] || 0) - (cb.omen === 'yueyan' ? 1 : 0);
  if (cb.turn === 1 && G.run && !cb.sandbox) {
    if (hasRelic('lamei')) n += 2;
    if (star('tianji') >= 1) n += 1;
    if (star('tianji') >= 2) n += 1;
    if (hasRelic('huangli')) { n += 2; B.selfApply('勢', 1); }
  }
  p.nextDraw = 0; delete p.st['宵禁'];
  await drawCards(Math.max(0, n));
  if (cb.over) return;
  if (cb.turn === 1 && cb.flags.tuibei) B.addCard('sc_' + cb.flags.tuibei, 'hand');
  // 已售
  if (p.st['已售']) {
    const k = p.st['已售']; delete p.st['已售'];
    const sorted = cb.hand.filter(c => cardCost(c) != null).sort((a, b) => (cardCost(b) || 0) - (cardCost(a) || 0));
    for (let i = 0; i < k && i < sorted.length; i++) sorted[i].sold = true;
  }
  cb.phase = 'player';
  UIC.render();
  UIC.turnBanner();
  AUTO.onPlayerTurn();
  tutorialHints();
}

const K2 = k => `<span class="hk s-${k}">${k}</span>`;
async function tutorialHints() {
  const cb = G.cb;
  if (!cb || cb.sandbox) return;
  if (cb.tutorial === 'jiedao' && cb.turn === 1) {
    await UIC.hint('t_kind', `每張牌右上角的<b>印</b>，是它的<b>計型</b>：${KINDS.map(K2).join('')}。<br>同一回合裡，<b>依序</b>打出特定的計型，就能觸發三十六計。`, '.hand');
    await UIC.hint('t_chain', `試試這一計：先打出 ${K2('間')}挑撥，再打出 ${K2('誘')}誘敵，最後用 ${K2('殺')}袖箭收尾。<br>會成計的牌，會發出<b>金光</b>；若是還沒悟出的計，會隱隱發著<b>紫光</b>。`, '.chainbar');
    await UIC.hint('t_intent', `敵人頭上的標記，是他<b>下一步</b>要做的事。紅色「攻」後面的數字，是你會受到的傷害。<br>用「守」擋住它。`, '.en .intentwrap', { below: true });
    return;
  }
  if (cb.turn === 1 && !G.meta.tips.t_end) {
    await UIC.hint('t_end', `謀（左下的數字）用完，或沒有想打的牌時，按<b>收手</b>結束回合。<br>小訣竅：數字鍵 1～9 選牌、E 收手。`, '.endturn');
  }
  if (cb.comps.length && !G.meta.tips.t_comp) {
    await UIC.hint('t_comp', `同伴會在你打出他們擅長的計型時<b>充能</b>。充滿之後點他們的頭像，就能出手「援」你一次。`, '.comps');
  }
}
function freshTurnStat() { return { played: 0, strikes: 0, fu: 0, tan: 0, schemes: 0, kinds: {}, fa: {}, hongyan: 0, selfLoss: 0, hpLost: 0, kongcheng: false, kurou: false, lianhuan: false }; }
function schemesBlocked() {
  const cb = G.cb;
  if (cb.p.st['封計']) return '封計';
  if (cb.hand.some(c => c.id === 'yiju')) return '疑懼';
  return null;
}
function matchScheme(chain) {
  for (const s of SEQ_SCHEMES) {
    const k = s.seq.length;
    if (chain.length < k) continue;
    let ok = true;
    for (let i = 0; i < k; i++) if (!chain[chain.length - k + i].includes(s.seq[i])) { ok = false; break; }
    if (ok) return s;
  }
  return null;
}
function effCost(c) {
  const cb = G.cb;
  let cost = cardCost(c);
  if (cost == null) return null;
  if (c.free) return 0;
  if (cb && cb.p.st['封型'] && cardKinds(c).includes(cb.p.st['封型'])) cost += 1;
  if (cb && cb.omen === 'taibai' && cb.turnStat && cb.turnStat.played === 0) cost = 0;
  return Math.max(0, cost);
}
function canPlay(c) {
  const cb = G.cb;
  if (!cb || cb.phase !== 'player' || cb.busy || cb.over) return false;
  if (cflag(c, 'unplay') || cardCost(c) == null) return false;
  if (c.sold) return false;
  return effCost(c) <= cb.p.energy;
}
function needsTarget(c) { return cdef(c).tgt === 'enemy'; }

async function playCard(c, target) {
  const cb = G.cb, p = cb.p;
  if (!canPlay(c)) return false;
  const d = cdef(c);
  if (needsTarget(c)) {
    const a = aliveEnemies();
    if (!target || target.dead || target.fled) target = a.length === 1 ? a[0] : null;
    if (!target) return false;
  } else target = null;
  cb.busy = true;
  p.energy -= effCost(c);
  const hi = cb.hand.indexOf(c);
  if (hi >= 0) cb.hand.splice(hi, 1);
  const kinds = cardKinds(c);
  const cur = B.cur = { card: c, kinds, firstStrike: kinds.includes('殺') && cb.turnStat.strikes === 0, bonusDone: false, double: false };
  if (kinds.includes('殺') && p.nextStrikeDouble) { cur.double = true; p.nextStrikeDouble = false; }
  let dbl = false;
  if (p.doubleNextArmed) { dbl = true; p.doubleNextArmed = false; }
  const kongcheng = kinds.includes('伏') && p.block === 0 && cb.hand.length === 0 && !cb.turnStat.kongcheng;
  const kurou = kinds.includes('殺') && cb.turnStat.selfLoss > 0 && !cb.turnStat.kurou;
  const zouwei = kinds.includes('伏') && p.hp < p.maxHp * 0.3 && !cb.flags.zouwei && !cb.tutorial;
  cb.turnStat.played++;
  await UIC.playFly(c, target);
  if (p.st['預言'] && kinds.includes(p.st['預言'])) { await playerLoseHp(3, { why: '預言' }); if (cb.over) { cb.busy = false; return true; } }
  if (d.fx) await d.fx(B, c, target);
  if (dbl && d.fx && !cb.over) {
    let t2 = target;
    if (t2 && (t2.dead || t2.fled)) { const a = aliveEnemies(); t2 = a.length ? a[0] : null; }
    if (!needsTarget(c) || t2) { await UIC.banner('再來一次'); B.cur = Object.assign({}, cur, { bonusDone: true }); await d.fx(B, c, t2); }
  }
  if (p.doubleNextPending) { p.doubleNextPending = false; p.doubleNextArmed = true; }
  if (d.id === 'suanwu') p.doubleNextArmed = true;
  B.cur = null;
  // destination
  c.free = false; c.sold = false;
  if (d.type === '謀') { /* power: removed from play */ }
  else if (cflag(c, 'ex')) cb.exhaust.push(c);
  else if (cb.returnToTop === c) { cb.draw.push(c); cb.returnToTop = null; }
  else cb.discard.push(c);
  // stats
  if (kinds.includes('殺')) cb.turnStat.strikes++;
  if (kinds.includes('伏')) cb.turnStat.fu++;
  for (const k of kinds) cb.turnStat.kinds[k] = (cb.turnStat.kinds[k] || 0) + 1;
  if (G.run && !cb.sandbox) G.run.stats.cards++;
  // on-play hooks
  if (kinds.includes('亂') && p.powers.yaoyan) B.applyAll('流言', p.powers.yaoyan);
  if (kinds.includes('探') && hasRelic('modou') && !cb.turnStat.tan) { cb.turnStat.tan = 1; cb.pendingDraw++; }
  for (const cp of cb.comps) if (kinds.includes(COMP_KIND[cp.id])) cp.charge = Math.min(cp.need, cp.charge + 1);
  if (cb.pendingDraw) { const n = cb.pendingDraw; cb.pendingDraw = 0; await drawCards(n); }
  // chain
  if (!cb.over && kinds.length) {
    cb.chain.push(kinds);
    if (cb.chain.length > 8) cb.chain.shift();
    const blocked = schemesBlocked();
    const m = matchScheme(cb.chain);
    if (m) {
      if (blocked) { UIC.banner(blocked === '封計' ? '計被封住了' : '疑懼在心，計不成'); cb.chain = []; }
      else { cb.chain = []; await triggerScheme(m.id); }
    }
    if (!blocked && !cb.over) {
      if (kongcheng) { cb.turnStat.kongcheng = true; await triggerScheme('kongcheng'); }
      if (kurou && !cb.over) { cb.turnStat.kurou = true; await triggerScheme('kurou'); }
      if (zouwei && !cb.over) { cb.flags.zouwei = 1; await triggerScheme('zouwei'); }
    }
  }
  if (cb.pendingDraw) { const n = cb.pendingDraw; cb.pendingDraw = 0; await drawCards(n); }
  cb.busy = false;
  UIC.render();
  await checkEnd();
  return true;
}

async function triggerScheme(id) {
  const cb = G.cb;
  if (cb.over) return;
  const s = SCHEMES[id];
  const first = !cb.sandbox && !knowsScheme(id);
  if (!cb.sandbox) {
    G.meta.schemes[id] = (G.meta.schemes[id] || 0) + 1;
    delete G.meta.revealed[id];
    G.meta.stats.schemesTotal++;
    if (G.run) { G.run.stats.schemes++; if (first) G.run.stats.newSchemes++; }
  }
  cb.turnStat.schemes++;
  cb.schemes++;
  await UIC.schemeSplash(s, first);
  B.addCard('sc_' + id, 'hand');
  if (!cb.sandbox && !G.meta.tips.t_sc) { UIC.render(); UIC.hint('t_sc', `成計了。手中多了一張 0 費的<b>計牌</b>。<br>計牌是「虛」的：這一回合不用，它就會消失。`, '.hand'); }
  const p = cb.p;
  if (hasRelic('heizi') && !cb.flags.heizi) { cb.flags.heizi = 1; B.energy(1); }
  if (hasRelic('yushan') && cb.schemes % 2 === 0) cb.pendingDraw++;
  if (p.powers.shafa) B.selfApply('勢', p.powers.shafa);
  if (p.powers.dongruo) cb.pendingDraw += p.powers.dongruo;
  const wcg = aliveEnemies().find(e => e.id === 'weichanggeng');
  if (wcg) { E.gainBlock(wcg, 4); }
  if (cb.pendingDraw) { const n = cb.pendingDraw; cb.pendingDraw = 0; await drawCards(n); }
  if (cb.turnStat.schemes === 3 && !cb.turnStat.lianhuan && id !== 'lianhuan') { cb.turnStat.lianhuan = true; await triggerScheme('lianhuan'); }
  UIC.render();
}

async function drawCards(n) {
  const cb = G.cb;
  const got = [];
  for (let i = 0; i < n; i++) {
    if (cb.hand.length >= 10) break;
    if (!cb.draw.length) {
      if (!cb.discard.length) break;
      cb.draw = cb.rng.shuffle(cb.discard);
      cb.discard = [];
      await UIC.reshuffle();
    }
    const c = cb.draw.pop();
    cb.hand.push(c);
    got.push(c);
  }
  if (got.length) await UIC.drew(got);
  for (const c of got) if (c.id === 'nidang') { await playerLoseHp(3, { why: '逆黨' }); if (cb.over) break; }
  return got;
}

async function endTurn() {
  const cb = G.cb, p = cb.p;
  if (!cb || cb.phase !== 'player' || cb.busy || cb.over) return;
  cb.busy = true;
  cb.phase = 'end';
  UIC.render();
  // hand effects
  for (const c of cb.hand.slice()) {
    if (c.id === 'huangkong' || c.id === 'zhuoshang') { await playerLoseHp(2, { why: CARDS[c.id].name }); if (cb.over) return; }
    if (c.id === 'xinmo') { for (const e of aliveEnemies()) E.buff(e, '勢', 1); }
  }
  if (p.powers.wufeng) { const a = aliveEnemies(); if (a.length) B.apply(cb.rng.pick(a), '流言', p.powers.wufeng); }
  if (hasRelic('suanpan') && cb.hand.length >= 2) B.setup(1);
  const keep = [];
  for (const c of cb.hand) {
    c.free = false; c.sold = false;
    if (cflag(c, 'eth')) cb.exhaust.push(c);
    else if (cflag(c, 'ret')) keep.push(c);
    else cb.discard.push(c);
  }
  cb.hand = keep;
  await UIC.discardHand();
  delete p.st['封計']; delete p.st['預言']; delete p.st['封型'];
  cb.lastTurnKinds = Object.assign({}, cb.turnStat.kinds);
  cb.busy = false;
  await enemyPhase();
}

function discordThreshold(e) { const base = G.cb.p.powers.wujian ? 2 : 3; return e.boss ? base + 2 : base; }

async function discordStrike(e, others) {
  const victim = B.pickHigh(others);
  const it = getIntent(e);
  await UIC.float(e, '內訌！', 'debuff');
  await UIC.knife(e, victim);
  for (let i = 0; i < (it.n || 1); i++) {
    if (victim.dead || G.cb.over) break;
    await hurtEnemy(victim, calcDmg(e, victim, it.d), { attack: true, by: e });
  }
  if (G.run && !G.cb.sandbox) G.run.stats.discord++;
}

async function enemyPhase() {
  const cb = G.cb, p = cb.p;
  if (cb.over) return;
  cb.phase = 'enemy';
  p.fresh = {};
  UIC.render();
  await wait(250);
  for (const e of cb.enemies.slice()) {
    if (cb.over) return;
    if (e.dead || e.fled) continue;
    await enemyAct(e);
    await checkEnd();
    if (cb.over) return;
  }
  // end of round: player debuffs decay (old stacks only)
  for (const st of ['破綻', '疑心']) {
    const tot = p.st[st] || 0;
    if (tot > 0 && tot - (p.fresh[st] || 0) > 0) addStatus(p, st, -1);
  }
  if (cb.omen && cb.omen !== cb.nextOmen) cb.omen = null;
  for (const e of aliveEnemies()) chooseMove(e);
  if (cb.over) return;
  await playerTurnStart();
}

async function enemyAct(e) {
  const cb = G.cb;
  const d = ENEMIES[e.id];
  if (!e.st['金身']) e.block = 0;
  if (d.onTurnStart) d.onTurnStart(E, e);
  if ((e.st['流言'] || 0) > 0) {
    await hurtEnemy(e, e.st['流言'], { pierce: true, why: '流言' });
    if (e.dead) return;
    if (!cb.p.powers.koushe) addStatus(e, '流言', -1);
  }
  if (e.mem.stunCd) e.mem.stunCd--;
  const decay = () => {
    for (const st of ['破綻', '疑心']) if ((e.st[st] || 0) > 0) addStatus(e, st, -1);
    if (e.st['識破']) addStatus(e, '識破', -1);
  };
  UIC.focusEnemy(e);
  if ((e.st['中計'] || 0) > 0) {
    delete e.st['中計'];
    e.st['識破'] = e.boss ? 2 : 1;
    if (e.boss) e.mem.stunCd = 2;
    await UIC.float(e, '中計・失措', 'debuff');
    await wait(350);
    e.hist.push('_stun');
    decay();
    return;
  }
  const th = discordThreshold(e);
  if ((e.st['離心'] || 0) >= th && !(e.st['識破'] > 0)) {
    addStatus(e, '離心', -th);
    const it = getIntent(e);
    const others = aliveEnemies().filter(x => x !== e);
    if (it.t === 'atk' && others.length) await discordStrike(e, others);
    else {
      await UIC.float(e, others.length ? '猶疑不決' : '疑神疑鬼', 'debuff');
      e.st['識破'] = e.boss ? 2 : 1;
      await wait(350);
    }
    e.hist.push('_discord');
    decay();
    return;
  }
  const mv = d.moves[e.move];
  await UIC.enemyMove(e, mv.name);
  await mv.fx(E, e);
  e.hist.push(e.move);
  decay();
  UIC.render();
}

async function enemyAttack(e, base, hits = 1) {
  const cb = G.cb, p = cb.p;
  for (let i = 0; i < hits; i++) {
    if (cb.over || e.dead) break;
    const dmg = calcDmg(e, p, base);
    await UIC.lunge(e, i, hits);
    if ((p.st['脫殼'] || 0) > 0) { addStatus(p, '脫殼', -1); await UIC.float(p, '脫殼', 'buff'); continue; }
    await damagePlayer(dmg, e, { attack: true });
    if (cb.over) break;
    if (p.st['裝瘋']) { addStatus(e, '流言', 3); addStatus(e, '疑心', 1); UIC.float(e, '流言 3 疑心 1', 'debuff'); }
    if ((p.st['伏兵'] || 0) > 0 && !e.dead) { await UIC.float(p, '伏兵！', 'buff'); await hurtEnemy(e, p.st['伏兵'], { attack: false, thorns: true }); }
  }
}

async function damagePlayer(dmg, src, opts = {}) {
  const cb = G.cb, p = cb.p;
  let d = dmg;
  if (opts.attack && hasRelic('juanhua') && !cb.flags.juanhua && d > 0) { cb.flags.juanhua = 1; d = Math.floor(d / 2); UIC.float(p, '絹花', 'buff'); }
  const blocked = Math.min(p.block, d);
  p.block -= blocked;
  d -= blocked;
  if (d > 0) { p.hp -= d; cb.turnStat && (cb.turnStat.hpLost += d); if (G.run && !cb.sandbox) G.run.stats.dmgTaken += d; }
  await UIC.hitPlayer(dmg, blocked, d);
  if (p.hp <= 0) await playerDown(src);
}
async function playerLoseHp(n, opts = {}) {
  const cb = G.cb, p = cb.p;
  if (n <= 0) return;
  p.hp -= n;
  await UIC.hitPlayer(n, 0, n, opts.why);
  if (p.hp <= 0) await playerDown(null);
}
async function playerDown(src) {
  const cb = G.cb, p = cb.p;
  if (cb.over) return;
  if (G.run && !cb.sandbox && !G.run.revived && star('yaoguang') > 0) {
    G.run.revived = true;
    p.hp = Math.max(1, Math.ceil(p.maxHp * [0, 0.2, 0.35, 0.5][star('yaoguang')]));
    await UIC.revive();
    return;
  }
  p.hp = 0;
  cb.killer = src ? src.id : null;
  await finishCombat(false);
}

async function hurtEnemy(t, dmg, opts = {}) {
  const cb = G.cb;
  if (!t || t.dead || t.fled) return 0;
  let d = Math.max(0, Math.floor(dmg));
  let blocked = 0;
  if (!opts.pierce) { blocked = Math.min(t.block, d); t.block -= blocked; d -= blocked; }
  t.hp -= d;
  if (AUTO.on) AUTO.dmgLog(opts, d);
  await UIC.hitEnemy(t, dmg, blocked, d, opts);
  if (opts.attack && d > 0 && t.st['狂怒']) addStatus(t, '勢', 1);
  if (t.hp <= 0) await killEnemy(t, opts);
  return d;
}
async function killEnemy(t, opts = {}) {
  const cb = G.cb;
  if (t.dead) return;
  t.dead = true; t.hp = 0;
  if (G.run && !cb.sandbox) { G.meta.stats.kills++; G.run.stats.kills++; if (opts.by) G.run.stats.discordKills++; }
  await UIC.death(t);
  const d = ENEMIES[t.id];
  if (d.onDeath) await d.onDeath(E, t);
  for (const o of aliveEnemies()) { const od = ENEMIES[o.id]; if (od.onAllyDeath) od.onAllyDeath(E, o, t); }
  if (t.boss) {
    // minions flee when boss falls (except final lamp flames which die)
    for (const o of aliveEnemies()) { o.fled = true; await UIC.flee(o, true); }
  }
}

async function checkEnd() {
  const cb = G.cb;
  if (cb.over) return;
  if (aliveEnemies().length === 0) await finishCombat(true);
}

async function finishCombat(win) {
  const cb = G.cb;
  if (cb.over) return;
  cb.over = true;
  cb.result = win ? 'win' : 'lose';
  cb.phase = 'over';
  const stolen = cb.enemies.reduce((a, e) => a + (e.dead ? (e.mem.stolen || 0) : 0), 0);
  cb.stolenBack = stolen;
  if (G.run && !cb.sandbox) {
    G.run.hp = Math.max(0, Math.min(cb.p.hp, G.run.maxHp));
    if (win && !cb.escaped) {
      if (stolen) G.run.gold += stolen;
      if (hasRelic('jiuhulu')) G.run.hp = Math.min(G.run.maxHp, G.run.hp + 4);
      if (hasRelic('mingdeng')) G.run.hp = Math.min(G.run.maxHp, G.run.hp + 6);
    }
  }
  if (AUTO.on) AUTO.combatEnd(cb, win);
  await UIC.combatOver(win);
  const r = _combatResolve; _combatResolve = null;
  r && r({ win, escaped: cb.escaped, killer: cb.killer, turns: cb.turn, schemes: cb.schemes, stolen });
}

/* ---------- player actions: potions & assists ---------- */
async function usePotion(i, target) {
  const cb = G.cb;
  if (!G.run) return;
  const id = G.run.potions[i];
  if (!id) return;
  const P = POTIONS[id];
  const inCombat = cb && cb.phase === 'player' && !cb.busy && !cb.over;
  if (!inCombat) {
    if (id === 'jinchuang') { G.run.potions.splice(i, 1); G.run.hp = Math.min(G.run.maxHp, G.run.hp + 20); saveGame(); return true; }
    return false;
  }
  if (P.tgt === 'enemy') {
    const a = aliveEnemies();
    if (!target || target.dead) target = a.length === 1 ? a[0] : null;
    if (!target) return false;
  }
  cb.busy = true;
  G.run.potions.splice(i, 1);
  B.cur = null;
  await UIC.banner(P.name);
  await P.fx(B, target);
  if (cb.pendingDraw) { const n = cb.pendingDraw; cb.pendingDraw = 0; await drawCards(n); }
  cb.busy = false;
  UIC.render();
  await checkEnd();
  return true;
}
async function useAssist(i, target) {
  const cb = G.cb;
  const cp = cb.comps[i];
  if (!cp || cp.charge < cp.need || cb.phase !== 'player' || cb.busy || cb.over) return false;
  const C = COMPANIONS[cp.id];
  if (C.assistTgt) {
    const a = aliveEnemies();
    if (!target || target.dead) target = a.length === 1 ? a[0] : null;
    if (!target) return false;
  }
  cb.busy = true;
  cp.charge = 0;
  B.cur = null;
  await UIC.assistSplash(cp.id);
  const heart = !cb.sandbox && compMeta(cp.id).heart;
  await C.assist(B, target, heart);
  if (cb.pendingDraw) { const n = cb.pendingDraw; cb.pendingDraw = 0; await drawCards(n); }
  cb.busy = false;
  UIC.render();
  await checkEnd();
  return true;
}

/* hints for the chain bar & hand */
function chainHints() {
  const cb = G.cb;
  const res = { byCard: {}, next: [] };
  if (!cb || !cb.turnStat) return res;
  const blocked = schemesBlocked();
  for (const c of cb.hand) {
    const k = cardKinds(c);
    if (!k.length) continue;
    const m = matchScheme(cb.chain.concat([k]));
    if (m) res.byCard[c.uid] = { s: m, known: knowsScheme(m.id) || !!G.meta.revealed[m.id], blocked: !!blocked };
  }
  // next-step suggestions for known schemes
  const seen = new Set();
  for (const s of SEQ_SCHEMES) {
    if (!(knowsScheme(s.id) || G.meta.revealed[s.id])) continue;
    const L = s.seq.length;
    for (let j = Math.min(L - 1, cb.chain.length); j >= 1; j--) {
      let ok = true;
      for (let i = 0; i < j; i++) if (!cb.chain[cb.chain.length - j + i].includes(s.seq[i])) { ok = false; break; }
      if (ok) { if (!seen.has(s.id)) { seen.add(s.id); res.next.push({ s, need: s.seq.slice(j) }); } break; }
    }
  }
  res.next.sort((a, b) => a.need.length - b.need.length);
  res.next = res.next.slice(0, 4);
  return res;
}

Object.assign(DXH, { runCombat, playCard, endTurn, usePotion, useAssist, B, E });

    hairpin: () => `<path d="M100,112 L122,90 M102,114 L124,98" stroke="#d8b25a" stroke-width="1.6"/>`,

  function beast(c) {

      P('M30,120 C30,100 50,92 70,96 L100,96 C112,96 118,86 122,80 L134,86 L130,98 C126,106 120,112 114,114 L112,150 L104,150 L102,120 L60,122 L56,150 L48,150 L44,124 C36,124 30,124 30,120 Z', c) +

  function svg(spec = {}, opts = {}) {
    const body = spec.body || 'robe';

    const flip = opts.flip ? 'transform="translate(140,0) scale(-1,1)"' : '';
    let inner = '';
    if (body === 'beast') inner = beast(c);
    else if (body === 'flame') inner = flame();
    else {
      const sleeve = { slim: 'tight', armor: 'tight', woman: 'water' }[body] || 'wide';
      const hat = HATS[spec.hat || 'none'] || HATS.none;
      const wpn = WEAPONS[spec.weapon || 'none'] || WEAPONS.none;
      const face = spec.hat === 'mask' ? '#d8d0c0' : '#e6c49a';
      const bent = body === 'old';

        hat(shade(c, 10)) + `</g>` +
        `<g class="pp-arm">` + armFront(c, sleeve) + wpn() + `</g>` +
        `</g>`;
    }
    return `<svg class="puppet" viewBox="0 0 140 222" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><filter id="${id}s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.6"/></filter></defs><g ${flip}><g filter="url(#${id}s)">${inner}</g></g></svg>`;
  }

  const WATCHMAN = { body: 'old', hat: 'watchman', weapon: 'gong', dye: '#3a2a1a' };
  const PLAYER = { body: 'scholar', hat: 'scholar', weapon: 'fan', dye: '#2f5d5a', beard: false };
  const COMP_PUP = {
    yan: { body: 'woman', hat: 'bamboo', weapon: 'dagger2', dye: '#2d4a52' },
    wen: { body: 'robe', hat: 'gauze_low', weapon: 'scroll', dye: '#3a3a5a' },

  return { svg, PLAYER, WATCHMAN, COMP_PUP, shade };
})();

/* ============================================================
   夜景 — 各更場景背景（SVG 天際線）
   ============================================================ */
const SCENERY = (() => {
  const roofs = (fill, y0 = 160) => {
    // procedural row of hip roofs
    let d = `M0,240 L0,${y0}`;
    let x = 0;
    const r = new RNG(7);
    while (x < 1200) {
      const w = r.int(90, 180), h = r.int(24, 60);
      const base = y0 + r.int(-10, 20);
      d += ` L${x},${base} L${x + w * 0.12},${base - h * 0.55} Q${x + w * 0.5},${base - h - 8} ${x + w * 0.88},${base - h * 0.55} L${x + w},${base}`;
      x += w + r.int(0, 20);
    }
    d += ' L1200,240 Z';
    return `<path d="${d}" fill="${fill}"/>`;
  };
  const moon = (cx, cy, r, glow) => `<circle cx="${cx}" cy="${cy}" r="${r * 3.2}" fill="url(#moonGlow)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1712" opacity=".55"/><path d="M${cx},${cy - r} A${r},${r} 0 1 0 ${cx},${cy + r} A${r * .86},${r} 0 0 0 ${cx},${cy - r} Z" fill="#f4e7c2"/><circle cx="${cx - r * .3}" cy="${cy - r * .2}" r="${r * .18}" fill="#e2d2a8" opacity=".6"/><circle cx="${cx + r * .1}" cy="${cy + r * .35}" r="${r * .12}" fill="#e2d2a8" opacity=".5"/>`;
  const pagoda = (x, y, s, fill) => {
    let out = '';
    for (let i = 0; i < 5; i++) {
      const w = (60 - i * 9) * s, yy = y - i * 26 * s;
      out += `<path d="M${x - w},${yy} Q${x},${yy - 16 * s} ${x + w},${yy} L${x + w * 0.7},${yy + 4 * s} L${x - w * 0.7},${yy + 4 * s} Z" fill="${fill}"/><rect x="${x - w * 0.5}" y="${yy}" width="${w}" height="${22 * s}" fill="${fill}"/>`;
    }
    out += `<path d="M${x},${y - 130 * s} L${x},${y - 160 * s}" stroke="${fill}" stroke-width="${3 * s}"/>`;
    return out;
  };
  const tower = (x, y, fill) => `<path d="M${x - 70},240 L${x - 50},${y} L${x + 50},${y} L${x + 70},240 Z" fill="${fill}"/><path d="M${x - 64},${y} L${x - 40},${y - 30} L${x + 40},${y - 30} L${x + 64},${y} Z" fill="${fill}"/><rect x="${x - 30}" y="${y - 60}" width="60" height="30" fill="${fill}"/><path d="M${x - 44},${y - 58} Q${x},${y - 84} ${x + 44},${y - 58} Z" fill="${fill}"/><circle cx="${x}" cy="${y - 92}" r="10" fill="none" stroke="${fill}" stroke-width="3"/><path d="M${x - 16},${y - 92} L${x + 16},${y - 92} M${x},${y - 108} L${x},${y - 76}" stroke="${fill}" stroke-width="2"/>`;
  const banners = (fill) => { let o = ''; for (let i = 0; i < 9; i++) { const x = 60 + i * 130; o += `<path d="M${x},240 L${x},${90 + (i % 3) * 14}" stroke="${fill}" stroke-width="3"/><path d="M${x},${92 + (i % 3) * 14} L${x + 34},${100 + (i % 3) * 14} L${x},${124 + (i % 3) * 14} Z" fill="${fill}"/>`; } return o; };
  const lanterns = () => { let o = ''; const r = new RNG(11); for (let i = 0; i < 26; i++) { const x = r.int(10, 1190), y = r.int(40, 170), s = r.int(5, 11); o += `<ellipse cx="${x}" cy="${y}" rx="${s * 2.6}" ry="${s * 2.6}" fill="#ff5a2a" opacity=".12"/><ellipse cx="${x}" cy="${y}" rx="${s * .8}" ry="${s}" fill="#e2452a"/><path d="M${x},${y - s} L${x},${y - s - 30}" stroke="#1a0a06" stroke-width="1"/>`; } return o; };
  const lamps7 = () => { const pts = [[380, 120], [470, 108], [560, 128], [640, 150], [730, 140], [820, 110], [880, 70]]; return pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="26" fill="#ffb347" opacity=".13"/><path d="M${x},${y + 8} C${x - 6},${y} ${x - 2},${y - 10} ${x},${y - 16} C${x + 3},${y - 8} ${x + 7},${y - 2} ${x},${y + 8} Z" fill="#ffcf6a"/>`).join(''); };

  const DEFS = {
    1: () => moon(820, 52, 24, '#ff8a3a') + roofs('#1a0c08', 150) + roofs('#0d0604', 185),
    2: () => moon(380, 46, 20, '#ffd0a0') + lanterns() + roofs('#170a10', 160) + `<rect x="0" y="206" width="1200" height="34" fill="#0a0a14"/>` + `<path d="M0,212 C200,208 400,216 600,210 C800,204 1000,214 1200,208" stroke="#e2452a" stroke-width="1" opacity=".35" fill="none"/>`,
    3: () => moon(800, 50, 22, '#b8d0ff') + banners('#0c0f16') + roofs('#0c0f16', 190),
    4: () => moon(420, 60, 28, '#fff0c0') + pagoda(860, 190, 1.1, '#0a0a18') + roofs('#0a0a18', 176),
    5: () => `<rect x="0" y="150" width="1200" height="90" fill="url(#dawnGrad)"/>` + tower(600, 150, '#0b0b16') + roofs('#07070f', 200),
    6: () => lamps7(),
    0: () => moon(860, 40, 18, '#ffd9a0'),
  };
  function svg(ch) {
    const f = DEFS[ch] || DEFS[0];
    return `<svg class="scenery" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="dawnGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e98a3a" stop-opacity="0"/><stop offset="1" stop-color="#f0a050" stop-opacity=".55"/></linearGradient><radialGradient id="moonGlow"><stop offset="0" stop-color="#ffe6b0" stop-opacity=".32"/><stop offset=".45" stop-color="#ffd090" stop-opacity=".1"/><stop offset="1" stop-color="#ffd090" stop-opacity="0"/></radialGradient></defs>${f()}</svg>`;
  }
  return { svg };
})();

'use strict';
/* ============================================================
   燈下黑 — 粒子與聲音（WebAudio 即時合成：古琴撥弦、鑼、更鼓、梆子）
   ============================================================ */
const FX = (() => {
  let cv, ctx, W = 0, H = 0, DPR = 1, mode = 'dust', parts = [], bursts = [], running = false, last = 0;
  function init() {
    cv = document.getElementById('fxc');
    if (!cv) return;
    ctx = cv.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    running = true;
    requestAnimationFrame(tick);
  }
  function resize() {
    if (!cv) return;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function setMode(m) { mode = m; parts = []; }
  function spawnAmbient() {
    const max = G.meta.settings.reduce ? 12 : ({ embers: 70, dust: 40, lantern: 30, stars: 50, dawn: 60, lamp: 40, ash: 50 }[mode] || 30);
    while (parts.length < max) {
      const p = { x: Math.random() * W, y: Math.random() * H, life: 0, max: 4 + Math.random() * 8 };
      if (mode === 'embers') { p.y = H + Math.random() * 40; p.vx = (Math.random() - .5) * 20; p.vy = -20 - Math.random() * 50; p.r = .8 + Math.random() * 1.8; p.c = Math.random() < .7 ? '255,150,60' : '255,220,140'; }
      else if (mode === 'ash') { p.y = -10; p.vx = (Math.random() - .3) * 14; p.vy = 8 + Math.random() * 18; p.r = .6 + Math.random() * 1.5; p.c = '200,190,180'; }
      else if (mode === 'lantern') { p.vx = (Math.random() - .5) * 4; p.vy = -2 - Math.random() * 5; p.r = 2 + Math.random() * 5; p.c = '255,110,60'; }
      else if (mode === 'stars') { p.vx = 0; p.vy = 0; p.r = .5 + Math.random() * 1.3; p.c = '230,230,255'; p.tw = Math.random() * 6; }

  '消耗': '打出後移出本場戰鬥。', '保留': '回合結束時不會被棄掉。', '虛': '回合結束時若還在手中，就會消失。', '謀': '每回合的行動力。打牌要花謀。',

function kwWrap(txt) {
  return txt.replace(/(破綻|疑心|流言|離心|中計|伏兵|佈局|脫殼|金身|消耗|保留|虛)/g, m => `<span class="kw" data-tip="${esc(m)}：${esc(KW_TIP[m] || '')}">${m}</span>`);

/* ---------- card rendering ---------- */
function cardDesc(c, ctx = {}) {
  const d = cdef(c);
  let txt = (c.up && d.udesc) ? d.udesc : d.desc;
  const cb = ctx.inCombat ? G.cb : null;
  txt = txt.replace(/\{(\w+)\}/g, (m, k) => {
    const base = cv(c, k);
    if (base === undefined) return m;
    let v = base, cls = '';
    if (cb && /^d/.test(k)) {
      const p = cb.p;
      v = base + (p.st['勢'] || 0) + (hasRelic('xueshu') && p.hp < p.maxHp / 2 ? 3 : 0);
      if ((p.st['疑心'] || 0) > 0) v = Math.floor(v * .75);
      if (cb.omen === 'yinghuo') v = Math.floor(v * 1.5);
      v = Math.max(0, v);
    } else if (cb && /^b/.test(k)) {
      v = base + (cb.p.st['穩'] || 0);
      if (cb.omen === 'tiangou') v = Math.floor(v / 2);
    }
    if (v > base) cls = 'vup'; else if (v < base) cls = 'vdown';
    else if (c.up && d.u && k in d.u && d.u[k] !== d.v[k]) cls = 'vupg';
    return `<b class="${cls}">${v}</b>`;
  });

  const tags = [];
  if (cflag(c, 'ret')) tags.push('保留');
  if (cflag(c, 'eth') && d.type !== '計') tags.push('虛');
  if (cflag(c, 'ex') && !/消耗/.test(txt) && d.type !== '計') tags.push('消耗');
  if (tags.length) txt = `<span class="c-tags">${tags.map(t => `<span class="kw" data-tip="${t}：${KW_TIP[t]}">${t}</span>`).join('・')}</span>` + txt;

}
function cardHTML(c, ctx = {}) {

  if (!t) return;
  tipEl = tipEl || $('#tip');
  tipEl.innerHTML = t;
  tipEl.hidden = false;
  const r = el.getBoundingClientRect();
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let left = r.left + r.width / 2 - tw / 2;
  let top = r.top - th - 8;
  if (top < 6) top = r.bottom + 8;
  left = clamp(left, 6, window.innerWidth - tw - 6);
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
}
function hideTip() { if (tipEl) tipEl.hidden = true; }

/* ---------- modal ---------- */
UI.modal = function ({ title = '', html = '', buttons = [{ label: '關閉', value: null }], cls = '', dismiss = true, onMount }) {
  return new Promise(res => {
    const m = $('#modal');
    const wrap = document.createElement('div');
    wrap.className = 'mwrap ' + cls;
    wrap.innerHTML = `<div class="mbox" role="dialog" aria-modal="true">${title ? `<h2 class="mtitle">${title}</h2>` : ''}<div class="mbody">${html}</div><div class="mbtns">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-mi="${i}" ${b.disabled ? 'disabled' : ''}>${b.label}</button>`).join('')}</div></div>`;
    m.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('in'));
    const close = v => { wrap.classList.remove('in'); setTimeout(() => wrap.remove(), 200); res(v); };
    wrap.addEventListener('click', e => {
      const b = e.target.closest('[data-mi]');
      if (b) { SND.play('click'); const bt = buttons[+b.dataset.mi]; close(typeof bt.value === 'function' ? bt.value(wrap) : bt.value); return; }
      if (dismiss && e.target === wrap) close(null);
    });
    wrap._close = close;
    onMount && onMount(wrap, close);
  });
};
UI.confirm = (title, html, yes = '確定', no = '取消') => UI.modal({ title, html, buttons: [{ label: no, value: false }, { label: yes, value: true, cls: 'pri' }] });

/* pick cards from a list */
UI.pickCards = function (cards, o = {}) {
  const min = o.min ?? 1, max = o.max ?? 1;
  if (AUTO.on || SPEED.headless) return Promise.resolve(cards.length ? cards.slice(0, Math.max(1, Math.min(max, min || 1))) : []);
  return new Promise(res => {
    const sel = new Set();
    const html = `${o.sub ? `<p class="msub">${o.sub}</p>` : ''}<div class="cgrid">${cards.map((c, i) => `<div class="cpick" data-ci="${i}">${cardHTML(c, { preview: true })}${o.showUpgrade ? `<div class="upprev">${cardHTML(Object.assign({}, c, { up: 1, uid: c.uid + 'u' }))}</div>` : ''}</div>`).join('')}</div>`;
    UI.modal({
      title: o.title || '選擇', html, cls: 'wide pick', dismiss: !!o.cancel,
      buttons: [...(o.cancel ? [{ label: o.cancelLabel || '算了', value: () => null }] : []), { label: o.btn || '確定', cls: 'pri pick-ok', value: () => [...sel].map(i => cards[i]) }],
      onMount: (w) => {
        const ok = w.querySelector('.pick-ok');
        const upd = () => { ok.disabled = sel.size < min || sel.size > max; w.querySelectorAll('.cpick').forEach(el => el.classList.toggle('sel', sel.has(+el.dataset.ci))); };
        upd();
        w.querySelector('.cgrid').addEventListener('click', e => {
          const el = e.target.closest('.cpick'); if (!el) return;
          const i = +el.dataset.ci;
          SND.play('click');
          if (sel.has(i)) sel.delete(i);
          else { if (max === 1) sel.clear(); if (sel.size < max) sel.add(i); }
          upd();
          if (max === 1 && min === 1 && o.quick) ok.click();
        });
      },
    }).then(v => res(v || (o.cancel ? null : [])));
  });
};
UI.showDeck = function (cards, title = '牌組') {
  const sorted = cards.slice().sort((a, b) => (cdef(a).kind[0] || '').localeCompare(cdef(b).kind[0] || '') || cdef(a).name.localeCompare(cdef(b).name));
  return UI.modal({ title: `${title}（${cards.length}）`, html: cards.length ? `<div class="cgrid">${sorted.map(c => cardHTML(c)).join('')}</div>` : '<p class="msub">空的。</p>', cls: 'wide', buttons: [{ label: '收起', value: null }] });
};

/* ---------- toast & banners ---------- */
UI.toast = function (html, cls = '', ms = 2600) {
  const t = document.createElement('div');
  t.className = 'toast ' + cls;
  t.innerHTML = html;
  $('#toast').appendChild(t);
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 400); }, ms);
};

/* ---------- global event delegation ---------- */
UI.ACT = {};
function bindGlobal() {
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a && !a.disabled) {
      const fn = UI.ACT[a.dataset.act];
      if (fn) { SND.start(); fn(a, e); }
    }
  });
  document.addEventListener('pointerover', e => {
    const el = e.target.closest('[data-tip]');
    if (!el || e.pointerType === 'touch') return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => showTip(el), 260);
  });
  document.addEventListener('pointerout', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    clearTimeout(tipTimer); hideTip();
  });
  // touch: long press shows tip
  let lp = null;
  document.addEventListener('touchstart', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    lp = setTimeout(() => { showTip(el); setTimeout(hideTip, 2600); }, 420);
  }, { passive: true });
  document.addEventListener('touchend', () => clearTimeout(lp), { passive: true });
  document.addEventListener('touchmove', () => clearTimeout(lp), { passive: true });
  document.addEventListener('pointerdown', () => SND.start(), { once: true });
}

UI.ACT.deck = () => { if (G.run) UI.showDeck(G.run.deck, '牌組'); };

    if (ok) { if (G.cb && !G.cb.over) { G.cb.over = true; } RUN.die({ quit: true }); }

/* ---- ui_combat.js ---- */
'use strict';
/* ============================================================
   燈下黑 — 戰鬥介面 UIC
   ============================================================ */
const UIC = (() => {
  let root = null, enEls = new Map(), handEls = new Map(), sel = null, targeting = null, drag = null;
  const INTENT_ICON = { atk: '攻', def: '守', buf: '謀', debuf: '詭', sum: '召', charge: '蓄', flee: '逃', steal: '偷', unk: '？' };
  const INTENT_TIP = { atk: '攻擊', def: '防守', buf: '強化自己', debuf: '對你施加負面狀態', sum: '召喚幫手', charge: '蓄力，下一擊很重', flee: '打算逃跑', steal: '偷你的銀兩', unk: '意圖不明' };

  const fxLayer = () => $('#fx');
  const elOf = t => !t ? null : (t.isPlayer ? root && root.querySelector('.pl') : enEls.get(t.uid));

  /* ---------- mount ---------- */
  function mount(opts) {
    const scr = $('#screen');
    const ch = G.cb.ch || 1;

    document.body.dataset.screen = 'combat';
    UI.setScene(Math.min(6, ch));
    scr.innerHTML = `
      <div class="combat ch${ch} ${G.cb.isBoss ? 'bossfight' : ''}">
        <div class="stage">
          <div class="paper"><div class="paper-light"></div><div class="paper-grain"></div></div>
          <div class="c-title">${esc(G.cb.title || '')}</div>
          <div class="omenbar" hidden></div>
          <div class="pside">
            <div class="pl" data-uid="p">
              <div class="pl-pup">${PUP.svg(PUP.PLAYER)}</div>
              <div class="unitbar"><div class="hpbar"><i></i><em></em><span></span></div><div class="sts"></div></div>
            </div>
            <div class="comps"></div>
          </div>

          <svg class="aim" hidden><path d=""/></svg>

        </div>
        <div class="chainbar"></div>

          <div class="energy" data-tip="謀：每回合的行動力。"><b>0</b><small>/3</small></div>
          <button class="pile drawp" data-cact="drawpile" data-tip="抽牌堆">抽<b>0</b></button>
          <div class="hand"></div>
          <div class="piles-r">
            <button class="pile discp" data-cact="discpile" data-tip="棄牌堆">棄<b>0</b></button>

    root = scr.querySelector('.combat');

    scr.classList.add('in');
    bind();
    render();
    UI.hud();
    if (G.cb.isBoss) SND.play('drum');
  }

  /* ---------- rendering ---------- */
  function statusChips(u) {
    const out = [];
    for (const [k, v] of Object.entries(u.st)) {
      if (k === '識破' || k === '裝瘋') { if (k === '裝瘋') out.push(`<span class="stc good" data-tip="假痴不癲：攻擊你的人會流言 3、疑心 1。">痴</span>`); continue; }
      const info = STATUS[k] || { d: '', good: false };
      let val = v;
      if (k === '離心' && !u.isPlayer) val = `${v}/${discordThreshold(u)}`;
      if (k === '金身') val = '';
      if (k === '蓄勢') val = '';
      const tip = `${k}：${typeof v === 'string' ? ({ '預言': `打出「${v}」型的牌會失去 3 命。`, '封型': `「${v}」型的牌本回合費用 +1。`, '易容': `對「${v}」型的牌免疫。` }[k] || info.d) : info.d}`;
      out.push(`<span class="stc ${info.good ? 'good' : 'bad'} st-${k}" data-tip="${esc(tip)}">${k}${val !== '' ? `<b>${esc(val)}</b>` : ''}</span>`);
    }
    if (u.isPlayer) for (const [k, n] of Object.entries(u.powers)) {
      if (k === 'jiandieDraw') continue;
      out.push(`<span class="stc pw" data-tip="${esc(POWER_NAME[k])}：${esc(POWER_DESC[k] ? POWER_DESC[k](n) : '')}">${esc(POWER_NAME[k])}${n > 1 ? `<b>${n}</b>` : ''}</span>`);
    }
    if (!u.isPlayer && u.st['識破']) out.push(`<span class="stc good" data-tip="識破：暫時不會中計，也不會因離心而錯失行動。">識破</span>`);
    return out.join('');
  }
  function hpBar(el, u) {
    const bar = el.querySelector('.hpbar');
    if (!bar) return;
    bar.querySelector('i').style.width = Math.max(0, u.hp / u.maxHp * 100) + '%';
    const em = bar.querySelector('em');
    em.textContent = u.block > 0 ? u.block : '';
    em.classList.toggle('on', u.block > 0);
    bar.querySelector('span').textContent = `${Math.max(0, u.hp)}／${u.maxHp}`;
    bar.classList.toggle('low', u.hp < u.maxHp * .3);
  }
  function intentHTML(e) {
    const it = getIntent(e);
    const d = ENEMIES[e.id];
    const mv = d.moves[e.move] || {};
    let main = '';
    const icon = INTENT_ICON[it.t] || '？';
    if (it.t === 'atk') {
      const dmg = calcDmg(e, G.cb.p, it.d);
      main = `<span class="ii atk">${icon}</span><b>${dmg}${(it.n || 1) > 1 ? '<small>×' + it.n + '</small>' : ''}</b>`;
    } else main = `<span class="ii ${it.t}">${icon}</span>${it.lbl ? `<small class="il">${esc(it.lbl)}</small>` : ''}`;
    const extra = (it.x || []).map(x => `<span class="ii mini ${x}">${INTENT_ICON[x] || ''}</span>`).join('');
    const tip = `${esc(mv.name || '')}：${INTENT_TIP[it.t] || ''}${(it.x || []).map(x => '、' + (INTENT_TIP[x] || '')).join('')}`;
    return `<div class="intent i-${it.t}" data-tip="${tip}">${main}${extra}<div class="mvname">${esc(mv.name || '')}</div></div>`;
  }
  function enemyEl(e) {
    const d = ENEMIES[e.id];
    const el = document.createElement('div');
    el.className = `en ${e.boss ? 'boss' : ''} ${e.elite ? 'elite' : ''} b-${d.pup && d.pup.body}`;
    el.dataset.uid = e.uid;
    el.style.setProperty('--sc', (d.pup && d.pup.scale) || 1);
    el.innerHTML = `<div class="intentwrap"></div><div class="en-pup">${PUP.svg(d.pup || {}, { flip: true })}</div>
      <div class="en-name" data-tip="${esc(d.lore || '')}${d.passive ? '<br><b>' + esc(d.passive) + '</b>' : ''}">${esc(e.name)}${e.title ? `<small>${esc(e.title)}</small>` : ''}</div>
      <div class="unitbar"><div class="hpbar"><i></i><em></em><span></span></div><div class="sts"></div></div>`;
    el.addEventListener('click', ev => { ev.stopPropagation(); onEnemyClick(e); });
    el.addEventListener('pointerenter', () => { if (targeting || drag) el.classList.add('aimed'); });
    el.addEventListener('pointerleave', () => el.classList.remove('aimed'));
    return el;
  }
  function render() {
    const cb = G.cb;
    if (!root || !cb) return;
    const es = root.querySelector('.eside');
    // enemies
    for (const e of cb.enemies) {
      let el = enEls.get(e.uid);
      if (e.dead || e.fled) continue;
      if (!el) { el = enemyEl(e); enEls.set(e.uid, el); es.appendChild(el); }
      hpBar(el, e);
      el.querySelector('.sts').innerHTML = statusChips(e);
      const iw = el.querySelector('.intentwrap');
      const ih = cb.phase === 'over' ? '' : intentHTML(e);
      if (iw._h !== ih) { iw.innerHTML = ih; iw._h = ih; }
      el.classList.toggle('targetable', !!(targeting || (sel && needsTarget(sel))));
    }
    es.dataset.n = aliveEnemies().length;
    // player
    const pl = root.querySelector('.pl');
    hpBar(pl, cb.p);
    pl.querySelector('.sts').innerHTML = statusChips(cb.p);
    // energy & piles
    root.querySelector('.energy b').textContent = cb.p.energy;
    root.querySelector('.energy small').textContent = '/' + cb.p.baseEnergy;
    root.querySelector('.energy').classList.toggle('empty', cb.p.energy === 0);
    root.querySelector('.drawp b').textContent = cb.draw.length;
    root.querySelector('.discp b').textContent = cb.discard.length;
    root.querySelector('.exhp b').textContent = cb.exhaust.length;
    const et = root.querySelector('.endturn');
    et.disabled = cb.phase !== 'player' || cb.busy;
    et.classList.toggle('nudge', cb.phase === 'player' && !cb.hand.some(c => canPlay(c)) && !cb.comps.some(c => c.charge >= c.need));
    // companions
    root.querySelector('.comps').innerHTML = cb.comps.map((c, i) => {
      const C = COMPANIONS[c.id];
      const ready = c.charge >= c.need;
      return `<button class="comp ${ready ? 'ready' : ''}" data-cact="assist" data-ci="${i}" data-tip="${esc(C.name)}・援「${esc(C.assistName)}」：${esc(C.assistDesc)}<br>打出「${COMP_KIND[c.id]}」牌可充能。<br><i>${esc(C.passiveDesc)}</i>" style="--cc:${C.color}">
        <span class="cg">${esc(C.short)}</span><span class="pips">${Array.from({ length: c.need }, (_, k) => `<i class="${k < c.charge ? 'on' : ''}"></i>`).join('')}</span>${ready ? `<span class="cr">援</span>` : ''}</button>`;
    }).join('');
    renderChain();
    renderHand();
    UI.hud();
  }

  function renderChain() {
    const cb = G.cb;
    const bar = root.querySelector('.chainbar');
    const hints = chainHints();
    const blocked = schemesBlocked();
    const seals = cb.chain.map(ks => `<span class="cseal ${ks.length > 1 ? 'dual' : ''}">${ks.map(k => `<i class="s-${k}">${k}</i>`).join('')}</span>`).join('<span class="carrow">›</span>');
    const nexts = hints.next.map(h => `<span class="cnext" data-tip="${esc(h.s.name)}：${esc(h.s.desc)}">再出${h.need.map(k => `<i class="s-${k}">${k}</i>`).join('')}<b>→ ${esc(h.s.name)}</b></span>`).join('');
    bar.innerHTML = `<span class="clabel">計鏈</span><span class="cseq">${seals || '<em>打出牌，依序串成計。</em>'}</span>${blocked ? `<span class="cblock">${blocked === '封計' ? '封計：本回合無法成計' : '疑懼：手中有疑懼，計不成'}</span>` : ''}<span class="cnexts">${nexts}</span><span class="ccount" data-tip="本回合已成的計（第三個會觸發連環計）">${cb.turnStat ? '成計 ' + cb.turnStat.schemes : ''}</span>`;
  }

  function layoutHand() {
    const cb = G.cb;
    const hand = root.querySelector('.hand');
    const W = hand.clientWidth, n = cb.hand.length;
    const cw = parseFloat(getComputedStyle(root).getPropertyValue('--cw')) || 120;
    const maxSpread = Math.max(cw, W - 10);
    const step = n > 1 ? Math.min(cw * 0.92, (maxSpread - cw) / (n - 1)) : 0;
    const total = step * (n - 1) + cw;
    const x0 = (W - total) / 2;
    cb.hand.forEach((c, i) => {
      const el = handEls.get(c.uid);
      if (!el) return;
      const mid = (n - 1) / 2;
      const rot = n > 1 ? (i - mid) * Math.min(4, 22 / n) : 0;
      const y = Math.abs(i - mid) * Math.min(6, 30 / n);
      el.style.setProperty('--x', (x0 + i * step) + 'px');
      el.style.setProperty('--y', y + 'px');
      el.style.setProperty('--r', rot + 'deg');
      el.style.zIndex = el.classList.contains('sel') ? 60 : 10 + i;
    });
  }
  function renderHand() {
    const cb = G.cb;
    const hand = root.querySelector('.hand');
    const hints = chainHints();
    const live = new Set(cb.hand.map(c => c.uid));
    for (const [id, el] of handEls) if (!live.has(id)) { el.remove(); handEls.delete(id); }
    for (const c of cb.hand) {
      let el = handEls.get(c.uid);
      const html = cardHTML(c, { inCombat: true, hint: hints.byCard[c.uid] });
      if (!el) {
        el = document.createElement('div');
        el.className = 'hcard enter';
        el.dataset.uid = c.uid;
        hand.appendChild(el);
        handEls.set(c.uid, el);
        setTimeout(() => el.classList.remove('enter'), 30);
        bindCard(el, c);
      }
      if (el._h !== html) { el.innerHTML = html; el._h = html; }
      const playable = canPlay(c);
      el.classList.toggle('playable', playable);
      el.classList.toggle('sel', sel === c);
      el.classList.toggle('hk', !!(hints.byCard[c.uid] && hints.byCard[c.uid].known));
      el.classList.toggle('hu', !!(hints.byCard[c.uid] && !hints.byCard[c.uid].known));
      el.classList.toggle('sold', !!c.sold);
    }
    layoutHand();
    const zoom = root.querySelector('.cardzoom');
    if (zoom) {
      if (sel && cb.hand.includes(sel)) {
        const d = cdef(sel);
        const kws = [...new Set(((sel.up && d.udesc) ? d.udesc : d.desc).match(/破綻|疑心|流言|離心|中計|伏兵|佈局|脫殼|金身/g) || [])];
        zoom.innerHTML = cardHTML(sel, { inCombat: true, hint: hints.byCard[sel.uid] }) + (kws.length ? `<div class="zkw">${kws.map(k => `<p><b>${k}</b>${esc(KW_TIP[k] || '')}</p>`).join('')}</div>` : '') + `<div class="zhelp">${needsTarget(sel) ? '點敵人出手' : '再點一次牌打出'}</div>`;
        zoom.hidden = false;
      } else zoom.hidden = true;
    }
  }

  /* ---------- input ---------- */
  function bind() {
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-cact]');
      if (b) {
        e.stopPropagation();
        const a = b.dataset.cact;
        SND.play('click');
        if (a === 'end') { cancelSel(); endTurn(); }
        else if (a === 'drawpile') UI.showDeck(G.cb.draw.slice().sort(() => 0), '抽牌堆（順序已打亂）');
        else if (a === 'discpile') UI.showDeck(G.cb.discard, '棄牌堆');
        else if (a === 'exhpile') UI.showDeck(G.cb.exhaust, '消耗');
        else if (a === 'assist') onAssist(+b.dataset.ci);
        return;
      }
      if (!e.target.closest('.hcard') && !e.target.closest('.en')) cancelSel();

class RunEnded extends Error { constructor(k) { super('run-ended'); this.kind = k; } }

/* RNG bound to G.run.rs so it persists in saves */
const RR = {
  next() { const r = new RNG(1); r.s = G.run.rs; const v = r.next(); G.run.rs = r.s; return v; },
  int(a, b) { return a + Math.floor(RR.next() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(RR.next() * arr.length)]; },
  chance(p) { return RR.next() < p; },
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(RR.next() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
  weighted(pairs) { const tot = pairs.reduce((a, p) => a + p[1], 0); let r = RR.next() * tot; for (const [it, w] of pairs) { if ((r -= w) < 0) return it; } return pairs[pairs.length - 1][0]; },
};

      revived: false, opening: null,
    };
    if (star('tianquan') >= 3) G.run.potions.push(RR.pick(Object.keys(POTIONS).filter(k => POTIONS[k].rar === '常')));
    markSeen('relic', 'heizi');
    return G.run;
  },

  /* ---------- map ---------- */
  genMap(ch) {
    const H = 8, W = 5;
    const grid = Array.from({ length: H }, () => Array(W).fill(null));
    const edges = [];
    const crosses = (f, a, b) => edges.some(([ff, x, y]) => ff === f && ((x < a && y > b) || (x > a && y < b)));
    const starts = RR.shuffle([0, 1, 2, 3, 4]).slice(0, 2);
    const nPaths = 5;
    for (let p = 0; p < nPaths; p++) {
      let c = p < 2 ? starts[p] : RR.int(0, W - 1);
      for (let f = 0; f < H; f++) {
        grid[f][c] = grid[f][c] || { f, c, t: null, next: [], done: false };
        if (f === H - 1) break;
        const opts = RR.shuffle([-1, 0, 1].map(d => c + d).filter(x => x >= 0 && x < W));
        let nc = opts.find(x => !crosses(f, c, x));
        if (nc == null) nc = c;
        if (!edges.some(([ff, x, y]) => ff === f && x === c && y === nc)) edges.push([f, c, nc]);
        if (!grid[f][c].next.includes(nc)) grid[f][c].next.push(nc);
        c = nc;
      }
    }
    // types
    const nodes = grid.flat().filter(Boolean);
    const parents = n => nodes.filter(m => m.f === n.f - 1 && m.next.includes(n.c));
    for (const n of nodes.sort((a, b) => a.f - b.f)) {
      if (n.f === 0) { n.t = 'fight'; continue; }
      if (n.f === H - 1) { n.t = 'rest'; continue; }
      if (n.f === 4) { n.t = 'treasure'; continue; }
      const w = [['fight', 45], ['event', 23]];
      if (n.f >= 2) { w.push(['elite', 15]); w.push(['shop', 9]); }
      if (n.f >= 3 && n.f !== 6) w.push(['rest', 9]);
      let t = 'fight';
      for (let k = 0; k < 6; k++) {
        t = RR.weighted(w);
        const ps = parents(n);
        if (['elite', 'shop', 'rest'].includes(t) && ps.some(p => p.t === t)) continue;
        if (t === 'rest' && n.f === H - 2) continue;
        break;
      }
      n.t = t;
    }
    const mids = nodes.filter(n => n.f >= 2 && n.f <= 5 && n.f !== 4);
    if (!nodes.some(n => n.t === 'shop') && mids.length) { const x = RR.pick(mids.filter(n => n.t !== 'elite') || mids); if (x) x.t = 'shop'; }
    if (!nodes.some(n => n.t === 'elite') && mids.length) { const x = RR.pick(mids.filter(n => n.t === 'fight')); if (x) x.t = 'elite'; }
    return { ch, H, W, grid, boss: { f: H, c: 2, t: 'boss', done: false } };
  },
  node(f, c) { const m = G.run.map; if (f === m.H) return m.boss; return m.grid[f] && m.grid[f][c]; },
  reachable() {
    const r = G.run, m = r.map;
    if (!r.pos) return m.grid[0].filter(Boolean);
    if (r.pos.f === m.H - 1) return [m.boss];
    if (r.pos.f === m.H) return [];
    const cur = RUN.node(r.pos.f, r.pos.c);
    return cur.next.map(c => m.grid[r.pos.f + 1][c]).filter(Boolean);
  },

  /* ---------- enter node ---------- */
  async enter(n) {
    const r = G.run;
    r.pos = { f: n.f, c: n.c };
    r.pending = { type: 'node', f: n.f, c: n.c };
    saveGame();
    try {
      await RUN.resolve(n);
      n.done = true;
      r.pending = null;
      r.stats.floors++;
      if (n.t === 'boss') {
        r.pending = { type: 'afterboss', ch: r.ch };
        saveGame();
        r.pending = null;
        await RUN.afterBoss(r.ch);
        return;
      }
      saveGame();
      UI.go('map');
    } catch (e) {
      if (e instanceof RunEnded) return;
      console.error(e);
      UI.toast('發生錯誤：' + esc(e.message || e), 'bad', 5000);
      r.pending = null; n.done = true; saveGame();
      UI.go('map');
    }
  },
  async resolve(n) {
    const r = G.run;
    switch (n.t) {
      case 'fight': {
        const enc = RUN.pickEncounter(r.ch, r.stats.floors < 2 && r.ch <= 2 ? 'easy' : 'normal');
        await RUN.fight(enc, 'normal');
        await RUN.rewards('normal');
        break;
      }
      case 'elite': {
        const enc = RUN.pickEncounter(r.ch, 'elite');
        await RUN.fight(enc, 'elite');
        r.stats.elites++;
        await RUN.rewards('elite');
        break;
      }
      case 'event': await STORY.runEvent(); break;
      case 'shop': await SCREENS_RUN.shop(); break;
      case 'rest': await SCREENS_RUN.rest(); break;
      case 'treasure': {
        const rel = RUN.randomRelic(RR.weighted([['常', 50], ['奇', 33], ['絕', 17]]));
        await SCREENS_RUN.reward({ gold: RR.int(20, 40), relic: rel, title: '密匣', sub: STORY.treasureLine() });
        break;
      }
      case 'boss': await STORY.bossNode(r.ch); break;
    }
  },
  pickEncounter(ch, pool) {
    const r = G.run;
    const list = ENCOUNTERS[ch][pool];
    let enc = RR.pick(list);
    const key = ch + pool;
    if (list.length > 1) for (let k = 0; k < 4 && r.lastEnc[key] === enc.join(','); k++) enc = RR.pick(list);
    r.lastEnc[key] = enc.join(',');
    return enc;
  },
  async fight(enemies, kind, opts = {}) {
    const r = G.run;
    const mods = STORY.startMods(kind);
    const userStart = opts.onStart;
    const o = Object.assign({ enemies, kind, ch: r.ch }, opts, { onStart: async (B) => { await mods(B); if (userStart) await userStart(B); } });
    const res = await runCombat(o);
    if (!res.win) { await RUN.die({ killer: res.killer, kind }); throw new RunEnded('death'); }
    return res;
  },

  /* ---------- rewards ---------- */
  cardChoices(kind, n = 3) {
    const r = G.run;
    const pool = rewardPool();
    const out = [];
    const rarW = kind === 'boss' ? [['絕', 100]] : kind === 'elite' ? [['常', 45], ['奇', 42], ['絕', 13 + r.rarePity]] : [['常', 62], ['奇', 33], ['絕', 5 + r.rarePity]];
    for (let i = 0; i < n; i++) {
      let rar = RR.weighted(rarW);
      if (rar === '常') r.rarePity = Math.min(20, r.rarePity + 1); else if (rar === '絕') r.rarePity = 0;
      let cands = pool.filter(d => d.rar === rar && !out.some(o => o.id === d.id));
      if (!cands.length) cands = pool.filter(d => !out.some(o => o.id === d.id));
      const w = cands.map(d => [d, d.owner !== 'wei' ? 1.6 : 1]);
      const d = RR.weighted(w);
      const upChance = [0, 0, .05, .12, .2, .28, .3][r.ch] || 0;
      out.push(mkCard(d.id, RR.chance(upChance) ? 1 : 0));
    }
    out.forEach(c => markSeen('card', c.id));
    return out;
  },
  randomRelic(rar) {
    const owned = G.run.relics;
    let pool = RELIC_POOL(rar).filter(x => !owned.includes(x.id));
    if (!pool.length) pool = ['常', '奇', '絕'].flatMap(RELIC_POOL).filter(x => !owned.includes(x.id));
    if (!pool.length) return null;
    return RR.pick(pool).id;
  },
  randomPotion() {
    const rar = RR.weighted([['常', 65], ['奇', 28], ['絕', 7]]);
    const pool = Object.values(POTIONS).filter(p => p.rar === rar);
    return RR.pick(pool.length ? pool : Object.values(POTIONS)).id;
  },
  async rewards(kind) {
    const r = G.run;
    const noGold = r.relics.includes('jinsuanpan');
    const gold = noGold ? 0 : ({ normal: RR.int(12, 20), elite: RR.int(26, 36), boss: RR.int(85, 100) }[kind] + (r.relics.includes('tongqian') ? 12 : 0) + (r.relics.includes('zhangbu') ? 20 : 0));
    const potChance = kind === 'elite' ? .5 : kind === 'boss' ? 0 : .38;
    const rw = { gold, cards: RUN.cardChoices(kind), kind };
    if (RR.chance(potChance)) rw.potion = RUN.randomPotion();
    if (r.relics.includes('yaonang') && RR.chance(.25)) rw.potion2 = RUN.randomPotion();
    if (kind === 'elite') rw.relic = RUN.randomRelic(RR.weighted([['常', 50], ['奇', 35], ['絕', 15]]));
    if (kind === 'boss') {
      const pool = RELIC_POOL('首').filter(x => !r.relics.includes(x.id));
      rw.bossRelics = RR.shuffle(pool.map(x => x.id)).slice(0, 3);
    }
    await SCREENS_RUN.reward(rw);
  },
  gainRelic(id) {
    const r = G.run;
    if (!id || r.relics.includes(id)) return;
    r.relics.push(id);
    markSeen('relic', id);
    const R = RELICS[id];
    if (R.onPickup) R.onPickup();
    UI.toast(`<b>得到信物</b>・${esc(R.name)}<br><small>${esc(R.desc)}</small>`, 'relic');
    SND.play('buff');
  },
  gainPotion(id) {
    const r = G.run;
    if (r.potions.length >= r.potionSlots) return false;
    r.potions.push(id); markSeen('potion', id);
    return true;
  },
  addCard(id, up = 0) { const c = mkCard(id, up); G.run.deck.push(c); markSeen('card', id); return c; },
  priceMul() {
    const r = G.run;
    let m = 1;
    if (r.relics.includes('yaoshi')) m *= .8;
    if (r.relics.includes('tiechi')) m *= 1.5;
    m *= 1 - .1 * star('yuheng');
    return m;
  },

  /* ---------- chapter flow ---------- */
  async beginChapter(ch) {
    const r = G.run;
    r.ch = ch;
    r.map = RUN.genMap(ch);
    r.pos = null;
    r.pending = { type: 'chapter', ch };
    saveGame();
    UI.setScene(ch);
    await STORY.chapterIntro(ch);
    r.pending = null;
    saveGame();
    UI.go('map');
  },
  async afterBoss(ch) {
    const r = G.run;
    r.stats.bosses++;
    G.meta.bestChapter = Math.max(G.meta.bestChapter, ch);
    G.meta.stats.bosses[ch] = (G.meta.stats.bosses[ch] || 0) + 1;
    if (ch < 5) {
      const heal = yeshen() >= 7 ? .6 : 1;
      r.hp = Math.min(r.maxHp, r.hp + Math.ceil((r.maxHp - r.hp) * heal));
      await RUN.beginChapter(ch + 1);
    } else if (ch === 5) {
      if (rflag('trueRoute')) await STORY.finalApproach();
      else await RUN.dawn();
    } else if (ch === 6) {
      await RUN.trueEnding();
    }
  },

  /* ---------- endings of a night ---------- */
  oilFor(outcome) {
    const s = G.run.stats;
    let oil = Math.round(s.floors * 1.5) + s.elites * 8 + s.bosses * 20 + s.newSchemes * 5 + s.truths.length * 10;
    if (outcome === 'dawn') oil += 50;
    if (outcome === 'true') oil += 150;
    return Math.max(5, oil);
  },
  async settle(outcome) {
    const r = G.run;
    const oil = RUN.oilFor(outcome);
    G.meta.oil += oil; G.meta.oilTotal += oil;
    G.meta.stats.runs++;
    if (outcome !== 'death') G.meta.stats.wins++;
    G.meta.log.unshift({ loop: r.loop, ch: r.ch, outcome, floors: r.stats.floors, schemes: r.stats.schemes, killer: r.lastKiller || null, party: r.party.slice(), oil, at: Date.now() });
    G.meta.log = G.meta.log.slice(0, 12);
    for (const id of r.party) compMeta(id).trips++;
    flag('lastDeck', r.deck.map(c => ({ id: c.id, up: c.up })));
    const summary = { outcome, oil, stats: Object.assign({}, r.stats), ch: r.ch, loop: r.loop };
    G.run = null;
    G.cb = null;
    saveGame(true);
    return summary;
  },
  async die(info = {}) {
    const r = G.run;
    if (!r) return;
    r.lastKiller = info.killer || null;
    G.meta.deaths++;
    const ch = r.ch;
    await STORY.deathScene(info, ch);
    const sum = await RUN.settle('death');
    await SCREENS_RUN.summary(sum);
  },
  async dawn() {
    const r = G.run;
    G.meta.dawns++;
    await STORY.dawnScene(G.meta.dawns);
    const sum = await RUN.settle('dawn');
    await SCREENS_RUN.summary(sum);
  },
  async trueEnding() {
    G.meta.trueEnd++;
    await STORY.trueEndingScene();
    const sum = await RUN.settle('true');
    await SCREENS_RUN.summary(sum);
  },

  /* ---------- resume ---------- */
  async resume() {
    const r = G.run;
    if (!r) return UI.go('hub');
    UI.setScene(r.ch);
    const p = r.pending;
    if (!p) return UI.go('map');
    if (p.type === 'opening') return STORY.nightOpening(true);
    if (p.type === 'chapter') return RUN.beginChapter(p.ch);
    if (p.type === 'reward') { r.pending = null; await SCREENS_RUN.reward(p.rw); saveGame(); return UI.go('map'); }
    if (p.type === 'afterboss') { r.pending = null; return RUN.afterBoss(p.ch); }
    if (p.type === 'final') return STORY.finalApproach(true);
    if (p.type === 'node') { const n = RUN.node(p.f, p.c); if (n && !n.done) return RUN.enter(n); }
    r.pending = null;
    UI.go('map');
  },
};
DXH.RUN = RUN;

'use strict';
/* ============================================================
   燈下黑 — 主線劇情流程
   頁語法：'@名字：「台詞」' 說話；'~文字' 置中音效／標題；'#文字' 大標；其餘為敘述。
   ============================================================ */
const S = (pages, opts = {}) => SCN.play(Object.assign({ pages }, opts));
const when = (c, t) => (c ? t : null);

const STORY = {
  /* ---------- truths ---------- */
  truth(id) {
    if (!TRUTHS[id] || hasTruth(id)) return Promise.resolve(false);
    G.meta.truths[id] = Date.now();
    if (G.run) G.run.stats.truths.push(id);
    saveGame();
    return SCN.truthPop(id);
  },
  recruit(id) {
    const r = G.run;
    if (!r || r.party.includes(id)) return false;
    if (r.party.length >= 2) return false;
    r.party.push(id);
    const m = compMeta(id);
    const first = !m.met;
    m.met = true;
    UI.toast(`<b>${esc(COMPANIONS[id].name)}</b> 加入${first ? '（初識）' : ''}<br><small>${esc(COMPANIONS[id].passiveDesc)}</small>`, 'comp', 3400);
    SND.play('buff');
    saveGame();
    return true;
  },
  fatherToast() {
    if (hasTruth('watchman')) return '@魏長庚：「葳兒，」父親舉杯，看著你，像看一個終於長大的對手，「今晚，別讓爹失望。」';
    if (hasTruth('alive')) return '@魏長庚：「葳兒，今晚，辛苦你了。」';
    return '@魏長庚：「葳兒，今晚，好好吃頓飯。」';
  },
  startMods(kind) {
    return async (B) => {
      const r = G.run;
      if (!r) return;
      if (rflag('rumorNext') > 0) { B.applyAll('流言', 4); rflag('rumorNext', rflag('rumorNext') - 1); await UIC.banner('流言已經傳開了'); }
      if (rflag('ambushNext')) { B.selfApply('伏兵', 6); B.block(6, { raw: true }); rflag('ambushNext', 0); await UIC.banner('照著逃兵說的路線設伏'); }
      if (kind === 'boss' && rflag('crowd')) { B.applyAll('疑心', 2); await UIC.banner('鬼市的人在台下起鬨'); }
      if (kind === 'boss' && r.ch === 5 && rflag('edict')) { B.applyAll('疑心', 3); B.applyAll('破綻', 3); await UIC.banner('遺詔在此'); }
      if (kind === 'boss' && r.ch === 5 && rflag('prince')) { B.selfApply('勢', 2); }
      if (kind === 'elite' && rflag('poisonElite')) { B.applyAll('流言', 8); rflag('poisonElite', 0); }
    };
  },

  /* ============================================================
     a new night
     ============================================================ */
  async newNight() {
    G.meta.loops++;
    RUN.create();
    G.run.pending = { type: 'opening' };

'use strict';
/* ============================================================
   燈下黑 — 地圖奇遇
   ============================================================ */
const canRecruit = () => G.run && G.run.party.length < 2;
const EV = {
  say: (pages, o = {}) => S(pages.filter(Boolean), Object.assign({ bg: G.run.ch }, o)),
  ask: (pages, choices, o = {}) => S(pages.filter(Boolean), Object.assign({ bg: G.run.ch, choices: choices.filter(Boolean) }, o)),
  gold(n) { G.run.gold = Math.max(0, G.run.gold + n); UI.toast(n >= 0 ? `+${n} 兩` : `${n} 兩`, 'gold'); SND.play('coin'); UI.hud(); },
  heal(n) { const r = G.run; const v = Math.min(n, r.maxHp - r.hp); r.hp += v; if (v) { UI.toast(`回復 ${v} 命`, 'heal'); SND.play('heal'); } UI.hud(); },
  hurt(n) { const r = G.run; r.hp = Math.max(1, r.hp - n); UI.toast(`失去 ${n} 命`, 'bad'); SND.play('hit'); UI.hud(); },
  maxHp(n) { const r = G.run; r.maxHp += n; r.hp += n; UI.toast(`命上限 +${n}`, 'heal'); UI.hud(); },
  addCard(id, up = 0) { const c = RUN.addCard(id, up); UI.toast(`得到牌・${esc(cardName(c))}`, 'card'); SND.play('page'); UI.hud(); return c; },
  curse(id = 'huangkong') { RUN.addCard(id); UI.toast(`牌組加入詛咒・${CARDS[id].name}`, 'bad'); SND.play('debuff'); UI.hud(); },
  async cardChoice(kind = 'normal', n = 3, title = '選一張牌') {
    const cs = RUN.cardChoices(kind, n);
    const pick = await UI.pickCards(cs, { title, min: 1, max: 1, cancel: true, cancelLabel: '都不要', btn: '收下' });
    if (pick && pick[0]) { RUN.addCard(pick[0].id, pick[0].up); SND.play('page'); UI.hud(); return pick[0]; }
    return null;
  },
  async removeCard(title = '選一張牌燒掉') {
    const deck = G.run.deck;
    const pick = await UI.pickCards(deck, { title, min: 1, max: 1, cancel: true });
    if (pick && pick[0]) { deck.splice(deck.indexOf(pick[0]), 1); UI.toast(`燒掉了・${esc(cardName(pick[0]))}`, 'card'); SND.play('fire'); UI.hud(); return true; }
    return false;
  },
  async upgradeCard(title = '參悟一張牌') {
    const list = G.run.deck.filter(c => !c.up && cdef(c).type !== '咒' && cdef(c).type !== '傷');
    if (!list.length) return false;
    const pick = await UI.pickCards(list, { title, min: 1, max: 1, cancel: true, showUpgrade: true });
    if (pick && pick[0]) { pick[0].up = 1; UI.toast(`參悟・${esc(cardName(pick[0]))}`, 'card'); SND.play('buff'); return true; }
    return false;
  },
  upgradeRandom(n, kind) {
    const list = RR.shuffle(G.run.deck.filter(c => !c.up && cdef(c).type !== '咒' && cdef(c).type !== '傷' && (!kind || cdef(c).kind.includes(kind))));
    const got = list.slice(0, n);
    got.forEach(c => { c.up = 1; });
    if (got.length) UI.toast(`參悟・${got.map(c => esc(cardName(c))).join('、')}`, 'card');
    return got.length;
  },
  relic(id) { if (id) RUN.gainRelic(id); },
  randomRelic(rar) { const id = RUN.randomRelic(rar); if (id) RUN.gainRelic(id); return id; },
  potion(id) { id = id || RUN.randomPotion(); if (RUN.gainPotion(id)) { UI.toast(`得到錦囊・${POTIONS[id].name}`, 'card'); UI.hud(); return true; } UI.toast('錦囊滿了，只好放下', 'bad'); return false; },
  reveal(n) { const got = revealSchemes(n); if (got.length) UI.toast(`計譜揭示：${got.map(s => s.name).join('、')}`, 'truth', 3600); return got; },
  oil(n) { G.meta.oil += n; G.meta.oilTotal += n; UI.toast(`燈油 +${n}`, 'gold'); },
  truth: id => STORY.truth(id),
  recruit: id => STORY.recruit(id),
  fight: (enemies, kind = 'normal', opts = {}) => RUN.fight(enemies, kind, opts),
  rewards: kind => RUN.rewards(kind),
};

function defEvent(id, s) { s.id = id; EVENTS[id] = s; }
function pickEvent() {
  const r = G.run;
  const cands = Object.values(EVENTS).filter(ev => (!ev.ch || ev.ch.includes(r.ch)) && !r.eventsSeen.includes(ev.id) && (!ev.cond || ev.cond()) && !(ev.once === 'meta' && flag('ev_' + ev.id)));
  const pri = cands.filter(ev => ev.pri && ev.pri());
  if (pri.length) return RR.pick(pri);
  if (!cands.length) return EVENTS.ambush;
  return RR.weighted(cands.map(ev => [ev, ev.w || 10]));
}
