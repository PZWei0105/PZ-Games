<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>燈下黑</title>
<meta name="description" content="劇情向 Roguelike 牌組構築：一夜、七燈、三十六計。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600;700;900&display=swap">
<style>
/* ============================================================
   燈下黑 — 樣式（單一夜色主題：墨、燈、硃砂）
   ============================================================ */
:root {
  color-scheme: dark;
  --ink: #0d0a09; --ink2: #17110e; --ink3: #231a14; --ink4: #2e2219;
  --line: rgba(233, 210, 170, .14); --line2: rgba(233, 210, 170, .26);
  --bone: #eadfcb; --bone2: #cdbfa6; --muted: #9c8c78;
  --paper: #f1dcae; --lamp: #ffb347; --lamp2: #ffd98a;
  --cin: #c1352a; --cin2: #e0503f; --gold: #d9a441; --gold2: #f0c870;
  --jade: #4a9a88; --steel: #7fa4c4; --violet: #9d7ae0;
  --k-tan: #2f8f7b; --k-you: #cc5f86; --k-jian: #8360c8; --k-luan: #d97a26; --k-fu: #3f74a8; --k-sha: #c33a2d;
  --font-body: "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "PMingLiU", "MingLiU", "Songti TC", serif;
  --font-disp: "LXGW WenKai TC", "DFKai-SB", "BiauKai", "KaiTi", "Noto Serif TC", "Noto Serif CJK TC", serif;
  --cw: 128px; --ch: 180px;
  --hud: 54px;
  background: var(--ink);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--bone); font-family: var(--font-body); font-size: 15px; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
#app { position: relative; height: 100%; overflow: hidden; isolation: isolate; }
.btn { background: linear-gradient(#2a201a, #1b1410); border: 1px solid var(--line2); color: var(--bone); padding: 10px 18px; border-radius: 8px; letter-spacing: .08em; transition: transform .12s, border-color .2s, background .2s; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.btn:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn small { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.btn.pri { background: linear-gradient(#a52c22, #7a1c15); border-color: #e0685a; color: #fff3e2; box-shadow: 0 4px 18px rgba(193, 53, 42, .35); }
.btn.pri small { color: #f5c9b8; }
.btn.danger { border-color: #7a2a22; color: #f0a494; }
.btn.big { font-size: 18px; padding: 14px 34px; min-width: 220px; }
.msub { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 4px 0 10px; }

/* ---------- background ---------- */
.bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.bg .sky { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, #241a14 0%, #0d0a09 70%); transition: background 1.2s; }
.bg.ch1 .sky { background: radial-gradient(ellipse at 50% 110%, rgba(255, 96, 32, .55) 0%, rgba(120, 30, 10, .35) 35%, transparent 70%), linear-gradient(#0f0605, #2a0c07); }
.bg.ch2 .sky { background: radial-gradient(ellipse at 30% 100%, rgba(230, 70, 40, .28), transparent 60%), linear-gradient(#08080f, #180b12); }
.bg.ch3 .sky { background: radial-gradient(ellipse at 70% 100%, rgba(255, 140, 60, .18), transparent 55%), linear-gradient(#05080e, #111a24); }
.bg.ch4 .sky { background: radial-gradient(ellipse at 25% 20%, rgba(255, 240, 200, .10), transparent 40%), linear-gradient(#05051a, #10102a); }
.bg.ch5 .sky { background: linear-gradient(#070a22 0%, #1b1840 45%, #4a2a3a 75%, #a8583a 100%); }
.bg.ch6 .sky { background: radial-gradient(ellipse at 50% 60%, rgba(255, 170, 70, .16), transparent 55%), #050403; }
.scenery { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; opacity: .95; }
.bg .haze { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0, 0, 0, .55) 100%); }
#fxc { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

/* ---------- screens ---------- */
#screen { position: absolute; inset: 0; z-index: 2; overflow: hidden auto; opacity: 0; transition: opacity .45s; }
#screen.in { opacity: 1; }
body[data-screen="map"] #screen, body[data-screen="combat"] #screen, body[data-screen="reward"] #screen, body[data-screen="shop"] #screen, body[data-screen="rest"] #screen { padding-top: var(--hud); }
body[data-screen="combat"] #screen { overflow: hidden; }

/* ---------- HUD ---------- */
#hud { position: absolute; top: 0; left: 0; right: 0; z-index: 6; height: var(--hud); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: linear-gradient(rgba(10, 7, 6, .96), rgba(10, 7, 6, .78)); border-bottom: 1px solid var(--line); }
.hud-l, .hud-r { display: flex; align-items: center; gap: 10px; flex: none; }
.hud-m { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.hud-m::-webkit-scrollbar { display: none; }
.watch { display: flex; flex-direction: column; align-items: center; line-height: 1; padding: 4px 8px; border: 1px solid rgba(193, 53, 42, .6); border-radius: 4px; background: rgba(193, 53, 42, .14); }
.watch b { font-family: var(--font-disp); font-size: 17px; color: #ffcfb8; }
.watch small { font-size: 10px; color: var(--muted); margin-top: 2px; }
.hp { position: relative; width: 130px; height: 20px; background: #2a0f0c; border: 1px solid #6a2a22; border-radius: 10px; overflow: hidden; }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#e0503f, #9a2419); transition: width .4s; }
.hp span { position: relative; display: block; text-align: center; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.gold { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; color: var(--gold2); }
.gi { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #6a4a14; color: #ffe6a8; font-size: 11px; border: 1px solid var(--gold); }
.pots, .relics { display: flex; gap: 5px; flex: none; }
.potion, .relic { width: 28px; height: 28px; display: grid; place-items: center; flex: none; }
.potion { border-radius: 50% 50% 45% 45%; background: radial-gradient(circle at 40% 35%, #6a3a5a, #2a1624); border: 1px solid #a86a98; font-family: var(--font-disp); font-size: 13px; cursor: pointer; }
.potion.empty { background: transparent; border: 1px dashed var(--line2); cursor: default; }
.relic { border-radius: 6px; background: linear-gradient(#3a2a18, #22180e); border: 1px solid #8a6a3a; font-family: var(--font-disp); font-size: 14px; color: #ffe0a8; }
.relic.rr-奇 { border-color: var(--jade); } .relic.rr-絕 { border-color: var(--gold2); box-shadow: 0 0 8px rgba(240, 200, 112, .35); }
.relic.rr-首 { border-color: var(--cin2); color: #ffc8b8; } .relic.rr-事 { border-color: #c88ab8; } .relic.rr-起 { border-color: var(--bone2); }
.relic.big, .potion.big { width: 46px; height: 46px; font-size: 22px; }
.hud-comp { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-disp); background: var(--ink3); border: 1px solid var(--line2); font-size: 14px; }
.hbtn { background: var(--ink3); border: 1px solid var(--line2); border-radius: 6px; height: 32px; min-width: 36px; padding: 0 8px; display: flex; align-items: center; gap: 3px; font-family: var(--font-disp); font-size: 15px; }
.hbtn small { font-family: var(--font-body); font-size: 11px; color: var(--muted); }

/* ---------- tooltip & toast ---------- */
#tip { position: fixed; z-index: 60; max-width: 280px; padding: 8px 10px; background: rgba(18, 12, 9, .97); border: 1px solid var(--line2); border-radius: 6px; font-size: 13px; line-height: 1.6; color: var(--bone); pointer-events: none; box-shadow: 0 8px 24px rgba(0, 0, 0, .6); }
#tip i { color: var(--muted); font-style: normal; }
#toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 55; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast { background: rgba(20, 14, 10, .96); border: 1px solid var(--line2); border-left: 3px solid var(--gold); padding: 8px 14px; border-radius: 6px; font-size: 13px; line-height: 1.5; opacity: 0; transform: translateY(10px); transition: all .3s; text-align: center; }
.toast.in { opacity: 1; transform: none; }
.toast small { color: var(--muted); }
.toast.bad { border-left-color: var(--cin2); } .toast.heal { border-left-color: #5ab36a; } .toast.truth { border-left-color: var(--violet); } .toast.comp { border-left-color: var(--jade); } .toast.relic { border-left-color: var(--gold2); }

/* ---------- modal ---------- */
#modal { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
#modal > * { pointer-events: auto; }
.mwrap { position: absolute; inset: 0; background: rgba(4, 3, 2, .74); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .2s; backdrop-filter: blur(2px); }
.mwrap.in { opacity: 1; }
.mbox { width: 100%; max-width: 560px; max-height: calc(100% - 20px); overflow: auto; background: linear-gradient(#1d1611, #130e0b); border: 1px solid rgba(217, 164, 65, .32); border-radius: 12px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0, 0, 0, .7); transform: translateY(8px); transition: transform .25s; }
.mwrap.in .mbox { transform: none; }
.mwrap.wide .mbox { max-width: 1040px; }
.mtitle { margin: 0 0 8px; font-family: var(--font-disp); font-size: 24px; letter-spacing: .12em; color: var(--gold2); text-wrap: balance; }
.mbody h3 { font-family: var(--font-disp); color: var(--bone2); font-size: 17px; margin: 18px 0 8px; letter-spacing: .1em; }
.mbtns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw), 1fr)); gap: 14px; justify-items: center; }
.cpick { cursor: pointer; border-radius: 12px; padding: 4px; transition: transform .15s; position: relative; }
.cpick:hover { transform: translateY(-3px); }
.cpick.sel { box-shadow: 0 0 0 3px var(--gold2), 0 0 20px rgba(240, 200, 112, .45); }
.pick .upprev { display: none; }
.pick .cpick.sel .upprev { display: block; position: absolute; left: 100%; top: 0; margin-left: 8px; z-index: 3; }

/* ---------- cards ---------- */
.card { --kc: #6a5a4a; position: relative; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .08); background: linear-gradient(168deg, #f6ead0 0%, #ead7ae 55%, #dcc394 100%); color: #25180f; box-shadow: 0 6px 16px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .45); overflow: hidden; user-select: none; -webkit-user-select: none; font-family: var(--font-body); }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 42%; background: radial-gradient(ellipse at 50% 120%, transparent 30%, rgba(0, 0, 0, .12) 100%), linear-gradient(var(--kc), color-mix(in srgb, var(--kc) 70%, #000)); opacity: .9; }
.card::after { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(95deg, rgba(90, 60, 30, .05) 0 1px, transparent 1px 7px), repeating-linear-gradient(5deg, rgba(90, 60, 30, .04) 0 1px, transparent 1px 11px); pointer-events: none; }
.k-殺 { --kc: var(--k-sha); } .k-伏 { --kc: var(--k-fu); } .k-探 { --kc: var(--k-tan); } .k-誘 { --kc: var(--k-you); } .k-間 { --kc: var(--k-jian); } .k-亂 { --kc: var(--k-luan); } .k-計 { --kc: #2a1a10; } .k-咒 { --kc: #3a3044; }
.c-frame { position: absolute; inset: 4px; border: 1.5px solid rgba(60, 30, 10, .28); border-radius: calc(var(--cw) * .06); z-index: 1; pointer-events: none; }
.rar-奇 .c-frame { border-color: rgba(47, 143, 123, .8); box-shadow: inset 0 0 0 1px rgba(47, 143, 123, .3); }
.rar-絕 .c-frame { border: 2px solid #c8952e; box-shadow: inset 0 0 12px rgba(217, 164, 65, .45); }
.rar-絕 { background: linear-gradient(168deg, #fff2cf 0%, #f0d796 60%, #d8b25e 100%); }
.c-cost { position: absolute; z-index: 3; left: 5px; top: 5px; width: calc(var(--cw) * .2); height: calc(var(--cw) * .2); min-width: 22px; min-height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3a2a1c, #0e0907); color: var(--lamp2); font-weight: 900; font-size: calc(var(--cw) * .12); display: grid; place-items: center; border: 2px solid var(--gold); font-variant-numeric: tabular-nums; }
.c-cost.cheap { color: #9cf0b0; border-color: #5ab36a; } .c-cost.dear { color: #ffa090; border-color: var(--cin2); }
.c-seals { position: absolute; z-index: 3; right: 5px; top: 5px; display: flex; gap: 2px; }
.seal { width: calc(var(--cw) * .16); height: calc(var(--cw) * .16); min-width: 17px; min-height: 17px; border-radius: 3px; display: grid; place-items: center; font-family: var(--font-disp); font-size: calc(var(--cw) * .11); color: #fff6e6; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .45), 0 1px 2px rgba(0, 0, 0, .4); }
.s-殺 { background: var(--k-sha); } .s-伏 { background: var(--k-fu); } .s-探 { background: var(--k-tan); } .s-誘 { background: var(--k-you); } .s-間 { background: var(--k-jian); } .s-亂 { background: var(--k-luan); } .s-計 { background: linear-gradient(#e0b04a, #9a6a1a); color: #2a1406; }
.c-art { position: relative; z-index: 2; height: 40%; display: grid; place-items: center; }
.c-glyph { font-family: var(--font-disp); font-size: calc(var(--cw) * .4); line-height: 1; color: rgba(255, 246, 228, .94); text-shadow: 0 2px 0 rgba(0, 0, 0, .35), 0 0 18px rgba(0, 0, 0, .25); margin-top: 8%; }
.c-owner { position: absolute; right: 7px; bottom: 4px; font-family: var(--font-disp); font-size: calc(var(--cw) * .09); background: rgba(0, 0, 0, .45); color: #fff; border-radius: 3px; padding: 0 4px; }
.c-name { position: relative; z-index: 2; text-align: center; font-weight: 700; font-size: calc(var(--cw) * .118); letter-spacing: .06em; margin-top: 4px; font-family: var(--font-disp); }
.c-name i { font-style: normal; color: #2a8a4a; }
.c-type { position: relative; z-index: 2; text-align: center; font-size: calc(var(--cw) * .072); color: #7a6048; letter-spacing: .15em; }
.c-desc { position: relative; z-index: 2; padding: 3px 8px 0; font-size: calc(var(--cw) * .088); line-height: 1.42; text-align: center; }
.card.dl .c-desc { font-size: calc(var(--cw) * .079); line-height: 1.36; }
.card.dxl .c-desc { font-size: calc(var(--cw) * .071); line-height: 1.32; padding-top: 1px; }
.card.dxl .c-art { height: 34%; } .card.dl .c-art { height: 37%; }
.c-desc b { font-weight: 900; } .c-desc b.vup { color: #1f8a3a; } .c-desc b.vdown { color: #b02a1a; } .c-desc b.vupg { color: #1f7a4a; }
.c-tags { display: block; font-size: .92em; color: #7a4a20; font-weight: 700; margin-bottom: 1px; }
.kw { border-bottom: 1px dotted rgba(80, 40, 10, .55); cursor: help; }
.c-hint { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; font-size: calc(var(--cw) * .08); text-align: center; padding: 3px 2px; font-weight: 700; letter-spacing: .05em; }
.c-hint.known { background: linear-gradient(90deg, #b8801e, #f0c870, #b8801e); color: #2a1406; }
.c-hint.unknown { background: linear-gradient(90deg, #5a3aa0, #9d7ae0, #5a3aa0); color: #fff; }
.c-hint.blocked { filter: grayscale(1); opacity: .7; }
.card.up { box-shadow: 0 6px 16px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .45), 0 0 0 1px rgba(90, 200, 120, .5); }
.card.t-計 { background: linear-gradient(170deg, #2c1d12, #120b07); color: #ffe7b8; }
.card.t-計::before { background: radial-gradient(ellipse at 50% 100%, rgba(240, 200, 112, .35), transparent 70%); }
.card.t-計 .c-frame { border: 2px solid #c8952e; }
.card.t-計 .c-glyph { color: #ffd98a; text-shadow: 0 0 20px rgba(255, 180, 60, .7); }
.card.t-計 .c-type { color: #d9a441; } .card.t-計 .kw { border-color: rgba(255, 220, 160, .5); }
.card.t-咒, .card.t-傷 { background: linear-gradient(170deg, #3a3044, #1e1824); color: #ddd0ea; }
.card.t-咒 .c-type, .card.t-傷 .c-type { color: #a898b8; }
.card.locked { background: #1e1712; } .card.locked::before { background: #2a2019; }

/* ---------- combat ---------- */
.combat { --cw: 128px; --ch: 180px; height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; }
.stage { position: relative; display: grid; grid-template-columns: minmax(170px, 24%) 1fr; align-items: end; padding: 14px 24px 10px; min-height: 0; }
.paper { position: absolute; inset: 10px 16px 4px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 5px #2a190f, 0 0 0 7px #0f0906, 0 18px 50px rgba(0, 0, 0, .7), inset 0 0 90px rgba(40, 14, 0, .65); }
.paper-light { position: absolute; inset: -10%; background: radial-gradient(ellipse at 48% 68%, #ffe2a2 0%, #f5bd62 26%, #c77a30 58%, #5a2a0e 100%); animation: flick 5s infinite ease-in-out; }
.combat.ch1 .paper-light { background: radial-gradient(ellipse at 48% 72%, #ffd08a 0%, #f0a050 28%, #b85a22 58%, #4a1a08 100%); }
.combat.ch3 .paper-light { background: radial-gradient(ellipse at 48% 70%, #fbe0b0 0%, #e2b068 28%, #a8703a 58%, #3a2412 100%); }
.combat.ch4 .paper-light { background: radial-gradient(ellipse at 48% 68%, #fff0c8 0%, #ecc680 26%, #b0843a 58%, #3a2810 100%); }
.combat.ch5 .paper-light { background: radial-gradient(ellipse at 50% 80%, #ffe6c0 0%, #f4b878 30%, #b8704a 60%, #3a2030 100%); }
.combat.ch6 .paper-light { background: radial-gradient(ellipse at 50% 64%, #fff4c8 0%, #ffcc70 22%, #c07a2a 50%, #2a1206 100%); animation-duration: 2.6s; }
.paper-grain { position: absolute; inset: 0; background-image: repeating-linear-gradient(92deg, rgba(90, 50, 20, .07) 0 1px, transparent 1px 9px), repeating-linear-gradient(2deg, rgba(90, 50, 20, .05) 0 1px, transparent 1px 13px); mix-blend-mode: multiply; }
@keyframes flick { 0%, 100% { opacity: 1; transform: scale(1); } 20% { opacity: .93; } 45% { opacity: .98; transform: scale(1.01); } 60% { opacity: .9; } 80% { opacity: .97; } }
.c-title { position: absolute; left: 30px; top: 18px; z-index: 3; font-family: var(--font-disp); font-size: 15px; color: rgba(60, 25, 5, .55); letter-spacing: .3em; }
.omenbar { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 6; background: rgba(12, 10, 30, .9); border: 1px solid #6a6ab8; color: #dfe0ff; padding: 6px 14px; border-radius: 6px; font-size: 13px; max-width: calc(100% - 60px); text-align: center; }
.omenbar b { color: #b8b8ff; margin-right: 8px; font-family: var(--font-disp); }
.omenbar.flash { animation: omflash .9s; }
@keyframes omflash { 0% { box-shadow: 0 0 0 0 rgba(160, 160, 255, .9); } 100% { box-shadow: 0 0 0 20px rgba(160, 160, 255, 0); } }
.pside, .eside { position: relative; z-index: 2; }
.pside { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pl { display: flex; flex-direction: column; align-items: center; width: 100%; }
.pl-pup { width: clamp(96px, 12vw, 150px); }
.puppet { width: 100%; height: auto; display: block; mix-blend-mode: multiply; overflow: visible; }
.pp-body { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.6s ease-in-out infinite; }
.pp-arm { transform-box: view-box; transform-origin: 72px 60px; animation: armw 2.8s ease-in-out infinite; }
.pp-head { transform-box: view-box; transform-origin: 70px 50px; animation: nod 4.4s ease-in-out infinite; }
.pp-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .5s ease-in-out infinite alternate; }
@keyframes sway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
@keyframes armw { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
@keyframes nod { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(2.5deg); } }
@keyframes flame { from { transform: scale(1, 1); } to { transform: scale(.9, 1.12) skewX(3deg); } }
.unitbar { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 2px; width: 100%; }

@keyframes lowpulse { 50% { filter: brightness(1.4); } }

.hpbar em { position: absolute; left: -12px; top: 50%; transform: translateY(-50%) scale(0); width: 26px; height: 26px; border-radius: 6px 6px 13px 13px; background: linear-gradient(#8ab4d8, #3a6a98); border: 1px solid #cfe2f2; color: #fff; font-style: normal; font-weight: 900; font-size: 12px; display: grid; place-items: center; transition: transform .2s; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }

.sts { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 190px; }

.stc.bad { border-color: rgba(157, 122, 224, .6); } .stc.good { border-color: rgba(217, 164, 65, .6); } .stc.pw { border-color: rgba(74, 154, 136, .7); color: #bfeee0; }
.st-離心 { background: rgba(80, 50, 140, .9); } .st-流言 { background: rgba(120, 60, 10, .9); } .st-破綻 { background: rgba(140, 40, 60, .9); } .st-中計 { background: rgba(20, 80, 60, .95); }
.comps { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.comp { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; background: rgba(15, 10, 8, .88); border: 1px solid var(--line2); border-radius: 8px; padding: 4px 8px; min-width: 46px; }

.comp.ready { border-color: var(--gold2); animation: ready 1.2s infinite; }

.eside { display: flex; justify-content: center; align-items: flex-end; gap: clamp(4px, 1.4vw, 18px); flex-wrap: nowrap; padding-bottom: 2px; }
.en { position: relative; display: flex; flex-direction: column; align-items: center; width: calc(clamp(92px, 13vw, 172px) * var(--sc, 1)); transition: transform .2s, opacity .3s, filter .2s; cursor: default; }
.eside[data-n="4"] .en, .eside[data-n="5"] .en { width: calc(clamp(74px, 10vw, 140px) * var(--sc, 1)); }
.en-pup { width: 100%; }

.en-name { font-family: var(--font-disp); font-size: 14px; color: #2a1206; font-weight: 700; text-align: center; line-height: 1.2; text-shadow: 0 1px 0 rgba(255, 240, 200, .6); cursor: help; }
.en-name small { display: block; font-size: 10px; color: #6a3a1a; letter-spacing: .1em; }
.en.boss .en-name { font-size: 17px; color: #5a0e06; }
.intentwrap { min-height: 44px; display: flex; align-items: flex-end; justify-content: center; }
.intent { position: relative; display: flex; align-items: center; gap: 3px; padding: 3px 8px 3px 3px; background: rgba(15, 9, 6, .9); border-radius: 18px; border: 1px solid rgba(255, 255, 255, .14); color: #fff; font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums; animation: bob 2.2s ease-in-out infinite; cursor: help; }
.intent b small { font-size: 12px; color: #ffbca8; margin-left: 1px; }
.intent .mvname { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 400; color: #3a1a08; white-space: nowrap; margin-top: 1px; text-shadow: 0 1px 0 rgba(255, 235, 200, .7); }
.ii { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-disp); font-size: 14px; font-weight: 400; color: #fff; }
.ii.atk { background: radial-gradient(circle at 35% 30%, #ff6a50, #9a1a10); } .ii.def { background: radial-gradient(circle at 35% 30%, #8ab4d8, #2a5a88); } .ii.buf { background: radial-gradient(circle at 35% 30%, #f0c870, #8a5a10); } .ii.debuf { background: radial-gradient(circle at 35% 30%, #b89af0, #4a2a8a); } .ii.sum { background: radial-gradient(circle at 35% 30%, #d8d8d8, #5a5a5a); } .ii.charge { background: radial-gradient(circle at 35% 30%, #ff9a40, #8a3a00); animation: chg .6s infinite alternate; } .ii.flee { background: #6a6a4a; } .ii.steal { background: #8a7a2a; } .ii.unk { background: #4a4a4a; }
.ii.mini { width: 18px; height: 18px; font-size: 10px; }
.il { font-size: 11px; font-weight: 400; color: #ffd9b8; margin-left: 2px; }
@keyframes chg { to { box-shadow: 0 0 10px #ff9a40; } }
@keyframes bob { 50% { transform: translateY(-3px); } }
.movetag { position: absolute; top: 34%; left: 50%; transform: translateX(-50%); background: rgba(20, 8, 4, .92); color: #ffe0b8; font-family: var(--font-disp); font-size: 16px; padding: 3px 12px; border-radius: 4px; white-space: nowrap; z-index: 5; animation: tagin 1.1s forwards; border: 1px solid rgba(193, 53, 42, .7); }
@keyframes tagin { 0% { opacity: 0; transform: translate(-50%, 8px); } 15%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.lunge .pp-body, .lunge .en-pup { animation: none; }
.pl.lunge .pl-pup { animation: plunge .38s ease-out; }
.en.lunge .en-pup { animation: elunge .38s ease-out; }
@keyframes plunge { 40% { transform: translateX(28px) rotate(4deg); } }
@keyframes elunge { 40% { transform: translateX(-28px) rotate(-4deg); } }
.hit .en-pup, .pl.hit .pl-pup { animation: hitk .38s; }
@keyframes hitk { 0% { filter: brightness(2) sepia(1) hue-rotate(-30deg) saturate(4); } 30% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 100% { filter: none; transform: none; } }
.blockhit .hpbar em { animation: blk .3s; } @keyframes blk { 50% { transform: translateY(-50%) scale(1.4); } }
.en.turn .en-pup { animation: turnk .5s; } @keyframes turnk { 50% { transform: scaleX(-1); } }
.en.dying { pointer-events: none; }
.en.dying .en-pup { animation: collapse .9s forwards; }
.en.dying .unitbar, .en.dying .intentwrap, .en.dying .en-name { opacity: 0; transition: opacity .3s; }
@keyframes collapse { 30% { transform: rotate(-8deg) translateY(4px); filter: brightness(.6); } 100% { transform: rotate(-78deg) translate(-30%, 40%); opacity: 0; filter: blur(2px) brightness(.3); } }
.en.fleeing { animation: fleeing .7s forwards; } @keyframes fleeing { to { transform: translateX(120%); opacity: 0; } }
.en.summoned { animation: summ .7s; } @keyframes summ { from { transform: translateY(30px) scale(.8); opacity: 0; filter: brightness(3); } }
.stage.shake1 { animation: sh1 .42s; } .stage.shake2 { animation: sh2 .42s; }
@keyframes sh1 { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-2px, 1px); } }
@keyframes sh2 { 15% { transform: translate(-9px, 4px); } 35% { transform: translate(8px, -5px); } 55% { transform: translate(-5px, 3px); } 75% { transform: translate(3px, -2px); } }
.combat.hurt .paper::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 70%, rgba(160, 0, 0, .45), transparent 60%); animation: hurtf .6s forwards; pointer-events: none; }
@keyframes hurtf { to { opacity: 0; } }
.turnmark { position: absolute; right: 30px; top: 16px; z-index: 5; font-family: var(--font-disp); font-size: 15px; color: rgba(60, 20, 0, .65); letter-spacing: .3em; animation: tm 1.2s forwards; }
@keyframes tm { from { opacity: 0; transform: translateY(-6px); } 20% { opacity: 1; transform: none; } 80% { opacity: 1; } to { opacity: .6; } }
.aim { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; overflow: visible; }
.aim path { fill: none; stroke: var(--cin2); stroke-width: 4; stroke-dasharray: 10 7; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(255, 60, 40, .8)); animation: dash .5s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -17; } }

/* chain bar */
.chainbar { display: flex; align-items: center; gap: 10px; padding: 6px 16px; min-height: 42px; background: linear-gradient(90deg, rgba(8, 5, 4, .92), rgba(20, 13, 9, .86)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.chainbar::-webkit-scrollbar { display: none; }
.clabel { font-family: var(--font-disp); color: var(--gold2); letter-spacing: .2em; flex: none; font-size: 15px; }
.cseq { display: flex; align-items: center; gap: 4px; flex: none; }
.cseq em { font-style: normal; color: var(--muted); font-size: 12px; }
.cseal { display: inline-flex; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, .25); }
.cseal i, .cnext i, .recipe i { display: inline-grid; place-items: center; width: 24px; height: 24px; font-style: normal; font-family: var(--font-disp); color: #fff; font-size: 14px; }
.cseal.dual i { width: 16px; }
.carrow { color: var(--muted); }
.cnexts { display: flex; gap: 8px; margin-left: auto; flex: none; }
.cnext { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px 2px 4px; background: rgba(217, 164, 65, .12); border: 1px solid rgba(217, 164, 65, .45); border-radius: 14px; font-size: 12px; color: var(--bone2); white-space: nowrap; cursor: help; }
.cnext i { width: 20px; height: 20px; border-radius: 3px; font-size: 12px; }
.cnext b { color: var(--gold2); font-weight: 700; }
.cblock { color: #ff9a8a; font-size: 12px; border: 1px solid rgba(224, 80, 63, .6); padding: 2px 8px; border-radius: 12px; flex: none; }
.ccount { color: var(--muted); font-size: 12px; flex: none; }

/* hand zone */
.handzone { position: relative; height: calc(var(--ch) + 34px); padding: 0 16px; }
.hand { position: absolute; left: 130px; right: 160px; bottom: 8px; height: var(--ch); }
.hcard { position: absolute; left: 0; bottom: 0; width: var(--cw); height: var(--ch); transform: translate(var(--x, 0), var(--y, 0)) rotate(var(--r, 0)); transform-origin: 50% 110%; transition: transform .24s cubic-bezier(.2, .8, .2, 1), opacity .25s, filter .2s; touch-action: none; cursor: pointer; }
.hcard.enter { transform: translate(-160px, 60px) scale(.5) rotate(-24deg); opacity: 0; }
.hcard.leaving { transform: translate(calc(var(--x) + 400px), 80px) scale(.5) rotate(20deg); opacity: 0; }
.hcard.sel { transform: translate(var(--x), -42px) scale(1.12) rotate(0); z-index: 70 !important; }
.hcard.dragging { transform: translate(calc(var(--x) + var(--dx, 0px)), var(--dy, 0px)) scale(1.1) rotate(0); transition: none; z-index: 90 !important; }
@media (hover: hover) and (pointer: fine) {
  .hcard:hover:not(.dragging) { transform: translate(var(--x), -64px) scale(1.3) rotate(0); z-index: 80 !important; }
}
.hcard:not(.playable) .card { filter: saturate(.45) brightness(.72); }
.hcard.hk .card { box-shadow: 0 0 0 2px #ffd36a, 0 0 22px 6px rgba(255, 196, 80, .8); animation: hkp 1.2s ease-in-out infinite; }
.hcard.hu .card { box-shadow: 0 0 0 2px #b08cff, 0 0 18px 4px rgba(150, 110, 255, .6); animation: hkp 1.6s ease-in-out infinite; }
@keyframes hkp { 50% { filter: brightness(1.08); } }
.hcard.sold .card::after { content: "已售"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(40, 10, 8, .55); color: #ffb8a8; font-family: var(--font-disp); font-size: calc(var(--cw) * .2); letter-spacing: .2em; z-index: 6; transform: rotate(-12deg); }
.cardzoom { display: none; }
@media (max-width: 700px), (hover: none) {
  .cardzoom:not([hidden]) { display: flex; position: absolute; z-index: 12; left: 50%; bottom: 10px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); gap: 8px; align-items: flex-end; pointer-events: none; animation: fadein .18s both; }
  .cardzoom .card { --cw: 156px; --ch: 220px; flex: none; box-shadow: 0 12px 30px rgba(0, 0, 0, .7), 0 0 0 2px var(--gold2); }
  .cardzoom .zkw { flex: 0 1 140px; max-width: 140px; background: rgba(14, 9, 7, .95); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; font-size: 11px; line-height: 1.5; }
  .cardzoom .zkw p { margin: 0 0 4px; } .cardzoom .zkw b { color: var(--gold2); margin-right: 4px; }
  .cardzoom .zhelp { position: absolute; left: 0; right: 0; bottom: -2px; transform: translateY(100%); text-align: center; font-size: 11px; color: var(--gold2); }
}
.hcard.deny { animation: deny .35s; } @keyframes deny { 25% { margin-left: -8px; } 50% { margin-left: 8px; } 75% { margin-left: -4px; } }
.energy { position: absolute; left: 22px; bottom: 30px; width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: baseline; justify-content: center; padding-top: 18px; background: radial-gradient(circle at 40% 35%, #3a2a1a, #0e0806 70%); border: 3px solid var(--gold); box-shadow: 0 0 22px rgba(255, 170, 60, .45), inset 0 0 18px rgba(0, 0, 0, .8); z-index: 5; }
.energy b { font-size: 38px; color: var(--lamp2); font-family: var(--font-disp); text-shadow: 0 0 12px rgba(255, 170, 60, .8); font-variant-numeric: tabular-nums; }
.energy small { font-size: 14px; color: var(--muted); }
.energy.empty b { color: #7a6a5a; text-shadow: none; }
.pile { position: absolute; bottom: 6px; background: rgba(15, 10, 8, .9); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--bone2); z-index: 5; }
.pile b { margin-left: 3px; color: var(--bone); font-variant-numeric: tabular-nums; }
.drawp { left: 16px; }
.piles-r { position: absolute; right: 16px; bottom: 6px; display: flex; gap: 6px; z-index: 5; }
.piles-r .pile { position: static; }
.endturn { position: absolute; right: 22px; bottom: 44px; z-index: 5; width: 118px; height: 64px; border-radius: 10px; border: 2px solid #e0685a; background: linear-gradient(#a52c22, #6a1812); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .55); transition: transform .12s, filter .2s; }
.endturn b { font-family: var(--font-disp); font-size: 22px; letter-spacing: .2em; line-height: 1.1; }
.endturn small { font-size: 11px; color: #f5c9b8; }
.endturn:disabled { filter: grayscale(.8) brightness(.6); cursor: default; }
.endturn.nudge { animation: nudge 1.3s infinite; }
@keyframes nudge { 50% { box-shadow: 0 0 22px rgba(255, 110, 80, .9); transform: translateY(-2px); } }

/* floating fx */
#fx { position: absolute; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
.flt { position: fixed; transform: translate(-50%, 0); font-weight: 900; font-size: 20px; white-space: nowrap; animation: floatup 1.25s ease-out forwards; text-shadow: 0 2px 0 #000, 0 0 10px rgba(0, 0, 0, .9); color: #fff; font-variant-numeric: tabular-nums; }
.flt.dmg { color: #ff6a50; font-size: 28px; } .flt.dmg.big { font-size: 42px; color: #ff4a30; }
.flt.block { color: #9fd0ff; } .flt.heal { color: #8cf0a0; } .flt.buff { color: #ffd98a; font-size: 16px; } .flt.debuff { color: #c8a8ff; font-size: 16px; } .flt.gold { color: #ffe066; } .flt.energy { color: #ffcf6a; } .flt.resist { color: #cfcfcf; font-size: 15px; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
.bubble { position: fixed; transform: translate(-50%, -100%); background: #f6ead0; color: #2a1206; padding: 6px 12px; border-radius: 12px; font-family: var(--font-disp); font-size: 15px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0, 0, 0, .5); animation: bub 2.4s forwards; }
.bubble::after { content: ""; position: absolute; left: 50%; top: 100%; border: 7px solid transparent; border-top-color: #f6ead0; transform: translateX(-50%); }
@keyframes bub { 0% { opacity: 0; transform: translate(-50%, -80%); } 10%, 85% { opacity: 1; transform: translate(-50%, -100%); } 100% { opacity: 0; } }
.knifefly { position: fixed; font-family: var(--font-disp); font-size: 34px; color: #ff4a30; text-shadow: 0 0 10px #000; animation: knf .6s ease-in forwards; }
@keyframes knf { to { transform: translate(var(--tx), var(--ty)) rotate(540deg); opacity: .2; } }
.playghost { position: fixed; animation: pg .5s cubic-bezier(.3, .6, .3, 1) forwards; }
.playghost .card { width: 100%; height: 100%; }
@keyframes pg { 60% { transform: translate(calc(var(--tx) * .85), calc(var(--ty) * .85)) scale(1.05); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(.4) rotate(12deg); opacity: 0; } }
.ghostcard { position: fixed; transform: translate(-50%, -50%); animation: gc 1.1s ease-in forwards; }
@keyframes gc { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 60% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.2); opacity: 0; } }
.banner { position: fixed; left: 50%; top: 36%; transform: translate(-50%, -50%); font-family: var(--font-disp); font-size: 30px; color: #ffe7b8; letter-spacing: .3em; padding: 10px 40px; background: linear-gradient(90deg, transparent, rgba(10, 6, 4, .9) 20%, rgba(10, 6, 4, .9) 80%, transparent); animation: ban 1.1s forwards; white-space: nowrap; }
@keyframes ban { 0% { opacity: 0; letter-spacing: .8em; } 20%, 75% { opacity: 1; letter-spacing: .3em; } 100% { opacity: 0; } }

/* scheme splash */
.splash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 35; }
.sp-ink { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(8, 5, 3, .94) 0%, rgba(8, 5, 3, .86) 38%, rgba(8, 5, 3, .35) 64%, transparent 80%); animation: inkin .45s ease-out; }
@keyframes inkin { from { transform: scale(.4); opacity: 0; filter: blur(12px); } }
.sp-inner { position: relative; text-align: center; padding: 0 16px; }
.sp-group { font-size: 14px; color: var(--gold); letter-spacing: .4em; margin-bottom: 6px; animation: fadein .4s .1s both; }
.sp-name { display: flex; justify-content: center; gap: .05em; font-family: var(--font-disp); font-size: clamp(56px, 13vw, 150px); line-height: 1.1; font-weight: 700; }
.sp-name span { display: inline-block; background: linear-gradient(180deg, #fff6d8 0%, #ffd06a 45%, #c8801e 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .6)) drop-shadow(0 0 24px rgba(255, 170, 50, .45)); animation: chin .5s calc(var(--i) * .09s + .1s) both cubic-bezier(.2, 1.6, .4, 1); }
.sp-name.small { font-size: clamp(40px, 9vw, 96px); }
@keyframes chin { from { transform: scale(2.4) translateY(-20px); opacity: 0; filter: blur(8px); } }
.sp-lore { margin-top: 12px; color: var(--bone2); font-size: 15px; letter-spacing: .15em; animation: fadein .5s .5s both; }
.sp-new { display: inline-block; margin-top: 14px; padding: 4px 16px; border: 1px solid var(--gold2); color: var(--gold2); letter-spacing: .3em; font-size: 14px; animation: fadein .4s .7s both, newp 1s .9s infinite alternate; }
@keyframes newp { to { box-shadow: 0 0 16px rgba(240, 200, 112, .6); } }
.sp-seal { position: absolute; right: -10px; bottom: -44px; width: 58px; height: 58px; background: var(--cin); color: #fff; font-family: var(--font-disp); font-size: 34px; display: grid; place-items: center; border-radius: 6px; transform: rotate(-8deg); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .25); animation: stampin .35s .55s both cubic-bezier(.3, 1.8, .5, 1); }
@keyframes stampin { from { transform: scale(3) rotate(-30deg); opacity: 0; } }
.splash.out { animation: spout .35s forwards; }
@keyframes spout { to { opacity: 0; transform: scale(1.05); } }
.splash.assist .sp-inner { padding: 22px 40px; background: linear-gradient(90deg, transparent, rgba(10, 6, 4, .92) 15%, rgba(10, 6, 4, .92) 85%, transparent); border-top: 2px solid var(--cc); border-bottom: 2px solid var(--cc); }
.splash.assist .sp-group { color: var(--cc); }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }

/* ---------- scene player ---------- */
.scene { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 16px 16px 26px; cursor: pointer; }
.sc-bg { position: absolute; inset: 0; overflow: hidden; }
.sc-sky { position: absolute; inset: 0; background: #0a0706; }
.sc-sky.b-1 { background: radial-gradient(ellipse at 50% 110%, rgba(255, 96, 32, .6), transparent 65%), linear-gradient(#0c0504, #2a0c07); }
.sc-sky.b-2 { background: radial-gradient(ellipse at 30% 100%, rgba(230, 70, 40, .3), transparent 60%), linear-gradient(#08080f, #180b12); }
.sc-sky.b-3 { background: linear-gradient(#05080e, #141c28); }
.sc-sky.b-4 { background: linear-gradient(#05051a, #121230); }
.sc-sky.b-5 { background: linear-gradient(#070a22 0%, #1b1840 45%, #5a3040 78%, #c0683a 100%); }
.sc-sky.b-6 { background: radial-gradient(ellipse at 50% 55%, rgba(255, 170, 70, .22), transparent 50%), #040302; }
.sc-sky.b-banquet { background: radial-gradient(ellipse at 50% 30%, rgba(255, 190, 100, .38), transparent 60%), linear-gradient(#2a140a, #120804); }
.bq-lamps { position: absolute; inset: 0; }
.bq-table { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); width: min(1100px, 150vw); display: flex; align-items: flex-end; justify-content: center; filter: brightness(.16) sepia(.6); opacity: .9; }
.bq-table .puppet { mix-blend-mode: normal; }
.bq-table > div { width: 9%; margin: 0 -1.2%; } .bq-table > div.big { width: 12%; }
.bq-board { position: absolute; left: 4%; right: 4%; bottom: 18%; height: 9%; background: #120a06; border-radius: 4px; }
.bq-lamps i { position: absolute; top: calc(8% + (var(--i) * 7 % 3) * 8%); left: calc(var(--i) * 5.5% + 1%); width: 14px; height: 18px; border-radius: 45%; background: radial-gradient(circle at 50% 40%, #ffe6a0, #ff9a3a 60%, #a83a1a); box-shadow: 0 0 26px 8px rgba(255, 160, 60, .35); animation: lampsw calc(3s + var(--i) * .13s) ease-in-out infinite; }
@keyframes lampsw { 50% { transform: translateY(3px); opacity: .85; } }
.sc-bg .scenery { height: 55%; opacity: .9; }
.sc-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 25%, rgba(0, 0, 0, .7) 100%), linear-gradient(transparent 55%, rgba(0, 0, 0, .75)); }
.sc-boss { position: absolute; right: 8%; bottom: 18%; width: min(34vw, 300px); opacity: .5; filter: brightness(.25) blur(.5px); }
.sc-boss .puppet { mix-blend-mode: normal; }
.sc-fig { position: absolute; left: 10%; bottom: 20%; width: min(22vw, 190px); opacity: .7; filter: brightness(.18) sepia(.4); animation: walk 9s linear infinite; }
.sc-fig .puppet { mix-blend-mode: normal; }
@keyframes walk { 0% { transform: translateX(-10vw); } 100% { transform: translateX(40vw); } }
.scene.death .sc-sky { filter: saturate(.3) brightness(.6); }
.scene.dawn .sc-vig { background: radial-gradient(ellipse at 50% 90%, rgba(255, 200, 120, .25), transparent 60%), linear-gradient(transparent 55%, rgba(0, 0, 0, .7)); }
.sc-title { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-family: var(--font-disp); color: var(--gold2); letter-spacing: .3em; font-size: 15px; z-index: 2; white-space: nowrap; }
.sc-big { position: absolute; left: 16px; right: 16px; top: 40%; transform: translateY(-50%); text-align: center; font-family: var(--font-disp); color: #f6e6c8; z-index: 2; line-height: 1.5; text-shadow: 0 0 24px rgba(0, 0, 0, .9); }
.sc-big.sfx { font-size: clamp(26px, 5vw, 44px); letter-spacing: .12em; }
.sc-big.title { font-size: clamp(34px, 7vw, 70px); letter-spacing: .2em; color: #ffe2a8; }
.sc-big.pop { animation: bigpop .7s both; }
@keyframes bigpop { from { opacity: 0; letter-spacing: .5em; filter: blur(6px); } }
.sc-box { position: relative; z-index: 2; width: 100%; max-width: 780px; min-height: 130px; background: linear-gradient(rgba(16, 11, 8, .94), rgba(10, 7, 5, .96)); border: 1px solid rgba(217, 164, 65, .35); border-radius: 10px; padding: 22px 26px 26px; box-shadow: 0 10px 40px rgba(0, 0, 0, .7); }
.sc-sp { position: absolute; top: -15px; left: 20px; background: var(--cin); color: #fff; font-family: var(--font-disp); font-size: 16px; padding: 3px 14px; border-radius: 4px; letter-spacing: .12em; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
.sc-sp.me { background: #2f5d5a; }
.sc-text { font-size: 18px; line-height: 1.95; color: #efe4cf; letter-spacing: .03em; }
.speaking .sc-text { color: #fff4de; }
.sc-text .prompt { color: var(--gold2); font-family: var(--font-disp); font-size: 20px; }
.sc-skip { position: absolute; top: 16px; right: 16px; z-index: 4; background: rgba(12, 8, 6, .8); border: 1px solid var(--line2); color: var(--bone2); border-radius: 16px; padding: 4px 14px; font-size: 12px; letter-spacing: .15em; }
.sc-skip:hover { border-color: var(--gold); color: #fff; }
.sc-more { position: absolute; right: 18px; bottom: 8px; color: var(--gold); font-size: 12px; animation: bob 1s infinite; }
.sc-choices { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 780px; margin-bottom: 14px; cursor: default; }
.sc-choice { text-align: left; background: linear-gradient(90deg, rgba(34, 24, 18, .96), rgba(22, 15, 11, .96)); border: 1px solid var(--line2); border-left: 4px solid var(--gold); border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; transition: transform .12s, border-color .2s, background .2s; }
.sc-choice:hover:not(:disabled) { transform: translateX(4px); border-color: var(--gold2); background: linear-gradient(90deg, rgba(56, 36, 22, .98), rgba(28, 18, 12, .98)); }
.sc-choice b { font-size: 17px; font-weight: 700; color: #fff0d8; }
.sc-choice small { font-size: 13px; color: var(--muted); }
.sc-choice em { font-style: normal; font-size: 12px; color: #e08070; }
.sc-choice:disabled { opacity: .5; cursor: not-allowed; }
.sc-choice.t-comp { border-left-color: var(--jade); } .sc-choice.t-story { border-left-color: var(--violet); } .sc-choice.t-key { border-left-color: var(--cin2); background: linear-gradient(90deg, rgba(60, 16, 12, .96), rgba(24, 10, 8, .96)); } .sc-choice.t-fight { border-left-color: var(--cin); }

/* truth popup */
.truthpop { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4, 3, 2, .8); opacity: 0; transition: opacity .3s; padding: 16px; cursor: pointer; }
.truthpop.in { opacity: 1; }
.tp-card { position: relative; width: min(480px, 100%); background: linear-gradient(170deg, #f3e3bf, #dcc294); color: #2a1a0e; border-radius: 6px; padding: 26px 28px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .8); transform: rotate(-1.2deg) scale(.9); transition: transform .45s cubic-bezier(.2, 1.4, .4, 1); }
.truthpop.in .tp-card { transform: rotate(-1.2deg) scale(1); }
.tp-cat { position: absolute; top: -14px; left: 22px; background: #2a1a0e; color: #f3e3bf; font-family: var(--font-disp); padding: 3px 12px; border-radius: 3px; font-size: 14px; }
.tp-label { font-size: 12px; letter-spacing: .4em; color: #8a5a2a; }
.tp-card h3 { font-family: var(--font-disp); font-size: 30px; margin: 4px 0 10px; letter-spacing: .12em; }
.tp-card p { font-size: 16px; line-height: 1.95; margin: 0; }
.tp-foot { margin-top: 14px; font-size: 12px; color: #7a5a3a; line-height: 1.7; }
.tp-foot b { color: #8a1a0e; }
.tp-seal { position: absolute; right: 18px; bottom: 16px; width: 54px; height: 54px; border: 3px solid var(--cin); color: var(--cin); font-family: var(--font-disp); font-size: 30px; display: grid; place-items: center; border-radius: 6px; transform: rotate(10deg); opacity: .85; animation: stampin .4s .3s both cubic-bezier(.3, 1.8, .5, 1); }
.truthpop.key .tp-card { background: linear-gradient(170deg, #fff0c8, #e8c070); box-shadow: 0 0 0 3px var(--gold), 0 20px 60px rgba(0, 0, 0, .8), 0 0 60px rgba(255, 190, 80, .4); }
.truthpop.key .tp-cat { background: var(--cin); }

/* tutorial hint */
.hintbox { position: fixed; z-index: 45; max-width: min(340px, calc(100vw - 32px)); background: linear-gradient(#2a1e14, #1a120c); border: 1px solid var(--gold); border-radius: 10px; padding: 12px 14px 10px; color: var(--bone); font-size: 14px; line-height: 1.7; box-shadow: 0 10px 30px rgba(0, 0, 0, .7), 0 0 0 4px rgba(217, 164, 65, .12); animation: hintin .35s both; cursor: pointer; }
.hintbox b { color: var(--gold2); }
.hintbox .hk { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 3px; color: #fff; font-family: var(--font-disp); font-size: 12px; vertical-align: -3px; margin: 0 1px; }
.hintbox small { display: block; text-align: right; color: var(--muted); font-size: 11px; margin-top: 4px; }
.hintglow { outline: 3px solid var(--gold2) !important; outline-offset: 3px; border-radius: 8px; animation: hglow 1.1s infinite alternate; }
@keyframes hglow { to { outline-color: rgba(240, 200, 112, .25); } }
@keyframes hintin { from { opacity: 0; transform: translateY(8px); } }

/* ---------- title ---------- */
.title-scr { min-height: 100%; display: grid; grid-template-columns: 1fr; justify-items: center; align-content: center; gap: 8px; padding: 24px 16px 30px; position: relative; text-align: center; }
.t-lamp { width: min(360px, 80vw); margin-bottom: -14px; }
.lamp7 { width: 100%; height: auto; overflow: visible; }
.lamp7 .halo { fill: rgba(255, 170, 60, .16); animation: halo 3s ease-in-out infinite; animation-delay: var(--d); }
.lamp7 .cup { fill: #6a4a2a; stroke: #2a1a0e; }
.lamp7 .fl { fill: #ffcf6a; filter: drop-shadow(0 0 6px #ff9a3a); transform-box: fill-box; transform-origin: 50% 100%; animation: flame .45s ease-in-out infinite alternate; animation-delay: var(--d); }
.lamp7 .off .fl { fill: #3a2a1e; filter: none; animation: none; }
.lamp7 .off .halo { fill: transparent; }
.lamp7 .stname { fill: var(--bone2); font-size: 11px; text-anchor: middle; font-family: var(--font-disp); }
.lamp7 .stlv circle { fill: rgba(255, 255, 255, .15); } .lamp7 .stlv circle.on { fill: var(--gold2); }
.lamp7 [data-act] { cursor: pointer; }
.lamp7 [data-act]:hover .halo { fill: rgba(255, 190, 90, .35); }
@keyframes halo { 50% { opacity: .55; } }
.t-title { display: flex; flex-direction: column; margin: 0; font-family: var(--font-disp); font-weight: 700; font-size: clamp(52px, 11vh, 140px); line-height: 1.02; color: #f3e6cf; text-shadow: 0 0 40px rgba(255, 160, 60, .35), 0 6px 0 rgba(0, 0, 0, .6); }
.t-title span { animation: tin 1.2s both cubic-bezier(.2, .8, .2, 1); }
.t-title span:nth-child(2) { animation-delay: .25s; } .t-title span:nth-child(3) { animation-delay: .5s; color: #fff; text-shadow: 0 0 60px rgba(0, 0, 0, 1), 0 0 20px rgba(193, 53, 42, .6); }
@keyframes tin { from { opacity: 0; filter: blur(10px); transform: translateY(-14px); } }
.t-seal { position: absolute; left: calc(50% + clamp(40px, 9vh, 90px)); top: 50%; background: var(--cin); color: #fff; font-family: var(--font-disp); font-size: 14px; line-height: 1.2; padding: 6px 5px; border-radius: 3px; transform: rotate(4deg); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25); animation: stampin .4s 1.2s both cubic-bezier(.3, 1.8, .5, 1); }
.t-sub { color: var(--bone2); letter-spacing: .5em; margin: 14px 0 18px; font-size: 15px; }
.t-btns { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.t-foot { color: var(--muted); font-size: 12px; margin-top: 16px; }
.t-row { display: flex; gap: 10px; }
.guide p { font-size: 14px; line-height: 1.9; color: var(--bone2); margin: 0 0 6px; max-width: 70ch; }
.guide b { color: #ffe7b8; }
.gk { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 3px; font-style: normal; font-family: var(--font-disp); color: #fff; font-size: 13px; margin: 0 1px; vertical-align: -3px; }
.hub-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (min-width: 901px) { .hub-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); width: min(640px, 100%); } }

/* ---------- hub ---------- */
.hub { min-height: 100%; display: grid; grid-template-columns: 1fr; justify-items: center; align-content: start; gap: 10px; padding: 24px 16px 36px; }
.hub-h { text-align: center; }
.hub-h h2 { font-family: var(--font-disp); font-size: 34px; margin: 0; letter-spacing: .4em; color: #f3e6cf; }
.hub-h p { color: var(--muted); margin: 6px 0 0; font-size: 13px; }
.hub-h b { color: var(--gold2); font-size: 16px; }
.hub-lamp { width: min(620px, 100%); }
.hub-lamphint { text-align: center; color: var(--muted); font-size: 12px; margin: -4px 0 0; }
.starrow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; width: min(720px, 100%); }
.starbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; background: #17110d; border: 1px solid var(--line2); border-radius: 8px; }
.starbtn:hover { border-color: var(--gold); }
.starbtn b { font-family: var(--font-disp); font-size: 15px; color: #f3e6cf; } .starbtn small { font-size: 11px; color: var(--muted); }
.starbtn .pipz { display: flex; gap: 3px; } .starbtn .pipz i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .15); } .starbtn .pipz i.on { background: var(--gold2); }
.starbtn.can { border-color: rgba(240, 200, 112, .6); box-shadow: 0 0 10px rgba(240, 200, 112, .25); }
@media (max-width: 700px) { .starrow { grid-template-columns: repeat(4, minmax(0, 1fr)); } .lamp7 .stname, .lamp7 .stlv { display: none; } }
.hub-grid { display: grid; gap: 10px; width: min(720px, 100%); margin-top: 8px; }
.hcell { background: linear-gradient(#211813, #16100c); border: 1px solid var(--line2); border-radius: 10px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: border-color .2s, transform .12s; }
.hcell:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-2px); }
.hcell:disabled { opacity: .45; }
.hcell b { font-family: var(--font-disp); font-size: 19px; letter-spacing: .2em; color: #f3e6cf; }
.hcell small { font-size: 11px; color: var(--muted); }
.starlv { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.starlv li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.starlv li span { font-family: var(--font-disp); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line2); }
.starlv li.done { color: var(--bone); border-color: rgba(217, 164, 65, .45); } .starlv li.done span { background: var(--gold); color: #2a1406; }
.starlv li.next { color: var(--bone); border-color: var(--gold2); }
.starlv li em { margin-left: auto; font-style: normal; color: var(--gold2); font-size: 13px; }

/* ---------- map ---------- */
.mapscr { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.map-h { text-align: center; padding: 10px 16px 0; }
.map-h h2 { margin: 0; font-family: var(--font-disp); font-size: 26px; letter-spacing: .25em; color: #f3e6cf; }
.map-h p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.map-scroll { overflow-y: auto; padding: 10px 16px; }
.map-canvas { position: relative; height: 1000px; max-width: 560px; margin: 0 auto; }
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mp { fill: none; stroke: rgba(233, 210, 170, .28); stroke-width: 2px; vector-effect: non-scaling-stroke; stroke-dasharray: 5 5; }
.mp.walked { stroke: var(--cin2); stroke-dasharray: none; stroke-width: 3px; }
.mnode { position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(233, 210, 170, .35); background: radial-gradient(circle at 40% 35%, #2e231b, #120c09); display: grid; place-items: center; font-family: var(--font-disp); font-size: 20px; color: var(--bone2); transition: transform .15s, box-shadow .2s; }
.mnode span { pointer-events: none; }
.mnode.n-elite { color: #ff9a8a; border-color: rgba(224, 80, 63, .6); } .mnode.n-event { color: #c8b0ff; } .mnode.n-shop { color: #ffd98a; } .mnode.n-rest { color: #9fe0c0; } .mnode.n-treasure { color: #ffe066; } .mnode.n-boss { width: 76px; height: 76px; font-size: 34px; color: #ffcfb8; border-color: var(--cin2); background: radial-gradient(circle at 40% 35%, #5a1a12, #1a0806); box-shadow: 0 0 30px rgba(224, 80, 63, .45); }
.mnode.done { opacity: .45; } .mnode.done::after { content: "✓"; position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--cin); color: #fff; font-size: 11px; display: grid; place-items: center; font-family: var(--font-body); }
.mnode.reach { border-color: var(--gold2); color: #fff; animation: reach 1.4s ease-in-out infinite; cursor: pointer; }
.mnode.reach:hover { transform: translate(-50%, -50%) scale(1.15); }
.mnode:not(.reach) { cursor: default; }
.mnode.cur { box-shadow: 0 0 0 4px rgba(193, 53, 42, .5); opacity: 1; }
@keyframes reach { 50% { box-shadow: 0 0 18px rgba(240, 200, 112, .7); } }
.map-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; padding: 8px 16px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: rgba(10, 7, 6, .7); }
.lg i { font-style: normal; font-family: var(--font-disp); margin-right: 3px; font-size: 14px; }
.lg.n-elite i { color: #ff9a8a; } .lg.n-event i { color: #c8b0ff; } .lg.n-shop i { color: #ffd98a; } .lg.n-rest i { color: #9fe0c0; } .lg.n-treasure i { color: #ffe066; } .lg.n-boss i { color: #ffcfb8; }

/* ---------- reward / shop / rest / summary ---------- */
.reward, .rest, .summary { max-width: 620px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.reward h2, .rest h2, .summary h2, .shop h2 { font-family: var(--font-disp); font-size: 32px; letter-spacing: .3em; margin: 6px 0 0; color: #f3e6cf; }
.rlist { display: flex; flex-direction: column; gap: 8px; width: 100%; margin: 8px 0 10px; }
.ritem { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; background: linear-gradient(90deg, #241a14, #18110d); border: 1px solid var(--line2); border-radius: 10px; font-size: 16px; transition: border-color .2s, transform .12s; flex-wrap: wrap; }
.ritem:hover:not(:disabled) { border-color: var(--gold); transform: translateX(3px); }
.ritem small { flex-basis: 100%; padding-left: 46px; color: var(--muted); font-size: 12px; margin-top: -6px; }
.ritem.taken { opacity: .35; text-decoration: line-through; }
.ri-ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: #3a2a1a; font-family: var(--font-disp); flex: none; border: 1px solid #8a6a3a; }
.ri-ic.gold { background: #6a4a14; color: #ffe6a8; } .ri-ic.rel { border-color: var(--gold2); color: #ffe0a8; } .ri-ic.card { background: var(--cin); color: #fff; }
.bossrel { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.brel { display: flex; flex-direction: column; align-items: center; gap: 6px; background: #1d1511; border: 1px solid var(--line2); border-radius: 10px; padding: 16px 10px; }
.brel:hover { border-color: var(--gold2); }
.brel small { color: var(--muted); font-size: 12px; line-height: 1.6; }
.shop { max-width: 1040px; margin: 0 auto; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.shop-h { text-align: center; } .shop-gold { font-size: 20px; color: var(--gold2); display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0; }
.shop-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.shop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.shop-rel, .shop-pot { display: grid; gap: 8px; align-content: start; }
.sitem { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: transform .12s; }
.sitem:hover:not(.sold) { transform: translateY(-3px); }
.sitem.rel, .sitem.pot, .sitem.svc { flex-direction: row; flex-wrap: wrap; text-align: left; background: #1b1410; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; gap: 6px 12px; }
.sitem.rel b, .sitem.pot b, .sitem.svc b { flex: 1; font-size: 15px; }
.sitem.rel small, .sitem.pot small, .sitem.svc small { flex-basis: 100%; color: var(--muted); font-size: 12px; }
.price { font-size: 14px; color: var(--gold2); font-variant-numeric: tabular-nums; background: rgba(0, 0, 0, .5); padding: 1px 8px; border-radius: 10px; }

<script>
/* ---- core.js ---- */
'use strict';
/* ============================================================
   燈下黑 — core: utilities, RNG, registries, save / load
   ============================================================ */
const DXH = window.DXH = {};
const VERSION = 1;

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const deep = o => JSON.parse(JSON.stringify(o));
let _uid = 1;
const uid = () => (_uid++).toString(36) + Math.random().toString(36).slice(2, 6);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* speed: 1 normal, 2 fast, 0 = headless/instant */
const SPEED = { anim: 1, text: 1, headless: false };
function wait(ms) {
  if (SPEED.headless || SPEED.anim === 0) return Promise.resolve();
  return sleep(ms / SPEED.anim);
}

/* ---------- seeded RNG (mulberry32) ---------- */
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() {
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  weighted(pairs) { // [[item, weight], ...]
    const tot = pairs.reduce((a, p) => a + p[1], 0);
    let r = this.next() * tot;
    for (const [it, w] of pairs) { if ((r -= w) < 0) return it; }
    return pairs[pairs.length - 1][0];
  }
}
const newSeed = () => (Math.random() * 2 ** 31) >>> 0;

/* ---------- registries ---------- */

  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

function packSave() {

}

  const d = defaultMeta();

  out.stats = Object.assign(defaultMeta().stats, (m && m.stats) || {});

}

  try {
    if (!window.claude || typeof window.claude.use !== 'function') { G.cloud.status = 'local'; return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) { G.cloud.status = 'local'; return; }
    const id = await user.id();
    if (!id) { G.cloud.status = 'local'; return; }
    G.cloud.db = db; G.cloud.uid = id;
    const ref = db.doc('data/users/' + id + '/save');
    const snap = await ref.get();
    G.cloud.ready = true; G.cloud.status = 'cloud';
    if (snap.exists) {
      const body = snap.data();
      let obj = null;
      try { obj = JSON.parse(body.payload); } catch (e) { obj = null; }
      if (obj && obj.savedAt > (G.savedAt || 0) + 2000) {
        G.cloud.lastCloudAt = obj.savedAt;
        onNewer && onNewer(obj);
      } else if ((G.savedAt || 0) > ((obj && obj.savedAt) || 0)) {
        saveGame(true);
      }
    } else {
      saveGame(true);
    }
  } catch (e) {
    G.cloud.status = 'local';
  }
  DXH.onCloud && DXH.onCloud();
}
async function cloudFlush() {
  if (!G.cloud.ready || G.cloud.writing) return;
  if (!G.cloud.pending) return;
  G.cloud.writing = true; G.cloud.pending = false;
  try {
    const pack = packSave();
    await G.cloud.db.doc('data/users/' + G.cloud.uid + '/save').set({ savedAt: pack.savedAt, v: VERSION, payload: JSON.stringify(pack) });
    G.cloud.status = 'cloud';
  } catch (e) {
    G.cloud.status = e && e.code === 'invalid_argument' ? 'local' : 'cloud-error';
    if (e && e.code === 'invalid_argument') G.cloud.ready = false;
  }
  G.cloud.writing = false;
  if (G.cloud.pending) setTimeout(cloudFlush, 1200);
  DXH.onCloud && DXH.onCloud();
}

/* export / import save code */
function exportCode() {
  const json = JSON.stringify(packSave());
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return 'DXH1:' + b64;
}
function importCode(code) {
  code = String(code || '').trim();
  if (!code.startsWith('DXH1:')) return false;
  try {
    const json = decodeURIComponent(escape(atob(code.slice(5))));
    const obj = JSON.parse(json);
    if (!obj.meta) return false;
    applySave(obj);
    saveGame(true);
    return true;
  } catch (e) { return false; }
}

/* ---------- meta helpers ---------- */
const hasTruth = id => !!G.meta.truths[id];
const knowsScheme = id => G.meta.schemes[id] !== undefined;
const compMeta = id => (G.meta.comp[id] = G.meta.comp[id] || { met: false, beat: 0, trips: 0, heart: false });
const star = k => G.meta.stars[k] || 0;
function flag(k, v) { if (v === undefined) return G.meta.flags[k]; G.meta.flags[k] = v; }
function rflag(k, v) { if (!G.run) return undefined; if (v === undefined) return G.run.flags[k]; G.run.flags[k] = v; }
function markSeen(kind, id) {
  const m = { card: 'seenCards', relic: 'seenRelics', enemy: 'seenEnemies', potion: 'seenPotions' }[kind];
  if (m && !G.meta[m][id]) G.meta[m][id] = 1;
}

const SCHEME_GROUPS = ['勝戰計', '敵戰計', '攻戰計', '混戰計', '併戰計', '敗戰計'];
function defScheme(no, id, s) {
  s.no = no; s.id = id; s.group = SCHEME_GROUPS[Math.floor((no - 1) / 6)];
  SCHEMES[id] = s;
  defCard('sc_' + id, { name: s.name, type: '計', kind: [], cost: 0, rar: '計', tgt: s.tgt || 'none', f: { ex: true, eth: true }, v: {}, u: {}, glyph: s.glyph || s.name[0], desc: s.desc, fx: s.fx, scheme: id });
}

/* reveal unknown scheme recipes (兵書殘頁, 推演) */
function revealSchemes(n) {
  const unknown = SCHEME_LIST.filter(s => !knowsScheme(s.id) && !G.meta.revealed[s.id]);
  const out = [];
  for (let i = 0; i < n && unknown.length; i++) {
    const s = unknown.splice(Math.floor(Math.random() * unknown.length), 1)[0];
    G.meta.revealed[s.id] = 1; out.push(s);
  }
  return out;
}

'use strict';
/* ============================================================
   燈下黑 — 戰鬥引擎
   ============================================================ */
const COMP_KIND = { yan: '殺', wen: '間', qi: '亂', qin: '伏', su: '誘' };

function hasRelic(id) { return !!(G.run && G.run.relics.includes(id)); }
function hasComp(id) { return !!(G.run && G.run.party && G.run.party.includes(id)); }
function cardKinds(c) { return cdef(c).kind || []; }
function aliveEnemies() { return G.cb ? G.cb.enemies.filter(e => !e.dead && !e.fled) : []; }
function yeshen() { return G.run ? (G.run.yeshen || 0) : 0; }

/* ---------- status helpers ---------- */
function addStatus(t, st, n) {
  if (!t) return;
  if (typeof n === 'string') { t.st[st] = n; return; }
  if (st === '中計') {
    if ((t.st['識破'] || 0) > 0) { UIC.float(t, '識破', 'resist'); return 0; }
    t.st['中計'] = 1; return 1;
  }
  t.st[st] = (t.st[st] || 0) + n;
  if (t.st[st] <= 0) delete t.st[st];
  return n;
}

/* ---------- damage math ---------- */
const CH_HP = { normal: [1, 1.1, 1.3, 1.45, 1.75, 2.0, 1.2], elite: [1, 1.0, 1.2, 1.35, 1.6, 1.8, 1.2], boss: [1, 0.95, 1.1, 1.0, 1.6, 1.5, 1.35] };
const CH_DMG = { normal: [1, 1.1, 1.1, 1.2, 1.35, 1.45, 1.3], elite: [1, 1.0, 1.1, 1.15, 1.3, 1.4, 1.3], boss: [1, 1.0, 1.05, 1.0, 1.3, 1.3, 1.25] };
function tierOf(e) { return e.boss ? 'boss' : e.elite ? 'elite' : 'normal'; }
function calcDmg(src, tgt, base) {
  const cb = G.cb;
  let d = base;
  if (!src.isPlayer && src.dmgMul) d = Math.round(base * src.dmgMul);
  d += (src.st['勢'] || 0);
  if (src.isPlayer && hasRelic('xueshu') && src.hp < src.maxHp / 2) d += 3;
  if ((src.st['疑心'] || 0) > 0) d = d * 0.75;
  if (tgt && (tgt.st['破綻'] || 0) > 0) d = d * 1.5;
  if (cb && cb.omen === 'yinghuo') d = d * 1.5;
  return Math.max(0, Math.floor(d));
}
function getIntent(e) {
  const d = ENEMIES[e.id];
  const mv = d.moves[e.move];
  if (!mv) return { t: 'unk' };
  return typeof mv.intent === 'function' ? mv.intent(e, E) : mv.intent;
}
function intentTotal(e) {
  const it = getIntent(e);
  if (it.t !== 'atk') return 0;
  return calcDmg(e, G.cb.p, it.d) * (it.n || 1);
}

/* ============================================================
   B — player-side API used by card / scheme / potion effects
   ============================================================ */
const B = {
  get cb() { return G.cb; },
  get p() { return G.cb.p; },
  get rng() { return G.cb.rng; },
  cur: null,
  alive: aliveEnemies,
  others(t) { return aliveEnemies().filter(e => e !== t); },
  pickHigh(arr) { return arr.slice().sort((a, b) => b.hp - a.hp)[0]; },
  hasComp,
  isAttacking(t) { return t && getIntent(t).t === 'atk'; },
  intentDmg(t) { return intentTotal(t); },

  async atk(t, base, opts = {}) {
    const cb = G.cb, p = cb.p;
    const hits = opts.hits || 1;
    let total = 0;
    for (let i = 0; i < hits; i++) {
      if (cb.over) break;
      if (!t || t.dead || t.fled) break;
      let b = base;
      const cur = B.cur;
      if (cur && cur.kinds.includes('殺') && !cur.bonusDone) {
        cur.bonusDone = true;
        if (cur.firstStrike) {
          b += (p.powers.shaji || 0);
          if (hasComp('yan')) b += 2;
        }
        if (hasRelic('jiansui') && !cb.flags.jiansui) { cb.flags.jiansui = 1; b += 6; }
      }
      if (cur && cur.double) b *= 2;
      if (t.st['易容'] && cur && cur.kinds.includes(t.st['易容'])) { await UIC.float(t, '免疫', 'resist'); continue; }
      const d = opts.noStr ? Math.floor(b * ((t.st['破綻'] || 0) > 0 ? 1.5 : 1)) : calcDmg(p, t, b);
      await UIC.strike(t, i, hits);
      total += await hurtEnemy(t, d, { pierce: opts.pierce, attack: true });
    }
    return total;
  },
  async atkAll(base, opts = {}) {
    const list = aliveEnemies().slice();
    await UIC.sweep();
    for (const e of list) { if (!e.dead) await B.atk(e, base, Object.assign({}, opts, { quick: true })); }
  },
  async enemyLose(t, n, why) { return hurtEnemy(t, n, { pierce: true, why }); },
  block(n, opts = {}) {
    const p = G.cb.p;
    let v = n;
    if (!opts.raw) v += (p.st['穩'] || 0);
    if (G.cb.omen === 'tiangou') v = Math.floor(v / 2);
    v = Math.max(0, v);
    p.block += v;
    UIC.float(p, '+' + v, 'block');
    return v;
  },
  async draw(n) { return drawCards(n); },
  energy(n) { G.cb.p.energy += n; UIC.float(G.cb.p, '+' + n + ' 謀', 'energy'); },
  apply(t, st, n, opts = {}) {
    const cb = G.cb;
    if (!t) return 0;
    if (t.isPlayer) return B.selfApply(st, n);
    if (t.dead || t.fled) return 0;
    if (t.st['易容'] && B.cur && B.cur.kinds.includes(t.st['易容'])) { UIC.float(t, '免疫', 'resist'); return 0; }
    let amt = n;
    if (!opts.raw) {
      if (st === '離心' && hasComp('wen')) amt += 1;
      if (st === '流言' && hasComp('qi')) amt += 1;
      if (st === '破綻' && hasComp('su')) amt += 1;
      if (st === '破綻' && hasRelic('tieshan') && !cb.turnStat.fa['破綻']) amt += 1;
      if (st === '疑心' && hasRelic('yanzhi') && !cb.turnStat.fa['疑心']) amt += 1;
    }
    cb.turnStat.fa[st] = 1;
    if (st === '中計') {
      if (t.boss && (t.mem.stunCd || 0) > 0) { UIC.float(t, '識破', 'resist'); return 0; }
      const r = addStatus(t, '中計', 1);
      if (r) UIC.float(t, '中計', 'debuff');
      return r;
    }
    addStatus(t, st, amt);
    UIC.float(t, st + ' ' + amt, STATUS[st] && STATUS[st].good ? 'buff' : 'debuff');
    if (st === '破綻' && cb.p.powers.hongyan && cb.turnStat.hongyan < 3) { cb.turnStat.hongyan++; cb.pendingDraw++; }
    return amt;
  },
  applyAll(st, n, opts) { for (const e of aliveEnemies()) B.apply(e, st, n, opts); },
  selfApply(st, n) {
    const p = G.cb.p;
    if (typeof n === 'string') { p.st[st] = n; return; }
    addStatus(p, st, n);
    UIC.float(p, st + (n > 0 ? ' +' : ' ') + n, STATUS[st] && STATUS[st].good ? 'buff' : 'debuff');
    return n;
  },
  async loseHp(n) { G.cb.turnStat.selfLoss += n; return playerLoseHp(n, { self: true }); },
  heal(n) {
    const p = G.cb.p;
    const v = Math.min(n, p.maxHp - p.hp);
    p.hp += v; UIC.float(p, '+' + v, 'heal');
  },
  gold(n) { if (G.run && !hasRelic('jinsuanpan')) { G.run.gold += n; UIC.float(G.cb.p, '+' + n + ' 兩', 'gold'); } },
  setup(n) { const p = G.cb.p; p.st['佈局'] = (p.st['佈局'] || 0) + n; UIC.float(p, '佈局 +' + n, 'buff'); },
  spendSetup() { const p = G.cb.p; const n = p.st['佈局'] || 0; delete p.st['佈局']; return n; },
  addPower(id, n) { const p = G.cb.p; p.powers[id] = (p.powers[id] || 0) + n; UIC.float(p, POWER_NAME[id] || '謀', 'buff'); },
  addCard(id, where = 'hand', opts = {}) {
    const cb = G.cb;
    const c = mkCard(id, opts.up);
    if (opts.free) c.free = true;
    if (where === 'hand' && cb.hand.length >= 10) where = 'discard';
    if (where === 'draw') cb.draw.splice(Math.floor(cb.rng.next() * (cb.draw.length + 1)), 0, c);
    else cb[where].push(c);
    UIC.cardAdded(c, where);
    return c;
  },
  moveCard(c, from, to) {
    const cb = G.cb;
    const i = cb[from].indexOf(c);
    if (i >= 0) cb[from].splice(i, 1);
    cb[to].push(c);
  },
  async choose(cards, o) { return UIC.chooseCards(cards, o); },
  randomPoolCard() { const pool = rewardPool(); return G.cb.rng.pick(pool.length ? pool : Object.values(CARDS).filter(d => d.rar === '常')); },
  async borrowKnife(att, _unused, fallback, opts = {}) {
    if (!att || att.dead) return;
    const others = aliveEnemies().filter(e => e !== att);
    const victim = others.length ? B.pickHigh(others) : att;
    let base, hits;
    if (opts.flat) { base = fallback; hits = 1; }
    else {
      const it = getIntent(att);
      if (it.t === 'atk') { base = it.d; hits = it.n || 1; } else { base = fallback; hits = 1; }
    }
    await UIC.knife(att, victim);
    for (let i = 0; i < hits; i++) {
      if (victim.dead || G.cb.over) break;
      const d = calcDmg(att, victim, base);
      await hurtEnemy(victim, d, { attack: true, by: att });
    }
  },
  async discordNow(e) {
    const th = discordThreshold(e);
    if ((e.st['離心'] || 0) < th) return;
    const it = getIntent(e);
    const others = aliveEnemies().filter(x => x !== e);
    if (it.t !== 'atk' || !others.length) return;
    addStatus(e, '離心', -th);
    await discordStrike(e, others);
  },
  async escape() {
    const cb = G.cb;
    cb.escaped = true;
    await UIC.escape();
    await finishCombat(true);
  },
  stun(t) { return B.apply(t, '中計', 1); },
};
