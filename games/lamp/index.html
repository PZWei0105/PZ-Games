/* ---- ui_screens.js ---- */
'use strict';
/* ============================================================
   燈下黑 — 各畫面
   ============================================================ */

/* ============================================================
   SCN — 劇情播放器
   ============================================================ */
const SCN = (() => {
  const layer = () => $('#scene');
  function parse(p) {
    if (p == null) return null;
    if (typeof p === 'object') { if (p.if && !p.if()) return null; return parse(p.t); }
    const s = String(p);
    if (s.startsWith('@')) {
      const i = s.indexOf('：');
      return { kind: 'say', sp: s.slice(1, i), t: s.slice(i + 1) };
    }
    if (s.startsWith('~')) return { kind: 'sfx', t: s.slice(1) };
    if (s.startsWith('#')) return { kind: 'title', t: s.slice(1) };
    return { kind: 'narr', t: s };
  }
  function bgHTML(bg, boss, figure) {
    let inner = '';
    if (bg === 'banquet') {
      const fig = [['old', 'crown'], ['woman', 'bun'], ['robe', 'gauze_low'], ['woman', 'flowers'], ['scholar', 'scholar', 1], ['robe', 'crown'], ['woman', 'bun'], ['old', 'none'], ['robe', 'scarf']];
      inner = `<div class="bq-lamps">${Array.from({ length: 18 }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</div><div class="bq-table"><div class="bq-board"></div>${fig.map(([b, h, big], i) => `<div class="${big ? 'big' : ''}">${PUP.svg({ body: b, hat: h, weapon: 'none', dye: '#5a3a2a' }, { flip: i > 4 })}</div>`).join('')}</div>`;
    }
    else if (typeof bg === 'number') inner = SCENERY.svg(bg);
    const bossPup = boss && ENEMIES[boss] ? `<div class="sc-boss">${PUP.svg(ENEMIES[boss].pup, { flip: true })}</div>` : '';
    const fig = figure ? `<div class="sc-fig">${PUP.svg(figure)}</div>` : '';
    return `<div class="sc-sky b-${bg}"></div>${inner}${bossPup}${fig}<div class="sc-vig"></div>`;
  }
  let skipping = false;
  function sceneKey(pages) { const t = pages.slice(0, 2).map(p => p.t).join('|'); let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h.toString(36); }
  async function play(sc) {
    const pages = (sc.pages || []).map(parse).filter(Boolean);
    const key = pages.length ? sceneKey(pages) : null;
    const seen = key && G.meta.seenScenes && G.meta.seenScenes[key];
    if (key) { G.meta.seenScenes = G.meta.seenScenes || {}; G.meta.seenScenes[key] = 1; }
    skipping = false;
    const L = layer();
    L.hidden = false;
    L.className = 'scene in ' + (sc.cls || '');
    const bgKey = String(sc.bg) + '|' + (sc.boss || '') + '|' + (sc.figure ? 'f' : '');
    if (L.dataset.bg !== bgKey) { L.querySelector('.sc-bg').innerHTML = bgHTML(sc.bg, sc.boss, sc.figure); L.dataset.bg = bgKey; }
    const box = L.querySelector('.sc-box'), txt = L.querySelector('.sc-text'), sp = L.querySelector('.sc-sp'), big = L.querySelector('.sc-big'), ch = L.querySelector('.sc-choices'), ttl = L.querySelector('.sc-title');
    ttl.textContent = sc.title || '';
    ttl.hidden = !sc.title;
    ch.innerHTML = ''; ch.hidden = true;
    const skipBtn = L.querySelector('.sc-skip');
    skipBtn.hidden = !seen || pages.length < 3 || !!sc.noSkip;
    skipBtn.onclick = e => { e.stopPropagation(); skipping = true; skipBtn.hidden = true; if (L._adv) L._adv(); };
    for (const p of pages) {
      if (skipping) break;
      await showPage(p, { box, txt, sp, big });
    }
    skipBtn.hidden = true;
    let result;
    if (sc.choices && sc.choices.length) {
      big.hidden = true;
      if (sc.prompt) { box.hidden = false; sp.hidden = true; txt.innerHTML = `<span class="prompt">${esc(sc.prompt)}</span>`; }
      else if (!pages.length) box.hidden = true;
      result = await choose(sc.choices, ch);
      ch.hidden = true; ch.innerHTML = '';
    }
    if (!sc.keep) close();
    return result;
  }
  function close() {
    const L = layer();
    L.classList.remove('in');
    L.hidden = true;
    L.dataset.bg = '';
  }
  function fmt(t) { return esc(t).replace(/\n/g, '<br>'); }
  function showPage(p, { box, txt, sp, big }) {
    return new Promise(res => {
      const L = layer();
      const speed = G.meta.settings.text || 1;
      if (p.kind === 'sfx' || p.kind === 'title') {
        box.hidden = true;
        big.hidden = false;
        big.className = 'sc-big ' + p.kind;
        big.innerHTML = fmt(p.t);
        big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop');
        if (p.kind === 'sfx' && /咚/.test(p.t)) SND.play('drum');
        if (p.kind === 'title') SND.play('gong');
      } else {
        big.hidden = true;
        box.hidden = false;
        box.classList.toggle('speaking', p.kind === 'say');
        sp.hidden = p.kind !== 'say';
        sp.textContent = p.kind === 'say' ? p.sp : '';
        sp.className = 'sc-sp' + (p.sp === '魏子葳' ? ' me' : '');
      }
      const target = p.kind === 'sfx' || p.kind === 'title' ? null : txt;
      let done = false, timer = null, i = 0;
      const full = fmt(p.t);
      const chars = Array.from(p.t);
      const finish = () => { if (target) target.innerHTML = full; done = true; clearInterval(timer); L.querySelector('.sc-more').hidden = false; };
      if (target) {
        target.innerHTML = '';
        L.querySelector('.sc-more').hidden = true;
        if (SPEED.headless || AUTO.on || speed >= 9) finish();
        else {
          timer = setInterval(() => {
            i += Math.max(1, Math.round(speed));
            if (i >= chars.length) finish();
            else target.innerHTML = esc(chars.slice(0, i).join('')).replace(/\n/g, '<br>');
          }, 28);
        }
      } else { done = true; L.querySelector('.sc-more').hidden = false; }
      const adv = e => {
        if (e && e.type === 'keydown' && !['Enter', ' ', 'ArrowRight'].includes(e.key)) return;
        if (e && e.target && e.target.closest && e.target.closest('.sc-choices, .sc-menu')) return;
        if (e && e.type === 'keydown') e.preventDefault();
        if (!done) { finish(); return; }
        cleanup(); SND.play('page'); res();
      };
      const cleanup = () => { L.removeEventListener('click', adv); window.removeEventListener('keydown', adv); clearInterval(timer); L._adv = null; };
      L._adv = () => { finish(); cleanup(); res(); };
      L.addEventListener('click', adv);
      window.addEventListener('keydown', adv);
      if (SPEED.headless || AUTO.on) { setTimeout(() => { finish(); cleanup(); res(); }, 0); }
    });
  }
  function choose(choices, el) {
    return new Promise(res => {
      const vis = choices.filter(c => c && (!c.if || c.if()));
      el.hidden = false;
      el.innerHTML = vis.map((c, i) => {
        const why = c.req ? c.req() : false;
        return `<button class="sc-choice ${c.tag ? 't-' + c.tag : ''}" data-ci="${i}" ${why ? 'disabled' : ''}><b>${esc(c.label)}</b>${c.sub ? `<small>${esc(c.sub)}</small>` : ''}${why ? `<em>${esc(why)}</em>` : ''}</button>`;
      }).join('');
      const onClick = e => {
        const b = e.target.closest('.sc-choice');
        if (!b || b.disabled) return;
        e.stopPropagation();
        el.removeEventListener('click', onClick);
        SND.play('click');
        res(vis[+b.dataset.ci].value);
      };
      el.addEventListener('click', onClick);
      if (SPEED.headless || AUTO.on) {
        const ok = vis.filter(c => !(c.req && c.req()));
        const pick = AUTO.pickChoice(ok);
        setTimeout(() => { el.removeEventListener('click', onClick); res(pick.value); }, 0);
      }
    });
  }
  const truthQ = [];
  let truthBusy = false;
  function truthPop(id) {
    return new Promise(res => { truthQ.push({ id, res }); pump(); });
  }
  async function pump() {
    if (truthBusy) return;
    const it = truthQ.shift();
    if (!it) return;
    truthBusy = true;
    const T = TRUTHS[it.id];
    SND.play('stamp');
    const n = Object.keys(G.meta.truths).length, tot = Object.keys(TRUTHS).length;
    const keys = keysHeld();
    const el = document.createElement('div');
    el.className = 'truthpop' + (T.key ? ' key' : '');
    el.innerHTML = `<div class="tp-card"><div class="tp-cat">${T.key ? '鑰' : esc(T.cat)}</div><div class="tp-label">${T.key ? '關鍵真相' : '真相'}</div><h3>${esc(T.title)}</h3><p>${esc(T.text)}</p><div class="tp-foot">真相 ${n}／${tot}${T.key ? `・鑰匙 ${keys}／4` : ''}${keys === 4 && T.key ? '<br><b>四把鑰匙齊了。五更天，留意那個打更的人。</b>' : ''}</div><div class="tp-seal">真</div></div>`;
    $('#modal').appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    await new Promise(r => {
      const done = () => { el.removeEventListener('click', done); window.removeEventListener('keydown', kd); r(); };
      const kd = e => { if (['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); done(); } };
      setTimeout(() => { el.addEventListener('click', done); window.addEventListener('keydown', kd); }, 350);
      if (SPEED.headless || AUTO.on) setTimeout(done, 0);
    });
    el.classList.remove('in');
    setTimeout(() => el.remove(), 300);
    truthBusy = false;
    it.res(true);
    pump();
  }
  return { play, close, truthPop };
})();

SCREENS.map = async (el) => {
  const r = G.run;
  if (!r || !r.map) return UI.go('hub');
  UI.setScene(r.ch);
  const m = r.map;
  const reach = new Set(RUN.reachable().map(n => n.f + ',' + n.c));
  const rows = [];
  const jitter = (f, c) => { const h = ((f * 73856093) ^ (c * 19349663) ^ r.seed) >>> 0; return [((h % 100) / 100 - .5) * 26, (((h >> 8) % 100) / 100 - .5) * 16]; };
  const pos = (f, c) => { if (f === m.H) return [50, 5]; const [jx, jy] = jitter(f, c); return [10 + c * 20 + jx * .4, 100 - ((f + 1) / (m.H + 1)) * 92 + jy * .25 + 2]; };
  let paths = '';
  for (let f = 0; f < m.H; f++) for (let c = 0; c < m.W; c++) {
    const n = m.grid[f][c]; if (!n) continue;
    const [x1, y1] = pos(f, c);
    const nexts = f === m.H - 1 ? [[m.H, 2]] : n.next.map(nc => [f + 1, nc]);
    for (const [nf, nc] of nexts) {
      const [x2, y2] = pos(nf, nc);
      const walked = r.visited && r.visited.includes(f + ',' + c) && (r.visited.includes(nf + ',' + nc) || (r.pos && r.pos.f === nf && r.pos.c === nc));
      paths += `<path d="M${x1},${y1} Q${(x1 + x2) / 2 + (x2 - x1) * .1},${(y1 + y2) / 2} ${x2},${y2}" class="mp ${walked ? 'walked' : ''}"/>`;
    }
  }
  const nodes = [];
  for (let f = 0; f <= m.H; f++) {
    const list = f === m.H ? [m.boss] : m.grid[f].filter(Boolean);
    for (const n of list) {
      const [x, y] = pos(n.f, n.c);
      const key = n.f + ',' + n.c;
      const isCur = r.pos && r.pos.f === n.f && r.pos.c === n.c;
      const cls = ['mnode', 'n-' + n.t, n.done ? 'done' : '', reach.has(key) ? 'reach' : '', isCur ? 'cur' : ''].join(' ');
      nodes.push(`<button class="${cls}" style="left:${x}%;top:${y}%" data-act="node" data-f="${n.f}" data-c="${n.c}" ${reach.has(key) ? '' : 'tabindex="-1"'} data-tip="${NODE_NAME[n.t]}${n.t === 'boss' ? '・' + esc(ENEMIES[BOSS_OF[r.ch]].title) : ''}"><span>${NODE_GLYPH[n.t]}</span></button>`);
    }
  }
  const W = WATCH[r.ch];
  el.innerHTML = `
    <div class="mapscr">
      <div class="map-h"><h2>${esc(CHAPTER_NAME[r.ch])}</h2><p>${W[1]}・選一條路走下去。越往上，離${esc(ENEMIES[BOSS_OF[r.ch]].name)}越近。</p></div>
      <div class="map-scroll"><div class="map-canvas">
        <svg class="map-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${paths}</svg>
        ${nodes.join('')}
      </div></div>
      <div class="map-legend">${Object.entries(NODE_GLYPH).map(([k, g]) => `<span class="lg n-${k}"><i>${g}</i>${NODE_NAME[k]}</span>`).join('')}</div>
    </div>`;
  const sc = el.querySelector('.map-scroll');
  const cur = el.querySelector('.mnode.reach') || el.querySelector('.mnode.cur');
  if (cur) requestAnimationFrame(() => { cur.scrollIntoView({ block: 'center' }); });
  if (AUTO.on) AUTO.onMap();
};

      if (rw.potion2) items.push({ k: 'potion2', html: `<span class="ri-ic">${POTIONS[rw.potion2].glyph}</span>錦囊・${POTIONS[rw.potion2].name}<small>${POTIONS[rw.potion2].desc}</small>` });
      if (rw.relic) items.push({ k: 'relic', html: `<span class="ri-ic rel">${RELICS[rw.relic].glyph}</span>信物・${RELICS[rw.relic].name}<small>${RELICS[rw.relic].desc}</small>` });

          <div class="rlist">${items.map(it => `<button class="ritem ${taken.has(it.k) ? 'taken' : ''}" data-rk="${it.k}" ${taken.has(it.k) ? 'disabled' : ''}>${it.html}</button>`).join('')}</div>
          <button class="btn pri big" data-rk="done">繼續<small>${taken.size < items.length ? '沒拿的就留下了' : ''}</small></button></div>`;

      el.classList.add('in');

      const onClick = async e => {
        const b = e.target.closest('[data-rk]');

        if (k === 'relic') { RUN.gainRelic(rw.relic); taken.add(k); }

          const pick = await UI.pickCards(rw.cards, { title: '選一張牌', min: 1, max: 1, cancel: true, cancelLabel: '略過', btn: '收下' });
          if (pick && pick[0]) { RUN.addCard(pick[0].id, pick[0].up); taken.add(k); SND.play('page'); }

          const v = await UI.modal({ title: '宿敵的信物', html: `<div class="bossrel">${rw.bossRelics.map(id => `<button class="brel" data-br="${id}">${relicHTML(id, 'big')}<b>${esc(RELICS[id].name)}</b><small>${esc(RELICS[id].desc)}</small></button>`).join('')}</div>`, cls: 'wide', buttons: [{ label: '都不要', value: null }], onMount: (w, close) => { w.querySelectorAll('.brel').forEach(b => b.addEventListener('click', () => close(b.dataset.br))); } });
          if (v) { RUN.gainRelic(v); taken.add(k); }
        }
        saveGame();
        render();
      };
      el.addEventListener('click', onClick);
      if (AUTO.on) AUTO.onReward(rw, el);
    });
  },

  shop() {
    return new Promise(res => {
      const r = G.run;
      G.screen = 'shop'; document.body.dataset.screen = 'shop';
      const pm = RUN.priceMul();
      const price = (base, spread) => Math.round((base + RR.int(-spread, spread)) * pm);
      const cardsList = [];
      const pool = rewardPool();
      for (let i = 0; i < 5; i++) {
        const rar = RR.weighted([['常', 55], ['奇', 35], ['絕', 10]]);
        const cands = pool.filter(d => d.rar === rar && !cardsList.some(x => x.c.id === d.id));
        const d = RR.pick(cands.length ? cands : pool);
        const base = { 常: 50, 奇: 75, 絕: 145 }[d.rar];
        cardsList.push({ c: mkCard(d.id), p: price(base, 6), sold: false });
        markSeen('card', d.id);
      }
      const saleIdx = RR.int(0, 4);
      cardsList[saleIdx].p = Math.max(15, Math.round(cardsList[saleIdx].p * .5));
      cardsList[saleIdx].sale = true;
      const relList = [];
      for (let i = 0; i < 3; i++) {
        const rar = RR.weighted([['常', 50], ['奇', 35], ['絕', 15]]);
        const id = RUN.randomRelic(rar);
        if (id && !relList.some(x => x.id === id)) relList.push({ id, p: price({ 常: 150, 奇: 205, 絕: 270 }[RELICS[id].rar] || 200, 12), sold: false });
      }
      const potList = [];
      for (let i = 0; i < 3; i++) { const id = RUN.randomPotion(); potList.push({ id, p: price({ 常: 50, 奇: 75, 絕: 95 }[POTIONS[id].rar], 5), sold: false }); }
      let removeUsed = false;
      const el = $('#screen');
      const lines = ['「要什麼，自己挑。問來歷的，加錢。」', '「今晚生意好。死人多，貨就多。」', '「魏公子？不認識。這裡沒有人認識誰。」', '「銀子是乾淨的就行，人乾不乾淨，我不管。」'];
      const line = RR.pick(lines);
      const render = () => {
        const rc = Math.round(r.removeCost * pm);
        el.innerHTML = `<div class="shop"><div class="shop-h"><h2>黑市</h2><p class="msub">鬼市牙人：${esc(line)}</p><p class="shop-gold"><span class="gi">兩</span>${r.gold}</p></div>
          <div class="shop-cards">${cardsList.map((x, i) => `<div class="sitem ${x.sold ? 'sold' : ''}" data-sk="c${i}">${cardHTML(x.c)}<span class="price ${r.gold < x.p ? 'no' : ''}">${x.p} 兩</span></div>`).join('')}</div>
          <div class="shop-row">
            <div class="shop-rel">${relList.map((x, i) => `<div class="sitem rel ${x.sold ? 'sold' : ''}" data-sk="r${i}">${relicHTML(x.id, 'big')}<b>${esc(RELICS[x.id].name)}</b><small>${esc(RELICS[x.id].desc)}</small><span class="price ${r.gold < x.p ? 'no' : ''}">${x.p} 兩</span></div>`).join('')}</div>
            <div class="shop-pot">${potList.map((x, i) => `<div class="sitem pot ${x.sold ? 'sold' : ''}" data-sk="p${i}"><div class="potion big"><span>${POTIONS[x.id].glyph}</span></div><b>${esc(POTIONS[x.id].name)}</b><small>${esc(POTIONS[x.id].desc)}</small><span class="price ${r.gold < x.p ? 'no' : ''}">${x.p} 兩</span></div>`).join('')}
              <div class="sitem svc ${removeUsed ? 'sold' : ''}" data-sk="rm"><div class="potion big"><span>焚</span></div><b>焚稿</b><small>燒掉牌組裡的一張牌。</small><span class="price ${r.gold < rc ? 'no' : ''}">${rc} 兩</span></div>
            </div>
          </div>
          <button class="btn pri big" data-sk="leave">離開黑市</button></div>`;
        UI.hud();
      };
      render();
      el.classList.add('in');
      const onClick = async e => {
        const b = e.target.closest('[data-sk]');
        if (!b || b.classList.contains('sold')) return;
        const k = b.dataset.sk;
        if (k === 'leave') { el.removeEventListener('click', onClick); SND.play('click'); res(); return; }
        const buy = (cost, fn) => { if (r.gold < cost) { SND.play('fail'); UI.toast('銀兩不夠', 'bad'); return false; } r.gold -= cost; SND.play('coin'); fn(); return true; };
        if (k[0] === 'c') { const x = cardsList[+k.slice(1)]; buy(x.p, () => { RUN.addCard(x.c.id, x.c.up); x.sold = true; }); }
        if (k[0] === 'r') { const x = relList[+k.slice(1)]; buy(x.p, () => { RUN.gainRelic(x.id); x.sold = true; }); }
        if (k[0] === 'p') { const x = potList[+k.slice(1)]; if (r.potions.length >= r.potionSlots) { UI.toast('錦囊欄滿了', 'bad'); return; } buy(x.p, () => { RUN.gainPotion(x.id); x.sold = true; }); }
        if (k === 'rm') {
          const rc = Math.round(r.removeCost * pm);
          if (r.gold < rc) { SND.play('fail'); UI.toast('銀兩不夠', 'bad'); return; }
          const pick = await UI.pickCards(r.deck, { title: '焚稿：燒掉一張牌', min: 1, max: 1, cancel: true });
          if (pick && pick[0]) { r.gold -= rc; r.deck.splice(r.deck.indexOf(pick[0]), 1); r.removeCost += 25; removeUsed = true; SND.play('fire'); }
        }
        saveGame();
        render();
      };
      el.addEventListener('click', onClick);
      if (AUTO.on) AUTO.onShop(el, { cardsList, relList, potList });
    });
  },

  rest() {
    return new Promise(res => {
      const r = G.run;
      G.screen = 'rest'; document.body.dataset.screen = 'rest';
      const el = $('#screen');
      const heal = Math.ceil(r.maxHp * .3) + (r.relics.includes('chawan') ? 10 : 0);
      const canHeal = !r.relics.includes('jiangyin');
      const talks = r.party.filter(id => STORY.nextBeat(id));
      const unknown = SCHEME_LIST.filter(s => !knowsScheme(s.id) && !G.meta.revealed[s.id]).length;
      const opts = [
        { k: 'heal', t: '歇息', d: canHeal ? `回復 ${heal} 命。` : '秦烈的將印壓在你胸口，你睡不著。', dis: !canHeal },
        { k: 'up', t: '參悟', d: '升級一張牌。', dis: !r.deck.some(c => !c.up && !['咒', '傷'].includes(cdef(c).type)) },
        ...talks.map(id => ({ k: 'talk:' + id, t: '夜話・' + COMPANIONS[id].name, d: `「${STORY.nextBeat(id).title}」——聽${COMPANIONS[id].name}說一段往事。`, cls: 'talk' })),
        { k: 'plan', t: '推演', d: unknown ? '揭示一個尚未悟出的計的配方。' : '三十六計，已無可推演。', dis: !unknown },
      ];
      el.innerHTML = `<div class="rest"><h2>歇腳</h2><p class="msub">${esc(RR.pick(['一間廢棄的土地廟，火堆還有餘溫。', '橋洞底下，風小一點。', '一戶人家的柴房。主人家已經不在了。', '城牆根下的一個凹處，看得見月亮。']))}</p>
        <div class="rest-opts">${opts.map(o => `<button class="ropt ${o.cls || ''}" data-ro="${o.k}" ${o.dis ? 'disabled' : ''}><b>${esc(o.t)}</b><small>${esc(o.d)}</small></button>`).join('')}</div>
        <p class="msub">只能選一件事。</p></div>`;
      el.classList.add('in');
      UI.hud();
      const onClick = async e => {
        const b = e.target.closest('[data-ro]');
        if (!b || b.disabled) return;
        const k = b.dataset.ro;
        SND.play('click');
        if (k === 'heal') { r.hp = Math.min(r.maxHp, r.hp + heal); SND.play('heal'); }
        else if (k === 'up') { const ok = await EV.upgradeCard(); if (!ok) return; }
        else if (k === 'plan') { EV.reveal(1); }
        else if (k.startsWith('talk:')) { await STORY.nightTalk(k.slice(5)); }
        el.removeEventListener('click', onClick);
        saveGame();
        res();
      };
      el.addEventListener('click', onClick);
      if (AUTO.on) AUTO.onRest(el, opts);
    });
  },

  async summary(sum) {
    G.screen = 'summary'; document.body.dataset.screen = 'summary';

    const s = sum.stats;
    el.innerHTML = `<div class="summary o-${sum.outcome}"><h2>${title}</h2><p class="msub">${esc(sub)}</p>
      <dl class="sgrid">
        <div><dt>走過</dt><dd>${s.floors}</dd></div><div><dt>殺敵</dt><dd>${s.kills}</dd></div>
        <div><dt>成計</dt><dd>${s.schemes}</dd></div><div><dt>新悟</dt><dd>${s.newSchemes}</dd></div>

  for (let i = 0; i < 9 && pool.length; i++) out.push(mkCard(r.pick(pool).id, r.chance(.3) ? 1 : 0));

'use strict';
/* ============================================================
   燈下黑 — 自動試玩機器人（僅供測試；一般遊玩時關閉）
   ============================================================ */
const AUTO = {
  on: false,
  nightsLeft: 0,
  stats: { nights: 0, deaths: {}, dawns: 0, trueEnds: 0, errors: [], turns: 0, combats: 0, schemes: 0, maxCh: 0, chReached: {}, bossWins: {} },
  onPlayerTurn() {
    if (!AUTO.on) return;
    setTimeout(() => AUTO.playTurn().catch(e => AUTO.err(e)), 0);
  },
  clog: [],
  dmg: {},
  dmgLog(opts, d) {
    const cb = G.cb; if (!cb || d <= 0) return;
    const key = opts.why === '流言' ? 'POISON' : opts.thorns ? 'THORNS' : opts.by ? 'ENEMY_HITS_ENEMY' : B.cur ? B.cur.card.id : (AUTO._assist ? 'ASSIST' : 'OTHER');
    const ch = cb.ch; const m = AUTO.dmg[ch] = AUTO.dmg[ch] || {}; m[key] = (m[key] || 0) + d;
  },
  combatStart(cb) { cb._auto = { hp0: cb.p.hp, ids: cb.enemies.map(e => e.id).join('+') }; },
  combatEnd(cb, win) {
    const a = cb._auto || {};
    AUTO.clog.push({ night: G.meta.loops, ch: cb.ch, kind: cb.kind, ids: a.ids, turns: cb.turn, hp0: a.hp0, hp1: cb.p.hp, max: cb.p.maxHp, win, schemes: cb.schemes, deck: G.run ? G.run.deck.length : 0 });
  },
  err(e) { AUTO.stats.errors.push(String(e && e.stack || e)); console.error('AUTO', e); },
  async playTurn() {
    const cb = G.cb;
    if (!cb || cb.phase !== 'player' || cb.over) return;
    AUTO.stats.turns++;
    for (let guard = 0; guard < 25; guard++) {
      if (cb.over || cb.phase !== 'player') return;
      for (let i = 0; i < cb.comps.length; i++) {
        if (cb.comps[i].charge >= cb.comps[i].need) { AUTO._assist = 1; await useAssist(i, AUTO.target()); AUTO._assist = 0; }
        if (cb.over) return;
      }
      if (G.run && G.run.potions.length && (cb.p.hp < cb.p.maxHp * .35 || (cb.isBoss && cb.turn <= 2))) {
        const i = G.run.potions.findIndex(Boolean);
        await usePotion(i, AUTO.target());
        if (cb.over) return;
      }
      const c = AUTO.bestCard();
      if (!c) break;
      const t = needsTarget(c) ? AUTO.target(c) : null;
      const ok = await playCard(c, t);
      if (!ok) break;
    }
    if (!cb.over && cb.phase === 'player') await endTurn();
  },
  target(c) {
    const a = aliveEnemies();
    if (!a.length) return null;
    let est = 0;
    if (c) { const d = cdef(c); if (d.v && d.v.d) est = calcDmg(G.cb.p, a[0], cv(c, 'd')) * (/3 次/.test(d.desc) ? 3 : /2 次/.test(d.desc) ? 2 : 1); }
    const killable = a.filter(e => est && est >= e.hp + e.block).sort((x, y) => y.maxHp - x.maxHp);
    if (killable.length) return killable[0];
    const boss = a.find(e => e.boss);
    if (boss) { const mins = a.filter(e => !e.boss); if (!mins.length || boss.hp < boss.maxHp * .6 || Math.random() < .6) return boss; }
    return a.slice().sort((x, y) => intentTotal(y) - intentTotal(x) || (x.hp + x.block) - (y.hp + y.block))[0];
  },
  bestCard() {
    const cb = G.cb, p = cb.p;
    const playable = cb.hand.filter(canPlay);
    if (!playable.length) return null;
    const hints = chainHints();
    const incoming = aliveEnemies().reduce((a, e) => a + intentTotal(e), 0);
    const score = c => {
      const d = cdef(c);
      let s = 0;
      if (d.type === '計') s += 100;
      if (d.id === 'yiju') s += 90;
      if (hints.byCard[c.uid] && !hints.byCard[c.uid].blocked) s += 55;
      if (d.type === '謀') s += cb.turn <= 2 ? 45 : 15;
      if (d.type === '攻') s += 22;
      if (d.kind.includes('伏') && incoming > p.block) s += 26 + (incoming - p.block >= p.hp * .4 ? 30 : 0);
      if (d.kind.includes('探')) s += 12;
      s -= (effCost(c) || 0) * 4;
      s += Math.random() * 6;
      return s;
    };
    playable.sort((a, b) => score(b) - score(a));
    return playable[0];
  },
  choose(cards, o) {
    const n = Math.max(o.min || 0, Math.min(o.max || 1, cards.length));
    return Promise.resolve(cards.slice(0, n));
  },
  pickChoice(choices) {
    if (!choices.length) return { value: null };
    const hpLow = G.run && G.run.hp < G.run.maxHp * .45;
    const pref = choices.find(c => c.tag === 'key' && !/守著父親/.test(c.label)) || choices.find(c => c.tag === 'comp') || choices.find(c => c.tag === 'story');
    if (pref && Math.random() < .8) return pref;
    const father = choices.find(c => /守著父親/.test(c.label));
    if (father && Math.random() < .25) return father;
    const safe = choices.filter(c => !(hpLow && c.tag === 'fight') && !/守著父親/.test(c.label));
    return (safe.length ? safe : choices)[Math.floor(Math.random() * (safe.length || choices.length))];
  },
  onMap() {
    if (!AUTO.on) return;
    setTimeout(() => {
      try {
        const r = G.run;
        if (!r) return;
        const reach = RUN.reachable();
        if (!reach.length) return;
        const hpr = r.hp / r.maxHp;
        const w = reach.map(n => [n, n.t === 'rest' ? (hpr < .5 ? 8 : 1) : n.t === 'elite' ? (hpr > .7 ? 3 : .5) : n.t === 'shop' ? (r.gold > 120 ? 4 : 1) : 2]);
        const tot = w.reduce((a, x) => a + x[1], 0);
        let x = Math.random() * tot, pick = reach[0];
        for (const [n, ww] of w) { if ((x -= ww) < 0) { pick = n; break; } }
        r.visited = r.visited || []; r.visited.push(pick.f + ',' + pick.c);
        AUTO.stats.chReached[r.ch] = (AUTO.stats.chReached[r.ch] || 0) + 1;
        RUN.enter(pick);
      } catch (e) { AUTO.err(e); }
    }, 0);
  },
  onReward(rw, el) {
    setTimeout(async () => {
      try {
        const r = G.run;
        if (rw.gold) { r.gold += rw.gold; }
        if (rw.potion) RUN.gainPotion(rw.potion);
        if (rw.relic) RUN.gainRelic(rw.relic);
        if (rw.cards && rw.cards.length) { const c = AUTO.pickRewardCard(rw.cards); if (c) RUN.addCard(c.id, c.up); }
        if (rw.bossRelics && rw.bossRelics.length) RUN.gainRelic(rw.bossRelics[0]);
        el.querySelector('[data-rk="done"]').click();
      } catch (e) { AUTO.err(e); }
    }, 0);
  },
  pickRewardCard(cards) {
    const r = G.run;
    const cnt = {};
    for (const c of r.deck) for (const k of cdef(c).kind) cnt[k] = (cnt[k] || 0) + 1;
    const score = c => { const d = cdef(c); let s = { 常: 1, 奇: 2.2, 絕: 3.5 }[d.rar] || 1; for (const k of d.kind) s += (cnt[k] || 0) * .12; if (d.type === '謀') s += .8; if (c.up) s += .6; if (d.owner !== 'wei') s += .5; return s + Math.random() * .8; };
    const best = cards.slice().sort((a, b) => score(b) - score(a))[0];
    if (r.deck.length >= 24 && cdef(best).rar === '常') return null;
    return best;
  },
  buyStars() {
    for (let k = 0; k < 7; k++) {
      const order = ['tianshu', 'yaoguang', 'tianji', 'kaiyang', 'tianquan', 'tianxuan', 'yuheng'];
      let bought = false;
      for (const key of order) {
        const lv = star(key);
        if (lv < 3 && G.meta.oil >= STAR_COST[lv]) { G.meta.oil -= STAR_COST[lv]; G.meta.stars[key] = lv + 1; bought = true; break; }
      }
      if (!bought) break;
    }
  },
  onShop(el, stock) {
    setTimeout(() => {
      try {
        const r = G.run;
        const pm = RUN.priceMul();
        const rc = Math.round(r.removeCost * pm);
        const basic = r.deck.find(c => c.id === 'xiujian' || c.id === 'cangshen' || cdef(c).type === '咒');
        if (basic && r.gold >= rc) { r.gold -= rc; r.deck.splice(r.deck.indexOf(basic), 1); r.removeCost += 25; }
        const x = stock.cardsList.find(x => !x.sold && x.p <= r.gold);
        if (x && Math.random() < .6) { r.gold -= x.p; RUN.addCard(x.c.id, x.c.up); x.sold = true; }
        const y = stock.relList.find(x => !x.sold && x.p <= r.gold);
        if (y) { r.gold -= y.p; RUN.gainRelic(y.id); y.sold = true; }
        el.querySelector('[data-sk="leave"]').click();
      } catch (e) { AUTO.err(e); }
    }, 0);
  },
  onRest(el, opts) {
    setTimeout(() => {
      try {
        const r = G.run;
        const talk = opts.find(o => o.k.startsWith('talk:') && !o.dis);
        let k;
        if (r.hp < r.maxHp * .55) k = 'heal';
        else if (talk && Math.random() < .5) k = talk.k;
        else k = 'up';
        const o = opts.find(o => o.k === k && !o.dis) || opts.find(o => !o.dis);
        const b = el.querySelector(`[data-ro="${o.k}"]`);
        b && b.click();
      } catch (e) { AUTO.err(e); }
    }, 0);
  },
  onSummary() {
    setTimeout(async () => {
      try {
        AUTO.stats.nights++;
        if (AUTO.nightsLeft > 0) { AUTO.nightsLeft--; if (!DXH.noMeta) AUTO.buyStars(); await STORY.newNight(); }
        else { AUTO.done = true; }
      } catch (e) { AUTO.err(e); }
    }, 0);
  },
};
DXH.AUTO = AUTO;

/* ---- main.js ---- */
'use strict';
/* ============================================================
   燈下黑 — 啟動
   ============================================================ */
function start(hotData) {
  const local = loadLocal();
  let pack = local;
  if (hotData && hotData.pack && (!local || hotData.pack.savedAt > (local.savedAt || 0))) pack = hotData.pack;
  if (pack) applySave(pack);
  SPEED.anim = G.meta.settings.anim || 1;
  document.body.classList.toggle('reduce', !!G.meta.settings.reduce);
  FX.init();
  bindGlobal();
  if (window.__DXH_TEST) { SPEED.headless = true; AUTO.on = true; }
  UI.go('title');
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ pack: packSave() })); } catch (e) { }
  cloudInit(async newer => {
    if (G.screen === 'combat') return;
    const when = new Date(newer.savedAt).toLocaleString('zh-TW', { hour12: false });
    const ok = await UI.confirm('雲端有較新的存檔', `雲端存檔時間：${when}<br>第 ${newer.meta.loops} 夜・見過天明 ${newer.meta.dawns} 次。<br>要載入它嗎？`, '載入雲端', '用這台的');
    if (ok) { applySave(newer); saveGame(true); UI.go('title'); }
    else saveGame(true);
  });
  window.addEventListener('beforeunload', () => { try { LS.set(SAVE_KEY, JSON.stringify(packSave())); } catch (e) { } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.cloud.ready) { G.cloud.pending = true; cloudFlush(); } });
}
DXH.start = start;
DXH.autoNights = async (n) => {
  AUTO.on = true; SPEED.headless = true; AUTO.nightsLeft = n - 1; AUTO.done = false;
  await STORY.newNight();
};
(function boot() {
  const go = () => {
    const h = window.claude && window.claude.hot;
    if (h && typeof h.ready === 'function') h.ready(start);
    else start((h && h.data) || {});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();
})();

</script>
