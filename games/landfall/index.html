<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>墜星 LANDFALL</title>
<meta name="theme-color" content="#070914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="墜星">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:rgba(7,12,28,.86); --bg2:rgba(14,22,44,.92); --line:rgba(127,227,255,.22); --line2:rgba(127,227,255,.5);
  --cy:#7fe3ff; --cy2:#bff6ff; --am:#ffd166; --rd:#ff6b6b; --gr:#7cf0a0; --vi:#c58bff; --tx:#e8f6ff; --mut:#8fb3c9; --dim:#5d7891;
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Chakra Petch","Noto Sans TC",sans-serif; --serif:"Noto Serif TC","Noto Sans TC",serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060d;color:var(--tx);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{touch-action:none;font-size:14px}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hidden{display:none!important}
.panel{background:var(--bg);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border:1px solid var(--line);position:relative}
.br::before{content:"";position:absolute;inset:-1px;pointer-events:none;z-index:2;background:
 linear-gradient(var(--cy),var(--cy)) top left/11px 1.5px no-repeat,linear-gradient(var(--cy),var(--cy)) top left/1.5px 11px no-repeat,
 linear-gradient(var(--cy),var(--cy)) top right/11px 1.5px no-repeat,linear-gradient(var(--cy),var(--cy)) top right/1.5px 11px no-repeat,
 linear-gradient(var(--cy),var(--cy)) bottom left/11px 1.5px no-repeat,linear-gradient(var(--cy),var(--cy)) bottom left/1.5px 11px no-repeat,
 linear-gradient(var(--cy),var(--cy)) bottom right/11px 1.5px no-repeat,linear-gradient(var(--cy),var(--cy)) bottom right/1.5px 11px no-repeat}
.lbl{font-family:var(--num);font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}

/* ---- 頂部 HUD ---- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 8px) calc(var(--sr) + 8px) 0 calc(var(--sl) + 8px);display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
.row1{display:flex;gap:6px;align-items:stretch}
#clock{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:2px;min-width:0}
#clock .moonic{width:26px;height:26px;position:relative;flex:none}
#clock .d{font-weight:900;font-size:15px;white-space:nowrap}
#clock .t{font-family:var(--num);font-size:13px;color:var(--cy2)}
#clock .w{font-size:11px;color:var(--mut);white-space:nowrap}
#speed{display:flex;margin-left:auto;padding:3px}
#speed button{width:38px;height:34px;display:grid;place-items:center;color:var(--mut);border-radius:2px;position:relative}
#speed button.on{color:#06101e;background:var(--cy);box-shadow:0 0 14px rgba(127,227,255,.55)}
#speed button.on.p{background:var(--am);box-shadow:0 0 14px rgba(255,209,102,.5)}
#res{display:flex;gap:3px;padding:4px;flex-wrap:nowrap;overflow:hidden}
.chip{display:flex;align-items:center;gap:4px;padding:3px 7px;min-width:0;border-radius:2px;background:rgba(255,255,255,.03);flex:1 1 auto;justify-content:center;position:relative}
.chip .ic{width:15px;height:15px}
.chip b{font-family:var(--num);font-size:14px;font-weight:600}
.chip.low b{color:var(--rd)}
.chip.pw{flex:1.6 1 auto;gap:6px}
.pwbar{width:44px;height:8px;border:1px solid rgba(127,227,255,.35);position:relative;flex:none}
.pwbar i{position:absolute;left:1px;top:1px;bottom:1px;background:var(--gr);box-shadow:0 0 8px currentColor;transition:width .3s}
.pwnet{font-family:var(--num);font-size:11px}
.delta{position:absolute;right:2px;top:-2px;font-size:10px;font-family:var(--num);opacity:0;transition:opacity .4s}
#tidebar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-color:rgba(255,123,216,.45);background:linear-gradient(90deg,rgba(60,10,70,.88),rgba(20,8,40,.88))}
#tidebar .tt{font-family:var(--serif);font-weight:900;font-size:17px;color:#ffb8ec;letter-spacing:.1em;text-shadow:0 0 12px #ff7bd8}
#tidebar .ts{font-size:12px;color:#f3c9ff;flex:1;line-height:1.35}
.sw{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid rgba(255,184,236,.5);font-weight:700;font-size:13px;white-space:nowrap}
.sw i{width:34px;height:18px;border-radius:9px;background:#3a2a4a;position:relative;flex:none;transition:.2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#bbb;transition:.2s}
.sw.on i{background:#ff7bd8}.sw.on i::after{left:18px;background:#fff}

/* ---- 目標 ---- */
#obj{position:fixed;left:calc(var(--sl) + 8px);top:calc(var(--st) + 98px);width:min(64vw,300px);z-index:9;padding:9px 11px 9px 12px;cursor:pointer;transition:transform .3s}
#obj .oh{display:flex;align-items:center;gap:6px;margin-bottom:3px}
#obj .ot{font-weight:900;font-size:14px;color:var(--cy2)}
#obj .ok{color:var(--gr)}
#obj .oi{font-size:12.5px;color:var(--mut);display:flex;gap:6px;line-height:1.5}
#obj .oi.done{color:var(--gr);opacity:.75}
#obj .oi .bx{width:10px;height:10px;border:1.5px solid currentColor;margin-top:4px;flex:none}
#obj .oi.done .bx{background:var(--gr)}
#obj .o2{margin-top:7px;padding-top:6px;border-top:1px dashed rgba(127,227,255,.18)}
#obj.min .oi,#obj.min .o2{display:none}
#obj .hintb{margin-left:auto;font-size:11px;color:var(--am);border:1px solid rgba(255,209,102,.45);padding:1px 6px}
#exptrk{margin-top:7px;font-size:12px;color:var(--am)}

/* ---- 提示 ---- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 92px);z-index:30;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(84vw,420px)}
@media (min-width:900px){#toasts{bottom:calc(var(--sb) + 96px)}}
.toast{padding:7px 12px;font-size:13px;line-height:1.4;border-left:3px solid var(--cy);background:rgba(7,12,28,.9);animation:tin .3s ease-out;max-width:100%;pointer-events:auto}
.toast.good{border-color:var(--gr)}.toast.bad{border-color:var(--rd);background:rgba(40,8,14,.92)}.toast.warn{border-color:var(--am)}
.toast.out{animation:tout .4s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

/* ---- 右側控制 ---- */
#side{position:fixed;right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 92px);z-index:9;display:flex;flex-direction:column;gap:6px}
#side button{width:42px;height:42px;display:grid;place-items:center;color:var(--cy2)}

/* ---- 底部 dock ---- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:center;padding:0 calc(var(--sr) + 6px) calc(var(--sb) + 6px) calc(var(--sl) + 6px);pointer-events:none}
#dock .bar{display:flex;gap:2px;padding:4px;pointer-events:auto;width:min(100%,560px)}
#dock .db{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;color:var(--mut);position:relative;font-size:11.5px;font-weight:700;letter-spacing:.06em}
#dock .db .ic{width:22px;height:22px}
#dock .db.on{color:var(--cy);background:rgba(127,227,255,.08)}
#dock .db.on::after{content:"";position:absolute;left:20%;right:20%;top:0;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy)}
.badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:8px;height:8px;border-radius:5px;background:var(--am);box-shadow:0 0 8px var(--am)}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.0)}50%{box-shadow:0 0 0 6px rgba(255,209,102,.35)}}
.hl{outline:2px solid var(--am);outline-offset:2px;animation:hl 1s infinite}
@keyframes hl{50%{outline-color:rgba(255,209,102,.2)}}

/* ---- 底部面板 ---- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:66vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sb)}
#sheet.open{transform:none}
#sheet .sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
#sheet .sh-h .grab{position:absolute;left:50%;top:4px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(127,227,255,.3)}
#sheet .sh-t{font-weight:900;font-size:16px}
#sheet .sh-s{font-size:12px;color:var(--mut)}
#sheet .sh-x{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;color:var(--mut)}
#sheet .sh-b{overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
@media (min-width:900px){
  #sheet{left:auto;right:10px;top:calc(var(--st) + 100px);bottom:10px;width:410px;max-height:none;transform:translateX(110%)}
  #sheet.open{transform:none}
  #dock .bar{width:560px}
  #obj{top:calc(var(--st) + 100px)}
  #hud{right:auto;width:640px}
}
body.modal-on #side{display:none}
.sec{margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--mut)}
.kv b{color:var(--tx);font-weight:600}
.meter{height:7px;background:rgba(255,255,255,.07);position:relative;margin:3px 0 7px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--cy);box-shadow:0 0 8px rgba(127,227,255,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;font-weight:700;font-size:13.5px;border:1px solid var(--line2);color:var(--cy2);background:rgba(127,227,255,.06);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:active{background:rgba(127,227,255,.2)}
.btn.pri{background:var(--cy);color:#04101e;border-color:var(--cy);box-shadow:0 0 18px rgba(127,227,255,.35)}
.btn.warn{border-color:rgba(255,209,102,.6);color:var(--am);background:rgba(255,209,102,.06)}
.btn.bad{border-color:rgba(255,107,107,.55);color:#ffb3b3;background:rgba(255,107,107,.06)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border:1px solid var(--line);margin:0 4px 4px 0;color:var(--cy2)}
.tag.neg{color:#ffb3b3;border-color:rgba(255,107,107,.35)}.tag.pos{color:#bff7cf;border-color:rgba(124,240,160,.35)}
.muted{color:var(--mut)} .small{font-size:12px} .good{color:var(--gr)} .bad{color:var(--rd)} .warnc{color:var(--am)}

/* 人物面板 */
.ph{display:flex;gap:12px;align-items:flex-start}
.ph .por{flex:none;width:96px;height:116px;position:relative}
.ph .por canvas{animation:flick 5s infinite}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.7}98%{opacity:1}99%{opacity:.82}}
.ph .nm{font-weight:900;font-size:19px;line-height:1.2}
.ph .rl{font-size:12.5px;color:var(--mut);margin:2px 0 6px}
.ph .now{font-size:13px;color:var(--cy2)}
.ph .th{font-size:13px;color:#d9c9ff;font-style:italic;margin-top:4px;line-height:1.45}
.bars2{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:12.5px;color:var(--mut)}
.bars2 .meter{margin:0}
.jobs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.job{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:1px solid var(--line);font-size:12px;color:var(--mut);position:relative}
.job.on{border-color:var(--cy);color:#04101e;background:var(--cy)}
.job .lv{position:absolute;right:3px;top:2px;font-family:var(--num);font-size:10px;opacity:.8}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.sk{display:grid;grid-template-columns:34px 1fr 18px;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.sk .pips{display:flex;gap:2px}.sk .pips i{flex:1;height:6px;background:rgba(255,255,255,.08)}.sk .pips i.f{background:var(--cy)}
.sk.top{color:var(--cy2)}.sk.top .pips i.f{background:var(--am)}
.rel{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(127,227,255,.07)}
.rel .rv{margin-left:auto;font-family:var(--num);font-size:12px}
.mods{font-size:12.5px;line-height:1.75}
.mods span{display:inline-block;margin-right:10px}
.bio{font-size:13px;color:#c9dbe8;line-height:1.7;margin-top:6px}

/* 列表卡 */
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line);background:rgba(255,255,255,.02);text-align:left;width:100%}
.li .mini{width:40px;height:48px;flex:none}
.li .li-m{flex:1;min-width:0}
.li .li-n{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.li .li-s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 建造 */
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{flex:1;padding:8px 0;text-align:center;font-weight:700;font-size:13px;color:var(--mut);border-bottom:2px solid transparent}
.tab.on{color:var(--cy);border-color:var(--cy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(127,227,255,.06),rgba(255,255,255,.01));padding:4px 6px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.card .thumb{width:132px;height:104px;max-width:100%;margin:-4px 0 -6px}
.card .cn{font-weight:900;font-size:14px}
.card .cc{font-size:11.5px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.card .cc span{display:inline-flex;align-items:center;gap:2px}.card .cc .ic{width:12px;height:12px}
.card .cc .no{color:var(--rd)}
.card.lock{opacity:.5}
.card .lk{font-size:11px;color:var(--am);margin-top:3px}
#buildbar{position:fixed;left:0;right:0;bottom:0;z-index:13;padding:0 calc(var(--sr) + 6px) calc(var(--sb) + 6px) calc(var(--sl) + 6px);display:flex;justify-content:center}
#buildbar .bar{display:flex;align-items:center;gap:10px;padding:8px;width:min(100%,560px)}
#buildbar .bi{flex:1;min-width:0}
#buildbar .bn{font-weight:900;font-size:15px}
#buildbar .bw{font-size:12px;color:var(--mut)}
#buildbar .bw.bad{color:var(--rd)}
#buildbar .rb{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line2)}
#buildbar .rb.ok{background:var(--cy);color:#04101e}
#modebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 84px);z-index:14;padding:9px 14px;display:flex;gap:12px;align-items:center;font-weight:700;font-size:13.5px;white-space:nowrap}

/* 冬眠艙 */
.pods{display:flex;flex-direction:column;gap:8px}
.pod{display:flex;gap:10px;padding:8px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(127,227,255,.06),transparent);align-items:center}
.pod .pp{width:64px;height:78px;flex:none;position:relative;display:grid;place-items:center}
.pod .pp .q{font-family:var(--num);font-size:30px;color:rgba(127,227,255,.35)}
.pod .pi{flex:1;min-width:0}
.pod .pl{font-family:var(--num);font-size:11px;color:var(--dim);letter-spacing:.12em}
.pod .pn{font-weight:900;font-size:15px}
.pod .pr{font-size:12.5px;color:var(--mut)}
.pod.dmg{border-color:rgba(255,107,107,.35);background:linear-gradient(90deg,rgba(255,107,107,.08),transparent)}
.batt{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line)}
.batt .big{font-family:var(--num);font-size:26px;font-weight:700}

/* 對話 */
#modal{position:fixed;inset:0;z-index:40;display:none}
#modal.on{display:block}
#modal .dim{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(4,6,16,.35),rgba(2,3,10,.82))}
.dlg{position:absolute;left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);width:min(94vw,620px);display:flex;gap:12px;padding:14px 14px 16px;min-height:140px;animation:dlgin .3s ease-out}
@keyframes dlgin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.dlg .dp{flex:none;width:96px;height:116px;margin-top:-34px}
.dlg .dn{font-weight:900;font-size:15px;color:var(--cy2);display:flex;gap:8px;align-items:baseline}
.dlg .dn small{font-weight:500;font-size:11.5px;color:var(--mut)}
.dlg .dt{font-size:16px;line-height:1.75;margin-top:4px;min-height:56px;white-space:pre-wrap}
.dlg .nx{position:absolute;right:14px;bottom:8px;color:var(--cy);font-size:12px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.narr{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(88vw,560px);text-align:center;font-family:var(--serif);font-size:19px;line-height:1.9;color:#e9e3ff;text-shadow:0 0 24px rgba(160,140,255,.5);animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.skip{position:absolute;right:calc(var(--sr) + 12px);top:calc(var(--st) + 12px);padding:7px 12px;font-size:12px;color:var(--mut);border:1px solid var(--line);background:rgba(7,12,28,.7);z-index:3}
.skip.low{top:auto;bottom:calc(var(--sb) + 196px)}
.evt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,480px);max-height:86vh;overflow-y:auto;padding:0 0 14px;animation:evin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes evin{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
.evt .ea{height:92px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,rgba(127,227,255,.22),transparent 70%),repeating-linear-gradient(0deg,rgba(127,227,255,.06) 0 1px,transparent 1px 4px)}
.evt .ea .ic{width:48px;height:48px;color:var(--cy2);filter:drop-shadow(0 0 12px var(--cy))}
.evt .ea::after{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(transparent,rgba(127,227,255,.18),transparent);animation:scan 2.4s linear infinite}
@keyframes scan{from{top:-30%}to{top:100%}}
.evt .et{font-family:var(--serif);font-weight:900;font-size:22px;text-align:center;margin:12px 16px 4px;letter-spacing:.06em}
.evt .ex{padding:4px 18px;font-size:15px;line-height:1.85;color:#d7e6f2}
.evt .ex p{margin:0 0 8px}
.evt .ch{display:flex;flex-direction:column;gap:7px;padding:8px 14px 0}

'use strict';
/* ====== 墜星 LANDFALL — 工具 ====== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// 可重現亂數（mulberry32）
function RNG(seed) {
  let s = seed >>> 0;
  const f = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  f.int = (a, b) => a + Math.floor(f() * (b - a + 1));
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  f.state = () => s;
  f.setState = v => { s = v >>> 0; };
  return f;
}
// 全域亂數（存檔時記住狀態）
let R = RNG(Date.now() & 0xffffffff);

// 平滑雜訊（value noise）
function makeNoise(seed) {
  const r = RNG(seed);
  const P = new Float32Array(256);
  for (let i = 0; i < 256; i++) P[i] = r();
  const h = (x, y) => P[((x * 73856093) ^ (y * 19349663)) & 255];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = smooth(x - xi), yf = smooth(y - yi);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return lerp(lerp(a, b, xf), lerp(c, d, xf), yf);
  };
}
function fbm(noise, x, y, oct = 3) {
  let v = 0, amp = 1, f = 1, tot = 0;
  for (let i = 0; i < oct; i++) { v += noise(x * f, y * f) * amp; tot += amp; amp *= .5; f *= 2; }
  return v / tot;
}

// 顏色
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function mix(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  const c = a.map((v, i) => Math.round(lerp(v, b[i], t)));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function shade(h, amt) { return amt >= 0 ? mix(h, '#ffffff', amt) : mix(h, '#000000', -amt); }

// 時間格式
const DAY = 1440;
function dayOf(min) { return Math.floor(min / DAY) + 1; }
function hourOf(min) { return (min % DAY) / 60; }
function clockStr(min) {
  const m = Math.floor(min % DAY);
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

function uid() { return (uid.n = (uid.n || 0) + 1); }
function shuffle(arr, r = R) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function weighted(list, wf, r = R) {
  let tot = 0; for (const x of list) tot += Math.max(0, wf(x));
  let v = r() * tot;
  for (const x of list) { v -= Math.max(0, wf(x)); if (v <= 0) return x; }
  return list[list.length - 1];
}
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);

  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}

// 特質相性（聊天時的加減）
function traitCompat(a, b) {
  let s = 0;
  const has = (p, t) => p.traits.includes(t);
  if (has(a, '毒舌') && has(b, '固執') || has(b, '毒舌') && has(a, '固執')) s -= 3;
  if (has(a, '毒舌') && has(b, '樂天') || has(b, '毒舌') && has(a, '樂天')) s += 2;
  if (has(a, '暴躁') || has(b, '暴躁')) s -= 1.5;
  if (has(a, '話多') && has(b, '寡言') || has(b, '話多') && has(a, '寡言')) s -= 1;
  if (has(a, '慈祥') || has(b, '慈祥')) s += 2;
  if (has(a, '熱心') || has(b, '熱心')) s += 1;
  if (has(a, '樂天') && has(b, '樂天')) s += 1.5;
  if (has(a, '悲觀') && has(b, '樂天') || has(b, '悲觀') && has(a, '樂天')) s += 0.5;
  if (has(a, '野心家') && has(b, '忠誠') || has(b, '野心家') && has(a, '忠誠')) s -= 1;
  if (a.age && b.age && Math.abs(a.age - b.age) < 12) s += 0.7;
  if (a.suit === b.suit) s += 0.8;
  return s;
}

'use strict';
/* ====== 世界：地圖生成、格子、尋路、迷霧 ====== */
let G = null;            // 遊戲狀態
const N = K.N;
const idx = (x, y) => y * N + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < N && y < N;

function genWorld(seed) {
  const r = RNG(seed ^ 0x9e3779b9);
  const nz = makeNoise(seed), nz2 = makeNoise(seed + 17), nz3 = makeNoise(seed + 91);
  const ter = new Uint8Array(N * N);
  const W = { ter, nodes: [], nmap: new Int32Array(N * N), bmap: new Int32Array(N * N), fog: new Uint8Array(N * N), deco: new Uint8Array(N * N) };
  // 基底地形
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const v = fbm(nz, x / 9, y / 9, 3), w = fbm(nz2, x / 6, y / 6, 2);
    let t = T.SOIL;
    if (v > 0.62) t = T.STONE;
    else if (w > 0.66) t = T.MOSS;
    // 東北：晶化地
    const dx = x - 41, dy = y - 7;
    if (Math.hypot(dx, dy) < 7.5 + fbm(nz3, x / 4, y / 4) * 4) t = T.GLASS;
    ter[idx(x, y)] = t;
    W.deco[idx(x, y)] = Math.floor(r() * 256);
  }
  // 光溪：從北邊蜿蜒到南邊（偏東）
  const streamX = y => 33 + Math.sin(y / 6.5) * 3.5 + Math.sin(y / 2.7) * 1.1;
  for (let y = 0; y < N; y++) {
    const cx = streamX(y);
    for (let x = Math.floor(cx - 1.2); x <= Math.ceil(cx + 1.2); x++) {
      if (!inMap(x, y)) continue;
      const d = Math.abs(x + 0.5 - cx);
      if (d < 1.15) ter[idx(x, y)] = T.WATER;
      else if (d < 2.6 && ter[idx(x, y)] !== T.GLASS) ter[idx(x, y)] = T.MOSS;
    }
  }
  // 後段艙位置
  const HX = 20, HY = 22;
  // 墜毀溝：從西北邊界到艙體
  const sx = 2, sy = 5, ex = HX + 1, ey = HY + 1;
  const steps = 80;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const cx = lerp(sx, ex, t) + Math.sin(t * 7) * 1.2, cy = lerp(sy, ey, t);
    const wid = 1.3 + t * 1.4;
    for (let y = Math.floor(cy - 3); y <= cy + 3; y++) for (let x = Math.floor(cx - 3); x <= cx + 3; x++) {
      if (!inMap(x, y)) continue;
      const d = Math.hypot(x + .5 - cx, y + .5 - cy);
      if (d < wid) ter[idx(x, y)] = T.BURNT;
      else if (d < wid + 1.4 && ter[idx(x, y)] !== T.WATER && r() < 0.6) ter[idx(x, y)] = T.ASH;
    }
  }
  // 艙體周圍清空成灰燼地
  for (let y = HY - 3; y < HY + 6; y++) for (let x = HX - 3; x < HX + 8; x++)
    if (inMap(x, y) && ter[idx(x, y)] !== T.WATER) ter[idx(x, y)] = (Math.hypot(x - HX - 2.5, y - HY - 1.5) < 4.2 ? T.ASH : ter[idx(x, y)] === T.STONE ? T.SOIL : ter[idx(x, y)]);

  G.world = W;
  // 放置後段艙
  placeBuilding('hull', HX, HY, true);

  const free = (x, y, rad = 0) => {
    for (let yy = y - rad; yy <= y + rad; yy++) for (let xx = x - rad; xx <= x + rad; xx++) {
      if (!inMap(xx, yy)) return false;
      if (W.nmap[idx(xx, yy)] || W.bmap[idx(xx, yy)] || ter[idx(xx, yy)] === T.WATER) return false;
    }
    return true;
  };
  const nearHull = (x, y, d) => Math.hypot(x - HX - 2.5, y - HY - 1.5) < d;
  // 殘骸：沿著墜毀溝
  for (let i = 0; i < 70; i++) {
    const t = r();
    const cx = lerp(sx, ex, t) + Math.sin(t * 7) * 1.2 + (r() - .5) * 5, cy = lerp(sy, ey, t) + (r() - .5) * 5;
    const x = Math.round(cx), y = Math.round(cy);
    if (inMap(x, y) && free(x, y) && !nearHull(x, y, 3.6)) addNode(r() < 0.18 ? 'crate' : 'debris', x, y, r);
  }
  // 艙體附近一些殘骸
  for (let i = 0; i < 14; i++) {
    const a = r() * TAU, d = 4 + r() * 5;
    const x = Math.round(HX + 2.5 + Math.cos(a) * d), y = Math.round(HY + 1.5 + Math.sin(a) * d);
    if (inMap(x, y) && free(x, y) && !nearHull(x, y, 3.8)) addNode(r() < 0.25 ? 'crate' : 'debris', x, y, r);
  }
  // 傘菌樹林
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    if (!free(x, y) || nearHull(x, y, 6)) continue;
    const f = fbm(nz3, x / 7 + 10, y / 7 + 3, 3);
    const t = ter[idx(x, y)];
    if (t === T.BURNT || t === T.ASH) continue;
    if (f > 0.6 && r() < 0.55) addNode('tree', x, y, r);
    else if (f > 0.5 && r() < 0.12) addNode('tree', x, y, r);
  }
  // 礦脈岩
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    if (!free(x, y) || nearHull(x, y, 6)) continue;
    if (ter[idx(x, y)] === T.STONE && r() < 0.32) addNode('rock', x, y, r);
  }
  // 晶簇
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!free(x, y)) continue;
    if (ter[idx(x, y)] === T.GLASS && r() < 0.2) addNode('crystal', x, y, r);
  }
  // 營地附近保證幾簇晶簇（樣本任務）
  let near = 0;
  for (let tries = 0; tries < 400 && near < 3; tries++) {
    const x = r.int(HX + 8, HX + 14), y = r.int(HY - 9, HY - 3);
    if (inMap(x, y) && free(x, y, 1)) { ter[idx(x, y)] = T.GLASS; addNode('crystal', x, y, r); near++; }
  }
  // 燈果叢：溪邊與苔地
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    if (!free(x, y) || nearHull(x, y, 4)) continue;
    const t = ter[idx(x, y)];
    if (t === T.MOSS && r() < 0.13) addNode('bush', x, y, r);
    else if (t === T.SOIL && r() < 0.018) addNode('bush', x, y, r);
  }
  // 營地附近保證食物
  let bushes = 0;
  for (let tries = 0; tries < 600 && bushes < 7; tries++) {
    const x = r.int(HX - 8, HX + 12), y = r.int(HY - 6, HY + 10);
    if (inMap(x, y) && free(x, y) && !nearHull(x, y, 4.5) && nearHull(x, y, 11)) { addNode('bush', x, y, r); bushes++; }
  }
  // 石碑
  for (let tries = 0; tries < 200; tries++) {
    const x = r.int(36, 44), y = r.int(12, 18);
    if (free(x, y, 1)) { addNode('ruin', x, y, r); break; }
  }
  // 刺背獸巢
  const nestSpots = [[r.int(3, 8), r.int(38, 44)], [r.int(42, 45), r.int(30, 40)]];
  for (const [x, y] of nestSpots) if (free(x, y)) addNode('nest', x, y, r);

  // 迷霧：艙體周圍
  revealAround(HX + 2.5, HY + 1.5, 10.5);
}

const PF = { g: new Float32Array(N * N), seen: new Uint32Array(N * N), closed: new Uint32Array(N * N), from: new Int32Array(N * N), gen: 1 };

  const gen = ++PF.gen;

/* ---------- 床位 ---------- */
function assignBeds() {
  const dorms = G.buildings.filter(b => b.type === 'dorm' && b.done);
  const cap = new Map(dorms.map(d => [d.id, BUILD.dorm.beds]));
  const ppl = awakeAll().filter(c => !c.away);

  for (const c of ppl) {

    // 伴侶優先同房
    const p = c.partner && byId(c.partner);
    if (p && p.bed && cap.get(p.bed) > 0) { c.bed = p.bed; cap.set(p.bed, cap.get(p.bed) - 1); continue; }
    for (const d of dorms) if (cap.get(d.id) > 0) { c.bed = d.id; cap.set(d.id, cap.get(d.id) - 1); break; }
  }
}
function bedCount() { return countB('dorm') * BUILD.dorm.beds; }

/* ---------- 電力 ---------- */
function powerStep(dt) {

  let cap = K.HULL_CAP, gen = 0, use = G.tide.blackout ? 0.6 : K.CRYO_DRAIN;
  const sun = sunFactor() * (G.weather && G.weather.type === 'storm' ? 0.2 : 1) * (G.tech.done.solar2 ? 1.25 : 1);
  for (const b of G.buildings) {
    if (!b.done) continue;

    if (d.solar) { b.out = d.gen * sun; gen += b.out; }
    else if (b.type === 'biogen') {
      if (b.active && (b.fuel > 0 || G.res.fiber >= 1)) {
        b.fuel = (b.fuel || 0) - dt;
        if (b.fuel <= 0) { if (G.res.fiber >= 1) { G.res.fiber -= 1; b.fuel += 120; } }
        b.out = b.fuel > 0 ? d.gen : 0; gen += b.out;
      } else b.out = 0;
    }
    if (d.use && b.active) {
      let u = d.use;
      if (['research', 'workshop', 'medbay'].includes(b.type)) u *= b.busy ? 1 : 0.15;
      if (b.type === 'greenhouse' && (G.flags.ghDark > G.t)) u *= 0.3;
      if (G.tide.blackout && b.type !== 'turret') u *= 0.1;

  memAll('podlost', -5, DAY, '有冬眠艙停止運作了');

'use strict';
/* ====== 模擬：主迴圈、殖民者 AI、生物、戰鬥、人際 ====== */
function simAdvance(total) {

    const dt = Math.min(1, total);

    total -= dt;
  }
}
function simStep(dt) {

  if (G.dirtyPath) { G.dirtyPath = false; for (const c of G.colonists) if (c.path && !c.task?.cmdKeep) c.repath = true; for (const b of G.beasts) b.repath = true; }

  if (G._a10 >= 10) { G._a10 -= 10; every10(); }

function onNewDay() {
  log(`第 ${G.day} 日。`, 'quiet');

  for (const c of awake()) if (!c.leader && c.traits.includes('野心家') && !c.mems.some(m => m.id === 'valued')) trust(c, -1.5);
}
function every10() {

}

    // 精神崩潰

    }
    if (c.brk && (G.t > c.brk.until || c.mood > 40)) { log(`${c.name} 冷靜下來了。`, 'quiet'); c.brk = null; c.lowFor = 0; if (c.task && c.task.kind === 'break') c.task = null; }

/* ---------- 殖民者 ---------- */

}

  if (sleeping) c.rest = Math.min(100, c.rest + dt * (c.traits.includes('失眠') ? 0.17 : 0.24) * (t.ground ? 0.8 : 1));
  else if (resting) c.rest = Math.min(100, c.rest + dt * 0.08);

function inMed(c) { const b = c.lie ? bById(c.lie) : (c.inside ? bById(c.inside) : null); return b && b.type === 'medbay'; }

function techAvailable(id) {
  const t = TECH[id];
  if (G.tech.done[id]) return false;

  if (t.need && !G.flags[t.need]) return false;
  return true;
}
function applyResearch() {
  const id = G.tech.cur;
  if (!id) return;
  if (!techAvailable(id)) { G.tech.cur = null; return; }
  const need = TECH[id].cost - (G.tech.prog[id] || 0);
  const use = Math.min(need, G.res.data);
  if (use <= 0) return;
  G.res.data -= use;
  G.tech.prog[id] = (G.tech.prog[id] || 0) + use;
  if (G.tech.prog[id] >= TECH[id].cost - 1e-6) {
    G.tech.done[id] = true; G.tech.cur = null;
    log(`研究完成：${TECH[id].name}`, 'good');
    if (typeof SFX !== 'undefined') SFX.research();
    if (id === 'struct') for (const b of G.buildings) { b.hpMax = Math.round(b.hpMax * 1.3); b.hp = Math.round(b.hp * 1.3); }
    if (typeof onTech === 'function') onTech(id);

  }
}

/* ====== 渲染核心：鏡頭、地形、光照、特效、點選 ====== */
const TW = 64, TH = 32;

let cv, ctx, lightCv, lctx;
const FX = { parts: [], texts: [], shots: [], rings: [] };
let RT = 0; // 渲染時間（秒）

function rotP(x, y, r = CAM.rot) {
  switch (r) {
    case 1: return [N - y, x];
    case 2: return [N - x, N - y];
    case 3: return [y, N - x];
    default: return [x, y];
  }
}
function unrotP(rx, ry, r = CAM.rot) {
  switch (r) {
    case 1: return [ry, N - rx];
    case 2: return [N - rx, N - ry];
    case 3: return [N - ry, rx];
    default: return [rx, ry];
  }
}
// 世界座標 → 螢幕座標（CSS px）
function w2s(x, y, h = 0) {
  const [rx, ry] = rotP(x, y);
  const [cx, cy] = rotP(CAM.x, CAM.y);
  const z = CAM.z;
  return [
    (rx - ry - (cx - cy)) * TW / 2 * z + CAM.W / 2 + (CAM.shakeX || 0),
    (rx + ry - (cx + cy)) * TH / 2 * z - h * z + CAM.H / 2 + (CAM.shakeY || 0),
  ];
}
function s2w(sx, sy) {
  const z = CAM.z;
  const [cx, cy] = rotP(CAM.x, CAM.y);
  const a = (sx - CAM.W / 2) / (TW / 2 * z) + (cx - cy);
  const b = (sy - CAM.H / 2) / (TH / 2 * z) + (cx + cy);
  const rx = (a + b) / 2, ry = (b - a) / 2;
  return unrotP(rx, ry);
}
// 世界方向 → 螢幕方向
function dirToScreen(dx, dy) {
  const [ax, ay] = rotP(dx, dy); const [ox, oy] = rotP(0, 0);
  const rx = ax - ox, ry = ay - oy;
  return [rx - ry, (rx + ry) / 2];
}

/* ---------- 地台側面（立體模型感） ---------- */
function drawPlateau() {

/* ---------- 可見範圍 ---------- */

}
function onScreen(sx, sy, m = 80) { return sx > -m && sy > -m * 1.5 && sx < CAM.W + m && sy < CAM.H + m; }

/* ---------- 地形 ---------- */

function drawTerrain(dark) {

    ctx.fillStyle = mix('#1a5470', '#2a8aa5', 0.5 + ph * 0.25);

// 迷霧

/* ---------- 光照 ---------- */

/* ---------- 特效 ---------- */

/* ---------- 點選 ---------- */

/* ---------- 人物 ---------- */
function drawPerson(p, sx, sy, z, o = {}) {

  else if (act === 'pick' || act === 'type') { aL = -0.7 + Math.sin(sp) * 0.15; aR = -0.7 - Math.sin(sp) * 0.15; }

UI.updateObj = function () {

  let ex = '';
  if (E.phase && !['idle', 'done'].includes(E.phase)) {

    const left = Math.max(0, (E.ret + E.delay / DAY - el_) * 24);
    ex = `<div id="exptrk">◆ 遠征隊在外：${E.step < 3 ? '前往艦橋段' : '返回營地'}（約 ${Math.ceil(left)} 小時後回來）</div>`;

    if (o.id === 'study') hint = hasB('research') ? 'research' : 'build:research';

  const logo = h('div', { class: 'logo' }, h('div', { class: 'zh' }, '墜星'), h('div', { class: 'en' }, 'LANDFALL'), h('div', { class: 'tag2' }, '長庚號殖民地　第一幕｜墜落'));
  const tb = h('div', { class: 'tb' });
  if (save) tb.append(h('button', { class: 'btn pri', onclick: () => { SFX.init(); SFX.click(); startFromSave(save); } }, `繼續　第 ${save.day} 日｜${save.colonists.filter(c => !c.dead).length} 人`));
  tb.append(h('button', { class: 'btn' + (save ? '' : ' pri'), onclick: () => { SFX.init(); SFX.click(); if (save) UI.confirm('開始新的殖民地？目前的進度會被覆蓋。', () => { clearLocal(); startNew(); }); else startNew(); } }, '新的殖民地'));
  tb.append(h('div', { class: 'ver' }, 'ZHUIXING · BUILD ' + BUILD_ID));
  t.append(logo, tb);
};
function playIntro(after) {
  const box = el('intro');
  box.classList.remove('hidden');
  box.innerHTML = '';
  const lines = [['長庚號殖民船　航行第四十一年', ''], ['船上一百一十三人，全在沉睡。', ''], ['再過九天，他們就會在新禾星醒來。', ''], ['——但長庚號，沒有抵達新禾。', 'red']];
  const sk = h('button', { class: 'skip', onclick: () => finish() }, '略過 »');
  box.append(sk);
  const ln = h('div', { class: 'il' });
  box.append(ln);
  let i = 0, done_ = false, timer;
  const step = () => {
    if (done_) return;
    if (i >= lines.length) { crash(); return; }
    ln.classList.remove('on');
    setTimeout(() => { if (done_) return; ln.textContent = lines[i][0]; ln.className = 'il ' + lines[i][1]; requestAnimationFrame(() => ln.classList.add('on')); SFX.tap(); i++; timer = setTimeout(step, i === lines.length ? 2400 : 2600); }, 700);
  };
  const crash = () => {
    const f = el('flash');
    SFX.boom();
    f.style.transition = 'none'; f.style.opacity = 1;
    setTimeout(() => { box.classList.add('hidden'); f.style.transition = 'opacity 1.6s'; f.style.opacity = 0; finish(); }, 160);
  };
  const finish = () => { if (done_) return; done_ = true; clearTimeout(timer); box.classList.add('hidden'); after(); };
  step();
}

'use strict';
/* ====== 啟動、主迴圈、輸入 ====== */
const BUILD_ID = '2026.11.07';
let lastFrame = performance.now();
let lastSave = performance.now();
let savedDay = 0;

function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  RT += dt;
  if (G) {
    if (!G.paused && G.speed > 0) simAdvance(dt * G.speed * K.MIN_PER_SEC * (G.demo ? 0.6 : 1));
    stepFX(dt);
    // 鏡頭
    CAM.z = lerp(CAM.z, CAM.tz, 1 - Math.pow(0.0005, dt));
    if (INP.vx || INP.vy) { CAM.x += INP.vx * dt; CAM.y += INP.vy * dt; INP.vx *= Math.pow(0.02, dt); INP.vy *= Math.pow(0.02, dt); if (Math.abs(INP.vx) + Math.abs(INP.vy) < 0.05) INP.vx = INP.vy = 0; }
    if (UI.follow) { const c = UI.follow; if (c.dead || c.away) UI.follow = null; else { CAM.x = lerp(CAM.x, c.x, 1 - Math.pow(0.02, dt)); CAM.y = lerp(CAM.y, c.y, 1 - Math.pow(0.02, dt)); } }
    if (G.demo) { const a = RT * 0.05; const hh = hull(); CAM.x = hh.x + 2.5 + Math.cos(a) * 3; CAM.y = hh.y + 1.5 + Math.sin(a) * 3; }
    clampCam();
    render();
    if (!UI.titleOn) {
      UI.updateHUD();
      if (G.day !== savedDay && hourOf(G.t) > 6) { savedDay = G.day; saveGame(); }
      if (now - lastSave > 150000) { lastSave = now; saveGame(); }
    }
    SFX.musicTick(dt, { dark: darkness(), tide: G.tide.phase === 'active', storm: !!(G.weather && G.weather.type === 'storm') });
  }
  requestAnimationFrame(frame);
}

/* ---------- 輸入 ---------- */
const INP = { ptrs: new Map(), moved: false, start: null, pinch: null, vx: 0, vy: 0, lastMove: 0 };
function setupInput() {
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    INP.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
    INP.vx = INP.vy = 0;
    if (INP.ptrs.size === 1) { INP.moved = false; INP.start = { x: e.clientX, y: e.clientY, t: performance.now() }; }
    if (INP.ptrs.size === 2) { const [a, b] = [...INP.ptrs.values()]; INP.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: CAM.tz, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; INP.moved = true; }
  });
  cv.addEventListener('pointermove', e => {
    const p = INP.ptrs.get(e.pointerId);
    if (!p) return;
    const px = p.x, py = p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (INP.ptrs.size === 1) {
      if (!INP.moved && Math.hypot(p.x - p.x0, p.y - p.y0) > 9) { INP.moved = true; UI.follow = null; }
      if (INP.moved) {
        const w0 = s2w(px, py), w1 = s2w(p.x, p.y);
        const dx = w0[0] - w1[0], dy = w0[1] - w1[1];
        CAM.x += dx; CAM.y += dy;
        const t = performance.now(), dtm = Math.max(8, t - INP.lastMove) / 1000; INP.lastMove = t;
        INP.fvx = dx / dtm; INP.fvy = dy / dtm;
      }
    } else if (INP.ptrs.size === 2 && INP.pinch) {
      const [a, b] = [...INP.ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const before = s2w(mx, my);
      CAM.z = CAM.tz = clamp(INP.pinch.z * d / INP.pinch.d, 0.45, 2.4);
      const after = s2w(mx, my);
      CAM.x += before[0] - after[0]; CAM.y += before[1] - after[1];
      const w0 = s2w(INP.pinch.mx, INP.pinch.my), w1 = s2w(mx, my);
      CAM.x += w0[0] - w1[0]; CAM.y += w0[1] - w1[1];
      INP.pinch.mx = mx; INP.pinch.my = my;
    }
  });
  const up = e => {
    const p = INP.ptrs.get(e.pointerId);
    INP.ptrs.delete(e.pointerId);
    if (INP.ptrs.size < 2) INP.pinch = null;
    if (!p) return;
    if (INP.ptrs.size === 0) {
      if (!INP.moved && e.type === 'pointerup') { if (!UI.titleOn && G && !G.demo) UI.onTap(e.clientX, e.clientY); }
      else if (INP.moved && performance.now() - INP.lastMove < 60 && INP.fvx != null) { INP.vx = clamp(INP.fvx, -40, 40) * 0.9; INP.vy = clamp(INP.fvy, -40, 40) * 0.9; }
      INP.fvx = INP.fvy = 0;
    }
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const before = s2w(e.clientX, e.clientY);
    const k = Math.exp(-e.deltaY * 0.0016);
    CAM.z = CAM.tz = clamp(CAM.tz * k, 0.45, 2.4);
    const after = s2w(e.clientX, e.clientY);
    CAM.x += before[0] - after[0]; CAM.y += before[1] - after[1];
  }, { passive: false });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (!G || G.demo || UI.titleOn) return;
    if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
    if (UI.modal) { if (e.key === ' ' || e.key === 'Enter') { UI.modal.onTap && UI.modal.onTap(e); e.preventDefault(); } return; }
    const k = e.key.toLowerCase();
    if (k === ' ') { setSpeed(G.speed ? 0 : (UI.prevSpeed || 1)); e.preventDefault(); }
    else if (k === '1' || k === '2' || k === '3') setSpeed(+k);
    else if (k === 'q') rotate(-1); else if (k === 'e') rotate(1);
    else if (k === 'b') UI.toggleSheet('build');
    else if (k === 'escape') { if (UI.build) UI.endBuild(); else if (UI.mode) UI.endMode(); else UI.closeSheet(); }
    else if (k === 'w' || k === 'arrowup') panKey(0, -1); else if (k === 's' || k === 'arrowdown') panKey(0, 1);
    else if (k === 'a' || k === 'arrowleft') panKey(-1, 0); else if (k === 'd' || k === 'arrowright') panKey(1, 0);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.demo) saveGame(); });
  window.addEventListener('pagehide', () => { if (G && !G.demo) saveGame(); });
  // 第一次觸控啟動音效
  const unlock = () => { SFX.init(); };
  window.addEventListener('pointerdown', unlock, { capture: true });
}
function panKey(dx, dy) {
  const w0 = s2w(CAM.W / 2, CAM.H / 2), w1 = s2w(CAM.W / 2 + dx * 120, CAM.H / 2 + dy * 120);
  CAM.x += w1[0] - w0[0]; CAM.y += w1[1] - w0[1];
}

/* ---------- 場景切換 ---------- */
function showGameUI(on) {
  for (const id of ['hud', 'dock', 'side']) el(id).classList.toggle('hidden', !on);
  if (!on) { el('obj').classList.add('hidden'); el('buildbar').classList.add('hidden'); el('modebar').classList.add('hidden'); UI.closeSheet(); }
}
function makeDemo() {
  const g = newGame((Math.random() * 1e9) >>> 0);
  g.demo = true;
  g.t = 20.5 * 60;
  revealAll();
  const h_ = hull();
  const place = (type, x, y) => { if (!canPlace(type, x, y)) { const b = placeBuilding(type, x, y, true); return b; } return null; };
  place('solar', h_.x + 6, h_.y - 1); place('dorm', h_.x - 3, h_.y + 4); place('mess', h_.x + 2, h_.y + 5); place('lamp', h_.x + 5, h_.y + 4); place('research', h_.x + 6, h_.y + 2); place('lamp', h_.x - 2, h_.y - 2);
  g.res.food = 999; g.power.stored = 300;
  for (let i = 0; i < 6; i++) { const p = g.pods.find(p => p.status === 'sleep' && !p.dmg); g.power.stored = 300; const c = wakePod(p); if (c) { c.sick = 0; c.rest = 90; c.food = 90; } }
  for (let i = 0; i < 5; i++) { const s = edgeSpot(10); spawnBeast('bug', s[0], s[1], 'roam'); }
  CAM.tz = CAM.z = 1.05; CAM.rot = 0;
  buildTerrainColors();
  return g;
}
function showTitle() {
  UI.titleOn = true;
  showGameUI(false);
  UI.q = []; UI.modal = null; el('modal').classList.remove('on');
  G = makeDemo();
  UI.renderTitle(bestSave());
  el('title').classList.remove('hidden');
}
function hideTitle() { UI.titleOn = false; el('title').classList.add('hidden'); }
function startNew(skipIntro) {
  hideTitle();
  const seed = (Math.random() * 1e9) >>> 0;
  G = newGame(seed);
  buildTerrainColors();
  savedDay = 1;
  UI.porCache.clear();
  const h_ = hull();
  CAM.rot = 0; CAM.x = h_.x + 2.5; CAM.y = h_.y + 3; CAM.z = CAM.tz = window.innerWidth > 900 ? 1.25 : 1.4;
  G.paused = true;
  const go = () => {
    showGameUI(true);
    G.paused = false;
    playScene('prologue', null, () => { UI.updateObj(); setTimeout(() => { const hb = $('#obj .hintb'); if (hb) hb.classList.add('pulse'); UI.toast('單指拖曳移動畫面、雙指縮放。點人、建築或資源，可以看詳細資料。'); }, 400); });
    saveGame();
  };
  if (skipIntro) go(); else playIntro(go);
}
function startFromSave(o) {
  hideTitle();
  try { deserialize(o); } catch (e) { console.error(e); UI.toast('存檔損毀，無法讀取。', 'bad'); showTitle(); return; }
  savedDay = G.day;
  UI.porCache.clear();
  const L = leader();
  CAM.rot = 0; CAM.x = L && !L.away ? L.x : hull().x + 2.5; CAM.y = L && !L.away ? L.y : hull().y + 2; CAM.z = CAM.tz = 1.3;
  showGameUI(true);
  G.paused = false;
  UI.updateObj();
  UI.toast(`歡迎回來。第 ${G.day} 日，${clockStr(G.t)}。`, 'good');
}

/* ---------- 啟動 ---------- */
function boot() {
  initRender(el('cv'));
  UI.init();
  setupInput();
  showTitle();
  requestAnimationFrame(frame);
  // Claude 雲端存檔
  cloudInit().then(r => { if (r && UI.titleOn) UI.renderTitle(bestSave()); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in THUMBS) delete THUMBS[k]; });
}
window.addEventListener('error', e => { try { console.error('ERR', e.message, e.filename, e.lineno); } catch (x) {} });
boot();
