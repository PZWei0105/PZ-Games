<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>連營</title>
<meta name="theme-color" content="#0d0f13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* 版面：全螢幕 3D 沙盤，上方軍情列、右側鏡頭鈕、下方手牌；沙盤與漆器、宣紙、朱印的軍帳視覺 */
:root {
  color-scheme: dark;
  --ink: #0d0f13;
  --lacquer: #1a1615;
  --lacquer-2: #26201d;
  --lacquer-3: #322a25;
  --paper: #efe5cf;
  --paper-dim: #b7aa92;
  --paper-faint: #7d7363;
  --vermilion: #c2402f;
  --vermilion-dark: #7e1f16;
  --gold: #d9a94e;
  --gold-dim: #8f6d2f;
  --jade: #6cb59d;
  --indigo: #5d6fb3;
  --amber: #c98a3a;
  --steel: #8f9ba7;
  --frost: #cfe0ea;
  --danger: #e2553f;
  --font-display: "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "LXGW WenKai TC", "Noto Serif TC", "Noto Serif CJK TC", "PingFang TC", "Microsoft JhengHei", serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --card-w: min(19vw, 92px);
  --card-h: calc(var(--card-w) * 1.42);
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); overflow: hidden; }
body { font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.layer { position: absolute; inset: 0; pointer-events: none; }
#ov, #fx { z-index: 5; }
#hud { z-index: 10; }
#hud > * { pointer-events: auto; }
#hud .passive { pointer-events: none; }

/* ---------- 頂部軍情列 ---------- */
#topbar {
  position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 8px) 12px 8px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start;
  background: linear-gradient(to bottom, rgba(10,11,14,.88), rgba(10,11,14,.55) 70%, transparent);
}
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 4px;
  background: rgba(26,22,21,.82); border: 1px solid rgba(217,169,78,.35); box-shadow: 0 2px 10px rgba(0,0,0,.4);
  font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .06em; white-space: nowrap;
}
#turnpill .ph { color: var(--vermilion); font-weight: 900; }
#turnpill.enemy .ph { color: var(--steel); }
#objbox { min-width: 0; font-size: 12.5px; line-height: 1.35; color: var(--paper); padding-top: 2px; }
#objbox .lab { font-family: var(--font-display); color: var(--gold); font-size: 11px; letter-spacing: .2em; display: block; }
#objbox .txt { display: block; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#topright { display: flex; gap: 6px; align-items: center; }
#windbox { cursor: pointer; }
#windbox .arrow { display: inline-block; width: 16px; height: 16px; transition: transform .6s cubic-bezier(.2,.9,.3,1.3); color: var(--frost); }
#windbox .wname { color: var(--frost); }
.iconbtn {
  width: 34px; height: 34px; border-radius: 4px; border: 1px solid rgba(217,169,78,.35); background: rgba(26,22,21,.82);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 15px; padding: 0;
}
.iconbtn:active { transform: scale(.94); }

/* 勢 */
#mom {
  position: absolute; left: 12px; right: 12px; top: calc(var(--safe-t) + 62px); height: 22px; display: flex; align-items: center; gap: 8px;
}
#mom .lab { font-family: var(--font-display); font-weight: 900; color: var(--gold); font-size: 15px; text-shadow: 0 1px 4px #000; }
#mom .bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(0,0,0,.55); border: 1px solid rgba(217,169,78,.3); position: relative; overflow: hidden; }
#mom .fill { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg, #7e1f16, #c2402f 60%, #f0b35a); transition: width .5s cubic-bezier(.2,.8,.3,1); }
#mom .num { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--paper-dim); min-width: 46px; text-align: right; font-family: var(--font-display); }
#mom.full .bar { box-shadow: 0 0 14px rgba(240,179,90,.8); border-color: var(--gold); }
#mom.full .fill { animation: momglow 1s ease-in-out infinite alternate; }
@keyframes momglow { from { filter: brightness(1); } to { filter: brightness(1.45); } }
#chain {
  position: absolute; right: 54px; top: calc(var(--safe-t) + 92px); text-align: right; font-family: var(--font-display); font-weight: 900;
  color: var(--paper); text-shadow: 0 2px 10px #000, 0 0 2px #000; opacity: 0; transition: opacity .3s; pointer-events: none;
}
#chain.on { opacity: 1; }
#chain .n { font-size: 40px; line-height: 1; color: #ffd27a; display: block; }
#chain .l { font-size: 13px; letter-spacing: .3em; color: var(--gold); }
#chain.pop .n { animation: chainpop .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes chainpop { from { transform: scale(1.7); color: #fff; } to { transform: scale(1); } }

/* 鏡頭鈕 */
#camctl { position: absolute; right: 8px; top: calc(var(--safe-t) + 104px); display: flex; flex-direction: column; gap: 5px; }
#camctl .iconbtn { width: 32px; height: 32px; font-size: 14px; background: rgba(26,22,21,.62); }
#camctl .iconbtn.on { background: rgba(194,64,47,.5); border-color: var(--vermilion); }

/* 下方：手牌區 */
#bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px calc(var(--safe-b) + 14px); background: linear-gradient(to top, rgba(10,11,14,.92), rgba(10,11,14,.6) 70%, transparent); }
#bottomrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
#cmd { display: flex; align-items: center; gap: 6px; }
#cmd .lab { font-family: var(--font-display); font-weight: 900; font-size: 13px; color: var(--paper-dim); letter-spacing: .1em; }
.pips { display: inline-flex; gap: 7px; padding: 0 4px; }
.pip { display: inline-block; width: 15px; height: 15px; border-radius: 3px; transform: rotate(45deg); background: rgba(0,0,0,.5); border: 1px solid rgba(194,64,47,.5); transition: all .25s; }
.pip.on { background: radial-gradient(circle at 35% 35%, #ff8a6e, #c2402f 55%, #6e140e); border-color: #ffb08f; box-shadow: 0 0 8px rgba(255,90,60,.6); }
#deckinfo { font-size: 11.5px; color: var(--paper-faint); font-variant-numeric: tabular-nums; margin-left: 6px; }
#actbtns { display: flex; gap: 6px; align-items: center; }
.btn {
  border: 1px solid rgba(217,169,78,.5); background: linear-gradient(#2c2420, #1b1615); border-radius: 4px; padding: 9px 14px;
  font-family: var(--font-display); font-weight: 900; font-size: 15px; letter-spacing: .12em; box-shadow: 0 3px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
}
.btn:active { transform: translateY(1px) scale(.98); }
.btn.primary { background: linear-gradient(#c2402f, #8a2219); border-color: #f0a37f; color: #fff4e6; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.btn.gold { background: linear-gradient(#e2b660, #a77a2c); border-color: #ffe0a0; color: #2a1a07; }
.btn.ghost { background: rgba(26,22,21,.75); }
.btn[disabled] { opacity: .4; pointer-events: none; }
#endturn.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(194,64,47,.0), 0 3px 12px rgba(0,0,0,.5); } 50% { box-shadow: 0 0 0 6px rgba(194,64,47,.25), 0 3px 12px rgba(0,0,0,.5); } }

#hand { position: relative; height: calc(var(--card-h) + 18px); display: flex; justify-content: center; align-items: flex-end; }
.card {
  position: relative; width: var(--card-w); height: var(--card-h); flex: 0 0 auto; margin: 0 -5px; border-radius: 6px;
  transition: transform .22s cubic-bezier(.2,.9,.3,1.2), filter .2s, opacity .2s; transform-origin: 50% 100%; cursor: pointer;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.6));
}
.card .face {
  position: absolute; inset: 0; border-radius: 6px; overflow: hidden; background: #1d1816;
  border: 2px solid var(--tc); box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 0 18px rgba(0,0,0,.6);
}
.card .art { position: absolute; left: 4px; right: 4px; top: 4px; height: 58%; border-radius: 3px; background-size: cover; background-position: center; }
.card .nm {
  position: absolute; left: 0; right: 0; top: 58%; margin-top: 3px; text-align: center; font-family: var(--font-display); font-weight: 900;
  font-size: calc(var(--card-w) * 0.165); letter-spacing: .04em; color: var(--paper); text-shadow: 0 1px 3px #000; white-space: nowrap;
}
.card.up .nm { color: #ffd88a; }
.card .sh { position: absolute; left: 4px; right: 4px; bottom: 5px; text-align: center; font-size: calc(var(--card-w) * 0.118); line-height: 1.25; color: var(--paper-dim); }
.card .cost {
  position: absolute; left: -5px; top: -6px; width: calc(var(--card-w) * 0.3); height: calc(var(--card-w) * 0.3); border-radius: 50%;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: calc(var(--card-w) * 0.19); color: #fff3df;
  background: radial-gradient(circle at 35% 30%, #ef6a52, #b5301f 55%, #5d120b); border: 2px solid #f2c27a; box-shadow: 0 2px 6px rgba(0,0,0,.6); z-index: 2;
}
.card .cost.free { background: radial-gradient(circle at 35% 30%, #8fd8b9, #3c8f73 55%, #18402f); border-color: #c8f0de; }
.card .ty { position: absolute; right: 4px; top: 4px; width: 18px; height: 18px; border-radius: 3px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 11px; background: var(--tc); color: #fff; z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.card .who { position: absolute; left: 4px; top: calc(58% - 18px); font-size: 10px; font-family: var(--font-display); font-weight: 900; background: rgba(0,0,0,.65); padding: 1px 4px; border-radius: 2px; color: var(--gold); }
.card.r3 .face { box-shadow: inset 0 0 0 1px rgba(255,220,140,.5), inset 0 0 22px rgba(240,180,80,.25); }
.card.r3 .face::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,230,160,.22) 50%, transparent 60%); animation: foil 3.2s linear infinite; pointer-events: none; }
@keyframes foil { from { transform: translateX(-40%); } to { transform: translateX(40%); } }
.card.r2 .face { box-shadow: inset 0 0 0 1px rgba(210,220,230,.35), inset 0 0 18px rgba(0,0,0,.6); }
.card.dim { filter: grayscale(.7) brightness(.6) drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
.card.sel { transform: translateY(-22px) scale(1.13) !important; z-index: 20; filter: drop-shadow(0 0 12px rgba(240,190,90,.9)) drop-shadow(0 10px 14px rgba(0,0,0,.7)); }
.card.deny { animation: deny .35s; }
@keyframes deny { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.card.enter { animation: cardin .45s cubic-bezier(.2,.9,.3,1.1) backwards; }
@keyframes cardin { from { transform: translate(-60vw, 40px) rotate(-30deg) scale(.6); opacity: 0; } }
.card.ghost { pointer-events: none; }

/* 單位資訊與預判 */
#info { position: absolute; left: 10px; right: 10px; bottom: calc(var(--card-h) + var(--safe-b) + 72px); display: flex; flex-direction: column; gap: 6px; align-items: stretch; pointer-events: none; }
#info > * { pointer-events: auto; }
.panel { background: rgba(22,19,18,.93); border: 1px solid rgba(217,169,78,.35); border-radius: 6px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.55); }
#unitpanel { display: flex; gap: 10px; align-items: center; }
.seal {
  flex: 0 0 auto; width: 42px; height: 42px; border-radius: 4px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 24px;
  background: radial-gradient(circle at 35% 30%, #d4523f, #a0291d 60%, #6a150e); color: #fff1dc; box-shadow: inset 0 0 0 2px rgba(255,220,180,.35), 0 2px 6px rgba(0,0,0,.5);
}
.seal.E { background: radial-gradient(circle at 35% 30%, #4b505a, #23262c 60%, #101114); color: #e7ebef; box-shadow: inset 0 0 0 2px rgba(180,190,200,.3); }
.seal.EO { background: radial-gradient(circle at 35% 30%, #4a2b27, #241413 60%, #0e0707); color: #f0d28a; box-shadow: inset 0 0 0 2px rgba(220,170,80,.45); }
.seal.X { background: radial-gradient(circle at 35% 30%, #e9e6dd, #b9b4a8 60%, #7d786d); color: #2a2622; }
.up-info { flex: 1; min-width: 0; }
.up-info .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.up-info .nm { font-family: var(--font-display); font-weight: 900; font-size: 16px; }
.up-info .tt { font-size: 12px; color: var(--paper-dim); }
.hpbar { height: 7px; border-radius: 3px; background: rgba(0,0,0,.6); position: relative; overflow: hidden; margin: 5px 0 3px; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #8d1f15, #d24a35); transition: width .35s; }
.hpbar.E i { background: linear-gradient(90deg, #45505c, #9aa7b4); }
.hpbar b { position: absolute; top: 0; bottom: 0; background: rgba(140,200,255,.55); }
.up-info .stats { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--paper-dim); align-items: center; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); font-size: 11px; }
.chip.weak { background: rgba(226,85,63,.2); border-color: rgba(226,85,63,.55); color: #ffb3a3; }
.chip.unk { background: rgba(255,255,255,.04); color: var(--paper-faint); }
.chip.st { background: rgba(108,181,157,.18); border-color: rgba(108,181,157,.45); color: #bfe9da; }
.chip.bad { background: rgba(226,85,63,.18); border-color: rgba(226,85,63,.45); color: #ffc0b2; }
.chip.kw { cursor: help; text-decoration: underline dotted rgba(217,169,78,.6); }
.guards { display: inline-flex; gap: 2px; }
.guards i { width: 9px; height: 11px; clip-path: polygon(50% 0, 100% 20%, 100% 65%, 50% 100%, 0 65%, 0 20%); background: #c9d3dc; }
.guards i.off { background: rgba(255,255,255,.15); }
.guards.broken i { background: #e2553f; }

#forecast { display: none; }
#forecast.on { display: block; }
#forecast .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#forecast .title { font-family: var(--font-display); font-weight: 900; font-size: 15px; }
#forecast .title small { font-family: var(--font-body); font-weight: 400; color: var(--paper-dim); font-size: 12px; margin-left: 6px; }
#forecast .desc { font-size: 12.5px; color: var(--paper-dim); margin-top: 4px; line-height: 1.45; }
#forecast .desc em { font-style: normal; color: var(--gold); }
#forecast .lines { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.fl { display: flex; align-items: center; gap: 6px; font-size: 13px; flex-wrap: wrap; }
.fl .who2 { font-family: var(--font-display); font-weight: 700; min-width: 3.5em; }
.fl .dmg { font-family: var(--font-display); font-weight: 900; font-size: 18px; color: #ffcf85; font-variant-numeric: tabular-nums; }
.fl .dmg.crit { color: #ff8a64; }
.fl .tag { font-size: 11px; padding: 0 5px; border-radius: 2px; background: rgba(194,64,47,.35); color: #ffd6c9; }
.fl .tag.k { background: #c2402f; color: #fff; font-weight: 700; }
.fl .tag.b { background: rgba(217,169,78,.35); color: #ffe7b5; }
.fl .tag.c { background: rgba(93,111,179,.4); color: #d7defc; }
.fl .lab2 { font-size: 11px; color: var(--paper-faint); }
#forecast .go { margin-left: auto; }

/* 單位頭頂血條 */
.uchip { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; will-change: transform; }
.uchip .bar { width: 38px; height: 5px; border-radius: 2px; background: rgba(0,0,0,.7); box-shadow: 0 0 0 1px rgba(0,0,0,.6); position: relative; overflow: hidden; }
.uchip .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #d84a35; transition: width .3s; }
.uchip.E .bar i { background: #b8c3cd; }
.uchip .bar b { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(140,200,255,.7); }
.uchip .gd { display: flex; gap: 1px; }
.uchip .gd i { width: 6px; height: 7px; clip-path: polygon(50% 0, 100% 20%, 100% 65%, 50% 100%, 0 65%, 0 20%); background: #dfe6ec; box-shadow: 0 0 2px #000; }
.uchip .gd i.off { background: rgba(255,255,255,.18); }
.uchip.brk .gd i { background: #ff6a4f; }
.uchip .tag { font-family: var(--font-display); font-weight: 900; font-size: 10px; padding: 0 4px; border-radius: 2px; background: rgba(226,85,63,.9); color: #fff; letter-spacing: .05em; }
.uchip .tag.ch { background: rgba(255,60,40,.95); animation: blink .6s infinite alternate; }
.uchip .tag.lu { background: rgba(217,169,78,.9); color: #2a1a07; }
@keyframes blink { to { opacity: .55; } }
.uchip .hpn { font-size: 10px; font-family: var(--font-display); font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000, 0 0 2px #000; font-variant-numeric: tabular-nums; line-height: 1; }

/* 傷害數字與印章 */
.dn { position: absolute; left: 0; top: 0; pointer-events: none; font-family: var(--font-display); font-weight: 900; color: #fff4e0; white-space: nowrap; text-shadow: 0 0 2px #000, 0 2px 0 #000, 0 3px 10px rgba(0,0,0,.9); will-change: transform, opacity; }
.dn .v { font-size: 30px; letter-spacing: -.02em; }
.dn.crit .v { font-size: 46px; color: #ffcc66; background: linear-gradient(#fff3c4, #ffb340 55%, #e2553f); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #3a0c06) drop-shadow(0 0 10px rgba(255,120,60,.6)); }
.dn.small .v { font-size: 22px; }
.dn.heal .v { color: #9ff0c8; }
.dn.blk .v { font-size: 18px; color: #a8d4ff; }
.dn .t { display: block; font-size: 12px; letter-spacing: .15em; color: #ffd6c4; text-align: center; }
.dn.player .v { color: #ff9a86; }
.stamp {
  position: absolute; left: 0; top: 0; pointer-events: none; font-family: var(--font-display); font-weight: 900; color: #fff6ea; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 30%, #e0503b, #b02a1c 60%, #6d150d); border-radius: 6px; box-shadow: inset 0 0 0 3px rgba(255,225,200,.5), 0 6px 20px rgba(0,0,0,.6);
  writing-mode: vertical-rl; letter-spacing: .1em; padding: 6px 4px;
}
.stamp.big { font-size: 64px; padding: 14px 10px; }
.stamp.mid { font-size: 30px; }
.stamp.sm { font-size: 18px; padding: 4px 3px; }
.stamp.gold { background: radial-gradient(circle at 30% 30%, #f6d48a, #c99633 60%, #7a5718); color: #2b1a05; box-shadow: inset 0 0 0 3px rgba(255,250,230,.6), 0 6px 20px rgba(0,0,0,.6); }
.stamp.ink { background: radial-gradient(circle at 30% 30%, #3b3f48, #15171b 70%); color: #e9edf0; box-shadow: inset 0 0 0 3px rgba(200,210,220,.35), 0 6px 20px rgba(0,0,0,.6); }
.bark { position: absolute; left: 0; top: 0; pointer-events: none; background: rgba(239,229,207,.95); color: #1d1714; padding: 5px 9px; border-radius: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.5); transform: translate(-50%, -100%); }
.bark::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: rgba(239,229,207,.95); border-bottom: 0; }
.bark.E { background: rgba(30,33,39,.95); color: #e7ebef; }

<script>
/* ---- 00_core.js ---- */
'use strict';
/* ============================================================
   連營 · 核心工具：數學、亂數、時間軸（頓幀／慢動作）、補間
   ============================================================ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const EASE = {
  lin: (t) => t,
  outQuad: (t) => 1 - (1 - t) * (1 - t),
  inQuad: (t) => t * t,
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
};

function RNG(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  r.int = (n) => Math.floor(r() * n);
  r.range = (a, b) => a + r() * (b - a);
  r.pick = (a) => a[Math.floor(r() * a.length)];
  r.shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  r.state = () => s; r.setState = (v) => { s = v >>> 0 || 1; };
  return r;
}
const FXR = RNG(Date.now() & 0xffffff); // 只用於視覺特效的亂數

/* ---------- 遊戲時間軸：timeScale、頓幀、慢動作 ---------- */
const Clock = {
  real: 0,          // 實際經過毫秒
  game: 0,          // 遊戲時間毫秒（受頓幀／慢動作影響）
  speed: 1,         // 玩家設定的演出速度（敵方回合加速）
  freezeUntil: 0,   // 頓幀結束的實際時間
  slowUntil: 0, slowScale: 1,
  timers: [],
  tweens: [],
  scale() {
    if (this.real < this.freezeUntil) return 0;
    let s = this.speed;
    if (this.real < this.slowUntil) s *= this.slowScale;
    return s;
  },
  hitstop(ms) { this.freezeUntil = Math.max(this.freezeUntil, this.real + ms); },
  slow(scale, ms) { this.slowScale = scale; this.slowUntil = Math.max(this.slowUntil, this.real + ms); },
  tick(realDt) {
    this.real += realDt;
    const gdt = realDt * this.scale();
    this.game += gdt;
    if (this.timers.length) {
      const keep = [];
      for (const t of this.timers) { t.left -= gdt; if (t.left <= 0) t.res(); else keep.push(t); }
      this.timers = keep;
    }
    if (this.tweens.length) {
      const keep = [];
      for (const tw of this.tweens) {
        tw.t += gdt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        try { tw.fn(tw.ease(k), k); } catch (e) { console.error(e); }
        if (k >= 1) tw.res(); else keep.push(tw);
      }
      this.tweens = keep;
    }
    return gdt;
  },
  wait(ms) { return new Promise((res) => { if (ms <= 0) return res(); this.timers.push({ left: ms, res }); }); },
  tween(dur, fn, ease = EASE.outCubic) {
    return new Promise((res) => { this.tweens.push({ t: 0, dur: Math.max(1, dur), fn, ease, res }); });
  },
  clearAll() { for (const t of this.timers) t.res(); for (const t of this.tweens) { try { t.fn(1, 1); } catch (e) {} t.res(); } this.timers = []; this.tweens = []; },
};
const realWait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- 小型 4x4 矩陣（column-major） ---------- */
const M4 = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  ident(o) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  persp(o, fovy, asp, n, f) {
    const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f);
    o.fill(0); o[0] = t / asp; o[5] = t; o[10] = (f + n) * nf; o[11] = -1; o[14] = 2 * f * n * nf; return o;
  },
  look(o, e, c, up) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
    let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0;
    o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0;
    o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
    o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
    o[14] = -(zx * e[0] + zy * e[1] + zz * e[2]);
    o[15] = 1; return o;
  },
  mul(o, a, b) {
    const r = new Float32Array(16);

/* ============================================================

   所有結算都會推入 S.ev 事件，交給演出層播放
   ============================================================ */
const Rules = (() => {
  const key = (S, x, y) => y * S.w + x;
  const inb = (S, x, y) => x >= 0 && y >= 0 && x < S.w && y < S.h;
  const tile = (S, x, y) => (inb(S, x, y) ? S.tiles[y * S.w + x] : null);
  const unitAt = (S, x, y) => { for (const u of S.units) if (u.alive && u.x === x && u.y === y) return u; return null; };
  const byId = (S, uid) => S.units.find((u) => u.uid === uid);
  const officer = (S, id) => S.units.find((u) => u.alive && u.side === 'P' && u.key === id);
  const wei = (S) => S.units.find((u) => u.key === 'wei');
  const hostile = (a, b) => a && b && a.side !== b.side && a.side !== 'N' && b.side !== 'N';
  const dist = (ax, ay, bx, by) => Math.abs(ax - bx) + Math.abs(ay - by);
  const emit = (S, e) => { S.ev.push(e); return e; };
  const rand = (S) => { let s = S.seed >>> 0 || 1; s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; S.seed = s; return s / 4294967296; };
  const dirTo = (ax, ay, bx, by, cur) => {
    const dx = bx - ax, dy = by - ay;
    if (dx === 0 && dy === 0) return cur ?? 0;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 1 : 3;
    if (Math.abs(dy) > Math.abs(dx)) return dy > 0 ? 2 : 0;
    const a = dx > 0 ? 1 : 3, b = dy > 0 ? 2 : 0;
    return cur === a || cur === b ? cur : b;
  };

  /* ---------------- 建立戰場 ---------------- */
  function mkUnit(S, spec, extra) {
    let base, side, key;
    if (spec.id) { base = OFFICERS[spec.id]; side = 'P'; key = spec.id; }
    else { base = ENEMIES[spec.e]; side = 'E'; key = spec.e; }
    const diff = S.diff || 'normal';
    let hp = base.hp, atk = base.atk;
    if (side === 'E' && !base.obj) {
      if (diff === 'easy') { hp = Math.round(hp * 0.75); atk = Math.round(atk * 0.85); }
      if (diff === 'hard') { hp = Math.round(hp * 1.2); atk = Math.round(atk * 1.12); }
    }
    const u = {
      uid: S.uid++, key, side, name: base.name, title: base.title || '', glyph: base.glyph, banner: base.banner || '',

      hp, maxHp: hp, atk, def: base.def, mov: base.mov, rng: base.rng.slice(), dmg: base.dmg,
      guard: base.guard || 0, maxGuard: base.guard || 0, weak: (base.weak || []).slice(), hidden: !!base.hidden, known: [],
      traits: (base.traits || []).slice(), officer: side === 'P' || !!base.officer, boss: !!base.boss, obj: !!base.obj,
      ai: spec.ai || base.ai || 'aggro', tag: spec.tag || '', route: spec.route || null, skill: base.skill || null,
      st: { block: 0, broken: 0, skipped: 0, laststand: 0, vuln: 0, lure: 0, rearguard: 0, mountain: 0, confused: 0, batter: 0, burning: 0 },
      moveLeft: base.mov, moved: 0, alive: true, decoy: false, charge: null, phase2: false, alert: false, cd: 0,

    Object.assign(u, extra || {});

    return u;
  }

  function cardInst(S, id, up = false) { return { k: S ? S.cuid++ : Math.floor(Math.random() * 1e9), id, up }; }

  function newBattle(chIdx, save) {
    const ch = CHAPTERS[chIdx];
    const M = MAPS[ch.map];
    const S = {
      chIdx, chId: ch.id, mapId: ch.map, w: M.t[0].length, h: M.t.length, tiles: [], units: [], uid: 1, cuid: 1,
      side: 'P', round: 1, cmd: CFG.CMD, freeStrat: 0, deck: [], hand: [], disc: [], exh: [],
      mom: 0, chain: 0, wind: (M.wind && M.wind[0] ? M.wind[0].d : 0), windSched: (M.wind || []).slice(),
      stage: 0, obj: M.obj, flags: Object.assign({}, save.flags || {}), diff: save.diff || 'normal',

    for (let y = 0; y < S.h; y++) for (let x = 0; x < S.w; x++) {

  }
  function shuffle(S, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand(S) * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    if (ci.up && d.up) {

      if (u.name) o.name = u.name;

      if (u.text) o.text = u.text;
      if (u.p) Object.assign(o.p, u.p);
      if (u.exhaust !== undefined) o.exhaust = u.exhaust;
      if (u.r !== undefined) o.r = u.r;
      if (u.line !== undefined) o.line = u.line;
    }
    return o;
  }
  function cost(S, ci) { const c = cinfo(ci); if (c.type === '計' && S.freeStrat > 0) return 0; return c.cost; }
  function canUse(c, u) {
    if (!u || !u.alive || u.side !== 'P' || u.decoy) return false;
    for (const k of c.users) {

      if (k === 'melee' && u.rng[0] === 1 && u.cls !== 'bow') return true;
      if (k === 'wei' && u.key === 'wei') return true;

  function users(S, ci) { const c = cinfo(ci); return S.units.filter((u) => canUse(c, u)); }

  /* ---------------- 尋路 ---------------- */
  function stepCost(S, u, a, b) {
    if (!b.pass) return Infinity;

    return c;
  }
  function inZoc(S, u, x, y) {
    for (const d of DIRS) { const v = unitAt(S, x + d[0], y + d[1]); if (v && hostile(u, v) && !v.decoy && !v.obj) return true; }
    return false;
  }
  function reach(S, u, budget) {
    budget = budget ?? u.moveLeft;
    const res = new Map();
    const k0 = key(S, u.x, u.y);
    res.set(k0, { x: u.x, y: u.y, c: 0, prev: -1, stop: false });
    const open = [k0];
    const ghost = u.traits.includes('潛行');
    while (open.length) {
      let bi = 0; for (let i = 1; i < open.length; i++) if (res.get(open[i]).c < res.get(open[bi]).c) bi = i;
      const ck = open.splice(bi, 1)[0]; const cr = res.get(ck);
      if (cr.stop) continue;

        if (!inb(S, nx, ny)) continue;

        if (occ && occ !== u && (hostile(u, occ) || occ.obj || occ.decoy)) continue;
        const nt = tile(S, nx, ny);

    for (const [k, v] of res) { if (k === k0) continue; const o = unitAt(S, v.x, v.y); v.free = !o; }

  function pathFrom(S, R, x, y) {
    const out = []; let k = key(S, x, y);

    return out;
  }
  /* 純地形距離（忽略單位），給 AI 找方向 */
  function distField(S, u, sources) {
    const D = new Float32Array(S.w * S.h).fill(1e9);
    const open = [];
    for (const [x, y] of sources) { D[key(S, x, y)] = 0; open.push(key(S, x, y)); }
    while (open.length) {
      let bi = 0; for (let i = 1; i < open.length; i++) if (D[open[i]] < D[open[bi]]) bi = i;
      const ck = open.splice(bi, 1)[0]; const cx = ck % S.w, cy = (ck / S.w) | 0; const ct = S.tiles[ck];
      for (const d of DIRS) {

  /* ---------------- 射程與方位 ---------------- */
  function rangeOf(u, c) {
    let [mn, mx] = u.rng;

    return [mn, mx];
  }
  function canHitFrom(S, ax, ay, d, mn, mx) {
    const dd = dist(ax, ay, d.x, d.y);

    let max = mx; if (mx > 1 && ha > hd) max += 1;
    if (dd < mn || dd > max) return false;
    if (mx === 1 && Math.abs(ha - hd) > 2) return false;
    return true;
  }
  function relPos(d, ax, ay) {
    if (d.obj || d.decoy) return 'front';
    const dx = ax - d.x, dy = ay - d.y; const fv = DIRS[d.f];
    const dot = dx * fv[0] + dy * fv[1]; const perp = Math.abs(dx * fv[1] - dy * fv[0]);
    if (dot > perp) return 'front';
    if (-dot > perp) return 'back';
    return 'side';
  }
  const weakKnown = (S, d, type) => !d.hidden || d.known.includes(type) || S.revealAll;

  /* ---------------- 傷害計算 ---------------- */
  function calcHit(S, a, d, o = {}) {
    const ax = o.fx ?? (a ? a.x : d.x), ay = o.fy ?? (a ? a.y : d.y);
    const type = o.type || (a ? a.dmg : '擊');
    const lab = [];
    let mult = 1, base;
    let crit = !!o.crit, rel = 'front';
    if (o.fixed !== undefined) base = o.fixed;
    else {
      base = a.atk * (o.power ?? 1);
      if (o.power !== undefined && o.power !== 1) lab.push(`${Math.round(o.power * 100)}%`);
      rel = relPos(d, ax, ay);
      if (rel === 'back') { crit = true; lab.push('背刺'); }
      else if (rel === 'side') { mult *= CFG.SIDE; lab.push('側擊×1.2'); }
      const ha = tile(S, ax, ay).h, hd = tile(S, d.x, d.y).h;
      if (ha > hd) { mult *= CFG.HIGH; lab.push('居高+20%'); }
      else if (ha < hd) { mult *= CFG.LOW; lab.push('仰攻−10%'); }
      if (a.st.laststand) { mult *= 1.5; lab.push('背水×1.5'); }
      if (a.traits.includes('奔襲') && a.moved >= 3) { mult *= 1.3; lab.push('奔襲+30%'); }
      if (a.traits.includes('拒馬') && d.cls === 'horse') { mult *= 1.5; lab.push('拒馬×1.5'); }
    }
    if (a && a.side === 'P' && !o.isCounter) {
      const c = Math.min(S.chain, CFG.CHAIN_MAX);

    }
    const isWeak = d.weak.includes(type);
    const showWeak = isWeak && (!S.preview || weakKnown(S, d, type));
    if (isWeak && (!S.preview || showWeak)) { mult *= CFG.WEAK; lab.push(`弱點${type}×1.3`); }
    if (d.st.broken) { crit = true; if (!lab.includes('背刺')) lab.push('破陣'); }
    if (d.st.vuln) { mult *= 1.3; lab.push('背水+30%'); }
    const t = tile(S, d.x, d.y);
    if (t.cover && type !== '火' && !d.obj) { mult *= CFG.COVER; lab.push('林蔽−20%'); }
    if (d.side === 'P' && !d.decoy) {
      for (const dv of DIRS) { const v = unitAt(S, d.x + dv[0], d.y + dv[1]); if (v && v.side === 'P' && v.traits.includes('護衛')) { mult *= 0.75; lab.push('護衛−25%'); break; } }
    }
    if (d.obj && type === '火') { mult *= 2; lab.push('易燃×2'); }
    let cm = 1;
    if (crit) { cm = rel === 'back' && a && a.traits.includes('暗殺') ? CFG.ASSASSIN : CFG.CRIT; lab.push(cm === 2 ? '暗殺×2' : '暴擊×1.5'); }

    return { dmg, crit, rel, weak: isWeak, showWeak, gd, lab, type };
  }

  /* ---------------- 結算 ---------------- */
  function addMom(S, n) {
    if (n <= 0) return;

    if (S.mom !== before) emit(S, { t: 'mom', v: S.mom, d: S.mom - before });
  }
  function bark(S, u, k, chance = 1) {
    if (!u) return;
    const pool = u.side === 'P' ? (BARKS[u.key] || {})[k] : BARKS.enemy[k];
    if (!pool || !pool.length) return;
    if (chance < 1 && rand(S) > chance) return;
    emit(S, { t: 'bark', uid: u.uid, text: pool[Math.floor(rand(S) * pool.length)] });
  }
  function reveal(S, d, type) {
    if (d.hidden && !d.known.includes(type)) { d.known.push(type); emit(S, { t: 'revealWeak', uid: d.uid, type }); }
  }

  function hit(S, a, d, o = {}) {
    if (!d.alive) return null;

    if (d.side === 'E') d.alert = true;
    const absorbed = Math.min(d.st.block, dmg);
    d.st.block -= absorbed;
    const loss = dmg - absorbed;
    d.hp = Math.max(0, d.hp - loss);
    let broke = false;
    if (d.maxGuard > 0 && !d.st.broken && d.hp > 0 && r.gd > 0) {

    }

  function kill(S, d, a, o = {}) {

  function face(S, u, f) { if (u.f !== f) { u.f = f; emit(S, { t: 'face', uid: u.uid, f }); } }

  /* 一次完整的攻擊（含合擊、反擊） */

  function push(S, u, f, by) {
    if (!u.alive || u.obj) return;
    const nx = u.x + DIRS[f][0], ny = u.y + DIRS[f][1];
    const from = [u.x, u.y];
    const t0 = tile(S, u.x, u.y), t1 = tile(S, nx, ny);
    const occ = t1 ? unitAt(S, nx, ny) : null;

      else { u.x = from[0]; u.y = from[1]; emit(S, { t: 'push', uid: u.uid, from: [nx, ny], to: from, back: true }); hit(S, null, u, { fixed: 12, type: '擊', kind: 'push', brk: 1 }); }

  }

  function ignite(S, x, y, o = {}) {
    const t = tile(S, x, y);
    if (!t || t.water || t.burnt && !t.pass) return false;
    if (t.fire > 0) return false;

    const u = unitAt(S, x, y);

    return true;
  }

  function spreadFire(S) {
    const burning = S.tiles.filter((t) => t.fire > 0);
    const add = [];
    for (const t of burning) {
      const nt = tile(S, t.x + DIRS[S.wind][0], t.y + DIRS[S.wind][1]);
      if (nt && nt.flam && !nt.burnt && nt.fire === 0 && !add.includes(nt)) add.push(nt);
    }
    for (const nt of add) ignite(S, nt.x, nt.y, { src: 'spread', bark: false });
    return add.length;
  }

  function block(S, u, n) { if (n <= 0 || !u.alive) return; u.st.block += n; emit(S, { t: 'block', uid: u.uid, n, v: u.st.block }); }
  function heal(S, u, n) { const b = u.hp; u.hp = Math.min(u.maxHp, u.hp + n); emit(S, { t: 'heal', uid: u.uid, n: u.hp - b, hp: u.hp }); }

  function draw(S, n) {
    let got = 0;
    for (let i = 0; i < n; i++) {
      if (S.hand.length >= CFG.HAND_MAX) break;
      if (!S.deck.length) {
        if (!S.disc.length) break;
        S.deck = shuffle(S, S.disc); S.disc = [];
        emit(S, { t: 'shuffle' });
      }
      S.hand.push(S.deck.pop()); got++;
    }
    if (got) emit(S, { t: 'draw', n: got });
    return got;
  }

  function moveAlong(S, u, path, o = {}) {
    // path: [[x,y],...] 含起點；處理伏兵。回傳是否被打斷
    if (path.length < 2) return false;
    const walked = [path[0]];
    let interrupted = false;
    for (let i = 1; i < path.length; i++) {
      const [x, y] = path[i];
      const prev = tile(S, walked[walked.length - 1][0], walked[walked.length - 1][1]);
      const c = stepCost(S, u, prev, tile(S, x, y));
      walked.push([x, y]);
      if (!o.free) u.moveLeft = Math.max(0, u.moveLeft - c);
      u.moved += 1;
      u.x = x; u.y = y;
      if (u.side === 'E') {

        if (amb) { interrupted = amb; break; }
      }
    }

    u.f = dirTo(pl[0], pl[1], last[0], last[1], u.f);

  }
  function findAmbush(S, x, y) {
    for (const t of S.tiles) if (t.ambush && dist(t.x, t.y, x, y) <= 1) return t;
    return null;
  }
  function triggerAmbush(S, t, u) {
    const a = t.ambush; t.ambush = null;

    bark(S, u, 'ambush');
    const w = wei(S);

    u.moveLeft = 0;
  }

  /* ---------------- 目標判定 ---------------- */
  function tilesInR(S, cx, cy, r) { const o = []; for (const t of S.tiles) if (dist(t.x, t.y, cx, cy) <= r) o.push(t); return o; }
  function lineTiles(S, x, y, f, len, wide = 0) {
    const out = [];
    for (let i = 1; i <= len; i++) for (let w = -wide; w <= wide; w++) {
      const px = x + DIRS[f][0] * i + DIRS[(f + 1) % 4][0] * w, py = y + DIRS[f][1] * i + DIRS[(f + 1) % 4][1] * w;
      const t = tile(S, px, py); if (t) out.push(t);
    }
    return out;
  }
  function chargeLine(S, u, d, maxLen) {
    // 直線衝鋒：同一行／列，路徑淨空
    if (u.x !== d.x && u.y !== d.y) return null;
    const f = dirTo(u.x, u.y, d.x, d.y, u.f); const n = dist(u.x, u.y, d.x, d.y);
    if (n < 1 || n > maxLen) return null;
    const path = [[u.x, u.y]]; let prev = tile(S, u.x, u.y);
    for (let i = 1; i < n; i++) {
      const px = u.x + DIRS[f][0] * i, py = u.y + DIRS[f][1] * i; const t = tile(S, px, py);
      if (!t || !t.pass || unitAt(S, px, py) || !isFinite(stepCost(S, u, prev, t))) return null;
      path.push([px, py]); prev = t;

    return { path, n: n - 1, f };
  }

  /* 某張牌由某將出手，所有合法目標 */
  function targets(S, ci, u, isUlt) {
    const c = isUlt ? Object.assign({ id: 'ult:' + u.key, users: ['any'], rngPlus: 0, p: {} }, ULTS[u.key]) : cinfo(ci);
    const out = [];
    const w = wei(S);
    const origin = c.from === 'user' || isUlt ? u : w;
    switch (c.tgt) {
      case 'enemy': {
        const [mn, mx] = rangeOf(u, c);
        for (const d of S.units) {
          if (!d.alive || !hostile(u, d) || d.decoy) continue;
          if (c.id === 'charge') { if (chargeLine(S, u, d, c.line)) out.push({ kind: 'unit', uid: d.uid, x: d.x, y: d.y }); continue; }
          if (canHitFrom(S, u.x, u.y, d, mn, mx)) out.push({ kind: 'unit', uid: d.uid, x: d.x, y: d.y });
        }
        break;
      }
      case 'estrat': {
        if (!origin || !origin.alive) break;
        for (const d of S.units) {
          if (!d.alive || d.side !== 'E' || d.obj) continue;
          if (dist(origin.x, origin.y, d.x, d.y) > c.r) continue;
          if (c.id === 'surrender' && (!d.st.broken || (d.boss) || (d.officer && d.key !== 'xiaoyi'))) continue;
          if (c.id === 'discord' && (d.officer || d.boss)) continue;
          out.push({ kind: 'unit', uid: d.uid, x: d.x, y: d.y });
        }
        break;
      }
      case 'ally': {
        if (!w || !w.alive) break;
        for (const d of S.units) {
          if (!d.alive || d.side !== 'P' || d.decoy) continue;
          if (dist(w.x, w.y, d.x, d.y) > c.r) continue;
          if (c.id === 'swap' && d === w) continue;
          out.push({ kind: 'unit', uid: d.uid, x: d.x, y: d.y });
        }
        break;
      }
      case 'tile': {
        if (!origin || !origin.alive) break;
        for (const t of tilesInR(S, origin.x, origin.y, c.r)) {
          if (c.id === 'fire') { if (!t.water && t.fire === 0 && (t.pass || t.flam) && !(t.burnt && !t.pass)) out.push({ kind: 'tile', x: t.x, y: t.y }); continue; }
          if (c.id === 'flood') { if (t.water && !t.pass) out.push({ kind: 'tile', x: t.x, y: t.y }); continue; }
          if (c.id === 'rockfall') {
            if (!t.pass) continue;
            let ok = false; for (const dv of DIRS) { const n = tile(S, t.x + dv[0], t.y + dv[1]); if (n && n.h - t.h >= 2) ok = true; }
            if (ok) out.push({ kind: 'tile', x: t.x, y: t.y }); continue;
          }
          if (c.id === 'ult:yan') { if (dist(origin.x, origin.y, t.x, t.y) <= 6) out.push({ kind: 'tile', x: t.x, y: t.y }); continue; }
          if (!t.pass || unitAt(S, t.x, t.y)) continue;
          if (c.id === 'ambush') { if (t.ambush) continue; if (!c.p.any && !(t.k === 'forest' || t.k === 'grass')) continue; }
          if (c.id === 'blink') { if (!S.units.some((d) => d.alive && hostile(u, d) && !d.decoy && dist(d.x, d.y, t.x, t.y) === 1)) continue; }
          out.push({ kind: 'tile', x: t.x, y: t.y });
        }
        break;
      }
      case 'dir': {
        for (let f = 0; f < 4; f++) {
          const nx = u.x + DIRS[f][0], ny = u.y + DIRS[f][1];
          if (c.id === 'wind') { out.push({ kind: 'dir', f, x: nx, y: ny }); continue; }
          if (!tile(S, nx, ny)) continue;
          out.push({ kind: 'dir', f, x: nx, y: ny });
        }
        break;
      }
      case 'self': out.push({ kind: 'self', uid: u.uid, x: u.x, y: u.y }); break;
      case 'none': out.push({ kind: 'none', uid: u.uid, x: u.x, y: u.y }); break;
    }
    // 招式需要有目標才可出手
    if (c.id === 'sweep') { if (!S.units.some((d) => d.alive && hostile(u, d) && !d.decoy && dist(d.x, d.y, u.x, u.y) === 1)) return []; }
    return out;
  }

  /* 一個目標選定後會影響的格子（預覽用） */
  function areaOf(S, ci, u, tg, isUlt) {
    const id = isUlt ? 'ult:' + u.key : ci.id;
    const c = isUlt ? ULTS[u.key] : cinfo(ci);
    if (id === 'ult:wei') return lineTiles(S, u.x, u.y, tg.f, 6, 1).map((t) => [t.x, t.y]);
    if (id === 'ult:qin') return lineTiles(S, u.x, u.y, tg.f, 5, 0).map((t) => [t.x, t.y]);
    if (id === 'ult:huo') return lineTiles(S, u.x, u.y, tg.f, 6, 0).map((t) => [t.x, t.y]);
    if (id === 'ult:yan') { const o = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (tile(S, tg.x + dx, tg.y + dy)) o.push([tg.x + dx, tg.y + dy]); return o; }
    if (id === 'rockfall') { const o = [[tg.x, tg.y]]; for (const d of DIRS) if (tile(S, tg.x + d[0], tg.y + d[1])) o.push([tg.x + d[0], tg.y + d[1]]); return o; }
    if (id === 'flood') return tilesInR(S, tg.x, tg.y, 3).filter((t) => t.h === 0 && !(t.water && !t.pass)).map((t) => [t.x, t.y]);
    if (id === 'fire' && c.p.spread) { const o = [[tg.x, tg.y]]; for (const d of DIRS) { const t = tile(S, tg.x + d[0], tg.y + d[1]); if (t && t.flam && !t.burnt) o.push([t.x, t.y]); } return o; }
    if (id === 'thrust' && tg.uid) { const d = byId(S, tg.uid); const f = dirTo(u.x, u.y, d.x, d.y, u.f); return [[d.x, d.y], [d.x + DIRS[f][0], d.y + DIRS[f][1]]]; }
    if (id === 'sweep') return DIRS.map((d) => [u.x + d[0], u.y + d[1]]).filter(([x, y]) => tile(S, x, y));
    if (id === 'wind') { const o = []; for (const t of S.tiles) if (t.fire > 0) { const n = tile(S, t.x + DIRS[tg.f][0], t.y + DIRS[tg.f][1]); if (n && n.flam && !n.burnt && n.fire === 0) o.push([n.x, n.y]); } return o; }
    return [[tg.x, tg.y]];
  }

  /* ---------------- 出牌 ---------------- */
  function playCard(S, ci, u, tg) {
    const c = cinfo(ci);
    const k = cost(S, ci);
    if (k > S.cmd) return false;
    S.cmd -= k;
    if (c.type === '計' && S.freeStrat > 0 && c.cost > 0) S.freeStrat--;
    const hi = S.hand.findIndex((x) => x.k === ci.k);
    if (hi >= 0) S.hand.splice(hi, 1);
    S.undo = [];
    emit(S, { t: 'card', id: c.id, name: c.name, type: c.type, uid: u.uid, k: ci.k, up: ci.up });
    resolve(S, c, u, tg);
    if (c.exhaust) S.exh.push(ci); else S.disc.push(ci);
    S.stats.cards = (S.stats.cards || 0) + 1;
    if (c.type === '計' && u.key === 'wei') bark(S, u, 'strat', 0.25);
    check(S);
    return true;
  }

  function resolve(S, c, u, tg) {
    const p = c.p || {};
    const T = tg.uid ? byId(S, tg.uid) : null;
    const W = wei(S);
    const act = (kind, extra) => emit(S, Object.assign({ t: 'act', uid: u.uid, name: c.name, kind, tx: tg.x, ty: tg.y, tuid: tg.uid || 0, card: c.id }, extra || {}));
    switch (c.id) {
      case 'strike': case 'pierce': case 'execute': case 'shadow': case 'turnspear': {
        const ranged = dist(u.x, u.y, T.x, T.y) > 1;
        act(ranged ? 'ranged' : 'melee');
        const o = { power: p.power ?? 1 };
        if (c.id === 'pierce') { const t = tile(S, T.x, T.y); if (T.st.broken || t.fire > 0) o.crit = true; o.kind = 'ranged'; }
        if (c.id === 'execute') { if (T.st.broken || (!T.boss && T.hp <= T.maxHp * p.th)) o.exec = true; }
        if (c.id === 'shadow') { const rel = relPos(T, u.x, u.y); if (rel !== 'front') { o.brk = 1; o._draw = true; } }
        if (c.id === 'turnspear') { o.noCounter = true; o.type = '刺'; }
        const r = attack(S, u, T, o);
        if (o._draw) draw(S, 1);
        if (c.id === 'turnspear' && u.alive) {
          const f = dirTo(T.x, T.y, u.x, u.y, u.f); const nx = u.x + DIRS[f][0], ny = u.y + DIRS[f][1]; const t = tile(S, nx, ny);
          if (t && t.pass && !unitAt(S, nx, ny) && isFinite(stepCost(S, u, tile(S, u.x, u.y), t))) { const of = u.f; moveAlong(S, u, [[u.x, u.y], [nx, ny]], { free: true }); u.f = of; emit(S, { t: 'face', uid: u.uid, f: of }); }
        }
        return r;
      }
      case 'thrust': {
        act('melee');
        const f = dirTo(u.x, u.y, T.x, T.y, u.f);
        const bx = T.x + DIRS[f][0], by = T.y + DIRS[f][1];
        attack(S, u, T, { power: p.power, brk: p.brk, type: '刺' });
        const B = unitAt(S, bx, by);
        if (B && hostile(u, B) && u.alive) { emit(S, { t: 'pierce', a: u.uid, d: B.uid }); hit(S, u, B, { power: p.pierce, brk: p.brk, type: '刺', kind: 'pierce', fx: T.x - DIRS[f][0], fy: T.y - DIRS[f][1] }); }
        return;
      }
      case 'volley': act('ranged'); attack(S, u, T, { power: p.power, hits: p.hits, kind: 'ranged', ranged: true }); return;
      case 'firearrow': act('ranged', { fire: true }); { const tx = T.x, ty = T.y; attack(S, u, T, { power: p.power, type: '火', kind: 'ranged', ranged: true }); ignite(S, tx, ty, { src: 'arrow' }); } return;
      case 'bash': act('melee'); attack(S, u, T, { power: p.power, brk: p.brk, push: true }); return;
      case 'charge': {
        const L = chargeLine(S, u, T, c.line); if (!L) return;
        act('charge');
        if (L.path.length > 1) moveAlong(S, u, L.path, { free: true });
        u.moved = Math.max(u.moved, L.n);
        attack(S, u, T, { power: p.power + p.per * L.n, push: true, brk: p.brk, kind: 'charge' });
        return;
      }
      case 'sweep': {
        act('sweep');
        const tgs = DIRS.map((d) => unitAt(S, u.x + d[0], u.y + d[1])).filter((d) => d && hostile(u, d) && !d.decoy);
        for (const d of tgs) hit(S, u, d, { power: p.power, kind: 'sweep' });
        return;
      }
      case 'guard': act('buff'); block(S, u, p.block); if (p.adj) for (const d of DIRS) { const v = unitAt(S, u.x + d[0], u.y + d[1]); if (v && v.side === 'P' && !v.decoy) block(S, v, p.adj); } return;
      case 'shieldwall': act('buff'); block(S, u, p.block); for (const d of DIRS) { const v = unitAt(S, u.x + d[0], u.y + d[1]); if (v && v.side === 'P' && !v.decoy) block(S, v, p.block); } return;
      case 'march': act('buff'); u.moveLeft += p.mov; emit(S, { t: 'status', uid: u.uid, k: 'move', v: u.moveLeft }); if (p.draw) draw(S, p.draw); return;
      case 'ride': act('buff'); u.moveLeft = u.mov + (p.extra || 0); emit(S, { t: 'status', uid: u.uid, k: 'move', v: u.moveLeft }); return;
      case 'plan': act('none'); draw(S, p.draw); return;
      case 'scout': act('strat'); S.revealAll = true; for (const d of S.units) if (d.hidden) for (const w of d.weak) if (!d.known.includes(w)) d.known.push(w); emit(S, { t: 'reveal' }); draw(S, p.draw); return;
      case 'laststand': act('buff'); u.st.laststand = 1; u.st.vuln = 1; emit(S, { t: 'status', uid: u.uid, k: 'laststand' }); return;
      case 'bandage': act('buff'); heal(S, u, p.heal); return;
      case 'rearguard': act('buff'); block(S, u, p.block); u.st.rearguard = 1; emit(S, { t: 'status', uid: u.uid, k: 'rearguard' }); return;
      case 'fire': {
        act('strat', { fire: true });
        ignite(S, tg.x, tg.y, { src: 'card' });
        const v = unitAt(S, tg.x, tg.y);
        if (v && v.alive) hit(S, u, v, { fixed: p.dmg, type: '火', kind: 'fire', noChain: false });
        if (p.spread) for (const d of DIRS) { const t = tile(S, tg.x + d[0], tg.y + d[1]); if (t && t.flam && !t.burnt) ignite(S, t.x, t.y, { src: 'card' }); }
        return;
      }
      case 'ambush': act('strat'); tile(S, tg.x, tg.y).ambush = { dmg: p.dmg, brk: p.brk }; emit(S, { t: 'ambushSet', x: tg.x, y: tg.y }); return;
      case 'wind': { act('strat'); const prev = S.wind; S.wind = tg.f; emit(S, { t: 'wind', d: S.wind, prev, card: true }); spreadFire(S); return; }
      case 'decoy': {
        act('strat');
        const d = mkUnit(S, { e: 'blade', x: tg.x, y: tg.y, f: 2 });
        Object.assign(d, { side: 'P', key: 'decoy', name: '疑兵旗', glyph: '旗', banner: '魏', hp: 1, maxHp: 1, atk: 0, def: 0, guard: 0, maxGuard: 0, weak: [], decoy: true, officer: false, traits: [], mov: 0, moveLeft: 0 });
        emit(S, { t: 'spawn', uid: d.uid, decoy: true });
        return;
      }
      case 'lure': act('strat'); T.st.lure = 1; block(S, T, p.block); emit(S, { t: 'status', uid: T.uid, k: 'lure' }); return;
      case 'discord': {
        act('strat');
        let best = null, bd = -1;
        for (const d of DIRS) { const v = unitAt(S, T.x + d[0], T.y + d[1]); if (v && v.side === 'E' && v !== T && !v.obj) { const r = calcHit(S, T, v, {}); if (r.dmg > bd) { bd = r.dmg; best = v; } } }
        emit(S, { t: 'discord', uid: T.uid });
        if (best) { emit(S, { t: 'act', uid: T.uid, name: '倒戈', kind: 'melee', tx: best.x, ty: best.y, tuid: best.uid }); attack(S, T, best, { kind: 'melee', noCounter: false }); }
        else { T.st.confused = 1; emit(S, { t: 'status', uid: T.uid, k: 'confused' }); }
        return;
      }
      case 'rally': act('none'); for (const v of S.units) if (v.alive && v.side === 'P' && !v.decoy) v.moveLeft += 1; S.chain += 1; emit(S, { t: 'chain', v: S.chain }); addMom(S, p.mom); emit(S, { t: 'rally' }); return;
      case 'urgent': act('none'); S.cmd += p.cmd; emit(S, { t: 'cmd', v: S.cmd }); draw(S, 1); return;
      case 'chain': act('none'); S.freeStrat += 2; emit(S, { t: 'status', uid: u.uid, k: 'chainplan', v: S.freeStrat }); return;
      case 'swap': {
        act('strat');
        const a = [W.x, W.y], b = [T.x, T.y];
        W.x = b[0]; W.y = b[1]; T.x = a[0]; T.y = a[1];
        emit(S, { t: 'swap', a: W.uid, b: T.uid, pa: a, pb: b });
        return;
      }
      case 'surrender': {
        act('strat');
        T.alive = false; T.hp = 0;
        emit(S, { t: 'surrender', uid: T.uid });
        bark(S, T, 'surrender');
        if (T.key === 'xiaoyi') S.flags.xiaoyi = 'saved';
        S.stats.kills++;
        addMom(S, 20);
        return;
      }
      case 'blink': {
        act('strat');
        const from = [u.x, u.y]; u.x = tg.x; u.y = tg.y;
        let fd = null; for (const d of S.units) if (d.alive && hostile(u, d) && !d.decoy && dist(d.x, d.y, u.x, u.y) === 1) { if (!fd || relPos(d, u.x, u.y) === 'back') fd = d; }
        if (fd) u.f = dirTo(u.x, u.y, fd.x, fd.y, u.f);
        emit(S, { t: 'teleport', uid: u.uid, from, to: [u.x, u.y], f: u.f });
        return;
      }
      case 'rockfall': {
        act('strat', { rock: true });
        const area = areaOf(S, { id: 'rockfall' }, u, tg);
        emit(S, { t: 'rocks', tiles: area });
        for (const [x, y] of area) { const v = unitAt(S, x, y); if (v && v.alive && !v.decoy) hit(S, u, v, { fixed: p.dmg, type: '擊', brk: 1, kind: 'rock' }); }
        return;
      }
      case 'flood': {
        act('strat', { water: true });
        const area = areaOf(S, { id: 'flood' }, u, tg);
        emit(S, { t: 'flood', x: tg.x, y: tg.y, tiles: area });
        for (const [x, y] of area) { const t = tile(S, x, y); if (t.fire) { t.fire = 0; emit(S, { t: 'extinguish', x, y }); } const v = unitAt(S, x, y); if (v && v.alive && !v.decoy) hit(S, u, v, { fixed: p.dmg, type: '擊', brk: 2, kind: 'flood' }); }
        return;
      }
    }
  }

  /* ---------------- 絕技 ---------------- */
  function ultReady(S) { return S.mom >= CFG.MOM_MAX; }
  function useUlt(S, u, tg) {
    if (!ultReady(S) || !u.alive) return false;
    S.mom = 0; emit(S, { t: 'mom', v: 0, d: -CFG.MOM_MAX });
    S.undo = [];
    const U = ULTS[u.key];
    S.stats.ults++;
    emit(S, { t: 'ult', uid: u.uid, name: U.name, key: u.key, tx: tg.x, ty: tg.y, f: tg.f });
    bark(S, u, 'ult');
    switch (u.key) {
      case 'wei': {
        const area = lineTiles(S, u.x, u.y, tg.f, 6, 1);
        emit(S, { t: 'firewall', tiles: area.map((t) => [t.x, t.y]), f: tg.f });
        for (const t of area) { if (t.flam && !t.burnt) ignite(S, t.x, t.y, { src: 'ult', bark: false }); const v = unitAt(S, t.x, t.y); if (v && hostile(u, v)) hit(S, u, v, { fixed: 12, type: '火', brk: 2, kind: 'fire' }); }
        break;
      }
      case 'qin': {
        face(S, u, tg.f);
        const area = lineTiles(S, u.x, u.y, tg.f, 5, 0);
        emit(S, { t: 'beam', uid: u.uid, tiles: area.map((t) => [t.x, t.y]), f: tg.f });
        for (const t of area) { const v = unitAt(S, t.x, t.y); if (v && hostile(u, v) && !v.decoy) hit(S, u, v, { power: 1.8, type: '刺', brk: 2, kind: 'beam', fx: t.x - DIRS[tg.f][0], fy: t.y - DIRS[tg.f][1] }); }
        break;
      }
      case 'yan': {
        const area = areaOf(S, null, u, tg, true);
        emit(S, { t: 'rain', tiles: area, x: tg.x, y: tg.y });
        for (const [x, y] of area) { const v = unitAt(S, x, y); if (v && hostile(u, v) && !v.decoy) hit(S, u, v, { power: 1.4, type: '射', brk: 1, kind: 'ranged', fx: x, fy: y + 1 }); }
        break;
      }
      case 'lu': {
        for (const v of S.units) if (v.alive && v.side === 'P' && !v.decoy) block(S, v, 15);
        u.st.mountain = 1; emit(S, { t: 'status', uid: u.uid, k: 'mountain' });
        break;
      }
      case 'liu': {
        const T = byId(S, tg.uid);
        const bx = T.x - DIRS[T.f][0], by = T.y - DIRS[T.f][1];
        let dest = null;
        const bt = tile(S, bx, by);
        if (bt && bt.pass && !unitAt(S, bx, by)) dest = [bx, by];
        if (!dest) for (const d of DIRS) { const nx = T.x + d[0], ny = T.y + d[1]; const t = tile(S, nx, ny); if (t && t.pass && (!unitAt(S, nx, ny) || unitAt(S, nx, ny) === u)) { dest = [nx, ny]; break; } }
        if (dest) { const from = [u.x, u.y]; u.x = dest[0]; u.y = dest[1]; u.f = dirTo(u.x, u.y, T.x, T.y, u.f); emit(S, { t: 'teleport', uid: u.uid, from, to: dest, f: u.f }); }
        for (let i = 0; i < 3 && T.alive; i++) hit(S, u, T, { power: 0.8, type: '斬', kind: 'melee', idx: i, brk: i === 0 ? 1 : 0 });
        break;
      }
      case 'huo': {
        face(S, u, tg.f);
        const path = [[u.x, u.y]]; const victims = [];
        let cx = u.x, cy = u.y;
        for (let i = 1; i <= 6; i++) {
          const nx = cx + DIRS[tg.f][0], ny = cy + DIRS[tg.f][1]; const t = tile(S, nx, ny);
          if (!t || !t.pass || Math.abs(t.h - tile(S, cx, cy).h) > 2) break;
          const v = unitAt(S, nx, ny);
          if (v && (v.side === 'P' || v.obj)) break;
          if (v) victims.push(v);
          cx = nx; cy = ny; path.push([nx, ny]);
        }
        // 終點不能停在敵人身上：往回找空位
        while (path.length > 1 && unitAt(S, path[path.length - 1][0], path[path.length - 1][1])) path.pop();
        const endP = path[path.length - 1];
        emit(S, { t: 'trample', uid: u.uid, path: path.slice(), victims: victims.map((v) => v.uid) });
        u.x = endP[0]; u.y = endP[1]; u.moved = Math.max(u.moved, 6);
        emit(S, { t: 'move', uid: u.uid, path, f: tg.f, cav: true, fast: true });
        for (const v of victims) {
          if (!v.alive) continue;

/* ============================================================

      const area = R.tilesInR(S, u.x, u.y, 2).filter((t) => !(t.x === u.x && t.y === u.y));
      const n = ps.filter((p) => area.some((t) => t.x === p.x && t.y === p.y)).length;
      if (n >= 1) return { kind: 'quake', tiles: area.map((t) => [t.x, t.y]) };

        let hits = 0, blocked = false;

  }

  function execSkill(S, u) {
    const c = u.charge; u.charge = null; u.cd = 2;
    R.emit(S, { t: 'chargeGo', uid: u.uid, kind: c.kind });
    if (c.kind === 'quake') {
      R.emit(S, { t: 'act', uid: u.uid, name: '震地斬', kind: 'quake', tx: u.x, ty: u.y, tuid: 0 });
      R.emit(S, { t: 'quake', uid: u.uid, tiles: c.tiles });
      for (const [x, y] of c.tiles) {
        const v = R.unitAt(S, x, y);
        if (v && v.alive && v.side === 'P') {
          if (v.decoy) { R.kill(S, v, u); continue; }
          R.hit(S, u, v, { power: 1.5, kind: 'quake', fx: x, fy: y });

        }
      }
    } else if (c.kind === 'trample') {
      R.emit(S, { t: 'act', uid: u.uid, name: '踏陣', kind: 'charge', tx: u.x, ty: u.y, tuid: 0 });

        if (v.decoy) { R.kill(S, v, u); continue; }

  /* ---------- 地形網格 ---------- */
  const topY = (t) => {

  function addPiece(u) {

      x: wx(u.x), y: tileTop(u.x, u.y), z: wz(u.y), yaw: yawOf(u.f), hop: 0, tiltX: 0, tiltZ: 0, scale: u.boss ? 1.18 : u.officer ? 1.06 : 1, bscale: u.boss ? 1.5 : 1.35, alpha: 1,

  const center = (uid, yo = 0.35) => { const p = P(uid); if (!p) return [0, 0, 0]; return [p.x + p.ox, p.y + p.hop + yo * p.scale, p.z + p.oz]; };
  const scr = (uid, yo = 0.6) => { const c = center(uid, yo); return World.project(c[0], c[1], c[2]); };
  const tileC = (x, y, yo = 0) => { const w = World.tileWorld(x, y); return [w[0], w[1] + yo, w[2]]; };
  const tween = (ms, fn, e) => Clock.tween(ms, fn, e);
  const wait = (ms) => Clock.wait(ms);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const dirVec = (a, b) => { const d = V3.sub(b, a); d[1] = 0; return V3.norm(d); };

  function shake(a, decay) { if (Settings.shake) World.shake(a, decay); }

  /* ---------- 粒子預設 ---------- */
  const FX = {
    sparks(pos, dir, n = 12, col = [1, 0.85, 0.5], speed = 4) {
      for (let i = 0; i < n; i++) {
        const v = V3.norm([dir[0] + rnd(-0.9, 0.9), rnd(0.1, 1.1), dir[2] + rnd(-0.9, 0.9)]);
        const s = speed * rnd(0.5, 1.3);
        World.emit({ x: pos[0], y: pos[1], z: pos[2], vx: v[0] * s, vy: v[1] * s, vz: v[2] * s, max: rnd(0.18, 0.42), s0: rnd(0.12, 0.22), s1: 0.02, col, a0: 1, a1: 0, reg: 'spark', mode: 2, asp: 0.16, add: true, grav: 6, drag: 2.5 });
      }
    },
    blood(pos, dir, n = 14, floor) {
      for (let i = 0; i < n; i++) {
        const s = rnd(1.5, 4.2);
        World.emit({ x: pos[0], y: pos[1], z: pos[2], vx: (dir[0] + rnd(-0.6, 0.6)) * s, vy: rnd(0.6, 2.4), vz: (dir[2] + rnd(-0.6, 0.6)) * s, max: rnd(0.5, 0.9), s0: rnd(0.05, 0.1), s1: 0.03, col: [0.38, 0.02, 0.02], a0: 0.95, a1: 0.6, reg: 'drop', grav: 11, floor: floor ?? 0, drag: 0.6 });
      }
    },
    ink(x, y, z, s = 0.5, col = [0.22, 0.02, 0.02], a = 0.55) { World.decal({ x, y, z, s, col, a, reg: 'ink', fade: 40 }); },
    dust(pos, n = 8, col = [0.92, 0.95, 1], sp = 1.2) {
      for (let i = 0; i < n; i++) { const a = Math.random() * 6.28; World.emit({ x: pos[0], y: pos[1] + 0.04, z: pos[2], vx: Math.cos(a) * sp * rnd(0.4, 1), vy: rnd(0.2, 0.7), vz: Math.sin(a) * sp * rnd(0.4, 1), max: rnd(0.5, 0.9), s0: 0.12, s1: rnd(0.35, 0.6), col, a0: 0.6, a1: 0, reg: 'smoke', drag: 3, vr: rnd(-1, 1) }); }
    },
    shock(pos, r = 1, col = [1, 0.9, 0.7], add = true, dur = 0.35) { World.emit({ x: pos[0], y: pos[1] + 0.03, z: pos[2], max: dur, s0: 0.15, s1: r, col, a0: 0.9, a1: 0, reg: 'shock', mode: 1, add }); },
    slash(pos, angle, col = [1, 0.95, 0.8], size = 0.85) {
      World.emit({ x: pos[0], y: pos[1], z: pos[2], max: 0.2, s0: size * 0.8, s1: size * 1.15, rot: angle, col, a0: 1, a1: 0, reg: 'slash', add: true });
      World.emit({ x: pos[0], y: pos[1], z: pos[2], max: 0.26, s0: size * 0.9, s1: size * 1.3, rot: angle + 0.15, col: [col[0], col[1] * 0.6, col[2] * 0.4], a0: 0.6, a1: 0, reg: 'slash', add: true });
    },
    streak(from, to, col = [1, 0.95, 0.8], w = 0.2) {
      const d = V3.sub(to, from), m = V3.lerp(from, to, 0.55);
      World.emit({ x: m[0], y: m[1], z: m[2], vx: d[0] * 0.001, vy: d[1] * 0.001, vz: d[2] * 0.001, max: 0.16, s0: V3.len(d) * 0.75, s1: V3.len(d) * 0.9, col, a0: 1, a1: 0, reg: 'thrust', mode: 2, asp: w, add: true });
    },
    glow(pos, s = 1.2, col = [1, 0.7, 0.3], dur = 0.3) { World.emit({ x: pos[0], y: pos[1], z: pos[2], max: dur, s0: s, s1: s * 1.4, col, a0: 0.9, a1: 0, reg: 'glow', add: true }); },
    star(pos, s = 0.8, col = [1, 0.95, 0.8]) { World.emit({ x: pos[0], y: pos[1], z: pos[2], max: 0.22, s0: s, s1: s * 0.2, rot: Math.random(), vr: 3, col, a0: 1, a1: 0, reg: 'star', add: true }); },
    fireBurst(pos, n = 18, big = 1) {
      for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = rnd(0.5, 2.2) * big; World.emit({ x: pos[0], y: pos[1], z: pos[2], vx: Math.cos(a) * s, vy: rnd(0.8, 2.6) * big, vz: Math.sin(a) * s, max: rnd(0.35, 0.7), s0: rnd(0.3, 0.55) * big, s1: 0.05, col: [1, rnd(0.35, 0.65), 0.1], a0: 0.95, a1: 0, reg: 'flame', drag: 2.5, asp: 1.3 }); }
      for (let i = 0; i < n / 2; i++) { const a = Math.random() * 6.28, s = rnd(1, 3) * big; World.emit({ x: pos[0], y: pos[1], z: pos[2], vx: Math.cos(a) * s, vy: rnd(1, 3), vz: Math.sin(a) * s, max: rnd(0.6, 1.2), s0: 0.05, s1: 0.01, col: [1, 0.7, 0.25], a0: 1, a1: 0, reg: 'dot', add: true, grav: 2, drag: 1.5 }); }
      FX.glow(pos, 1.6 * big, [1, 0.5, 0.15], 0.4);
      for (let i = 0; i < 5; i++) World.emit({ x: pos[0] + rnd(-0.3, 0.3), y: pos[1] + 0.3, z: pos[2] + rnd(-0.3, 0.3), vy: rnd(0.4, 0.9), max: 1.6, s0: 0.3, s1: 1.1, col: [0.08, 0.07, 0.07], a0: 0.55, a1: 0, reg: 'smoke', vr: 0.5 });
    },
    shards(pos, col, n = 16, sp = 3, add = false, floor = 0) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * 6.28, s = rnd(0.4, 1) * sp;
        World.emit({ x: pos[0], y: pos[1], z: pos[2], vx: Math.cos(a) * s, vy: rnd(1.2, 3.6), vz: Math.sin(a) * s, max: rnd(0.6, 1.1), s0: rnd(0.07, 0.16), s1: rnd(0.04, 0.1), rot: Math.random() * 6, vr: rnd(-12, 12), col, a0: 1, a1: add ? 0 : 0.85, reg: 'shard', grav: 9, floor, bounce: 0.35, add });
      }
    },
    water(pos, n = 20) {
      for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = rnd(0.5, 2); World.emit({ x: pos[0], y: pos[1], z: pos[2], vx: Math.cos(a) * s, vy: rnd(1.5, 3.5), vz: Math.sin(a) * s, max: rnd(0.5, 0.9), s0: rnd(0.06, 0.12), s1: 0.03, col: [0.75, 0.88, 0.95], a0: 0.9, a1: 0, reg: 'drop', grav: 9 }); }
      FX.shock(pos, 0.9, [0.8, 0.9, 1], false, 0.5);
    },
  };

  /* ---------- 棋子動作 ---------- */
  async function faceTo(uid, f, ms = 110) {
    const p = P(uid); if (!p) return;
    const to = World.yawOf(f); let from = p.yaw;
    let d = to - from; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    if (Math.abs(d) < 0.01) return;
    await tween(ms, (k) => { p.yaw = from + d * k; });
  }
  async function movePath(uid, path, o = {}) {
    const p = P(uid); if (!p || path.length < 2) return;
    const cav = o.cav, fast = o.fast;
    const per = fast ? 70 : cav ? 105 : 150;
    for (let i = 1; i < path.length; i++) {
      const [ax, ay] = path[i - 1], [bx, by] = path[i];
      const A = [World.wx(ax), World.tileTop(ax, ay), World.wz(ay)], B = [World.wx(bx), World.tileTop(bx, by), World.wz(by)];
      const f = Rules.dirTo(ax, ay, bx, by, 0);
      faceTo(uid, f, 70);
      const lift = 0.18 + Math.max(0, B[1] - A[1]) * 0.8;
      await tween(per, (k) => {
        p.x = lerp(A[0], B[0], k); p.z = lerp(A[2], B[2], k); p.y = lerp(A[1], B[1], k);
        p.hop = Math.sin(k * Math.PI) * lift; p.tiltX = Math.sin(k * Math.PI) * 0.12 * (f === 0 ? -1 : f === 2 ? 1 : 0); p.tiltZ = Math.sin(k * Math.PI) * 0.12 * (f === 1 ? -1 : f === 3 ? 1 : 0);
      }, EASE.inOutSine);
      p.hop = 0; p.tiltX = 0; p.tiltZ = 0; p.tx = bx; p.ty = by;
      const t = Rules.tile(S, bx, by);
      if (t && (t.water)) FX.water([B[0], B[1] + 0.05, B[2]], 5);
      else FX.dust([B[0], B[1], B[2]], cav ? 4 : 2, [0.92, 0.95, 1], 0.6);
      if (cav) Sound.hoof(0.5); else if (i % 2 === 1) Sound.step(0.8);
    }
    if (o.f !== undefined) await faceTo(uid, o.f, 80);
  }
  async function lunge(uid, tx, ty, o = {}) {
    const p = P(uid); if (!p) return;
    const T = [World.wx(tx), World.tileTop(tx, ty), World.wz(ty)];
    const d = dirVec([p.x, 0, p.z], T);
    const back = o.back ?? 0.1, fwd = o.fwd ?? 0.4;
    await tween(o.wind ?? 70, (k) => { p.ox = -d[0] * back * k; p.oz = -d[2] * back * k; p.hop = k * 0.06; });
    Sound.whoosh(0.5, 0.12);
    await tween(o.strike ?? 75, (k) => { p.ox = lerp(-d[0] * back, d[0] * fwd, k); p.oz = lerp(-d[2] * back, d[2] * fwd, k); p.hop = 0.06 + k * 0.1; p.tiltX = d[2] * 0.25 * k; p.tiltZ = -d[0] * 0.25 * k; }, EASE.inQuad);
    lunged.add(uid);
  }
  async function returnLunges() {
    const list = [...lunged]; lunged.clear();
    await Promise.all(list.map((uid) => {
      const p = P(uid); if (!p) return null;
      const ox = p.ox, oz = p.oz, h = p.hop, tx = p.tiltX, tz = p.tiltZ;
      return tween(200, (k) => { p.ox = ox * (1 - k); p.oz = oz * (1 - k); p.hop = h * (1 - k); p.tiltX = tx * (1 - k); p.tiltZ = tz * (1 - k); }, EASE.outCubic);
    }));
  }
  function recoil(uid, fromPos, power) {
    const p = P(uid); if (!p) return;
    const d = dirVec(fromPos, [p.x, 0, p.z]);
    const a = clamp(0.22 + power * 0.25, 0.2, 0.6), push = clamp(0.06 + power * 0.08, 0.05, 0.22);
    const bx = p.ox, bz = p.oz;
    tween(380, (k) => {
      const s = Math.sin(k * Math.PI) * Math.exp(-k * 2.2);
      const e = Math.sin(k * Math.PI * 2.6) * Math.exp(-k * 4);
      p.tiltX = d[2] * a * (s + e * 0.4); p.tiltZ = -d[0] * a * (s + e * 0.4);
      p.ox = bx + d[0] * push * Math.sin(k * Math.PI) ; p.oz = bz + d[2] * push * Math.sin(k * Math.PI);
    }, EASE.lin).then(() => { if (!lunged.has(uid)) { p.ox = 0; p.oz = 0; } p.tiltX = 0; p.tiltZ = 0; });
  }

  /* 投射物：拋物線箭矢 */
  async function projectile(from, to, o = {}) {
    const dist = Math.hypot(to[0] - from[0], to[2] - from[2]);
    const T = (o.T ?? (0.18 + dist * 0.055)) * (o.slow || 1);
    const g = o.grav ?? 9;
    const vx = (to[0] - from[0]) / T, vz = (to[2] - from[2]) / T, vy = (to[1] - from[1] + 0.5 * g * T * T) / T;
    World.emit({ x: from[0], y: from[1], z: from[2], vx, vy, vz, max: T, s0: 0.42, s1: 0.42, col: o.fire ? [1, 0.6, 0.2] : [0.25, 0.18, 0.12], a0: 1, a1: 1, reg: 'feather', mode: 2, asp: 0.12, grav: g, add: !!o.fire });
    World.emit({ x: from[0], y: from[1], z: from[2], vx, vy, vz, max: T, s0: 0.9, s1: 0.9, col: o.fire ? [1, 0.45, 0.1] : [1, 1, 1], a0: o.fire ? 0.9 : 0.3, a1: o.fire ? 0.9 : 0.3, reg: 'spark', mode: 2, asp: 0.08, grav: g, add: true });
    if (o.fire) World.emit({ x: from[0], y: from[1], z: from[2], vx, vy, vz, max: T, s0: 0.35, s1: 0.35, col: [1, 0.55, 0.15], a0: 1, a1: 1, reg: 'flame', grav: g, add: true });
    Sound.arrow(0.8);
    await wait(T * 1000);
  }

  /* ---------- 命中：打擊感核心 ---------- */
  async function onHit(e) {
    const D = U(e.d), A = e.a ? U(e.a) : null;
    const pd = P(e.d); if (!pd || !D) return;
    const d = disp.get(e.d); if (d) { d.hp = e.hp; d.guard = e.guard; d.block = e.block; }
    const weight = clamp(e.dmg / 18, 0.25, 1.6) * (e.crit ? 1.5 : 1);
    const pos = center(e.d, 0.32);
    const apos = A && P(A.uid) ? center(A.uid, 0.32) : [pos[0], pos[1] + 1, pos[2] + 0.5];
    const dir = dirVec(apos, pos);
    const playerHit = D.side === 'P';
    const small = e.kind === 'burn' || e.kind === 'push' || e.idx > 0;
    // 1 頓幀
    const hs = e.kind === 'burn' ? 0 : e.crit ? 120 : e.exec ? 160 : small ? 35 : 50 + weight * 30;
    if (hs) Clock.hitstop(hs);
    // 2 震屏
    shake(e.kind === 'burn' ? 0.04 : 0.05 + weight * 0.1 + (e.crit ? 0.14 : 0), e.crit ? 5 : 7);
    if (!small) World.kick(e.crit ? 0.8 : 0.3 + weight * 0.15);
    // 3 目標閃白、後仰
    pd.flash = 1; pd.flashCol = playerHit ? [1, 0.55, 0.45] : e.crit ? [1, 0.92, 0.7] : [1, 1, 1];
    if (e.kind !== 'burn') recoil(e.d, apos, weight);
    // 4 粒子
    const floor = World.tileTop(D.x, D.y);
    const type = e.type;
    const slashCol = playerHit ? [0.75, 0.85, 1] : [1, 0.92, 0.75];
    const ang = Math.atan2(-(dir[2]), dir[0]) + rnd(-0.5, 0.5);
    if (e.kind === 'burn') { FX.fireBurst(pos, 6, 0.6); }
    else if (type === '斬') { FX.slash(pos, ang + Math.PI / 2, slashCol, 0.8 + weight * 0.3); FX.sparks(pos, dir, 8 + weight * 6, [1, 0.88, 0.55]); }
    else if (type === '刺') { FX.streak(V3.lerp(apos, pos, 0.2), V3.add(pos, V3.scale(dir, 0.5)), slashCol, 0.18); FX.sparks(pos, dir, 6 + weight * 5, [1, 0.9, 0.6], 5); }
    else if (type === '擊') { FX.shock([pos[0], floor, pos[2]], 0.7 + weight * 0.5, [1, 0.95, 0.85]); FX.dust([pos[0], floor, pos[2]], 6 + weight * 4, [0.9, 0.93, 1], 1.6); FX.sparks(pos, dir, 4, [1, 0.8, 0.5], 3); }
    else if (type === '射') { FX.sparks(pos, dir, 5, [1, 0.85, 0.55], 3); FX.star(pos, 0.5); }
    else if (type === '火') { FX.fireBurst(pos, 12 + weight * 6, 0.9); }
    if (!D.obj && e.loss > 0 && type !== '火' && e.kind !== 'burn') {
      FX.blood(pos, dir, 6 + Math.round(weight * 10), floor);
      if (e.loss >= 8 || e.crit) FX.ink(pd.x + dir[0] * 0.4 + rnd(-0.1, 0.1), floor, pd.z + dir[2] * 0.4 + rnd(-0.1, 0.1), 0.2 + weight * 0.12, [0.34, 0.03, 0.03], 0.45);
    }
    if (D.obj && e.loss > 0) FX.shards(pos, [0.45, 0.32, 0.2], 6, 2, false, floor);
    if (e.crit) { FX.star(pos, 1.3, [1, 0.95, 0.75]); FX.glow(pos, 1.3, [1, 0.6, 0.3], 0.25); }
    if (e.absorbed > 0) { FX.shock(pos, 0.9, [0.55, 0.8, 1], true, 0.3); }
    // 5 數字
    const pt = scr(e.d, 0.95);
    const tags = [];
    if (e.rel === 'back') tags.push('背刺');
    else if (e.rel === 'side' && !e.lab.includes('破陣')) tags.push('側擊');
    if (e.weak) tags.push('弱點');
    if (e.exec) tags.push('斬殺');
    if (e.kind === 'counter') tags.push('反擊');
    if (e.kind === 'joint') tags.push('合擊');
    if (e.kind === 'ambush') tags.push('伏兵');
    const cls = 'dn' + (e.crit ? ' crit' : '') + (small && !e.crit ? ' small' : '') + (playerHit ? ' player' : '');
    if (e.loss > 0 || !e.absorbed) UI.floatAt(pt, `<span class="v">${e.exec ? '斬' : e.loss}</span>${tags.length ? `<span class="t">${tags.join('・')}</span>` : ''}`, cls, { crit: e.crit });
    if (e.absorbed > 0) UI.floatAt(scr(e.d, 1.2), `<span class="v">護 −${e.absorbed}</span>`, 'dn blk', { dx: 26, up: 40 });
    if (e.rel === 'back' && !small) UI.stamp(scr(e.d, 1.3), '背刺', 'sm', { dx: -40 });
    // 6 聲音
    if (e.kind === 'burn') Sound.crackle(0.5);
    else {
      if (e.crit) Sound.crit(0.9);
      if (type === '斬') { Sound.slash(0.9); Sound.clash(0.45, 0.2); }
      else if (type === '刺') { Sound.thrust(0.9); Sound.thud(0.7); }
      else if (type === '擊') { Sound.thud(1.1); Sound.drum(0.35); }
      else if (type === '射') Sound.arrowHit(0.9);
      else if (type === '火') Sound.fire(0.8);
      if (!D.obj && e.loss > 0 && type !== '火') Sound.blood(0.7);
      if (e.absorbed > 0 && !e.loss) Sound.block(0.8);
      if (e.weak) Sound.smallDrum(0.6);
    }
    // 7 連擊顯示
    if (A && A.side === 'P' && e.kind !== 'counter') {
      UI.chain(e.chain, true); if (e.chain >= 3) Sound.smallDrum(0.4 + Math.min(0.6, e.chain * 0.08)); Sound.setIntensity(clamp(0.35 + e.chain * 0.07, 0, 1));
      const MS = { 5: '勢如破竹', 8: '所向披靡', 12: '萬夫莫敵' };
      if (MS[e.chain]) { UI.stamp({ x: World.size[0] * 0.5, y: World.size[1] * 0.3 }, MS[e.chain], 'mid gold', { dur: 1400, rot: -4 }); Sound.drum(1.1); Sound.gong(0.35, 147); }
    }
    // 8 暴擊慢動作
    if (e.crit) { Clock.slow(0.35, 230); UI.flash('rgba(255,235,200,1)', 0.16, 220); }
    if (playerHit && e.loss >= 10) UI.flash('rgba(160,20,10,1)', 0.18, 300);
    await wait(small ? 120 : e.crit ? 260 : 200);
  }

  async function onBreak(e) {
    const u = U(e.uid); const p = P(e.uid); if (!p) return;
    const d = disp.get(e.uid); if (d) { d.broken = true; d.guard = 0; d.charge = false; }
    World.setTelegraph(e.uid, null);

    FX.shock([pos[0], World.tileTop(u.x, u.y), pos[2]], 1.8, [1, 0.8, 0.4], true, 0.5);
    FX.glow(pos, 2.2, [1, 0.75, 0.35], 0.45);

  async function onDeath(e) {
    const u = U(e.uid); const p = P(e.uid); if (!p || p.dead) return;
    const d = disp.get(e.uid);
    const pos = center(e.uid, 0.25);
    const floor = World.tileTop(p.tx, p.ty);
    p.dead = true;
    if (e.exec || (e.boss)) await execution(e, u, p, pos);
    if (e.drown) {
      FX.water(pos, 26); Sound.splash(1);
      await tween(500, (k) => { p.drop = -k * 0.6; p.tiltX = k * 0.8; p.alpha = 1 - k; });
    } else {
      const col = u.side === 'P' ? [0.65, 0.16, 0.12] : u.officer ? [0.22, 0.17, 0.17] : [0.16, 0.17, 0.2];
      const spinDir = Math.random() < 0.5 ? -1 : 1;
      FX.shards(pos, col, u.officer ? 24 : 14, 2.6, false, floor);
      FX.shards(pos, [0.85, 0.65, 0.3], 6, 2, false, floor);
      FX.dust([pos[0], floor, pos[2]], 8, [0.75, 0.75, 0.78], 1.2);

        for (let i = 0; i < 4; i++) World.emit({ x: c[0] + rnd(-0.3, 0.3), y: c[1] + 4 + rnd(0, 1), z: c[2] + rnd(-0.3, 0.3), vy: -9, max: 0.48, s0: rnd(0.2, 0.32), s1: 0.25, rot: Math.random() * 6, vr: rnd(-6, 6), col: [0.45, 0.42, 0.38], a0: 1, a1: 1, reg: 'shard', floor: c[1] - 0.15 });
      }
      await wait(430);
      shake(0.55, 4); Clock.hitstop(100);
      for (const [x, y] of e.tiles) { FX.dust(tileC(x, y), 10, [0.75, 0.72, 0.68], 2); FX.shards(tileC(x, y, 0.2), [0.45, 0.42, 0.38], 6, 2.5, false, World.tileTop(x, y)); }
      Sound.drum(1.3);
    },
    async flood(e) {
      Sound.splash(1.5); Sound.rumble(0.8, 1.5); shake(0.4, 3);
      for (const [x, y] of e.tiles) setTimeout(() => FX.water(tileC(x, y, 0.1), 10), Math.random() * 300);
      await wait(500);
    },
    async draw() { },
    async shuffle() { UI.toast('棄牌重洗入牌庫', '', 1400); },
    async cmd() { },
    async end() { },
    async phase() { },
    async log() { },
    async pierce2() { },
  };

  function setMom(v, d) {
    const prev = momShown; momShown = v;
    const m = UI.$('#mom');
    m.querySelector('.fill').style.width = (v / CFG.MOM_MAX * 100) + '%';
    m.querySelector('.num').textContent = `${v}/${CFG.MOM_MAX}`;
    m.classList.toggle('full', v >= CFG.MOM_MAX);
    if (v >= CFG.MOM_MAX && prev < CFG.MOM_MAX) { Sound.mom(1); UI.toast('<b>勢已滿</b>：可以發動一名將領的絕技！', 'tip', 3000); }
    void d;
  }

  /* 播放一串事件 */
  async function play(evs, opts = {}) {
    for (let i = 0; i < evs.length; i++) {
      const e = evs[i];
      const h = H[e.t];
      if (h) { try { await h(e, evs, i); } catch (err) { console.error('anim', e.t, err); } }
      const nx = evs[i + 1];
      if (lunged.size && (!nx || BREAKS.has(nx.t))) await returnLunges();
      if (e.t === 'ult' && false) break;
    }
    if (lunged.size) await returnLunges();
    if (ultEnd) await finishUlt();
    if (!opts.noSync) syncDisp();
  }
  /* 平行移動（敵軍只移動時一起演） */
  async function playParallel(list) {
    await Promise.all(list.map((evs) => (async () => { for (const e of evs) { const h = H[e.t]; if (h) { try { await h(Object.assign({}, e, { par: true })); } catch (err) { console.error(err); } } } })()));
  }

  return { attach, syncDisp, disp: dispMap, play, playParallel, FX, setMom, center, scr, movePath, faceTo };
})();

/* ============================================================
   連營 · 遊戲主控：輸入、回合、出牌、敵軍演出、劇情、軍帳、存檔
   ============================================================ */
const Settings = { shake: true, speed: 1.6, sfx: true, music: true, diff: 'normal' };
(() => { try { const s = JSON.parse(localStorage.getItem('lianying.settings') || 'null'); if (s) Object.assign(Settings, s); } catch (e) {} })();
const saveSettings = () => { try { localStorage.setItem('lianying.settings', JSON.stringify(Settings)); } catch (e) {} };

/* ---------- 存檔：本機＋雲端（Claude 畫面內，若可用） ---------- */
const Store = (() => {
  const KEY = 'lianying.save.v1';
  let ref = null, cloudTried = false;
  const local = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
    del() { try { localStorage.removeItem(KEY); } catch (e) {} },
  };
  async function cloud() {
    if (cloudTried) return ref; cloudTried = true;
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return null;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return null;
      const id = await user.id();
      if (!id) return null;
      ref = db.doc('data/users/' + id + '/lianying');
    } catch (e) { ref = null; }
    return ref;
  }
  async function load() {
    let best = local.get();
    try {
      const r = await Promise.race([cloud(), new Promise((res) => setTimeout(() => res(null), 4000))]);
      if (r) { const snap = await r.get(); const d = snap && snap.exists ? snap.data() : null; if (d && d.save) { const c = JSON.parse(d.save); if (!best || (c.t || 0) > (best.t || 0)) best = c; } }
    } catch (e) {}
    return best;
  }
  function save(v) {
    v.t = Date.now();
    local.set(v);
    if (ref) ref.set({ save: JSON.stringify(v), t: v.t }).catch(() => { ref = null; });
    else cloud().then((r) => { if (r) r.set({ save: JSON.stringify(v), t: v.t }).catch(() => {}); });
  }
  function clear() { local.del(); if (ref) ref.delete().catch(() => {}); }
  return { load, save, clear };
})();

const Game = (() => {
  let S = null, save = null, chapterSave = null;

    const gdt = Clock.tick(rdt);
    if (mode === 'title' && titleSpin) { World.cam.d.yaw += rdt * 0.00006; }
    World.update(rdt, gdt);

  /* ---------- 開機 ---------- */

    try { await Promise.race([document.fonts.load('900 40px "Noto Serif TC"', '連營魏秦燕陸柳霍刀槍弓騎盾火將謀'), new Promise((r) => setTimeout(r, 2500))]); } catch (e) {}

        <button class="btn ${has && !done ? 'ghost' : 'primary'}" id="t-new" type="button">${has ? '重開征途' : '開始征途'}</button>
