    T.querySelector('#t-shk').addEventListener('click', (e) => { gesture(); Settings.shake = !Settings.shake; e.target.textContent = '震屏：' + (Settings.shake ? '開' : '關'); saveSettings(); Sound.click(); });
    Sound.music('calm');
  }
  function confirmBox(text, okLabel, onOk) {
    const m = UI.modal(`<p style="font-size:15px">${text}</p><div class="row" style="margin-top:14px"><button class="btn ghost" data-close type="button">取消</button><button class="btn primary" id="cf-ok" type="button">${okLabel}</button></div>`);
    m.root.querySelector('#cf-ok').addEventListener('click', () => { m.close(); onOk(); });
  }
  function chapterSelect() {
    const list = CHAPTERS.map((c, i) => i <= (save.best || 0) ? `<button class="btn ghost" data-ch="${i}" type="button" style="text-align:left">${c.no}・${c.title}</button>` : '').join('');
    const m = UI.modal(`<h3>重溫戰役</h3><p style="color:var(--paper-dim);font-size:13px">以目前牌組重打已解鎖的戰役，不影響主線進度。</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${list}</div><div class="row" style="margin-top:12px"><button class="btn ghost" data-close type="button">返回</button></div>`);
    m.root.querySelectorAll('[data-ch]').forEach((b) => b.addEventListener('click', () => { m.close(); runChapter(+b.dataset.ch, { replay: true }); }));
  }

  /* ---------- 征途 ---------- */
  function newGame() {
    save = { ch: 0, best: 0, party: ['wei', 'qin'], deck: STARTER_DECK.map((id) => ({ id, up: false })), flags: {}, applied: {}, seed: (Date.now() & 0xffffff) | 1, tut: tutShown, stats: { kills: 0, breaks: 0, maxChain: 0 } };
    Store.save(save);
    runChapter(0);
  }
  function applyJoins(ch, sv) {
    sv.applied = sv.applied || {};
    if (sv.applied[ch.id]) return [];
    const got = [];
    for (const j of ch.join || []) { if (!sv.party.includes(j)) sv.party.push(j); for (const c of JOIN_CARDS[j] || []) { sv.deck.push({ id: c, up: false }); got.push(c); } }
    for (const g of ch.gift || []) { sv.deck.push({ id: g, up: false }); got.push(g); }
    sv.applied[ch.id] = true;
    return got;
  }
  async function runChapter(i, opts = {}) {
    const ch = CHAPTERS[i];
    if (!ch) return showTitle();
    UI.screen('title', null); UI.screen('camp', null); UI.screen('result', null);
    mode = 'story'; titleSpin = false; busy = true;
    $('#hud').hidden = true; UI.clearChips(); UI.clearHand(); UI.forecast(null); UI.unitPanel(null);
    const sv = opts.replay ? JSON.parse(JSON.stringify(save)) : save;
    if (!opts.replay) { sv.ch = i; Store.save(sv); }
    const got = applyJoins(ch, sv);
    chapterSave = JSON.parse(JSON.stringify(sv));
    chapterSave.replay = !!opts.replay; chapterSave.chIdx = i;
    S = Rules.newBattle(i, Object.assign({}, sv, { diff: Settings.diff }));
    World.build(S); Anim.attach(S);
    World.cam.d.dist = World.cam.d.dist * 1.25; World.cam.d.pitch = 0.6;
    Sound.music('calm');
    if (!opts.skipStory) await UI.story(ch.pre, { title: ch.title, no: ch.no, flags: sv.flags });
    if (got.length) {
      const names = got.map((id) => CARDS[id].name).join('、');
      const joiners = (ch.join || []).map((j) => OFFICERS[j].name).join('、');
      UI.toast(`${joiners ? `<b>${joiners}</b> 加入！` : ''}牌組獲得：${names}`, 'tip', 3600);
    }
    startBattle();
  }

  async function startBattle() {
    mode = 'battle'; busy = true;
    sel = 0; cardSel = null; inspect = 0; threatOn = false;
    $('#threat').classList.remove('on');
    World.resetCam(false);
    $('#hud').hidden = false;
    UI.chain(0);
    Anim.setMom(S.mom);
    const ch = CHAPTERS[S.chIdx];
    Sound.music(S.units.some((u) => u.boss) ? 'boss' : 'battle'); Sound.setIntensity(0.3);
    S.ev = []; Rules.startPlayer(S); const evs = S.ev; S.ev = [];
    UI.phaseBanner('P', `${ch.no}・${ch.title}`); Sound.drum(1); setTimeout(() => Sound.drum(0.8), 200);
    await realWait(500);
    await Anim.play(evs);
    UI.toast(`<b>軍令狀</b>：${Rules.objText(S)}`, '', 3800);
    refresh(true);
    busy = false;
    if (ch.tutorial) tutorial('start');
    if (S.chIdx === 2) tutorial('fire');
    if (S.units.some((u) => u.charge)) {}
  }

  function tutorial(k) {
    if (tutShown[k]) return;
    const T = {
      start: ['點選<b>紅色棋子</b>看它能走到哪裡，再點綠色格子移動。', '單指拖曳<b>平移</b>，雙指<b>縮放、旋轉</b>；右側按鈕可旋轉、傾斜、全覽。'],
      moved: ['點下方<b>手牌</b>再點目標。第一下會顯示<b>預估傷害</b>，再點一次才出手。'],
      attacked: ['敵人棋子上的<b>金色尖角</b>是它面向的方向。繞到背後出手就是<b>背刺</b>，必定暴擊。', '敵人頭上的<b>盾牌</b>是陣勢：命中弱點或背刺會削減，削光就<b>破陣</b>——下回合無法行動，任你宰割。'],
      mom: ['<b>勢</b>滿了！按「絕技」，選一名將領發動大招。'],
      fire: ['這一戰靠<b>火</b>：林地、草地、營帳都會燒，每回合結束順著<b>風向</b>延燒一格。右上角看得到現在的風向與何時轉向。'],
      endturn: ['軍令用完了，按<b>結束回合</b>。'],
    }[k];
    if (!T) return;
    tutShown[k] = true;
    if (save) { save.tut = tutShown; }
    T.forEach((m, i) => setTimeout(() => UI.toast(m, 'tip', 5200), i * 900));
  }

  /* ---------- 畫面刷新 ---------- */
  function refresh(stagger) {
    if (!S) return;
    UI.hud(S, { mom: !busy });
    UI.renderHand(S, cardSel && !cardSel.isUlt ? cardSel.ci.k : -1, onCard, (ci) => UI.inspectCard(ci), { stagger });
    updateHighlights();
    const u = inspect ? Rules.byId(S, inspect) : sel ? Rules.byId(S, sel) : null;
    UI.unitPanel(u && u.alive ? u : null, S);
    if (S.side === 'P' && !busy && S.cmd === 0) tutorial('endturn');
  }

  function objectiveMarks(hl) {
    const O = S.obj;
    if (O.type === 'wagons') for (const t of S.tiles) if (t.y === S.h - 1 && t.pass) hl.push({ x: t.x, y: t.y, k: 'danger' });
    if (O.type === 'burn') for (const t of S.tiles) if (t.tent && !t.fire && !t.burnt) hl.push({ x: t.x, y: t.y, k: 'goal' });
    if (O.type === 'stages' && S.stage === 0) { const st = O.stages[0]; hl.push({ x: st.x, y: st.y, k: 'goal' }); }
    if (O.ram) for (const t of S.tiles) if (t.y === 10 && (t.x === 5 || t.x === 6)) hl.push({ x: t.x, y: t.y, k: 'danger' });
    // 火勢預告：本回合結束時會延燒到的格子
    for (const t of S.tiles) {
      if (t.fire <= 0) continue;
      const n = Rules.tile(S, t.x + DIRS[S.wind][0], t.y + DIRS[S.wind][1]);
      if (n && n.flam && !n.burnt && n.fire === 0) hl.push({ x: n.x, y: n.y, k: 'spread' });
    }
  }
  function updateHighlights() {
    const hl = [];
    if (!S) return World.setHighlights(hl);
    objectiveMarks(hl);
    if (threatOn) {
      const seen = new Set();
      for (const e of S.units) {
        if (!e.alive || e.side !== 'E' || e.obj) continue;
        for (const t of threatTiles(e)) { const k = t[0] + ',' + t[1]; if (!seen.has(k)) { seen.add(k); hl.push({ x: t[0], y: t[1], k: 'threat' }); } }
      }
    }
    if (inspect) {
      const e = Rules.byId(S, inspect);
      if (e && e.alive && e.side === 'E' && !e.obj) for (const t of threatTiles(e)) hl.push({ x: t[0], y: t[1], k: 'danger' });
    }
    if (cardSel) {
      if (cardSel.chooseUser) for (const u of cardSel.users) hl.push({ x: u.x, y: u.y, k: 'ally' });
      else {
        for (const t of cardSel.tgs) hl.push(t.kind === 'dir' ? { x: t.x, y: t.y, k: 'dir', f: t.f } : { x: t.x, y: t.y, k: t.kind === 'unit' && Rules.byId(S, t.uid).side === 'P' ? 'ally' : 'target', dim: !!cardSel.tgSel });
        if (cardSel.tgSel) {
          const area = Rules.areaOf(S, cardSel.ci, cardSel.user, cardSel.tgSel, cardSel.isUlt);
          for (const [x, y] of area) hl.push({ x, y, k: 'area' });
          if (cardSel.ci && cardSel.ci.id === 'charge') { const T = Rules.byId(S, cardSel.tgSel.uid); const L = T && Rules.chargeLine(S, cardSel.user, T, Rules.cinfo(cardSel.ci).line); if (L) for (const [x, y] of L.path.slice(1)) hl.push({ x, y, k: 'path' }); }
        }
      }
    } else if (sel) {
      const u = Rules.byId(S, sel);
      if (u && u.alive && S.side === 'P' && u.moveLeft > 0) {
        const R = Rules.reach(S, u);
        for (const v of R.values()) if (v.free && !(v.x === u.x && v.y === u.y)) hl.push({ x: v.x, y: v.y, k: 'move' });
      }
      if (u && u.alive) for (const e of S.units) if (e.alive && e.side === 'E' && Rules.canHitFrom(S, u.x, u.y, e, u.rng[0], u.rng[1])) hl.push({ x: e.x, y: e.y, k: 'attack' });
    }
    World.setHighlights(hl);
    World.setSelected(cardSel && cardSel.user ? cardSel.user.uid : sel);
  }
  function threatTiles(e) {
    const R = Rules.reach(S, e, e.mov);
    const set = new Map();
    for (const v of R.values()) {
      if (!v.free) continue;
      for (const t of S.tiles) {
        if (!t.pass && !t.tall) continue;
        const d = Rules.dist(v.x, v.y, t.x, t.y);
        let mx = e.rng[1]; if (mx > 1 && Rules.tile(S, v.x, v.y).h > t.h) mx += 1;
        if (d >= e.rng[0] && d <= mx) set.set(t.x + ',' + t.y, [t.x, t.y]);
      }
    }
    return [...set.values()];
  }

  /* ---------- 輸入：沙盤 ---------- */
  function bindInput(cv) {
    const ptrs = new Map();
    let g = null, holdTimer = 0;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId);
      const p = pos(e);
      ptrs.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y });
      clearTimeout(holdTimer);
      if (ptrs.size === 1) {
        g = { type: 'tap', t: performance.now(), btn: e.button, pan: e.button === 0 && !e.shiftKey && e.pointerType !== 'mouse' ? true : e.button === 0 && !e.shiftKey };
        if (e.pointerType === 'mouse' && (e.button === 2 || e.button === 1 || e.shiftKey)) g.orbit = true;
        holdTimer = setTimeout(() => { if (g && g.type === 'tap') { g.type = 'hold'; onHold(pos(e)); } }, 520);
      } else if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()];
        g = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), a0: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, dist0: World.cam.d.dist, yaw0: World.cam.d.yaw };

  }
  function rollPicks() {
    const pool = rewardPool(); const out = [];
    const r = RNG((save.seed + save.ch * 101 + Date.now()) >>> 0);
    let guard = 0;
    while (out.length < 3 && guard++ < 200) {
      const roll = r(); const rar = roll < 0.1 ? 3 : roll < 0.45 ? 2 : 1;
      const cands = pool.filter((id) => CARDS[id].rar === rar && !out.includes(id));
      if (!cands.length) continue;
      out.push(cands[Math.floor(r() * cands.length)]);
    }
    return out;
  }
  function showCamp(next) {
    mode = 'camp';
    const st = S.stats;
    const picks = rollPicks();
    const C = UI.screen('camp', `<div class="wrap">
      <div class="hd"><small>${CHAPTERS[S.chIdx].no}・${CHAPTERS[S.chIdx].title}</small>軍帳</div>
      <div class="grade">${grade(st)}</div>
      ${statsHtml(st)}
      <div class="sect">擇一張新牌</div>
      <div class="picks" id="cp-picks"></div>
      <div class="row"><button class="btn ghost" id="cp-skip" type="button">都不要</button></div>
      <div id="cp-up" hidden><div class="sect">精進一張牌</div><p class="note">點一張牌看精進後的效果，再按「精進」。</p><div class="deckgrid" id="cp-deck"></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="cp-upskip" type="button">先不精進</button></div></div>
      <div id="cp-go" class="row" hidden><button class="btn primary" id="cp-next" type="button">進軍：${CHAPTERS[next].no}・${CHAPTERS[next].title}</button></div>
      <div class="row"><button class="btn ghost" id="cp-deckview" type="button">檢視牌組（${save.deck.length}）</button><button class="btn ghost" id="cp-title" type="button">存檔並回標題</button></div>
    </div>`);
    const P = C.querySelector('#cp-picks');
    picks.forEach((id) => {
      const ci = { k: Math.random() * 1e9 | 0, id, up: false };
      const w = UI.el('div', 'pickwrap');
      const ce = UI.cardEl(ci);
      w.appendChild(ce);
      w.appendChild(UI.el('div', 'full', UI.richText(Rules.cinfo(ci).text)));
      ce.addEventListener('click', () => {
        Sound.stamp(); save.deck.push({ id, up: false });
        P.querySelectorAll('.card').forEach((c) => { if (c !== ce) c.style.opacity = 0.25; c.style.pointerEvents = 'none'; });
        ce.classList.add('sel');
        stepUpgrade();
      });
      P.appendChild(w);
    });
    C.querySelector('#cp-skip').addEventListener('click', () => { P.style.opacity = 0.3; P.style.pointerEvents = 'none'; stepUpgrade(); });
    const stepUpgrade = () => {
      C.querySelector('#cp-skip').parentElement.hidden = true;
      const box = C.querySelector('#cp-up'); box.hidden = false;
      const D = C.querySelector('#cp-deck'); D.innerHTML = '';
      save.deck.forEach((c, idx) => {
        if (c.up || !CARDS[c.id].up) return;
        const ce = UI.cardEl({ k: idx, id: c.id, up: false });
        ce.addEventListener('click', () => {
          const after = Rules.cinfo({ id: c.id, k: 0, up: true });
          const m = UI.modal(`<div class="bigcard"><div class="slot"></div><div><h3>${after.name}</h3><p>${UI.richText(after.text)}</p><p style="font-size:12.5px;color:var(--paper-dim)">原本：${UI.richText(Rules.cinfo({ id: c.id, k: 0 }).text)}</p></div></div><div class="row" style="margin-top:12px"><button class="btn ghost" data-close type="button">再想想</button><button class="btn gold" id="up-ok" type="button">精進</button></div>`);
          m.root.querySelector('.slot').appendChild(UI.cardEl({ id: c.id, k: 0, up: true }));
          m.root.querySelector('#up-ok').addEventListener('click', () => { c.up = true; Sound.mom(0.6); m.close(); box.hidden = true; finish(); });
        });
        D.appendChild(ce);
      });
      C.querySelector('#cp-upskip').addEventListener('click', () => { box.hidden = true; finish(); });
    };
    const finish = () => { Store.save(save); C.querySelector('#cp-go').hidden = false; C.querySelector('#cp-next').focus(); };
    C.querySelector('#cp-next').addEventListener('click', () => { Sound.stamp(); runChapter(next); });
    C.querySelector('#cp-deckview').addEventListener('click', () => deckView());
    C.querySelector('#cp-title').addEventListener('click', () => { Store.save(save); showTitle(); });
  }
  function deckView() {
    const m = UI.modal(`<h3>牌組（${save.deck.length}）</h3><div class="deckgrid" id="dv"></div><div class="row" style="margin-top:12px"><button class="btn ghost" data-close type="button">收起</button></div>`);
    const D = m.root.querySelector('#dv');
    save.deck.slice().sort((a, b) => a.id.localeCompare(b.id)).forEach((c, i) => { const ce = UI.cardEl({ k: i, id: c.id, up: c.up }); ce.addEventListener('click', () => UI.inspectCard({ k: i, id: c.id, up: c.up })); D.appendChild(ce); });
  }

  function showDefeat() {
    mode = 'result';
    const R = UI.screen('result', `<div class="wrap" style="justify-content:center;min-height:80%">
      <div class="hd"><small>${CHAPTERS[S.chIdx].no}・${CHAPTERS[S.chIdx].title}</small>兵敗</div>
      <p class="note">${S.over.why}。<br>重新佈陣，牌組與進度不會流失。</p>
      ${statsHtml(S.stats)}
      <div class="row"><button class="btn primary" id="rs-retry" type="button">重新佈陣</button><button class="btn ghost" id="rs-easy" type="button">${Settings.diff === 'easy' ? '' : '降低難度再戰'}</button><button class="btn ghost" id="rs-title" type="button">回到標題</button></div></div>`);
    if (Settings.diff === 'easy') R.querySelector('#rs-easy').remove();
    R.querySelector('#rs-retry').addEventListener('click', () => { Sound.stamp(); retry(); });
    R.querySelector('#rs-easy')?.addEventListener('click', () => { Settings.diff = Settings.diff === 'hard' ? 'normal' : 'easy'; saveSettings(); UI.toast('難度已調低', 'tip', 1600); retry(); });
    R.querySelector('#rs-title').addEventListener('click', () => showTitle());
  }
  function retry() {
    UI.screen('result', null);
    const i = chapterSave.chIdx;
    S = Rules.newBattle(i, Object.assign({}, chapterSave, { diff: Settings.diff, seed: (chapterSave.seed || 1) + Math.floor(Math.random() * 999) }));
    World.build(S); Anim.attach(S);
    startBattle();
  }

  function showEnding() {
    mode = 'result';
    const st = save.stats;
    const R = UI.screen('result', `<div class="wrap" style="justify-content:center;min-height:85%">
      <div class="hd"><small>第一卷</small>孤城　完</div>
      <p class="note">雁回城守住了。白衣人留下的那句話，還在城頭的風裡。<br>七年前那把火，是誰點的？</p>
      <div class="statgrid"><div class="stat"><b>${st.kills}</b><span>累計擊破</span></div><div class="stat"><b>${st.breaks}</b><span>累計破陣</span></div><div class="stat"><b>${st.maxChain}</b><span>最高連擊</span></div></div>
      <p class="note" style="color:var(--gold)">第二卷・燎原　待續</p>
      <div class="row"><button class="btn primary" id="en-title" type="button">回到標題</button></div></div>`);
    R.querySelector('#en-title').addEventListener('click', () => showTitle());
  }

  /* ---------- HUD 按鈕 ---------- */
  function bindHud() {
    const on = (id, fn) => $(id).addEventListener('click', (e) => { e.stopPropagation(); fn(e); });
    on('#endturn', () => endTurn());
    on('#undobtn', () => {
      if (busy || !S || !S.undo.length) return;
      Rules.undoMove(S); Anim.syncDisp(); Sound.whoosh(0.4, 0.15); cardSel = null; UI.forecast(null); refresh();
    });
    on('#ultbtn', () => ultButton());
    on('#rotL', () => { World.rotateStep(1); Sound.click(0.4); });
    on('#rotR', () => { World.rotateStep(-1); Sound.click(0.4); });
    on('#zin', () => World.zoomBy(0.8));
    on('#zout', () => World.zoomBy(1.25));
    on('#tilt', () => { const c = World.cam.d; c.pitch = c.pitch > 1.1 ? 0.62 : c.pitch > 0.75 ? 1.22 : 0.92; Sound.click(0.4); });
    on('#camreset', () => { World.resetCam(false, true); Sound.click(0.4); });
    on('#threat', (e) => { threatOn = !threatOn; e.currentTarget.classList.toggle('on', threatOn); Sound.click(0.5); if (threatOn) UI.toast('紅色區域：敵軍下回合可能攻擊到的範圍', 'tip', 2000); refresh(); });
    on('#windbox', () => {
      if (!S) return;
      const nx = S.windSched.filter((w) => w.r > S.round).map((w) => `第${w.r}回合轉${WIND_NAME[w.d]}`).join('，');
      UI.toast(`現在吹<b>${WIND_NAME[S.wind]}</b>：火勢每回合結束往${DIR_NAME[S.wind]}延燒一格。${nx ? '預報：' + nx + '。' : ''}`, 'tip', 4200);
    });
    on('#menubtn', () => menu());
  }
  function menu() {
    const m = UI.modal(`<h3>軍帳</h3>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <button class="btn ghost" id="mn-deck" type="button">檢視牌組</button>
        <button class="btn ghost" id="mn-help" type="button">戰法說明</button>
        <button class="btn ghost" id="mn-speed" type="button">敵軍演出速度：${Settings.speed}×</button>
        <button class="btn ghost" id="mn-sfx" type="button">音效：${Settings.sfx ? '開' : '關'}　配樂：${Settings.music ? '開' : '關'}</button>
        <button class="btn ghost" id="mn-shake" type="button">震屏：${Settings.shake ? '開' : '關'}</button>
        <button class="btn ghost" id="mn-retry" type="button">重新開始本戰</button>
        <button class="btn ghost" id="mn-title" type="button">回到標題</button>
      </div><div class="row" style="margin-top:12px"><button class="btn primary" data-close type="button">繼續作戰</button></div>`);
    const R = m.root;
    R.querySelector('#mn-deck').addEventListener('click', () => { m.close(); const dk = S.deck.concat(S.hand, S.disc).map((c) => ({ id: c.id, up: c.up })); const keep = save.deck; save.deck = dk; deckView(); save.deck = keep; });
    R.querySelector('#mn-help').addEventListener('click', () => { m.close(); help(); });
    R.querySelector('#mn-speed').addEventListener('click', (e) => { Settings.speed = Settings.speed === 1 ? 1.6 : Settings.speed === 1.6 ? 2.5 : 1; e.target.textContent = `敵軍演出速度：${Settings.speed}×`; saveSettings(); });
    R.querySelector('#mn-sfx').addEventListener('click', (e) => { Sound.init(); if (Settings.sfx && Settings.music) Settings.music = false; else if (Settings.sfx) Settings.sfx = false; else { Settings.sfx = true; Settings.music = true; } Sound.setSfx(Settings.sfx); Sound.setMusic(Settings.music); e.target.textContent = `音效：${Settings.sfx ? '開' : '關'}　配樂：${Settings.music ? '開' : '關'}`; saveSettings(); });
    R.querySelector('#mn-shake').addEventListener('click', (e) => { Settings.shake = !Settings.shake; e.target.textContent = `震屏：${Settings.shake ? '開' : '關'}`; saveSettings(); });
    R.querySelector('#mn-retry').addEventListener('click', () => { m.close(); confirmBox('重新開始這一戰？', '重來', () => { $('#hud').hidden = true; retry(); }); });
    R.querySelector('#mn-title').addEventListener('click', () => { m.close(); confirmBox('回到標題？這一戰的進度不會保留（征途進度仍在）。', '回標題', () => showTitle()); });
  }
  function help() {
    const ks = ['陣勢', '破陣', '背刺', '側擊', '暴擊', '居高', '連擊', '合擊', '反擊', '牽制', '火', '勢', '護', '擊退'];
    UI.modal(`<h3>戰法說明</h3><p>每回合有 <b style="color:var(--gold)">3 點軍令</b>、5 張手牌。每名將領每回合可自由移動一次（可分段），招式與計謀都靠打牌。</p>
      <p>魏子葳是全軍的腦：他倒下就輸；計謀以他為中心計算距離。</p>
      <div class="kw">${ks.map((k) => `<b>${k}</b>：${KEYWORDS[k]}`).join('<br>')}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-close type="button">明白</button></div>`);
  }

  return { boot, get S() { return S; }, get mode() { return mode; }, get busy() { return busy; }, get _cardSel() { return cardSel; }, get _sel() { return sel; }, endTurn, onCard, onTap, execute, ultButton, setCardUser: setCardUserProxy, refresh,
    _debug: { runChapter, startBattle, showCamp, newGame, showTitle, end: () => onBattleEnd(), get save() { return save; } } };
})();

window.addEventListener('DOMContentLoaded', () => Game.boot());
if (document.readyState !== 'loading') setTimeout(() => { if (Game.mode === 'boot') Game.boot(); }, 0);

</script>
