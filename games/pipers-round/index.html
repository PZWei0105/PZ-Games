<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>笛聲不停</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Grenze+Gotisch:wght@600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* 笛聲不停 — night glass. Layout: one full-height app; screens stack inside; FX canvas on top. */
:root {
  color-scheme: dark;
  --night: #0b0912; --night2: #141020; --panel: #18121f; --panel2: #221a2c; --edge: #3a2d47;
  --lead: #0f0b14; --bone: #efe6d3; --dim: #a99fb6; --faint: #706781;
  --gold: #f2c45c; --gold2: #b8862e; --ruby: #e2495b; --azure: #4ea6e6; --violet: #a77be0; --emerald: #4cc38e;
  --c0: #ece5d8; --c1: #5fcf92; --c2: #4ea6e6; --c3: #a77be0; --c4: #ea5466; --c5: #f2c45c;
  --f-disp: 'Noto Serif TC', 'Noto Serif CJK TC', 'Songti TC', 'STSong', 'PMingLiU', serif;
  --f-story: 'LXGW WenKai TC', 'Noto Serif TC', 'Noto Serif CJK TC', 'Kaiti TC', 'STKaiti', serif;
  --f-num: 'Cinzel', 'Noto Serif TC', serif;
  --f-goth: 'Grenze Gotisch', 'Cinzel', serif;
  --cw: clamp(78px, 22.5vw, 112px);
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutR: max(16px, env(safe-area-inset-right, 0px));
  /* top/bottom system bars: 0 here (the page itself is padded); the installed web app sets them to the real insets
     so backgrounds run edge to edge while the controls stay clear of the status bar and home indicator */
  --sat: 0px; --sab: 0px;
}
html { box-sizing: border-box; height: 100%; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; background: var(--night); color: var(--bone); font-family: var(--f-disp); -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { position: relative; width: 100%; height: var(--appH, 100%); overflow: hidden; background: var(--night); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; padding-top: var(--sat); padding-bottom: var(--sab); }
.screen.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.bgc { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }
#fxText { position: absolute; inset: 0; z-index: 61; pointer-events: none; overflow: hidden; }
#overlay { position: absolute; inset: 0; z-index: 80; display: none; }
#overlay.on { display: block; }
#toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); z-index: 90; pointer-events: none; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 92%; }

/* ---------- glass plaque buttons ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 12px;
  background: linear-gradient(180deg, #2b2236, #1a1422); border: 1.5px solid #4b3a5c; box-shadow: inset 0 1px 0 rgba(255,240,210,.12), 0 6px 16px rgba(0,0,0,.45);
  font-weight: 700; letter-spacing: .06em; color: var(--bone); transition: transform .12s, filter .12s; }
.btn:active { transform: translateY(1px) scale(.985); filter: brightness(1.15); }
.btn.gold { background: linear-gradient(180deg, #f6d27a, #c99536); color: #2a1a08; border-color: #f8e2a6; box-shadow: inset 0 1px 0 #fff6, 0 0 24px rgba(242,196,92,.35), 0 6px 16px rgba(0,0,0,.5); }
.btn.ghost { background: rgba(20,16,28,.6); border-color: #3a2d47; }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn .sub { font-weight: 500; font-size: 12px; color: var(--dim); letter-spacing: 0; }
.btn.gold .sub { color: #5a3f15; }

/* ---------- title ---------- */
.title-wrap { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 var(--gutR) 28px var(--gut); gap: 12px; }
.title-hero { position: absolute; left: 2%; top: 9%; pointer-events: none; z-index: 0; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)); }
.title-wrap > * { position: relative; z-index: 1; }
.logo { text-align: center; margin-bottom: 4px; }
.logo h1 { margin: 0; font-family: var(--f-disp); font-weight: 900; font-size: clamp(46px, 14vw, 72px); letter-spacing: .14em; line-height: 1.05;
  background: linear-gradient(180deg, #fff3cf 0%, #f2c45c 45%, #b8862e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(242,196,92,.45)) drop-shadow(0 3px 0 #2a1608); padding-left: .14em; }
.logo .en { font-family: var(--f-goth); font-size: clamp(18px, 5vw, 24px); letter-spacing: .32em; color: #d9c8ea; margin-top: 6px; text-shadow: 0 0 12px rgba(167,123,224,.6); }
.title-menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 86%); }
.title-menu .btn { width: 100%; }
.title-row { display: flex; gap: 10px; }
.title-row .btn { flex: 1; }
.tagline { font-family: var(--f-story); color: var(--dim); font-size: 14px; text-align: center; min-height: 20px; }

/* ---------- story slides ---------- */
.slide { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px var(--gutR) 24px var(--gut); }
.slide .art { display: flex; justify-content: center; align-items: flex-end; min-height: 34vh; }
.slide .lines { max-width: 34em; font-family: var(--f-story); font-size: clamp(16px, 4.4vw, 19px); line-height: 1.85; text-align: center; color: #efe4cf; text-wrap: balance; }
.slide .lines p { margin: 0 0 .7em; opacity: 0; animation: lineIn .7s ease forwards; }
.slide .tap { font-size: 12px; color: var(--faint); letter-spacing: .3em; animation: blink 2s infinite; }
@keyframes lineIn { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes blink { 50% { opacity: .35; } }
.skip { position: absolute; right: var(--gutR); top: calc(12px + var(--sat)); z-index: 5; }
.chapter-card .num { font-family: var(--f-goth); font-size: 64px; color: var(--gold); text-shadow: 0 0 24px rgba(242,196,92,.5); }
.chapter-card .nm { font-weight: 900; font-size: 34px; letter-spacing: .3em; padding-left: .3em; }

/* ---------- HUD ---------- */
.hud { position: relative; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px var(--gutR) 4px var(--gut); }
.hud .stat { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-num); font-weight: 800; font-size: 15px; white-space: nowrap; }
.hud .stat svg { width: 20px; height: 20px; flex: none; }
.hud .hp { color: #ffb3bb; }
.hud .gold { color: var(--gold); }
.hud .sp { flex: 1; }
.pots { display: flex; gap: 4px; }
.pot { width: 30px; height: 30px; border-radius: 8px; border: 1.5px dashed #3e3150; display: grid; place-items: center; background: rgba(0,0,0,.25); }
.pot img { width: 26px; height: 26px; }
.pot.full { border-style: solid; border-color: #5b4870; background: rgba(40,30,55,.6); }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(30,22,40,.75); border: 1px solid #3e3150; position: relative; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .cnt { position: absolute; right: -4px; bottom: -4px; font-family: var(--f-num); font-size: 11px; font-weight: 800; background: var(--gold); color: #24170a; border-radius: 9px; padding: 0 5px; line-height: 16px; }
.relics { position: relative; z-index: 5; display: flex; gap: 4px; padding: 0 var(--gutR) 4px var(--gut); overflow-x: auto; scrollbar-width: none; min-height: 30px; }
.relics::-webkit-scrollbar { display: none; }
.relic { flex: none; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a2d4a, #17111f); border: 1.5px solid #5b4870; display: grid; place-items: center; }
.relic img { width: 26px; height: 26px; }
.relic.flash { animation: relicFlash .6s ease; }
@keyframes relicFlash { 0% { box-shadow: 0 0 0 0 rgba(242,196,92,.9); transform: scale(1.25); } 100% { box-shadow: 0 0 0 14px rgba(242,196,92,0); transform: none; } }

/* ---------- combat ---------- */
.combat { display: grid; grid-template-rows: auto auto minmax(180px, 1fr) auto auto auto; grid-template-columns: minmax(0, 1fr); }
.combat > * { min-width: 0; }
.field { position: relative; z-index: 2; overflow: visible; }
.field .bgc { border-radius: 0; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(180deg, transparent, rgba(5,4,9,.55)); pointer-events: none; }
.actors { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 0 var(--gutR) 22px var(--gut); }
.hero-slot { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; }
.foes { flex: 1; display: flex; justify-content: center; align-items: flex-end; gap: 0; min-width: 0; position: relative; z-index: 4; }
.foe.back { transform: translateY(-14%) scale(.94); z-index: -1; }
.foe { z-index: 1; }
.foe, .hero-slot { position: relative; display: flex; flex-direction: column; align-items: center; transition: opacity .4s, transform .25s; }
.foe .figwrap, .hero-slot .figwrap { position: relative; display: block; }
.figwrap canvas { display: block; }
.figwrap .crk { position: absolute; left: 0; top: 0; pointer-events: none; }
.foe.dead { opacity: 0; pointer-events: none; }
.foe .figwrap { animation: idle 3.2s ease-in-out infinite; }
.foe:nth-child(2) .figwrap { animation-delay: -1.1s; } .foe:nth-child(3) .figwrap { animation-delay: -2s; }
.hero-slot .figwrap { animation: idleH 3.6s ease-in-out infinite; }
@keyframes idle { 50% { transform: translateY(-4px) scale(1.01); } }
@keyframes idleH { 50% { transform: translateY(-3px); } }
.hit { animation: hitShake .32s ease !important; }
@keyframes hitShake { 0% { filter: brightness(2.4) saturate(.4); transform: translateX(0); } 25% { transform: translateX(7px); } 50% { transform: translateX(-6px); } 75% { transform: translateX(3px); filter: brightness(1.3); } 100% { transform: none; filter: none; } }
.lunge { animation: lunge .34s ease !important; }
@keyframes lunge { 40% { transform: translateX(-26px) scale(1.04); } }
.lungeR { animation: lungeR .3s ease !important; }
@keyframes lungeR { 40% { transform: translateX(18px) rotate(-3deg); } }
.foe .tgt { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); width: 70%; height: 14px; border-radius: 50%; border: 2px solid rgba(242,196,92,.0); transition: border-color .2s; pointer-events: none; }
.foe.target .tgt { border-color: rgba(242,196,92,.85); box-shadow: 0 0 14px rgba(242,196,92,.55); }
.foe.pick .figwrap { filter: drop-shadow(0 0 10px rgba(242,196,92,.9)); }
.intent { position: absolute; top: -6px; left: 50%; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: 14px; background: rgba(12,9,18,.85); border: 1px solid #4a3a5c; font-family: var(--f-num); font-weight: 800; font-size: 14px; white-space: nowrap; z-index: 3; }
.intent svg { width: 18px; height: 18px; }
.intent .atk { color: #ff8e98; }
.intent .lbl { font-family: var(--f-disp); font-size: 11px; color: var(--dim); font-weight: 700; }
.bars { width: 100%; min-width: 78px; max-width: 150px; margin-top: 2px; }
.hpbar { position: relative; height: 14px; border-radius: 7px; background: #241a2a; border: 1.5px solid var(--lead); overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #ff6b7a, #b8283d); transition: width .35s ease; }
.hpbar i.lag { background: #ffe7a8; transition: width .9s ease .25s; }
.hpbar.blk { border-color: #6fb6ff; }
.hpbar span { position: relative; display: block; text-align: center; font-family: var(--f-num); font-size: 10.5px; font-weight: 800; line-height: 11px; color: #fff; text-shadow: 0 1px 2px #000; }
.blkb { position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 800; font-size: 11px; color: #0c1c2c; z-index: 2; }
.blkb svg { position: absolute; inset: 0; width: 24px; height: 24px; }
.blkb b { position: relative; }
.sts { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: 3px; min-height: 18px; max-width: 150px; }
.chip { display: inline-flex; align-items: center; gap: 1px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 700; background: rgba(20,14,28,.9); border: 1px solid #4a3a5c; white-space: nowrap; }
.chip b { font-family: var(--f-num); font-size: 11px; }
.chip.pop { animation: chipPop .4s ease; }
@keyframes chipPop { 0% { transform: scale(1.6); } 100% { transform: none; } }
.chip.crack { color: #ffd38a; } .chip.trem { color: #a9d0ff; } .chip.res { color: #d5b3ff; } .chip.plague { color: #9fe3a8; } .chip.mute { color: #c7c7c7; } .chip.str { color: #ff9c9c; } .chip.sleep { color: #b3c7ff; } .chip.rats { color: #ffcf9f; } .chip.gnaw { color: #ffb38a; } .chip.pw { color: var(--gold); }
.bubble { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -26px); min-width: 120px; max-width: 200px; padding: 8px 10px; border-radius: 12px; background: #efe6d3; color: #24182c; font-family: var(--f-story); font-size: 13px; line-height: 1.45; z-index: 6; box-shadow: 0 6px 18px rgba(0,0,0,.5); animation: bubbleIn .25s ease; text-align: center; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%) rotate(45deg); width: 12px; height: 12px; background: #efe6d3; }
@keyframes bubbleIn { from { opacity: 0; transform: translate(-50%, -14px) scale(.9); } }
.allyfig { position: absolute; left: calc(var(--gut) - 4px); top: 36px; z-index: 2; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.allyfig .figwrap { animation: idleH 4.4s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(242,196,92,.22)); }
.allyfig .ledge { width: 130%; height: 18px; margin-top: -12px; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #463646 0%, #221827 55%, rgba(15,10,18,0) 72%); }
.hero-slot .bars { align-self: flex-end; width: 62%; min-width: 92px; max-width: 132px; margin-right: 8%; }
.ally { position: absolute; left: var(--gut); top: 8px; z-index: 4; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); background: rgba(12,9,18,.7); padding: 4px 10px; border-radius: 12px; border: 1px solid #4a3a5c; }
.ally .dots { display: flex; gap: 3px; }
.ally .dots i { width: 8px; height: 8px; border-radius: 50%; background: #4a3a5c; }
.ally .dots i.on { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

/* staff (chain) */
.staffbar { position: relative; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 4px var(--gutR) 4px var(--gut); height: 64px; background: linear-gradient(180deg, rgba(10,8,15,.0), rgba(10,8,15,.85) 30%); }
.breath { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 54px; }
.breath .orbs { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; max-width: 60px; }
.breath .orbs i { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #9be7ff 40%, #2a8fc7); box-shadow: 0 0 8px #6fd0ff; }
.breath .orbs i.saved { background: radial-gradient(circle at 35% 30%, #fff, #ffe6a0 40%, #c9922e); box-shadow: 0 0 8px var(--gold); }
.breath .bn { font-family: var(--f-num); font-weight: 800; font-size: 20px; color: #bfefff; line-height: 1; text-shadow: 0 0 10px #4ec2ff; }
.breath .bl { font-size: 10px; color: var(--dim); letter-spacing: .2em; }
.staff { flex: 1; position: relative; height: 52px; min-width: 0; }
.staff svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.staff.crack { animation: staffCrack .45s ease; }
@keyframes staffCrack { 30% { transform: translateX(-4px); filter: brightness(1.8) hue-rotate(-30deg); } 60% { transform: translateX(3px); } }
.staff.mod { animation: staffMod .6s ease; }
@keyframes staffMod { 0% { filter: brightness(2.4); } 100% { filter: none; } }
.chain { min-width: 70px; text-align: center; }
.chain .x { font-family: var(--f-num); font-weight: 800; font-size: 30px; line-height: 1; color: var(--gold); text-shadow: 0 0 14px rgba(242,196,92,.6); transition: color .2s; }
.chain .x.hot { color: #ffb15c; text-shadow: 0 0 18px #ff7a3c; }
.chain .x.blaze { color: #ff7ad1; text-shadow: 0 0 22px #ff4fa8, 0 0 40px #8a5cff; }
.chain .x.pop { animation: xPop .28s ease; }
@keyframes xPop { 0% { transform: scale(1.7); } 100% { transform: none; } }
.chain .l { font-size: 10px; letter-spacing: .25em; color: var(--dim); }
.chain .loops { font-size: 11px; color: #d7b8ff; min-height: 14px; }

/* hand */
.hand { position: relative; z-index: 6; overflow: visible; max-width: 100%; height: calc(var(--cw) * 1.5 + 18px); display: flex; justify-content: center; align-items: flex-end; padding: 0 var(--gutR) 4px var(--gut); }
.hand .card { flex: none; transition: transform .18s ease, margin .18s ease, filter .2s, opacity .2s; transform-origin: 50% 120%; }
.hand .card.sel { transform: translateY(-22px) scale(1.06) !important; z-index: 20; }
.bar { position: relative; z-index: 6; display: flex; align-items: center; gap: 8px; padding: 4px var(--gutR) 10px var(--gut); }
.pile { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-num); font-weight: 800; font-size: 14px; color: var(--dim); padding: 6px 8px; border-radius: 10px; background: rgba(20,15,28,.7); border: 1px solid #3a2d47; }
.pile svg { width: 18px; height: 18px; }
.endturn { margin-left: auto; min-width: 128px; }
.endturn .sv { font-family: var(--f-num); font-size: 11px; color: #5a3f15; }
.banner { position: absolute; left: 0; right: 0; top: 40%; z-index: 30; text-align: center; pointer-events: none; font-weight: 900; font-size: 30px; letter-spacing: .3em; color: var(--bone); text-shadow: 0 0 20px rgba(0,0,0,.9), 0 0 30px rgba(167,123,224,.6); animation: banner 1.1s ease forwards; }
.banner small { display: block; font-size: 14px; letter-spacing: .2em; color: var(--dim); font-weight: 500; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.3); } 20% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
.milestone { position: absolute; left: 0; right: 0; top: 30%; z-index: 31; text-align: center; pointer-events: none; font-family: var(--f-disp); font-weight: 900; font-size: 44px; letter-spacing: .12em; color: #fff3cf; text-shadow: 0 0 24px #f2c45c, 0 0 48px #ff7a3c; animation: ms 1.4s ease forwards; }
@keyframes ms { 0% { opacity: 0; transform: scale(2.2); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(.92); } }
.shake { animation: scr .35s ease; }
@keyframes scr { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-3px, 2px); } 80% { transform: translate(2px, -1px); } }
.redflash { position: absolute; inset: 0; z-index: 25; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(200,30,50,.45)); animation: rf .45s ease forwards; }
@keyframes rf { from { opacity: 1; } to { opacity: 0; } }

/* floating numbers */
.fnum { position: absolute; transform: translate(-50%, -50%) scale(var(--s, 1)); font-family: var(--f-num); font-weight: 800; font-size: 26px; color: #fff3cf; text-shadow: 0 0 10px #f2a43c, 0 2px 0 #3a1508, 0 0 2px #000; animation: fnum 1.05s ease-out forwards; white-space: nowrap; }
.fnum.big { color: #ffd38a; } .fnum.huge { color: #ff9bd6; text-shadow: 0 0 14px #ff4fa8, 0 2px 0 #3a0820; }
.fnum.blk { color: #9ed2ff; text-shadow: 0 0 10px #2a8fc7, 0 2px 0 #0a2238; }
.fnum.pl { color: #ff7b8a; text-shadow: 0 0 10px #c7283e, 0 2px 0 #3a0810; }
.fnum.heal { color: #9ff0b0; text-shadow: 0 0 10px #2a9f58; }
.fnum.lbl { font-family: var(--f-disp); font-size: 16px; font-weight: 900; letter-spacing: .1em; }

/* 笛聲不停 — core: namespace, rng, utils */
(function () {
  const G = (globalThis.G = globalThis.G || {});

  // ---------- seeded RNG (mulberry32) ----------
  G.makeRng = function (seed) {
    let s = seed >>> 0;
    const r = {
      next() {
        s = (s + 0x6d2b79f5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      int(a, b) { return a + Math.floor(r.next() * (b - a + 1)); },
      pick(arr) { return arr[Math.floor(r.next() * arr.length)]; },
      chance(p) { return r.next() < p; },
      shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(r.next() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      },
      weighted(items) { // [{w, v}]
        let tot = 0; for (const it of items) tot += it.w;
        let x = r.next() * tot;
        for (const it of items) { x -= it.w; if (x <= 0) return it.v; }
        return items[items.length - 1].v;
      },
      get state() { return s; },
      set state(v) { s = v >>> 0; },
    };
    return r;
  };
  // global rng used by run/combat; replaced on run start/load
  G.rng = G.makeRng((Date.now() ^ 0x5eed) >>> 0);

  let uidCounter = 1;
  G.uid = () => 'c' + (uidCounter++).toString(36) + Math.floor(Math.random() * 1e6).toString(36);
  G.setUidBase = (n) => { uidCounter = Math.max(uidCounter, n); };

  G.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  G.sum = (arr) => arr.reduce((a, b) => a + b, 0);

    n = Math.round(n);
    if (n >= 100000) return (n / 1000).toFixed(0) + 'k';
    if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
    return String(n);

      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); return true; }
      catch (e) { return false; }

    del(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },

/* 笛聲不停 — combat engine (DOM-free; emits fx events for the UI) */
(function () {
  const G = globalThis.G;

  // ---------------- card instances ----------------
  G.newCard = (id, up = false, shard = null) => ({ uid: G.uid(), id, up: !!up, shard: shard || null });
  G.cloneCard = (c) => ({ uid: c.uid, id: c.id, up: c.up, shard: c.shard || null, knots: 0, tmpZero: false, tmpWild: false });

  G.cardDef = (inst) => G.CARDS[inst.id];
  G.cardName = (inst) => G.CARDS[inst.id].name + (inst.up ? '+' : '');
  G.cardVals = (inst) => {
    const d = G.CARDS[inst.id]; const o = {};
    for (const k in d.v) o[k] = d.v[k][inst.up ? 1 : 0];
    return o;
  };
  G.cardText = (inst) => { const d = G.CARDS[inst.id]; return (inst.up && d.upText) || d.text; };
  G.cardBaseCost = (inst) => {
    const d = G.CARDS[inst.id];
    let c = (inst.up && d.up && d.up.cost !== undefined) ? d.up.cost : d.cost;
    if (inst.shard === 'opal') c -= 1;
    if (inst.shard === 'obsidian') c += 1;
    return Math.max(0, c);
  };
  G.cardKw = (inst) => {
    const d = G.CARDS[inst.id];
    const kw = new Set((inst.up && d.up && d.up.kw) ? d.up.kw : (d.kw || []));
    if (inst.shard === 'gold') kw.add('wild');
    if (inst.shard === 'emerald') kw.add('retain');
    if (inst.tmpWild) kw.add('wild');
    return kw;
  };
  G.canUpgrade = (inst) => !inst.up && !['status', 'curse'].includes(G.CARDS[inst.id].type) && G.CARDS[inst.id].rar !== 'special';
  G.canInlay = (inst, shardKey) => {
    const d = G.CARDS[inst.id];
    if (['status', 'curse'].includes(d.type)) return false;
    if (inst.shard) return false;
    const s = G.SHARDS[shardKey];
    if (s && s.only && d.type !== s.only) return false;
    return true;
  };

  const hasRelic = (st, id) => st.run && st.run.relics && st.run.relics.includes(id);
  G.hasRelic = hasRelic;

  // ---------------- combat setup ----------------
  G.startCombat = function (run, enemyIds, opts = {}) {
    const rng = G.rng;
    const st = {
      run, opts,
      practice: !!opts.practice,
      p: {
        hp: run.hp, maxHp: run.maxHp, block: 0, breath: 0, saved: 0,
        str: 0, crack: 0, trem: 0, plague: 0, mute: 0, gnaw: 0, rats: 0,
        echo: 0, twin: 0, tmpMult: 0, duetX2: false, powers: {},
      },
      enemies: [], draw: [], hand: [], discard: [], exhaust: [],
      turn: 0, chain: freshChain(), flags: { turn: {}, combat: {} },
      fx: [], result: null, lastTurnMaxChain: 0,
      stats: { maxChain: 0, maxHit: 0, maxTurnDmg: 0, turnDmg: 0, totalDmg: 0, maxCards: 0, loopsMax: 0 },
      duet: !!opts.duet,
      ally: opts.duet ? { name: '老吹笛人', breath: 9, max: 9 } : null,
    };
    if (opts.practiceBreath) st.practiceBreath = opts.practiceBreath;
    if (opts.practiceDraw) st.practiceDraw = opts.practiceDraw;

    // deck
    const deck = run.deck.map(G.cloneCard);
    rng.shuffle(deck);
    // innate: homecoming with otto's sheet
    if (hasRelic(st, 'ottosheet')) {
      deck.sort((a, b) => (b.id === 'homecoming') - (a.id === 'homecoming'));
      // bring to end (we pop from end) -> reverse so innate are drawn first
      const inn = deck.filter((c) => c.id === 'homecoming');
      const rest = deck.filter((c) => c.id !== 'homecoming');
      st.draw = rest.concat(inn);
    } else st.draw = deck;

    for (const id of enemyIds) addEnemy(st, id);
    // relic combat start
    for (const id of run.relics) { const r = G.RELICS[id]; if (r && r.onCombatStart) r.onCombatStart(relicCtx(st, id)); }
    st.fx.push({ t: 'combatStart' });
    for (const e of st.enemies) chooseIntent(st, e);
    startPlayerTurn(st, true);
    return st;
  };

  function freshChain() {
    return { count: 0, last: -1, wildNext: false, loops: 0, played: 0, max: 0, breaks: 0, prevCost: -99 };
  }

  function addEnemy(st, id, fresh) {
    const d = G.ENEMIES[id];
    const hp = G.rng.int(d.hp[0], d.hp[1]);
    const e = {
      uid: G.uid(), id, name: d.name, hp, maxHp: hp, block: 0, str: 0, crack: 0, trem: 0, res: 0, sleep: 0,
      mem: {}, turn: 0, last: null, last2: null, intentKey: null, alive: true, fresh: !!fresh,
    };
    if (d.init) d.init(e);
    st.enemies.push(e);
    return e;
  }
  G.addEnemy = addEnemy;

  const alive = (st) => st.enemies.filter((e) => e.alive);
  G.aliveEnemies = alive;

  function chooseIntent(st, e) {
    const d = G.ENEMIES[e.id];
    e.intentKey = d.ai(e, st, G.rng);
  }
  G.intentOf = function (st, e) {
    const d = G.ENEMIES[e.id];
    const m = d.moves[e.intentKey];
    if (!m) return {};
    const it = typeof m.intent === 'function' ? m.intent(e, st) : m.intent;
    const out = Object.assign({}, it);
    if (out.atk !== undefined) out.atkShown = enemyHitDamage(st, e, out.atk);
    return out;
  };

  // ---------------- turn flow ----------------
  function startPlayerTurn(st, first) {
    if (st.result) return;
    const p = st.p;
    st.turn += 1;
    if (!first) p.block = 0;
    st.chain = freshChain();
    st.flags.turn = {};
    p.tmpMult = 0; p.echo = 0; p.twin = 0; p.duetX2 = false;
    let breath = st.practiceBreath || G.BASE_BREATH;
    if (hasRelic(st, 'ratcrown')) breath += 1;
    if (hasRelic(st, 'mayorseal')) breath += 1;
    if (first && hasRelic(st, 'moonstone')) breath += 2;
    if (st.ally) breath += 1;
    breath += p.saved;
    breath -= p.gnaw; p.gnaw = 0;
    p.saved = 0;
    p.breath = Math.max(0, breath);
    st.fx.push({ t: 'turnStart', turn: st.turn, breath: p.breath, block: p.block });
    for (const id of st.run.relics) { const r = G.RELICS[id]; if (r && r.onTurnStart) r.onTurnStart(relicCtx(st, id)); }
    let n = st.practiceDraw || G.BASE_DRAW;
    n += (p.powers.score || 0);
    if (hasRelic(st, 'churchbell')) n += 1;
    if (hasRelic(st, 'greatscore')) n += 2;
    if (hasRelic(st, 'metronome') && st.lastTurnMaxChain >= 6) n += 1;
    drawCards(st, n);
    checkEnd(st);
  }

  function drawCards(st, n) {
    const got = [];
    for (let i = 0; i < n; i++) {
      if (st.hand.length >= G.HAND_MAX) break;
      if (st.draw.length === 0) {
        if (st.discard.length === 0) break;
        st.draw = G.rng.shuffle(st.discard.splice(0));
        st.fx.push({ t: 'reshuffle', n: st.draw.length });
      }
      const c = st.draw.pop();
      st.hand.push(c); got.push(c.uid);
    }
    if (got.length) st.fx.push({ t: 'draw', uids: got });
    return got.length;
  }
  G.drawCards = drawCards;

  // effective cost in combat
  G.effCost = (st, inst) => {
    if (inst.tmpZero) return 0;
    return Math.max(0, G.cardBaseCost(inst) + (inst.knots || 0));
  };

  // describes what playing this card would do right now
  G.cardInfo = function (st, inst) {
    const d = G.CARDS[inst.id];
    const kw = G.cardKw(inst);
    const ch = st.chain;
    const cost = G.effCost(st, inst);
    const printed = (inst.up && d.up && d.up.cost !== undefined) ? d.up.cost : d.cost;
    const info = {
      cost, wild: kw.has('wild'), loop: kw.has('loop') || cost >= G.TOP || printed >= G.TOP, rest: kw.has('rest'),
      exhaust: kw.has('exhaust'), retain: kw.has('retain'), unplayable: kw.has('unplayable'),
      violet: inst.shard === 'violet', playable: true, reason: '', cont: true, M: 1, jie: false,
    };
    if (!info.wild && hasRelic(st, 'falsepipe') && ch.played === 0) info.wild = true;
    if (info.unplayable) { info.playable = false; info.reason = '無法打出'; }
    else if (cost > st.p.breath) { info.playable = false; info.reason = '氣息不足'; }
    if (info.rest) { info.cont = null; info.M = Math.max(1, ch.count) + chainBonus(st); }
    else {
      let cont = continues(st, info);
      if (cont && ch.count >= 1 && st.p.mute > 0) cont = false;
      info.cont = cont;
      const next = cont ? ch.count + 1 : (st.p.powers.pitch ? Math.max(0, Math.floor(ch.count / 2)) : 0) + 1;
      info.M = next + chainBonus(st);
      info.jie = cont && ch.count >= 1 && cost === ch.prevCost + 1;
      info.wouldBreak = !cont && ch.count >= 1;
      info.marbleSave = info.wouldBreak && hasRelic(st, 'marble') && !st.flags.combat.marble;
      if (info.marbleSave) { info.M = ch.count + 1 + chainBonus(st); }
    }
    if (st.p.duetX2) info.M *= 2;
    if (hasRelic(st, 'toyflute') && !st.flags.combat.toy) info.M *= 2;
    info.type = d.type;
    return info;
  };

  function chainBonus(st) {
    let b = st.p.tmpMult || 0;
    if (hasRelic(st, 'glassheart')) b += 1;
    return b;
  }

  function continues(st, info) {
    const ch = st.chain;
    if (ch.count === 0) return true;
    if (info.wild) return true;
    if (ch.wildNext) return true;
    if (info.cost > ch.last) return true;
    if (info.violet && info.cost === ch.last - 1) return true;
    if (hasRelic(st, 'silentbell') && info.cost === ch.last) return true;
    return false;
  }

  // ---------------- playing a card ----------------
  G.playCard = function (st, uid, targetIdx) {
    if (st.result) return false;
    const hi = st.hand.findIndex((c) => c.uid === uid);
    if (hi < 0) return false;
    const inst = st.hand[hi];
    const d = G.CARDS[inst.id];
    const info = G.cardInfo(st, inst);
    if (!info.playable) return false;
    const p = st.p; const ch = st.chain;

    let target = null;
    if (d.target === 'enemy') {
      target = st.enemies[targetIdx];
      if (!target || !target.alive) target = alive(st)[0] || null;
    }
    p.breath -= info.cost;
    st.hand.splice(hi, 1);
    st.fx.push({ t: 'play', uid, id: inst.id, cost: info.cost, target: target ? st.enemies.indexOf(target) : -1, breath: p.breath });

    // ---- chain step ----
    const playedBefore = ch.played;
    let M, jie = false;
    if (info.rest) {
      M = Math.max(1, ch.count) + chainBonus(st);
      st.fx.push({ t: 'chain', count: ch.count, rest: true, M, cost: info.cost });
    } else {
      let cont = continues(st, info);
      if (cont && ch.count >= 1 && p.mute > 0) { cont = false; p.mute -= 1; st.fx.push({ t: 'status', side: 'p', key: 'mute', n: -1, total: p.mute }); }
      let saved = false;
      if (!cont && ch.count >= 1 && hasRelic(st, 'marble') && !st.flags.combat.marble) {
        st.flags.combat.marble = 1; cont = true; saved = true; st.fx.push({ t: 'relic', id: 'marble' });
      }
      if (cont) {
        jie = ch.count >= 1 && info.cost === ch.prevCost + 1;
        ch.count += 1;
      } else {
        ch.breaks += 1;
        const base = p.powers.pitch ? Math.max(0, Math.floor(ch.count / 2)) : 0;
        ch.count = base + 1;
      }
      ch.prevCost = info.cost;
      ch.last = info.wild ? -1 : info.cost;
      ch.wildNext = !!info.wild;
      M = ch.count + chainBonus(st);
      if (ch.count > ch.max) ch.max = ch.count;
      st.fx.push({ t: 'chain', count: ch.count, cont, broke: !cont, saved, M, cost: info.cost, jie, wild: info.wild });
      overpowerCheck(st);
      if (!cont) {
        for (const id of st.run.relics) { const r = G.RELICS[id]; if (r && r.onBreak) r.onBreak(relicCtx(st, id)); }
        if (hasRelic(st, 'greatscore') && !st.flags.turn.gs) { st.flags.turn.gs = 1; hurtPlayer(st, 3, 'relic'); }
        for (const e of alive(st)) if (G.ENEMIES[e.id].passive === 'mirror') { e.mem.chain += 1; st.fx.push({ t: 'mirror', idx: st.enemies.indexOf(e), chain: e.mem.chain }); }
      } else {
        for (const id of st.run.relics) { const r = G.RELICS[id]; if (r && r.onChain) r.onChain(relicCtx(st, id), ch.count); }
        if (st.ally && ch.count % 5 === 0) allyEcho(st);
      }
    }
    if (st.p.duetX2) M *= 2;
    if (hasRelic(st, 'toyflute') && !st.flags.combat.toy) { st.flags.combat.toy = 1; M *= 2; st.fx.push({ t: 'relic', id: 'toyflute' }); }
    ch.played += 1;
    if (ch.played > st.stats.maxCards) st.stats.maxCards = ch.played;
    if (p.powers.motley && ch.played % 5 === 0) {
      for (let i = 0; i < p.powers.motley; i++) { gainBreath(st, 1); drawCards(st, 1); }
      st.fx.push({ t: 'power', id: 'motley' });
    }

    let times = 1;
    if (inst.shard === 'obsidian') times += 1;
    if (d.type === 'atk' && p.echo > 0) { p.echo -= 1; times += 1; }
    if (p.twin > 0) { p.twin -= 1; times += 1; }
    if (hasRelic(st, 'twinpipe') && ch.played === 10) { times += 1; st.fx.push({ t: 'relic', id: 'twinpipe' }); }
    const loopsBefore = ch.loops;
    for (let t = 0; t < times; t++) {
      if (st.result) break;
      if (d.target === 'enemy' && (!target || !target.alive)) target = alive(st)[0] || null;
      const c = effectCtx(st, inst, d, target, M, jie, playedBefore, info.cost, loopsBefore);
      d.play(c);
      if (inst.shard === 'azure') c.block(3);
      if (t > 0) st.fx.push({ t: 'repeat' });
    }
    if (inst.shard === 'sapphire') drawCards(st, 1);
    inst.knots = 0; inst.tmpZero = false;

    // ---- relic card hooks ----
    for (const id of st.run.relics) { const r = G.RELICS[id]; if (r && r.onCardPlayed) r.onCardPlayed(relicCtx(st, id), inst, info.cost); }

    // ---- loop (modulation) ----
    if (!info.rest && info.loop && !st.result) {
      ch.loops += 1; ch.last = -1; ch.wildNext = false;
      if (ch.loops > st.stats.loopsMax) st.stats.loopsMax = ch.loops;
      st.fx.push({ t: 'loop', loops: ch.loops, count: ch.count });
      const pw = p.powers;
      if (pw.circular) gainBreath(st, pw.circular);
      if (pw.endless) { drawCards(st, pw.endless); gainBreath(st, pw.endless); }
      if (pw.rondo) {
        const dm = pw.rondo * (ch.count + chainBonus(st)) * (p.duetX2 ? 2 : 1);
        for (const e of alive(st)) damageEnemy(st, e, dm, 'power');
      }
      for (const id of st.run.relics) { const r = G.RELICS[id]; if (r && r.onLoop) r.onLoop(relicCtx(st, id)); }
      for (const e of alive(st)) if (G.ENEMIES[e.id].passive === 'swallow') { e.block += 12; st.fx.push({ t: 'block', side: 'e', idx: st.enemies.indexOf(e), amount: 12, total: e.block }); }
    }

    // ---- where the card goes ----
    if (d.type === 'pow') { st.fx.push({ t: 'exhaust', uid, power: true }); }
    else if (info.exhaust) { st.exhaust.push(inst); st.fx.push({ t: 'exhaust', uid }); }
    else st.discard.push(inst);

    st.stats.maxChain = Math.max(st.stats.maxChain, ch.max);
    checkEnd(st);
    return true;
  };

  // the false piper is knocked back to ♭1 as soon as your melody reaches his pitch
  function overpowerCheck(st) {
    for (const e of alive(st)) {
      if (G.ENEMIES[e.id].passive === 'mirror' && e.mem.chain > 1 && st.chain.count >= e.mem.chain) {
        e.mem.chain = 1; st.fx.push({ t: 'overpower', idx: st.enemies.indexOf(e) });
      }
    }
  }

  // context passed to card.play
  function effectCtx(st, inst, d, target, M, jie, playedBefore, costPaid, loopsBefore) {
    const p = st.p;
    const v = G.cardVals(inst);
    const ostinato = costPaid === 0 ? (p.powers.ostinato || 0) : 0;
    const ruby = inst.shard === 'ruby' && d.type === 'atk' ? 3 : 0;
    const c = {
      st, inst, def: d, v, M, jie, played: playedBefore, chain: st.chain.count, loops: loopsBefore,
      rats: p.rats, target,
      fx(e) { st.fx.push(e); },
      atk(base, hits = 1, tgt) {
        tgt = tgt || target;
        if (!tgt || !tgt.alive) tgt = alive(st)[0];
        let killed = false;
        for (let i = 0; i < hits; i++) {
          if (!tgt || !tgt.alive) break;
          const dm = playerHitDamage(st, tgt, base + ruby + ostinato, M);
          if (damageEnemy(st, tgt, dm, 'card')) killed = true;
          if (st.result) break;
        }
        return killed;
      },
      atkAll(base, hits = 1) {
        for (let i = 0; i < hits; i++) {
          for (const e of alive(st)) {
            const dm = playerHitDamage(st, e, base + ruby + ostinato, M);
            damageEnemy(st, e, dm, 'card', true);
          }
          if (st.result) break;
        }
      },
      atkRandom(base, hits = 1) {
        for (let i = 0; i < hits; i++) {
          const al = alive(st); if (!al.length || st.result) break;
          const e = G.rng.pick(al);
          const dm = playerHitDamage(st, e, base + ruby + ostinato, M);
          damageEnemy(st, e, dm, 'card');
        }
      },
      block(base) { gainBlock(st, Math.floor((base + ostinato) * M)); },
      draw(n) { drawCards(st, n); },
      gainBreath(n) { gainBreath(st, n); },
      status(tgt, key, n) { if (tgt && tgt.alive) applyEnemyStatus(st, tgt, key, n); },
      statusAll(key, n) { for (const e of alive(st)) applyEnemyStatus(st, e, key, n); },
      addRats(n) { addRats(st, n); },
      addPower(id, amt) { p.powers[id] = (p.powers[id] || 0) + amt; st.fx.push({ t: 'power', id, amount: p.powers[id] }); },
      heal(n) { healPlayer(st, n); },
      zeroRandomHand(n) {
        const pool = st.hand.filter((h) => !G.cardKw(h).has('unplayable') && G.effCost(st, h) > 0);
        G.rng.shuffle(pool);
        for (const h of pool.slice(0, n)) { h.tmpZero = true; st.fx.push({ t: 'cardMod', uid: h.uid, mod: 'zero' }); }
      },
      duet() { st.p.duetX2 = true; if (st.ally) { st.ally.breath = Math.min(st.ally.max, st.ally.breath + 2); st.fx.push({ t: 'duet', breath: st.ally.breath }); } },
    };
    return c;
  }

  // ---------------- damage & status ----------------
  function playerHitDamage(st, e, base, M) {
    let d = (base + (st.p.str || 0)) * M;
    if (st.p.trem > 0) d *= 0.75;
    if (e && e.crack > 0) d *= hasRelic(st, 'brokenmirror') ? 1.75 : 1.5;
    if (e && G.ENEMIES[e.id].passive === 'swarm') d += 2;
    return Math.max(0, Math.floor(d));
  }
  G.playerHitDamage = playerHitDamage;

  function enemyHitDamage(st, e, base) {
    let d = base + (e.str || 0);
    if (e.trem > 0) d *= 0.75;
    if (st.p.crack > 0) d *= 1.5;
    if (hasRelic(st, 'glassheart')) d *= 1.25;
    return Math.max(0, Math.floor(d));
  }
  G.enemyHitDamage = enemyHitDamage;

  function damageEnemy(st, e, dmg, src, aoe) {
    if (!e.alive) return false;
    const idx = st.enemies.indexOf(e);
    let blocked = 0;
    if (e.block > 0) { blocked = Math.min(e.block, dmg); e.block -= blocked; }
    const real = dmg - blocked;
    e.hp -= real;
    if (st.practice && e.id === 'dummy') { /* tracked below */ }
    st.stats.turnDmg += real; st.stats.totalDmg += real;
    if (dmg > st.stats.maxHit) st.stats.maxHit = dmg;
    let kill = false;
    if (e.hp <= 0) {
      if (e.id === 'dummy') { e.hp = e.maxHp; }
      else if (G.ENEMIES[e.id].passive === 'ninelives' && !e.revived) {
        e.revived = true; e.hp = 45; e.block = 0; e.crack = 0; e.res = 0;
        st.fx.push({ t: 'hit', side: 'e', idx, dmg, blocked, hp: 0, max: e.maxHp, src, aoe });
        st.fx.push({ t: 'revive', idx, hp: e.hp });
        return false;
      } else { e.hp = 0; e.alive = false; kill = true; }
    }
    st.fx.push({ t: 'hit', side: 'e', idx, dmg, blocked, hp: e.hp, max: e.maxHp, block: e.block, src, aoe, kill });
    if (kill) { st.fx.push({ t: 'death', idx }); checkEnd(st); }
    return kill;
  }
  G.damageEnemy = damageEnemy;

  function applyEnemyStatus(st, e, key, n) {
    if (key === 'res' && hasRelic(st, 'soundbox')) n += 1;
    if (key === 'sleep') { e.sleep = 1; }
    else e[key] = (e[key] || 0) + n;
    st.fx.push({ t: 'status', side: 'e', idx: st.enemies.indexOf(e), key, n, total: e[key] });
  }

  function gainBlock(st, n) {
    if (n <= 0) return;
    st.p.block += n;
    st.fx.push({ t: 'block', side: 'p', amount: n, total: st.p.block });
  }
  function gainBreath(st, n) {
    st.p.breath += n;
    st.fx.push({ t: 'breath', amount: n, total: st.p.breath });
  }
  function addRats(st, n) {
    const before = st.p.rats;
    st.p.rats = Math.min(30, st.p.rats + n);
    if (st.p.rats !== before) st.fx.push({ t: 'rats', amount: st.p.rats - before, total: st.p.rats });
  }
  function healPlayer(st, n) {
    const before = st.p.hp;
    st.p.hp = Math.min(st.p.maxHp, st.p.hp + n);
    if (st.p.hp > before) st.fx.push({ t: 'heal', side: 'p', amount: st.p.hp - before, hp: st.p.hp });
  }
  function hurtPlayer(st, n, src, idx) {
    if (n <= 0) return 0;
    const p = st.p;
    let blocked = 0;
    if (src === 'attack' && p.block > 0) { blocked = Math.min(p.block, n); p.block -= blocked; }
    const real = n - blocked;
    p.hp -= real;
    st.fx.push({ t: 'hit', side: 'p', dmg: n, blocked, hp: Math.max(0, p.hp), max: p.maxHp, block: p.block, src, from: idx });
    if (hasRelic(st, 'motleypatch') && !st.flags.combat.patch && p.hp > 0 && p.hp < p.maxHp / 2) {
      st.flags.combat.patch = 1; gainBlock(st, 20); drawCards(st, 2); st.fx.push({ t: 'relic', id: 'motleypatch' });
    }
    if (p.hp <= 0) { p.hp = 0; if (!st.practice) { st.result = 'lose'; st.fx.push({ t: 'lose' }); } else { p.hp = p.maxHp; } }
    return real;
  }
  G.hurtPlayer = hurtPlayer;

  function allyEcho(st) {
    const k = alive(st).find((e) => e.id === 'knot') || alive(st)[0];
    if (!k) return;
    const dm = 5 * st.chain.count * (st.p.duetX2 ? 2 : 1);
    st.fx.push({ t: 'allyEcho', dmg: dm, idx: st.enemies.indexOf(k) });
    damageEnemy(st, k, dm, 'ally');
  }

  // ---------------- end of turn & enemy turn ----------------
  G.endTurn = function (st) {
    if (st.result) return;
    const p = st.p;
    st.fx.push({ t: 'turnEnd' });
    const ch = st.chain;
    st.lastTurnMaxChain = ch.max;
    if (st.stats.turnDmg > st.stats.maxTurnDmg) st.stats.maxTurnDmg = st.stats.turnDmg;

    // powers at turn end
    if (p.powers.drone) for (const e of alive(st)) applyEnemyStatus(st, e, 'res', p.powers.drone);
    if (p.powers.kingrats) addRats(st, p.powers.kingrats);
    // rats bite
    if (p.rats > 0) {
      const bite = 2 + (hasRelic(st, 'ribbon') ? 1 : 0) + (p.powers.kingrats ? 1 : 0);
      st.fx.push({ t: 'ratsBite', n: p.rats });
      for (let i = 0; i < p.rats; i++) {
        const al = alive(st); if (!al.length) break;
        const e = G.rng.pick(al);
        let dm = bite;
        if (e.crack > 0) dm = Math.floor(dm * (hasRelic(st, 'brokenmirror') ? 1.75 : 1.5));
        if (G.ENEMIES[e.id].passive === 'swarm') dm += 2;
        damageEnemy(st, e, dm, 'rat');
        if (st.result) return;
      }
    }
    // resonance ticks
    for (const e of alive(st)) {
      if (e.res > 0) {
        const dm = e.res;
        e.res -= 1;
        // resonance bypasses block
        const idx = st.enemies.indexOf(e);
        e.hp -= dm; st.stats.turnDmg += dm; st.stats.totalDmg += dm;
        let kill = false;
        if (e.hp <= 0) {
          if (e.id === 'dummy') e.hp = e.maxHp;
          else if (G.ENEMIES[e.id].passive === 'ninelives' && !e.revived) { e.revived = true; e.hp = 45; e.block = 0; e.crack = 0; e.res = 0; st.fx.push({ t: 'hit', side: 'e', idx, dmg: dm, blocked: 0, hp: 0, max: e.maxHp, src: 'res' }); st.fx.push({ t: 'revive', idx, hp: 45 }); continue; }
          else { e.hp = 0; e.alive = false; kill = true; }
        }
        st.fx.push({ t: 'hit', side: 'e', idx, dmg: dm, blocked: 0, hp: e.hp, max: e.maxHp, block: e.block, src: 'res', kill });
        if (kill) { st.fx.push({ t: 'death', idx }); checkEnd(st); if (st.result) return; }
      }
    }
    if (st.stats.turnDmg > st.stats.maxTurnDmg) st.stats.maxTurnDmg = st.stats.turnDmg;
    // player plague
    if (p.plague > 0) { const dm = p.plague; p.plague -= 1; hurtPlayer(st, dm, 'plague'); st.fx.push({ t: 'status', side: 'p', key: 'plague', n: -1, total: p.plague }); if (st.result) return; }
    // off-key cards in hand burn
    const keep = []; const gone = [];
    for (const c of st.hand) {
      const kw = G.cardKw(c);
      if (c.id === 'offkey') { hurtPlayer(st, 2, 'offkey'); st.exhaust.push(c); gone.push(c.uid); if (st.result) return; continue; }
      if (kw.has('retain')) { keep.push(c); continue; }
      st.discard.push(c); gone.push(c.uid);
    }
    st.hand = keep;
    for (const c of st.hand) c.tmpZero = false;
    for (const c of st.discard) c.tmpZero = false;
    st.fx.push({ t: 'discardHand', uids: gone });
    // save breath
    const cap = G.SAVE_CAP + (hasRelic(st, 'hourglass') ? 2 : 0);
    p.saved = Math.min(p.breath, cap);
    p.breath = 0;
    // relics at turn end (after the hand is gone)
    for (const id of st.run.relics) { const r = G.RELICS[id]; if (r && r.onTurnEnd) r.onTurnEnd(relicCtx(st, id)); }
    // player debuffs tick (裂 ticks after the enemy turn instead, so it always matters once)
    if (p.trem > 0) p.trem -= 1;
    st.stats.turnDmg = 0;
    if (checkEnd(st)) return;

    enemyTurn(st);
    if (st.result) return;
    startPlayerTurn(st, false);
  };

  function enemyTurn(st) {
    st.fx.push({ t: 'enemyTurn' });
    const crackBefore = st.p.crack;
    const list = st.enemies.slice();
    for (const e of list) {
      if (!e.alive || st.result) continue;
      if (e.fresh) { e.fresh = false; continue; }
      e.block = 0;
      const d = G.ENEMIES[e.id];
      const key = e.intentKey;
      const m = d.moves[key];
      const idx = st.enemies.indexOf(e);
      st.fx.push({ t: 'enemyMove', idx, key, label: (m && m.intent && m.intent.label) || '' });
      if (m) m.run(enemyCtx(st, e));
      e.turn += 1; e.last2 = e.last; e.last = key;
      if (d.passive === 'dance') { e.str += 1; st.fx.push({ t: 'status', side: 'e', idx, key: 'str', n: 1, total: e.str }); }
      if (e.crack > 0) e.crack -= 1;
      if (e.trem > 0) e.trem -= 1;
      if (st.result) return;
    }
    // 裂 on you: stacks you already had are used up by this enemy turn; fresh stacks wait for the next one
    if (crackBefore > 0 && st.p.crack > 0) { st.p.crack -= 1; st.fx.push({ t: 'status', side: 'p', key: 'crack', n: -1, total: st.p.crack }); }
    // ally weakens
    if (st.ally) {
      st.ally.breath -= 1;
      st.fx.push({ t: 'allyBreath', breath: st.ally.breath });
      if (st.ally.breath <= 0) { st.result = 'lose'; st.loseReason = 'song'; st.fx.push({ t: 'lose', reason: 'song' }); return; }
    }
    for (const e of st.enemies) if (e.alive) chooseIntent(st, e);
  }

  function enemyCtx(st, e) {
    const idx = st.enemies.indexOf(e);
    return {
      st, e, rng: G.rng,
      atk(base, hits = 1) {
        for (let i = 0; i < hits; i++) {
          if (st.result || !e.alive) return;
          let dm = enemyHitDamage(st, e, base);
          if (e.sleep) { const boss = G.ENEMIES[e.id].boss; dm = boss ? Math.floor(dm / 2) : 0; }
          st.fx.push({ t: 'enemyAttack', idx, hit: i, hits });
          hurtPlayer(st, dm, 'attack', idx);
        }
        if (e.sleep) { e.sleep = 0; st.fx.push({ t: 'status', side: 'e', idx, key: 'sleep', n: -1, total: 0 }); }
      },
      block(n) { e.block += n; st.fx.push({ t: 'block', side: 'e', idx, amount: n, total: e.block }); },
      blockAll(n) { for (const o of alive(st)) { o.block += n; st.fx.push({ t: 'block', side: 'e', idx: st.enemies.indexOf(o), amount: n, total: o.block }); } },
      buff(key, n) { e[key] = (e[key] || 0) + n; st.fx.push({ t: 'status', side: 'e', idx, key, n, total: e[key] }); },
      buffAll(key, n) { for (const o of alive(st)) { o[key] = (o[key] || 0) + n; st.fx.push({ t: 'status', side: 'e', idx: st.enemies.indexOf(o), key, n, total: o[key] }); } },
      debuff(key, n) {
        if (key === 'plague' && hasRelic(st, 'lavender')) n = Math.max(0, n - 1);
        if (n <= 0) return;
        st.p[key] = (st.p[key] || 0) + n;
        st.fx.push({ t: 'status', side: 'p', key, n, total: st.p[key] });
      },
      summon(id, count) {
        for (let i = 0; i < count; i++) {
          if (alive(st).length >= 4) break;
          const ne = addEnemy(st, id, true);
          chooseIntent(st, ne);
          st.fx.push({ t: 'summon', idx: st.enemies.length - 1, id });
        }
      },
      addCard(id, where, n) {
        for (let i = 0; i < n; i++) {
          const c = G.cloneCard(G.newCard(id));
          if (where === 'hand' && st.hand.length < G.HAND_MAX) st.hand.push(c);
          else if (where === 'draw') st.draw.splice(G.rng.int(0, st.draw.length), 0, c);
          else st.discard.push(c);
        }
        st.fx.push({ t: 'addCard', id, where, n });
      },
      heal(n) { const b = e.hp; e.hp = Math.min(e.maxHp, e.hp + n); if (e.hp > b) st.fx.push({ t: 'heal', side: 'e', idx, amount: e.hp - b, hp: e.hp }); },
      healWeakest(n) {
        const al = alive(st).sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp);
        const o = al[0]; if (!o) return;
        const b = o.hp; o.hp = Math.min(o.maxHp, o.hp + n);
        if (o.hp > b) st.fx.push({ t: 'heal', side: 'e', idx: st.enemies.indexOf(o), amount: o.hp - b, hp: o.hp });
      },
      knot(n) { knotCards(st, n); },
      steal(n) {
        if (st.practice) return;
        const take = Math.min(st.run.gold, n); st.run.gold -= take;
        if (take > 0) st.fx.push({ t: 'steal', amount: take, idx });
      },
      eatRats(n) { st.p.rats = Math.max(0, st.p.rats - n); st.fx.push({ t: 'eatRats', n, total: st.p.rats, idx }); },
      say(text) { st.fx.push({ t: 'say', idx, text }); },
    };
  }

  // knots land on the cards you are about to draw (the draw pile is drawn from its end)
  function knotCards(st, n) {
    const ok = (c) => !G.cardKw(c).has('unplayable');
    const pick = [];
    for (let i = st.draw.length - 1; i >= 0 && pick.length < n; i--) if (ok(st.draw[i])) pick.push(st.draw[i]);
    if (pick.length < n) pick.push(...G.rng.shuffle(st.discard.filter(ok)).slice(0, n - pick.length));
    for (const c of pick) c.knots = (c.knots || 0) + 1;
    st.fx.push({ t: 'knot', uids: pick.map((c) => c.uid), n: pick.length });
  }

  // ---------------- relic & potion context ----------------
  function relicCtx(st, id) {
    return {
      st, p: st.p, run: st.run,
      turnFlag(k) { return !!st.flags.turn[k]; },
      setTurnFlag(k) { st.flags.turn[k] = 1; },
      gainBreath(n) { gainBreath(st, n); },
      draw(n) { drawCards(st, n); },
      block(n) { gainBlock(st, n); },
      damageAll(n) { for (const e of alive(st)) damageEnemy(st, e, n, 'relic', true); },
      addRats(n) { addRats(st, n); },
      selfStatus(key, n) { st.p[key] = (st.p[key] || 0) + n; st.fx.push({ t: 'status', side: 'p', key, n, total: st.p[key] }); },
      addCardTo(cid, where, n) { enemyCtx(st, { id: 'dummy', alive: true, sleep: 0 }).addCard(cid, where, n); },
      heal(n) { healPlayer(st, n); },
      statusAll(key, n) { for (const e of alive(st)) applyEnemyStatus(st, e, key, n); },
      wildTopDraw() { const c = st.draw[st.draw.length - 1]; if (c) { c.tmpWild = true; st.fx.push({ t: 'relic', id }); } },
      cleanse() { st.p.plague = 0; st.p.mute = 0; st.fx.push({ t: 'status', side: 'p', key: 'plague', n: 0, total: 0 }); },
      flash() { st.fx.push({ t: 'relic', id }); },
    };
  }
  G.relicCtx = relicCtx;

  G.usePotion = function (st, slot, targetIdx) {
    const pid = st.run.potions[slot];
    if (!pid || st.result) return false;
    const pd = G.POTIONS[pid];
    st.run.potions[slot] = null;
    st.fx.push({ t: 'potion', id: pid });
    pd.use(relicCtx(st, 'potion:' + pid));
    checkEnd(st);
    return true;
  };

  function checkEnd(st) {
    if (st.result) return true;
    if (st.practice) return false;
    if (st.p.hp <= 0) { st.result = 'lose'; st.fx.push({ t: 'lose' }); return true; }
    if (st.enemies.length && alive(st).length === 0) { st.result = 'win'; st.fx.push({ t: 'win' }); return true; }
    return false;
  }
  G.checkEnd = checkEnd;

  // ---------------- snapshots ----------------
  G.snapCombat = function (st) {
    const o = {};
    for (const k in st) if (k !== 'run' && k !== 'fx') o[k] = st[k];
    return JSON.parse(JSON.stringify(o));
  };
  G.restoreCombat = function (run, snap) {
    const st = JSON.parse(JSON.stringify(snap));
    st.run = run; st.fx = [];
    return st;
  };

  // sync back to run after combat
  G.finishCombat = function (st) {
    const run = st.run;
    run.hp = Math.max(0, st.p.hp);
    if (st.result === 'win') {
      for (const id of run.relics) { const r = G.RELICS[id]; if (r && r.onVictory) r.onVictory(run); }
    }
    // records
    run.stats = run.stats || { maxChain: 0, maxHit: 0, maxTurnDmg: 0, maxCards: 0 };
    run.stats.maxChain = Math.max(run.stats.maxChain, st.stats.maxChain);
    run.stats.maxHit = Math.max(run.stats.maxHit, st.stats.maxHit);
    run.stats.maxTurnDmg = Math.max(run.stats.maxTurnDmg, st.stats.maxTurnDmg);
    run.stats.maxCards = Math.max(run.stats.maxCards, st.stats.maxCards);
  };
})();

/* ---- run.js ---- */
/* 笛聲不停 — run: meta, map, encounters, rewards, shop */
(function () {
  const G = globalThis.G;

  // ---------------- meta (persistent) ----------------
  const META_KEY = 'piperRound.meta.v1';
  const RUN_KEY = 'piperRound.run.v1';
  G.defaultMeta = () => ({
    v: 1, runs: 0, wins: 0, deaths: 0,
    truths: {}, endings: {}, seen: {},
    records: { maxChain: 0, maxHit: 0, maxTurnDmg: 0, maxCards: 0 },
    milestones: {},
    settings: { sfx: 0.8, music: 0.45, speed: 1, tap: 'double' },
    tips: {}, introSeen: false,
  });
  G.loadMeta = () => {
    const m = G.store.get(META_KEY, null);
    const d = G.defaultMeta();
    if (!m) return d;
    for (const k in d) if (m[k] === undefined) m[k] = d[k];
    for (const k in d.settings) if (m.settings[k] === undefined) m.settings[k] = d.settings[k];
    for (const k in d.records) if (m.records[k] === undefined) m.records[k] = d.records[k];
    return m;
  };
  G.saveMeta = () => G.store.set(META_KEY, G.meta);
  G.loadRun = () => G.store.get(RUN_KEY, null);
  G.saveRun = () => {
    if (!G.run || G.run.practice) return;
    G.run.rngState = G.rng.state;
    G.store.set(RUN_KEY, G.run);
  };
  G.clearRun = () => { G.store.del(RUN_KEY); G.run = null; };

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const lines = [10, 18, 26, 34, 42].map((y) => `<line x1="2" x2="${W - 2}" y1="${y}" y2="${y}" stroke="rgba(233,220,198,.28)" stroke-width="1"/>`).join('');
    const maxN = Math.max(4, Math.floor((W - 26) / 17));
    const notes = CB.notes.slice(-maxN);
    const n0 = CB.notes.length - notes.length;
    const g = notes.map((n, i) => {
      const x = 22 + i * 17;
      if (n.brk) return `<path d="M${x - 8} 4 L${x - 3} 20 L${x - 9} 30 L${x - 2} 48" stroke="#ff7b8a" stroke-width="2" fill="none"/>`;
      if (n.mod) return `<text x="${x - 6}" y="9" font-size="9" fill="#d7b8ff" font-family="serif">8va</text>`;
      if (n.rest) return `<path d="M${x - 2} 16 l5 6 -5 6 5 6 -4 5" stroke="#9fd4ff" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
      const p = (n.step - 1) % 9; const y = 45 - p * 4;
      const hue = COST_HUE[Math.min(5, n.cost)];
      const oct = Math.floor((n.step - 1) / 9);
      const glow = oct > 0 ? `filter="url(#nglow)"` : '';
      return `<g ${glow}><ellipse cx="${x}" cy="${y}" rx="5.6" ry="4.2" transform="rotate(-18 ${x} ${y})" fill="hsl(${hue},80%,${60 + Math.min(20, oct * 6)}%)" stroke="#0f0b14" stroke-width="1.4"/><line x1="${x + 5}" y1="${y}" x2="${x + 5}" y2="${y - 16}" stroke="#e9dcc6" stroke-width="1.3"/>${y > 42 ? `<line x1="${x - 8}" x2="${x + 8}" y1="${50}" y2="${50}" stroke="rgba(233,220,198,.4)"/>` : ''}</g>`;
    }).join('');

  // ---------------- resume ----------------

  // ---------------- map ----------------
  App.map = function () {
    const run = G.run;
    const m = run.map; const ch = G.CHAPTERS[run.chapter];
    const reach = new Set(G.reachable(run));
    const scr = U.h(`<div class="screen"><canvas class="bgc"></canvas>${App.hudHTML()}
      <div class="chapterline"><div class="t"><i>${ch.roman}</i>${ch.name}</div></div>

      <div class="mapfoot">${run.pos ? '選擇下一站' : ({ 1: '從哪條巷子開始？', 2: '從廣場的哪一邊開始？', 3: '先走到東門', 4: '往笛聲走' }[run.chapter] || '選擇下一站')}<div class="legend">${[['fight', '戰鬥'], ['elite', '險惡'], ['event', '事件'], ['shop', '行商'], ['rest', '酒館'], ['treasure', '寶箱']].map(([k, n]) => `<span><img alt="" src="${U.nodeURL(k, 18)}">${n}</span>`).join('')}</div></div>
    </div>`);
    App.show(scr);
    App.bindHud(scr, () => App.map());
    requestAnimationFrame(() => {
      U.paintBackdrop(U.$('.bgc', scr), 'map', { seed: run.chapter * 7 + 1 });
      const view = U.$('.mapview', scr); const inner = U.$('.mapinner', scr);
      const W = Math.min(view.clientWidth, 520); const rows = m.rows + 1; const rowH = run.chapter === 4 ? 120 : 86;
      const H = rows * rowH + 170;
      inner.style.width = W + 'px'; inner.style.height = H + 'px';
      const pos = {};
      const rng = G.makeRng(run.seed + run.chapter);
      for (const n of Object.values(m.nodes)) {
        const padX = 46; const x = n.id === 'boss' ? W / 2 : padX + (n.lane / 3) * (W - padX * 2) + (rng.next() - 0.5) * 18;
        const y = H - 60 - n.row * rowH + (n.id === 'boss' ? -10 : (rng.next() - 0.5) * 14);
        pos[n.id] = [x, y];
      }
      const cv = U.$('canvas', inner); const dpr = Math.min(2, devicePixelRatio || 1);
      cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
      const x = cv.getContext('2d'); x.scale(dpr, dpr);
      // paths
      const visited = new Set(run.visited || []);
      for (const n of Object.values(m.nodes)) for (const nx of n.next) {
        const a = pos[n.id], b = pos[nx]; if (!a || !b) continue;
        const onPath = (visited.has(n.id) && (visited.has(nx) || (run.pos === n.id && reach.has(nx))));
        x.strokeStyle = '#0a0710'; x.lineWidth = 7; x.lineCap = 'round';
        x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke();
        x.strokeStyle = onPath ? 'rgba(242,196,92,.9)' : 'rgba(170,150,200,.35)'; x.lineWidth = onPath ? 3 : 2; x.setLineDash(onPath ? [] : [5, 6]);
        x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); x.setLineDash([]);
      }
      for (const n of Object.values(m.nodes)) {
        const [px, py] = pos[n.id];
        const done = visited.has(n.id);
        const cls = ['node', n.id === 'boss' ? 'boss' : '', reach.has(n.id) ? 'reach' : '', done ? 'done' : '', run.pos === n.id ? 'cur' : '', (!reach.has(n.id) && !done && n.row <= (run.pos ? m.nodes[run.pos].row : -1)) ? 'far' : ''].join(' ');
        const type = n.type === 'boss' ? 'boss' : n.type;
        const b = U.h(`<button class="${cls}" style="left:${px}px;top:${py}px" data-node="${n.id}" aria-label="${App.nodeName(type)}"><img alt="" src="${U.nodeURL(type, n.id === 'boss' ? 86 : 50)}"></button>`);
        inner.appendChild(b);
      }
      // scroll to current
      const cy = run.pos ? pos[run.pos][1] : H - 60;
      view.scrollTop = Math.max(0, cy - view.clientHeight * 0.7);
      App.idlePrerender(run.chapter);
    });
    scr.addEventListener('click', (e) => {
      const b = e.target.closest('[data-node]'); if (!b) return;
      const id = b.dataset.node;
      if (!reach.has(id)) { const n = run.map.nodes[id]; U.toast(`${App.nodeName(n.type)}：還走不到那裡`); return; }
      A().click();
      App.enterNode(id);
    });
  };
  App.idlePrerender = function (ch) {
    const tab = G.ENCOUNTERS[ch]; if (!tab) return;
    if (App.prerendered === ch) return; App.prerendered = ch;
    const jobs = [].concat(tab.easy, tab.normal, tab.elite, [tab.boss]);
    const idle = globalThis.requestIdleCallback || ((f) => setTimeout(() => f({ timeRemaining: () => 8 }), 60));
    let i = 0;
    const step = () => {
      if (i >= jobs.length || G.CombatUI.st && U.$('#combat')) return;
      try { G.CombatUI.prerender(jobs[i]); } catch (e) { /* ignore */ }
      i++; idle(step, { timeout: 1200 });
    };
    idle(step, { timeout: 1200 });
  };
  App.nodeName = (t) => ({ fight: '戰鬥', elite: '險惡', event: '事件', shop: '行商', rest: '酒館', treasure: '寶箱', boss: '首領', gate: '東門', sleepers: '沉睡的孩子們', oldpiper: '吹笛人' }[t] || t);

  App.enterNode = function (id, resumed) {
    const run = G.run; const n = run.map.nodes[id];
    if (!resumed) {
      run.pos = id; run.visited = run.visited || []; if (!run.visited.includes(id)) run.visited.push(id);

      run.pending = { node: id, type: n.type };

    if (t === 'fight' || t === 'elite') return App.fight(t);

    if (t === 'gate') { run.pending.eventId = 'gate'; App.save(); return App.event('gate'); }

  };

    const t = G.meta.truths;

      { d: S.arch(0, 0, 124, 200), c: [262, 22, 14], spacing: 18, jl: 10 },
      { d: S.arch(7, 7, 110, 186), c: [240, 30, 20], pied: [[240, 34, 18], [262, 30, 20], [210, 34, 22], [280, 26, 18]], spacing: 15 },
    ];
    const slots = G.TRUTHS.map((td, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      return { td, x: 13 + col * 34, y: 62 + row * 43, w: 30, h: 39 };
    });
    for (const sl of slots) {
      const found = !!t[sl.td.key];
      const hue = sl.td.hue;
      parts.push(found
        ? { d: S.arch(sl.x, sl.y, sl.w, sl.h), c: [hue, 60, 46], pied: [[hue, 66, 46], [hue + 24, 56, 50], [hue - 20, 60, 40], [(hue + 180) % 360, 40, 54]], spacing: 9, edge: 2.6 }
        : { d: S.arch(sl.x, sl.y, sl.w, sl.h), c: [250, 8, 22], spacing: 9, edge: 2.6, jl: 8 });
    }
    parts.push({ d: S.E(62, 34, 21, 21), c: t.end ? [44, 90, 62] : [220, 30, 30], pied: t.end ? [[44, 90, 64], [200, 70, 70], [352, 70, 60], [140, 50, 56]] : null, spacing: 7, emit: !!t.end });
    const rend = G.renderGlass({ w: 124, h: 200, pad: 8, parts, glow: [44, 80, 58], seed: 777 }, h, { lead: 1.5 });
    const W = rend.cssW; const wrap = document.createElement('div'); wrap.className = 'winwrap'; wrap.style.width = W + 'px'; wrap.style.height = rend.cssH + 'px';
    const cv = U.cloneCanvas(rend.canvas); wrap.appendChild(cv);
    const x = cv.getContext('2d'); const k = rend.k; const pad = rend.pad;
    for (const sl of slots) {
      const found = !!t[sl.td.key];
      if (found) {
        const em = G.renderGlass(G.emblemFig(sl.td.icon, [sl.td.hue, 80, 76]), sl.w * rend.scale * 1.1, { lead: 0.9, haloA: 0.9 });
        const ew = em.canvas.width, eh = em.canvas.height; const sc = (sl.w * k * 1.05) / ew;
        x.drawImage(em.canvas, (pad + sl.x + sl.w / 2) * k - ew * sc / 2, (pad + sl.y + sl.h * 0.58) * k - eh * sc / 2, ew * sc, eh * sc);
      } else {
        // crack lines on dark glass
        x.save(); x.strokeStyle = 'rgba(220,210,240,.35)'; x.lineWidth = 1.2 * rend.dpr;
        const cx = (pad + sl.x + sl.w / 2) * k, cy = (pad + sl.y + sl.h * 0.55) * k;

      }
      const b = U.h(`<button class="winpane" data-truth="${sl.td.key}" aria-label="${found ? sl.td.title : '未找回的碎片'}" style="left:${(pad + sl.x) * rend.scale}px;top:${(pad + sl.y) * rend.scale}px;width:${sl.w * rend.scale}px;height:${sl.h * rend.scale}px"></button>`);
      if (sl.td.kp && !found) b.innerHTML = '<span style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gold);letter-spacing:.1em">關鍵</span>';
      wrap.appendChild(b);
    }

    return wrap;

      <div class="setrow"><span>出牌</span><div class="seg" id="sTap">${[['double', '點兩下'], ['single', '點一下']].map(([v, n]) => `<button data-v="${v}" class="${s.tap === v ? 'on' : ''}">${n}</button>`).join('')}</div></div>
      <div class="note-s">「點一下」適合想打得飛快的時候；「點兩下」可以先看清楚倍率再出。</div>
      <button class="btn ghost small" id="sReset" style="color:#ff9c9c">清除所有紀錄</button>
      <div class="row"><button class="btn gold" onclick="G.UI.closeOverlay()">完成</button></div>
      <div class="note-s" style="opacity:.7">${App.buildLine()}</div>`);
    U.$('#sSfx', p).addEventListener('input', (e) => { s.sfx = +e.target.value; A().setVolumes(s.sfx, s.music); G.saveMeta(); });
    U.$('#sMus', p).addEventListener('input', (e) => { s.music = +e.target.value; A().setVolumes(s.sfx, s.music); G.saveMeta(); });
    p.addEventListener('click', async (e) => {
      const sp = e.target.closest('#sSpd button'); if (sp) { s.speed = +sp.dataset.v; G.saveMeta(); U.$$('#sSpd button', p).forEach((b) => b.classList.toggle('on', b === sp)); }
      const tp = e.target.closest('#sTap button'); if (tp) { s.tap = tp.dataset.v; G.saveMeta(); U.$$('#sTap button', p).forEach((b) => b.classList.toggle('on', b === tp)); }
      if (e.target.closest('#sReset')) {
        if (await U.confirm('清除彩窗、結局與所有紀錄？這無法復原。', '清除')) {
          if (G.CombatUI.practice) G.CombatUI.exitPractice(); else if (U.$('#combat')) G.CombatUI.abort();
          G.meta = G.defaultMeta(); G.saveMeta(); G.clearRun(); App.title();
        }
      }
    });
  };

  // ---------------- practice room ----------------
  App.practice = function () {
    const P = (App.prac = App.prac || { counts: {}, breath: 5, draw: 5, relics: { fatherflute: 1 } });
    if (!Object.keys(P.counts).length) G.STARTER.forEach((id) => (P.counts[id] = (P.counts[id] || 0) + 1));
    const ids = Object.values(G.CARDS).filter((c) => !['status', 'curse'].includes(c.type)).map((c) => c.id);
    const relicIds = ['fatherflute', 'pipe13', 'clapper', 'silentbell', 'twinpipe', 'brassbell', 'marble', 'glassheart', 'falsepipe', 'hourglass'];
    const scr = U.h(`<div class="screen"><canvas class="bgc"></canvas><div class="page"><div class="page-in">
      <div style="display:flex;align-items:center"><button class="iconbtn" id="pBack" aria-label="返回">${U.I.back}</button><h2 class="ev-title" style="flex:1;padding-right:36px"><small>對著稻草靶練連奏</small>試奏室</h2></div>
      <div class="row" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn small" data-pre="starter">起始牌組</button><button class="btn small" data-pre="loop">無限轉調</button><button class="btn small" data-pre="rats">鼠群流</button><button class="btn small" data-pre="res">共鳴流</button><button class="btn small ghost" data-pre="clear">清空</button>
      </div>
      <div class="setrow"><span>每回合氣息</span><span class="stepper"><button data-st="breath" data-d="-1">−</button><b id="pBr">${P.breath}</b><button data-st="breath" data-d="1">＋</button></span></div>
      <div class="setrow"><span>每回合抽牌</span><span class="stepper"><button data-st="draw" data-d="-1">−</button><b id="pDr">${P.draw}</b><button data-st="draw" data-d="1">＋</button></span></div>
      <div class="sect"><h3>信物</h3><div class="ms-row">${relicIds.map((id) => `<button class="ms ${P.relics[id] ? 'on' : ''}" data-rl="${id}">${G.RELICS[id].name}</button>`).join('')}</div></div>
      <div class="sect"><h3>牌組（<span id="pCnt">0</span> 張）</h3><div class="prac-list" id="pList"></div></div>
      <button class="btn gold" id="pGo" style="position:sticky;bottom:8px">開始試奏</button>
    </div></div></div>`);
    App.show(scr);
    requestAnimationFrame(() => U.paintBackdrop(U.$('.bgc', scr), 'event', { seed: 91 }));
    const list = U.$('#pList', scr);
    const render = () => {
      list.innerHTML = '';
      ids.forEach((id) => {
        const it = U.h(`<div class="prac-item"></div>`);
        it.appendChild(U.cardEl(G.newCard(id)));
        it.appendChild(U.h(`<span class="stepper"><button data-c="${id}" data-d="-1">−</button><b>${P.counts[id] || 0}</b><button data-c="${id}" data-d="1">＋</button></span>`));
        list.appendChild(it);
      });
      U.$('#pCnt', scr).textContent = Object.values(P.counts).reduce((a, b) => a + b, 0);
    };
    render();
    const presets = {
      starter: () => { P.counts = {}; G.STARTER.forEach((id) => (P.counts[id] = (P.counts[id] || 0) + 1)); },
      loop: () => { P.counts = { dacapo: 2, breathctl: 1, shard: 1, piccolo: 1, endless: 1, circular: 1, fifth: 1, chord: 1, longnote: 1 }; P.relics = { fatherflute: 1, pipe13: 1 }; },
      rats: () => { P.counts = { summon: 2, ratbite: 2, swarmup: 1, ratwall: 1, rattide: 1, kingrats: 1, breath: 1, piccolo: 1, improv: 1 }; },
      res: () => { P.counts = { resonate: 2, glasssong: 1, drone: 1, shatter: 2, breath: 1, piccolo: 1, improv: 1, trill: 1 }; },
      clear: () => { P.counts = {}; },
    };
    scr.addEventListener('click', (e) => {
      const t = e.target;
      if (t.closest('#pBack')) return App.title();
      const pre = t.closest('[data-pre]'); if (pre) { presets[pre.dataset.pre](); return App.practice(); }
      const c = t.closest('[data-c]'); if (c) { const id = c.dataset.c; P.counts[id] = G.clamp((P.counts[id] || 0) + +c.dataset.d, 0, 4); if (!P.counts[id]) delete P.counts[id]; render(); return; }
      const s = t.closest('[data-st]'); if (s) { const k = s.dataset.st; P[k] = G.clamp(P[k] + +s.dataset.d, k === 'breath' ? 1 : 1, k === 'breath' ? 12 : 10); U.$('#pBr', scr).textContent = P.breath; U.$('#pDr', scr).textContent = P.draw; return; }
      const rl = t.closest('[data-rl]'); if (rl) { const id = rl.dataset.rl; if (P.relics[id]) delete P.relics[id]; else P.relics[id] = 1; rl.classList.toggle('on', !!P.relics[id]); return; }
      if (t.closest('#pGo')) {
        A().init(); A().click();
        const deck = []; for (const id in P.counts) for (let i = 0; i < P.counts[id]; i++) deck.push(G.newCard(id));
        if (!deck.length) { U.toast('牌組是空的'); return; }
        const fake = { practice: true, hp: 999, maxHp: 999, gold: 0, deck, relics: Object.keys(P.relics), potions: [null, null, null], bag: [], chapter: 0, stats: {}, flags: {} };
        const realRun = G.run; G.run = fake;
        G.rng = G.makeRng((Date.now() >>> 0));
        G.CombatUI.start(['dummy'], { practice: true, practiceBreath: P.breath, practiceDraw: P.draw }, () => { G.run = realRun; App.practice(); });
        G.CombatUI.restoreRun = realRun;
      }
    });
  };
})();

/* ---- main.js ---- */
/* 笛聲不停 — boot */
(function () {
  const G = globalThis.G;
  const U = G.UI;

  // Installed web app: size the app to exactly what the screen shows (never more), and keep it in sync.
  G.isStandalone = function () {
    try { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches; } catch (e) { return false; }
  };
  G.safeInsets = function () {
    try {
      const p = document.createElement('div');
      p.style.cssText = 'position:fixed;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
      document.body.appendChild(p); const cs = getComputedStyle(p); const v = [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingBottom) || 0]; p.remove(); return v;
    } catch (e) { return [0, 0]; }
  };
  function fitScreen() {
    const de = document.documentElement;
    if (!G.isStandalone()) { de.style.removeProperty('--appH'); return; }
    const h = window.innerHeight;
    const was = de.style.getPropertyValue('--appH');
    de.style.setProperty('--appH', h + 'px');
    if (was !== h + 'px') { try { G.FX && G.FX.resize(); } catch (e) { /* ignore */ } }
  }
  G.fitScreen = fitScreen;

  function boot(data) {
    fitScreen();
    globalThis.addEventListener('resize', fitScreen);
    globalThis.addEventListener('orientationchange', () => setTimeout(fitScreen, 250));
    setTimeout(fitScreen, 400); setTimeout(fitScreen, 1500);
    G.meta = G.loadMeta();
    G.Audio.vols = { sfx: G.meta.settings.sfx, music: G.meta.settings.music };
    G.FX.init(document.getElementById('fx'), document.getElementById('fxText'));
    U.watchCards(document.getElementById('app'));
    // unlock audio on the very first touch anywhere
    const unlock = () => { G.Audio.init(); G.Audio.setVolumes(G.meta.settings.sfx, G.meta.settings.music); };
    document.addEventListener('pointerdown', unlock, { once: true, capture: true });
    // pre-render common art in idle time
    const idle = globalThis.requestIdleCallback || ((f) => setTimeout(f, 200));
    idle(() => { try { U.figCanvas('hero', Math.round(Math.min(innerHeight * 0.36, 300))); } catch (e) { /* ignore */ } });
    // hot-reload snapshot (viewer updates)
    try {
      if (globalThis.claude && globalThis.claude.hot && globalThis.claude.hot.snapshot) {
        globalThis.claude.hot.snapshot(() => ({ run: G.run && !G.run.practice ? JSON.parse(JSON.stringify(G.run)) : null }));
      }
    } catch (e) { /* ignore */ }
    if (data && data.run) { G.restoreRun(data.run); G.saveRun(); }
    G.App.title();
  }

  globalThis.addEventListener('error', (e) => {
    try {
      const t = document.getElementById('toast');
      if (t && !t.dataset.err) { t.dataset.err = '1'; G.UI.toast('出了點小狀況，已自動存檔。若畫面卡住，回到標題再按「繼續這一夜」。'); setTimeout(() => delete t.dataset.err, 4000); }
      if (G.run && !G.run.practice) G.saveRun();
    } catch (x) { /* ignore */ }
  });

  const start = (d) => { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot(d)); else boot(d); };
  const hot = globalThis.claude && globalThis.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
