:root{
  /* layout: one narrow street-wall column — mural on top, paste wall in the middle, hand of posters at the bottom */
  --ink:#0b0710; --wall:#140d1c; --wall-2:#1f1529; --panel:#1a1222; --paper:#efe6d6; --fg:#f4ecff; --muted:#b9abcc;
  --violet:#b14bff; --magenta:#ff2fd1; --cyan:#2ef2ff; --lemon:#ffe14a; --hazard:#ff7a1a; --buff:#8f8b97; --danger:#ff3b5c;
  --p-r:#ff2d3d; --p-b:#2d7bff; --p-y:#ffd21f;
  --f-display:"DCBlack","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"DCBody","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-num:"DCLatinI","DCLatin","Arial Black",Impact,sans-serif;
  --f-serif:"DCSerif","Noto Serif TC","Songti TC",serif;
  color-scheme: dark;
}
html{height:100%;box-sizing:border-box;background:var(--wall);overscroll-behavior:none}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--wall);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--wallimg,none);background-size:320px auto;opacity:.9}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 45% at 12% 0%,rgba(255,47,209,.20),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(46,242,255,.14),transparent 70%),radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.6))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.hcard:focus-visible,.lane:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-inline:16px}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}

/* ---------- loading ---------- */
#loading{align-items:center;justify-content:center;gap:14px;text-align:center;z-index:5}
.ld-logo{font-family:var(--f-display);font-size:min(26vw,120px);line-height:1;letter-spacing:-.04em;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 0 0 var(--ink),6px 8px 0 var(--ink),0 0 26px rgba(255,47,209,.8);transform:rotate(-4deg)}
.ld-sub{font-family:var(--f-num);font-size:22px;letter-spacing:.18em;color:var(--cyan);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.ld-bar{width:min(70vw,260px);height:14px;border:3px solid var(--ink);background:#2a1e33;border-radius:8px;overflow:hidden;box-shadow:0 0 0 2px var(--magenta)}
.ld-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--magenta) 0 10px,#ff7ae6 10px 20px);transition:width .25s}
.ld-txt{color:var(--muted);font-size:14px}

/* ---------- shared bits ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(11,7,16,.78);border:2px solid rgba(255,255,255,.14);font-size:13px;white-space:nowrap}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-family:var(--f-display);font-size:17px;letter-spacing:.04em;color:#fff;background:var(--ink);border:3px solid #fff;box-shadow:4px 5px 0 var(--ink),0 0 0 2px var(--magenta) inset;transition:transform .12s}
.btn:active{transform:translate(2px,3px) scale(.98);box-shadow:2px 2px 0 var(--ink),0 0 0 2px var(--magenta) inset}
.btn.primary{background:linear-gradient(180deg,#ff5ae4,#c21fd6);border-color:var(--ink);box-shadow:4px 5px 0 var(--ink),0 0 18px rgba(255,47,209,.55);transform:rotate(-1.5deg)}
.btn.primary:active{transform:rotate(-1.5deg) translate(2px,3px)}
.btn.ghost{background:rgba(11,7,16,.6);border-color:rgba(255,255,255,.6);box-shadow:3px 4px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:rgba(11,7,16,.7);border:2px solid rgba(255,255,255,.18)}
.icon-btn svg{width:22px;height:22px}
.wordmark{height:40px;display:block}

/* ---------- home / card showcase ---------- */
#home{gap:8px;padding-block:8px 12px}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.home-top .title-block{display:flex;align-items:center;gap:10px;min-width:0}
.home-top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-zone{position:relative;flex:1 1 auto;min-height:0;display:grid;place-items:center}
.hero{position:relative;width:var(--hw,300px);aspect-ratio:600/840;perspective:1100px;touch-action:none;max-width:100%}
.hero-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.9,.3,1.2)}
.hero.dragging .hero-in{transition:none}
.hface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
.hface.back{transform:rotateY(180deg)}
.hface canvas,.hface .clip{position:absolute;inset:0;width:100%;height:100%;display:block}
.hface .clip canvas{will-change:transform}
.hface .light,.hface .anim{mix-blend-mode:screen}
.hface .holo,.hface .glare{position:absolute;inset:0;pointer-events:none}
.hface .holo{background:linear-gradient(115deg,transparent 22%,rgba(255,60,220,.55) 34%,rgba(60,255,255,.5) 44%,rgba(255,255,90,.45) 54%,rgba(160,90,255,.5) 64%,transparent 76%);background-size:260% 260%;mix-blend-mode:color-dodge;opacity:.18}
.hface .glare{background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.55),rgba(255,255,255,0) 42%);mix-blend-mode:overlay;opacity:.6}

function costSplats(ctx, cost, r) {
  const keys = Object.keys(cost).filter(k => cost[k] > 0);
  let x = 66, y = 66;
  keys.forEach((k, i) => {
    const cx = x + i * 66, cy = y + i * 26;
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; G.splat(ctx, cx + 5, cy + 7, 36, 'rgba(0,0,0,0.5)', U.rng(r() * 1e6 | 0), { drops: 0 }); ctx.restore();
    G.splat(ctx, cx, cy, 36, '#0b0710', U.rng(77 + i), { drops: 8 });
    G.splat(ctx, cx, cy, 30, PAINT[k], U.rng(77 + i), { drops: 0 });
    ctx.save(); ctx.font = `64px ${G.F.latI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 12; ctx.strokeStyle = '#0b0710'; ctx.lineJoin = 'round'; ctx.strokeText(String(cost[k]), cx + 2, cy + 3);
    ctx.fillStyle = '#ffffff'; ctx.fillText(String(cost[k]), cx + 2, cy + 3); ctx.restore();
  });
}

function stickerBox(ctx, def, r, pal) {
  const x = 26, y = 640, w = 548, h = 178;

  const edge = G.tornRect(x, y, w, h, U.rng(def.seed + 3), 4, 10);
  ctx.save(); ctx.translate(7, 9); ctx.fillStyle = 'rgba(0,0,0,0.55)'; G.poly(ctx, edge); ctx.fill(); ctx.restore();
  ctx.lineWidth = 7; ctx.strokeStyle = '#0b0710'; G.poly(ctx, edge); ctx.stroke();
  ctx.save(); G.poly(ctx, edge); ctx.clip(); ctx.drawImage(G.paper(560, 200, def.seed, '#f5efe4', 0.1), x - 6, y - 6);
  ctx.fillStyle = U.rgba(pal.a, 0.16); ctx.fillRect(x, y, 10, h);
  ctx.restore();
  // tape
  ctx.save(); ctx.translate(x + 30, y - 6); ctx.rotate(-0.5); ctx.fillStyle = 'rgba(255,240,180,0.7)'; ctx.fillRect(-34, -11, 68, 22); ctx.restore();
  ctx.save(); ctx.translate(x + w - 28, y - 4); ctx.rotate(0.45); ctx.fillStyle = 'rgba(255,240,180,0.7)'; ctx.fillRect(-34, -11, 68, 22); ctx.restore();
  // rules
  let ty = y + 26; const left = x + 26, right = x + w - 22;
  ctx.textBaseline = 'top';
  for (const rule of def.rules) {
    ctx.font = `26px ${G.F.cjk}`; const kw = ctx.measureText(rule.k).width + 20;
    G.roundRect(ctx, left, ty - 3, kw, 34, 6); ctx.fillStyle = '#0b0710'; ctx.fill();

    ctx.fillText(rule.k, left + 10, ty);
    ctx.font = `24px ${G.F.body}`; ctx.fillStyle = '#1a1420';
    const lines = G.wrap(ctx, rule.t, right - left - kw - 12, right - left);
    lines.forEach((ln, i) => { ctx.fillText(ln, i === 0 ? left + kw + 12 : left, ty + 2 + i * 33); });
    ty += Math.max(1, lines.length) * 33 + 10;
  }
  if (def.flavor) { ctx.font = `20px ${G.F.serif}`; ctx.fillStyle = '#6b5f73'; ctx.textAlign = 'right'; ctx.fillText(def.flavor, right, Math.min(y + h - 32, Math.max(ty + 2, y + h - 40))); ctx.textAlign = 'left'; }
  ctx.restore();
}

function emblem(c, x, y, R, kind, col) {
  c.save(); c.translate(x, y); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.stroke();
  const s = R / 26;
  if (kind === 'bolt') { c.beginPath(); c.moveTo(3 * s, -17 * s); c.lineTo(-9 * s, 3 * s); c.lineTo(0, 3 * s); c.lineTo(-4 * s, 17 * s); c.lineTo(10 * s, -4 * s); c.lineTo(1 * s, -4 * s); c.closePath(); c.fill(); }
  else if (kind === 'eye') { c.beginPath(); c.moveTo(-15 * s, 0); c.quadraticCurveTo(0, -13 * s, 15 * s, 0); c.quadraticCurveTo(0, 13 * s, -15 * s, 0); c.stroke(); c.beginPath(); c.arc(0, 0, 5 * s, 0, Math.PI * 2); c.fill(); }
  else if (kind === 'bomb') { c.beginPath(); c.arc(-2 * s, 4 * s, 11 * s, 0, Math.PI * 2); c.fill(); c.beginPath(); c.moveTo(6 * s, -5 * s); c.quadraticCurveTo(12 * s, -14 * s, 16 * s, -12 * s); c.stroke(); }
  else if (kind === 'snow') { for (let i = 0; i < 3; i++) { c.rotate(Math.PI / 3); c.beginPath(); c.moveTo(0, -15 * s); c.lineTo(0, 15 * s); c.stroke(); } }
  else if (kind === 'rip') { c.beginPath(); c.moveTo(-6 * s, -16 * s); c.lineTo(2 * s, -6 * s); c.lineTo(-4 * s, 2 * s); c.lineTo(5 * s, 9 * s); c.lineTo(-1 * s, 16 * s); c.stroke(); }
  else if (kind === 'clean') { c.font = `${20 * s}px ${G.F.cjk}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('清', 0, 1 * s); }

const ART_CACHE = {};
// run a render generator to completion (sync) or yielding between steps (async)
function runGen(gen) { let r = gen.next(); while (!r.done) r = gen.next(); return r.value; }
async function runGenAsync(gen, pause) { let r = gen.next(); while (!r.done) { await pause(); r = gen.next(); } return r.value; }
function renderCard(def, k = 1, opts = {}) { const key = def.id + '@' + k + (opts.noText ? 'n' : ''); return ART_CACHE[key] || runGen(renderCardGen(def, k, opts)); }
function renderCardAsync(def, k = 1, pause) { const key = def.id + '@' + k; return ART_CACHE[key] ? Promise.resolve(ART_CACHE[key]) : runGenAsync(renderCardGen(def, k, {}), pause); }
function* renderCardGen(def, k = 1, opts = {}) {
  const key = def.id + '@' + k + (opts.noText ? 'n' : '');
  const W = Math.round(CW * k), H = Math.round(CH * k);
  const r = U.rng(def.seed);
  const pal = PAL[def.color];
  const bgC = U.canvas(W, H), midC = U.canvas(W, H), lightC = U.canvas(W, H), fgC = U.canvas(W, H);
  const bg = bgC.getContext('2d'), mid = midC.getContext('2d'), light = lightC.getContext('2d'), fg = fgC.getContext('2d');
  [bg, mid, light, fg].forEach(c => c.scale(k, k));
  // torn poster outline
  const outer = G.tornRect(4, 4, CW - 8, CH - 8, U.rng(def.seed + 1), 5, 9);
  const inner = G.tornRect(16, 16, CW - 32, CH - 32, U.rng(def.seed + 2), 4, 12);
  bg.save(); G.poly(bg, outer); bg.clip(); bg.drawImage(G.paper(CW, CH, def.seed, '#efe6d6', 0.14), 0, 0); bg.restore();
  yield;
  bg.save(); G.poly(bg, inner); bg.clip();
  mid.save(); G.poly(mid, inner); mid.clip();
  light.save(); G.poly(light, inner); light.clip();
  def.art(bg, mid, light, U.rng(def.seed + 9), def);
  light.restore(); mid.restore(); bg.restore();
  yield;
  // ---- foreground: title, banner, cost, rules ----
  if (!opts.noText) {
    // title
    const T = G.graffitiText({ text: def.title, size: (def.titleSize || 158) * k, seed: def.seed + 4, fill: def.titleFill || [pal.cool, pal.a], outline2: def.titleO2 || '#ffffff', o2: 0.04, o1: 0.1, jag: def.titleJag ?? 0.018, crack: 0.25, speckle: 0.35, drips: def.titleDrips ?? 6, spikes: def.titleSpikes ?? 8, spikeLen: [0.07, 0.22], maxWidth: (def.titleMax || 360) * k, icicle: def.icicle, shadow: def.titleShadow || '#14051f', rot: def.titleRot ?? 5, font: def.titleFont || G.F.cjk, spacing: def.titleSpacing ?? -0.02 });
    const tx = def.titleX || 318, ty = def.titleY || 112;
    fg.save(); fg.translate(tx, ty); fg.rotate(def.titleTilt ?? -0.05); fg.drawImage(T.canvas, -T.cx / k, -T.cy / k, T.W / k, T.H / k); fg.restore();
    G.crown(fg, tx + (def.crownDX ?? -14), Math.max(40, ty - T.S / k * 0.56 - 8), 44, '#ffffff', '#0b0710', -0.12);
    yield;
    if (def.tagline) {
      const TL = G.graffitiText({ text: def.tagline, size: 40 * k, seed: def.seed + 6, font: G.F.latI, fill: [pal.hot, pal.a], outline2: '#ffffff', o1: 0.16, o2: 0.06, drips: 3, dripLen: [0.2, 0.7], spikes: 0, rot: 3, jag: 0.025, shadowOff: [0.04, 0.06], spacing: 0.02, maxWidth: 240 * k, crack: 0.3 });
      fg.save(); fg.translate(def.taglineX || 382, def.taglineY || 222); fg.rotate(-0.06); fg.drawImage(TL.canvas, -TL.cx / k, -TL.cy / k, TL.W / k, TL.H / k); fg.restore();
    }
    // banner
    if (def.banner) G.vBanner(fg, 522, 30, 60, def.banner, { seed: def.seed, line: pal.hot === '#ff8a1f' ? '#ffe14a' : pal.hot, glow: pal.hot, emblem: (c, x, y, s) => emblem(c, x, y + s * 0.2, s * 0.42, def.emblem || 'bolt', def.color === 'yellow' || def.color === 'grey' ? '#ffd21f' : pal.cool) });
    costSplats(fg, def.cost, r);
    stickerBox(fg, def, r, pal);
    powerBadge(fg, def, r, pal);
    yield;
  }
  // overall print texture
  fg.save(); G.poly(fg, outer); fg.clip();
  G.grain(fg, CW, CH, U.rng(def.seed + 8), 0.8, 'rgba(10,0,20,0.16)', 'rgba(255,255,255,0.1)');
  const vg = fg.createRadialGradient(CW / 2, CH / 2, CH * 0.35, CW / 2, CH / 2, CH * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(20,0,30,0.35)'); fg.fillStyle = vg; fg.fillRect(0, 0, CW, CH);
  fg.restore();
  // paper edge rim line
  fg.save(); fg.strokeStyle = 'rgba(0,0,0,0.35)'; fg.lineWidth = 1.5; G.poly(fg, outer); fg.stroke(); fg.restore();
  // flatten
  const face = U.canvas(W, H); const fc = face.getContext('2d'); fc.drawImage(bgC, 0, 0); fc.drawImage(midC, 0, 0);
  fc.globalCompositeOperation = 'lighter'; fc.drawImage(lightC, 0, 0); fc.globalCompositeOperation = 'source-over'; fc.drawImage(fgC, 0, 0);
  // base = bg + mid + light (no text), used for parallax and battle thumbnails
  const res = { face, bg: bgC, mid: midC, light: lightC, fg: fgC, W, H, outer };
  ART_CACHE[key] = res; return res;
}

  for (let yy = 0; yy < CH; yy += 36) { for (let xx = (yy / 36) % 2 ? -40 : 0; xx < CW; xx += 80) { x.fillStyle = U.mix('#2a1630', '#3d1d3a', r()); x.fillRect(xx + 2, yy + 2, 76, 32); } }
  // layered torn posters
  const cols = ['#ff2fd1', '#2ef2ff', '#ffd21f', '#ff2d3d', '#efe6d6', '#7a1fff', '#2d7bff'];
  for (let i = 0; i < 16; i++) {
    const w = 140 + r() * 220, h = 160 + r() * 260, px = r() * (CW - 60) - 60, py = r() * (CH - 60) - 60;
    const e = G.tornRect(px, py, w, h, r, 8, 12); x.save(); x.translate(px + w / 2, py + h / 2); x.rotate((r() - 0.5) * 0.5); x.translate(-(px + w / 2), -(py + h / 2));
    x.fillStyle = 'rgba(0,0,0,0.4)'; x.save(); x.translate(5, 6); G.poly(x, e); x.fill(); x.restore();
    x.fillStyle = U.pick(r, cols); G.poly(x, e); x.fill();
    G.halftone(x, px, py, w, h, 'rgba(0,0,0,0.18)', 9, (u, v) => v * 0.8);
    x.restore();
  }
  x.fillStyle = 'rgba(10,4,16,0.55)'; x.fillRect(0, 0, CW, CH);
  G.splat(x, 300, 420, 230, '#0b0710', r, { drops: 30, drips: 5, dripLen: 1 });
  // emblem ring
  x.save(); x.translate(300, 420); x.strokeStyle = '#ff2fd1'; x.lineWidth = 6; x.setLineDash([18, 10]); x.beginPath(); x.arc(0, 0, 200, 0, Math.PI * 2); x.stroke(); x.setLineDash([]); x.strokeStyle = '#2ef2ff'; x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 214, 0, Math.PI * 2); x.stroke(); x.restore();
  const T = G.graffitiText({ text: '疊城', size: 170 * k, seed: 12, fill: ['#ffffff', '#ffd1fb', '#ff4fe6', '#9b2cff'], outline2: '#2ef2ff', drips: 6, spikes: 8, jag: 0.02, crack: 0.25 });
  x.save(); x.translate(300, 400); x.rotate(-0.06); x.drawImage(T.canvas, -T.cx / k, -T.cy / k, T.W / k, T.H / k); x.restore();
  G.crown(x, 290, 290, 70, '#ffe14a', '#0b0710', -0.1);
  const TL = G.graffitiText({ text: 'OVERPAINT', size: 50 * k, seed: 14, font: G.F.latI, fill: ['#2ef2ff', '#2d7bff'], outline2: '#ffffff', o1: 0.16, o2: 0.06, drips: 4, spikes: 0, jag: 0.02, crack: 0.2 });
  x.save(); x.translate(310, 520); x.rotate(-0.05); x.drawImage(TL.canvas, -TL.cx / k, -TL.cy / k, TL.W / k, TL.H / k); x.restore();
  G.grain(x, CW, CH, r, 0.8);
  x.restore();
  x.strokeStyle = 'rgba(0,0,0,0.4)'; x.lineWidth = 1.5; G.poly(x, outer); x.stroke();
  ART_CACHE[key] = c; return c;
}

/* ============ 疊城 · boss mural: 清牆巨像 THE BUFF ============ */
const BW = 900, BH = 640;
const BC = { light: '#c9c6d0', mid: '#9a96a3', dark: '#6b6774', darker: '#45424d', ink: '#121116', orange: '#ff7a1a', glove: '#24222a' };

function bShape(ctx, path, fill, lw = 6) { ctx.lineJoin = 'round'; ctx.lineWidth = lw * 2; ctx.strokeStyle = BC.ink; ctx.stroke(path); ctx.fillStyle = fill; ctx.fill(path); }
function limb(ctx, pts, w, fill) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const path = new Path2D(); path.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) path.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = BC.ink; ctx.lineWidth = w + 14; ctx.stroke(path);
  ctx.strokeStyle = fill; ctx.lineWidth = w; ctx.stroke(path);
  ctx.restore(); return path;
}
function rollerTex(ctx, r, alpha = 0.55) {
  // horizontal roller streaks over whatever is already drawn (use source-atop)
  ctx.save(); ctx.globalCompositeOperation = 'source-atop';
  for (let y = 0; y < BH; y += 6 + r() * 10) { ctx.fillStyle = r() < 0.5 ? `rgba(255,255,255,${0.05 * alpha + r() * 0.06 * alpha})` : `rgba(0,0,0,${0.05 * alpha + r() * 0.08 * alpha})`; ctx.fillRect(0, y, BW, 2 + r() * 5); }
  for (let i = 0; i < 900; i++) { ctx.fillStyle = r() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.1)'; ctx.fillRect(r() * BW, r() * BH, 2 + r() * 14, 1.2); }
  ctx.restore();
}
function shadeSide(ctx, x0, x1, col = 'rgba(18,17,22,0.35)') {
  ctx.save(); ctx.globalCompositeOperation = 'source-atop';
  G.halftone(ctx, x0, 0, x1 - x0, BH, col, 8, (u) => u * 1.1);
  ctx.restore();
}

function bossWall(r) {
  const c = U.canvas(BW, BH), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, BH); g.addColorStop(0, '#231b2b'); g.addColorStop(1, '#17111d'); x.fillStyle = g; x.fillRect(0, 0, BW, BH);
  for (let yy = 0; yy < BH; yy += 40) for (let xx = (yy / 40) % 2 ? -50 : 0; xx < BW; xx += 100) { x.fillStyle = U.mix('#2b2132', '#3a2b3f', r()); x.fillRect(xx + 3, yy + 3, 94, 34); }
  // old colourful graffiti
  const cols = ['#ff2fd1', '#2ef2ff', '#ffd21f', '#ff2d3d', '#7a1fff', '#2d7bff'];
  for (let i = 0; i < 14; i++) G.splat(x, r() * BW, r() * BH, 30 + r() * 80, U.pick(r, cols), r, { drops: 10 });
  const tags = ['KING', 'DC', 'ONE', '疊'];
  for (let i = 0; i < 5; i++) { x.save(); x.translate(80 + r() * 740, 80 + r() * 480); x.rotate((r() - 0.5) * 0.5); x.font = `${70 + r() * 60}px ${G.F.latI}`; x.lineWidth = 8; x.strokeStyle = '#0b0710'; const t = U.pick(r, tags); x.strokeText(t, 0, 0); x.fillStyle = U.pick(r, cols); x.fillText(t, 0, 0); x.restore(); }
  // mismatched grey buff patches over it
  for (let i = 0; i < 9; i++) {
    const w = 160 + r() * 300, h = 120 + r() * 260, px = r() * BW - 80, py = r() * BH - 60;
    x.save(); x.beginPath(); x.rect(px, py, w, h); x.clip(); G.roller(x, px, py, w, h, U.mix('#5f5b66', '#7a7682', r()), r, { band: 34 }); x.restore();
    x.fillStyle = U.mix('#5f5b66', '#7a7682', r()); for (let k = 0; k < 3; k++) G.drip(x, px + r() * w, py + h - 2, 5 + r() * 6, 20 + r() * 70, r);
  }
  // hazard tape
  x.save(); x.translate(-40, 560); x.rotate(-0.08); x.fillStyle = '#121116'; x.fillRect(0, 0, BW + 100, 40);
  x.beginPath(); x.rect(0, 0, BW + 100, 40); x.clip(); x.fillStyle = '#ffb21a'; for (let xx = 0; xx < BW + 100; xx += 48) { x.beginPath(); x.moveTo(xx, 40); x.lineTo(xx + 24, 0); x.lineTo(xx + 48, 0); x.lineTo(xx + 24, 40); x.closePath(); x.fill(); }
  x.restore();
  const vg = x.createRadialGradient(BW / 2, BH * 0.45, BH * 0.3, BW / 2, BH * 0.45, BW * 0.7); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)'); x.fillStyle = vg; x.fillRect(0, 0, BW, BH);
  return c;
}

function underFor(part, r, seed) {
  // colourful old graffiti revealed when the grey peels off
  const c = U.canvas(BW, BH), x = c.getContext('2d');
  const cols = [['#ff2fd1', '#7a1fff'], ['#2ef2ff', '#2d7bff'], ['#ffd21f', '#ff2d3d']][seed % 3];
  const g = x.createLinearGradient(0, 0, BW, BH); g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]); x.fillStyle = g; x.fillRect(0, 0, BW, BH);
  for (let i = 0; i < 22; i++) G.splat(x, r() * BW, r() * BH, 14 + r() * 60, U.pick(r, ['#ffffff', '#ffd21f', '#2ef2ff', '#ff2fd1', '#0b0710']), r, { drops: 8 });
  G.halftone(x, 0, 0, BW, BH, 'rgba(255,255,255,0.25)', 10, (u, v) => (Math.sin(u * 9 + v * 4) + 1) * 0.4);
  const t = ['疊', 'KING', '城'][seed % 3];
  const T = G.graffitiText({ text: t, size: 150, seed: 90 + seed, font: seed === 1 ? G.F.latI : G.F.cjk, fill: ['#ffffff', '#ffe14a'], outline2: '#0b0710', drips: 4, spikes: 5, jag: 0.02 });
  const bx = part.bbox; x.save(); x.translate(bx[0] + bx[2] / 2, bx[1] + bx[3] / 2); x.rotate(-0.15); x.drawImage(T.canvas, -T.cx, -T.cy); x.restore();
  x.globalCompositeOperation = 'destination-in'; x.drawImage(U.dilate(part.img, 4, '#fff'), 0, 0);
  return c;
}

function crackStages(img, r, bbox) {
  const stages = [];
  const A = img.getContext('2d').getImageData(0, 0, BW, BH).data;
  const inside = (x, y) => x >= 0 && y >= 0 && x < BW && y < BH && A[((y | 0) * BW + (x | 0)) * 4 + 3] > 200;
  let acc = U.canvas(BW, BH); const ax = acc.getContext('2d');
  for (const n of [3, 5, 7]) {
    for (let i = 0; i < n; i++) {
      let x, y, tries = 0; do { x = bbox[0] + r() * bbox[2]; y = bbox[1] + r() * bbox[3]; } while (!inside(x, y) && tries++ < 50);
      let a = r() * Math.PI * 2; const pts = [[x, y]];
      for (let k = 0; k < 9 + r() * 8; k++) { a += (r() - 0.5) * 1.1; x += Math.cos(a) * (12 + r() * 16); y += Math.sin(a) * (12 + r() * 16); pts.push([x, y]); }
      for (const [col, lw, off] of [['rgba(255,255,255,0.45)', 3, 2], [BC.ink, 4.5, 0]]) { ax.strokeStyle = col; ax.lineWidth = lw; ax.lineJoin = 'round'; ax.beginPath(); ax.moveTo(pts[0][0] + off, pts[0][1] + off); for (const p of pts) ax.lineTo(p[0] + off, p[1] + off); ax.stroke(); }
      // branches
      for (let b = 0; b < 2; b++) { const p = pts[(r() * pts.length) | 0]; let bx = p[0], by = p[1], ba = a + (r() - 0.5) * 2.4; ax.beginPath(); ax.moveTo(bx, by); for (let k = 0; k < 4; k++) { ba += (r() - 0.5) * 0.8; bx += Math.cos(ba) * 12; by += Math.sin(ba) * 12; ax.lineTo(bx, by); } ax.strokeStyle = BC.ink; ax.lineWidth = 3; ax.stroke(); }
    }
    const st = U.canvas(BW, BH), sx = st.getContext('2d'); sx.drawImage(acc, 0, 0); sx.globalCompositeOperation = 'destination-in'; sx.drawImage(img, 0, 0); stages.push(st);
  }
  return stages;
}

let BOSS_CACHE = null;

/* ============ 疊城 · rules ============ */
const Game = (() => {
  const DECK = ['zidian', 'zidian', 'tongji', 'tongji', 'tongji', 'luanpen', 'luanpen', 'luanpen', 'lengpen', 'lengpen', 'sikai', 'sikai'];
  const FIRST = ['zidian', 'tongji', 'luanpen', 'lengpen', 'sikai'];
  const PARTS = ['L', 'C', 'R'];
  const LANE = ['左路', '中路', '右路'];
  const HAND_MAX = 8;
  let S = null, A = null, uid = 1;
  const noop = async () => {};
  const NOANIM = new Proxy({}, { get: () => noop });

  function newGame(anim) {
    A = anim || NOANIM; uid = 1;
    const deck = DECK.map(id => ({ uid: uid++, id }));
    const hand = [];
    for (const id of FIRST) { const i = deck.findIndex(c => c.id === id); hand.push(deck.splice(i, 1)[0]); }
    U.shuffle(deck);
    S = {
      turn: 1, phase: 'player', hp: 30, hpMax: 30, block: 0, paint: { r: 1, b: 1, y: 1 },
      deck, hand, discard: [], lanes: [[], [], []],
      boss: { L: { hp: 12, max: 12, broken: false }, C: { hp: 34, max: 34, broken: false }, R: { hp: 12, max: 12, broken: false } },
      intents: { R: { kind: 'scrape', lane: 1 }, L: { kind: 'buff', lane: 0 }, C: { kind: 'roar', dmg: 6 } },
      over: null, stats: { dmg: 0, reveals: 0, tears: 0, maxHit: 0 }
    };
    return S;
  }
  const def = c => CARDS[c.id];
  function canAfford(c) { return Object.entries(def(c).cost).every(([k, v]) => S.paint[k] >= v); }
  function validLanes(c) { if (def(c).action) return [0, 1, 2].filter(i => S.lanes[i].length > 0); return [0, 1, 2]; }
  function partFor(lane) { const p = PARTS[lane]; return S.boss[p].broken ? 'C' : p; }
  function lanePower(c, lane) { // projected damage for UI previews
    if (c.id === 'zidian') return 5;
    if (c.id === 'luanpen') return 3 + S.lanes[lane].length;
    return 0;
  }

  async function play(cardUid, lane) {
    if (!S || S.phase !== 'player' || S.over) return false;
    const ci = S.hand.findIndex(c => c.uid === cardUid); if (ci < 0) return false;
    const card = S.hand[ci], d = def(card);
    if (!canAfford(card)) { await A.deny(card, 'paint'); return false; }
    if (!validLanes(card).includes(lane)) { await A.deny(card, 'lane'); return false; }
    S.phase = 'busy'; A.refresh();
    for (const [k, v] of Object.entries(d.cost)) S.paint[k] -= v;
    S.hand.splice(ci, 1); A.spend(d.cost);
    try {
      if (d.action) {
        await A.action(card, lane); S.discard.push(card);
        await tear(lane, 'player');
      } else {
        const below = S.lanes[lane].length;
        S.lanes[lane].push(card);
        await A.paste(card, lane, false);
        await onPaste(card, lane, 0, below);
      }
    } finally {
      if (!S.over) S.phase = 'player';
      A.refresh();
    }
    return true;
  }
  async function onPaste(card, lane, bonus, below) {
    if (card.id === 'zidian') await hit(lane, 5 + bonus, 'bolt', bonus > 0);
    else if (card.id === 'luanpen') await hit(lane, 3 + below, 'paint', false);
    else if (card.id === 'tongji') await gainBlock(4, lane);
    else if (card.id === 'lengpen') await gainBlock(5, lane);
  }
  async function onReveal(card, lane) {
    if (card.id === 'zidian') { S.stats.reveals++; await A.reveal(card, lane, true); await onPaste(card, lane, 3, 0); }
    else if (card.id === 'lengpen') { S.stats.reveals++; await A.reveal(card, lane, true); await gainBlock(5, lane); }
    else await A.reveal(card, lane, false);
  }
  async function tear(lane, by) {
    const st = S.lanes[lane]; if (!st.length) return false;
    const top = st.pop(); S.stats.tears++;
    await A.tear(top, lane, by);
    if (top.id !== 'huiqi') S.discard.push(top);
    if (top.id === 'tongji') { await A.note('被撕：抽 1 張', lane); await draw(1); }
    const nt = st[st.length - 1];
    if (nt && !S.over) await onReveal(nt, lane);
    return true;
  }
  async function hit(lane, n, kind, big) {
    const pid = partFor(lane); const part = S.boss[pid]; if (part.broken) return;
    await A.projectile(lane, pid, kind, n, big);
    const before = part.hp; part.hp = Math.max(0, part.hp - n); S.stats.dmg += before - part.hp; S.stats.maxHit = Math.max(S.stats.maxHit, n);
    await A.damagePart(pid, n, big);
    if (part.hp <= 0 && !part.broken) {
      part.broken = true; if (S.intents[pid]) delete S.intents[pid];
      await A.breakPart(pid);
      if (pid === 'C') { S.over = 'win'; S.phase = 'over'; await A.victory(S.stats); }
    }
  }
  async function gainBlock(n, lane) { S.block += n; await A.block(n, lane); }
  async function draw(n) {
    for (let i = 0; i < n; i++) {
      if (S.hand.length >= HAND_MAX) break;
      if (!S.deck.length) { if (!S.discard.length) break; S.deck = U.shuffle(S.discard.splice(0)); await A.reshuffle(); }
      const c = S.deck.pop(); S.hand.push(c); await A.draw(c);
    }
  }
  async function hurt(n, pid) {
    const absorbed = Math.min(S.block, n); S.block -= absorbed; const dmg = n - absorbed; S.hp = Math.max(0, S.hp - dmg);
    await A.hurt(dmg, absorbed, pid);
    if (S.hp <= 0) { S.over = 'lose'; S.phase = 'over'; await A.defeat(S.stats); }
  }
  async function endTurn() {
    if (!S || S.phase !== 'player' || S.over) return;
    S.phase = 'boss'; A.refresh();
    const hand = S.hand.splice(0); S.discard.push(...hand); await A.discardHand(hand);
    for (const pid of ['R', 'L', 'C']) {
      if (S.over) return;
      const it = S.intents[pid]; if (!it || S.boss[pid].broken) continue;
      await A.bossAct(pid, it);
      if (it.kind === 'scrape') {
        if (S.lanes[it.lane].length) await tear(it.lane, 'boss'); else await hurt(4, pid);
      } else if (it.kind === 'buff') {
        const b = { uid: uid++, id: 'huiqi' }; S.lanes[it.lane].push(b); await A.paste(b, it.lane, true);
      } else if (it.kind === 'roar') {
        await hurt(it.dmg, pid);
      }
      await A.bossDone(pid);
    }
    if (S.over) return;
    S.turn++; S.block = 0; S.paint = { r: 1, b: 1, y: 1 };
    rollIntents();
    await A.newTurn(S.turn);
    await draw(5);
    S.phase = 'player'; A.refresh();
  }
  function rollIntents() {
    const it = {};
    if (!S.boss.R.broken) {
      let best = -1, lanes = []; S.lanes.forEach((st, i) => { if (st.length > best) { best = st.length; lanes = [i]; } else if (st.length === best) lanes.push(i); });
      it.R = { kind: 'scrape', lane: lanes[(Math.random() * lanes.length) | 0] };
    }
    if (!S.boss.L.broken) {
      const score = st => { const t = st[st.length - 1]; if (!t) return 0.5; if (t.id === 'huiqi') return 0; return { zidian: 5, luanpen: 3, lengpen: 2, tongji: 1.5 }[t.id] || 1; };
      let best = -1, lane = 0; S.lanes.forEach((st, i) => { const v = score(st) + Math.random() * 0.6; if (v > best) { best = v; lane = i; } });
      it.L = { kind: 'buff', lane };
    }
    it.C = { kind: 'roar', dmg: 5 + S.turn };
    S.intents = it;
  }
  return { newGame, play, endTurn, canAfford, validLanes, partFor, lanePower, LANE, PARTS, get S() { return S; } };
})();

/* ============ 疊城 · boot & routing ============ */
const Main = (() => {

    const fams = ['DCBlack', 'DCBody', 'DCSerif', 'DCLatin', 'DCLatinI'];
    try { await Promise.race([Promise.all(fams.map(f => document.fonts.load(`40px "${f}"`, '疊城紫電AB12'))), U.sleep(3000)]); } catch (e) { /* fall back silently */ }
  }
  function wallTexture() {
    const c = U.canvas(320, 320), x = c.getContext('2d'); const r = U.rng(77);
    x.fillStyle = '#140d1c'; x.fillRect(0, 0, 320, 320);
    for (let yy = 0; yy < 320; yy += 32) for (let xx = (yy / 32) % 2 ? -40 : 0; xx < 320; xx += 80) { x.fillStyle = U.mix('#1a1222', '#24182c', r()); x.fillRect(xx + 2, yy + 2, 76, 28); }
    x.globalAlpha = 0.5; for (let i = 0; i < 6; i++) G.splat(x, r() * 320, r() * 320, 6 + r() * 16, U.pick(r, ['#3a1440', '#123a44', '#3a3214']), r, { drops: 6 }); x.globalAlpha = 1;
    try { document.body.style.setProperty('--wallimg', `url(${c.toDataURL('image/png')})`); } catch (e) { /* ignore */ }
  }
  function wordmark() {
    const cv = $('#wordmark'); const d = Math.min(2.5, window.devicePixelRatio || 1);
    const T = G.graffitiText({ text: '疊城', size: 40 * d, seed: 12, fill: ['#ffffff', '#ffd1fb', '#ff4fe6', '#9b2cff'], outline2: '#2ef2ff', drips: 3, dripLen: [0.15, 0.4], spikes: 4, jag: 0.02, crack: 0.15 });
    const h = 40 * d; const s = h / (T.S * 1.6); const w = T.W * s;
    cv.width = Math.round(w); cv.height = Math.round(h); cv.style.width = (w / d) + 'px'; cv.style.height = '40px';
    const x = cv.getContext('2d'); x.drawImage(T.canvas, 0, (h - T.H * s) / 2 + T.S * 0.1 * s, w, T.H * s);
  }
  async function boot() {
    const t0 = performance.now(); const mark = n => { if (window.__dcDebug) console.debug('[boot]', n, Math.round(performance.now() - t0)); };
    progress(0.04, '載入字型…'); await fonts(); mark('fonts');
    progress(0.12, '調漆…'); await yieldFrame();
    FX.init($('#fx')); wallTexture(); wordmark(); setSoundIcons();
    Home.init(); Battle.init();
    progress(0.3, '噴《暗層・紫電》…'); await yieldFrame();
    renderCard(CARDS.zidian, 1); mark('zidian@1'); progress(0.55); await yieldFrame();
    $('#loading').hidden = true; $('#home').hidden = false;
    Home.build('zidian'); mark('hero'); Home.buildStrip(); Home.show(); mark('shown');
    progress(1);
    readyP = bgRender(); readyP.then(() => { readyAll = true; });
  }
  async function bgRender() {
    const t0 = performance.now();
    let worst = 0, lastT = performance.now();
    const pause = async () => { const n = performance.now(); worst = Math.max(worst, n - lastT); await yieldFrame(); lastT = performance.now(); };
    await U.sleep(700);
    // pre-render big background lettering as its own step
    CARDS.luanpen._pre = null; CARDS.sikai._pre = null;
    for (const id of ['tongji', 'luanpen', 'lengpen', 'sikai', 'huiqi']) { lastT = performance.now(); await renderCardAsync(CARDS[id], 1, pause); Home.fillThumb(id); await pause(); }
    lastT = performance.now(); renderBack(1); await pause();
    await renderBossAsync(pause);
    Stage.mount(); await pause();
    if (window.__dcDebug) console.debug('[bg] all', Math.round(performance.now() - t0), 'worst step', Math.round(worst));
    try { console.debug('[bg] all', Math.round(performance.now() - t0)); } catch (e) {}
  }
  async function toBattle() {
    Snd.unlock(); Snd.play('click');
    if (!readyAll) { const cap = $('#heroCap'); const old = cap.textContent; cap.textContent = '牆面還在上漆，馬上好…'; await readyP; cap.textContent = old; }

  }
  function toHome() { Battle.stop(); Snd.stopMusic(); $('#battle').hidden = true; $('#app').classList.remove('in-battle'); $('#home').hidden = false; Home.show(); }
  return { boot, toBattle, toHome };
})();
