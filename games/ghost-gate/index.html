:root{--red:#b8322e;--red2:#7c1c22;--gold:#f2c14e;--gold2:#a8762a;--paper:#f3e3b0;--ink:#1a1320;--night:#0a0914;--cyan:#8fe8df;--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:#efe6d2;overflow:hidden;font-family:'LOPixel',ui-monospace,monospace;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
#root{position:fixed;inset:0;overflow:hidden}
#cv,#scv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#scv.shk{animation:shk .45s}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#07060c;z-index:50}
#loading b{font-size:44px;color:#ffdfa0;text-shadow:0 0 18px #ff4a3a,0 3px 0 #5a0c14;letter-spacing:6px}
#loading small{color:#9a92b8}
.scr{position:absolute;inset:0;z-index:5;padding:calc(14px + var(--sa-t)) calc(14px + var(--sa-r)) calc(14px + var(--sa-b)) calc(14px + var(--sa-l))}
/* 按鈕：朱漆金框的廟宇匾額 */
.btn{display:block;width:100%;margin:8px 0;padding:12px 14px;background:linear-gradient(#c73b33,#8e2226);border:2px solid var(--gold);box-shadow:0 0 0 2px #3a0a10,inset 0 0 0 2px #e8584a,0 5px 0 #2a0610;color:#fff4d8;font-size:17px;letter-spacing:2px;text-shadow:0 2px 0 #4a0a12;border-radius:2px;position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 2px #3a0a10,inset 0 0 0 2px #e8584a,0 2px 0 #2a0610}
.btn small{display:block;font-size:11px;color:#ffd9a0;letter-spacing:1px;margin-top:3px;opacity:.9}
.btn.big{font-size:22px;padding:15px}
.btn.small{font-size:14px;padding:9px 10px;margin:6px 0}
.btn.ghost{background:rgba(20,14,30,.75);border-color:#6a5a7a;box-shadow:0 0 0 2px #0a0610,0 4px 0 #0a0610;color:#cfc4e0;text-shadow:none}
.btn.locked{filter:grayscale(.8) brightness(.7)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.pbox{background:linear-gradient(#2a1a2a,#170f1e);border:2px solid var(--gold2);box-shadow:0 0 0 2px #0a0610,inset 0 0 0 2px #4a2a3a,0 10px 30px rgba(0,0,0,.6);padding:16px;border-radius:3px}
/* 標題 */
#scrTitle{display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.logo{text-align:center;margin-top:5vh}
.logo h1{margin:4px 0;font-size:clamp(56px,17vw,96px);font-weight:normal;letter-spacing:10px;color:#ffe4b0;text-shadow:0 0 22px rgba(255,60,50,.9),0 0 50px rgba(255,40,40,.5),0 4px 0 #6a0a16,0 8px 0 #2a0408;animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.55}49%{opacity:1}73%{opacity:.85}74%{opacity:1}}
.lg-sub{color:var(--cyan);letter-spacing:4px;font-size:13px;text-shadow:0 0 8px rgba(120,255,240,.6)}
.lg-line{color:#c9bddf;font-size:13px;margin-top:6px}
.menu{width:min(320px,86vw);margin-bottom:2vh}
.foot{font-size:11px;color:#7c7494;text-align:center}
#setPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,84vw);z-index:8}
/* 列表畫面 */
.scr.list{overflow-y:auto;background:rgba(8,6,16,.72);touch-action:pan-y}
.scr.list h2{margin:4px 0 12px;font-weight:normal;color:var(--gold);letter-spacing:3px}
.cards-v{display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto}
.chcard{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;text-align:left;padding:12px 14px;background:linear-gradient(90deg,#3a1822,#1c1224);border:2px solid #8a5a3a;box-shadow:0 4px 0 #0a0610;border-radius:3px}
.chcard .no{grid-row:span 3;writing-mode:vertical-rl;color:var(--gold);font-size:15px;letter-spacing:2px;border-right:1px solid #6a4a3a;padding-right:10px}
.chcard b{font-size:20px;color:#fff0d0;font-weight:normal}
.chcard small{color:#b8a8c8;font-size:12px}
.chcard .st{color:var(--cyan);font-size:12px}
.chcard.lock{filter:grayscale(1) brightness(.55)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:720px;margin:0 auto 12px}
.ach{display:grid;grid-template-columns:36px 1fr;gap:2px 8px;padding:8px;background:#1a1224;border:1px solid #3a2a4a;align-items:center}
.ach img{grid-row:span 2;width:36px;height:36px;filter:grayscale(1) brightness(.4)}
.ach b{font-weight:normal;font-size:13px;color:#9a8ab0}.ach small{font-size:11px;color:#6a5a80}
.ach.on{border-color:var(--gold2);background:#2a1a24}.ach.on img{filter:none}.ach.on b{color:var(--gold)}.ach.on small{color:#c8b8d0}
/* 劇情 */
#scrStory{padding:0}
#stFx{position:absolute;inset:0;pointer-events:none}
#stFx.fx-flash{animation:fxw .6s}#stFx.fx-red{animation:fxr .9s}#stFx.fx-dark{background:#000;animation:fxd 1.6s forwards}
@keyframes fxw{0%{background:rgba(255,255,255,.9)}100%{background:rgba(255,255,255,0)}}
@keyframes fxr{0%{background:rgba(200,0,20,.6)}100%{background:rgba(200,0,20,0)}}
@keyframes fxd{0%{opacity:0}100%{opacity:.85}}
#stBox{position:absolute;left:calc(10px + var(--sa-l));right:calc(10px + var(--sa-r));bottom:calc(12px + var(--sa-b));min-height:118px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px 16px;background:linear-gradient(rgba(22,14,28,.93),rgba(12,8,18,.95));border:2px solid #7a5238;box-shadow:0 0 0 2px #050308,inset 0 0 0 1px #3a2430;border-radius:3px}
#stPort{width:76px;height:76px;flex:none;border:2px solid #7a5238;background:#000}
#stBox.nar{font-style:normal}#stBox.nar #stText{color:#cfc6dc}
.st-in{flex:1;min-width:0}
#stName{display:block;font-weight:normal;font-size:15px;margin-bottom:6px;letter-spacing:1px}
#stText{margin:0;font-size:17px;line-height:1.55;color:#f4ecdc;white-space:pre-wrap;word-break:break-all}
.st-next{position:absolute;right:12px;bottom:6px;font-size:11px;color:var(--gold);animation:bob 1s infinite;font-style:normal}

/* 逐列水平位移：fn(y) 回傳該列位移（煙尾、布料、剪切傾斜用） */
function en_shiftRows(pb, y0, y1, fn) {
  const w = pb.w, src = pb.copy();
  for (let y = Math.max(0, y0); y < Math.min(pb.h, y1); y++) {
    const s = fn(y); if (!s) continue;
    for (let x = 0; x < w; x++) { const i = y * w + x, sx = x - s; if (sx < 0 || sx >= w) { pb.d[i] = 0; pb.f[i] = 0; } else { pb.d[i] = src.d[y * w + sx]; pb.f[i] = src.f[y * w + sx]; } }
  }
}

/* ==== art_boss ==== */
/* ===== Boss 美術：怪手、紙馬將軍、網鬼、黑令將軍、鬼王（部件式＋可旋轉部件） =====
 * 私有名稱一律 bo_ 前綴。每個 Boss 的 RIGDEF 另附 sockets(anim, i) → { 名稱: [dx, dy, 建議角度] }，
 * dx/dy 為「相對錨點（腳底中心）」的位移，面向右時的座標；面向左時 dx 取負、角度取 π−a（或整組 scale(-1,1)）。
 */
addRamp('bo_gf', ['#f0fff6', '#8dffd6', '#2fd2b0', '#15808c']);   /* 綠藍鬼火（發光用） */

/* ---------- 共用小工具 ---------- */
function bo_R(c) { return c ? ((c - 1) / 5) | 0 : -1; }
function bo_rampId(name) { return bo_R(pi(name, 0)); }
function bo_is(pb, x, y, name) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= pb.w || y >= pb.h) return false; const c = pb.d[y * pb.w + x]; return !!c && bo_R(c) === bo_rampId(name); }
function bo_solid(pb, x, y) { x |= 0; y |= 0; return x >= 0 && y >= 0 && x < pb.w && y < pb.h && pb.d[y * pb.w + x] !== 0; }
/* 只在指定材質上點描（煤灰、泥巴、污漬） */
function bo_smudge(pb, cx, cy, rx, ry, dens, seed, onto, c) {
  const r = seeded(seed);
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
    const dx = (x - cx) / rx, dy = (y - cy) / ry, q = dx * dx + dy * dy; if (q > 1) continue;
    if (r() > dens * (1 - q * 0.7)) continue;
    if (onto && !onto.some(n => bo_is(pb, x, y, n))) continue;
    pb.px(x, y, c);
  }
}
/* 黃色符紙：寬 3、高 h；紅色符頭橫畫＋中軸符腳；burnt = 下緣燒焦（鬼火燒邊） */
function bo_talisman(pb, x, y, h, burnt, shadow) {
  pb.rect(x, y, 3, h, 'yellow.0~');
  pb.rect(x, y + 1, 3, 1, 'red.1~');
  for (let j = 2; j < h - 1; j++) { pb.px(x + 1, y + j, 'red.2~'); if (j % 3 === 0) pb.px(x + (j % 2 ? 0 : 2), y + j, 'red.1~'); }
  if (burnt) { pb.clear(x + 2, y + h - 1); pb.px(x + 2, y + h - 1, shadow || 'steel.3~'); pb.px(x + 1, y + h - 1, 'bo_gf.2!'); pb.px(x + 2, y + h - 2, 'bo_gf.3!'); pb.px(x, y + h - 1, 'black.2~'); }
  if (shadow) for (let j = 1; j <= h; j++) if (bo_solid(pb, x + 3, y + j)) pb.px(x + 3, y + j, shadow);
}
/* 列位移（煙、呼吸、漩渦）：對每一列回傳位移量 */
function bo_rowShift(pb, y0, y1, fn) {
  const w = pb.w, src = pb.copy();
  for (let y = Math.max(0, y0); y < Math.min(pb.h, y1); y++) {
    const s = fn(y); if (!s) continue;
    for (let x = 0; x < w; x++) { pb.d[y * w + x] = 0; pb.f[y * w + x] = 0; }
    for (let x = 0; x < w; x++) { const sx = x - s; if (sx < 0 || sx >= w) continue; pb.d[y * w + x] = src.d[y * w + sx]; pb.f[y * w + x] = src.f[y * w + sx]; }
  }
}

/* ======================================================================
 * 1. 怪手（第一章）：拆了萬善祠後被孤魂附身的黃色挖土機
 *    本體 64×46（不含手臂）；手臂＝ gs_boom → gs_stick → gs_bucket 三段，遊戲用正向運動學擺姿勢
 * ====================================================================== */
const bo_GS = { x0: 3, x1: 61, y0: 33, y1: 46 };   /* 履帶外框（右、下為開區間） */
function bo_gsTrack(x, y) {
  const G = bo_GS, r = (G.y1 - G.y0) / 2, cy = G.y0 + r, cxL = G.x0 + r, cxR = G.x1 - r, L = cxR - cxL, rm = r - 1;
  const px = x + 0.5, py = y + 0.5, qx = Math.max(cxL, Math.min(cxR, px)), dx = px - qx, dy = py - cy, d = Math.hypot(dx, dy);
  let s;
  if (px >= cxL && px <= cxR) s = dy < 0 ? px - cxL : L + Math.PI * rm + (cxR - px);
  else if (px > cxR) s = L + (Math.atan2(dy, dx) + Math.PI / 2) * rm;
  else { const a = Math.atan2(dy, dx); s = 2 * L + Math.PI * rm + (a > 0 ? a - Math.PI / 2 : a + 1.5 * Math.PI) * rm; }
  return { d, s, r, cy, cxL, cxR };
}
function bo_gsDrawTracks(pb) {
  const G = bo_GS;
  for (let y = G.y0; y < G.y1; y++) for (let x = G.x0; x < G.x1; x++) {
    const t = bo_gsTrack(x, y); if (t.d > t.r) continue;
    if (t.d > t.r - 2.3) pb.px(x, y, 'metal');        /* 履帶板 */
    else pb.px(x, y, 'black.2~');                     /* 內側暗部 */
  }
  const t0 = bo_gsTrack(0, 0), cy = t0.cy;
  /* 履帶架（黃） */
  pb.rect(Math.ceil(t0.cxL), Math.round(cy) - 3, Math.floor(t0.cxR - t0.cxL), 5, 'steel');
  pb.rect(Math.ceil(t0.cxL) + 6, Math.round(cy) - 1, Math.floor(t0.cxR - t0.cxL) - 12, 1, 'steel.2~');
  /* 支重輪 */
  for (const rx of [17, 25, 33, 41, 49]) { pb.rect(rx - 1, Math.round(cy) + 2, 3, 2, 'black.1~'); pb.px(rx, Math.round(cy) + 2, 'metal.1~'); }
  /* 驅動輪（後）與導輪（前） */
  pb.circ(t0.cxL - 0.5, cy - 0.5, 3.6, 'metal'); pb.circ(t0.cxL - 0.5, cy - 0.5, 1.2, 'black.2~');
  pb.circ(t0.cxR - 0.5, cy - 0.5, 3.6, 'metal'); pb.circ(t0.cxR - 0.5, cy - 0.5, 1.4, 'black.1~'); pb.px(Math.round(t0.cxR - 0.5), Math.round(cy - 0.5), 'metal.0~');
  /* 泥巴 */
  bo_smudge(pb, 30, 44, 22, 2, 0.35, 11, ['metal'], 'dirt.2~');
  bo_smudge(pb, 20, 38, 8, 2, 0.4, 12, ['steel'], 'dirt.1~');
}

/* 畫圖小工具：以 (ox,oy) 為原點 */
function w2_G(pb, ox, oy) {
  return {
    p(x, y, c) { pb.px(ox + x, oy + y, c); },
    r(x, y, w, h, c) { pb.rect(ox + x, oy + y, w, h, c); },
    l(x0, y0, x1, y1, c) { pb.line(ox + x0, oy + y0, ox + x1, oy + y1, c); },
    e(cx, cy, rx, ry, c) { pb.ell(ox + cx, oy + cy, rx, ry, c); },
    ci(cx, cy, r, c) { pb.circ(ox + cx, oy + cy, r, c); },
    po(pts, c) { pb.poly(pts.map(q => [ox + q[0], oy + q[1]]), c); },
    s(rows, lg, x, y, fl) { pb.stamp(rows, lg, ox + x, oy + y, fl); },
    g(x, y) { return pb.get(ox + x, oy + y); },
    x(x, y) { pb.clear(ox + x, oy + y); }
  };
}
/* 類文字記號（牌匾、對聯、船名）：3×4 小字 */
const w2_GL = [['###', '.#.', '###', '#.#'], ['#.#', '###', '#.#', '###'], ['###', '#..', '###', '..#'], ['.#.', '###', '.#.', '#.#'], ['###', '#.#', '###', '.#.'], ['#.#', '.#.', '###', '#.#'], ['##.', '.##', '###', '#.#'], ['###', '.##', '#.#', '###']];
function w2_glyphs(g, x, y, n, c, vert, seed) {
  for (let k = 0; k < n; k++) {
    const gl = w2_GL[(k * 5 + (seed || 0) * 3) % w2_GL.length];
    const gx = vert ? x : x + k * 4, gy = vert ? y + k * 5 : y;
    for (let j = 0; j < 4; j++) for (let i = 0; i < 3; i++) if (gl[j][i] === '#') g.p(gx + i, gy + j, c);
  }
}
/* 小紅燈籠（發光）5×7，x,y 為左上 */
function w2_lanS(g, x, y) {
  g.s(['.GGG.', 'LLLLL', 'LHLLL', 'LLLLL', 'MLLLM', '.GGG.', '..t..'], { G: 'gold.1', L: 'w2_lan.1!', H: 'w2_lan.0!', M: 'w2_lan.2!', t: 'red.2' }, x, y);
}
/* 燭焰（發光），i 為閃爍相位 */
function w2_flame(g, x, y, i, rp) {
  rp = rp || 'fire';
  const k = i % 3;
  g.p(x, y, rp + '.1!'); g.p(x, y - 1, rp + '.0!');
  if (k === 0) g.p(x, y - 2, rp + '.1!');
  if (k === 1) g.p(x + 1, y - 2, rp + '.2!');
  if (k === 2) { g.p(x - 1, y - 1, rp + '.2!'); g.p(x, y - 2, rp + '.2!'); }
}

/* 彩旗串：細繩＋小三角旗（不描邊，保持輕盈） */
function w2_pennants(g, x0, y0, x1, y1, step, seed) {
  const cols = ['red.1^~', 'yellow.0^~', 'green.1^~', 'blue.0^~', 'white.0^~', 'orange.1^~'];
  g.l(x0, y0, x1, y1, 'black.0^~');
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  for (let k = 2, j = seed || 0; k < n - 1; k += step, j++) {
    const x = Math.round(x0 + (x1 - x0) * k / n), y = Math.round(y0 + (y1 - y0) * k / n), c = cols[j % cols.length];
    g.p(x, y + 1, c); g.p(x + 1, y + 1, c); g.p(x, y + 2, c);
  }
}

        if (b <= 1 && o >= 2) c = 'brick';

        else if (o === 5) c = 'green.1~'; else c = 'w2_hull';
        g.p(x, y, c);
      }
    }
    /* 龍目 */
    g.s(['.RRRR.', 'RwwKKR', 'RwwKKR', '.RRRR.'], { R: 'red.1~', w: 'white.0~', K: 'ink.1~' }, 51, 15);
    g.p(52, 16, 'white.0~');

    w2_glyphs(g, 31, 24, 3, 'navy.2~', false, 2);
    /* 舊輪胎護舷 */
    for (const tx of [11, 21, 43]) { const s = Math.round(S(tx)); g.p(tx + 1, s + 1, 'straw.1~'); g.s(['.kk.', 'kKKk', 'kKKk', '.kk.'], { k: 'black.1~', K: 'black.3~' }, tx, s + 2); }

function a2_bricks(pb, x0, y0, w, h, c, m) { pb.rect(x0, y0, w, h, c); for (let y = y0 + 2; y < y0 + h; y += 3) pb.line(x0, y, x0 + w - 1, y, m); for (let y = y0, r = 0; y < y0 + h; y += 3, r++) for (let x = x0 + (r % 2) * 3; x < x0 + w; x += 6) pb.px(x, y, m); }
function a2_shop(pb, o, p, kind, i) {
  pb.rect(o, p, 48, 5, 'brick.3~'); for (let x = 0; x < 48; x += 3) pb.px(o + x, p + 4, 'ink.2~'); pb.rect(o, p + 5, 48, 1, 'stone.2~');
  const wall = kind === 'closed' ? 'stone' : kind === 'grocer' ? 'jade' : 'white';
  pb.rect(o, p + 6, 48, 19, wall);
  if (kind !== 'grocer') for (const [x, y] of [[3, 9], [40, 18], [20, 7]]) { pb.px(o + x, p + y, wall + '.2~'); pb.px(o + x + 1, p + y + 1, wall + '.2~'); }
  for (const wx of [7, 31]) {
    pb.rect(o + wx, p + 9, 10, 12, 'dwood'); const lit = kind === 'paper' ? wx === 7 : kind === 'grocer' ? wx === 31 : false;
    pb.rect(o + wx + 1, p + 10, 8, 10, lit ? 'gold.0!' : 'ink.2~'); pb.line(o + wx + 5, p + 10, o + wx + 5, p + 19, 'dwood.2'); pb.line(o + wx + 1, p + 15, o + wx + 8, p + 15, 'dwood.2');
    if (kind === 'closed') for (let x = wx + 2; x < wx + 9; x += 2) pb.line(o + x, p + 10, o + x, p + 19, 'metal');
  }
  pb.rect(o, p + 22, 48, 2, 'stone.2'); for (let x = 1; x < 48; x += 3) pb.px(o + x, p + 24, 'stone.3~');
  const sc = kind === 'grocer' ? 'blue' : 'red'; pb.rect(o + 13, p + 25, 22, 5, sc); pb.rect(o + 13, p + 25, 22, 1, sc + '.0~');
  for (let k = 0; k < 4; k++) { pb.rect(o + 16 + k * 5, p + 26, 3, 3, 'gold.0~'); pb.px(o + 17 + k * 5, p + 27, sc + '.2~'); }
  pb.rect(o, p + 30, 48, 24, 'ink.2~');
  if (kind === 'paper') {
    pb.rect(o + 5, p + 34, 1, 18, 'white.0!'); pb.px(o + 5, p + 33, 'fire.0!');
    pb.rect(o + 7, p + 43, 11, 9, 'red'); pb.poly([[o + 6, p + 43], [o + 12.5, p + 37], [o + 19, p + 43]], 'gold'); pb.rect(o + 9, p + 45, 3, 3, 'blue~'); pb.rect(o + 14, p + 45, 2, 7, 'gold.2~');
    for (const [x, c] of [[28, 'blue'], [34, 'pink'], [40, 'blue']]) { pb.rect(o + x, p + 44, 5, 8, c); pb.ell(o + x + 2, p + 41, 2.5, 2.5, 'white~'); pb.px(o + x + 1, p + 42, 'red.1~'); pb.px(o + x + 3, p + 42, 'red.1~'); pb.rect(o + x, p + 38, 5, 2, 'ink'); }
    pb.rect(o + 22, p + 36, 4, 16, 'straw.2'); pb.px(o + 23, p + 37, 'straw.0~');
  } else if (kind === 'closed') {
    for (const [x0, x1] of [[4, 22], [26, 44]]) { pb.rect(o + x0, p + 30, x1 - x0, 24, 'metal'); for (let y = 32; y < 54; y += 2) pb.line(o + x0, p + y, o + x1 - 1, p + y, 'metal.2~'); }
    pb.px(o + 10, p + 40, 'red.2~'); pb.px(o + 11, p + 40, 'red.2~'); pb.px(o + 12, p + 41, 'red.2~'); pb.rect(o + 32, p + 44, 6, 1, 'blue.2~');
  } else {
    pb.rect(o + 6, p + 31, 36, 1, 'white.0!');
    for (let r = 0; r < 3; r++) { pb.rect(o + 5, p + 37 + r * 6, 38, 1, 'dwood'); for (let k = 0; k < 9; k++) pb.rect(o + 6 + k * 4, p + 34 + r * 6, 3, 3, ['red', 'gold', 'green', 'blue', 'pink', 'orange'][(k + r * 2) % 6]); }
  }
  pb.rect(o, p + 29, 4, 25, 'brick'); pb.rect(o + 22, p + 29, 4, 25, 'brick'); pb.rect(o + 44, p + 29, 4, 25, 'brick'); pb.rect(o, p + 29, 48, 2, 'brick.2');
  pb.rect(o, p + 54, 48, 2, 'stone.2');
}

/* 一張供桌（透視縮放）：x 中心、y 桌面、s 比例；rich＝鄉親的菜，flag＝插黑旗 */
function sc_table(B, x, y, s, rich, flag, R) {
  const tw = Math.max(4, Math.round(14 * s)), th = Math.max(2, Math.round(5 * s)), x0 = Math.round(x - tw / 2);
  B.rect(x0, y, tw, th, sc_c('#a8302a')); B.rect(x0, y, tw, 1, sc_c('#e0605a')); if (s > 0.8) { B.rect(x0 + 1, y + th, 1, Math.round(2 * s), sc_c('#3a1a14')); B.rect(x0 + tw - 2, y + th, 1, Math.round(2 * s), sc_c('#3a1a14')); }
  const u = Math.max(1, Math.round(s));
  if (rich) {
    B.ell(x - tw * 0.22, y - u, 3 * s, 1.6 * s, sc_c('#f2eee2')); B.ell(x - tw * 0.22, y - u * 1.6, 2.2 * s, 1.2 * s, sc_c('#c89060'));
    B.ell(x + tw * 0.18, y - u, 3 * s, 1.4 * s, sc_c('#e8e8f0')); B.ell(x + tw * 0.18, y - u * 1.5, 2.4 * s, 1 * s, sc_c('#8aa0b8'));
    B.rect(Math.round(x + tw * 0.38), y - 3 * u, u, 3 * u, sc_c(R && R() < 0.5 ? '#3a8a4a' : '#d85a3a'));
  } else {
    B.ell(x - tw * 0.2, y - u, 2.4 * s, 1.6 * s, sc_c('#e8b070')); B.rect(Math.round(x + tw * 0.12), y - 3 * u, Math.max(1, Math.round(2 * s)), 3 * u, sc_c('#e0a030')); B.px(Math.round(x + tw * 0.12), y - 4 * u, sc_c('#4a8a2a'));
    B.rect(Math.round(x + tw * 0.34), y - 2 * u, u, 2 * u, sc_c('#4a80e0'));
  }
  if (flag) { const fy = y - Math.round(8 * s); B.line(x, y - 1, x, fy, sc_c('#1a1418')); B.rect(x + 1, fy, Math.max(1, Math.round(3 * s)), Math.max(1, Math.round(2 * s)), sc_c('#08080c')); }
  B.fl = 1; const c = { x: x0 + 1, y: y - 2 }; B.px(c.x, c.y, sc_c('#ffd070')); B.px(c.x, c.y + 1, sc_c('#e04040')); B.fl = 0;
  return c;
}
/* 舞台車：LED 牆（自發光）；回傳 LED 區 */
function sc_stageTruck(B, x, gy, sw, sh) {
  const x0 = Math.round(x - sw / 2), y0 = Math.round(gy - sh);
  B.rect(x0 - 2, y0 - 3, sw + 4, sh + 3, sc_c('#18161e')); B.rect(x0 - 2, gy - Math.round(sh * 0.18), sw + 4, Math.round(sh * 0.18), sc_c('#2a2630'));
  B.rect(x0 - 2, y0 - 4, sw + 4, 1, sc_c('#6a6a78'));
  B.fl = 1; const ly = y0 + 1, lh = Math.round(sh * 0.7);
  B.vgrad(x0, ly, sw, lh, ['#5a1a8a', '#b02ab0', '#ff5a9a'].map(sc_c));
  for (let yy = ly; yy < ly + lh; yy += 2) B.span(yy, x0, x0 + sw - 1, sc_c('#2a0a3a'), 0.35);
  const gs = Math.max(3, Math.round(lh * 0.22)); for (let k = 0; k < 5; k++) sc_glyph(B, x0 + 3 + k * (gs + 2), ly + Math.round(lh * 0.62), gs, 300 + k, sc_c('#fff4c0'));
  sc_pag(B, Math.round(x0 + sw * 0.8), ly + Math.round(lh * 0.55), Math.round(lh * 0.5), sc_c('#ffe0ff'), 5);
  for (let k = 0; k < sw; k += 3) B.px(x0 + k, y0 - 2, sc_c(['#ff4ad8', '#4af0ff', '#fff04a', '#7aff6a'][(k / 3 | 0) % 4]));
  B.fl = 0; return { x: x0, y: ly, w: sw, h: lh };

/* 前景人群剪影（手機亮點） */
function sc_crowd(B, w, gy, n, hh, col, R, phone) {

sc_def('plaza', 'temple', {

    B.fl = 1; for (let i = 0; i < 3; i++) sc_cloud(B, Math.round(R() * w * 0.8), Math.round(gy * (0.25 + i * 0.18)), Math.round(w * 0.4), 3 + i, 20 + i, sc_c('#8a4a6a'), sc_c('#ffb080'), 0.5, 0.5);

    const st = sc_stageTruck(B, Math.round(w * (P ? 0.86 : 0.84)), gy + Math.round(hw * 0.22), Math.round(hw * (P ? 0.8 : 1)), Math.round(hw * 0.52));

  resume() { const g = G; if (!g || g.state !== 'paused') return; $('mPause').hidden = true; g.state = 'play'; },
  restart() { const id = G.chId, fs = G.fromStory; commitStats(); beginPlay(id, { fromStory: fs }); },
  quit() { if (G) commitStats(); G = null; Title.show(); },
  statsHTML(rows) { return rows.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join(''); },
  showDead() {
    const g = G;
    if (g.endless) { $('dTitle').textContent = '撐了 ' + fmtTime(g.t); $('dLine').textContent = g.t >= (Save.d.endless || 0) - 0.5 ? '新紀錄。' : '最佳紀錄 ' + fmtTime(Save.d.endless) + '。'; }
    else { $('dTitle').textContent = '你倒下了'; $('dLine').textContent = (typeof DEATH !== 'undefined' && DEATH[g.chId]) || g.ch.deadLine || ''; }
    $('dStats').innerHTML = this.statsHTML([['撐了', fmtTime(g.t)], ['超渡', g.kills], ['最高連超渡', g.maxCombo], ['等級', 'LV ' + g.p.lv]]);
    $('dTip').textContent = typeof TIPS !== 'undefined' && TIPS.length ? '提示｜' + pick(TIPS) : '';
    $('mDead').hidden = false;
  },
  showClear() {
    const g = G, ch = g.ch;
    $('cTitle').textContent = ch.no + '　' + ch.title; $('cSub').textContent = ch.clearLine || '這一夜，撐過去了。';
    $('cStats').innerHTML = this.statsHTML([['用時', fmtTime(g.t)], ['超渡', g.kills], ['最高連超渡', g.maxCombo], ['等級', 'LV ' + g.p.lv], ['請神', g.godN + ' 次'], ['受到傷害', Math.round(g.dmgTaken)]]);
    const box = $('cAch'); box.innerHTML = '';
    for (const id of g.newAch) { const T_ = (typeof ACHTEXT !== 'undefined' && ACHTEXT[id]) || { n: id }; box.innerHTML += `<span class="chip gold">成就｜${T_.n}</span>`; }
    $('mClear').hidden = false; SFX('win');
  },
  continueAfterClear() {
    const id = G.chId, ch = CHAPTERS[id]; G = null;
    Story.play(ch.outro, () => { if (id === 5 && typeof playFinal === 'function') playFinal(); else if (CHAPTERS[id + 1]) startChapter(id + 1); else { Title.show(); Toast.show('下一章還在趕工中'); } });
  },
  credits(kind) { App.go('end'); Scene.set(kind === 'A' ? 'endA' : 'endB'); $('endTitle').textContent = kind === 'A' ? '回家' : '守門'; $('endLine').textContent = kind === 'A' ? '三百一十二個名字，一個一個被唸出來。' : '每年七月初一，門開的時候，他都在。'; }
};

/* ---------- 主迴圈 ---------- */
let LAST = 0, ACC = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!LAST) LAST = now; let dt = (now - LAST) / 1000; LAST = now; if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  if (App.screen === 'play' && G) {
    if (G.state === 'play' || G.state === 'dying' || G.state === 'clearing' || G.state === 'cutin') {
      ACC += dt; const step = 1 / 60; let n = 0;
      while (ACC >= step && n < 4) { update(step); ACC -= step; n++; if (!G) break; }
      if (n >= 4) ACC = 0;
    } else ACC = 0;
    if (G) { render(dt); HUD.sync(dt); }
  } else if (App.screen === 'story') Story.frame(dt);
  else Scene.frame(dt);
}
function buildArt() {
  for (const k in RIGDEF) { try { SPR[k] = rig(RIGDEF[k]); } catch (e) { console.warn('rig', k, e); } }
  buildMini(); buildWeaponArt();
}
function toggle(key) { Save.d[key] = !Save.d[key]; Save.save(); if (typeof AU !== 'undefined' && AU.ready) AU.setOn(Save.d.sound, Save.d.music); Title.render(); UI.syncToggles(); SFX('click'); }
function boot() {
  Save.load(); if (IS_TOUCH) document.body.classList.add('touch');
  measureView(); VIEW.cv = $('cv'); VIEW.ctx = fitCanvas(VIEW.cv); Scene.cv = $('scv'); Scene.ctx = fitCanvas(Scene.cv);
  buildArt();
  addEventListener('resize', () => { measureView(); VIEW.ctx = fitCanvas(VIEW.cv); Scene.resize(); FX.ensure(); });
  Input.init();
  const unlock = () => { if (typeof AU === 'undefined') return; const was = AU.ready; AU.init(); if (!was && AU.ready) AU.setOn(Save.d.sound, Save.d.music); };
  for (const ev of ['pointerdown', 'touchend', 'click', 'keydown']) document.addEventListener(ev, unlock, true);
  const on = (id, fn) => $(id).addEventListener('click', e => { e.stopPropagation(); fn(e); });
  on('bStart', () => { SFX('click'); const d = Save.d; startChapter(d.cleared[5] ? 1 : Math.min(5, d.unlocked)); });
  on('bChapters', () => { SFX('click'); renderChapters(); App.go('chapters'); });
  on('bEndless', () => { if (!Save.d.endlessOpen) { Toast.show('先通關第一章'); return; } if (!CHAPTERS.E) { Toast.show('百鬼夜行還在趕工中'); return; } SFX('click'); beginPlay('E'); });
  on('bAch', () => { SFX('click'); renderAch(); App.go('ach'); });
  on('bSet', () => { SFX('click'); $('setPanel').hidden = false; });
  on('sSound', () => toggle('sound')); on('sMusic', () => toggle('music')); on('sVib', () => toggle('vib')); on('sClose', () => { $('setPanel').hidden = true; });
  on('bChBack', () => { SFX('back'); Title.show(); }); on('bAchBack', () => { SFX('back'); Title.show(); }); on('bEndBack', () => { SFX('back'); Title.show(); });
  on('stSkip', () => Story.skip());
  $('scrStory').addEventListener('click', e => { if (e.target.closest('button')) return; Story.advance(); });
  on('lvReroll', () => UI.reroll()); on('hbOk', () => UI.hbClose());
  on('pResume', () => UI.resume()); on('pRestart', () => UI.restart()); on('pQuit', () => UI.quit());
  on('pSound', () => toggle('sound')); on('pMusic', () => toggle('music'));
  on('dRetry', () => UI.restart()); on('dMenu', () => UI.quit()); on('cNext', () => UI.continueAfterClear());
  const act = (id, fn) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fn(); });
  act('btnDash', doDash); act('btnGod', () => invokeGod('tai')); act('btnGod2', () => invokeGod('guan')); act('btnPause', () => UI.pause());
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (App.screen === 'play' && G && G.state === 'play') UI.pause(); if (typeof AU !== 'undefined' && AU.ready) AU.suspend(); } else if (typeof AU !== 'undefined' && AU.ready) AU.resume(); });
  $('loading').hidden = true;
  Title.show();
  requestAnimationFrame(frame);
}
boot();
