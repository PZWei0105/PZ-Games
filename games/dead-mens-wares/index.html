    const w = el(`<div class="newgame"><div style="max-width:560px;margin:0 auto"><h2 style="margin:6px 0 4px;font-size:1.5em;letter-spacing:.1em">新開張</h2><p class="muted small" style="margin:0 0 12px">戚記當鋪的前掌櫃死在地窖裡已經一個月。今天起，鋪子歸你。</p>
      <div class="sect">掌櫃的名字</div><input class="field" id="ng-name" maxlength="6" value="魏子葳">
      <div class="sect">出身</div><div id="ng-bg"></div>
      <div class="sect">難度</div><div class="seg" id="ng-diff"></div><p class="small muted" id="ng-diffd"></p>
      <div class="sect">模式</div><div class="seg" id="ng-mode"><button data-m="story" class="on">主線（56 日）</button><button data-m="endless">無盡經營</button></div><p class="small muted" id="ng-moded">跟著七件遺物的故事走到鐘夜。</p>
      <div class="col mt2"><button class="btn pri big" id="ng-go">開門</button><button class="btn quiet" id="ng-back">返回</button></div></div></div>`);
    document.body.appendChild(w);
    const drawBg = () => { w.querySelector('#ng-bg').innerHTML = Object.entries(D.BACKGROUNDS).map(([k, b]) => { const lock = b.locked && !m.unlocked[k]; return `<div class="bgopt ${bg === k ? 'on' : ''} ${lock ? 'lock' : ''}" data-bg="${k}">${lock ? `<div style="width:30px;flex:none;display:grid;place-items:center;color:var(--muted)">${icon('lock')}</div>` : ''}<div><div class="nm">${b.n}</div><div class="d">${lock ? '完成一次結局後解鎖。' : b.d}</div><div class="small muted">本錢 ${b.cash} 兩</div></div></div>`; }).join(''); };
    const drawDiff = () => { w.querySelector('#ng-diff').innerHTML = Object.entries(D.DIFFS).map(([k, d]) => `<button data-d="${k}" class="${diff === k ? 'on' : ''}">${d.n}</button>`).join(''); w.querySelector('#ng-diffd').textContent = D.DIFFS[diff].d; };
    drawBg(); drawDiff();
    w.addEventListener('click', (e) => {
      const b1 = e.target.closest('[data-bg]'); if (b1 && !b1.classList.contains('lock')) { bg = b1.dataset.bg; drawBg(); sfx('tick'); }
      const b2 = e.target.closest('[data-d]'); if (b2) { diff = b2.dataset.d; drawDiff(); sfx('tick'); }
      const b3 = e.target.closest('[data-m]'); if (b3) { mode = b3.dataset.m; w.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b3)); w.querySelector('#ng-moded').textContent = mode === 'story' ? '跟著七件遺物的故事走到鐘夜。' : '沒有主線，債務每週加重，看你能撐多久、賺多少。'; sfx('tick'); }
    });
    w.querySelector('#ng-back').addEventListener('click', () => { w.remove(); title(); });
    w.querySelector('#ng-go').addEventListener('click', () => {
      const name = (w.querySelector('#ng-name').value || '魏子葳').trim().slice(0, 6) || '魏子葳';
      ST.wipe();
      G.newGame({ name, bg, diff, mode });
      ST.save();
      w.remove();
      SND.play('open');
      startGame();
    });
  }
  function startGame() {
    st.screen = 'game'; st.tab = 'counter'; UI.st.morningShown = 0;
    UI.renderGame();
    SND.setMood(S.phase === 'day' ? 'day' : S.phase === 'night' ? 'night' : 'morning');
    if (S.phase === 'night') setTimeout(() => night(), 300);
    if (S.phase === 'day' && S.insp) setTimeout(() => inspection(), 400);
  }

  // ---------- 設定 ----------
  ACT.settings = () => {
    const m = ST.meta(); const s = m.settings;
    const sh = UI.sheet(`<h2>設定</h2>
      <div class="col">
        <label class="small">配樂音量<input type="range" min="0" max="1" step="0.05" value="${s.music}" data-s="music" style="width:100%"></label>
        <label class="small">音效音量<input type="range" min="0" max="1" step="0.05" value="${s.sfx}" data-s="sfx" style="width:100%"></label>
        <label class="small">文字速度<input type="range" min="0.5" max="3" step="0.5" value="${s.textSpeed}" data-s="textSpeed" style="width:100%"></label>
        <label class="small">字級<input type="range" min="0.9" max="1.25" step="0.05" value="${s.fontScale}" data-s="fontScale" style="width:100%"></label>
        <label class="row small"><input type="checkbox" ${s.vibrate ? 'checked' : ''} data-s="vibrate"> 震動回饋</label>
        <label class="row small"><input type="checkbox" ${s.hints ? 'checked' : ''} data-s="hints"> 阿檀的提示</label>
      </div>
      <button class="btn wide mt" data-act="handbook">${UI.icon('book')} 掌櫃手冊</button>
      ${S && st.screen === 'game' ? `<div class="sect">存檔</div><div class="row wrap"><button class="btn sm grow" data-k="export">匯出存檔碼</button><button class="btn sm grow" data-k="import">匯入存檔碼</button></div><p class="small muted">${ST.isStorageOK() ? '遊戲每天早上會自動存檔。' : '這個環境無法自動存檔，請記得匯出存檔碼。'}</p><div class="row mt"><button class="btn sm grow" data-k="title">回到標題</button></div>` : `<div class="sect">存檔</div><button class="btn sm wide" data-k="import">匯入存檔碼</button>`}`);

/* ===== 19 啟動 ===== */
(() => {
  // 在 Claude 裡開著的時候，頁面更新會重新載入；先把進度記下，載入後接著玩
  const H = (typeof window !== 'undefined' && window.claude && window.claude.hot) || null;
  function snap() {
    try {
      const inGame = !!(S && UI.st.screen === 'game' && !S.ended);
      return { save: inGame ? JSON.stringify(S) : ST.raw('save'), meta: ST.raw('meta'), resume: inGame };
    } catch (e) { return {}; }
  }
  let booted = false;
  function boot(data) {
    if (booted) return; booted = true;
    try { document.documentElement.lang = 'zh-Hant'; } catch (e) { }
    document.body.insertAdjacentHTML('afterbegin', ART.defs());
    try { if (data && (data.save || data.meta)) ST.restoreRaw(data); } catch (e) { }
    try { const m = ST.meta(); document.documentElement.style.setProperty('--fs', m.settings.fontScale || 1); } catch (e) { }
    UI.bindRoot();
    // 第一次觸碰時啟動聲音（瀏覽器規定必須在手勢裡建立）
    const unlock = () => { try { SND.init(ST.meta().settings); if (UI.st.screen === 'title') SND.setMood('title'); } catch (e) { } window.removeEventListener('pointerdown', unlock, true); };
    window.addEventListener('pointerdown', unlock, true);
    // 切到背景時存檔
    document.addEventListener('visibilitychange', () => { if (document.hidden && S && UI.st.screen === 'game') ST.save(); });
    window.addEventListener('pagehide', () => { if (S && UI.st.screen === 'game') ST.save(); });
    window.addEventListener('error', (e) => { try { console.error(e.error || e.message); } catch (er) { } });
    let resumed = false;
    if (data && data.resume) { try { if (ST.load()) { FLOW.startGame(); resumed = true; } } catch (e) { resumed = false; } }
    if (!resumed) FLOW.title();
  }
  function go(data) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot(data)); else boot(data);
  }
  try { if (H && typeof H.snapshot === 'function') H.snapshot(snap); } catch (e) { }
  if (H && typeof H.ready === 'function') {
    try { H.ready((d) => go(d || {})); } catch (e) { go({}); }
    setTimeout(() => go({}), 2500); // 保險：外框沒有回應時照常開機
  } else go((H && H.data) || {});
})();
