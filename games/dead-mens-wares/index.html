      flags: {}, read: {},
      items: {}, mats: { m_metal: 3, m_leather: 1, m_cloth: 2, m_wood: 2, m_bone: 0, m_crystal: 0, m_salt: 1, m_wax: 1, m_herb: 0, m_ink: 1 },
      upg: {}, unlocked: { map: false, hidden: false, workshop: false, cellar: false, forgery: false, brewing: false, nightmarket: false },
      jobs: [], advs: {}, lost: { bell: [], river: [], abbey: [], crater: [], capital: [] },
      regions: { bell: { danger: 0, until: 0 }, river: { danger: 0, until: 0 }, abbey: { danger: 0, until: 0 }, crater: { danger: 0, until: 0 }, capital: { danger: 0, until: 0 } },
      relics: { r1: { h: 'qi' }, r2: { h: 'ruins', at: 'abbey' }, r3: { h: 'candle' }, r4: { h: 'watch' }, r5: { h: 'ruins', at: 'crater' }, r6: { h: 'scale' }, r7: { h: 'armor' } },
      pawns: [], credits: [], sponsor: [],
      market: { demand: { weapon: 1, armor: 1, charm: 1, kit: 1, curio: 1, contra: 1 }, offers: [], bought: {} },
      queue: [], candle: 0, candleMax: 20, cur: null, insp: null, inspAt: -1,
      today: null, report: null, news: [], rumors: [], morningCards: [],
      journal: { notes: [], frags: {}, chains: {}, dead: [], seen: {}, log: [] },
      evDone: {}, evQueue: [], evToday: { morning: [], counter: [], night: [] },
      stats: { sold: 0, bought: 0, revenue: 0, spent: 0, reads: 0, fakes: 0, deaths: 0, saved: 0, inspections: 0, bribes: 0, maxCash: 0 },
      tips: {}, pledge: null, ended: null, tide: 0, bellnight: null,
      ghostsSeen: 0, lastAutosave: 0,
    };
    // 出身
    if (s.bg === 'scavenger') { s.rep.guild += 10; }
    if (s.bg === 'pawn') { s.upg.tools_1 = true; }
    if (s.bg === 'deserter') { s.rep.watch -= 15; s.upg.lock_1 = true; }
    if (s.bg === 'forger') { s.unlocked.forgery = true; s.heat = 12; s.mats.m_ink = 3; }
    if (s.bg === 'monkish') { s.flags.candle_license = true; s.rep.candle -= 10; s.mats.m_salt = 3; s.mats.m_wax = 3; }
    if (s.bg === 'crowling') { s.rep.crows += 30; s.flags.crows_fee_waived = true; s.heat = 12; }
    if (s.mode === 'endless') { s.act = 2; s.unlocked.map = true; s.unlocked.hidden = true; s.unlocked.workshop = true; s.unlocked.cellar = true; s.flags.endless = true; }
    return s;
  }

  function save(slot) {
    if (!S) return false;
    S.lastAutosave = Date.now();
    S.uidc = S.uidc || 0;
    const ok = lsSet(KEY, JSON.stringify(S));
    return ok;
  }
  function hasSave() { const v = lsGet(KEY); if (!v) return null; try { const o = JSON.parse(v); return o && o.v ? o : null; } catch (e) { return null; } }
  function load() {
    const o = hasSave(); if (!o) return false;
    S = migrate(o); U.bindRng(S.rng); U.setUidBase(S.uidc || 0); return true;
  }
  function wipe() { lsDel(KEY); }
  function migrate(o) {
    o.trust = o.trust || { tan: 15, armor: 0, qin: 0 };
    o.evToday = o.evToday || { morning: [], counter: [], night: [] };
    o.sponsor = o.sponsor || [];
    o.stats = o.stats || {};
    return o;
  }
  function exportCode() {
    const json = JSON.stringify(S);
    try { return 'RELIC1:' + btoa(unescape(encodeURIComponent(json))); } catch (e) { return ''; }
  }
  function importCode(code) {
    try {
      code = String(code).trim();
      if (code.startsWith('RELIC1:')) code = code.slice(7);
      const json = decodeURIComponent(escape(atob(code)));
      const o = JSON.parse(json);
      if (!o || !o.v || !o.day) return false;
      S = migrate(o); U.bindRng(S.rng); U.setUidBase(S.uidc || 0); save(); return true;
    } catch (e) { return false; }
  }
  // 跨局的紀錄（結局、解鎖出身、成就）
  function meta() {
    const v = lsGet(META);
    let m = null; try { m = v ? JSON.parse(v) : null; } catch (e) { m = null; }
    m = m || {};
    m.endings = m.endings || {}; m.ach = m.ach || {}; m.unlocked = m.unlocked || {}; m.runs = m.runs || 0;
    m.settings = Object.assign({ music: 0.55, sfx: 0.8, textSpeed: 1, vibrate: true, fontScale: 1, hints: true }, m.settings || {});
    return m;
  }
  function saveMeta(m) { lsSet(META, JSON.stringify(m)); }
  function isStorageOK() { lsGet('__t'); try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storageOK = false; } return storageOK; }
  // 頁面更新重載時，把當下的進度原樣接回來
  function raw(which) { return lsGet(which === 'meta' ? META : KEY); }
  function restoreRaw(d) { if (!d) return; if (typeof d.save === 'string' && d.save) lsSet(KEY, d.save); if (typeof d.meta === 'string' && d.meta) lsSet(META, d.meta); }
  return { newState, save, load, hasSave, wipe, exportCode, importCode, meta, saveMeta, isStorageOK, raw, restoreRaw };
})();


/* ---- 04_items.js ---- */
/* ===== 04 物品 ===== */
const I = (() => {
  const T = D.T;
  function tmpl(it) { return T[it.t]; }

  function make(tid, o) {
    o = o || {};
    const t = T[tid];
    if (!t) throw new Error('no template ' + tid);
    const tier = U.clamp(o.tier || U.ri(t.tiers[0], t.tiers[1]), t.tiers[0], t.tiers[1]);
    const it = {
      id: U.uid('i'), t: tid, tier,
      cond: o.cond != null ? o.cond : U.ri(30, 95),
      auth: o.auth != null ? o.auth : true,
      prov: o.prov || 'clean',
      curse: o.curse ? { t: o.curse[0], l: o.curse[1] } : null,
      origin: o.origin || null, region: o.region || null,
      tags: Array.from(new Set([].concat(t.tags, o.tags || []))),
      name: o.name || null, frag: o.frag || null,
      k: { look: false, test: false, ledger: false, read: false },
      hist: [], seed: U.ri(1, 2e9), src: o.src || 'misc', price: 0,
      story: !!o.story, forged: o.forged || 0,
    };
    if (t.cat === 'relic') { it.relic = tid; it.cond = 100; it.auth = true; it.story = true; }
    if (it.origin && !it.tags.includes(it.origin)) it.tags.push(it.origin);
    if (it.region && !it.tags.includes(it.region)) it.tags.push(it.region);
    if (t.covRoll) it.covRoll = o.covRoll || U.pick(t.covRoll);
    // 自動已知
    if (t.cat === 'kit' || t.cat === 'material') { it.k.look = true; }
    if (!t.fakeable) { it.k.test = true; it.auth = true; }
    if (!it.name) it.name = genName(it);
    if (o.fragAuto !== false && !it.frag && t.cat !== 'relic') assignFrag(it, o.fragChance);
    if (!S.journal.seen[tid]) S.journal.seen[tid] = 1; else S.journal.seen[tid]++;
    S.items[it.id] = it;
    S.uidc = (S.uidc || 0) + 1;
    return it;
  }

  function genName(it) {
    const t = tmpl(it);
    if (t.cat === 'relic') return t.name;
    let n = t.name;
    const r = U.seeded(it.seed);
    if (it.tier >= 4 && ['weapon', 'armor', 'charm'].includes(t.cat)) {
      return '「' + D.EPITHETS[Math.floor(r() * D.EPITHETS.length)] + '」' + n;
    }
    if (it.origin && r() < 0.55 && D.ORIGIN[it.origin]) n = D.ORIGIN[it.origin] + n;
    else if (it.tier === 1 && r() < 0.5 && ['weapon', 'armor'].includes(t.cat)) n = U.pick(['舊', '粗鐵', '缺口']) + n;
    else if (it.tier === 3 && r() < 0.5 && ['weapon', 'armor'].includes(t.cat)) n = U.pick(['精鍛', '上好', '雙鍛']) + n;
    return n;
  }

  // ---- 殘念碎片 ----
  function fragPool() { return (CT.fragments && CT.fragments.ambient) || []; }
  function matchFrag(f, it) {
    const t = tmpl(it);
    if (f.t && f.t !== it.t) return false;
    if (f.cats && f.cats.length && !f.cats.includes(t.cat)) return false;
    if (f.regions && f.regions.length && it.region && !f.regions.includes(it.region)) return false;
    if (f.regions && f.regions.length && !it.region && !f.regions.includes('town')) return false;
    if (f.tags && f.tags.length && !f.tags.some(x => it.tags.includes(x))) return false;
    const cu = it.curse && D.CURSES[it.curse.t].bad ? it.curse.t : null;
    if (f.curse === 'skip') return true;
    if (f.curse === null || f.curse === undefined) { if (cu) return false; }
    else if (f.curse === 'any') { if (!cu) return false; }
    else if (f.curse !== cu) return false;
    return true;
  }
  function assignFrag(it, p) {
    const t = tmpl(it);
    if (p == null) p = t.cat === 'curio' ? 0.75 : t.cat === 'kit' ? 0.25 : 0.55;
    if (it.curse && D.CURSES[it.curse.t].bad) p = Math.max(p, 0.9);
    if (!U.chance(p)) return;
    S.fragUsed = S.fragUsed || {};
    // 故事鏈：每段只出現一次
    const chains = (CT.fragments && CT.fragments.chains) || [];
    if (U.chance(0.3)) {
      const strict = [], loose = [];
      for (const ch of chains) for (const f of (ch.frags || [])) {
        if (S.fragUsed[f.id]) continue;
        if (matchFrag({ t: f.t, cats: f.cats, regions: f.regions, tags: f.tags, curse: 'skip' }, it)) strict.push(f);
        else if ((!f.t || f.t === it.t) && (!f.cats || !f.cats.length || f.cats.includes(t.cat))) loose.push(f);
      }
      const pool = strict.length ? strict : (U.chance(0.35) ? loose : []);
      if (pool.length) { const f = U.pick(pool); it.frag = f.id; S.fragUsed[f.id] = true; return; }
    }
    const amb = fragPool().filter(f => matchFrag(f, it));
    if (!amb.length) return;
    const fresh = amb.filter(f => !S.fragUsed[f.id]);
    const f = U.pick(fresh.length ? fresh : amb);
    it.frag = f.id; S.fragUsed[f.id] = true;
  }
  let fragIndex = null;
  function fragById(id) {
    if (!fragIndex) {
      fragIndex = {};
      const F = CT.fragments || {};
      (F.ambient || []).forEach(f => fragIndex[f.id] = { text: f.text, kind: 'amb' });
      (F.chains || []).forEach(ch => (ch.frags || []).forEach((f, i) => fragIndex[f.id] = { text: f.text, kind: 'chain', chain: ch.id, idx: i }));
      (F.squad || []).forEach(f => fragIndex[f.id] = { text: f.text, kind: 'squad' });
      (F.qi || []).forEach(f => fragIndex[f.id] = { text: f.text, kind: 'qi' });
      (F.special || []).forEach(f => fragIndex[f.id] = { text: f.text, kind: 'special' });
    }
    return fragIndex[id] || null;
  }
  function chainById(id) { return ((CT.fragments && CT.fragments.chains) || []).find(c => c.id === id); }

  // ---- 數值 ----
  function baseVal(it) { const t = tmpl(it); return t.base * D.TIER_MULT[it.tier]; }
  function condF(c) { return 0.35 + 0.65 * c / 100; }
  function curseF(it) {
    if (!it.curse) return 1;
    const c = D.CURSES[it.curse.t];
    return c.bad ? (1 - 0.18 * it.curse.l) : (1 + 0.35 * it.curse.l);
  }
  function trueValue(it) {
    if (tmpl(it).cat === 'relic') return 5000;
    let v = baseVal(it) * condF(it.cond) * (it.auth ? 1 : 0.08) * curseF(it);
    return Math.max(1, Math.round(v));
  }
  // 依玩家已知資訊推估的範圍
  function estimate(it) {
    const t = tmpl(it);
    if (t.cat === 'relic') return { lo: 0, hi: 0, exact: false, relic: true };
    const b = baseVal(it);
    let lo = b, hi = b;
    if (it.k.look) { lo *= condF(it.cond); hi *= condF(it.cond); } else { lo *= condF(15); hi *= condF(100); }
    if (t.fakeable && !it.k.test) { lo *= 0.08; } else if (!it.auth) { lo *= 0.08; hi *= 0.08; }
    if (it.k.read) { lo *= curseF(it); hi *= curseF(it); } else { lo *= 0.64; hi *= 1.35; }
    const exact = it.k.look && (!t.fakeable || it.k.test) && it.k.read;
    if (exact) { const v = trueValue(it); return { lo: v, hi: v, exact: true }; }

  function placeNew(it) {
    if (free('store') > 0) { it.loc = 'store'; return true; }
    if (free('front') > 0) { it.loc = 'front'; return true; }
    return false;
  }
  function hasRoom() { return free('store') > 0 || free('front') > 0; }

  function suggest(it) {
    const e = I.estimate(it);
    if (e.relic) return 0;
    const v = e.exact ? e.lo : Math.round((e.lo + e.hi) / 2);
    return Math.max(1, Math.round(v * 1.25));
  }

  // ---------- 金錢紀錄 ----------
  function money(n, why) {
    S.cash += n;
    if (S.today) { if (n >= 0) S.today.income += n; else S.today.expense += -n; S.today.log.push([why, n]); }
    if (S.cash > S.stats.maxCash) S.stats.maxCash = S.cash;
  }
  function addHeat(n) { S.heat = U.clamp(S.heat + n, 0, 100); }
  function addSan(n) { S.sanity = U.clamp(S.sanity + n * (n < 0 ? D.DIFFS[S.diff].san : 1), 0, 100); }
  function rep(f, n) { S.rep[f] = U.clamp((S.rep[f] || 0) + n, -100, 100); }
  function trust(id, n) { if (S.advs[id]) S.advs[id].trust = U.clamp(S.advs[id].trust + n, -100, 100); else S.trust[id] = U.clamp((S.trust[id] || 0) + n, -100, 100); }
  function trustOf(id) { return S.advs[id] ? S.advs[id].trust : (S.trust[id] || 0); }
  function note(t) { if (!S.journal.notes.some(n => n[1] === t)) { S.journal.notes.push([S.day, t]); S.newNote = true; } }

  // ---------- 早上 ----------
  function startMorning() {
    S.phase = 'morning';
    S.morningRep = [];
    S.cur = null; S.insp = null;
    A.morning(S.morningRep);
    // 地區危險度回落
    for (const rid of D.REGION_IDS) { const r = S.regions[rid]; if (r.until && S.day > r.until) { r.danger = 0; r.until = 0; } }
    if (S.tide > 0) S.tide--;
    refreshMarket();
    genNews();
    // 劇情
    S.evToday = { morning: EV.collect('morning'), counter: EV.collect('counter'), night: [] };
    // 搜鋪
    S.inspToday = !!S.inspNext || U.chance(inspChance());
    S.inspNext = false;
    if (S.inspToday && (S.rep.crows >= 25 || S.bg === 'crowling' || trustOf('tan') >= 55 || S.flags.huo_ally)) {
      S.rumors.unshift({ type: 'inspect', text: rumorText('inspect') || '鴉巷的孩子說，今天碑樓的人往西街來。', warn: true });
    }
    S.morningCards = S.evToday.morning.slice();
    S.jobDone = S.jobDone || [];
  }
  function inspChance() {
    const base = U.clamp((S.heat - 8) / 130, 0, 0.55) * D.DIFFS[S.diff].insp;
    return S.day <= 3 ? 0 : base;
  }
  function rumorText(type) {
    const R = (CT.world && CT.world.rumors) || [];
    const p = R.filter(r => r.type === type);
    return p.length ? U.tpl(U.pick(p).text, { region: D.REGIONS[U.pick(D.REGION_IDS)].name }) : null;
  }
  function genNews() {
    const N = (CT.world && CT.world.news) || [];
    const ok = N.filter(n => {
      const w = n.when || {};
      if (w.act && S.act < w.act) return false;
      if (w.tide && !(S.tide > 0)) return false;
      if (w.region && !(S.regions[w.region] && S.regions[w.region].danger > 0)) return false;
      if (w.min_day && S.day < w.min_day) return false;
      if (w.max_day && S.day > w.max_day) return false;
      return true;
    });
    S.newsSeen = S.newsSeen || {};
    const fresh = ok.filter(n => !S.newsSeen[n.id]);
    const pool = fresh.length >= 2 ? fresh : ok;
    S.news = U.shuffle(pool.slice()).slice(0, 2).map(n => { S.newsSeen[n.id] = 1; const rr = n.when && n.when.region ? n.when.region : U.pick(D.REGION_IDS); return U.tpl(n.text, { region: D.REGIONS[rr].name, shop: S.shop, me: S.name }); });
    S.rumors = [];
    // 行情流言
    if (S.market.boost && S.market.boost.day === S.day) { /* 已在 refreshMarket 套用 */ }
    if (U.chance(0.4)) {
      const cat = U.pick(['weapon', 'armor', 'charm', 'kit', 'curio']);
      const t = rumorText('market_' + cat);
      if (t) { S.rumors.push({ type: 'market', cat, text: t }); S.market.boost = { cat, day: S.day + 1 }; }
    }
    if (U.chance(0.3)) { const t = rumorText('flavor'); if (t) S.rumors.push({ type: 'flavor', text: t }); }
    // 地區
    if (U.chance(0.18) && S.day > 4) {
      const rid = U.pick(D.REGION_IDS);
      const r = S.regions[rid]; r.danger = Math.max(r.danger, U.ri(1, 2)); r.until = S.day + U.ri(2, 4);
      const t = R_region(rid); if (t) S.rumors.push({ type: 'region', region: rid, text: t });
    }
  }
  function R_region(rid) { const R = (CT.world && CT.world.rumors) || []; const p = R.filter(r => r.type === 'region'); return p.length ? U.tpl(U.pick(p).text, { region: D.REGIONS[rid].name }) : D.REGIONS[rid].name + '那邊最近不太平。'; }

  function refreshMarket() {
    const dm = S.market.demand;
    for (const c in dm) dm[c] = U.clamp(dm[c] + (U.rand() - 0.5) * 0.12 + (1 - dm[c]) * 0.18, 0.72, 1.55);
    if (S.market.boost && S.market.boost.day === S.day) { dm[S.market.boost.cat] = U.clamp(dm[S.market.boost.cat] * 1.3, 0.72, 1.7); }
    // 地區危險 → 對應需求
    for (const rid of D.REGION_IDS) if (S.regions[rid].danger > 0) { if (rid === 'river') dm.kit = Math.min(1.7, dm.kit * 1.08); if (rid === 'abbey') dm.charm = Math.min(1.7, dm.charm * 1.08); if (rid === 'crater' || rid === 'bell') dm.weapon = Math.min(1.7, dm.weapon * 1.06); }
    if (S.tide > 0) { dm.charm = Math.min(1.8, dm.charm * 1.15); dm.kit = Math.min(1.8, dm.kit * 1.1); }
    // 早市貨
    const offers = [];
    const mats = U.shuffle(D.MAT_IDS.slice()).slice(0, 6);
    for (const m of mats) { const v = D.MATS[m].v; offers.push({ id: U.uid('o'), kind: 'mat', mat: m, price: Math.max(1, Math.round(v * U.rf(0.85, 1.25))), qty: U.ri(2, 7) }); }
    const kits = ['k_rope', 'k_lantern', 'k_ration', 'k_antidote', 'k_incense', 'k_salt', 'k_salve', 'k_map'];
    if (S.flags.candle_license) kits.push('k_holywater');
    for (const k of U.shuffle(kits).slice(0, 4)) { const t = D.T[k]; offers.push({ id: U.uid('o'), kind: 'kit', tid: k, tier: U.chance(0.1) ? Math.min(2, t.tiers[1]) : 1, price: 0, qty: U.ri(2, 5) }); }
    offers.forEach(o => { if (o.kind === 'kit') o.price = Math.max(2, Math.round(D.T[o.tid].base * D.TIER_MULT[o.tier] * U.rf(0.82, 1.0))); });
    offers.push({ id: U.uid('o'), kind: 'crate', price: 34 + S.act * 12, qty: U.ri(1, 2) });
    if (S.act >= 2 && U.chance(0.5)) {
      const tid = U.pick(['a_mask', 'c_bell', 'c_talisman', 'a_cloak', 'w_mace', 'w_bow', 'a_shield']);
      const t = D.T[tid]; const tier = U.clamp(U.ri(1, 1 + S.act), t.tiers[0], t.tiers[1]);
      offers.push({ id: U.uid('o'), kind: 'gear', tid, tier, price: Math.round(t.base * D.TIER_MULT[tier] * U.rf(0.85, 1.05)), qty: 1 });
    }
    S.market.offers = offers;
    // 鴉巷的貨郎（夜市開了才來）
    for (const id of (S.market.fence || [])) { const it = S.items[id]; if (it && it.loc === 'fence') delete S.items[id]; }
    S.market.fence = [];
    if (S.unlocked.nightmarket) {
      const n = U.ri(2, 4);
      for (let i = 0; i < n; i++) {
        const tid = U.pick(['v_seal', 'v_jade', 'v_hairpin', 'c_ring', 'c_amulet', 'w_silver', 'x_ash', 'x_tome', 'x_powder', 'x_skull', 'v_scroll', 'a_mail', 'w_xbow']);
        const t = D.T[tid];
        const o = { tier: U.clamp(U.ri(1, 1 + S.act), t.tiers[0], t.tiers[1]), cond: U.ri(30, 85), src: 'fence', prov: U.wpick({ stolen: 5, wanted: 2, grey: 3 }), origin: U.pick(['royal', 'noble', 'military']), region: U.pick(D.REGION_IDS) };
        if (U.chance(0.25)) o.curse = [U.pick(['blood', 'whisper', 'ruin', 'cling']), U.ri(1, 2)];
        const it = I.make(tid, o); it.loc = 'fence'; it.k.look = true;
        it.fencePrice = Math.max(4, Math.round(I.trueValue(it) * U.rf(0.38, 0.55)));
        S.market.fence.push(it.id);
      }
    }
  }
  function fenceBuy(id) {
    const it = S.items[id]; if (!it || it.loc !== 'fence') return { err: '貨已經沒了。' };
    if (S.cash < it.fencePrice) return { err: '錢不夠。' };
    if (!hasRoom()) return { err: '鋪子放不下了。' };
    money(-it.fencePrice, '跟貨郎買 ' + it.name);
    placeNew(it); it.bought = it.fencePrice; it.price = suggest(it); I.hist(it, '天亮前，從鴉巷的貨郎手上買來。');
    S.market.fence = S.market.fence.filter(x => x !== id);
    addHeat(it.prov === 'wanted' ? 5 : 2); rep('crows', 1);
    return { ok: true };
  }
  function fenceSellPrice(it) { return Math.max(1, Math.round(I.trueValue(it) * (I.tmpl(it).cat === 'contra' ? 0.7 : 0.55) / (it.curse && D.CURSES[it.curse.t].bad ? Math.max(0.4, I.curseF(it)) : 1))); }
  function fenceSell(id) {
    const it = S.items[id]; if (!it || it.relic || it.pawn) return { err: '這個不能賣。' };
    const p = fenceSellPrice(it);
    money(p, '銷贓 ' + it.name); rep('crows', 2); addHeat(1);
    if (I.tmpl(it).cat === 'contra') S.stats.contra = (S.stats.contra || 0) + 1;
    it.loc = 'gone'; if (!it.story) delete S.items[id]; else it.loc = 'lost:bell';
    return { ok: true, p };
  }
  function buyOffer(oid, qty) {
    const o = S.market.offers.find(x => x.id === oid); if (!o) return { ok: false, msg: '貨沒了。' };
    qty = Math.min(qty || 1, o.qty);
    const cost = o.price * qty;
    if (S.cash < cost) return { ok: false, msg: '錢不夠。' };
    if (o.kind === 'mat') { S.mats[o.mat] = (S.mats[o.mat] || 0) + qty; }
    else if (o.kind === 'kit' || o.kind === 'gear') {
      if (free('store') + free('front') < qty) return { ok: false, msg: '鋪子放不下了。' };
      for (let i = 0; i < qty; i++) { const it = I.make(o.tid, { tier: o.tier, cond: o.kind === 'kit' ? 100 : U.ri(70, 95), src: 'market', fragAuto: o.kind !== 'kit', fragChance: 0.25 }); it.k.look = true; it.k.test = true; it.k.ledger = true; if (o.kind === 'kit') it.k.read = true; placeNew(it); it.price = suggest(it); I.hist(it, '在早市買進。'); }
    } else if (o.kind === 'crate') {
      if (free('store') + free('front') < 3) return { ok: false, msg: '鋪子放不下了。' };
      const got = [];
      const n = U.ri(2, 4);
      for (let i = 0; i < n; i++) {
        const tid = U.pick(['v_coin', 'v_doll', 'w_dagger', 'a_helm', 'v_book', 'c_talisman', 'k_rope', 'v_mirror', 'w_spear', 'v_letter', 'c_ring', 'v_box', 'v_flute', 'a_cloak']);
        const it = I.make(tid, { tier: U.chance(0.12) ? 2 : 1, cond: U.ri(10, 70), src: 'crate', region: U.pick(D.REGION_IDS), origin: U.pick(['common', 'military', 'noble']), curse: U.chance(0.12) ? [U.pick(['whisper', 'ruin', 'blood', 'cling']), 1] : undefined });
        if (U.chance(0.04)) { it.tier = Math.min(D.T[tid].tiers[1], 3); it.name = I.genName(it); }
        placeNew(it); I.hist(it, '從早市雜貨箱裡翻出來。'); got.push(it.id);
      }
      o.qty -= 1; money(-o.price, '雜貨箱'); if (o.qty <= 0) S.market.offers = S.market.offers.filter(x => x !== o);
      return { ok: true, crate: got };
    }
    o.qty -= qty; if (o.qty <= 0) S.market.offers = S.market.offers.filter(x => x !== o);
    money(-cost, '早市');
    return { ok: true };
  }
  function junkPrice(it) {
    if (I.tmpl(it).cat === 'relic' || I.tmpl(it).cat === 'contra') return 0;
    const v = I.trueValue(it);
    return Math.max(1, Math.round(v * (it.curse && D.CURSES[it.curse.t].bad ? 0.12 : 0.28)));
  }
  function sellJunk(id) {
    const it = S.items[id]; if (!it) return false; const p = junkPrice(it); if (!p) return false;
    if (it.pawn) return false;
    money(p, '賣給收破爛的'); it.loc = 'gone'; if (!it.story) delete S.items[id]; else it.loc = 'lost:bell';
    return p;
  }

  // ---------- 開門 ----------
  function openShop() {
    S.phase = 'day';
    S.candleMax = 20 + (trustOf('tan') >= 50 ? 1 : 0) + (S.flags.jiu_hired ? 1 : 0);
    S.candle = S.candleMax;
    S.today = { income: 0, expense: 0, buys: 0, sells: 0, log: [], served: 0 };
    S.queue = CU.genDay();
    S.inspAt = S.inspToday ? U.rf(5, 14) : -1;
    S.cur = null;
  }
  function spend(t) { S.candle = Math.max(0, S.candle - t); }
  function timeCost(kind) {
    let t = TIME[kind];
    if (kind === 'test' && S.upg.tools_1) t = 0.25;
    if (kind === 'look' && S.upg.tools_2) t = 0.25;
    return t;
  }

  // ---------- 櫃台 ----------
  function callNext(cid) {
    const c = S.queue.find(x => x.id === cid); if (!c) return null;
    S.cur = c; c.served = true; spend(TIME.call); S.today.served++;
    c.lineNow = CU.line(c, 'enter', { region: c.wants && c.wants.region ? D.REGIONS[c.wants.region].name : '' });
    if (c.mode === 'ghost') { spend(TIME.ghost); addSan(-3); S.ghostsSeen++; const dj = S.journal.dead.find(x => x.name === c.name); if (dj) dj.known = true; }
    if (c.mode === 'event') spend(TIME.event - TIME.call);
    return c;
  }
  function appraise(id, tool) {
    const it = S.items[id]; if (!it) return null;
    if (it.k[tool]) return { already: true };
    if (tool === 'ledger' && !S.upg.ledger_1) return { err: '沒有通緝冊。' };
    const t = S.phase === 'day' ? timeCost(tool) : 0;
    if (t > 0 && S.candle < t) return { err: '蠟燭快燒完了。' };
    if (t > 0) spend(t);
    const res = { tool };
    if (tool === 'read') {
      let cost = 6 + (it.curse && D.CURSES[it.curse.t].bad ? 6 * it.curse.l : 0) + (it.tier >= 4 ? 4 : 0);
      if (it.relic) cost = 22;
      if (S.bg === 'scavenger') cost = Math.round(cost * 0.7);
      if (S.bg === 'pawn') cost = Math.round(cost * 1.3);
      addSan(-cost); res.san = cost; S.stats.reads++;
      it.k.read = true;
      res.frag = readText(it);
      if (it.relic) { S.read[it.relic] = true; S.flags['read_' + it.relic] = true; res.relic = it.relic; }
      // 念瞳一併看出品相
      if (!it.k.look && U.chance(0.5)) it.k.look = true;
    } else {
      it.k[tool] = true;
    }
    // 心神過低：結果可能不可靠
    res.shaky = S.sanity < 35 && tool !== 'read' && U.chance(0.35);
    if (res.shaky) it.shaky = tool;
    return res;
  }
  function readText(it) {
    const out = [];
    if (it.relic) {
      const R = ((CT.fragments && CT.fragments.relics) || []).find(r => r.id === it.relic);
      return { relic: true, lines: R ? R.memory : ['……冕在發燙。'] };
    }
    if (it.deathFrag) { out.push({ who: it.deathFrag.who, text: it.deathFrag.text, death: true }); const dj = S.journal.dead.find(x => x.name === it.deathFrag.who); if (dj) dj.known = true; }
    if (it.frag) {
      const f = I.fragById(it.frag);
      if (f) {
        out.push({ text: f.text, kind: f.kind, chain: f.chain });
        S.journal.frags[it.frag] = S.day;
        if (f.kind === 'chain') {
          const ch = I.chainById(f.chain);
          const got = ch.frags.filter(x => S.journal.frags[x.id]).length;
          if (got >= ch.frags.length && !S.journal.chains[ch.id]) { S.journal.chains[ch.id] = S.day; out.push({ chainDone: ch.id, title: ch.title, text: ch.finale }); addSan(8); }
        }
      }
    }
    if (!out.length) out.push({ text: U.pick(['什麼都沒有。只有一點冷，像井底的石頭。', '殘念很淡，像有人在隔壁房間翻了個身。', '你只看見一片灰，和很遠的雨聲。', '它很乾淨。乾淨得不像從亡域出來的東西。']), empty: true });
    if (it.curse) out.push({ curse: true, text: D.CURSES[it.curse.t].n + '（' + D.CURSE_LV[it.curse.l] + '級）：' + D.CURSES[it.curse.t].d });
    return { lines: out };
  }

  // 客人賣東西給你
  function buyFrom(c, id, price) {
    const it = S.items[id];
    if (!hasRoom()) return { err: '前店和後庫都滿了。' };
    if (S.cash < price) return { err: '現銀不夠。' };
    spend(TIME.deal);
    money(-price, '收購 ' + it.name);
    c.items = c.items.filter(x => x !== id);
    placeNew(it);
    it.bought = price; it.boughtDay = S.day; it.boughtFrom = c.name;
    it.price = suggest(it);
    I.hist(it, '{shop}以 {p} 兩自{who}收購。'.replace('{shop}', S.shop).replace('{p}', price).replace('{who}', c.name));
    S.stats.bought++; S.today.buys++;
    // 公道與否
    const fair = price / Math.max(1, I.trueValue(it));
    if (['widow', 'refugee', 'townsfolk', 'adv'].includes(c.arch)) {
      if (fair < 0.42) { rep('folk', -1); if (c.advId) { const a = S.advs[c.advId]; a.trust -= 8; a.cheated++; if (a.named) S.flags['cheated_' + a.id] = true; rep('guild', -1); } }
      else if (fair > 0.85) { rep('folk', 1); if (c.advId) { S.advs[c.advId].trust += 4; } }
    }
    if (c.advId) { const a = S.advs[c.advId]; a.gold += price; }
    if (it.relic) { S.relics[it.relic] = { h: 'player' }; }
    if (it.prov === 'stolen' || it.prov === 'wanted') { addHeat(it.prov === 'wanted' ? 6 : 3); rep('crows', 1); }
    return { ok: true };
  }
  function declineItem(c, id) {
    c.items = c.items.filter(x => x !== id);
    const it = S.items[id];
    if (it) {
      if (it.relic) { /* 冒險者帶走遺物，會再回來 */ const a = S.advs[c.advId]; if (a) { a.pendingSell.push(id); it.loc = 'adv:' + a.id; } return; }
      if (c.advId) { const a = S.advs[c.advId]; if (a) a.gold += Math.round(I.trueValue(it) * 0.5); }
      if (!it.story) delete S.items[id]; else it.loc = 'lost:' + (it.region || 'bell');
    }
  }
  function reportThief(c, id) {
    const it = S.items[id];
    spend(TIME.deal);
    rep('watch', 5); addHeat(-6);
    if (U.chance(0.5)) rep('crows', -6);
    let bounty = it.prov === 'wanted' ? U.ri(30, 80) : U.ri(10, 30);
    money(bounty, '舉報贓物');
    c.items = c.items.filter(x => x !== id);
    if (!it.story) delete S.items[id];
    return { bounty };
  }
  function pawnAccept(c, id, amount) {
    const it = S.items[id];
    if (!hasRoom()) return { err: '前店和後庫都滿了。' };
    if (S.cash < amount) return { err: '現銀不夠。' };
    spend(TIME.deal);
    money(-amount, '典當 ' + it.name);
    c.items = c.items.filter(x => x !== id);
    it.loc = free('store') > 0 ? 'store' : 'front';
    const pw = { id: U.uid('p'), item: id, itemName: it.name, amt: amount, back: Math.round(amount * 1.2), due: S.day + (c.pawnDays || 7), custName: c.name, arch: c.arch, look: c.look, seed: c.seed, willRedeem: !!c.willRedeem, state: 'held' };
    S.pawns.push(pw); it.pawn = pw.id; it.price = suggest(it);
    I.hist(it, c.name + '押在{shop}，{d} 日內贖回。'.replace('{shop}', S.shop).replace('{d}', c.pawnDays || 7));
    return { ok: true, pawn: pw };
  }
  function redeem(c) {
    const pw = S.pawns.find(p => p.id === c.pawn); if (!pw) return { err: 'nopawn' };
    const it = S.items[pw.item];
    spend(TIME.deal);
    if (it && it.pawn === pw.id && ['front', 'store', 'hidden', 'cellar'].includes(it.loc)) {
      money(pw.back, '贖回利息');
      it.loc = 'gone'; if (!it.story) delete S.items[it.id];
      pw.state = 'redeemed'; rep('folk', 1);

    for (const it of pool) { if (v >= short * 0.6 || v + I.trueValue(it) * 0.7 > totalV * 0.5) break; v += I.trueValue(it) * 0.7; take.push(it.name); it.loc = 'gone'; if (!it.story) delete S.items[it.id]; }
    const covered = Math.min(short, Math.round(v));
    S.debt = Math.max(0, S.debt - Math.max(0, paid - G.interest()) - covered + Math.round((short - covered) * 0.25));
    S.missed++; S.week++; S.nextDue += 7;
    G.rep('scale', -15);
    const limit = D.DIFFS[S.diff].miss;
    return { take, covered, missed: S.missed, limit, bankrupt: S.missed >= limit };
  }
  function failCheck() {
    if (S.strikes >= 3) return 'e_jail';
    if (S.sanity <= 0) return 'e_madness';
    if (S.missed >= D.DIFFS[S.diff].miss) return 'e_bankrupt';
    return null;
  }
  function end() {
    // 結束這一夜
    S.report = null;
    S.day++;
    S.evToday = { morning: [], counter: [], night: [] };
    G.startMorning();
    ST.save();
  }
  return { run, pay, miss, failCheck, end };
})();

/* ---------- 鐘夜 ---------- */
const BELL = (() => {
  const FORD = { blade: 5.5, holy: 6, mind: 6, poison: 1.5, hazard: 2.5 };
  function defenders() {
    // 鐘夜：公會召回所有還活著的人
    const out = [];
    for (const a of Object.values(S.advs)) {
      if (['dead', 'retired'].includes(a.status)) continue;
      if (a.status === 'missing') continue;
      if (a.status === 'away') { a.status = 'town'; a.trip = null; }
      out.push(a.id);
    }
    return out;
  }
  function start() {
    S.bellnight = { wave: 0, alive: defenders(), fallen: [], held: 0, log: [], buffs: { mind: 1, all: 1, donate: 0 }, used: {} };
    return S.bellnight;
  }
  function pFor(a, w) {
    const B = S.bellnight;
    const mult = [0.8, 1.0, 1.28][w] * B.buffs.all;
    const thr = {}; for (const t of D.THREATS) thr[t] = FORD[t] * mult * (t === 'mind' ? B.buffs.mind : 1);
    const cov = A.coverage(a);
    for (const t of D.THREATS) cov[t] += B.buffs.donate * (t === 'poison' ? 0.3 : 1);
    let d = 0; for (const t of D.THREATS) d += Math.max(0, thr[t] - cov[t]);
    return U.clamp(0.95 - 0.06 * d, 0.08, 0.96);
  }
  function allies() {
    const L = [];
    if (S.flags.su_ally && !S.flags.su_lost) L.push(['su', 1.2]);
    if (S.flags.ming_ally) L.push(['ming', 1]);
    if (S.flags.huo_broken || S.pledge === 'watch') L.push(['watch', 1.5]);
    if (S.flags.dog) L.push(['dog', 0.1]);
    if (S.flags.su_lost) L.push(['su_lost', -1.5]);
    return L;
  }
  // 預估：這一波的守備、灰潮、各人的生還機會（不擲骰）
  function preview(w, buffs) {
    const B = S.bellnight; w = w == null ? B.wave : w;
    const keep = B.buffs; if (buffs) B.buffs = Object.assign({}, B.buffs, buffs);
    let score = 0; const per = {};
    for (const id of B.alive) { const a = S.advs[id]; if (!a) continue; const p = pFor(a, w); per[id] = p; score += p * (0.6 + a.lvl * 0.12); }
    B.buffs = keep;
    for (const [, v] of allies()) score += v;
    const need = 2.2 + w * 1.3;
    const odds = U.clamp((1.12 - need / Math.max(0.01, score)) / 0.24, 0, 1);
    return { score, need, per, odds };
  }
  function wave() {
    const B = S.bellnight; const w = B.wave;
    const hold = [], fall = [];
    let score = 0;
    for (const id of B.alive.slice()) {
      const a = S.advs[id]; if (!a) continue;
      const p = pFor(a, w);
      score += p * (0.6 + a.lvl * 0.12);
      if (U.chance(p)) hold.push(id); else { fall.push(id); }
    }
    for (const [, v] of allies()) score += v;
    const need = 2.2 + w * 1.3;
    const luck = U.rf(0.88, 1.12);
    const ok = score * luck >= need;
    // 守住的一波，倒下的人較少
    const realFall = ok ? fall.filter(() => U.chance(0.55)) : fall;
    for (const id of realFall) {
      const a = S.advs[id]; B.alive = B.alive.filter(x => x !== id); B.fallen.push(id);
      const rep = []; A.die(a, 'bell', rep, false);
      S.journal.dead[S.journal.dead.length - 1].txt = '鐘夜，死在渡口。'; S.journal.dead[S.journal.dead.length - 1].known = true;
    }
    if (ok) B.held++;
    B.wave++;
    const res = { w, ok, hold: hold.concat(fall.filter(id => !realFall.includes(id))), fall: realFall, score: score * luck, need };
    B.log.push(res);
    return res;
  }
  function result() {
    const B = S.bellnight;
    const r = B.held >= 3 ? 'won' : B.held >= 2 ? 'pyrrhic' : 'lost';
    if (r === 'lost') S.flags.town_fell = true; else S.flags.town_held = true;
    return r;
  }
  function crownOptions() {
    const have = D.RELIC_IDS.filter(r => S.relics[r].h === 'player');
    const all7 = have.length === 7;
    const reads = Object.keys(S.read).filter(k => S.read[k]).length;
    const opts = [];
    const tanOK = !S.flags.tan_dead && G.trustOf('tan') >= 50 && S.flags.tan_secret;
    if (all7) opts.push({ id: 'e_bell', text: '讓阿檀唱，讓鐘響', ok: tanOK && reads >= 7, why: !tanOK ? (S.flags.tan_dead ? '阿檀不在了。' : '阿檀還沒準備好。') : reads < 7 ? '你還沒聽完所有亡者的話。' : '' });
    if (all7) opts.push({ id: 'e_crown', text: '自己戴上空冕', ok: true });
    const fac = [['watch', 'e_bind', '交給霍嶂'], ['candle', 'e_seal', '交給素蓮'], ['scale', 'e_scale', '交給秦晚霜']];
    for (const [f, e, t] of fac) {
      if (f === 'watch' && S.flags.huo_broken) continue;
      const theirs = D.RELIC_IDS.filter(r => S.relics[r].h === f).length;
      if (!have.length && !theirs) continue;
      const complete = have.length + theirs === 7;
      opts.push({ id: e, text: t + (S.pledge === f ? '（你答應過）' : ''), ok: have.length > 0 || theirs > 0, incomplete: !complete, fac: f });
    }
    if (have.length >= 4) opts.push({ id: 'e_crow', text: '賣給烏十一', ok: true, fac: 'crows' });
    opts.push({ id: 'e_none', text: '把碎片沉進澐水', ok: true });
    return opts;
  }
  function choose(o) {
    if (o.fac && o.incomplete && ['e_bind', 'e_seal', 'e_scale'].includes(o.id)) { S.flags.crown_incomplete = true; S.flags['failed_' + o.fac] = true; return 'e_none'; }
    return o.id;
  }
  return { start, wave, result, crownOptions, choose, pFor, preview, allies };
})();

/* ---------- 結局 ---------- */
const END = (() => {
  function text(id) {
    const E = (CT.story && CT.story.endings) || {};
    const FB = { e_bell: '鐘鳴', e_bind: '縛鐘', e_seal: '燭封', e_scale: '秤心', e_crow: '鴉散', e_crown: '戴冕', e_none: '無冕', e_bankrupt: '封鋪', e_jail: '下獄', e_madness: '失心' };
    const e = E[id] || { title: FB[id] || '終', lines: ['雨還在下。'] };
    let lines = (e.lines || []).slice();
    for (const v of (e.variants || [])) if (EV.reqOK(v.req)) lines = lines.concat(v.lines || []);
    return { title: e.title || FB[id] || '終', lines: EV.render(lines) };
  }
  function epilogue() {
    const out = [];
    const named = ['yan', 'li', 'su', 'jiu', 'ming', 'fang', 'ya'];
    for (const id of named) {
      const a = S.advs[id]; if (!a) continue;
      const nm = A.dname(a);
      if (a.status === 'dead') { const d = S.journal.dead.find(x => x.id === id); out.push({ who: id, text: nm + '：死於第 ' + (d ? d.day : '?') + ' 日，' + (d ? D.REGIONS[d.region].name : '亡域') + '。' + (d && d.mine.length ? '身上帶著你賣的' + d.mine[0] + '。' : '') }); }
      else if (a.status === 'missing') out.push({ who: id, text: nm + '：下落不明。' });
      else out.push({ who: id, text: nm + '：活了下來，' + a.lvl + ' 級。' + (a.trust >= 40 ? '他們說，' + S.shop + '的掌櫃救過他的命。' : '') });
    }
    return out;
  }
  function finish(id) {
    S.ended = id;
    const m = ST.meta();
    m.endings[id] = (m.endings[id] || 0) + 1;
    if (!['e_bankrupt', 'e_jail', 'e_madness'].includes(id) || S.day >= 30) { m.unlocked.forger = true; m.unlocked.monkish = true; m.unlocked.crowling = true; }
    ST.saveMeta(m);
    ST.save();
  }
  function title(id) { return text(id).title; }
  return { text, epilogue, finish, title };
})();

    ${rg('r-shadow', [[0, '#000', 0.55], [1, '#000', 0]])}
    <filter id="f-blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="f-blur5" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="f-rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
    <filter id="f-wisp" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.05 0.09" numOctaves="2" seed="7"><animate attributeName="seed" values="1;30;1" dur="9s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="14"/><feGaussianBlur stdDeviation="1.6"/></filter>
    <pattern id="p-mail" width="5" height="4" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2" r="1.7" fill="none" stroke="#c9d1d8" stroke-width="0.7" opacity="0.85"/></pattern>
    <pattern id="p-weave" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 2h4M2 0v4" stroke="#000" stroke-width="0.5" opacity="0.18"/></pattern>
    </defs></svg>`;
  }

  // ---- 基本工具 ----
  const f1 = (n) => Math.round(n * 10) / 10;
  function P(d, fill, extra) { return `<path d="${d}" fill="${fill}"${extra ? ' ' + extra : ''}/>`; }
  function C(cx, cy, r, fill, extra) { return `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="${fill}"${extra ? ' ' + extra : ''}/>`; }
  function E(cx, cy, rx, ry, fill, extra) { return `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${fill}"${extra ? ' ' + extra : ''}/>`; }
  function R(x, y, w, h, fill, extra) { return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="${fill}"${extra ? ' ' + extra : ''}/>`; }
  function L(x1, y1, x2, y2, stroke, w, extra) { return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"${extra ? ' ' + extra : ''}/>`; }
  const OUT = 'stroke="#120d09" stroke-width="1.6" stroke-linejoin="round"';
  const OUTt = 'stroke="#120d09" stroke-width="1.1" stroke-linejoin="round"';

  function metalOf(it) {
    if (it.tags.includes('gold')) return 'g-gold';
    if (it.tags.includes('silver')) return 'g-silver';
    if (it.tags.includes('bronze')) return 'g-bronze';
    return it.tier >= 3 ? 'g-steel' : 'g-iron';
  }
  const GEMS = ['#d8323c', '#2f8fd8', '#2fb87a', '#9b4fd8', '#f0b429', '#e8eef2', '#d85a9a'];
  function gem(cx, cy, r, col) {
    return C(cx, cy, r, col, OUTt) + C(cx - r * 0.3, cy - r * 0.35, r * 0.35, '#fff', 'opacity="0.75"') + `<path d="M${f1(cx - r)} ${f1(cy)}A${f1(r)} ${f1(r)} 0 0 0 ${f1(cx + r)} ${f1(cy)}" fill="#000" opacity="0.25"/>`;
  }

  // ---- 各類繪製（100×100 畫布）----
  const DRAW = {};
  DRAW.sword = (it, r) => {
    const len = 60 + r() * 10, w = 5 + r() * 2, m = metalOf(it);
    const guard = r() < 0.5;
    let s = `<g transform="rotate(-45 50 50)">`;
    s += P(`M50 ${f1(50 - len / 2 - 6)} L${f1(50 + w)} ${f1(50 - len / 2 + 6)} L${f1(50 + w)} ${f1(50 + len / 2 - 14)} L${f1(50 - w)} ${f1(50 + len / 2 - 14)} L${f1(50 - w)} ${f1(50 - len / 2 + 6)}Z`, `url(#${m})`, OUT);
    s += L(50, 50 - len / 2 + 2, 50, 50 + len / 2 - 16, '#000', 1.1, 'opacity="0.35"');
    s += L(50 - w * 0.55, 50 - len / 2 + 8, 50 - w * 0.55, 50 + len / 2 - 18, '#fff', 0.9, 'opacity="0.5"');
    const gy = 50 + len / 2 - 14;
    s += guard ? R(50 - 15, gy - 2, 30, 5, 'url(#g-bronze)', OUT + ' rx="2"') : E(50, gy, 10, 4, 'url(#g-bronze)', OUT);
    s += R(50 - 3.4, gy + 3, 6.8, 15, '#3a2212', OUT + ' rx="1.5"');
    for (let i = 0; i < 4; i++) s += L(46.5, gy + 5 + i * 3.4, 53.5, gy + 6.6 + i * 3.4, '#6b4422', 1.4);
    s += C(50, gy + 21, 4.4, `url(#${m === 'g-iron' ? 'g-bronze' : m})`, OUT);
    if (it.tier >= 4) s += gem(50, gy + 21, 2.2, GEMS[it.seed % GEMS.length]);
    if (r() < 0.6) s += `<path d="M50 ${f1(gy + 24)} q-6 8 -2 16 q3 -6 4 -10" fill="#a8261c" ${OUTt}/>`;
    return s + '</g>';
  };
  DRAW.saber = (it, r) => {
    const m = metalOf(it), curve = 6 + r() * 6;
    let s = `<g transform="rotate(-40 50 50)">`;
    s += P(`M44 78 Q${f1(42 - curve)} 40 52 10 Q${f1(56 + curve * 0.2)} 34 52 78Z`, `url(#${m})`, OUT);
    s += P(`M45.5 74 Q${f1(44 - curve)} 42 51.5 15`, 'none', 'stroke="#fff" stroke-width="0.9" opacity="0.55"');

  ACT.redeemGone = (k) => { if (!S.cur) return; const cust = S.cur; const r0 = G.redeem(cust); const r = G.redeemGone(cust, k === 'pay'); custSay(cust, 'redeem_gone'); setWho(cust, k === 'pay' ? 'sad' : 'angry'); c.redeemed = true; UI.renderHUD(); setTimeout(() => finishCust(false), 1200); drawPanel(); };

      <div class="row mt"><button class="btn ghost grow" data-act="ghostTalk">「你回去吧。」</button><button class="btn grow" data-act="doneCust">閉上眼睛</button></div>`;

  ACT.ghostTalk = () => { if (!S.cur) return; const cust = S.cur; say(cust.name, U.pick(['「……好。燈別熄。」', '「我只是想再看看這裡。」', '「替我跟大家說一聲。」'])); G.addSan(2); setTimeout(() => finishCust(false), 1400); };
  function eventPanel(p, cust) {

        <div class="col mt">${EV.choicesOf(e || {}).map(ch => `<button class="btn ${ch.ok ? '' : 'off'}" style="justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;min-height:48px;padding:6px 14px" data-act="evChoose" data-arg="${ch.i}">${esc(ch.text)}${ch.hint ? `<small style="font-weight:600;color:var(--muted);font-size:.76em">${esc(ch.hint)}</small>` : ''}</button>`).join('')}</div>`;
    } else {
      p.innerHTML = `<div class="card">${(ev.after || []).map(l => `<p style="margin:0 0 8px">${l.who ? `<b style="color:var(--amber2);font-size:.82em">${esc(D.CHARS[l.who] ? D.CHARS[l.who].n : l.who === 'me' ? S.name : '')}</b> ` : ''}${esc(l.text)}</p>`).join('') || '<p class="muted">……</p>'}</div><button class="btn wide mt" data-act="doneCust">送客</button>`;

  // ---------- 送客 ----------
  function finishPanel(p, cust) {
    const ds = cust.deals || [];
    const rows = ds.map(d => { const it = S.items[d.id]; return `<div class="deal ${d.dir}"><div class="ic">${it ? ART.item(it) : ''}</div><div class="grow"><div class="nm">${esc(d.name)}</div><div class="tiny muted">${d.dir === 'in' ? '收進來' : d.dir === 'pawn' ? '押在你這裡' : d.credit ? '賒給他了' : '賣出去'}</div></div><b class="num">${d.dir === 'out' ? '+' : '−'}${U.fmt(d.price)}</b></div>`; }).join('');
    p.innerHTML = `${rows ? `<div class="card deals">${rows}</div>` : ''}<button class="btn wide ${rows ? 'mt' : ''}" data-act="doneCust">送客</button>`;
  }
  // 阿檀的碎嘴（同一天不重複）
  function tanIdle() {
    const L = (CT.arcs && CT.arcs.tan && CT.arcs.tan.idle) || [];
    if (!L.length) return null;
    S.tanSaid = S.tanSaid || {};
    const fresh = L.map((t, i) => [t, i]).filter(([, i]) => !S.tanSaid[i]);
    const pick = U.pick(fresh.length ? fresh : L.map((t, i) => [t, i]));
    S.tanSaid[pick[1]] = S.day;
    if (!fresh.length) S.tanSaid = {};
    const o = EV.render([pick[0]])[0];
    return o ? o.text : null;
  }
  UI.tanIdle = tanIdle;
  function finishCust(happy, silent) {
    const cust = S.cur; if (!cust) return;
    if (!silent && cust.mode !== 'event' && cust.mode !== 'ghost') custSay(cust, happy ? 'happy' : 'walk');
    const w = $('#who'); if (w) { w.classList.remove('enter'); w.classList.add('leave'); }
    const r = G.finishCust(cust);
    c.sel = null; c.shown = null; c.result = null; c.ev = null; c.redeemed = false;
    setTimeout(() => {
      if (S.phase !== 'day') return;
      const ww = $('#who'); if (ww) { ww.innerHTML = ''; ww.className = 'who'; }
      showItem(); drawQueue(); drawPanel(); UI.renderNav();
      if (S.candle <= 0) { say('阿檀', '「蠟燭燒完了，掌櫃的。外頭的人明天請早。」'); setTimeout(() => ACT.closeShop(true), 900); }
      else if (!S.flags.tan_dead && U.chance(0.22)) { const t = tanIdle(); if (t) say('阿檀', t, 'tan'); }
    }, 650);
  }
  function afterTime() {
    const ins = G.maybeInspect();
    if (ins) setTimeout(() => FLOW.inspection(), 500);
    if (S.candle <= 0 && S.cur) toast('蠟燭燒完了。打發完這位就打烊。', '', 2500);
  }
  ACT.closeShop = (force) => {
    const go = () => { if (S.cur) G.finishCust(S.cur); SND.play('candle'); SND.setMood('night'); NIGHT.run(); UI.refresh(); FLOW.night(); };
    const left = S.queue.filter(x => !x.done).length;
    if (force === true || !left) return go();
    UI.confirmBox(`門口還有 ${left} 位客人。現在打烊？`, '打烊', '再撐一下', go);
  };
  ACT.nightResume = () => FLOW.night();
})();

      ${inShop || it.relic ? `<div class="row wrap mt">${ap('look', '細看')}${ap('test', '試金')}${ap('ledger', '查冊')}${it.k.read ? (it.frag || it.deathFrag || it.relic ? `<button class="btn sm ghost" data-act="sheetReread" data-arg="${id}">再讀一次</button>` : '') : `<button class="btn sm ghost" data-act="sheetAppraise" data-arg="${id}:read">讀念${tc('read')}</button>`}</div>` : ''}
      ${inShop ? `<div class="sect">搬動</div><div class="row wrap">${['front', 'store', 'hidden', 'cellar'].filter(l => l !== it.loc && G.cap(l) > 0).map(l => `<button class="btn sm grow ${G.free(l) > 0 ? '' : 'off'}" data-act="move" data-arg="${id}:${l}">${l === 'front' ? '上架' : l === 'store' ? '收進後庫' : l === 'hidden' ? '藏進暗格' : '鎮進地窖'}</button>`).join('')}</div>
        ${it.loc === 'front' || t.cat !== 'relic' ? `<div class="sect">標價</div><div class="row"><button class="btn sm" data-act="price" data-arg="${id}:-10">−10</button><button class="btn sm" data-act="price" data-arg="${id}:-1">−1</button><b class="num grow" style="text-align:center;font-size:1.3em;color:var(--gold)">${U.fmt(it.price || G.suggest(it))}</b><button class="btn sm" data-act="price" data-arg="${id}:1">+1</button><button class="btn sm" data-act="price" data-arg="${id}:10">+10</button><button class="btn sm" data-act="price" data-arg="${id}:auto">建議</button></div>` : ''}
        <div class="sect">處置</div><div class="row wrap">${S.unlocked.workshop && it.cond < 95 && t.cat !== 'kit' && !it.relic ? `<button class="btn sm grow" data-act="doRepair" data-arg="${id}">${icon('hammer')} 修繕</button>` : ''}${!it.relic && !it.pawn ? `<button class="btn sm grow" data-act="doDismantle" data-arg="${id}">${icon('saw')} 拆解</button>` : ''}${S.upg.circle_1 && it.curse && D.CURSES[it.curse.t].bad && it.k.read ? `<button class="btn sm ghost grow" data-act="doPurify" data-arg="${id}">${icon('circle')} 淨念</button>` : ''}${S.unlocked.forgery && (it.prov === 'stolen' || it.prov === 'wanted') ? `<button class="btn sm grow" data-act="launder" data-arg="${id}">${icon('quill')} 造來歷</button>` : ''}</div>` : ''}

    const [id, k] = a.split(':');

})();

/* ===== 18 介面：流程（標題、劇情卡、讀念、夜報、搜鋪、鐘夜、結局）===== */
const FLOW = (() => {
  const { st, ACT, $, esc, icon, toast, sfx, el } = UI;
  let flowEl = null;
  function open(cls) { close(); flowEl = el(`<div class="flow ${cls || ''}"></div>`); document.body.appendChild(flowEl); return flowEl; }
  function close() { if (flowEl) { flowEl.remove(); flowEl = null; } document.querySelectorAll('.flow').forEach(x => x.remove()); }
  function spName(w) { if (!w) return ''; if (w === 'me') return S.name; if (D.CHARS[w]) return D.CHARS[w].n; if (S.advs[w]) return A.dname(S.advs[w]); return ''; }
  function lineHTML(l, i, d) { return `<p class="ln ${l.who ? '' : 'nar'} ${l.who === 'me' ? 'me' : ''}" style="animation-delay:${(i * (d || 0.18)).toFixed(2)}s">${l.who ? `<span class="sp">${esc(spName(l.who))}</span>` : ''}${esc(l.text)}</p>`; }
  function porFor(who, mood) { if (!who) return ''; if (who === 'me') return ''; if (FACE.lookFor(who)) return FACE.of(who, { mood }); if (S.advs[who]) return FACE.adv(S.advs[who], { mood }); return ''; }

  // ---------- 一般卡片 ----------
  function card(o, done) {
    const f = open();
    const por = o.por || '';
    f.innerHTML = `<div class="fcard">${por ? `<div class="por">${por}</div>` : ''}<div class="${o.paper ? 'ncard' : 'body'} ${o.dark ? 'dark' : ''} ${o.death ? 'death' : ''}">${o.title ? `<div class="ttl" ${o.paper ? 'style="color:#7a1a12"' : ''}>${esc(o.title)}</div>` : ''}${o.html || ''}${(o.lines || []).map((l, i) => lineHTML(l, i)).join('')}<div class="chs">${(o.buttons || [{ t: o.ok || '繼續', k: 'ok', cls: 'pri' }]).map(b => `<button class="btn ${b.cls || ''}" data-fb="${b.k}">${esc(b.t)}${b.s ? `<small>${esc(b.s)}</small>` : ''}</button>`).join('')}</div></div></div>`;
    f.querySelectorAll('[data-fb]').forEach(b => b.addEventListener('click', () => { UI.haptic(6); sfx('soft'); const k = b.dataset.fb; if (o.keep !== true) close(); done && done(k); }));
    return f;
  }

  // ---------- 劇情事件 ----------
  function events(ids, done) {
    ids = (ids || []).slice();
    const next = () => {
      if (!ids.length) { close(); UI.refresh(); done && done(); return; }
      const id = ids.shift();
      const e = EV.byId(id);
      if (!e) return next();
      if (e.once !== false && S.evDone[id] === undefined ? false : (e.once !== false && S.evDone[id] !== undefined)) return next();
      showEvent(e, (r) => {
        if (r && r.ending) { close(); ending(r.ending); return; }
        if (r && r.gotos && r.gotos.length) ids = r.gotos.concat(ids);
        next();
      });
    };
    next();
  }
  function showEvent(e, cb) {
    const f = open();
    const L = EV.render(e.lines);
    const who = e.who || (L.find(l => l.who && l.who !== 'me') || {}).who;

  // ---------- 讀念 ----------
  function reading(it, res, done) {
    res = res || { lines: [] };
    if (res.relic) return relicMemory(it, res.lines, done, res.replay);
    const f = open('memory');
    const parts = res.lines || [];
    const strong = parts.some(p => !p.empty);
    let html = `<div class="motes"></div><div class="fcard"><div class="memart ${strong ? 'strong' : ''} ${it.curse && D.CURSES[it.curse.t].bad ? 'cursed' : ''}"><i class="mring"></i><i class="mring r2"></i>${ART.item(it)}</div><div class="body mem" style="background:linear-gradient(180deg,#0f2230,#081218);border-color:#2a5a74"><div class="ttl" style="color:#8fe3ff">讀念・${esc(it.name)}</div>`;
    parts.forEach((p, i) => {
      if (p.death) html += `<p class="ln" style="animation-delay:${i * 0.4}s;color:#ffd0c8">【${esc(p.who)}】${esc(p.text)}</p>`;
      else if (p.chainDone) html += `<div class="ln" style="animation-delay:${i * 0.4 + 0.3}s;margin-top:14px;padding-top:12px;border-top:1px solid #2a5a74"><div style="color:#f2cf6b;font-weight:900;letter-spacing:.2em;font-size:.86em;margin-bottom:6px">殘念拼完了：${esc(p.title)}</div><div style="color:#e8f7ff">${esc(p.text)}</div></div>`;
      else if (p.curse) html += `<p class="ln" style="animation-delay:${i * 0.4}s;color:${D.CURSES[it.curse.t].bad ? '#ff9a8a' : '#ffe08a'};font-size:.9em">${esc(p.text)}</p>`;
      else html += `<p class="ln" style="animation-delay:${i * 0.4}s${p.empty ? ';color:#7aa0b4' : ''}">${esc(p.text)}</p>`;
    });
    html += `<div class="chs"><button class="btn ghost" data-go>回到櫃台</button></div></div></div>`;
    f.innerHTML = html;
    SND.play('heartbeat');
    if (parts.some(p => p.chainDone)) setTimeout(() => SND.play('bless'), 900);
    f.querySelector('[data-go]').addEventListener('click', () => { close(); done && done(); });
  }
  function relicMemory(it, lines, done, replay) {
    const f = open('memory');
    SND.setMood('memory');
    const L = (lines || []).map(t => ({ text: t }));
    f.innerHTML = `<div class="motes gold"></div><div class="fcard"><div class="memart strong relic"><i class="mring"></i><i class="mring r2"></i>${ART.item(it)}</div><div class="body mem" style="background:linear-gradient(180deg,#0f2230,#06101a);border-color:#4fb8e0;box-shadow:0 0 40px #4fb8e030"><div class="ttl" style="color:#f2cf6b">${esc(it.name)}・記憶</div>${L.map((l, i) => `<p class="ln" style="animation-delay:${(0.6 + i * 1.1).toFixed(1)}s">${esc(l.text)}</p>`).join('')}<div class="chs"><button class="btn ghost" data-go style="opacity:0;animation:lnIn .5s ${(0.6 + L.length * 1.1).toFixed(1)}s forwards">……</button></div></div></div>`;
    // 點一下就把字一次讀完
    const skip = (ev) => { if (ev.target.closest('[data-go]')) return; f.querySelectorAll('.ln').forEach(x => x.classList.add('shown')); const g = f.querySelector('[data-go]'); if (g) { g.style.animation = 'none'; g.style.opacity = 1; } };
    f.addEventListener('click', skip);
    f.querySelector('[data-go]').addEventListener('click', () => { close(); SND.setMood(S.phase === 'day' ? 'day' : S.phase === 'night' ? 'night' : 'morning'); if (!replay) { G.note('讀過了' + it.name + '的記憶。'); S.newNote = true; } done && done(); });
  }

  // ---------- 搜鋪 ----------

    document.body.appendChild(w);
    const rb = w.querySelector('#rb');

    const bad = G.stock().filter(it => I.illegal(it));
    rb.innerHTML = `<p class="ln" style="animation:none;opacity:1">守碑衛${esc(ins.name)}帶著兩個兵跨進門檻，靴子上的泥甩了一地。</p><p class="ln" style="animation:none;opacity:1"><span class="sp">${esc(ins.name)}</span>「例行查驗。掌櫃的，退後一步。」</p>
      ${bad.length ? `<p class="small" style="color:#ffb8a8">你鋪子裡有 ${bad.length} 件見不得光的東西。${bad.filter(x => x.loc === 'front').length ? '其中 ' + bad.filter(x => x.loc === 'front').length + ' 件就擺在貨架上。' : ''}</p>` : `<p class="small muted">你在心裡點了一遍：應該沒什麼好怕的。</p>`}
      ${UI.tip('bribe') || ''}

      ${S.flags.huo_ally ? `<button class="btn ghost" data-r="huo">搬出霍都尉的名號</button>` : ''}</div>`;
    const result = (r) => {
      const lines = [];
      if (r.ok) { lines.push(ins.name + '把銀子收進袖子裡，在本子上畫了個勾。「沒問題。」'); sfx('coin'); }
      else {
        if (r.bribeFail) lines.push(ins.name + '把銀子摔回櫃台上。「拿這個打發我？」');
        if (!r.found.length) lines.push('他們翻了半個時辰，什麼都沒找到。' + ins.name + '撇撇嘴走了。');
        else { lines.push('他們找到了：' + r.found.map(x => x.name + '（' + x.why + '）').join('、') + '。'); lines.push('全數沒收，罰銀 ' + r.fine + ' 兩。'); if (r.strike) lines.push('案卷上多了一筆。現在是 ' + S.strikes + ' / 3。'); sfx('fake'); }
      }
      rb.innerHTML = lines.map(t => `<p class="ln" style="animation:none;opacity:1">${esc(t)}</p>`).join('') + `<div class="chs"><button class="btn pri" data-r="done">繼續營業</button></div>`;
      rb.querySelector('[data-r="done"]').addEventListener('click', () => { w.remove(); G.inspDone(); SND.setMood('day'); UI.refresh(); const fc = NIGHT.failCheck(); if (fc === 'e_jail') ending('e_jail'); });
      UI.renderHUD();
    };
    rb.addEventListener('click', (e) => {
      const b = e.target.closest('[data-r]'); if (!b || b.classList.contains('off')) return;

      if (k === 'comply') result(G.inspSearch());
      if (k === 'bribe') result(G.inspBribe(sug));
      if (k === 'huo') { G.addHeat(-5); result({ ok: true }); }
    });
  }

  // ---------- 夜報 ----------
  function buildPages() {
    const R = S.report; if (!R) return [];
    const pages = [];
    const cards = R.cards;
    const sum = cards.find(c => c.t === 'summary');
    if (sum) pages.push({ k: 'summary', c: sum });
    const ret = cards.filter(c => c.t === 'adv' && (c.k === 'return' || c.k === 'back' || c.k === 'arrive'));
    if (ret.length) pages.push({ k: 'returns', list: ret });
    cards.filter(c => c.t === 'adv' && c.k === 'dead').forEach(c => pages.push({ k: 'dead', c }));
    const miss = cards.filter(c => c.t === 'adv' && (c.k === 'missing' || c.k === 'baddebt' || c.k === 'cling'));
    if (miss.length) pages.push({ k: 'missing', list: miss });
    const misc = cards.filter(c => ['jobs', 'pawn', 'fakeout', 'haunt', 'breakin', 'crowloan'].includes(c.t));
    if (misc.length) pages.push({ k: 'misc', list: misc });
    cards.filter(c => c.t === 'tide').forEach(c => pages.push({ k: 'tide', c }));
    cards.filter(c => c.t === 'event').forEach(c => pages.push({ k: 'event', id: c.id }));
    cards.filter(c => c.t === 'debt').forEach(c => pages.push({ k: 'debt', c }));
    cards.filter(c => c.t === 'bellnight').forEach(c => pages.push({ k: 'bell' }));
    pages.push({ k: 'sleep' });
    return pages;
  }
  function night() {
    if (!S.report) { NIGHT.run(); }
    const pages = buildPages();
    let i = S.report.i || 0;
    const step = () => {
      S.report.i = i;
      if (i >= pages.length) return;
      const p = pages[i++];
      const go = () => step();
      if (p.k === 'summary') return summaryCard(p.c, go);
      if (p.k === 'returns') return returnsCard(p.list, go);
      if (p.k === 'dead') return deathCard(p.c, go);
      if (p.k === 'missing') return missingCard(p.list, go);
      if (p.k === 'misc') return miscCard(p.list, go);
      if (p.k === 'tide') { SND.play('tide'); return card({ dark: true, title: '灰潮', lines: [{ text: '半夜，澐水那頭傳來一聲很低的鐘響。' }, { text: '整座城的狗同時開始叫。亡域的霧漫過了城牆根。' }, { text: '接下來幾天，廢墟裡會更兇險；沒鎮住的詛咒物也會更不安分。' }] }, go); }
      if (p.k === 'event') { if (S.evDone[p.id] !== undefined && EV.byId(p.id) && EV.byId(p.id).once !== false) return go(); return events([p.id], go); }
      if (p.k === 'debt') { if (S.report.debtDone) return go(); return debtCard(p.c, go); }
      if (p.k === 'bell') return bellnight();
      if (p.k === 'sleep') return sleepCard();
    };
    SND.setMood('night');
    step();
  }
  function summaryCard(c, go) {
    const net = c.income - c.expense;
    card({ paper: true, title: '打烊', html: `<div class="big num" style="color:${net >= 0 ? '#2f6a3a' : '#8a2614'}">${net >= 0 ? '+' : '−'}${U.fmt(Math.abs(net))} 兩</div><div class="kv mt"><span>進帳</span><b>${U.fmt(c.income)}</b><span>花用</span><b>${U.fmt(c.expense)}</b><span>收購</span><b>${c.buys} 件</b><span>賣出</span><b>${c.sells} 件</b><span>伙食燈油</span><b>−${c.living}</b>${c.left ? `<span>沒來得及招呼的客人</span><b>${c.left}</b>` : ''}</div>${c.hungry ? '<p class="small" style="color:#8a2614;margin-top:8px">錢匣子見底，今晚只能餓著肚子睡。</p>' : ''}<p class="small muted" style="margin-top:8px;text-align:center">現銀 ${U.fmt(S.cash)} 兩</p>`, ok: '看夜報' }, go);
  }
  function returnsCard(list, go) {
    let html = '<div class="col">';
    for (const r of list) {
      const a = S.advs[r.adv]; if (!a) continue;
      const nm = esc(A.dname(a));
      let t = '';
      if (r.k === 'return' && r.close) t = `從${D.REGIONS[r.region].name}<b style="color:#8a2614">爬了回來</b>，渾身是血，什麼都沒帶回。差一點就回不來了。${r.mine && r.mine.length ? `<br><span class="muted">身上還帶著你賣的${esc(r.mine[0])}。</span>` : ''}`;
      else if (r.k === 'return') t = `自${D.REGIONS[r.region].name}${r.wounded ? '<b style="color:#8a2614">帶傷</b>' : '平安'}歸來，帶回 ${r.loot} 件東西。${r.lvlUp ? ` <b style="color:#2f6a3a">升到 ${a.lvl} 級</b>` : ''}${r.share && r.share.length ? `<br>分紅：${r.share.map(id => S.items[id] ? esc(S.items[id].name) : '').join('、')}已入後庫。` : ''}${r.mine && r.mine.length ? `<br><span class="muted">身上帶著你賣的${esc(r.mine[0])}。</span>` : ''}`;
      if (r.k === 'back') t = '失蹤了幾天，自己爬回了鴉渡。';
      if (r.k === 'arrive') t = `新來的${D.CLASSES[a.cls].n}，在公會的名冊上簽了名。`;
      html += `<div class="row" style="align-items:flex-start"><div style="width:44px;height:52px;flex:none">${FACE.adv(a, { mood: r.k === 'return' && !r.wounded ? 'happy' : r.wounded ? 'pain' : 'neutral' })}</div><div class="small"><b>${nm}</b>　${t}</div></div>`;
    }
    html += '</div>';
    if (list.some(r => r.lvlUp)) SND.play('levelup');
    card({ paper: true, title: '歸來的人', html }, go);
  }
  function deathCard(c, go) {
    const a = S.advs[c.adv];
    SND.play('death');
    const prof = a && a.named && CT.arcs && CT.arcs.advs && CT.arcs.advs[a.id];
    const rep = prof && prof.death && prof.death.report ? U.tpl(prof.death.report, { region: D.REGIONS[c.region].name }) : null;
    card({ death: true, por: a ? FACE.adv(a, { mood: 'pain', ghost: true }) : '', title: '亡者', html: `<p class="ln" style="opacity:1;animation:none;text-align:center;font-weight:900;font-size:1.1em">${esc(a ? A.dname(a) : '某人')}</p><p class="ln nar" style="opacity:1;animation:none;text-align:center" class="small">死於${D.REGIONS[c.region].name}${c.wasMissing ? '（失蹤多日後確認）' : ''}</p>${rep ? `<p class="ln" style="opacity:1;animation:none">${esc(rep)}</p>` : ''}${c.mine && c.mine.length ? `<p class="small" style="color:#ffb8a8">他身上帶著你賣的：${c.mine.map(esc).join('、')}。</p>` : ''}<p class="small muted">他的東西留在了亡域。也許哪天，會有人把它們帶回你的櫃台。</p>`, ok: '……' }, go);
  }
  function missingCard(list, go) {
    let html = '';
    for (const r of list) {
      const a = S.advs[r.adv];
      if (r.k === 'missing') html += `<p class="small">${esc(a ? A.dname(a) : '?')}在${D.REGIONS[r.region].name}失去了音訊。</p>`;
      if (r.k === 'baddebt') html += `<p class="small">${esc(a ? A.dname(a) : '?')}欠你的 ${r.amt} 兩，跟著他一起埋了。</p>`;
      if (r.k === 'cling') { const it = S.items[r.item]; html += `<p class="small" style="color:#8fe3ff">早上你在後庫看見了${esc(it ? it.name : '那件東西')}。它的主人${esc(a ? A.dname(a) : '')}死了，它自己回來了。</p>`; }
    }
    card({ dark: true, title: '音訊', html }, go);
  }
  function miscCard(list, go) {
    let html = '';
    for (const c of list) {
      if (c.t === 'jobs') html += c.list.map(j => `<p class="small">${UI.icon('hammer')} ${esc(j.text)}</p>`).join('');
      if (c.t === 'pawn') html += `<p class="small">典當期滿沒人來贖：${c.list.map(esc).join('、')}。現在是你的了。</p>`;
      if (c.t === 'fakeout') html += `<p class="small" style="color:#8a2614">有人發現你賣的${esc(c.name)}是贗品。消息傳開了。</p>`;
      if (c.t === 'haunt') html += `<p class="small" style="color:#3a5a6a">${esc(c.text)}</p>`;
      if (c.t === 'breakin') html += `<p class="small" style="color:#8a2614">半夜有人撬了門。被偷走：${c.list.map(esc).join('、')}。</p>`;
      if (c.t === 'crowloan') html += c.paid ? `<p class="small">灰鴉會的人來收走了 ${c.paid} 兩。</p>` : `<p class="small" style="color:#8a2614">你還不出灰鴉會的 ${c.owed} 兩。他們說會記得。</p>`;

  function debtCard(c, go) {
    const due = G.dueAmount();
    SND.play('knock');
    const can = S.cash >= due;
    card({ por: FACE.of('abacus', { mood: 'cold' }), title: '收帳', html: `<p class="ln" style="opacity:1;animation:none"><span class="sp">算盤先生</span>「第 ${S.week} 期，${due} 兩。利息 ${G.interest()} 兩已經算在裡頭了。」</p><div class="kv mt"><span>現銀</span><b>${U.fmt(S.cash)}</b><span>這期</span><b>${U.fmt(due)}</b><span>欠款餘額</span><b>${U.fmt(S.debt)}</b></div>${S.missed ? `<p class="small" style="color:#ff9a7a">你已經拖欠過 ${S.missed} 次（${D.DIFFS[S.diff].miss} 次就封鋪）。</p>` : ''}`,
      buttons: can ? [{ t: '繳', k: 'pay', cls: 'pri', s: '−' + due + ' 兩' }, ...(S.cash >= due + 50 ? [{ t: '多繳一點', k: 'more', s: '把現銀的一半拿去還本金' }] : [])] : [{ t: '繳不出來', k: 'miss', cls: 'danger', s: '算盤先生會拿貨抵債，欠款加重' }] }, (k) => {
      if (k === 'pay' || k === 'more') {

        S.report.debtDone = true; UI.renderHUD();
        if (S.flags.paid_off) { card({ por: FACE.of('qin', { mood: 'cold' }), title: '鋪契', lines: [{ who: 'abacus', text: '「三千兩，一兩不差。東家吩咐，鋪契交還給您。」' }, { text: '你摸著那張發黃的紙。從今天起，這間鋪子是你的了。' }] }, go); return; }

  function sleepCard() {

  // ---------- 鐘夜畫布 ----------
  function bellCanvas(cv, data) {
    const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const drops = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.9 }));
    const fog = Array.from({ length: 8 }, (_, i) => ({ x: Math.random(), y: 0.1 + Math.random() * 0.55, r: 0.22 + Math.random() * 0.32, v: (0.012 + Math.random() * 0.02) * (i % 2 ? 1 : -1) }));
    const bells = Array.from({ length: 9 }, (_, i) => ({ x: 0.06 + i * 0.11 + (Math.random() - 0.5) * 0.04, s: 0.08 + Math.random() * 0.05 + (i % 3 === 1 ? 0.03 : 0), ph: Math.random() * 6, d: 0.35 + Math.random() * 0.65 }));
    bells.sort((a, b) => a.s - b.s);
    let raf = 0, last = performance.now(), flash = 0, rise = 0, W = 0, H = 0;
    function bellPath(x, y, s) {
      ctx.beginPath();
      ctx.moveTo(x - 0.2 * s, y - 1.0 * s);
      ctx.quadraticCurveTo(x, y - 1.2 * s, x + 0.2 * s, y - 1.0 * s);
      ctx.bezierCurveTo(x + 0.3 * s, y - 0.7 * s, x + 0.28 * s, y - 0.25 * s, x + 0.5 * s, y);
      ctx.lineTo(x - 0.5 * s, y);
      ctx.bezierCurveTo(x - 0.28 * s, y - 0.25 * s, x - 0.3 * s, y - 0.7 * s, x - 0.2 * s, y - 1.0 * s);
      ctx.closePath();
    }
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const cw = cv.clientWidth, ch = cv.clientHeight;
      if (cw * dpr !== W || ch * dpr !== H) { W = cv.width = Math.round(cw * dpr); H = cv.height = Math.round(ch * dpr); }
      const t = now / 1000;
      rise += ((data.rise || 0.3) - rise) * Math.min(1, dt * 0.8);
      data.surge = Math.max(0, (data.surge || 0) - dt * 0.7);
      if (Math.random() < dt * (0.08 + data.surge * 2)) flash = 1;
      flash = Math.max(0, flash - dt * 3.5);
      const sh = data.surge > 0.3 ? (Math.random() - 0.5) * 10 * dpr * data.surge : 0;
      ctx.setTransform(1, 0, 0, 1, sh, sh * 0.5);
      // 天
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#04070a'); g.addColorStop(0.55, '#0b1317'); g.addColorStop(1, '#05090b');
      ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
      // 城的剪影
      const wl = H * (W > H ? 0.52 : 0.38);
      ctx.fillStyle = '#020405';
      ctx.beginPath(); ctx.moveTo(0, wl);
      const roofs = [[0, 0.08], [0.06, 0.12], [0.1, 0.07], [0.16, 0.15], [0.2, 0.1], [0.27, 0.06], [0.72, 0.05], [0.78, 0.11], [0.83, 0.18], [0.86, 0.12], [0.92, 0.09], [1, 0.13]];
      roofs.forEach(([x, h]) => ctx.lineTo(x * W, wl - h * H * 0.4));
      ctx.lineTo(W, wl); ctx.closePath(); ctx.fill();
      // 灰潮
      const tideA = 0.10 + (data.wave || 0) * 0.06 + data.surge * 0.35;
      for (const f of fog) {
        f.x += f.v * dt * (1 + data.surge * 4); if (f.x > 1.4) f.x = -0.4; if (f.x < -0.4) f.x = 1.4;
        const rg = ctx.createRadialGradient(f.x * W, f.y * H, 0, f.x * W, f.y * H, f.r * W * 1.4);
        rg.addColorStop(0, `rgba(140,156,148,${tideA})`); rg.addColorStop(1, 'rgba(140,156,148,0)');
        ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
      }
      // 九口鐘
      const pos = [];
      const glowA = 0.10 + 0.12 * data.surge + 0.05 * Math.sin(t * 1.3);
      for (const b of bells) {
        const s = b.s * 1.55 * Math.min(W, H * 0.55);
        const up = rise * (0.75 + b.d * 0.35);
        const x = b.x * W, y = wl + s * 0.95 - up * s * 1.15 + Math.sin(t * 0.7 + b.ph) * s * 0.03;
        pos.push([x, y, s]);
        const hg = ctx.createRadialGradient(x, y - s * 0.5, 0, x, y - s * 0.5, s * 1.3);
        hg.addColorStop(0, `rgba(79,184,224,${glowA})`); hg.addColorStop(1, 'rgba(79,184,224,0)');
        ctx.fillStyle = hg; ctx.fillRect(x - s * 1.4, y - s * 1.9, s * 2.8, s * 2.8);
        bellPath(x, y, s);
        const bg = ctx.createLinearGradient(x - s * 0.5, 0, x + s * 0.5, 0);
        bg.addColorStop(0, '#07090a'); bg.addColorStop(0.35, '#1d2629'); bg.addColorStop(0.6, '#0b0f10'); bg.addColorStop(1, '#030405');
        ctx.fillStyle = bg; ctx.fill();
        ctx.strokeStyle = `rgba(143,227,255,${0.16 + 0.3 * flash + 0.25 * data.surge})`; ctx.lineWidth = 1.2 * dpr; ctx.stroke();
        ctx.fillStyle = '#050607'; ctx.fillRect(x - s * 0.05, y - s * 1.28, s * 0.1, s * 0.12);
      }
      // 河
      const rgw = ctx.createLinearGradient(0, wl, 0, H);
      rgw.addColorStop(0, 'rgba(10,26,32,0.97)'); rgw.addColorStop(1, 'rgba(3,8,10,1)');
      ctx.fillStyle = rgw; ctx.fillRect(-20, wl, W + 40, H - wl + 20);
      // 倒影
      ctx.save(); ctx.beginPath(); ctx.rect(-20, wl, W + 40, H - wl); ctx.clip();
      ctx.globalAlpha = 0.16 + 0.1 * flash;
      for (const [x, y, s] of pos) { const top = y - s * 1.2; if (top > wl) continue; ctx.save(); ctx.translate(0, wl * 2 + Math.sin(t * 2 + x) * 2 * dpr); ctx.scale(1, -1); bellPath(x, y, s); ctx.fillStyle = '#2a4a55'; ctx.fill(); ctx.restore(); }
      ctx.restore();
      ctx.strokeStyle = 'rgba(143,227,255,0.10)'; ctx.lineWidth = 1 * dpr;
      for (let i = 0; i < 7; i++) { const yy = wl + 6 * dpr + i * i * 5 * dpr; ctx.beginPath(); for (let x = 0; x <= W; x += 16 * dpr) ctx.lineTo(x, yy + Math.sin(x / (40 * dpr) + t * (1 + i * 0.2)) * 2 * dpr); ctx.stroke(); }
      // 雨
      ctx.strokeStyle = 'rgba(170,200,215,0.22)'; ctx.lineWidth = 1 * dpr; ctx.beginPath();
      for (const d of drops) { d.y += dt * (1.1 + d.s) * (1 + data.surge); d.x += dt * 0.12; if (d.y > 1) { d.y = -0.05; d.x = Math.random(); } if (d.x > 1) d.x -= 1; const x = d.x * W, y = d.y * H; ctx.moveTo(x, y); ctx.lineTo(x - 3 * dpr, y + 16 * dpr * d.s); }
      ctx.stroke();
      if (flash > 0) { ctx.fillStyle = `rgba(200,230,255,${flash * 0.18})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }

  // ---------- 鐘夜 ----------
  function bellnight() {
    SND.setMood('bell');

    const intro = EV.render(B.intro || ['第五十六夜。澐水在退，退得很快，像有人在水底把它吸走。', '水退之處，九口黑色的巨鐘一口接一口浮出水面。', '然後灰潮來了。']);
    card({ dark: true, title: '鐘夜', lines: intro, ok: '到渡口去' }, () => doWave());
    function doWave() {
      const w = S.bellnight.wave;

      const oddsWord = (o) => o >= 0.95 ? '穩住了' : o >= 0.7 ? '七八成' : o >= 0.45 ? '一半一半' : o >= 0.2 ? '很懸' : '守不住';

        const fallen = S.bellnight.fallen.map(id => { const a = S.advs[id]; if (!a) return ''; return `<div class="dtile dead"><div class="pf">${FACE.adv(a, { ghost: true })}</div><div class="dn">${esc(A.dname(a))}</div><div class="dp">倒下</div></div>`; }).join('');
        const tog = (k, on, label, sub, ok) => `<button class="btn tog ${on ? 'on' : ''} ${ok ? '' : 'off'}" data-b="${k}"><span class="ck">${on ? '✓' : ''}</span><span class="grow" style="text-align:left">${label}<small>${sub}</small></span></button>`;
        stg.body.innerHTML = `<div class="wname">${esc(W.name)}</div>

            ${canTan || S.bellnight.used.tan ? tog('tan', sel.tan || S.bellnight.used.tan, S.bellnight.used.tan ? '阿檀在唱' : '讓阿檀唱鐘偈', '念的威脅減半，一直到天亮', canTan) : ''}
            ${canCrown ? tog('crown', sel.crown, '用空冕碎片壓住灰潮', '只有這一波・耗神 ' + crownCost + (S.sanity <= crownCost ? '・你撐不住了' : ''), S.sanity > crownCost) : ''}
            <button class="btn pri big" data-b="go">迎戰</button></div>`;

        if (sel.tan && canTan) { S.bellnight.buffs.mind = 0.5; S.bellnight.used.tan = true; S.flags.bell_tan = true; }
        if (sel.crown && canCrown) { S.bellnight.buffs.all = 0.8; G.addSan(-crownCost); S.flags.bell_crown = true; UI.renderHUD(); }
        const before = S.bellnight.alive.slice();

          const hold = (B.hold && B.hold.length) ? B.hold : ['{name}擋在渡口，{weapon}砍進灰潮裡。'];
          const fall = (B.fall && B.fall.length) ? B.fall : ['{name}倒下了。'];
          const lines = [];
          r.hold.slice(0, 3).forEach(id => { const a = S.advs[id]; if (a) { const wpn = a.gear.weapon && S.items[a.gear.weapon]; lines.push({ text: U.tpl(U.pick(hold), { name: A.dname(a), weapon: wpn ? wpn.name : '手上的傢伙' }) }); } });
          r.fall.forEach(id => { const a = S.advs[id]; if (a) lines.push({ text: U.tpl(U.pick(fall), { name: A.dname(a) }) }); });
          lines.push({ text: r.ok ? '這一波，守住了。' : '這一波，沒有守住。灰潮漫進了下城。' });

            const acts = stg.body.querySelector('.acts');
            acts.innerHTML = `<div class="wres ${r.ok ? 'ok' : 'no'}">${lines.map((l, i) => lineHTML(l, i, 0.4)).join('')}</div><button class="btn pri big" data-b="next" style="opacity:0;animation:lnIn .4s ${(lines.length * 0.4 + 0.2).toFixed(1)}s forwards">${w >= 2 ? '天亮了' : '下一波'}</button>`;

    function buildTown() {

      // 遠方的鐘樓
      c.fillStyle = '#120d0a';
      const tx = W * 0.72, tw = Math.max(18, W * 0.05);
      c.fillRect(tx - tw / 2, base - H * 0.36, tw, H * 0.36);
      c.beginPath(); c.moveTo(tx - tw * 0.8, base - H * 0.36); c.lineTo(tx, base - H * 0.43); c.lineTo(tx + tw * 0.8, base - H * 0.36); c.fill();
      const bg2 = c.createRadialGradient(tx, base - H * 0.32, 0, tx, base - H * 0.32, tw * 1.6);
      bg2.addColorStop(0, 'rgba(143,227,255,0.18)'); bg2.addColorStop(1, 'rgba(143,227,255,0)');
      c.fillStyle = bg2; c.fillRect(tx - tw * 2, base - H * 0.4, tw * 4, H * 0.16);
      c.fillStyle = '#05080a'; c.fillRect(tx - tw * 0.32, base - H * 0.345, tw * 0.64, H * 0.045);
      c.fillStyle = '#1a2428'; c.beginPath(); c.moveTo(tx - tw * 0.12, base - H * 0.338); c.quadraticCurveTo(tx, base - H * 0.345, tx + tw * 0.12, base - H * 0.338); c.lineTo(tx + tw * 0.22, base - H * 0.305); c.lineTo(tx - tw * 0.22, base - H * 0.305); c.fill();
      c.fillStyle = '#d08a34'; c.fillRect(tx - tw * 0.08, base - H * 0.2, tw * 0.16, tw * 0.24);
      // 屋頂
      let x = -10; const rnd = U.seeded ? U.seeded(7) : Math.random;
      const roofs = [];
      while (x < W + 20) { const w = W * (0.07 + rnd() * 0.09); const h = H * (0.05 + rnd() * 0.07); roofs.push([x, w, h]); x += w * (0.75 + rnd() * 0.2); }
      c.fillStyle = '#0b0806';
      for (const [rx, rw, rh] of roofs) {
        const top = base - rh;
        c.beginPath(); c.moveTo(rx - rw * 0.08, top + rh * 0.25); c.quadraticCurveTo(rx + rw * 0.5, top - rh * 0.35, rx + rw * 1.08, top + rh * 0.25); c.lineTo(rx + rw, H); c.lineTo(rx, H); c.closePath(); c.fill();
      }
      // 窗
      for (const [rx, rw, rh] of roofs) {
        if (rnd() < 0.45) continue;
        const wx = rx + rw * (0.25 + rnd() * 0.4), wy = base - rh * 0.35 + rnd() * rh * 0.5, ww = Math.max(4, rw * 0.12), wh = ww * 1.3;
        const g = c.createRadialGradient(wx + ww / 2, wy + wh / 2, 0, wx + ww / 2, wy + wh / 2, ww * 3);
        g.addColorStop(0, 'rgba(240,168,60,0.35)'); g.addColorStop(1, 'rgba(240,168,60,0)');
        c.fillStyle = g; c.fillRect(wx - ww * 3, wy - ww * 3, ww * 7, wh + ww * 6);
        c.fillStyle = rnd() < 0.3 ? '#f6d38a' : '#d08a34'; c.fillRect(wx, wy, ww, wh);
        c.fillStyle = '#0b0806'; c.fillRect(wx + ww / 2 - 0.5 * dpr, wy, 1 * dpr, wh);
      }
      // 地面
      const gg = c.createLinearGradient(0, base, 0, H);
      gg.addColorStop(0, '#0a0705'); gg.addColorStop(1, '#030202');
      c.fillStyle = gg; c.fillRect(0, base + H * 0.02, W, H);
    }
    const resize = () => { W = cv.width = Math.round(cv.clientWidth * dpr); H = cv.height = Math.round(cv.clientHeight * dpr); buildTown(); };
    resize(); window.addEventListener('resize', resize);
    let t = 0;
    function makeBolt() {
      const pts = []; let x = W * (0.15 + Math.random() * 0.7), y = 0;
      while (y < H * 0.62) { pts.push([x, y]); x += (Math.random() - 0.5) * W * 0.08; y += H * (0.03 + Math.random() * 0.05); }
      return pts;
    }
    const frame = () => {
      t++;
      if (!cv.isConnected) { rainRAF = null; return; }
      ctx.clearRect(0, 0, W, H);
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#07090c'); sky.addColorStop(0.6, '#0e0a08'); sky.addColorStop(1, '#060404');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W / 2, H * 0.3, 10, W / 2, H * 0.3, Math.max(W, H) * 0.7);
      const fl = 0.85 + Math.sin(t * 0.05) * 0.05 + Math.random() * 0.04;
      g.addColorStop(0, `rgba(240,168,60,${0.22 * fl})`); g.addColorStop(0.5, 'rgba(60,30,10,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // 閃電
      if (!bolt && Math.random() < 0.0035) { bolt = makeBolt(); boltT = 9; flash = 1; }
      if (flash > 0) { ctx.fillStyle = `rgba(190,210,255,${0.16 * flash})`; ctx.fillRect(0, 0, W, H); flash *= 0.86; if (flash < 0.02) flash = 0; }
      if (bolt) {
        ctx.strokeStyle = `rgba(220,235,255,${boltT / 9})`; ctx.lineWidth = 2 * dpr; ctx.shadowColor = '#bcd6ff'; ctx.shadowBlur = 18 * dpr;
        ctx.beginPath(); bolt.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.shadowBlur = 0;
        if (--boltT <= 0) bolt = null;
      }
      if (town) ctx.drawImage(town, 0, 0);
      if (flash > 0.2 && town) { ctx.globalAlpha = flash * 0.25; ctx.fillStyle = '#9fb2c8'; ctx.fillRect(0, H * 0.82, W, H * 0.18); ctx.globalAlpha = 1; }
      // 招牌旁的微光塵
      for (const m of motes) { m.y -= m.v; if (m.y < 0.12) { m.y = 0.45; m.x = 0.3 + Math.random() * 0.4; } const a = 0.35 + 0.35 * Math.sin(t * 0.04 + m.ph); ctx.fillStyle = `rgba(255,207,122,${a})`; ctx.beginPath(); ctx.arc((m.x + Math.sin(t * 0.01 + m.ph) * 0.01) * W, m.y * H, m.r * dpr, 0, 6.3); ctx.fill(); }
      // 雨
      ctx.strokeStyle = 'rgba(170,200,220,0.35)'; ctx.lineWidth = 1 * dpr; ctx.beginPath();
      for (const d of drops) { d.y += 0.012 * d.s; d.x -= 0.0015 * d.s; if (d.y > 0.82 + d.s * 0.12) { if (Math.random() < 0.3) splashes.push({ x: d.x * W, y: d.y * H, a: 1 }); d.y = -0.05; d.x = Math.random() * 1.1; } ctx.moveTo(d.x * W, d.y * H); ctx.lineTo(d.x * W - 3 * dpr, d.y * H + d.l * dpr); }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(170,200,220,0.4)';
      for (let i = splashes.length - 1; i >= 0; i--) { const sp = splashes[i]; sp.a -= 0.08; if (sp.a <= 0) { splashes.splice(i, 1); continue; } ctx.globalAlpha = sp.a; ctx.beginPath(); ctx.ellipse(sp.x, sp.y, (1 - sp.a) * 7 * dpr + 1, (1 - sp.a) * 2 * dpr + 0.5, 0, 0, 6.3); ctx.stroke(); }
      ctx.globalAlpha = 1;
      rainRAF = requestAnimationFrame(frame);
    };
    frame();
  }
  function stopRain() { if (rainRAF) cancelAnimationFrame(rainRAF); rainRAF = null; }
  function metaNotes() {

  // ---------- 新局 ----------
