<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>遺物鋪</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>:root{
  --ink:#0d0b09; --ink2:#15110d; --panel:#1b1611; --panel2:#231c15; --line:#3a2e22; --line2:#5a4630;
  --paper:#ece2cb; --paper2:#cfc2a6; --muted:#9a8c74; --dim:#6e6352;
  --amber:#f0a83c; --amber2:#ffcf7a; --ember:#d0552e; --blood:#b8281c; --ghost:#8fe3ff; --ghost2:#4fb8e0;
  --jade:#5fc0a8; --gold:#f2cf6b; --violet:#b48ef0; --good:#7fcf8a; --bad:#ff6a55;
  --t1:#9a958c; --t2:#c79a62; --t3:#5fc0a8; --t4:#b48ef0; --t5:#f2cf6b;
  --fs:1; --rad:12px;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
:root:not([data-theme="light"]){color-scheme:dark}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);overflow:hidden}
body{font-family:var(--serif);font-size:calc(15px * var(--fs));line-height:1.55;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit}
input{font:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;background:radial-gradient(120% 70% at 50% 0%,#211910 0%,var(--ink) 60%)}
.hide{display:none!important}
svg.ic{width:1.15em;height:1.15em;vertical-align:-0.18em;flex:none}
.btn svg.ic{width:1.2em;height:1.2em}
.btn.big svg.ic{width:1.35em;height:1.35em}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 10px 6px;background:linear-gradient(180deg,#1d1610,#120e0a);border-bottom:1px solid var(--line);min-height:50px;position:relative;z-index:5}
.hud .day{display:flex;flex-direction:column;line-height:1.1;min-width:58px}
.hud .day b{font-size:1.05em;font-weight:900;color:var(--paper)}
.hud .day span{font-size:.72em;color:var(--muted)}
.hud .cash{display:flex;align-items:center;gap:5px;font-weight:700;font-size:1.06em;color:var(--gold)}
.hud .cash svg{width:18px;height:18px}
.hud .spacer{flex:1}
.hud .due{font-size:.72em;color:var(--muted);text-align:right;line-height:1.2}
.hud .due b{color:var(--paper);font-size:1.2em}
.hud .due.warn b{color:var(--bad)}
.ring{position:relative;width:34px;height:34px;flex:none}
.ring svg{width:34px;height:34px;transform:rotate(-90deg)}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:.7em;font-weight:700}
.hud .menu{width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center;color:var(--paper2);border-radius:10px}
.hud .menu:active{background:#ffffff10}

/* ---------- 舞台 ---------- */
.stage{flex:1;position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.view::-webkit-scrollbar{width:0}
.pad{padding:12px}

/* ---------- 底部導航 ---------- */
.nav{display:flex;background:linear-gradient(0deg,#0f0c09,#1a140e);border-top:1px solid var(--line);padding:4px 4px calc(4px + var(--safe-b));position:relative;z-index:5}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 3px;color:var(--dim);font-size:.74em;border-radius:12px;position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--amber2)}
.nav button.on::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:2px;background:var(--amber);border-radius:2px;box-shadow:0 0 10px var(--amber)}
.nav button .dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 6px var(--ember)}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:linear-gradient(180deg,#2c2219,#1e1712);color:var(--paper);font-weight:700;letter-spacing:.04em;cursor:pointer;transition:transform .08s,filter .15s,box-shadow .2s;box-shadow:inset 0 1px 0 #ffffff12,0 2px 0 #00000080;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(1px) scale(.985);filter:brightness(1.15)}
.btn[disabled],.btn.off{opacity:.38;pointer-events:none}
.btn.pri{background:linear-gradient(180deg,#f7bc5a,#d98a26);border-color:#ffd58a;color:#2a1606;box-shadow:inset 0 1px 0 #fff6,0 0 18px #f0a83c40,0 2px 0 #6a3a0a}
.btn.danger{background:linear-gradient(180deg,#c4482c,#8a2614);border-color:#e0704a;color:#fff2e6}
.btn.ghost{background:linear-gradient(180deg,#123040,#0b1c26);border-color:#4fb8e0;color:#c9f4ff;box-shadow:inset 0 1px 0 #ffffff20,0 0 16px #4fb8e040}
.btn.jade{background:linear-gradient(180deg,#2f7a64,#1d4d40);border-color:#5fc0a8;color:#e9fff6}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--paper2);font-weight:600}
.btn.sm{min-height:34px;padding:0 10px;font-size:.88em;border-radius:10px}
.btn.xs{min-height:28px;padding:0 8px;font-size:.8em;border-radius:8px}
.btn.big{min-height:56px;font-size:1.12em;border-radius:14px;padding:0 22px}
.btn.wide{width:100%}
.btn .cost{font-family:var(--sans);font-size:.78em;font-weight:600;opacity:.8;margin-left:2px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.col{display:flex;flex-direction:column;gap:8px}
.mt{margin-top:10px}.mt2{margin-top:16px}.mb{margin-bottom:10px}

/* ---------- 面板、卡片 ---------- */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--rad);padding:12px;box-shadow:inset 0 1px 0 #ffffff0a,0 6px 16px #0006}
.card+.card{margin-top:10px}
.card h3{margin:0 0 8px;font-size:1.02em;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:600;color:var(--muted);font-size:.78em;letter-spacing:0}
.sect{font-size:.78em;color:var(--muted);letter-spacing:.12em;margin:14px 2px 6px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.paper{background:linear-gradient(180deg,#efe3c6,#dccaa2);color:#2a1d10;border-color:#a88f63}
.paper .muted{color:#6b5a3e}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:.84em}
.tiny{font-size:.74em}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);font-size:.74em;color:var(--paper2);background:#ffffff08;white-space:nowrap;line-height:1.6}
.chip.t1{color:var(--t1);border-color:#9a958c55}.chip.t2{color:var(--t2);border-color:#c79a6255}.chip.t3{color:var(--t3);border-color:#5fc0a855}.chip.t4{color:var(--t4);border-color:#b48ef055}.chip.t5{color:var(--t5);border-color:#f2cf6b77;box-shadow:0 0 10px #f2cf6b30}
.chip.bad{color:var(--bad);border-color:#ff6a5555}.chip.good{color:var(--good);border-color:#7fcf8a55}.chip.ghost{color:var(--ghost);border-color:#8fe3ff55}.chip.warn{color:var(--amber2);border-color:#f0a83c66}
.tierN{font-weight:900}
.tn1{color:var(--t1)}.tn2{color:var(--t2)}.tn3{color:var(--t3)}.tn4{color:var(--t4)}.tn5{color:var(--t5);text-shadow:0 0 8px #f2cf6b55}

/* 數值條 */
.bar{height:8px;border-radius:6px;background:#0007;overflow:hidden;position:relative;border:1px solid #ffffff0d}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--amber);transition:width .5s}
.bar.ghost>i{background:linear-gradient(90deg,#2a7ea8,var(--ghost))}
.bar.heat>i{background:linear-gradient(90deg,#8a2614,var(--bad))}
.bar.good>i{background:linear-gradient(90deg,#2f7a64,var(--jade))}
.bar.rep>i{background:var(--paper2)}
.bar.center>i{left:50%}

/* ---------- 櫃台 ---------- */
.counter{position:absolute;inset:0;display:flex;flex-direction:column}
.scene{position:relative;height:44%;min-height:250px;max-height:420px;overflow:hidden;background:#140d08;flex:none}
.scene .scene-back,.scene .scene-front{position:absolute;inset:0;width:100%;height:100%}
.scene .scene-back{filter:brightness(calc(1 - var(--dusk,0)));transition:filter 1.2s}
.scene .scene-front{pointer-events:none;z-index:3}
.scene .who{position:absolute;left:50%;bottom:16%;height:84%;aspect-ratio:160/196;transform:translateX(-50%);z-index:2;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s,filter .4s;filter:drop-shadow(0 6px 14px #000c)}
.scene .who svg{width:100%;height:100%}
.scene .who.enter{animation:whoIn .55s cubic-bezier(.2,.8,.2,1)}
.scene .who.leave{opacity:0;transform:translateX(30%) scale(.96)}
.scene .who.shake{animation:shake .35s}
.scene .who.ghostly{animation:ghostFloat 3s ease-in-out infinite}
@keyframes whoIn{from{opacity:0;transform:translateX(-30%) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-53%)}75%{transform:translateX(-47%)}}
@keyframes ghostFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.scene .onctr{position:absolute;bottom:9%;left:58%;width:min(30%,150px);aspect-ratio:1;z-index:4;transform:translateX(-50%);animation:dropIn .5s cubic-bezier(.2,1.4,.4,1)}
.scene .onctr svg{width:100%;height:100%;filter:drop-shadow(0 8px 10px #000a)}
@keyframes dropIn{from{opacity:0;transform:translate(-50%,-40px) rotate(-8deg)}to{opacity:1;transform:translate(-50%,0)}}
.scene .bubble{position:absolute;left:10px;right:10px;bottom:8px;z-index:6;background:linear-gradient(180deg,#120d09f0,#0b0806f5);border:1px solid #5a4630;border-radius:12px;padding:8px 12px 9px;min-height:44px;box-shadow:0 6px 18px #000a}
.scene .bubble .nm{font-size:.74em;color:var(--amber2);font-weight:900;letter-spacing:.1em;margin-bottom:1px}
.scene .bubble .tx{font-size:.98em;line-height:1.5}
.scene .bubble.hide{display:none}
.scene .tint{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(90% 80% at 50% 45%,transparent 50%,#000a 100%)}
.scene.lowsan .tint{background:radial-gradient(80% 70% at 50% 45%,transparent 30%,#0b2a3acc 100%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6}}
.scene .rain line{animation:rain 0.7s linear infinite}
@keyframes rain{from{transform:translateY(-30px)}to{transform:translateY(40px)}}
.lampglow{animation:flick 3.2s ease-in-out infinite}
.flame{animation:flick 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{0%,100%{opacity:1}30%{opacity:.82}55%{opacity:.95}70%{opacity:.78}}
.qbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0f0c09;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.qbar::-webkit-scrollbar{display:none}
.qbar .candle{display:flex;align-items:center;gap:6px;flex:none;font-size:.78em;color:var(--muted);margin-right:4px}
.qbar .candle .cb{width:64px;height:8px;border-radius:5px;background:#000;position:relative;overflow:hidden;border:1px solid #3a2e22}
.qbar .candle .cb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c46a1a,#ffcf7a);transition:width .6s}
.qbar .q{position:relative;width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;border:2px solid #3a2e22;background:#1e1712;cursor:pointer}
.qbar .q svg{width:100%;height:100%}
.qbar .q.star{border-color:var(--gold);box-shadow:0 0 10px #f2cf6b70}
.qbar .q .md{position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-radius:50%;background:#0d0b09;display:grid;place-items:center;font-size:10px;border:1px solid #3a2e22}
.panel{flex:1;overflow-y:auto;padding:10px 10px 18px;min-height:0;-webkit-overflow-scrolling:touch}
.panel::-webkit-scrollbar{width:0}

/* 物品卡 */
.icard{display:flex;gap:12px;align-items:flex-start}
.icard .art{width:84px;height:84px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 40%,#3a2e22,#15110d);border:1px solid var(--line);position:relative}
.icard .art svg{width:100%;height:100%}
.icard .nm{font-weight:900;font-size:1.06em;line-height:1.3}
.apr{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px}
.apr .k{font-size:.82em;color:var(--muted);letter-spacing:.08em}
.apr .v{font-size:.92em;min-height:22px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.apr .v.unk{color:var(--dim);letter-spacing:.3em}
.apr .v .shaky{color:var(--ghost);font-size:.8em}
.vbar{position:relative;height:30px;margin:12px 4px 4px}
.vbar .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:4px;background:#000a;border:1px solid #ffffff10}
.vbar .rng{position:absolute;top:10px;height:10px;border-radius:5px;background:linear-gradient(90deg,#5fc0a855,#5fc0a8cc);border:1px solid #5fc0a8;transition:left .5s,width .5s}
.vbar .mk{position:absolute;top:0;width:2px;height:30px;background:var(--amber);box-shadow:0 0 6px var(--amber);transition:left .4s}
.vbar .mk span{position:absolute;top:-2px;left:4px;font-size:.7em;color:var(--amber2);white-space:nowrap;font-family:var(--sans)}
.vbar .mk.me{background:var(--paper)}.vbar .mk.me span{color:var(--paper);top:auto;bottom:-4px}
.vlab{display:flex;justify-content:space-between;font-size:.74em;color:var(--muted);font-family:var(--sans);padding:0 4px}
.haggle{margin-top:12px;background:#0d0a08;border:1px solid var(--line);border-radius:14px;padding:10px}
.haggle .pv{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:2px 0 8px}
.haggle .pv b{font-size:2.1em;font-weight:900;color:var(--gold);font-family:var(--sans);line-height:1}
.haggle .pv span{color:var(--muted);font-size:.9em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps .btn{min-height:40px;padding:0;font-family:var(--sans)}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick .btn{flex:1;min-width:84px}
.pat{display:flex;gap:4px;align-items:center;font-size:.76em;color:var(--muted)}
.pat i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.pat i.off{background:#3a2e22;box-shadow:none}
.ithumbs{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.ithumbs .t{width:56px;height:56px;border-radius:10px;border:2px solid var(--line);background:#15110d;flex:none;position:relative}
.ithumbs .t.on{border-color:var(--amber)}
.ithumbs .t.done{opacity:.35}
.ithumbs .t svg{width:100%;height:100%}

/* 賣東西的清單 */
.slist{display:flex;flex-direction:column;gap:6px}
.sitem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:#ffffff06;border:1px solid var(--line);cursor:pointer;transition:background .15s}
.sitem:active{background:#ffffff10}
.sitem.match{border-color:#5fc0a866;background:linear-gradient(90deg,#5fc0a812,transparent)}
.sitem .ic{width:48px;height:48px;flex:none;border-radius:10px;background:radial-gradient(circle,#3a2e22,#15110d);position:relative}
.sitem .ic svg{width:100%;height:100%}
.sitem .nm{font-weight:700;font-size:.94em;line-height:1.3}
.sitem .sub{font-size:.76em;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sitem .pr{font-family:var(--sans);font-weight:800;color:var(--gold);text-align:right;line-height:1.2}
.sitem .pr small{display:block;font-size:.7em;color:var(--muted);font-weight:600}
.surv{display:flex;align-items:center;gap:4px;font-family:var(--sans);font-size:.8em;font-weight:700}
.surv .up{color:var(--good)}.surv .down{color:var(--bad)}
.needs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.th{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:.78em;font-weight:900;color:#120d09}

/* ---------- 物品格 ---------- */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.icell{position:relative;aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 40%,#33281e,#14100c);border:1.5px solid var(--line);cursor:pointer;transition:transform .1s}
.icell:active{transform:scale(.96)}
.icell svg{width:100%;height:100%}
.icell.t2{border-color:#c79a6266}.icell.t3{border-color:#5fc0a888}.icell.t4{border-color:#b48ef0aa}.icell.t5{border-color:#f2cf6bcc;box-shadow:0 0 12px #f2cf6b40}
.icell .badge{position:absolute;top:3px;left:3px;font-size:10px;padding:0 4px;border-radius:5px;background:#000c;color:var(--paper2);font-family:var(--sans);font-weight:700}
.icell .price{position:absolute;bottom:3px;right:3px;font-size:10px;padding:0 4px;border-radius:5px;background:#000c;color:var(--gold);font-family:var(--sans);font-weight:700}
.icell .warn{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--blood);color:#fff;font-size:10px;display:grid;place-items:center;font-weight:900}
.icell.empty{border-style:dashed;opacity:.35;cursor:default}

/* ---------- 底部抽屜 ---------- */
.sheetwrap{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;background:linear-gradient(180deg,#221a13,#15110d);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;padding:8px 14px calc(18px + var(--safe-b));animation:sheetUp .28s cubic-bezier(.2,.9,.2,1);box-shadow:0 -10px 40px #000c}
.sheet::-webkit-scrollbar{width:0}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#5a4630;margin:2px auto 10px}
.sheet h2{margin:0 0 10px;font-size:1.2em;font-weight:900;letter-spacing:.06em}
@keyframes sheetUp{from{transform:translateY(40%);opacity:.5}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- 劇情卡流 ---------- */
.flow{position:fixed;inset:0;z-index:50;background:radial-gradient(100% 80% at 50% 30%,#1f170fee,#070504f8);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(16px + var(--safe-b));animation:fadeIn .3s}
.fcard{width:100%;max-width:560px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;animation:cardIn .45s cubic-bezier(.2,.9,.2,1)}
.fcard::-webkit-scrollbar{width:0}
@keyframes cardIn{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.fcard .por{width:150px;height:184px;margin:0 auto -18px;position:relative;z-index:1;filter:drop-shadow(0 10px 20px #000)}
.fcard .por svg{width:100%;height:100%}
.fcard .body{background:linear-gradient(180deg,#241b13,#17120d);border:1px solid var(--line2);border-radius:16px;padding:16px 16px 14px;box-shadow:0 16px 40px #000c,inset 0 1px 0 #ffffff10}
.fcard .ttl{font-size:.8em;letter-spacing:.3em;color:var(--amber2);text-align:center;margin-bottom:8px;font-weight:900}
.fcard .ln{margin:0 0 8px;line-height:1.7;opacity:0;animation:lnIn .45s forwards}
.fcard .ln.nar{color:var(--paper2)}
.fcard .ln .sp{color:var(--amber2);font-weight:900;font-size:.82em;letter-spacing:.06em;margin-right:6px}
.fcard .ln.me .sp{color:var(--ghost)}
@keyframes lnIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fcard .chs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fcard .chs .btn{justify-content:flex-start;text-align:left;min-height:48px;padding:6px 14px;flex-direction:column;align-items:flex-start;gap:0}
.fcard .chs .btn small{font-size:.76em;font-weight:600;color:var(--muted)}
.fcard .chs .btn.pri small{color:#4a2a0a}
.mem{font-size:1.02em;letter-spacing:.04em}
.mem .ln{color:#d8f4ff;text-shadow:0 0 12px #4fb8e0}
.flow.memory{background:radial-gradient(100% 80% at 50% 40%,#0c2230f0,#020608fa)}

/* 夜報卡 */
.ncard{background:linear-gradient(180deg,#efe3c6,#d8c49a);color:#2a1d10;border-radius:14px;padding:16px;box-shadow:0 18px 40px #000d;border:1px solid #a88f63;position:relative}
.ncard::before{content:"";position:absolute;inset:6px;border:1px solid #8a734a55;border-radius:10px;pointer-events:none}
.ncard h4{margin:0 0 8px;font-size:1.1em;font-weight:900;letter-spacing:.12em;text-align:center}
.ncard .big{font-size:2em;font-weight:900;font-family:var(--sans);text-align:center}
.ncard .ln{opacity:1;animation:none;color:#2a1d10}
.ncard .muted{color:#6b5a3e}
.ncard.dark{background:linear-gradient(180deg,#1c1612,#0f0b08);color:var(--paper);border-color:#5a4630}
.ncard.dark .muted{color:var(--muted)}
.ncard.death{background:linear-gradient(180deg,#26201c,#100c0a);color:var(--paper);border-color:#7a1a12;box-shadow:0 18px 40px #000d,0 0 30px #7a1a1240}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92em}
.kv b{font-family:var(--sans);text-align:right}

/* ---------- 吐司 ---------- */
.toasts{position:fixed;left:0;right:0;top:calc(58px + var(--safe-t));z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#120d09f2;border:1px solid var(--line2);color:var(--paper);padding:8px 14px;border-radius:12px;font-size:.9em;box-shadow:0 8px 20px #000c;animation:toastIn .3s cubic-bezier(.2,1.2,.4,1);max-width:92vw}
.toast.good{border-color:#5fc0a8}.toast.bad{border-color:#e0704a}.toast.gold{border-color:var(--gold);color:var(--gold)}
@keyframes toastIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.floatnum{position:fixed;z-index:70;pointer-events:none;font-family:var(--sans);font-weight:900;font-size:1.2em;animation:floatUp 1.1s forwards;text-shadow:0 2px 6px #000}
@keyframes floatUp{to{transform:translateY(-46px);opacity:0}}

/* ---------- 晨 ---------- */
.morning .hero{position:relative;height:150px;border-radius:16px;overflow:hidden;margin:10px 10px 0;background:linear-gradient(180deg,#2e4656,#1a2a34);border:1px solid #3d5868}
.morning .hero .t{position:absolute;left:14px;bottom:10px}
.morning .hero .t b{font-size:1.6em;font-weight:900;letter-spacing:.08em;text-shadow:0 2px 8px #000}
.morning .hero .t span{display:block;color:#cfe2ee;font-size:.82em}
.news{display:flex;flex-direction:column;gap:8px}
.news .n{padding:10px 12px;border-radius:10px;background:#efe3c6;color:#2a1d10;border:1px solid #a88f63;font-size:.92em;line-height:1.5;position:relative}
.news .n::before{content:"晨報";position:absolute;top:-8px;right:10px;font-size:.66em;background:#7a1a12;color:#fff;padding:0 6px;border-radius:4px;letter-spacing:.2em}
.news .r{padding:8px 12px;border-radius:10px;background:#ffffff08;border:1px dashed var(--line2);font-size:.88em;color:var(--paper2)}
.news .r.warn{border-color:var(--ember);color:#ffd0b8;background:#d0552e14}
.market{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mk{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:#ffffff07;border:1px solid var(--line)}
.mk .ic{width:42px;height:42px;flex:none}
.mk .ic svg{width:100%;height:100%}
.mk .nm{font-size:.86em;font-weight:700;line-height:1.25}
.mk .sub{font-size:.72em;color:var(--muted)}
.sticky-bottom{position:sticky;bottom:0;padding:10px;background:linear-gradient(0deg,var(--ink) 60%,transparent);z-index:3}

/* ---------- 鋪子 ---------- */
.shopwrap{display:flex;flex-direction:column}
.shopsvg{width:100%;max-width:520px;display:block;margin:0 auto;border-radius:14px;border:1px solid var(--line)}
.shopsvg .room{cursor:pointer}
.shopsvg .room .hit{transition:stroke .2s}
.shopsvg .rain line{animation:rain .8s linear infinite}
.circle-glow{animation:flick 2.5s ease-in-out infinite}
.mats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mat{display:flex;flex-direction:column;align-items:center;font-size:.72em;color:var(--muted);background:#ffffff06;border:1px solid var(--line);border-radius:10px;padding:4px 2px}
.mat svg{width:34px;height:34px}
.mat b{font-family:var(--sans);color:var(--paper);font-size:1.2em}
.upg{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#ffffff05}
.upg+.upg{margin-top:6px}
.upg .nm{font-weight:900}
.upg .d{font-size:.8em;color:var(--muted)}
.upg.done{opacity:.55}
.job{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1px dashed var(--line2);font-size:.88em}

/* ---------- 地圖 ---------- */
.mapsvg{width:100%;max-width:520px;display:block;margin:0 auto;border-radius:14px;border:1px solid #6b5a3a;box-shadow:0 8px 24px #0009}
.mapsvg .mreg{cursor:pointer}
.mapsvg .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.05}}
.roster{display:flex;flex-direction:column;gap:6px}
.adv{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid var(--line);background:#ffffff05;cursor:pointer}
.adv .pf{width:52px;height:60px;flex:none;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 70%,#5a3a20,#15110d)}
.adv .pf svg{width:100%;height:100%}
.adv .nm{font-weight:900}
.adv .st{font-size:.78em;color:var(--muted)}
.adv.dead{opacity:.45;filter:grayscale(1)}
.adv.named{border-color:#7a1a1288}
.svbars{display:flex;flex-direction:column;gap:5px}
.svb{display:grid;grid-template-columns:76px 1fr 46px;gap:8px;align-items:center;font-size:.82em}
.svb b{font-family:var(--sans);text-align:right}
.gearg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gearg .g{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#15110d;position:relative}
.gearg .g svg{width:100%;height:100%}
.gearg .g span{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
.gearg .g.mine{border-color:var(--amber)}
.thbars{display:flex;flex-direction:column;gap:5px}
.thb{display:grid;grid-template-columns:44px 1fr 32px;gap:8px;align-items:center;font-size:.82em}

/* ---------- 分頁 ---------- */
.seg{display:flex;gap:4px;padding:4px;background:#0d0a08;border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:58px;border:0;background:transparent;padding:7px 8px;border-radius:9px;color:var(--muted);font-weight:700;font-size:.86em;white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,#3a2c1e,#2a2016);color:var(--paper);box-shadow:inset 0 1px 0 #ffffff14}
.loglist{display:flex;flex-direction:column;gap:6px}
.logi{padding:8px 10px;border-radius:10px;background:#ffffff06;border:1px solid var(--line);font-size:.9em;line-height:1.55}
.logi .d{font-size:.72em;color:var(--muted);font-family:var(--sans)}
.frag{padding:12px;border-radius:12px;background:linear-gradient(180deg,#0f1d26,#0a1218);border:1px solid #2a5a74;color:#d8f4ff;line-height:1.7;font-size:.94em;box-shadow:inset 0 0 20px #4fb8e014}
.frag.locked{color:#4a6a7a;background:#0a0e10;border-style:dashed}
.relics{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.relic{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#120e0b;position:relative}
.relic svg{width:100%;height:100%}
.relic.no{opacity:.25;filter:grayscale(1)}
.relic.read::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--ghost);box-shadow:0 0 6px var(--ghost)}

/* ---------- 標題 ---------- */
.title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 20px calc(30px + var(--safe-b));background:#060404;overflow:hidden}
.title canvas{position:absolute;inset:0;width:100%;height:100%}
.title .logo{position:relative;z-index:2;text-align:center;margin-bottom:auto;margin-top:12vh}
.title .logo .sign{display:inline-block;padding:18px 26px 14px;background:linear-gradient(180deg,#4a1a12,#2a0c08);border:3px solid #8a5a2a;border-radius:6px;box-shadow:0 0 60px #f0a83c40,inset 0 0 24px #0008;transform-origin:50% -40px;animation:swing 6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.title .logo h1{margin:0;font-size:clamp(44px,13vw,82px);font-weight:900;letter-spacing:.18em;color:#f6d38a;text-shadow:0 0 18px #f0a83c88,0 3px 0 #6a3a0a;line-height:1.1;padding-left:.18em}
.title .logo .en{font-family:var(--sans);letter-spacing:.42em;font-size:.72em;color:#c9a46a;margin-top:6px;padding-left:.42em}
.title .logo .tag{margin-top:22px;color:#cfc2a6;font-size:.92em;letter-spacing:.14em;text-shadow:0 2px 8px #000}
.title .menu{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;width:min(340px,100%)}
.title .ver{position:relative;z-index:2;margin-top:14px;font-size:.7em;color:#6e6352;font-family:var(--sans)}

/* ---------- 新局 ---------- */
.newgame{position:fixed;inset:0;z-index:31;overflow-y:auto;background:radial-gradient(100% 60% at 50% 0%,#2a1d12,#0a0806);padding:calc(16px + var(--safe-t)) 14px calc(30px + var(--safe-b))}
.bgopt{display:flex;gap:10px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:#ffffff05;cursor:pointer;transition:border-color .2s,background .2s}
.bgopt+.bgopt{margin-top:8px}
.bgopt.on{border-color:var(--amber);background:#f0a83c12;box-shadow:0 0 18px #f0a83c25}
.bgopt.lock{opacity:.4;cursor:default}
.bgopt .nm{font-weight:900;font-size:1.04em}
.bgopt .d{font-size:.84em;color:var(--paper2)}
.field{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:#0d0a08;color:var(--paper);font-size:1.05em}

/* ---------- 結局 ---------- */
.ending{position:fixed;inset:0;z-index:55;overflow-y:auto;background:#030202;padding:calc(30px + var(--safe-t)) 18px calc(30px + var(--safe-b))}
.ending .inner{max-width:560px;margin:0 auto}
.ending h1{text-align:center;font-size:2.4em;letter-spacing:.4em;margin:20px 0 6px;font-weight:900;color:#f6d38a;text-shadow:0 0 30px #f0a83c66;padding-left:.4em}
.ending .sub{text-align:center;color:var(--muted);letter-spacing:.3em;font-size:.8em;margin-bottom:26px}
.ending .ln{margin:0 0 14px;line-height:1.95;opacity:0;animation:lnIn 1.2s forwards;font-size:1.04em}
.ending .ln .sp{color:var(--amber2);font-weight:900;font-size:.82em;margin-right:6px}

/* ---------- 搜鋪 ---------- */
.raid{position:fixed;inset:0;z-index:48;background:radial-gradient(80% 60% at 50% 40%,#2a0c08ee,#050302f8);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .3s}
.raid .box{max-width:520px;width:100%}

/* ---------- 寬螢幕 ---------- */
@media (min-width:860px){
  .counter{flex-direction:row}
  .counter .scene{height:auto;max-height:none;flex:1.15;min-height:0}
  .counter .rightcol{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line)}
  .igrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
  .sheet{border-radius:20px;margin-bottom:20px;border-bottom:1px solid var(--line2)}
  .sheetwrap{align-items:center}
}
@media (max-width:859px){ .counter .rightcol{display:contents} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.deals{padding:6px 12px}
.deal{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.06);animation:lnIn .35s both}
.deal:last-child{border-bottom:0}
.deal .ic{width:40px;height:40px;flex:none}
.deal .nm{font-weight:800}
.deal b{font-size:1.1em}
.deal.out b{color:var(--gold)}
.deal.in b,.deal.pawn b{color:#ff9a7a}
/* 讀念：念瞳打開的瞬間 */
.memart{position:relative;width:96px;height:96px;margin:0 auto 10px;animation:memIn .9s cubic-bezier(.2,.9,.2,1) both;filter:drop-shadow(0 0 14px #4fb8e0aa)}
.memart.strong{width:116px;height:116px}
.memart.relic{width:132px;height:132px;filter:drop-shadow(0 0 22px #f2cf6b99)}
.memart.cursed{filter:drop-shadow(0 0 16px #ff5a4a99)}
.memart svg{position:relative;z-index:1}
.memart .mring{position:absolute;inset:-6%;border-radius:50%;border:1px solid #8fe3ff66;box-shadow:0 0 18px #4fb8e055 inset;animation:ringOut 2.8s ease-out infinite}
.memart .mring.r2{animation-delay:1.4s}
.memart.relic .mring{border-color:#f2cf6b77;box-shadow:0 0 18px #f2cf6b44 inset}
.memart.cursed .mring{border-color:#ff8a7a66;box-shadow:0 0 18px #ff5a4a44 inset}
@keyframes memIn{0%{opacity:0;transform:scale(.6) translateY(10px);filter:blur(6px) drop-shadow(0 0 0 #4fb8e0)}60%{opacity:1;filter:blur(0) drop-shadow(0 0 30px #8fe3ff)}100%{transform:none}}
@keyframes ringOut{0%{transform:scale(.7);opacity:0}25%{opacity:1}100%{transform:scale(1.55);opacity:0}}
.flow .motes{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.9;
  background-image:radial-gradient(2px 2px at 12% 80%,#8fe3ffcc,transparent 60%),radial-gradient(1.5px 1.5px at 30% 65%,#8fe3ff99,transparent 60%),radial-gradient(2px 2px at 52% 90%,#bff0ffcc,transparent 60%),radial-gradient(1.5px 1.5px at 70% 75%,#8fe3ffaa,transparent 60%),radial-gradient(2.5px 2.5px at 86% 85%,#8fe3ff88,transparent 60%),radial-gradient(1.5px 1.5px at 40% 98%,#8fe3ffaa,transparent 60%),radial-gradient(2px 2px at 64% 60%,#bff0ff88,transparent 60%),radial-gradient(1.5px 1.5px at 20% 95%,#8fe3ff99,transparent 60%);
  background-size:100% 100%;animation:motes 9s linear infinite}
.flow .motes.gold{background-image:radial-gradient(2px 2px at 12% 80%,#f2cf6bcc,transparent 60%),radial-gradient(1.5px 1.5px at 30% 65%,#f2cf6b99,transparent 60%),radial-gradient(2px 2px at 52% 90%,#ffe9a8cc,transparent 60%),radial-gradient(1.5px 1.5px at 70% 75%,#f2cf6baa,transparent 60%),radial-gradient(2.5px 2.5px at 86% 85%,#f2cf6b88,transparent 60%),radial-gradient(1.5px 1.5px at 40% 98%,#f2cf6baa,transparent 60%),radial-gradient(2px 2px at 64% 60%,#ffe9a888,transparent 60%),radial-gradient(1.5px 1.5px at 20% 95%,#f2cf6b99,transparent 60%)}
@keyframes motes{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-55%);opacity:0}}
.flow .fcard{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.memart,.memart .mring,.flow .motes{animation:none}}
/* ===== 鐘夜舞台 ===== */
.bellstage{position:fixed;inset:0;z-index:60;background:#030506;display:flex;flex-direction:column;animation:fadeIn .6s}
.bellstage .bcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bellstage .bhud{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t,0px)) 16px 6px}
.bellstage .bttl{font-family:var(--serif);font-weight:900;letter-spacing:.5em;color:#cfe9f2;text-shadow:0 0 18px #4fb8e0aa;font-size:1.05em}
.bellstage .pips{display:flex;gap:8px}
.bellstage .pips i{width:14px;height:14px;border-radius:50%;border:1.5px solid #4a6a74;background:transparent;transition:all .4s}
.bellstage .pips i.cur{border-color:#8fe3ff;box-shadow:0 0 10px #4fb8e0;animation:pip 1.6s ease-in-out infinite}
.bellstage .pips i.held{background:#f2cf6b;border-color:#f2cf6b;box-shadow:0 0 10px #f2cf6b99}
.bellstage .pips i.lost{background:#b8402c;border-color:#ff7a5a;box-shadow:0 0 10px #ff5a3a99}
@keyframes pip{50%{transform:scale(1.25)}}
.bellstage .bbody{position:relative;z-index:1;flex:1;overflow-y:auto;padding:6px 14px calc(18px + var(--safe-b,0px));display:flex;flex-direction:column;justify-content:flex-end;max-width:620px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.bellstage .wname{font-family:var(--serif);font-weight:900;font-size:1.6em;letter-spacing:.3em;color:#f1e6cc;text-shadow:0 2px 20px #000,0 0 30px #4fb8e055;text-align:center;margin:8px 0 4px;animation:lnIn .6s both}
.bellstage .wintro{background:linear-gradient(180deg,#05090bcc,#05090bee);border-radius:12px;padding:4px 12px;margin-bottom:8px}
.bellstage .wintro:empty{display:none}
.bellstage .wintro .ln{color:#d7e3e6;margin:6px 0}
.bellstage .meter{background:#05090bdd;border:1px solid #23414b;border-radius:14px;padding:10px 12px;margin-bottom:8px;backdrop-filter:blur(3px)}
.bellstage .meter .lab{display:flex;justify-content:space-between;font-size:.82em;color:#9fb6bd;margin-bottom:6px}
.bellstage .meter .lab b{color:#f1e6cc;font-size:1.15em}
.bellstage .meter .bar{position:relative;height:14px;border-radius:8px;background:#0e1a1f;overflow:visible;box-shadow:inset 0 1px 3px #000}
.bellstage .meter .def{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#8a6a2a,#f2cf6b);box-shadow:0 0 12px #f2cf6b66;transition:width .5s cubic-bezier(.2,.9,.2,1)}
.bellstage .meter .need{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:#ff6a4a;box-shadow:0 0 10px #ff4a2a;border-radius:2px;transition:left .5s}
.bellstage .meter .need::after{content:'灰潮';position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:#ff9a7a;white-space:nowrap;letter-spacing:.1em}
.bellstage .meter .odds{margin-top:8px;font-size:.88em;color:#c9d7da}
.bellstage .odds b.good{color:#7fe0a0}.bellstage .odds b.mid{color:#f2cf6b}.bellstage .odds b.bad{color:#ff7a5a}
.bellstage .sect{color:#8fb3bd}
.bellstage .defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:10px}
.bellstage .dtile{position:relative;background:#081014dd;border:1px solid #1f3a44;border-radius:10px;padding:4px 2px 5px;text-align:center;transition:all .35s}
.bellstage .dtile .pf{width:46px;height:54px;margin:0 auto}
.bellstage .dtile .dn{font-size:10.5px;color:#d7e3e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.bellstage .dtile .dp{font-size:11px;font-weight:900;color:#7fe0a0;font-variant-numeric:tabular-nums}
.bellstage .dtile .dp.mid{color:#f2cf6b}.bellstage .dtile .dp.bad{color:#ff7a5a}
.bellstage .dtile.held{border-color:#f2cf6b;box-shadow:0 0 14px #f2cf6b55;transform:translateY(-2px)}
.bellstage .dtile.held .dp{color:#f2cf6b}
.bellstage .dtile.fell,.bellstage .dtile.dead{filter:grayscale(1) brightness(.55);border-color:#5a2018}
.bellstage .dtile.fell{animation:fell .5s both}
.bellstage .dtile.fell::after,.bellstage .dtile.dead::after{content:'';position:absolute;left:12%;right:12%;top:46%;height:2px;background:#ff4a2a;transform:rotate(-24deg);box-shadow:0 0 8px #ff4a2a}
.bellstage .dtile.fell .dp,.bellstage .dtile.dead .dp{color:#ff7a5a}
@keyframes fell{0%{transform:scale(1.08);filter:none}40%{filter:brightness(2) sepia(1) hue-rotate(-30deg)}100%{transform:none;filter:grayscale(1) brightness(.55)}}
.bellstage .acts{display:flex;flex-direction:column;gap:8px}
.bellstage .btn.tog{justify-content:flex-start;gap:10px;min-height:52px;background:#081014ee;border-color:#2a4a55;color:#e6eef0}
.bellstage .btn.tog small{display:block;font-weight:600;font-size:.74em;color:#8fa7ad;margin-top:2px}
.bellstage .btn.tog .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid #4fb8e0;display:flex;align-items:center;justify-content:center;color:#05090b;font-weight:900;flex:none}
.bellstage .btn.tog.on{border-color:#4fb8e0;box-shadow:0 0 14px #4fb8e044 inset}
.bellstage .btn.tog.on .ck{background:#8fe3ff}
.bellstage .wres{background:#05090bee;border-radius:12px;padding:6px 12px;border:1px solid #23414b}
.bellstage .wres.ok{border-color:#f2cf6b77}.bellstage .wres.no{border-color:#ff6a4a77}
.bellstage .wres .ln{color:#e1eaec;margin:6px 0}
.bellstage.clash .bbody{animation:clash .9s ease-out}
@keyframes clash{0%{transform:none}15%{transform:translate(-6px,3px)}30%{transform:translate(5px,-4px)}45%{transform:translate(-4px,2px)}60%{transform:translate(3px,-1px)}100%{transform:none}}
.bellstage.clash::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(80% 60% at 50% 45%,#cfe9f255,transparent 70%);animation:fadeOut 1s forwards}
@keyframes fadeOut{to{opacity:0}}
@media (min-width:860px){.bellstage .defs{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}}
/* 手冊 */

.hb summary::-webkit-details-marker{display:none}
.hb summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.hb details[open] summary::after{transform:rotate(-135deg)}
.hb summary .ic{color:var(--amber2)}
.hb p{margin:0 14px 10px;font-size:.92em;line-height:1.7;color:var(--paper2)}
.hb p b{color:var(--amber2)}
.hb .th{vertical-align:-2px}
.title .logo .sign{position:relative}
.title .logo .sign::before,.title .logo .sign::after{content:'';position:absolute;top:-60vh;width:2px;height:60vh;background:repeating-linear-gradient(180deg,#5a4630 0 6px,#2a2018 6px 9px);box-shadow:0 0 4px #000}
.title .logo .sign::before{left:18%}.title .logo .sign::after{right:18%}
.title .logo .sign h1{position:relative}
.title .logo .sign h1::after{content:'';position:absolute;inset:-10% -6%;background:linear-gradient(105deg,transparent 40%,#fff3 50%,transparent 60%);background-size:250% 100%;animation:sheen 7s ease-in-out 1.5s infinite;mix-blend-mode:overlay;pointer-events:none}
@keyframes sheen{0%{background-position:120% 0}35%,100%{background-position:-120% 0}}
.duebox{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin:10px 0;background:linear-gradient(180deg,#3a1510,#22100c);border:1px solid #7a2a1a;color:#ffd6c8;animation:lnIn .4s both}
.duebox .ic{width:1.4em;height:1.4em;color:#ff8a6a;margin-top:2px}
.duebox b{display:block;font-size:.95em}
.duebox span{display:block;font-size:.8em;color:#e8b5a5;margin-top:2px}
.duebox.ok{background:linear-gradient(180deg,#1c2418,#12180f);border-color:#3e5a32;color:#d8ecd0}
.duebox.ok .ic{color:var(--good)}.duebox.ok span{color:#a8c4a0}
/* 阿檀的提示卡 */
.tipcard{display:flex;gap:10px;align-items:center;border-color:#2f5a4a !important;background:linear-gradient(180deg,#16241f,#101a16) !important;position:relative;animation:tipIn .45s cubic-bezier(.2,.9,.2,1) both;padding-right:34px}
.tipcard .tpf{width:44px;height:52px;flex:none}
.tipcard b{color:#7fcfb0;font-size:.86em}
.tipcard .tipx{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:#ffffff0d;color:#7fcfb0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tipcard .tipx .ic{width:14px;height:14px}
.tipcard.gone{animation:tipOut .25s forwards}
@keyframes tipIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tipOut{to{opacity:0;transform:translateX(20px);height:0;margin:0;padding:0}}
.quote{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--amber);background:#ffffff06;border-radius:0 8px 8px 0;color:var(--paper2);font-family:var(--serif)}
.quote.dead{border-left-color:#7a1a12;color:#c9b8b0}
.shopsvg .smoke{animation:smoke 4s ease-in-out infinite}
@keyframes smoke{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.45;transform:translateY(-3px)}}

.flow>.fcard{margin-top:auto;margin-bottom:auto;flex:none}
.flow .ln.shown{animation:none !important;opacity:1 !important}
.ending .ln.shown{animation:none !important;opacity:1 !important}
