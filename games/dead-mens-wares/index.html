<script>
const CONTENT = {"fragments":{"ambient":[{"id":"amb_a001","cats":["weapon"],"regions":["bell"],"tags":[],"curse":null,"text":"天還沒亮，霧裡全是鐵鏽味。旁邊那小子說他十七，牙齒打顫，打得像在嗑瓜子。號角響了，他回頭問我：「大哥，殺人會不會很痛？」"},{"id":"amb_a002","cats":["armor"],"regions":["bell"],"tags":[],"curse":null,"text":"北原的馬蹄從頭頂踩過去。壓在我臉上的是伍長，昨天還踹過我屁股，現在還是溫的。我憋著氣數馬蹄，數到兩百就回家。數到一百九十七，有匹馬停了下來。"},{"id":"amb_a003","cats":["charm"],"regions":["bell","crater"],"tags":["foreign"],"curse":null,"text":"妹妹拿馬鬃替我編了這條繫繩，說北原的風會認得自家的馬。澐國的風一股鐵鏽味，認不得我。我躺在溝裡，想著回去要跟她說：南邊的草是紅的。"},{"id":"amb_a004","cats":["weapon","armor"],"regions":["bell"],"tags":[],"curse":"blood","text":"第九個。第十個。霧太濃，早分不清砍的是遊兵還是自己人，只覺得手心好暖，暖得不想鬆手。有人在喊我的名字，喊得好吵。第十一個。"},{"id":"amb_a005","cats":["weapon","charm"],"regions":["bell"],"tags":[],"curse":"whisper","text":"風裡有鐘聲，可是原上沒有鐘。點名的聲音一個個唸過去：孫大個、瘸腿李、小六子，全是埋在這片原上的弟兄。唸到我的時候，我還活著。我張嘴應了：「到。」"},{"id":"amb_a006","cats":["armor"],"regions":["town"],"tags":[],"curse":null,"text":"灰潮夜，牆外的霧爬上城頭，帶著河泥的腥味。裡頭有東西在敲牆，一下一下，像在找門。老兵叫我這個新兵蛋子別探頭。我探了。我只是想看看，裡頭有沒有我爹。"},{"id":"amb_a007","cats":["charm"],"regions":["town"],"tags":["silver"],"curse":null,"text":"「從星墜坑回來就贖你。」他把這枚戒指塞進我手裡當定錢。鴇母咬了一口，說是真銀。我天天倚著窗看渡口的船，看到第四十天就不看了。第四十一天，我開始接他的隊友。"},{"id":"amb_a008","cats":["weapon"],"regions":["town"],"tags":["iron"],"curse":null,"text":"回爐三次，淬了七遍火，刃口磨了三個晚上，好讓兒子砍得動遊兵。兒子沒回來，它回來了，在一個陌生拾骨人手裡，還被磨鈍了。我掏光積蓄把它買回來，一個子兒也沒還價。"},{"id":"amb_a009","cats":["weapon","armor","charm"],"regions":[],"tags":[],"curse":"blood","text":"打了三十年鹿，頭一回打人。人比鹿好打：鹿會跑，人會跪下來求饒，跪著就不動了。營裡說逃兵一顆頭賞五兩。到第六顆，我已經忘了問賞錢。"},{"id":"amb_a010","cats":["charm"],"regions":["bell"],"tags":["bone"],"curse":null,"text":"弟兄們還在睡，北原騎兵已經摸到營外。哨子一吹，全營會醒，我也會被找到。我把哨子含進嘴裡，舌頭嚐到骨頭的鹹味。我吹了，吹得比這輩子任何一聲都響。"},{"id":"amb_a011","cats":["armor"],"regions":["river"],"tags":[],"curse":null,"text":"毒霧從裂縫裡滲下來，甜得像爛桃子。她把女兒的臉按進自己懷裡，一下一下數她的呼吸。數到一百，懷裡不喘了。她還在數，數到自己嘴裡也泛起那股甜味。"},{"id":"amb_a012","cats":["charm"],"regions":["river"],"tags":[],"curse":"whisper","text":"娘在裂縫裡頭叫我，叫的是只有她會叫的小名，叫得好溫柔。可娘昨天就死了，是我拿破席子蓋的。那聲音又叫了一次。我想，萬一是我蓋錯了人呢。"},{"id":"amb_a013","cats":["weapon"],"regions":["river"],"tags":[],"curse":"blood","text":"半塊餅，他搶，我就捅。捅完了，黑裡每一聲腳步都像是來搶的。我抱著孩子縮在石縫裡，誰靠近就捅誰。第三個倒下時，水囊滾到我腳邊——他是來送水的。"},{"id":"amb_a014","cats":["weapon","armor"],"regions":["river"],"tags":[],"curse":null,"text":"這裡以前是河心，我在這兒撒了二十年網。河乾了，我改帶難民鑽地縫，一個人頭收半兩銀子。頂上的土塌下來那一刻，我竟有點想笑：撐了一輩子船，最後是被土淹死的。"},{"id":"amb_a015","cats":["armor"],"regions":["river"],"tags":[],"curse":null,"text":"下地窟第二天，屍菌從腳趾縫裡冒出來，一朵朵小白傘，軟軟的，像剛發好的麵。我拿刀刮，刮掉一層又長一層。隊友叫我省點力氣。我低頭一看，早刮到骨頭了，一點也不疼。"},{"id":"amb_a016","cats":["charm"],"regions":["river"],"tags":["noble"],"curse":null,"text":"地窟裡，一碗水換一件首飾。她把它含在舌頭底下，三天沒開口說話。那是娘臨終前塞給她的，拿去換水，她寧可渴死。後來她真的渴死了，坐得筆直，像還在自家花廳裡等人奉茶。"},{"id":"amb_a017","cats":["charm","armor"],"regions":["river"],"tags":[],"curse":null,"text":"關卡的兵要錢，誰都沒錢。我進了營帳，換十二個人過去，反正我本來就吃這行飯。到了地窟，他們分餅分水，就是沒人肯挨著我坐。今天有個小丫頭偷偷塞給我半塊餅：「姊姊，我娘沒在看。」"},{"id":"amb_a018","cats":["weapon"],"regions":["abbey"],"tags":[],"curse":null,"text":"山門外的燭火排成一條長河，少說一百來盞。院裡能動手的僧人，連我在內四十一個。師兄說，大概是來求鐘的。我握緊了手裡的傢伙：求鐘的人，不會在半夜來。"},{"id":"amb_a019","cats":["armor"],"regions":["abbey"],"tags":["monk"],"curse":null,"text":"鐘繩勒進掌心，血順著繩子往下淌。院子裡躺著十九個師兄弟，再敲一杵，他們就能走。樓梯上的腳步聲近了。我不回頭。回了頭，這一杵就敲不完了。"},{"id":"amb_a020","cats":["charm"],"regions":["abbey"],"tags":[],"curse":"whisper","text":"迴廊盡頭有人在唱經，唱錯了一個字。我做了三十年早課，聽不得人唱錯，提著燈走過去要糾正。走到盡頭，牆角那堆白骨下巴一開一合，唱的是我的聲音。"},{"id":"amb_a021","cats":["weapon"],"regions":["abbey"],"tags":[],"curse":"blood","text":"他們說這些和尚會咒人，要趁他們唱完之前殺乾淨。砍到第二十個，院子裡終於不唱了。那種安靜真好，好得讓人上癮。後來我回到家，聽見我娘在灶前哼歌，手就又癢了。"},{"id":"amb_a022","cats":["armor"],"regions":["abbey"],"tags":[],"curse":null,"text":"骸兵巡迴廊，腳步齊得像在操練，骨頭喀啦喀啦。我縮在石龕裡數心跳：八十下過一趟。數到第八十一下我就跑。我跑了。原來我的心，跳得比平常快一倍。"},{"id":"amb_a023","cats":["charm"],"regions":["abbey"],"tags":[],"curse":null,"text":"九天山路，我背著娘的骨灰罈上山求鐘。老和尚守著罈子，閉眼聽了一整夜，天亮才敲。鐘響三聲，他說：「她說完了，走了。」現在輪到我，我又爬上山來，山上已經沒有鐘。"},{"id":"amb_a024","cats":["weapon","armor"],"regions":[],"tags":[],"curse":"blood","text":"「對半分。」他蹲在火堆邊分東西，說了三遍對半分。我盯著他的後頸。搭檔七年，我頭一回注意到那裡有顆痣。砍下去的時候我想通了：一個人拿，就不用對半了。"},{"id":"amb_a025","cats":["weapon","charm"],"regions":["crater"],"tags":[],"curse":"whisper","text":"坑裡的晶石會唱歌，調子跟我娘哄我睡的那首一模一樣。第三天我也會唱了，一邊挖一邊跟著哼。今早漱口，吐出來的不是血，是一小塊亮晶晶的、還在哼歌的石頭。"},{"id":"amb_a026","cats":["armor"],"regions":["crater"],"tags":[],"curse":null,"text":"左臂從手肘以下全成了星晶，透亮，裡頭封著我的血管，一閃一閃。奇怪的是不疼，還暖，像小時候冬天把手伸進灶膛。弟兄們舉刀圍過來。我真想叫他們也摸摸看。"},{"id":"amb_a027","cats":["weapon","armor"],"regions":["crater"],"tags":["foreign"],"curse":null,"text":"大汗說，一塊星石換一百匹馬。我只想換一匹，騎回草原，娶隔壁帳篷那個愛笑的姑娘。袋子裡已經裝了三塊，沉得像三個人頭。晶獸從背後撲上來的時候，我還在算：三百匹。"},{"id":"amb_a028","cats":["weapon"],"regions":["crater"],"tags":[],"curse":"blood","text":"血一濺上去，晶石就唱得更響，響得我頭不疼了。所以我讓它們唱。先是晶獸，然後是野狗，然後是跟我一起下坑的老曹。他倒下前瞪著我，我只聽得見歌。"},{"id":"amb_a029","cats":["weapon","armor"],"regions":["crater"],"tags":[],"curse":null,"text":"那夜天上下起了火。伍長說快許願，我閉上眼許了：讓這仗打完。睜開眼，最亮的那一顆正對著我們營落下來。仗打完了，至少我的，打完了。"},{"id":"amb_a030","cats":["charm"],"regions":["capital"],"tags":["royal"],"curse":null,"text":"水漫進後殿的時候，娘娘還坐在妝台前，一件一件往身上戴首飾，戴歪了就摘下來重戴。我抱著她最疼的那隻白貓往樓上跑。跑到第三層，貓掙開我的手，游回去找她了。"},{"id":"amb_a031","cats":["weapon","armor","charm"],"regions":["capital"],"tags":[],"curse":null,"text":"三更天，水淹到膝蓋。四更天，淹到胸口。我還是一路敲著梆子喊：「天乾物燥，小心火燭。」喊完自己都想笑。可總得有人報時，不然這城裡的人，連自己是什麼時辰死的都不知道。"},{"id":"amb_a032","cats":["armor"],"regions":["capital"],"tags":["iron"],"curse":"whisper","text":"水底的鐘響了一聲，很悶，像有人在井底咳嗽。我趕緊用指甲在甲片內側刻自己的名字，刻完一橫一豎，鐘又響了。我盯著那兩道刮痕看了很久。這是誰的東西？"},{"id":"amb_a033","cats":["charm"],"regions":["capital"],"tags":[],"curse":null,"text":"那條船，只坐得下八個人。她扒著船舷喊少爺，少爺在船上哭著把臉別開。老爺的家丁舉起了槳。槳落下來之前，她還在想：少爺的鞋帶，出門前沒繫好。"},{"id":"amb_a034","cats":["weapon"],"regions":["capital"],"tags":[],"curse":"blood","text":"老爺抽了我十九年鞭子。水灌進府裡那晚，他抓著我的袖子喊救命。我本來只想推開他。推一下不夠，就砍一下；砍一下也不夠。一刀算一年，過了十九，我還停不下來。"},{"id":"amb_a035","cats":["weapon","armor","charm"],"regions":["capital"],"tags":[],"curse":"whisper","text":"我替宮裡調了三十年音，耳朵比命還靈。水底那口鐘一響，我就聽出來了：它在唸一個人的名字，拖得很長。我拿炭條記在袖口上，記完一看，是個陌生的名字。隊友說，那是我。"},{"id":"amb_a036","cats":["charm"],"regions":["town"],"tags":[],"curse":"whisper","text":"他的東西我一直貼身戴著。每晚，他都在我耳邊講同一件事：枯河，第三條岔路，左手邊，一塊壓著紅布的石頭底下。我跟骨棚的人說了七遍，沒人肯去。今晚，我自己去。"},{"id":"amb_a037","cats":["weapon","armor","kit"],"regions":[],"tags":[],"curse":null,"text":"出發前一晚，我跟鋪子掌櫃殺價殺了半個時辰，他最後少算我二兩。我樂了一路，回去還跟婆娘炫耀。現在吊在崖縫裡，我總算想通了：那二兩，是他算準了我不會回去退貨。"},{"id":"amb_a038","cats":["kit"],"regions":["town"],"tags":["iron"],"curse":null,"text":"兒子出城那天說，看見燈就知道到家了。我每晚把它掛在窗口，燈油錢比飯錢還多。第三年冬天，我咳得爬不起來，躺在床上看著窗口黑著，心想：他今晚要是回來，會不會走過頭。"},{"id":"amb_a039","cats":["kit"],"regions":["river","town"],"tags":["paper"],"curse":null,"text":"圖上每個記號都是我畫的：圈是水，叉是塌方，三角是能睡的地方。這幾天我添了一種新的，一個小黑點，記的是哪裡的人已經死透、還能吃。我畫得很仔細，給後頭的人留著。"},{"id":"amb_a040","cats":["weapon","armor","charm","kit"],"regions":["town"],"tags":[],"curse":null,"text":"渡過去一個人，我就在槳上刻一道；渡回來一個，就磨掉一道。二十年，槳上密得像搓衣板，磨平的不到三成。今晚我又刻了一道。那小子才十六，跟我借火的時候，手一直在抖。"},{"id":"amb_a041","cats":["charm","curio"],"regions":["town"],"tags":[],"curse":null,"text":"改嫁那天，新郎官身上戴著的，是我前頭那口子出門時戴的東西。他得意地說，是在當鋪裡撿的便宜。我笑著喝了交杯酒。那一夜，我睜著眼躺到天亮。"},{"id":"amb_a042","cats":["weapon"],"regions":["town"],"tags":[],"curse":"blood","text":"回城第三天了，手還是癢，看什麼都想砍一刀。骨棚的老王多看了我一眼，我就想好了他的脖子該從哪邊下刀。我把傢伙壓在枕頭底下睡，半夜醒來，它已經在我手裡了。"},{"id":"amb_a043","cats":["armor"],"regions":["town"],"tags":["cloth"],"curse":null,"text":"這件是從死人身上扒的，大得能裝下兩個我，晚上裹著睡，風就鑽不進來。巷口賣餅的說我穿起來像隻縮頭烏龜。我不在乎，烏龜活得久。今晚雪下得好大，我縮得很緊，很緊。"},{"id":"amb_a044","cats":["weapon","armor","charm","kit","curio","contra"],"regions":[],"tags":[],"curse":"any","text":"明知道這東西不乾淨，拿到手那晚就做了一夜噩夢。可它值三個月的米錢。我用三層布把它包起來，塞在離床最遠的牆角。孩子們吃飽的那幾天，我還笑自己膽小。"},{"id":"amb_a045","cats":["weapon","armor","charm"],"regions":[],"tags":[],"curse":"any","text":"燭火一靠近它就變成綠的，燒得嗤嗤響，像在冷笑。執事說，拿去爐裡燒了。我捧著它走到爐邊，忽然捨不得。我把它藏進袖子裡，跟自己說：只是想再多看一天。"},{"id":"amb_a046","cats":["charm","curio","kit"],"regions":[],"tags":[],"curse":"any","text":"夜市那個攤子只收我半兩，攤主笑得滿臉褶子，發誓這東西乾淨得很。我還以為撿到了寶。現在躺在這裡，越想越氣：半兩，他連騙我都懶得多騙一點。"},{"id":"amb_a047","cats":["weapon","armor"],"regions":["bell"],"tags":[],"curse":"whisper","text":"我殺過的人，夜裡一個一個來跟我道歉，客客氣氣的：「對不住，擋了你的路。」「對不住，血濺到你身上。」我寧可他們罵我。罵我，我還能罵回去。"},{"id":"amb_a048","cats":["charm","curio","contra"],"regions":[],"tags":[],"curse":"whisper","text":"老伴走了三年，這陣子又在我耳邊唸叨：衣裳穿少了、酒喝多了、門沒閂。兒子要把這東西拿去賣，我死命攥著。昨晚她說，河邊風大，叫我過去替她披件衣裳。"},{"id":"amb_a049","cats":["weapon","armor","charm","curio"],"regions":["bell","crater"],"tags":[],"curse":"blood","text":"殺第一個人，我吐了一整夜。第二個，手抖了三天。到第五個，我開始挑——專挑那些眼睛還會求人的。後來回家，我娘盯著我看了好久，問我是誰家的孩子。"},{"id":"amb_a050","cats":["charm","curio","kit","contra"],"regions":[],"tags":[],"curse":"blood","text":"教了二十年書，連雞都不敢殺。撿到這東西的第三天，我拿石頭砸爛了一個爬過來的死人，砸完了還在砸。隊友來拉我，我回頭看他，看的是他的太陽穴。"},{"id":"amb_a051","cats":["weapon","armor","kit"],"regions":[],"tags":[],"curse":"whisper","text":"在軍裡點了七年雷火，耳朵早就炸聾了。拿起它那天，我忽然又聽得見了：雨聲、狗叫、婆娘在灶邊罵我窩囊。高興完了才想起來，婆娘十年前就跟人跑了。灶邊那個聲音還在罵，越罵越近。"},{"id":"amb_a052","cats":["weapon","armor","curio"],"regions":["abbey"],"tags":["church"],"curse":null,"text":"教裡說，修道院的骸兵是邪魔，砸碎一具就是一樁功德。第七具倒下時，骨頭手掌慢慢抬起來，落在我頭頂上，輕輕拍了兩下。小時候，山上的老和尚也是這樣摸我的頭。"},{"id":"amb_a053","cats":["weapon","armor","charm","curio"],"regions":["abbey"],"tags":[],"curse":null,"text":"白骨在迴廊裡自己拼起來，拼得亂七八糟：老和尚的頭配年輕武僧的腿，走起來一高一低，照樣巡夜。我的腿斷了，靠著柱子等。也好，我這把骨頭，總能替它們湊一雙等長的腿。"},{"id":"amb_a054","cats":["kit"],"regions":["crater"],"tags":["paper"],"curse":null,"text":"頭一天：坑裡的晶石會出聲。第三天：它們在學我們說話。第五天：老周在坑底喊我，可他明明睡在我旁邊。第六天：我把老周叫醒，他睜開眼，用我的聲音說：「該你下去了。」"},{"id":"amb_a055","cats":["weapon","armor","charm","curio"],"regions":["crater"],"tags":[],"curse":null,"text":"她的頭髮先亮起來，像落了一層霜。然後是睫毛，然後是手指。她說不疼，叫我快走。我沒走，握著她的手坐了一夜，聽她一點一點變成歌。天亮的時候，我的手也亮了。"},{"id":"amb_a056","cats":["charm","curio"],"regions":["capital"],"tags":["noble"],"curse":null,"text":"三箱金子先上船，爹說人可以少，箱子不能少。船沉的時候，爹抱著箱子沉得最快。我抓著一塊門板漂了一夜，門板上還有一隻老鼠。我跟牠說好了：誰先死，誰給對方吃。"},{"id":"amb_a057","cats":["weapon","armor","charm","curio"],"regions":["capital"],"tags":[],"curse":null,"text":"黑水底下摸第三趟，指尖碰到一樣沉甸甸的東西，我樂得差點嗆水。這時水底的鐘響了一聲。我忽然想不起來，哪邊是上面。手裡的東西很沉，我捨不得放。"},{"id":"amb_a058","cats":["weapon","charm","kit"],"regions":["bell"],"tags":[],"curse":null,"text":"我死的時候攥著它，攥了好些年。今天有個拾骨人來拔，一根一根掰我的指頭，掰一根罵一句。別掰了。這是我爹的，我答應過他，要帶回去還的。"},{"id":"amb_a059","cats":["armor","charm","kit","curio"],"regions":["river"],"tags":[],"curse":null,"text":"躲貓貓我最會躲。哥哥數到一百，我鑽進最窄的那條石縫。外頭好多人在跑、在喊，後來就很安靜。哥哥一直沒來找我。我不出去，出去就輸了。我最會躲了。"},{"id":"amb_a060","cats":["weapon","armor","charm","kit"],"regions":["town"],"tags":[],"curse":null,"text":"那場仗，我在酒館裡講了一百遍。每回講到第三句，就有人喊：「又來了。」今晚雨大，我倒在溝邊，嘴裡還在講。真好，這回總算沒人打斷我。"},{"id":"amb_b001","cats":["curio"],"regions":["town"],"tags":["letter"],"curse":null,"text":"「借銀五兩，月息三分。」他不識字，叫兒子念給他聽。兒子問：「爹，月息是什麼？」「就是連月亮都要跟你收的錢。」那年冬天，他把自己賣進了骨棚。"},{"id":"amb_b002","cats":["curio"],"regions":["town"],"tags":["child"],"curse":null,"text":"她摸摸小花的布額頭，燙得嚇人。被子全給小花蓋，自己縮在床角發抖。娘說過，生病要捂出汗才會好。娘去當東西了，很快就回來。小花，妳先睡。"},{"id":"amb_b003","cats":["curio"],"regions":["town"],"tags":["gold"],"curse":null,"text":"「三十兩。」櫃台後的人說。她從髮髻上拔下它，扯斷了一撮頭髮。這是她娘給的嫁妝。三十兩夠買一口薄棺，女兒躺得下。丈夫那一口，她得另外想辦法。"},{"id":"amb_b004","cats":["curio"],"regions":["town"],"tags":["letter"],"curse":null,"text":"學堂關了，他在骨棚門口替人寫家書，一封五文，十封有九封要寫「一切安好，勿念」。明天輪到他自己下地窟。他鋪開紙，寫好了那一句，才想起家裡早沒人了。"},{"id":"amb_b005","cats":["curio"],"regions":["town"],"tags":[],"curse":null,"text":"「差七兩。」她把銅錢一枚枚疊在妝台上，疊成一座小塔。樓下有人吹口哨，喊她的花名。她把塔推倒，重數一遍，還是差七兩。贖身的價錢，今早又漲了。"},{"id":"amb_b006","cats":["curio"],"regions":["town"],"tags":[],"curse":null,"text":"四十年的帳，從沒差過一文。今晚差一文。他翻遍帳本，蹲到桌底下找，膝蓋喀的一聲，就起不來了。趴在地上，他忽然想起：早上穿鞋時，有什麼硌了一下腳。"},{"id":"amb_b007","cats":["kit"],"regions":["town"],"tags":["iron"],"curse":null,"text":"灰潮夜，他還是提著燈出門打更。巷口站著一個人，沒有臉，穿的是他兒子下葬那天的衣裳。他把燈舉高一點，讓那孩子看清路，嗓子照常喊：「天乾物燥，小心火燭。」"},{"id":"amb_b008","cats":["curio"],"regions":["town"],"tags":[],"curse":null,"text":"「哭啊。」她倒提著那團小東西，拍第三下，第五下。接了一輩子的生，一百三十個孩子，個個哭得震天響。第一百三十一個是她親外孫，屋裡靜得只聽見雨。"},{"id":"amb_b009","cats":["curio"],"regions":["town"],"tags":[],"curse":null,"text":"雪落進破碗裡，他一粒粒挑出來吃。對街麵攤收了，老闆娘把剩湯往溝裡一潑，白氣直冒，香得要命。他想爬過去聞一口，腿不聽話了。那就在這兒聞吧，風往這邊吹。"},{"id":"amb_b010","cats":["curio"],"regions":["bell"],"tags":["letter"],"curse":null,"text":"營火噼啪響。「再加一句。」他盯著文書的筆尖，「叫她別改嫁。」筆尖停了。他搓著凍裂的手想了很久：「劃掉。叫她挑個有手藝的，別挑當兵的。」"},{"id":"amb_b011","cats":["kit"],"regions":["bell"],"tags":["paper"],"curse":null,"text":"圖上回家的路有九條。每聽說哪條路上有遊兵，他就用炭條塗黑一條。第三夜，整張圖黑得像鍋底。他盯了很久，把圖翻過來，在背面畫了一條新的。"},{"id":"amb_b012","cats":["curio"],"regions":["bell"],"tags":["bone"],"curse":null,"text":"笛子是老伍長的腿骨做的。他生前交代：「死了別埋，埋了被狗刨。做成笛子，夜裡吹給我聽，我就知道你們還活著。」今晚我吹了很久。營裡沒有別人了。"},{"id":"amb_b013","cats":["curio"],"regions":["bell"],"tags":["bronze"],"curse":null,"text":"這個月的餉一咬一個牙印，摻了鉛。他咬著那枚錢往前衝，不為別的，嘴裡總得咬點什麼，才不會叫出聲。號角響第二遍的時候，錢掉了。他叫得很大聲。"},{"id":"amb_b014","cats":["curio","kit"],"regions":["bell"],"tags":[],"curse":null,"text":"收屍收到第三天，風裡傳來一聲鐘響。滿地的死人同時坐起來，朝北望。他的鏟子掉在腳背上，不覺得痛。鐘聲散了，他們又紛紛躺回去，像是聽錯了。"},{"id":"amb_b015","cats":["curio"],"regions":["bell"],"tags":[],"curse":null,"text":"天亮發出去三百二十個碗，天黑收回來九十一個。伙夫蹲在溪邊慢慢洗。鍋裡剩的粥，他一勺一勺自己喝，喝到吐了接著喝。不能倒，那是二百二十九個人的份。"},{"id":"amb_b016","cats":["kit"],"regions":["river"],"tags":["iron"],"curse":null,"text":"燈油只夠一夜。她跟孩子說：「燈滅了，就是外頭天亮了。」小的信了，趴著數火苗。大的沒吭聲，往她懷裡鑽。她把燈芯撥低一點，再低一點，想讓天晚一點亮。"},{"id":"amb_b017","cats":["curio"],"regions":["river"],"tags":["child"],"curse":null,"text":"洞壁長著會發光的白菇，一朵朵像小燈。她摘了三朵擺在布偶面前：「吃飯了。」布偶不吃。她肚子咕咕叫，想了想，替布偶吃了一朵。苦苦的，甜甜的，好睏。"},{"id":"amb_b018","cats":["curio"],"regions":["river"],"tags":["bronze"],"curse":null,"text":"洞口只漏進指甲大的一點天光。她用它把光折進來，晃到弟弟臉上：「你看，太陽。」弟弟笑了，伸手去抓。她手痠了也不敢停。一停，弟弟就不笑了。"},{"id":"amb_b019","cats":["curio"],"regions":["river"],"tags":["jade"],"curse":null,"text":"搜身的人捏開她的下巴。她把它壓在舌頭底下，咬緊牙，任他們扯開衣襟、拔掉鞋子。他們罵罵咧咧走了。她不敢吐出來，怕還有下一批。後來，就一直含著了。"},{"id":"amb_b020","cats":["curio","kit"],"regions":["abbey"],"tags":[],"curse":null,"text":"他躲在經架後面，看骸兵一具具走出僧房，在迴廊排成兩列，像在等早課。鐘樓是空的。它們站到天亮，才散回各自的屋子。他忽然很想替它們敲一下鐘。"},{"id":"amb_b021","cats":["curio"],"regions":["abbey"],"tags":["bronze"],"curse":null,"text":"晚課的小鈴要搖一百零八下。搖到第六十一下，山門被撞開了。他沒有停。停在六十一，今天走的那些人，就只走到半路。六十二。六十三。腳步聲上了台階。"},{"id":"amb_b022","cats":["contra"],"regions":["abbey"],"tags":["bone"],"curse":null,"text":"他把那顆僧人的頭骨刷乾淨，照書上鑽了七個孔。夜裡風一吹，孔裡有聲音，是早課的調子。他用蠟把孔逐一封死。封到最後一個，手停了。那調子他小時候聽過。"},{"id":"amb_b023","cats":["curio"],"regions":["abbey"],"tags":["wood"],"curse":null,"text":"修士舉著聖像走進迴廊，高聲唸淨念的經文。骸兵停下來，歪著頭聽。他唸完最後一句，它們互相看了看，搖搖頭，又朝他走過來。"},{"id":"amb_b024","cats":["kit"],"regions":["crater"],"tags":["paper"],"curse":null,"text":"圖邊寫著一行小字：「晶在唱歌，別聽。」隔天，同一個人的筆跡：「其實挺好聽。」第三天那行不是寫的，是用晶片一刀一刀刻上去的：「再待一天。」"},{"id":"amb_b025","cats":["curio"],"regions":["crater"],"tags":["foreign"],"curse":null,"text":"北原商人用家鄉話數駱駝，一、二、三……數到第九隻，牠背上長出了一叢晶，夜裡發著藍光，安安靜靜嚼著草。他沒聲張，把牠牽到隊伍最後面。賣得掉的。"},{"id":"amb_b026","cats":["curio"],"regions":["crater"],"tags":["jade"],"curse":null,"text":"「請准全隊撤出坑外。」文書往上遞了七次，七次都蓋著這方印，七次都沒有回音。第八次，他把印往自己額頭上一蓋，轉身對全隊說：「准了。」"},{"id":"amb_b027","cats":["curio","kit"],"regions":["crater"],"tags":[],"curse":null,"text":"第十一天，我終於聽懂了晶在唱什麼。是娘哄我睡覺的那首，連走調的地方都一樣。我在晶柱底下躺好，把衣裳拉到下巴，像小時候那樣，等她唱完最後一句。"},{"id":"amb_b028","cats":["curio"],"regions":["capital"],"tags":["gold"],"curse":null,"text":"主子逃的時候沒帶上它。她替主子梳了十年頭，從沒好好梳過自己的。水漫進宮門那夜，她對著鏡子，第一次把它插進自己髻裡。水聲到了廊下，她把背挺直，像個主子。"},{"id":"amb_b029","cats":["curio"],"regions":["capital"],"tags":["bronze"],"curse":null,"text":"宮裡亂成一團，他抱起一個宮鈴就跑。鈴一路叮噹響，捂都捂不住，他索性把整隻手塞進鈴口。守門的兵瞥了他一眼，沒攔。兵的懷裡也鼓鼓的。"},{"id":"amb_b030","cats":["kit"],"regions":["capital"],"tags":[],"curse":null,"text":"水往上漲的時候，她用繩子把一家五口攔腰綁在一起，打死結。這樣誰也不會被沖走，誰也不會走散。她勒緊最後一個結，對孩子們笑：「好了，不怕了。」繩子很牢。"},{"id":"amb_b031","cats":["curio","kit"],"regions":["capital"],"tags":[],"curse":null,"text":"水底的鐘響了一聲。我趕緊拔刀，在牆上刻自己的名字，怕忘了。第一個字刻好了。第二個字刻到一半，我停下來，看著牆上的字，想不起這是誰的名字。"},{"id":"amb_b032","cats":["contra"],"regions":["river"],"tags":["bone"],"curse":null,"text":"藥早用光了，只剩半袋白灰。地窟裡就他一個當過軍醫的，每天給快死的人一撮：「睡吧，睡醒就到家了。」袋子見底那天，他抖了抖袋口，最後一撮留給自己。"},{"id":"amb_b033","cats":["contra"],"regions":["town"],"tags":["military"],"curse":null,"text":"他在守碑衛的火藥庫扛了三年貨，每天在指甲縫裡藏一撮，攢成一小罐。女兒出嫁那夜，他爬上屋頂點了一朵，紅的，比月亮還大。整條西街都抬起頭。他知道明天會有人來。"},{"id":"amb_b034","cats":["contra"],"regions":["town"],"tags":["paper"],"curse":null,"text":"這本書，被搜到就要進碑樓。書末抄著一份名單，全是當年被砍頭的人。他縮在被窩裡，就著半截蠟燭一行行找，找到了他爹。門外有人拍門，他撕下那一頁塞進嘴裡，嚼得很慢。"},{"id":"amb_b035","cats":["contra"],"regions":["town"],"tags":["bone"],"curse":null,"text":"夜市的貨，白灰是磨碎的骨頭，念顱是整顆的骨頭。他做這行十年，從不問骨頭是誰的。今晚收貨，他在一顆頭骨的牙床上，摸到了他爹那顆金牙。"},{"id":"amb_b036","cats":["contra"],"regions":["crater","abbey"],"tags":["bone"],"curse":null,"text":"他對著念顱喊兒子的小名，喊了三夜。第三夜，頭骨裡有人應了一聲：「爹。」他又哭又笑，再喊一遍。那聲音又應了，這回是個老頭的嗓子，叫的也是「爹」。"},{"id":"amb_b037","cats":["contra"],"regions":["bell","crater"],"tags":["military"],"curse":null,"text":"「引信三寸，夠你跑二十步。」教他的老工兵是這麼說的。他點了火，數著步子跑。數到第十九步，他想起老工兵少了一條腿，一直以為是生下來就沒有的。"},{"id":"amb_b038","cats":["contra"],"regions":["abbey","capital"],"tags":["paper"],"curse":null,"text":"都說讀完這本書的人，活不過那一夜。他讀得很慢，一天只讀一行，讀了二十二年。翻到最後一頁那晚，他得意地笑出聲，躺下就再沒起來。大夫說，是老死的。"},{"id":"amb_b039","cats":[],"regions":[],"tags":[],"curse":"any","text":"他們割了他的舌頭，他就把話咬在牙齒後面，一個字一個字地咬，咬得滿嘴是血。人死了，牙還咬著，誰也撬不開。那些話一直在裡面，等一個肯聽的人。"},{"id":"amb_b040","cats":[],"regions":[],"tags":[],"curse":"any","text":"出門前我在牆上寫了三條：一、還張屠三錢。二、跟阿姐說對不起。三、活著回來。第三條寫了又劃，劃了又寫。現在我躺在這裡，只想把第二條挪到最前面。"},{"id":"amb_b041","cats":["curio"],"regions":["town"],"tags":["letter"],"curse":"ruin","text":"她只寫了一行：「隔壁的男人當過王軍。」碑樓的人當夜就來，一家五口全帶走了。她租下那間鋪面。頭一個月，丈夫摔斷了腿；第二個月，女兒燒啞了嗓子。第三個月，輪到她了。"},{"id":"amb_b042","cats":["curio"],"regions":["town"],"tags":[],"curse":"ruin","text":"做媒三十年，她撮合了兩百一十對。打仗的打仗，淹死的淹死，跟人跑的跑，沒有一對白頭到老。嚥氣前她想通了：下輩子改行賣棺材，那才是穩當生意。"},{"id":"amb_b043","cats":["curio"],"regions":["river"],"tags":["love"],"curse":"ruin","text":"船擱在乾掉的河床上，第九天了。他攥著那女人的定情物，想起推她下船時她說的話：「拿著它，你這輩子別想靠岸。」岸就在三丈外，中間的爛泥會吃人。"},{"id":"amb_b044","cats":["weapon","charm","curio","kit","contra"],"regions":["bell","capital"],"tags":[],"curse":"ruin","text":"那隻手攥得死緊，他掰斷兩根指頭才拿到。骨棚的老規矩：死人攥著的，不拿。回程繩斷了，燈滅了，水囊破了，同伴走散了。他想回去還，那隻手已經找不到了。"},{"id":"amb_b045","cats":[],"regions":["crater"],"tags":[],"curse":"ruin","text":"這東西換過六個主人，個個死在坑裡。他把它帶在身上，跟隊友咧嘴笑：「我命硬，剋得住。」第二天坑頂崩下一塊晶，一整隊人，只砸中他那張還在笑的嘴。"},{"id":"amb_b046","cats":["curio"],"regions":["capital"],"tags":[],"curse":"ruin","text":"城裡餓死人那個月，她叫人把糧倉門再封一層。外頭的人起先是求，後來改成咒，一句句從門縫底下塞進來。黑水灌進來那夜，她把它揣在懷裡，爬上米堆。米吸了水，一直往下陷。"},{"id":"amb_b047","cats":["curio","charm"],"regions":["bell"],"tags":[],"curse":"ruin","text":"戰俘把它和一封信塞給他：「替我送回家。」他點頭收下，轉身把信塞進火堆取暖。那年冬天，營裡的人一個接一個凍死，只有他活著，越活越冷，冷得骨頭縫裡結霜。"},{"id":"amb_b048","cats":["kit"],"regions":["town"],"tags":[],"curse":"ruin","text":"藥鋪學徒在金創藥裡摻三成灶灰，省下的錢買了雙新鞋。後來骨棚抬回來的人，傷口都發黑。今天他自己被刀劃了一道，抹上自家的藥，聞到那股灶灰味，笑得停不下來。"},{"id":"amb_b049","cats":["curio","charm","contra"],"regions":["abbey"],"tags":[],"curse":"ruin","text":"那夜他從一個老僧手裡奪過它。老僧沒掙扎，只看著他說：「拿去吧，它會記得你。」同營十二個弟兄，不到一年死了十一個，一個比一個死得冤。剩下那個，就是他。"},{"id":"amb_b050","cats":[],"regions":["crater"],"tags":[],"curse":"ruin","text":"晶縫底下的人在叫他。繩子勒進掌心，他也一寸寸往下滑。他摸出刀，割了。底下的人沒有叫。從那天起，他用的繩子總會斷，換新的斷，換雙股的也斷。今天換了鐵鍊。"},{"id":"amb_b051","cats":["curio"],"regions":["town"],"tags":[],"curse":"cling","text":"當票上寫著三個月。我把娘子的陪嫁當在西街，換了下地窟的盤纏，跟她說，九十天，一定贖回來。洞壁上的指甲印，我劃到第八十七道了。還有三天，得趕回去。"},{"id":"amb_b052","cats":["curio"],"regions":["river"],"tags":["child"],"curse":"cling","text":"妹妹把布偶借他抱一晚，說好明天要還。明天，妹妹沒醒。他把布偶綁在胸口，打了三個死結。洞裡有人搶吃的、搶衣裳，他誰也不理，只護著胸口。答應過要還的。"},{"id":"amb_b053","cats":[],"regions":["bell"],"tags":[],"curse":"cling","text":"「帶回去。」第一個人把它交給第二個人，第二個人死前交給第三個。傳到他手上，已經轉了七手，每一手都說同一句話。他攥著它爬出壕溝，替八個人說：「帶回去。」"},{"id":"amb_b054","cats":["kit"],"regions":["river","town"],"tags":["iron"],"curse":"cling","text":"他是瞎子，用不著燈，燈是提給後面的人看的。風一吹，燈滅了，地窟裡哭成一團，只有他走得穩。他把九個人帶出洞口，一個個摸頭頂數，少一個。他轉身，又摸了回去。"},{"id":"amb_b055","cats":["curio","charm","weapon"],"regions":["abbey"],"tags":[],"curse":"cling","text":"院主交代過，庫裡的東西，一件都不能少。來搶的人扯了三下，管庫的師父沒鬆手。刀落下來，他還是沒鬆手。他們掰不開，乾脆連那隻手一起帶走。那隻手到今天還沒鬆開。"},{"id":"amb_b056","cats":[],"regions":["bell"],"tags":[],"curse":"cling","text":"她每天天不亮就上原，把死人一個個翻過來看臉。後來臉都爛了，認不出，她就看手：他左手的小指少一截。三年了，她翻過的手比整個鴉渡的人還多。明天，往北再走一里。"},{"id":"amb_b057","cats":["curio"],"regions":["capital"],"tags":[],"curse":"cling","text":"逃出城那天，他鎖上門，帶走了家裡最值錢的這一件，發誓有朝一日親手放回原處。十年後他回來了。門還在，在三丈深的黑水底下。他把它揣緊，深吸一口氣，往下潛。"},{"id":"amb_b058","cats":["contra"],"regions":["river"],"tags":["bone"],"curse":"cling","text":"戒不掉，他想了個法子：揣著那一小包下地窟，埋進最深的洞底，這回總夠遠了。往上爬到一半，他停住了，聽見自己又在往回爬，指甲刮著石頭，一下，一下。"},{"id":"amb_b059","cats":[],"regions":["town"],"tags":[],"curse":"cling","text":"討債的規矩，欠一文追到天涯，欠一錢追到地底下。我被馬車撞倒在西街，血流進水溝，最後想的是：渡口的張麻子，還欠我四錢。"},{"id":"amb_b060","cats":["curio"],"regions":["town"],"tags":[],"curse":"cling","text":"天沒亮，她把孩子放在白燭堂的台階上，把它塞進襁褓：「認得這個，就認得你。」她走出十步，回頭；再走十步，又回頭。這輩子剩下的路，她都是這麼走的。"}],"chains":[{"id":"ch_bellboy","title":"鐘童","teaser":"院裡每天第一聲鐘，總是早了半拍。","frags":[{"id":"ch_bellboy_1","cats":["charm"],"regions":["abbey"],"tags":[],"text":"天還沒亮，鐘繩結著霜，凍得指頭發疼。鐘祀院的晨鐘歸我敲。住持說要默數到三再拉，我老是忍不住，早了半拍。他在廊下咳嗽：「急什麼？死人又不趕路。」我吐吐舌頭。鐘一響，僧房的窗跟著亮了，像是我把大家一個一個叫醒的。"},{"id":"ch_bellboy_2","cats":["curio"],"regions":["abbey"],"tags":[],"text":"石階上來了一條燭火，彎彎曲曲，像一條河倒著往上流。師兄們擠在門口看，說是穿白袍的客人，好漂亮。只有武僧師兄沒看。他一把將我塞進後院那口等著回爐的裂鐘底下，鐘口墊著三塊磚，留一道縫。「聽見晨鐘再出來。誰叫你都別應。」說完，他轉身去抱最小的師妹。"},{"id":"ch_bellboy_3","cats":["armor"],"regions":["abbey"],"tags":[],"text":"縫裡只看得見膝蓋以下。白袍的下襬成排走過去，邊走邊滴蠟，石板上落滿了白點。前院傳來師兄們唱偈：「放下手裡那盞燈，放下心上那個名——」唱的人越來越少，聲音一個一個斷，像有人拿指頭去掐燭芯。最後只剩住持在咳。後來，連咳嗽也沒了。"},{"id":"ch_bellboy_4","cats":["weapon"],"regions":["abbey"],"tags":[],"text":"一雙草鞋從縫前跑過去，上頭晃著兩隻小腳，往後門去。不多久，草鞋自己跑回來，停在鐘前，喘得很重。接著是刀聲。師兄整個人撞上鐘，鐘嗡地響了一聲，震得我牙齒發麻。他順著鐘坐下去，把縫堵死了。熱熱的東西流到我膝蓋上。那不是晨鐘。我分得出來。"},{"id":"ch_bellboy_5","cats":["contra"],"regions":["abbey","town"],"tags":[],"text":"天亮了三次。縫被師兄的背堵著，只透進一線白。晨鐘一直沒響。我不在，總該有別的師兄去敲吧？八成睡過頭了，住持又要罵人。我舔鐘壁上的水氣，苦苦的，一股銅錢味。跟師兄說話，他不理我，睡得好沉。我小聲數數，數到一千，再從一開始。"}],"finale":"白袍進院那一夜，護院的武僧只來得及藏好兩個孩子：最小的師妹，他抱去後門，交給院裡的雜役；敲晨鐘的小杵，他塞進裂鐘底下。他原本打算回來，親手替小杵敲一次晨鐘——那就是可以出來的暗號。他回來了，一身刀傷，背靠著鐘坐下，用自己替孩子堵住那道縫。第三夜，那個雜役獨自摸回院裡，一間一間喊名字，在裂鐘外頭喊了三聲「小杵」。鐘底下的孩子咬著袖子，一聲也沒應——晨鐘還沒響。他沒能等到。滿院子裡，能敲晨鐘的，只剩他一個。"},{"id":"ch_watergate","title":"水門","teaser":"一個老閘頭，和他守了三十年的門。","frags":[{"id":"ch_watergate_1","cats":["curio"],"regions":["capital"],"tags":[],"text":"那年輕軍官隔幾天就來一趟，提一壺溫過的酒，蹲在絞盤邊問東問西：閘有多重，要轉幾圈，哪根銷子一拔，閘就一口氣落到底。我一樣一樣教他。打仗這兩年，城裡沒人想聽老頭子囉嗦，只有他肯聽。他還幫我給絞盤上油，手很穩。"},{"id":"ch_watergate_2","cats":["charm"],"regions":["capital","river"],"tags":[],"text":"圍城以後，王都水門的閘柵每天早上都卡著東西。我拿竹鉤挨個撥開：兵，婦人，有一回是個孩子，手裡還攥著一隻撥浪鼓。夜裡鐘樓的鐘一響，河面上那些臉就鬆開了，像總算睡著。我這輩子沒信過什麼，就信那幾口鐘。"},{"id":"ch_watergate_3","cats":["armor"],"regions":["capital"],"tags":[],"text":"最後那夜，雨大得像要把城淹了。他來了，沒帶酒，甲上淌著水，只說一個字：「開。」我說夜裡不開閘，這是王令。他沒跟我爭，自己走到絞盤前，雙手抓住橫木，推了第一圈。「老伯，開了，就不會再死人了。」聲音很穩。手在抖。"},{"id":"ch_watergate_4","cats":["weapon"],"regions":["capital"],"tags":[],"text":"絞盤每轉一圈，棘爪就咔三聲。這聲音我聽了三十年，閉著眼也數得清。數到二十，閘底下灌進一股冷風；數到四十，看見外頭黑水上擠滿了船，槳上纏著布，一點聲響也沒有。數到七十二，閘到頂了。船頭的火把，一支一支點起來。"},{"id":"ch_watergate_5","cats":["curio"],"regions":["river"],"tags":[],"text":"後半夜，鐘樓的鐘一口一口停了。每停一口，城就往下沉一截。黑水從閘口倒灌進來，漫過膝蓋，漫過絞盤，漫到胸口。我沒走。守了三十年的門，走去哪？只是往後再沒有鐘了。我死了，誰來送我？"}],"finale":"閘柱上有根銷子，一拔，千斤閘一口氣落到底。這是老閘頭三十年的看家本事，也是他親口教給那年輕人的。船一艘艘鑽進閘口時，他撲過去拔銷，銷子紋絲不動——縫裡塞著一塊削得服服貼貼的木楔，正是那壺溫酒的壺塞，是年輕人說要幫他上油的那一晚塞進去的。從第一壺酒起，那人就在等這一夜。塞木楔的時候，他的手很穩；拉閘的時候，他的手在抖。黑水漫上來，老閘頭手裡攥著那塊木楔，上頭還留著一點酒香。"},{"id":"ch_ledger","title":"帳房","teaser":"三十一年，他沒記錯過一筆帳。","frags":[{"id":"ch_ledger_1","cats":["curio"],"regions":["town"],"tags":[],"text":"金秤行裡，鐘祀院那本帳是我經手的。每月初一，院裡的小沙彌抱著布施進城來存，缺了一顆門牙，銅板一枚一枚數給我看，數錯了就從頭再數。我給他一顆麥芽糖，他捨不得吃，舔一口又包起來。三十一年，這本帳我一筆也沒記錯。"},{"id":"ch_ledger_2","cats":["kit"],"regions":["town","river"],"tags":[],"text":"那個月有兩筆帳很怪。城外大營：糧三千石，鐵甲五百副。白蠟：一百四十七根，每根一兩，付給白袍來的主事。哪家的蠟這麼貴？主事笑了笑：「我們的蠟，點得久。」東家在一旁說：「照記。」我就照記了，字寫得很端正。"},{"id":"ch_ledger_3","cats":["charm"],"regions":["abbey"],"tags":[],"text":"東家要我去點數，說帳要對得上。院子裡點滿了白蠟，排得整整齊齊，每根蠟前頭擺一顆剃得光光的頭。我撥一顆算珠，念一個數，白袍在旁邊等得跺腳。數到九十一，那顆頭缺了一顆門牙。我的手停了一下，又撥下去。九十二。"},{"id":"ch_ledger_4","cats":["contra"],"regions":["town","river"],"tags":[],"text":"夜裡，我把那頁帳另抄一份，字小得像螞蟻。每一根蠟後頭，我都補一行：眉心有痣。耳朵凍過。嘴角還沾著粥。九十一：缺門牙，愛吃糖。抄到天亮，手抖得握不住筆。帳上記的是蠟，這本記的是人。總得有一本是對的。"},{"id":"ch_ledger_5","cats":["armor"],"regions":["river"],"tags":[],"text":"副本縫在襖子夾層裡，我跟著逃難的人鑽進枯河底下的洞。洞裡的霧有股爛果子味，滿洞的人咳成一片。紙受了潮，隔著棉花都摸得出它在爛。那就背吧。一，眉心有痣。二，耳朵凍過。背到九十一，嗓子乾了，歇一歇，再從頭背。帳要有人對。"}],"finale":"對帳那天，鐘祀院那一頁短了一百四十七兩，一分不差。那一百四十七根白蠟，不是從行裡的銀庫出的，是從院裡一年一年存進來的布施裡扣的。他去問東家。東家頭也沒抬：「死人不會來提銀。」他抄了副本，縫進襖子，跟著難民逃進枯河。紙在洞裡爛光了，一個字也沒剩，他就把一百四十七行背在心裡，背到斷氣。這筆帳到今天沒有結清。那個缺門牙的孩子一枚一枚數給他看的銅板，最後買了他自己的頭。"},{"id":"ch_envoy","title":"使節","teaser":"北方來的年輕人，嫌這座城的鐘太吵。","frags":[{"id":"ch_envoy_1","cats":["curio"],"regions":["capital"],"tags":[],"text":"這座城的鐘太吵了。死一個人就敲一回，打仗以後夜夜都敲，敲得我整夜睡不著。我想念草原上的夜，只有風，和馬在黑地裡噴鼻子。館驛的老僕說，鐘響，是替死人把沒說完的話聽完。我笑他：你們澐人，連死都要有人陪。"},{"id":"ch_envoy_2","cats":["charm"],"regions":["capital"],"tags":[],"text":"半夜翻牆，我去看了他們的王。他一個人坐在鐘樓底下，閉著眼，時而點頭，時而小聲答話，像身邊圍了一屋子人。可那裡一個人也沒有。回館驛，我點燈寫密報：『澐王夜坐鐘下，對空說話，確已失心。』寫完很得意。那是我頭一封像樣的信。"},{"id":"ch_envoy_3","cats":["weapon"],"regions":["capital"],"tags":[],"text":"那幾個請我喝過酒的將軍，舉著火把站在城裡。他們的兵沿著鐘樓的石階往上衝，近衛一階一階地守，一階一階地倒。底下還有百姓提著燈往上擠，哭喊著要上去護鐘，被長槍挑下來。整座城都在搶那座鐘樓，像旱年搶一口井。"},{"id":"ch_envoy_4","cats":["armor"],"regions":["capital"],"tags":[],"text":"鐘樓頂上亮起一道光，筆直射上天。接著第二道、第三道，每升起一道，城裡就有一口鐘啞掉。最後一口停下來，四下忽然好靜，靜得我聽見了：滿城都是說話聲，很輕，很多，沒有一張嘴。原來他每天夜裡，聽的就是這個。"},{"id":"ch_envoy_5","cats":["charm"],"regions":["crater"],"tags":[],"text":"馬跑死了，我改用走的。天上的星接連往下掉，落在哪裡，哪裡就燒成白的。地在發燙，石頭在唱歌。懷裡的第二封信只寫了一句：他沒有瘋。我的手指慢慢變得跟那些石頭一樣亮。娘，北原的草，這時候該黃了。"}],"finale":"那封密報半路被將軍們截下，抄了一份。攻城前最後一道檄文上寫著：『北原使節親眼所見：澐王夜對空鐘，喃喃自語，失心已久。』一個外邦少年的一句得意話，成了那一夜攻城的旗號。城破前，一個老宦官摸黑找到館驛，塞給他一塊出城的腰牌：「王說，先送北原的孩子回家。」王讀過那道檄文。第二封信終究沒有送到。後來拾骨人在星墜坑裡掘出一具半透明的屍首，胸口長出一叢星晶，晶裡封著一張紙。"},{"id":"ch_bride","title":"未過門的新娘","teaser":"一件自己縫的嫁衣，裙襬繡滿海棠。","frags":[{"id":"ch_bride_1","cats":["curio"],"regions":["town"],"tags":[],"text":"他把簪子往我手心一塞就跑，耳朵紅得像炭。銅的，頂上鑲一粒綠玻璃，燈下會晃。「等我回來，親手給你插上。」我把它鎖進漆盒，一天也沒戴過。插上了，就是他的人了。急什麼？讓他先欠著。"},{"id":"ch_bride_2","cats":["charm"],"regions":["town"],"tags":[],"text":"嫁衣是自己縫的，紅布拿三年的繡活換來。他每來一封信，我就在裙襬繡一朵海棠。信是營裡的人代筆的，他不識字。字寫得好端正，話還是他那幾句笨話：「吃得飽。腳沒爛。想你。」繡到第二十朵，娘說再繡下去，裙子要比人還重了。"},{"id":"ch_bride_3","cats":["weapon"],"regions":["bell"],"tags":[],"text":"替他寫了大半年的信。他死後，我又寫了一年多，學他的笨話：吃得飽，腳沒爛，想你。她的回信越寫越長，問腳好了沒有，問營裡冷不冷。今天她寫：『你的字，越寫越好看了。』我在營火邊笑出聲，旁邊的人罵我瘋了。明早要衝，這封還沒回。"},{"id":"ch_bride_4","cats":["armor"],"regions":["river"],"tags":[],"text":"洞裡的霧是甜的，大家都說別聞，可不喘氣怎麼活。我把嫁衣穿在粗布衣裳底下，二十一朵海棠貼著心口，冷了就一朵一朵數。外頭整夜都有腳步聲，不急不慢，從來不停。有人說，那是死掉的兵在找路回家。我把耳朵貼著石壁，想聽出他的步子。"},{"id":"ch_bride_5","cats":["curio"],"regions":["river"],"tags":[],"text":"燈油燒乾了，洞裡黑得看不見自己的手。我摸出漆盒，摸出那根簪子，往頭上插。插歪了，戳到頭皮，好疼。說好是他親手插的。沒關係，這樣也算嫁了。綠玻璃在黑裡看不見，可我知道，它在晃。"}],"finale":"陣亡文書是頭一年冬天送到的。她拆開看完，摺好，壓在漆盒最底下，那根銅簪的下面。隔月，信照樣來了，還是那手端正的字，還是那幾句笨話。她知道是誰在寫。她照樣回信，問腳好了沒有，照樣在裙襬上繡花——後頭那十一朵海棠，是繡給一個她始終不知道名字的人。她只寫過一句真正給他的話：『你的字，越寫越好看了。』信斷的那個月，她就懂了：兩個都不會回來了。那個代筆的兵到死都以為，是自己騙過了她。"},{"id":"ch_scouts","title":"換乾糧","teaser":"兩軍的壕溝之間，有人在換東西吃。","frags":[{"id":"ch_scouts_1","cats":["curio"],"regions":["bell"],"tags":[],"text":"雨夜摸錯了路，滾進一條壕溝，對面也滾下來一個。兩把刀都拔出來了，兩個肚子卻同時咕嚕一聲。他先笑的。我拿半條肉乾換他兩塊鹹餅，餅硬得能砸死人，可是香。臨走他回頭：「下回還在這兒？」我說：「帶多一點。」"},{"id":"ch_scouts_2","cats":["charm"],"regions":["bell","town"],"tags":[],"text":"兩短一長，是我們的暗號。我一吹，他就從霧裡鑽出來。誰也不問名字，他叫我鹹餅，我叫他肉乾。蹲在壕溝裡分吃的，他說他妹妹出嫁那天哭得比新郎還兇，我說我娘烙餅前總要先拍三下。天一亮，各自爬回去，裝作沒見過。"},{"id":"ch_scouts_3","cats":["armor"],"regions":["bell"],"tags":[],"text":"營裡的餅越烙越薄，現在舉起來能透光。我還是挑最厚的那塊給他：「我吃不下，你幫我吃。」肚子在旁邊叫，他假裝沒聽見。下回我要省三天的口糧，照娘的法子烙一塊厚的，拍三下。不能讓那塊肉乾看扁了。"},{"id":"ch_scouts_4","cats":["curio"],"regions":["town"],"tags":[],"text":"他上回給的那片餅，我一直沒捨得吃，拿油紙包著，貼身揣在胸口。薄得透光，對著月亮看，像另一個小月亮。說什麼吃不下，騙鬼。對面的伙房八成快見底了。下回我多帶兩條肉乾，塞給他就跑，不讓他還。"},{"id":"ch_scouts_5","cats":["weapon"],"regions":["bell"],"tags":[],"text":"天沒亮就衝，煙大得看不見人。我閉著眼往前捅，槍尖扎進一個人，好輕，輕得像扎進一捆稻草。然後我聽見口哨，兩短一長，從槍桿另一頭傳過來，越吹越小聲。我不敢睜眼。睜開了，就得知道他這幾天到底吃了多少。"}],"finale":"那一仗是怎麼打起來的，肉乾沒來得及知道。前一夜他摸回營，伍長搜身，從他胸口搜出那片薄得透光的餅。將軍把餅舉到火前看了很久：「對面的伙房見底了。天亮就打。」說完，順手把餅扔進了火裡。那是鹹餅自己餓著肚子、硬省給他的一塊。鹹餅倒下時，懷裡揣著一塊厚餅——省了三天的口糧，照他娘的法子拍了三下，等著下回換乾糧時塞給肉乾。天亮以後，兩個人都沒有爬回去。"},{"id":"ch_singer","title":"瞎眼賣唱人","teaser":"渡口的歌，總有一個人在數錢。","frags":[{"id":"ch_singer_1","t":"v_coin","cats":["curio"],"regions":["town"],"tags":[],"text":"渡口的雨棚下，我拉琴，小穗數錢。銅錢落進碗裡，她聽聲音就知道多少，還告訴我給錢的人長什麼樣：「爺爺，剛才那個伯伯笑得像沒牙的狗。」我笑岔了氣，走了一個音。她說沒關係，鴉渡的人耳朵都不好。"},{"id":"ch_singer_2","t":"k_rope","cats":["kit"],"regions":["town","river"],"tags":[],"text":"我們之間綁著一條麻繩。她走前頭，我走後頭，繩子一緊就是快走，一鬆就是停。這陣子繩子老是鬆，我知道她又在糖人攤前站著。我不催她。她在繩子那頭站多久，我就在這頭等多久，假裝我也在看。"},{"id":"ch_singer_3","cats":["curio"],"regions":["river"],"tags":[],"text":"爺爺每天問：渡口好不好看？我說好看，河上好多船，船上都掛燈。其實河早乾了，河床上躺的人比船還多。他看不見，我就替他把渡口畫好看一點。反正說謊不用錢，好看的東西，總得有一個人看得見。"},{"id":"ch_singer_4","cats":["charm"],"regions":["river","bell"],"tags":[],"text":"那夜霧好濃，繩子一直往前拉，拉得好急。小穗的聲音從霧裡傳回來：「爺爺快點，前面有座橋，橋上好多燈，好多人在等我們。」我摸到繩子另一頭是冰的。我沒問。我拉開琴，唱她最愛的那首，跟著繩子走。"},{"id":"ch_singer_5","cats":["curio"],"regions":["town"],"tags":[],"text":"收屍的第三天，我在乾河床邊看見那個瞎眼琴師。他坐在泥裡，懷裡抱著一截麻繩，繩子另一頭伸進霧裡，看不到底。我問他等誰。他說孫女先過橋去占位子了，叫他在這兒等。他說得很高興，琴弦都斷了，還在拉。"}],"finale":"小穗在灰潮前兩天就走了——發燒，燒了一夜，沒錢請大夫。他摸著她的額頭，一直燙到天亮，再一路涼下去。第三天，繩子又自己繃緊了。他其實看得見一點光。他知道河是乾的，知道渡口躺滿了人，也知道那座「好多燈的橋」是灰潮。他還是跟著走了。孫女替他把世界說得好看了三年，他想讓她把最後一句也說完。後來那條繩子自己回到了渡口，打著一個蝴蝶結，是她每天替他綁的那一種。"},{"id":"ch_twins","title":"雙生","teaser":"一個人回了家，眉角多了一顆痣。","frags":[{"id":"ch_twins_1","cats":["weapon"],"regions":["bell"],"tags":[],"text":"娘的信總是同一句：「兄弟倆要互相照看。」可阿二在王城當兵，我在城外的勤王軍。夜裡站崗，我對著城牆上的火光一盞一盞數，數到哪一盞像他，就多看兩眼。阿二從小怕黑，城上那麼黑，他會不會又睡不著。"},{"id":"ch_twins_2","cats":["armor"],"regions":["capital"],"tags":[],"text":"城下的營火連成一片，哥應該在裡面。我們長得一模一樣，只有眉角那顆痣分得出來，娘說那是老天怕她認錯人，特地點上去的。今晚輪我守水門。要是哪天在城下撞見一張跟我一樣的臉，我是該砍，還是該喊哥。"},{"id":"ch_twins_3","t":"v_coin","cats":["curio"],"regions":["town"],"tags":[],"text":"兩個兒子出門那天，我把一枚銅錢剪成兩半，一人一半。合起來才是一枚，少一半，連一顆饅頭都買不到。我跟他們說：誰先回來，就在渡口等另一個。我在渡口擺了兩年的麵攤，每個過路的年輕人，我都要看他眉角。"},{"id":"ch_twins_4","cats":["weapon"],"regions":["capital"],"tags":[],"text":"水門一開，衝進來的人裡有一張我的臉。他舉著刀，我也舉著刀，誰都沒砍下去。後頭有人一槍捅向我，他撲過來擋了。他倒在我懷裡，把半枚銅錢塞進我手心：「拿去。往後，你就是我。」"},{"id":"ch_twins_5","cats":["curio","kit"],"regions":["town"],"tags":[],"text":"每天天沒亮，他就對著水缸，用炭條在眉角點一顆痣。點太大，娘會說他胖了；點太淡，娘會湊過來看。點完了，他去麵攤幫娘揉麵。娘逢人就說：大兒子回來了，小的那個沒福氣。他低著頭揉麵，揉得很用力。"}],"finale":"回來的是阿二。水門下，阿大替他擋了那一槍，臨死前把自己那半枚銅錢塞給他：「娘比較疼我，你也知道。讓她以為活下來的是我，她才撐得下去。」阿二照做了。他用炭條畫了二十年的痣，替哥哥孝順了二十年，在娘面前提起「阿二」，還要跟著嘆一口氣。娘臨終那晚，摸著他的眉角，用拇指把那顆痣輕輕抹掉了：「傻孩子，娘早就知道。娘只是捨不得，再少一個兒子。」"},{"id":"ch_painter","title":"最後一幅畫","teaser":"畫裡每個人都在笑，除了角落那一個。","frags":[{"id":"ch_painter_1","t":"v_scroll","cats":["curio"],"regions":["capital"],"tags":[],"text":"王不肯坐著讓我畫。他說：「畫我做什麼，畫敲鐘的人。」於是我在鐘樓上蹲了三天，畫那些敲鐘的老和尚，畫他們手上的繭。王每晚上樓看一眼，指著其中一個說：「這個人的師父昨天走了，他還是準時敲。」"},{"id":"ch_painter_2","cats":["curio"],"regions":["town"],"tags":[],"text":"城沒了以後，碑樓的人找上門，說新城要掛一幅《勤王凱旋圖》，丈二長，銀子先給一半。我說我眼睛壞了。他們把銀子擺在桌上，一錠一錠排好，排成一條路。我數到第七錠，就答應了。家裡還有三張嘴。"},{"id":"ch_painter_3","cats":["kit"],"regions":["capital"],"tags":[],"text":"為了畫得像，我搭拾骨人的船回王都看了一趟。水退了一半，鐘樓還立著，一半泡在水裡。屋頂上坐滿了人，一動也不動，全朝著鐘的方向，像在等開場。拾骨人說別看，他們會跟著你回家。我看了，還照著畫了下來。"},{"id":"ch_painter_4","t":"x_ash","cats":["contra"],"regions":["town"],"tags":[],"text":"我把白灰磨進墨裡。拾骨人說那是骨頭燒的，吃了能止痛，我拿來畫畫。凱旋的大軍、旗、馬、歡呼的百姓，一筆一筆都是灰。遠看金光燦燦，近看每一張臉都是灰白的。碑樓的人來驗收，說好，好氣派，賞了我一罈酒。"},{"id":"ch_painter_5","cats":["curio"],"regions":["town"],"tags":[],"text":"畫掛在碑樓大廳十年了。我眼睛全瞎以後，常叫孫子牽我去，站在畫前聽人家說好。有個小孩問他爹：「角落那個人為什麼不笑？」他爹說：「畫錯了吧。」我在旁邊笑出聲來，笑得直咳嗽，他們以為我是個瘋老頭。"}],"finale":"《勤王凱旋圖》上，一萬個人在笑。勤王的將軍騎著白馬，百姓沿街撒花，滿城張燈結綵。只有右下角，有一個背對所有人的背影，坐在一口大鐘底下，兩手放在膝上，低著頭，像在聽誰說話。他沒戴冠，畫得很小，小到掛了十年，都沒有人認出來。畫師用盡最後一點眼力，把那一萬個勝利的人畫成了灰，只有那一個人，用的是真墨。"},{"id":"ch_medic","title":"軍醫的帳本","teaser":"三百一十二句話，一句都沒送到。","frags":[{"id":"ch_medic_1","cats":["kit"],"regions":["bell"],"tags":[],"text":"這孩子的腸子都在外面了，還在問我仗打贏了沒。我說贏了。他說那好，叫我寫下來：「溪口村，許二，跟娘說我沒偷懶。」我用他的血在本子上記了。他看著我寫完才閉眼，像在等我蓋章。"},{"id":"ch_medic_2","t":"v_book","cats":["curio"],"regions":["bell"],"tags":[],"text":"我的帳本不記傷，只記三樣：名字、哪裡人、最後一句話。藥救不了的，至少話不能丟。勤王軍的、王軍的，抬進來我都記，翻開來一頁一頁，分不出誰是誰的人。死人倒是不挑，最後一句話，十個裡有八個叫娘。"},{"id":"ch_medic_3","cats":["kit"],"regions":["river"],"tags":[],"text":"枯河的毒霧一來，帳篷裡一夜躺下四十個。墨用完了，我拿炭條寫；炭也沒了，我用指甲刻。有個人只說了一個字：「冷。」我替他寫了，又在後面補一句：「有人陪著。」這句是我加的，不知道算不算作假。"},{"id":"ch_medic_4","t":"w_dagger","cats":["weapon"],"regions":["bell","town"],"tags":[],"text":"這把小刀切過箭頭、切過爛肉，也切過一條還在動的腿。十七年了，刀柄被我握出一個指頭的凹。仗打完，我回鴉渡開醫館，刀沒再用過。夜裡睡不著就磨它，磨得發亮，像在等誰再被抬進來。"},{"id":"ch_medic_5","t":"v_letter","cats":["curio"],"regions":["town"],"tags":[],"text":"師父每晚對著帳本寫信，寫完一封就收進抽屜，從來沒寄。我問他為什麼不寄，他說：「寄了，他們就真的死了。」抽屜塞滿以後，他開始在帳本最後一頁練字，練的是他自己的名字。"}],"finale":"帳本最後一頁，是另一個人的筆跡：「鄭守拙，雲州人。最後一句：剩下的，你去送。」那是學徒替師父記的。鄭大夫記了十七年，三百一十二個名字，三百一十二句話，一封也沒寄出去——他怕信送到的那一刻，那個人才算真的死了。學徒答應了師父，背著帳本出門，走到渡口才發現，他也不敢。帳本後來輾轉進了當鋪。你翻開它，三百一十二個人一起看著你，等你決定，要不要替他們把話送到。"},{"id":"ch_firstbone","title":"第一次拾骨","teaser":"拾骨人的規矩：第一件，不能賣。","frags":[{"id":"ch_firstbone_1","t":"k_lantern","cats":["kit"],"regions":["river","town"],"tags":[],"text":"出發前一夜，老秤教我三條規矩：進洞數步，出洞也數步；燈比命重要；第一件撿到的東西，不准賣。我問為什麼。他說：「第一件是它們挑你，不是你挑它們。」我笑他迷信，他也笑，笑完把他的燈塞給我。"},{"id":"ch_firstbone_2","t":"k_rope","cats":["kit"],"regions":["river"],"tags":[],"text":"繩子一寸一寸放下去，越往下越冷，冷得像把手伸進井裡。我數步數，數到三百就忘了數到哪。上面的老秤吹了一聲哨，意思是：還在。我也吹一聲。這輩子沒聽過那麼好聽的聲音，難聽得要命的一聲哨。"},{"id":"ch_firstbone_3","t":"v_doll","cats":["curio"],"regions":["river"],"tags":[],"text":"石壁的凹洞裡躺著一尊布偶，旁邊是一排很小很小的骨頭，排得整整齊齊，像有人替它們排過隊。布偶的臉洗得很乾淨，一點泥都沒有。我把它揣進懷裡，跟骨頭們說了一聲借過。這是我的第一件。"},{"id":"ch_firstbone_4","cats":["weapon","armor"],"regions":["river"],"tags":[],"text":"屍蟲從頭頂的縫裡倒下來，像有人倒了一簍白米。老秤一把將我推進岩縫，吼著叫我數步。我數到一百二十，聽見他的燈滅了。我一直數，數著數著就哭了，眼淚流進嘴裡是鹹的，我還在數。"},{"id":"ch_firstbone_5","cats":["curio"],"regions":["town"],"tags":[],"text":"公會的人在骨棚的木樁上刻下老秤的名字，刻得很淺，雨一沖就快看不見了。我把布偶放在他的名字底下，又拿了回來。規矩是第一件不准賣，可沒說不准留。我把它縫進背包裡，往後每次下洞，它都跟著。"}],"finale":"老秤沒說的是，那尊布偶，他放回去過十一次。三十年前他第一次下枯河，凹洞裡那排小小的骨頭，是他女兒的。他把她的布偶洗乾淨，放回她身邊。往後每帶一個新人下洞，他都先一步爬進去，把布偶擺好，讓新人撿到的第一件，是一件「有人疼過的東西」。他說，這樣他們往後下手，才會輕一點。十一個新人裡，活下來的有四個。現在，那尊布偶第十二次，被一個少年縫進了背包。"},{"id":"ch_cook","title":"圍城的廚子","teaser":"那鍋粥，在兩個人之間來回了四十天。","frags":[{"id":"ch_cook_1","t":"k_ration","cats":["kit"],"regions":["capital"],"tags":[],"text":"御膳從八道減成三道，又從三道減成一碗。王說不用留他的，要減就從他開始。我照辦了，心裡罵他傻。宮裡誰都知道，廚子的手藝，是在缺東西的時候才看得出來的。一碗粥，我能熬出八道菜的香。"},{"id":"ch_cook_2","t":"v_box","cats":["curio"],"regions":["capital"],"tags":[],"text":"這只漆盒是我裝香料的。最後一顆花椒，我用刀背拍碎，分成四十份，一天撒一點。撒的時候我背對著灶，怕手抖。一碗白粥，只要有那麼一點點麻，喝的人就會以為今天還過得去。"},{"id":"ch_cook_3","cats":["weapon"],"regions":["capital"],"tags":[],"text":"王的那匹老白馬是我殺的。牠認得我，我每天拿菜葉餵牠。我跟牠說了好多話，說對不起，說下輩子別當王的馬，當廚子的馬，天天有菜葉吃。牠一直舔我的手。刀下去的時候，我閉著眼，手很穩。"},{"id":"ch_cook_4","cats":["curio"],"regions":["capital","town"],"tags":[],"text":"小太監阿喜在灶邊撿米粒，一粒一粒往嘴裡放。我把我那碗粥推給他，騙他說我在灶上偷吃飽了。他捧著碗喝得好急，喝完了舔碗底。那晚我的肚子叫得好響，響得我自己都想笑。原來餓是這種聲音。"},{"id":"ch_cook_5","cats":["charm","curio"],"regions":["capital"],"tags":[],"text":"最後一夜，鐘從黃昏響到天亮。王叫我把灶裡剩下的米全煮了，一碗一碗端上鐘樓，給敲鐘的師父們。我端到第九碗，王接過去，自己沒喝，放在最老的那位師父手邊。師父已經敲不動了，粥還熱著，他就那樣看了很久。"}],"finale":"圍城的最後四十天，王每晚都問同一句：「今天大家都吃了嗎？」廚子每晚都答：「吃了。」其實廚子早就不吃了，端給王的那碗粥，是他自己的那一份。可王也知道——廚房裡那只刻著廚子名字的碗，四十天來從沒沾過一粒米。於是王每晚趁人不注意，把半碗倒回鍋裡。第二天，廚子又把它熬熱，端給王。四十天裡，那鍋粥就這樣在兩個人之間來回，誰也沒說破。城沉的那一夜，鍋底還剩著半碗。"}],"squad":[{"id":"sq_1","t":"w_saber","name":"莫三的鏟刀","tags":["squad"],"text":"頂上的石頭咯吱咯吱響，一聲比一聲近。莫三把鏟刀捅進裂縫，拿肩膀頂住刀柄，一邊哼那首永遠走音的小調，好讓大家聽得出他在哪。「走散了就找白燈！」他吼。白燈往出口晃，晃得很快。跑得好。悶葫蘆那小子腿長，一定出得去。刀柄壓進他的肩膀，越壓越深。"},{"id":"sq_2","t":"w_bow","name":"花椒的角弓","tags":["squad"],"text":"箭袋裡剩六支。花椒趴在地上射，屍蟲從牆縫湧出來，一股甜爛的霉味，一箭一隻。左腿壓在石板底下，已經不痛了，這不是好兆頭。她扯開嗓子：「啞叔！把悶葫蘆弄出去，綁也要給我綁出去！」骨哨短短回了一聲，尖得像雀子：聽見了。她又搭上一支箭。那傻子一定會回頭，得趕在他回頭之前，把路清乾淨。"},{"id":"sq_3","t":"v_box","name":"花椒的辣椒袋","tags":["squad"],"text":"袋裡只剩最後一根辣椒乾。每回下坑前，花椒都偷偷塞一根進悶葫蘆的口袋，他嫌辣，從來不吃，也從來沒扔。剛才啞叔拖著他從她身邊過，她伸手，把這最後一根塞進他胸前的口袋。等他爬出去摸到，就會知道是誰。有句話她本來想這趟回去再說。不說了，讓辣椒替她說。"},{"id":"sq_4","t":"c_whistle","name":"啞叔的骨哨","tags":["squad"],"text":"悶葫蘆在他手裡掙，要回頭去搬花椒腿上那塊石板。啞叔一手揪住他的後領，一手把骨哨塞進嘴裡，吹長音。一長，是走。他吹到肺裡著火，把那孩子硬塞進越縮越窄的石縫，再狠狠一推。頭頂轟的一聲。這輩子他沒說過一句話。最後這口氣，他想說：孩子，走，別回來。"},{"id":"sq_5","t":"v_book","name":"莫三的歌本","tags":["squad"],"text":"石頭壓著胸口，莫三喘不上氣，心裡還在翻那本歌本。〈白燈謠〉頭一句「白燈照路」，他每回唱到「路」都破音。往下一人一段：莫三的刀亮，花椒的嘴辣，啞叔的哨子會說話。悶葫蘆那段還空著，本來想等那兩個傻子把話說開，在喜酒上填。他哼了兩句，又哼岔了，自己笑了一下。"},{"id":"sq_6","t":"k_lantern","name":"白燈隊的防風燈","tags":["squad"],"text":"花椒把白燈舉高，手臂抖得燈罩一直磕在石頭上。燈得亮著，他才看得見縫在哪。骨哨的長音斷了。莫三那走音的調子從石頭底下傳出來，還在哼。悶葫蘆的背影卡在縫裡，肩膀一聳，要轉過來。她用盡力氣吼：「別回頭——」後半句被塌下來的轟響吞了。後半句是：替我們活。燈芯一跳，滅了。"}],"qi":[{"id":"qi_1","t":"v_glasses","name":"老戚的老花鏡","tags":["qi"],"text":"鏡片裡先是一雙靴子，一階一階下到地窖。守碑衛的軍靴，鞋頭包鐵。外頭下著雨，靴面卻擦得一點泥也沒有。臉太遠，老花鏡看不清。那聲音很穩，每個字都擺正了才出口：「戚老，您記性太好了。」老戚扶正眼鏡：「水門的小霍。」靴子頓了一下。然後鏡片碎了。樓上那丫頭在睡，千萬別下來。"},{"id":"qi_2","t":"v_box","name":"老戚的菸斗","tags":["qi"],"text":"那晚老戚在鐘祀院後門倒泔水，菸斗還叼在嘴上。門被撞開，護院的燕歸把一個小沙彌塞進他懷裡。他抱著孩子鑽進菜窖，拉上木板，死死咬住菸斗，免得牙齒打顫出聲。頭頂的偈子，一句比一句少人唱。懷裡那孩子不哭也不動，嘴唇還跟著在唱，沒有聲音。天亮時，菸斗嘴被他咬裂了。"},{"id":"qi_3","t":"v_book","name":"老戚的帳本","tags":["qi"],"text":"帳本前頭是當票，後頭三頁只記七樣東西。冕板：收自拾骨人，三兩，人家當它是塊破漆板。後旒：燭院金庫。玉簪：金秤行。剩下四格只有問號，圈了又圈。老戚舔了舔筆尖，在最底下添一行：「七件湊齊，送回鐘下。丫頭會唱。就差一個聽得見的人。」"},{"id":"qi_4","t":"k_rope","name":"老戚的鑰匙串","tags":["qi"],"text":"七把鑰匙穿在一截麻繩上：前門、後門、櫃台、暗格、錢箱、地窖。第七把是銅的，磨得發亮，城裡沒有一把鎖對得上——鐘祀院鐘房的鑰匙，那扇門早燒成了灰。老戚每晚睡前都摸一遍。他早想好了，鐘再響的那天，要把它還回去。地窖那把，等丫頭敢下去了，再交給她。"}],"special":[{"id":"shen_signet","t":"v_seal","name":"沈硯的私印","tags":["shen","royal"],"text":"私印攥在手心，被血浸得發滑。「硯」是娘取的字：硯台不動，墨才磨得勻，娘說做人也一樣。黑水已經漫過鐘樓門檻，刀斷了，沈硯背靠著門，身子一直往下滑。「娘，我沒動，門守到了最後。」話到嘴邊，只剩一口血沫。懷裡那封信還沒蓋印。現在蓋了，也寄不出去。"},{"id":"shen_letter","t":"v_letter","name":"沈硯沒寄出的家書","tags":["shen","letter"],"text":"「娘：今夜城外的火把，有一半是爹的銀子點的，兒知道。爹有爹的帳，兒有兒的門。王每夜坐在鐘底下聽死人說話，兩邊的都聽，一聽就到天亮。總得有人守著門，讓他聽完。這信寄不出去，兒寫給自己看。娘，別再對著帳本熬夜了。」信角按著一個帶血的拇指印。"},{"id":"yan_brother_1","t":"c_amulet","name":"燕歸的念珠","tags":["yan_brother","monk"],"text":"一百零八顆木念珠，是師父給的，燕歸向來數得很慢。今夜白袍兵衝進大殿，他一顆也沒來得及數。懷裡那個小沙彌還在唱，老是搶拍，跟阿回小時候一個樣。今晚只要再護住一個人就夠了。線被刀尖挑斷，珠子滾了一地，一顆一顆，像在替他數。"},{"id":"yan_brother_2","t":"w_mace","name":"燕歸的斷棍","tags":["yan_brother","monk"],"text":"棍子斷在第九個白袍兵的頭盔上，燕歸攥著剩下的半截，背頂著後門。雜役老戚抱著那孩子，已經跑進雨裡了。他豎起耳朵聽門外：沒有歌聲。那丫頭沒唱。刀第三回從門縫捅進來，他還在心裡算：老戚腿慢，這時候該跑到菜園的籬笆了。"},{"id":"yan_brother_3","t":"v_doll","name":"缺了一角的木燕子","tags":["yan_brother"],"text":"一隻木燕子，翅尖缺了一角，是阿回七歲時啃的。另一隻在她那兒，兩隻湊起來才是一對。燕歸本來打算秋收後下山，把它塞回她手裡，說一聲：哥回來了。爹給兄妹倆取名，一個歸，一個回。血從肚子上的口子往外冒，他把木燕子按在心口：阿回，哥歸不去了。妳別找。妳要回家。"}],"relics":[{"id":"r1","name":"空冕·冕板","desc":"一塊兩掌長的木板，面上玄黑，底面朱紅，前後兩緣各鑽一排細孔，孔裡空空的。","memory":["沉鐘城，最後一夜。鐘樓頂上的雨剛停，簷角還在滴。","九口鐘從黃昏響到現在。響一下，就是走了一個人。","澐昭王扶著欄杆。背後那口大鐘的銅還燙著，像發燒的額頭。","城外亮起火把，一條、兩條，連成火河。風裡全是松脂的焦味。","沈硯在他身後鬆了口氣：「陛下，是鎮北軍的旗。援軍到了。」","最前頭那匹白馬，是王十六歲那年親手牽給鎮北將軍的。","第二面旗是他親舅舅。第三面，是教他拉開第一張弓的人。","火把沒有往叛營去。它們繞開叛營，筆直朝水門來。","沈硯的手慢慢按上刀柄，指節喀地響了一聲。","「他們不是來救城的，」王說，「是來拿冕的。」","冕旒在他眼前輕輕晃。隔著那一串串玉看出去，火也是碎的。","「傳鐘祀院，」他說，「今夜，把九口鐘都沉了。」","沈硯變了臉：「鐘一沉，往後死的人——」「我知道。」"]},{"id":"r2","name":"空冕·前旒","desc":"十來串細白玉珠，穿珠的朱絲褪成淡粉，握在手裡冰得像剛從井底撈上來。","memory":["鐘祀院的大殿裡檀香正濃，師父們跪得滿滿的，唱著鐘偈。","燕歸守在殿門口，棍頭的血還熱著，是第一個白袍兵的。","燭院的白袍兵跨過門檻，一人擎一支白燭，像一場不出聲的雪。","他們不追逃的人。他們只砍正在唱的。","唱一句，倒一個。後面的師父接著唱，偈子一句也沒斷。","燕歸往後殿退，懷裡抱著一個小沙彌。她也在唱，唱得又尖又急。","他捂住她的嘴。她一口咬下去，咬出了血，他沒鬆手。","後門閂得死緊。他拿肩膀撞了三下，雨潑了進來。","門外是挑泔水的雜役老戚，兩隻桶都翻了，人跌坐在泥裡。","「老戚！」燕歸把孩子塞進他懷裡，「帶她走，別讓她唱！」","老戚抱著孩子衝進雨裡，一次也沒回頭。","燕歸把門關上，用背抵住。刀砍在門板上，震得他後背發麻。","殿裡的偈子，只剩最後一句還沒唱完。"]},{"id":"r3","name":"空冕·後旒","desc":"幾串青白玉珠，繩結裡卡著乾透的白蠟，湊近了聞，還有一股燭煙味。","memory":["城沉後第三天。燭院帳房裡點滿白蠟燭，油煙燻得人眼睛發酸。","沈萬鈞把算盤擱上桌，先空撥一遍，聽珠子響得順不順。","燭院主事推過來一張單子：鐘祀院，僧眾三百一十七。","「說好的，」主事說，「一顆僧人的頭，一兩銀。」","沈萬鈞的手指停在算盤上：「單子裡有小沙彌。」","主事說：「頭就是頭。」沈萬鈞搖頭：「小的，算半兩。」","珠子啪啪響了一陣。三百零七兩五錢，零頭抹了。","主事又把一串玉珠擱在帳本邊，五指壓著，像按住一隻鳥。","「冕上的後旒。」沈萬鈞看了很久，「一千兩，我要了。」","主事笑了：「這個不賣。」","沈萬鈞提筆入帳，一筆不抖：「勤王軍需，鐘祀院一項，結清。」","他在帳尾另起一行，寫下「硯兒」兩個字，筆停住了。","那一行，他撥了一夜算盤，也沒算出該填多少。"]},{"id":"r4","name":"空冕·左瑱","desc":"一枚棗核大的黃玉耳瑱，吊在一截斷絲上，握久了，掌心會滲出一層冷汗似的水。","memory":["雨大得像整條澐水倒過來，從天上往下灌。","水門的絞盤又濕又冷。年輕的門尉霍嶂，兩隻手都握不穩。","他把手掌往衣擺上擦了三遍，還是濕的。","他對自己說：開了這道門，仗就打完了。打完了，就不會再死人。","「開。」他說。聲音穩得連他自己都意外。","鐵鍊一節節往上捲，河泥的腥味翻上來，黑水上是一排船頭的火把。","第一個跳上岸的兵經過他身邊，朝他點點頭，算是謝了。","後面的人從他兩側流過去，像水，流不完。","城裡有人開始尖叫。然後，鐘響了。","澐國的鐘，一聲送一個死人。今夜的鐘聲密得接不上氣。","霍嶂站在雨裡數。數到兩百，他不敢再數了。","「為了不再死人。」他又說了一遍，聲音還是那麼穩。","握過絞盤的那雙手，一直抖到天亮。"]},{"id":"r5","name":"空冕·右瑱","desc":"一枚黃玉耳瑱，表面燒出一層玻璃似的硬殼，殼裡嵌著亮晶晶的星晶碎屑。","memory":["大鐘底下，澐昭王盤腿坐在地上。冕擱在膝頭，簪和纓都已經不在了。","他折下前旒。玉串一離開冕就亮了，燙得像剛出爐的炭。","窗外，東城那口鐘的鐵鍊應聲斷了，轟的一聲砸進黑水，浪比鐘樓還高。","光從他指縫裡衝出去，上了天，成了一顆星，往鐘祀院那座山落去。","後旒，左瑱。每拆一件，城裡就沉一口鐘，天上就多一顆星。","每沉一口，他耳朵裡的聲音就少一層，像有人一扇一扇關上窗。","輪到右瑱，他的手停了。右耳裡，還有一個孩子在問路：","「爹說，過了橋就到了。橋在哪裡？」","橋是鐘聲搭的。而鐘，正在沉。","「對不起，」王說，「我聽不完了。」","他拔下右瑱。那孩子還在問，問到一半，就沒了聲音。","右瑱燙得握不住，掙出他的手，拖著光飛出城外，墜向很遠的荒野。","耳朵裡一片死寂。戴冕以來頭一回，王聽不見任何一個死人。"]},{"id":"r6","name":"空冕·玉簪","desc":"一支白玉簪，簪頭雕成一口指甲大的小鐘，簪身一道細裂，用金絲密密纏過。","memory":["撞木砸在鐘樓門上，砰，砰，樑上的灰簌簌往下掉。","澐昭王拔下玉簪，擱在案上。頭髮散下來，遮住半張臉。","沈硯跟了他這麼多年，從沒見過王披著頭髮，像個熬了夜的書生。","王把解下的冠纓在沈硯手腕上繞了兩圈，打了個死結。","「把冕帶回鐘下。」王說，「等有人能聽見他們。」","沈硯想答話，眼睛卻落在那支玉簪上，忽然想起他娘。","娘也拿一支簪子挽頭髮。撥算盤撥到半夜，髮絲掉在帳本上也不管。","他離家那天，娘倚著門問：「替一個瘋子守門，值嗎？」","他沒答，只說會寫信。後來寫了好幾封，一封也沒寄。","樓下喀啦一聲，門閂裂了。","沈硯拔出刀，下樓去守那扇門。","心裡只剩一句話，是要說給娘聽的：","「娘，他沒瘋。他只是一直在聽。」"]},{"id":"r7","name":"空冕·冠纓","desc":"兩條褪成灰紫的絲纓，末端打著一個死結，結上勒出的摺痕，正好是一圈手腕的粗細。","memory":["九口鐘裡最大的那口懸在澐昭王頭頂，鐘口朝下，黑洞洞的，像在等誰開口。","冠纓勒在他下巴上，七年沒解過，磨出了一道硬繭。","鐘不是敲響的，是聽響的。","戴冕的人坐在鐘下，聽完所有亡者的話，鐘才會響。一個都不能漏。","這七年，兩邊陣上死的人，他都聽了。","今夜，鐘祀院的師父們一個接一個，死進他的耳朵裡。","第一個斷氣時唱著「一杵鐘，水向東，」第二個接下去「二杵鐘，燈火紅，」","前面的倒了，後面的就接上，沒有一個停下來。","「三杵鐘聲過橋去，橋上的人莫回頭。」","「放下手裡那盞燈，放下心上那個名，」","最後是老住持，嗓子早就啞了：「你走的路我替你記，」","「你沒說完的，我替你聽。」王閉著眼，替他們每一個都聽完。","頭頂的鐘響了，是澐國最後一聲。王伸手，解開了冠纓。"]}]},"story":{"events":[{"id":"m_open","phase":"morning","day":[1,1],"priority":100,"who":"tan","title":"開張","lines":["雨下了一夜。{shop}的第一塊門板，是你親手卸下來的。","tan|「掌櫃的，老戚的鋪子歸你了。他欠的錢，也歸你了。」","tan|「每七天，金秤行來收一次帳。今天就會有人來認門。」","tan|「客人進門，不是賣就是買。東西看準了再開價，看走眼算你的。」","tan|「對了，老戚還欠我三個月工錢。現在也是你的了。」"],"choices":[{"text":"開門做生意","fx":[],"lines":["tan|「慢著。屋頂漏的雨也是你的，先去拿盆子。」"]}]},{"id":"m_debt_intro","phase":"counter","day":[1,1],"priority":100,"who":"abacus","title":"三千兩","lines":["進門的是個矮小老頭，肩上扛著一把比他還長的鐵算盤。","abacus|「金秤行，收帳的。老戚欠東家三千兩，鋪契押在秤上。」","abacus|「鋪子歸你，帳就歸你。每七天我來一趟，收一期。」","abacus|「繳不出來，拿貨抵。貨不夠，拿鋪子抵。鋪子不夠，拿人抵。」","abacus|「人不值錢，所以通常算到鋪子就停了。」"],"choices":[{"text":"塞點茶錢","hint":"−20 兩","fx":[{"cash":-20},{"rep":["scale",10]}],"lines":["abacus|「茶錢收了。帳照算，不過我會撥得慢一點。」"]},{"text":"老戚是怎麼死的","fx":[{"note":"老戚的死，碑樓結案：強盜殺人。"}],"lines":["abacus|「碑樓結的案，強盜殺人。」","abacus|「帳上記一筆呆帳。人死了，帳不會死，所以我來找你。」"]},{"text":"慢走","fx":[],"lines":["abacus|「下回見。下回，帶錢見。」"]}]},{"id":"m_yao_1","phase":"counter","day":[2,2],"priority":90,"who":"yao","title":"城外","lines":["一個獨臂老頭撞開門簾，把一身雨水甩在你的地板上。","yao|「拾骨公會，老鷂。來看看老戚的鋪子換了什麼人。」","yao|「城外那些拾骨的崽子，命全押在你賣的刀、燈、繩子上。」","yao|「你賣他們好貨，他們活著回來，撿到好東西先送你櫃台。」","yao|「賣他們爛貨也行。亡域會替你收帳，連本帶命。」","他把一本油膩的名冊拍在櫃台上：誰出城、去哪、幾時回，全在上頭。"],"choices":[{"text":"收下名冊","fx":[{"unlock":"map"}],"lines":["yao|「看仔細了。名冊上被劃掉的，就是沒回來的。」"]},{"text":"送公會一箱燈油","hint":"−40 兩","fx":[{"unlock":"map"},{"cash":-40},{"rep":["guild",10]}],"lines":["yao|「燈油就是活路。這份情，公會記著。」"]}]},{"id":"m_workshop","phase":"morning","day":[3,6],"chance":0.7,"priority":40,"who":"tan","title":"後院","lines":["tan|「掌櫃的，後院那堆破爛，我想清出來。」","tan|「搭個棚子、釘張台子，就能修東西。缺口的刀磨一磨，價錢翻倍。」","tan|「修不好的就拆。皮歸皮、鐵歸鐵，拆開了一樣能賣。」","tan|「木料加鐵釘，八十兩。工錢不用算——反正你也欠著。」"],"choices":[{"text":"給她八十兩","hint":"−80 兩","fx":[{"cash":-80},{"unlock":"workshop"},{"trust":["tan",5]}],"lines":["tan|「心疼了吧？三天之內，讓你看看值不值。」"]},{"text":"先不要","fx":[{"flag":"workshop_later"}],"lines":["tan|「行。等你看見缺口的刀賣不掉，再來求我。」"]}]},{"id":"m_workshop2","phase":"morning","day":[8,12],"chance":0.5,"priority":40,"req":[{"flag":"workshop_later"}],"who":"tan","title":"後院","lines":["阿檀把一把缺了口的環首刀擱在櫃台上，刀刃朝著你。","tan|「這把擺了五天，沒人要。磨好了，能多賣一倍。」","tan|「後院的棚子，還是八十兩。我沒漲價，是因為我人好。」"],"choices":[{"text":"好，八十兩","hint":"−80 兩","fx":[{"cash":-80},{"unlock":"workshop"},{"trust":["tan",5]},{"unflag":"workshop_later"}],"lines":["tan|「早這樣不就好了。」"]},{"text":"還是不要","fx":[{"unflag":"workshop_later"},{"flag":"workshop_no2"}],"lines":["tan|「……你跟老戚一樣，倔得像塊碑。」"]}]},{"id":"m_wu_1","phase":"night","day":[3,3],"priority":100,"req":[{"noflag":"crows_fee_waived"}],"who":"wu","title":"規費","lines":["打烊後有人敲門，三長一短。","門外蹲著一個笑嘻嘻的年輕人，斗笠沿上的雨一直往下滴。","wu|「灰鴉會，烏十一。老戚在的時候，每週給鴉巷三十兩。」","wu|「錢給了，你的門閂就是鐵打的。不給嘛——」","他用指節敲了敲門框。","wu|「西街的門，都是木頭做的。」"],"choices":[{"text":"給","hint":"每週 −30 兩","fx":[{"flag":"crows_fee"},{"rep":["crows",15]}],"lines":["wu|「爽快。往後鴉巷的孩子，會替你看門。」"]},{"text":"不給","hint":"得罪灰鴉會","fx":[{"rep":["crows",-20]},{"flag":"crows_refused"}],"lines":["wu|「好啊。」","他笑著，把一根烏鴉羽毛插進你的門縫，轉身走進雨裡。"]},{"text":"二十兩，不能再多","hint":"每週 −20 兩","fx":[{"flag":"crows_fee"},{"flag":"crows_fee_low"},{"rep":["crows",5]}],"lines":["他愣了一下，然後笑出聲來。","wu|「你比老戚會算。行，二十。下回殺價，記得別先眨眼。」"]}]},{"id":"m_wu_1b","phase":"night","day":[3,3],"priority":100,"req":[{"flag":"crows_fee_waived"}],"who":"wu","title":"自家人","lines":["打烊後有人敲門，三長一短。鴉巷的暗號，你從小就會。","wu|「聽說老戚的鋪子換了個鴉巷出來的。還真是你。」","wu|「自家人，規費免了。只是巷子裡的孩子，還在餓肚子。」"],"choices":[{"text":"塞他一袋米錢","hint":"−30 兩","fx":[{"cash":-30},{"rep":["crows",10]},{"flag":"crows_fee"}],"lines":["wu|「這才像鴉巷的人。」"]},{"text":"我現在是掌櫃","fx":[{"flag":"crows_fee"},{"rep":["crows",-5]}],"lines":["wu|「是是是，掌櫃的。」","他笑著，眼睛卻沒笑。"]}]},{"id":"m_candle_1","phase":"counter","day":[4,4],"priority":90,"req":[{"noflag":"candle_license"}],"who":"ming","title":"淨念許可","lines":["一個白袍年輕修士在門口收了傘，先對你行了一禮。","ming|「白燭會，明澄。新掌櫃開張，堂裡讓我來說說規矩。」","ming|「沾了殘念的東西，可以送去白燭堂。堂裡給賞銀，替亡者淨念。」","ming|「二級以上的重咒，沒有淨念許可，不得留在鋪子裡。」","ming|「許可六十兩。我知道不便宜……可重咒是真的會害死人。」"],"choices":[{"text":"買一張許可","hint":"−60 兩","fx":[{"cash":-60},{"flag":"candle_license"},{"rep":["candle",10]}],"lines":["他把蓋著白蠟印的許可遞過來，指尖冰涼。","ming|「願燭火照著您的門。」"]},{"text":"改天再說","fx":[],"lines":["ming|「那請您記得：重咒會挑人。最先挑的，往往是掌櫃。」"]}]},{"id":"m_candle_1b","phase":"counter","day":[4,4],"priority":90,"req":[{"flag":"candle_license"}],"who":"ming","title":"被劃掉的","lines":["一個白袍年輕修士進門，看清你的臉，腳步停住了。","ming|「我在堂裡的名冊上見過您。被劃掉的那一頁。」","ming|「您的淨念許可，堂裡沒有收回。主祭說，人走了，燭火不熄。」","ming|「重咒的東西，還是請送來白燭堂。賞銀照給。」"],"choices":[{"text":"替我謝謝主祭","fx":[{"rep":["candle",5]}],"lines":["ming|「……我會轉告。她記得您。」"]},{"text":"白燭堂與我無關","fx":[{"rep":["candle",-5]}],"lines":["ming|「是。可亡者的事，與誰都有關。」"]}]},{"id":"m_hidden","phase":"morning","day":[5,5],"priority":90,"who":"tan","title":"暗格","lines":["阿檀撬開灶台後一塊鬆動的磚，裡頭是個油布裹著的暗格。","tan|「老戚的。贓的、禁的、說不清來路的，他都往這兒塞。」","tan|「碑樓的兵隔三差五來翻鋪子。翻到就沒收、罰錢、記案卷。」","tan|「案卷記滿三筆，人就進碑樓的地牢。這也是老戚教的。」","tan|「鴉巷的孩子剛來報信：碑樓的人這兩天會往西街來。手腳快點。」"],"choices":[{"text":"把東西收進去","fx":[{"unlock":"hidden"},{"inspect":1}],"lines":["暗格不大，塞滿了也只能藏兩三件。","tan|「所以老戚常說：見不得光的，別貪多。」"]}]},{"id":"m_tan_cellar","phase":"night","day":[6,9],"chance":0.5,"priority":50,"who":"tan","title":"封條","lines":["打烊後，阿檀一直盯著廚房角落那扇矮門。門上貼著碑樓的封條。","tan|「老戚是死在下面的。碑樓說是強盜，貼了封條就走了。」","tan|「可強盜不會留下錢匣子。他們只拿走了老戚的命。」","tan|「這幾晚，下面一直有聲音。叮，叮，像有人在敲一口小鐘。」","tan|「撕封條是犯法的。可我想知道，他到底在下面藏了什麼。」"],"choices":[{"text":"撕了它","hint":"嫌疑上升","fx":[{"heat":5},{"unlock":"cellar"},{"queue":["m_cellar_find",1]},{"trust":["tan",5]}],"lines":["封條撕開的聲音，比你想的響。","tan|「明早再下去。晚上……我不行。」"]},{"text":"再等等","fx":[{"flag":"cellar_wait"}],"lines":["tan|「……也好。反正他也不會跑了。」"]}]},{"id":"m_tan_cellar2","phase":"night","day":[10,12],"chance":0.5,"priority":50,"req":[{"flag":"cellar_wait"}],"who":"tan","title":"封條","lines":["半夜，地窖又響了。這一回連你都聽見了：叮——很輕，拖得很長。","阿檀抱著被子站在你門口，臉白得像紙。","tan|「你也聽見了吧。我已經三個晚上沒睡了。」","tan|「撕不撕，你說了算。我只是……不想再一個人聽。」"],"choices":[{"text":"撕了它","hint":"嫌疑上升","fx":[{"heat":5},{"unlock":"cellar"},{"queue":["m_cellar_find",1]},{"trust":["tan",5]},{"unflag":"cellar_wait"}],"lines":["你撕下封條。門後的黑暗裡，那聲叮停了。","tan|「……它知道我們要下去了。」"]},{"text":"再等等","fx":[{"unflag":"cellar_wait"},{"flag":"cellar_wait2"},{"trust":["tan",-3]}],"lines":["tan|「行。那今晚你睡廚房，我睡前店。」"]}]},{"id":"m_cellar_find","phase":"morning","priority":80,"req":[{"room":"cellar"}],"who":"tan","title":"冕板","lines":["地窖很淺。磚縫裡的血沒刷乾淨，乾成了一條黑線。","阿檀舉著燈，手抖得燈影亂晃。她一步也沒往血跡那邊踩。","老戚的工具箱底下壓著一塊活石板。你撬開它，摸到一個油布包。","包裡是一副老花鏡，和一塊長方形的木板。","板面漆黑，底面朱紅，前後兩緣各鑽一排小孔，像原本該垂著什麼。","你的左眼猛地一刺。板子裡，有人在看你。","tan|「……那是什麼？為什麼它是冰的？」"],"choices":[{"text":"用油布包好","fx":[{"relic":["r1","player"]},{"item":{"t":"v_glasses","tier":1,"name":"老戚的老花鏡","tags":["qi"],"frag":"qi_1"}},{"note":"老戚死在地窖。他藏在石板底下的，是空冕的冕板。"},{"flag":"cellar_found"},{"unflag":"cellar_wait2"}],"lines":["tan|「這東西別擺在後庫。收進暗格，或者……就留在這下面。」","她說完就往樓梯上跑，連燈都忘了拿。"]}]},{"id":"m_after_r1","phase":"night","priority":70,"req":[{"read":"r1"}],"who":"tan","title":"鐘偈","lines":["你從記憶裡掙出來時，天已經黑了，手心全是冷汗。","阿檀背對著你在灶前燒水，嘴裡輕輕哼著什麼。","哼著哼著，調子裡長出了字。","tan|「一杵鐘，水向東，二杵鐘，燈火紅……」","她的聲音忽然斷了。水壺在灶上尖叫，她沒去提。","tan|「……這調子，從來沒有詞的。」"],"choices":[{"text":"問她在哪學的","fx":[{"note":"讀過冕板那晚，阿檀唱出一段偈：一杵鐘，水向東。她說是小時候聽來的——答得太快。"}],"lines":["tan|「小時候聽來的吧。忘了。」","她答得太快了，快得像早就準備好的。"]},{"text":"替她把水壺提下來","fx":[{"trust":["tan",6]}],"lines":["你什麼也沒問。她盯著灶火看了很久。","tan|「……謝了。」"]}]},{"id":"m_qin_1","phase":"counter","day":[10,13],"chance":0.5,"priority":60,"who":"qin","title":"首飾","lines":["一頂青呢小轎停在門口。僕婦撐著傘，下轎的女人一滴雨也沒沾。","qin|「金秤行，秦晚霜。欠我錢的人，我總要親眼看一看。」","qin|「老戚生前替我找東西：舊宮的首飾，拆散了的那一副。」","qin|「找到一件交給我，你帳上就少八百兩。來路，我不問。」","她的扇骨輕輕敲著櫃台，一下，一下，像在數你的心跳。","qin|「所以，掌櫃的——有沒有？」"],"choices":[{"text":"交出那塊冕板","req":[{"relic":"r1"}],"hint":"欠款 −800 兩","fx":[{"relic":["r1","scale"]},{"debt":-800},{"rep":["scale",20]}],"lines":["她看也沒看，就讓僕婦把它收進錦匣。","qin|「老戚眼光好。你也是。」"]},{"text":"沒有","fx":[{"rep":["scale",-5]}],"lines":["qin|「是嗎。那就等你有。我的帳，向來等得起。」"]},{"text":"妳要它們做什麼","fx":[{"note":"秦晚霜在收舊宮的首飾，一件抵債八百兩。她說，是為了聽一個人說話。"}],"lines":["扇子停了。她看著門外的雨，很久。","qin|「聽一個人說話。」"]}]},{"id":"m_armor_1","phase":"counter","day":[12,14],"chance":0.6,"priority":70,"req":[{"any":[{"relic":"r1"},{"relic_at":["r1","scale"]}]}],"who 」字，冰得扎手。"]}]},{"id":"m_tan_secret","phase":"night","priority":65,"req":[{"reads":2},{"trust":["tan",30]}],"who":"tan","title":"後門","lines":["阿檀把燈擱在你們中間，盯著燈芯看了很久。","tan|「十歲那年的事，我跟你說的，都只說了一半。」","tan|「那天夜裡，穿白袍的人進了院子。袍子白得刺眼。」","tan|「一個很高的師兄抱著我跑到後門，把我塞給一個雜役。」","tan|「他說：『別回頭。』我一隻草鞋掉在石階上，也沒敢回頭撿。」","tan|「那個雜役摀著我的嘴，一路跑到天亮。是老戚。」","tan|「掌櫃的……那種白袍，白燭堂的修士現在還穿著。」"],"choices":[{"text":"握住她的手","fx":[{"flag":"tan_secret"},{"trust":["tan",15]}],"lines":["她的手很冰，一直在抖。過了很久，才停。","tan|「說出來了。……原來說出來，是這種感覺。」"]},{"text":"那個師兄呢","hint":"心神 −5","fx":[{"flag":"tan_secret"},{"trust":["tan",15]},{"sanity":-5},{"note":"阿檀是鐘祀院的孩子。屠殺那夜，一個高個子師兄把她從後門交給老戚。殺人的穿白袍。"}],"lines":["tan|「他擋在門口。我最後聽見的，是撞門的聲音。」","tan|「一下，一下……後來就沒有了。」"]}]},{"id":"m_qin_2","phase":"counter","day":[18,26],"chance":0.3,"priority":55,"req":[{"any":[{"relics":1},{"flag":"armor_seen"}]}],"who":"qin","title":"沈硯","lines":["秦晚霜這回沒坐轎。她一個人站在門口，像是猶豫過要不要進來。","qin|「我有個兒子，叫沈硯。王都陷落那一夜，他在城裡。」","qin|「他父親出錢資助勤王軍。他卻穿著澐王的近衛甲，死在宮裡。」","qin|「十年了，我還是不知道，他是為誰死的。」","qin|「拾骨的若帶回他的東西——私印，或任何他帶在身上的——」","qin|「給我。價錢，你開。」"],"choices":[{"text":"我會留意","fx":[{"flag":"qin_son_quest"},{"trust":["qin",5]},{"note":"秦晚霜的兒子沈硯是澐王近衛，死在王都。她在找他的遺物，尤其是私印。"}],"lines":["qin|「……謝謝。」","她說完就走，像怕再多站一刻，就會說出別的。"]},{"text":"那得另外算錢","fx":[{"flag":"qin_son_quest"},{"rep":["scale",5]},{"trust":["qin",-5]},{"note":"秦晚霜的兒子沈硯是澐王近衛，死在王都。她在找他的遺物，尤其是私印。"}],"lines":["qin|「當然。我是生意人，你也是。」","她的聲音沒變，扇子卻收了起來。"]}]},{"id":"m_qin_signet","phase":"counter","once":false,"chance":0.6,"priority":60,"req":[{"has_tag":"shen"},{"flag":"qin_son_quest"},{"noflag":"qin_signet_given"}],"who":"qin","title":"沈家的記號","lines":["秦晚霜進門時，連傘都忘了收。","qin|「聽說你收了一件北邊回來的東西，上頭有沈家的記號。」","qin|「我不還價。你要多少？」","她的聲音很穩。只有捏著帕子的那隻手，指節白得發青。"],"choices":[{"text":"給她","hint":"欠款 −500 兩","fx":[{"take_tag":"shen"},{"debt":-500},{"rep":["scale",30]},{"flag":"qin_signet_given"}],"lines":["她接過去，用拇指一遍遍擦著上面的灰。","qin|「……是他的。」","她把它貼在臉上，很久都沒有動。"]},{"text":"我還想再讀讀它","fx":[],"lines":["qin|「好。我等了十年，不差這幾天。」","她走到門口，站了一會兒，才想起要撐傘。"]}]},{"id":"m_wu_heis rity":65,"once":true,"req":[{"flag":"li_confessed"},{"has_tag":"qi"},{"noflag":"read_r4"},{"noflag":"evidence_huo"}],"title":"對上了","lines":["你把老戚的老花鏡擱在燈下，旁邊是老厲那晚說過的話。","老厲說：那夜拉起水門閘的，是個說話很穩的年輕軍官。","老花鏡裡，一雙沒沾泥的軍靴，一個每個字都擺正了的聲音。","老戚扶正眼鏡，叫了他一聲：「水門的小霍。」","十年前打開水門的人，十年後走進了這間鋪子的地窖。","老戚認出了他。所以老戚死了。"],"choices":[{"text":"把它們鎖起來","fx":[{"flag":"evidence_huo"},{"note":"霍嶂就是當年打開水門的人，也是殺老戚的兇手。老厲的話和老花鏡，對得上。"}],"lines":["你吹熄了燈。黑暗裡，你才發現自己一直屏著氣。"]}]},{"id":"m_act2_end_b","phase":"night","day":[28,28],"priority":100,"who":"tan","title":"勤王碑","lines":["碑樓前的勤王碑又被擦得發亮，碑腳擺滿了白蠟燭。","碑上刻著開城元勛：守碑衛霍氏、金秤行沈氏、燭院諸公。","碑下有個說書的，正講到勤王軍夜破沉鐘城，滿街叫好。","阿檀聽了一會兒，忽然扯了扯你的袖子。","tan|「掌櫃的。勤王，勤的到底是哪一個王？」","城裡在數日子：離第五十六夜，還剩二十八天。"],"choices":[{"text":"回鋪子","fx":[{"act":3}],"lines":["回去的路上，你一直沒有回答她。"]}]},{"id":"m_act2_end","phase":"night","day":[28,30],"priority":99,"req":[{"reads":3}],"who":"tan","title":"不是勤王","lines":["那天夜裡，你把讀過的記憶一段一段，攤在櫃台上。","每一段，都是十年前那場亂的另一個角落。","每一個角落裡，都有人在動手。卻沒有一個人，在救王。","你想起勤王碑上那幾個名字。那一夜，他們要的從來不是救駕。","他們要的是冕。","這不是勤王。是政變。"],"choices":[{"text":"吹熄燈","fx":[{"act":3},{"flag":"act2_truth"},{"note":"灰冕之亂不是勤王，是政變。勤王碑上的開城元勛，就是當年奪冕的人。"}],"lines":["黑暗裡，阿檀小聲問了一句。","tan|「那我們手上這些東西……該交給誰？」","你答不出來。這一回，是真的答不出來。"]}]},{"id":"m_huo_2","phase":"counter","day":[30,34],"chance":0.4,"priority":6,"who":"huo","title":"最後通牒","req":[{"relics":1}],"lines":["霍嶂一個人來，沒帶兵。雨水順著鐵甲往下淌，在你門口積成一灘。","huo|「碎片在你這裡。幾件，我心裡有數。」","huo|「灰潮一次比一次大。鴉渡要的不是一間當鋪，是一支殺不死的兵。」","huo|「交給碑樓。不交，就照律辦。窩藏前朝禁物，你知道是什麼罪。」"],"choices":[{"text":"交出碎片","hint":"手上的碎片全歸碑樓","fx":[{"relic":["r1","watch"]},{"relic":["r2","watch"]},{"relic":["r3","watch"]},{"relic":["r4","watch"]},{"relic":["r5","watch"]},{"relic":["r6","watch"]},{"relic":["r7","watch"]},{"rep":["watch",30]},{"flag":"pledge_watch_early"},{"note":"碎片全交給了霍嶂。鐘夜，冕會戴在碑樓的人頭上。"}],"lines":["他一件一件收進鐵匣，每收一件，就在冊子上畫一筆。","huo|「你今天救了很多人。他們不會知道，我知道。」"]},{"text":"不交","hint":"嫌疑大增・明天搜鋪","fx":[{"heat":20},{"inspect":1},{"rep":["watch",-30]}],"lines":["huo|「好。」","他把帽簷上的水甩乾淨，像甩掉一件已經辦完的事。","huo|「明天碑樓的人會來。暗格自己打開，省得他們撬。」"]},{"text":"說水門的事","hideIfLocked":true,"hint":"守碑衛聲望大跌","req":[{"flag":"evidence_huo"},{"relic_at":["r4","watch"]}],"fx":[{"relic":["r4","player"]},{"flag":"huo_broken"},{"rep":["watch",-50]},{"note":"霍嶂認了：水門是他開的，老戚是他殺的。左瑱在我手上，鐘夜碑樓站我這邊。"}],"lines":["me|「雨夜，水門，閘是你拉的。老戚認出你，你就上門滅口。」","他沉默了很久，久到屋簷的雨停了，又下起來。","huo|「老戚認出我的那天，我就知道會有今天。」","他從懷裡取出左瑱，放在櫃上，推到你面前。","huo|「鐘夜，碑樓聽你的。之後你要怎麼辦我，我都認。」"]},{"text":"說水門的事","hideIfLocked":true,"hint":"守碑衛聲望大跌","req":[{"flag":"evidence_huo"},{"any":[{"relic_at":["r4","player"]},{"relic_at":["r4","crows"]},{"relic_at":["r4","scale"]},{"relic_at":["r4","candle"]},{"relic_at":["r4","armor"]},{"relic_at":["r4","ruins"]},{"relic_at":["r4","lost"]}]}],"fx":[{"flag":"huo_broken"},{"rep":["watch",-50]},{"note":"霍嶂認了：水門是他開的，老戚是他殺的。鐘夜，碑樓站我這邊。"}],"lines":["me|「雨夜，水門，閘是你拉的。老戚認出你，你就上門滅口。」","他沉默了很久，久到屋簷的雨停了，又下起來。","huo|「老戚認出我的那天，我就知道會有今天。」","huo|「左瑱早不在我手上。我剩下的，只有碑樓三百人。」","huo|「鐘夜，他們聽你的。之後你要怎麼辦我，我都認。」"]}]},{"id":"m_sulian_2","phase":"counter","day":[30,38],"chance":0.3,"priority":5,"who":"sulian","title":"白袍","req":[{"any":[{"read":"r2"},{"read":"r3"}]}],"lines":["素蓮來替一個餓死的孩子買薄棺，順口問你睡得好不好。","sulian|「你氣色很差。是那些東西夜裡吵你？」","她袖口繡著白燭紋。你在碎片裡見過一模一樣的紋，繡在燭院的白袍上。","她不知道。她點過的每一支燭，都以為是在替人止痛。"],"choices":[{"text":"把看見的告訴她","hideIfLocked":true,"hint":"耗神","req":[{"relic_at":["r3","candle"]}],"fx":[{"sanity":-8},{"flag":"sulian_turned"},{"rep":["candle",20]},{"relic":["r3","player"]},{"note":"素蓮知道了燭院屠殺鐘祀院的事。她把後旒交給了我。"}],"lines":["你把碎片裡看見的，一句一句說給她聽：白袍、燭火、倒下的僧人。","她起初搖頭，後來不搖了。","sulian|「金庫那件後旒，長老要我天天替它念淨念經。」","sulian|「原來我念了十年，是在替一本殺人的帳念經。」","第二天一早，她親手把後旒送來。袖口的燭紋被她剪掉了。"]},{"text":"把看見的告訴她","hideIfLocked":true,"hint":"耗神","req":[{"any":[{"relic_at":["r3","player"]},{"relic_at":["r3","watch"]},{"relic_at":["r3","scale"]},{"relic_at":["r3","crows"]},{"relic_at":["r3","armor"]},{"relic_at":["r3","ruins"]},{"relic_at":["r3","lost"]}]}],"fx":[{"sanity":-8},{"flag":"sulian_turned"},{"rep":["candle",20]},{"note":"素蓮知道了燭院屠殺鐘祀院的事。"}],"lines":["你把碎片裡看見的，一句一句說給她聽：白袍、燭火、倒下的僧人。"
