":"jiu"},{"trust":["jiu",30]}],"fx":[{"rep":["crows",-20]},{"trust":["jiu",10]},{"flag":"tan_raid_c"},{"roll":[0.75,"m_a3_tanc_ok","m_a3_tanc_bad"]}],"lines":["阿九把臉上的布拉高，聲音悶在布裡。","jiu|「鴉巷每一片瓦我都踩過。十一哥會恨死我。走吧。」"]},{"text":"答應烏十一","hint":"鐘夜要把空冕賣給他","fx":[{"pledge":"crows"},{"flag":"tan_rescued"},{"trust":["tan",5]},{"note":"為了阿檀，答應了烏十一：鐘夜把冕賣給北邊。"}],"lines":["你去了鴉巷。烏十一坐在屋頂上，像在等日出。","wu|「冕賣北邊，錢分鴉巷。你點頭，她現在就下來。」","你點了頭。阿檀從屋簷上被放下來，一句話都沒說。","回去的路上，她一直走在你前面，沒有回頭。"]}]},{"id":"m_a3_tanc_ok","phase":"night","priority":0,"who":"tan","title":"鴉巷","req":[{"flag":"tan_raid_c"},{"noflag":"tan_dead"}],"lines":["鴉巷的屋頂上打了一整夜。","天亮時他們把她帶回來，她肩上披著一件灰鴉會的舊斗篷。","tan|「有個小鬼一直偷塞饅頭給我。別讓他們打他。」","烏十一沒有追來。巷口的牆上，多了一隻炭畫的、翅膀折斷的烏鴉。"],"choices":[{"text":"把門閂上","fx":[{"unflag":"tan_raid_c"},{"flag":"tan_rescued"},{"trust":["tan",10]},{"rep":["crows",-10]},{"note":"阿檀從鴉巷救回來了。鴉巷記下了這筆帳。"}],"lines":["她把那件舊斗篷疊得整整齊齊，放在門邊。","tan|「哪天還回去。那小鬼冬天沒別的衣服。」"]}]},{"id":"m_a3_tanc_bad","phase":"night","priority":0,"title":"鴉巷","req":[{"flag":"tan_raid_c"},{"noflag":"tan_rescued"}],"lines":["鴉巷的屋頂上打了一整夜。","有人在屋簷上滑了一跤，一盞燈翻下去。火從巷頭燒到巷尾。","他們在燒塌的屋子底下找到她。她身下護著兩個鴉巷的孩子，都還活著。","烏十一站在灰燼裡，第一次沒有笑。","wu|「我只是要錢。……我只是要錢。」"],"choices":[{"text":"帶她回家","fx":[{"unflag":"tan_raid_c"},{"flag":"tan_dead"},{"flag":"tan_lost_crows"},{"sanity":-25},{"note":"阿檀死在鴉巷的火裡。她護住了兩個孩子。"}],"lines":["你揹她回西街。她很輕，輕得像一盞燈。","那兩個孩子跟在後面，一直跟到你的門口，誰趕都不走。"]}]},{"id":"m_truth","phase":"night","day":[36,50],"chance":0.3,"priority":5,"title":"告示柱","req":[{"reads":5}],"lines":["你把讀過的碎片一件一件攤在燈下，像攤開一本帳。","勤王是假的，叛亂是生意。當年拿刀的人，如今守著這座城。","渡口的告示柱上，貼著碑樓的告示：『灰冕之亂，忠義勤王。』","你磨好了墨。紙是現成的，膽子要自己找。"],"choices":[{"text":"寫下來，釘上去","hint":"嫌疑大增・守碑衛不滿","fx":[{"flag":"truth_told"},{"heat":20},{"rep":["watch",-20]},{"rep":["folk",20]},{"queue":["m_a3_post",1]},{"note":"我把碎片裡的真相寫下來，釘在渡口的告示柱上。"}],"lines":["你寫到天快亮。每個名字都寫了全名，每筆帳都寫了數目。","你把碑樓告示上的『勤王』劃掉，在旁邊寫了兩個字：『政變』。","釘子敲進柱子的時候，渡口有一隻烏鴉一直看著你。"]},{"text":"把紙收起來","hint":"耗神","fx":[{"sanity":-8}],"lines":["你把紙折好，壓在帳本底下。","活人要過日子。你這樣告訴自己。","那一夜，鋪子裡每一件遺物都沒睡。"]}]},{"id":"m_a3_post","phase":"morning","priority":6,"title":"告示柱","req":[{"flag":"truth_told"}],"lines":["天一亮，渡口的告示柱前擠了上百人。","識字的唸給不識字的聽。唸到『政變』兩個字，人群靜了。","碑樓的兵來撕告示。撕下一張，柱子背面還有一張。","到了中午，西街每家鋪子的門縫裡都塞了一份抄本。不是你抄的。","老鷂在骨棚門口喝了一整壺酒，只說了一句：","yao|「早該有人說。」"],"choices":[{"text":"開門","fx":[{"customers":3},{"rep":["guild",5]}],"lines":["那天來鋪子的人特別多。有幾個什麼都沒買，只是來看看你長什麼樣子。"]}]},{"id":"m_countdown","phase":"morning","day":[46,46],"priority":10,"title":"距鐘夜十日","lines":["早上，澐水退了三尺。","渡口的老船夫說他撐了六十年船，沒見過水這樣退，像底下有東西在吸。","昨夜有人聽見水底傳來鐘聲。一聲，很長，長到聽的人忘了自己在數。","骨棚門口掛出一塊木牌，老鷂親手寫的：距鐘夜，十日。","西街有人收拾細軟往南走。更多人沒走，因為沒地方可走。"],"choices":[{"text":"卸門板，開張","fx":[{"act":4},{"note":"距鐘夜十日。四方都會來開最後一次價。"}],"lines":["你把門板一塊一塊卸下來。今天，還是得做生意。"]}]},{"id":"m_fin_watch","phase":"counter","day":[48,52],"chance":0.4,"priority":5,"who":"huo","title":"碑樓的價","req":[{"noflag":"huo_broken"},{"relics":1}],"lines":["霍嶂來了。兩排碑兵站在門外淋雨，沒有一個人動。","huo|「鐘夜，碑樓三百人守渡口。守不守得住，看冕戴在誰頭上。」","huo|「交給我。碑樓不再查你，誰也不會再從你鋪子裡被帶走。」","huo|「之後碑樓的刀、甲、糧，全從你這裡進。一輩子。」","huo|「死人已經死了。我要的，是活人活下來。」"],"choices":[{"text":"答應你","hint":"鐘夜要把空冕交給他","fx":[{"pledge":"watch"},{"heat":-40},{"rep":["watch",20]},{"note":"答應了霍嶂：鐘夜把冕交給碑樓。"}],"lines":["他當著你的面，把碑樓查你的那疊公文丟進火盆，看著它燒完。","huo|「鐘夜見。」"]},{"text":"死人也要說話","fx":[{"rep":["watch",-10]},{"heat":5}],"lines":["huo|「那就讓他們說。看他們說完，能不能替你擋灰潮。」","碑兵在門外站到天黑，沒有進來，也沒有走。"]}]},{"id":"m_fin_watch_b","phase":"counter","day":[48,52],"chance":0.4,"priority":5,"who":"guard","title":"一句話","req":[{"flag":"huo_broken"}],"lines":["一個年輕的碑兵在門口站了很久，才進來。","guard|「都尉要我帶一句話，一字不改。」","guard|「『水門是我開的。這一次，我站在門外。』」","他放下一塊碑樓的鐵令牌，敬了個禮，走了。"],"choices":[{"text":"收下令牌","fx":[{"rep":["watch",10]},{"note":"霍嶂捎話：鐘夜，碑樓站在門外，站在我這邊。"}],"lines":["令牌背面刻過一個名字，被人用刀刮掉了，只剩半個『霍』字。"]}]},{"id":"m_fin_candle","phase":"counter","day":[48,53],"chance":0.4,"priority":5,"who":"sulian","title":"七支燭","req":[{"noflag":"sulian_turned"},{"relics":1}],"lines":["素蓮帶來一籃白燭，一支一支擺在你櫃上，擺了七支。","sulian|「一支一件。鐘夜那晚，把它們交給白燭會封起來。」","sulian|「死人已經痛了十年。讓他們睡，讓活人也睡。」","sulian|「你那支死在枯河的隊，我替他們做一場淨念。你夜裡聽見的，會停。」"],"choices":[{"text":"交給白燭會","hint":"鐘夜要把空冕交給她","fx":[{"pledge":"candle"},{"sanity":30},{"rep":["candle",15]},{"note":"答應了素蓮：鐘夜把冕交給白燭會封起來。"}],"lines":["那一晚，她在你後院替白燈隊點了三支燭。","你沒有做夢。兩年來，第一次。"]},{"text":"他們話還沒說完","fx":[{"rep":["candle",-10]}],"lines":["sulian|「話說完了，就不痛了嗎？」","她把七支白燭留下，沒有收走。"]}]},{"id":"m_fin_candle_b","phase":"counter","day":[48,53],"chance":0.4,"priority":5,"who":"sulian","title":"灰布","req":[{"flag":"sulian_turned"},{"relics":1}],"lines":["素蓮瘦了一圈。袖口剪掉燭紋的地方，縫了一塊灰布。","sulian|「鐘夜那天，我會在白燭堂前，把燭院的帳唸給全城聽。」","sulian|「然後把冕給我。我把它封進堂底，用這條命看著它。」","sulian|「誰都別再用它。霍嶂不行，北邊不行，你也不行。」","sulian|「死人會一直痛。那是我們欠的，我陪他們痛。」"],"choices":[{"text":"交給你封","hint":"鐘夜要把空冕交給她","fx":[{"pledge":"candle"},{"rep":["candle",20]},{"note":"答應了素蓮：鐘夜把冕交給她封進白燭堂。她會把燭院的帳唸給全城聽。"}],"lines":["她點點頭，沒有道謝。","sulian|「我點了一輩子燭。這是第一次，我知道自己在點什麼。」"]},{"text":"欠的該用鐘聲還","fx":[{"rep":["candle",-5]}],"lines":["sulian|「鐘聲……我連它是什麼聲音都不知道。」","她笑了一下，笑得很難看。","sulian|「那你讓我聽一次。」"]}]},{"id":"m_fin_scale","phase":"counter","day":[49,54],"chance":0.4,"priority":5,"who":"qin","title":"木匣","req":[{"noflag":"qin_knows_son"},{"relics":1}],"lines":["秦晚霜沒帶算盤先生。她自己提著一只木匣進來。","qin|「匣子裡是你的借據，和金秤行在西街三間鋪面的地契。」","qin|「鐘夜把冕交給我，匣子歸你。今天先付一千兩，當誠意。」","qin|「我不要權，不要兵。我只想聽一個死人說一句話。」","她說『死人』兩個字的時候，聲音很穩，穩得像練過。"],"choices":[{"text":"成交","hideIfLocked":true,"hint":"鐘夜要把空冕交給她","req":[{"noflag":"paid_off"}],"fx":[{"pledge":"scale"},{"debt":-1000},{"rep":["scale",15]},{"note":"答應了秦晚霜：鐘夜把冕交給她。她先撕了一千兩的借據。"}],"lines":["她從匣裡抽出一千兩的借據，當著你的面撕了。","qin|「剩下的，鐘夜之後。」"]},{"text":"成交","hideIfLocked":true,"hint":"鐘夜要把空冕交給她","req":[{"flag":"paid_off"}],"fx":[{"pledge":"scale"},{"cash":1000},{"rep":["scale",15]},{"note":"答應了秦晚霜：鐘夜把冕交給她。她先付了一千兩。"}],"lines":["她從匣裡數出一千兩銀票，壓在你的算盤底下。","qin|「剩下的，鐘夜之後。」"]},{"text":"不賣","fx":[{"rep":["scale",-10]}],"lines":["qin|「那就照舊。」","她走到門口停了一下，沒有回頭。","qin|「你會後悔。我也會。」"]}]},{"id":"m_fin_scale_b","phase":"counter","day":[49,54],"chance":0.4,"priority":5,"who":"qin","title":"娘","req":[{"flag":"qin_knows_son"},{"relics":1}],"lines":["秦晚霜一進門，先看門口。黃昏還沒到，那具甲還沒來。","qin|「我問過了。冕戴在鐘下，死人能說話，能站起來，能留下。」","qin|「借據、地契、金秤行三成的股，全給你。只要他親口跟我說一句話。」","qin|「我算過了，這筆帳不划算。我不在乎。」"],"choices":[{"text":"成交","hideIfLocked":true,"hint":"鐘夜要把空冕交給她","req":[{"noflag":"paid_off"}],"fx":[{"pledge":"scale"},{"debt":-1500},{"cash":500},{"rep":["scale",20]},{"note":"答應了秦晚霜：鐘夜把冕交給她，讓她再聽沈硯說一句話。"}],"lines":["她撕借據的手在抖，撕了兩次才撕開。","qin|「別告訴他，他娘求過人。」"]},{"text":"成交","hideIfLocked":true,"hint":"鐘夜要把空冕交給她","req":[{"flag":"paid_off"}],"fx":[{"pledge":"scale"},{"cash":2000},{"rep":["scale",20]},{"note":"答應了秦晚霜：鐘夜把冕交給她，讓她再聽沈硯說一句話。"}],"lines":["她數銀票的手在抖，數錯了兩次。","qin|「別告訴他，他娘求過人。」"]},{"text":"他不該被叫回來","fx":[{"rep":["scale",-10]}],"lines":["她看著你很久，像在估一件看不出真假的貨。","qin|「你說得對。可我是他娘。」"]}]},{"id":"m_fin_crows","phase":"counter","day":[50,55],"chance":0.4,"priority":5,"who":"wu","title":"北邊的價","req":[{"noflag":"tan_lost_crows"},{"relics":4}],"lines":["烏十一翻窗進來，坐上你的櫃台，兩條腿晃啊晃。","wu|「北原汗國的人到了，船停在對岸。他們的價，我唸給你聽。」","wu|「一輩子花不完的銀子。還有船票，鴉巷一百三十個孩子，一人一張，往南。」","wu|「鴉渡會怎樣？誰管。這城從來沒管過我們。」","他把一袋銀子擱在你手邊：「訂金。」"],"choices":[{"text":"成交","hint":"鐘夜要把空冕賣給他","fx":[{"pledge":"crows"},{"cash":1200},{"rep":["crows",20]},{"note":"答應了烏十一：鐘夜把冕賣給北原汗國。訂金收了。"}],"lines":["wu|「爽快。」","他翻出窗口，又探回頭來：「船票，我也替你留一張。」"]},{"text":"鴉渡還有人要活","fx":[{"rep":["crows",-10]}],"lines":["wu|「誰？碑樓底下討飯的那些？他們活著的時候，誰管過？」","他把銀袋收回去，笑嘻嘻的。眼睛沒笑。"]}]},{"id":"m_fin_crows_b","phase":"counter","day":[50,55],"chance":0.4,"priority":5,"who":"wu","title":"北邊的價","req":[{"flag":"tan_lost_crows"},{"relics":4}],"lines":["烏十一這次走正門。他在門檻外站了一會，才跨進來。","wu|「那兩個孩子，我送上船了。先走的。」","wu|「北原的價還在。一輩子的銀子，剩一百二十八張船票。」","wu|「我欠你一條命。這筆生意，我不賺你一文。」"],"choices":[{"text":"成交","hint":"鐘夜要把空冕賣給他","fx":[{"pledge":"crows"},{"cash":1200},{"rep":["crows",20]},{"note":"答應了烏十一：鐘夜把冕賣給北原汗國。"}],"lines":["他把銀袋放下，沒有像平常那樣笑。","wu|「船開那天，我讓那兩個孩子替她磕個頭。」"]},{"text":"鴉渡還有人要活","fx":[{"rep":["crows",-5]}],"lines":["wu|「也對。她也是為了這城裡的人。」","他把銀袋收回懷裡，從正門走了。"]}]},{"id":"m_fin_tan","phase":"night","day":[50,54],"chance":0.4,"priority":7,"who":"tan","title":"鐘偈","req":[{"noflag":"tan_dead"},{"flag":"tan_secret"},{"reads":5}],"lines":["半夜，阿檀坐在後院井邊，一直沒睡。","tan|「掌櫃的，我想起來了。整首。」","她小聲唱：「一杵鐘，水向東，二杵鐘，燈火紅，三杵鐘聲過橋去，橋上的人莫回頭。」","tan|「放下手裡那盞燈，放下心上那個名，你走的路我替你記，你沒說完的，我替你聽。」","tan|「老戚說這是哄小孩睡覺的。不是。這是在哄死人。」","tan|「鐘夜讓我唱。鐘響了，這些東西就只是東西，鋪子大概也得關。」"],"choices":[{"text":"那就唱","hint":"鐘夜要讓她在鐘下唱","fx":[{"pledge":"bell"},{"trust":["tan",10]},{"note":"阿檀想起了整首鐘偈。鐘夜，她要在鐘下唱。"}],"lines":["tan|「先說好，唱完了你得給我加工錢。」","她說完把臉埋進膝蓋裡，肩膀抖了很久。"]},{"text":"還不確定","lines":["tan|「嗯。我等你。」","她起身回房，走到門口又回頭。","tan|「別等太久。水退得很快。」"]}]},{"id":"m_fin_self","phase":"night","day":[52,54],"chance":0.4,"priority":6,"title":"空冕","req":[{"relics":4}],"lines":["夜裡你醒來，碎片全在你床頭，排成一個圈。你記得你把它們鎖好了。","圈的正中，剛好空出一顆頭的大小。","有人在你耳邊說話。是花椒的聲音，帶著辣椒乾的味道。","那聲音說：「戴上它，你就聽得見我們。所有的人。你不用再一個人逃了。」","花椒活著的時候，從來不會這樣求人。可是這聲音太像了。"],"choices":[{"text":"伸手去拿","hint":"鐘夜要自己戴上空冕","fx":[{"pledge":"self"},{"sanity":10},{"note":"碎片要我自己戴上空冕。我沒有拒絕。"}],"lines":["你把碎片捧在手上，聲音就停了。","很安靜，安靜得像睡著。你這才發現，你已經很久沒這樣安靜過。"]},{"text":"一件件鎖回去","hint":"耗神","fx":[{"sanity":-10}],"lines":["你一件一件放回去。那個聲音一路求你，用花椒的語氣，叫你的小名。","最後一件鎖好，你坐在床邊，一直坐到天亮。"]}]},{"id":"m_fin_eve","phase":"night","day":[55,55],"priority":10,"title":"鐘夜前夕","lines":["鐘夜前一晚，鴉渡沒有人睡。","碑樓的燈一夜沒熄。骨棚裡，拾骨人排著隊磨刀，沒人說話。","白燭堂的門開著，裡頭點滿了燭，看不見人。","金秤行的帳房亮著燈。秦晚霜坐在燈下，沒有在算帳。","鴉巷的孩子們坐在屋頂上，看著對岸北原人的燈火。","算盤先生來了一趟，把你下個月的帳本放在櫃上，說：「萬一呢。」"],"choices":[{"text":"去後院找阿檀","hideIfLocked":true,"req":[{"noflag":"tan_dead"}],"fx":[{"trust":["tan",5]},{"sanity":10}],"lines":["她在修一盞燈，修好了又拆，拆了又修。","tan|「明天要用的。不能出錯。」","你在她旁邊坐下，替她遞銅釘，一直遞到天亮。"]},{"text":"去她房裡坐坐","hideIfLocked":true,"req":[{"flag":"tan_dead"}],"fx":[{"sanity":5}],"lines":["她的房間還是她走那天的樣子。床底下有一只修到一半的銅鈴。","你把鈴修好了。修得很醜，響得很好聽。"]},{"text":"去骨棚喝一杯","fx":[{"rep":["guild",10]},{"sanity":5}],"lines":["老鷂用他僅剩的那隻手，把一碗酒推過來。","yao|「明天還能回來喝的，酒錢都記我的。」","那一晚，骨棚裡的人都喝得很慢。"]},{"text":"一個人去渡口","fx":[{"sanity":15}],"lines":["澐水快見底了。九口鐘的頂在月光下露出來，像九座墳。","你在渡口站到天亮。風裡有鐘聲，你一聲一聲數著，沒有數錯。"]}]},{"id":"f_watch_recruit","phase":"counter","day":[4,12],"chance":0.3,"priority":-1,"who":"guard","title":"第一把劍","lines":["少年兵的皮甲是新的，劍鞘是空的，帽帶繫了兩次才繫牢。","guard|「我叫孟小滿，入伍第九天。我想買把劍，我有二十二兩。」","他說話的時候，眼睛往後庫的門簾溜了三次。","tan|「掌櫃的，二十二兩，只買得到架上那把淬火沒淬透的。」"],"choices":[{"text":"賒他把結實的","hint":"一兩現銀也收不到","fx":[{"rep":["watch",2]},{"heat":-4},{"flag":"kid_good"}],"lines":["他捧著劍，像捧著一碗熱湯。","guard|「錢我月月還。隊正叫我看你後庫……我就說，只看見劍。」"]},{"text":"賣他便宜那把","hint":"+22 兩","fx":[{"cash":22},{"flag":"kid_cheap"}],"lines":["劍身亮得能照人。你知道，它的芯是軟的。","guard|「謝謝掌櫃的！我娘說，有了劍，就是大人了。」"]},{"text":"叫他別亂看","fx":[{"heat":3}],"lines":["他漲紅了臉，把錢收回懷裡。","出門前，他又回頭看了門簾一眼，在袖子裡抄了兩行字。"]}]},{"id":"f_watch_kid_back","phase":"counter","day":[21,30],"req":[{"flag":"kid_good"},{"flag":"tide_1"}],"chance":0.35,"priority":-1,"who":"guard","title":"沒斷","lines":["孟小滿的皮甲多了三道口子，左手吊在胸前，劍還掛在腰上。","guard|「灰潮那晚，我們一伍十個人，回來四個。」","guard|「劍崩了一個口，可是沒斷。掌櫃的，它沒斷。」","他把一包碎銀放上櫃台，數了兩遍，一枚不少。"],"choices":[{"text":"收下","hint":"+60 兩","fx":[{"cash":60},{"rep":["watch",3]},{"heat":-12}],"lines":["guard|「還有，搜鋪的名冊是我抄的。戚記，我挪到最後一頁了。」"]},{"text":"錢留著養傷","fx":[{"rep":["watch",5]},{"rep":["folk",3]},{"heat":-12}],"lines":["他愣了很久，才把錢收回去，鞠了一個很深的躬。","guard|「搜鋪的名冊是我抄的。戚記，我挪到最後一頁了。」"]}]},{"id":"f_watch_kid_mother","phase":"morning","day":[21,30],"req":[{"flag":"kid_cheap"},{"flag":"tide_1"}],"chance":0.35,"priority":-1,"title":"斷劍","lines":["開門時，台階上坐著一個婦人，膝上一個布包，包得很仔細。","布包裡是半截劍。斷口灰白，淬火沒淬透的鐵，斷了就是這個顏色。","「小滿說，劍是在西街買的。灰潮那晚，一砍就斷了。」","「掌櫃的，斷劍你們收嗎？我想給他買口棺材。」"],"choices":[{"text":"給她八十兩","hint":"−80 兩","fx":[{"cash":-80},{"rep":["folk",4]},{"sanity":-4}],"lines":["她不肯收。你說是劍錢，她就收了，像是信了。"]},{"text":"按廢鐵，三兩","hint":"−3 兩","fx":[{"cash":-3},{"sanity":-8}],"lines":["她接過三兩銀子，跟你道了謝。","你把斷劍丟進廢鐵堆。它在裡面響了很久。"]},{"text":"告訴她實話","hint":"街坊的口碑","fx":[{"rep":["folk",-6]},{"rep":["watch",-4]},{"heat":5},{"sanity":4}],"lines":["她聽完，沒有哭，也沒有罵。她把斷劍重新包好，帶走了。","第二天，整條西街都知道了。"]}]},{"id":"f_watch_levy","phase":"morning","day":[40,48],"req":[{"mode":"story"}],"chance":0.3,"priority":-1,"title":"守渡銀","lines":["碑樓的告示貼上了你的門板，墨還沒乾：鐘夜將至，西街每鋪繳守渡銀二百兩。","guard|「都尉的令。銀子拿去買油、買箭、修渡口的柵欄。」","guard|「不繳的，當場點貨，點到哪件算哪件。」"],"choices":[{"text":"繳","hint":"−200 兩","fx":[{"cash":-200},{"rep":["watch",8]},{"rep":["folk",3]},{"heat":-10}],"lines":["他在冊子上替你畫了個圈。","那天下午，渡口的柵欄多釘了一排木樁，木頭還是新的。"]},{"text":"搬出都尉的名號","req":[{"flag":"huo_ally"}],"fx":[{"rep":["folk",-4]}],"lines":["guard|「都尉的人？……那，打擾了。」","他去了隔壁。隔壁的寡婦，當了她丈夫留下的刀。"]},{"text":"塞他五十兩","hint":"−50 兩，嫌疑 +5","fx":[{"cash":-50},{"heat":5},{"rep":["watch",-2]}],"lines":["銀子進了他的袖子。你那一份，記到了別人頭上。"]},{"text":"一兩也不繳","fx":[{"rep":["watch",-10]},{"inspect":1}],"lines":["guard|「好。那就點貨。」他朝街口招了招手。"]}]},{"id":"f_crow_crate","phase":"night","day":[4,11],"chance":0.3,"priority":-1,"title":"北邊的貨","lines":["打烊後，後門響了，三短一長。","crow|「鴉巷送貨。北原的駝隊在沉鐘原的路上翻了，東西沒人認領。」","箱子裡是一把北原匕首、一只玉佩，還有一封沒拆封的家書。","crow|「整箱六十兩。不問來路，不開收據。」"],"choices":[{"text":"收了","hint":"−60 兩，整箱都是贓貨","fx":[{"cash":-60},{"rep":["crows",4]},{"flag":"crate_bought"},{"item":{"t":"w_dagger","tier":2,"prov":"stolen","tags":["foreign"]}},{"item":{"t":"v_jade","tier":1,"prov":"stolen","tags":["foreign"]}},{"item":{"t":"v_letter","tier":1,"prov":"stolen","tags":["foreign"]}}],"lines":["他把箱子推進門，人就不見了，像從沒來過。","家書的封口上，蓋著一個你不認得的北原字。"]},{"text":"不要","fx":[{"rep":["crows",-2]}],"lines":["crow|「行。下回有好貨，先敲別人家的門。」"]},{"text":"去碑樓報信","hint":"灰鴉會記仇","fx":[{"rep":["crows",-12]},{"rep":["watch",6]},{"heat":-6}],"lines":["第二天，碑樓在鴉巷抓了兩個半大的孩子。","從此，你的後門再也沒響過三短一長。"]}]},{"id":"f_forgery","phase":"counter","day":[8,20],"req":[{"rep":["crows",0]}],"chance":0.25,"priority":-1,"who":"wu","title":"鴉巷的手藝","lines":["烏十一進門，先把濕透的帽子掛上你的劍架，像回自己家。","wu|「聽說你眼睛毒。眼睛毒的人，手也該巧。」","他攤開一個布包：刻刀、墨紙、一小罐泡著銅錢的醋。","wu|「新銅做舊，白玉養黃，贓貨配一套乾淨的來歷。鴉巷的手藝，我教你。」","wu|「學費不收錢。哪天我開口，你幫我一次。」"],"choices":[{"text":"成交","hint":"欠他一次","fx":[{"unlock":"forgery"},{"rep":["crows",6]},{"flag":"wu_favor"}],"lines":["他教了你一整個下午，臨走把醋罐留下了。","wu|「做舊的訣竅是耐心。跟騙人一樣。」"]},{"text":"付錢，不欠人情","hint":"−120 兩","fx":[{"cash":-120},{"unlock":"forgery"},{"rep":["crows",2]}],"lines":["wu|「嘖，生分。」","他收了錢，教得一樣仔細，連醋要泡幾天都說了。"]},{"text":"這種事我不碰","fx":[{"rep":["crows",-3]}],"lines":["wu|「也好。乾淨的人在鴉渡活不久，可是死得好看。」"]}]},{"id":"f_nightmarket","phase":"night","day":[12,24],"chance":0.25,"priority":-1,"title":"夜市擺過來了","lines":["半夜，鴉巷那頭的燈籠一路擺到了西街口。","tan|「夜市往這邊擺了。灰潮一近，白天見不得人的東西就多。」","一個貨郎挑著擔子停在你後門，擔子上蓋著油布。","crow|「以後天亮前，我在你這兒停一停。你缺的我有，你燙手的我收。」"],"choices":[{"text":"就這麼辦","hint":"嫌疑 +4","fx":[{"unlock":"nightmarket"},{"rep":["crows",4]},{"heat":4}],"lines":["他掀起油布一角讓你看：刀、玉、白灰，還有一顆用布包著的頭骨。","crow|「明天見。老規矩，三短一長。」"]},{"text":"規費我照繳的","req":[{"flag":"crows_fee"}],"fx":[{"unlock":"nightmarket"},{"rep":["crows",6]}],"lines":["crow|「繳規費的，自己人。」","他咧嘴一笑，把最好的貨挪到了最上面。"]},{"text":"別停我門口","fx":[{"rep":["crows",-3]}],"lines":["貨郎聳聳肩走了。燈籠一盞一盞，從你門前流過去。"]}]},{"id":"f_crow_kid","phase":"night","day":[25,36],"req":[{"flag":"wu_favor"}],"chance":0.3,"priority":-1,"title":"人情","lines":["烏十一從後門閃進來，背上背著一個十一二歲的孩子。","孩子腿上插著半截弩箭，手裡還攥著一把碑樓馬廄的豆料。","wu|「偷馬料。碑樓說要吊在渡口，殺雞給猴看。」","wu|「藏他三夜。你欠我的，就兩清。」","巷口有燈籠晃過來，還有甲片碰撞的聲音。"],"choices":[{"text":"藏三夜","hint":"嫌疑 +12","fx":[{"heat":12},{"rep":["crows",12]},{"unflag":"wu_favor"}],"lines":["你把孩子塞進後庫最裡面的木箱。守碑衛在門口站了很久，走了。","第三夜，烏十一把人背走，只說了兩個字。","wu|「記著。」"]},{"text":"這人情我不還","fx":[{"rep":["crows",-15]}],"lines":["烏十一看了你很久，笑了。","wu|「行。那你就欠著，欠到死。」","他背著孩子，翻過你的後牆走了。"]},{"text":"等他走，去報信","hint":"灰鴉會不會忘","fx":[{"rep":["crows",-30]},{"rep":["watch",10]},{"heat":-10},{"sanity":-6},{"unflag":"wu_favor"}],"lines":["天亮前，守碑衛從你後庫拖出一個孩子。孩子沒有喊，只是一直看著你。","烏十一後來還是會來做生意，只是再也不坐了。"]}]},{"id":"f_crow_boat","phase":"morning","day":[44,53],"req":[{"mode":"story"}],"chance":0.3,"priority":-1,"who":"wu","title":"船錢","lines":["天沒亮，烏十一坐在你門檻上，身邊擠著七八個孩子，一人抱一個包袱。","wu|「鐘夜之前，我要把鴉巷的孩子全送上船，順水往東。下游有人接。」","wu|「船家看灰潮要來，船錢漲了三倍。我還差四百兩。」","最小的那個孩子懷裡揣著一隻烏鴉，烏鴉跟他一樣，一聲不吭。","wu|「我這輩子沒求過人。這回，算我求你。」"],"choices":[{"text":"四百兩，拿去","hint":"−400 兩","fx":[{"cash":-400},{"rep":["crows",20]},{"rep":["folk",4]},{"flag":"crow_boat"}],"lines":["孩子們排著隊從你面前走過，每個都鞠了一躬，鞠得歪歪扭扭。","wu|「這份情，鴉巷記一輩子。」"]},{"text":"只拿得出一百五","hint":"−150 兩","fx":[{"cash":-150},{"rep":["crows",6]}],"lines":["烏十一把銀子掂了掂。","wu|「夠送一半。」他想了想，「先送小的。」"]},{"text":"我也沒錢","fx":[{"rep":["crows",-5]}],"lines":["烏十一點點頭，什麼也沒說，帶著孩子們走進雨裡。","那天下午，你聽說他把自己的刀當了。當在別家。"]}]},{"id":"f_candle_alms","phase":"counter","day":[5,13],"chance":0.3,"priority":-1,"who":"monk","title":"一兩一片瓦","lines":["年輕修士捧著募款簿進門，袍角全是泥。","monk|「白燭堂收容所的屋頂塌了一角，十七個老人睡在雨裡。」","募款簿第一頁寫著：金秤行三百兩，碑樓二百兩。字都寫得很大。","monk|「不拘多少。主祭說，一兩銀子，就是一片瓦。」"],"choices":[{"text":"捐五十兩","hint":"−50 兩","fx":[{"cash":-50},{"rep":["candle",6]},{"rep":["folk",3]}],"lines":["他在簿子上一筆一畫寫下{shop}，寫得比金秤行小，也比金秤行慢。"]},{"text":"捐二十兩","hint":"−20 兩","fx":[{"cash":-20},{"rep":["candle",2]}],"lines":["monk|「二十片瓦，夠蓋住一張床。」","他道謝道得很認真，像收到的是兩百兩。"]},{"text":"不捐","fx":[{"rep":["candle",-3]}],"lines":["他合上簿子，跟你道了聲平安，去了隔壁。"]}]},{"id":"f_brewing","phase":"morning","day":[10,22],"chance":0.25,"priority":-1,"title":"藥婆","lines":["開門前，一個駝背老婆婆已經提著藥箱等在門口，一身燭蠟和苦艾味。","「白燭堂施藥的，大家叫我藥婆。你這裡收不收屍菌草？」","她看了一眼你的貨架，嘖了一聲：「賣刀賣甲，不賣藥。」","「死在毒霧裡的拾骨人，比死在刀下的多。堂裡配不過來，你要學，我教。」"],"choices":[{"text":"跟她學","hint":"−60 兩，藥材本錢","fx":[{"cash":-60},{"unlock":"brewing"},{"rep":["candle",4]}],"lines":["她教你怎麼把屍菌草曬到不要命，又怎麼讓蠟跟香不打架。","「聖水別碰。沒有淨念許可，碑樓會說你造假。」"]},{"text":"先替堂裡做事","hint":"心神 −8","fx":[{"unlock":"brewing"},{"rep":["candle",6]},{"rep":["folk",2]},{"sanity":-8}],"lines":["那七個晚上，你在收容所替垂死的人換藥。有兩個沒撐過去。","第八天早上，藥婆把她的研缽塞給你：「行了，手穩了。」"]},{"text":"不學","lines":["藥婆聳聳肩：「那就多賣幾副面具吧。」她提著藥箱走了。"]}]},{"id":"f_candle_doll","phase":"counter","day":[18,32],"req":[{"alive":"tan"}],"chance":0.3,"priority":-1,"who":"monk","title":"燒不得","lines":["白燭修士把一只布偶放上櫃台，只用兩根手指，像怕燙。","monk|「堂裡焚燒詛咒物，燒到它，它哭了。哭得整座焚爐都在響。」","monk|「主祭說，孩子的念最重，燒不得。請掌櫃的替堂裡收著，收到它哭完。」","布偶少了一隻眼睛，肚子上用紅線歪歪地縫了一個『安』字。"],"choices":[{"text":"收著","hint":"它會哭","fx":[{"item":{"t":"v_doll","tier":1,"curse":["whisper",2],"tags":["child"]}},{"rep":["candle",6]},{"trust":["tan",3]}],"lines":["阿檀翻出一顆舊鈕扣，替它把少掉的那隻眼睛縫上。","tan|「少一隻眼睛，看東西不齊，難怪哭。」","那天夜裡，布偶只哭了一下，像在試新眼睛。"]},{"text":"收，但要算錢","hint":"+40 兩","fx":[{"cash":40},{"item":{"t":"v_doll","tier":1,"curse":["whisper",2],"tags":["child"]}},{"rep":["candle",-2]}],"lines":["monk|「……主祭說過，你是生意人。」他數了四十兩給你。","那天夜裡布偶哭了一整夜。阿檀蒙著棉被，也罵了你一整夜。"]},{"text":"不收","fx":[{"rep":["candle",-3]}],"lines":["修士嘆了口氣，把布偶揣回懷裡。","他出門時，你聽見他懷裡很輕地，抽了一下鼻子。"]}]},{"id":"f_candle_robe","phase":"counter","day":[33,50],"req":[{"mode":"story"}],"chance":0.3,"priority":-1,"who":"monk","title":"不贖","lines":["一個很老的白燭修士，把一件發黃的白袍疊在櫃台上，疊得方方正正。","monk|「我年輕時穿的，那時白燭會還叫燭院。我想當了它，不贖了。」","monk|「聽說你看得見死人最後在想什麼。我殺過的那些人，最後在想什麼？」","白袍的袖口洗過很多次，還是有一圈褐色，洗不掉。"],"choices":[{"text":"讀給他聽","hint":"心神 −12","fx":[{"sanity":-12},{"item":{"t":"a_robe","tier":3,"curse":["blood",2],"tags":["church"]}},{"note":"燭院的老兵說，當年他們殺的，是一院子唱著偈的僧人。"}],"lines":["你看見一座有鐘的院子，穿灰衣的僧人一個接一個倒下，嘴裡都在唱。","me|「他們在唱歌。到最後一個，都在唱。」","老人點點頭，把白袍留下，沒要錢。"]},{"text":"讓阿檀來答","req":[{"alive":"tan"},{"flag":"tan_secret"}],"fx":[{"trust":["tan",5]},{"sanity":-4},{"rep":["candle",-2]},{"item":{"t":"a_robe","tier":3,"curse":["blood",2],"tags":["church"]}},{"note":"燭院的老兵說，當年他們殺的，是一院子唱著偈的僧人。"}],"lines":["阿檀從後堂走出來，看了那件白袍很久。","tan|「他們在唱歌。我那年十歲，被人抱著從後門跑，耳朵裡全是歌。」","老人跪了下去。阿檀沒有扶他。","tan|「袍子留下。人，走吧。」"]},{"text":"說他們什麼也沒想","hint":"−100 兩","fx":[{"cash":-100},{"item":{"t":"a_robe","tier":3,"curse":["blood",2],"tags":["church"]}},{"rep":["candle",3]}],"lines":["老人閉上眼睛，像是鬆了一口氣，又像是更難受了。","他收了一百兩，走得很慢。"]},{"text":"這件我不收","lines":["他把白袍抱回懷裡，抱得很緊，像抱著一個人。"]}]},{"id":"f_guild_funeral","phase":"counter","day":[5,13],"chance":0.3,"priority":-1,"who":"yao","title":"棺材錢","lines":["老鷂用他那隻獨臂，把一套沾泥的皮甲甩上你的櫃台。","yao|「阿桐，二十六歲，昨天死在沉鐘原。兄弟們把他背回來了，棺材錢還差。」","yao|「這是他的甲。你看著給，給多少，都進他的棺材。」","皮甲左肋破了一個洞，邊緣整整齊齊。是遊兵的長矛。"],"choices":[{"text":"照好價收","hint":"−90 兩","fx":[{"cash":-90},{"item":{"t":"a_leather","tier":2,"tags":["bell"]}},{"rep":["guild",6]}],"lines":["yao|「九十。夠買口好棺材，還剩一頓酒。」","他點點頭，沒說謝。老拾骨人不說這個字。"]},{"text":"壓到三十","hint":"−30 兩","fx":[{"cash":-30},{"item":{"t":"a_leather","tier":2,"tags":["bell"]}},{"rep":["guild",-6]}],"lines":["老鷂盯著你看了很久，把銀子收了。","yao|「三十兩，薄皮棺材。阿桐不挑。我挑。」"]},{"text":"甲拿回去，我捐五十","hint":"−50 兩","fx":[{"cash":-50},{"rep":["guild",9]},{"rep":["folk",2]}],"lines":["yao|「……你這人做生意，遲早餓死。」","他把甲夾在腋下走了，走得比來時慢。"]}]},{"id":"f_guild_rookies","phase":"morning","day":[15,24],"chance":0.3,"priority":-1,"title":"南方來的","lines":["骨棚前站著五個南方來的年輕人，鞋還是乾的。","yao|「新來的。沒錢，沒傢伙，有膽子。膽子在亡域不值錢。」","yao|「你賒他們一身行頭。活著回來的，雙倍還你；死了的，算我的。」","tan|「算你的？老鷂，你全身上下就剩一隻手值錢。」"],"choices":[{"text":"賒全套","hint":"−200 兩","fx":[{"cash":-200},{"rep":["guild",8]},{"flag":"rookies_lent"},{"queue":["f_guild_rookies_back",6]}],"lines":["五個人在你鋪子裡試甲，試得眼睛發亮。","最矮的那個問你，劍要怎麼握。你教了他。"]},{"text":"送他們繩子和燈","hint":"−40 兩","fx":[{"cash":-40},{"rep":["guild",3]}],"lines":["yao|「繩子和燈。」他哼了一聲，「也好，至少死得明白。」"]},{"text":"不賒","fx":[{"rep":["guild",-3]}],"lines":["yao|「行。」他轉身就走，「南邊還有別的鋪子。」"]}]},{"id":"f_guild_rookies_back","phase":"morning","req":[{"flag":"rookies_lent"}],"chance":0,"priority":-1,"title":"雙倍","lines":["五個南方人回來了三個。鞋，不再是乾的了。","他們把錢放上櫃台，數得很慢。賒的雙倍，一兩不少。","最高的那個開口：「另外兩個……甲很好。是他們不好。」","最矮的那個，不在裡面。"],"choices":[{"text":"收下","hint":"+240 兩","fx":[{"cash":240},{"rep":["guild",4]},{"sanity":-3}],"lines":["你把錢收進錢匣。那天晚上對帳，你算錯了三次。"]},{"text":"收一半，給死的人","hint":"+120 兩","fx":[{"cash":120},{"rep":["guild",10]},{"rep":["folk",2]}],"lines":["他們愣了一下，把另一半收回去。","城外拾骨人的墳地，多了兩塊石碑。不是木牌，是石碑。"]}]},{"id":"f_guild_names","phase":"night","day":[32,48],"chance":0.3,"priority":-1,"title":"腰牌","lines":["老鷂半夜來敲門，背上一個麻袋，倒出來是一地鏽掉的腰牌。","yao|「沉鐘原清出來的，一百多塊。字都鏽沒了，不知道是誰家的人。」","yao|「你那隻眼睛，摸一摸就知道。知道了，就能告訴他們家裡，別等了。」"],"choices":[{"text":"一塊一塊摸","hint":"心神 −15","fx":[{"sanity":-15},{"rep":["guild",12]},{"rep":["folk",8]}],"lines":["你摸到天亮。一百三十一個名字，老鷂用他那隻手一個一個寫下來。","有一塊腰牌的主人，最後想的是：鍋裡的粥，別燒糊了。"]},{"text":"摸十塊，收錢","hint":"+120 兩，心神 −5","fx":[{"cash":120},{"sanity":-5},{"rep":["guild",-4]}],"lines":["yao|「十塊。」他把錢放下，「剩下一百二十一家，接著等。」"]},{"text":"我撐不住","lines":["老鷂把腰牌一塊塊撿回麻袋，沒有說話。","yao|「也是。活人也得睡覺。」"]}]},{"id":"f_scale_bridge","phase":"morning","day":[5,13],"req":[{"cash_lt":150}],"chance":0.4,"priority":-1,"title":"過週","lines":["算盤先生沒等到還款日就來了。鐵算盤靠在門邊，比門框還高。","abacus|「我看過你的帳。這週，你湊不齊。」","abacus|「東家借你一百兩過週。本金加一百六。往後收到澐宮的東西，先送金秤行挑。」","tan|「借一百還一百六？你那算盤珠子是拿人心肝串的吧。」","abacus|「銅的。人心肝不耐用。」"],"choices":[{"text":"兩條都應","hint":"+100 兩，欠款 +160","fx":[{"cash":100},{"debt":160},{"flag":"qin_first"},{"rep":["scale",4]}],"lines":["他在帳上記了一筆，字小得像螞蟻。","abacus|「金秤行喜歡守約的人。守約的人，比較好算。」"]},{"text":"借錢，不給挑","hint":"+100 兩，欠款 +240","fx":[{"cash":100},{"debt":240}],"lines":["abacus|「不給挑，就多付八十。帳要平。」"]},{"text":"不借","fx":[{"rep":["scale",2]}],"lines":["abacus|「有骨氣。骨氣這一項，帳上記零。」"]}]},{"id":"f_scale_firstpick","phase":"counter","day":[15,40],"req":[{"flag":"qin_first"},{"has_tag":"royal"}],"chance":0.3,"priority":-1,"who":"abacus","title":"先挑","lines":["算盤先生沿著貨架走了一圈，停在一件澐宮的東西前面，用算盤尖點了點。","abacus|「依約，金秤行先挑。這件，東家要了，五成價。」","abacus|「你也可以不給。違約的利息，我已經替你算好了。」"],"choices":[{"text":"照約給","hint":"少一件澐宮古物","fx":[{"take_tag":"royal"},{"cash":80},{"rep":["scale",6]}],"lines":["他把東西包進一塊黑布，包得比你還仔細。","abacus|「東家喜歡老東西。老東西不會變心。」"]},{"text":"不給","hint":"欠款 +150","fx":[{"debt":150},{"rep":["scale",-8]}],"lines":["abacus|「利息照算。東家會記得的，她的記性比我的算盤好。」"]}]},{"id":"f_scale_thimble","phase":"counter","day":[16,30],"chance":0.3,"priority":-1,"who":"abacus","title":"頂針","lines":["算盤先生把一只錫盒放上櫃台。打開，裡面是一枚磨亮的頂針。","abacus|「裁縫老溫，欠金秤行四百兩，前天在渡口淹死了。他的銀子沒淹死。」","abacus|「東家請你看看，他最後想的是哪裡。看準了，酬金一百五十兩。」","你一碰頂針，念瞳裡是一棵棗樹，樹下埋著罈子，罈邊站著一個小姑娘。"],"choices":[{"text":"照實說","hint":"+150 兩","fx":[{"cash":150},{"rep":["scale",6]},{"sanity":-3}],"lines":["abacus|「棗樹。罈子。記下了。」","三天後你經過裁縫鋪。棗樹下多了一個空坑，一個小姑娘坐在坑邊。"]},{"text":"瞞下，告訴他女兒","fx":[{"rep":["scale",-4]},{"rep":["folk",6]},{"sanity":3}],"lines":["abacus|「死人不想錢？這倒是頭一回。」","那晚你繞到裁縫鋪後巷，把棗樹的事告訴了那個叫阿雲的姑娘。"]},{"text":"瞞下，自己去挖","hint":"嫌疑 +4","fx":[{"cash":260},{"heat":4},{"sanity":-6},{"rep":["scale",-4]}],"lines":["罈子裡是二百六十兩碎銀，和一雙沒做完的繡花鞋。","鞋很小，是新娘子穿的尺寸。"]}]},{"id":"f_scale_lanterns","phase":"morning","day":[38,50],"chance":0.3,"priority":-1,"title":"孫家燈鋪","lines":["隔壁孫家燈鋪的門上，貼了金秤行的封條。","孫婆婆坐在台階上，膝上擱著一盞拆開的防風燈，手沒停。","abacus|「欠三百二十兩，還不上，依約收鋪。裡頭的燈，掌櫃的要的話，三成價。」","孫婆婆抬頭看了你一眼，又低下頭，繼續修。"],"choices":[{"text":"替她還三百二","hint":"−320 兩","fx":[{"cash":-320},{"rep":["folk",12]},{"rep":["scale",2]},{"item":{"t":"k_lantern","tier":2}}],"lines":["封條撕下來的時候，孫婆婆把修好的那盞燈塞進你手裡。","「鐘夜那晚，掛在門口。照得見回家的路。」"]},{"text":"三成價收燈","hint":"−90 兩","fx":[{"cash":-90},{"item":{"t":"k_lantern","tier":2}},{"item":{"t":"k_lantern","tier":2}},{"rep":["folk",-6]},{"rep":["scale",4]}],"lines":["你的人把燈一盞盞搬走。孫婆婆看著，手上沒停。"]},{"text":"不關我的事","fx":[{"rep":["folk",-2]}],"lines":["三天後，隔壁成了金秤行的倉房。","門口那排燈架，再也沒點亮過。"]}]},{"id":"f_folk_douzi","phase":"morning","day":[8,18],"chance":0.3,"priority":-1,"title":"豆子","lines":["開門時，對面豆腐鋪的小姑娘豆子已經蹲在門口，下巴擱在膝蓋上。","「掌櫃的，我會跑腿、會數錢、會看人臉色。一天兩個銅板就好。」","「我爹去枯河地窟，三個月沒回來。我娘的豆腐，一天賣不完一板。」"],"choices":[{"text":"僱她跑腿","hint":"−30 兩，先付一個月","fx":[{"cash":-30},{"rep":["folk",5]},{"customers":2}],"lines":["她當天就在西街喊開了：「{shop}收貨，價錢公道，不公道我跟你姓！」","阿檀說，這丫頭比她還會做生意，得提防。"]},{"text":"包下她娘的豆腐","hint":"−20 兩","fx":[{"cash":-20},{"rep":["folk",3]}],"lines":["那個月，你跟阿檀吃豆腐吃到看見白的就想吐。"]},{"text":"這裡不是小孩待的地方","lines":["她點點頭，像早就知道會這樣。","她走的時候，把你門口的落葉掃乾淨了。"]}]},{"id":"f_folk_pipe","phase":"night","day":[24,40],"chance":0.3,"priority":-1,"title":"煙斗","lines":["打烊後，豆子把一只斷了嘴的煙斗放上櫃台，兩隻手按著，像怕它跑掉。","「拾骨的叔叔在枯河撿到的。他說，這是我爹的。」","「掌櫃的，你那隻眼睛看得見。我爹最後在想什麼？」","你一碰煙斗就知道了。他最後想的，是一雙小了的鞋。"],"choices":[{"text":"告訴她","hint":"心神 −5","fx":[{"sanity":-5},{"rep":["folk",6]}],"lines":["me|「他在想，豆子的鞋小了，回去要買雙新的。」","豆子沒有哭。她低頭看自己的鞋，鞋尖破了一個洞。"]},{"text":"說什麼也沒看見","lines":["「那他可能還活著，對不對？」","你沒有回答。她把煙斗揣回懷裡，跑回對面，跑得很快。"]},{"text":"帶她去買鞋","hint":"−50 兩，心神 −5","fx":[{"cash":-50},{"sanity":-5},{"rep":["folk",8]}],"lines":["你什麼都沒說，帶她去鞋鋪買了一雙，又買了一雙大一號的。","走到家門口，她低頭看著新鞋，忽然回頭看你。她懂了。"]}]},{"id":"f_folk_northman","phase":"counter","day":[14,30],"chance":0.3,"priority":-1,"who":"stranger","title":"北方來客","lines":["北方行商的皮帽上結著冰碴，在鴉渡的雨裡一點一點化掉。","stranger|「我弟弟的駝隊，上個月在沉鐘原的路上沒了。人沒了，貨也沒了。」","stranger|「順道問一句：汗王收澐宮的老東西，戴在頭上的最好。誰找到，給一座城。」","他把一枚狼牙墜飾擱在櫃台上：「我阿爸的。拿件澐宮的東西來換。」"],"choices":[{"text":"把那封家書還他","req":[{"flag":"crate_bought"},{"has_tag":"letter"}],"hint":"少一封信","fx":[{"take_tag":"letter"},{"item":{"t":"c_amulet","tier":2,"tags":["foreign"],"curse":["ward",1]}},{"sanity":4}],"lines":["他認得封口上的字。他拆開信讀了很久，讀完摺好，貼在胸口。","stranger|「寫給我娘的。」他把狼牙推給你，「不換了。送你。」"]},{"text":"拿澐宮古物換","req":[{"has_tag":"royal"}],"hint":"少一件澐宮古物","fx":[{"take_tag":"royal"},{"item":{"t":"c_amulet","tier":2,"tags":["foreign"],"curse":["ward",1]}}],"lines":["他把你的東西翻來覆去看了很久，收進皮囊。","stranger|「狼牙護過我們家三代人。現在換你。」"]},{"text":"買下墜飾","hint":"−120 兩","fx":[{"cash":-120},{"item":{"t":"c_amulet","tier":2,"tags":["foreign"],"curse":["ward",1]}}],"lines":["stranger|「南邊人就是愛付錢。」他把銀子揣好，咧嘴一笑。"]},{"text":"冕的事，多說點","fx":[{"note":"北方行商說：汗王收澐宮的冠冕，許一座城；傳說那頂冠能叫死人打仗。"}],"lines":["stranger|「汗王打仗缺人。聽說那頂冠，能叫死人替活人打仗。」","stranger|「我只是個賣皮貨的。這種話，聽聽就好。」"]}]},{"id":"f_folk_tan_gone","phase":"morning","day":[30,55],"req":[{"flag":"tan_dead"}],"chance":0.5,"priority":-1,"title":"刻字","lines":["一早開門，櫃台上已經擺滿了東西。","一把修好的傘，一只補過的鍋，一個重新綁了珠子的撥浪鼓，一雙換了底的鞋。","都是阿檀修過的。西街的人天沒亮就送來，放下就走，沒有人進門說話。","傘柄上刻著一個很小的『檀』字。她修過的東西，都刻。"],"choices":[{"text":"擺上貨架","fx":[{"sanity":6},{"rep":["folk",3]}],"lines":["你把它們一件一件擺上貨架，標上價錢。","然後，一件也沒賣。"]},{"text":"一家一家送回去","fx":[{"sanity":-4},{"rep":["folk",8]}],"lines":["每一家都留你喝了一碗茶，沒有人提她的名字。","走回鋪子時天黑了。你第一次覺得，西街這麼長。"]}]}],"bellnight":{"intro":["第五十六夜。澐水退得一滴不剩，河床裸著，像一道剖開的傷口。","九口黑鐘從泥裡浮起來，一口接一口，鐘口朝天。","沒有人敲，鐘卻在響。每響一聲，北邊的霧就近一里。","然後灰潮來了。不是水，是人。十年來所有沒能閉眼的人。"],"waves":[{"name":"第一波・亡兵","intro":["最先到的是沉鐘原的亡兵，還排著十年前的隊形。","他們的旗早爛光了，鼓還在敲，敲的是攻城的點子。"]},{"name":"第二波・骸骨","intro":["第二波是白骨修道院的骸兵。骨頭碰著骨頭，響得像下冰雹。","低語跟在後面。你聽見有人叫你，用你最想聽的那個聲音。"]},{"name":"第三波・王軍","intro":["最後來的是沉鐘城。穿澐國王軍甲冑的亡者，走得很慢，很整齊。","他們不攻城。他們往鐘的方向走，誰擋在路上，就從誰身上走過去。"]}],"hold":["{name}一腳踩進泥裡，掄起{weapon}，倒下的那一排沒再起來。","{name}被逼到渡口最後一級石階，沒有退，{weapon}往霧裡送了出去。","{name}渾身是灰，{weapon}上也是灰，可人還站著。","一隻白骨的手抓住{name}的腳踝。{name}低頭看了一眼，把它踩碎了。","霧裡有人叫{name}的小名。{name}咬著牙，沒有回頭。","{name}背靠一口黑鐘。鐘在震，{name}沒有動。","{name}舉起{weapon}，對著灰潮罵了一句很髒的話。灰潮真的退了一步。","{name}扶起身邊倒下的陌生人，兩個人背靠背，撐過了這一波。","{name}起先還在數，數到第二十個就不數了，{weapon}一下都沒停過。","{name}的燈滅了。{name}在黑暗裡又站了一刻鐘，直到有人把燈遞過來。","{name}一聲不吭，一下一下地幹活，像在劈柴。","{name}被撞倒，又爬起來，吐掉嘴裡的泥，接著守。","{name}的{weapon}上纏滿了灰白的頭髮，甩不掉，就帶著繼續打。","{name}守的那一段石階，到這一波退去，一個都沒讓過去。"],"fall":["{name}被灰潮捲走了，連一聲都沒來得及喊。","{name}倒下的時候，手還朝著渡口的方向。","霧裡有人叫了一聲。{name}回頭了。","{name}擋在一個孩子前面。孩子活了下來。","一隻又一隻灰白的手，把{name}拖進霧裡。霧合上了，像什麼都沒發生。","{name}跪下去，像是累了，想歇一會。之後就沒再起來。","{name}最後喊的是一個名字。不是你的，也不是任何活人的。","{name}的燈掉在石階上，還亮著。{name}已經不在了。","{name}被三個亡兵壓在身下，臨死還拖了一個進泥裡。","{name}說了句「替我跟大家說一聲」，就被霧吞了。","灰潮從{name}身上走過去。走過去以後，地上只剩一副空甲。","{name}到死都握著兵器。拔不下來，後來就一起埋了。","{name}從石階上滑下去，掉進乾涸的河床。下面全是手。","{name}笑著罵了一句，罵到一半，聲音就斷了。"],"won":["天快亮的時候，九口鐘同時停了。","灰潮退回北方，退得很慢，像捨不得。","渡口上的人互相看著，沒有人歡呼。有人坐下來，哭得像個孩子。","鴉渡還在。你也還在。九口鐘還立在河床上，鐘口朝天，在等。"],"pyrrhic":["天亮了。渡口守住了，石階上躺滿了人。","活下來的人一個一個去翻那些臉，翻到認識的，就坐下來，不走了。","下城的屋頂露出水面。有一半，再也不會有人回去。","九口鐘還立在河床上。誰死了，它們都不在乎。"],"lost":["第三波過去的時候，渡口上已經沒有人站著了。","灰潮漫過下城，漫過西街，停在你的門檻前。","它沒有進來。它停在門檻外，像客人在等掌櫃開口。","身後的城裡有人在哭，有人在喊名字。喊的人越來越少。"],"crown_prompt":["灰潮停住了。不退，也不進，像一排等著發落的人。","九口鐘就在眼前，鐘口朝天，黑得看不見底。","空冕的碎片在說話，每一件說的都不一樣。","十年來所有亡者的話，鴉渡的命，要交給誰，你說了算。"]},"endings":{"e_bell":{"title":"鐘鳴","lines":["七件碎片在你掌心合攏，成了一頂空冕，輕得像什麼都沒有。","九口鐘還立在見底的河床上，鐘口朝天，在等。","阿檀走到最大的那口鐘下。她的手在抖，聲音沒有。","tan|「一杵鐘，水向東，二杵鐘，燈火紅，」","第一口鐘響了。這一次，鐘聲是往外送的。見底的澐水嘩一聲，又往東流。","渡口每一盞熄掉的燈，自己亮了起來。","tan|「三杵鐘聲過橋去，橋上的人莫回頭。」","等著發落的灰潮站了起來。他們沒有撲向城，他們在排隊。","你戴著冕站在鐘下，聽他們一個一個，把沒說完的話說完。","有人說欠了誰三兩銀子，有人說門口的棗樹該剪了，有人只說了一個名字。","tan|「放下手裡那盞燈，放下心上那個名，」","白燈隊從你面前走過。莫三哼著小調，啞叔朝你吹了一聲骨哨。","huajiao|「別回頭，替我們活。」","tan|「你走的路我替你記，你沒說完的，我替你聽。」"],"variants":[{"req":[{"flag":"qin_knows_son"}],"lines":["無名甲走在隊伍最後，在秦晚霜面前停了一停，才走上橋。","qin|「去吧。娘聽見了。」"]},{"req":[{"flag":"armor_is_shen"},{"noflag":"qin_knows_son"}],"lines":["無名甲經過金秤行時停了一停。樓上那扇窗，到天亮都沒有開。"]},{"req":[{"flag":"yan_door"}],"lines":["隊伍裡有個武僧，手上綁著一截灰布。經過阿檀時，他停了一下。","十年前他擋住的那扇門後面，那個孩子長大了，正在唱歌送他走。"]},{"req":[{"dead":"yan"}],"lines":["燕回也在隊伍裡，跟在一個武僧身後。兄妹倆走得很慢，都沒有回頭。"]},{"req":[{"in_town":"yan"}],"lines":["燕回在岸上喊了一聲「哥」。那個武僧抬了抬手，沒有回頭。"]},{"req":[{"flag":"su_ally"}],"lines":["蘇杳腰上的兩個銅鈴跟著大鐘響。她一邊聽一邊寫，寫的是自己的字。"]},{"req":[{"flag":"su_lost"}],"lines":["蘇杳站在橋頭，替每個走過的人扶著門。最後她自己也上了橋，用自己的聲音說了再見。"]},{"req":[{"flag":"ming_ally"}],"lines":["明澄跪在渡口，第一次沒有禱告。他只是聽。"]},{"req":[{"flag":"dog"}],"lines":["利息趴在鐘下，耳朵跟著鐘聲，一下一下地抖。"]},{"req":[{"flag":"truth_told"}],"lines":["你釘在告示柱上的那張紙，這一夜，有人一字一字念給排隊的死人聽。"]},{"req":[{"flag":"town_held"}],"lines":["第九口鐘響完，天亮了。你的左眼刺了一下，再睜開，跟右眼一樣了。","你鋪子裡的每一件遺物，都安靜了。","灰潮退了，再也沒有漲。拾骨人從亡域撿回來的，從此只是東西。","{shop}的生意一天比一天冷。阿檀問你，招牌要改成什麼。","你看著門外。十年來，鴉渡第一次下了一場只是雨的雨。"]},{"req":[{"flag":"town_fell"}],"lines":["第九口鐘響完，天亮了。你的左眼刺了一下，再睜開，跟右眼一樣了。","你鋪子裡的每一件遺物，都安靜了。","下城淹過的地方，露出一排排屋頂，和一城要埋的人。","這一次，沒有誰的念頭會留在東西上。哭完的人，就真的哭完了。","阿檀把招牌摘下來，你們一起去下城幫人搬家。雨還在下，只是雨。"]}]},"e_bind":{"title":"縛鐘","lines":["霍嶂接過空冕，手很穩，像接過一道軍令。","他親手敲響最大的那口鐘。聲音是反的，像有人把一口氣往回吸。","等著發落的灰潮，一排一排轉過身，朝碑樓跪下。","天亮後，他們站起來排成隊，穿上碑樓發的甲。人們叫他們碑兵。","碑兵不吃、不睡、不老。鐘一響，就往前走。","灰潮再也沒有越過渡口。鴉渡成了北方最安全的城。","{shop}換了招牌，多了四個字：碑樓御用。碑兵的甲，十件有九件經你的手。","你很有錢。錢多到你不敢在夜裡數。","因為念瞳還在。每一件送回來修的甲裡，都有人在說話。","它們說的都是同一句：讓我走。"],"variants":[{"req":[{"dead":"li"}],"lines":["碑兵裡有個獨眼老兵，走路還是歪歪倒倒。霍嶂巡營時，從不看那一排。"]},{"req":[{"dead":"yan"}],"lines":["你在第三排看見燕回。她還在找她哥哥，眼睛一排一排地看過去。"]},{"req":[{"flag":"armor_is_shen"}],"lines":["只有無名甲不跪。霍嶂讓人把它鎖在新修的水門上，替他守門。"]},{"req":[{"flag":"qin_knows_son"}],"lines":["秦晚霜每天傍晚坐車經過水門。車簾，一次也沒拉開過。"]},{"req":[{"alive":"tan"}],"lines":["掛新招牌那天，阿檀走了。她只留下一句：「我修東西，不修這種東西。」"]},{"req":[{"flag":"tan_dead"}],"lines":["你每天站在門口看碑兵換崗，找一個二十歲的姑娘。","有一天你找到了。她走在第九排，走得很直。你沒有叫她，你怕她回頭。"]},{"req":[{"flag":"town_held"}],"lines":["霍嶂老了以後，常一個人站在碑樓頂上聽鐘。有一回，他對你說：","huo|「我這輩子開過兩道門。一道放人進來，一道不讓人出去。」","你回到鋪子，把今天收回來的十件甲，一件一件擦乾淨。","擦到第七件，裡面的人叫了你的名字。你沒有停手。"]},{"req":[{"flag":"town_fell"}],"lines":["下城淹死的人也站了起來。他們替活人把房子修好，再回到隊伍裡。","霍嶂老了以後，常一個人站在碑樓頂上聽鐘。有一回，他對你說：","huo|「我這輩子開過兩道門。一道放人進來，一道不讓人出去。」","你回到鋪子，把今天收回來的十件甲，一件一件擦乾淨。","擦到第七件，裡面的人叫了你的名字。你沒有停手。"]}]},"e_seal":{"title":"燭封","lines":["素蓮用白布把空冕包了七層，每包一層，就低聲念一段禱詞。","九口鐘一口接一口沉回泥裡。白燭堂底下，有一間沒有門的石室。","冕放進去，牆砌起來。最後一塊磚，是素蓮親手按上的。","那一夜，滿城的燭火同時矮了一截，然後穩住了。","灰潮退了。不是被送走，是被按住，像一隻手捂住了一張嘴。","從那天起，你的念瞳什麼也看不見了。念頭還在東西裡，只是不再出聲。","鴉渡安靜下來。一安靜，就是二十年。","白燭堂越蓋越高。素蓮的頭髮全白了，對窮人還是一樣好。","{shop}改賣燭台和安神香，生意很好。","沒有人再問，東西是從誰身上拿下來的。"],"variants":[{"req":[{"flag":"sulian_turned"}],"lines":["素蓮知道燭院做過什麼。她還是砌上了那面牆。","sulian|「這一次，罪讓我一個人背。」"]},{"req":[{"flag":"truth_told"}],"lines":["你釘在告示柱上的那張紙，被雨打爛以後，再也沒有人貼新的。"]},{"req":[{"alive":"tan"},{"flag":"tan_secret"}],"lines":["阿檀再也沒唱過那首偈。她說她忘了詞。你知道她沒忘。"]},{"req":[{"alive":"tan"},{"noflag":"tan_secret"}],"lines":["阿檀常哼一支沒有詞的調子，哼到一半就停，說後面想不起來了。"]},{"req":[{"flag":"tan_dead"}],"lines":["阿檀留下的東西，你一件也讀不出來了。你這才知道，你一直在等她開口。"]},{"req":[{"flag":"town_held"}],"lines":["第二十年，一個拾骨的孩子撿回一塊碎瓷，問你上面畫的是什麼。","你說不知道。你是真的不知道了。","只是偶爾夜裡醒來，你覺得耳朵裡很吵。四周卻什麼聲音也沒有。"]},{"req":[{"flag":"town_fell"}],"lines":["下城淹死的人，沒有一個回來作祟。白燭堂說，這就是慈悲。","第二十年，一個拾骨的孩子撿回一塊碎瓷，問你上面畫的是什麼。你說不知道。","只是偶爾夜裡醒來，你覺得耳朵裡很吵。四周卻什麼聲音也沒有。"]}]},"e_scale":{"title":"秤心","lines":["秦晚霜把空冕擺在金秤行頂樓的大秤上，另一頭，什麼也沒放。","秤是平的。","qin|「我出過很多價錢。這是頭一回，不知道該出多少。」","她把玉簪插回冕上，手指在上面停了很久。","她沒有讓鐘響。她戴上冕，只叫了一個名字。","qin|「硯兒。」","冕聽見了，灰潮也聽見了。沒有鐘聲送它們走，它們就順著那一聲，湧向金秤行。","那一夜，下城淹了。水一直漫到金秤行的台階，停在那裡，像在等人開門。","算盤先生在樓下撥了一夜算盤，撥的是下城淹了多少戶。","你站在樓梯口。你的債，她上樓前就一筆勾銷了。"],"variants":[{"req":[{"flag":"town_fell"}],"lines":["鐘夜淹過一次的下城，天亮前又淹了一次。這一回，沒有人再搬回去。"]},{"req":[{"alive":"tan"}],"lines":["阿檀在下城幫人搬了一夜東西，回來時鞋都泡爛了。她一句話也沒跟你說。"]},{"req":[{"flag":"qin_knows_son"}],"lines":["金秤行的大門開了。那具黃昏時常走進你鋪子的甲，一級一級走上樓。","它在她面前跪下，摘下頭盔。裡面是空的，可她看得見。","qin|「瘦了。」","他們說了一整夜的話。你一個字也沒聽，那不是你該收的東西。","天亮時，甲散了一地。秦晚霜一片一片撿起來，擦乾淨，收進了金庫。"]},{"req":[{"noflag":"qin_knows_son"}],"lines":["她叫了一整夜。冕聽見了，灰潮聽見了，整座下城都聽見了。","只有你看見，那具黃昏時常走進你鋪子的甲，站在她身後三步遠。","它站了一整夜，一動不動，像在等一道命令。","她始終沒有回頭。","天亮時，甲倒在地上，散成一堆鐵片。秦晚霜跨過它，下樓去了。"]},{"req":[{"flag":"armor_promise"},{"noflag":"qin_knows_son"}],"lines":["你答應過他，要告訴她。你一直沒有說。"]},{"req":[{"flag":"armor_is_shen"},{"noflag":"armor_promise"},{"noflag":"qin_knows_son"}],"lines":["你知道它是誰。你一直沒有說。"]}]},"e_crow":{"title":"鴉散","lines":["烏十一數錢的時候沒有笑。這是你第一次看見他不笑。","wu|「汗王許了一座城。我不要城，只要船，越多越好。」","北原的駝隊在對岸等了三天。冕裝進一只裝茶磚的木箱，就這樣過了河。","冕一過河，等著發落的灰潮就跟著往北退，像一群追著燈走的人。","鴉巷最後一批孩子上了船，順水往東。最小的那個懷裡揣著一隻烏鴉，不肯撒手。","你分到的銀子，一輩子也花不完。","你在南方買了宅子，有院子，有井，一年下不了幾場雨。","你用黑布蒙住左眼。南方沒有遺物，要你聽。","南方的夜很靜。你常常一整夜，什麼聲音也聽不見。","你以為，你會睡得很好。"],"variants":[{"req":[{"flag":"crow_boat"}],"lines":["那年冬天你收到一封信，字歪歪扭扭，是鐘夜前那一船孩子寫的。最後一行寫：東邊也下雨。"]},{"req":[{"flag":"jiu_hired"},{"alive":"jiu"}],"lines":["阿九跟你去了南方。他學會了南方的秤，卻一直學不會南方的口音。"]},{"req":[{"dead":"jiu"}],"lines":["你常夢見阿九蹲在那艘船的船頭，問你鴉渡還在不在。"]},{"req":[{"alive":"tan"}],"lines":["阿檀沒有跟你走。她說：「鋪子總得有人顧。」","第三年，北邊來的商人說，鴉渡沒了。灰潮在一個夜裡漫過渡口，沒有鐘，也沒有人守。","商人還說，北原的汗王戴上了一頂空的冠。他的兵，從此不用吃飯。","那天夜裡，你夢見西街。{shop}的門開著，阿檀坐在櫃台後面，等你回去收貨。"]},{"req":[{"flag":"tan_dead"}],"lines":["第三年，北邊來的商人說，鴉渡沒了。灰潮在一個夜裡漫過渡口，沒有鐘，也沒有人守。","商人還說，北原的汗王戴上了一頂空的冠。他的兵，從此不用吃飯。","那天夜裡，你夢見西街。{shop}的門開著，櫃台後面沒有人，燈還亮著。"]}]},"e_crown":{"title":"戴冕","lines":["你把空冕戴上。它輕得像沒有。然後，所有的死人同時開口。","沉鐘原的遊兵、枯河的難民、修道院的僧人，你賣過的每一件東西的主人。","你在幾萬個聲音裡聽見了花椒。真的那一個。她只說了兩個字：「笨蛋。」","灰潮還等在渡口。你說「退」，它就退了。你說「坐下」，十萬個死人一起坐下。","鴉渡的人跪在雨裡。有人叫你王，有人朝你扔石頭，石頭在半空停住，掉了下來。","碑樓、白燭堂、金秤行都派了人來。你讓他們在雨裡等著。","你沒有讓鐘響。鐘一響，他們就走了，可他們還有話沒說完。","所以你坐在鐘下，一個一個地聽。","你算過：一天聽一百個，要聽三百年。","冕不讓你老，也不讓你死。三百年，剛好。"],"variants":[{"req":[{"sanity":40}],"lines":["你還記得自己的名字。每天聽完，你就把他們的話寫下來，託人送回他們家裡。","第四年，北原的使者來問，你要不要那頂冠底下的天下。你說，你很忙。"]},{"req":[{"sanity_lt":40}],"lines":["第二年，你開始分不清哪些話是他們說的，哪些是你說的。","第三年，你不聽了，只下令。死人替活人耕田、挖礦、守夜，鴉渡從沒這麼富過。","沒有人敢告訴你，你的兩隻眼睛，現在都是灰白的。"]},{"req":[{"flag":"dog"}],"lines":["利息每天趴在你腳邊。牠是鴉渡唯一一個，不怕你的活物。"]},{"req":[{"alive":"tan"}],"lines":["阿檀每天傍晚來一次，提一碗麵，坐在鐘下陪你。","她從不催你。她只是坐著，像在等你哪天想起來，自己也有話要說。"]},{"req":[{"flag":"tan_dead"}],"lines":["有時候，你在幾萬個聲音裡找一個二十歲姑娘的聲音，一找就是一整夜。","你找到過一次。她在罵你，罵你又忘了吃飯。"]}]},"e_none":{"title":"無冕","lines":["灰潮等到天亮，等不到該等的那句話，慢慢退回了北方。","九口鐘一口接一口，沉回河床的泥裡。澐水回來了，是渾的。","空冕沒有回到鐘下，也沒有人戴上它。","七件碎片，各自回到了黑暗裡，守著各自沒說完的話。","死人還是不能安息。遺物還是會說話。","灰潮還會再來，一次比一次大。","碑樓、白燭堂、金秤行、鴉巷，誰也沒拿到他們要的東西。","他們回到各自的地盤，數自己還剩下多少人。","你也數了。數到一半才發現，你數的不是人數，是名字。","你一直以為，這件事總得有個人來了結。原來沒有。原來只有一天一天，一夜一夜。"],"variants":[{"req":[{"noflag":"crown_incomplete"},{"relics":1}],"lines":["你站在渡口，把懷裡的碎片一件件沉進回來的澐水。","最後一件離手前，你聽見它說：『還沒說完。』"]},{"req":[{"flag":"failed_watch"}],"lines":["那一夜，霍嶂在碑樓頂上敲了鐘。冕不全，鐘聲只縛住一半，另一半衝上了碑樓。","第二天，碑樓的旗降了一半。守碑衛換了新都尉，沒有人提起舊的那個。"]},{"req":[{"flag":"failed_candle"}],"lines":["那一夜，素蓮點了七百根蠟燭封冕。冕不全，燭火一根接一根，被吹熄了。","白燭堂從那天起不再點燈。素蓮跪在黑暗裡，跪了很久，沒有人敢去扶。"]},{"req":[{"flag":"failed_scale"}],"lines":["那一夜，秦晚霜戴上不全的冕，叫了一整夜兒子的名字。","來的不是她兒子，是當年金秤行一兩銀子買下的每一顆人頭。","天亮後，算盤先生把她從秤邊扶起來。她的頭髮，一夜全白了。"]},{"req":[{"flag":"crow_boat"}],"lines":["鴉巷的孩子早在鐘夜前就上了船。烏十一說，那條船是你的。"]},{"req":[{"flag":"town_held"}],"lines":["可是鴉渡守住了。沒有冕，沒有王，是一群拿著你的刀、穿著你的甲的人。","從此每一次灰潮，鴉渡都自己守。守得住，就再開一年張。","{shop}照常開門。拾骨人照常把死人的東西扛回來，放上你的櫃台。","你照常估價。只是估著估著，你常會停下來，先聽它們把話說完。"]},{"req":[{"flag":"town_fell"}],"lines":["下城沒了。西街十間鋪子，只有{shop}的門檻還是乾的。","活下來的人大多往南走了。走了七天，回頭還看得見鴉渡上空的烏鴉。","你沒有走。你卸下門板，照常開張。","從水裡撈上來的東西，一件一件被送到你的櫃台上。你一件一件收。","總有一天會有人聽得見。到那時，你再一件一件，還回去。"]}]},"e_bankrupt":{"title":"封鋪","lines":["算盤先生來的那天早上，錢匣子是空的。","abacus|「帳我算了三遍。每一遍，都是你輸。」","他帶來的人把貨一件件搬上車，連門口那盞油燈都點了數。","abacus|「燈另計。燈油，算你的。」","後庫、暗格、地窖，他們翻得比守碑衛還仔細。","封條貼上門板的時候，雨剛好停了一下，又下了起來。","abacus|「招牌不值錢，不收。你帶走吧。」","你背著包袱，夾著招牌，站在西街。包袱裡，只有你自己的東西。","你這才發現，你自己的東西，少得裝不滿一個包袱。","西街的人隔著門縫看你。沒有人出來，也沒有人關窗。"],"variants":[{"req":[{"relics":1}],"lines":["你後來才知道，算盤先生點到那幾件澐宮碎片時，手停了一下，把它們單獨送上了金秤行頂樓。"]},{"req":[{"flag":"jiu_hired"},{"alive":"jiu"}],"lines":["阿九把自己的鋪蓋捲也背上了。他說，學徒跟師父走，天經地義。"]},{"req":[{"flag":"dog"}],"lines":["利息跟著你走出西街，走得比你還慢，一步一回頭。"]},{"req":[{"flag":"crow_pal"}],"lines":["那隻烏鴉落在你夾著的招牌上，一路跟到渡口才飛走。"]},{"req":[{"alive":"tan"}],"lines":["阿檀追出來，把一把傘塞進你手裡。","tan|「鋪子是他們的。傘是我的。」","幾個月後，有人在沉鐘原看見一個左眼灰白的拾骨人，背著別人的遺物往回走。","他把東西賣給西街那間當鋪。新掌櫃壓價，壓得很狠。","他沒有還價。死人的東西，總得有人收。"]},{"req":[{"flag":"tan_dead"}],"lines":["你在櫃台底下找到阿檀修到一半的一把算盤。這個，算盤先生沒有點數。","幾個月後，有人在沉鐘原看見一個左眼灰白的拾骨人，背著別人的遺物往回走。","他把東西賣給西街那間當鋪。新掌櫃壓價，壓得很狠。","他沒有還價。死人的東西，總得有人收。"]}]},"e_jail":{"title":"下獄","lines":["第三筆案卷記上去那天，碑樓來了八個人，沒有一個人碰你的貨。","他們只帶走你。","你的牢房在碑樓底下，很乾，是整座鴉渡唯一不漏雨的地方。","隔壁的老頭每晚數牆上的刻痕，數到一半，就從頭再數。","你的鋪子貼了封條，貨全充了公，搬進碑樓的庫房。","庫房就在牢房上面，隔著一層木板。","有些夜裡，你聽見上頭有人在哭。聲音很熟，是你收過的東西。","你隔著木板，叫得出每一件的名字。它們聽見了，就安靜一點。","獄卒說，這個犯人怪，夜裡會跟天花板說話。","你沒有解釋。在鴉渡，聽得見的人，本來就該關起來。"],"variants":[{"req":[{"noflag":"huo_broken"}],"lines":[ 色灰布，打成張翅燕子形狀的結；腰間繫一隻巴掌大的木雕小燕；舊皮甲補丁疊補丁；背一柄比手臂還長的舊劍，劍鞘纏麻繩；嘴唇常抿著，眼神很直","barks":{"enter_buy":["「我要去{region}。錢就這些，挑最不會讓我死的。」","「{region}。要能撐到回來的，好看的不用。」","「上回那條繩子很牢。這次去{region}，再來一條。」","「我數過三遍了，就這麼多。夠去{region}嗎？」"],"enter_sell":["「從{region}回來了。東西都在這，你看著給。」","「{region}撿的。別壓太狠，行情我問過。」","「這些是{region}的。有綁灰布的東西，先拿給我看。」","「活著回來了。{region}的貨，你先挑。」"],"good_gear":["「這把比我哥的劍還順手。……別跟他說。」","「多謝。活著回來，我請你喝酒，不貴的那種。」","「你收這種價，自己吃得飽嗎？……多謝。」"],"bad_deal":["「你這價，比沉鐘原的亡兵還狠。」","「我記住了。下次先去別家問過再來。」","「我哥說當鋪的秤都是歪的。我以前不信。」"],"wounded":["「皮肉傷。扶我一下就好，一下就好。」","「差一點就見到我哥了。他大概會罵我笨。」"],"idle":["「你見過手腕綁灰布條的武僧嗎？很高，愛笑。」","「我哥會劈柴、會唱經，就是不會寫信。」","「阿檀哼的那個調子，我好像在哪聽過。」","「你們這門檻太高了，我每次都絆到。」"]},"death":{"report":"燕回死在{region}。拾骨人只帶回她的劍。她攢了一冬的錢，還藏在劍柄的夾層裡。","epitaph":"她找了哥哥十年。這一次，換哥哥來接她。"}},"li":{"name":"老厲","title":"賒帳的老兵","bio":["傭兵，五十有三。刀法還在，手已經抖了。","灰冕之亂打過七年仗，從不說自己是哪一營。","欠遍西街的酒錢，逢人就說要死在亡域。"],"look":"五十多歲的老兵，灰白亂髮與鬍渣，酒糟鼻，右耳缺了半片；左臂一塊刺青被刀刮爛，看不出營號；舊札甲只剩胸片，外罩破油布斗篷；腰間掛一個磨得發亮的黑酒葫蘆","barks":{"enter_buy":["「去{region}。給我配齊，錢不夠的……先記著。」","「{region}啊。老子當年打過那邊，那時還有活人。」","「要酒。喔，你這不賣酒。那給我繩子跟刀。」","「又要去{region}了。大概回不來，挑便宜的。」"],"enter_sell":["「{region}帶回來的。死人用不著，我也用不著。」","「掌櫃的，估價。估完我去喝掉一半。」","「從{region}爬回來了。命硬，沒辦法。」","「這些是軍中的東西。上面的營號，我都認得。」"],"good_gear":["「好刀。可惜給了我這種人。」","「你這小子，跟誰學的心軟？會吃虧的。」","「這甲跟我當年那副一樣重。……謝了。」"],"bad_deal":["「坑一個快死的人，你晚上睡得著？我是睡不著。」","「行。這價錢，就當我替你積陰德。」","「嘖。跟開鋪子的打交道，比打仗還累。」"],"wounded":["「沒死成。……又沒死成。」","「別叫大夫。叫酒。」"],"idle":["「下雨天舊傷就叫，叫得比烏鴉還響。」","「碑樓的霍都尉？哼，我們以前喝過同一壺酒。」","「你知道雨夜的水門有多吵嗎？全是鐵鏈的聲音。」","「你那學徒的嘴，比我當年的伍長還毒。」"]},"death":{"report":"老厲死在{region}。同行的說他沒逃，靠著一堆白骨把酒喝完，才倒下。","epitaph":"欠了一輩子酒錢，到死只想還一筆命債。"}},"su":{"name":"蘇杳","title":"收詛咒的","bio":["術士，三十歲。專門研究遺物裡的殘念。","高價收購詛咒物，付錢從不還價。","她說死人不是在作祟，是在說話。"],"look":"三十歲的女術士，瘦削蒼白，黑髮盤成髻、插兩支炭筆；右眼戴單片水晶鏡；深灰長袍，袖口沾滿墨漬與蠟油；腰間掛一排小玻璃瓶，裝著碎骨和灰；指尖有許多細小割傷","barks":{"enter_buy":["「去{region}採樣。安神香，越多越好。」","「{region}的念比較稠。要能聽清楚，又不會聽瘋的。」","「銅鈴兩個。別推薦刀，我用不到。」","「要去{region}了。有怪東西，回來先賣你。」"],"enter_sell":["「{region}的樣本記錄完了，剩下的賣你。」","「這些在{region}一直跟我說話。你要聽嗎？開玩笑的。」","「從{region}回來了。這件我留著，其他估價 "lvl5_fang"},{"flag":"lvl5_ya"},{"alive":"fang"},{"alive":"ya"},{"in_town":"fang"},{"in_town":"ya"}],"priority":6,"once":true,"who":"ya","title":"活招牌","lines":["傍晚，骨棚那邊傳來小牙的聲音，整條西街都聽得見。","ya|「各位！我小牙能活到今天，全靠西街那間鋪子！」","ya|「他賣的盾，大象踩上去都不會凹！」","fang|「沒有大象。」","ya|「那是因為大象都怕了！」","骨棚笑成一團。天還沒黑，這段話已經傳遍了渡口。"],"choices":[{"text":"……多備點貨。","fx":[{"rep":["guild",20]},{"customers":3},{"trust":["fang",5]},{"trust":["ya",5]}],"lines":["tan|「掌櫃的，大象是什麼？」","me|「一種沒人見過的東西。跟小牙的戰功一樣。」"]}]},{"id":"a_tan_1","phase":"morning","day":[3,14],"priority":3,"once":true,"who":"tan","title":"學鑑定","lines":["阿檀把一塊玉佩舉到你眼前，舉得太近，差點戳進你的念瞳。","tan|「掌櫃的，教我鑑定。老戚只教到『別被騙』，沒教怎麼不被騙。」","tan|「這塊我看過了。翠綠、冰透，至少八十兩。」","你用指甲刮了一下。綠色掉了，底下是染過的石頭。","tan|「……那它值多少？」"],"choices":[{"text":"教妳。先學刮。","fx":[{"trust":["tan",10]}],"lines":["那天下午，阿檀刮遍了店裡每一塊玉。","刮到第七塊，她舉手報告：「這塊是真的！……現在有刮痕了。」"]},{"text":"值一頓教訓。","fx":[{"trust":["tan",5]}],"lines":["tan|「教訓多少錢一頓？從我的工錢扣。」","me|「我沒給妳工錢。」","tan|「那就對了，我們扯平。」"]},{"text":"妳先學閉嘴。","fx":[{"trust":["tan",-5]}],"lines":["tan|「那你先學說人話。看誰學得快。」"]}]},{"id":"a_tan_2","phase":"morning","day":[8,30],"req":[{"trust":["tan",10]}],"priority":3,"once":true,"who":"tan","title":"又會響了","lines":["阿檀趴在工作台上睡著了，臉上沾著銅屑。","她手邊是那個裂成三瓣的銅鈴。收來的時候，誰都說沒救了。","現在它是完整的。裂縫用銀絲細細縫起來，像一道道小河。","你輕輕一碰，它響了。聲音很低，很長，屋裡的灰塵都停了。","tan|「……別碰，我還沒調完音。」","她眼睛都沒睜。"],"choices":[{"text":"好手藝。","fx":[{"item":{"t":"c_bell","tier":4,"name":"銀絲銅鈴","tags":["bronze","silver","monk"],"curse":["requiem",1]}},{"trust":["tan",10]}],"lines":["tan|「我知道。」","她翻了個身，又睡了。嘴角是翹的。"]},{"text":"這能賣多少？","fx":[{"item":{"t":"c_bell","tier":4,"name":"銀絲銅鈴","tags":["bronze","silver","monk"],"curse":["requiem",1]}},{"trust":["tan",-5]}],"lines":["tan|「能賣你的良心那麼多。」","tan|「不多。」"]}]},{"id":"a_tan_3","phase":"morning","day":[12,42],"priority":3,"once":true,"who":"tan","title":"發燒","lines":["阿檀開門的時候手一直在抖，鑰匙對了三次才對準鎖孔。","她的臉紅得不正常，額頭燙手。","tan|「我沒事。燒這點，剛好省炭。」","tan|「今天你一個人顧店，會把東西全賤賣光。」"],"choices":[{"text":"請大夫。","hint":"−40 兩","fx":[{"cash":-40},{"trust":["tan",15]}],"lines":["大夫說是淋雨淋出來的，開了三帖藥。","阿檀邊喝邊罵藥苦，罵到一半睡著了，手還抓著你的袖子。"]},{"text":"我顧店，妳睡。","fx":[{"trust":["tan",10]},{"sanity":-5}],"lines":["你一個人顧了一天店。賣錯兩件，找錯三次錢。","傍晚她醒來，看了帳本一眼，燒又高了一點。"]},{"text":"多喝熱水。","fx":[{"trust":["tan",-10]}],"lines":["tan|「……掌櫃的。」","tan|「你這句話，比我的病還讓人想死。」"]}]},{"id":"a_tan_4","phase":"night","day":[15,44],"req":[{"trust":["tan",20]}],"priority":3,"once":true,"who":"tan","title":"半段調子","lines":["半夜醒來，你聽見後堂有人在哼歌。","是阿檀。調子很慢，很低，像鐘聲被拉長了。","架上那幾件整天竊竊私語的詛咒物，一件一件安靜下來。","你的左眼，第一次不痛了。","她唱到一半停住，反覆試了幾個音，都不對。","tan|「……後面是什麼來著。從小就會，就是接不下去。」"],"choices":[{"text":"再唱一次。","fx":[{"sanity":10},{"trust":["tan",10]},{"note":"阿檀哼的調子，能讓店裡的詛咒物安靜下來。她只記得前半段。"}],"lines":["她嚇了一跳，回頭瞪你，耳朵紅了。","然後，她又從頭唱了一遍。"]},{"text":"早點睡。","fx":[{"sanity":5},{"trust":["tan",5]}],"lines":["tan|「你才早點睡。偷聽的人，耳朵會長繭。」","燈熄了。那段調子，在你夢裡又響了一次。"]}]},{"id":"a_tan_5","phase":"morning","day":[16,50],"req":[{"sanity_lt":55}],"priority":4,"once":true,"who":"tan","title":"帳本","lines":["你一下樓，帳本就砸在你胸口。","tan|「你昨晚又讀念了。三次。我數了。」","tan|「你流鼻血流到天亮，枕頭都是紅的。你當我瞎嗎？」","tan|「你要是倒了，這鋪子我一個人撐不住。」","tan|「……我是說，帳我一個人算不完。」"],"choices":[{"text":"我錯了。","fx":[{"trust":["tan",10]},{"sanity":5}],"lines":["tan|「錯了就去洗臉。滿臉血，客人以為我們賣兇器。」","她轉身去煮粥。背影還在生氣。"]},{"text":"不關妳的事。","fx":[{"trust":["tan",-15]},{"flag":"tan_fight"},{"queue":["a_tan_6",1]}],"lines":["阿檀的臉一下子白了。","tan|「……好。不關我的事。」","那一整天，她只跟客人說話。"]}]},{"id":"a_tan_6","phase":"night","req":[{"flag":"tan_fight"}],"priority":5,"once":true,"who":"tan","title":"三個包子","lines":["打烊後，你的房門口放著一個盤子。","三個包子，還是熱的。盤子底下壓著一張紙條：","「沒下毒。下次再讀到流鼻血，就有。」","紙條背面，還有一行很小的字：「我只剩這間鋪子了。」"],"choices":[{"text":"去跟她道歉。","fx":[{"unflag":"tan_fight"},{"trust":["tan",25]}],"lines":["你敲了敲後堂的門。門裡安靜了很久。","tan|「……包子吃了沒？」","me|「吃了。」","tan|「那就原諒你。」"]},{"text":"把包子吃完。","fx":[{"unflag":"tan_fight"},{"trust":["tan",15]}],"lines":["你吃完三個，把盤子洗乾淨，放回她門口。","隔天一早，她又開始罵你了。一切照舊。"]}]},{"id":"a_tan_7","phase":"night","day":[10,50],"req":[{"room":"cellar"},{"trust":["tan",30]}],"priority":3,"once":true,"who":"tan","title":"地窖的樓梯","lines":["你要下地窖。阿檀提著燈跟 別亂改，上回差點把灶房燻黑。」"}},"world":{"news":[{"id":"nw_001","text":"西街的雨下到第九天，碑樓說再下就要封渡口。","when":{}},{"id":"nw_002","text":"碑樓貼出新通緝：鴉巷少年一名，專偷碑兵的靴子。","when":{}},{"id":"nw_003","text":"白燭堂佈道：「死者無言，便是安息。」聽的人比上月多。","when":{}},{"id":"nw_004","text":"金秤行放出新一批貸銀，帳房說利錢「只比去年高一點」。","when":{}},{"id":"nw_005","text":"夜市有人叫賣會眨眼的玻璃珠，天一亮攤子就不見了。","when":{}},{"id":"nw_006","text":"渡口船價又漲。船老大說往北只收單程，回程看命。","when":{}},{"id":"nw_007","text":"骨棚失物招領：左腿一條、殘圖半張、牙三顆，認領從速。","when":{}},{"id":"nw_008","text":"碑樓懸賞射烏鴉，十隻一兩。烏鴉沒少，碑兵的箭少了。","when":{}},{"id":"nw_009","text":"骨棚公告：出城前請把名字寫清楚，免得回來時沒人認得。","when":{}},{"id":"nw_010","text":"渡口客棧推出「出城套餐」：一頓飽飯、一壺酒、一張遺書紙。","when":{}},{"id":"nw_011","text":"棺材鋪貼出告示：預訂從速，灰潮期間恕不賒帳。","when":{}},{"id":"nw_012","text":"鴉渡第一屆「誰活得最久」賭盤開張，莊家已失蹤兩天。","when":{}},{"id":"nw_013","text":"酒館老闆宣布：賒帳的拾骨人若沒回來，帳記在烏鴉頭上。","when":{}},{"id":"nw_014","text":"雨停了半個時辰，西街的人全跑出來看天，然後又下了。","when":{}},{"id":"nw_015","text":"連下十二天雨，鴉巷屋頂長出蕈子，孩子們摘去夜市賣了。","when":{}},{"id":"nw_016","text":"夜市新開一攤，專賣死人的最後一句話，一兩三句。","when":{}},{"id":"nw_017","text":"夜市來了個不說話的攤主，只收澐國古錢，不收銀子。","when":{}},{"id":"nw_018","text":"渡口老船夫宣布收山，說他這輩子載過的死人比活人多。","when":{}},{"id":"nw_019","text":"碑樓重申：私藏雷火藥者杖四十，鋪契充公。","when":{}},{"id":"nw_020","text":"碑樓新設夜禁，戌時後在街上走的，先問名字再問話。","when":{}},{"id":"nw_021","text":"一名碑兵在鴉巷被扒走腰牌，碑樓懸賞二十兩找回。","when":{}},{"id":"nw_022","text":"白燭堂今日收詛咒物，一件賞銀三兩，隊伍繞了兩條街。","when":{}},{"id":"nw_023","text":"素蓮主祭在渡口施粥：「吃飽的人，不會聽見死人說話。」","when":{}},{"id":"nw_024","text":"骨棚今天掛出三十七塊木牌，每一塊都繫著紅繩。","when":{}},{"id":"nw_025","text":"老鷂在骨棚門口罵了半個時辰的人，罵的是一個死人。","when":{}},{"id":"nw_026","text":"算盤先生昨天收帳被狗追，他說那條狗也欠金秤行錢。","when":{}},{"id":"nw_027","text":"灰鴉會今日不收規費，說是烏十一生日，各家照例送禮。","when":{}},{"id":"nw_028","text":"老鷂的假手又不見了。骨棚告示：拿去撓背的，請洗乾淨再還。","when":{}},{"id":"nw_029","text":"東街的寡婦第四次辦喜事，媒人說這回的拾骨人很會跑。","when":{}},{"id":"nw_030","text":"渡口撈起一只木箱，裡面整整一箱沒寄出去的家書。","when":{}},{"id":"nw_031","text":"有人在碑樓門口賣通緝犯畫像，畫得比告示上的還像。","when":{}},{"id":"nw_032","text":"鴉巷的孩子學會一首新童謠，大人聽了都叫他們閉嘴。","when":{}},{"id":"nw_033","text":"北營又來徵兵，鐵匠鋪連夜打槍頭，鐵價跟著漲。","when":{}},{"id":"nw_034","text":"骨棚說上月折了十一隊，舊甲沒人送回來，皮甲一件難求。","when":{}},{"id":"nw_035","text":"白燭堂說灰潮將至，城裡的銅鈴與符牌被搶購一空。","when":{}},{"id":"nw_036","text":"枯河屍菌開花，藥鋪的解毒散一天漲三次價。","when":{"region":"river"}},{"id":"nw_037","text":"南方來的收藏家住進渡口客棧，專收澐宮舊物。","when":{}},{"id":"nw_038","text":"伐木隊三天沒回來，西街的木料價錢翻了一倍。","when":{}},{"id":"nw_039","text":"鹽價三天翻倍。碑樓說有人囤鹽，鹽鋪說有人怕鬼。","when":{}},{"id":"nw_040","text":"皮匠鋪收不到牛皮，開始收拾骨人留下的舊甲來改。","when":{}},{"id":"nw_041","text":"金秤行今日放款利錢降一分，條件是押上鋪契。","when":{}},{"id":"nw_042","text":"北原商隊進城，見刀就買，連生鏽的都要。","when":{}},{"id":"nw_043","text":"沉鐘原的風裡又有鐘聲，骨棚把那條路的木牌翻成紅面。","when":{"region":"bell"}},{"id":"nw_044","text":"一隊拾骨人在沉鐘原紮營，早上醒來，營外跪滿了亡兵。","when":{"region":"bell"}},{"id":"nw_045","text":"枯河地窟屍菌季到了，從霧裡出來的人，咳出來都是灰的。","when":{"region":"river"}},{"id":"nw_046","text":"拾骨隊「黑燕」十二人進枯河地窟，第五天只回來一頭騾子。","when":{"region":"river"}},{"id":"nw_047","text":"白骨修道院的迴廊多了一隊骸兵，骨棚說它們在換班。","when":{"region":"abbey"}},{"id":"nw_048","text":"一隊人從白骨修道院回來，點了三遍名，還是多出一個。","when":{"region":"abbey"}},{"id":"nw_049","text":"星墜坑的星晶整夜在唱，回來的人都在哼那個調子。","when":{"region":"crater"}},{"id":"nw_050","text":"一名術士在星墜坑待了五天，回來後只會用唱的說話。","when":{"region":"crater"}},{"id":"nw_051","text":"沉鐘城水位退了三尺，露出一排沒人敢踩的屋頂。","when":{"region":"capital"}},{"id":"nw_052","text":"船夫說沉鐘城的水底亮著燈，像有人在家。","when":{"region":"capital"}},{"id":"nw_053","text":"骨棚把{region}的路牌翻成紅面，老鷂說：「想死的排隊。」","when":{"region":"river"}},{"id":"nw_054","text":"從{region}回來的騾子不肯進城，站在城門口發抖。","when":{"region":"abbey"}},{"id":"nw_055","text":"灰潮來了。碑樓要各家門口撒鹽，鹽鋪的隊排到渡口。","when":{"tide":true}},{"id":"nw_056","text":"灰潮期間夜市照開，只是不准賣鏡子。","when":{"tide":true}},{"id":"nw_057","text":"昨夜灰潮漫過北堤，守堤的碑兵說，霧裡有人喊他小名。","when":{"tide":true}},{"id":"nw_058","text":"白燭堂徹夜點燭，說是替城裡沒人記得的死人點的。","when":{"tide":true}},{"id":"nw_059","text":"灰潮期間骨棚不收新名字。老鷂說：「等潮退了再來送死。」","when":{"tide":true}},{"id":"nw_060","text":"灰潮夜，渡口的船全拴上鐵鍊，船夫說是怕船自己走。","when":{"tide":true}},{"id":"nw_061","text":"灰潮未退，碑樓下令城門晚開一個時辰，早市延後。","when":{"tide":true}},{"id":"nw_062","te },{"id":"ru_002","type":"inspect","text":"一個碑兵在酒館說溜了嘴：明天西街挨家查。"},{"id":"ru_003","type":"inspect","text":"有人看見霍都尉案頭攤著西街的鋪子圖，上面畫了圈。"},{"id":"ru_004","type":"inspect","text":"鴉巷的孩子說，碑兵今晚都在擦靴子，明天要上門。"},{"id":"ru_005","type":"inspect","text":"隔壁米鋪連夜把後門的貨搬走了，說是碑樓有風聲。"},{"id":"ru_006","type":"inspect","text":"碑樓借走了鐵匠鋪所有的撬棍，說明早就還。"},{"id":"ru_007","type":"inspect","text":"有碑兵在抄西街的門牌，一戶一戶抄，抄得很慢。"},{"id":"ru_008","type":"inspect","text":"烏十一捎話：明天碑樓的靴子，會踩到你家門口。"},{"id":"ru_009","type":"inspect","text":"碑樓的文書在茶館嘆氣：明天清點西街，午飯又沒了。"},{"id":"ru_010","type":"inspect","text":"新的搜查令連夜寫好了，墨還沒乾，寫的是西街。"},{"id":"ru_011","type":"market_weapon","text":"北營的徵兵官在渡口下船了，鐵匠鋪連夜生火。"},{"id":"ru_012","type":"market_weapon","text":"骨棚說沉鐘原的亡兵多了，刀劍明天會不夠賣。"},{"id":"ru_013","type":"market_weapon","text":"北原商隊明天進城，聽說見刀就買，連鏽的都要。"},{"id":"ru_014","type":"market_weapon","text":"碑樓要擴編一百名守衛，兵器鋪老闆笑了一整晚。"},{"id":"ru_015","type":"market_weapon","text":"運鐵礦的船在澐水翻了，鐵匠說刀明天要漲。"},{"id":"ru_016","type":"market_armor","text":"骨棚說下一批人要進白骨修道院，甲冑會被搶光。"},{"id":"ru_017","type":"market_armor","text":"城裡唯一的皮匠病倒了，三天沒人縫甲。"},{"id":"ru_018","type":"market_armor","text":"碑樓明天要給新兵配甲，舊甲鋪會被搬空。"},{"id":"ru_019","type":"market_armor","text":"灰潮前誰都想多一層皮，盾牌明天會很好賣。"},{"id":"ru_020","type":"market_armor","text":"一隊拾骨人穿著薄甲回來，只回來一半，大家都在找厚甲。"},{"id":"ru_021","type":"market_charm","text":"白燭堂說灰潮要提早來，銅鈴明天會被搶光。"},{"id":"ru_022","type":"market_charm","text":"骨棚好幾個人說夢見死去的隊友，大家都在找護符。"},{"id":"ru_023","type":"market_charm","text":"星墜坑回來的瘋子多了，符牌明天會漲。"},{"id":"ru_024","type":"market_charm","text":"素蓮主祭明天要講「念」，聽完的人都會想買護身的東西。"},{"id":"ru_025","type":"market_charm","text":"鴉巷在傳：戴骨哨的人，霧裡找得到回家的路。"},{"id":"ru_026","type":"market_kit","text":"枯河的屍菌開花了，解毒散明天會缺貨。"},{"id":"ru_027","type":"market_kit","text":"渡口的糧船晚了三天，乾糧明天要漲。"},{"id":"ru_028","type":"market_kit","text":"藥鋪老闆被請去碑樓問話，金創藥沒人做了。"},{"id":"ru_029","type":"market_kit","text":"骨棚說下一批人要往深處走，麻繩和燈會被搶。"},{"id":"ru_030","type":"market_kit","text":"鹽鋪說明天鎮鹽要限購，今晚就有人去排隊了。"},{"id":"ru_031","type":"market_curio","te rity":0,"once":false,"who":null,"title":"求藥","lines":["三更天，有人拚命拍門。","門外是個渾身濕透的婦人，懷裡的孩子燒得滿臉通紅。","stranger|「藥鋪不開門，求求你，什麼藥都好。」"],"choices":[{"text":"拿店裡的藥給她","req":[{"cash":15}],"hint":"−15 兩","fx":[{"cash":-15},{"rep":["folk",4]},{"sanity":3}],"lines":["你把櫃裡最後一帖退熱散塞進她手裡。","她跪在雨裡磕頭，你沒等她磕完就關上了門。"]},{"text":"拿她的金釵換藥","fx":[{"item":{"t":"v_hairpin","tier":2,"tags":["common","gold","love","town"],"prov":"clean"}},{"rep":["folk",-2]}],"lines":["她拔下頭上的金釵，手抖得差點掉在地上。","stranger|「這是我出嫁那天戴的。」","她抱著藥跑進雨裡，沒有回頭。"]},{"text":"不開門","fx":[{"sanity":-3}],"lines":["拍門聲響了很久，後來停了。","你一直沒睡著，耳朵裡全是孩子的哭聲。"]}]},{"id":"n_dog","phase":"night","day":[2,40],"req":[{"noflag":"dog"}],"chance":0.1,"priority":0,"once":false,"who":"tan","title":"野狗","lines":["打烊時，門口蹲著一條瘦狗。","牠一身泥，右耳缺了一角，盯著你手上的飯糰，不叫也不走。","tan|「別看我。是你先跟牠對上眼的。」"],"choices":[{"text":"收留牠","req":[{"cash":5}],"hint":"−5 兩","fx":[{"cash":-5},{"flag":"dog"},{"sanity":3},{"trust":["tan",2]}],"lines":["阿檀嘴上嫌髒，還是燒了一盆熱水給牠洗澡。","洗乾淨才知道是條黃狗。阿檀叫牠「利息」，說牠會越養越大。"]},{"text":"丟塊骨頭給牠","fx":[{"rep":["folk",1]}],"lines":["牠叼著骨頭走了。","走到巷口，牠回頭看了你一眼，像在記門牌。"]},{"text":"趕走牠","fx":[{"sanity":-1}],"lines":["牠夾著尾巴跑進雨裡。","半夜，你好像聽見門外有爪子在刮門。"]}]},{"id":"n_dog_thief","phase":"night","day":[3,55],"req":[{"flag":"dog"}],"chance":0.08,"priority":0,"once":false,"who":"tan","title":"狗吠","lines":["半夜，利息突然對著後門狂吠。","你點燈衝過去，只看見一條黑影翻過牆頭。","牆根下掉了一根撬棍，上面還有新鮮的牙印。","tan|「養狗比養碑兵划算，牠只吃剩飯。」"],"choices":[{"text":"賞牠一塊肉","hint":"−2 兩","fx":[{"cash":-2},{"sanity":2}],"lines":["利息吃完肉，在後門口趴了一整夜，耳朵一直豎著。"]},{"text":"撬棍送去碑樓","fx":[{"rep":["watch",2]},{"rep":["crows",-2]}],"lines":["碑兵翻看撬棍上的刻痕，說認得是誰的。","隔天，鴉巷有人看你的眼神不太對。"]},{"text":"撬棍留著自己用","fx":[{"item":{"t":"m_metal","tier":1,"name":"撬棍","tags":["iron","town"],"prov":"grey"}}],"lines":["好鐵，比你店裡那把還順手。"]}]},{"id":"n_drunk","phase":"night","day":[2,55],"chance":0.1,"priority":0,"once":false,"who":null,"title":"醉漢","lines":["有人在門外砸門，砸得門閂都在跳。","stranger|「開門！我兄弟就是背著你們家的刀死在河裡的！」","門縫裡看得見他的臉，喝得通紅，哭得也通紅。"],"choices":[{"text":"開門聽他說","fx":[{"sanity":-3},{"rep":["guild",3]}],"lines":["他坐在門檻上哭了半夜，說的全是他兄弟小時候的事。","天亮前他睡著了。你給他蓋了條毯子。"]},{"text":"叫碑兵來","fx":[{"rep":["watch",1]},{"rep":["guild",-3]}],"lines":["碑兵把他拖走了。","他一路還在喊那把刀的名字，喊得整條西街都聽見。"]},{"text":"塞幾兩打發他","req":[{"cash":10}],"hint":"−10 兩","fx":[{"cash":-10},{"rep":["guild",1]}],"lines":["他把銀子摔在地上。","過了一會兒，又一枚一枚撿了回去。"]}]},{"id":"n_li_drunk","phase":"night","day":[8,55],"req":[{"alive":"li"},{"in_town":"li"}],"chance":0.08,"priority":0,"once":false,"who":"li","title":"老兵","lines":["門外有人在唱軍歌，荒腔走板，唱到一半就停了。","你開門，老厲靠著門框坐在雨裡，酒葫蘆空了。","li|「掌櫃的，借個屋簷。今晚不想回骨棚，那裡活人太多。」"],"choices":[{"text":"讓他進來睡","fx":[{"trust":["li",5]},{"sanity":-2}],"lines":["他睡在櫃台後面，夢話全是人名。","天亮時他已經走了，櫃台上留著兩枚銅板。"]},{"text":"陪他喝一杯","hint":"−3 兩","fx":[{"cash":-3},{"trust":["li",3]},{"sanity":2}],"lines":["li|「我跟你說，那一夜，雨也是這麼大。」","他說到這裡就不說了。你替他把酒倒滿。"]},{"text":"勸他回骨棚","fx":[{"trust":["li",-3]}],"lines":["li|「也是。」","他扶著牆走了，走了很遠，還聽得見他在唱。"]}]},{"id":"n_crow_kid","phase":"night","day":[2,55],"chance":0.1,"priority":0,"once":false,"who":null,"title":"小賊","lines":["後庫有響動。你摸黑過去，一把揪住一條細瘦的手臂。","是個鴉巷的孩子，十歲上下，懷裡抱著一面銅鏡，嚇得忘了跑。","crow|「放、放開！我是烏老大的人！」"],"choices":[{"text":"押去碑樓","fx":[{"rep":["watch",3]},{"rep":["crows",-6]},{"heat":-2}],"lines":["碑兵把他拎走時，他回頭看了你一眼。","那個眼神，像個大人。"]},{"text":"讓他帶走鏡子","fx":[{"cash":-12},{"rep":["crows",4]},{"rep":["folk",1]}],"lines":["他愣了一下，抱著鏡子翻牆走了。","隔天一早，門口多了一包烤地瓜，還是溫的。"]},{"text":"請他吃頓飯","hint":"−2 兩","fx":[{"cash":-2},{"rep":["crows",2]},{"sanity":2}],"lines":["他吃得很快，像怕你反悔。","吃完他抹抹嘴：「你家後牆左邊第三塊磚是鬆的。」說完就走了。"]}]},{"id":"n_fire","phase":"night","day":[3,55],"chance":0.05,"priority":0,"once":true,"who":"tan","title":"失火","lines":["半夜有人敲鑼喊失火。隔壁的油行燒起來了。","火舌已經舔上你家的屋簷，這場雨小得像在看熱鬧。","tan|「掌櫃的！後庫的貨！」","油行的閣樓上，有個孩子在哭。"],"choices":[{"text":"先救人","fx":[{"rep":["folk",6]},{"cash":-40},{"sanity":2}],"lines":["你踹開油行的後門，把老闆娘和她女兒拖了出來。","回頭時，你家後庫的屋簷已經塌了一角。"]},{"text":"先搶自家的貨","fx":[{"rep":["folk",-5]},{"trust":["tan",-2]}],"lines":["你和阿檀把貨一箱箱搬到街上。","孩子是碑兵抱出來的。整條街的人看著你，沒人說話。"]},{"text":"砍斷屋簷擋火","fx":[{"cash":-20},{"sanity":-4},{"rep":["folk",3]}],"lines":["你掄起斧頭，把連著兩家的屋簷砍斷。","火停在斷口那頭。孩子被鄰居救下來了，你的手掌磨掉一層皮。"]}]},{"id":"n_corpse","phase":"night","day":[3,55],"chance":0.06,"priority":0,"once":false,"who":null,"title":"門口的人","lines":["打烊後你去倒水，差點被門口的東西絆倒。","一具拾骨人的屍體，臉朝下趴在你的台階上，背包被翻空了。","他手裡還攥著一張當票，是你家的。"],"choices":[{"text":"報碑樓","fx":[{"heat":5},{"rep":["watch",2]}],"lines":["碑兵翻來覆去問了你半個時辰。","你這才知道，報案的人比殺人的人還難睡。"]},{"text":"送去骨棚","req":[{"cash":5}],"hint":"−5 兩","fx":[{"cash":-5},{"rep":["guild",4]},{"sanity":-2}],"lines":["你推著板車把他送到骨棚。","老鷂掀開草蓆看了一眼：「沒名字的，又一個。」"]},{"text":"趁夜拖去河邊","fx":[{"sanity":-6},{"rep":["crows",1]}],"lines":["澐水收下了他，一聲也沒響。","回來時，你看見鴉巷的一個孩子蹲在屋簷上，朝你豎了根大拇指。"]}]},{"id":"n_wrong_crate","phase":"night","day":[3,55],"chance":0.06,"priority":0,"once":false,"who":null,"title":"送錯的貨","lines":["夜裡一輛板車停在門口，車夫卸下一只木箱就要走。","clerk|「西街當鋪，簽收。」","箱子上的封條，寫的卻是金秤行。一晃，裡面就有銀器碰撞的聲音。"],"choices":[{"text":"叫住車夫退回","fx":[{"rep":["scale",4]}],"lines":["車夫罵了一句，把箱子扛回車上。","隔天算盤先生路過，難得朝你點了一下頭。"]},{"text":"開箱摸一件","fx":[{"item":{"t":"c_ring","tier":3,"tags":["noble","silver","town"],"prov":"stolen"}},{"heat":4},{"rep":["scale",-5]}],"lines":["箱裡是一疊抵押的首飾，每件都繫著金秤行的竹籤。","你挑了一枚銀戒，把封條按回去，把箱子推回門外。"]},{"text":"連夜送去金秤行","fx":[{"cash":10},{"rep":["scale",2]},{"sanity":-1}],"lines":["夜班帳房數了三遍，賞你十兩跑腿錢。","他說：「東家說，誠實是一種很貴的習慣。」"]}]},{"id":"n_rain_guest","phase":"night","day":[3,52],"chance":0.08,"priority":0,"once":false,"who":null,"title":"雨夜客","lines":["雨下得像有人在屋頂上倒水。","門口站著一個披斗篷的人，帽簷壓得很低，聲音很年輕。","stranger|「一晚就好。我沒有錢，只有這個。」","他攤開手，是一面巴掌大的銅鏡，鏡面朝下。"],"choices":[{"text":"收鏡子讓他住","fx":[{"item":{"t":"v_mirror","tier":3,"tags":["noble","bronze","capital"],"curse":["whisper",1],"prov":"grey"}},{"sanity":-2}],"lines":["他睡在前店的長凳上，一夜沒翻身。","天亮時人不見了，門閂還從裡面扣著。"]},{"text":"讓他住，不收","fx":[{"rep":["folk",2]},{"sanity":2},{"queue":["mo_guest_gift",3]}],"lines":["他在長凳上坐了一夜，沒睡。","臨走前，他把鏡子揣回懷裡：「你跟老戚一樣傻。」"]},{"text":"不讓他進門","fx":[{"sanity":-3}],"lines":["他點點頭，轉身走進雨裡。","你從門縫看出去，雨裡沒有人，泥地上也沒有腳印。"]}]},{"id":"n_candle_patrol" ","phase":"night","day":[3,55],"chance":0.08,"priority":0,"once":false,"who":null,"title":"遺孀","lines":["一個女人抱著包袱站在門口，雨水順著頭髮往下流。","stranger|「他走了三個月，骨棚說不用等了。這些……你看值多少。」","包袱裡是一副皮甲，胸口補了好幾層，針腳很密。"],"choices":[{"text":"給公道價","req":[{"cash":35}],"hint":"−35 兩","fx":[{"cash":-35},{"item":{"t":"a_leather","tier":2,"tags":["common","bell"],"prov":"clean"}},{"rep":["folk",3]}],"lines":["她數了兩遍，把錢收好。","stranger|「他說過，西街的當鋪不坑人。」"]},{"text":"壓到一半","req":[{"cash":15}],"hint":"−15 兩","fx":[{"cash":-15},{"item":{"t":"a_leather","tier":2,"tags":["common","bell"],"prov":"clean"}},{"rep":["folk",-3]},{"sanity":-2}],"lines":["她沒有還價。","走之前，她把皮甲上的灰拍乾淨了，才交到你手上。"]},{"text":"叫她留著","fx":[{"rep":["folk",2]},{"sanity":3}],"lines":["她抱著包袱站了很久。","stranger|「那我……再等等他。」"]}]},{"id":"n_ash_bow","phase":"night","day":[4,55],"chance":0.06,"priority":0,"once":false,"who":null,"title":"黑腿","lines":["門口蹲著一個年輕拾骨人，抖得像片葉子，十根指甲都是灰白的。","stranger|「收我的弓。我要買白灰，腿上的傷痛得睡不著。」","他的弓很好。他的腿，已經黑到膝蓋了。"],"choices":[{"text":"收弓","req":[{"cash":25}],"hint":"−25 兩","fx":[{"cash":-25},{"item":{"t":"w_bow","tier":3,"tags":["common","wood","river"],"prov":"clean"}}],"lines":["他拿著銀子，一拐一拐往夜市走。","你知道他會去買什麼，也知道那救不了他。"]},{"text":"收弓，帶他看大夫","req":[{"cash":40}],"hint":"−40 兩","fx":[{"cash":-40},{"item":{"t":"w_bow","tier":3,"tags":["common","wood","river"],"prov":"clean"}},{"rep":["guild",3]},{"sanity":2}],"lines":["大夫鋸掉了他的腿。","他醒來的第一句話是：「我的弓呢？」"]},{"text":"不收","fx":[{"sanity":-2}],"lines":["他抱著弓，一拐一拐走進雨裡。往夜市的方向。"]}]},{"id":"n_crate_knock","phase":"night","day":[3,55],"chance":0.08,"priority":0,"once":false,"who":"tan","title":"箱子裡","lines":["後庫的木箱裡，有東西在敲。","叩、叩、叩。停一下。叩、叩、叩。","tan|「箱子是你收的，你自己去。我在這裡幫你……幫你看門。」"],"choices":[{"text":"開箱看","fx":[{"sanity":-5},{"cash":15}],"lines":["箱裡只有一件舊袍子，袖子在動。","你把它攤平，摸到內襯裡縫著一包碎銀。敲聲停了。"]},{"text":"壓一塊鎮鹽","req":[{"cash":5}],"hint":"−5 兩","fx":[{"cash":-5},{"sanity":-1}],"lines":["敲聲停了。","天亮後，那塊鹽變成灰色，上面有五道指痕。"]},{"text":"請白燭會來","req":[{"cash":10}],"hint":"−10 兩","fx":[{"cash":-10},{"rep":["candle",2]},{"he wder","tier":2,"tags":["military","town"],"prov":"wanted"}}],"lines":["他放下十兩就跑了，再也沒回來取。","那包藥，現在是你的了。"]},{"text":"交給碑樓","fx":[{"rep":["watch",4]},{"heat":-3},{"rep":["crows",-1]}],"lines":["碑兵接過油紙包，誇了你一句「良民」。","第二天，通緝告示上多了那個男人的臉，畫得比本人還兇。"]},{"text":"叫他滾","fx":[{"sanity":-2}],"lines":["他罵了一句，抱著油紙包衝進雨裡。","沒多久，渡口那邊傳來一聲悶響。"]}]},{"id":"mo_wanted_face","phase":"morning","day":[3,55],"chance":0.08,"priority":0,"once":false,"who":"tan","title":"通緝告示","lines":["開門前，阿檀把一張通緝告示拍在櫃台上。","tan|「你看這張臉，像不像昨天來當玉佩的那個？」","告示上寫著：「殺害巡夜碑兵，賞銀五十兩。」"],"choices":[{"text":"去碑樓報案","fx":[{"rep":["watch",4]},{"heat":-4},{"rep":["crows",-3]}],"lines":["碑兵記下你的話，說賞銀等抓到人再給。","那天下午，有人在你門口吐了一口痰。"]},{"text":"當作沒看見","fx":[{"heat":4}],"lines":["你把告示翻過去，壓在算盤底下。","tan|「掌櫃的，碑兵也是認得字的。」"]},{"text":"找鴉巷打聽","req":[{"cash":10}],"hint":"−10 兩","fx":[{"cash":-10},{"rep":["crows",2]}],"lines":["鴉巷的人收了錢，說那人昨夜就搭船往南走了。","你鬆了一口氣，又覺得十兩花得很冤。"]}]},{"id":"mo_rain_stop","phase":"morning","day":[2,55],"chance":0.08,"priority":0,"once":false,"who":"tan","title":"雨停了","lines":["醒來時，屋簷沒有在滴水。","雨停了。西街的人全跑出來曬被子、曬鞋、曬自己。","tan|「很多人出門，就會有很多人花錢。掌櫃的，這是常識。」"],"choices":[{"text":"趁天晴補招牌","req":[{"cash":5}],"hint":"−5 兩","fx":[{"cash":-5},{"customers":2}],"lines":["你爬上梯子，把褪色的招牌重新描了一遍。","路過的人都抬頭看。有人說，明天要來看看這家店賣什麼。"]},{"text":"去渡口曬太陽","fx":[{"sanity":5}],"lines":["你在渡口坐了半個時辰，什麼都沒想。","太陽很快又躲回雲裡。但已經夠了。"]},{"text":"叫阿檀去吆喝","fx":[{"customers":3},{"trust":["tan",-1]}],"lines":["tan|「我去喊。但我要加一碗豆花。」","她喊得半條街都聽見，還順便跟賣豆花的吵了一架。","隔天，真有人上門說要找「那個很兇的姑娘」。"]}]},{"id":"mo_dead_regular","phase":"morning","day":[5,55],"chance":0.07,"priority":0,"once":false,"who":null,"title":"木牌","lines":["骨棚的跑堂一早送來一張字條。","clerk|「掌櫃的，常來你這兒的那個胖子，名字今早掛上木牌了。」","你記得他。他每次進門前，都要摸三次門框。"],"choices":[{"text":"去骨棚送他","fx":[{"rep":["guild",3]},{"sanity":-2}],"lines":["骨棚的木牌牆前，只有你和老鷂。","老鷂說：「他還欠我三兩。算了。」"]},{"text":"照常開門","fx":[{"sanity":-3}],"lines":["那天每個客人進門，你都多看了他們的手一眼。"]},{"text":"替他買副薄棺","req":[{"cash":8}],"hint":"−8 兩","fx":[{"cash":-8},{"rep":["guild",3]},{"rep":["folk",1]}],"lines":["棺材鋪老闆收錢時愣了一下。","他說，這是今年第一個有人替拾骨人出錢的。"]}]},{"id":"mo_tipoff","phase":"morning","day":[3,55],"chance":0.06,"priority":0,"once":false,"who":null,"title":"通風報信","lines":["隔壁米鋪的老闆探頭進來，壓低聲音。","stranger|「碑樓明天要查西街，從東頭查起。你家第七間，中午前會到。」","他說完沒走，眼睛一直往你的錢箱飄。"],"choices":[{"text":"給他五兩謝禮","req":[{"cash":5}],"hint":"−5 兩","fx":[{"cash":-5},{"inspect":1},{"rep":["folk",2]}],"lines":["他把銀子咬了一口，滿意地走了。"]},{"text":"道聲謝","fx":[{"inspect":1},{"rep":["folk",-1]}],"lines":["stranger|「謝謝又不能吃，掌櫃的。」"]},{"text":"問他怎麼知道","fx":[{"inspect":1},{"rep":["watch",-1]}],"lines":["stranger|「我小舅子在碑樓燒飯。」","stranger|「碑兵吃得越多，隔天查得越兇。昨晚，他們吃了三鍋。」"]}]},{"id":"mo_step_kids","phase":"morning","day":[2,55],"chance":0.07,"priority":0,"once":false,"who":null,"title":"台階","lines":["開門時，三個鴉巷的孩子坐在你的台階上，排得整整齊齊。","crow|「掌櫃的，今天的台階擦過了。一兩，不二價。」","台階確實擦過了，擦得比你自己擦的還乾淨。"],"choices":[{"text":"照付","hint":"−1 兩","fx":[{"cash":-1},{"rep":["crows",2]}],"lines":["他們收了錢，一溜煙跑了。","順便把隔壁的台階踩得全是泥。"]},{"text":"多給，叫他們常來","hint":"−3 兩","fx":[{"cash":-3},{"rep":["crows",3]},{"customers":1}],"lines":["第二天，你的台階上多了一塊木牌。","上面用炭寫著：「好店，不坑人。」字很醜，很大。"]},{"text":"叫他們滾","fx":[{"rep":["crows",-3]}],"lines":["他們走了。","中午你出門時，台階上抹了一層爛泥，泥上印著三個小手印。"]}]},{"id":"mo_salt_rush","phase":"morning","day":[15,55],"req":[{"act":2}],"chance":0.06,"priority":0,"once":false,"who":"tan","title":"搶鹽","lines":["鹽鋪門口一早就排了長隊，有人為了一把鹽打起來。","tan|「大家都在搶鎮鹽。我們後庫那幾袋，還夠撒兩回門口。」","隔壁的寡婦站在你門口，手裡捏著空鹽罐，沒好意思開口。"],"choices":[{"text":"分包高價賣","fx":[{"cash":25},{"rep":["folk",-3]}],"lines":["你把鹽分成小包，一包三兩。","買鹽的老太太數錢的時候，手一直在抖。"]},{"text":"平價分給街坊","fx":[{"cash":5},{"rep":["folk",5]},{"sanity":1}],"lines":["鄰居們排在你門口，排得比鹽鋪還整齊。","米鋪老闆送來一袋米，說是「鹽錢」。"]},{"text":"全留著自己用","fx":[{"sanity":2},{"rep":["folk",-1]}],"lines":["你把鹽袋扛進後庫，壓在最底下。","那晚睡得很踏實，雖然有點對不起人。"]}]},{"id":"mo_new_boat","phase":"morning","day":[3,50],"chance":0.06,"priority":0,"once":false,"who":"tan","title":"新面孔","lines":["天沒亮，渡口就熱鬧起來。","一艘南方的船靠岸，下來三十幾個年輕人，背著新刀，臉上沒有疤。","tan|「新來的。他們還不知道東西該值多少錢。」"],"choices":[{"text":"去渡口發招帖","hint":" 三天，那家店關了。"]},{"text":"不理他","fx":[{"rep":["guild",-3]}],"lines":["他撐了十天。這十天，好貨都先進了他家。","第十一天，他收了一面半夜會唱歌的戰旗。第十二天，店就關了。"]}]},{"id":"mo_mask_debt","phase":"morning","day":[3,55],"chance":0.06,"priority":0,"once":false,"who":null,"title":"抵帳","lines":["門口放著一只布包，上面壓了一塊石頭。","布包裡是一副鳥喙面具，和一張字條：「欠的錢拿這個抵。我往南走了，別找。」","面具裡有很重的藥草味。字跡你不認得。"],"choices":[{"text":"收下抵帳","fx":[{"item":{"t":"a_mask","tier":2,"tags":["common","river"],"prov":"grey"}}],"lines":["你把面具掛上貨架。","它的鳥喙一直朝著門口，像在等誰回來。"]},{"text":"交給骨棚認領","fx":[{"rep":["guild",2]}],"lines":["老鷂翻了翻面具，說是枯河那邊的手藝。","yao|「欠錢還留東西抵的，算有良心了。」"]}]},{"id":"mo_fog_gate","phase":"morning","day":[2,55],"chance":0.06,"priority":0,"once":false,"who":"tan","title":"大霧","lines":["晨霧濃得看不見對街。","城門沒開，渡口沒船。骨棚的鑼敲了三聲：今天不出城。","tan|「沒人出城，就沒人買裝備。可是……今天也沒人會死。」"],"choices":[{"text":"趁機整理後庫","fx":[{"sanity":1},{"cash":8}],"lines":["你在後庫角落翻出一包碎銀，用油紙包了三層。","是老戚藏的。他連藏錢都藏得很有條理。"]},{"text":"去骨棚聊天","fx":[{"rep":["guild",2]},{"customers":1}],"lines":["骨棚裡擠滿了不能出城的拾骨人，每個都很閒、很窮、很想聊。","有兩個人說，明天出城前會來你這裡看看。"]},{"text":"回去睡覺","fx":[{"sanity":4}],"lines":["你睡到中午。","醒來時霧散了。阿檀說你打呼的聲音，像沉鐘原的風。"]}]},{"id":"mo_bloody_coin","phase":"morning","day":[5,55],"req":[{"sanity_lt":40}],"chance":0.1,"priority":0,"once":false,"who":null,"title":"多一枚","lines":["早上數錢，錢箱裡多了一枚銀角子。","上面有一道新鮮的血痕，摸起來還是溫的。","昨天收的每一筆錢，阿檀都記了帳。這一枚，不在帳上。"],"choices":[{"text":"收進錢箱","fx":[{"cash":5},{"sanity":-4}],"lines":["那一整天，錢箱裡都有輕輕的敲擊聲。"]},{"text":"丟進澐水","fx":[{"sanity":2}],"lines":["銀角子沉下去時，水面冒了一個泡。","像有人在水底，嘆了一口氣。"]},{"text":"用念瞳看","fx":[{"cash":5},{"sanity":-5}],"lines":["你看見一隻手把它放進錢箱。那隻手只剩三根指頭。","是前陣子沒回來的那個斥候。他賒的五兩，還了。"]}]},{"id":"mo_yan_sword","phase":"morning","day":[2,55],"req":[{"alive":"yan"},{"in_town":"yan"}],"chance":0.06,"priority":0,"once":false,"who":"yan","title":"門口練劍","lines":["天剛亮，門外有破風聲。","燕回在你的屋簷下練劍，一招一式，練得渾身冒白氣。","yan|「骨棚太擠，借你家門口。租金我會付。等我有錢。」"],"choices":[{"text":"請她喝碗熱湯","hint":"−1 兩","fx":[{"cash":-1},{"trust":["yan",4]}],"lines":["她喝湯跟練劍一樣，很認真，一口一口。","yan|「我哥以前也這樣，練完劍一定要喝熱的。」"]},{"text":"請她幫忙看門","fx":[{"trust":["yan",2]},{"rep":["folk",1]}],"lines":["她抱著劍站在門口，像一根釘在那裡的槍。","那天來殺價的客人，說話都特別客氣。"]},{"text":"現在就收租","fx":[{"cash":1},{"trust":["yan",-3]}],"lines":["她從懷裡摸出一枚銅板，擦了擦，放在台階上。","yan|「剩下的，欠著。」"]}]},{"id":"mo_wolf_brothers","phase":"morning","day":[2,55],"req":[{"alive":"fang"},{"alive":"ya"},{"in_town":"fang"},{"in_town":"ya"}],"chance":0.06,"priority":0,"once":false,"who":"fang","title":"狼牙兄弟","lines":["開門時，狼牙兄弟正在你的台階上吵架。","ya|「我說那隻亡兵有三丈高！」","fang|「七尺。」","ya|「……加上牠的槍，有三丈！」"],"choices":[{"text":"幫小牙說話","fx":[{"trust":["ya",3]},{"trust":["fang",-1]}],"lines":["fang|「掌櫃的，別慣著他。」","小牙挺起胸膛，一路吹進了骨棚。"]},{"text":"幫大牙說話","fx":[{"trust":["fang",3]},{"trust":["ya",-1]}],"lines":["大牙點點頭，摸了摸弟弟的頭。","ya|「你們都欺負我！」","他走的時候，踢翻了你的傘架。"]},{"text":"請他們吃早飯","hint":"−2 兩","fx":[{"cash":-2},{"trust":["fang",2]},{"trust":["ya",2]}],"lines":["兄弟倆吃了你五個饅頭。","大牙吃三個，小牙吃兩個。小牙說他吃了三個。"]}]},{"id":"mo_tide_ash","phase":"morning","day":[20,55],"req":[{"flag":"tide_1"}],"chance":0.07,"priority":0,"once":false,"who":"tan","title":"潮後","lines":["灰潮退了。屋簷、台階、窗台上，積了一層薄薄的灰。","灰很細，摸起來是溫的。風一吹，就聚成一個個小腳印，往北邊走。","tan|「別碰。掃帚也別碰。等雨。」"],"choices":[{"text":"等雨來沖","fx":[{"sanity":-1}],"lines":["中午下雨了。灰順著水溝流向澐水。","水溝邊站滿了烏鴉，一隻都沒叫。"]},{"text":"掃起來賣給夜市","fx":[{"cash":12},{"sanity":-4},{"heat":2}],"lines":["夜市有人收這種灰，說能做白灰。","你沒問做白灰的人，最後都去了哪裡。"]},{"text":"請白燭會來淨","req":[{"cash":8}],"hint":"−8 兩","fx":[{"cash":-8},{"rep":["candle",3]}],"lines":["兩個修士來掃了半天，把灰裝進陶罐，封好。","他們說，灰裡的人，會被好好送走。"]}]},{"id":"mo_lone_survivor","phase":"morning","day":[3,55],"chance":0.06,"priority":0,"once":false,"who":null,"title":"爬回來的人","lines":["城門一開，一個拾骨人爬了進來，鞋底全磨穿了。","他抓住第一個看見的人，就是你。","stranger|「別去枯河……那裡的霧，會走路。」","他說完就昏了過去，手裡還攥著一把屍菌草。"],"choices":[{"text":"扶他去骨棚","fx":[{"rep":["guild",3]},{"danger":["river",1]}],"lines":["老鷂聽完，把枯河的木牌翻成了紅面。","這幾天，往枯河去的人會少很多。"]},{"text":"拿走他的屍菌草","fx":[{"item":{"t":"m_herb","tier":2,"tags":["river"],"prov":"grey"}},{"danger":["river",1]},{"rep":["folk",-1]}],"lines":["你把草從他手裡掰出來。他的手指很硬，像死了很久。","下午骨棚還是收到了消息，枯河的木牌翻成了紅面。"]}]},{"id":"mo_guest_gift","phase":"morning","chance":0,"priority":0,"once":true,"who":"tan","title":"鏡面朝上","lines":["開門時，台階上擺著一面巴掌大的銅鏡。這一次，鏡面朝上。","鏡子底下壓著一張字條，只有四個字：「謝那一晚。」","tan|「……掌櫃的，這鏡子照不出我。」"],"choices":[{"text":"收進櫃裡","fx":[{"item":{"t":"v_mirror","tier":4,"tags":["royal","bronze","capital"],"curse":["ward",1],"prov":"grey"}}],"lines":["你湊近一看，鏡子裡也沒有你。","只有一間點著燈的屋子。屋裡有個人，在對你點頭。"]}]}],"flavor":{"w_sword":["劍刃上的缺口比刻字還多，每一個都替主人擋過一次。","拾骨人說：劍是給還想死得體面的人用的。"],"w_saber":["刀環纏著褪色的紅布。沉鐘原上的亡兵，多半也佩著它。","北營的老兵說，環首刀不挑人，只挑誰先拔。"],"w_axe":["斧刃厚得能劈開骸兵的肋骨，也劈得開回家的門。","斧柄被汗浸成了黑色，握上去，像握著別人的手。"],"w_mace":["對付骸兵，刀不如錘。骨頭碎了，就拼不回去。","錘頭的鐵刺磨得發亮，縫裡還卡著一點白色的東西。"],"w_spear":["槍桿上刻著七道橫線。沒人知道是殺了七個，還是死了七個。","亡兵擠上來的時候，只有長槍能讓它們離你遠一點。"],"w_bow":["弓弦是新換的，弓身上的牙印是舊的。","老弓手的規矩：最後一支箭，不射敵人。"],"w_xbow":["不用練，扣下去就有。這是窮拾骨人最愛的道理。","弩機裡卡著半支斷箭，像一句沒說完的話。"],"w_dagger":["拾骨人說：刀越短，命越長。","刀柄的麻繩換過很多次，每一次都是不同的手打的結。"],"w_staff":["杖頭的銅環一碰就響，術士說那是死者在回話。","握久了掌心會冒冷汗，像有人在杖的另一頭握著你。"],"w_silver":["銀刃傷活人不深，卻能讓骸兵退一步。","白燭會說銀是乾淨的。銀匠說，那要看是誰的銀。"],"w_censer":["錘頭是一只鏤空鐵爐，掄起來，火星灑成一道弧。","護教修士用它開路，說煙走到哪，死者就退到哪。"],"a_leather":["胸口補了三層，針腳一層比一層密。","皮甲吸了太多雨，聞起來像一個不肯乾的人。"],"a_mail":["一萬個鐵環斷了十幾個，破口剛好是一支箭的大小。","穿著它走路會沙沙響，亡兵聽得見，同伴也聽得見。"],"a_plate":["甲片用皮繩串成，斷一根，就掉一片命。","內襯上寫著三個名字，前兩個被劃掉了。"],"a_shield":["盾面上的箭孔排成一圈，主人一定蹲著撐了很久。","老拾骨人說：盾不是擋刀的，是擋你想逃的那一刻。"],"a_helm":["盔頂有一道凹痕，深得剛好放得進一個拳頭。","戴上它，聽不清風聲，也聽不清鐘聲。有人說這是好事。"],"a_cloak":["鴉渡的雨下不停，油布斗篷是唯一不會騙你的東西。","斗篷內側縫著一個口袋，裡面有半塊沒吃完的餅。"],"a_mask":["鳥喙裡塞滿乾藥草，吸一口，連屍菌都聞不到。","戴上它的人看起來都一樣，枯河的屍蟲也分不出來。"],"a_robe":["袍子洗過很多次，袖口的燭淚還是洗不掉。","穿著它進白骨修道院，骸兵會猶豫一下。只有一下。"],"c_ring":["戒圈內側刻著一個名字，不是戴它的人的。","死人的手指會腫，所以拾骨人摘戒指，得趁早。"],"c_amulet":["墜子貼著心口戴了很多年，摸起來還是溫的。","裡面藏著一縷頭髮。打開它的人，都會再把它闔上。"],"c_talisman":["木牌上的字被摸得發亮，字的意思早就沒人記得了。","白燭會說它沒用，拾骨人還是一塊一塊往身上掛。"],"c_bell":["鈴聲很細，細得能把迷路的念頭叫回來。","在亡域的霧裡，還聽得見自己的鈴聲，就還沒走丟。"],"c_whistle":["骨哨的聲音比人聲傳得遠，也比人聲更像人。","拾骨隊在地窟裡失散時，靠它找人，也靠它數人。"],"k_rope":["三十尺麻繩，打了七個結。一個結，一層地窟。","拾骨人說，繩子要斷之前，不會先告訴你。"],"k_lantern":["燈罩被燻得發黑，可是風吹不熄它。","在沉鐘城的水邊，點燈的人總比不點燈的人死得慢。"],"k_ration":["硬得能當磚，泡了水能吃三天。","包乾糧的油紙上寫著「給阿六」，是女人的字。"],"k_antidote":["苦得像嚼樹皮。比起屍菌，苦是好東西。","從枯河回來，咳出來的痰是灰的，就該吃了。"],"k_incense":["點一根，低語會小一點。點兩根，你會睡著。","術士說香灰要收好，它記得你夢見過什麼。"],"k_holywater":["白燭堂的井水，主祭在上面唸過燭文。","潑在骸兵身上會冒白煙。潑在活人身上，只會挨罵。"],"k_salt":["門口撒一圈，念就進不來。至少，大部分進不來。","鴉渡最好賣的東西，灰潮前一天能漲三倍。"],"k_salve":["塗上去像火燒，燒完了，血就止了。","大夫說，金創藥治得了傷口，治不了你為什麼又回去。"],"k_map":["地圖缺了一角。缺掉的那一角，就是畫圖的人死的地方。","有幾條路，被人用指甲狠狠劃掉了。"],"v_coin":["方孔銅錢，正面是澐國年號，背面鑄著一口鐘。","沉鐘原上多得撿不完，多到烏鴉都叼來當東西。"],"v_seal":["印面磨平了一半，剩下的那個字是「准」。","它蓋過的文書都沉在水底了，只剩這塊石頭還記得。"],"v_jade":["玉上有一道裂紋，像被人用力握過，終究沒碎。","老玉不說話。可是戴久了的人，都說它會變涼。"],"v_hairpin":["釵頭的鳳少了一隻翅膀，斷口是咬的。","嫁妝裡最貴的東西，常常也是最先被當掉的。"],"v_mirror":["鏡面昏黃，照人照得很老。","鏡背刻著兩個小字：朝北。沒人知道為什麼。"],"v_scroll":["畫裡是一座城，城裡的九口鐘，都還掛在樓上。","裱紙泡過水，畫中人的臉都暈開了，只剩衣裳還在。"],"v_bell":["宮裡的鈴，鈴舌是銀的，聲音比雨還細。","鈴身刻著澐宮的紋樣，摸久了，指尖會有點麻。"],"v_banner":["旗面只剩巴掌大，上面的字被燒掉一半。","誰的旗？拾骨人說：倒下那一邊的。"],"v_icon":["白燭會的聖像，臉被人刮掉了。","底座刻著捐獻者的名字。捐的人，大多死在亂裡了。"],"v_book":["書頁黏在一起，翻開的那頁寫滿了別人的眉批。","字很小，頁緣畫著一口一口的小鐘，像在數什麼。"],"v_flute":["骨頭鑽成的笛子，吹出來的聲音像在找人。","笛孔被嘴唇磨得很光。最後一個吹它的人，很想家。"],"v_doll":["布偶一隻眼睛是鈕扣，另一隻是線縫的。","從枯河地窟帶出來的布偶，比帶出來的孩子多。"],"v_letter":["信封沒拆。寄信的和收信的，大概都不在了。","信裡寫：「等我回去。」信是在亡域裡撿到的。"],"v_glasses":["鏡片裂了一道，戴上去，世界多了一條線。","這東西沒人買，可是每個當鋪掌櫃都捨不得丟。"],"v_box":["盒蓋描著一對金漆的鳥，其中一隻已經剝落了。","盒子是空的。可是搖一搖，裡面有東西在滾。"],"m_metal":["斷刀、斷槍、斷馬蹄鐵，熔了都是好鐵。","鐵匠不問來路，只問斤兩。"],"m_leather":["從舊甲上拆下來的皮，還留著主人的身形。","鞣好的皮料，摸起來比活人的手還暖。"],"m_cloth":["布上有洗不掉的褐色，裁衣時要避開。","上好的布帛，在鴉渡最常拿來做裹屍布。"],"m_wood":["從廢屋拆下來的樑木，敲起來很實。","鴉渡缺木頭，連棺材板都是舊門板改的。"],"m_bone":["磨過的骨頭能做哨、做笛、做籤。別問是誰的。","骨棚的規矩：有名字的骨頭還給家人，沒名字的才能賣。"],"m_crystal":["星墜坑長出來的晶石，夜裡貼著耳朵，聽得見它在哼歌。","拿久了會頭痛，可是術士們搶著要。"],"m_salt":["沒碾過的粗鹽，撒在門口也有用，只是要撒厚一點。","鹽能醃肉，也能醃念。鴉渡人兩件事都做。"],"m_wax":["白燭堂收回的燭頭，熔了再澆，一根燭能燒三輩子。","蠟裡混著灰，點起來的光是青白色的。"],"m_herb":["長在死人身上的草，曬乾能入藥，也能要命。","採的人都戴面具。它開花時，會讓人想躺下。"],"m_ink":["一疊沒寫過的紙，和一塊用了一半的墨。","鴉渡的文書都寫得很短，雨太多，墨乾得太慢。"],"x_tome":["書頁是人皮還是羊皮？賣的人說羊皮，買的人不想知道。","白燭會說，讀它的人，會聽見書在讀他。"],"x_ash":["抹在舌頭上，痛就沒了，人也慢慢沒了。","骨灰磨的。用的人說，裡面的死人很安靜，所以讓人安靜。"],"x_powder":["守碑衛專賣。私藏的人，碑樓會替你刻碑。","受潮了是一包黑沙；乾著，就是一聲巨響。"],"x_skull":[ ，聞得到三里外的屍味。","前朝驛卒，跑遍了澐國每一條官道。","戲班的武生，翻跟斗比走路還穩。","殺過人的屠夫，自稱只殺過豬。","被休掉的媳婦，帶著一把剪刀出門。","棺材鋪老闆的女兒，從小睡在棺材邊。","大戶人家的庶子，家產被兄長吞了。","澐國舊軍官的遺孤，腰上掛著父親的刀牌。","礦坑塌過三次，三次都爬了出來。","拾骨人的寡婦，頂著亡夫的名字下坑。","藥鋪學徒，認得亡域裡每一種毒草。","走江湖的賣藝人，會吞劍，也會吞苦。","沉鐘城下城的倖存者，不肯說怎麼逃的。","碑樓牢裡放出來的，罪名刺在背上。","渡口賭坊的打手，替人收過太多帳。","星墜坑附近的牧羊人，羊全死了。","白骨修道院山下的樵夫，聽過修院的鐘。","北原與澐國的混血，兩邊都不收。","從小替拾骨隊揹行李，十五歲才第一次下坑。","被逐出鏢局的鏢師，鏢旗還藏在包袱裡。","富商的獨子，家財跟著一船貨沉了。","夜市的扒手，金盆洗手沒洗乾淨。","宮裡出來的雜役，說話總壓著嗓子。"],"motive":["欠了金秤行一筆還不清的錢。","想找回失蹤弟弟的骨頭。","要攢夠錢，帶娘搬去南方。","聽說亡域裡有能治病的星晶。","想看一眼沉鐘城，死也甘願。","拾骨比種田賺得多，就這麼簡單。","欠了一條命，得用拾骨來還。","想替死在亡域的隊友收屍。","要贖回押在賭坊的妹妹。","想證明自己不是逃兵。","家裡五張嘴，等著吃飯。","想找到父親留在王都的那封信。","被碑樓通緝，亡域是唯一沒人追的地方。","相信亡域某處埋著澐國的國庫。","喜歡亡域的安靜，城裡太吵了。","想找到在枯河失蹤的那個人。","想攢一副好棺材，給自己。","白燭會的修士說這是贖罪，就去了。","打賭輸了，賭注是走一趟沉鐘原。","總夢見死去的孩子在北邊哭。","只會打仗，戰後找不到別的活。","要把當掉的祖傳刀贖回來。","想在骨棚的木牌牆上，留下自己的名字。","欠一個死人的情，得替他把遺物送回家。","想替自己買一個新的名字。","要替弟弟湊娶媳婦的聘金。","被逐出家門，想混出個人樣再回去。","好奇。純粹是好奇，這最要命。","想親手燒掉亡域裡的某樣東西。","欠了灰鴉會人情，替他們進坑帶貨。","聽說星墜坑的歌聲裡，有娘的聲音。","想攢錢開一間自己的小酒館。"],"quirk":["出發前一定要摸三次門框。","吃飯從不坐背對門的位置。","睡覺時抱著靴子，怕被人偷。","每殺一隻亡兵，就在刀柄刻一道。","說話前先咳一聲，像在清帳。","口袋裡永遠有一顆糖，從來不吃。","怕貓，卻說是貓怕自己。","數錢要數三遍，第三遍總少一枚。","進門先看窗，再看人。","吹口哨只吹一首曲子，誰也不知道曲名。","不跟穿白袍的人說話。","每天早上朝北方吐一口唾沫。","喝酒只喝一杯，第二杯倒在地上。","包袱裡帶著一把家鄉的土。","走路專挑石頭踩，不肯留下腳印。","每次出城都報一個新名字。","把所有的錢縫在褲腰裡。","笑之前會先捂嘴，因為缺了門牙。","打噴嚏一定連打三個。","收到銀子先咬一口，銅板也咬。","每晚睡前點一次名，即使只剩自己。","從不說「再見」，只說「明天見」。","怕下雨，卻住在鴉渡。","刀總是擦得比臉乾淨。","把死去隊友的名字縫在衣領內側。","遇見烏鴉會脫帽行禮。","會跟自己的兵器說話，還會吵架。","不吃任何長在地底下的東西。","進了亡域就一句話都不說。","賣東西前，要先問它想不想走。","鞋帶永遠綁兩個死結。","牙縫裡總叼著一根草。"]},"regions":{"bell":{"desc":"王都南方的大戰場，生鏽的兵器像麥子一樣插滿荒原。風裡有鐘聲，原上卻沒有一口鐘。","sights":["一整排亡兵跪在泥裡，臉朝北方，像還在等點名。","風一吹，滿地斷槍嗡嗡作響，像一整片在哭的蘆葦。","一具亡兵抱著另一具，兩副盔甲鏽在一起，分不開了。","烏鴉在戰壕上空繞圈，從不落地。牠們知道哪裡還有東西在動。","有人撿到一面戰鼓，鼓面破了，敲下去，遠處卻有人回了一聲。","夜裡紮營，鐘聲從四面八方來，誰也說不出是從哪裡響的。"]},"river":{"desc":"王都沉沒後澐水斷流，乾掉的河床裂出一道道地窟。當年躲進去的難民，沒有一個走出來。","sights":["地窟的牆上全是指甲刮出來的字，大多是名字，少數是日期。","屍菌在黑暗裡發著綠光，像一片會呼吸的草地。","一處洞窟裡擺著幾十雙小鞋，排得整整齊齊。","屍蟲爬過的地方留下黏液，乾了以後，像一層薄冰。","有一段河床底下還有水聲，挖下去，只挖得到骨頭。","霧最濃的時候，洞口會有人喊：「水來了，快跑。」"]},"abbey":{"desc":"鐘祀院的舊址，院裡的僧人在亂中被屠盡。如今白骨自己拼成骸兵，每夜在迴廊裡巡行。","sights":["骸兵巡夜的步伐整整齊齊，像生前還在排班。","鐘樓是空的。掛鐘的橫樑上，有一道被繩子磨出來的深溝。","迴廊石牆上有人用血寫了半句偈文，後半句被刮掉了。","藏經閣的書全泡了水，翻開來，字都漂到了書頁邊上。","一具小小的骸兵坐在台階上，手裡捧著一只破碗，一動也不動。","膳堂的長桌上還擺著碗筷，每一副碗裡都積滿了灰。"]},"crater":{"desc":"王都沉沒那一夜，天上掉下星火，砸出一個望不見底的大坑。坑裡長出會唱歌的星晶，待久了的人會瘋。","sights":["晶石在月光下唱歌，每一顆的調子都不一樣，聽久了會跟著哼。","一頭晶獸半邊是鹿，半邊是透明的石頭，石頭裡看得見心臟在跳。","坑底的泥是溫的，赤腳踩上去，像有人在底下推你。","有個拾骨人在坑邊坐了三天，說他在等星星再掉一次。","晶簇裡封著一隻烏鴉，翅膀張開，像是飛到一半被定住了。","從坑裡回來的人，眼睛裡會留著一點光，好幾天都不退。"]},"capital":{"desc":"澐國的王都，半座城沉在黑水裡。水底的鐘偶爾響一聲，聽見的人會忘記自己是誰。","sights":["黑水上漂著一頂官帽，漂了十年，還沒沉。","城樓只露出一半，水面上的窗戶裡，有時候點著燈。","撐船經過時，看得見水下的市集，攤子都還擺著。","有人從水裡撈起一隻手，手裡還緊緊握著一把鑰匙。","王宮的屋簷露出水面，上面站滿了不叫的烏鴉。","水底響了一聲鐘。船上的人互相看了看，誰都想不起對方的名字。"]}},"factions":{"watch":{"desc":"鴉渡的官兵，駐在碑樓，城門、渡口和每一間鋪子都歸他們管。碑兵刀磨得亮，案卷上的名字從來不嫌多。","high":"碑兵路過會點頭，搜鋪時，封條也貼得特別客氣。","low":"碑兵常在你門口站崗，盯著每一個進門的客人。"},"crows":{"desc":"鴉巷的孤兒長大後結成的賊幫，偷、銷贓、收規費，什麼都做。他們講義氣，也記仇，翻臉時會有人半夜撬你的門。","high":"鴉巷的孩子替你看門，城裡的賊都繞著你的鋪子走。","low":"你的台階上常有爛泥，門閂上常有新的刮痕。"},"candle":{"desc":"鴉渡的教會，相信讓死者沉默就是慈悲。他們施粥、收購詛咒物銷毀，也盯著每一間賣詛咒物的鋪子。","high":"修士見到你會微笑，說你的鋪子是乾淨的。","low":"白燭堂的佈道裡，開始出現你鋪子的名字。"},"guild":{"desc":"拾骨人的公會，會所叫骨棚，由獨臂的老鷂掌管。你在這裡的名聲，決定拾骨人把好貨先賣給誰。","high":"拾骨人一進城，就先把背包扛到你的櫃台上。","low":"骨棚有人說，西街當鋪的貨，是給死人穿的。"},"scale":{"desc":"鴉渡最大的錢莊，女東家秦晚霜算得比誰都精。你欠她三千兩，每七天，算盤先生會來敲一次門。","high":"算盤先生收帳時，偶爾會多講一個冷笑話。","low":"算盤先生收帳時，算盤打得特別響，利息也算得特別準。"},"folk":{"desc":"西街的米鋪、油行、寡婦和孩子們，不管你賣什麼，只看你怎麼做人。街坊的嘴，比碑樓的告示傳得還快。","high":"街坊路過會塞給你一把青菜，說是吃不完的。","low":"你走過西街時，說話聲會停下來，等你走遠才又響起。"}},"rooms":{"front":{"name":"前店","desc":"一張櫃台、幾排貨架，和一盞總是不夠亮的油燈。死人的東西擺在這裡，等新的主人。"},"store":{"name":"後庫","desc":"木箱一路堆到屋樑，收來的遺物都先在這裡過夜。夜裡，偶爾有箱子會自己響。"},"hidden":{"name":"暗格","desc":"櫃台底下的一塊活板，掀開是只容一人蹲下的夾層。老戚不能見光的東西，都收在這裡。"},"workshop":{"name":"工坊","desc":"後院搭出來的小棚，有砧台、磨石，和一張滿是焦痕的工作檯。阿檀說，壞掉的東西只是在等人修。"},"cellar":{"name":"地窖","desc":"石階往下十三級，潮氣裡有燭蠟和鐵鏽的味道。老戚死在這裡，阿檀從不下去。"},"attic":{"name":"閣樓","desc":"屋頂下的斜頂小間，雨聲最大，也睡得最沉。窗口正對著北方。"}},"upgrades":{"shelf_1":{"name":"添一排貨架","desc":"多擺幾件貨，客人的眼睛就多停一會兒。"},"shelf_2":{"name":"琉璃櫃","desc":"貴的東西鎖進琉璃後面，看得到、摸不到，價錢就上去了。"},"shelf_3":{"name":"整面貨牆","desc":"從地板釘到屋樑，再挑的拾骨人也找得到想要的東西。"},"store_1":{"name":"加釘木架","desc":"後庫多兩層木架，箱子不用再堆到門口。"},"store_2":{"name":"打通柴房","desc":"買下隔壁的柴房打通，後庫大了一倍，雨也漏得少了。"},"hidden_1":{"name":"加深暗格","desc":"活板底下再挖深一尺，碑兵的鐵杖敲不出空聲。"},"hidden_2":{"name":"夾牆","desc":"後庫砌一道假牆，牆裡的東西，連阿檀都要找半天。"},"lock_1":{"name":"銅鎖","desc":"鴉巷的孩子撬開它要一盞茶的工夫，夠你醒來了。"},"lock_2":{"name":"包鐵門","desc":"包了鐵皮的木門，砸不開、撬不動，只是開門時吵得像打雷。"},"lamp_1":{"name":"鎮念燈","desc":"燈油裡摻了鎮鹽。燈亮著，貨架上的低語就小一點。"},"bench_1":{"name":"磨刀台","desc":"一塊好磨石，一張穩當的檯子。鈍刀進來，利刃出去。"},"bench_2":{"name":"小鍛爐","desc":"能熔碎鐵、補甲片的小爐子。阿檀說她等這天很久了。"},"circle_1":{"name":"鎮念陣","desc":"用鹽、銀粉和燭蠟在地窖畫一圈，詛咒物放進去，就睡著了。"},"bed_1":{"name":"好床","desc":"一張不會吱吱叫的床，和一床曬過太陽的被子。睡得著，才撐得住。"},"sign_1":{"name":"新招牌","desc":"重漆的招牌掛上西街口，路過的拾骨人一抬頭就看得見。"},"sign_2":{"name":"燈籠招牌","desc":"夜裡也亮著的招牌。雨再大，都知道哪裡還開著。"},"tools_1":{"name":"試金石","desc":"黑石上一抹，金銀真假，一眼就分得出來。"},"tools_2":{"name":"老戚的放大鏡","desc":"老戚用了三十年的鏡片，看得出刀上的血是新是舊。"},"ledger_1":{"name":"通緝冊副本","desc":"花錢託碑樓的文書抄一份通緝冊。誰的貨是贓，翻一翻就知道。"}}}};

const ST = (() => {
  const KEY = 'relicshop.save.v1';
  const META = 'relicshop.meta.v1';
  let mem = {}; // localStorage 不可用時的記憶體備援
  let storageOK = true;
  function lsGet(k) { try { const v = localStorage.getItem(k); return v; } catch (e) { storageOK = false; return mem[k] || null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { storageOK = false; mem[k] = v; return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }

  function newState(o) {
    const bg = D.BACKGROUNDS[o.bg] || D.BACKGROUNDS.scavenger;
    const seed = (o.seed || (Date.now() ^ Math.floor(Math.random() * 1e9))) >>> 0;
    const s = {
