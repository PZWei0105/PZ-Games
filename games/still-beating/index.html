<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>不死心 STILL BEATING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Iansui&family=Noto+Sans+TC:wght@500;700;900&family=Rubik+Spray+Paint&display=swap">
<style>
/* Riso-punk zine: a gray city and four fluorescent inks. One-screen game app, single dark look. */
:root{
  --ink:#17141c; --ink2:#2a2531; --ink3:#3b3542;
  --concrete:#8a8692; --fog:#cfccd3; --paper:#f3f1ec;
  --pink:#ff3d7f; --yellow:#ffd21f; --cyan:#18c6e0;
  --f-display:"Rubik Spray Paint","Bungee",Impact,"Noto Sans TC",sans-serif;
  --f-label:"Bungee","Noto Sans TC","PingFang TC","Microsoft JhengHei",Impact,sans-serif;
  --f-cjk:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --f-hand:"Iansui","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-cjk);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,.focusable:focus-visible{outline:3px dashed var(--cyan);outline-offset:3px}

/* ---------- sticker buttons ---------- */
.stk{font-family:var(--f-cjk);font-weight:900;letter-spacing:.04em;background:var(--yellow);color:var(--ink);
  border:3px solid var(--ink);border-radius:9px;box-shadow:4px 4px 0 var(--pink);padding:.6em 1.2em;
  transform:rotate(var(--rot,-1.5deg));transition:transform .08s,box-shadow .08s;white-space:nowrap}
.stk:active{transform:translate(2px,2px) rotate(var(--rot,-1.5deg));box-shadow:2px 2px 0 var(--pink)}
.stk.paper{background:var(--paper)}
.stk.pink{background:var(--pink);color:var(--paper);box-shadow:4px 4px 0 var(--ink)}
.stk.cyan{background:var(--cyan);box-shadow:4px 4px 0 var(--ink)}
.stk.ghost{background:transparent;color:var(--paper);border-color:var(--paper);box-shadow:none}
.stk[disabled]{opacity:.45;filter:grayscale(1);pointer-events:none}
.stk small{display:block;font-weight:700;font-size:.72em;opacity:.8;letter-spacing:0}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.ov.dim{background:rgba(16,13,20,.72)}
.panel{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:6px;
  box-shadow:6px 6px 0 var(--cyan),-3px -3px 0 var(--pink);width:min(760px,100%);max-width:100%;max-height:100%;overflow:auto;
  padding:18px 18px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel h2{font-family:var(--f-cjk);font-weight:900;font-size:clamp(20px,4.2vmin,30px);margin:0 0 10px;letter-spacing:.06em;text-wrap:balance}
.panel .sub{font-size:13px;color:var(--ink3);margin:-4px 0 12px}
.tape{position:absolute;top:-12px;left:50%;width:96px;height:22px;transform:translateX(-50%) rotate(-3deg);
  background:rgba(255,210,31,.85);border:1px solid rgba(0,0,0,.15)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}

/* ---------- title ---------- */
#title{flex-direction:column;justify-content:flex-end;gap:12px;pointer-events:none}
#title .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;pointer-events:auto;margin-bottom:max(10px,4vh)}
#title .btns .stk{font-size:clamp(17px,3.6vmin,24px)}
#title .ver{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));
  font-family:var(--f-label);font-size:10px;color:var(--concrete);letter-spacing:.12em}

/* ---------- hub ---------- */
#hub{align-items:flex-end;justify-content:space-between;pointer-events:none;flex-direction:column}
#hub .top{width:100%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:auto}
#hub .bar{width:100%;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
#hub .bar .stk{font-size:clamp(14px,3.1vmin,19px)}
#hub .bar .go{font-size:clamp(18px,4vmin,26px);--rot:1.5deg}
.chip{font-family:var(--f-label);font-size:13px;background:var(--ink);color:var(--paper);border:2px solid var(--paper);
  border-radius:20px;padding:5px 12px;display:inline-flex;gap:6px;align-items:center;letter-spacing:.06em}
.chip b{color:var(--yellow);font-weight:400}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);display:inline-block}

/* ---------- dialog ---------- */
#dlg{align-items:flex-end;z-index:40}
#dlg .box{width:min(820px,100%);background:var(--ink);border:3px solid var(--paper);border-radius:6px;padding:14px 16px 12px 16px;
  display:flex;gap:14px;align-items:flex-start;box-shadow:5px 5px 0 var(--pink);cursor:pointer}
#dlg canvas{flex:0 0 auto;width:64px;height:64px;border-radius:6px;background:var(--ink2);border:2px solid var(--concrete)}
#dlg .who{font-family:var(--f-cjk);font-weight:900;font-size:13px;letter-spacing:.12em;color:var(--ink);background:var(--yellow);
  display:inline-block;padding:2px 9px;border-radius:3px;transform:rotate(-2deg);margin-bottom:6px}
#dlg .txt{font-size:clamp(15px,3.3vmin,19px);line-height:1.6;min-height:3.2em;font-weight:500;color:var(--paper);min-width:0;flex:1}
#dlg .next{font-family:var(--f-label);font-size:11px;color:var(--concrete);text-align:right;margin-top:4px;letter-spacing:.1em}

/* ---------- level-up cards ---------- */
#cards{flex-direction:column;gap:10px;z-index:30}
#cards .hdr{font-family:var(--f-cjk);font-weight:900;font-size:clamp(24px,6vmin,40px);color:var(--yellow);
  text-shadow:3px 3px 0 var(--pink),-2px -2px 0 var(--ink);transform:rotate(-2deg);letter-spacing:.08em}
#cards .hdr small{display:block;font-size:.42em;color:var(--paper);text-shadow:none;letter-spacing:.2em;text-align:center}
#cards .wrap{display:flex;gap:clamp(8px,2vw,18px);justify-content:center;align-items:stretch;flex-wrap:nowrap;max-width:100%}
.card{position:relative;flex:1 1 0;min-width:0;max-width:230px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  border-radius:8px;padding:22px 12px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;
  box-shadow:5px 5px 0 var(--c,var(--pink));animation:cardIn .42s cubic-bezier(.2,1.4,.4,1) both;transform-origin:50% 100%}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:active{transform:translate(2px,2px)}
.card .cat{position:absolute;top:-11px;left:10px;font-family:var(--f-cjk);font-weight:900;font-size:12px;background:var(--c,var(--pink));
  color:var(--ink);border:2px solid var(--ink);padding:1px 8px;border-radius:3px;transform:rotate(-3deg);letter-spacing:.1em}
.card .nm{font-weight:900;font-size:clamp(17px,3.8vmin,22px);line-height:1.2}
.card .ds{font-size:clamp(12px,2.7vmin,14px);line-height:1.5;color:var(--ink3);flex:1}
.card .pips{display:flex;gap:4px}
.card .pips i{width:14px;height:8px;border:2px solid var(--ink);border-radius:2px;display:block}
.card .pips i.on{background:var(--c,var(--pink))}
.card .pips i.new{background:var(--c,var(--pink));animation:blink .5s infinite alternate}
.card .ico{width:44px;height:44px}
@keyframes cardIn{from{transform:translateY(60px) rotate(8deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{to{opacity:.3}}
#cards .reroll{font-size:14px}

/* ---------- shop / garage / memory / settings ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;border:2px solid var(--ink);border-radius:6px;padding:9px 10px;background:#fff}
.item .meta{flex:1;min-width:0}
.item .meta b{font-weight:900;font-size:16px;display:block}
.item .meta span{font-size:13px;color:var(--ink3);line-height:1.45;display:block}
.item .stk{font-size:14px;padding:.45em .8em;box-shadow:3px 3px 0 var(--pink)}
.price{font-family:var(--f-label);font-size:13px}
.panel.wide{width:min(1040px,100%)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:8px}
.slot{border:2px solid var(--ink);border-radius:6px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
.slot h3{margin:0;font-size:14px;letter-spacing:.2em;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.part{border:2px dashed var(--concrete);border-radius:6px;padding:7px;display:flex;flex-direction:column;gap:5px}
.part.eq{border-style:solid;border-color:var(--ink);background:#fff6cc}
.part b{font-size:14px;font-weight:900}
.part p{margin:0;font-size:12px;color:var(--ink3);line-height:1.4}
.part .row{gap:6px}
.part .row .stk{font-size:12.5px;padding:.4em .7em;box-shadow:2px 2px 0 var(--pink)}
.lv{display:flex;gap:3px}.lv i{width:16px;height:7px;border:2px solid var(--ink);border-radius:2px}.lv i.on{background:var(--pink)}
.memgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mem{border:2px solid var(--ink);border-radius:6px;padding:10px;min-height:86px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:4px}
.mem b{font-size:14px;font-weight:900}
.mem span{font-size:12px;color:var(--ink3)}
.mem.locked{background:repeating-linear-gradient(45deg,#e7e5e0 0 8px,#dcd9d2 8px 16px);color:var(--concrete);align-items:center;justify-content:center;font-family:var(--f-label)}
.memread{font-family:var(--f-hand);font-size:clamp(17px,3.8vmin,21px);line-height:1.75;white-space:pre-wrap;margin:6px 0 12px}
.set{display:flex;flex-direction:column;gap:12px}
.set label{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700;font-size:15px}
.set input[type=range]{width:min(260px,52vw);accent-color:var(--pink)}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}
.set textarea{width:100%;min-height:76px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:2px solid var(--ink);border-radius:4px;padding:6px;resize:vertical;user-select:text;-webkit-user-select:text}
.note{font-size:12.5px;color:var(--ink3);line-height:1.5}
.warn{color:#b0123f;font-weight:700}

/* ---------- run results ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:6px 0 14px}
.stat{border:2px solid var(--ink);border-radius:6px;padding:8px 10px;background:#fff}
.stat i{display:block;font-style:normal;font-size:12px;color:var(--ink3);letter-spacing:.1em}
.stat b{font-family:var(--f-label);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}

/* ---------- comic ---------- */
#comic{z-index:50;background:transparent;flex-direction:column;justify-content:flex-end}
#comic .cap{position:relative;z-index:2;max-width:min(760px,100%);font-family:var(--f-hand);font-size:clamp(18px,4.4vmin,28px);line-height:1.6;
  color:var(--ink);background:var(--paper);border:3px solid var(--ink);padding:10px 16px;box-shadow:5px 5px 0 var(--pink);transform:rotate(-1deg);margin-bottom:6px}
#comic .skip{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:3;font-size:13px}
#comic .tap{position:relative;z-index:2;font-family:var(--f-label);font-size:11px;letter-spacing:.2em;color:var(--concrete);margin-bottom:4px}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;z-index:10;pointer-events:none}
#stick{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;pointer-events:none;opacity:0;transition:opacity .15s}
#stick.on{opacity:1}
#stick .base{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(243,241,236,.55);background:rgba(23,20,28,.25)}
#stick .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:rgba(255,61,127,.75);border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(24,198,224,.7)}
#stickHint{position:absolute;left:max(26px,env(safe-area-inset-left,0px));bottom:max(30px,env(safe-area-inset-bottom,0px));width:110px;height:110px;
  border-radius:50%;border:3px dashed rgba(243,241,236,.18);pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-cjk);font-weight:900;color:var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--pink);
  touch-action:none;-webkit-user-select:none;user-select:none;padding:0;line-height:1}
.tb.down{transform:translate(2px,2px) scale(.94);box-shadow:1px 1px 0 var(--pink);filter:brightness(1.12)}
.tb .cd{position:absolute;inset:-3px;border-radius:50%;pointer-events:none}
.tb .k{display:none;position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-family:var(--f-label);font-size:9px;color:var(--fog);opacity:.7;letter-spacing:.1em}
#bAttack{width:92px;height:92px;font-size:30px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 12px);background:var(--yellow)}
#bDash{width:66px;height:66px;font-size:22px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 116px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 6px);background:var(--cyan)}
#bBite{width:66px;height:66px;font-size:24px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 20px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 120px);background:var(--pink);color:var(--paper)}
#bSkill{width:58px;height:58px;font-size:18px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 108px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 96px)}
#bDevour{width:78px;height:78px;font-size:30px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 104px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 168px);
  background:var(--yellow);box-shadow:0 0 0 4px var(--pink),5px 5px 0 4px var(--ink);animation:pulse .5s ease-in-out infinite alternate}
#bBurst{width:62px;height:62px;font-size:15px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 20px);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 200px);
  background:conic-gradient(var(--pink),var(--yellow),var(--cyan),var(--pink));animation:pulse .4s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#bPause{position:absolute;pointer-events:auto;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:8px;border:3px solid var(--paper);background:rgba(23,20,28,.6);display:flex;gap:5px;align-items:center;justify-content:center;padding:0}
#bPause i{display:block;width:6px;height:16px;background:var(--paper);border-radius:1px}
body.kb .tb,body.kb #stickHint{display:none}
body.kb .tb.kbshow{display:flex}

/* ---------- toast / banner ---------- */
#toast{position:absolute;left:50%;top:max(64px,calc(env(safe-area-inset-top,0px) + 54px));transform:translateX(-50%);z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.tst{font-weight:900;font-size:clamp(14px,3vmin,18px);background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:5px 14px;border-radius:5px;
  box-shadow:3px 3px 0 var(--pink);animation:tstIn .25s cubic-bezier(.2,1.5,.4,1) both,tstOut .3s ease-in forwards;animation-delay:0s,var(--life,2.2s);white-space:nowrap}
@keyframes tstIn{from{transform:scale(.4) rotate(-6deg);opacity:0}}
@keyframes tstOut{to{transform:translateY(-14px);opacity:0}}

/* ---------- small screens ---------- */
@media (max-height:420px){
  .panel{padding:14px 14px 12px}
  .card{padding:18px 10px 10px}
  #cards .hdr{font-size:26px}
}
@media (max-width:560px){
  #cards .wrap{flex-direction:column;align-items:stretch}
  .card{max-width:none;flex:0 0 auto;padding:16px 12px 10px}
  .card .ds{flex:0 0 auto}
}
@media (prefers-reduced-motion:reduce){
  .card,.tst,#bDevour,#bBurst{animation:none}
}
</style>

<div id="app">
  <canvas id="cv" aria-label="不死心 遊戲畫面"></canvas>

  <div id="touch" hidden>
    <div id="stickHint"></div>
    <div id="stick"><div class="base"></div><div class="knob"></div></div>
    <button class="tb" id="bAttack" data-b="attack" aria-label="攻擊（按住蓄力）">攻<span class="k">J</span></button>
    <button class="tb" id="bDash" data-b="dash" aria-label="衝刺">衝<span class="k">K</span></button>
    <button class="tb" id="bBite" data-b="bite" aria-label="咬招">咬<span class="k">L</span></button>
    <button class="tb" id="bSkill" data-b="skill" aria-label="形態技能">技<canvas class="cd" width="64" height="64"></canvas><span class="k">I</span></button>
    <button class="tb" id="bDevour" data-b="devour" aria-label="吞" hidden>吞<span class="k">E</span></button>
    <button class="tb" id="bBurst" data-b="burst" aria-label="全彩" hidden>全彩<span class="k">Q</span></button>
    <button id="bPause" aria-label="暫停"><i></i><i></i></button>
  </div>

  <div id="title" class="ov" hidden>
    <div class="btns">
      <button class="stk" id="tContinue" hidden>繼續<small id="tContinueSub"></small></button>
      <button class="stk pink" id="tStart" style="--rot:1.2deg">開始</button>
      <button class="stk paper" id="tSettings" style="--rot:-2.5deg">設定</button>
    </div>
    <div class="ver">STILL BEATING · CH.1</div>
  </div>

  <div id="hub" class="ov" hidden>
    <div class="top">
      <span class="chip">顏料 <b id="hubPaint">0</b></span>
      <span class="chip" id="hubChapter">第一章・黃</span>
    </div>
    <div class="bar">
      <button class="stk paper" id="hMem" style="--rot:-2deg">記憶牆</button>
      <button class="stk cyan" id="hGarage" style="--rot:1deg">黑手改裝</button>
      <button class="stk go" id="hGo">下去</button>
      <button class="stk paper" id="hHer" style="--rot:2deg">看她</button>
      <button class="stk ghost" id="hSet" style="--rot:-1deg">設定</button>
    </div>
  </div>

  <div id="dlg" class="ov" hidden>
    <div class="box" id="dlgBox" role="button" tabindex="0" aria-label="下一句">
      <canvas id="dlgFace" width="128" height="128"></canvas>
      <div style="flex:1;min-width:0">
        <div class="who" id="dlgWho"></div>
        <div class="txt" id="dlgTxt"></div>
        <div class="next" id="dlgNext">點一下繼續 ▸</div>
      </div>
    </div>
  </div>

  <div id="cards" class="ov dim" hidden>
    <div class="hdr" id="cardsHdr">升級！<small>挑一個帶走</small></div>
    <div class="wrap" id="cardsWrap"></div>
    <div class="row center"><button class="stk paper reroll" id="cardsReroll" hidden>重抽（<span id="rerollN">1</span>）</button></div>
  </div>

  <div id="panel" class="ov dim" hidden><div class="panel" id="panelBox"></div></div>

  <div id="comic" class="ov" hidden>
    <button class="stk ghost skip" id="comicSkip">跳過</button>
    <div class="cap" id="comicCap"></div>
    <div class="tap">點一下繼續</div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ---- 01-core.js ---- */
'use strict';
/* =========================================================
   不死心 STILL BEATING — core: math, palette, save, input

const R = {
  cv: null, g: null, dpr: 1, W: 1, H: 1, scale: 1, quality: 1,
  cam: { x: 0, y: 0, zoom: 1, tzoom: 1, zv: 0, trauma: 0, kx: 0, ky: 0, sx: 0, sy: 0, t: 0 },
  init() {
    this.cv = $('cv'); this.g = this.cv.getContext('2d', { alpha: false });
    this.makePatterns();
    this.resize();
    addEventListener('resize', () => this.resize());
    if (window.visualViewport) visualViewport.addEventListener('resize', () => this.resize());
  },
  safe: { l: 0, r: 0, t: 0, b: 0 },
  measureSafe() {
    try {
      let el = this._safeEl;
      if (!el) { el = document.createElement('div'); el.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)'; document.body.appendChild(el); this._safeEl = el; }
      const cs = getComputedStyle(el);
      this.safe = { l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0, t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
    } catch (e) { }
  },
  resize() {
    this.measureSafe();
    const r = this.cv.getBoundingClientRect();
    this.W = Math.max(1, r.width); this.H = Math.max(1, r.height);
    this.dpr = Math.min(window.devicePixelRatio || 1, 2) * this.quality;
    this.cv.width = Math.max(1, Math.round(this.W * this.dpr)); this.cv.height = Math.max(1, Math.round(this.H * this.dpr));
    const targetH = clamp(470 + (this.H - 400) * 0.2, 450, 640);
    this.scale = Math.min(this.H / targetH, this.W / (this.H > this.W * 1.05 ? 455 : 560));
    this.vignette = null;
    if (typeof Game !== 'undefined' && Game.onResize) Game.onResize();
  },
  get portrait() { return this.H > this.W * 1.05; },
  viewW() { return this.W / (this.scale * this.cam.zoom); },
  viewH() { return this.H / (this.scale * this.cam.zoom); },
  toWorld() {
    const c = this.cam, s = this.dpr * this.scale * c.zoom;
    this.g.setTransform(s, 0, 0, s, this.cv.width / 2 - (c.x + c.sx) * s, this.cv.height / 2 - (c.y + c.sy) * s);
  },
  toScreen() { this.g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); },
  shake(a) { this.cam.trauma = Math.min(1, this.cam.trauma + a); },
  kick(ang, m) { this.cam.kx += Math.cos(ang) * m; this.cam.ky += Math.sin(ang) * m; },
  punch(z) { this.cam.zv += z * 14; },
  snap(x, y) { this.cam.x = x; this.cam.y = y; },
  updateCam(dt, tx, ty, room) {
    const c = this.cam; c.t += dt;
    const vw = this.viewW(), vh = this.viewH();
    if (room) {

/* ---------- FX: particles, decals, floating text ---------- */
const FX = {
  parts: [], texts: [], under: [],

  add(p) { if (this.parts.length > 460) this.parts.splice(0, 40); p.t = 0; this.parts.push(p); return p; },
  addUnder(p) { if (this.under.length > 120) this.under.shift(); p.t = 0; this.under.push(p); return p; },
  // paint droplets that arc up and land as stains
  paint(x, y, color, n = 10, spd = 260, up = 260, size = 5, dir = null, spread = PI) {
    for (let i = 0; i < n; i++) {
      const a = dir == null ? rand(0, TAU) : dir + rand(-spread / 2, spread / 2);
      const s = rand(0.3, 1) * spd;

    }
  },
  sparks(x, y, color, n = 8, spd = 520, dir = null, spread = TAU, len = 14) {
    for (let i = 0; i < n; i++) {
      const a = dir == null ? rand(0, TAU) : dir + rand(-spread / 2, spread / 2), s = rand(0.4, 1) * spd;
      this.add({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.14, 0.3), color, len, w: rand(2, 3.5) });
    }
  },
  smoke(x, y, n = 3, col = 'rgba(200,196,206,', size = 14, vy = -40) {
    for (let i = 0; i < n; i++) this.add({ k: 'smoke', x: x + rand(-8, 8), y: y + rand(-6, 6), vx: rand(-30, 30), vy: vy + rand(-20, 10), size: size * rand(0.7, 1.3), life: rand(0.5, 0.9), col });
  },
  ring(x, y, r0, r1, life, color, w = 6, under = true) {
    const p = { k: 'ring', x, y, r0, r1, life, color, w };

  },
  flash(x, y, r, color = '#fff', life = 0.12) { this.add({ k: 'flash', x, y, r, color, life }); },
  slash(x, y, ang, arc, r, w, color, life = 0.16, flip = 1) { this.add({ k: 'slash', x, y, ang, arc, r, w, color, life, flip }); },
  star(x, y, size, color = PAL.yellow, life = 0.35) { this.add({ k: 'star', x, y, size, color, life, rot: rand(0, PI) }); },
  shards(x, y, color, n = 8, spd = 380) {
    for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(0.3, 1) * spd; this.add({ k: 'shard', x, y, z: rand(10, 40), vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.7, vz: rand(150, 380), rot: rand(0, TAU), vr: rand(-14, 14), size: rand(4, 9), color, life: 1.6 }); }
  },
  bubbles(x, y, n = 4, color = PAL.cyanL) { for (let i = 0; i < n; i++) this.add({ k: 'bubble', x: x + rand(-10, 10), y: y + rand(-6, 6), vx: rand(-20, 20), vy: rand(-90, -40), size: rand(2.5, 6), life: rand(0.5, 1), color }); },
  confetti(x, y, n = 14) { for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(80, 300); this.add({ k: 'conf', x, y, z: rand(20, 60), vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.6, vz: rand(100, 300), rot: rand(0, TAU), vr: rand(-10, 10), color: pick([PAL.pink, PAL.yellow, PAL.cyan, PAL.paper]), life: 2.4 }); } },
  ghost(x, y, dir, color, life = 0.22, pose = null) { this.add({ k: 'ghost', x, y, dir, color, life, pose }); },

  text(str, x, y, o = {}) {

  draw(g) {

/* ---------- decals: paint accumulating on the floor ---------- */
const Decal = {
  S: 1.25, // decal canvas resolution per world unit
  make(room) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(room.w * this.S); c.height = Math.ceil(room.h * this.S);
    room.decal = c; room.dg = c.getContext('2d');
  },
  splat(room, x, y, size, color, alpha = 0.85) {
    const g = room.dg; if (!g) return;
    const S = this.S; g.save(); g.scale(S, S); g.globalAlpha = alpha; g.fillStyle = color;
    const n = 9, rot = rand(0, TAU);
    g.beginPath();
    for (let i = 0; i <= n; i++) { const a = rot + i / n * TAU, r = size * rand(0.7, 1.15); const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r * 0.7; if (i === 0) g.moveTo(px, py); else g.lineTo(px, py); }
    g.fill();
    const m = size > 8 ? randi(2, 5) : randi(0, 2);
    for (let i = 0; i < m; i++) { const a = rand(0, TAU), d = size * rand(1.1, 2.2); circ(g, x + Math.cos(a) * d, y + Math.sin(a) * d * 0.7, size * rand(0.12, 0.3)); g.fill(); }
    if (size > 10 && chance(0.5)) { const a = rand(0, TAU), L = size * rand(1.4, 2.6); g.lineCap = 'round'; g.lineWidth = size * 0.22; g.strokeStyle = color; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L * 0.7); g.stroke(); }
    g.restore();
  },
  big(room, x, y, size, color) { this.splat(room, x, y, size, color, 0.9); for (let i = 0; i < 6; i++) this.splat(room, x + rand(-size, size) * 1.2, y + rand(-size, size) * 0.8, size * rand(0.2, 0.45), color, 0.85); },
  scorch(room, x, y, size) { const g = room.dg; if (!g) return; g.save(); g.scale(this.S, this.S); g.globalAlpha = 0.25; g.fillStyle = '#120f16'; ell(g, x, y, size, size * 0.65); g.fill(); g.restore(); },
  tag(room, x, y, text, color) {
    const g = room.dg; if (!g) return; g.save(); g.scale(this.S, this.S); g.translate(x, y); g.rotate(rand(-0.2, 0.2)); g.scale(1, 0.7);
    g.font = `400 ${randi(30, 46)}px ${FONT_SPRAY}`; g.textAlign = 'center'; g.globalAlpha = 0.5; g.fillStyle = color; g.fillText(text, 0, 0); g.restore();
  }
};

const STYLE_COL = { base: PAL.pink, neon: PAL.cyan, cart: PAL.orange, claw: PAL.yellow, soda: PAL.green };

/* ---------------- update / draw ---------------- */
function updateEnemies(dt) {
  const p = W.p;
  for (const e of W.ents) {
    if (!e.alive) continue;
    e.animT += dt; e.st += dt;
    e.flash = Math.max(0, e.flash - dt); e.hitPulse = Math.max(0, (e.hitPulse || 0) - dt * 6);
    if (e.marked > 0) e.marked -= dt;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowMul = 1; }
    if (e.broken > 0) {
      e.broken -= dt;
      if (e.broken <= 0) { e.broken = 0; if (e.D.boss) bossUnbreak(e); else if (e.hp > e.maxHp * 0.3) e.coreExposed = false; }
    }
    if (e.state === 'spawn') { if (e.st >= 0.45) { e.state = e.D.boss ? 'intro' : 'idle'; e.st = 0; } continue; }
    if (e.dying) { e.dieT = (e.dieT || 0) + dt; if (e.dieT > 12 && !e.devouring) bossDevoured(e, false); }
    const sm = e.slowT > 0 ? e.slowMul : 1;
    e.vx = 0; e.vy = 0; e.moving = false;
    if (e.devouring) { }
    else if (e.stun > 0) { e.stun -= dt; e.tele = 0; }
    else if (p) AI[e.type](e, dt, p);
    e.x += (e.vx * sm + e.kvx) * dt; e.y += (e.vy * sm + e.kvy) * dt;
    const kd = Math.exp(-dt * 7); e.kvx *= kd; e.kvy *= kd;
    e.wallHit = collideRoom(e, e.r);
  }
  for (let i = W.ents.length - 1; i >= 0; i--) if (!W.ents[i].alive) W.ents.splice(i, 1);
}

      node: i, f: n.f, coins: Run.coins, paint: Run.paint, kills: Run.kills, devours: Run.devours, heat: Run.heat, rerolls: Run.rerolls, nextReward: Run.nextReward, nextCore: Run.nextCore, memOffered: Run.memOffered, peak: Run.peak, cleared: Run.cleared,
      p: { style: p.style, styleLv: p.styleLv, talents: p.talents, xp: p.xp, lv: p.lv, bonusHp: p.bonusHp, hp: p.hp, burst: p.burst, lockLeft: p.lockLeft }

  },
  genWaves(f, idx, room) {
    const F = FLOORS[f], list = F.waves[Math.min(idx, F.waves.length - 1)], waves = [];
    list.forEach((budget, wi) => {
      let b = budget + Run.heat; const w = [];
      if (wi === 0 && room.reward === 'core' && room.coreStyle) { w.push({ type: STYLE_ENEMY[room.coreStyle], elite: true }); b -= 6; }

  spawnWave(room) {

          else if (k === 'boss') { const b = spawnEnemy('taxi', room.w / 2, ROOM_TOP + 160); W.boss = b; b.onParried = o => taxiParried(b, o); this.banner(b.D.title + '・' + b.D.sub, PAL.yellow, '……跳錶了。'); Save.data.flags.bossSeen = true; Save.write(); AudioSys.play('honk'); }

        break;

      case 'clear':

          else { this.rs = 'doors'; this.openDoors(); }

          if (d < 110) { if (!this.stallHint) { this.stallHint = true; UI.hint = Input.kbMode ? '按 J 逛黑手的攤子' : '按「攻」逛黑手的攤子'; UI.hintT = 0; UI.hintDur = 2.5; } if (Input.take('attack', 0.2)) this.openShop(); }

          toast('補給機吐了一罐出來。');
        }
        for (const d of room.doors) {
          if (!d.open) continue;
          if (Math.abs(p.x - d.x) < 52 && p.y < ROOM_TOP + 26) { this.takeDoor(d); break; }
        }
        break;
      }
    }
  },
  roomClear() {
    const room = W.room, p = W.p; if (this.rs === 'clear') return;

    Run.peak = Math.max(Run.peak, Combo.peak);

    W.haz.length = 0; W.proj = W.proj.filter(b => b.owner === 'p');

    if (r !== 'mem' && chance(0.16)) { const m = this.pickMemory(Run.floor); if (m && !Run.memOffered.includes(m)) { Run.memOffered.push(m); W.picks.push({ kind: 'mem', memId: m, x: rand(room.w * 0.3, room.w * 0.7), y: ROOM_TOP + 90, vx: 0, vy: 0, t: 0, z: 0, vz: 0 }); } }
  },
  pickMemory(f) {
    const have = Save.data.memories;
    const c = MEMORIES.filter(m => m.floor <= f + 1 && !have.includes(m.id) && !Run.memOffered.includes(m.id) && m.id !== 'm4');
    if (!c.length) return null;
    const m = c.sort((a, b) => b.floor - a.floor)[0];
    return m.id;
  },
  openDoors() {
    const room = W.room, next = NODES[Run.node + 1];
    room.doors = [];
    if (!next) return;
    let opts;
    if (next.k === 'combat') opts = this.doorRewards(next);
    else opts = [{ kind: next.k }];
    const n = opts.length, xs = n === 1 ? [0.5] : (n === 2 ? [0.36, 0.64] : [0.24, 0.5, 0.76]);
    opts.forEach((o, i) => room.doors.push({ x: room.w * xs[i], open: true, t: 0, reward: o.reward, core: o.core, kind: o.kind || 'combat' }));
    AudioSys.play('door');
    if (!Save.data.flags.tut_door) { Save.data.flags.tut_door = true; UI.hint = '走進門就能前進，門上標著過關的獎勵'; UI.hintT = 0; UI.hintDur = 3.5; }
  },
  doorRewards(next) {
    const p = W.p, out = [], used = new Set();
    const n = chance(0.3) ? 3 : 2;
    const pool = [['paint', 3], ['coins', 2], ['heal', p.hp / p.maxHp < 0.5 ? 3 : 1], ['card', 2.6], ['core', 2.2], ['mem', this.pickMemory(next.f) ? 1.6 : 0]];
    for (let i = 0; i < n; i++) {
      const c = pool.filter(q => !used.has(q[0]) && q[1] > 0); if (!c.length) break;
      const r = weightedPick(c, q => q[1])[0]; used.add(r);
      const o = { reward: r };
      if (r === 'core') { const opts = ['neon', 'cart', 'claw', 'soda'].filter(k => k !== p.style || (p.styleLv[k] || 0) < 3); o.core = pick(opts.length ? opts : ['neon']); if (next.f === 0 && o.core === 'claw') o.core = pick(['neon', 'cart', 'soda']); }
      out.push(o);
    }
    return out;
  },
  takeDoor(d) {
    if (this.wipe) return;
    d.open = false;
    Run.nextReward = d.reward || null; Run.nextCore = d.core || null;
    if (d.reward === 'mem') { const m = this.pickMemory(NODES[Run.node + 1].f); if (m) Run.memOffered.push(m); }
    AudioSys.play('door');
    this.wipeTo(() => this.enterNode(Run.node + 1));
  },
  miniDefeated(e, eaten) {
    const room = W.room, p = W.p;
    Save.data.flags.jukebox = true;
    if (eaten) { p.burst = 100; p.pendingLv++; FX.text('全彩滿了！', p.x, p.y - 150, { size: 30, color: PAL.yellow, shadow: PAL.pink }); }
    for (let i = 0; i < 8; i++) dropPick('paint', e.x, e.y + 40, Math.round(5 * Run.heatMul()), { col: pick(INKS) });
    for (let i = 0; i < 14; i++) dropPick('coin', e.x, e.y + 40, 1);
    if (!Save.data.memories.includes('m4')) W.picks.push({ kind: 'mem', memId: 'm4', x: room.w / 2, y: ROOM_TOP + 230, vx: 0, vy: 0, t: 0, z: 0, vz: 0 });
    p.pendingLv++;
    W.boss = null; AudioSys.playMusic('run');
    this.banner('還沒結束……結束了。', PAL.pink);
    this.rs = 'clear'; this.rsT = -0.6; room.cleared = true; room.reward = null;
  },
  bossDefeated(e) {
    const p = W.p;
    W.boss = null; W.slow(0.25, 1.2); Run.peak = Math.max(Run.peak, Combo.peak);
    Run.paint += Math.round(120 * Run.heatMul());
    Save.data.bossKills++;
    FX.text('黃色，吃回來了。', p.x, p.y - 160, { size: 30, color: PAL.yellow, shadow: PAL.ink, life: 2 });
    AudioSys.playMusic(null);
    $('touch').hidden = true; Input.enabled = false;
    const firstTime = !Save.data.flags.ch1Done;
    setTimeout(() => {
      const after = () => this.endRun('win');
      if (firstTime) this.comic(BOSS_MEMORY, after); else after();
    }, 1800);
  },
  onPlayerDeath() { if (this.state === 'run') this.endRun('dead'); },
  endRun(how) {
    const s = Save.data;
    Run.active = false; Run.peak = Math.max(Run.peak, Combo.peak);
    const mul = RANKS[Run.peak].mul, bank = Math.round(Run.paint * mul);
    s.paint += bank; s.totalPaint += bank; s.runs++; s.kills += Run.kills;
    if (how === 'dead') s.deaths++;
    const firstWin = how === 'win' && !s.flags.ch1Done;
    if (how === 'win') { s.flags.ch1Done = true; s.heatMax = Math.min(5, Math.max(s.heatMax || 0, (Run.heat || 0) + 1)); }
    s.run = null; Save.write();
    AudioSys.layer.full = false;
    $('touch').hidden = true; Input.enabled = false;
    const html = `<h2>${how === 'win' ? '黃色，吃回來了' : '倒在 B' + (Run.floor + 1)}</h2>
      <p class="sub">${how === 'win' ? '老黃的錶停了。' : pick(['心還在跳。', '噴漆罐還在響。', '再下去一次。'])}</p>
      <div class="stats">
        <div class="stat"><i>擊倒</i><b>${Run.kills}</b></div>
        <div class="stat"><i>吞</i><b>${Run.devours}</b></div>
        <div class="stat"><i>最高評價</i><b style="font-family:var(--f-cjk);font-weight:900">${RANKS[Run.peak].n}</b></div>
        <div class="stat"><i>等級</i><b>${W.p ? W.p.lv : 1}</b></div>
        <div class="stat"><i>顏料（×${mul}）</i><b style="color:#c8215f">+${bank}</b></div>
      </div>
      <div class="row end"><button class="stk pink" id="rHome">回到牆邊</button></div>`;
    const go = () => {

    };

  /* ---------- level-up cards ---------- */
  showCards(cb) {
    const p = W.p; if (!p || p.pendingLv <= 0) { cb && cb(); return; }
    this.overlay = 'cards'; this.cardsCb = cb; Input.clearAll(); UI.bannerD = null; UI.hint = null;
    $('cards').hidden = false; AudioSys.play('levelup');
    this.renderCards();
  },
  genCards(p) {
    const pool = TALENTS.filter(t => (p.talents[t.id] || 0) < t.max && (!t.style || t.style === p.style));
    const picks = [];
    for (let i = 0; i < 3 && pool.length; i++) {
      const t = weightedPick(pool, x => (x.style ? 3 : 1.2) + ((p.talents[x.id] || 0) > 0 ? 1 : 0));
      picks.push(t); pool.splice(pool.indexOf(t), 1);
    }
    while (picks.length < 3) picks.push({ id: '_heal' + picks.length, name: '喘口氣', max: 1, icon: 'heal', d: () => '回復 30% 生命。', fake: true });
    return picks;
  },
  renderCards() {
    const p = W.p, wrap = $('cardsWrap'); wrap.innerHTML = '';
    $('cardsHdr').innerHTML = `升級！<small>還有 ${p.pendingLv} 次・挑一個帶走</small>`;
    $('cardsReroll').hidden = Run.rerolls <= 0; $('rerollN').textContent = Run.rerolls;
    const cards = this.genCards(p);
    cards.forEach((t, i) => {
      const rk = p.talents[t.id] || 0, col = t.style ? STYLE_COL[t.style] : PAL.yellow;
      const b = document.createElement('button'); b.className = 'card'; b.style.setProperty('--c', col);
      b.innerHTML = `<span class="cat">${t.style ? STYLES[t.style].name : (t.fake ? '補給' : '通用')}</span>`;
      b.appendChild(iconCanvas(t.icon || 'card', 40));
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = t.name; b.appendChild(nm);
      const ds = document.createElement('div'); ds.className = 'ds'; ds.textContent = t.d(rk + 1); b.appendChild(ds);
      const pips = document.createElement('div'); pips.className = 'pips';
      for (let k = 0; k < t.max; k++) { const ii = document.createElement('i'); ii.className = k < rk ? 'on' : (k === rk ? 'new' : ''); pips.appendChild(ii); }
      b.appendChild(pips);
      if (Input.kbMode) { const kk = document.createElement('div'); kk.className = 'note'; kk.textContent = '按 ' + (i + 1); b.appendChild(kk); }
      b.onclick = () => this.pickCard(t);
      wrap.appendChild(b);
    });
    this.cardKeys = cards;
  },
  pickCard(t) {
    const p = W.p; AudioSys.play('pick');
    if (t.fake) { p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.3)); }
    else { p.talents[t.id] = (p.talents[t.id] || 0) + 1; calcStats(p); if (t.id === 'dash2') p.dashN = p.s.dashMax; }
    p.pendingLv--;
    if (p.pendingLv > 0) this.renderCards();
    else { $('cards').hidden = true; this.overlay = null; Input.clearAll(); const cb = this.cardsCb; this.cardsCb = null; cb && cb(); }
  },
  onKey(e) {
    if (this.overlay === 'cards' && this.cardKeys) { const n = parseInt(e.key, 10); if (n >= 1 && n <= 3 && this.cardKeys[n - 1]) this.pickCard(this.cardKeys[n - 1]); }
    else if (this.overlay === 'dialog' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyJ')) this.dlgNext();
    else if (this.state === 'comic' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyJ')) this.comicNext();
  },

  openShop() {
    const p = W.p;
    if (!this.shopStock) { const pool = shuffle(SHOP_ITEMS.filter(i => i.id !== 'heal')); this.shopStock = [SHOP_ITEMS[0], ...pool.slice(0, 3)].map(i => Object.assign({ sold: false }, i)); }
    const render = () => {
      let html = `<h2>黑手的攤子</h2><p class="sub">零錢：<b class="price">${Run.coins}</b>　生命：${Math.ceil(p.hp)}/${p.maxHp}</p><div class="list">`;
      this.shopStock.forEach((it, i) => {
        const can = !it.sold && Run.coins >= it.price;
        html += `<div class="item"><span data-ico="${it.icon}"></span><div class="meta"><b>${it.name}</b><span>${it.d}</span></div><button class="stk" data-buy="${i}" ${can ? '' : 'disabled'}>${it.sold ? '賣完了' : '<span class="price">' + it.price + '</span> 零錢'}</button></div>`;
      });
      html += '</div><div class="row end" style="margin-top:14px"><button class="stk pink" id="shopLeave">離開</button></div>';

      $('shopLeave').onclick = () => hidePanel();

      else if (it.id === 'reroll') Run.rerolls++;
      else if (it.id === 'burst') p.burst = 100;
      else if (it.id === 'card') { p.pendingLv++; hidePanel(); this.showCards(() => this.openShop()); return; }
      render();

    render();

function drawPicks1(g, k) {

/* ---------- start ---------- */
(function start() {
