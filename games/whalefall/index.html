  UI.banner = banner;
  function toast(text, img) {
    var box = $('#app > .toasts');
    if (!box) { box = el('<div class="toasts" aria-live="polite"></div>'); $('#app').appendChild(box); }
    while (box.children.length >= 3) box.firstChild.remove();
    var t = el('<div class="toast">' + (img ? '<img alt="" src="' + img + '">' : '') + '<span>' + text + '</span></div>');
    box.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 320); }, 2300);
  }
  UI.toast = toast;
  UI.tip = function (id) {
    var P = WF.PROFILE;
    if (!P || !P.settings.tips || P.tips[id] || !WF.TIPS[id]) return Promise.resolve();
    P.tips[id] = 1; WF.saveProfile();
    return new Promise(function (res) {
      var t = el('<div class="tip"><div class="tx">' + WF.TIPS[id] + '</div><button class="btn btn-sun">知道了</button></div>');
      $('#app').appendChild(t);
      var close = function () { t.remove(); res(); };
      t.querySelector('.btn').onclick = function () { AU.sfx('tap'); close(); };
      setTimeout(function () { if (t.isConnected) close(); }, 12000);
    });
  };

  /* ---------- 骰子 ---------- */
  var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  var ROT = { 1: [0, 0], 6: [0, 180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0] };
  function face(n) { var h = '<div class="f f' + n + '">'; for (var i = 0; i < 9; i++) h += '<i class="' + (PIPS[n].indexOf(i) >= 0 ? 'on' : '') + '"></i>'; return h + '</div>'; }
  function rollDice(vals, human, small) {
    return gate().then(function () {
      return new Promise(function (res) {
        var fx = $('#fx');
        var box = el('<div class="dicebox"></div>');
        var sum = el('<div class="dicesum"></div>');
        vals.forEach(function () { box.appendChild(el('<div class="die">' + [1, 2, 3, 4, 5, 6].map(face).join('') + '</div>')); });
        fx.appendChild(box); fx.appendChild(sum);
        var dur = (small ? 500 : 820) * (human ? Math.min(1, SPD * 1.5) : Math.max(0.55, SPD));
        var dies = box.querySelectorAll('.die');
        dies.forEach(function (d, i) {
          var rx = 360 * (2 + Math.floor(Math.random() * 3)), ry = 360 * (2 + Math.floor(Math.random() * 3));
          d.style.transition = 'none';
          d.style.transform = 'translateY(-160px) rotateX(' + Math.random() * 360 + 'deg) rotateY(' + Math.random() * 360 + 'deg)';
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              d.style.transition = 'transform ' + dur + 'ms cubic-bezier(.2,.9,.3,1.15)';
              var r = ROT[vals[i]];
              d.style.transform = 'translateY(0) rotateX(' + (r[0] + rx) + 'deg) rotateY(' + (r[1] + ry) + 'deg)';
            });
          });
        });
        AU.sfx('shake');
        setTimeout(function () {
          AU.sfx('dice'); vib(20);
          sum.textContent = vals.reduce(function (a, b) { return a + b; }, 0);
          sum.classList.add('on');
        }, dur * 0.85);
        setTimeout(function () {
          box.style.transition = 'opacity .25s'; box.style.opacity = '0'; sum.style.opacity = '0';
          setTimeout(function () { box.remove(); sum.remove(); }, 260);
          res();
        }, dur + 380 * (human ? 1 : SPD));
      });
    });
  }

  /* ============================================================
     引擎事件 → 動畫
     ============================================================ */
  var stepK = 0;
  UI.fx = function (name, d) {
    if (!G) return null;
    return gate().then(function () {
      try { return fxRun(name, d); } catch (e) { console.error('fx', name, e); return null; }
    }).catch(function (e) { console.error('fx', name, e); return null; }).then(function (v) { try { UI.refresh(); } catch (e) { console.error(e); } return v; });
  };
  UI.fxNow = function (name, d) { if (!G) return; try { fxNowRun(name, d); UI.refresh(); } catch (e) { console.error('fxNow', name, e); } };

  function money(pid, amt) { if (!amt) return; R.floatAt(pid, (amt > 0 ? '+' : '') + fmt(amt), amt > 0 ? '#1B9168' : '#E04E55', Math.abs(amt) >= 3000); }

  function fxRun(name, d) {
    var p = d.p, H = p && p.human;
    switch (name) {
      case 'begin': {
        R.overview();
        return sleep(900).then(function () { AU.sfx('season'); return banner({ k: '第' + E.year() + '年 ' + E.month() + '月', big: WF.SEASONS[E.season()].n + '・' + WF.SEASONS[E.season()].sea, sub: '旺區：' + (map.seasonBoost[E.season()] || []).map(function (x) { return map.dists[x].name; }).join('、'), bg: SEASON_COL[E.season()], dur: 1600, human: true }); });
      }
      case 'turn': {
        stepK = 0;
        setDeck(p.human ? 'move' : 'idle', p);
        R.focusPlayer(p.id, R.closeZoom());
        if (p.human && humans().length > 1) return handoff(p);
        return wait(p.human ? 250 : 380);
      }
      case 'stuck': R.emote(p.id, 'sad'); R.bubble(p.id, '……動不了'); return banner({ big: p.name + ' 休息一回合', bg: '#7C8BC4', dur: 1000, human: H });
      case 'anchored': R.emote(p.id, 'angry'); return banner({ big: p.name + ' 被定錨了', sub: '這回合原地不動', bg: '#55617D', dur: 1000, human: H });
      case 'dice': return rollDice(d.dice, H, d.small);
      case 'step': {
        AU.sfx('step', { k: stepK++ });
        R.focusPlayer(p.id);
        var dur = Math.max(0.1, (H ? 0.24 : 0.22) * (H ? Math.min(1, SPD * 1.6) : SPD));
        return R.hop(p.id, d.tid, dur).then(function () { if (d.i === d.n - 1) { AU.sfx('land'); R.sync(); } });
      }
      case 'salary': {
        AU.sfx('coin'); money(p.id, d.amt);
        if (d.landed) return banner({ k: '正好靠港', big: p.name, amt: '+' + fmt(d.amt), bg: '#1B9168', dur: 1000, human: H });
        return wait(150);
      }
      case 'cantafford': if (H) toast('買不起這塊地（' + fmt(d.price) + '）'); return wait(200);
      case 'home': return wait(150);
      case 'toll': return tollFx(d);
      case 'buyout': {
        AU.sfx('cash'); R.pop(d.tid); R.burstTile(d.tid, 'spark', 22, d.p.color);
        money(d.p.id, -d.price); money(d.from.id, d.price);
        return banner({ k: d.card ? '強購令' : '強制收購', big: esc(dname(d.tid)), sub: d.from.name + ' → ' + d.p.name + '（' + fmt(d.price) + '）', bg: '#CF464C', dur: 1300, human: d.p.human || d.from.human });
      }
      case 'mark': {
        AU.sfx('build'); R.pop(d.tid); R.burstTile(d.tid, 'spark', 26, '#FFD25E'); R.confetti(R.tileTop(d.tid, 60).x, R.tileTop(d.tid, 60).y);
        return banner({ k: p.name + ' 蓋起地標', big: WF.MARKS[d.type].n, sub: WF.MARKS[d.type].desc, art: '<img alt="" src="' + R.markThumb(d.type, p.color) + '">', bg: '#5B3A8C', dur: 1500, human: H });
      }
      case 'markup': AU.sfx('build'); R.pop(d.tid); R.burstTile(d.tid, 'spark', 16); return wait(500);
      case 'draw': {
        AU.sfx('card');
        if (H) return banner({ k: d.src ? d.src + '・抽到卡片' : '抽到卡片', big: WF.CARDS[d.cid].n, sub: WF.CARDS[d.cid].desc, art: ART.CARD_SVG[d.cid], bg: '#3B5BA9', dur: 1500, human: true });
        toast(esc(p.name) + ' 抽到一張卡', pimg(p)); return wait(250);
      }
      case 'discard': if (H) toast('丟掉了「' + WF.CARDS[d.cid].n + '」'); return wait(150);
      case 'card': {
        AU.sfx('card');
        var tgtName = '';
        if (d.tgt && d.tgt.k === 'p') tgtName = '→ ' + G.players[d.tgt.id].name;
        else if (d.tgt && d.tgt.k === 't') tgtName = '→ ' + dname(d.tgt.id);
        else if (d.tgt && d.tgt.k === 'd') tgtName = '→ ' + map.dists[d.tgt.id].name;
        else if (d.tgt && d.tgt.k === 'lure') tgtName = '→ ' + G.players[d.tgt.id].name;
        if (d.tgt && (d.tgt.k === 't')) R.focusTile(d.tgt.id, R.closeZoom() * 0.85);
        return banner({ k: p.name + ' 使用', big: WF.CARDS[d.cid].n, sub: tgtName || WF.CARDS[d.cid].desc, art: ART.CARD_SVG[d.cid], bg: '#3B5BA9', dur: 1300, human: H || (d.tgt && d.tgt.k === 'p' && G.players[d.tgt.id].human) });
      }
      case 'shield': AU.sfx('pop'); R.burst(R.tokPos(p.id).x, R.tokPos(p.id).y - 70, 'spark', 18, '#8DB6F2'); return banner({ big: p.name + ' 的護盾擋下了！', bg: '#3B5BA9', dur: 1000 });
      case 'anchor': R.emote(d.q.id, 'shock'); return wait(300);
      case 'freeze': R.emote(d.q.id, 'shock'); toast(d.q.name + ' 的地 2 輪收不到過路費'); return wait(400);
      case 'demolish': AU.sfx('quake'); R.shake(8); R.burstTile(d.tid, 'dust', 20, '#fff'); R.emote(d.q.id, 'angry'); return wait(600);
      case 'equalize': AU.sfx('cash'); return banner({ big: '均富令！', sub: '每個人的現金都變成 ' + fmt(d.each), bg: '#8E6CF0', dur: 1300 });
      case 'steal': {
        AU.sfx('coin');
        R.coins({ x: R.tokPos(d.from.id).x, y: R.tokPos(d.from.id).y }, { x: R.tokPos(d.to.id).x, y: R.tokPos(d.to.id).y }, 5);
        money(d.from.id, -d.amt); money(d.to.id, d.amt);
        if (!d.card) toast(esc(d.to.name) + ' 從 ' + esc(d.from.name) + ' 身上順走 ' + fmt(d.amt), pimg(d.to));
        return wait(d.card ? 600 : 300);
      }
      case 'fly': {
        AU.sfx('whoosh');
        var f = R.fly(p.id, d.tid, 0.9 * (H ? 1 : Math.max(0.6, SPD)));
        R.focusTile(d.tid, R.closeZoom());
        return f.then(function () { R.sync(); if (d.how === 'lure') { R.emote(p.id, 'shock'); return banner({ big: p.name + ' 被拉了過去！', bg: '#CF464C', dur: 900 }); } });
      }
      case 'tax': AU.sfx('pay'); money(p.id, -d.amt); return banner({ k: '稅關', big: p.name + ' 繳稅', amt: '−' + fmt(d.amt), bg: '#55617D', dur: 900, human: H });
      case 'pool': {
        if (!d.amt) { toast('許願池是空的'); return wait(200); }
        AU.sfx('cash'); money(p.id, d.amt); R.confetti(R.tokPos(p.id).x, R.tokPos(p.id).y - 80);
        return banner({ k: '許願池', big: p.name + ' 全部帶走', amt: '+' + fmt(d.amt), bg: '#1B9168', dur: 1300, human: H });
      }
      case 'poolup': toast('許願池漲到 ' + fmt(d.amt)); return wait(300);
      case 'storm': AU.sfx('thunder'); R.emote(p.id, 'shock'); return banner({ k: '風暴眼', big: p.name + ' 被困住一回合', bg: '#55617D', dur: 1000, human: H });
      case 'spa': R.emote(p.id, 'happy'); R.bubble(p.id, '泡得好舒服……'); return wait(500);
      case 'comp': {
        AU.sfx('notify'); R.burst(R.tokPos(p.id).x, R.tokPos(p.id).y - 70, 'spark', 16, WF.COMPS[d.comp].color);
        return banner({ k: p.name + ' 得到伴靈', big: WF.COMPS[d.comp].n, sub: WF.COMPS[d.comp].desc + '（' + p.comp.t + ' 回合）', art: '<img alt="" src="' + ART.compImg(d.comp) + '">', bg: '#147A84', dur: 1300, human: H });
      }
      case 'comp-end': toast(esc(p.name) + ' 的' + WF.COMPS[d.comp].n + '游走了'); return wait(150);
      case 'dest': {
        AU.sfx('whale'); R.ripple();
        var keep = { x: R.cam.tx, y: R.cam.ty, z: R.cam.tz };
        R.focusTile(d.tid, R.closeZoom() * 0.75);
        return banner({ k: '鯨歌響起', big: esc(dname(d.tid)), sub: '第一個抵達的人得到 ' + fmt(d.reward) + '，最慢的會被藤壺精纏上', art: ART.WHALE_ICON, bg: '#147A84', dur: 2000, human: true }).then(function () {
          UI.tip('dest');
          R.cam.tx = keep.x; R.cam.ty = keep.y; R.cam.tz = keep.z;
        });
      }
      case 'arrive': {
        AU.sfx('fanfare'); vib(40); R.emote(p.id, 'happy', 2.4);
        var tp = R.tokPos(p.id); R.confetti(tp.x, tp.y - 90); money(p.id, d.amt);
        return banner({ k: '靠岸！', big: p.name + ' 搶先抵達', amt: '+' + fmt(d.amt), bg: '#147A84', dur: 1600, human: true });
      }
      case 'interlude': return wait(100);
      case 'curse': {
        AU.sfx('curse'); R.emote(p.id, 'shock', 2);
        R.focusPlayer(p.id, R.closeZoom());
        var lv = G.curse.lv;
        return banner({ k: '藤壺精找上門', big: p.name + ' 被纏上了', sub: lv > 1 ? '而且是' + ['', '', '大藤壺', '藤壺王'][lv] + '！' : '經過別的玩家，就能把牠甩掉', art: '<img alt="" src="' + ART.barnImg(lv) + '">', bg: '#5B3A8C', dur: 1500, human: true });
      }
      case 'cursepass': {
        AU.sfx('pop'); R.emote(d.to.id, 'shock'); R.emote(d.from.id, 'happy');
        return banner({ k: d.how === 'card' ? '刮藤刀' : '甩鍋成功', big: d.from.name + ' → ' + d.to.name, sub: '藤壺精換了一個宿主', art: '<img alt="" src="' + ART.barnImg(G.curse.lv) + '">', bg: '#5B3A8C', dur: 1100, human: d.from.human || d.to.human });
      }
      case 'cursevo': {
        if (d.full) { toast('藤壺王吃飽了，縮回一隻小藤壺精'); return wait(300); }
        AU.sfx(d.lv === 3 ? 'king' : 'curse'); R.shake(d.lv === 3 ? 14 : 6); R.flash(0.3);
        return banner({ k: '藤壺精進化', big: d.lv === 3 ? '藤壺王降臨！' : '長成大藤壺了', sub: d.lv === 3 ? '牠會開始拆房子。快把牠甩掉！' : '吃得越來越兇', art: '<img alt="" src="' + ART.barnImg(d.lv) + '">', bg: d.lv === 3 ? '#3A1F5C' : '#5B3A8C', dur: 1600, human: true });
      }
      case 'curseact': return curseActFx(d);
      case 'curseoff': if (p) R.emote(p.id, 'happy'); return banner({ big: '刮藤節！', sub: '藤壺精被趕跑了', bg: '#147A84', dur: 1100 });
      case 'event': return eventFx(d);
      case 'gain': AU.sfx('coin'); money(p.id, d.amt); return banner({ k: d.why, big: p.name, amt: '+' + fmt(d.amt), bg: '#1B9168', dur: 900, human: H });
      case 'loss': AU.sfx('pay'); money(p.id, -d.amt); return banner({ k: d.why, big: p.name, amt: '−' + fmt(d.amt), bg: '#CF464C', dur: 900, human: H });
      case 'gala': AU.sfx('pay'); return banner({ k: '慈善晚宴', big: p.name + ' 被請上台', sub: '要付每個人 ' + fmt(d.amt), bg: '#8E6CF0', dur: 1100, human: true });
      case 'hike': AU.sfx('notify'); toast('「' + map.dists[d.d].name + '」過路費翻倍 3 輪'); return wait(400);
      case 'strike': toast('「' + map.dists[d.d].name + '」罷市 2 輪，過路費歸零'); return wait(400);
      case 'stocknews': AU.sfx('notify'); toast(d.all ? (d.up ? '所有股價上漲' : '所有股價下跌') : '「' + map.dists[d.d].name + '」股價' + (d.up ? '上漲' : '下跌')); return wait(300);
      case 'lightning': {
        AU.sfx('thunder');
        if (d.tid >= 0) { R.focusTile(d.tid, R.closeZoom() * 0.85); R.lightning(d.tid); R.burstTile(d.tid, 'dust', 16, '#fff'); return banner({ k: '雷擊', big: esc(dname(d.tid)) + ' 塌了一層', bg: '#55617D', dur: 1200 }); }
        R.flash(0.5); return banner({ k: '雷擊', big: '打在空地上，虛驚一場', bg: '#55617D', dur: 900 });
      }
      case 'quake': {
        AU.sfx('quake'); R.quake();
        if (!d.d) return banner({ k: '鯨震', big: '城晃了一下', bg: '#55617D', dur: 900 });
        return banner({ k: '鯨震', big: '「' + map.dists[d.d].name + '」的樓都塌了一層', bg: '#55617D', dur: 1400 });
      }
      case 'month': {
        var pm;
        if (d.season >= 0) {
          AU.sfx('season'); R.setSeason(d.season); AU.music(G.night ? 4 : d.season);
          pm = banner({ k: '第' + d.y + '年 ' + d.m + '月', big: WF.SEASONS[d.season].n + '・' + WF.SEASONS[d.season].sea, sub: '旺區：' + (map.seasonBoost[d.season] || []).map(function (x) { return map.dists[x].name; }).join('、') + '（過路費 ×1.5）', bg: SEASON_COL[d.season], dur: 1500, human: true });
        } else pm = wait(100);
        var beat = WF.storyBeat ? WF.storyBeat(G) : null;
        if (!beat) return pm;
        return Promise.resolve(pm).then(function () { closeSheet(true); return WF.SCR.scene(WF.STORY[beat], { bg: G.night ? 'night' : 'day' }); });
      }
      case 'yearend': return yearEndFx(d);
      case 'vitwarn': AU.sfx('whale'); R.flash(0.25); return banner({ k: '鯨息 ' + d.vit, big: '長歌痛苦地顫抖', sub: '樓蓋得越高，她就越虛弱', bg: '#8C2F3E', dur: 1600, human: true });
      case 'feed': AU.sfx('whale'); R.spout(); toast(esc(p.name) + ' 餵了長歌，鯨息 ' + d.vit); return wait(400);
      case 'settle': return wait(200);
      case 'bankrupt': {
        AU.sfx('lose'); R.emote(p.id, 'sad', 3); R.fade(p.id, 0);
        return banner({ k: '破產', big: p.name + ' 出局', sub: d.by ? '最後一擊來自 ' + d.by.name : '', bg: '#213052', dur: 1800, human: true });
      }
      case 'bark': {
        var lines = (WF.BARKS[p.char] || {})[d.key];
        if (!lines || !lines.length) return null;
        var line = lines[Math.floor(Math.random() * lines.length)];
        if (!line) return null;
        R.bubble(p.id, line);
        var emo = { buy: 'happy', up: 'happy', payS: 'normal', payB: 'sad', get: 'smug', cursed: 'shock', pass: 'happy', dest: 'happy', buyout: 'smug', victim: 'angry', broke: 'sad', win: 'happy', lose: 'sad', atk: 'smug', hit: 'angry' }[d.key];
        if (emo) R.emote(p.id, emo, 1.8);
        return wait(220);
      }
      case 'gameover': return gameOverFx(d);
    }
    return null;
  }
  function fxNowRun(name, d) {
    var p = d.p;
    switch (name) {
      case 'buy': AU.sfx('buy'); R.burstTile(d.tid, 'spark', 14, p.color); money(p.id, -d.price); UI.tip('buy'); break;
      case 'upgrade': AU.sfx('build'); R.pop(d.tid); R.burstTile(d.tid, 'spark', 14, '#FFD25E'); if (!d.free) money(p.id, -d.cost); else R.floatTile(d.tid, '免費加蓋', '#1B9168'); break;
      case 'mono': AU.sfx('fanfare'); var tp = R.tileTop(map.dists[d.d].lots[0], 60); R.confetti(tp.x, tp.y); banner({ k: '壟斷！', big: p.name + ' 拿下整區「' + map.dists[d.d].name + '」', sub: '這一區的過路費翻倍，還能蓋到第四層', bg: '#B8860B', dur: 1500, human: true }); break;
      case 'dividend': if (p.human) R.floatAt(p.id, '股利 +' + fmt(d.amt), '#147A84'); break;
      case 'stock': if (!p.human) toast(esc(p.name) + (d.n > 0 ? ' 買進' : ' 賣出') + '「' + map.dists[d.d].name + '」' + Math.abs(d.n) + ' 股', pimg(p)); break;
      case 'shopbuy': if (!p.human) toast(esc(p.name) + ' 在補給舖買了一張卡', pimg(p)); break;
      case 'income': money(p.id, d.amt); break;
      case 'sold': AU.sfx('pay'); R.floatTile(d.tid, '賣出 +' + fmt(d.amt), '#E04E55'); break;
      case 'feed': AU.sfx('whale'); R.spout(); if (!p.human) toast(esc(p.name) + ' 餵了長歌'); break;
      case 'bark': fxRun('bark', d); break;
    }
  }
  function tollFx(d) {
    var from = d.from, to = d.to, H = from.human || to.human;
    if (d.free) { toast(esc(from.name) + ' 停在 ' + esc(to.name) + ' 的地，這次免付'); return wait(300); }
    if (d.waived) {
      AU.sfx('pop');
      return banner({ k: d.waived === 'misteel' ? '霧鰻吞掉了帳單' : '免單券', big: from.name + ' 免付', sub: '原本要付 ' + fmt(d.amt), bg: '#147A84', dur: 1100, human: H });
    }
    var fp = R.tokPos(from.id), tp = R.tokPos(to.id);
    R.coins(fp, tp, Math.min(14, 4 + Math.floor(d.amt / 800)));
    money(from.id, -d.amt);
    setTimeout(function () { money(to.id, d.amt); AU.sfx('coin'); }, 600);
    if (d.big) { AU.sfx('ouch'); R.shake(10); vib(60); R.emote(from.id, 'shock', 2); R.emote(to.id, 'smug', 2); }
    else AU.sfx('pay');
    if (d.card) return wait(500);
    return banner({ k: '過路費', big: from.name + ' → ' + to.name, amt: '−' + fmt(d.amt), bg: d.big ? '#CF464C' : '#E0606A', dur: d.big ? 1500 : 1000, human: H });
  }
  function curseActFx(d) {
    var p = d.p, lvName = ['', '藤壺精', '大藤壺', '藤壺王'][d.lv];
    var txt = {
      nap: lvName + '在你背上打呼。',
      eat: lvName + '偷吃了 ' + fmt(d.amt) + '。',
      junk: lvName + '幫你買了沒用的紀念品，花掉 ' + fmt(d.amt) + '。',
      card: lvName + '把「' + (d.info.cid ? WF.CARDS[d.info.cid].n : '') + '」啃掉了。',
      fee: lvName + '跟你收了 ' + fmt(d.amt) + ' 的管理費。',
      wreck: lvName + '拆了 ' + ((d.info.tiles || []).length) + ' 層樓。',
      sell: lvName + '把「' + (d.info.tid != null ? dname(d.info.tid) : '') + '」半價賣掉了（+' + fmt(d.info.got || 0) + '）。',
      feast: '藤壺王辦了盛宴，要你付每個人 ' + fmt(d.amt) + '。'
    }[d.kind];
    if (d.kind === 'nap') { R.bubble(p.id, '……牠睡著了'); return wait(350); }
    AU.sfx(d.lv === 3 ? 'king' : 'curse'); R.emote(p.id, 'shock', 1.6);
    if (d.kind === 'wreck') { (d.info.tiles || []).forEach(function (t) { R.burstTile(t, 'dust', 14, '#fff'); }); R.shake(8); }
    if (d.amt && d.kind !== 'feast') money(p.id, -d.amt);
    return banner({ k: p.name + ' 身上的' + lvName, big: txt, art: '<img alt="" src="' + ART.barnImg(d.lv) + '">', bg: '#5B3A8C', dur: 1300, human: p.human });
  }
  function eventFx(d) {
    var ev = WF.EVENTS.find(function (x) { return x.id === d.ev; });
    AU.sfx('notify');
    var art = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 58V8" stroke="#26324F" stroke-width="4" stroke-linecap="round"/><path d="M16 10 L54 16 L54 30 L16 34 Z" fill="#FF6B6B" stroke="#26324F" stroke-width="3" stroke-linejoin="round"/><path d="M28 12 L28 32 M42 14 L42 31" stroke="#fff" stroke-width="5"/></svg>';
    return banner({ k: '風信', big: ev.n, sub: ev.desc, art: art, bg: '#2F4A7A', dur: 1500, human: d.p && d.p.human });
  }
  function handoff(p) {
    return new Promise(function (res) {
      var o = el('<div class="handoff" style="--c:' + p.color + '"><div><img alt="" src="' + ART.portrait(p.char, 'happy', 120) + '"><h3>輪到 ' + esc(p.name) + '</h3><button class="btn btn-sun btn-big">開始</button></div></div>');
      $('#app').appendChild(o);
      o.querySelector('.btn').onclick = function () { AU.init(); AU.sfx('tap'); o.remove(); res(); };
    });
  }
  function yearEndFx(d) {
    return gate().then(function () {
      return new Promise(function (res) {
        AU.sfx('fanfare');
        var rows = d.rows.slice().sort(function (a, b) { return b.amt - a.amt; });
        var body = '<div class="list">' + rows.map(function (r) {
          return '<div class="row"><div class="ic" style="border-radius:50%;background:' + r.p.color + '"><img alt="" src="' + pimg(r.p, 'happy') + '"></div><div class="mid"><div class="t1">' + esc(r.p.name) + '</div><div class="t2">地產年收益（地產總值 5%）</div></div><b class="num" style="color:var(--mint-edge);font-size:18px">+' + fmt(r.amt) + '</b></div>';
        }).join('') + '</div>';
        var hasHuman = humans().some(function (p) { return p.alive; });
        openSheet({ title: d.final ? '最終決算' : '第 ' + d.y + ' 年決算', sub: '每塊地都替地主賺了一年的收益。', body: body,
          foot: [{ label: '繼續', cls: 'btn-sun', onClick: function () { closeSheet(true); res(); } }] });
        rows.forEach(function (r) { money(r.p.id, r.amt); });
        if (!hasHuman) setTimeout(function () { if (sheetCur) { closeSheet(true); res(); } }, 2200 * SPD);
      });
    });
  }
  function gameOverFx(d) {
    setDeck('over');
    var w = G.players[G.result.winner];
    R.focusPlayer(w.id, R.closeZoom());
    R.emote(w.id, 'happy', 6);
    var tp = R.tokPos(w.id); R.confetti(tp.x, tp.y - 90);
    var me = mainHuman();
    AU.sfx(me && w === me ? 'win' : (me ? 'lose' : 'win'));
    return sleep(1600).then(function () { if (UI.onGameOver) UI.onGameOver(); });
  }

  /* 給引擎用的 IO */
  UI.io = function () {
    return {
      fx: UI.fx,
      fxNow: UI.fxNow,
      askHuman: UI.askHuman,
      aiDecided: function (p, kind, data, dec) {
        if (kind === 'path') { var path = data.opts[dec | 0]; if (path) R.focusTile(path[path.length - 1]); return wait(250); }
        if (kind === 'pre' && dec && dec.k === 'roll') return wait(200);
        if (kind === 'port' || kind === 'trade' || kind === 'shop') { UI.refresh(); return wait(350); }
        if (kind === 'buy' || kind === 'up' || kind === 'mark') return wait(260);
        return wait(120);
      },
      saved: function () { if (WF.saveGame) WF.saveGame(); return null; },
      onError: function (e) { console.error('engine', e); closeSheet(true); R.highlight(null); },
      ach: function (p, id) { if (WF.unlockAch) WF.unlockAch(id); },
      tip: function (id) { return UI.tip(id); },
      codex: function (type, id) { if (WF.codexSee) WF.codexSee(type, id); }
    };
  };
})();

/* ---- screens.js ---- */
/* ============================================================
   鯨落 WHALEFALL — 畫面：標題、故事、自由對戰、今日鯨歌、圖鑑、設定、結算、劇情
   ============================================================ */
(function () {
  var S = WF.SCR = {};
  var ART = WF.ART, AU = WF.AU, R = WF.R, UI = WF.UI;
  var el = function (h) { return UI.el(h); }, esc = function (s) { return UI.esc(s); }, fmt = function (n) { return UI.fmt(n); };
  function $(s, r) { return (r || document).querySelector(s); }
  function root() { return $('#screen'); }
  S.clear = function () { root().innerHTML = ''; };
  function screen(cls, html) { S.clear(); var s = el('<div class="screen ' + (cls || '') + '">' + html + '</div>'); root().appendChild(s); return s; }
  function head(title, back) {
    return '<div class="scr-head"><button class="ib" data-back aria-label="返回">' + ART.I.back + '</button><h2>' + title + '</h2></div>';
  }
  function bindBack(s, fn) { var b = s.querySelector('[data-back]'); if (b) b.onclick = function () { AU.sfx('close'); fn(); }; }
  function P() { return WF.PROFILE; }

  /* ---------- 標題 ---------- */
  var titleTimer = null;
  S.title = function () {
    WF.showDemo();
    var save = WF.loadSave();
    var s = screen('', '<div class="title">' +
      '<div class="logo"><div class="zh">鯨落</div><div class="en">WHALEFALL</div><div class="tag">在一頭游了三百年的巨鯨背上，買下整座城。</div></div>' +
      '<div class="menu">' +
      (save ? '<button class="btn btn-sun btn-big" data-a="resume"><span>繼續上一局</span><span class="r">' + esc(saveLabel(save)) + '</span></button>' : '') +
      '<button class="btn ' + (save ? '' : 'btn-sun ') + 'btn-big" data-a="story"><span>故事模式</span><span class="r">' + storyProgress() + '</span></button>' +
      '<button class="btn btn-big" data-a="free"><span>自由對戰</span><span class="r">可同機多人</span></button>' +
      '<button class="btn btn-big" data-a="daily"><span>今日鯨歌</span><span class="r">' + dailyLabel() + '</span></button>' +
      '<div class="menu-row"><button class="btn" data-a="codex">' + ART.I.book + '圖鑑</button><button class="btn" data-a="settings">' + ART.I.gear + '設定</button></div>' +
      '</div></div>');
    s.querySelectorAll('[data-a]').forEach(function (b) {
      b.onclick = function () {
        AU.init(); AU.sfx('tap');
        var a = b.dataset.a;
        if (a === 'resume') WF.resume();
        else if (a === 'story') S.story();
        else if (a === 'free') S.free();
        else if (a === 'daily') S.daily();
        else if (a === 'codex') S.codex('cards');
        else if (a === 'settings') S.settings();
      };
    });
    AU.music(0);
  };
  function saveLabel(sv) {
    var G = sv.G, m = ((G.startMonth - 1 + Math.floor((G.round - 1) / 3)) % 12) + 1;
    var what = G.mode === 'story' ? '第 ' + G.chapter + ' 章' : G.mode === 'daily' ? '今日鯨歌' : '自由對戰';
    return what + '・' + m + '月';
  }
  function storyProgress() {
    var n = Object.keys(P().story.cleared).length;

        '<span class="no">' + (done ? ART.I.check : ch.id) + '</span><div class="mid"><div class="t1">第 ' + ch.id + ' 章・' + ch.name + '</div><div class="t2">' + (unlocked ? esc(ch.goal) : '完成上一章後開啟') + '</div></div>' +

      '<p class="muted" style="text-align:center;margin:8px 0 0">鯨歌殘譜 ' + nf + ' / 6。每章都藏著一張，達成章節裡的額外條件就能拿到。' + (nf ? '點一下就能重讀。' : '') + '</p>' +
      (ends.length ? '<div class="ends">' + ends.sort().map(function (k) { return '<button class="btn btn-ghost" data-end="' + k + '">重看' + WF.ENDINGS[k].n + '</button>'; }).join('') + '</div>' : '') + '</div>' +
      list + '</div>');
    bindBack(s, S.title);
    s.querySelectorAll('.chap').forEach(function (b) { b.onclick = function () { AU.sfx('tap'); S.chapter(+b.dataset.c); }; });

  S.chapter = function (id) {

    var s = screen('dim', '<div class="wrap">' + head('第 ' + id + ' 章・' + ch.name) +
      '<div class="panel"><h4>目標</h4><p class="muted" style="color:var(--ink);font-size:15px;margin:0">' + esc(ch.goal) + '</p>' +
      '<p class="muted" style="margin:10px 0 0">' + NEWRULE[id] + '</p>' +
      '<p class="muted" style="margin:10px 0 0;display:flex;gap:8px;align-items:center"><span class="frag ' + (st.frags[id] ? 'on' : '') + '">' + ART.FRAG + '</span>鯨歌殘譜：' + esc(ch.frag.text) + (st.frags[id] ? '（已取得）' : '') + '</p>' +
      (st.cleared[id] || st.frags[id] ? '<div class="duo-row">' + (st.cleared[id] ? '<button class="btn" data-replay>重看這一章的劇情</button>' : '') + (st.frags[id] ? '<button class="btn" data-read>讀殘譜</button>' : '') + '</div>' : '') + '</div>' +

      playScenes(keys, bg).then(function () { return S.scene(WF.STORY['c' + id + '_out'], { bg: id === 6 ? 'night' : 'dusk' }); });
    };

      seq.then(function () { return S.scene(WF.STORY['c' + id + '_in'], { bg: id === 6 ? 'night' : 'day' }); }).then(function () { WF.startStory(id); });
    };
  };

  /* ---------- 劇情播放 ---------- */
  S.scene = function (lines, opt) {
    opt = opt || {};
    if (!lines || !lines.length) return Promise.resolve();
    return new Promise(function (res) {
      var sc = el('<div class="scene"><div class="tint"></div><button class="btn btn-ghost skip">略過</button><div class="who l"><img alt=""></div><div class="who r"><img alt=""></div><div class="box"><span class="nm"></span><div class="tx"></div><span class="more"></span></div></div>');
      $('#app').appendChild(sc); sceneOn();
      var stopBg = sceneBg(sc.querySelector('.tint'), opt.bg || 'day');
      var i = -1, typing = null, full = '';
      var L = sc.querySelector('.who.l'), Rt = sc.querySelector('.who.r');
      var left = null, right = null;
      function next() {
        if (typing) { clearInterval(typing); typing = null; sc.querySelector('.tx').textContent = full; return; }
        i++;
        if (i >= lines.length) { end(); return; }
        var ln = lines[i], box = sc.querySelector('.box');
        var who = ln.s;
        box.classList.toggle('nar', who === 'nar');
        var nm = sc.querySelector('.nm');
        if (who === 'nar') { nm.hidden = true; }
        else {
          nm.hidden = false;
          var C = who === 'father' ? { name: '魏長川', color: '#6B7A99' } : WF.CHARS[who];
          nm.textContent = C.name; box.style.setProperty('--c', C.color);
          if (who !== 'father') {
            var side = who === 'wei' ? 'l' : 'r';
            if (side === 'l') { left = who; L.querySelector('img').src = ART.stand(who, ln.e || 'normal'); }
            else { right = who; Rt.querySelector('img').src = ART.stand(who, ln.e || 'normal'); }
          }
        }
        L.hidden = !left; Rt.hidden = !right;
        L.classList.toggle('dim', who !== left); Rt.classList.toggle('dim', who !== right);
        full = ln.t;
        var tx = sc.querySelector('.tx'); tx.textContent = '';
        var k = 0;
        AU.sfx('tap');
        typing = setInterval(function () { k++; tx.textContent = full.slice(0, k); if (k >= full.length) { clearInterval(typing); typing = null; } }, 26);
      }
      function end() { if (typing) clearInterval(typing); stopBg(); sc.remove(); sceneOff(); res(); }
      sc.onclick = function (e) { if (e.target.closest('.skip')) return; next(); };
      sc.querySelector('.skip').onclick = function (e) { e.stopPropagation(); AU.sfx('close'); end(); };
      next();
    });
  };
  // 劇情播放時，把選單與對局介面藏起來，只留下背後的城
  function sceneOn() { $('#app').classList.add('scening'); }
  function sceneOff() { if (!document.querySelector('#app > .scene')) $('#app').classList.remove('scening'); }
  function sceneBg(tint, kind) {
    var tints = {
      day: 'linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0))',
      dawn: 'linear-gradient(180deg, rgba(255,170,140,.28), rgba(255,220,190,.05))',
      dusk: 'linear-gradient(180deg, rgba(90,60,140,.32), rgba(240,150,120,.18))',
      night: 'linear-gradient(180deg, rgba(8,14,40,.35), rgba(40,40,90,.15))',
      ground: 'linear-gradient(180deg, rgba(255,236,190,.35), rgba(120,190,110,.35))',
      spring: 'linear-gradient(180deg, rgba(255,190,215,.30), rgba(255,255,255,.05))'
    };
    if (tint) tint.style.background = tints[kind] || tints.day;
    var prev = R.getNight();
    if (kind === 'night') R.setNight(1);
    return function () { R.setNight(prev); };
  }

  /* ---------- 自由對戰 ---------- */
  var FREE = null;
  S.free = function () {
    var pf = P();
    if (!FREE) {
      var pool = WF.CHAR_ORDER.filter(function (c) { return c !== 'wei'; }).sort(function () { return Math.random() - 0.5; });
      FREE = { map: 'changge', months: 12, me: 'wei', seats: [{ c: pool[0], ai: 'normal', human: false }, { c: pool[1], ai: 'normal', human: false }, { c: pool[2], ai: 'normal', human: false }], preset: 'std', rules: { dest: true, curse: true, comps: true, stocks: true, marks: true, buyout: true }, target: 0 };
    }
    var F = FREE;
    function render() {
      var me = WF.CHARS[F.me];
      var html = '<div class="wrap">' + head('自由對戰') +
        '<div class="panel"><h4>地圖</h4><div class="pills" data-g="map">' +
        pillsHtml([['changge', '長歌號（大）'], ['xiaoni', '小霓號（小）']], F.map) + '</div>' +
        '<h4 style="margin-top:14px">時長</h4><div class="pills" data-g="months">' + pillsHtml([[6, '半年'], [12, '一年'], [24, '兩年']], F.months) + '</div></div>' +
        '<div class="panel"><h4>你的角色</h4><div class="charpick">' + WF.CHAR_ORDER.map(function (c) {
          var C = WF.CHARS[c], ok = pf.unlocked[c];
          return '<button data-me="' + c + '" class="' + (F.me === c ? 'on ' : '') + (ok ? '' : 'lock') + '" style="--c:' + C.color + '"><img alt="" src="' + ART.portrait(ok ? c : c, 'normal', 64) + '"><b>' + (ok ? C.name : '？？？') + '</b><span>' + (ok ? C.skill.name : '故事模式解鎖') + '</span></button>';
        }).join('') + '</div><p class="muted" style="margin:10px 0 0">' + me.skill.name + '：' + me.skill.desc + '</p></div>' +
        '<div class="panel"><h4>對手（可改成同一支手機輪流玩）</h4><div class="seats">' + F.seats.map(function (st, i) {
          var C = st.c ? WF.CHARS[st.c] : null;
          return '<div class="seat" style="--c:' + (C ? C.color : '#ccc') + '"><div class="pt" data-cyc="' + i + '">' + (C ? '<img alt="" src="' + ART.portrait(st.c, 'normal', 64) + '">' : '') + '</div>' +
            '<div class="mid"><div class="t1">' + (C ? C.name : '空位') + '</div><div class="t2">' + (C ? (st.human ? '玩家操作' : C.skill.name) : '點頭像加入對手') + '</div></div>' +
            (C ? '<select data-ai="' + i + '" aria-label="操作方式"><option value="easy"' + (!st.human && st.ai === 'easy' ? ' selected' : '') + '>電腦・簡單</option><option value="normal"' + (!st.human && st.ai === 'normal' ? ' selected' : '') + '>電腦・普通</option><option value="hard"' + (!st.human && st.ai === 'hard' ? ' selected' : '') + '>電腦・困難</option><option value="human"' + (st.human ? ' selected' : '') + '>玩家</option><option value="none">移除</option></select>' : '') + '</div>';
        }).join('') + '</div><p class="muted" style="margin:8px 0 0">點頭像換角色。</p></div>' +
        '<div class="panel"><h4>規則</h4><div class="pills" data-g="preset">' + pillsHtml([['std', '完整'], ['easy', '簡單'], ['custom', '自訂']], F.preset) + '</div>' +
        (F.preset === 'custom' ? '<div style="margin-top:8px">' + [['dest', '鯨歌目的地', '搶目的地拿賞金'], ['curse', '藤壺精', '最慢的人被纏上'], ['comps', '伴靈', '鯨歌台召來好運'], ['stocks', '股票', '分別人的過路費'], ['marks', '地標', '四種特殊建築'], ['buyout', '強制收購', '兩倍價搶地']].map(function (r) {
          return '<div class="opt"><div class="lb"><b>' + r[1] + '</b><span>' + r[2] + '</span></div><button class="tgl ' + (F.rules[r[0]] ? 'on' : '') + '" data-rule="' + r[0] + '" aria-label="' + r[1] + '"></button></div>';
        }).join('') + '</div>' : '<p class="muted" style="margin:8px 0 0">' + (F.preset === 'std' ? '所有玩法全開。' : '關掉股票和強制收購，適合第一次玩。') + '</p>') +
        '<h4 style="margin-top:14px">提前獲勝</h4><div class="pills" data-g="target">' + pillsHtml([[0, '不用'], [120000, '總資產 12 萬'], [200000, '總資產 20 萬']], F.target) + '</div>' +
        '<p class="muted" style="margin:6px 0 0">達到目標後回到渡口就直接獲勝。</p></div>' +
        '<button class="btn btn-sun btn-big" data-go>開始</button></div>';
      var s = screen('dim', html);
      bindBack(s, S.title);
      s.querySelectorAll('.pills').forEach(function (g) {
        g.querySelectorAll('.pill').forEach(function (b) {
          b.onclick = function () {
            AU.sfx('tap'); var k = g.dataset.g, v = b.dataset.v;
            if (k === 'map') F.map = v; else if (k === 'months') F.months = +v; else if (k === 'target') F.target = +v;
            else if (k === 'preset') { F.preset = v; if (v === 'std') F.rules = { dest: true, curse: true, comps: true, stocks: true, marks: true, buyout: true }; if (v === 'easy') F.rules = { dest: true, curse: true, comps: true, stocks: false, marks: true, buyout: false }; }
            render();
          };
        });
      });
      s.querySelectorAll('[data-me]').forEach(function (b) { b.onclick = function () { AU.sfx('tap'); F.me = b.dataset.me; F.seats.forEach(function (st) { if (st.c === F.me) st.c = nextChar(null); }); render(); }; });
      s.querySelectorAll('[data-cyc]').forEach(function (b) { b.onclick = function () { AU.sfx('tap'); var i = +b.dataset.cyc; F.seats[i].c = nextChar(F.seats[i].c); render(); }; });
      s.querySelectorAll('[data-ai]').forEach(function (sel) {
        sel.onchange = function () {
          var i = +sel.dataset.ai, v = sel.value;

    var W = cv.clientWidth || 320, H = cv.clientHeight || 170, D = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * D; cv.height = H * D;
    var c = cv.getContext('2d'); c.scale(D, D);
    var hist = G.hist; if (hist.length < 2) return;
    var max = 1; hist.forEach(function (h) { h.nw.forEach(function (v) { max = Math.max(max, v); }); });

    c.strokeStyle = '#DCE7F3'; c.lineWidth = 1; c.fillStyle = '#8A94AB'; c.font = '11px ' + R.FONT_N; c.textAlign = 'right';
    for (var i = 0; i <= 4; i++) {
      var y = padT + (H - padT - padB) * (1 - i / 4);
      c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y); c.stroke();
      c.fillText(Math.round(max * i / 4 / 1000) + 'k', padL - 6, y + 4);
    }
    G.players.forEach(function (p, pi) {
      c.strokeStyle = p.color; c.lineWidth = p.human ? 3.2 : 2; c.lineJoin = 'round';
      c.beginPath();
      hist.forEach(function (h, k) {
        var x = padL + (W - padL - padR) * k / (hist.length - 1), y = padT + (H - padT - padB) * (1 - h.nw[pi] / max);
        if (!k) c.moveTo(x, y); else c.lineTo(x, y);

      c.stroke();
      var last = hist[hist.length - 1].nw[pi], lx = W - padR, ly = padT + (H - padT - padB) * (1 - last / max);
      c.fillStyle = p.color; c.beginPath(); c.arc(lx - 2, ly, 4, 0, Math.PI * 2); c.fill();
    });
    c.fillStyle = '#8A94AB'; c.textAlign = 'left'; c.fillText('開局', padL, H - 3); c.textAlign = 'right'; c.fillText('結束', W - padR, H - 3);
  }

      story: { cleared: {}, frags: {}, endings: {}, seenPrologue: false },
      codex: { cards: {}, comps: {}, chars: { wei: 1 } }, ach: {},

    return p;
  }
  WF.loadProfile = function () {

  };

      var s = String(code || '').replace(/\s+/g, ''), at = s.indexOf('WHALE1-');

      var p = JSON.parse(decodeURIComponent(escape(atob(s.slice(at + 7)))));

      WF.PROFILE = normalize(p); WF.saveProfile(); WF.applySettings();

  };
  WF.saveProfile = function () { store(KEY_P, JSON.stringify(WF.PROFILE)); };

  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

      mapId: ch.map, months: ch.months, startMonth: ch.startMonth || 1, mode: 'story', chapter: id, night: !!ch.night, rules: ch.rules,
      seats: [{ char: 'wei', human: true }].concat(ch.rivals.map(function (c) { return { char: c, ai: ch.diff }; }))
    });
    play(G, { mode: 'story', chapter: id });
  };
  WF.startFree = function (o) {
    var G = WF.newGame({ mapId: o.mapId, months: o.months, seats: o.seats, rules: o.rules, mode: 'free' });
    play(G, { mode: 'free', opts: o });
  };
  WF.startDaily = function (cfg) {
    var G = WF.newGame({
      mapId: 'changge', months: 6, seed: cfg.seed, mode: 'daily', daily: cfg.date,
      rules: { mods: cfg.mods.map(function (m) { return m.id; }) },
      seats: [{ char: 'wei', human: true }].concat(cfg.rivals.map(function (c) { return { char: c, ai: 'normal' }; }))
    });
    play(G, { mode: 'daily', date: cfg.date });
  };
  WF.resume = function () {
    var sv = WF.loadSave(); if (!sv) { S.title(); return; }
    play(sv.G, sv.ctx || { mode: sv.G.mode, chapter: sv.G.chapter });
  };

  /* ---------- 結算 ---------- */
  function gameOver(E, ctx) {
    var G = E.G, P = WF.PROFILE;
    clearSave();
    var me = G.players.find(function (p) { return p.human; });
    var winner = G.players[G.result.winner];
    P.stats.games++;
    if (me && winner.human) P.stats.wins++;
    if (me) P.stats.best = Math.max(P.stats.best || 0, E.nw(me));
    WF.saveProfile();
    setTimeout(function () {
      var info = { G: G, E: E, buttons: [] };
      if (ctx.mode === 'story') storyResult(E, ctx, info, me);
      else if (ctx.mode === 'daily') dailyResult(E, ctx, info, me);
      else freeResult(E, ctx, info, me, winner);
    }, 300);
  }
  function finishView() { UI.stop(); CUR = null; }
  function freeResult(E, ctx, info, me, winner) {
    var humansN = E.G.players.filter(function (p) { return p.human; }).length;
    info.title = humansN > 1 ? winner.name + ' 獲勝' : (winner.human ? '你贏了！' : winner.name + ' 獲勝');
    info.sub = E.G.result.early ? '提前達成目標' : '時間到，總資產最高的人獲勝';
    finishView();
    info.buttons = [
      { label: '再來一局', cls: 'btn-sun', onClick: function () { WF.startFree(ctx.opts); } },
      { label: '回主選單', onClick: function () { S.title(); } }
    ];
    S.results(info);
  }
  function dailyResult(E, ctx, info, me) {
    var P = WF.PROFILE, d = P.daily, score = me && me.alive ? E.nw(me) : 0;
    var prev = d.best[ctx.date];
    d.best[ctx.date] = Math.max(prev || 0, score);
    if (d.last !== ctx.date) {
      var y = new Date(Date.now() - 86400000), ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
      d.streak = d.last === ys ? (d.streak || 0) + 1 : 1;
      d.last = ctx.date;
    }
    WF.saveProfile();
    if (d.streak >= 3) WF.unlockAch('daily3');
    var rank = E.rankOf(me);
    info.title = '今日成績 ' + UI.fmt(score);
    info.sub = '第 ' + rank + ' 名・今日最佳 ' + UI.fmt(d.best[ctx.date]) + (prev == null || score > prev ? '（新紀錄）' : '') + '・連續 ' + d.streak + ' 天';
    finishView();
    info.buttons = [
      { label: '再挑戰一次', cls: 'btn-sun', onClick: function () { WF.startDaily(WF.dailyConfig()); } },
      { label: '回主選單', onClick: function () { S.title(); } }
    ];
    S.results(info);
  }
  function storyResult(E, ctx, info, me) {
    var P = WF.PROFILE, ch = WF.CHAPTERS[ctx.chapter - 1];
    var win = me && WF.storyWin(E, ch, me);
    var gotFrag = false;
    if (win) {
      var first = !P.story.cleared[ch.id];
      P.story.cleared[ch.id] = 1;
      ch.rivals.forEach(function (c) { if (c !== 'lan' || ch.id === 6) P.unlocked[c] = 1; });
      if (E.fragOk(ch.frag.cond, me) && !P.story.frags[ch.id]) { P.story.frags[ch.id] = 1; gotFrag = true; }
      WF.saveProfile();
    }
    if (gotFrag) {
      info.top = '<div class="panel"><h4>取得〈鯨歌殘譜・' + '一二三四五六'[ch.id - 1] + '〉</h4>' + S.fragHtml(ch.id - 1) + '</div>';
    } else {
      info.extra = '<div class="panel" style="display:flex;gap:10px;align-items:center"><span class="frag ' + (P.story.frags[ch.id] ? 'on' : '') + '" style="width:30px;height:30px">' + ART.FRAG + '</span><div class="muted" style="color:var(--ink)">' +
        (P.story.frags[ch.id] ? '這一章的殘譜已經拿到了，可以在故事模式裡重讀。' : '殘譜條件：' + ch.frag.text + '。這次沒拿到。') + '</div></div>';
    }
    info.title = win ? '第 ' + ch.id + ' 章・' + ch.name + '　完成' : '落敗';
    info.sub = win ? ch.goal : WF.STORY.lose;
    finishView();
    if (win) {
      info.buttons = [{ label: '繼續劇情', cls: 'btn-sun', onClick: function () { afterStory(ch, E); } }];
    } else {
      info.buttons = [
        { label: '再試一次', cls: 'btn-sun', onClick: function () { WF.startStory(ch.id); } },
        { label: '回章節', onClick: function () { S.story(); } }
      ];
    }
    S.results(info);
  }
  function afterStory(ch, E) {
    var P = WF.PROFILE;
    S.scene(WF.STORY['c' + ch.id + '_out'], { bg: ch.id === 6 ? 'night' : 'dusk' }).then(function () {
      if (ch.id < 6) { S.story(); return; }
      var canC = WF.CHAPTERS.every(function (c) { return P.story.frags[c.id]; });
      S.endingChoice(canC).then(function (k) {
        P.story.endings[k] = 1; WF.saveProfile();
        WF.unlockAch(WF.ENDINGS[k].ach); WF.unlockAch('story');
        P.unlocked.lan = 1; WF.saveProfile();
        return S.scene(WF.STORY['end_' + k], { bg: k === 'a' ? 'night' : k === 'b' ? 'ground' : 'spring' }).then(function () { return S.endingCard(k); });
      }).then(function () { S.story(); });
    });
  }

  /* ---------- 啟動 ---------- */
  function boot(data) {
    WF.PROFILE = WF.loadProfile();
    R.init(document.getElementById('board'));
    WF.applySettings();
    // 第一次碰觸就開啟聲音（必須在使用者手勢裡同步建立）
    var unlock = function () { AU.init(); WF.applySettings(); document.removeEventListener('pointerdown', unlock, true); };
    document.addEventListener('pointerdown', unlock, true);
    if (data && data.save && data.save.G && !WF.loadSave()) store(KEY_S, JSON.stringify(data.save));
    S.title();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { UI.refresh && UI.refresh(); });
    try {
      if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
        window.claude.hot.snapshot(function () { return CUR && CUR.E && !CUR.E.G.over ? { save: { G: CUR.E.G, ctx: CUR.ctx } } : {}; });
      }
    } catch (e) {}
    document.addEventListener('visibilitychange', function () { if (document.hidden) WF.saveGame(); });
    window.addEventListener('pagehide', function () { WF.saveGame(); });
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();

</script>
