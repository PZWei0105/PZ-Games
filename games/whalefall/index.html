<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>鯨落 WHALEFALL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：全螢幕棋盤畫布在下，頂部「船票」狀態列＋玩家籌碼列，底部拇指區操作台；決定一律用由下滑出的面板 */
:root {
  --ink: #213052;
  --ink-2: #55617D;
  --ink-3: #8A94AB;
  --paper: #FFFFFF;
  --paper-2: #EEF4FB;
  --paper-3: #DCE7F3;
  --sky: #CFE8FF;
  --sky-deep: #8FC3EE;
  --sun: #FFC83D;
  --sun-edge: #D99412;
  --coral: #FF6B6B;
  --coral-edge: #CF464C;
  --mint: #2DBE88;
  --mint-edge: #1B9168;
  --song: #42C9C0;
  --song-deep: #147A84;
  --violet: #8E6CF0;
  --gold: #F2B640;
  --veil: rgba(22, 32, 58, .46);
  --shadow: 0 10px 28px rgba(28, 42, 78, .22);
  --shadow-s: 0 3px 10px rgba(28, 42, 78, .16);
  --f-display: "Huninn", "jf-openhuninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Fredoka", "Huninn", "PingFang TC", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --r-sheet: 26px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #BFDFFB; color: var(--ink); font-family: var(--f-body);
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; overflow: hidden; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
[hidden] { display: none !important; }

/* ---------- 按鈕 ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer; border-radius: 16px; padding: 12px 16px; min-height: 50px;
  font-family: var(--f-display); font-size: 17px; line-height: 1.15; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; background: var(--paper); color: var(--ink);
  box-shadow: 0 4px 0 var(--paper-3), var(--shadow-s); transform: translateY(0); transition: transform .08s, box-shadow .08s, filter .15s;
  position: relative; text-align: center;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--paper-3), var(--shadow-s); }
.btn:focus-visible { outline: 3px solid var(--song); outline-offset: 2px; }
.btn[disabled] { filter: grayscale(.9) opacity(.55); pointer-events: none; }
.btn-sun { background: var(--sun); box-shadow: 0 4px 0 var(--sun-edge), var(--shadow-s); }
.btn-sun:active { box-shadow: 0 1px 0 var(--sun-edge), var(--shadow-s); }
.btn-coral { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-edge), var(--shadow-s); }
.btn-coral:active { box-shadow: 0 1px 0 var(--coral-edge), var(--shadow-s); }
.btn-mint { background: var(--mint); color: #fff; box-shadow: 0 4px 0 var(--mint-edge), var(--shadow-s); }
.btn-mint:active { box-shadow: 0 1px 0 var(--mint-edge), var(--shadow-s); }
.btn-song { background: var(--song); color: #fff; box-shadow: 0 4px 0 var(--song-deep), var(--shadow-s); }
.btn-song:active { box-shadow: 0 1px 0 var(--song-deep), var(--shadow-s); }
.btn-ghost { background: rgba(255,255,255,.7); box-shadow: 0 3px 0 rgba(33,48,82,.12); }
.btn > svg, .btn .ico svg { width: 22px; height: 22px; flex: none; }
.btn small { font-family: var(--f-body); font-size: 12px; opacity: .78; display: block; margin-top: 2px; }
.btn .stack { display: flex; flex-direction: column; align-items: center; }
.btn-big { min-height: 62px; font-size: 19px; border-radius: 18px; }
.ib {
  appearance: none; border: 0; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
  background: rgba(255,255,255,.88); box-shadow: 0 3px 0 rgba(33,48,82,.14); cursor: pointer; color: var(--ink); flex: none;
}
.ib:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(33,48,82,.14); }
.ib svg { width: 22px; height: 22px; }
.ib .tag { font-family: var(--f-num); font-weight: 600; font-size: 14px; }

/* ---------- 頂部 HUD ---------- */
#hud { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) 0 var(--gutter-l); display: flex; flex-direction: column; gap: 6px; }
#hud > * { pointer-events: auto; }
.topbar { display: flex; align-items: center; gap: 8px; }
.ticket {
  flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: rgba(255,255,255,.92); border-radius: 14px; box-shadow: 0 3px 0 rgba(33,48,82,.12);
  position: relative; overflow: hidden;
}
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: rgba(191,223,251,.9); }
.ticket::before { left: -6px; } .ticket::after { right: -6px; }
.ticket b { font-family: var(--f-display); font-size: 16px; white-space: nowrap; }
.ticket .xun { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.ticket .left { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-family: var(--f-num); }
.ticket .season { margin-left: auto; font-family: var(--f-display); font-size: 13px; padding: 3px 9px; border-radius: 999px; color: #fff; white-space: nowrap; }
.vitbar { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.9); font-size: 12px; font-family: var(--f-display); align-self: flex-start; box-shadow: 0 2px 0 rgba(33,48,82,.12); }
.vitbar .track { width: 110px; height: 8px; border-radius: 6px; background: var(--paper-3); overflow: hidden; }
.vitbar .fill { height: 100%; background: linear-gradient(90deg, #ff7a7a, #42c9c0); border-radius: 6px; transition: width .5s; }

.destbar {
  display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 12px 4px 6px; border-radius: 999px;
  background: linear-gradient(90deg, #153D5C, #1E6A80); color: #EFFFFD; align-self: flex-start; max-width: 100%;
  box-shadow: 0 3px 0 rgba(10,30,50,.25); cursor: pointer; font-size: 13px;
}
.destbar .ico { width: 26px; height: 26px; border-radius: 50%; background: var(--song); display: grid; place-items: center; flex: none; }
.destbar .ico svg { width: 18px; height: 18px; }
.destbar b { font-family: var(--f-display); font-weight: 400; font-size: 14px; white-space: nowrap; }
.destbar .rw { font-family: var(--f-num); font-weight: 600; color: #FFE08A; white-space: nowrap; }
.destbar .dd { opacity: .8; white-space: nowrap; }
.destbar.wait { background: rgba(255,255,255,.85); color: var(--ink-2); }
.destbar.wait .ico { background: var(--paper-3); }

.chips { display: flex; gap: 5px; }
.chip {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 5px; border-radius: 16px;
  background: rgba(255,255,255,.9); box-shadow: 0 3px 0 rgba(33,48,82,.12); position: relative; cursor: pointer;
  transition: transform .2s, box-shadow .2s, background .2s; border: 2px solid transparent;
}
.chip.on { background: #fff; transform: translateY(2px); box-shadow: 0 0 0 3px var(--c), 0 6px 14px rgba(33,48,82,.22); }
.chip.dead { opacity: .45; filter: grayscale(1); }
.chip .pt { width: 32px; height: 32px; border-radius: 50%; flex: none; background: var(--c); position: relative; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
.chip .pt img { width: 100%; height: 100%; display: block; }
.chip .tx { min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
.chip .nm { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .cs { font-family: var(--f-num); font-weight: 600; font-size: 15px; white-space: nowrap; }
.chip .cs.neg { color: var(--coral-edge); }
.chip .rk { position: absolute; top: -6px; left: -4px; min-width: 18px; height: 18px; border-radius: 9px; font-family: var(--f-num); font-weight: 700; font-size: 11px; display: grid; place-items: center; background: var(--ink); color: #fff; padding: 0 4px; }
.chip .rk.r1 { background: var(--gold); color: var(--ink); }
.chip .badges { position: absolute; right: 2px; top: -8px; display: flex; gap: 2px; }
.chip .badges i { width: 20px; height: 20px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: var(--shadow-s); font-style: normal; }
.chip .badges i img { width: 18px; height: 18px; }
.chip .you { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 10px; font-family: var(--f-display); background: var(--ink); color: #fff; padding: 0 6px; border-radius: 8px; white-space: nowrap; }

/* ---------- 底部操作台 ---------- */
#deck {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; pointer-events: none;
  padding: 0 var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gutter-l);
}
.deck-in { pointer-events: auto; max-width: 560px; margin: 0 auto; background: rgba(255,255,255,.95); border-radius: 24px; padding: 10px 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 9px; }
.deck-msg { display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 0 4px; font-size: 14px; }
.deck-msg .pt { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: var(--c, var(--paper-3)); flex: none; }
.deck-msg .pt img { width: 100%; height: 100%; }
.deck-msg b { font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.deck-msg .sub { color: var(--ink-2); font-size: 12px; margin-left: auto; white-space: nowrap; }
.deck-row { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
.deck-row.tools { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tool { appearance: none; border: 0; background: var(--paper-2); border-radius: 14px; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--f-display); font-size: 14px; cursor: pointer; color: var(--ink); position: relative; }
.tool:active { background: var(--paper-3); }
.tool svg { width: 20px; height: 20px; }
.tool .ct { position: absolute; top: 3px; right: 6px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--coral); color: #fff; font-family: var(--f-num); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; }
.tool[disabled] { opacity: .45; pointer-events: none; }
.dice-btn .pips { display: flex; gap: 4px; }
.dice-btn .pip { width: 22px; height: 22px; border-radius: 6px; background: #fff; box-shadow: inset 0 -2px 0 rgba(33,48,82,.15); display: grid; place-items: center; }
.dice-btn .pip::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.thinking { display: flex; align-items: center; gap: 6px; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: bob 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }

/* ---------- 面板（由下滑出） ---------- */
.veil { position: absolute; inset: 0; background: var(--veil); z-index: 41; opacity: 0; transition: opacity .2s; }
.veil.on { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 42; max-height: min(82vh, 760px); display: flex; flex-direction: column;
  background: var(--paper); border-radius: var(--r-sheet) var(--r-sheet) 0 0; box-shadow: 0 -10px 40px rgba(20,30,60,.3);
  transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.25,1.05); max-width: 620px; margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.on { transform: translateY(0); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--paper-3); margin: 8px auto 2px; flex: none; }
.sh-head { padding: 6px 18px 4px; display: flex; align-items: flex-start; gap: 12px; flex: none; }
.sh-head h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 21px; line-height: 1.25; text-wrap: balance; }
.sh-head p { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.sh-head .x { margin-left: auto; }
.sh-body { padding: 8px 18px 6px; overflow: auto; flex: 1 1 auto; -webkit-overflow-scrolling: touch; user-select: text; }
.sh-foot { padding: 10px 16px 14px; display: grid; gap: 10px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); flex: none; }
.sh-foot.one { grid-template-columns: 1fr; }

.tilecard { display: flex; gap: 12px; align-items: stretch; padding: 12px; border-radius: 18px; background: var(--paper-2); }
.tilecard .sw { width: 10px; border-radius: 6px; background: var(--dc, var(--paper-3)); flex: none; }
.tilecard .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tilecard .dn { font-size: 12px; color: var(--ink-2); }
.tilecard .tn { font-family: var(--f-display); font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-top: 6px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-num); font-weight: 600; font-size: 14px; }
.dots { display: flex; gap: 5px; align-items: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--paper-3); }
.lvbar { display: flex; gap: 4px; }
.lvbar i { flex: 1; height: 8px; border-radius: 4px; background: var(--paper-3); }
.lvbar i.on { background: var(--c, var(--sun)); }
.delta { display: flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 22px; margin: 6px 0 2px; }
.delta .ar { color: var(--ink-3); font-size: 18px; }
.delta .up { color: var(--mint-edge); }
.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; margin: 8px 2px 2px; }
.warn { color: var(--coral-edge); }

.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 16px; background: var(--paper-2);
  min-height: 56px;
}
.row .sw { width: 8px; align-self: stretch; border-radius: 5px; background: var(--dc, var(--paper-3)); flex: none; }
.row .mid { flex: 1; min-width: 0; }
.row .t1 { font-family: var(--f-display); font-size: 15.5px; line-height: 1.25; }
.row .t2 { font-size: 12px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }
.row .btn { min-height: 42px; padding: 8px 12px; font-size: 15px; border-radius: 13px; flex: none; }
.row.pick { cursor: pointer; }
.row.pick:active { background: var(--paper-3); }
.row .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #fff; flex: none; overflow: hidden; }
.row .ic img, .row .ic svg { width: 36px; height: 36px; }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: 14px; background: var(--paper-2); margin-bottom: 10px; }
.seg button { flex: 1; appearance: none; border: 0; background: transparent; border-radius: 11px; min-height: 38px; font-family: var(--f-display); font-size: 15px; cursor: pointer; color: var(--ink-2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-s); }
.sec-t { font-family: var(--f-display); font-size: 15px; color: var(--ink-2); margin: 12px 2px 8px; display: flex; align-items: center; gap: 8px; }
.sec-t .r { margin-left: auto; font-family: var(--f-num); font-size: 14px; color: var(--ink); }

/* 卡片 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.card {
  position: relative; border-radius: 18px; padding: 10px 10px 12px; background: #fff; box-shadow: inset 0 0 0 3px var(--rc), var(--shadow-s);
  display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; border: 0; font: inherit; color: inherit; min-width: 0;
}
.card .art { height: 74px; border-radius: 12px; background: linear-gradient(160deg, var(--rc2), #fff); display: grid; place-items: center; }
.card .art svg, .card .art img { width: 64px; height: 64px; }
.card .cn { font-family: var(--f-display); font-size: 16px; }
.card .cd { font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.card .cp { font-family: var(--f-num); font-weight: 600; font-size: 14px; }
.card.off { opacity: .45; }
.card.lock { filter: grayscale(1); opacity: .5; }
.card.sel { box-shadow: inset 0 0 0 3px var(--rc), 0 0 0 3px var(--ink), var(--shadow-s); }
.r1c { --rc: #8FD3CF; --rc2: #DDF5F3; } .r2c { --rc: #8DB6F2; --rc2: #E1ECFC; } .r3c { --rc: #B49BF5; --rc2: #EEE7FE; } .r4c { --rc: #F2C04A; --rc2: #FFF2CF; }
.numgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.numgrid button { appearance: none; border: 0; border-radius: 14px; background: var(--paper-2); min-height: 62px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
.numgrid button b { font-family: var(--f-num); font-size: 22px; font-weight: 600; }
.numgrid button span { font-size: 10.5px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.numgrid button.hot { background: #E3FAF7; box-shadow: inset 0 0 0 2px var(--song); }
.numgrid button.bad { background: #FFECEC; }

/* ---------- 特效層 ---------- */
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.banner {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; text-align: center;
  transition: transform .32s cubic-bezier(.2,1.6,.4,1), opacity .2s; width: min(88vw, 460px);
}
.banner.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.banner.out { transform: translate(-50%, -60%) scale(.95); opacity: 0; transition: transform .3s, opacity .3s; }
.banner .rib {
  display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 26px 14px; border-radius: 22px;
  background: var(--bg, var(--ink)); color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.15), 0 16px 34px rgba(20,30,60,.3);
}
.banner .k { font-family: var(--f-display); font-size: 15px; opacity: .9; }
.banner .big { font-family: var(--f-display); font-size: 30px; line-height: 1.15; text-wrap: balance; }
.banner .amt { font-family: var(--f-num); font-weight: 700; font-size: 34px; }
.banner .sub { font-size: 13px; opacity: .9; margin-top: 2px; line-height: 1.4; max-width: 340px; }
.banner .art { width: 72px; height: 72px; margin-bottom: 4px; }
.banner .art svg, .banner .art img { width: 72px; height: 72px; }
.toasts { position: absolute; z-index: 60; pointer-events: none; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 140px); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 var(--gutter-r) 0 var(--gutter-l); }
.toast { background: rgba(33,48,82,.88); color: #fff; font-size: 13px; padding: 7px 14px; border-radius: 999px; max-width: 92vw; display: flex; align-items: center; gap: 6px; animation: tin .25s ease-out; line-height: 1.35; }
.toast img { width: 20px; height: 20px; border-radius: 50%; }
.toast.out { animation: tout .3s ease-in forwards; }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }
@keyframes tout { to { transform: translateY(-8px); opacity: 0; } }

/* 骰子 */
.dicebox { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); display: flex; gap: 14px; perspective: 600px; }
.die { width: 62px; height: 62px; position: relative; transform-style: preserve-3d; }

    if (this.halted) return new Promise(function () {});
    if (p.human) return this.io.askHuman(p, kind, data || {});
    var d = WF.AI.decide(this, p, kind, data || {});
    var r = this.io.aiDecided ? this.io.aiDecided(p, kind, data || {}, d) : null;
    return (r || Promise.resolve()).then(function () { return d; });
  };

  /* ---------- 時間 ---------- */
  P.monthIndex = function () { return Math.floor((this.G.round - 1) / 3); };
  P.monthAbs = function () { return this.G.startMonth - 1 + this.monthIndex(); };
  P.month = function () { return (this.monthAbs() % 12) + 1; };
  P.year = function () { return Math.floor(this.monthAbs() / 12) + 1; };
  P.xun = function () { return (this.G.round - 1) % 3; };
  P.season = function () { return Math.floor((this.month() - 1) / 3); };
  P.seasonKey = function () { return Math.floor(this.monthAbs() / 3); };
  P.halfKey = function () { return Math.floor(this.monthAbs() / 6); };
  P.econ = function () { return 1 + K.INFL * this.monthIndex(); };
  P.monthsLeft = function () { return Math.ceil((this.G.rounds - this.G.round + 1) / 3); };

  /* ---------- 查詢 ---------- */
  P.cur = function () { return this.G.players[this.G.turn]; };
  P.alive = function () { return this.G.players.filter(function (p) { return p.alive; }); };
  P.rivals = function (p) { return this.G.players.filter(function (q) { return q.alive && q.id !== p.id; }); };
  P.tile = function (id) { return this.map.tiles[id]; };
  P.st = function (id) { return this.G.tiles[id]; };
  P.ownedIn = function (pid, d) {
    var G = this.G;
    return this.map.dists[d].lots.filter(function (id) { return G.tiles[id].o === pid; }).length;
  };
  P.isMono = function (pid, d) { return this.ownedIn(pid, d) === this.map.dists[d].lots.length; };
  P.lotsOf = function (pid) {
    var G = this.G, out = [];
    this.map.tiles.forEach(function (t) { if ((t.t === 'lot' || t.t === 'mark') && G.tiles[t.id].o === pid) out.push(t.id); });
    return out;
  };
  P.value = function (tid) { var t = this.tile(tid), s = this.st(tid); return t.p + s.inv; };
  P.lighthouseBonus = function (pid) {
    var G = this, b = 0;
    this.map.tiles.forEach(function (t) {
      var s = G.G.tiles[t.id];
      if (t.t === 'mark' && s.o === pid && s.mk === 'lighthouse') b += 0.1 * s.lv;
    });
    return b;
  };
  P.distFx = function (d, k) {
    var G = this.G;
    return G.fx.some(function (e) { return e.k === k && e.d === d && G.round < e.until; });
  };
  P.boosted = function (d) {
    if (!this.G.rules.seasons) return false;
    var arr = this.map.seasonBoost[this.season()] || [];
    return arr.indexOf(d) >= 0;
  };

  /* 過路費（不含收款方伴靈加成時 raw=true） */
  P.toll = function (tid, opt) {
    var G = this.G, t = this.tile(tid), s = this.st(tid);
    if (s.o < 0 || t.t !== 'lot') return 0;
    var owner = G.players[s.o];
    if (!owner || !owner.alive) return 0;
    var v = t.p * K.TOLL[s.lv];
    var n = this.map.dists[t.d].lots.length, k = this.ownedIn(s.o, t.d);
    v *= 1 + (k - 1) / (n - 1);
    if (this.boosted(t.d)) v *= 1.5;
    if (this.distFx(t.d, 'hike')) v *= 2;
    if (this.distFx(t.d, 'strike')) v = 0;
    if (owner.frozen > G.round) v = 0;
    v *= 1 + this.lighthouseBonus(s.o);
    if (owner.char === 'qian') v *= 1.1;
    if (this.mod('toll15')) v *= 1.5;
    v *= this.econ();
    if (!(opt && opt.raw) && owner.comp && owner.comp.id === 'goldfin') v *= 2;
    return r10(v);
  };
  P.markFee = function (tid, payer) {
    var t = this.tile(tid), s = this.st(tid);
    if (s.o < 0 || t.t !== 'mark' || !s.mk) return 0;
    var owner = this.G.players[s.o];
    if (!owner || !owner.alive) return 0;
    if (owner.frozen > this.G.round) return 0;
    var m = WF.MARKS[s.mk];
    if (s.mk === 'brokerage') return r10(this.nw(payer) * m.fee[s.lv - 1]);
    return r10(m.fee[s.lv - 1] * this.econ());
  };
  P.canUp = function (pid, tid) {
    var t = this.tile(tid), s = this.st(tid);
    if (t.t !== 'lot' || s.o !== pid || s.lv >= 4) return false;
    if (s.lv + 1 === 3 && this.ownedIn(pid, t.d) < 2) return false;
    if (s.lv + 1 === 4 && !this.isMono(pid, t.d)) return false;
    return true;
  };
  P.upCost = function (p, tid) {
    var t = this.tile(tid), s = this.st(tid);
    var c = t.p * K.UPC[s.lv];
    if (p.char === 'gou') c *= 0.7;
    if (p.comp && p.comp.id === 'gull') c *= 0.5;
    return r10(c);
  };
  P.buyPrice = function (p, tid) {
    var c = this.tile(tid).p;
    if (this.G.cheap) c *= 0.7;
    if (p.char === 'bojin') c *= 1.1;
    if (p.comp && p.comp.id === 'gull') c *= 0.8;
    return r10(c);
  };
  P.markPrice = function (p, tid) {
    var c = this.tile(tid).p;
    if (this.G.cheap) c *= 0.7;
    if (p.char === 'gou') c *= 0.7;
    return r10(c);
  };
  P.markUpCost = function (p, tid) {
    var s = this.st(tid), c = this.tile(tid).p * K.MARK_UP[s.lv - 1];
    if (p.char === 'gou') c *= 0.7;
    return r10(c);
  };
  P.buyoutPrice = function (tid) { return r10(this.value(tid) * K.BUYOUT); };
  P.sellValue = function (p, tid) { return r10(this.value(tid) * (p.char === 'qian' ? 1 : K.SELL)); };

  P.sharePrice = function (d) {
    var G = this.G, dist = this.map.dists[d], lots = dist.lots;
    var avg = 0, owned = 0, lv = 0;
    lots.forEach(function (id) { var t = WF.MAPS[G.mapId].tiles[id]; avg += t.p; if (G.tiles[id].o >= 0) owned++; lv += G.tiles[id].lv; });
    avg /= lots.length;
    var base = avg / 20;
    var v = base * (1 + 0.5 * owned / lots.length + 2.0 * lv / (4 * lots.length)) * G.dist[d].s;
    return Math.max(5, Math.round(v));
  };
  P.stockValue = function (p) {
    var self = this, v = 0;
    Object.keys(p.shares).forEach(function (d) { v += (p.shares[d] || 0) * self.sharePrice(d); });
    return v;
  };
  P.nw = function (p) {
    var self = this, v = p.cash;
    this.lotsOf(p.id).forEach(function (id) { v += self.value(id); });
    v += this.stockValue(p);
    return Math.round(v);
  };
  P.ranking = function () {
    var self = this;
    return this.G.players.slice().sort(function (a, b) {
      if (a.alive !== b.alive) return a.alive ? -1 : 1;
      return self.nw(b) - self.nw(a);
    });
  };
  P.rankOf = function (p) { return this.ranking().indexOf(p) + 1; };

  /* ---------- 路徑 ---------- */
  P.pathOptions = function (from, steps, reverse) {
    var tiles = this.map.tiles, out = [], G = this.G;
    function dfs(cur, path) {
      if (path.length === steps) { out.push(path.slice()); return; }
      var nx = reverse ? tiles[cur].prev : tiles[cur].next;
      for (var i = 0; i < nx.length; i++) { path.push(nx[i]); dfs(nx[i], path); path.pop(); }
    }
    if (steps <= 0) return [[]];
    dfs(from, []);
    if (G.rules.dest && G.dest >= 0) {
      out = out.map(function (p) { var k = p.indexOf(G.dest); return k >= 0 ? p.slice(0, k + 1) : p; });
    }
    var seen = {}, res = [];
    out.forEach(function (p) { var key = p[p.length - 1] + ':' + p.length; if (!seen[key]) { seen[key] = 1; res.push(p); } });
    return res;
  };
  P.dist = function (a, b) { return this.map.D[a][b]; };

  /* ============================================================
     主迴圈
     ============================================================ */
  P.run = async function () {
    var G = this.G;
    if (!G.started) { G.started = true; await this.begin(); }
    while (!G.over) {
      if (this.halted) return new Promise(function () {});
      var p = this.cur();
      try { if (p.alive) await this.turn(p); }
      catch (e) { if (this.io.onError) this.io.onError(e); else throw e; }
      if (G.over) break;
      G.turn++;
      if (G.turn >= G.players.length) {
        G.turn = 0;
        try { await this.endRound(); } catch (e2) { if (this.io.onError) this.io.onError(e2); else throw e2; }
      }
      if (G.over) break;
      if (this.io.saved) await this.io.saved();
    }
    await this.fx('gameover', { result: G.result });
    return G.result;
  };

  P.begin = async function () {
    var G = this.G, self = this;
    this.recordHist();
    await this.fx('begin', {});
    if (this.mod('cards3')) {
      G.players.forEach(function (p) { for (var i = 0; i < 3; i++) p.cards.push(self.randCard(p)); });
    }
    if (G.rules.dest) await this.newDest();
  };

  P.turn = async function (p) {
    var G = this.G;
    p.passed = false;
    p._curseMoved = false;
    await this.fx('turn', { p: p });
    if (p.comp && p.comp.id === 'jelly') await this.drawCard(p, '燈水母');
    if (p.stuck > 0) {
      p.stuck--;
      await this.fx('stuck', { p: p });
      await this.post(p, false);
      return;
    }
    var mods = { extra: 0, remote: null, reverse: false, flown: false, n: 0 };
    await this.prePhase(p, mods);
    if (!p.alive || G.over) return;
    if (mods.flown) { await this.post(p, true); return; }
    if (p.anchored) {
      p.anchored = false;
      await this.fx('anchored', { p: p });
      await this.post(p, false);
      return;
    }
    var dice;
    if (mods.remote) { dice = mods.remote; }
    else { dice = this.roll(mods.n); }
    await this.fx('dice', { p: p, dice: dice });
    if (!mods.remote && p.char === 'wei' && p.skillSeason !== this.halfKey()) {
      var rr = await this.ask(p, 'reroll', { dice: dice, reverse: mods.reverse });
      if (rr) {
        p.skillSeason = this.halfKey();
        dice = this.roll(dice.length);
        await this.fx('dice', { p: p, dice: dice, reroll: true });
      }
    }
    var steps = dice.reduce(function (a, b) { return a + b; }, 0);
    var opts = this.pathOptions(p.pos, steps, mods.reverse);
    var path = opts[0];
    if (opts.length > 1) {
      var ch = await this.ask(p, 'path', { opts: opts, reverse: mods.reverse });
      path = opts[Math.max(0, Math.min(opts.length - 1, ch | 0))];
    }
    await this.move(p, path, mods.reverse);
    if (!p.alive || G.over) return;
    await this.land(p, 0);
    await this.post(p, true);
  };

  P.roll = function (n) {
    var d = [];
    for (var i = 0; i < Math.max(1, n || 2); i++) d.push(this.ri(1, 6));
    return d;
  };
  P.diceOptions = function (p, mods) {
    var max = 2 + (mods && mods.extra ? 1 : 0) + (p.comp && p.comp.id === 'dolphin' ? 1 : 0);
    max = Math.min(3, max);
    var o = [1, 2]; if (max >= 3) o.push(3);
    return o;
  };

  P.prePhase = async function (p, mods) {
    for (var guard = 0; guard < 12; guard++) {
      if (!p.alive || this.G.over) return;
      var act = await this.ask(p, 'pre', { mods: mods, opts: this.diceOptions(p, mods) });
      if (!act || act.k === 'roll') {
        var opts = this.diceOptions(p, mods);
        mods.n = (act && opts.indexOf(act.n) >= 0) ? act.n : 2;
        if (act && act.remote) mods.remote = act.remote;
        return;
      }
      if (act.k === 'card') {
        await this.useCard(p, act.cid, act.tgt, mods);
        if (mods.flown || !p.alive) return;
        if (mods.remote) return;
        continue;
      }
      if (act.k === 'sell') { this.sellShares(p, act.d, act.n); continue; }
    }
    mods.n = 2;
  };

  P.post = async function (p, moved) {
    var G = this.G;
    if (!p.alive || G.over) return;
    if (G.rules.curse && G.curse.h === p.id) await this.curseAct(p);
    if (!p.alive || G.over) return;
    if (p.comp) {
      p.comp.t--;
      if (p.comp.t <= 0) { var c = p.comp.id; p.comp = null; await this.fx('comp-end', { p: p, comp: c }); }
    }
    if (p.passed && p.alive) await this.portPhase(p);
    if (p.cash < 0) await this.raise(p, null);
    if (!p.alive || G.over) return;
    // 提前勝利
    if (G.rules.target > 0 && p.passed && this.nw(p) >= G.rules.target * this.econ()) {
      await this.finish(p.id);
    }
  };

  /* ---------- 移動 ---------- */
  P.move = async function (p, path, reverse) {
    var G = this.G, self = this, met = {};
    for (var i = 0; i < path.length; i++) {
      var tid = path[i];
      p.pos = tid;
      await this.fx('step', { p: p, tid: tid, i: i, n: path.length, reverse: reverse });
      var t = this.tile(tid);
      if (!reverse && t.t === 'start') {
        p.passed = true;
        await this.salary(p, i === path.length - 1);
      }
      var others = G.players.filter(function (q) { return q.alive && q.id !== p.id && q.pos === tid; });
      for (var k = 0; k < others.length; k++) {
        var q = others[k];
        if (met[q.id]) continue;
        met[q.id] = 1;
        if (p.char === 'nichang' && q.cash > 0) {
          var amt = r10(Math.min(q.cash * 0.025, 600 * this.econ()));
          if (amt > 0) { q.cash -= amt; p.cash += amt; await this.fx('steal', { from: q, to: p, amt: amt }); }
        }
        if (G.rules.curse && G.curse.h === p.id && !p._curseMoved && q.char !== 'lan') {
          p._curseMoved = true;
          await this.passCurse(p, q, 'pass');
        }
      }
      if (G.rules.dest && tid === G.dest) { await this.arrive(p); break; }
    }
  };

  P.teleport = async function (p, tid, how) {
    var from = p.pos;
    p.pos = tid;
    await this.fx('fly', { p: p, from: from, tid: tid, how: how || 'air' });
    if (this.tile(tid).t === 'start') { p.passed = true; await this.salary(p, true); }
    if (this.G.rules.dest && tid === this.G.dest) await this.arrive(p);
  };

  P.salary = async function (p, landed) {
    var amt = K.SALARY * this.econ();
    if (p.comp && p.comp.id === 'manta') amt *= 2;
    if (p.char === 'bojin') amt *= 1.5;
    if (this.mod('salaryx2')) amt *= 2;
    if (landed) amt *= 1.5;
    amt = r100(amt);
    p.cash += amt;
    this.log(p.name + ' 回到渡口，領薪水 ' + amt);
    await this.fx('salary', { p: p, amt: amt, landed: landed });
  };

  /* ---------- 落點 ---------- */
  P.land = async function (p, depth) {
    var G = this.G, t = this.tile(p.pos), s = this.st(p.pos);
    switch (t.t) {
      case 'lot': await this.landLot(p, t, s); break;
      case 'mark': if (G.rules.marks) await this.landMark(p, t, s); break;
      case 'card': await this.drawCard(p); break;
      case 'event': await this.event(p, depth || 0); break;
      case 'shop': await this.shop(p); break;
      case 'tax': {
        var amt = r10(Math.max(300 * this.econ(), p.cash * 0.1));
        G.pool += amt;
        this.log(p.name + ' 繳稅 ' + amt);
        await this.fx('tax', { p: p, amt: amt });
        await this.charge(p, amt, null);
        break;
      }
      case 'pool': {
        if (G.pool > 0) {
          var got = G.pool; G.pool = 0; p.cash += got;
          if (got > p.st.poolMax) p.st.poolMax = got;
          this.log(p.name + ' 領走許願池 ' + got);
          await this.fx('pool', { p: p, amt: got });
          if (p.human && got >= 5000) this.ach(p, 'pool5k');
        } else await this.fx('pool', { p: p, amt: 0 });
        break;
      }
      case 'nest': await this.nest(p); break;
      case 'air': {
        if (depth > 0) break;
        var opts = this.flyOptions(p.pos);
        var fee = r10(600 * this.econ());
        if (opts.length && p.cash >= fee) {
          var to = await this.ask(p, 'fly', { opts: opts, fee: fee });
          if (to != null && to >= 0 && opts.indexOf(to) >= 0) {
            p.cash -= fee; G.pool += fee;
            await this.teleport(p, to, 'air');
            if (this.tile(to).t !== 'air') await this.land(p, depth + 1);
          }
        }
        break;
      }
      case 'storm': p.stuck = 1; this.log(p.name + ' 被風暴困住一回合'); await this.fx('storm', { p: p }); break;
      case 'exch': if (G.rules.stocks) await this.ask(p, 'trade', { where: 'exch' }); break;
      case 'start': break;
    }
  };
  P.flyOptions = function (from) {
    var out = [];
    this.map.tiles.forEach(function (t) { if ((t.t === 'air' || t.t === 'start') && t.id !== from) out.push(t.id); });
    return out;
  };

  P.landLot = async function (p, t, s) {
    var G = this.G, self = this;
    if (s.o < 0) {
      var price = this.buyPrice(p, t.id);
      if (p.cash >= price) {
        await this.tip(p, 'buy');
        var yes = await this.ask(p, 'buy', { tid: t.id, price: price });
        if (yes && p.cash >= price) this.doBuy(p, t.id, price);
      } else await this.fx('cantafford', { p: p, tid: t.id, price: price });
      return;
    }
    if (s.o === p.id) {
      if (this.canUp(p.id, t.id)) {
        var cost = this.upCost(p, t.id);
        if (p.cash >= cost) {
          var up = await this.ask(p, 'up', { tid: t.id, cost: cost });
          if (up && p.cash >= cost) this.doUpgrade(p, t.id, false);
        }
      } else await this.fx('home', { p: p, tid: t.id });
      return;
    }
    var owner = G.players[s.o];
    var amt = this.toll(t.id);
    await this.tip(p, 'toll');
    if (amt > 0) await this.payOwner(p, owner, amt, t.id);
    else await this.fx('toll', { from: p, to: owner, amt: 0, tid: t.id, free: true });
    if (!p.alive || G.over) return;
    // 強制收購
    if (G.rules.buyout && s.o >= 0 && s.o !== p.id && G.round >= s.prot) {
      var bp = this.buyoutPrice(t.id);
      if (p.cash >= bp) {
        await this.tip(p, 'buyout');
        var b = await this.ask(p, 'buyout', { tid: t.id, price: bp });
        if (b && p.cash >= bp && s.o >= 0 && s.o !== p.id) await this.doBuyout(p, t.id, bp);
      }
    }
  };

  P.payOwner = async function (p, owner, amt, tid) {
    var G = this.G;
    if (p.comp && p.comp.id === 'misteel') {
      this.log(p.name + ' 的霧鰻吞掉了過路費');
      await this.fx('toll', { from: p, to: owner, amt: amt, tid: tid, waived: 'misteel' });
      return;
    }
    var wi = p.cards.indexOf('waiver');
    if (wi >= 0) {
      p.cards.splice(wi, 1);
      this.log(p.name + ' 用免單券躲過 ' + amt);
      await this.fx('toll', { from: p, to: owner, amt: amt, tid: tid, waived: 'waiver' });
      return;
    }
    p.st.tollPaid += amt; owner.st.tollGot += amt;
    if (amt > p.st.maxPaid) p.st.maxPaid = amt;
    if (amt > owner.st.maxGot) owner.st.maxGot = amt;
    this.log(p.name + ' 付給 ' + owner.name + ' 過路費 ' + amt);
    var big = amt >= Math.max(3000, p.cash * 0.25);
    await this.fx('toll', { from: p, to: owner, amt: amt, tid: tid, big: big });
    if (Math.random() < 0.55) await this.bark(big ? p : owner, big ? 'payB' : 'get');
    if (owner.human && amt >= 10000) this.ach(owner, 'big_toll');
    if (p.human && amt >= 10000) this.ach(p, 'ouch');
    var tile = this.tile(tid);
    if (tile.t === 'lot' && G.rules.stocks) this.dividends(tile.d, amt);
    await this.charge(p, amt, owner);
  };

  P.dividends = function (d, amt) {
    var G = this.G, self = this, paid = 0;
    G.players.forEach(function (q) {
      var n = q.shares[d] || 0;
      if (!q.alive || n <= 0) return;
      var v = amt * K.DIV * n;
      if (q.char === 'ji') v *= 2;
      if (q.comp && q.comp.id === 'manta') v *= 2;
      v = Math.min(v, amt - paid);
      v = r10(v);
      if (v <= 0) return;
      paid += v;
      q.cash += v;
      q.st.stockGain += v;
      self.fxNow('dividend', { p: q, amt: v, d: d });
    });
  };

  /* 付款（可欠款，之後變賣） */
  P.charge = async function (p, amt, to) {
    p.cash -= amt;
    if (to) to.cash += amt;
    if (p.cash < 0) await this.raise(p, to);
  };

  P.doBuy = function (p, tid, price) {
    var t = this.tile(tid), s = this.st(tid);
    p.cash -= price;
    s.o = p.id; s.lv = 0; s.inv = 0;

  P.landMark = async function (p, t, s) {

  P.trimHand = async function (p) {

  P.cardTargets = function (p, cid) {
    var self = this, G = this.G, c = WF.CARDS[cid];
    switch (c.tgt) {
      case 'rival': return this.rivals(p).map(function (q) { return { k: 'p', id: q.id }; });
      case 'ownLot': return this.lotsOf(p.id).filter(function (id) { return self.tile(id).t === 'lot' && self.toll(id) > 0; }).map(function (id) { return { k: 't', id: id }; });
      case 'ownUp': return this.lotsOf(p.id).filter(function (id) { return self.canUp(p.id, id); }).map(function (id) { return { k: 't', id: id }; });
      case 'rivalBuilt': return this.map.tiles.filter(function (t) { var s = G.tiles[t.id]; return t.t === 'lot' && s.o >= 0 && s.o !== p.id && s.lv >= 1; }).map(function (t) { return { k: 't', id: t.id }; });
      case 'rivalEmpty': return this.map.tiles.filter(function (t) { var s = G.tiles[t.id]; return t.t === 'lot' && s.o >= 0 && s.o !== p.id && s.lv === 0 && p.cash >= r10(self.value(t.id) * 1.5); }).map(function (t) { return { k: 't', id: t.id }; });
      case 'district': return Object.keys(this.map.dists).map(function (d) { return { k: 'd', id: d }; });
      case 'lure': {
        var mine = this.lotsOf(p.id).filter(function (id) { return self.tile(id).t === 'lot' && self.toll(id) > 0; });
        if (!mine.length) return [];
        var out = [];
        this.rivals(p).forEach(function (q) { mine.forEach(function (id) { out.push({ k: 'lure', id: q.id, tid: id }); }); });
        return out;
      }
    }
    return null; // 不需要目標
  };
  P.cardUsable = function (p, cid, mods) {
    var G = this.G, c = WF.CARDS[cid];
    if (!c || c.act !== 'pre') return false;
    if (cid === 'exorcise') return G.rules.curse && G.curse.h === p.id && this.rivals(p).some(function (q) { return q.char !== 'lan'; });
    if (cid === 'robrich') return this.rivals(p).some(function (q) { return q.cash > 0; });
    if (cid === 'remote') return !(mods && mods.remote);
    if (cid === 'tailwind') return !(mods && mods.extra);
    if (cid === 'reverse') return !(mods && mods.reverse);
    var tg = this.cardTargets(p, cid);

  P.shielded = async function (q, p) {
    var i = q.cards.indexOf('shield');
    if (i < 0) return false;
    q.cards.splice(i, 1);

    await this.fx('shield', { p: q, by: p });
    return true;
  };

  P.useCard = async function (p, cid, tgt, mods) {
    var G = this.G, self = this, c = WF.CARDS[cid];
    var idx = p.cards.indexOf(cid);
    if (idx < 0 || !this.cardUsable(p, cid, mods)) return;
    p.cards.splice(idx, 1);
    p.st.cards++;
    if (p.human && p.st.cards >= 10) this.ach(p, 'card_master');
    this.log(p.name + ' 使用「' + c.n + '」');
    await this.fx('card', { p: p, cid: cid, tgt: tgt });
    if (c.atk && Math.random() < 0.5) await this.bark(p, 'atk');
    var q, tid, amt, d;
    switch (cid) {
      case 'remote': {
        var arr = Array.isArray(tgt) ? tgt : [Math.max(1, Math.min(6, tgt | 0 || 6))];
        mods.remote = arr.map(function (v) { return Math.max(1, Math.min(6, v | 0)); });
        break;
      }
      case 'tailwind': mods.extra = 1; break;
      case 'reverse': mods.reverse = true; break;
      case 'anchor':
        q = G.players[tgt && tgt.id]; if (!q || !q.alive) break;
        if (await this.shielded(q, p)) break;
        q.anchored = true;
        await this.fx('anchor', { p: p, q: q });
        break;
      case 'airticket': {
        var to = (tgt && tgt.k === 't') ? tgt.id : -1;
        var opts = this.flyOptions(p.pos);
        if (opts.indexOf(to) < 0) to = this.pick(opts);
        await this.teleport(p, to, 'air');
        mods.flown = true;
        if (p.alive && this.tile(to).t !== 'air') await this.land(p, 1);
        break;
      }
      case 'equalize': {
        var al = this.alive(), sum = 0;
        al.forEach(function (x) { sum += Math.max(0, x.cash); });
        var each = r10(sum / al.length);
        al.forEach(function (x) { if (x.cash >= 0) x.cash = each; });
        await this.fx('equalize', { each: each });
        break;
      }
      case 'robrich': {
        var rich = this.rivals(p).sort(function (a, b) { return b.cash - a.cash; })[0];
        if (!rich || rich.cash <= 0) break;
        if (await this.shielded(rich, p)) break;
        amt = r10(rich.cash * 0.15);
        rich.cash -= amt; p.cash += amt;
        await this.fx('steal', { from: rich, to: p, amt: amt, card: true });
        if (Math.random() < 0.6) await this.bark(rich, 'hit');
        break;
      }
      case 'rentday': {
        tid = tgt && tgt.id; if (tid == null) break;
        var t1 = this.toll(tid);
        var half = r10(t1 / 2);
        var rv = this.rivals(p);
        for (var i = 0; i < rv.length; i++) {
          var x = rv[i];
          if (await this.shielded(x, p)) continue;
          await this.fx('toll', { from: x, to: p, amt: half, tid: tid, card: true });
          await this.charge(x, half, p);
          if (G.over) return;
        }
        break;
      }
      case 'pricehike':
        d = tgt && tgt.id; if (!d) break;
        G.fx.push({ k: 'hike', d: d, until: G.round + 3 });
        await this.fx('hike', { d: d, by: p });
        break;
      case 'demolish': {
        tid = tgt && tgt.id; var s = G.tiles[tid];
        if (tid == null || s.o < 0 || s.o === p.id || s.lv < 1) break;
        q = G.players[s.o];
        if (await this.shielded(q, p)) break;
        s.lv--; s.inv = Math.max(0, s.inv - r10(this.tile(tid).p * K.UPC[s.lv]));
        await this.fx('demolish', { p: p, q: q, tid: tid });
        if (Math.random() < 0.6) await this.bark(q, 'hit');
        break;
      }
      case 'forcebuy': {
        tid = tgt && tgt.id; var s2 = G.tiles[tid];
        if (tid == null || s2.o < 0 || s2.o === p.id || s2.lv > 0) break;
        q = G.players[s2.o];
        var price = r10(this.value(tid) * 1.5);
        if (p.cash < price) break;
        if (await this.shielded(q, p)) break;
        p.cash -= price; q.cash += price; s2.o = p.id; s2.prot = G.round + 2;
        await this.fx('buyout', { p: p, from: q, tid: tid, price: price, card: true });
        this.checkMono(p, this.tile(tid).d);
        break;
      }
      case 'lure': {
        if (!tgt) break;
        q = G.players[tgt.id]; tid = tgt.tid;
        if (!q || !q.alive || G.tiles[tid].o !== p.id) break;
        if (await this.shielded(q, p)) break;
        await this.teleport(q, tid, 'lure');
        amt = this.toll(tid);
        if (amt > 0 && q.alive) {
          if (amt > p.st.lureMax) p.st.lureMax = amt;
          if (p.human && amt >= 8000) this.ach(p, 'lure8k');
          await this.payOwner(q, p, amt, tid);
        }
        break;
      }
      case 'freeze':
        q = G.players[tgt && tgt.id]; if (!q || !q.alive) break;
        if (await this.shielded(q, p)) break;
        q.frozen = G.round + 2;
        await this.fx('freeze', { p: p, q: q });
        break;
      case 'bull': case 'bear':
        d = tgt && tgt.id; if (!d) break;
        G.dist[d].s = Math.max(0.4, Math.min(2.6, G.dist[d].s * (cid === 'bull' ? 1.25 : 0.75)));
        await this.fx('stocknews', { d: d, up: cid === 'bull' });
        break;
      case 'exorcise': {
        if (G.curse.h !== p.id) break;
        var near = this.rivals(p).filter(function (x) { return x.char !== 'lan'; })
          .sort(function (a, b) { return Math.min(self.dist(p.pos, a.pos), self.dist(a.pos, p.pos)) - Math.min(self.dist(p.pos, b.pos), self.dist(b.pos, p.pos)); })[0];
        if (near) await this.passCurse(p, near, 'card');
        break;
      }
      case 'whistle': await this.giveComp(p); break;
      case 'boom':
        tid = tgt && tgt.id;
        if (tid != null && this.canUp(p.id, tid)) this.doUpgrade(p, tid, true);
        break;
    }
    // 引擎在每次使用後檢查破產
    if (G.over) return;
  };

  /* ---------- 鯨歌目的地 ---------- */
  P.newDest = async function () {

      .map(function (t) {

    var avg = 0; al.forEach(function (p) { avg += self.dist(p.pos, tile.id); }); avg /= Math.max(1, al.length);

    for (var i = 0; i < this.map.tiles.length; i++) {

  P.curseAct = async function (p) {

  /* 保留現金：看場上最痛的過路費 */
  AI.reserve = function (E, p) {
    var G = E.G, tolls = [];
    E.map.tiles.forEach(function (t) {
      var s = G.tiles[t.id];
      if (s.o < 0 || s.o === p.id) return;
      if (t.t === 'lot') tolls.push(E.toll(t.id));
      else if (t.t === 'mark') tolls.push(E.markFee(t.id, p));
    });
    tolls.sort(function (a, b) { return b - a; });
    var top = tolls.slice(0, 3), avg = 0;
    top.forEach(function (v) { avg += v; });
    avg = top.length ? avg / top.length : 0;
    var danger = 0.5 * (tolls[0] || 0) + 0.5 * avg;
    var e = E.econ();
    var r = danger * (0.35 + persona(p).reserve) + 700 * e;
    return Math.max(500 * e, Math.min(r, Math.max(2500 * e, E.nw(p) * 0.35)));
  };

  /* ---------- 落點評估 ---------- */
  AI.evalTile = function (E, p, tid) {
    var G = E.G, t = E.tile(tid), s = G.tiles[tid], e = E.econ(), ai = persona(p);
    var res = AI._res != null ? AI._res : AI.reserve(E, p);
    var cash = p.cash;
    switch (t.t) {
      case 'lot': {
        if (s.o < 0) {
          var price = E.buyPrice(p, tid);
          if (cash - price < res * 0.5) return 0;
          var own = E.ownedIn(p.id, t.d), n = E.map.dists[t.d].lots.length;
          var v = 0.35 * price + own * 0.4 * price;
          if (own === n - 1) v += 0.8 * price;
          return v * (0.6 + ai.greed);
        }
        if (s.o === p.id) {
          if (E.canUp(p.id, tid) && cash - E.upCost(p, tid) > res) return 0.2 * E.upCost(p, tid);
          return 30;
        }
        if (p.comp && p.comp.id === 'misteel') return 0;
        if (p.cards.indexOf('waiver') >= 0) return -200;
        var toll = E.toll(tid);
        var pen = toll > cash ? 1.6 : (toll > cash * 0.5 ? 0.4 : 0);
        return -toll * (1 + pen);
      }
      case 'mark': {
        if (!G.rules.marks) return 0;
        if (s.o < 0) { var mp = E.markPrice(p, tid); return cash - mp > res * 0.6 ? 0.3 * mp : 0; }
        if (s.o === p.id) return 60;
        if (p.comp && p.comp.id === 'misteel') return 0;
        var fee = E.markFee(tid, p);
        return -fee * (fee > cash ? 2.4 : 1) - (s.mk === 'spa' ? 600 * e : 0);
      }
      case 'card': return 520 * e;
      case 'event': return 120 * e;
      case 'shop': return cash > res + 1500 * e ? 200 * e : 0;
      case 'tax': return -Math.max(300 * e, cash * 0.1);
      case 'pool': return G.pool;
      case 'nest': return G.rules.comps ? 1300 * e : 450 * e;
      case 'air': return 150 * e;
      case 'storm': return -380 * e;
      case 'exch': return G.rules.stocks ? 80 * e * (0.5 + ai.stock) : 0;
      case 'start': return 0;
    }
    return 0;
  };

  AI.evalPath = function (E, p, path, reverse) {
    var G = E.G, e = E.econ(), v = 0, met = {}, cursed = G.rules.curse && G.curse.h === p.id, moved = false;
    if (!path.length) return AI.evalTile(E, p, p.pos);
    var last = path[path.length - 1];
    for (var i = 0; i < path.length; i++) {
      var tid = path[i], t = E.tile(tid);
      if (!reverse && t.t === 'start') v += WF.K.SALARY * e * (i === path.length - 1 ? 1.5 : 1) * (p.comp && p.comp.id === 'manta' ? 2 : 1) + 400 * e;
      for (var k = 0; k < G.players.length; k++) {
        var q = G.players[k];
        if (!q.alive || q.id === p.id || q.pos !== tid || met[q.id]) continue;
        met[q.id] = 1;
        if (p.char === 'nichang') v += Math.min(q.cash * 0.03, 800 * e);
        if (cursed && !moved && q.char !== 'lan') { moved = true; v += 2600 * G.curse.lv * e; }
      }
      if (G.rules.dest && tid === G.dest) { v += G.destReward + (G.rules.curse ? 1800 * e : 0); last = tid; break; }
    }
    v += AI.evalTile(E, p, last);
    if (G.rules.dest && G.dest >= 0 && last !== G.dest) {
      var dd = E.dist(last, G.dest);
      v -= Math.min(dd, 30) * 70 * e;
    }
    if (G.rules.curse && G.curse.h >= 0 && G.curse.h !== p.id && !(p.char === 'lan')) {
      var h = G.players[G.curse.h];
      if (h && h.alive) {
        var dh = E.dist(h.pos, last);
        if (dh <= 12) v -= 380 * G.curse.lv * e * (13 - dh) / 12;
      }
    }
    return v;
  };

  function sumProbs(n) {
    var out = {};
    if (n === 1) { for (var a = 1; a <= 6; a++) out[a] = 1 / 6; return out; }
    if (n === 2) { for (var x = 1; x <= 6; x++) for (var y = 1; y <= 6; y++) out[x + y] = (out[x + y] || 0) + 1 / 36; return out; }
    for (var i = 1; i <= 6; i++) for (var j = 1; j <= 6; j++) for (var k = 1; k <= 6; k++) out[i + j + k] = (out[i + j + k] || 0) + 1 / 216;
    return out;
  }
  var PROBS = { 1: sumProbs(1), 2: sumProbs(2), 3: sumProbs(3) };

  AI.bestForSum = function (E, p, s, reverse) {
    var opts = E.pathOptions(p.pos, s, reverse), best = -1e12, bi = 0;
    for (var i = 0; i < opts.length; i++) {
      var v = AI.evalPath(E, p, opts[i], reverse);
      if (v > best) { best = v; bi = i; }
    }
    return { v: best, i: bi, opts: opts };
  };
  AI.diceEV = function (E, p, n, reverse) {
    var pr = PROBS[n], ev = 0;
    for (var s in pr) ev += pr[s] * AI.bestForSum(E, p, +s, reverse).v;
    return ev;
  };

  /* ---------- 卡片估值 ---------- */
  AI.cardPlan = function (E, p, cid, mods, base) {
    var G = E.G, e = E.econ(), ai = persona(p), self = E, best = null;
    function cand(v, tgt) { if (!best || v > best.v) best = { v: v, tgt: tgt }; }
    var rivals = E.rivals(p);
    switch (cid) {
      case 'remote': {
        var top = null;
        for (var s = 1; s <= 12; s++) {
          var r = AI.bestForSum(E, p, s, mods.reverse);
          if (!top || r.v > top.v) top = { v: r.v, s: s };
        }
        var dice = top.s <= 6 ? [top.s] : [6, top.s - 6];
        cand(top.v - base, dice);
        break;
      }
      case 'tailwind': cand(AI.diceEV(E, p, 3, mods.reverse) - base, null); break;
      case 'reverse': cand(Math.max(AI.diceEV(E, p, 1, true), AI.diceEV(E, p, 2, true)) - base, null); break;
      case 'airticket': {
        E.flyOptions(p.pos).forEach(function (to) {
          var v = AI.evalTile(E, p, to);
          if (E.tile(to).t === 'start') v += WF.K.SALARY * e * 1.5 + 600 * e;
          if (G.rules.dest && to === G.dest) v += G.destReward;
          cand(v - base, { k: 't', id: to });
        });
        break;
      }
      case 'anchor': {
        rivals.forEach(function (q) {
          var v = 400 * e * ai.aggro;
          if (G.rules.dest && G.dest >= 0) { var d = E.dist(q.pos, G.dest); if (d <= 12) v += 1800 * e; }
          if (E.rankOf(q) === 1) v += 500 * e;
          cand(v, { k: 'p', id: q.id });
        });
        break;
      }
      case 'equalize': {
        var sum = 0, al = E.alive();
        al.forEach(function (x) { sum += Math.max(0, x.cash); });
        cand(sum / al.length - p.cash, null);
        break;
      }
      case 'robrich': {
        var rich = rivals.slice().sort(function (a, b) { return b.cash - a.cash; })[0];
        if (rich) cand(rich.cash * 0.15 * (0.7 + ai.aggro * 0.6), null);
        break;
      }
      case 'rentday': {
        E.cardTargets(p, cid).forEach(function (t) { cand(E.toll(t.id) * 0.5 * rivals.length, t); });
        break;
      }
      case 'pricehike': {
        Object.keys(E.map.dists).forEach(function (d) {
          if (E.distFx(d, 'hike')) return;
          var sum = 0;
          E.map.dists[d].lots.forEach(function (id) { if (G.tiles[id].o === p.id) sum += E.toll(id); });
          cand(sum * 0.9 * rivals.length / 3, { k: 'd', id: d });
        });
        break;
      }
      case 'demolish': {
        E.cardTargets(p, cid).forEach(function (t) {
          var v = E.toll(t.id) * 0.55 + E.tile(t.id).p * 0.25;
          cand(v * (0.7 + ai.aggro * 0.6), t);
        });
        break;
      }
      case 'forcebuy': {
        var res = AI.reserve(E, p);
        E.cardTargets(p, cid).forEach(function (t) {
          var tt = E.tile(t.id), price = WF.r10(E.value(t.id) * 1.5);
          if (p.cash - price < res) return;
          var own = E.ownedIn(p.id, tt.d), n = E.map.dists[tt.d].lots.length;
          var v = own * 0.5 * tt.p + (own === n - 1 ? 2500 * e : 0) - price * 0.25;
          cand(v, t);
        });
        break;
      }
      case 'lure': {
        E.cardTargets(p, cid).forEach(function (t) { cand(E.toll(t.tid) * (0.9 + ai.aggro * 0.3), t); });
        break;
      }
      case 'freeze': {
        rivals.forEach(function (q) {
          var sum = 0;
          E.lotsOf(q.id).forEach(function (id) { if (E.tile(id).t === 'lot') sum += E.toll(id); });
          cand(sum * 0.3 * ai.aggro, { k: 'p', id: q.id });
        });
        break;
      }
      case 'bull': {
        Object.keys(p.shares).forEach(function (d) { cand((p.shares[d] || 0) * E.sharePrice(d) * 0.25, { k: 'd', id: d }); });
        break;
      }
      case 'bear': {
        Object.keys(E.map.dists).forEach(function (d) {
          if (p.shares[d]) return;
          var tot = 0;
          rivals.forEach(function (q) { tot += (q.shares[d] || 0) * E.sharePrice(d); });
          cand(tot * 0.12 * ai.stock, { k: 'd', id: d });
        });
        break;
      }
      case 'exorcise': if (G.curse.h === p.id) cand(2800 * G.curse.lv * e, null); break;
      case 'whistle': cand(p.comp ? 200 * e : 1400 * e, null); break;
      case 'boom': {
        E.cardTargets(p, cid).forEach(function (t) { cand(E.upCost(p, t.id) * 0.9 + 300 * e, t); });
        break;
      }
    }
    return best;
  };

  AI.decidePre = function (E, p, data) {
    var G = E.G, mods = data.mods, e = E.econ(), ai = persona(p), nz = noise(p);
    var opts = data.opts || [1, 2];
    AI._res = AI.reserve(E, p);
    var evs = {};
    opts.forEach(function (n) { evs[n] = AI.diceEV(E, p, n, mods.reverse); });
    var base = -1e12;
    opts.forEach(function (n) { if (evs[n] > base) base = evs[n]; });
    // 卡片
    mods._used = mods._used || 0;
    if (mods._used < 2 && p.cards.length) {
      var bestC = null;
      var seen = {};
      p.cards.forEach(function (cid) {
        if (seen[cid]) return; seen[cid] = 1;
        if (!E.cardUsable(p, cid, mods)) return;
        var plan = AI.cardPlan(E, p, cid, mods, base);
        if (!plan) return;
        var c = WF.CARDS[cid];
        var thr = c.price * 0.55 * e + 300 * e;
        if (c.atk) thr *= (1.3 - ai.aggro * 0.6);
        if (plan.v > thr && (!bestC || plan.v - thr > bestC.gain)) bestC = { cid: cid, tgt: plan.tgt, gain: plan.v - thr };
      });
      if (bestC && R(E) > nz * 0.8) {
        mods._used++;
        AI._res = null;
        return { k: 'card', cid: bestC.cid, tgt: bestC.tgt };
      }
    }
    // 骰子
    var pick = opts[0], bv = -1e12;
    opts.forEach(function (n) {
      var v = evs[n] + (ai.risk - 0.5) * 260 * e * (n - 1);
      if (v > bv) { bv = v; pick = n; }
    });
    if (R(E) < nz) pick = opts[Math.floor(R(E) * opts.length)];
    AI._res = null;
    return { k: 'roll', n: pick };
  };

  /* ---------- 股票 ---------- */
  AI.stocks = function (E, p) {
    var G = E.G, ai = persona(p), e = E.econ();
    if (!G.rules.stocks) return;
    var res = AI.reserve(E, p);
    // 缺錢先賣
    var ds = Object.keys(p.shares);
    if (p.cash < res * 0.6) {
      ds.sort(function (a, b) { return p.shares[b] * E.sharePrice(b) - p.shares[a] * E.sharePrice(a); });
      for (var i = 0; i < ds.length && p.cash < res; i++) E.sellShares(p, ds[i], p.shares[ds[i]]);
      return;
    }
    // 獲利了結
    ds.forEach(function (d) {
      if (G.dist[d].s > 1.55 && R(E) < 0.5 + ai.stock * 0.3) {
        var n = Math.floor((p.shares[d] || 0) / 20) * 10;
        if (n > 0) E.sellShares(p, d, n);
      }
    });
    var budget = (p.cash - res * 1.25) * ai.stock * 0.55;
    if (budget <= 0) return;
    var best = null;
    Object.keys(E.map.dists).forEach(function (d) {
      var dist = E.map.dists[d], n = dist.lots.length;
      var own = E.ownedIn(p.id, d) / n, rivalPow = 0, lv = 0;
      dist.lots.forEach(function (id) {
        var s = G.tiles[id];
        lv += s.lv;
        if (s.o >= 0 && s.o !== p.id) rivalPow += 0.5 + s.lv * 0.4;
      });
      var sc = own * 2 + rivalPow / n * 1.5 + lv / (4 * n) + (G.dist[d].s < 0.9 ? 0.5 : 0) - (G.dist[d].s > 1.6 ? 1 : 0) + (E.boosted(d) ? 0.4 : 0);
      sc += (R(E) - 0.5) * 0.4;
      if (!best || sc > best.sc) best = { d: d, sc: sc };
    });
    if (!best || best.sc < 0.6) return;
    var price = E.sharePrice(best.d);
    var n = Math.floor(budget / (price * 10)) * 10;
    n = Math.min(n, 100);
    if (n >= 10) E.buyShares(p, best.d, n);
  };

  /* ---------- 回港 ---------- */
  AI.port = function (E, p) {
    var G = E.G, ai = persona(p);
    var res = AI.reserve(E, p);
    var c = E.lotsOf(p.id).filter(function (id) { return E.canUp(p.id, id); });
    c.sort(function (a, b) { return AI.upScore(E, p, b) - AI.upScore(E, p, a); });
    var maxUps = 1 + Math.floor(ai.build * 4);
    var done = 0;
    for (var i = 0; i < c.length && done < maxUps; i++) {
      var cost = E.upCost(p, c[i]);
      if (p.cash - cost >= res * (1.1 - ai.build * 0.6)) { if (E.doUpgrade(p, c[i], false)) done++; }
    }
    if (G.rules.vitality && p.char !== 'lan' && p.char !== 'ji' && G.vit < 55 && p.cash - E.feedFee() >= res && R(E) < 0.35) E.doFeed(p);
    AI.stocks(E, p);
  };
  AI.upScore = function (E, p, tid) {
    var s = E.G.tiles[tid], t = E.tile(tid);
    var now = t.p * WF.K.TOLL[s.lv], nx = t.p * WF.K.TOLL[s.lv + 1];
    var own = E.ownedIn(p.id, t.d), n = E.map.dists[t.d].lots.length;
    var m = 1 + (own - 1) / (n - 1);
    return (nx - now) * m / Math.max(1, E.upCost(p, tid)) * (t.branch ? 1.15 : 1);
  };

  AI.cardDesire = function (E, p, cid) {
    var G = E.G, ai = persona(p);
    var base = {
      lure: 1.0, remote: 0.8, waiver: 0.8, shield: 0.6, boom: 0.7, rentday: 0.6, robrich: 0.55, demolish: 0.5,
      freeze: 0.45, tailwind: 0.35, pricehike: 0.5, forcebuy: 0.5, airticket: 0.35, anchor: 0.4,
      exorcise: (G.curse.h === p.id ? 1.1 : 0.3), whistle: (p.comp ? 0.25 : 0.55),
      equalize: 0.35, bull: 0.3 * ai.stock, bear: 0.2 * ai.stock, reverse: 0.3
    }[cid] || 0.3;
    if (WF.CARDS[cid].atk) base *= 0.7 + ai.aggro * 0.6;
    if (cid === 'boom' && !E.lotsOf(p.id).some(function (id) { return E.canUp(p.id, id); })) base *= 0.4;
    if (cid === 'rentday' && !E.lotsOf(p.id).length) base *= 0.2;
    return base;
  };

  AI.pickSell = function (E, p, assets) {
    var G = E.G;
    function pri(a) {
      if (a.k === 'sh') return 0;
      var t = E.tile(a.id), s = G.tiles[a.id];
      if (t.t === 'mark') return 3;
      if (E.isMono(p.id, t.d)) return 4;
      return s.lv > 0 ? 2 : 1;
    }
    var need = -p.cash;
    var sorted = assets.slice().sort(function (a, b) {
      var d = pri(a) - pri(b);
      if (d) return d;
      return a.v - b.v;
    });
    // 同優先級中，若有一筆就夠還，就選最小那筆夠還的
    var p0 = pri(sorted[0]);
    var same = sorted.filter(function (a) { return pri(a) === p0; });
    var enough = same.filter(function (a) { return a.v >= need; });
    return enough.length ? enough[0] : sorted[0];
  };

  /* ---------- 總入口 ---------- */
  AI.decide = function (E, p, kind, data) {
    var G = E.G, ai = persona(p), nz = noise(p), e = E.econ();
    switch (kind) {
      case 'pre': return AI.decidePre(E, p, data);
      case 'reroll': {
        var s = data.dice.reduce(function (a, b) { return a + b; }, 0);
        var cur = AI.bestForSum(E, p, s, data.reverse).v;
        var ev = AI.diceEV(E, p, data.dice.length, data.reverse);
        return cur < ev - 800 * e;
      }
      case 'path': {
        var best = -1e12, bi = 0;
        data.opts.forEach(function (path, i) {
          var v = AI.evalPath(E, p, path, data.reverse) + (R(E) - 0.5) * 600 * nz;
          if (v > best) { best = v; bi = i; }
        });
        return bi;
      }
      case 'buy': {
        var t = E.tile(data.tid), res = AI.reserve(E, p), after = p.cash - data.price;
        if (after < 0) return false;
        var own = E.ownedIn(p.id, t.d), n = E.map.dists[t.d].lots.length;
        var want = after >= res * (1.15 - ai.greed * 0.5);
        if (own === n - 1) want = after >= res * 0.35;
        if (ai.sloppy && R(E) < ai.sloppy) want = true;
        if (R(E) < nz * 0.5) want = !want;
        if (E.monthsLeft() <= 1 && after < res) want = false;
        return want;
      }
      case 'up': {
        var res2 = AI.reserve(E, p);
        var ok = p.cash - data.cost >= res2 * (1.1 - ai.build * 0.6);
        if (R(E) < nz * 0.4) ok = !ok && p.cash - data.cost >= 0;
        return ok;
      }
      case 'buyout': {
        var t2 = E.tile(data.tid), res3 = AI.reserve(E, p);
        var own2 = E.ownedIn(p.id, t2.d), n2 = E.map.dists[t2.d].lots.length;
        if (p.ai === 'easy') return false;
        if (own2 === n2 - 1) return p.cash - data.price >= res3 * 0.8;
        if (own2 >= 1 && ai.aggro > 0.6) return p.cash - data.price >= res3 * 1.6 && data.price <= p.cash * 0.35;
        return false;
      }
      case 'mark': {
        var res4 = AI.reserve(E, p);
        if (p.cash - data.price < res4 * 0.7) return null;
        var lots = E.lotsOf(p.id).length;
        var sc = {
          lighthouse: 0.45 + 0.1 * lots,
          spa: 0.85 + (E.tile(data.tid).branch ? 0.3 : 0),
          brokerage: 0.75 + 0.25 * ai.aggro,
          songtower: G.rules.dest ? 0.7 : 0.05
        };
        var bestT = null, bv = -1;
        Object.keys(sc).forEach(function (k) { var v = sc[k] + R(E) * 0.35; if (v > bv) { bv = v; bestT = k; } });
        return bestT;
      }
      case 'markup': return p.cash - data.cost >= AI.reserve(E, p);
      case 'fly': {
        var bestF = -1, bvF = 300 * e + data.fee;
        data.opts.forEach(function (to) {
          var v = AI.evalTile(E, p, to);
          if (E.tile(to).t === 'start') v += WF.K.SALARY * e * 1.5 + 500 * e;
          if (G.rules.dest && to === G.dest) v += G.destReward;
          if (v > bvF) { bvF = v; bestF = to; }
        });
        return bestF;
      }
      case 'port': AI.port(E, p); return null;
      case 'trade': AI.stocks(E, p); return null;
      case 'shop': {
        var res5 = AI.reserve(E, p), bought = 0;
        var offers = data.offers.slice().sort(function (a, b) { return AI.cardDesire(E, p, b) - AI.cardDesire(E, p, a); });
        offers.forEach(function (cid) {
          if (bought >= 2 || p.cards.length >= 4) return;
          var price = WF.CARDS[cid].price;
          if (p.cash - price < res5 * 1.3) return;
          if (AI.cardDesire(E, p, cid) * (1 + ai.aggro * 0.4) > 0.75 && R(E) > nz) { if (E.buyCard(p, cid)) bought++; }
        });
        return null;
      }

  /* ---------- 配樂：依季節換調性的輕柔循環 ---------- */
  var SEQ = null;
  var KEYS = [
    { root: 65, chords: [[0, 4, 7, 11], [-3, 0, 4, 7], [-7, -3, 0, 4], [-5, -1, 2, 5]], bpm: 88 },   // 春
    { root: 62, chords: [[0, 4, 7, 9], [5, 9, 12, 16], [-3, 0, 4, 7], [7, 11, 14, 17]], bpm: 96 },   // 夏
    { root: 57, chords: [[0, 3, 7, 10], [-4, 0, 3, 7], [-7, -4, 0, 3], [-2, 2, 5, 9]], bpm: 80 },    // 秋
    { root: 64, chords: [[0, 3, 7, 10], [-4, -1, 3, 7], [-9, -5, -2, 3], [-2, 2, 5, 8]], bpm: 72 },  // 冬
    { root: 60, chords: [[0, 3, 7, 10], [-4, 0, 3, 8], [-7, -4, 0, 3], [-5, -2, 2, 5]], bpm: 66 }    // 夜／終章
  ];
  AU.music = function (which) {
    AU._pendingMusic = which;
    if (!ac) return;
    if (SEQ && SEQ.which === which) return;
    if (SEQ) clearInterval(SEQ.timer);
    if (which == null || which < 0) { SEQ = null; return; }
    var K = KEYS[which] || KEYS[0];
    SEQ = { which: which, step: 0, next: now() + 0.1, K: K };
    var spb = 60 / K.bpm / 2; // 八分音符
    SEQ.timer = setInterval(function () {
      if (!SEQ) return;
      while (SEQ.next < now() + 0.25) { play(SEQ.step, SEQ.next, spb); SEQ.step++; SEQ.next += spb; }
    }, 60);
  };
  function play(step, t, spb) {
    if (!AU.musOn) return;
    var K = SEQ.K, bar = Math.floor(step / 8) % 4, beat = step % 8, ch = K.chords[bar];
    if (beat === 0) {
      ch.forEach(function (n) {
        tone({ t: t, f: NOTE(K.root + n - 12), dur: spb * 8.2, v: 0.05, a: 0.4, type: 'triangle', lp: 900, bus: musBus, rev: true });
      });
      tone({ t: t, f: NOTE(K.root + ch[0] - 24), dur: spb * 3, v: 0.09, a: 0.02, type: 'sine', bus: musBus });
    }
    if (beat === 4) tone({ t: t, f: NOTE(K.root + ch[0] - 24), dur: spb * 2.5, v: 0.06, type: 'sine', bus: musBus });
    var pat = [0, 2, 1, 3, 2, 1, 3, 2];
    if ((step * 7) % 11 !== 3) {
      var n2 = ch[pat[beat]] + (beat > 3 ? 12 : 0);
      tone({ t: t, f: NOTE(K.root + n2), dur: spb * 1.6, v: 0.045, a: 0.004, type: 'sine', bus: musBus, rev: true });
    }
    if (beat % 2 === 1) noise({ t: t, f: 7000, q: 2, dur: 0.05, v: 0.018, bus: musBus });
  }
})();

        AU.sfx('tap');
        useCardFlow(p, cid);
      };
      wrap.appendChild(c);
    });
    openSheet({ title: '手牌 ' + p.cards.length + ' / 5', sub: canUse ? '點一張卡使用。卡片要在擲骰前用。' : '輪到你時才能用卡。', body: wrap, closable: true });

  /* ---------- 橫幅、吐司、提示 ---------- */
  function banner(o) {
    bannerQ = bannerQ.then(function () {
      return gate().then(function () {
        return new Promise(function (res) {
          var fx = $('#fx');
          var b = el('<div class="banner"><div class="rib" style="--bg:' + (o.bg || 'var(--ink)') + '">' +
            (o.art ? '<div class="art">' + o.art + '</div>' : '') + (o.k ? '<span class="k">' + o.k + '</span>' : '') +
            (o.big ? '<span class="big">' + o.big + '</span>' : '') + (o.amt != null ? '<span class="amt">' + o.amt + '</span>' : '') +
            (o.sub ? '<span class="sub">' + o.sub + '</span>' : '') + '</div></div>');
          fx.appendChild(b);
          requestAnimationFrame(function () { b.classList.add('on'); });
          var d = (o.dur || 1300) * (o.human ? Math.min(1, SPD * 1.5) : SPD);
          setTimeout(function () { b.classList.add('out'); setTimeout(function () { b.remove(); }, 320); res(); }, Math.max(450, d));
        });
      });
    });
