// ============================================================
//  BACKGROUND LAYER PAINTERS (tileable strips, drawn once)
// ============================================================
const BG_W = 2048, BG_H = 520;
const BGPaint = {
  // helper: draw shape at x and wrapped copies
  wrap(x, w, fn) { fn(x); if (x + w > BG_W) fn(x - BG_W); if (x < 0) fn(x + BG_W); },
  windows(g, x, y, w, h, lit, p, rng, sz = 3) {
    // sparse, irregular arched slits — lit in small clusters
    const cols = Math.max(1, Math.min(3, Math.floor(w / (sz * 6))));
    const xs = []; for (let c = 0; c < cols; c++) xs.push(x + (c + 0.5) * (w / cols) - sz / 2);
    for (let yy = y + sz * 3; yy < y + h - sz * 3; yy += sz * 5 + rng() * sz * 3) {
      for (const xx of xs) {
        if (rng() > 0.45) continue;
        const lit1 = rng() < p;
        g.fillStyle = lit1 ? lit : 'rgba(0,0,0,0.35)';
        g.globalAlpha = lit1 ? 0.55 + rng() * 0.45 : 1;
        g.fillRect(xx, yy, sz, sz * 1.8);
        g.beginPath(); g.arc(xx + sz / 2, yy, sz / 2, Math.PI, 0); g.fill();
      }
    }
    g.globalAlpha = 1;
  },
  bellShape(g, cx, top, w, h) {
    g.beginPath(); g.moveTo(cx - w * 0.22, top); g.quadraticCurveTo(cx, top - h * 0.12, cx + w * 0.22, top);
    g.quadraticCurveTo(cx + w * 0.3, top + h * 0.55, cx + w * 0.5, top + h); g.lineTo(cx - w * 0.5, top + h);
    g.quadraticCurveTo(cx - w * 0.3, top + h * 0.55, cx - w * 0.22, top); g.fill();
  },
  eaveRoof(g, X, top, w, lift) {
    g.beginPath(); g.moveTo(X - w * 0.18, top + 2); g.quadraticCurveTo(X + w * 0.1, top - 1, X + w / 2, top - lift); g.quadraticCurveTo(X + w * 0.9, top - 1, X + w * 1.18, top + 2); g.lineTo(X + w * 1.18, top + 4); g.lineTo(X - w * 0.18, top + 4); g.fill();
  },
  tower(g, X, base, w, h, o, rng) {
    // tiered bell tower: setbacks, eaves or spire, open belfry
    const tiers = 1 + Math.floor(rng() * 3);
    let tw = w, tx = X, ty = base;
    g.fillStyle = o.color;
    g.fillRect(X - 3, base - 10, w + 6, 10 + BG_H);
    for (let i = 0; i < tiers; i++) {
      const th = (h / tiers) * (0.75 + rng() * 0.5);
      g.fillRect(tx, ty - th, tw, th);
      this.windows(g, tx, ty - th, tw, th, o.lit, o.litP || 0.3, rng, 2.6);
      g.fillStyle = o.color;
      if (rng() < 0.45) this.eaveRoof(g, tx, ty - th, tw, 6 + rng() * 5);
      ty -= th; const nw = tw * (0.72 + rng() * 0.12); tx += (tw - nw) / 2; tw = nw;
    }
    const kind = rng();
    if (kind < 0.5) {
      // open belfry with a bell, then a spire or eave roof
      const bh = tw * 1.1;
      g.fillStyle = o.lit; g.globalAlpha = 0.16; g.fillRect(tx + tw * 0.14, ty - bh, tw * 0.72, bh); g.globalAlpha = 1;
      g.fillStyle = o.color;
      g.fillRect(tx, ty - bh, tw * 0.14, bh); g.fillRect(tx + tw * 0.86, ty - bh, tw * 0.14, bh);
      g.fillRect(tx - 2, ty - bh - 3, tw + 4, 4);
      this.bellShape(g, tx + tw / 2, ty - bh + bh * 0.18, tw * 0.46, bh * 0.52);
      ty -= bh + 3;
      if (rng() < 0.6) { g.beginPath(); g.moveTo(tx - 3, ty + 1); g.lineTo(tx + tw / 2, ty - tw * (1.3 + rng() * 1.6)); g.lineTo(tx + tw + 3, ty + 1); g.fill(); }
      else { this.eaveRoof(g, tx, ty, tw, tw * 0.45); g.fillRect(tx + tw / 2 - 1, ty - tw * 0.45 - 10, 2, 12); }
    } else if (kind < 0.75) {
      g.beginPath(); g.arc(tx + tw / 2, ty, tw / 2, Math.PI, 0); g.fill();
      g.fillRect(tx + tw / 2 - 1, ty - tw / 2 - 16, 2, 16); g.beginPath(); g.arc(tx + tw / 2, ty - tw / 2 - 17, 2.2, 0, TAU); g.fill();
    } else {
      g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + tw / 2, ty - tw * (2 + rng() * 1.5)); g.lineTo(tx + tw, ty); g.fill();
    }
    // buttress fins
    if (rng() < 0.6) { g.beginPath(); g.moveTo(X - 10, base); g.lineTo(X, base - h * 0.3); g.lineTo(X, base); g.fill(); g.beginPath(); g.moveTo(X + w + 10, base); g.lineTo(X + w, base - h * 0.3); g.lineTo(X + w, base); g.fill(); }
  },
  spires(g, o, rng) {
    const base = BG_H * o.base;
    let x = rng() * 40;
    const tops = [];
    while (x < BG_W) {
      const w = 20 + rng() * 34, h = BG_H * (o.hmin + rng() * (o.hmax - o.hmin));
      this.wrap(x, w + 20, (X) => this.tower(g, X, base, w, h, o, mulberry32((x * 1000) | 0)));
      tops.push([x + w / 2, base - h * (0.4 + rng() * 0.4)]);
      x += o.gap ? o.gap[0] + rng() * (o.gap[1] - o.gap[0]) : 60 + rng() * 80;
    }
    // sky bridges between towers
    g.fillStyle = o.color;
    for (let i = 0; i < tops.length - 1; i++) if (rng() < 0.3) { const [a, ay] = tops[i], [b] = tops[i + 1]; if (b - a < 160) { g.fillRect(a, ay, b - a, 4); g.beginPath(); g.moveTo(a, ay + 4); g.quadraticCurveTo((a + b) / 2, ay + 22, b, ay + 4); g.lineTo(b, ay + 7); g.quadraticCurveTo((a + b) / 2, ay + 26, a, ay + 7); g.fill(); } }
    g.fillStyle = o.color; g.fillRect(0, base, BG_W, BG_H - base);
  },
  city(g, o, rng) {
    const base = BG_H * o.base;
    let x = 0;
    while (x < BG_W) {
      const w = 34 + rng() * 60, h = BG_H * (o.hmin + rng() * (o.hmax - o.hmin)), top = base - h;
      const r = rng();
      this.wrap(x, w + 30, (X) => {
        if (r < 0.22) { this.tower(g, X, base, w * 0.6, h * 1.5, o, mulberry32((x * 77) | 0)); return; }
        g.fillStyle = o.color; g.fillRect(X, top, w, BG_H);
        if (r < 0.6) this.eaveRoof(g, X, top, w, w * 0.28);
        else { g.beginPath(); g.moveTo(X - 5, top); g.lineTo(X + w / 2, top - w * 0.5); g.lineTo(X + w + 5, top); g.fill(); }
        if (rng() < 0.35) g.fillRect(X + w * 0.72, top - 24, 6, 24);
        if (rng() < 0.4) g.fillRect(X - 6, top + h * 0.35, w + 12, 3); // balcony
        this.windows(g, X, top, w, h, o.lit, o.litP, rng, 3);
      });
      x += w * (0.75 + rng() * 0.45);
    }
    g.fillStyle = o.color; g.fillRect(0, base, BG_W, BG_H - base);
  },
  market(g, o, rng) {
    const base = BG_H * o.base;
    let x = 0; const lanterns = [];
    while (x < BG_W) {
      const w = 50 + rng() * 80, h = BG_H * (o.hmin + rng() * (o.hmax - o.hmin)), top = base - h;
      this.wrap(x, w + 30, (X) => {
        g.fillStyle = o.color; g.fillRect(X, top, w, BG_H);
        // awning
        g.beginPath(); g.moveTo(X - 8, top + h * 0.35); g.lineTo(X + w + 8, top + h * 0.35); g.lineTo(X + w + 18, top + h * 0.35 + 18); g.lineTo(X - 18, top + h * 0.35 + 18); g.fill();
        g.beginPath(); g.moveTo(X - 10, top); g.quadraticCurveTo(X + w / 2, top - 26, X + w + 10, top); g.fill();
        this.windows(g, X, top + 4, w, h * 0.3, o.lit, 0.18, rng, 3.5);
      });
      if (rng() < 0.7) lanterns.push([x + w, top + h * 0.2]);
      x += w + rng() * 30;
    }
    g.fillStyle = o.color; g.fillRect(0, base, BG_W, BG_H - base);
    // lantern strings between rooftops
    g.strokeStyle = o.color; g.lineWidth = 1.2;
    for (let i = 0; i < lanterns.length - 1; i++) {
      const [x0, y0] = lanterns[i], [x1, y1] = lanterns[i + 1];
      if (x1 - x0 > 260) continue;
      const my = Math.max(y0, y1) + 30;
      g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo((x0 + x1) / 2, my, x1, y1); g.stroke();
      for (let t = 0.15; t < 0.9; t += 0.18) {
        const lx = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * ((x0 + x1) / 2) + t * t * x1;
        const ly = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * my + t * t * y1;
        g.fillStyle = o.lit; g.globalAlpha = rng() < 0.7 ? 0.9 : 0.3; g.beginPath(); g.ellipse(lx, ly + 5, 3, 4, 0, 0, TAU); g.fill(); g.globalAlpha = 1;
      }
    }
  },
  rock(g, o, rng) {
    // the colossal spire rock rising from the right-center, lit specks far above
    const cx = BG_W * 0.55, w = 520;
    g.fillStyle = o.color;
    g.beginPath(); g.moveTo(cx - w * 0.5, BG_H);
    for (let y = BG_H; y >= 0; y -= 20) g.lineTo(cx - w * 0.5 + noise1(y * 0.02 + 3) * 40 + (BG_H - y) * 0.12, y);
    for (let y = 0; y <= BG_H; y += 20) g.lineTo(cx + w * 0.5 + noise1(y * 0.02 + 9) * 40 - (BG_H - y) * 0.1, y);
    g.fill();
    for (let i = 0; i < 70; i++) { g.fillStyle = o.lit; g.globalAlpha = rng() * 0.6; g.fillRect(cx - w * 0.35 + rng() * w * 0.7, rng() * BG_H * 0.5, 2, 2); }
    g.globalAlpha = 1;
    // ledges / structures clinging to the rock
    for (let i = 0; i < 12; i++) { const y = rng() * BG_H * 0.8, x = cx - w * 0.5 + rng() * w; g.fillStyle = shade(o.color, -0.2); g.fillRect(x, y, 30 + rng() * 60, 6); }
  },
  islands(g, o, rng) {
    for (let i = 0; i < 9; i++) {
      const x = rng() * BG_W, y = BG_H * (0.25 + rng() * 0.35), w = 60 + rng() * 140;
      this.wrap(x - w / 2, w, (X) => {
        const cx = X + w / 2;
        g.fillStyle = o.color;
        g.beginPath(); g.moveTo(cx - w / 2, y);
        for (let k = 0; k <= 10; k++) { const t = k / 10; g.lineTo(cx - w / 2 + t * w, y + Math.sin(t * Math.PI) * w * (0.35 + rng() * 0.15) + rng() * 6); }
        g.lineTo(cx + w / 2, y); g.fill();
        // houses on top
        for (let h = 0; h < 4; h++) { const hx = cx - w * 0.35 + rng() * w * 0.6, hw = 8 + rng() * 14, hh = 8 + rng() * 18; g.fillRect(hx, y - hh, hw, hh); g.beginPath(); g.moveTo(hx - 2, y - hh); g.lineTo(hx + hw / 2, y - hh - hw * 0.5); g.lineTo(hx + hw + 2, y - hh); g.fill(); }
      });
    }
    // distant spire
    g.fillStyle = shade(o.color, 0.08);
    const sx = BG_W * 0.72; g.beginPath(); g.moveTo(sx - 60, BG_H); g.lineTo(sx - 22, 30); g.lineTo(sx, -40); g.lineTo(sx + 22, 30); g.lineTo(sx + 60, BG_H); g.fill();
  },
  arches(g, o, rng) {
    const base = BG_H * o.base;
    const span = o.big ? 300 : 170;
    let x = rng() * 100;
    g.fillStyle = o.color;
    while (x < BG_W) {
      const broken = rng() < 0.35, deckY = base - (o.big ? 180 : 120) - rng() * 30, pier = o.big ? 34 : 20;
      this.wrap(x, span + pier, (X) => {
        g.fillStyle = o.color;
        g.fillRect(X, deckY, pier, BG_H - deckY);
        if (!broken) {
          g.beginPath(); g.moveTo(X, deckY); g.lineTo(X + span + pier, deckY); g.lineTo(X + span + pier, deckY + 20);
          g.arc(X + pier + span / 2, deckY + 20 + span * 0.02, span / 2, 0, Math.PI, true); g.closePath(); g.fill();
          // railing posts
          for (let px = X; px < X + span + pier; px += 12) g.fillRect(px, deckY - 8, 2, 8);
          g.fillRect(X, deckY - 9, span + pier, 2);
        } else {
          g.beginPath(); g.moveTo(X, deckY); g.lineTo(X + span * 0.35, deckY); g.lineTo(X + span * 0.3, deckY + 22); g.lineTo(X + pier, deckY + 40); g.closePath(); g.fill();

class Prop {
  constructor(game, x, y) { this.game = game; this.x = x; this.y = y; this.back = false; this.remove = false; this.t = Math.random() * 10; }
  update(dt) { this.t += dt; }
  draw() {}
  near(r = 40, ry = 60) { const p = this.game.player; return p && Math.abs(p.x - this.x) < r && Math.abs(p.y - this.y) < ry; }
}

class CheckBell extends Prop {
  constructor(game, sp) {
    super(game, sp.x, sp.y); this.idx = sp.idx; this.key = game.world.id + ':' + sp.idx;
    this.swing = 0; this.sv = 0; this.glow = 0; this.rung = !!game.save.bells[this.key];
    this.light = 70; this.ly = this.y - 50; this.glowC = '#ffcf8a'; this.hintShown = false;
  }
  rect() { return { x: this.x - 16, y: this.y - 62, w: 32, h: 44 }; }
  hurt(dmg, info) { this.ring(info.dir || 1); return 'hit'; }
  ring(dir) {
    this.sv += 3.5 * dir; this.glow = 1;
    Snd.play('checkpoint', { gap: 400 });
    FX.beam(this.x, this.y); FX.ring(this.x, this.y - 40, 10, 120, '#ffe7b8', 0.9, 3);
    for (let i = 0; i < 20; i++) FX.whiteMote(this.x + rand(-30, 30), this.y - rand(10, 70), 60);
    this.rung = true;
    this.game.checkpoint(this);
  }
  update(dt) {
    super.update(dt);
    this.sv += (-this.swing * 22 - this.sv * 1.6) * dt; this.swing += this.sv * dt;
    this.glow = Math.max(0, this.glow - dt * 0.5);
    this.light = (this.rung ? 150 : 80) + this.glow * 120;
    if (!this.hintShown && !this.rung && this.near(90, 80)) { this.hintShown = true; this.game.hint('bell'); }
  }
  draw(ctx, a, rd) {
    const x = this.x, y = this.y;
    ctx.fillStyle = '#17110c';
    ctx.fillRect(x - 24, y - 78, 4, 78); ctx.fillRect(x + 20, y - 78, 4, 78);
    ctx.fillRect(x - 30, y - 82, 60, 6);
    ctx.fillStyle = rgba(rd.world.theme.rim, 0.5); ctx.fillRect(x - 30, y - 82, 60, 1);
    ctx.save(); ctx.translate(x, y - 76); ctx.rotate(this.swing * 0.35);
    ctx.strokeStyle = '#2a2016'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 10); ctx.stroke();
    if (this.rung || this.glow > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35 + this.glow * 0.5 + Math.sin(this.t * 2) * 0.05; ctx.drawImage(Sprites.glow('#ffcf8a'), -40, 0, 80, 80); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    ctx.fillStyle = bronzeFill(ctx, 0, 10, 30, 30, this.rung ? 0.08 : -0.1); bellPath(ctx, 0, 10, 30, 30); ctx.fill();
    ctx.strokeStyle = this.rung ? 'rgba(255,230,180,0.8)' : 'rgba(255,230,180,0.3)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-10, 26); ctx.lineTo(10, 26); ctx.moveTo(-12, 32); ctx.lineTo(12, 32); ctx.stroke();

}

const ZHI_DIMS = { TH: 10.5, SH: 10.5, TORSO: 12, NECK: 2.3, HEAD: 4.7, UA: 8, FA: 7.6, SWORD: 0, HIP: 21 };
class ZhiBai {
  constructor(game, x, y) {
    this.game = game; this.x = x; this.y = y; this.px = x; this.py = y; this.face = -1; this.t = 0;
    this.alpha = 0; this.target = 1; this.mode = 'stand'; this.follow = false; this.fade = 0.3; this.bob = 0;
    this.hair = new Rope(7, 4, x, y - 40); this.robe = new Rope(5, 5, x, y - 20); this.visible = true;
  }
  update(dt) {
    this.px = this.x; this.py = this.y; this.t += dt;
    this.alpha = approach(this.alpha, this.target, dt * 1.2);
    const p = this.game.player;
    if (this.follow && p) {
      const tx = p.x - p.face * 46, ty = p.y - 6;
      this.x = expDecay(this.x, tx, 2.2, dt); this.y = expDecay(this.y, ty, 2.6, dt);
      this.face = sign(p.x - this.x) || this.face;
    }
    const w = this.game.world.theme.wind || 0.3;
    this.hair.update(this.x - this.face * 2, this.y - (this.mode === 'kneel' ? 32 : 43) + Math.sin(this.t) * 1, dt, 300, w * 60 + noise1(this.t) * 50 - (this.x - this.px) * 60, 0, 0.93, 2);

  }
  draw(ctx, a) {
    if (!this.visible || this.alpha <= 0.01) return;
    const x = lerp(this.px, this.x, a), y = lerp(this.py, this.y, a) + Math.sin(this.t * 1.5) * (this.follow ? 2 : 0);
    const pose = this.mode === 'kneel' ? mkPose({ lean: 0.2, head: 0.3, bob: 10, lF: 1.3, kF: 2.3, lB: 0.3, kB: 2.5, aF: 0.2, eF: 0.4, aB: -0.3, eB: 0.2 }) : mkPose({ lean: 0.03, head: 0.05, aF: 0.15, eF: 0.2, aB: -0.1, eB: 0.2, lF: 0.08, kF: 0.05, lB: -0.05, kB: 0.05 });
    const J = solvePose(pose, x, y, this.face, ZHI_DIMS);

    const A = this.alpha * fl;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = A * 0.35; ctx.drawImage(Sprites.glow('#dff7ff'), J.chest[0] - 44, J.chest[1] - 44, 88, 88); ctx.globalCompositeOperation = 'source-over';
    const body = 'rgba(200,225,230,0.18)';
    const edge = '#f4fbff';
    for (let pass = 0; pass < 2; pass++) {
      ctx.globalAlpha = pass === 0 ? A * 0.8 : A;
      const c = pass === 0 ? edge : body;
      ctx.save(); if (pass === 0) ctx.translate(-0.8, -0.8);
      R.ribbon(ctx, this.hair, 6, 1.5, c);
      // robe
      ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(J.hip[0] - 5, J.hip[1] - 2); ctx.lineTo(J.hip[0] + 5, J.hip[1] - 2);

      R.torso(ctx, J, 4.2, 5, c);
      R.line(ctx, [J.shB, J.elB, J.haB], 2.4, c); R.line(ctx, [J.shF, J.elF, J.haF], 2.4, c);
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(J.head[0], J.head[1], 4.7, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // erased edge: one side dissolving into white
    ctx.globalAlpha = A * 0.5 * this.fade;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(Sprites.glow('#ffffff'), J.hip[0] - this.face * 10 - 16, J.hip[1] - 26, 32, 50);

class MB {
  constructor(w, h) { this.w = w; this.h = h; this.g = Array.from({ length: h }, () => Array(w).fill(' ')); }
  set(x, y, c) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.g[y][x] = c; return this; }
  fill(x, y, w, h, c) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) this.set(xx, yy, c); return this; }
  clear(x, y, w, h) { return this.fill(x, y, w, h, ' '); }
  ground(x0, x1, row, c = '#') { return this.fill(x0, row, x1 - x0 + 1, this.h - row, c); }
  put(x, y, c) { return this.set(x, y, c); }
  hline(x0, x1, y, c) { return this.fill(x0, y, x1 - x0 + 1, 1, c); }
  vline(x, y0, y1, c) { return this.fill(x, y0, 1, y1 - y0 + 1, c); }
  rows() { return this.g.map((r) => r.join('')); }
}

// ============================================================
//  BOSS — 懸鐘之母 (the Hanging-Bell Mother)
// ============================================================
const BW = 190, BH = 170;
class Mother {
  constructor(game, anchor) {
    this.game = game;
    this.pvx = anchor.x; this.pvy = anchor.ty * T + T;
    const W = game.world; let ty = anchor.ty + 1; while (ty < W.h && !W.solid(anchor.tx, ty)) ty++;
    this.floorY = ty * T;
    this.Lrest = this.floorY - 110 - BH - this.pvy;
    this.Lswing = this.floorY - 36 - BH - this.pvy;
    this.Lslam = this.floorY - BH - this.pvy + 2;
    this.Lrise = Math.max(60, this.Lrest - 150);
    this.L = this.Lrest; this.ang = 0; this.angV = 0; this.tAng = 0;
    this.hp = 720; this.maxHp = 720; this.name = '懸鐘之母'; this.isBoss = true;
    this.state = 'dormant'; this.st = 0; this.phase = 0; this.active = false;
    this.body = 1; this.tBody = 1;        // 1 = hanging out, 0 = tucked inside the bell
    this.arm = null; this.flash = 0; this.shake = 0; this.cool = 1.5; this.combo = [];
    this.hair = []; for (let i = 0; i < 6; i++) this.hair.push(new Rope(7, 7, this.pvx, this.pvy + this.L + BH));
    this.robe = []; for (let i = 0; i < 5; i++) this.robe.push(new Rope(5, 9, this.pvx, this.pvy + this.L + BH + 30));
    this.cracked = 0; this.dead = false; this.tolls = 0; this.summoned = false; this.lastHit = -1; this.atkSeq = 0;
    this.dormantT = 0; this.nameFade = 0; this.crawl = 0; this.crawlSide = 1; this.exposed = 0; this.tide = null; this.t = 0;
    this.prevMouth = this.mouth();
  }
  crown() { return [this.pvx + Math.sin(this.ang) * this.L, this.pvy + Math.cos(this.ang) * this.L]; }
  mouth() { const [cx, cy] = this.crown(); return [cx + Math.sin(this.ang) * BH, cy + Math.cos(this.ang) * BH]; }
  axisPt(k) { const [cx, cy] = this.crown(); return [cx + Math.sin(this.ang) * BH * k, cy + Math.cos(this.ang) * BH * k]; }
  player() { return this.game.player; }
  setState(s) { this.state = s; this.st = 0; }
  // ---------- damage intake ----------
  hurtTargets() {
    if (this.dead || !this.active) return [];
    if (!this._tg) {
      const self = this;
      this._tg = {
        crawl: { rect: () => { const [mx] = self.mouth(), side = self.crawlSide, ex = mx + side * (BW * 0.42 + 26 * self.crawl); return { x: ex - 26, y: self.floorY - 60, w: 52, h: 60 }; }, hurt: (d, i) => self.takeHit(d * 1.15, i, 'body') },
        body: { rect: () => { const [mx, my] = self.mouth(); return { x: mx - 21, y: my - 4, w: 42, h: 78 * self.body }; }, hurt: (d, i) => self.takeHit(d, i, 'body') },
        bell: { rect: () => { const [a, b] = self.axisPt(0.55); return { x: a - 62, y: b - 60, w: 124, h: 110 }; }, hurt: (d, i) => self.takeHit(d, i, 'bell') }
      };
    }
    const out = [];
    if (this.state === 'grounded' || (this.state === 'stagger' && this.L >= this.Lslam - 4)) out.push(this._tg.crawl);
    else if (this.body > 0.3) out.push(this._tg.body);
    out.push(this._tg.bell);
    return out;
  }
  takeHit(dmg, info, part) {
    if (this.dead) return 'none';
    let k = part === 'bell' ? 0.3 : 1;
    if (this.state === 'stagger') k *= 1.35;
    this.hp -= dmg * k; this.flash = 0.1; this.shake = 0.15;
    if (part === 'bell') { Snd.play('note', { m: pick([50, 53, 57, 62]), gain: 0.18, gap: 90 }); this.angV += (info.dir || 1) * 0.12; }
    this.game.player.ult = Math.min(100, this.game.player.ult + (part === 'bell' ? 2 : 4));
    this.checkPhase();
    return 'hit';
  }
  hitByProj(q) {
    if (this.dead || !this.active) return false;
    const [mx, my] = this.mouth(), [bx, by] = this.axisPt(0.5);
    if (Math.hypot(q.x - mx, q.y - (my + 30)) < 44 || Math.hypot(q.x - bx, q.y - by) < 80) {
      this.hp -= 34; this.flash = 0.15; this.shake = 0.25;
      FX.impact(q.x, q.y, sign(q.vx), true, '#f1cf66'); Snd.play('hit', { heavy: true }); this.game.hitstop(0.08);
      if (this.state === 'tollPrep' || this.state === 'toll') { this.setState('stagger'); this.tBody = 0.6; }
      this.checkPhase();
      return true;
    }
    return false;
  }
  onUlt() { if (this.dead || !this.active) return; this.hp -= 80; this.flash = 0.2; this.setState('stagger'); this.checkPhase(); }
  onParried(b) {
    if (b.kind === 'sweep' || b.kind === 'grab') {
      this.arm = null; this.setState('stagger'); this.game.cam.shake(0.4);
      Snd.play('scream'); FX.parry(b.x + b.w / 2, b.y + b.h / 2);
    }
  }
  checkPhase() {

  // ---------------- MAP LOADING ----------------

        case 'n': if (!killed[kid]) this.addEnemy(new Knight(this, s.x, s.y), kid); break;
        case 'm': if (!killed[kid]) { for (let i = 0; i < 3; i++) this.addEnemy(new Moth(this, s.x + (i - 1) * 26, s.y - i * 10), kid + '#' + i); } break;
        case 'B': if (!killed[kid]) { const b = new Bearer(this, s.x, s.y); b.face = -1; this.addEnemy(b, kid); this.bearer = b; } break;
        case 'K': W.props.push(new CheckBell(this, s)); break;
        case '*': { const n = new NameShard(this, s); if (!n.remove) W.props.push(n); break; }
        case 'H': { const h = new BellHeart(this, s); if (!h.remove) W.props.push(h); break; }
        case 'E': { const e = new EchoProp(this, s, def.echo); if (!e.remove) W.props.push(e); break; }
        case 'g': W.props.push(new PogoBell(this, s)); break;
        case 'X': if (def.knell) { const k = new Knell(this, s); W.props.push(k); this.knell = k; } if (def.boss) this.bossAnchor = s; break;
        case 'L': W.props.push(new Lantern(this, s)); break;
        case 'c': W.props.push(new ChainDecor(this, s)); break;
        case 'b': W.props.push(new Banner(this, s)); break;
        case 'T': W.props.push(new Trace(this, s)); break;

        case 'Q': W.props.push(new MusicBoxProp(this, s)); break;
        case 'F': W.props.push(new DoorframeProp(this, s)); break;
        case 'h': { const hz = def.pendulums && def.pendulums[s.tx + ',' + s.ty] || {}; W.hazards.push(new Pendulum(this, s.x, s.ty * T, hz.len || 150, hz.amp || 1.0, hz.speed || 1.6, hz.phase || 0)); break; }
        case 'r': W.hazards.push(new Crusher(this, s.x, s.ty * T, (s.tx * 0.37) % 3)); break;
        case 'f': W.hazards.push(new Vent(this, s.x, s.y, (s.tx * 0.53) % 3.2)); break;
        case 'Z': { const z = new ZhiBai(this, s.x, s.y); W.npcs.push(z); this.zhi = z; z.alpha = 0; z.target = 0; break; }
        case 'Y': { const y = new YueZheng(this, s.x, s.y); W.npcs.push(y); this.yue = y; break; }
        case 'N': W.npcs.push(new KnightNPC(this, s.x, s.y, -1)); break;
        default:
          if (def.triggers && def.triggers[s.ch]) W.props.push(new TriggerZone(this, s, { id: s.ch, ...def.triggers[s.ch] }));
      }
    }

    this.cam.setView(this.render.aspect || 16 / 9);
    this.cam.snap(W, p);
    if (def.music) Music.play(def.music);

  }
  addEnemy(e, kid) { e.kid = kid; this.world.enemies.push(e); return e; }
  addProj(p) { this.world.projectiles.push(p); }
  enemyNear(x, y, r) { for (const e of this.world.enemies) if (!e.dead && Math.abs(e.x - x) < r && Math.abs(e.y - y) < 80) return true; return false; }

  // ---------------- COMBAT RESOLUTION ----------------
  playerHits(p) {
    const box = p.atkBox(), a = p.atk, heavy = !!a.heavy;
    const info = { dir: p.face, kb: a.kb, heavy, rip: p.atkName === 'rip', down: p.atkName === 'down' };
    let landed = null;
    const test = (target) => {
      if (p.hitSet.has(target)) return;
      const r = target.rect ? target.rect() : null; if (!r) return;
      if (!rectsOverlap(box, r)) return;
      p.hitSet.add(target);
      const res = target.hurt(a.dmg, info);
      if (res === 'none') return;
      const cx = clamp(p.x + p.face * 26, r.x, r.x + r.w), cy = clamp(p.y - 26, r.y, r.y + r.h);
      if (res === 'hit') {
        const isEnemy = !(target instanceof Prop);
        if (isEnemy) {
          FX.impact(cx, cy, p.face, heavy || info.rip);
          Snd.play('hit', { heavy: heavy || info.rip, gap: 0 });
          this.hitstop(info.rip ? 0.13 : heavy ? 0.075 : 0.045);
          this.cam.shake(info.rip ? 0.4 : heavy ? 0.2 : 0.1);
          if (info.rip) { this.render.flash('#fff6d8', 0.35); FX.parry(cx, cy); }
          if (navigator.vibrate && this.settings.vibrate) try { navigator.vibrate(heavy ? 25 : 12); } catch (e) {}
        } else { this.hitstop(0.03); FX.spark(cx, cy, p.face, 6, '#ffe7b8'); }
        landed = landed || 'hit';
      } else if (res === 'block') {
        FX.spark(cx, cy, -p.face, 10, '#ffd08a', 420); FX.star(cx, cy, 30, '#ffe0a0', 0.1);
        Snd.play('block', { gap: 0 }); this.hitstop(0.05); this.cam.shake(0.1);
        landed = landed || 'block';
      }
    };
    for (const e of this.world.enemies) if (!e.dead) test(e);
    if (this.boss && this.boss.hurtTargets) for (const t of this.boss.hurtTargets()) test(t);
    for (const pr of this.world.props) if (pr.hurt) test(pr);
    // projectiles can be cut
    for (const pr of this.world.projectiles) if (pr instanceof RingShot && !pr.reflected && !p.hitSet.has(pr)) {
      if (box.x < pr.x + pr.r && box.x + box.w > pr.x - pr.r && box.y < pr.y + pr.r && box.y + box.h > pr.y - pr.r) { p.hitSet.add(pr); pr.pop(); Snd.play('hit', { gap: 0 }); FX.spark(pr.x, pr.y, p.face, 6); if (a === ATK.down) landed = landed || 'hit'; }
    }
    // breakable walls & pogo on spikes
    const tx0 = Math.floor(box.x / T), tx1 = Math.floor((box.x + box.w) / T), ty0 = Math.floor(box.y / T), ty1 = Math.floor((box.y + box.h) / T);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const t = this.world.tile(tx, ty);
      if (t === TL.BREAK && !p.hitSet.has('b' + tx + ',' + ty)) { p.hitSet.add('b' + tx + ',' + ty); this.world.breakAt(tx, ty); this.hitstop(0.04); landed = landed || 'hit'; }
      if (info.down && (t === TL.SPIKE) && !landed) { landed = 'hit'; FX.spark(tx * T + 16, ty * T + 16, 0, 8, '#ffe0a0'); Snd.play('block', { gap: 0 }); }
    }
    if (landed) p.onHitLanded(landed, heavy);
  }
  resolveEnemyAttacks() {
    const p = this.player;
    if (!p || p.state === 'dead' || p.state === 'void') return;
    const pr = p.rect();
    const tryHit = (src, box, dmg, parryable, kb, fromX, onParry) => {
      if (!rectsOverlap(pr, box)) return false;
      if (p.parryActive() && parryable) { this.parrySuccess(src, fromX, onParry); return true; }
      return p.damage(dmg, fromX, { kb });
    };
    for (const e of this.world.enemies) {
      if (e.dead || !e.atkBox) continue;
      if (e.lastHitAtk === e.atkId) continue;
      if (tryHit(e, e.atkBox, e.atkBox.dmg, e.atkBox.parry, e.atkBox.kb, e.x, () => e.onParried())) e.lastHitAtk = e.atkId;
    }
    if (this.boss && this.boss.attackBoxes) for (const b of this.boss.attackBoxes()) {
      if (b.src.lastHit === b.id) continue;
      if (tryHit(this.boss, b, b.dmg, b.parry, b.kb || 280, b.fromX, () => this.boss.onParried(b))) b.src.lastHit = b.id;
    }
    // contact damage (light)
    for (const e of this.world.enemies) {
      if (e.dead || e instanceof WeepBell || e instanceof Moth) continue;
      if (e instanceof Bearer && e.active && rectsOverlap(pr, e.rect()) && p.inv <= 0) p.damage(1, e.x, { kb: 260 });
    }
    // projectiles
    for (const q of this.world.projectiles) {
      if (q.remove) continue;
      if (q instanceof RingShot) {
        if (q.reflected) continue;
        const cx = clamp(q.x, pr.x, pr.x + pr.w), cy = clamp(q.y, pr.y, pr.y + pr.h);
        if (Math.hypot(cx - q.x, cy - q.y) < q.r) {
          if (p.parryActive()) { q.reflect(); this.parrySuccess(null, q.x, null, true); }
          else if (p.damage(1, q.x)) q.pop();
        }
      } else if (q instanceof Shockwave) {
        if (rectsOverlap(pr, q.box())) p.damage(q.dmg, q.x - q.dir * 20, { kb: 240, up: 300 });
      } else if (q instanceof TollWave) {
        const d = Math.hypot(p.x - q.x, p.y - 22 - q.y);
        if (!q.hitDone && Math.abs(d - q.r) < 14) { if (p.damage(1, q.x, { kb: 300 })) q.hitDone = true; }
      } else if (q.hits) q.hits(p, pr);
    }
  }
  parrySuccess(src, fromX, onParry, proj) {
    const p = this.player;
    p.onParry();
    const x = p.x + p.face * 14, y = p.y - 28;
    FX.parry(x, y);
    Snd.play(proj ? 'reflect' : 'parry', { gap: 0 });

    this.hud.refresh();

  }
  fireUlt(p) {

  startEcho(ep) { this.runScript('echo', ep); }
  hazardHit(kind) {

      this.cam.snap(this.world, p);

      if (this.zhi && this.zhi.follow) { this.zhi.x = p.x - 40; this.zhi.y = p.y; }
      if (kind === 'white' && !this.save.flags.whiteTalk && this.zhi && this.zhi.follow) { this.save.flags.whiteTalk = 1; this.ui.sub('沈知白', '白色的地方，就是被忘乾淨的地方。掉下去，你也會被忘掉一點。', 5); }
    });

const SCRIPTS = {};

SCRIPTS.hint = function* (g, src) { g.hint(src.def.key, src.def.dur || 8); };

SCRIPTS.intro = function* (g) {
  g.ui.show(false);
  $('fade').style.background = '#000'; $('fade').style.opacity = 1;
  Music.play('prologue');
  yield g.ui.prologue(STORY.prologueCard);
  g.loadMap('prologue', 'P', { silent: true, newPlayer: true });
  const p = g.player, z = g.zhi, y = g.yue, k = g.knell;
  z.mode = 'kneel'; z.alpha = 1; z.target = 1; z.face = -1; z.visible = true; z.fade = 0.15;
  y.face = -1;
  p.locked = true; p.face = 1;
  g.cam.focus = { x: 21 * T, y: p.y - 64 };
  g.cam.snap(g.world, p);
  g.ui.letterbox(true);
  yield g.ui.fade(null, 0, 2.2);
  yield 1.2;
  yield g.say('岳徵', '罪人沈知白，司憶院拓碑人。私拓禁名三千零一十二，犯私憶罪。');
  yield g.say('岳徵', '依《司憶律》第一條——抹名。');
  yield g.say('岳徵', '第七抹名者，魏子葳。行刑。');
  p.cutVX = 80; yield until(() => p.x > 18.1 * T); p.cutVX = 0;
  yield 0.6;
  z.face = -1;
  yield g.say('沈知白', '魏子葳。');
  yield g.say('沈知白', '那三千零一十二個名字，是我從磨平的碑上，一道刻痕、一道刻痕拓回來的。');
  yield g.say('沈知白', '其中一個，叫魏子苓。');
  yield 0.9;
  yield g.say('魏子葳', '……同姓的人很多。');
  yield g.say('沈知白', '那你敲吧。');
  g.ui.letterbox(false);
  k.ready = true;
  p.locked = false;
  g.ui.show(true); g.ui.refresh();
  g.ui.hint('attack', 30);
  $('hint').innerHTML = `靠近抹名鐘，按 ${keyLabel('attack')} 行刑`;
  yield onEvent('knell');
  g.ui.hideHint(); g.save.flags.hint_attack_done = 0;
  p.locked = true; p.cutVX = 0;
  // first toll
  Snd.play('toll', { f: 98, dur: 7, gain: 0.85 });
  g.cam.shake(0.45); g.flash('#dfe6ff', 0.35);
  FX.ring(k.x, k.y - 110, 10, 520, '#dfe6ff', 1.8, 5);
  z.fade = 1;
  yield 1.9;
  // the crack
  Snd.play('crack'); k.cracked = 1; g.cam.shake(1); g.flash('#ffffff', 1); g.hitstop(0.3);
  for (let i = 0; i < 40; i++) FX.whiteMote(k.x + rand(-40, 40), k.y - rand(40, 140), 220);
  FX.ring(k.x, k.y - 100, 10, 800, '#ffffff', 1.2, 8);
  yield 0.5;
  g.ui.sub('岳徵', '——鐘裂了！', 2.4);
  Music.play('none');
  g.noHazard = true;
  // the White erupts, the platform shatters outward from the knell
  const W = g.world;
  for (let r = 0; r < 10; r++) {
    for (const tx of [20 - r, 20 + r, 19 - r]) for (let ty = 16; ty <= 21; ty++) {
      if (tx > 29 || tx < 10) continue;
      if (tx < 0 || tx >= W.w) continue;
      const i = W.idx(tx, ty); if (W.tiles[i]) { W.tiles[i] = TL.AIR; if (ty < 18) FX.debris(tx * T + 16, ty * T + 16, W.theme, 3); }
    }
    g.render.invalidateTiles();
    for (let i = 0; i < 6; i++) FX.whiteMote(20 * T + rand(-r * 32, r * 32), 16 * T + rand(0, 60), 260);
    g.cam.shake(0.2);
    if (r === 4) { g.ui.sub('沈知白', '記住我的名字。', 3); z.target = 0; }
    yield 0.07;
  }
  k.remove = true;
  for (const n of W.npcs) if (n !== z) n.alpha = 0.001;
  g.cam.focus = null;
  yield until(() => p.y > 24 * T);
  Snd.play('whiteout');
  yield g.ui.fade('#ffffff', 1, 0.9);
  yield 0.8;
  g.ui.show(false);
  $('fade').style.background = '#000';
  yield g.ui.card(STORY.chapterCard.no, STORY.chapterCard.name, STORY.chapterCard.sub);
  g.noHazard = false;
  g.loadMap('ash', 'P', { silent: true });
  const p2 = g.player; p2.locked = true; p2.face = 1;
  g.ui.fade(null, 0, 1.6);
  yield until(() => p2.grounded);
  p2.state = 'kneel';
  g.cam.shake(0.5);
  yield 2.2;
  p2.state = 'move';
  yield 0.4;
  yield g.say('', '（……這是什麼地方。）');
  p2.locked = false;
  g.ui.show(true); g.ui.refresh();
  g.ui.toast('灰市', '下鐘城');
  g.writeSave();
};

SCRIPTS.ash_knight = function* (g, src) {
  const p = g.player;
  const k = g.addEnemy(new Knight(g, 111.5 * T, p.y - 280), 'ash:knight1');
  k.aggro = true; k.face = -1; k.cool = 2.2;
  yield until(() => k.grounded);
  g.cam.shake(0.35); Snd.play('slam'); FX.dust(k.x, k.y, 12, g.world.theme, 1.5);
  yield 0.3;
  yield g.say('聽鐘騎士', '目標：第七抹名者，已受污染。就地清除。');
  if (g.zhi) { yield g.say('沈知白', '他們不是來救你的。'); yield g.say('魏子葳', '我知道。'); }
  g.hint('parry', 9);
  const t0 = g.realT;

  yield 1.2;
  if (g.zhi) { g.ui.sub('沈知白', '……他們以前是你的同袍。', 3.4); yield 3.6; g.ui.sub('魏子葳', '現在不是。', 2.6); }
};

function setTiles(g, list, t) { const W = g.world; for (const [x, y] of list) W.tiles[W.idx(x, y)] = t; g.render.invalidateTiles(); }
function rectTiles(x, y, w, h) { const a = []; for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) a.push([xx, yy]); return a; }

  yield g.say('負鐘者', '附加目標：第七抹名者。');
  if (g.zhi) yield g.say('沈知白', '司憶院派人下來了。他們在清掃這裡剩下的東西——連灰都不留。');
  g.cam.focus = null; g.cam.lock = { x: 71 * T, y: 0, w: 35 * T, h: 34 * T };
  b.active = true; b.face = -1; b.cool = 1.0;
  g.ui.bossBar(b, '負鐘者');
  Music.play('boss'); Music.intensity = 0;
  p.locked = false;
  yield onEvent('bossDown');
  g.ui.bossBar(null);
  g.whisper(b.x, b.y - 100, '……清掃……未……完成……');
  yield 1.4;
  Music.play('forge');
  setTiles(g, gates, TL.AIR); g.cam.lock = null;
  g.save.flags[g.world.id + ':' + src.def.id] = 1; g.writeSave();
  if (g.zhi) { yield 0.8; g.ui.sub('沈知白', '他也是被抹過的人。你看他的臉。', 4.5); }
};
SCRIPTS.forge_exit = function* (g) { if (g.zhi) g.ui.sub('沈知白', '上去就是懸鐘塔。', 3.5); };

// ---------------- 懸鐘廳 ----------------
SCRIPTS.belfry_load = function* (g) {
  g.world.arenaX0 = 22 * T; g.world.arenaX1 = 52 * T;
  g.boss = new Mother(g, g.bossAnchor);
};
SCRIPTS.belfry_respawn = SCRIPTS.belfry_load;
SCRIPTS.belfry_pre = function* (g) {
  const p = g.player; p.locked = true; p.cutVX = 0;
  yield 0.6;
  if (g.save.flags.readLetter) {
    yield g.say('沈知白', '那封信上說，懸鐘的鐘聲會一路傳到上城。');
    yield g.say('沈知白', '你每天都聽得見她。只是你不知道，那是她。');
    yield 1.2;
  }
  yield g.say('沈知白', '你可以不上去。');
  yield g.say('魏子葳', '往上的路只剩一條。');
  yield g.say('沈知白', '……我知道。');
  yield g.say('沈知白', '魏子葳。你行刑三百一十一次，一次都沒有猶豫過。');
  yield g.say('魏子葳', '這次也不會。');
  p.locked = false;
  yield 1.0;
  g.ui.sub('沈知白', '……說謊。', 3);
};
SCRIPTS.belfry_fight = function* (g, src) {
  const b = g.boss, p = g.player;
  if (!b) return;
  p.locked = true; p.cutVX = 0;
  setTiles(g, rectTiles(21, 16, 1, 3), TL.SOLID); Snd.play('slam');
  if (g.zhi) { g.zhi.follow = false; g.zhi.target = 0.35; }
  g.cam.lock = { x: 21 * T, y: 0, w: 32 * T, h: 24 * T }; g.cam.tzoom = 0.74; g.cam.feet = 0.86;
  g.liveCutscene = true;
  const retry = !!g.save.flags.motherSeen; g.save.flags.motherSeen = 1;
  yield retry ? 0.4 : 1.0;
  b.dormantT = 99;
  Snd.play('toll', { f: 55, dur: 9, gain: 0.9 }); g.cam.shake(0.5);
  yield retry ? 0.6 : 1.6;
  Snd.play('scream');
  if (!retry) { g.ui.toast('懸鐘之母', '十二年來，不曾停過的鐘聲', 4); yield 1.4; }
  Music.play('boss'); Music.intensity = 0;
  b.active = true; b.phase = 1; b.setState('idle'); b.cool = 1.0;
  g.ui.bossBar(b, '懸鐘之母');
  p.locked = false; g.liveCutscene = false;
  yield onEvent('bossDown');
  g.save.flags[g.world.id + ':' + src.def.id] = 1;
  g.runScript('mother_down');
};
SCRIPTS.mother_down = function* (g) {
  const b = g.boss, p = g.player;
  g.ui.bossBar(null); Music.play('none');
  for (const e of g.world.enemies) if (!e.dead) e.hurt(999, { dir: 1 });
  g.world.projectiles.length = 0;
  p.locked = true; p.cutVX = 0; p.inv = 99; g.liveCutscene = true;
  g.slowmo(1.4, 0.2); g.flash('#ffffff', 0.9);
  Snd.play('toll', { f: 55, dur: 10, gain: 1 });
  b.cracked = 1;
  yield 2.2;
  // the bell falls; she lies beside it
  b.falling = true;
  const fall = () => new Promise((res) => { const t0 = performance.now(); const tick = () => { const u = Math.min(1, (performance.now() - t0) / 700); b.L = lerp(b.L, b.Lslam, u * u); if (u < 1) requestAnimationFrame(tick); else res(); }; tick(); });
  yield fall();
  Snd.play('slam'); Snd.play('crack'); g.cam.shake(0.9);
  b.crawlSide = sign(p.x - b.mouth()[0]) || -1; b.crawl = 1; b.state = 'dying'; b.maskOff = true;
  yield 1.6;
  const [mx] = b.mouth();
  g.cam.focus = { x: (p.x + mx + b.crawlSide * 110) / 2, y: b.floorY - 70 };
  g.ui.letterbox(true);
  p.cutVX = sign(mx + b.crawlSide * 120 - p.x) * 60;
  yield until(() => Math.abs(p.x - (mx + b.crawlSide * 150)) < 20);
  p.cutVX = 0; p.autoFace = -b.crawlSide;
  Music.play('sad');
  yield 1.2;
  yield g.say('母親', '……子葳？');
  yield 1.0;
  yield g.say('母親', '你長這麼高了。');
  yield 1.2;
  p.state = 'kneel';
  yield g.say('魏子葳', '……');
  yield 0.8;
  yield g.say('母親', '苓……在上面……');
  yield g.say('母親', '在……鐘裡……');
  yield 1.0;
  b.fadeOut = 0.001;
  for (let i = 0; i < 60; i++) { FX.whiteMote(mx + b.crawlSide * 130 + rand(-30, 30), b.floorY - rand(0, 60), 60); if (i % 6 === 0) yield 0.1; }
  yield 2.2;
  g.ui.show(false);
  const E = STORY.echoes.recall;
  yield g.ui.vignette(E.lines, E.skill, E.desc);
  g.save.abilities.recall = true; p.abilities.recall = true; g.writeSave();
  g.ui.show(true); g.ui.refresh();
  p.state = 'move';
  g.ui.letterbox(false); g.cam.focus = null;
  g.cam.shake(0.6); Snd.play('crumble'); Snd.play('whiteout');
  if (g.zhi) { g.zhi.follow = true; g.zhi.target = 0.9; g.ui.sub('沈知白', '鐘停了——整條街都撐不住了！快走！', 3); }
  yield 1.4;
  g.boss = null; g.liveCutscene = false;
  g.save.bell = null;
  p.locked = false; p.inv = 0;
  g.gotoMap('escape', 'P');
};

// ---------------- 歸途 ----------------
const MEMORIES = ['子葳，帶妹妹回家吃飯。', '哥，你看我跳得比你高！', '鐘聲會一路傳到上城的。', '葳　九歲', '別跑那麼快。', '晚飯好了——', '苓，把碗放下。', '今天鐘敲了幾下？', '哥哥什麼時候回來', '媽，我聽見了。'];
SCRIPTS.escape_start = function* (g) {
  const W = g.world;
  W.tideY = W.ph + 60; W.tideSpeed = 24; W.tideMax = 56; W.tideAcc = 1.0;
  Music.play('escape');
  g.hint('recall', 9);
  if (g.zhi) g.ui.sub('沈知白', '往上！別回頭！', 3);
  let k = 0;
  while (g.world === W && W.tideY !== null) {
    yield 2.2;
    const p = g.player;
    if (g.world !== W || W.tideY === null) break;
    FX.text(p.x + rand(-160, 160), p.y - rand(40, 140), MEMORIES[k++ % MEMORIES.length], { size: 11, color: '#ffffff', dur: 4, vy: -10, alpha: 0.75 });
    // the White swallows what lies below
    const ty = Math.floor(W.tideY / T) - 1;
    for (let tx = 0; tx < W.w; tx++) { const i = W.idx(tx, Math.max(0, ty)); if (ty > 0 && ty < W.h && W.tiles[i] !== TL.AIR && W.tiles[i] !== TL.WHITE && tx > 1 && tx < W.w - 2) { if (Math.random() < 0.5) FX.debris(tx * T + 16, ty * T + 16, W.theme, 1); } }
  }
};
SCRIPTS.escape_respawn = function* (g) { g.runScript('escape_start'); };
SCRIPTS.epilogue = function* (g) {
  const W = g.world, p = g.player;
  W.tideSpeed = 0; W.tideAcc = 0; W.tideMax = 0;
  p.locked = true; p.cutVX = 0; p.inv = 99;
  Music.play('none');
  g.ui.hideHint();
  yield 1.2;
  g.ui.letterbox(true); g.ui.show(false);
  g.cam.focus = { x: p.x - 60, y: p.y - 80 };
  const z = g.zhi;
  if (z) { z.follow = false; z.x = p.x - 70; z.y = p.y; z.face = 1; z.target = 0.55; z.fade = 1.2; }
  yield 1.4;
  yield g.say('魏子葳', '沈知白。');
  if (z) { z.target = 0.9; z.fade = 0.4; }
  yield g.say('沈知白', '……我還沒忘。');
  yield g.say('魏子葳', '我知道。我只是怕我忘。');
  yield 1.6;
  // Yue Zheng and the knights
  Snd.play('clank'); yield 0.3; Snd.play('clank');
  const y = new YueZheng(g, p.x + 260, p.y); y.face = -1; g.world.npcs.push(y);
  const k1 = new KnightNPC(g, p.x + 310, p.y, -1), k2 = new KnightNPC(g, p.x + 340, p.y, -1);
  g.world.npcs.push(k1, k2);
  for (const n of [y, k1, k2]) { n.alpha = 0; }
  for (let i = 0; i <= 20; i++) { for (const n of [y, k1, k2]) n.alpha = i / 20; yield 0.04; }
  p.autoFace = 1;
  g.cam.focus = { x: p.x + 120, y: p.y - 80 };
  yield 1.0;
  yield g.say('岳徵', '……你見到她了。');
  yield g.say('魏子葳', '你知道。');
  yield g.say('岳徵', '我知道的，比你想的多。');
  yield 0.8;
  yield g.say('岳徵', '第七抹名者魏子葳。受忘潮污染，私通罪人。');
  yield g.say('岳徵', '司憶院判你——抹名。');
  yield 1.0;
  y.drawn = true; Snd.play('clank');
  yield g.say('岳徵', '可是抹名鐘，已經裂了。');
  yield g.say('岳徵', '所以這一次，我用刀。');
  yield 0.6;
  Snd.play('parry'); g.flash('#ffffff', 1);
  $('fade').style.background = '#000'; $('fade').style.opacity = 1;
  yield 2.0;
  g.save.done = true; g.writeSave();
  g.ui.show(false); g.ui.letterbox(false);
  Music.play('sad');
  g.state = 'end';
  Menus.endcard();
  $('fade').style.opacity = 0;
};

// ===== 17_main.js =====
// ============================================================
//  BOOT
// ============================================================
const game = new Game();
game.render = new Renderer($('cv'));
game.ui = new UI(game); game.hud = game.ui;
FX.bind(game);
game.layout = () => {
  Layout.update(game);
  game.render.resize(Layout.W, Layout.H);
  game.cam.setView(game.render.aspect);
  game.ui.refreshHint();
};
Menus.init(game);
Input.bindStick($('stick'), $('knob'));

// ---- touch routing (all touches go through the stage in local coords) ----
function interactive(t) { return t && t.closest && t.closest('button, input, .sheet-body, #endcard, a'); }
const root = $('root');
root.addEventListener('touchstart', (e) => {
  Snd.init();
  for (const t of e.changedTouches) {
    if (interactive(e.target)) { Input.setMode('touch'); continue; }
    const [lx, ly] = Layout.toLocal(t.clientX, t.clientY);
    if (game.ui._rubSkip && $('rub').classList.contains('on')) game.ui._rubSkip();
    if (game.ui._tapHandler) { game.ui._tapHandler('tap'); e.preventDefault(); continue; }
    if (game.ui.dlgState) { game.ui.advance(); e.preventDefault(); continue; }
    const play = game.state === 'play' && !document.querySelector('.menu.on, .sheet.on');
    if (Input.touchStart(e, lx, ly, t.identifier, play)) e.preventDefault();
    else if (play) e.preventDefault();
  }
  if (game.ui.hudOn) $('touch').classList.add('on');
}, { passive: false });
root.addEventListener('touchmove', (e) => {
  if (interactive(e.target)) return;
  for (const t of e.changedTouches) { const [lx, ly] = Layout.toLocal(t.clientX, t.clientY); Input.touchMove(lx, ly, t.identifier); }
  e.preventDefault();
}, { passive: false });
const tEnd = (e) => { for (const t of e.changedTouches) Input.touchEnd(t.identifier); };
root.addEventListener('touchend', tEnd); root.addEventListener('touchcancel', tEnd);
// mouse: clicks advance dialogue / taps on desktop
root.addEventListener('mousedown', (e) => {
  Snd.init();
  if (interactive(e.target)) return;
  if (game.ui._tapHandler) { game.ui._tapHandler('tap'); return; }
  if (game.ui.dlgState) game.ui.advance();
});
window.addEventListener('keydown', () => Snd.init(), { capture: true });
Input.onMode = (m) => { game.ui.refreshHint(); $('touch').classList.toggle('on', m === 'touch' && game.ui.hudOn); };
document.documentElement.dataset.input = Input.mode;

window.addEventListener('resize', () => game.layout());
window.addEventListener('orientationchange', () => setTimeout(() => game.layout(), 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => game.layout());
document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play') Menus.pause(); game.lastT = performance.now(); });
// block pinch-zoom / double-tap zoom on iOS
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

// dialogue typing runs on the frame clock
function loop(t) {
  try {
    if (game.ui.dlgState) game.ui.dialogTick(Math.min(0.1, (t - (loop.last || t)) / 1000));
    loop.last = t;
    game.frame(t);
    if (!loop.shown) { loop.shown = true; $('loading').classList.add('off'); }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}

async function boot() {
  game.layout();
  try {
    await Promise.race([
      Promise.all(['900 40px "Noto Serif TC"', '700 16px "Noto Serif TC"', '500 16px "Noto Serif TC"', '16px "Marcellus SC"'].map((f) => document.fonts.load(f, '抹名者鐘'))),
      sleep(2500)
    ]);
  } catch (e) {}
  Menus.showTitle();
  requestAnimationFrame(loop);
  // hot reload state for open viewers
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: game.save }));
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(() => boot()); else boot();

// ---- installable web version ----
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  Menus.deferredPrompt = e;
  if ($('title').classList.contains('on')) { $('m-install').hidden = false; $('m-note').textContent = Menus.noteText(); }
});
window.addEventListener('appinstalled', () => { Menus.deferredPrompt = null; $('m-install').hidden = true; });
document.addEventListener('fullscreenchange', () => setTimeout(() => game.layout(), 120));
if (window.__WEB && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

// test/debug hook
window.__game = game;
window.__dbg = { Input, FX, Snd, Music, MAPS, TUNE, Layout, STORY, THEMES, TL, T, World, Shade, Knight, WeepBell, Moth, Bearer };

})();
