<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>抹名者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one landscape stage, fixed to the viewport, rotated 90° when the phone is held upright; HUD in the corners, controls under the thumbs. */
:root{
  color-scheme: dark;
  --ink:#0b0d10; --ink-2:#15181d; --ink-3:#1f232a;
  --bone:#ebe4d3; --bone-dim:#a39c8b; --bone-faint:rgba(235,228,211,.14);
  --bronze:#c79852; --bronze-dim:#6f5431;
  --verdigris:#62c6b6; --ember:#e0643c; --parry:#f1cf66;
  --cjk:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --latin:"Marcellus SC","Cormorant SC",Georgia,serif;
  --s:1;
}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{color:var(--bone);font-family:var(--cjk);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#root{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
.layer{position:absolute;inset:0;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verdigris);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- HUD ---------- */
#hud{opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
.hud-tl{position:absolute;left:calc(var(--sl) + 14px*var(--s));top:calc(var(--st) + 10px*var(--s));display:flex;flex-direction:column;gap:calc(6px*var(--s))}
#hp{display:flex;gap:calc(3px*var(--s));align-items:flex-end}
.pip{width:calc(17px*var(--s));height:calc(20px*var(--s));position:relative}
.pip svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.pip .fill{fill:var(--bone);transition:fill .2s}
.pip .rim{fill:none;stroke:var(--bone);stroke-width:1.4}
.pip.empty .fill{fill:rgba(0,0,0,.45)}
.pip.empty .rim{stroke:rgba(235,228,211,.35)}
.pip.hit{animation:pipHit .5s}
@keyframes pipHit{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#ult{width:calc(120px*var(--s));height:calc(5px*var(--s));background:rgba(0,0,0,.55);border:1px solid rgba(199,152,82,.45);position:relative;overflow:hidden}
#ultFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--bronze-dim),var(--bronze));transition:width .15s}
#ult.full{border-color:var(--parry);box-shadow:0 0 calc(10px*var(--s)) rgba(241,207,102,.6)}
#ult.full #ultFill{background:linear-gradient(90deg,var(--bronze),var(--parry))}
.hud-row{display:flex;gap:calc(10px*var(--s));align-items:center}
#flask{pointer-events:auto;width:calc(40px*var(--s));height:calc(40px*var(--s));border-radius:50%;border:1.5px solid rgba(98,198,182,.55);background:rgba(8,14,16,.55);display:grid;place-items:center;position:relative;padding:0;cursor:pointer}
#flask svg{width:58%;height:58%}
#flaskN{position:absolute;right:-4px;bottom:-4px;font:700 calc(12px*var(--s)) var(--latin);background:var(--ink);border:1px solid rgba(98,198,182,.6);border-radius:9px;min-width:calc(17px*var(--s));height:calc(17px*var(--s));display:grid;place-items:center;font-variant-numeric:tabular-nums}
#flask.empty{opacity:.4}
#flask.busy{box-shadow:0 0 14px rgba(98,198,182,.7)}
.hud-tr{position:absolute;right:calc(var(--sr) + 12px*var(--s));top:calc(var(--st) + 10px*var(--s));display:flex;gap:calc(10px*var(--s));align-items:center}
#names{display:flex;align-items:center;gap:calc(6px*var(--s));font:500 calc(13px*var(--s)) var(--cjk);color:var(--bone);text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
#names b{display:grid;place-items:center;width:calc(22px*var(--s));height:calc(22px*var(--s));border:1px solid rgba(235,228,211,.6);font:900 calc(13px*var(--s)) var(--cjk);background:rgba(0,0,0,.5)}
#names.bump b{animation:pipHit .6s}
#pauseBtn{pointer-events:auto;width:calc(38px*var(--s));height:calc(38px*var(--s));border-radius:50%;border:1px solid rgba(235,228,211,.35);background:rgba(0,0,0,.45);display:grid;place-items:center;padding:0;cursor:pointer}
#pauseBtn i{display:block;width:calc(12px*var(--s));height:calc(13px*var(--s));border-left:3px solid var(--bone);border-right:3px solid var(--bone)}
#fps{position:absolute;left:50%;top:calc(var(--st) + 4px);transform:translateX(-50%);font:11px monospace;color:#9f9;opacity:.7}

#boss{position:absolute;left:50%;top:calc(var(--st) + 12px*var(--s));transform:translateX(-50%);width:min(52%,calc(460px*var(--s)));opacity:0;transition:opacity .6s;text-align:center}
#boss.on{opacity:1}
#bossName{font:900 calc(15px*var(--s)) var(--cjk);letter-spacing:.35em;text-shadow:0 2px 6px #000;margin-bottom:calc(5px*var(--s))}
#bossBar{height:calc(7px*var(--s));background:rgba(0,0,0,.6);border:1px solid rgba(235,228,211,.5);position:relative;overflow:hidden}
#bossLag{position:absolute;inset:0 auto 0 0;width:100%;background:#8a2f22;transition:width .8s .3s}
#bossFill{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,#b9b1a0,var(--bone))}

/* ---------- text overlays ---------- */
#toast{position:absolute;left:0;right:0;top:18%;text-align:center;opacity:0;transition:opacity 1s}
#toast.on{opacity:1}
#toast .t1{font:900 calc(34px*var(--s)) var(--cjk);letter-spacing:.5em;text-indent:.5em;text-shadow:0 2px 12px rgba(0,0,0,.9)}
#toast .t2{margin-top:calc(8px*var(--s));font:500 calc(13px*var(--s)) var(--cjk);letter-spacing:.2em;color:var(--bone-dim);text-shadow:0 1px 6px #000}
#toast .rule{width:calc(120px*var(--s));height:1px;margin:calc(10px*var(--s)) auto 0;background:linear-gradient(90deg,transparent,var(--bone),transparent)}

#hint{pointer-events:none;position:absolute;left:50%;top:calc(var(--st) + 15%);transform:translateX(-50%);max-width:60%;padding:calc(8px*var(--s)) calc(16px*var(--s));background:rgba(8,10,12,.72);border:1px solid rgba(235,228,211,.22);font:500 calc(14px*var(--s)) var(--cjk);letter-spacing:.05em;text-align:center;opacity:0;transition:opacity .35s;line-height:1.6}
#hint.on{opacity:1}
#hint kbd{font:700 calc(12px*var(--s)) var(--latin);border:1px solid var(--bone-dim);border-radius:3px;padding:0 5px;margin:0 2px;background:rgba(255,255,255,.06)}
#hint em{font-style:normal;color:var(--parry)}
#hint .k{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;border:1px solid var(--bone);font-weight:900;margin:0 2px;font-size:.9em}

#sub{pointer-events:none;position:absolute;left:50%;bottom:calc(var(--sb) + 12%);transform:translateX(-50%);max-width:58%;text-align:center;font:500 calc(15px*var(--s)) var(--cjk);line-height:1.6;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.9);opacity:0;transition:opacity .4s}
#sub.on{opacity:1}
#sub .who{color:var(--verdigris);margin-right:.5em;font-weight:700}
#sub.pickup{color:var(--bone)}
#sub.pickup .who{color:var(--parry)}

#dialog{position:absolute;left:50%;bottom:calc(var(--sb) + 5%);transform:translate(-50%,10px);width:min(74%,calc(720px*var(--s)));min-height:calc(78px*var(--s));padding:calc(14px*var(--s)) calc(22px*var(--s)) calc(16px*var(--s));background:linear-gradient(180deg,rgba(10,12,15,.9),rgba(6,7,9,.94));border-top:1px solid rgba(235,228,211,.35);border-bottom:1px solid rgba(235,228,211,.12);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#dialog.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dlgWho{font:900 calc(14px*var(--s)) var(--cjk);letter-spacing:.3em;color:var(--verdigris);margin-bottom:calc(6px*var(--s))}
#dlgWho.w-wei{color:var(--bone)}
#dlgWho.w-yue{color:var(--bronze)}
#dlgWho.w-mother{color:#f0e6ff}
#dlgWho.w-think{color:var(--bone-dim)}
#dlgText{font:500 calc(17px*var(--s)) var(--cjk);line-height:1.75;letter-spacing:.04em;min-height:1.75em}
#dlgText.think{color:var(--bone-dim);font-style:normal}
#dlgMore{position:absolute;right:calc(16px*var(--s));bottom:calc(10px*var(--s));width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--bone);opacity:0;animation:blink 1s infinite}
#dialog.done #dlgMore{opacity:1}
@keyframes blink{50%{opacity:.2}}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#letterbox::before,#letterbox::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s cubic-bezier(.3,.8,.3,1)}
#letterbox::before{top:0}#letterbox::after{bottom:0}
#letterbox.on::before,#letterbox.on::after{height:9%}

/* echo vignette & chapter card */
#vig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(14px*var(--s));background:radial-gradient(ellipse at center,rgba(10,20,22,.82),rgba(0,0,0,.96));opacity:0;transition:opacity .8s;pointer-events:none;padding-inline:8%}
#vig.on{opacity:1;pointer-events:auto}
#vig .ln{font:500 calc(18px*var(--s)) var(--cjk);letter-spacing:.12em;line-height:1.7;opacity:0;transform:translateY(6px);transition:opacity 1.2s,transform 1.2s;text-align:center;text-wrap:balance}
#vig .ln.on{opacity:1;transform:none}
#vig .ln.addr{font-weight:900;letter-spacing:.3em;color:var(--verdigris)}
#vig .skill{margin-top:calc(16px*var(--s));text-align:center;opacity:0;transition:opacity 1s}
#vig .skill.on{opacity:1}
#vig .skill .nm{font:900 calc(46px*var(--s)) var(--cjk);letter-spacing:.4em;text-indent:.4em;color:var(--verdigris);text-shadow:0 0 22px rgba(98,198,182,.55)}
#vig .skill .ds{margin-top:calc(8px*var(--s));font:500 calc(14px*var(--s)) var(--cjk);color:var(--bone-dim);max-width:34em;line-height:1.7}
#vig .tap{position:absolute;bottom:calc(var(--sb) + 7%);font:500 calc(12px*var(--s)) var(--cjk);letter-spacing:.3em;color:var(--bone-dim);opacity:0;transition:opacity .8s}
#vig .tap.on{opacity:.8;animation:blink 1.6s infinite}

#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:calc(26px*var(--s));background:#000;opacity:0;transition:opacity 1.4s;pointer-events:none}
#card.on{opacity:1;pointer-events:auto}
#card .v{writing-mode:vertical-rl;text-orientation:upright}
#card .no{font:700 calc(18px*var(--s)) var(--cjk);letter-spacing:.6em;color:var(--bone-dim);align-self:flex-start;margin-top:14%}
#card .nm{font:900 calc(78px*var(--s)) var(--cjk);letter-spacing:.3em;text-shadow:0 0 30px rgba(235,228,211,.2)}
#card .sb{font:500 calc(13px*var(--s)) var(--cjk);letter-spacing:.3em;color:var(--bone-dim);align-self:flex-end;margin-bottom:14%;max-height:70%}
#card .seal{width:calc(34px*var(--s));height:calc(34px*var(--s));border:2px solid var(--ember);color:var(--ember);font:900 calc(14px*var(--s))/1 var(--cjk);display:grid;place-items:center;align-self:flex-end;margin-bottom:14%;writing-mode:vertical-rl;padding:2px}

#prologue{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(12px*var(--s));opacity:0;pointer-events:none;transition:opacity 1s;padding-inline:10%}
#prologue.on{opacity:1;pointer-events:auto}
#prologue .ln{font:500 calc(19px*var(--s)) var(--cjk);letter-spacing:.18em;opacity:0;transition:opacity 1.4s;text-align:center}
#prologue .ln.on{opacity:1}
#prologue .ln.big{font-weight:900;font-size:calc(26px*var(--s));letter-spacing:.5em;margin-top:calc(10px*var(--s))}

#rub{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .8s;pointer-events:none}
#rub.on{opacity:1;pointer-events:auto}

/* ---------- touch controls ---------- */
#touch{opacity:0;transition:opacity .4s}
#touch.on{opacity:1}
.btn{position:absolute;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);background:radial-gradient(circle at 50% 40%,rgba(30,34,40,.34),rgba(6,8,10,.46));border:1.5px solid rgba(235,228,211,.3);font:900 var(--fs,20px) var(--cjk);color:rgba(235,228,211,.85);text-shadow:0 1px 3px #000;transition:transform .06s,background .06s,border-color .1s,opacity .3s}
.btn.dn{transform:translate(-50%,-50%) scale(.9);background:radial-gradient(circle at 50% 40%,rgba(98,198,182,.45),rgba(20,50,48,.6));border-color:var(--verdigris);color:#fff}
.btn.off{opacity:0}
.btn.dim{opacity:.35}
.btn.ready{border-color:var(--parry);box-shadow:0 0 16px rgba(241,207,102,.55);color:var(--parry)}
.btn small{position:absolute;bottom:14%;font:500 calc(8px*var(--s)) var(--cjk);letter-spacing:.1em;opacity:.65}
.btn.cd::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:2px solid transparent;border-top-color:rgba(98,198,182,.9);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#stick{position:absolute;width:var(--r2,120px);height:var(--r2,120px);border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid rgba(235,228,211,.22);background:radial-gradient(circle,rgba(0,0,0,.18),rgba(0,0,0,.4));transition:opacity .25s}
#stick::before{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed rgba(235,228,211,.12)}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 45% 40%,rgba(235,228,211,.55),rgba(160,150,130,.35));border:1px solid rgba(235,228,211,.6);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#stick.idle{opacity:.45}

/* ---------- menus ---------- */
.menu{position:absolute;inset:0;display:none}
.menu.on{display:block}
#title{background:linear-gradient(90deg,rgba(0,0,0,.66),rgba(0,0,0,.08) 45%,rgba(0,0,0,.08) 60%,rgba(0,0,0,.6))}
#title .logo{position:absolute;left:calc(var(--sl) + 7%);top:10%;display:flex;gap:calc(18px*var(--s));align-items:flex-start}
#title .logo .v{writing-mode:vertical-rl;text-orientation:upright}
#title .logo .big{font:900 calc(66px*var(--s)) var(--cjk);letter-spacing:.18em;line-height:1;text-shadow:0 0 30px rgba(0,0,0,.8);color:var(--bone)}
#title .logo .en{writing-mode:vertical-rl;font:400 calc(13px*var(--s)) var(--latin);letter-spacing:.5em;color:var(--bronze);margin-top:calc(6px*var(--s))}
#title .logo .lcol{display:flex;flex-direction:column;align-items:center;gap:calc(14px*var(--s))}
#title .logo .seal{width:calc(28px*var(--s));height:calc(28px*var(--s));border:2px solid var(--ember);color:var(--ember);font:900 calc(15px*var(--s))/1 var(--cjk);display:grid;place-items:center;background:rgba(0,0,0,.25)}
#title .motto{position:absolute;left:calc(var(--sl) + 7%);bottom:calc(var(--sb) + 8%);font:500 calc(12px*var(--s)) var(--cjk);letter-spacing:.35em;color:var(--bone-dim)}
.mlist{position:absolute;right:calc(var(--sr) + 7%);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:calc(2px*var(--s));align-items:stretch;width:calc(230px*var(--s))}
.mbtn{pointer-events:auto;background:none;border:0;border-left:2px solid transparent;text-align:left;padding:calc(9px*var(--s)) calc(16px*var(--s));font:700 calc(18px*var(--s)) var(--cjk);letter-spacing:.3em;color:var(--bone);cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:.8em;text-shadow:0 1px 6px #000}
.mbtn small{font:400 calc(10px*var(--s)) var(--latin);letter-spacing:.3em;color:var(--bone-dim)}
.mbtn:hover,.mbtn:focus-visible,.mbtn.sel{border-left-color:var(--verdigris);background:linear-gradient(90deg,rgba(98,198,182,.16),transparent);outline:none}
.mbtn[disabled]{opacity:.35;pointer-events:none}
.mnote{font:500 calc(11px*var(--s)) var(--cjk);color:var(--bone-dim);letter-spacing:.1em;line-height:1.7;margin-top:calc(10px*var(--s));padding-left:calc(16px*var(--s));max-width:calc(260px*var(--s))}
#pause{background:rgba(3,4,6,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#pause .ptitle{position:absolute;left:calc(var(--sl) + 8%);top:50%;transform:translateY(-50%);writing-mode:vertical-rl;text-orientation:upright;font:900 calc(44px*var(--s)) var(--cjk);letter-spacing:.4em}
#pause .pinfo{position:absolute;left:calc(var(--sl) + 8% + 90px*var(--s));top:50%;transform:translateY(-50%);font:500 calc(13px*var(--s)) var(--cjk);color:var(--bone-dim);line-height:2;letter-spacing:.1em}
#pause .pinfo b{color:var(--bone);font-weight:700}

.sheet{position:absolute;inset:0;background:rgba(5,6,8,.96);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-head{display:flex;align-items:center;gap:calc(14px*var(--s));padding:calc(var(--st) + 12px*var(--s)) calc(var(--sr) + 18px*var(--s)) calc(8px*var(--s)) calc(var(--sl) + 18px*var(--s));border-bottom:1px solid var(--bone-faint)}
.sheet-head h2{margin:0;font:900 calc(20px*var(--s)) var(--cjk);letter-spacing:.4em}
.tabs{display:flex;gap:calc(4px*var(--s));flex:1;overflow-x:auto;scrollbar-width:none}
.tab{pointer-events:auto;background:none;border:0;border-bottom:2px solid transparent;padding:calc(6px*var(--s)) calc(10px*var(--s));font:700 calc(13px*var(--s)) var(--cjk);letter-spacing:.2em;color:var(--bone-dim);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--bone);border-bottom-color:var(--verdigris)}
.tab.spoil{color:#d8876b}
.tab.spoil.on{color:#f0a488;border-bottom-color:var(--ember)}
.xbtn{pointer-events:auto;width:calc(34px*var(--s));height:calc(34px*var(--s));border-radius:50%;border:1px solid var(--bone-faint);background:none;font:400 calc(18px*var(--s))/1 var(--latin);color:var(--bone);cursor:pointer;flex:none}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(16px*var(--s)) calc(var(--sr) + 24px*var(--s)) calc(var(--sb) + 30px*var(--s)) calc(var(--sl) + 24px*var(--s));pointer-events:auto;user-select:text;-webkit-user-select:text}
.entry{max-width:40em;margin:0 auto calc(20px*var(--s))}
.entry h3{margin:0 0 calc(6px*var(--s));font:900 calc(17px*var(--s)) var(--cjk);letter-spacing:.2em;display:flex;gap:.8em;align-items:baseline;text-wrap:balance}
.entry h3 span{font:500 calc(11px*var(--s)) var(--cjk);color:var(--bronze);letter-spacing:.2em}
.entry p{margin:0 0 calc(6px*var(--s));font:500 calc(14px*var(--s)) var(--cjk);line-height:1.85;color:#d6cfbe;letter-spacing:.03em}
.entry.fs{border-left:2px solid var(--bone-faint);padding-left:calc(12px*var(--s))}
.entry.fs .lbl{font:700 calc(10px*var(--s)) var(--cjk);letter-spacing:.3em;color:var(--bone-dim);margin-top:calc(6px*var(--s))}
.gate{max-width:34em;margin:10% auto;text-align:center;font:500 calc(14px*var(--s)) var(--cjk);line-height:1.9;color:var(--bone-dim)}
.gate button{margin-top:calc(14px*var(--s));pointer-events:auto;background:none;border:1px solid var(--ember);color:#f0a488;padding:calc(8px*var(--s)) calc(20px*var(--s));font:700 calc(14px*var(--s)) var(--cjk);letter-spacing:.3em;cursor:pointer}
.nameslot{max-width:40em;margin:0 auto calc(10px*var(--s));display:flex;gap:calc(12px*var(--s));align-items:flex-start;font:500 calc(14px*var(--s)) var(--cjk);line-height:1.8}
.nameslot b{flex:none;width:calc(26px*var(--s));height:calc(26px*var(--s));display:grid;place-items:center;border:1px solid var(--bone-faint);font:900 calc(12px*var(--s)) var(--cjk);margin-top:2px}
.nameslot.lost{color:#4e4a42}
.nameslot.lost b{color:#4e4a42}
.ctlgrid{max-width:44em;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:calc(8px*var(--s)) calc(24px*var(--s))}

<script>
(() => {
'use strict';
// ===== 00_util.js =====
// ============================================================
//  UTIL
// ============================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (v - a) / (b - a);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const smooth = (t) => t * t * (3 - 2 * t);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeOut3 = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const expDecay = (a, b, k, dt) => b + (a - b) * Math.exp(-k * dt); // frame-rate independent smoothing
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; };
const now = () => performance.now() / 1000;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
// 1D value noise, smooth
function noise1(x) {
  const i = Math.floor(x), f = x - i;
  const a = hash2(i, 17), b = hash2(i + 1, 17);
  return lerp(a, b, smooth(f)) * 2 - 1;
}
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  const u = smooth(fx), v = smooth(fy);
  return lerp(lerp(a, b, u), lerp(c, d, u), v) * 2 - 1;
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function mixHex(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  const r = Math.round(lerp(a[0], b[0], t)), g = Math.round(lerp(a[1], b[1], t)), bl = Math.round(lerp(a[2], b[2], t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function shade(h, k) { return k >= 0 ? mixHex(h, '#ffffff', k) : mixHex(h, '#000000', -k); }

const store = {
  get(k, d) { try { const v = localStorage.getItem('unnamer.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('unnamer.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('unnamer.' + k); } catch (e) {} }
};

// ============================================================
//  CONFIG / TUNING  (world units: 1 tile = 32)
// ============================================================
const T = 32;
const VIEW_H = 360;
const DT = 1 / 120;
const TUNE = {
  runSpeed: 218, groundAccel: 2600, groundDecel: 3200, turnAccel: 4200,
  airAccel: 1700, airDecel: 1100,
  gravUp: 1750, gravDown: 2450, gravApex: 0.55, apexBand: 80, maxFall: 640,
  jumpV: 600, jumpCut: 0.45, coyote: 0.1, jumpBuffer: 0.13,
  dashSpeed: 560, dashTime: 0.16, dashExit: 215, dashCD: 0.28,
  slideSpeed: 440, slideTime: 0.38, slideEnd: 160, slideIFrames: 0.26, slideCD: 0.32,
  wallSlideMax: 115, wallJumpVX: 255, wallJumpVY: 560, wallJumpLock: 0.24,
  pogoV: 600,
  hurtIFrames: 1.0, hurtKB: 230,
  parryWindow: 0.2, parryRecover: 0.22,
  healTime: 0.62, healAmt: 2,
  playerW: 18, playerH: 44, slideH: 22
};

// ===== 01_audio.js =====
// ============================================================
//  AUDIO — procedural bells, SFX and adaptive music (WebAudio)
// ============================================================
const Snd = (() => {
  let ctx = null, master, sfxBus, musicBus, revIn, comp, noiseBuf = null, ready = false;
  const vol = { master: store.get('volMaster', 0.9), sfx: store.get('volSfx', 0.9), music: store.get('volMusic', 0.65) };
  const last = {};

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return; } }
    if (ctx.state === 'suspended') ctx.resume();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = vol.master;
    master.connect(comp); comp.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = vol.music; musicBus.connect(master);
    // reverb
    const conv = ctx.createConvolver();
    conv.buffer = makeIR(3.2, 2.4);
    revIn = ctx.createGain(); revIn.gain.value = 1;
    const revOut = ctx.createGain(); revOut.gain.value = 0.55;
    revIn.connect(conv); conv.connect(revOut); revOut.connect(master);
    // noise
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ready = true;
    // unlock with a silent blip (iOS)
    const o = ctx.createOscillator(), g = ctx.createGain(); g.gain.value = 0.0001; o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime + 0.02);
    Music._start();
  }
  function makeIR(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const ch = b.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < 90 ? i / 90 : 1);
      }
    }
    return b;
  }
  function setVol(k, v) {
    vol[k] = v; store.set('vol' + k[0].toUpperCase() + k.slice(1), v);
    if (!ctx) return;
    const t = ctx.currentTime;
    if (k === 'master') master.gain.setTargetAtTime(v, t, 0.05);
    if (k === 'sfx') sfxBus.gain.setTargetAtTime(v, t, 0.05);
    if (k === 'music') musicBus.gain.setTargetAtTime(v, t, 0.05);
  }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // ----- primitives -----
  function out(dest, rev) {
    // returns a gain node connected to dest (+ optional reverb send)
    const g = ctx.createGain();
    g.connect(dest || sfxBus);
    if (rev) { const s = ctx.createGain(); s.gain.value = rev; g.connect(s); s.connect(revIn); }
    return g;
  }
  function envGain(g, t, a, peak, dcy, sus = 0.0001) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + dcy);
  }
  function osc(type, f, t, dur, peak, dest, opt = {}) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (opt.f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, opt.f1), t + (opt.glide || dur));
    if (opt.detune) o.detune.value = opt.detune;
    const g = ctx.createGain();
    envGain(g, t, opt.a || 0.004, peak, dur);
    let node = o;
    if (opt.lp) { const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = opt.lp; f2.Q.value = opt.q || 0.7; o.connect(f2); node = f2; }
    node.connect(g); g.connect(dest);
    o.start(t); o.stop(t + (opt.a || 0.004) + dur + 0.05);
    return o;
  }
  function noise(t, dur, peak, dest, opt = {}) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.playbackRate.value = opt.rate || 1;
    const f = ctx.createBiquadFilter(); f.type = opt.type || 'bandpass';
    f.frequency.setValueAtTime(opt.f0 || 1000, t);
    if (opt.f1) f.frequency.exponentialRampToValueAtTime(opt.f1, t + dur);
    f.Q.value = opt.q || 1;
    const g = ctx.createGain(); envGain(g, t, opt.a || 0.003, peak, dur);
    s.connect(f); f.connect(g); g.connect(dest);
    const off = Math.random() * 1.5;
    s.start(t, off); s.stop(t + (opt.a || 0.003) + dur + 0.05);
  }
  // bell: additive inharmonic partials with individual decays
  const BELL = [[0.5, 1.0, 1.25], [1.0, 0.9, 1.0], [1.19, 0.55, 0.6], [1.5, 0.5, 0.55], [2.0, 0.7, 0.45], [2.52, 0.35, 0.3], [3.0, 0.28, 0.22], [4.07, 0.2, 0.14], [5.2, 0.12, 0.09]];
  function bell(f, t, o = {}) {
    const dur = o.dur || 2.5, gain = o.gain || 0.3, bright = o.bright == null ? 1 : o.bright;
    const g = out(o.dest || sfxBus, o.rev == null ? 0.5 : o.rev);
    g.gain.value = gain;
    const parts = o.lite ? BELL.slice(1, 5) : BELL;
    for (const [r, a, dk] of parts) {
      const amp = a * (r > 2 ? bright : 1);
      if (amp < 0.02) continue;
      const oo = ctx.createOscillator(); oo.type = 'sine';
      oo.frequency.value = f * r * (1 + (Math.random() - 0.5) * 0.004);
      const gg = ctx.createGain();
      const d = dur * dk;
      gg.gain.setValueAtTime(0.0001, t); gg.gain.linearRampToValueAtTime(amp, t + 0.002);
      gg.gain.exponentialRampToValueAtTime(0.0001, t + d);
      oo.connect(gg); gg.connect(g); oo.start(t); oo.stop(t + d + 0.05);
    }
    if (o.strike !== false) noise(t, 0.04, 0.35 * gain * 2, g, { f0: f * 3.2, q: 2 });
  }
  function metal(f, t, dur, peak, dest) {
    const g = out(dest || sfxBus, 0.25); g.gain.value = peak;
    for (const r of [1, 2.76, 5.4, 8.93]) {
      const oo = ctx.createOscillator(); oo.type = 'square'; oo.frequency.value = f * r;
      const gg = ctx.createGain(); envGain(gg, t, 0.001, 0.25 / r, dur / Math.sqrt(r));
      const hp = ctx.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = f * r; hp.Q.value = 8;
      oo.connect(hp); hp.connect(gg); gg.connect(g); oo.start(t); oo.stop(t + dur + 0.05);
    }
  }
  function fm(f, t, dur, peak, dest, ratio = 3.5, index = 2.2) {
    const car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
    car.frequency.value = f; mod.frequency.value = f * ratio;
    mg.gain.setValueAtTime(f * index, t); mg.gain.exponentialRampToValueAtTime(f * 0.05, t + dur * 0.6);
    mod.connect(mg); mg.connect(car.frequency);
    envGain(g, t, 0.003, peak, dur);
    car.connect(g); g.connect(dest);
    car.start(t); mod.start(t); car.stop(t + dur + 0.1); mod.stop(t + dur + 0.1);
  }

  // ----- sound effects -----
  const S = {
    step(o) { const t = ctx.currentTime; noise(t, 0.035, 0.07 * (o.v || 1), sfxBus, { type: 'lowpass', f0: 900 + Math.random() * 500, q: 0.8 }); },

// ============================================================
//  INPUT — keyboard, gamepad, multi-touch (floating stick + thumb buttons)
// ============================================================
const ACTIONS = ['jump', 'attack', 'dash', 'parry', 'skill', 'ult', 'heal', 'pause', 'confirm', 'left', 'right', 'up', 'down'];
const Input = (() => {
  const src = { key: {}, pad: {}, touch: {} };           // per-source held state
  const counts = {}, lastCounts = {}, relCounts = {}, lastRel = {};
  const pressed = {}, released = {};
  for (const a of ACTIONS) { counts[a] = 0; lastCounts[a] = 0; relCounts[a] = 0; lastRel[a] = 0; pressed[a] = false; released[a] = false; }
  let axisX = 0, axisY = 0, touchAX = 0, touchAY = 0, padAX = 0, padAY = 0;
  let mode = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 'touch' : 'keys';
  const listeners = [];
  let uiHandler = null; // when menus are open: function(action) -> bool handled

  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    Space: 'jump', KeyK: 'jump', KeyZ: 'jump',
    KeyJ: 'attack', KeyX: 'attack',
    KeyL: 'dash', KeyC: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash',
    KeyI: 'parry', KeyV: 'parry',
    KeyU: 'skill', KeyF: 'skill',
    KeyO: 'ult', KeyR: 'ult',
    KeyH: 'heal', KeyQ: 'heal',
    Escape: 'pause', KeyP: 'pause',
    Enter: 'confirm', NumpadEnter: 'confirm'
  };
  function isDown(a) { return !!(src.key[a] || src.pad[a] || src.touch[a]); }
  function setSrc(s, a, v) {
    const was = isDown(a);
    src[s][a] = v;
    const is = isDown(a);
    if (!was && is) { counts[a]++; if (uiHandler) uiHandler(a); for (const l of listeners) l(a); }
    if (was && !is) relCounts[a]++;
  }
  function setMode(m) {
    if (mode === m) return;
    mode = m;
    document.documentElement.dataset.input = m;
    if (Input.onMode) Input.onMode(m);
  }

  // ---- keyboard ----
  window.addEventListener('keydown', (e) => {
    const a = KEYMAP[e.code];
    if (!a) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    setMode('keys');
    if (e.repeat) return;
    setSrc('key', a, true);
    if (a === 'jump' || a === 'attack') setSrc('key', 'confirm', true);
  }, { passive: false });
  window.addEventListener('keyup', (e) => {
    const a = KEYMAP[e.code];
    if (!a) return;
    setSrc('key', a, false);
    if (a === 'jump' || a === 'attack') setSrc('key', 'confirm', false);
  });
  window.addEventListener('blur', () => { for (const a of ACTIONS) { src.key[a] = false; src.touch[a] = false; } touchAX = touchAY = 0; });

  // ---- gamepad ----
  const PADMAP = { 0: 'jump', 1: 'dash', 2: 'attack', 3: 'skill', 4: 'parry', 5: 'dash', 6: 'heal', 7: 'ult', 9: 'pause', 8: 'pause', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };

    const pads = navigator.getGamepads ? navigator.getGamepads() : [];

    if (!gp) { padAX = padAY = 0; return; }
    const st = {};
    for (const k in PADMAP) { const b = gp.buttons[k]; if (b && (b.pressed || b.value > 0.5)) st[PADMAP[k]] = true; }
    let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (Math.abs(ax) < 0.2) ax = 0; if (Math.abs(ay) < 0.2) ay = 0;
    padAX = ax; padAY = ay;
    if (ax < -0.35) st.left = true; if (ax > 0.35) st.right = true; if (ay < -0.6) st.up = true; if (ay > 0.6) st.down = true;
    if (st.jump || st.attack) st.confirm = true;
    let any = false;
    for (const a of ACTIONS) { const v = !!st[a]; if (v) any = true; if (v !== !!src.pad[a]) setSrc('pad', a, v); }
    if (any || ax || ay) setMode('pad');
  }

  // ---- touch ----
  const stick = { id: null, bx: 0, by: 0, x: 0, y: 0, R: 60 };
  const btnTouch = {}; // touch id -> action
  let buttons = []; // {a, x, y, r, el, enabled}
  let stickEl, knobEl;

  }

    btnTouch[id] = b.a;
    setSrc('touch', b.a, true);
    if (b.el) b.el.classList.add('dn');
    if (b.a === 'jump' || b.a === 'attack') setSrc('touch', 'confirm', true);
  }
  function releaseTouchBtn(id) {
    const a = btnTouch[id];
    if (!a) return;
    delete btnTouch[id];
    let still = false; for (const k in btnTouch) if (btnTouch[k] === a) still = true;
    if (!still) {
      setSrc('touch', a, false);
      const b = buttons.find((q) => q.a === a); if (b && b.el) b.el.classList.remove('dn');

    }
  }
  function updateStickVisual() {
    if (!stickEl) return;

    const dx = stick.x - stick.bx, dy = stick.y - stick.by, m = Math.hypot(dx, dy), k = m > stick.R ? stick.R / m : 1;

  }
  function stickAxes() {
    const dx = stick.x - stick.bx, dy = stick.y - stick.by;

    const m = Math.hypot(ax, ay);

    setSrc('touch', 'left', ax < -0.3);
    setSrc('touch', 'right', ax > 0.3);
    setSrc('touch', 'up', ay < -0.55);
    setSrc('touch', 'down', ay > 0.58);
  }
  function resetStick() {
    stick.id = null; touchAX = touchAY = 0;
    for (const a of ['left', 'right', 'up', 'down']) setSrc('touch', a, false);
    stick.bx = stick.homeX; stick.by = stick.homeY; stick.x = stick.bx; stick.y = stick.by;
    if (stickEl) stickEl.classList.add('idle');
    updateStickVisual();
  }
  function touchStart(e, lx, ly, id, gameplay) {
    setMode('touch');
    if (!gameplay) return false;
    const W = Layout.W;
    if (lx < W * 0.42 && stick.id === null && !nearestButton(lx, ly, 1.1)) {
      stick.id = id;
      stick.bx = clamp(lx, stick.R + 12 + Layout.sl, W * 0.42 - stick.R);
      stick.by = clamp(ly, stick.R + 20, Layout.H - stick.R - 10 - Layout.sb);
      stick.x = lx; stick.y = ly;
      if (stickEl) stickEl.classList.remove('idle');
      stickAxes(); updateStickVisual();
      return true;
    }
    let b = nearestButton(lx, ly, 1.3);
    if (!b && lx > W * 0.5) b = nearestButton(lx, ly, 1.9);
    if (b) { pressTouchBtn(id, b); return true; }
    return false;
  }
  function touchMove(lx, ly, id) {
    if (id === stick.id) {
      stick.x = lx; stick.y = ly;
      // let the base follow if the thumb drifts far (floating stick)
      const dx = stick.x - stick.bx, dy = stick.y - stick.by, m = Math.hypot(dx, dy);
      if (m > stick.R * 1.6) { const k = (m - stick.R * 1.6) / m; stick.bx += dx * k; stick.by += dy * k; }
      stickAxes(); updateStickVisual();
      return;
    }
    const cur = btnTouch[id];
    if (cur) {
      const b = nearestButton(lx, ly, 1.0);
      if (b && b.a !== cur) { releaseTouchBtn(id); pressTouchBtn(id, b); }
    }
  }
  function touchEnd(id) {
    if (id === stick.id) resetStick();
    releaseTouchBtn(id);
  }

  return {
    get mode() { return mode; }, setMode,
    get ax() { const d = (isDown('right') ? 1 : 0) - (isDown('left') ? 1 : 0); if (mode === 'touch' && touchAX) return touchAX; if (mode === 'pad' && padAX) return padAX; return d; },
    get ay() { const d = (isDown('down') ? 1 : 0) - (isDown('up') ? 1 : 0); if (mode === 'touch' && touchAY) return touchAY; return d; },
    down: isDown,
    pressed, released,
    stepBegin() {

        pressed[a] = counts[a] !== lastCounts[a]; lastCounts[a] = counts[a];
        released[a] = relCounts[a] !== lastRel[a]; lastRel[a] = relCounts[a];

    flush() { for (const a of ACTIONS) { lastCounts[a] = counts[a]; lastRel[a] = relCounts[a]; pressed[a] = false; released[a] = false; } },
    poll: pollPad,
    onPress(fn) { listeners.push(fn); },
    setUI(fn) { uiHandler = fn; },
    layoutButtons, touchStart, touchMove, touchEnd, resetStick,
    bindStick(el, knob) { stickEl = el; knobEl = knob; },
    stick,
    releaseAll() { for (const a of ACTIONS) { src.touch[a] = false; src.key[a] = false; src.pad[a] = false; } for (const k in btnTouch) delete btnTouch[k]; for (const b of buttons) if (b.el) b.el.classList.remove('dn'); resetStick(); },
    synth(a, v) { setSrc('key', a, v); } // for tests / scripted input
  };
})();

// ===== 03_world.js =====
// ============================================================
//  WORLD — tile map, collisions, dynamic tiles, camera
// ============================================================
const TL = { AIR: 0, SOLID: 1, ALT: 2, ONEWAY: 3, SPIKE: 4, SPIKED: 5, WHITE: 6, CRUMBLE: 7, GHOST: 8, MOLTEN: 9, BACK: 10, BREAK: 11, SPIKEL: 12, SPIKER: 13, BRONZE: 14, ROOF: 15 };

class World {
  constructor(id, game) {
    const def = MAPS[id];
    this.id = id; this.def = def; this.game = game;
    this.theme = THEMES[def.theme];
    const rows = def.rows;
    this.h = rows.length;
    this.w = Math.max(...rows.map((r) => r.length));
    this.pw = this.w * T; this.ph = this.h * T;
    const n = this.w * this.h;
    this.tiles = new Uint8Array(n);
    this.vari = new Uint8Array(n);
    this.crumbleT = new Float32Array(n);  // >0 shaking, <0 gone (counts up to 0)
    this.ghostT = new Float32Array(n);    // >0 = recalled/solid
    this.breakHP = new Uint8Array(n);
    this.spawns = []; this.markers = {};
    const rng = mulberry32(def.seed || 1234);
    let nameIdx = 0, bellIdx = 0, doorIdx = 0, heartIdx = 0, pogoIdx = 0;
    for (let ty = 0; ty < this.h; ty++) {
      const row = rows[ty];
      for (let tx = 0; tx < this.w; tx++) {
        const ch = row[tx] || ' ';
        const i = ty * this.w + tx;
        this.vari[i] = (rng() * 256) | 0;
        if (CHAR_TILE[ch] !== undefined) {
          this.tiles[i] = CHAR_TILE[ch];
          if (ch === 'o') this.breakHP[i] = 3;
        } else if (ch !== ' ' && ch !== '.') {
          const sp = { ch, tx, ty, x: tx * T + T / 2, y: ty * T + T };
          if (ch === '*') sp.idx = (def.nameStart || 0) + nameIdx++;
          if (ch === 'K') sp.idx = bellIdx++;
          if (ch === 'D') sp.idx = doorIdx++;
          if (ch === 'H') sp.idx = heartIdx++;
          if (ch === 'g') sp.idx = pogoIdx++;
          this.spawns.push(sp);
          if (!this.markers[ch]) this.markers[ch] = [];
          this.markers[ch].push(sp);
          // back wall behind entity markers inside interiors: inherit from left neighbour if it is BACK
          if (tx > 0 && CHAR_TILE[row[tx - 1]] === TL.BACK && (row[tx + 1] === ':' || CHAR_TILE[row[tx + 1]] === undefined)) this.tiles[i] = TL.BACK;
        }
      }
    }
    // fill pits: everything below a WHITE tile is WHITE
    for (let tx = 0; tx < this.w; tx++) {
      let white = false;
      for (let ty = 0; ty < this.h; ty++) {
        const i = ty * this.w + tx;
        if (this.tiles[i] === TL.WHITE) white = true;
        else if (white && this.tiles[i] === TL.AIR) this.tiles[i] = TL.WHITE;
      }
    }
    this.whiteCols = [];  // top row of white per column for rendering
    for (let tx = 0; tx < this.w; tx++) {
      let top = -1;
      for (let ty = 0; ty < this.h; ty++) if (this.tiles[ty * this.w + tx] === TL.WHITE) { top = ty; break; }
      this.whiteCols.push(top);
    }
    this.activeTiles = new Set(); // indices with running crumble/ghost timers
    this.enemies = []; this.pickups = []; this.props = []; this.projectiles = []; this.hazards = []; this.triggers = []; this.npcs = [];
    this.time = 0;
    this.tideY = null;   // rising white tide (escape)
  }
  idx(tx, ty) { return ty * this.w + tx; }
  tile(tx, ty) {
    if (tx < 0 || tx >= this.w) return TL.SOLID;
    if (ty < 0) return TL.AIR;
    if (ty >= this.h) return TL.WHITE;
    return this.tiles[ty * this.w + tx];

  solid(tx, ty) {

            else if (blockedR && !blockedL) { const push = (b.x + b.w / 2) - tx1 * T; if (push <= 7 && !this.solidRect(b.x - push, b.y, b.w, b.h)) { b.x -= push + 0.01; fixed = true; } }

  }
  clearRect(x, y, w, h) { // x,y top-left
    const tx0 = Math.floor(x / T), tx1 = Math.floor((x + w - 0.01) / T), ty0 = Math.floor(y / T), ty1 = Math.floor((y + h - 0.01) / T);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (this.solid(tx, ty)) return false;

  }
  solidRect(cx, feetY, w, h) { return !this.clearRect(cx - w / 2 + 0.5, feetY - h + 0.5, w - 1, h - 1); }
  supported(b) {
    const y = b.y + 1, ty = Math.floor(y / T);

    for (let tx = a; tx <= c; tx++) { const t = this.tile(tx, ty); if (!(t === TL.SOLID || t === TL.ALT || t === TL.ONEWAY || t === TL.BRONZE || t === TL.ROOF)) return false; }

    const tx0 = Math.floor(l / T), tx1 = Math.floor(r / T), ty0 = Math.floor(top / T), ty1 = Math.floor(bot / T);
    let res = null;
    for (let ty = ty0; ty <= ty1 + 1; ty++) for (let tx = tx0; tx <= tx1; tx++) {

      if (t === TL.WHITE) { if (b.y - 10 > ty * T + 14) return 'white'; }
      else if (t === TL.SPIKE) { if (bot > ty * T + 14 && ty <= ty1) res = 'spike'; }
      else if (t === TL.SPIKED) { if (top < ty * T + 18 && ty >= ty0) res = 'spike'; }
      else if (t === TL.SPIKEL) { if (ty <= ty1 && r > tx * T + 14 && l < tx * T + T) res = 'spike'; }

  breakAt(tx, ty, dmg) {

  update(dt) {

}

class Camera {
  constructor() {
    this.x = 0; this.y = 0; this.px = 0; this.py = 0;
    this.zoom = 1; this.tzoom = 1;
    this.trauma = 0; this.shakeT = 0; this.sx = 0; this.sy = 0;
    this.look = 0; this.lock = null; this.target = null; this.yBias = 0; this.focus = null;
    this.vw = 640; this.vh = VIEW_H;
  }
  setView(aspect) { this.vh = VIEW_H / this.zoom; this.vw = this.vh * aspect; }
  shake(a) { this.trauma = Math.min(1, this.trauma + a); }
  snap(world, p) { this.update(world, p, 1, true); this.px = this.x; this.py = this.y; }
  update(world, p, dt, instant) {
    this.px = this.x; this.py = this.y;
    this.zoom = expDecay(this.zoom, this.tzoom, 3, dt);
    let tx, ty;
    if (this.focus) { tx = this.focus.x - this.vw / 2; ty = this.focus.y - this.vh / 2; }
    else {
      const mv = Math.abs(p.vx) > 40 ? sign(p.vx) : 0;
      this.look = expDecay(this.look, (mv || p.face) * (mv ? 70 : 40), 2.2, dt);
      tx = p.x + this.look - this.vw / 2;
      // vertical: platformer window — lock to the ground level, only follow airborne moves that leave the band
      const ground = p.y - this.vh * (this.feet || 0.68) + this.yBias;
      if (this._ty === undefined || instant) this._ty = ground;
      if (p.grounded || p.wallSliding) this._ty = ground;
      else {
        const fy = p.y - this._ty;
        if (fy < this.vh * 0.36) this._ty = p.y - this.vh * 0.36;
        else if (fy > this.vh * 0.8) this._ty = p.y - this.vh * 0.8;
      }
      ty = this._ty + (p.vy > 420 && !p.grounded ? Math.min(70, (p.vy - 420) * 0.35) : 0);
    }
    let bx0 = 0, by0 = 0, bx1 = world.pw, by1 = world.ph;
    if (this.lock) { bx0 = this.lock.x; by0 = this.lock.y; bx1 = this.lock.x + this.lock.w; by1 = this.lock.y + this.lock.h; }
    const clampX = (v) => (bx1 - bx0 <= this.vw ? (bx0 + bx1) / 2 - this.vw / 2 : clamp(v, bx0, bx1 - this.vw));
    const clampY = (v) => (by1 - by0 <= this.vh ? (by0 + by1) / 2 - this.vh / 2 : clamp(v, by0, by1 - this.vh));
    tx = clampX(tx); ty = clampY(ty);
    if (instant) { this.x = tx; this.y = ty; }
    else {
      this.x = expDecay(this.x, tx, this.focus ? 3 : 7.5, dt);
      this.y = expDecay(this.y, ty, this.focus ? 3 : (p.vy > 300 ? 11 : 6.5), dt);
    }
    // shake
    this.trauma = Math.max(0, this.trauma - dt * 1.6);
    this.shakeT += dt;
    const s = this.trauma * this.trauma * 14;
    this.sx = s * noise1(this.shakeT * 38); this.sy = s * noise1(this.shakeT * 38 + 91.7);
  }
}

// ============================================================
//  VERLET ROPE (scarf, coat tails, hair, cloth)
// ============================================================
class Rope {
  constructor(n, seg, x, y) {
    this.n = n; this.seg = seg;
    this.x = new Float32Array(n); this.y = new Float32Array(n); this.ox = new Float32Array(n); this.oy = new Float32Array(n);
    for (let i = 0; i < n; i++) { this.x[i] = this.ox[i] = x; this.y[i] = this.oy[i] = y + i * seg; }
  }
  reset(x, y) { for (let i = 0; i < this.n; i++) { this.x[i] = this.ox[i] = x - i * this.seg * 0.7; this.y[i] = this.oy[i] = y + i * this.seg * 0.3; } }
  update(ax, ay, dt, grav, windX, windY, damp = 0.94, iters = 3, stiff = 0, wave = 0, wt = 0) {
    const n = this.n, X = this.x, Y = this.y, OX = this.ox, OY = this.oy;
    X[0] = ax; Y[0] = ay; OX[0] = ax; OY[0] = ay;
    const dt2 = dt * dt;
    for (let i = 1; i < n; i++) {
      const vx = (X[i] - OX[i]) * damp, vy = (Y[i] - OY[i]) * damp;
      OX[i] = X[i]; OY[i] = Y[i];
      const k = i / n, w = wave ? Math.sin(wt * 11 - i * 0.85) * wave * k : 0;
      X[i] += vx + windX * dt2 * (0.5 + k); Y[i] += vy + (grav + windY + w) * dt2;
    }
    for (let k = 0; k < iters; k++) {
      X[0] = ax; Y[0] = ay;
      for (let i = 1; i < n; i++) {
        const dx = X[i] - X[i - 1], dy = Y[i] - Y[i - 1];
        const d = Math.sqrt(dx * dx + dy * dy) || 0.0001, diff = (d - this.seg) / d;
        if (i === 1) { X[i] -= dx * diff; Y[i] -= dy * diff; }
        else { X[i] -= dx * diff * 0.5; Y[i] -= dy * diff * 0.5; X[i - 1] += dx * diff * 0.5; Y[i - 1] += dy * diff * 0.5; }
      }
      if (stiff) { // bias toward a rest direction (for coat tails)
        for (let i = 1; i < n; i++) { X[i] += stiff.x * stiff.k; Y[i] += stiff.y * stiff.k; }
      }
    }
  }
}

class Player {

  get cx() { return this.x; } get cy() { return this.y - this.h / 2; }
  rect() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }
  setPos(x, y) { this.x = this.px = x; this.y = this.py = y; this.vx = this.vy = 0; this.scarf.reset(x, y - 38); this.tailA.reset(x, y - 22); this.tailB.reset(x, y - 22); this.hair.reset(x, y - 44); this.ghosts.length = 0; }

  touchingWall(side) {
    const W = this.game.world;

    const tx = Math.floor(x / T);

  // ------------------------------------------------------------
  update(dt) {

    this.st += dt;

        }
      }
      if (!this.wallSliding) this.wallStick = 0; else this.wallStick = Math.max(0, this.wallStick - dt);
    }
    this.gravity(dt);
    if (this.wallSliding && this.vy > TUNE.wallSlideMax) { this.vy = approach(this.vy, TUNE.wallSlideMax, 3000 * dt); if (Math.random() < 0.35) FX.wallDust(this.x + this.wallSide * this.w / 2, this.y - 30, this.game.world.theme); }

    // actions (priority: dash > jump > attack > parry > heal)
    if (this.dashBuf > 0 && this.tryDash()) return;
    if (this.jumpBuf > 0) {
      if (this.grounded && down && this.onOneway()) { this.dropping = true; this.dropT = 0.22; this.jumpBuf = 0; this.grounded = false; this.vy = 60; }
      else if (this.grounded || this.coyote > 0) { this.doJump(); }
      else if (this.abilities.wall && (this.wallSliding || this.touchingWall(1) || this.touchingWall(-1))) {
        const side = this.wallSliding ? this.wallSide : (this.touchingWall(1) ? 1 : -1);
        this.doWallJump(side, dir);
      }
    }
    if (this.atkBuf > 0) { this.startAttack(up, down); if (this.state !== 'move') return; }
    if (P.parry) { this.enterParry(); return; }
    if (P.heal) this.tryHeal();
    this.physics(dt);
    // footsteps
    if (this.grounded && Math.abs(this.vx) > 60) {
      this.stepAcc += Math.abs(this.vx) * dt;
      if (this.stepAcc > 38) { this.stepAcc = 0; Snd.play('step', { v: 0.7 }); if (Math.random() < 0.5) FX.dust(this.x - this.face * 6, this.y, 1, this.game.world.theme, 0.5); }
    }
  }
  onOneway() {
    const W = this.game.world, ty = Math.floor((this.y + 1) / T);
    const tx0 = Math.floor((this.x - this.w / 2 + 0.5) / T), tx1 = Math.floor((this.x + this.w / 2 - 0.5) / T);
    let ow = false;
    for (let tx = tx0; tx <= tx1; tx++) { if (W.solid(tx, ty)) return false; if (W.oneway(tx, ty)) ow = true; }
    return ow;
  }
  doJump() {
    this.vy = -TUNE.jumpV; this.jumping = true; this.grounded = false; this.coyote = 0; this.jumpBuf = 0;
    this.fallStartY = this.y;
    Snd.play('jump'); FX.dust(this.x, this.y, 5, this.game.world.theme, 0.8);
    this.anim.kick('jump');
  }
  doWallJump(side, dir) {
    this.vx = -side * TUNE.wallJumpVX;
    this.vy = -TUNE.wallJumpVY; this.jumping = false; this.jumpBuf = 0;
    this.wallLock = TUNE.wallJumpLock; this.wallLockSide = side;
    this.chainSide = -side; this.chainT = 0.75;
    this.face = -side; this.wallSliding = false; this.airDashes = 1;
    Snd.play('jump'); FX.wallDust(this.x + side * this.w / 2, this.y - 22, this.game.world.theme, 6);
    this.anim.kick('walljump');
  }
  tryDash() {
    if (this.dashCD > 0) return false;
    const dir = this.wantDir(Input.ax) || this.face;
    if (this.grounded) {
      if (this.slideCD > 0) return false;
      this.enterSlide(dir); return true;
    }
    if (this.abilities.dash && this.airDashes > 0) { this.enterDash(this.wallSliding ? -this.wallSide : dir); return true; }
    return false;
  }
  enterDash(dir) {
    this.state = 'dash'; this.st = 0; this.face = dir; this.airDashes--; this.dashBuf = 0;
    this.vx = dir * TUNE.dashSpeed; this.vy = 0; this.jumping = false; this.wallSliding = false;
    this.inv = Math.max(this.inv, TUNE.dashTime + 0.02);
    Snd.play('dash'); this.game.cam.shake(0.06);
    FX.dashBurst(this.x, this.y - 22, dir);
    this.anim.kick('dash');
  }
  stDash(dt) {
    this.vx = this.face * TUNE.dashSpeed; this.vy = 0;
    if (this.st % 0.03 < dt) this.ghosts.push({ x: this.x, y: this.y, pose: this.anim.snapshot(), face: this.face, life: 0.28, max: 0.28 });
    this.physics(dt);
    if (this.hitWallX || this.st >= TUNE.dashTime) {
      this.state = 'move'; this.st = 0; this.dashCD = TUNE.dashCD;
      this.vx = this.face * TUNE.dashExit;
      if (this.atkBuf > 0) this.startAttack(Input.ay < -0.55, Input.ay > 0.55);
    }
  }
  enterSlide(dir) {
    this.state = 'slide'; this.st = 0; this.face = dir; this.dashBuf = 0;
    this.h = TUNE.slideH;
    this.vx = dir * TUNE.slideSpeed;
    this.inv = Math.max(this.inv, TUNE.slideIFrames);
    Snd.play('slide'); FX.dust(this.x, this.y, 6, this.game.world.theme, 1.2);
    this.anim.kick('slide');
  }
  stSlide(dt, ax, P) {
    const t = this.st / TUNE.slideTime;
    const spd = lerp(TUNE.slideSpeed, TUNE.slideEnd, easeOut(Math.min(1, t)));
    this.vx = this.face * spd;
    this.gravity(dt);
    if (Math.random() < 0.5) FX.dust(this.x - this.face * 8, this.y, 1, this.game.world.theme, 0.6);
    this.physics(dt);
    const headroom = this.canStand();
    // slide-jump
    if (this.jumpBuf > 0 && headroom && (this.grounded || this.coyote > 0)) {
      this.h = TUNE.playerH; this.state = 'move'; this.slideCD = TUNE.slideCD;
      this.doJump(); this.vx = this.face * TUNE.runSpeed * 1.1; return;
    }
    if (!this.grounded && headroom) { this.h = TUNE.playerH; this.state = 'move'; this.slideCD = TUNE.slideCD * 0.5; return; }
    if (this.st >= TUNE.slideTime || this.hitWallX) {
      if (headroom) { this.h = TUNE.playerH; this.state = 'move'; this.st = 0; this.slideCD = TUNE.slideCD; this.vx = this.face * Math.min(Math.abs(this.vx), TUNE.runSpeed); }
      else if (this.hitWallX) { this.face = -this.face; }
      else { this.vx = this.face * TUNE.slideEnd; }
    }
    if (this.atkBuf > 0 && this.st > TUNE.slideTime * 0.55 && headroom) { this.h = TUNE.playerH; this.state = 'move'; this.startAttack(false, false); }
  }

  // ---------------- ATTACK ----------------
  startAttack(up, down) {
    let name;
    if (this.riposteT > 0 && this.grounded) name = 'rip';
    else if (up) name = 'up';
    else if (!this.grounded && down) name = 'down';
    else if (this.grounded) { name = 'g' + this.combo; }
    else { name = this.airAtks % 2 === 0 ? 'a0' : 'a1'; }
    this.atkBuf = 0;
    this.state = 'atk'; this.st = 0; this.atk = ATK[name]; this.atkName = name; this.atkId++; this.hitSet.clear(); this.atkHit = false;
    const dir = this.wantDir(Input.ax); if (dir && !this.locked) this.face = dir;
    if (name[0] === 'g') { this.combo = (this.combo + 1) % 3; this.comboT = 0.45; }
    if (name[0] === 'a') this.airAtks++;
    if (name === 'rip') { this.riposteT = 0; this.combo = 0; }
    this.swingSnd = false;
    this.anim.kick(name);
  }
  atkBox() {
    const b = this.atk.box; // [offsetX, top above feet, w, h]
    const x = this.face > 0 ? this.x + b[0] : this.x - b[0] - b[2];
    return { x, y: this.y - b[1], w: b[2], h: b[3] };
  }
  stAttack(dt, ax, P, up, down) {
    const a = this.atk, n = this.atkName;
    const air = n[0] === 'a' || n === 'down' || (n === 'up' && !this.grounded);
    // movement
    if (a.step && this.st < a.stepT) this.vx = this.face * a.step * (1 - this.st / a.stepT * 0.4);
    else if (this.grounded) this.vx = approach(this.vx, 0, 1800 * dt);
    else { const dir = this.wantDir(ax); this.vx = dir ? approach(this.vx, dir * TUNE.runSpeed * 0.8, TUNE.airAccel * 0.6 * dt) : approach(this.vx, 0, 500 * dt); }
    let gm = 1;
    if (air && n !== 'down' && this.airAtks <= 2 && this.vy > -120) gm = 0.3;
    if (n === 'down') gm = 0.75;
    this.gravity(dt, gm);
    if (!this.swingSnd && this.st >= a.a0 * 0.6) {
      this.swingSnd = true;
      const noteIdx = n === 'g0' ? 0 : n === 'g1' ? 1 : n === 'g2' ? 2 : n === 'rip' ? 4 : n === 'up' ? 3 : 1;
      Snd.play('swing', { n: noteIdx, gap: 0 });
      FX.slash(this, n);
    }
    // hits
    if (this.st >= a.a0 && this.st <= a.a1) { this.game.playerHits(this); if (this.state !== 'atk') { this.physics(dt); return; } }
    this.physics(dt);
    // cancels
    if (this.st > 0.05 && this.dashBuf > 0 && this.tryDash()) return;
    if (this.st >= a.cancel) {
      if (this.jumpBuf > 0 && (this.grounded || this.coyote > 0)) { this.state = 'move'; this.doJump(); return; }
      if (this.jumpBuf > 0 && !this.grounded && this.abilities.wall && (this.touchingWall(1) || this.touchingWall(-1))) { this.state = 'move'; this.doWallJump(this.touchingWall(1) ? 1 : -1, this.wantDir(ax)); return; }
      if (P.parry) { this.enterParry(); return; }
      if (this.atkBuf > 0 && this.st >= a.cancel + 0.02) { this.startAttack(up, down); return; }
    }
    if (n === 'down' && this.grounded && this.st > a.a0) { this.state = 'move'; this.st = 0; return; }
    if (this.st >= a.dur) {
      this.state = 'move'; this.st = 0;
      if (this.atkBuf > 0) this.startAttack(Input.ay < -0.55, Input.ay > 0.55);
    }
  }
  pogo() {
    this.vy = -TUNE.pogoV; this.jumping = false; this.airDashes = 1; this.airAtks = 0;
    this.state = 'move'; this.st = 0;
    this.anim.kick('pogo');
  }
  onHitLanded(kind, heavy) {
    // called by game when this swing connects
    this.atkHit = true;
    if (kind === 'hit') this.ult = Math.min(100, this.ult + (this.atkName === 'rip' ? 10 : 5));
    const n = this.atkName;
    if (n === 'down') { this.pogo(); return; }
    if (kind === 'block') { this.vx = -this.face * 200; return; }
    if (n[0] === 'a' || (n === 'up' && !this.grounded)) this.vy = Math.min(this.vy, -110);
    else if (this.grounded) this.vx = -this.face * (heavy ? 60 : 30);
  }

  // ---------------- PARRY ----------------
  enterParry() {
    this.state = 'parry'; this.st = 0; this.parried = false;
    this.anim.kick('parry');
    Snd.play('tele', { gap: 0 });
  }
  parryActive() { return this.state === 'parry' && this.st <= TUNE.parryWindow && !this.parried; }
  stParry(dt, P) {
    this.vx = approach(this.vx, 0, 2000 * dt);
    this.gravity(dt, this.grounded ? 1 : 0.6);
    this.physics(dt);
    const end = this.parried ? 0.22 : TUNE.parryWindow + TUNE.parryRecover;
    if (this.parried && this.st > 0.08) {
      if (this.atkBuf > 0) { this.state = 'move'; this.startAttack(false, false); return; }
      if (this.dashBuf > 0 && this.tryDash()) return;
      if (this.jumpBuf > 0 && (this.grounded || this.coyote > 0)) { this.state = 'move'; this.doJump(); return; }
    }
    if (this.st >= end) { this.state = 'move'; this.st = 0; }
  }
  onParry() {
    this.parried = true; this.st = 0; this.inv = Math.max(this.inv, 0.35);
    this.riposteT = 1.1;
    this.ult = Math.min(100, this.ult + 18);
    this.anim.kick('parryHit');
  }

  // ---------------- DAMAGE ----------------
  damage(n, fromX, opts = {}) {
    if (this.inv > 0 || this.state === 'dead' || this.state === 'void' || this.state === 'ult' || this.game.godMode) return false;
    this.hp = Math.max(0, this.hp - n);
    this.ult = Math.min(100, this.ult + 6);
    this.inv = TUNE.hurtIFrames; this.hurtInv = TUNE.hurtIFrames; this.hurtFlash = 0.35;
    const dir = sign(this.x - fromX) || -this.face;
    this.state = 'hurt'; this.st = 0; this.h = TUNE.playerH;
    this.vx = dir * (opts.kb || TUNE.hurtKB); this.vy = -(opts.up || 260); this.grounded = false; this.jumping = false;
    this.combo = 0; this.riposteT = 0;
    Snd.play('hurt'); this.game.hitstop(0.09); this.game.cam.shake(0.38); this.game.flash('#8a1f14', 0.35);
    FX.hurt(this.x, this.y - 24, dir);
    this.anim.kick('hurt');
    this.game.hud.hpHit();
    if (navigator.vibrate && this.game.settings.vibrate) try { navigator.vibrate(60); } catch (e) {}
    if (this.hp <= 0) this.game.playerDied();
    else if (this.hp <= 2 && this.flasks > 0) this.game.hint('heal', 7);
    return true;
  }
  stHurt(dt) {
    this.vx = approach(this.vx, 0, 700 * dt);
    this.gravity(dt);
    this.physics(dt);
    if (this.st > 0.3 && (this.grounded || this.st > 0.4)) { this.state = 'move'; this.st = 0; }
  }

  // ---------------- HEAL ----------------
  tryHeal() {
    if (this.flasks <= 0 || !this.grounded || this.hp >= this.maxHp) { if (this.flasks <= 0 || this.hp >= this.maxHp) Snd.play('ui'); return; }
    this.state = 'heal'; this.st = 0; this.healed = false;
    this.anim.kick('heal');
  }
  stHeal(dt, P) {
    this.vx = approach(this.vx, 0, 2400 * dt);
    this.gravity(dt); this.physics(dt);
    if (Math.random() < 0.5) FX.healMote(this.x, this.y);
    if (!this.healed && this.st >= TUNE.healTime * 0.7) {
      this.healed = true; this.flasks--; this.hp = Math.min(this.maxHp, this.hp + TUNE.healAmt);
      Snd.play('heal'); FX.ring(this.x, this.y - 22, 6, 48, '#62c6b6', 0.5, 3);
      this.game.hud.refresh();
    }
    if (this.st >= TUNE.healTime) { this.state = 'move'; this.st = 0; }
    if (this.dashBuf > 0 && this.st < TUNE.healTime * 0.7) { this.tryDash(); }
  }

  // ---------------- SKILLS ----------------
  doRecall() {
    this.recallCD = 0.9; this.recallPose = 0.32;
    const W = this.game.world;
    const n = W.recall(this.x, this.y - 22, 250, 4.4);
    Snd.play('recall');
    FX.recallWave(this.x, this.y - 22, 250);
    this.game.cam.shake(0.08);
    this.game.onRecall && this.game.onRecall(n);
  }
  enterUlt() {
    this.state = 'ult'; this.st = 0; this.ult = 0; this.fired = false; this.vx = 0;
    this.inv = 1.4;
    Snd.play('ultPre');
    this.game.slowmo(0.35, 0.5);
    this.anim.kick('ult');
    this.game.hud.refresh();
  }
  stUlt(dt) {
    this.vx = 0; this.vy = Math.min(this.vy, 0) * 0.9;
    if (!this.grounded) this.vy = Math.min(this.vy + 200 * dt, 60);
    this.physics(dt);
    if (!this.fired && this.st > 0.5) { this.fired = true; this.game.fireUlt(this); }
    if (this.st > 1.15) { this.state = 'move'; this.st = 0; }
  }

  // ---------------- CUTSCENE CONTROL ----------------
  updateLocked(dt) {
    // scripts can set cutVX (walk), autoFace, or run an action
    const dir = sign(this.cutVX);
    if (this.state === 'atk') { this.stAttack(dt, 0, {}, false, false); return; }
    this.state = this.state === 'dead' ? 'dead' : (this.state === 'kneel' ? 'kneel' : 'move');
    if (this.state === 'kneel') { this.vx = 0; this.gravity(dt); this.physics(dt); return; }
    this.vx = this.cutVX ? approach(this.vx, this.cutVX, TUNE.groundAccel * dt) : approach(this.vx, 0, TUNE.groundDecel * dt);
    if (dir) this.face = dir; else if (this.autoFace) this.face = this.autoFace;
    this.gravity(dt);
    this.physics(dt);
    if (this.grounded && Math.abs(this.vx) > 60) { this.stepAcc += Math.abs(this.vx) * dt; if (this.stepAcc > 38) { this.stepAcc = 0; Snd.play('step', { v: 0.6 }); } }
  }

  // ---------------- CLOTH ----------------
  updateCloth(dt) {
    const p = this.pose; if (!p) return;
    const t = this.game.world.time;
    const wind = this.game.world.theme.wind || 0;
    const gust = 0.6 + 0.4 * noise1(t * 0.6);
    // the scarf always streams behind him: ambient flow opposite to facing, plus motion drag
    const flow = -this.face * (0.35 + wind * 0.4) * gust * 260;
    const wx = -this.vx * 3.0 + flow + noise1(t * 1.3 + 7) * 120;
    const moving = Math.abs(this.vx) > 30 || !this.grounded;
    const spd = Math.min(1, (Math.abs(this.vx) + Math.abs(this.vy) * 0.5) / 300);
    this.scarf.update(p.neck[0], p.neck[1] + 1, dt, moving ? 150 : 210, wx, -this.vy * 0.5 + noise1(t * 2.1) * 120 - 30, 0.965, 3, 0, 900 + spd * 1800, t);
    const hx = p.hip[0] - this.face * 3, hy = p.hip[1] - 2;
    const wx2 = -this.vx * 2.2 + flow * 0.35 + noise1(t * 1.1 + 3) * 50;
    this.tailA.update(hx, hy, dt, 900, wx2, -this.vy * 0.25, 0.9, 3);
    this.tailB.update(hx + this.face * 2, hy + 1, dt, 900, wx2 * 0.8, -this.vy * 0.2, 0.9, 3);
    this.hair.update(p.head[0] - this.face * 4, p.head[1] - 2, dt, 380, wx2 * 1.2, -this.vy * 0.2, 0.9, 2);
  }
}

// ============================================================
//  ENEMIES
// ============================================================
class Enemy {
  constructor(game, x, y, w, h, hp) {
    this.game = game; this.x = x; this.y = y; this.px = x; this.py = y; this.w = w; this.h = h;
    this.vx = 0; this.vy = 0; this.face = -1; this.hp = hp; this.maxHp = hp;
    this.state = 'idle'; this.st = 0; this.dead = false; this.remove = false; this.dying = 0;
    this.flash = 0; this.hitStun = 0; this.grounded = false; this.flying = false;
    this.home = { x, y }; this.atkBox = null; this.atkId = 0; this.parryable = false; this.tele = null; // 'y' | 'r'
    this.kbX = 0; this.shakeT = 0; this.alive = true; this.aggro = false; this.id = Enemy.nid++;
    this.dropping = false;
  }
  get cx() { return this.x; } get cy() { return this.y - this.h / 2; }
  rect() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }
  player() { return this.game.player; }
  dxp() { return this.player().x - this.x; }
  dyp() { return this.player().y - this.y; }
  seesPlayer(range, vrange = 90) {
    const p = this.player();
    if (p.state === 'dead' || p.state === 'void') return false;
    return Math.abs(this.dxp()) < range && Math.abs(this.dyp()) < vrange && this.los(p.x, p.y - 24);
  }
  los(tx, ty) {
    const W = this.game.world, x0 = this.x, y0 = this.y - this.h * 0.6;
    const d = Math.hypot(tx - x0, ty - y0), n = Math.ceil(d / 16);
    for (let i = 1; i < n; i++) { const t = i / n; if (W.solidPt(lerp(x0, tx, t), lerp(y0, ty, t))) return false; }
    return true;
  }
  groundAhead(dir, dist = 14) {
    const W = this.game.world;
    const x = this.x + dir * (this.w / 2 + dist);
    const ty = Math.floor((this.y + 2) / T), tx = Math.floor(x / T);
    const t = W.tile(tx, ty);
    return (W.solid(tx, ty) || t === TL.ONEWAY) && !W.solid(tx, Math.floor((this.y - 10) / T));
  }
  wallAhead(dir) { const W = this.game.world; return W.solid(Math.floor((this.x + dir * (this.w / 2 + 3)) / T), Math.floor((this.y - this.h / 2) / T)); }
  setState(s) { this.state = s; this.st = 0; }
  physics(dt, grav = 1) {
    if (!this.flying) this.vy = Math.min(this.vy + 2200 * grav * dt, 700);
    const landed = this.game.world.move(this, this.vx * dt, this.vy * dt);
    if (landed || (this.vy > 0 && this.game.world.supported(this))) { if (this.vy > 0) this.vy = 0; this.grounded = true; } else this.grounded = this.game.world.supported(this) && this.vy >= 0;
    if (this.hitCeil && this.vy < 0) this.vy = 0;
  }
  // returns 'hit' | 'block' | 'none'
  hurt(dmg, info) {
    if (this.dead || this.dying) return 'none';
    this.hp -= dmg; this.flash = 0.12; this.shakeT = 0.14;
    if (this.hp <= 0) { this.die(info); return 'hit'; }
    this.onHurt(dmg, info);
    return 'hit';
  }
  onHurt() {}
  onParried() {}
  die(info) {
    this.dying = 0.001; this.dead = true; this.atkBox = null; this.tele = null;
    this.vx = (info && info.dir || 0) * 120; this.vy = -120;
    this.game.onEnemyKilled(this);
  }
  baseUpdate(dt) {
    this.px = this.x; this.py = this.y; this.st += dt;
    this.flash = Math.max(0, this.flash - dt); this.shakeT = Math.max(0, this.shakeT - dt);
    if (this.dying) {
      this.dying += dt;
      this.vx *= 0.92; if (!this.flying) this.physics(dt, 0.4); else { this.x += this.vx * dt; this.y += this.vy * dt; this.vy += 300 * dt; }
      if (Math.random() < 0.6) FX.dissolve(this, this.dissolveColor || '#ffffff');
      if (this.dying > (this.dieTime || 0.7)) this.remove = true;
      return false;
    }
    return true;
  }
}
Enemy.nid = 1;

const WHISPERS = ['……我的……鋪子……', '……誰……在叫我……', '……天黑了……該回家了……', '……我叫……我叫……', '……鐘……停了嗎……', '……娘……', '……還沒……送到……', '……好冷……'];

// ------------------------------------------------------------
//  無名者 SHADE
// ------------------------------------------------------------
class Shade extends Enemy {

const Sprites = (() => {
  const cache = {};

    glow(color, hard = 0) {

        const [r, gg, b] = hexToRgb(color);
        const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        gr.addColorStop(0, `rgba(${r},${gg},${b},1)`);
        gr.addColorStop(hard ? 0.35 : 0.18, `rgba(${r},${gg},${b},${hard ? 0.8 : 0.55})`);
        gr.addColorStop(0.55, `rgba(${r},${gg},${b},0.16)`);
        gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        g.fillStyle = gr; g.fillRect(0, 0, s, s);

    },
    soft(color) {

      if (!cache[key]) cache[key] = mk(64, (g, s) => {
        const [r, gg, b] = hexToRgb(color);
        const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        gr.addColorStop(0, `rgba(${r},${gg},${b},0.9)`); gr.addColorStop(0.5, `rgba(${r},${gg},${b},0.45)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        g.fillStyle = gr; g.fillRect(0, 0, s, s);
      });
      return cache[key];
    },
    star(color) {
      const key = 't' + color;
      if (!cache[key]) cache[key] = mk(96, (g, s) => {
        g.translate(s / 2, s / 2); g.fillStyle = color;
        g.shadowColor = color; g.shadowBlur = 10;
        for (let k = 0; k < 2; k++) { g.beginPath(); g.moveTo(0, -s * 0.46); g.quadraticCurveTo(2, -2, s * 0.46, 0); g.quadraticCurveTo(2, 2, 0, s * 0.46); g.quadraticCurveTo(-2, 2, -s * 0.46, 0); g.quadraticCurveTo(-2, -2, 0, -s * 0.46); g.fill(); g.rotate(Math.PI / 4); g.scale(0.55, 0.55); }
      });

    }

})();

    },
    wallDust(x, y, th, n = 1) { const c = themeDust(th); for (let i = 0; i < n; i++) add({ k: 'dust', x, y: y + rand(-6, 6), vx: rand(-20, 20), vy: rand(-30, 10), life: 0.4, max: 0.4, size: rand(3, 5), grow: 8, color: c, drag: 3, alpha: 0.4 }); },
    puff(x, y, color, n, size = 1) { for (let i = 0; i < n; i++) add({ k: 'dust', x: x + rand(-10, 10), y: y + rand(-10, 10), vx: rand(-40, 40), vy: rand(-40, 20), life: 0.5, max: 0.5, size: rand(5, 10) * size, grow: 12, color, drag: 3, alpha: 0.35 }); },

    ember(x, y) { add({ k: 'mote', x, y, vx: rand(-20, 20), vy: -rand(40, 120), life: rand(0.5, 1.2), max: 1.2, size: rand(1, 2.4), color: '#ffb35a', add: true, drag: 0.5 }); },
    flame(x, y) { add({ k: 'flame', x, y, vx: rand(-15, 15), vy: -rand(260, 380), life: rand(0.25, 0.4), max: 0.4, size: rand(8, 13), color: '#ff8a3a', add: true, drag: 1.5 }); },

    text(x, y, str, o = {}) { return eff({ k: 'text', x, y, str, t: 0, dur: o.dur || 3, size: o.size || 12, color: o.color || '#ffffff', vy: o.vy == null ? -8 : o.vy, alpha: o.alpha || 0.85, font: o.font || 500 }); },
    update(dt) {

    if (p.landT > 0) { const u = p.landT / 0.14; sy = 1 - 0.16 * p.landPow * u; sx = 1 + 0.12 * p.landPow * u; }
    if (!p.grounded && p.vy < -300 && p.state === 'move') { sy = 1.06; sx = 0.95; }
    if (p.state === 'dash') { sx = 1.12; sy = 0.92; }
    this.pose.sx = expDecay(this.pose.sx, sx, 30, dt); this.pose.sy = expDecay(this.pose.sy, sy, 30, dt);
    if (p.recallPose > 0) { const r = p.recallPose / 0.32; this.pose.aB = lerp(this.pose.aB, 2.2, r); this.pose.eB = lerp(this.pose.eB, 0.1, r); this.pose.glow = Math.max(this.pose.glow, r); }
    p.pose = solvePose(this.pose, p.x, p.y, p.face);
    p.poseRaw = this.pose;
  }
}
