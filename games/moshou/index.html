<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>墨守</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 墨守 — layout: full-bleed 3D battlefield; HUD as bronze-framed bars and cinnabar seals; menus as bamboo slips over ink */
:root {
  color-scheme: dark;
  --ink: #0f0d0b; --ink2: #1a1612; --ink3: #26201a;
  --slip: #d9c69c; --slip2: #c9b283; --slipdk: #9c8458; --slipink: #1d1712;
  --paper: #efe6d2; --muted: #a79a82; --bronze: #bf9352; --bronzedk: #6e5431;
  --patina: #5fd0b6; --patinadk: #2e7a6a; --cinnabar: #cf452c; --lacquer: #7a1a14; --gold: #f0c25a;
  --f-display: 'Noto Serif TC', 'Noto Serif CJK TC', 'Songti TC', 'PMingLiU', serif;
  --f-brush: 'Ma Shan Zheng', 'Noto Serif TC', 'Noto Serif CJK TC', serif;
  --f-body: 'LXGW WenKai TC', 'Noto Serif TC', 'Noto Serif CJK TC', 'Microsoft JhengHei', serif;
  --s: max(6.5px, min(1vw, 1.78vh));
}
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--ink); color: var(--paper); }
body { font-family: var(--f-body); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#gl, #fx2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx2d { pointer-events: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--patina); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- common pieces ---------- */
.seal { display: inline-grid; place-items: center; background: var(--cinnabar); color: #fbead7; font-family: var(--f-display); font-weight: 900; border-radius: calc(var(--s) * .25); box-shadow: inset 0 0 0 calc(var(--s) * .14) rgba(255,236,214,.4), 0 calc(var(--s)*.1) calc(var(--s)*.3) rgba(0,0,0,.4); line-height: 1; }
.seal.teal { background: var(--patinadk); box-shadow: inset 0 0 0 calc(var(--s) * .14) rgba(170,255,230,.35); }
.seal.bronze { background: var(--bronzedk); }
.seal.ghost { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 calc(var(--s) * .12) rgba(167,154,130,.5); }
.slipbg {
  background:
    linear-gradient(180deg, rgba(255,250,235,.28), rgba(0,0,0,.05) 40%, rgba(0,0,0,.12)),
    repeating-linear-gradient(90deg, var(--slip) 0 calc(var(--s)*2.2), #cdb888 calc(var(--s)*2.2) calc(var(--s)*2.28), var(--slip) calc(var(--s)*2.28) calc(var(--s)*4.4));
  color: var(--slipink);
}
.btn { cursor: pointer; border: 0; padding: calc(var(--s)*.7) calc(var(--s)*1.6); border-radius: calc(var(--s)*.3); font-family: var(--f-display); font-weight: 700; font-size: calc(var(--s)*1.35); letter-spacing: .12em; transition: transform .12s, box-shadow .12s, background .12s; }
.btn.slipb { background: linear-gradient(180deg, #e2d1a8, #cdb683); color: var(--slipink); box-shadow: 0 calc(var(--s)*.2) 0 #8f7650, 0 calc(var(--s)*.5) calc(var(--s)*1) rgba(0,0,0,.45); }
.btn.slipb:hover, .btn.slipb.sel { transform: translateY(-2px); box-shadow: 0 calc(var(--s)*.25) 0 #8f7650, 0 0 0 2px var(--patina), 0 calc(var(--s)*.6) calc(var(--s)*1.6) rgba(95,208,182,.35); }
.btn.inkb { background: rgba(26,22,18,.8); color: var(--paper); box-shadow: inset 0 0 0 1px rgba(191,147,82,.45); }
.btn.inkb:hover, .btn.inkb.sel { box-shadow: inset 0 0 0 1px var(--patina), 0 0 calc(var(--s)*1.2) rgba(95,208,182,.3); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.key { display: inline-grid; place-items: center; min-width: 1.6em; padding: 0 .35em; height: 1.6em; border-radius: .3em; background: rgba(239,230,210,.12); box-shadow: inset 0 0 0 1px rgba(239,230,210,.3); font-family: var(--f-display); font-size: .78em; font-weight: 700; margin: 0 .2em; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-size: calc(var(--s) * 1.2); }
#xpbar { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--s)*.55); background: rgba(10,8,6,.7); box-shadow: inset 0 -1px 0 rgba(191,147,82,.5); }
#xpfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #2e7a6a, var(--patina)); box-shadow: 0 0 calc(var(--s)*1) var(--patina); transition: width .15s; }
#lvl { position: absolute; left: calc(var(--s)*1.2); top: calc(var(--s)*1.2); display: flex; align-items: center; gap: calc(var(--s)*.6); }
#lvl .seal { width: calc(var(--s)*3.2); height: calc(var(--s)*3.2); font-size: calc(var(--s)*1.3); flex-direction: column; }
#lvl .seal small { font-size: .55em; font-weight: 700; opacity: .85; }
#slots { display: grid; gap: calc(var(--s)*.35); }
.slotrow { display: flex; gap: calc(var(--s)*.35); }
.slot { position: relative; width: calc(var(--s)*2.6); height: calc(var(--s)*2.6); display: grid; place-items: center; border-radius: calc(var(--s)*.25); background: rgba(15,13,11,.65); box-shadow: inset 0 0 0 1px rgba(191,147,82,.35); font-family: var(--f-display); font-weight: 900; font-size: calc(var(--s)*1.35); color: var(--paper); }
.slot.w { background: rgba(122,26,20,.85); box-shadow: inset 0 0 0 1px rgba(255,210,170,.35); }
.slot.evo { background: linear-gradient(135deg, #8a5a14, #d8a33e); color: #1a1208; box-shadow: 0 0 calc(var(--s)*.8) rgba(240,194,90,.7), inset 0 0 0 1px #ffe3a0; }
.slot.p { width: calc(var(--s)*2.1); height: calc(var(--s)*2.1); font-size: calc(var(--s)*1.05); background: rgba(46,122,106,.55); box-shadow: inset 0 0 0 1px rgba(160,255,230,.3); }
.slot.empty { color: transparent; background: rgba(15,13,11,.35); box-shadow: inset 0 0 0 1px rgba(191,147,82,.18); }
.slot .lv { position: absolute; right: calc(var(--s)*.1); bottom: calc(var(--s)*-.05); font-size: .5em; color: #ffe8c8; text-shadow: 0 0 3px #000, 0 0 3px #000; }
#daybox { position: absolute; left: 50%; top: calc(var(--s)*1.1); transform: translateX(-50%); text-align: center; min-width: calc(var(--s)*30); }
#dayname { font-family: var(--f-display); font-weight: 700; letter-spacing: .3em; font-size: calc(var(--s)*1.05); color: var(--slip); text-shadow: 0 1px 3px #000; }
#timebar { position: relative; margin: calc(var(--s)*.5) auto 0; width: calc(var(--s)*28); height: calc(var(--s)*.5); background: rgba(10,8,6,.7); box-shadow: inset 0 0 0 1px rgba(191,147,82,.5); border-radius: 99px; }
#timefill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, #e9c989, #e0763e); }
#timesun { position: absolute; top: 50%; width: calc(var(--s)*1.3); height: calc(var(--s)*1.3); margin: calc(var(--s)*-.65) 0 0 calc(var(--s)*-.65); border-radius: 50%; background: radial-gradient(circle, #fff3c4, #f0a040 60%, rgba(240,120,40,0) 72%); left: 0; }
#timetxt { margin-top: calc(var(--s)*.45); font-family: var(--f-display); font-weight: 700; font-size: calc(var(--s)*1.5); font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px #000; }
#timetxt small { font-size: .6em; color: var(--muted); margin-right: .5em; letter-spacing: .15em; }
#bossbar { position: absolute; left: 50%; top: calc(var(--s)*1.0); transform: translateX(-50%); width: min(60vw, calc(var(--s)*60)); text-align: center; }
#bossname { font-family: var(--f-display); font-weight: 900; font-size: calc(var(--s)*2); letter-spacing: .25em; color: #ffe6cf; text-shadow: 0 0 calc(var(--s)*.8) rgba(255,90,60,.6), 0 2px 4px #000; }
#bosssub { font-size: calc(var(--s)*1); color: #e7a58f; letter-spacing: .3em; margin-left: .6em; font-weight: 700; font-family: var(--f-display); }
#bosstrack { position: relative; margin-top: calc(var(--s)*.4); height: calc(var(--s)*1.1); background: rgba(10,6,5,.8); box-shadow: inset 0 0 0 1px rgba(255,120,80,.45); border-radius: 2px; overflow: hidden; }
#bosslag { position: absolute; inset: 0; width: 100%; background: #f3d9a8; transition: width .6s ease-out .15s; }
#bossfill { position: absolute; inset: 0; width: 100%; background: linear-gradient(180deg, #e0472f, #8c1c12); }
#bosstrack i { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.6); }
#ninebar { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); width: min(52vw, calc(var(--s)*46)); text-align: center; }
#ninebar b { font-family: var(--f-display); font-size: calc(var(--s)*1.6); letter-spacing: .3em; color: #ffd0a0; text-shadow: 0 0 10px #ff4020, 0 2px 3px #000; }
.ntrack { position: relative; height: calc(var(--s)*.8); margin-top: calc(var(--s)*.5); background: rgba(10,6,5,.85); box-shadow: inset 0 0 0 1px rgba(255,160,90,.6); }
.ntrack span { position: absolute; left: 0; top: 0; bottom: 0; }
#ninech { background: linear-gradient(90deg, #ff9a3c, #ff3a20); }
#nineneed { background: linear-gradient(90deg, #2e7a6a, var(--patina)); top: 60%; }
#tally { position: absolute; right: calc(var(--s)*1.4); top: calc(var(--s)*1.3); display: grid; gap: calc(var(--s)*.35); justify-items: end; font-family: var(--f-display); font-weight: 700; text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums; }
#tally div { display: flex; align-items: center; gap: calc(var(--s)*.5); font-size: calc(var(--s)*1.3); }
#tally .seal { width: calc(var(--s)*1.7); height: calc(var(--s)*1.7); font-size: calc(var(--s)*.95); }
#wallbox { position: absolute; left: calc(var(--s)*1.4); top: 50%; transform: translateY(-50%); display: grid; justify-items: center; gap: calc(var(--s)*.5); }
#wallbox .cren { width: calc(var(--s)*2.4); height: calc(var(--s)*.9); background: linear-gradient(90deg, var(--bronze) 0 30%, transparent 30% 36%, var(--bronze) 36% 64%, transparent 64% 70%, var(--bronze) 70%); opacity: .9; }
#walltrack { position: relative; width: calc(var(--s)*1.2); height: calc(var(--s)*16); background: rgba(10,8,6,.7); box-shadow: inset 0 0 0 1px rgba(191,147,82,.5); }
#wallfill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(0deg, #8a6d45, #c7a878); }
#wallbox.hit #wallfill { background: linear-gradient(0deg, #9c2a18, #e0563a); }
#wallbox.hit { animation: wallhit .5s infinite; }
@keyframes wallhit { 50% { filter: drop-shadow(0 0 8px #ff4020); } }
#wallbox label { font-family: var(--f-display); font-weight: 900; font-size: calc(var(--s)*1.05); writing-mode: vertical-rl; letter-spacing: .3em; color: var(--slip); text-shadow: 0 1px 3px #000; }
#bottom { position: absolute; left: 50%; bottom: calc(var(--s)*1.4); transform: translateX(-50%); display: flex; align-items: flex-end; gap: calc(var(--s)*1.4); }
#hpwrap { width: min(40vw, calc(var(--s)*34)); }
#hptop { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-display); font-weight: 700; text-shadow: 0 1px 3px #000; margin-bottom: calc(var(--s)*.3); }
#hptop .nm { font-size: calc(var(--s)*1.15); letter-spacing: .25em; color: var(--slip); }
#hptxt { font-size: calc(var(--s)*1.2); font-variant-numeric: tabular-nums; }
#hptrack { position: relative; height: calc(var(--s)*1.3); background: rgba(10,8,6,.75); clip-path: polygon(1% 0, 100% 8%, 99% 100%, 0 88%); }
#hplag { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #f6e3b8; transition: width .5s ease-out .1s; }
#hpfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(180deg, #e35a3a, #9a2415); }
#dash { display: flex; gap: calc(var(--s)*.4); margin-top: calc(var(--s)*.5); align-items: center; font-size: calc(var(--s)*.95); color: var(--muted); font-family: var(--f-display); }
#dash i { width: calc(var(--s)*.9); height: calc(var(--s)*.9); border-radius: 50%; background: #0c0a08; box-shadow: inset 0 0 0 1px rgba(191,147,82,.5); }
#dash i.on { background: radial-gradient(circle at 35% 35%, #444, #050505); box-shadow: 0 0 6px rgba(95,208,182,.8), inset 0 0 0 1px var(--patina); }
#ult { position: relative; width: calc(var(--s)*5.4); height: calc(var(--s)*5.4); border-radius: 50%; background: rgba(10,8,6,.75); box-shadow: inset 0 0 0 1px rgba(191,147,82,.6); display: grid; place-items: center; overflow: hidden; }
#ultfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, rgba(207,69,44,.95), rgba(240,120,70,.8)); }
#ult b { position: relative; font-family: var(--f-display); font-weight: 900; font-size: calc(var(--s)*2.2); color: #fbead7; text-shadow: 0 1px 3px #000; }
#ult .k { position: absolute; bottom: calc(var(--s)*.35); font-size: calc(var(--s)*.8); color: var(--paper); font-family: var(--f-display); }
#ult.ready { box-shadow: 0 0 0 2px #ffcf8a, 0 0 calc(var(--s)*2) rgba(255,120,60,.9); animation: ultpulse 1s infinite; }
@keyframes ultpulse { 50% { transform: scale(1.06); } }
#objective { position: absolute; left: 50%; top: calc(var(--s)*8.2); transform: translateX(-50%); display: flex; align-items: center; gap: calc(var(--s)*.6); padding: calc(var(--s)*.35) calc(var(--s)*1); background: rgba(15,13,11,.72); box-shadow: inset 0 0 0 1px rgba(240,194,90,.5); border-radius: 3px; font-weight: 700; font-size: calc(var(--s)*1.1); }
#objective .seal { width: calc(var(--s)*1.7); height: calc(var(--s)*1.7); font-size: calc(var(--s)*.95); background: #b88a2a; }
#objhp { width: calc(var(--s)*8); height: calc(var(--s)*.45); background: #111; box-shadow: inset 0 0 0 1px rgba(240,194,90,.5); position: relative; }
#objhp span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); }
#pausebtn { position: absolute; right: calc(var(--s)*1.2); bottom: calc(var(--s)*1.2); pointer-events: auto; opacity: .7; }

/* ---------- banners and toasts ---------- */
#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; opacity: 0; }
#banner.on { animation: bannerIn 2.2s ease forwards; }
#banner h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: calc(var(--s)*6); letter-spacing: .25em; color: #fff4e0; text-shadow: 0 0 calc(var(--s)*2) rgba(255,120,60,.55), 0 calc(var(--s)*.3) calc(var(--s)*.6) #000; }
#banner p { margin: calc(var(--s)*.6) 0 0; font-size: calc(var(--s)*1.5); letter-spacing: .35em; color: var(--slip); text-shadow: 0 1px 4px #000; font-weight: 700; }
#banner .bar { width: calc(var(--s)*26); height: 2px; margin: calc(var(--s)*.8) auto 0; background: linear-gradient(90deg, transparent, var(--cinnabar), transparent); }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(1.3); letter-spacing: .6em; filter: blur(6px); } 12% { opacity: 1; transform: scale(1); filter: blur(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(.98); } }
#banner.boss h2 { color: #ffd9c4; font-size: calc(var(--s)*6.5); }
#banner.boss p { color: #f08a6a; }
#toasts { position: absolute; left: 50%; top: calc(var(--s)*11); transform: translateX(-50%); display: grid; gap: calc(var(--s)*.4); justify-items: center; pointer-events: none; }
.toast { padding: calc(var(--s)*.45) calc(var(--s)*1.4); border-radius: 3px; background: rgba(15,13,11,.82); box-shadow: inset 0 0 0 1px rgba(191,147,82,.5); font-weight: 700; font-size: calc(var(--s)*1.15); letter-spacing: .08em; animation: toastIn .25s ease; white-space: nowrap; }
.toast.warn { box-shadow: inset 0 0 0 1px rgba(255,120,80,.7); color: #ffd2c0; }
.toast.bad { background: rgba(90,16,10,.88); box-shadow: inset 0 0 0 1px #ff6a40; color: #fff0e6; }
.toast.good { box-shadow: inset 0 0 0 1px var(--patina); color: #d8fff4; }
.toast.witness, .toast.elite { box-shadow: inset 0 0 0 1px var(--gold); color: #fff1cc; }
.toast.out { opacity: 0; transition: opacity .4s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; overflow: hidden; }
.veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(15,13,11,.35), rgba(8,7,6,.88) 75%); }
.dim { background: rgba(8,7,6,.72); backdrop-filter: blur(3px); }
.panel { position: relative; }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
h1, h2, h3 { text-wrap: balance; }

/* boot */
#scr-boot { display: grid; place-items: center; background: var(--ink); cursor: pointer; }
#scr-boot .bootin { text-align: center; }
#scr-boot .logo { font-family: var(--f-brush); font-size: calc(var(--s)*14); line-height: 1; color: var(--paper); letter-spacing: .1em; }
#scr-boot p { color: var(--muted); letter-spacing: .4em; font-size: calc(var(--s)*1.3); animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* title */
#scr-title .veil { background: linear-gradient(90deg, rgba(8,7,6,.92) 0%, rgba(8,7,6,.55) 38%, rgba(8,7,6,0) 62%), linear-gradient(0deg, rgba(8,7,6,.7), transparent 30%); }
.titleblock { position: absolute; left: calc(var(--s)*5); top: calc(var(--s)*4); display: flex; gap: calc(var(--s)*1.4); align-items: flex-start; }
.titleblock .big { writing-mode: vertical-rl; font-family: var(--f-brush); font-size: calc(var(--s)*14); line-height: .95; color: #f3ead8; text-shadow: 0 0 calc(var(--s)*3) rgba(0,0,0,.8); letter-spacing: -.02em; }
.titleblock .side { writing-mode: vertical-rl; display: flex; gap: calc(var(--s)*1); align-items: flex-start; margin-top: calc(var(--s)*1); }
.titleblock .side .seal { writing-mode: vertical-rl; width: calc(var(--s)*3.4); padding: calc(var(--s)*.6) 0; font-size: calc(var(--s)*1.5); letter-spacing: .1em; transform: rotate(-2deg); }
.titleblock .side span { font-family: var(--f-display); color: var(--muted); letter-spacing: .5em; font-size: calc(var(--s)*1.1); }
.menu { position: absolute; left: calc(var(--s)*27); bottom: calc(var(--s)*5); display: grid; gap: calc(var(--s)*.9); min-width: calc(var(--s)*21); }
.menu .btn { text-align: left; font-size: calc(var(--s)*1.6); padding: calc(var(--s)*.8) calc(var(--s)*1.8); }
.menu .btn small { display: block; font-family: var(--f-body); font-weight: 400; font-size: .62em; letter-spacing: .05em; opacity: .75; margin-top: .15em; }
.titlefoot { position: absolute; right: calc(var(--s)*2); bottom: calc(var(--s)*1.6); color: var(--muted); font-size: calc(var(--s)*1); letter-spacing: .12em; text-align: right; line-height: 1.8; }

/* generic modal card */
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, calc(var(--s)*80)); max-height: 88vh; display: flex; flex-direction: column; background: rgba(20,17,14,.96); box-shadow: 0 0 0 1px rgba(191,147,82,.5), 0 calc(var(--s)*2) calc(var(--s)*6) rgba(0,0,0,.7); border-radius: 4px; }
.card > header { display: flex; align-items: center; gap: calc(var(--s)*1); padding: calc(var(--s)*1.4) calc(var(--s)*2); border-bottom: 1px solid rgba(191,147,82,.3); }
.card > header h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: calc(var(--s)*2.2); letter-spacing: .3em; }
.card > header .seal { width: calc(var(--s)*2.6); height: calc(var(--s)*2.6); font-size: calc(var(--s)*1.3); }
.card > header .sp { flex: 1; }
.card .body { padding: calc(var(--s)*1.6) calc(var(--s)*2); overflow-y: auto; min-height: 0; }
.card > footer { display: flex; gap: calc(var(--s)*1); justify-content: flex-end; padding: calc(var(--s)*1.2) calc(var(--s)*2); border-top: 1px solid rgba(191,147,82,.25); flex-wrap: wrap; }
.coins { font-family: var(--f-display); font-weight: 700; font-size: calc(var(--s)*1.4); display: flex; gap: .4em; align-items: center; color: var(--gold); font-variant-numeric: tabular-nums; }

/* difficulty */

  plane(w, d) {
    const x = w / 2, z = d / 2;
    return this.quad([-x, 0, z], [x, 0, z], [x, 0, -z], [-x, 0, -z]);
  }
  // vertical quad facing +Z
  panel(w, h) {
    const x = w / 2, y = h / 2;
    return this.quad([-x, -y, 0], [x, -y, 0], [x, y, 0], [-x, y, 0]);
  }
  // extrude a star-shaped polygon (points in XZ, around origin) by height h
  prism(pts, h) {
    const y0 = -h / 2, y1 = h / 2, n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      this.quad([a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y1, b[1]], [a[0], y1, a[1]]);
      this.tri([0, y1, 0], [a[0], y1, a[1]], [b[0], y1, b[1]]);
      this.tri([0, y0, 0], [b[0], y0, b[1]], [a[0], y0, a[1]]);
    }
    return this;
  }
  gear(rIn, rOut, teeth, thick) {
    const pts = [];
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * TAU, w = TAU / teeth;
      pts.push([Math.cos(a) * rIn, Math.sin(a) * rIn]);
      pts.push([Math.cos(a + w * 0.2) * rOut, Math.sin(a + w * 0.2) * rOut]);
      pts.push([Math.cos(a + w * 0.5) * rOut, Math.sin(a + w * 0.5) * rOut]);
      pts.push([Math.cos(a + w * 0.7) * rIn, Math.sin(a + w * 0.7) * rIn]);
    }
    return this.prism(pts, thick);
  }
  // surface of revolution: profile [[r,y],...] bottom to top
  lathe(profile, seg) {
    seg = seg || 10;
    for (let i = 0; i < seg; i++) {
      const a0 = (i / seg) * TAU, a1 = ((i + 1) / seg) * TAU;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      for (let k = 0; k < profile.length - 1; k++) {
        const [r0, y0] = profile[k], [r1, y1] = profile[k + 1];
        const p0 = [r0 * c0, y0, r0 * s0], p1 = [r0 * c1, y0, r0 * s1];
        const q0 = [r1 * c0, y1, r1 * s0], q1 = [r1 * c1, y1, r1 * s1];
        this.tri(p0, q1, p1);
        this.tri(p0, q0, q1);
      }
    }
    return this;
  }
  // triangular prism roof along X: base depth d (z), height h, length w
  wedge(w, h, d) {
    const x = w / 2, z = d / 2;
    const a = [-x, 0, -z], b = [x, 0, -z], c = [x, 0, z], e = [-x, 0, z], t0 = [-x, h, 0], t1 = [x, h, 0];
    this.quad(a, b, c, e);        // bottom
    this.quad(b, a, t0, t1);      // back slope
    this.quad(e, c, t1, t0);      // front slope
    this.tri(a, e, t0);           // end caps
    this.tri(c, b, t1);
    return this;
  }
  ring(rIn, rOut, seg, h) {
    seg = seg || 24; h = h || 0.02;
    for (let i = 0; i < seg; i++) {
      const a0 = (i / seg) * TAU, a1 = ((i + 1) / seg) * TAU;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      this.quad([rIn * c0, h, rIn * s0], [rIn * c1, h, rIn * s1], [rOut * c1, h, rOut * s1], [rOut * c0, h, rOut * s0]);
    }
    return this;
  }
  build(name, opts) { return new Mesh(new Float32Array(this.v), name, opts); }
}

class Mesh {
  constructor(data, name, opts) {
    opts = opts || {};
    this.name = name || 'mesh';
    this.count = data.length / VSTRIDE;
    this.castShadow = opts.shadow !== false;
    this.layer = opts.layer || 0; // 0 = lit opaque, 1 = lit (no shadow receive / unlit-ish)
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    this.vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, VSTRIDE * 4, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, VSTRIDE * 4, 12);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, VSTRIDE * 4, 24);
    this.cap = opts.cap || 8;
    this.inst = new Float32Array(this.cap * ISTRIDE);
    this.ibo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ARRAY_BUFFER, this.inst.byteLength, gl.DYNAMIC_DRAW);
    for (let k = 0; k < 6; k++) {
      const loc = 3 + k;
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, ISTRIDE * 4, k * 16);
      gl.vertexAttribDivisor(loc, 1);
    }
    gl.bindVertexArray(null);
    this.n = 0;
    this.isStatic = !!opts.isStatic; // static meshes keep their instances across frames
    this.dirty = true;
    MESHES.push(this);
  }
  clearStatic() { this.n = 0; this.dirty = true; }
  _grow() {
    this.dirty = true;
    const nc = this.cap * 2;
    const ni = new Float32Array(nc * ISTRIDE);
    ni.set(this.inst);
    this.inst = ni; this.cap = nc;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ARRAY_BUFFER, ni.byteLength, gl.DYNAMIC_DRAW);
  }
  add(px, py, pz, yaw, pitch, roll, sx, sy, sz, flash, dis, extra, emis, tr, tg, tb, ta) {
    if (this.n >= this.cap) this._grow();
    const a = this.inst, o = this.n * ISTRIDE;
    writeTRS(a, o, px, py, pz, yaw, pitch, roll, sx, sy, sz);
    a[o + 16] = flash || 0; a[o + 17] = dis || 0; a[o + 18] = extra || 0; a[o + 19] = emis || 0;
    a[o + 20] = tr || 0; a[o + 21] = tg || 0; a[o + 22] = tb || 0; a[o + 23] = ta || 0;
    this.n++;
  }
  addMat(m, flash, dis, extra, emis, tr, tg, tb, ta) {
    if (this.n >= this.cap) this._grow();
    const a = this.inst, o = this.n * ISTRIDE;
    for (let i = 0; i < 16; i++) a[o + i] = m[i];
    a[o + 16] = flash || 0; a[o + 17] = dis || 0; a[o + 18] = extra || 0; a[o + 19] = emis || 0;
    a[o + 20] = tr || 0; a[o + 21] = tg || 0; a[o + 22] = tb || 0; a[o + 23] = ta || 0;
    this.n++;
  }
  upload() {
    if (!this.n) return;
    if (this.isStatic && !this.dirty) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.inst, 0, this.n * ISTRIDE);
    this.dirty = false;
  }
}

// Hierarchical rig for multi-part characters and machines.
// Parts are added parent-first; each keeps a local TRS that animation code edits.
const _rigTmp = m4();
class Rig {
  constructor() { this.parts = []; this.map = {}; }
  part(name, mesh, parent, px, py, pz, yaw, pitch, roll, sx, sy, sz) {
    const p = {
      name, mesh, parent: parent == null ? -1 : this.map[parent],
      px: px || 0, py: py || 0, pz: pz || 0, yaw: yaw || 0, pitch: pitch || 0, roll: roll || 0,
      sx: sx == null ? 1 : sx, sy: sy == null ? (sx == null ? 1 : sx) : sy, sz: sz == null ? (sx == null ? 1 : sx) : sz,
      bx: px || 0, by: py || 0, bz: pz || 0, byaw: yaw || 0, bpitch: pitch || 0, broll: roll || 0,
      world: m4(), visible: true, flash: 0, emis: 0, tint: null, dis: 0,
    };
    this.map[name] = this.parts.length;
    this.parts.push(p);
    return p;
  }
  get(name) { return this.parts[this.map[name]]; }
  reset() {
    for (const p of this.parts) { p.px = p.bx; p.py = p.by; p.pz = p.bz; p.yaw = p.byaw; p.pitch = p.bpitch; p.roll = p.broll; }
  }
  update(root) {
    for (const p of this.parts) {
      m4trs(_rigTmp, p.px, p.py, p.pz, p.yaw, p.pitch, p.roll, p.sx, p.sy, p.sz);
      if (p.parent < 0) m4mul(p.world, root, _rigTmp);
      else m4mul(p.world, this.parts[p.parent].world, _rigTmp);
    }
  }
  draw(flash, dis, emis, tint) {
    for (const p of this.parts) {
      if (!p.mesh || !p.visible) continue;
      const t = p.tint || tint;
      p.mesh.addMat(p.world, Math.max(flash || 0, p.flash), Math.max(dis || 0, p.dis), 0, (emis || 0) + p.emis,
        t ? t[0] : 0, t ? t[1] : 0, t ? t[2] : 0, t ? t[3] : 0);
    }
  }
  // world position of a part's origin
  pos(name, out) {
    const w = this.parts[this.map[name]].world;
    out = out || [0, 0, 0];
    out[0] = w[12]; out[1] = w[13]; out[2] = w[14];
    return out;
  }
}

// ---------------------------------------------------------------------------
// 03_shaders.js — GLSL sources (WebGL2 / GLSL ES 3.00)
// ---------------------------------------------------------------------------
const MAXL = 16;

const GLSL_COMMON = `
uniform vec3 u_camPos;
uniform vec3 u_sunDir;
uniform vec3 u_sunCol;
uniform vec3 u_skyCol;
uniform vec3 u_gndCol;
uniform vec3 u_fogCol;
uniform float u_fogDen;
uniform float u_fogBase;
uniform highp sampler2DShadow u_shadow;
uniform float u_shadowTexel;
uniform float u_shadowOn;
uniform int u_nl;
uniform vec4 u_lp[${MAXL}];
uniform vec4 u_lc[${MAXL}];
uniform float u_time;
uniform vec3 u_rim;

float shadowAt(vec4 sp, float ndl) {
  vec3 c = sp.xyz / sp.w * 0.5 + 0.5;
  if (c.x <= 0.001 || c.x >= 0.999 || c.y <= 0.001 || c.y >= 0.999 || c.z >= 1.0) return 1.0;
  float bias = 0.00035 + 0.0012 * (1.0 - ndl);
  float z = c.z - bias;
  float t = u_shadowTexel;
  float s = 0.0;
  s += texture(u_shadow, vec3(c.xy + vec2(-1.0, -1.0) * t, z));
  s += texture(u_shadow, vec3(c.xy + vec2( 0.0, -1.0) * t, z));
  s += texture(u_shadow, vec3(c.xy + vec2( 1.0, -1.0) * t, z));
  s += texture(u_shadow, vec3(c.xy + vec2(-1.0,  0.0) * t, z));
  s += texture(u_shadow, vec3(c.xy, z));
  s += texture(u_shadow, vec3(c.xy + vec2( 1.0,  0.0) * t, z));
  s += texture(u_shadow, vec3(c.xy + vec2(-1.0,  1.0) * t, z));
  s += texture(u_shadow, vec3(c.xy + vec2( 0.0,  1.0) * t, z));
  s += texture(u_shadow, vec3(c.xy + vec2( 1.0,  1.0) * t, z));
  return s / 9.0;
}

vec3 lightAt(vec3 p, vec3 n, vec3 base, vec4 sp) {
  float ndl = dot(n, u_sunDir);
  float sh = u_shadowOn > 0.5 ? shadowAt(sp, max(ndl, 0.0)) : 1.0;
  float wrap = clamp((ndl + 0.25) / 1.25, 0.0, 1.0);
  vec3 hemi = mix(u_gndCol, u_skyCol, n.y * 0.5 + 0.5);
  vec3 L = hemi + u_sunCol * wrap * sh;
  vec3 pl = vec3(0.0);
  for (int i = 0; i < ${MAXL}; i++) {
    if (i >= u_nl) break;
    vec3 d = u_lp[i].xyz - p;
    float d2 = dot(d, d);
    float r = u_lp[i].w;
    float att = clamp(1.0 - d2 / (r * r), 0.0, 1.0);
    att *= att;
    float nd = clamp(dot(n, d * inversesqrt(d2 + 1e-4)) * 0.7 + 0.3, 0.0, 1.0);
    pl += u_lc[i].rgb * u_lc[i].a * att * nd;
  }
  // soft knee: many overlapping fires glow hot, but never burn the frame to white
  float pm = max(max(pl.r, pl.g), pl.b);
  if (pm > 1.4) pl *= (1.4 + (pm - 1.4) * 0.22) / pm;
  return base * (L + pl);
}

vec3 applyFog(vec3 col, vec3 p) {
  float d = max(length(u_camPos - p) - u_fogBase, 0.0);
  float f = 1.0 - exp(-u_fogDen * u_fogDen * d * d);
  return mix(col, u_fogCol, clamp(f, 0.0, 1.0));
}

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s / 0.96875;
}
`;

const VS_LIT = `#version 300 es
layout(location=0) in vec3 a_pos;
layout(location=1) in vec3 a_nrm;
layout(location=2) in vec4 a_col;
layout(location=3) in vec4 i_m0;
layout(location=4) in vec4 i_m1;
layout(location=5) in vec4 i_m2;
layout(location=6) in vec4 i_m3;
layout(location=7) in vec4 i_p;
layout(location=8) in vec4 i_t;
uniform mat4 u_vp;
uniform mat4 u_smat;
out vec3 v_wp; out vec3 v_n; out vec4 v_c; out vec4 v_p; out vec4 v_t; out vec4 v_sp; out vec3 v_lp;
void main() {
  mat4 m = mat4(i_m0, i_m1, i_m2, i_m3);
  vec4 wp = m * vec4(a_pos, 1.0);
  v_wp = wp.xyz;
  v_n = mat3(m) * a_nrm;
  v_c = a_col; v_p = i_p; v_t = i_t; v_lp = a_pos;
  v_sp = u_smat * wp;
  gl_Position = u_vp * wp;
}`;

const FS_LIT = `#version 300 es
precision highp float;
precision highp sampler2DShadow;
in vec3 v_wp; in vec3 v_n; in vec4 v_c; in vec4 v_p; in vec4 v_t; in vec4 v_sp; in vec3 v_lp;
out vec4 o;
${GLSL_COMMON}
uniform float u_emis;
float h3(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
void main() {
  vec3 n = normalize(v_n);
  vec3 V = normalize(u_camPos - v_wp);
  if (dot(n, V) < 0.0) n = -n;          // two-sided, and correct for mirrored instances too
  float edge = 0.0;
  if (v_p.y > 0.001) {
    float h = h3(floor(v_lp * 8.0) + 0.37);
    if (h < v_p.y) discard;
    edge = 1.0 - smoothstep(0.0, 0.14, h - v_p.y);
  }
  vec3 base = mix(v_c.rgb, v_t.rgb, v_t.a);
  vec3 col = lightAt(v_wp, n, base, v_sp);
  float rim = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 4.0);
  col += (base * 0.6 + 0.4) * u_rim * rim;
  col += base * (v_c.a * u_emis + v_p.w);
  col += vec3(1.8, 0.75, 0.25) * edge * 3.0;
  col = mix(col, vec3(2.1, 1.9, 1.7), clamp(v_p.x, 0.0, 1.0) * 0.85);
  col = applyFog(col, v_wp);
  o = vec4(col, 1.0);
}`;

const FS_GROUND = `#version 300 es
precision highp float;
precision highp sampler2DShadow;
in vec3 v_wp; in vec4 v_sp;
out vec4 o;
${GLSL_COMMON}
uniform vec3 u_g0; uniform vec3 u_g1; uniform vec3 u_g2; uniform vec3 u_g3; uniform vec3 u_g4;
uniform vec4 u_gp;   // grass, stones, wet, ruts
uniform vec4 u_gp2;  // wallZ, mode(0 field,1 cave,2 flood mud), scorch, detailScale
float heightAt(vec2 p) {

}

  float sr = length(f);

  vec3 sc = mix(c * 1.05, u_g3, 0.5) * (0.82 + 0.3 * hash12(cell + 1.7)) * (1.0 - 0.35 * smoothstep(0.05, 0.2, sr));

const FS_WATER = `#version 300 es

  g += vec2(cos(p.x * 0.31 + t * 0.9 + p.y * 0.1), cos(p.y * 0.27 - t * 0.8)) * 0.10;
  g += vec2(cos(p.x * 0.9 - t * 1.7 + p.y * 0.4), cos(p.y * 1.1 + t * 1.5 - p.x * 0.3)) * 0.05;
  float n1 = vnoise(p * 0.8 + vec2(t * 0.35, t * 0.2));
  float n2 = vnoise(p * 0.8 + vec2(t * 0.35 + 0.1, t * 0.2));
  float n3 = vnoise(p * 0.8 + vec2(t * 0.35, t * 0.2 + 0.1));
  g += vec2(n2 - n1, n3 - n1) * 1.8;
  for (int i = 0; i < 24; i++) {
    if (i >= u_nr) break;
    vec2 d = p - u_rip[i].xy;
    float r = length(d) + 1e-3;
    float age = u_rip[i].z;
    float w = sin(r * 5.0 - age * 10.0) * exp(-age * 1.6) * exp(-r * 0.45) * u_rip[i].w;
    g += d / r * w * 0.6;
  }
  vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
  vec3 V = normalize(u_camPos - v_wp);
  float fres = 0.03 + 0.97 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
  vec3 sc = v_sp.xyz / v_sp.w * 0.5 + 0.5;
  float sh = u_shadowOn > 0.5 ? shadowAt(v_sp, 1.0) : 1.0;
  vec3 refl = mix(u_skyCol * 1.4, u_fogCol, 0.35);
  vec3 body = mix(u_waterDeep, u_waterCol, 0.4 + 0.3 * n1) * (u_skyCol + u_sunCol * 0.35 * sh);
  vec3 col = mix(body, refl, clamp(fres * 1.6, 0.0, 1.0));
  vec3 H = normalize(u_sunDir + V);
  col += min(u_sunCol, vec3(1.3)) * pow(max(dot(n, H), 0.0), 220.0) * 2.4 * sh;
  for (int i = 0; i < ${MAXL}; i++) {
    if (i >= u_nl) break;
    vec3 d = u_lp[i].xyz - v_wp;
    float d2 = dot(d, d);
    float r = u_lp[i].w * 1.6;
    float att = clamp(1.0 - d2 / (r * r), 0.0, 1.0);
    vec3 L = d * inversesqrt(d2 + 1e-4);
    vec3 Hl = normalize(L + V);
    col += u_lc[i].rgb * u_lc[i].a * att * (pow(max(dot(n, Hl), 0.0), 60.0) * 2.5 + 0.08);
  }
  col = applyFog(col, v_wp);
  o = vec4(col, 0.82 + fres * 0.18);
}`;

in vec2 v_uv; in vec4 v_col; in vec4 v_sh; in float v_d;

uniform float u_add;
uniform vec3 u_fogCol; uniform float u_fogDen; uniform float u_fogBase;

const FS_DECAL = `#version 300 es
precision highp float;
in vec2 v_uv; in vec4 v_s; in vec4 v_col; in vec4 v_p; in vec2 v_wxz;
out vec4 o;
uniform float u_time;
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
void main() {
  int sh = int(v_s.z + 0.5);
  float pr = v_s.w;
  float r = length(v_uv);
  float a = 0.0;
  vec3 col = v_col.rgb;
  if (sh == 0) {            // circle telegraph
    if (r > 1.0) discard;
    float pulse = 0.5 + 0.5 * sin(u_time * 14.0);
    a = 0.14 + 0.32 * step(r, pr) + smoothstep(0.9, 0.98, r) * (0.7 + 0.3 * pulse);
    a *= smoothstep(1.0, 0.985, r);
  } else if (sh == 1) {     // rectangle telegraph (start at v=-1)
    float along = (v_uv.y + 1.0) * 0.5;
    float ex = abs(v_uv.x);
    float border = max(smoothstep(0.86, 0.97, ex), smoothstep(0.02, 0.0, along) + smoothstep(0.985, 1.0, along));
    a = 0.14 + 0.30 * step(along, pr) + border * 0.75;
    a *= step(ex, 1.0);
  } else if (sh == 2) {     // sector telegraph, half-angle in v_p.x, facing +v
    if (r > 1.0) discard;
    float ang = abs(atan(v_uv.x, v_uv.y));
    if (ang > v_p.x) discard;
    float edge = max(smoothstep(0.9, 0.98, r), smoothstep(v_p.x - 0.05, v_p.x, ang));
    a = 0.14 + 0.3 * step(r, pr) + edge * 0.7;
  } else if (sh == 3) {     // shockwave ring
    float w = v_p.x;
    a = smoothstep(w, 0.0, abs(r - pr)) * (1.0 - pr);
  } else if (sh == 4) {     // ink stroke
    float n = vnoise(v_wxz * 3.0 + v_p.y * 10.0);
    float ex = abs(v_uv.x) + (n - 0.5) * 0.55;
    float along = abs(v_uv.y);
    a = smoothstep(1.0, 0.55, ex) * smoothstep(1.0, 0.9, along + (vnoise(v_wxz * 1.3) - 0.5) * 0.2);
    float spl = step(0.93, hash12(floor(v_wxz * 4.0))) * smoothstep(1.8, 0.6, abs(v_uv.x));
    a = max(a, spl * 0.9);
  } else if (sh == 5) {     // scorch / blot
    float n = vnoise(v_wxz * 1.2 + v_p.y * 5.0) * 0.6 + vnoise(v_wxz * 4.0) * 0.4;
    a = smoothstep(1.0, 0.4, r + (n - 0.5) * 0.6);
  } else if (sh == 6) {     // soft glow disc
    a = pow(max(1.0 - r, 0.0), 1.6);
  } else if (sh == 7) {     // marker ring with inner dot
    float ring = smoothstep(0.08, 0.0, abs(r - 0.85 - 0.05 * sin(u_time * 5.0)));
    a = ring + smoothstep(0.2, 0.1, r) * 0.6;
  } else if (sh == 8) {     // expanding square frame
    float m = max(abs(v_uv.x), abs(v_uv.y));
    a = smoothstep(0.06, 0.0, abs(m - pr)) * (1.0 - pr * 0.7);
  } else if (sh == 9) {     // thin circle outline
    a = smoothstep(v_p.x, 0.0, abs(r - 0.96));
  } else if (sh == 10) {    // blob shadow
    a = smoothstep(1.0, 0.2, r) * 0.9;
  }
  a *= v_col.a;
  if (a < 0.004) discard;
  o = vec4(col, a);
}`;

const FS_BLOOM_DOWN = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_tex; uniform vec2 u_ts; uniform float u_prefilter; uniform float u_thresh; uniform float u_knee;
vec3 s(vec2 off) { return texture(u_tex, v_uv + u_ts * off).rgb; }
void main() {
  vec3 a = s(vec2(-2, 2)), b = s(vec2(0, 2)), c = s(vec2(2, 2));
  vec3 d = s(vec2(-2, 0)), e = s(vec2(0, 0)), f = s(vec2(2, 0));
  vec3 g = s(vec2(-2, -2)), h = s(vec2(0, -2)), i = s(vec2(2, -2));
  vec3 j = s(vec2(-1, 1)), k = s(vec2(1, 1)), l = s(vec2(-1, -1)), m = s(vec2(1, -1));
  vec3 r = e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125;
  if (u_prefilter > 0.5) {
    r = min(r, vec3(40.0));
    float br = max(r.r, max(r.g, r.b));
    float soft = clamp(br - u_thresh + u_knee, 0.0, 2.0 * u_knee);
    soft = soft * soft / (4.0 * u_knee + 1e-4);
    float contrib = max(soft, br - u_thresh) / max(br, 1e-4);
    r *= contrib;
  }
  o = vec4(r, 1.0);
}`;
const FS_BLOOM_UP = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_tex; uniform vec2 u_ts; uniform float u_radius;
void main() {
  vec4 d = vec4(u_ts.x, u_ts.y, -u_ts.x, 0.0) * u_radius;
  vec3 s = texture(u_tex, v_uv - d.xy).rgb;
  s += texture(u_tex, v_uv - d.wy).rgb * 2.0;
  s += texture(u_tex, v_uv - d.zy).rgb;
  s += texture(u_tex, v_uv + d.zw).rgb * 2.0;
  s += texture(u_tex, v_uv).rgb * 4.0;
  s += texture(u_tex, v_uv + d.xw).rgb * 2.0;
  s += texture(u_tex, v_uv + d.zy).rgb;
  s += texture(u_tex, v_uv + d.wy).rgb * 2.0;
  s += texture(u_tex, v_uv + d.xy).rgb;

const FS_COMPOSITE = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D u_scene; uniform sampler2D u_bloom;
uniform float u_bloomI; uniform float u_exposure; uniform float u_time; uniform vec2 u_res;
uniform vec3 u_lift; uniform vec3 u_gamma; uniform vec3 u_gain; uniform float u_sat; uniform float u_contrast;
uniform float u_vig; uniform float u_grain; uniform float u_ca; uniform vec4 u_flash; uniform float u_desat;
uniform vec3 u_tint; uniform float u_tintAmt;
vec3 aces(vec3 x) { const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14; return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0); }
void main() {
  vec2 uv = v_uv;
  vec2 dc = uv - 0.5;
  vec3 col;
  if (u_ca > 0.0001) {
    vec2 off = dc * u_ca;
    col = vec3(texture(u_scene, uv - off).r, texture(u_scene, uv).g, texture(u_scene, uv + off).b);
  } else col = texture(u_scene, uv).rgb;
  col += texture(u_bloom, uv).rgb * u_bloomI;
  col *= u_exposure;
  col = aces(col);
  col = pow(col, vec3(1.0 / 2.2));
  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(l), col, u_sat * (1.0 - u_desat));
  col = mix(col, col * u_tint, u_tintAmt);
  col = (col - 0.5) * u_contrast + 0.5;
  col = col * u_gain + u_lift;
  col = pow(max(col, 0.0), u_gamma);
  float vr = length(dc * vec2(1.0, 0.8));
  float v = smoothstep(0.95, 0.25, vr);
  col *= mix(1.0 - u_vig, 1.0, v);
  col = mix(col, u_flash.rgb, u_flash.a * smoothstep(0.15, 0.85, vr));
  float g = fract(sin(dot(floor(uv * u_res) + fract(u_time * 7.13) * 91.7, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
  col += g * u_grain;
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

// ---------------------------------------------------------------------------
// 04_renderer.js — frame renderer: shadows, HDR MSAA scene, bloom, grading
// ---------------------------------------------------------------------------
class QuadBatch {
  // 16 floats per instance (4 x vec4), drawn as instanced triangle strips
  constructor(cap) {
    this.cap = cap; this.a = new Float32Array(cap * 16); this.n = 0;
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, this.a.byteLength, gl.DYNAMIC_DRAW);
    for (let k = 0; k < 4; k++) {
      gl.enableVertexAttribArray(k);
      gl.vertexAttribPointer(k, 4, gl.FLOAT, false, 64, k * 16);
      gl.vertexAttribDivisor(k, 1);
    }
    gl.bindVertexArray(null);
  }
  alloc() {
    if (this.n >= this.cap) {
      const nc = this.cap * 2, na = new Float32Array(nc * 16);
      na.set(this.a); this.a = na; this.cap = nc;
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
      gl.bufferData(gl.ARRAY_BUFFER, na.byteLength, gl.DYNAMIC_DRAW);
    }
    return (this.n++) * 16;
  }
  upload() {
    if (!this.n) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.a, 0, this.n * 16);
  }
  draw() {
    if (!this.n) return;
    gl.bindVertexArray(this.vao);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.n);
  }
}

  const P = R.progs = {};

  P.depth = glProgram(VS_DEPTH, FS_DEPTH, 'depth');
  P.ground = glProgram(VS_GROUND, FS_GROUND, 'ground');
  P.water = glProgram(VS_WATER, FS_WATER, 'water');
  P.sky = glProgram(VS_FULL, FS_SKY, 'sky');
  P.part = glProgram(VS_PART, FS_PART, 'part');
  P.decal = glProgram(VS_DECAL, FS_DECAL, 'decal');
  P.down = glProgram(VS_FULL, FS_BLOOM_DOWN, 'bloomDown');
  P.up = glProgram(VS_FULL, FS_BLOOM_UP, 'bloomUp');
  P.comp = glProgram(VS_FULL, FS_COMPOSITE, 'composite');
  R.emptyVao = gl.createVertexArray();
  // ground + water quads (positions only, location 0)
  R.groundVao = R._makePlane(R.ground);
  R.waterVao = R._makePlane({ x0: -260, x1: 260, z0: -160, z1: 300 }, true);
  R.partAlpha = new QuadBatch(4096);
  R.partAdd = new QuadBatch(4096);
  R.decals = new QuadBatch(1024);
  R._lp = new Float32Array(MAXL * 4);
  R._lc = new Float32Array(MAXL * 4);
  R._makeShadow();
  R.ok = true;
  return true;
};

R._makePlane = function (b, isWater) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const y = 0;
  const d = new Float32Array([b.x0, y, b.z1, b.x1, y, b.z1, b.x0, y, b.z0, b.x1, y, b.z0]);
  gl.bufferData(gl.ARRAY_BUFFER, d, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
  gl.bindVertexArray(null);
  if (!isWater) R._groundBuf = buf; else R._waterBuf = buf;
  return vao;
};
R.setGroundBounds = function (x0, x1, z0, z1) {
  Object.assign(R.ground, { x0, x1, z0, z1 });
  gl.bindBuffer(gl.ARRAY_BUFFER, R._groundBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([x0, 0, z1, x1, 0, z1, x0, 0, z0, x1, 0, z0]), gl.STATIC_DRAW);
};
R.setWaterLevel = function (y) {
  R.water.level = y;
  gl.bindBuffer(gl.ARRAY_BUFFER, R._waterBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-260, y, 300, 260, y, 300, -260, y, -160, 260, y, -160]), gl.STATIC_DRAW);
};

R._makeShadow = function () {
  if (R.shadowTex) { gl.deleteTexture(R.shadowTex); gl.deleteFramebuffer(R.shadowFbo); }
  const S = R.quality.shadows ? R.quality.shadow : 16;
  R.shadowSize = S;
  const t = R.shadowTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, S, S, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  R.shadowFbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.shadowFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, t, 0);
  gl.drawBuffers([gl.NONE]);
  gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
};

R._freeTargets = function () {
  glDeleteTex(R.sceneTex); glDeleteFbo(R.sceneFbo); glDeleteRb(R.sceneDepth);
  glDeleteFbo(R.msFbo); glDeleteRb(R.msColor); glDeleteRb(R.msDepth);
  if (R.mips) for (const m of R.mips) { glDeleteTex(m.tex); glDeleteFbo(m.fbo); }
  R.mips = null;
};

R.resize = function (cssW, cssH, dpr) {
  const q = R.quality;
  R.cssW = Math.max(2, cssW); R.cssH = Math.max(2, cssH);
  R.dpr = Math.min(dpr || 1, q.dprCap);
  const w = Math.max(2, Math.round(R.cssW * R.dpr * q.renderScale));
  const h = Math.max(2, Math.round(R.cssH * R.dpr * q.renderScale));
  if (w === R.w && h === R.h && R.sceneTex && R._msaaFor === q.msaa) return;
  R.w = w; R.h = h; R._msaaFor = q.msaa;
  glCanvas.width = w; glCanvas.height = h;
  R._freeTargets();
  R.sceneTex = glHdrTex(w, h);
  const samples = Math.min(q.msaa, GLCAPS.maxSamples);
  R.samples = samples;
  if (samples > 1) {
    R.msFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.msFbo);
    R.msColor = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, R.msColor);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, GLCAPS.halfRT ? gl.RGBA16F : gl.RGBA8, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, R.msColor);
    R.msDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, R.msDepth);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, R.msDepth);
    const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (st !== gl.FRAMEBUFFER_COMPLETE) { console.warn('MSAA fbo incomplete, disabling', st); R.samples = 0; }
    R.sceneFbo = glFbo(R.sceneTex, null);
  }
  if (!(R.samples > 1)) {
    R.sceneDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, R.sceneDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    R.sceneFbo = glFbo(R.sceneTex, R.sceneDepth);
  }
  // bloom chain
  R.mips = [];
  let mw = w >> 1, mh = h >> 1;
  for (let i = 0; i < 7 && mw >= 4 && mh >= 4; i++) {
    const tex = glHdrTex(mw, mh);
    R.mips.push({ tex, fbo: glFbo(tex, null), w: mw, h: mh });
    mw = mw >> 1; mh = mh >> 1;
  }
};

R.setQuality = function (level) {
  const q = R.quality;
  q.level = level;
  if (level === 'ultra') Object.assign(q, { msaa: 4, shadow: 4096, dprCap: 2, renderScale: 1, shadows: true, bloom: true });
  else if (level === 'high') Object.assign(q, { msaa: 4, shadow: 2048, dprCap: 1.5, renderScale: 1, shadows: true, bloom: true });
  else if (level === 'medium') Object.assign(q, { msaa: 2, shadow: 2048, dprCap: 1.25, renderScale: 0.85, shadows: true, bloom: true });
  else Object.assign(q, { msaa: 0, shadow: 1024, dprCap: 1, renderScale: 0.7, shadows: false, bloom: true });
  R._makeShadow();
  R.w = 0;
  R.resize(R.cssW, R.cssH, window.devicePixelRatio || 1);
};

R.addLight = function (x, y, z, radius, col, intensity) {
  R.lights.push([x, y, z, radius, col[0], col[1], col[2], intensity == null ? 1 : intensity]);
};

R.updateCamera = function () {
  const c = R.cam;
  m4persp(R.proj, c.fov, R.cssW / R.cssH, c.near, c.far);
  m4lookAt(R.view, c.eye[0], c.eye[1], c.eye[2], c.target[0], c.target[1], c.target[2], 0, 1, 0);
  m4mul(R.vp, R.proj, R.view);
  m4invert(R.invVP, R.vp);
  const v = R.view;
  R.camPos[0] = c.eye[0]; R.camPos[1] = c.eye[1]; R.camPos[2] = c.eye[2];
  R.camR[0] = v[0]; R.camR[1] = v[4]; R.camR[2] = v[8];
  R.camU[0] = v[1]; R.camU[1] = v[5]; R.camU[2] = v[9];
  R.camF[0] = -v[2]; R.camF[1] = -v[6]; R.camF[2] = -v[10];
};

// world -> CSS pixel coords. returns false when behind camera
R.project = function (x, y, z, out) {
  const m = R.vp;
  const cx = m[0] * x + m[4] * y + m[8] * z + m[12];
  const cy = m[1] * x + m[5] * y + m[9] * z + m[13];
  const cw = m[3] * x + m[7] * y + m[11] * z + m[15];
  if (cw <= 0.0001) return false;
  out[0] = (cx / cw * 0.5 + 0.5) * R.cssW;
  out[1] = (1 - (cy / cw * 0.5 + 0.5)) * R.cssH;
  return true;
};
const _rayA = [0, 0, 0], _rayB = [0, 0, 0];
R.screenToGround = function (mx, my, out, yPlane) {
  const nx = mx / R.cssW * 2 - 1, ny = 1 - my / R.cssH * 2;
  m4transformPoint(R.invVP, nx, ny, -1, _rayA);
  m4transformPoint(R.invVP, nx, ny, 1, _rayB);
  const dx = _rayB[0] - _rayA[0], dy = _rayB[1] - _rayA[1], dz = _rayB[2] - _rayA[2];
  const yp = yPlane || 0;
  if (Math.abs(dy) < 1e-6) return false;
  const t = (yp - _rayA[1]) / dy;
  out[0] = _rayA[0] + dx * t; out[1] = _rayA[2] + dz * t;
  return true;
};

R._lightMatrices = function () {
  const e = R.env, f = R.shadowFocus, Rr = R.shadowRadius;
  const sd = e.sunDir;
  const upx = Math.abs(sd[1]) > 0.97 ? 0 : 0, upy = Math.abs(sd[1]) > 0.97 ? 0 : 1, upz = Math.abs(sd[1]) > 0.97 ? -1 : 0;
  m4lookAt(R.lightView, sd[0] * 200, sd[1] * 200, sd[2] * 200, 0, 0, 0, upx, upy, upz);
  const lv = R.lightView;
  const px = lv[0] * f[0] + lv[4] * f[1] + lv[8] * f[2] + lv[12];
  const py = lv[1] * f[0] + lv[5] * f[1] + lv[9] * f[2] + lv[13];
  const pz = lv[2] * f[0] + lv[6] * f[1] + lv[10] * f[2] + lv[14];
  const texel = (2 * Rr) / R.shadowSize;
  const sx = Math.round(px / texel) * texel, sy = Math.round(py / texel) * texel;
  m4ortho(R.lightProj, sx - Rr, sx + Rr, sy - Rr, sy + Rr, -pz - 140, -pz + 140);
  m4mul(R.lvp, R.lightProj, R.lightView);
};

R._setCommon = function (P) {
  const u = P.u, e = R.env;
  gl.uniformMatrix4fv(u.u_vp, false, R.vp);
  if (u.u_smat) gl.uniformMatrix4fv(u.u_smat, false, R.lvp);
  gl.uniform3fv(u.u_camPos, R.camPos);
  gl.uniform3fv(u.u_sunDir, e.sunDir);
  gl.uniform3fv(u.u_sunCol, e.sunCol);
  gl.uniform3fv(u.u_skyCol, e.skyCol);
  gl.uniform3fv(u.u_gndCol, e.gndCol);
  gl.uniform3fv(u.u_fogCol, e.fogCol);
  gl.uniform1f(u.u_fogDen, e.fogDen);
  gl.uniform1f(u.u_fogBase, e.fogBase);
  gl.uniform3fv(u.u_rim, e.rim);
  gl.uniform1f(u.u_time, R.time);
  gl.uniform1f(u.u_shadowTexel, 1 / R.shadowSize);
  gl.uniform1f(u.u_shadowOn, R.quality.shadows ? 1 : 0);
  gl.uniform1i(u.u_nl, R._nl);
  gl.uniform4fv(u.u_lp, R._lp);
  gl.uniform4fv(u.u_lc, R._lc);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, R.shadowTex);
  gl.uniform1i(u.u_shadow, 0);
};

R._packLights = function () {
  const L = R.lights;
  if (L.length > MAXL) {
    const fx = R.cam.target[0], fz = R.cam.target[2];
    for (const l of L) l.d = (l[0] - fx) * (l[0] - fx) + (l[2] - fz) * (l[2] - fz) - l[3] * l[3] * 0.5 - l[7] * 40;
    L.sort((a, b) => a.d - b.d);
  }
  const n = Math.min(L.length, MAXL);
  for (let i = 0; i < n; i++) {
    const l = L[i];
    R._lp[i * 4] = l[0]; R._lp[i * 4 + 1] = l[1]; R._lp[i * 4 + 2] = l[2]; R._lp[i * 4 + 3] = l[3];
    R._lc[i * 4] = l[4]; R._lc[i * 4 + 1] = l[5]; R._lc[i * 4 + 2] = l[6]; R._lc[i * 4 + 3] = l[7];
  }
  R._nl = n;
};

R.render = function () {
  if (!R.ok) return;
  R.updateCamera();
  R._packLights();
  let draws = 0, tris = 0;
  for (const m of MESHES) m.upload();
  R.partAlpha.upload(); R.partAdd.upload(); R.decals.upload();

  gl.disable(gl.CULL_FACE);
  // ---- shadow pass
  if (R.quality.shadows) {
    R._lightMatrices();
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.shadowFbo);
    gl.viewport(0, 0, R.shadowSize, R.shadowSize);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.BLEND);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(1.6, 3.0);
    const P = R.progs.depth;
    gl.useProgram(P.prog);
    gl.uniformMatrix4fv(P.u.u_lvp, false, R.lvp);
    for (const m of MESHES) {
      if (!m.n || !m.castShadow) continue;
      gl.bindVertexArray(m.vao);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, m.count, m.n);
    }
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }

  // ---- main pass
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.samples > 1 ? R.msFbo : R.sceneFbo);
  gl.viewport(0, 0, R.w, R.h);
  const fc = R.env.fogCol;
  gl.clearColor(fc[0], fc[1], fc[2], 1);
  gl.depthMask(true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (R.env.showSky) {
    const P = R.progs.sky, u = P.u, e = R.env;
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.useProgram(P.prog);
    gl.uniformMatrix4fv(u.u_invvp, false, R.invVP);
    gl.uniform3fv(u.u_sunDir, e.sunDir); gl.uniform3fv(u.u_sunCol, e.sunCol);
    gl.uniform3fv(u.u_skyTop, e.skyTop); gl.uniform3fv(u.u_skyHor, e.skyHor); gl.uniform3fv(u.u_fogCol, e.fogCol);
    gl.uniform1f(u.u_time, R.time); gl.uniform1f(u.u_stars, e.stars); gl.uniform1f(u.u_cloud, e.cloud);
    gl.bindVertexArray(R.emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.depthMask(true);
  }
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);
  if (R.ground.on) {
    const P = R.progs.ground, u = P.u, g = R.ground;
    gl.useProgram(P.prog);
    R._setCommon(P);
    gl.uniform3fv(u.u_g0, g.g0); gl.uniform3fv(u.u_g1, g.g1); gl.uniform3fv(u.u_g2, g.g2);
    gl.uniform3fv(u.u_g3, g.g3); gl.uniform3fv(u.u_g4, g.g4);
    gl.uniform4fv(u.u_gp, g.gp); gl.uniform4fv(u.u_gp2, g.gp2);
    gl.bindVertexArray(R.groundVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    draws++;
  }
  {
    const P = R.progs.lit;
    gl.useProgram(P.prog);
    R._setCommon(P);
    gl.uniform1f(P.u.u_emis, R.env.emis);
    for (const m of MESHES) {
      if (!m.n) continue;
      gl.bindVertexArray(m.vao);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, m.count, m.n);
      draws++; tris += m.count / 3 * m.n;
    }
  }
  gl.enable(gl.BLEND);
  gl.depthMask(false);
  if (R.water.on) {
    const P = R.progs.water, u = P.u, w = R.water;
    gl.useProgram(P.prog);
    R._setCommon(P);
    gl.uniform3fv(u.u_waterCol, w.col); gl.uniform3fv(u.u_waterDeep, w.deep);
    gl.uniform1i(u.u_nr, w.nr); gl.uniform4fv(u.u_rip, w.rip);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(R.waterVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  if (R.decals.n) {
    const P = R.progs.decal;
    gl.useProgram(P.prog);
    gl.uniformMatrix4fv(P.u.u_vp, false, R.vp);
    gl.uniform1f(P.u.u_time, R.time);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(-2, -4);
    R.decals.draw();
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }
  {
    const P = R.progs.part, u = P.u, e = R.env;
    gl.useProgram(P.prog);
    gl.uniformMatrix4fv(u.u_vp, false, R.vp);
    gl.uniform3fv(u.u_camR, R.camR); gl.uniform3fv(u.u_camU, R.camU); gl.uniform3fv(u.u_camF, R.camF);
    gl.uniform3fv(u.u_camPos, R.camPos);
    gl.uniform3fv(u.u_fogCol, e.fogCol); gl.uniform1f(u.u_fogDen, e.fogDen); gl.uniform1f(u.u_fogBase, e.fogBase);
    if (R.partAlpha.n) {
      gl.uniform1f(u.u_add, 0);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      R.partAlpha.draw();
    }
    if (R.partAdd.n) {
      gl.uniform1f(u.u_add, 1);
      gl.blendFunc(gl.ONE, gl.ONE);
      R.partAdd.draw();
    }
  }
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);

  // ---- resolve MSAA
  if (R.samples > 1) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, R.msFbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, R.sceneFbo);
    gl.blitFramebuffer(0, 0, R.w, R.h, 0, 0, R.w, R.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  }

  // ---- bloom
  gl.bindVertexArray(R.emptyVao);
  const mips = R.mips, post = R.post;
  const useBloom = R.quality.bloom && post.bloom > 0.001 && mips.length > 1;
  if (useBloom) {
    const D = R.progs.down;
    gl.useProgram(D.prog);
    gl.uniform1f(D.u.u_thresh, post.thresh);
    gl.uniform1f(D.u.u_knee, post.knee);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(D.u.u_tex, 0);
    let srcTex = R.sceneTex, sw = R.w, sh = R.h;
    for (let i = 0; i < mips.length; i++) {
      const m = mips[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER, m.fbo);
      gl.viewport(0, 0, m.w, m.h);
      gl.bindTexture(gl.TEXTURE_2D, srcTex);
      gl.uniform2f(D.u.u_ts, 1 / sw, 1 / sh);
      gl.uniform1f(D.u.u_prefilter, i === 0 ? 1 : 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      srcTex = m.tex; sw = m.w; sh = m.h;
    }
    const U = R.progs.up;
    gl.useProgram(U.prog);
    gl.uniform1i(U.u.u_tex, 0);
    gl.uniform1f(U.u.u_radius, 1.0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = mips.length - 1; i > 0; i--) {
      const src = mips[i], dst = mips[i - 1];
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
      gl.viewport(0, 0, dst.w, dst.h);
      gl.bindTexture(gl.TEXTURE_2D, src.tex);
      gl.uniform2f(U.u.u_ts, 1 / src.w, 1 / src.h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.BLEND);
  }

  // ---- composite to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  const C = R.progs.comp, u = C.u;
  gl.useProgram(C.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.sceneTex); gl.uniform1i(u.u_scene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, useBloom ? mips[0].tex : R.sceneTex); gl.uniform1i(u.u_bloom, 1);
  gl.uniform1f(u.u_bloomI, useBloom ? post.bloom : 0);
  gl.uniform1f(u.u_exposure, post.exposure);
  gl.uniform1f(u.u_time, R.time);
  gl.uniform2f(u.u_res, glCanvas.width, glCanvas.height);
  gl.uniform3fv(u.u_lift, post.lift); gl.uniform3fv(u.u_gamma, post.gamma); gl.uniform3fv(u.u_gain, post.gain);
  gl.uniform1f(u.u_sat, post.sat); gl.uniform1f(u.u_contrast, post.contrast);
  gl.uniform1f(u.u_vig, post.vig); gl.uniform1f(u.u_grain, post.grain); gl.uniform1f(u.u_ca, post.ca);
  gl.uniform4fv(u.u_flash, post.flash); gl.uniform1f(u.u_desat, post.desat);
  gl.uniform3fv(u.u_tint, post.tint); gl.uniform1f(u.u_tintAmt, post.tintAmt);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);

  R.stats.draws = draws; R.stats.tris = tris;
  // reset per-frame batches
  for (const m of MESHES) if (!m.isStatic) m.n = 0;
  R.partAlpha.n = 0; R.partAdd.n = 0; R.decals.n = 0;
  R.lights.length = 0;
};

// ---- decal helpers --------------------------------------------------------
// shape ids: 0 circle-telegraph 1 rect-telegraph 2 sector 3 shock-ring 4 ink 5 scorch 6 glow 7 marker 8 square 9 outline 10 blob-shadow
function decal(x, z, rot, sx, sz, shape, progress, r, g, b, a, p0, p1, yoff) {
  const B = R.decals, o = B.alloc(), A = B.a;
  A[o] = x; A[o + 1] = z; A[o + 2] = rot || 0; A[o + 3] = yoff || 0;
  A[o + 4] = sx; A[o + 5] = sz; A[o + 6] = shape; A[o + 7] = progress || 0;
  A[o + 8] = r; A[o + 9] = g; A[o + 10] = b; A[o + 11] = a;
  A[o + 12] = p0 || 0; A[o + 13] = p1 || 0; A[o + 14] = 0; A[o + 15] = 0;
}

// 05_particles.js — billboard particles, 3D debris chips, persistent ground marks
// ---------------------------------------------------------------------------
const PCAP = 20000;
const PT = {
  n: 0,
  x: new Float32Array(PCAP), y: new Float32Array(PCAP), z: new Float32Array(PCAP),
  vx: new Float32Array(PCAP), vy: new Float32Array(PCAP), vz: new Float32Array(PCAP),
  life: new Float32Array(PCAP), max: new Float32Array(PCAP),
  s0: new Float32Array(PCAP), s1: new Float32Array(PCAP),
  r0: new Float32Array(PCAP), g0: new Float32Array(PCAP), b0: new Float32Array(PCAP),
  r1: new Float32Array(PCAP), g1: new Float32Array(PCAP), b1: new Float32Array(PCAP),
  a0: new Float32Array(PCAP), a1: new Float32Array(PCAP),
  grav: new Float32Array(PCAP), drag: new Float32Array(PCAP),
  shape: new Uint8Array(PCAP), stretch: new Float32Array(PCAP), add: new Uint8Array(PCAP),
  rot: new Float32Array(PCAP), rotv: new Float32Array(PCAP), seed: new Float32Array(PCAP),
  fadeIn: new Float32Array(PCAP), wob: new Float32Array(PCAP),
};

// spawn one particle. opts: pos/vel/life/size/colour/alpha/etc (all numbers)
function pEmit(x, y, z, vx, vy, vz, life, s0, s1, c0, c1, a0, a1, shape, add, grav, drag, stretch, rotv, fadeIn, wob) {
  if (PT.n >= PCAP) return -1;
  const i = PT.n++;
  PT.x[i] = x; PT.y[i] = y; PT.z[i] = z; PT.vx[i] = vx; PT.vy[i] = vy; PT.vz[i] = vz;
  PT.life[i] = life; PT.max[i] = life; PT.s0[i] = s0; PT.s1[i] = s1;
  PT.r0[i] = c0[0]; PT.g0[i] = c0[1]; PT.b0[i] = c0[2];
  const e = c1 || c0;
  PT.r1[i] = e[0]; PT.g1[i] = e[1]; PT.b1[i] = e[2];
  PT.a0[i] = a0; PT.a1[i] = a1; PT.shape[i] = shape; PT.add[i] = add ? 1 : 0;
  PT.grav[i] = grav || 0; PT.drag[i] = drag || 0; PT.stretch[i] = stretch || 0;
  PT.rot[i] = rnd() * TAU; PT.rotv[i] = rotv || 0; PT.seed[i] = rnd();
  PT.fadeIn[i] = fadeIn || 0; PT.wob[i] = wob || 0;
  return i;
}

function pUpdate(dt) {
  const n = PT.n;
  let i = 0, last = n - 1;
  while (i <= last) {
    PT.life[i] -= dt;
    if (PT.life[i] <= 0) {
      if (i !== last) {
        for (const k in PT) {
          if (k === 'n') continue;
          const arr = PT[k];
          arr[i] = arr[last];
        }
      }
      last--;
      continue;
    }
    const dr = PT.drag[i];
    if (dr) { const f = Math.max(0, 1 - dr * dt); PT.vx[i] *= f; PT.vy[i] *= f; PT.vz[i] *= f; }
    PT.vy[i] -= PT.grav[i] * dt;
    if (PT.wob[i]) {
      const t = R.time * 3 + PT.seed[i] * 20;
      PT.vx[i] += Math.sin(t) * PT.wob[i] * dt; PT.vz[i] += Math.cos(t * 1.3) * PT.wob[i] * dt;
    }
    PT.x[i] += PT.vx[i] * dt; PT.y[i] += PT.vy[i] * dt; PT.z[i] += PT.vz[i] * dt;
    PT.rot[i] += PT.rotv[i] * dt;
    if (PT.y[i] < 0.02 && PT.grav[i] > 0) { PT.y[i] = 0.02; PT.vy[i] *= -0.25; PT.vx[i] *= 0.6; PT.vz[i] *= 0.6; }
    i++;
  }
  PT.n = last + 1;
}

function pDraw() {
  const n = PT.n;
  for (let i = 0; i < n; i++) {
    const t = 1 - PT.life[i] / PT.max[i];
    let a = PT.a0[i] + (PT.a1[i] - PT.a0[i]) * t;
    if (PT.fadeIn[i] > 0) a *= Math.min(1, t / PT.fadeIn[i]);
    if (a <= 0.002) continue;
    const B = PT.add[i] ? R.partAdd : R.partAlpha;
    const o = B.alloc(), A = B.a;
    A[o] = PT.x[i]; A[o + 1] = PT.y[i]; A[o + 2] = PT.z[i];
    A[o + 3] = PT.s0[i] + (PT.s1[i] - PT.s0[i]) * t;
    A[o + 4] = PT.r0[i] + (PT.r1[i] - PT.r0[i]) * t;
    A[o + 5] = PT.g0[i] + (PT.g1[i] - PT.g0[i]) * t;
    A[o + 6] = PT.b0[i] + (PT.b1[i] - PT.b0[i]) * t;
    A[o + 7] = a;
    A[o + 8] = PT.vx[i]; A[o + 9] = PT.vy[i]; A[o + 10] = PT.vz[i]; A[o + 11] = PT.stretch[i];
    A[o + 12] = PT.shape[i]; A[o + 13] = PT.rot[i]; A[o + 14] = 0; A[o + 15] = PT.seed[i];
  }
}

// immediate-mode quad for this frame only (projectile glows, trails, beams)
function quadNow(x, y, z, size, r, g, b, a, vx, vy, vz, stretch, shape, add, rot, seed) {
  const B = add ? R.partAdd : R.partAlpha;
  const o = B.alloc(), A = B.a;
  A[o] = x; A[o + 1] = y; A[o + 2] = z; A[o + 3] = size;
  A[o + 4] = r; A[o + 5] = g; A[o + 6] = b; A[o + 7] = a;
  A[o + 8] = vx || 0; A[o + 9] = vy || 0; A[o + 10] = vz || 0; A[o + 11] = stretch || 0;
  A[o + 12] = shape || 0; A[o + 13] = rot || 0; A[o + 14] = 0; A[o + 15] = seed || 0;
}

// ---- 3D debris chips (lit mesh instances with tint) --------------------------
const CCAP = 1200;
const CH = {
  n: 0,
  x: new Float32Array(CCAP), y: new Float32Array(CCAP), z: new Float32Array(CCAP),
  vx: new Float32Array(CCAP), vy: new Float32Array(CCAP), vz: new Float32Array(CCAP),
  a: new Float32Array(CCAP), b: new Float32Array(CCAP), c: new Float32Array(CCAP),
  va: new Float32Array(CCAP), vb: new Float32Array(CCAP), vc: new Float32Array(CCAP),
  life: new Float32Array(CCAP), s: new Float32Array(CCAP), kind: new Uint8Array(CCAP),
  r: new Float32Array(CCAP), g: new Float32Array(CCAP), bl: new Float32Array(CCAP), sx: new Float32Array(CCAP),
};
let CHIP_MESHES = null; // [plank, stone, shard] set up by models
function chipEmit(x, y, z, n, col, speed, kind, size) {
  const c = colOf(col);
  for (let k = 0; k < n; k++) {
    if (CH.n >= CCAP) return;
    const i = CH.n++;
    const a = rnd() * TAU, sp = (speed || 6) * (0.4 + rnd() * 0.8);
    CH.x[i] = x; CH.y[i] = y; CH.z[i] = z;
    CH.vx[i] = Math.cos(a) * sp; CH.vy[i] = 3 + rnd() * sp; CH.vz[i] = Math.sin(a) * sp;
    CH.a[i] = rnd() * TAU; CH.b[i] = rnd() * TAU; CH.c[i] = rnd() * TAU;
    CH.va[i] = (rnd() - 0.5) * 14; CH.vb[i] = (rnd() - 0.5) * 14; CH.vc[i] = (rnd() - 0.5) * 14;
    CH.life[i] = 1.6 + rnd() * 1.4; CH.s[i] = (size || 1) * (0.6 + rnd() * 0.8);
    CH.kind[i] = kind || 0;
    const v = 0.8 + rnd() * 0.4;
    CH.r[i] = c[0] * v; CH.g[i] = c[1] * v; CH.bl[i] = c[2] * v; CH.sx[i] = 0.6 + rnd() * 1.2;
  }
}
function chipUpdate(dt) {
  let i = 0, last = CH.n - 1;
  while (i <= last) {
    CH.life[i] -= dt;
    if (CH.life[i] <= 0) {
      if (i !== last) for (const k in CH) { if (k !== 'n') CH[k][i] = CH[k][last]; }
      last--; continue;
    }
    CH.vy[i] -= 22 * dt;
    CH.x[i] += CH.vx[i] * dt; CH.y[i] += CH.vy[i] * dt; CH.z[i] += CH.vz[i] * dt;
    CH.a[i] += CH.va[i] * dt; CH.b[i] += CH.vb[i] * dt; CH.c[i] += CH.vc[i] * dt;
    if (CH.y[i] < 0.05) {
      CH.y[i] = 0.05; CH.vy[i] *= -0.3; CH.vx[i] *= 0.55; CH.vz[i] *= 0.55; CH.va[i] *= 0.5; CH.vb[i] *= 0.5; CH.vc[i] *= 0.5;
      if (Math.abs(CH.vy[i]) < 1) { CH.vy[i] = 0; CH.b[i] = Math.round(CH.b[i] / Math.PI) * Math.PI; CH.c[i] = Math.round(CH.c[i] / Math.PI) * Math.PI; }
    }
    i++;
  }
  CH.n = last + 1;
}
function chipDraw() {
  if (!CHIP_MESHES) return;
  for (let i = 0; i < CH.n; i++) {
    const s = CH.s[i] * Math.min(1, CH.life[i] * 2);
    const m = CHIP_MESHES[CH.kind[i]] || CHIP_MESHES[0];
    m.add(CH.x[i], CH.y[i], CH.z[i], CH.a[i], CH.b[i], CH.c[i], s * CH.sx[i], s, s, 0, 0, 0, 0, CH.r[i], CH.g[i], CH.bl[i], 1);
  }
}

// ---- persistent ground marks (ink strokes, scorch, craters) -------------------
const MARKS = [];
function markAdd(x, z, rot, sx, sz, shape, col, alpha, life, p1) {

}
function marksUpdate(dt) {
  for (let i = MARKS.length - 1; i >= 0; i--) {

    if (m.life <= 0) MARKS.splice(i, 1);

}
function marksDraw() {

    const a = m.a * Math.min(1, t * 3);
    decal(m.x, m.z, m.rot, m.sx, m.sz, m.shape, 0, m.c[0], m.c[1], m.c[2], a, 0, m.p1, -0.02);

// ==== 06_input.js ====
// ---------------------------------------------------------------------------
// 06_input.js — keyboard, mouse, gamepad and touch; edge-triggered actions
// ---------------------------------------------------------------------------
const IN = {
  keys: Object.create(null),
  hitQ: new Set(),
  mouse: { x: 0, y: 0, down: [false, false, false], hit: [false, false, false], wheel: 0, lastMove: -99, onCanvas: false },
  pad: { connected: false, axes: [0, 0, 0, 0], btn: [], prev: [], hit: [] },
  touchMove: { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0, vx: 0, vy: 0 },
  touchBtn: { dash: false, ult: false },
  device: 'kb',
  time: 0,
};
const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);

function inputInit(canvas) {
  window.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (!IN.keys[e.code]) IN.hitQ.add(e.code);
    IN.keys[e.code] = true;
    IN.device = 'kb';
    if (GAME_KEYS.has(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { IN.keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in IN.keys) IN.keys[k] = false; IN.mouse.down = [false, false, false]; });
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    IN.mouse.x = e.clientX - r.left; IN.mouse.y = e.clientY - r.top;
    IN.mouse.lastMove = IN.time; IN.mouse.onCanvas = true;
    if (IN.device !== 'mouse' && (Math.abs(e.movementX) + Math.abs(e.movementY) > 2)) IN.device = 'mouse';
  });
  canvas.addEventListener('mouseleave', () => { IN.mouse.onCanvas = false; });
  canvas.addEventListener('mousedown', e => { IN.mouse.down[e.button] = true; IN.mouse.hit[e.button] = true; });
  window.addEventListener('mouseup', e => { IN.mouse.down[e.button] = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => { IN.mouse.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
  // touch joystick on the left 55% of the screen
  const tm = IN.touchMove;
  canvas.addEventListener('touchstart', e => {
    IN.device = 'touch';
    for (const t of e.changedTouches) {
      if (!tm.active && t.clientX < window.innerWidth * 0.55) {
        tm.active = true; tm.id = t.identifier; tm.ox = t.clientX; tm.oy = t.clientY; tm.x = t.clientX; tm.y = t.clientY; tm.vx = 0; tm.vy = 0;
      }
    }
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === tm.id) {
        tm.x = t.clientX; tm.y = t.clientY;
        let dx = tm.x - tm.ox, dy = tm.y - tm.oy;
        const l = Math.hypot(dx, dy), maxR = 60;
        if (l > maxR) { tm.ox += dx * (1 - maxR / l); tm.oy += dy * (1 - maxR / l); dx = tm.x - tm.ox; dy = tm.y - tm.oy; }
        tm.vx = dx / maxR; tm.vy = dy / maxR;
      }
    }
    e.preventDefault();
  }, { passive: false });
  const tend = e => { for (const t of e.changedTouches) if (t.identifier === tm.id) { tm.active = false; tm.id = -1; tm.vx = tm.vy = 0; } };
  canvas.addEventListener('touchend', tend);
  canvas.addEventListener('touchcancel', tend);
  window.addEventListener('gamepadconnected', () => { IN.pad.connected = true; });
}

function inputPoll(dt) {
  IN.time += dt;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const p of pads) if (p && p.connected) { gp = p; break; }
  const P = IN.pad;
  P.connected = !!gp;
  if (gp) {
    const dz = v => (Math.abs(v) < 0.18 ? 0 : (v - Math.sign(v) * 0.18) / 0.82);
    P.axes[0] = dz(gp.axes[0] || 0); P.axes[1] = dz(gp.axes[1] || 0);
    P.axes[2] = dz(gp.axes[2] || 0); P.axes[3] = dz(gp.axes[3] || 0);
    for (let i = 0; i < gp.buttons.length; i++) {
      const b = gp.buttons[i];
      const d = !!(b && (b.pressed || b.value > 0.5));
      P.hit[i] = d && !P.btn[i];
      P.btn[i] = d;
      if (d) IN.device = 'pad';
    }
    if (Math.abs(P.axes[0]) + Math.abs(P.axes[1]) > 0.3) IN.device = 'pad';
  }
}

function inputEndFrame() {
  IN.hitQ.clear();
  IN.mouse.hit[0] = IN.mouse.hit[1] = IN.mouse.hit[2] = false;
  IN.mouse.wheel = 0;
  const P = IN.pad;
  for (let i = 0; i < P.hit.length; i++) P.hit[i] = false;
  IN.touchBtn.dash = IN.touchBtn.ult = false;
}

const keyDown = c => !!IN.keys[c];
const keyHit = c => IN.hitQ.has(c);
const padHit = i => !!IN.pad.hit[i];

// movement vector in world XZ (screen up = -z)
function inputMove(out) {
  let x = 0, z = 0;
  if (keyDown('KeyA') || keyDown('ArrowLeft')) x -= 1;
  if (keyDown('KeyD') || keyDown('ArrowRight')) x += 1;
  if (keyDown('KeyW') || keyDown('ArrowUp')) z -= 1;
  if (keyDown('KeyS') || keyDown('ArrowDown')) z += 1;
  const P = IN.pad;
  if (P.connected && (Math.abs(P.axes[0]) + Math.abs(P.axes[1]) > 0.01)) { x += P.axes[0]; z += P.axes[1]; }
  if (P.connected) {
    if (P.btn[14]) x -= 1; if (P.btn[15]) x += 1; if (P.btn[12]) z -= 1; if (P.btn[13]) z += 1;
  }
  const tm = IN.touchMove;
  if (tm.active) { x += tm.vx; z += tm.vy; }
  const l = Math.hypot(x, z);
  if (l > 1) { x /= l; z /= l; }
  out[0] = x; out[1] = z;
  return l > 0.05;
}

const ACT = {
  dash: () => keyHit('Space') || keyHit('ShiftLeft') || keyHit('ShiftRight') || padHit(0) || padHit(5) || IN.touchBtn.dash,
  ult: () => keyHit('KeyQ') || keyHit('KeyE') || IN.mouse.hit[2] || padHit(2) || padHit(3) || padHit(7) || IN.touchBtn.ult,
  pause: () => keyHit('Escape') || keyHit('KeyP') || padHit(9),
  confirm: () => keyHit('Enter') || keyHit('Space') || keyHit('NumpadEnter') || padHit(0),
  cancel: () => keyHit('Escape') || keyHit('Backspace') || padHit(1),
  up: () => keyHit('ArrowUp') || keyHit('KeyW') || padHit(12),
  down: () => keyHit('ArrowDown') || keyHit('KeyS') || padHit(13),
  left: () => keyHit('ArrowLeft') || keyHit('KeyA') || padHit(14),
  right: () => keyHit('ArrowRight') || keyHit('KeyD') || padHit(15),
  reroll: () => keyHit('KeyR') || padHit(3),
  skip: () => keyHit('KeyX') || padHit(1),
  choice: n => keyHit('Digit' + n) || keyHit('Numpad' + n),
  any: () => IN.hitQ.size > 0 || IN.mouse.hit[0] || IN.pad.hit.some(Boolean),
};

// compact part helpers
MeshBuilder.prototype.bx = function (c, x, y, z, w, h, d, yaw, pitch, roll, em) {
  this.color(c, em); this.push(); this.at(x, y, z, yaw, pitch, roll); this.box(w, h, d); this.pop(); return this;
};
MeshBuilder.prototype.bt = function (c, x, y, z, w, h, d, wt, dt, ox, oz, yaw, pitch, roll, em) {
  this.color(c, em); this.push(); this.at(x, y, z, yaw, pitch, roll); this.boxT(w, h, d, wt, dt, ox, oz); this.pop(); return this;
};
MeshBuilder.prototype.cy = function (c, x, y, z, rt, rb, h, seg, yaw, pitch, roll, em) {
  this.color(c, em); this.push(); this.at(x, y, z, yaw, pitch, roll); this.cyl(rt, rb, h, seg); this.pop(); return this;
};
MeshBuilder.prototype.sp = function (c, x, y, z, r, detail, sx, sy, sz, em) {
  const s = sx || 1;
  this.color(c, em); this.push(); this.at(x, y, z, 0, 0, 0, s, sy || s, sz || s); this.sphere(r, detail || 0); this.pop(); return this;
};
MeshBuilder.prototype.wd = function (c, x, y, z, w, h, d, yaw, pitch, roll, em) {
  this.color(c, em); this.push(); this.at(x, y, z, yaw, pitch, roll); this.wedge(w, h, d); this.pop(); return this;
};

  m4trs(_mLoc, x, y, z, yaw || 0, pitch || 0, roll || 0, s || 1, s || 1, s || 1);

// ---- soldier drawing (parts instanced separately) ---------------------------
// T = {body, arm, leg, armX,armY,armZ, legX, legY}
function drawBiped(T, x, y, z, yaw, phase, move, scale, flash, dis, emis, armPitch, lean, tint) {
  const s = scale || 1;
  const bob = Math.abs(Math.sin(phase)) * 0.07 * move;
  writeTRS(_mRoot, 0, x, y + bob * s, z, yaw, (lean || 0) + 0.08 * move, 0, s, s, s);
  const tr = tint ? tint[0] : 0, tg = tint ? tint[1] : 0, tb = tint ? tint[2] : 0, ta = tint ? tint[3] : 0;
  T.body.addMat(_mRoot, flash, dis, 0, emis, tr, tg, tb, ta);
  if (T.leg) {
    const sw = Math.sin(phase) * 0.62 * move;
    T.leg.addMat(childMat(_mRoot, 0.15, 0.8, 0, 0, sw, 0), flash, dis, 0, emis, tr, tg, tb, ta);
    T.leg.addMat(childMat(_mRoot, -0.15, 0.8, 0, 0, -sw, 0), flash, dis, 0, emis, tr, tg, tb, ta);
  }
  if (T.arm) {
    const ap = (armPitch || 0) - Math.sin(phase) * 0.35 * move;
    T.arm.addMat(childMat(_mRoot, 0.37, 1.34, 0.02, 0, ap, -0.06), flash, dis, 0, emis, tr, tg, tb, ta);
  }
}
