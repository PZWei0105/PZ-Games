const World = {
  stage: null, env: null, rng: RNG(1),
  t01: 0, time: 0,
  flags: [], fires: [], torches: [], crowd: [], floaters: [], rafts: [],
  excite: 0, lightning: 0, lightningCd: 4, rainAcc: 0, ambAcc: 0,
  crowdScale: 1, showCrowd: true, cityGlow: 0,

  clear() {
    for (const k in ENVM) if (ENVM[k] && ENVM[k].isStatic) ENVM[k].clearStatic();
    this.flags.length = 0; this.fires.length = 0; this.torches.length = 0; this.crowd.length = 0;
    this.floaters.length = 0; this.rafts.length = 0; this.staticDecals = [];
    fxClearAll();
  },

  build(stageId, opts) {
    opts = opts || {};
    this.clear();
    const env = this.env = ENV_PRESETS[stageId] || ENV_PRESETS.s1;
    this.stage = stageId;
    const rng = this.rng = RNG(stageId.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0);
    const gd = env.ground;
    Object.assign(R.ground, { g0: colOf(gd.g0), g1: colOf(gd.g1), g2: colOf(gd.g2), g3: colOf(gd.g3), g4: colOf(gd.g4), gp: gd.gp.slice(), gp2: [WALL_Z, gd.mode, 0, 1] });
    R.water.on = !!env.water;
    if (env.water) { R.setWaterLevel(0.38); R.water.col = colOf('#233026'); R.water.deep = colOf('#070b09'); }
    R.env.showSky = !!env.sky;
    R.env.stars = env.night ? 1 : 0;
    this.crowdScale = opts.crowd == null ? 1 : opts.crowd;
    this.time = 0; this.excite = 0; this.lightning = 0; this.doorOpen = 0; this.rainOverride = null;
    const put = (m, x, y, z, yaw, s, sy) => m.add(x, y, z, yaw || 0, 0, 0, s || 1, sy || s || 1, s || 1);
    const field = env.field;

    if (field === 'cave') this._buildCave(rng, put);
    else {
      put(ENVM.wall, 0, 0, WALL_Z);
      put(ENVM.tower, 0, WALL_H, -4.4);
      // hoardings and defence machines along the merlons
      for (let x = -150; x <= 150; x += 2.4) if (rng() < 0.28 && Math.abs(x) > 12) ENVM.hoard.add(x, WALL_H + 0.6, -0.7, 0, 0.25, 0, 1, 1, 1);
      // city beyond the wall
      for (let i = 0; i < 90; i++) {
        const x = rng.range(-150, 150), z = rng.range(-16, -110);
        if (Math.abs(x) < 14 && z > -30) continue;
        put(rng() < 0.6 ? ENVM.house : ENVM.hut, x, 0, z, rng() < 0.5 ? 0 : Math.PI / 2, rng.range(0.9, 1.4));
      }
      for (let i = 0; i < 30; i++) put(ENVM.tree, rng.range(-150, 150), 0, rng.range(-18, -100), rng() * TAU, rng.range(0.9, 1.5));
      // flags on the wall: 墨 black and 宋 grey-blue
      for (let x = -66; x <= 66; x += 11) {
        put(ENVM.flagPole, x, WALL_H, -1.9);
        this.flags.push({ x, y: WALL_H + 5.6, z: -1.9, col: colOf(Math.abs(x) % 22 < 11 ? '#141214' : '#3d4a58'), ph: rng() * TAU, s: 1.1 });
      }
      // torches along the wall walkway
      for (let x = -60; x <= 60; x += 15) this.torches.push({ x, y: WALL_H + 2.5, z: -1.3, wall: true });
      this._buildCrowd(rng);
      if (field === 'flood') this._buildFlood(rng, put); else this._buildField(rng, put, field);
    }
    if (env.water) R.setWaterLevel(0.38);
    this.setTime01(0);
  },

  _buildCrowd(rng) {
    const n1 = Math.round(130 * this.crowdScale), n2 = Math.round(150 * this.crowdScale);
    for (let i = 0; i < n1; i++) {
      const x = -72 + (i / n1) * 144 + rng.range(-0.4, 0.4);
      if (Math.abs(x) < 10.5) continue;
      this.crowd.push({ m: M.crowdMo, x, y: WALL_H, z: -2.3 + rng.range(-0.3, 0.3), yaw: rng.range(-0.3, 0.3), ph: rng() * TAU, mo: true });
    }
    for (let i = 0; i < n2; i++) {
      const near = rng() < 0.55;
      const x = near ? rng.range(-26, 26) : rng.range(-70, 70);
      if (Math.abs(x) < 10.5) continue;
      this.crowd.push({ m: M.crowdFolk[i % 4], x, y: WALL_H, z: -3.4 - rng() * 3, yaw: rng.range(-0.4, 0.4), ph: rng() * TAU, mo: false, s: rng.range(0.85, 1.05) });
    }
  },

  _buildField(rng, put, kind) {
    const inArena = (x, z) => x > ARENA.x0 && x < ARENA.x1 && z > ARENA.z0 && z < ARENA.z1;
    const roadX = z => -Math.sin(z * 0.05) * 3;
    // defensive lines of 拒馬 in front of the wall, gap at the road
    for (let x = -76; x <= 76; x += 3.6) {
      if (Math.abs(x) < 8) continue;
      if (rng() < 0.82) put(ENVM.juma, x, 0.25, 7 + rng.range(-0.5, 0.5), rng.range(-0.1, 0.1));
    }
    for (let i = 0; i < 26; i++) { const x = rng.range(-75, 75); if (Math.abs(x) < 7) continue; put(ENVM.stakes, x, 0, rng.range(11, 22), rng.range(-0.3, 0.3)); }
    // trenches (static decals) and dirt mounds
    for (let i = 0; i < 9; i++) {
      const z = 24 + i * 7.5 + rng.range(-2, 2), x = rng.range(-60, 60);
      if (Math.abs(x - roadX(z)) < 12) continue;
      const len = rng.range(10, 22);
      this.staticDecals.push([x, z, rng.range(-0.15, 0.15), len / 2, 0.8, 5, 0, '#1a130c', 0.75]);
      ENVM.mound.add(x, 0, z - 1.5, 0, 0, 0, len / 8, 1, 1);
    }
    // scatter
    const scatter = (m, n, x0, x1, z0, z1, sMin, sMax, avoidRoad, y) => {
      for (let i = 0; i < n; i++) {
        const x = rng.range(x0, x1), z = rng.range(z0, z1);
        if (avoidRoad && Math.abs(x - roadX(z)) < 6) continue;
        put(m, x, y || 0, z, rng() * TAU, rng.range(sMin, sMax));
      }
    };
    scatter(ENVM.grass, kind === 'fire' ? 900 : 2600, -120, 120, 3, 150, 0.7, 1.6, true);
    scatter(ENVM.rock, 140, -120, 120, 6, 150, 0.4, 1.3, true);
    scatter(ENVM.bush, 70, -120, 120, 14, 150, 0.7, 1.4, true);
    for (let i = 0; i < 520; i++) ENVM.arrowStuck.add(rng.range(-76, 76), 0, rng.range(1, 62), rng() * TAU, rng.range(-0.45, 0.45), rng.range(-0.3, 0.3), 1, 1, 1);
    scatter(ENVM.shield, 60, -70, 70, 3, 70, 0.9, 1.1, false, 0);
    scatter(ENVM.fallenLadder, 22, -70, 70, 2, 40, 0.9, 1.1, false);
    for (let i = 0; i < 14; i++) { const x = rng.range(-70, 70), z = rng.range(10, 85); if (Math.abs(x - roadX(z)) > 8) { put(ENVM.cart, x, 0, z, rng() * TAU); if (kind === 'fire' && rng() < 0.7) this.fires.push({ x, y: 0.8, z, s: 1.4, light: true }); } }
    scatter(ENVM.deadTree, 16, -76, 76, 20, 95, 0.9, 1.4, true);
    scatter(ENVM.barrel, 20, -70, 70, 3, 60, 0.9, 1.1, true);
    scatter(ENVM.crate, 16, -70, 70, 3, 60, 0.9, 1.2, true);
    // forest edges and boulders beyond the sides
    for (const side of [-1, 1]) {
      for (let i = 0; i < 70; i++) put(ENVM.tree, side * rng.range(82, 130), 0, rng.range(-4, 150), rng() * TAU, rng.range(1.0, 1.8));
      for (let i = 0; i < 16; i++) put(ENVM.boulder, side * rng.range(80, 110), 0, rng.range(0, 140), rng() * TAU, rng.range(0.8, 1.6));
    }
    // 楚 camp far south
    for (let i = 0; i < 26; i++) {
      const x = rng.range(-90, 90), z = rng.range(108, 150);
      put(ENVM.tent, x, 0, z, rng.range(-0.2, 0.2), rng.range(1, 1.4));
    }
    for (let x = -100; x <= 100; x += 4.6) put(ENVM.palisade, x, 0, 104 + Math.sin(x * 0.1) * 1.5, 0);
    for (let i = 0; i < 6; i++) put(ENVM.catapult, rng.range(-60, 60), 0, rng.range(100, 112), rng.range(-0.3, 0.3), 1.3);
    for (let i = 0; i < 12; i++) {
      const x = rng.range(-80, 80), z = rng.range(106, 140);
      put(ENVM.campfire, x, 0, z);

    for (let i = 0; i < 60; i++) put(ENVM.dirtPile, rng.range(-78, 78), -0.2, rng.range(4, 98), rng() * TAU, rng.range(0.5, 1.4));

  setTime01(t) {
    this.t01 = clamp01(t);
    const keys = this.env.keys;
    let a = keys[0], b = keys[keys.length - 1];
    for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i].t && t <= keys[i + 1].t) { a = keys[i]; b = keys[i + 1]; break; }
    const k = a === b ? 0 : smoothstep(0, 1, (t - a.t) / (b.t - a.t));
    const el = lerp(a.el, b.el, k) * DEG, az = lerp(a.az, b.az, k) * DEG;
    const E = R.env;
    E.sunDir = [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)];
    const L = (p) => mixc(a[p], b[p], k);
    E.sunCol = L('sun'); E.skyCol = L('sky'); E.gndCol = L('gnd'); E.fogCol = L('fog'); E.rim = L('rim');
    E.fogDen = lerp(a.fogDen, b.fogDen, k); E.fogBase = 36;
    E.skyTop = scalec(E.skyCol, 1.4); E.skyHor = mixc(E.fogCol, E.sunCol, 0.15);
    R.post.exposure = lerp(a.exp, b.exp, k); R.post.sat = lerp(a.sat, b.sat, k); R.post.bloom = lerp(a.bloom, b.bloom, k);
    this._baseSun = E.sunCol.slice(); this._baseSky = E.skyCol.slice();
  },

  cheer(k) { this.excite = Math.max(this.excite, k); },

  update(dt, focusX, focusZ) {
    this.time += dt;
    this.excite = Math.max(0, this.excite - dt * 0.35);
    const env = this.env, w = env.weather || {};
    // lightning
    if (w.lightning) {
      this.lightningCd -= dt;
      if (this.lightningCd <= 0) {
        this.lightning = 1; this.lightningCd = rnd.range(5, 12) / w.lightning;
        AU.thunder();
      }
    }
    if (this.lightning > 0) {
      this.lightning = Math.max(0, this.lightning - dt * 3.2);
      const f = this.lightning * (0.6 + 0.4 * Math.sin(this.time * 90));
      R.env.sunCol = this._baseSun.map(v => v + f * 2.5);
      R.env.skyCol = this._baseSky.map(v => v + f * 0.6);
    }
    // rain
    const rain = this.rainOverride != null ? this.rainOverride : (w.rain || 0);
    if (rain > 0) {
      this.rainAcc += dt * rain * 1400;
      while (this.rainAcc > 1) {
        this.rainAcc--;
        const x = focusX + rnd.range(-34, 34), z = focusZ + rnd.range(-30, 22), y = rnd.range(14, 24);
        pEmit(x, y, z, -3, -34, 3, y / 34, 0.035, 0.035, [0.7, 0.75, 0.82], null, 0.45, 0.35, 6, false, 0, 0, 0.018);
        if (rnd() < 0.18) pEmit(x - 3 * y / 34, 0.08, z + 3 * y / 34, 0, 0, 0, 0.25, 0.05, 0.28, [0.75, 0.8, 0.85], null, 0.0, 0.0, 4, false);
      }
      if (rnd() < 0.5) pEmit(focusX + rnd.range(-30, 30), 0.05, focusZ + rnd.range(-24, 18), 0, 0, 0, 0.35, 0.05, 0.35, [0.8, 0.85, 0.9], null, 0.5, 0, 4, false);
    }
    // ambient motes
    this.ambAcc += dt;
    const amb = env.ambient;
    if (this.ambAcc > 0.05) {
      this.ambAcc = 0;
      const x = focusX + rnd.range(-30, 30), z = focusZ + rnd.range(-26, 20);
      if (amb === 'dust') pEmit(x, rnd.range(0.5, 4), z, rnd.range(0.2, 0.8), rnd.range(-0.05, 0.1), rnd.range(-0.2, 0.2), 4, 0.05, 0.05, [1.2, 1.0, 0.8], null, 0.35, 0, 1, true, 0, 0, 0, 0, 0.3, 0.4);
      else if (amb === 'embers') { FXP.embers(x, 0.5, z, 2, 4); }
      else if (amb === 'dirt') { pEmit(x, 12, z, 0, -3, 0, 4, 0.05, 0.05, [0.35, 0.28, 0.2], null, 0.6, 0.6, 1, false, 4, 0.5, 0.05); if (rnd() < 0.2) FXP.dust(x, z, 1, 0.8, [0.25, 0.2, 0.15], 0.2); }
      else if (amb === 'mist') pEmit(x, rnd.range(0.3, 1.2), z, rnd.range(0.3, 1), 0, 0, 5, 2, 4, [0.6, 0.62, 0.65], null, 0.0, 0.0, 3, false, 0, 0, 0, 0, 0.5);
      if (amb === 'mist' && rnd() < 0.5) { const i = pEmit(x, rnd.range(0.3, 1.2), z, rnd.range(0.3, 1), 0.02, 0, 5, 2, 4.5, [0.55, 0.57, 0.6], null, 0.12, 0, 3, false); }
    }
    // fires
    for (const f of this.fires) {
      const dx = f.x - focusX, dz = f.z - focusZ;
      const near = dx * dx + dz * dz < (f.city ? 90 * 90 : 55 * 55);
      if (near) {
        if (rnd() < 0.7 * f.s) FXP.fire(f.x + rnd.range(-0.4, 0.4) * f.s, f.y, f.z + rnd.range(-0.4, 0.4) * f.s, 1, f.s);
        if (rnd() < 0.08 * f.s) FXP.embers(f.x, f.y + 0.5, f.z, 1, f.s);
        if (rnd() < 0.06 * f.s) FXP.smoke(f.x, f.y + 1.5 * f.s, f.z, 1, f.s * 1.2, true, 2, 3.5);
      }
      if (f.light) R.addLight(f.x, f.y + 1.2 * f.s, f.z, (f.city ? 26 : 10) * Math.sqrt(f.s), [2.6, 1.15, 0.4], (f.city ? 1.2 : 1.6) * (0.85 + 0.15 * Math.sin(this.time * 17 + f.x)));
    }
    for (const t of this.torches) {
      const dx = t.x - focusX, dz = t.z - focusZ;
      if (dx * dx + dz * dz > 60 * 60) continue;
      if (rnd() < 0.5) FXP.fire(t.x, t.y, t.z, 1, 0.45);
      if (env.dark || t.wall) R.addLight(t.x, t.y + 0.4, t.z + (t.wall ? 1.5 : 0), t.cave ? 13 : 9, [2.6, 1.3, 0.5], (t.cave ? 1.8 : 1.1) * (0.9 + 0.1 * Math.sin(this.time * 19 + t.x)));
    }
    for (const f of this.floaters) {
      f.x += f.vx * dt; f.z += f.vz * dt;
      if (f.z < 3) f.z = 95; if (f.x < -76) f.x = 76; if (f.x > 76) f.x = -76;
    }
  },

  draw(focusX, focusZ) {
    const t = this.time;
    if (this.stage !== 's4') {
      const o = this.doorOpen || 0;
      ENVM.door.add(-GATE_HALF, 0, -1.2, o * 1.35, 0, 0, 1, 1, 1);
      ENVM.door.add(GATE_HALF, 0, -1.2, -o * 1.35, 0, 0, -1, 1, 1);
      if (o > 0) {                                               // lamplight from inside the city spills through the gate
        R.addLight(0, 2.6, -1.5, 13, [2.6, 1.55, 0.75], 1.7 * o);
        R.addLight(0, 1.6, 3.5, 9, [2.4, 1.4, 0.7], 0.9 * o);
      }
    }
    for (const d of this.staticDecals) {
      const c = colOf(d[7]);
      decal(d[0], d[1], d[2], d[3], d[4], d[5], d[6], c[0], c[1], c[2], d[8], 0, 0.3, -0.03);
    }
    for (const f of this.flags) {
      const wv = Math.sin(t * 3.1 + f.ph) * 0.18;
      ENVM.flag.add(f.x, f.y, f.z, wv + 0.4, 0, Math.sin(t * 5.3 + f.ph) * 0.05, f.s * (1 + Math.sin(t * 4.1 + f.ph) * 0.06), f.s, f.s, 0, 0, 0, 0, f.col[0], f.col[1], f.col[2], 1);
    }
    for (const t2 of this.torches) quadNow(t2.x, t2.y + 0.35, t2.z, 0.9, 2.2, 1.0, 0.35, 0.5, 0, 0, 0, 0, 0, true);
    if (this.showCrowd) {
      const ex = this.excite;
      for (const c of this.crowd) {
        const dz = c.z - focusZ, dx = c.x - focusX;
        if (dx * dx > 60 * 60 || dz < -80) continue;
        const jump = ex > 0.05 ? Math.max(0, Math.sin(t * (9 + (c.ph % 3)) + c.ph)) * 0.45 * ex : 0;
        const sway = Math.sin(t * 1.3 + c.ph) * 0.04;
        c.m.add(c.x, c.y + jump + 0.12, c.z, c.yaw + sway, 0, 0, c.s || 1, c.s || 1, c.s || 1);
      }
    }
    for (const f of this.floaters) {
      const bob = Math.sin(t * 1.4 + f.ph) * 0.08;
      f.m.add(f.x, 0.35 + bob, f.z, f.yaw + t * 0.05, Math.sin(t + f.ph) * 0.05, 0, f.m === M.log ? 1.4 : 1, 1, 1);
    }
  },
};

// Weapon level tables are cumulative: each entry lists the full stats at that level,
// `up` is the text shown on the upgrade slip when reaching that level.
function lvTable(base, steps) {
  const out = [];
  let cur = Object.assign({}, base);
  out.push(Object.assign({ up: '' }, cur));
  for (const s of steps) { cur = Object.assign({}, cur, s[0]); out.push(Object.assign({ up: s[1] }, cur)); }
  return out;
}

// ==== 11_audio.js ====
// ---------------------------------------------------------------------------
// 11_audio.js — WebAudio synthesis: 編鐘 bronze bells, 建鼓 war drums, 琴 plucks
// (Karplus-Strong, pre-rendered), 笛 flute, war horns, and a generative score.
// ---------------------------------------------------------------------------
const AU = {
  ctx: null, ready: false, master: null, musicBus: null, sfxBus: null, verb: null, comp: null, noiseBuf: null,
  last: {}, track: null, nextT: 0, step: 0, bar: 0, intensity: 0.3, rainGain: null, windGain: null, plucks: {}, timer: 0,
  muted: false,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.comp = ctx.createDynamicsCompressor();
    this.comp.threshold.value = -14; this.comp.knee.value = 12; this.comp.ratio.value = 4; this.comp.attack.value = 0.004; this.comp.release.value = 0.2;
    this.master = ctx.createGain(); this.master.connect(ctx.destination);
    this.comp.connect(this.master);
    this.musicBus = ctx.createGain(); this.musicBus.connect(this.comp);
    this.sfxBus = ctx.createGain(); this.sfxBus.connect(this.comp);
    this.amb = ctx.createGain(); this.amb.connect(this.comp);
    // reverb from synthetic impulse
    this.verb = ctx.createConvolver();
    const len = ctx.sampleRate * 2.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    this.verb.buffer = ir;
    this.verbIn = ctx.createGain(); this.verbIn.gain.value = 0.4;
    this.verbIn.connect(this.verb); this.verb.connect(this.comp);
    // noise buffer
    const nl = ctx.sampleRate * 2; this.noiseBuf = ctx.createBuffer(1, nl, ctx.sampleRate);
    const nd = this.noiseBuf.getChannelData(0); for (let i = 0; i < nl; i++) nd[i] = Math.random() * 2 - 1;
    // ambience loops: rain and wind
    const mkLoop = (type, f, q) => {
      const s = ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
      const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = ctx.createGain(); g.gain.value = 0;
      s.connect(fl); fl.connect(g); g.connect(this.amb); s.start();
      return g;
    };
    this.rainGain = mkLoop('highpass', 1800, 0.3);
    this.rainLow = mkLoop('lowpass', 500, 0.5);
    this.windGain = mkLoop('bandpass', 380, 0.6);
    this.applyVolumes();
    this.ready = true;
    this.timer = setInterval(() => this._sched(), 25);
  },
  applyVolumes() {
    if (!this.ctx) return;
    const s = SAVE.data.settings;
    this.master.gain.value = this.muted ? 0 : (s.vol == null ? 0.8 : s.vol);
    this.musicBus.gain.value = (s.music == null ? 0.6 : s.music) * 0.55;
    this.sfxBus.gain.value = (s.sfx == null ? 0.8 : s.sfx) * 0.7;
    this.amb.gain.value = (s.sfx == null ? 0.8 : s.sfx) * 0.6;
  },
  setAmbience(rain, wind) {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    this.rainGain.gain.setTargetAtTime(rain * 0.16, t, 0.6);
    this.rainLow.gain.setTargetAtTime(rain * 0.12, t, 0.6);
    this.windGain.gain.setTargetAtTime(wind * 0.07, t, 1.0);
  },

  // ---------------- primitives ----------------
  _env(g, t, a, peak, d, sus, r, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * sus), t + a + d);
    if (dur != null) { g.gain.setValueAtTime(Math.max(0.0001, peak * sus), t + dur); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + r); }
  },
  _osc(type, f, t, dur, peak, dest, opts) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (opts && opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t + (opts.sweep || dur));
    if (opts && opts.detune) o.detune.value = opts.detune;

// scales (Hz) — 羽調 pentatonic on A: A C D E G
const PENTA = [];
{ const base = [0, 3, 5, 7, 10]; for (let o = -2; o <= 2; o++) for (const s of base) PENTA.push(220 * Math.pow(2, o + s / 12)); }

const TRACKS = {
  title: {
    bpm: 58,
    step(A, t, s, bar) {
      if (s === 0 && bar % 2 === 0) { A._osc('sine', pn(0), t, 7, 0.07, A.musicBus, { a: 1.5 }); A._osc('sine', pn(2) , t, 7, 0.04, A.musicBus, { a: 1.5 }); }

      if (s === 8 && bar % 4 === 3) A.bell(pn(12), t, 0.07);
      const m = MOTIF[(s + bar * 5) % 16];
      if (s % 4 === 2 && m > 0 && Math.random() < 0.5) A.pluck(pn(m), t, 0.14);
    },
  },
  story: {
    bpm: 64,
    step(A, t, s, bar) {
      if (s === 0 && bar % 2 === 0) A._osc('sine', pn(2), t, 7.5, 0.05, A.musicBus, { a: 2 });
      if (s === 0 && bar % 3 === 0) A.bell(pn(9 + (bar % 2) * 2), t, 0.07);

  },
  battle: {
    bpm: 102,
    step(A, t, s, bar, I) {

      if (s === 6 || (s === 14 && bar % 2)) A.drum(t, 0.25, A.musicBus, 140, 60);
      if (s % 2 === 0 && inten > 0.4) A.clack(t, 0.035 + (s % 4 === 0 ? 0.02 : 0), A.musicBus, 700);
      if (inten > 0.7 && s % 4 === 3) A.drum(t, 0.16, A.musicBus, 180, 90);
      const m = MOTIF[(s + (bar % 4) * 4) % 16];
      if (m > 0 && s % 2 === 0) A.pluck(pn(m - 2 + (inten > 0.6 ? 3 : 0)), t, 0.1);
      if (s === 0 && bar % 4 === 0) A.bell(pn(7), t, 0.08);

    },
  },
  battle2: {
    bpm: 112,
    step(A, t, s, bar) {

      if (s % 2 === 1) A.clack(t, 0.03, A.musicBus, 900);

    },
  },
  boss: {
    bpm: 126,
    step(A, t, s, bar) {

      if (s === 6 || s === 14) A.drum(t, 0.32, A.musicBus, 160, 70);

const _dir = [0, 0];
function hitEnemy(i, dmg, wid, fromX, fromZ, knock, opts) {

  let t = EN.link[i] >= 0 ? EN.link[i] : i;
  if (EN.alive[t] !== 1) return 0;
  let d = dmg * P.stats.might;
  let crit = false;

      if (PK.alive[k] && PK.kind[k] <= 2 && !PK.mag[k]) { PK.val[k] += xp; if (PK.val[k] >= 20) PK.kind[k] = 2; else if (PK.val[k] >= 5) PK.kind[k] = 1; return; }

// ---- enemy AI -------------------------------------------------------------------------
function enemyAI(i, dt) {
  const key = ENEMY_KEYS[EN.type[i]], d = ENEMY[key];
  const x = EN.x[i], z = EN.z[i];
  let tx = P.x, tz = P.z;
  const W = G.witness;
  let besiege = false;
  if (W && (W.state === 'wait' || W.state === 'follow')) {
    const dw = len2(W.x - x, W.z - z), dp = len2(P.x - x, P.z - z);
    if (dw < (W.state === 'follow' ? 6 : 8) && dw < dp) { tx = W.x; tz = W.z; besiege = W.state === 'wait' && dw < 2.2; }
  }
  let dx = tx - x, dz = tz - z;
  const dist = Math.hypot(dx, dz) || 0.001;
  dx /= dist; dz /= dist;
  let mx = dx, mz = dz, sp = 1;
  if (besiege && d.ai === 'chase') { mx = 0; mz = 0; EN.yaw[i] = dampAngle(EN.yaw[i], Math.atan2(dx, dz), 8, dt); }  // ring her in, leave her visible
  EN.st[i] -= dt;
  switch (d.ai) {
    case 'chase':
      if (EN.state[i] === 9) { mx = 0; mz = 0; EN.y[i] = Math.min(0, EN.y[i] + dt * 2.2); if (EN.st[i] <= 0) { EN.state[i] = 0; EN.y[i] = 0; if (!G.sim) FXP.dust(x, z, 5, 0.8, [0.3, 0.24, 0.16]); } }
      break;
    case 'wall': {
      if (EN.state[i] === 1) { mx = 0; mz = 0; G.ladderCount++; G.wallHp -= d.wallDps * (G.stage ? G.stage.dmgMul : 1) * dt; G.wallFlash = 1; break; }
      const wx = EN.tx[i] - x, wz = EN.tz[i] - z, wl = Math.hypot(wx, wz) || 1;
      mx = wx / wl; mz = wz / wl;
      if (wl < 0.6 || z <= EN.tz[i] + 0.05) { EN.state[i] = 1; EN.z[i] = EN.tz[i]; EN.yaw[i] = Math.PI; if (!G.sim) { AU.sfx('ladder'); FX.toast('梯子靠上城牆了！', 'warn'); } }
      break;
    }
    case 'ranged': {
      if (EN.state[i] === 1) {                       // aiming
        mx = 0; mz = 0;
        if (EN.st[i] <= 0) {
          EN.state[i] = 0; EN.st[i] = d.fire * rnd.range(0.8, 1.2);
          const a = EN.fire[i];
          spawnEP({ kind: 'arrow', x, z, y: 1.3, vx: Math.sin(a) * d.pspeed, vz: Math.cos(a) * d.pspeed, life: 1.6, dmg: d.pdmg * (G.stage ? G.stage.dmgMul : 1) * DIFFICULTY[G.diff].dmg, r: 0.35 });
          if (!G.sim && rnd() < 0.4) AU.sfx('bowEnemy');
        }
        break;
      }
      if (dist > d.range) { /* approach */ } else if (dist < d.range * 0.6) { mx = -dx; mz = -dz; } else { mx = -dz * 0.4; mz = dx * 0.4; sp = 0.5; }
      if (dist < d.range + 4 && EN.st[i] <= 0) {
        EN.state[i] = 1; EN.st[i] = 0.75; EN.fire[i] = Math.atan2(tx - x, tz - z);
        if (!G.sim) telegraph({ shape: 1, x, z, rot: EN.fire[i], len: Math.min(dist + 3, 16), w: 0.5, dur: 0.75, col: [2.4, 0.4, 0.15], sound: false, hitPlayer: false });
      }
      break;
    }
    case 'lunge': {
      const s = EN.state[i];
      if (s === 1) { mx = 0; mz = 0; if (EN.st[i] <= 0) { EN.state[i] = 2; EN.st[i] = 0.28; } }
      else if (s === 2) { mx = Math.sin(EN.fire[i]); mz = Math.cos(EN.fire[i]); sp = 7.5; if (EN.st[i] <= 0) { EN.state[i] = 3; EN.st[i] = 0.7; } }
      else if (s === 3) { sp = 0.2; if (EN.st[i] <= 0) EN.state[i] = 0; }
      else if (dist < 5 && EN.st[i] <= 0) {
        EN.state[i] = 1; EN.st[i] = 0.55; EN.fire[i] = Math.atan2(tx - x, tz - z);
        if (!G.sim) telegraph({ shape: 1, x, z, rot: EN.fire[i], len: 5.6, w: 1.2, dur: 0.55, sound: false, hitPlayer: false });
      }
      break;
    }
    case 'charge': {
      const s = EN.state[i];
      if (s === 0) {                                  // line up
        sp = 0.3;
        if (EN.st[i] <= 0) {
          EN.state[i] = 1; EN.st[i] = 0.9; EN.fire[i] = Math.atan2(tx - x, tz - z);
          if (!G.sim) telegraph({ shape: 1, x, z, rot: EN.fire[i], len: 34, w: 3.0, dur: 0.9, sound: false, hitPlayer: false, col: [3, 0.7, 0.2] });
        }
      } else if (s === 1) { mx = 0; mz = 0; EN.yaw[i] = EN.fire[i]; if (EN.st[i] <= 0) { EN.state[i] = 2; EN.st[i] = 3.8; if (!G.sim) AU.sfx('chariot'); } }
      else if (s === 2) {
        mx = Math.sin(EN.fire[i]); mz = Math.cos(EN.fire[i]); sp = 1.35;
        if (EN.st[i] <= 0 || z < WALL_Z + 2.5 || Math.abs(x) > 120 || z > 140) {
          EN.tx[i]++;                                   // three runs, then the crew drives off the field
          if (EN.tx[i] >= 3) { EN.state[i] = 3; EN.fire[i] = Math.atan2(x >= 0 ? 1 : -1, 0.35); } else { EN.state[i] = 0; EN.st[i] = 1.6; }
        }
        if (!G.sim && rnd() < 0.5) FXP.dust(x - mx * 1.5, z - mz * 1.5, 1, 0.9);
      } else if (s === 3) {
        mx = Math.sin(EN.fire[i]); mz = Math.cos(EN.fire[i]); sp = 1.1; EN.yaw[i] = dampAngle(EN.yaw[i], EN.fire[i], 4, dt);
        if (Math.abs(x) > ARENA.x1 + 14 || z > ARENA.z1 + 14) { freeEnemy(i); return; }
      }
      break;
    }
    case 'shaman': {
      if (dist < d.range * 0.8) { mx = -dx; mz = -dz; } else if (dist < d.range * 1.2) { mx = -dz * 0.5; mz = dx * 0.5; sp = 0.4; }
      if (EN.st[i] <= 0) {
        EN.st[i] = 6;
        const n = queryCircle(x, z, 9);
        for (let k = 0; k < n; k++) { const e = QBUF[k]; if (EN.type[e] !== BOSS_TYPE) { EN.buff[e] = 5; EN.hp[e] = Math.min(EN.maxHp[e], EN.hp[e] + EN.maxHp[e] * 0.25); } }
        if (!G.sim) { FXP.ring(x, 0.5, z, 18, [2.6, 0.5, 0.3], 0.6); markAdd(x, z, 0, 9, 9, 9, '#ff5030', 0.6, 0.8, 0.05); AU.sfx('drum'); }
      }
      break;
    }
    case 'bomber': {
      if (EN.state[i] === 1) {
        mx = 0; mz = 0;
        if (EN.st[i] <= 0) {
          const r = 3.0;
          if (len2(P.x - x, P.z - z) < r) damagePlayer(EN.dmg[i] * 1.2, x, z, 'niuBoom');
          const n = queryCircle(x, z, r);
          for (let k = 0; k < n; k++) if (QBUF[k] !== i && EN.type[QBUF[k]] !== BOSS_TYPE) { EN.hp[QBUF[k]] -= 40; EN.flash[QBUF[k]] = 1; if (EN.hp[QBUF[k]] <= 0) killEnemy(QBUF[k], 'boom'); }
          if (!G.sim) { FXP.fire(x, 0.5, z, 20, 2); FXP.sparks(x, 1, z, 14); FXP.smoke(x, 1, z, 5, 2, true); FX.shake(0.25); AU.sfx('explode'); markAdd(x, z, rnd() * TAU, 3, 3, 5, '#140c06', 0.7, 6); }
          EN.hp[i] = 0; killEnemy(i, 'boom');
          return;
        }
      } else if (dist < 3.2) {
        EN.state[i] = 1; EN.st[i] = 1.35;
        telegraph({ shape: 0, x, z, r: 3.0, dur: 1.35, sound: true, hitPlayer: false });
      }
      break;
    }
    case 'thrower': {
      if (dist < d.range * 0.7) { mx = -dx; mz = -dz; } else if (dist < d.range * 1.15) { mx = -dz * 0.4; mz = dx * 0.4; sp = 0.4; }
      if (dist < d.range + 5 && EN.st[i] <= 0) {
        EN.st[i] = d.fire * rnd.range(0.8, 1.2);
        const px = tx + P.vx * 0.5, pz = tz + P.vz * 0.5;
        const dmg = EN.dmg[i];
        telegraph({ shape: 0, x: px, z: pz, r: 1.8, dur: 1.1, sound: false, hitPlayer: false, onFire: T => addZone({ kind: 'enemyFire', x: T.x, z: T.z, r: 1.8, dur: 2.6, dps: dmg * 1.2 }) });
        const tt = 1.1;
        spawnEP({ kind: 'pot', x, z, y: 1.6, vx: (px - x) / tt, vz: (pz - z) / tt, vy: 9, g: 17, life: tt + 0.2, dmg: 0, r: 0.1 });
      }
      break;
    }
  }
  const buffed = EN.buff[i] > 0 ? 1.35 : 1;
  const slowF = EN.slow[i] > 0 ? 1 - EN.slowAmt[i] : 1;
  const waterF = G.stage && G.stage.water ? 0.85 : 1;
  const v = EN.speed[i] * sp * buffed * slowF * waterF * (EN.stun[i] > 0 ? 0 : 1);
  EN.dx[i] = mx * v; EN.dz[i] = mz * v;
  if (mx || mz) EN.yaw[i] = dampAngle(EN.yaw[i], Math.atan2(mx, mz), 10, dt);
}

function updateEnemies(dt) {
  G.ladderCount = 0;
  const pr = P.r;
  for (let i = 0; i < EN.hi; i++) {
    const a = EN.alive[i];
    if (!a) continue;
    if (a === 2) {
      EN.dis[i] += dt / 0.4;
      EN.y[i] -= dt * 0.3;
      if (EN.dis[i] >= 1) freeEnemy(i);
      continue;
    }
    if (EN.type[i] === BOSS_TYPE) continue;       // bosses drive their own proxies
    EN.flash[i] = Math.max(0, EN.flash[i] - dt * 8);
    EN.atk[i] -= dt; EN.slow[i] -= dt; EN.stun[i] -= dt; EN.buff[i] -= dt; EN.mark[i] -= dt; EN.smoke[i] -= dt;
    if (EN.smoke[i] <= 0) EN.vuln[i] = 0;
    if (EN.burn[i] > 0) {
      EN.burn[i] -= dt;
      EN.hp[i] -= EN.burnDps[i] * dt * P.stats.might;
      if (!G.sim && rnd() < dt * 6) FXP.fire(EN.x[i], 1, EN.z[i], 1, 0.5);
      if (EN.hp[i] <= 0) { killEnemy(i, 'huo'); continue; }
    }
    enemyAI(i, dt);
    if (!EN.alive[i] || EN.alive[i] !== 1) continue;
    EN.kx[i] *= Math.exp(-7 * dt); EN.kz[i] *= Math.exp(-7 * dt);
    EN.x[i] += (EN.dx[i] + EN.kx[i]) * dt;
    EN.z[i] += (EN.dz[i] + EN.kz[i]) * dt;
    const minZ = WALL_Z + EN.r[i] * 0.9;
    if (EN.z[i] < minZ) EN.z[i] = minZ;
    const spd = Math.hypot(EN.dx[i], EN.dz[i]);
    EN.phase[i] += spd * dt * 3.0;
    // contact damage
    const dx = P.x - EN.x[i], dz = P.z - EN.z[i], rs = EN.r[i] + pr;
    if (dx * dx + dz * dz < rs * rs && EN.atk[i] <= 0 && EN.state[i] !== 9) {
      EN.atk[i] = 0.85;
      damagePlayer(EN.dmg[i] * (EN.buff[i] > 0 ? 1.2 : 1), EN.x[i], EN.z[i], ENEMY_KEYS[EN.type[i]]);
    }
    const W = G.witness;
    if (W && W.state !== 'saved' && W.state !== 'lost' && EN.atk[i] <= 0) {
      const wx = W.x - EN.x[i], wz = W.z - EN.z[i], ws = EN.r[i] + 0.5;
      if (wx * wx + wz * wz < ws * ws) { EN.atk[i] = 1.0; witnessHurt(EN.dmg[i]); }
    }
  }
  // separation (push apart overlapping enemies), using the grid built at frame start
  for (let i = 0; i < EN.hi; i++) {
    if (EN.alive[i] !== 1 || EN.type[i] === BOSS_TYPE) continue;
    const c = gridCell(EN.x[i], EN.z[i]);
    const cx = c % GRID.w, cz = (c / GRID.w) | 0;
    let checks = 0;
    for (let oz = -1; oz <= 1 && checks < 10; oz++) for (let ox = -1; ox <= 1 && checks < 10; ox++) {
      const ccx = cx + ox, ccz = cz + oz;
      if (ccx < 0 || ccz < 0 || ccx >= GRID.w || ccz >= GRID.h) continue;
      let j = GRID.head[ccz * GRID.w + ccx];
      while (j >= 0 && checks < 10) {
        if (j !== i && EN.alive[j] === 1) {
          const dx = EN.x[i] - EN.x[j], dz = EN.z[i] - EN.z[j];
          const rs = (EN.r[i] + EN.r[j]) * 0.92;
          const d2 = dx * dx + dz * dz;
          if (d2 < rs * rs && d2 > 1e-6) {
            checks++;
            const d = Math.sqrt(d2), ov = (rs - d) * 0.5;
            const mi = EN.mass[i], mj = EN.mass[j], wi = mj / (mi + mj);
            const px = dx / d * ov, pz = dz / d * ov;
            EN.x[i] += px * wi * 1.6; EN.z[i] += pz * wi * 1.6;
            if (EN.type[j] !== BOSS_TYPE) { EN.x[j] -= px * (1 - wi) * 1.6; EN.z[j] -= pz * (1 - wi) * 1.6; }
          }
        }
        j = GRID.next[j];
      }
    }
  }
}

const ENEMY_PARTS = {};
function setupEnemyParts() {
  ENEMY_PARTS.zu = { body: M.zuBody, arm: M.zuArm, leg: M.chuLeg };
  ENEMY_PARTS.dun = { body: M.dunBody, arm: M.dunArm, leg: M.chuLeg };
  ENEMY_PARTS.gong = { body: M.gongBody, arm: M.gongArm, leg: M.chuLeg };
  ENEMY_PARTS.ge = { body: M.geBody, arm: M.geArm, leg: M.chuLeg };
  ENEMY_PARTS.huo = { body: M.huoBody, arm: M.huoArm, leg: M.chuLeg };
  ENEMY_PARTS.xue = { body: M.xueBody, arm: M.xueArm, leg: M.chuLeg };
  ENEMY_PARTS.xiao = { body: M.xiaoBody, arm: M.xiaoArm, leg: M.chuLeg };
  ENEMY_PARTS.ti = { single: M.tiBody };
  ENEMY_PARTS.che = { single: M.cheBody, wheels: true };
  ENEMY_PARTS.wu = { single: M.wuBody };
  ENEMY_PARTS.quan = { single: M.quanBody, gallop: true };
  ENEMY_PARTS.niu = { single: M.niuBody };
}
const _eliteTint = null;
function drawEnemies() {
  const fx = R.cam.target[0], fz = R.cam.target[2];
  const wy = G.stage && G.stage.water ? -0.28 : 0;
  for (let i = 0; i < EN.hi; i++) {
    const a = EN.alive[i];
    if (!a || EN.type[i] === BOSS_TYPE) continue;
    const x = EN.x[i], z = EN.z[i];
    const ddx = x - fx, ddz = z - fz;
    if (ddx * ddx > 46 * 46 || ddz < -36 || ddz > 34) continue;
    const key = ENEMY_KEYS[EN.type[i]];
    const T = ENEMY_PARTS[key];
    const s = EN.scale[i];
    const dis = a === 2 ? EN.dis[i] : 0;
    const flash = EN.flash[i] * 0.55;
    const emis = EN.elite[i] ? 0.25 + 0.1 * Math.sin(G.time * 6 + i) : (EN.buff[i] > 0 ? 0.35 : 0);
    const moving = Math.hypot(EN.dx[i], EN.dz[i]) > 0.1 ? 1 : 0;
    const y = EN.y[i] + wy;
    if (T.single) {
      const ph = EN.phase[i];
      let pitch = 0, roll = 0, yy = y;
      if (T.gallop) { pitch = Math.sin(ph * 1.6) * 0.12 * moving; yy += Math.abs(Math.sin(ph * 1.6)) * 0.15 * moving; }
      else if (key === 'ti') { yy += Math.abs(Math.sin(ph)) * 0.08 * moving; roll = Math.sin(ph) * 0.04 * moving; }
      else if (key === 'wu') { yy += Math.sin(G.time * 3 + i) * 0.06; roll = Math.sin(G.time * 2 + i) * 0.05; }
      else if (key === 'niu') { roll = Math.sin(ph) * 0.06 * moving; if (EN.state[i] === 1) roll += Math.sin(G.time * 40) * 0.05; }
      T.single.add(x, yy, z, EN.yaw[i], pitch, roll, s, s, s, flash, dis, 0, emis);
      if (T.wheels) {
        writeTRS(_mRoot, 0, x, yy, z, EN.yaw[i], 0, 0, s, s, s);
        const spin = EN.phase[i] * 1.6;
        M.wheel.addMat(childMat(_mRoot, 1.15, 0.95, -0.4, 0, spin, 0), flash, dis);
        M.wheel.addMat(childMat(_mRoot, -1.15, 0.95, -0.4, 0, spin, 0), flash, dis);
      }
      if (key === 'ti' && EN.state[i] === 1) M.ladder.add(x, 0, WALL_Z - 1.4, 0, -0.2, 0, 1, 1, 1, flash, dis);
    } else {
      let armP = 0, lean = 0;
      const st = EN.state[i];
      if (key === 'ge') { if (st === 1) { armP = 0.6; lean = -0.2; } else if (st === 2) { armP = -1.2; lean = 0.35; } }
      else if (key === 'gong' && st === 1) armP = -1.4;
      else if (key === 'huo') armP = Math.max(-2.2, -(1 - (EN.st[i] % 3.4) / 0.5) * 2.2) * (EN.st[i] < 0.5 ? 1 : 0);
      else if (EN.atk[i] > 0.55) armP = -1.1;
      drawBiped(T, x, y, z, EN.yaw[i], EN.phase[i], moving, s, flash, dis, emis, armP, lean);
    }
    if (EN.elite[i] && a === 1) decal(x, z, 0, EN.r[i] * 1.5, EN.r[i] * 1.5, 9, 0, 2.6, 1.9, 0.6, 0.8, 0.07);
    if (key === 'che' && a === 1 && EN.state[i] === 2) { const ca = EN.fire[i]; decal(x + Math.sin(ca) * 7, z + Math.cos(ca) * 7, ca, 1.5, 7, 1, 0, 2.6, 0.5, 0.2, 0.45); }
    if (EN.buff[i] > 0 && a === 1) decal(x, z, 0, EN.r[i] * 1.4, EN.r[i] * 1.4, 9, 0, 2.6, 0.4, 0.2, 0.6, 0.06);
  }
}

// ---- player -----------------------------------------------------------------------
const _mv = [0, 0], _aim = [0, 0];
function updatePlayer(dt) {
  if (P.dead) return;
  const S = P.stats;
  P.iframes -= dt; P.hurt = Math.max(0, P.hurt - dt * 5);
  P.hp = Math.min(P.maxHp, P.hp + S.regen * dt);
  let moving;
  if (G.autoplay) moving = botMove(_mv, dt); else moving = inputMove(_mv);
  const waterF = G.stage && G.stage.water ? 0.88 : 1;
  const speed = S.speed * waterF;
  // dash
  P.dashCd -= dt;
  if (P.dashCd <= 0 && P.dashCharges < P.dashMax) { P.dashCharges++; P.dashCd = P.dashCharges < P.dashMax ? P.dashCdMax : 0; }
  const wantDash = G.autoplay ? botDash() : ACT.dash();
  if (wantDash && P.dashCharges > 0 && P.dashT <= 0) {
    P.dashCharges--; if (P.dashCd <= 0) P.dashCd = P.dashCdMax;
    let dx = _mv[0], dz = _mv[1];
    if (!moving) { dx = Math.sin(P.face); dz = Math.cos(P.face); }
    const l = Math.hypot(dx, dz) || 1;
    P.dashDX = dx / l; P.dashDZ = dz / l; P.dashT = 0.2; P.iframes = Math.max(P.iframes, 0.32);
    if (!G.sim) { AU.sfx('dash'); FXP.inkMist(P.x, 0.8, P.z, 6, 0.7); markAdd(P.x + P.dashDX * 3, P.z + P.dashDZ * 3, Math.atan2(P.dashDX, P.dashDZ), 0.5, 3.2, 4, COL.ink, 0.7, 1.2); }
  }
  if (P.dashT > 0) {
    P.dashT -= dt;
    P.vx = P.dashDX * 30; P.vz = P.dashDZ * 30;
    if (!G.sim && rnd() < 0.8) FXP.inkMist(P.x, 0.9, P.z, 1, 0.5);
  } else {
    const tvx = _mv[0] * speed, tvz = _mv[1] * speed;
    P.vx = damp(P.vx, tvx, 16, dt); P.vz = damp(P.vz, tvz, 16, dt);
  }
  P.x += P.vx * dt; P.z += P.vz * dt;
  // bounds
  const A = ARENA;
  P.x = clamp(P.x, A.x0, A.x1); P.z = clamp(P.z, WALL_Z + 1.3, A.z1);
  if (G.ultActive && G.ultActive.kind === 'jiedai') {
    const U = G.ultActive, dx = P.x - U.x, dz = P.z - U.z, d = Math.hypot(dx, dz);
    if (d > U.r - 0.8) { P.x = U.x + dx / d * (U.r - 0.8); P.z = U.z + dz / d * (U.r - 0.8); }
  }
  const sp = Math.hypot(P.vx, P.vz);
  P.moving = sp > 0.4;
  if (P.moving) P.face = dampAngle(P.face, Math.atan2(P.vx, P.vz), 14, dt);
  P.phase += sp * dt * 2.1;
  // aim: mouse when enabled, else nearest enemy
  const aimMode = SAVE.data.settings.aim;
  if (aimMode === 'mouse' && IN.device === 'mouse' && R.screenToGround(IN.mouse.x, IN.mouse.y, _aim)) {
    const dx = _aim[0] - P.x, dz = _aim[1] - P.z, l = Math.hypot(dx, dz) || 1;
    P.aimX = dx / l; P.aimZ = dz / l; P.aimMouse = true;
  } else {
    P.aimMouse = false;
    let e = nearestEnemy(P.x, P.z, 18);
    // a boss in reach takes the aim, unless someone is right in your face
    const B = G.boss;
    if (B && !B.dying && EN.alive[B.main] === 1) {
      const bi = B.main, bd = len2(EN.x[bi] - P.x, EN.z[bi] - P.z) - EN.r[bi];
      const ed = e >= 0 ? len2(EN.x[e] - P.x, EN.z[e] - P.z) - EN.r[e] : 99;
      if (bd < 16 && ed > 2.6) e = bi;
    }
    if (e >= 0) { const dx = EN.x[e] - P.x, dz = EN.z[e] - P.z, l = Math.hypot(dx, dz) || 1; P.aimX = dx / l; P.aimZ = dz / l; }
    else { P.aimX = Math.sin(P.face); P.aimZ = Math.cos(P.face); }

}

function drawPlayer() {
  if (!P.rig) return;
  const r = P.rig, t = G.time;
  const move = P.moving ? Math.min(1, Math.hypot(P.vx, P.vz) / 5) : 0;
  const dashing = P.dashT > 0;
  r.reset();
  const ph = P.phase;
  const swing = Math.sin(ph) * 0.75 * move;
  r.get('legL').pitch = swing; r.get('legR').pitch = -swing;
  r.get('hips').py = 0.86 + Math.abs(Math.cos(ph)) * 0.06 * move - (dashing ? 0.12 : 0);
  const torso = r.get('torso');
  torso.pitch = 0.12 * move + (dashing ? 0.5 : 0);
  torso.roll = Math.sin(ph) * 0.04 * move;
  // upper body twists toward aim
  const aimYaw = Math.atan2(P.aimX, P.aimZ);
  torso.yaw = clamp(angDiff(P.face, aimYaw), -0.9, 0.9);
  r.get('armL').pitch = -0.9 + Math.sin(t * 2) * 0.03; r.get('armL').roll = 0.35; r.get('armL').yaw = -0.2;
  r.get('armR').pitch = -0.9; r.get('armR').roll = -0.35; r.get('armR').yaw = 0.2;
  const bow = r.get('bow');
  bow.pz = 0.42 - (P.recoil || 0) * 0.15;
  const head = r.get('head');
  head.yaw = clamp(angDiff(P.face + torso.yaw, aimYaw), -0.5, 0.5);
  head.py = 0.72 + Math.sin(t * 2.2) * 0.008;
  const tails = r.get('tails');
  tails.pitch = -0.3 - move * 0.5 - (dashing ? 0.6 : 0) + Math.sin(t * 7) * 0.08;
  tails.yaw = Math.sin(t * 3.3) * 0.25;
  const wy = G.stage && G.stage.water ? -0.25 : 0;
  writeTRS(_mRoot, 0, P.x, wy, P.z, P.face, 0, 0, 1.08, 1.08, 1.08);
  r.update(_mRoot);
  const flash = P.hurt > 0.7 ? (P.hurt - 0.7) * 1.6 : 0;
  const blink = P.iframes > 0.4 && Math.sin(t * 40) > 0 ? 0.25 : 0;
  r.draw(flash, 0, blink, null);
  P.recoil = Math.max(0, (P.recoil || 0) - 0.08);
  // teal ground ring + dash ink
  decal(P.x, P.z, 0, 0.9, 0.9, 9, 0, 0.4, 2.4, 1.9, 0.55, 0.06);
  if (P.aimMouse) decal(P.x + P.aimX * 3.2, P.z + P.aimZ * 3.2, Math.atan2(P.aimX, P.aimZ), 0.35, 0.35, 7, 0, 0.5, 2.4, 2.0, 0.7);
  if (G.stage && (G.stage.cave || G.stage.night)) R.addLight(P.x, 3.2, P.z + 0.5, G.stage.cave ? 16 : 12, [2.2, 1.6, 1.0], G.stage.cave ? 2.4 : 1.4);
  R.addLight(P.x, 1.2, P.z, 3.2, [0.5, 2.4, 1.9], 0.35);
}

function witnessHurt(d) {

function updateWitness(dt) {
  const W = G.witness;
  if (!W) return;
  W.t += dt; W.hurt = Math.max(0, (W.hurt || 0) - dt * 4);
  const dP = len2(P.x - W.x, P.z - W.z);

    if (dP < 3.6) { W.state = 'follow'; if (!G.sim) { FX.bubble(W, '跟你走！'); AU.sfx('witness'); } }
  } else if (W.state === 'follow') {
    if (dP > 16) { W.state = 'wait'; if (!G.sim) FX.bubble(W, '等等我……'); }
    else if (dP > 2.2) {
      const dx = P.x - W.x, dz = P.z - W.z, l = dP || 1, sp = Math.min(5.0, P.stats.speed * 0.95) * (G.stage.water ? 0.88 : 1);
      W.x += dx / l * sp * dt; W.z += dz / l * sp * dt; W.face = Math.atan2(dx, dz); W.phase += sp * dt * 2.5;
    }
    if (len2(W.x - GATE_POS[0], W.z - GATE_POS[1]) < 6.5) {
      W.state = 'saved'; W.t = 0;
      onWitnessSaved(W.id);
    }
  } else if (W.state === 'saved') {
    W.z -= dt * 2; W.x = damp(W.x, 0, 3, dt);
    if (W.t > 2.5) G.witness = null;
  } else if (W.state === 'lost') {
    W.z += dt * 3;
    if (W.t > 2) G.witness = null;
  }
}
function drawWitness() {
  const W = G.witness;

  m.add(W.x, y, W.z, W.face, pitch, 0, 1, 1, 1, W.hurt * 0.8, dis);

// ---- 三百墨者 support fire from the wall -------------------------------------------------
function updateSupport(dt) {
  if (!G.stage || !G.stage.support) return;
  G.supportT -= dt;
  if (G.supportT > 0) return;
  G.supportT = 0.32;
  const lvl = SAVE.data.workshop.three || 0;
  const dmg = 7 * Math.pow(G.stage.hpMul, 0.85) * (1 + 0.25 * lvl);
  for (let s = 0; s < 2; s++) {
    const best = supportTarget();
    if (best < 0) return;
    const tx = EN.x[best] + EN.dx[best] * 0.4, tz = EN.z[best] + EN.dz[best] * 0.4;
    const sx = clamp(tx + rnd.range(-6, 6), -72, 72), sy = WALL_H + 1.6, sz = WALL_Z - 1.6;
    const T = 0.55, vx = (tx - sx) / T, vz = (tz - sz) / T, vy = (0.9 - sy) / T + 0.5 * 30 * T;
    const i = spawnProj(7, 'support', sx, sy, sz, vx, vy, vz, T + 0.3, dmg, 0.5, 0, 1.5);
    if (i >= 0 && !G.sim && rnd() < 0.3) AU.sfx('bowWall');
  }

// the 300 on the wall watch the ladders first: climbing ladders, then ladders closing in,
// then whoever is nearest the wall
function supportTarget() {
  const TI = ENEMY_IDX.ti;
  let best = -1, bs = 1e9;
  const B = G.boss;
  if (B && B.mode === 'nine' && EN.alive[B.main] === 1) return B.main;   // everyone on the wall shoots the automaton
  if (EN.byType[TI] > 0) {
    for (let i = 0; i < EN.hi; i++) {
      if (EN.alive[i] !== 1 || EN.type[i] !== TI || Math.abs(EN.x[i]) > 76) continue;
      const sc = EN.z[i] - (EN.state[i] === 1 ? 100 : 0) + rnd() * 3;
      if (sc < bs) { bs = sc; best = i; }
    }
    if (best >= 0 && (EN.state[best] === 1 || (EN.z[best] < WALL_Z + 7 && rnd() < 0.5))) return best;
    best = -1; bs = 1e9;
  }
  for (let tries = 0; tries < 24; tries++) {
    const i = (rnd() * EN.hi) | 0;
    if (EN.alive[i] !== 1 || EN.type[i] === BOSS_TYPE) continue;
    const z = EN.z[i];
    if (z > WALL_Z + 18 || Math.abs(EN.x[i]) > 76) continue;
    if (z < bs) { bs = z; best = i; }
  }
  return best;
}

function updateUlt(dt) {

        const r = EN.r[B.main] * 0.8, a = rnd() * TAU;

      } else {

      }

// ---- director (spawning + scripted events) ------------------------------------------
const _sp = [0, 0];
function rosterPick() {
  const R0 = G.stage.roster;
  let row = R0[0][1];
  for (const r of R0) if (G.t01 >= r[0]) row = r[1];
  let sum = 0; for (const k in row) sum += row[k];
  let x = rnd() * sum;
  for (const k in row) { x -= row[k]; if (x <= 0) return k; }
  return 'zu';
}
function updateDirector(dt) {
  const S = G.stage;
  G.tiCd -= dt;
  if (G.noSpawn) return;
  // scripted events
  while (G.eventIdx < S.events.length && G.t >= S.events[G.eventIdx].t) {
    runEvent(S.events[G.eventIdx]);
    G.eventIdx++;
  }
  if (G.cleared) return;
  let target = lerp(S.density[0], S.density[1], Math.pow(G.t01, 1.15)) * (DIFFICULTY[G.diff].density || 1);
  if (G.boss) target *= 0.4;
  const rate = Math.max(5, target / 5);
  G.spawnAcc += dt * rate;
  let guard = 0;
  while (G.spawnAcc >= 1 && EN.count < target && guard++ < 40) {
    G.spawnAcc -= 1;
    const key = rosterPick();
    if (S.cave && key === 'xue' && World.tunnels) {
      const tn = World.tunnels[(rnd() * World.tunnels.length) | 0];
      if (len2(tn[0] - P.x, tn[1] - P.z) > 12) { spawnEnemy('xue', tn[0] + rnd.range(-2, 2), tn[1] + rnd.range(-2, 2), { burrow: true }); continue; }
    }
    offscreenPos(_sp, 30, 38, key === 'ti');
    spawnEnemy(key, _sp[0], _sp[1]);
  }
  if (G.spawnAcc > 3) G.spawnAcc = 3;
}
function runEvent(ev) {
  const S = G.stage;
  switch (ev.e) {
    case 'line': {
      const n = ev.n, z = Math.min(P.z + 30, 120), w = 44;
      for (let k = 0; k < n; k++) {
        let key = ev.kind || 'zu';
        if (ev.mix) for (const m in ev.mix) if (rnd() < ev.mix[m]) key = m;
        spawnEnemy(key, P.x - w / 2 + (k / Math.max(1, n - 1)) * w + rnd.range(-0.5, 0.5), z + rnd.range(-1.5, 1.5) + (k % 2) * 1.8);
      }
      if (!G.sim) { FX.toast('蛾傅！楚軍列陣壓上來了', 'warn'); AU.sfx('horn'); }
      break;
    }
    case 'ring': {
      const n = ev.n;
      for (let k = 0; k < n; k++) {
        const a = k / n * TAU, r = 24;
        const x = P.x + Math.cos(a) * r * 1.2, z = Math.max(WALL_Z + 2, P.z + Math.sin(a) * r);
        spawnEnemy(ev.kind || 'zu', x, z);
      }
      if (!G.sim) { FX.toast('合圍！', 'warn'); AU.sfx('horn'); }
      break;
    }
    case 'elite': {
      for (let k = 0; k < (ev.n || 1); k++) { offscreenPos(_sp, 32, 36); spawnEnemy('xiao', _sp[0], _sp[1]); }
      if (!G.sim) FX.toast('楚軍校尉出陣——擊倒他可得機關匣', 'elite');
      break;
    }
    case 'charge': {
      for (let k = 0; k < ev.n; k++) { const side = k % 2 ? 1 : -1; spawnEnemy('che', P.x + side * rnd.range(34, 42), Math.max(WALL_Z + 6, P.z + rnd.range(-12, 14))); }
      if (!G.sim) FX.toast('戰車衝陣！', 'warn');
      break;
    }
    case 'shaman': {
      for (let k = 0; k < ev.n; k++) {
        offscreenPos(_sp, 32, 38);
        spawnEnemy('wu', _sp[0], _sp[1]);
        for (let j = 0; j < 8; j++) spawnEnemy('zu', _sp[0] + rnd.range(-3, 3), _sp[1] + rnd.range(-3, 3));
      }
      if (!G.sim) FX.toast('楚巫擊鼓——附近的楚軍會加速回血', 'warn');
      break;
    }
    case 'burst': {
      const tn = World.tunnels || [[P.x, P.z + 20]];
      for (let k = 0; k < ev.n; k++) {
        const t = tn[k % tn.length];
        const x = t[0] + rnd.range(-3, 3), z = t[1] + rnd.range(-3, 3);
        if (len2(x - P.x, z - P.z) < 6) continue;
        spawnEnemy('xue', x, z, { burrow: true });
      }
      if (!G.sim) { FX.toast('穴卒破土！', 'warn'); FX.shake(0.3); AU.sfx('rumble'); }
      break;
    }
    case 'witness': startWitness(ev.id); break;
    case 'boss': startBoss(ev.id); break;
  }
}

// ---- stage lifecycle ------------------------------------------------------------------
function resetRunState() {
  enemyReset(); projReset(); pickupReset();
  ZONES.length = 0; EPS.length = 0; TGS.length = 0; fxClearAll();
  G.t = 0; G.t01 = 0; G.kills = 0; G.coinsRun = 0; G.dmgBy = {}; G.boss = null; G.bossDefeated = false; G.cleared = false; G.failed = false;
  G.eventIdx = 0; G.spawnAcc = 0; G.pendingLevels = 0; G.failReason = ''; G.pendingChests = 0; G.witness = null; G.ultActive = null; G.supportT = 0;
  G.hitStop = 0; G.slowMo = 0; G.wallFlash = 0; G.noSpawn = false; G.tiCd = 6; G.witLog = [];
}
function startStage(stageId, opts) {
  opts = opts || {};
  const S = STAGE_BY_ID[stageId];
  G.stage = S; G.dur = S.dur;
  G.replay = !!opts.replay;
  resetRunState();
  World.build(stageId, { crowd: S.final ? 1.5 : 1 });
  const W = SAVE.data.workshop;
  G.wallMax = 1000; G.wallHp = G.wallMax;
  G.rerolls = 1 + (W.reroll || 0); G.skips = 1 + (W.skip || 0); G.banishes = W.banish || 0; G.banished = new Set();
  G.ult = opts.ult || 0; G.ultKind = SAVE.data.ultKind && (ULTS[SAVE.data.ultKind].unlock == null || SAVE.data.cleared[ULTS[SAVE.data.ultKind].unlock]) ? SAVE.data.ultKind : 'sanbai';
  // restore build from snapshot
  const snap = opts.snapshot;
  P.weapons = []; P.passives = {};
  if (snap && snap.weapons && snap.weapons.length) {
    for (const w of snap.weapons) P.weapons.push(newWeapon(w.id, w.lv, w.evo));
    Object.assign(P.passives, snap.passives || {});
    P.level = snap.level || 1; P.xp = snap.xp || 0;
  } else {
    P.weapons.push(newWeapon('nu', 1));
    P.level = 1; P.xp = 0;
  }
  P.xpNext = xpFor(P.level);
  P.hp = 1; P.maxHp = 1;
  computeStats();
  P.hp = P.maxHp; P.dead = false; P.reviveUsed = false;
  P.x = 0; P.z = 12; P.vx = P.vz = 0; P.face = Math.PI; P.dashT = 0; P.dashCd = 0; P.dashCharges = P.dashMax; P.iframes = 1;
  if (S.cave) { R.shadowRadius = 40; } else R.shadowRadius = 46;
  AU.music(S.final ? 'battle2' : 'battle');
}
function snapshotBuild() {
  return { level: P.level, xp: P.xp, weapons: P.weapons.map(w => ({ id: w.id, lv: w.lv, evo: w.evo || null })), passives: Object.assign({}, P.passives) };
}

function updateStageTimer(dt) {
  if (G.cleared || G.failed) return;
  if (!G.boss) {
    G.t = Math.min(G.dur, G.t + dt);
  } else G.t += dt;
  G.t01 = clamp01(G.t / G.dur);
  World.setTime01(G.boss ? 1 : G.t01 * 0.97);
  // wall
  if (G.stage.wall) {
    if (G.ladderCount === 0) G.wallHp = Math.min(G.wallMax, G.wallHp + 5 * dt);
    G.wallFlash = Math.max(0, G.wallFlash - dt * 2);
    if (G.wallHp <= 0) { G.wallHp = 0; G.failed = true; G.failReason = '城破了'; onStageFail(); }
  }
}

  let lx = 0, lz = 0, ln = 0;
  if (G.stage && G.stage.wall && P.hp > P.maxHp * 0.4) {
    for (let i = 0; i < EN.hi; i++) if (EN.alive[i] === 1 && EN.state[i] === 1 && ENEMY_KEYS[EN.type[i]] === 'ti') { lx += EN.x[i]; lz += EN.z[i] + 3.5; ln++; }
    if (ln && goalW < 0.9) { goalX = lx / ln; goalZ = lz / ln; goalW = 0.7; }
  }
  if (G.boss && !G.boss.dying && goalW < 0.7) { goalX = G.boss.x; goalZ = G.boss.z + 9; goalW = 0.45; }
  // don't get cornered: drift back toward the middle of the field when near the edges
  const edge = Math.max(0, (Math.abs(P.x) - 44) / 30, (P.z - 68) / 25);
  if (edge > 0 && goalW < 0.9) { goalX = goalX * (1 - edge) ; goalZ = goalZ * (1 - edge) + 34 * edge; goalW = Math.max(goalW, 0.25 + edge * 0.6); }
  let gem = -1, gd = 1e9;
  for (let i = 0; i < PK.hi; i++) if (PK.alive[i]) { const d = len2(PK.x[i] - P.x, PK.z[i] - P.z); if (d < gd && d < 12) { gd = d; gem = i; } }
  for (let k = 0; k < 16; k++) {
    const a = k / 16 * TAU, dx = Math.sin(a), dz = Math.cos(a);
    let score = 0;
    for (let si = 0; si < 3; si++) {
      const step = [1.3, 2.8, 4.6][si];
      const x = P.x + dx * step, z = P.z + dz * step;
      const n = queryCircle(x, z, 3.0);
      let pen = 0;
      for (let q = 0; q < n; q++) { const i = QBUF[q]; const ex = EN.x[i] - x, ez = EN.z[i] - z; pen += (1 + EN.r[i]) / (ex * ex + ez * ez + 0.35); }
      score -= pen * (si === 0 ? 1.6 : si === 1 ? 1.0 : 0.6);
      if (x < ARENA.x0 + 2 || x > ARENA.x1 - 2 || z < WALL_Z + 2.5 || z > ARENA.z1 - 2) score -= 6;
      for (const T of TGS) {
        let inside = false;
        if (T.shape === 0) inside = len2(x - T.x, z - T.z) < T.r + 0.6;
        else if (T.shape === 1) { const ex = T.x + Math.sin(T.rot) * T.len, ez = T.z + Math.cos(T.rot) * T.len; inside = distPointSeg2(x, z, T.x, T.z, ex, ez) < (T.w / 2 + 0.6) ** 2; }
        else if (T.shape === 2) { const ddx = x - T.x, ddz = z - T.z, d = Math.hypot(ddx, ddz); inside = d < T.r && Math.abs(angDiff(Math.atan2(ddx, ddz), T.rot)) < T.half; }
        if (inside) score -= 4 * (si === 0 ? 1.5 : 1);
      }
      for (const Z of ZONES) if (Z.kind === 'enemyFire' && len2(x - Z.x, z - Z.z) < Z.r + 0.5) score -= 3;
      if (si < 2) for (let i = 0; i < EN.hi; i++) {
        if (EN.alive[i] !== 1 || EN.type[i] !== ENEMY_IDX.che || EN.state[i] < 1) continue;
        const cx = EN.x[i], cz = EN.z[i], ca = EN.fire[i];
        if (distPointSeg2(x, z, cx, cz, cx + Math.sin(ca) * 16, cz + Math.cos(ca) * 16) < 3.2 * 3.2) score -= 5;
      }
      if (si === 0) for (const e of EPS) {
        if (Math.abs(e.x - P.x) > 12 || Math.abs(e.z - P.z) > 12) continue;
        if (distPointSeg2(x, z, e.x, e.z, e.x + e.vx * 0.7, e.z + e.vz * 0.7) < 1.0) score -= 3.5;
      }
    }
    score += (dx * BOT.lx + dz * BOT.lz) * 0.35;
    const gx = goalX - P.x, gz = goalZ - P.z, gl = Math.hypot(gx, gz) || 1;
    score += (dx * gx + dz * gz) / gl * goalW;
    if (gem >= 0) { const ex = PK.x[gem] - P.x, ez = PK.z[gem] - P.z; score += (dx * ex + dz * ez) / (gd || 1) * 0.5; }
    if (score > best) { best = score; bx = dx; bz = dz; }
  }
  BOT.lx = damp(BOT.lx, bx, 10, dt); BOT.lz = damp(BOT.lz, bz, 10, dt);
  const l = Math.hypot(BOT.lx, BOT.lz) || 1;
  out[0] = BOT.lx / l; out[1] = BOT.lz / l;
  return true;
}
function botDash() {
  if (P.dashCharges <= 0) return false;
  const n = queryCircle(P.x, P.z, 1.6);
  if (n > 3 || (P.hp < P.maxHp * 0.4 && n > 1)) return true;
  // standing where something is about to land
  for (const T of TGS) {
    if (T.t / T.dur < 0.7 || T.hitPlayer === false) continue;
    let inside = false;
    if (T.shape === 0) inside = len2(P.x - T.x, P.z - T.z) < T.r + 0.3;
    else if (T.shape === 1) { const ex = T.x + Math.sin(T.rot) * T.len, ez = T.z + Math.cos(T.rot) * T.len; inside = distPointSeg2(P.x, P.z, T.x, T.z, ex, ez) < (T.w / 2 + 0.3) ** 2; }
    else if (T.shape === 2) { const dx = P.x - T.x, dz = P.z - T.z; inside = Math.hypot(dx, dz) < T.r && Math.abs(angDiff(Math.atan2(dx, dz), T.rot)) < T.half; }
    if (inside) return true;
  }
  return false;
}

}
function wstat(w) { return w.evo ? EVOS[w.evo].stats : WEAPONS[w.id].lv[w.lv - 1]; }
function wname(w) { return w.evo ? EVOS[w.evo].name : WEAPONS[w.id].name; }
function wseal(w) { return w.evo ? EVOS[w.evo].seal : WEAPONS[w.id].seal; }
function hasWeapon(id) { return P.weapons.find(w => w.id === id); }
function wcd(s) { return Math.max(0.12, s.cd * P.stats.cooldown); }

const _t2 = [0, 0];

function inkLine(x, z, a, L, W, dmg, wid, linger, lingerDps, markT) {

function kitesUpdate(w, s, dt, wid, evolved) {
  const n = (s.n || 1) + P.stats.amount;
  while (w.kites.length < n) w.kites.push({ x: P.x, y: 6, z: P.z, st: 0, t: rnd() * s.cd, tx: 0, tz: 0, a: w.kites.length * TAU / n });
  while (w.kites.length > n) w.kites.pop();
  w.ang += dt * 1.1;
  for (let k = 0; k < w.kites.length; k++) {
    const K = w.kites[k];
    if (K.st === 0) {                                // circling
      const a = w.ang + k * TAU / w.kites.length;
      K.x = damp(K.x, P.x + Math.sin(a) * 3.4, 4, dt); K.z = damp(K.z, P.z + Math.cos(a) * 3.4, 4, dt); K.y = damp(K.y, 6 + Math.sin(G.time * 2 + k), 3, dt);

      K.t -= dt;

        if (e >= 0) { K.st = 1; K.tx = EN.x[e]; K.tz = EN.z[e]; K.te = e; } else K.t = 0.3;
      }
    } else if (K.st === 1) {                         // diving
      if (K.te >= 0 && EN.alive[K.te] === 1) { K.tx = EN.x[K.te]; K.tz = EN.z[K.te]; }
      const dx = K.tx - K.x, dz = K.tz - K.z, dy = 0.6 - K.y, l = Math.hypot(dx, dy, dz) || 1;
      const sp = 24;
      K.x += dx / l * sp * dt; K.y += dy / l * sp * dt; K.z += dz / l * sp * dt;
      K.yaw = Math.atan2(dx, dz); K.pitch = 0.6;
      if (evolved && !G.sim && rnd() < 0.5) FXP.embers(K.x, K.y, K.z, 1, 0.3);
      if (l < 0.9) {
        const r = s.aoe * P.stats.area;

        if (evolved) addZone({ kind: 'fire', x: K.x, z: K.z, r: r * 0.6, dur: 1.6, dps: s.dmg * 0.12, wid });
        if (!G.sim) { FXP.fire(K.x, 0.4, K.z, 8, 1); FXP.sparks(K.x, 0.6, K.z, 8); FXP.flash(K.x, 0.6, K.z, r, [2.4, 1.4, 0.6], 0.12); chipEmit(K.x, 0.5, K.z, 3, COL.woodLt, 5, 0, 0.6); AU.sfx('kiteBoom'); }
        K.st = 2;

      if (K.y > 5.5) { K.st = 0; K.t = wcd(s) * (0.8 + rnd() * 0.4); K.pitch = 0; }
    }
  }
}

// ---- level-up options ----------------------------------------------------------
function weaponUnlocked(id) {
  const u = WEAPONS[id].unlock;
  return !u || SAVE.data.cleared[u];
}
function rollUpgrades() {
  const pool = [];
  const passCount = Object.keys(P.passives).length;
  for (const w of P.weapons) if (!w.evo && w.lv < 8 && !G.banished.has(w.id)) pool.push({ type: 'w', id: w.id, w: 10 });
  for (const id in P.passives) if (P.passives[id] < PASSIVES[id].max && !G.banished.has(id)) pool.push({ type: 'p', id, w: 8 });
  if (P.weapons.length < 6) for (const id in WEAPONS) if (weaponUnlocked(id) && !hasWeapon(id) && !G.banished.has(id) && !isEvolvedAway(id)) pool.push({ type: 'w', id, w: 7, isNew: true });
  if (passCount < 6) for (const id in PASSIVES) if (!(id in P.passives) && !G.banished.has(id)) pool.push({ type: 'p', id, w: 5.5, isNew: true });
  const n = rnd() < 0.08 + (P.stats.luck - 1) * 0.6 ? 4 : 3;
  const out = [];
  while (out.length < n && pool.length) {
    let sum = 0; for (const p of pool) sum += p.w;
    let x = rnd() * sum, idx = 0;
    for (; idx < pool.length; idx++) { x -= pool[idx].w; if (x <= 0) break; }
    out.push(pool.splice(Math.min(idx, pool.length - 1), 1)[0]);
  }
  if (!out.length) out.push({ type: 'coin' }, { type: 'heal' });
  return out;
}
function isEvolvedAway(id) {                         // 矩 consumed into 方圓
  return id === 'ju' && P.weapons.some(w => w.evo === 'fangyuan');
}
function applyUpgrade(o) {
  if (o.type === 'w') {
    const w = hasWeapon(o.id);
    if (w) w.lv = Math.min(8, w.lv + 1); else P.weapons.push(newWeapon(o.id, 1));
    SAVE.seeWeapon(o.id);
  } else if (o.type === 'p') {
    P.passives[o.id] = (P.passives[o.id] || 0) + 1;
    computeStats();
  } else if (o.type === 'coin') { G.coinsRun += 25; }
  else if (o.type === 'heal') { P.hp = Math.min(P.maxHp, P.hp + 30); }
}
function upgradeInfo(o) {
  if (o.type === 'w') {
    const d = WEAPONS[o.id], w = hasWeapon(o.id), lv = w ? w.lv + 1 : 1;
    return { seal: d.seal, name: d.name, kind: '機關', lv, isNew: !w, text: w ? d.lv[lv - 1].up : d.desc, max: 8, evoHint: w && lv === 8 ? evoHint(o.id) : '' };
  }
  if (o.type === 'p') {
    const d = PASSIVES[o.id], lv = (P.passives[o.id] || 0) + 1;
    return { seal: d.seal, name: d.name, kind: '心法', lv, isNew: lv === 1, text: d.desc, sub: d.lore, max: d.max };
  }
  if (o.type === 'coin') return { seal: '錢', name: '蟻鼻錢', kind: '', lv: 0, text: '拾得 25 枚蟻鼻錢。', max: 0 };
  return { seal: '餅', name: '烙餅', kind: '', lv: 0, text: '回復 30 點生命。', max: 0 };
}
function evoHint(id) {
  const e = WEAPONS[id].evo;
  if (!e) return '';
  if (e.union) return '滿級後，與「' + WEAPONS[e.need].name + '」滿級合一，可進化為「' + EVOS[e.into].name + '」';
  return '滿級後，持有「' + PASSIVES[e.need].name + '」並開啟機關匣，可進化為「' + EVOS[e.into].name + '」';
}
// chest: evolution first, else 1/3/5 upgrades of owned items
function availableEvolution() {
  for (const w of P.weapons) {
    if (w.evo || w.lv < 8) continue;
    const e = WEAPONS[w.id].evo;
    if (!e) continue;
    if (e.union) { const o = hasWeapon(e.need); if (o && !o.evo && o.lv >= 8) return { w, into: e.into, union: o }; }
    else if (P.passives[e.need]) return { w, into: e.into };
  }
  return null;
}
function rollChest() {
  const ev = availableEvolution();
  if (ev) return { evo: ev, items: [] };
  const roll = rnd();
  const n = roll < 0.07 * P.stats.luck ? 5 : roll < 0.3 * P.stats.luck ? 3 : 1;
  const items = [];
  for (let k = 0; k < n; k++) {
    const pool = [];
    for (const w of P.weapons) if (!w.evo && w.lv < 8) pool.push({ type: 'w', id: w.id });
    for (const id in P.passives) if (P.passives[id] < PASSIVES[id].max) pool.push({ type: 'p', id });
    if (!pool.length) { const c = { type: 'coin' }; c.info = upgradeInfo(c); applyUpgrade(c); items.push(c); continue; }
    const o = rnd.pick(pool);
    o.info = upgradeInfo(o);
    applyUpgrade(o);
    items.push(o);
  }
  return { evo: null, items };
}
function applyEvolution(ev) {
  ev.w.evo = ev.into;
  ev.w.t = 0.2; ev.w.turrets = []; ev.w.kites = []; ev.w.swings = [];
  if (ev.union) P.weapons.splice(P.weapons.indexOf(ev.union), 1);
  SAVE.seeWeapon(ev.into);
}

// ---- helpers ------------------------------------------------------------------------
function bossProxy(b, r, isMain) {
  const i = EFREE.pop();
  EN.alive[i] = 1; EN.type[i] = BOSS_TYPE; EN.x[i] = b.x; EN.z[i] = b.z; EN.y[i] = 0; EN.r[i] = r; EN.mass[i] = 999;
  EN.hp[i] = isMain ? b.maxHp : 1e9; EN.maxHp[i] = EN.hp[i]; EN.link[i] = isMain ? -1 : b.main;
  EN.flash[i] = 0; EN.elite[i] = 0; EN.vuln[i] = 0; EN.mark[i] = 0; EN.dx[i] = EN.dz[i] = EN.kx[i] = EN.kz[i] = 0; EN.scale[i] = 1;
  EN.dis[i] = 0; EN.state[i] = 0; EN.burn[i] = 0; EN.smoke[i] = 0; EN.buff[i] = 0;
  for (let w = 0; w < NW; w++) EHC[i * NW + w] = 0;
  EN.count++; if (i >= EN.hi) EN.hi = i + 1;
  return i;
}
function hideProxy(i) { EN.x[i] = -9999; EN.z[i] = -9999; }
function bossHpFrac(b) { return Math.max(0, EN.hp[b.main]) / b.maxHp; }
function bossContact(b, x, z, r, dmg) {
  if (b.contactCd > 0) return;
  if (len2(P.x - x, P.z - z) < r + P.r) { damagePlayer(dmg * b.dmgK, x, z, 'boss'); b.contactCd = 0.9; }
}
function bossArrowRain(b, n, spread, dmg) {
  for (let k = 0; k < n; k++) {
    const x = P.x + P.vx * 0.6 + rnd.range(-spread, spread), z = P.z + P.vz * 0.6 + rnd.range(-spread, spread);
    telegraph({ shape: 0, x, z, r: 1.7, dur: 1.15, dmg: dmg * b.dmgK, sound: k === 0, onFire: T => { if (!G.sim) { for (let a = 0; a < 3; a++) spawnEP({ kind: 'arrow', x: T.x + rnd.range(-1, 1), z: T.z + rnd.range(-1, 1) - 0.5, y: 3, vx: 0, vz: 1, vy: -20, g: 0, life: 0.2, dmg: 0, r: 0.01 }); FXP.dust(T.x, T.z, 3, 0.5); } } });
  }
}
function radialBurst(x, z, n, speed, dmg, kind, r, phase) {
  for (let k = 0; k < n; k++) {
    const a = (phase || 0) + k * TAU / n;
    spawnEP({ kind: kind || 'feather', x, z, y: 1.2, vx: Math.sin(a) * speed, vz: Math.cos(a) * speed, life: 3.2, dmg, r: r || 0.45 });
  }
}

// ---- lifecycle ----------------------------------------------------------------------
function startBoss(id) {
  const def = BOSSES[id];
  const b = {
    id, def, t: 0, st: 0, state: 'enter', x: 0, z: 60, yaw: Math.PI, maxHp: def.hp * DIFFICULTY[G.diff].hp,
    dmgK: DIFFICULTY[G.diff].dmg * (G.stage ? G.stage.dmgMul : 1), contactCd: 0, timers: {}, proxies: [], flash: 0, dying: false, deathT: 0,
    rig: null, anim: {},
  };
  G.boss = b;
  BOSS_IMPL[id].init(b);
  b.main = bossProxy(b, b.mainR || 3, true);
  for (const r of (b.partR || [])) b.proxies.push(bossProxy(b, r, false));
  if (!G.sim) {
    FX.bossIntro(def.name, def.sub);
    AU.music('boss'); AU.sfx('bossHorn');
    UI.say(STORY[G.stage.id + '_boss']);
    World.cheer(0.3);
  }
}
function updateBoss(dt) {
  const b = G.boss;
  if (!b) return;
  b.t += dt; b.st += dt; b.contactCd -= dt;
  // hit flash: a brief blink at most ~4x a second, so a boss under constant fire stays readable
  const hitNow = EN.flash[b.main] >= 0.999;
  EN.flash[b.main] = Math.max(0, EN.flash[b.main] - dt * 7);
  b.flashCd = (b.flashCd || 0) - dt;
  if (hitNow && b.flashCd <= 0) { b.flashV = 1; b.flashCd = 0.24; }
  b.flashV = Math.max(0, (b.flashV || 0) - dt * 9);
  b.flash = b.flashV * 0.45;
  EN.mark[b.main] -= dt; EN.smoke[b.main] -= dt;                 // status effects wear off bosses too
  if (EN.smoke[b.main] <= 0 && b.mode !== 'perch') EN.vuln[b.main] = 0;
  for (const k in b.timers) b.timers[k] -= dt;
  if (b.dying) {
    b.deathT += dt;
    BOSS_IMPL[b.id].die && BOSS_IMPL[b.id].die(b, dt);
    if (b.deathT > 2.8 && !b.done) { b.done = true; onBossDefeated(); }
    return;
  }
  if (EN.hp[b.main] <= 0) {
    b.dying = true; b.deathT = 0;
    EN.alive[b.main] = 2; EN.dis[b.main] = 0.001;
    for (const i of b.proxies) { EN.alive[i] = 2; EN.dis[i] = 0.001; }
    G.slowMo = 1.6; G.slowFactor = 0.25;
    G.bossDefeated = true; G.noSpawn = true;
    if (!G.sim) { FX.shake(1); AU.sfx('bossDie'); World.cheer(1); R.post.flash = [2, 1.6, 1.2, 0.6]; }
    // rout every soldier on the field
    for (let i = 0; i < EN.hi; i++) if (EN.alive[i] === 1 && EN.type[i] !== BOSS_TYPE) { EN.alive[i] = 2; EN.dis[i] = 0.001; dropGem(EN.x[i], EN.z[i], EN.xp[i]); }
    magnetAll();
    dropPickup(b.x, b.z, 6, 0); dropPickup(b.x + 1.5, b.z, 6, 0);
    for (let k = 0; k < 12; k++) dropPickup(b.x + rnd.range(-3, 3), b.z + rnd.range(-3, 3), 3, 20);
    return;
  }
  BOSS_IMPL[b.id].update(b, dt);
}
function drawBoss() {
  const b = G.boss;
  if (!b) return;
  BOSS_IMPL[b.id].draw(b);
}

  // ============ 三攻 鉤拒: war ship circling the flood

  // ============ 四攻 地龍: burrowing segmented drill

        const sp = d > 7 ? 1.9 + (ph - 6) * 0.25 : 0;
        b.x += Math.sin(b.yaw) * sp * dt; b.z += Math.cos(b.yaw) * sp * dt; b.step += sp * dt * 0.9;
        p.armL = damp(p.armL, 0, 4, dt); p.armR = damp(p.armR, 0, 4, dt); p.lean = damp(p.lean, 0, 4, dt);
        if (T.atk <= 0) this.attack(b, ph);
      } else if (b.mode === 'attack') {
        b.atkT -= dt;
        if (b.atkAnim) b.atkAnim(b, dt);
        if (b.atkT <= 0) { b.mode = 'walk'; T.atk = Math.max(1.2, 3.0 - (ph - 6) * 0.4); b.atkAnim = null; }
      } else if (b.mode === 'nineWalk') {
        const dx = 0 - b.x, dz = WALL_Z + 9 - b.z, l = Math.hypot(dx, dz);
        b.yaw = dampAngle(b.yaw, Math.atan2(dx, dz), 2, dt);
        if (l > 0.5) { b.x += dx / l * 3.2 * dt; b.z += dz / l * 3.2 * dt; b.step += 3 * dt; }
        else { b.mode = 'nine'; b.channel = 0; b.nineHp = EN.hp[b.main]; b.yaw = Math.PI; if (!G.sim) { FX.toast('打斷它！在它砸向城頭之前造成足夠傷害', 'bad'); AU.sfx('bossHorn'); } }
      } else if (b.mode === 'nine') {
        b.channel += dt / 9;
        p.armL = damp(p.armL, -2.6, 2, dt); p.armR = damp(p.armR, -2.6, 2, dt); p.lean = damp(p.lean, -0.25, 2, dt);
        G.nineBar = { p: b.channel, need: clamp01((b.nineHp - EN.hp[b.main]) / (b.maxHp * 0.1)) };
        if (!G.sim && rnd() < 0.5) FXP.embers(b.x, 12, b.z, 2, 4);
        if (EN.hp[b.main] <= b.nineHp - b.maxHp * 0.1) {

          if (!G.sim) { FX.banner('九距', '第九攻被擋下了！', 1.8); FX.shake(0.8); World.cheer(1); AU.sfx('bossDie'); }
        } else if (b.channel >= 1) {
          b.channel = 0; b.nineHp = EN.hp[b.main];
          G.wallHp -= G.wallMax * 0.4; G.wallFlash = 1;
          if (!G.sim) { FX.shake(1); AU.sfx('slam'); chipEmit(b.x, 8, WALL_Z, 40, COL.earth, 10, 1, 1.5); FXP.dust(b.x, WALL_Z + 2, 30, 2.5); FX.toast('城牆被重擊！', 'bad'); }
        }
      } else if (b.mode === 'stagger') {
        p.armL = damp(p.armL, 0.4, 3, dt); p.armR = damp(p.armR, 0.4, 3, dt); p.lean = damp(p.lean, 0.5, 3, dt);
        if (b.st > 3.5) { b.mode = 'walk'; T.atk = 1.2; }
      }
      // proxies: body + feet
      EN.x[b.main] = b.x; EN.z[b.main] = b.z;
      const cx = Math.cos(b.yaw), sx = Math.sin(b.yaw);
      EN.x[b.proxies[0]] = b.x + cx * 1.3; EN.z[b.proxies[0]] = b.z - sx * 1.3;
      EN.x[b.proxies[1]] = b.x - cx * 1.3; EN.z[b.proxies[1]] = b.z + sx * 1.3;
      bossContact(b, b.x, b.z, 3.2, 24);
      R.addLight(b.x + sx * 2, 9, b.z + Math.cos(b.yaw) * 2, 16, [2.6, 1.3, 0.5], 1.5);
      if (b.mode === 'walk' && Math.floor(b.step / Math.PI) !== b.lastStep) { b.lastStep = Math.floor(b.step / Math.PI); if (!G.sim) { FX.shake(0.12); AU.sfx('stomp'); FXP.dust(b.x, b.z, 3, 1.4); } }
    },
    attack(b, ph) {
      const opts = ['ram', 'slam', 'sweep'];
      if (ph >= 7) opts.push('hook', 'quake');
      if (ph >= 8) opts.push('fire', 'feathers');
      const kind = rnd.pick(opts);
      const a = Math.atan2(P.x - b.x, P.z - b.z);

        b.atkAnim = (b, dt) => { p.lean = damp(p.lean, 0.45, 5, dt); b.yaw = dampAngle(b.yaw, a, 6, dt); if (b.dashT > 0) { b.dashT -= dt; b.x += Math.sin(b.dashA) * 24 * dt; b.z += Math.cos(b.dashA) * 24 * dt; b.step += 8 * dt; b.x = clamp(b.x, -76, 76); b.z = clamp(b.z, WALL_Z + 6, 94); bossContact(b, b.x, b.z, 3.6, 34); } };
      } else if (kind === 'slam') {

        b.atkAnim = (b, dt) => { b.yaw = dampAngle(b.yaw, Math.atan2(tx - b.x, tz - b.z), 5, dt); const k = b.atkT > 0.8 ? -2.8 : 0.3; p.armR = damp(p.armR, k, 6, dt); };
      } else if (kind === 'sweep') {
        b.atkT = 2.0;
        telegraph({ shape: 1, x: b.x + Math.sin(a) * 2, z: b.z + Math.cos(a) * 2, rot: a, len: 17, w: 3.2, dur: 1.2, dmg: 32 * b.dmgK, onFire: () => { if (!G.sim) { FX.shake(0.45); AU.sfx('slam'); } } });
        b.atkAnim = (b, dt) => { b.yaw = dampAngle(b.yaw, a, 6, dt); p.armL = damp(p.armL, b.atkT > 0.8 ? -2.2 : -1.3, 6, dt); };
      } else if (kind === 'hook') {
        b.atkT = 1.8;
        const bx = b.x, bz = b.z;
        telegraph({ shape: 1, x: bx, z: bz, rot: a, len: 20, w: 1.8, dur: 1.0, onFire: () => {
          if (distPointSeg2(P.x, P.z, bx, bz, bx + Math.sin(a) * 20, bz + Math.cos(a) * 20) < 1.4 * 1.4 && P.iframes <= 0) {
            damagePlayer(22 * b.dmgK, bx, bz, 'hook');
            const dx = b.x - P.x, dz = b.z - P.z, l = Math.hypot(dx, dz) || 1;
            P.vx = dx / l * 24; P.vz = dz / l * 24;
          }
          if (!G.sim) AU.sfx('hook');
        } });
        b.atkAnim = (b, dt) => { b.yaw = dampAngle(b.yaw, a, 6, dt); p.armL = damp(p.armL, -1.5, 6, dt); };
      } else if (kind === 'quake') {
        b.atkT = 2.6;
        for (let ray = 0; ray < 3; ray++) {
          const ra = a + (ray - 1) * 0.5;
          for (let k = 1; k <= 6; k++) {
            const x = b.x + Math.sin(ra) * k * 3.2, z = b.z + Math.cos(ra) * k * 3.2;
            telegraph({ shape: 0, x, z, r: 1.7, dur: 0.8 + k * 0.14, dmg: 20 * b.dmgK, sound: ray === 0 && k === 1, onFire: T2 => { if (!G.sim) { FXP.dust(T2.x, T2.z, 4, 1); chipEmit(T2.x, 0.5, T2.z, 3, '#5a4a36', 6, 1, 0.8); } } });
          }
        }
        b.atkAnim = (b, dt) => { p.lean = damp(p.lean, b.atkT > 1.8 ? -0.3 : 0.3, 6, dt); };
        setTimeout0(0.75, () => { if (!G.sim && G.boss === b) { FX.shake(0.5); AU.sfx('stomp'); } });
      } else if (kind === 'fire') {
        b.atkT = 2.5;
        const half = 0.5;
        telegraph({ shape: 2, x: b.x, z: b.z, rot: a, r: 15, half, dur: 1.2, dmg: 28 * b.dmgK, onFire: () => {
          for (let k = 0; k < 9; k++) { const aa = a + rnd.range(-half, half), d = rnd.range(4, 14); addZone({ kind: 'enemyFire', x: b.x + Math.sin(aa) * d, z: b.z + Math.cos(aa) * d, r: 1.8, dur: 3, dps: 10 * b.dmgK }); }
          if (!G.sim) { AU.sfx('fireBreath'); for (let k = 0; k < 40; k++) { const aa = a + rnd.range(-half, half), sp = rnd.range(8, 22); pEmit(b.x, 9, b.z, Math.sin(aa) * sp, -4, Math.cos(aa) * sp, 0.8, 0.8, 0.3, PC.fire0, PC.fire1, 1, 0, 8, true, 2, 0.5); } }
        } });
        b.atkAnim = (b, dt) => { b.yaw = dampAngle(b.yaw, a, 6, dt); p.lean = damp(p.lean, 0.25, 5, dt); };
      } else if (kind === 'feathers') {
        b.atkT = 1.6;
        radialBurst(b.x, b.z, 24, 11, 13 * b.dmgK, 'feather', 0.45, b.t);
        setTimeout0(0.45, () => { if (G.boss === b && !b.dying) radialBurst(b.x, b.z, 24, 11, 13 * b.dmgK, 'feather', 0.45, b.t + 0.13); });
        if (!G.sim) AU.sfx('feathers');
        b.atkAnim = (b, dt) => { p.armL = damp(p.armL, -1.0, 6, dt); p.armR = damp(p.armR, -1.0, 6, dt); };
      }
    },
    die(b, dt) {
      if (!b.exploded) { b.exploded = true; if (!G.sim) { chipEmit(b.x, 8, b.z, 80, COL.woodDk, 14, 0, 1.8); chipEmit(b.x, 8, b.z, 40, COL.bronze, 12, 2, 1.2); FXP.fire(b.x, 6, b.z, 60, 3); FXP.dust(b.x, b.z, 50, 3); } }
      b.pose.lean = damp(b.pose.lean, 1.2, 1.2, dt);
    },
    draw(b) {
      const r = b.rig; r.reset();
      const p = b.pose, st = Math.sin(b.step);
      r.get('legL').pitch = st * 0.4; r.get('legR').pitch = -st * 0.4;
      r.get('pelvis').py = 6.2 + Math.abs(Math.cos(b.step)) * 0.25 - (b.mode === 'stagger' ? 1.4 : 0) - (b.dying ? b.deathT * 1.5 : 0);
      r.get('torso').pitch = p.lean;
      r.get('armL').pitch = p.armL - st * 0.25; r.get('armR').pitch = p.armR + st * 0.25;
      r.get('head').yaw = Math.sin(b.t * 0.7) * 0.2;
      const pilot = r.get('pilot'); pilot.visible = !b.dying || b.deathT < 1.2;
      drawRigFx(r, bossRoot(b, 0, 0, b.dying ? b.deathT * 0.2 : 0, 1.0), b);
      decal(b.x, b.z, b.yaw, 4.5, 4.5, 10, 0, 0, 0, 0, 0.55);
    },
  },
};

// tiny timer utility used by boss patterns (runs in game time)
const TIMERS = [];
function setTimeout0(delay, fn) { TIMERS.push({ t: delay, fn }); }
function updateTimers(dt) {
  for (let i = TIMERS.length - 1; i >= 0; i--) { TIMERS[i].t -= dt; if (TIMERS[i].t <= 0) { const f = TIMERS[i].fn; TIMERS.splice(i, 1); f(); } }
}

// ---------------------------------------------------------------------------
// 15_fx.js — damage numbers, speech bubbles and off-screen markers on a 2D
// overlay canvas; screen shake; hit-stop; banners and toasts (DOM)
// ---------------------------------------------------------------------------
const FX = {
  cv: null, ctx: null, nums: [], bubbles: [], trauma: 0, shakeX: 0, shakeZ: 0, shakeY: 0, dpr: 1,
  init() {
    this.cv = document.getElementById('fx2d');
    this.ctx = this.cv.getContext('2d');
  },
  resize(w, h, dpr) {
    this.dpr = Math.min(2, dpr || 1);
    this.cv.width = Math.round(w * this.dpr); this.cv.height = Math.round(h * this.dpr);
    this.w = w; this.h = h;
  },
  num(x, y, z, v, crit, boss, player, heal) {
    if (!SAVE.data.settings.dmgNums && !player && !heal) return;
    if (this.nums.length > 200) this.nums.shift();
    this.nums.push({ x: x + rnd.range(-0.3, 0.3), y, z: z + rnd.range(-0.3, 0.3), v: Math.round(v), crit, boss, player, heal, t: 0, life: crit || player ? 0.9 : 0.6, dx: rnd.range(-14, 14) });
  },
  bubble(obj, text) { this.bubbles.push({ obj, text, t: 0, life: 2.2 }); },
  shake(a) { this.trauma = Math.min(1, this.trauma + a * (SAVE.data.settings.shake == null ? 1 : SAVE.data.settings.shake)); },
  update(dt) {
    this.trauma = Math.max(0, this.trauma - dt * 1.5);
    const s = this.trauma * this.trauma;
    const t = performance.now() * 0.001;
    this.shakeX = (vnoise(t * 25, 1.3) - 0.5) * 2 * s * 1.6;
    this.shakeZ = (vnoise(t * 25, 7.1) - 0.5) * 2 * s * 1.6;
    this.shakeY = (vnoise(t * 25, 13.7) - 0.5) * 2 * s * 0.8;
    for (let i = this.nums.length - 1; i >= 0; i--) { const n = this.nums[i]; n.t += dt; if (n.t >= n.life) this.nums.splice(i, 1); }
    for (let i = this.bubbles.length - 1; i >= 0; i--) { const b = this.bubbles[i]; b.t += dt; if (b.t >= b.life) this.bubbles.splice(i, 1); }
    // decay post flash
    const f = R.post.flash;
    f[3] = Math.max(0, f[3] - dt * 1.6);
    if (f[3] <= 0) { f[0] = 0.8; f[1] = 0.05; f[2] = 0.02; }
  },
  draw() {
    const c = this.ctx, d = this.dpr;
    c.setTransform(d, 0, 0, d, 0, 0);
    c.clearRect(0, 0, this.w, this.h);
    if (G.mode !== 'play' && G.mode !== 'levelup' && G.mode !== 'chest' && G.mode !== 'pause' && G.mode !== 'talk') return;
    const p = [0, 0];
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineJoin = 'round';
    for (const n of this.nums) {
      if (!R.project(n.x, n.y + n.t * 1.4, n.z, p)) continue;
      const k = n.t / n.life;
      const pop = n.t < 0.08 ? 1 + (1 - n.t / 0.08) * 0.6 : 1;
      let size = n.crit ? 24 : n.boss ? 17 : 14;
      if (n.player) size = 20;
      if (n.heal) size = 18;
      size *= pop * (UI.scale || 1);
      c.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
      c.font = `900 ${size}px 'Noto Serif TC','Noto Serif CJK TC',serif`;
      const txt = n.heal ? '+' + n.v : n.player ? '-' + n.v : String(n.v);
      const x = p[0] + n.dx * k, y = p[1] - 10 * k;
      c.lineWidth = n.crit ? 5 : 3.5;
      c.strokeStyle = 'rgba(12,8,6,0.9)';
      c.strokeText(txt, x, y);
      c.fillStyle = n.heal ? '#8ff0c0' : n.player ? '#ff5a3c' : n.crit ? '#ffcf5a' : n.boss ? '#ffe6c8' : '#f4ecdc';
      c.fillText(txt, x, y);
      if (n.crit) { c.font = `700 ${size * 0.45}px 'Noto Serif TC',serif`; c.fillStyle = '#ff7a3a'; c.fillText('暴', x - size * 0.9, y - size * 0.35); }
    }
    c.globalAlpha = 1;
    // speech bubbles
    for (const b of this.bubbles) {
      const o = b.obj;
      if (!R.project(o.x, 2.6, o.z, p)) continue;
      const a = b.t < 0.15 ? b.t / 0.15 : b.t > b.life - 0.3 ? (b.life - b.t) / 0.3 : 1;
      c.globalAlpha = a;
      c.font = `700 ${15 * (UI.scale || 1)}px 'LXGW WenKai TC','Noto Serif CJK TC',serif`;
      const w = c.measureText(b.text).width + 18;
      c.fillStyle = 'rgba(232,217,178,0.95)';
      roundRect(c, p[0] - w / 2, p[1] - 34, w, 26, 6); c.fill();
      c.fillStyle = '#1c1611'; c.fillText(b.text, p[0], p[1] - 21);
    }
    c.globalAlpha = 1;
    if (G.mode === 'play') this.drawIndicators(c);
  },
  drawIndicators(c) {
    const p = [0, 0], W = this.w, H = this.h, m = 46;
    const mark = (x, z, label, col, sub) => {
      const on = R.project(x, 1.5, z, p);
      const inside = on && p[0] > m && p[0] < W - m && p[1] > m && p[1] < H - m;
      if (inside) return;
      let dx = p[0] - W / 2, dy = p[1] - H / 2;
      if (!on) { dx = -dx; dy = -dy; }
      const a = Math.atan2(dy, dx);
      const sx = (W / 2 - m) / Math.max(1e-3, Math.abs(Math.cos(a))), sy = (H / 2 - m) / Math.max(1e-3, Math.abs(Math.sin(a)));
      const r = Math.min(sx, sy);
      const ix = W / 2 + Math.cos(a) * r, iy = H / 2 + Math.sin(a) * r;
      const s = UI.scale || 1;
      c.save(); c.translate(ix, iy);
      c.rotate(a);
      c.fillStyle = col; c.beginPath(); c.moveTo(22 * s, 0); c.lineTo(8 * s, -9 * s); c.lineTo(8 * s, 9 * s); c.closePath(); c.fill();
      c.restore();
      c.fillStyle = col; c.beginPath(); c.arc(ix, iy, 15 * s, 0, TAU); c.fill();
      c.fillStyle = '#1c1611'; c.font = `900 ${15 * s}px 'Noto Serif TC',serif`; c.fillText(label, ix, iy + 1);
      if (sub) { c.font = `700 ${12 * s}px 'LXGW WenKai TC',serif`; c.fillStyle = col; c.fillText(sub, ix - Math.cos(a) * 30 * s, iy - Math.sin(a) * 26 * s); }
    };
    const Wt = G.witness;
    if (Wt && (Wt.state === 'wait' || Wt.state === 'follow')) {
      mark(Wt.x, Wt.z, '救', '#f2c35a', WITNESS[Wt.id].name + ' ' + Math.round(len2(Wt.x - P.x, Wt.z - P.z)) + '步');
      if (Wt.state === 'follow') mark(GATE_POS[0], GATE_POS[1], '門', '#f2c35a', '');
    }
    if (G.boss && !G.boss.dying) mark(G.boss.x, G.boss.z, '攻', '#ff5a3c', '');
    let ladders = 0;
    for (let i = 0; i < EN.hi && ladders < 5; i++) {
      if (EN.alive[i] === 1 && EN.state[i] === 1 && ENEMY_KEYS[EN.type[i]] === 'ti') { mark(EN.x[i], EN.z[i] + 1, '梯', '#ff7a4a', ''); ladders++; }
    }
    for (let i = 0; i < PK.hi; i++) if (PK.alive[i] && PK.kind[i] === 6) mark(PK.x[i], PK.z[i], '匣', '#6fe0c8', '');
  },
  // DOM overlays
  banner(title, sub, dur, cls) { UI.banner(title, sub, dur, cls); },
  toast(msg, kind) { UI.toast(msg, kind); },
  bossIntro(name, sub) { UI.bossIntro(name, sub); },
};
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

      <div id="bottom">
