    $('#pausebtn').addEventListener('click', () => { if (G.mode === 'play') openPause(); });
    this.el = {};
    for (const id of ['xpfill', 'lvnum', 'wslots', 'pslots', 'daybox', 'dayname', 'timefill', 'timesun', 'timetxt', 'bossbar', 'bossname', 'bosssub', 'bossfill', 'bosslag', 'ninebar', 'ninech', 'nineneed', 'kills', 'coins', 'wallbox', 'wallfill', 'objective', 'objtxt', 'hpfill', 'hplag', 'hptxt', 'dash', 'ult', 'ultfill', 'ultseal', 'ultkey']) this.el[id] = $('#' + id);
    this.el.objhp = $('#objhp span');
  },
  hud(on) {
    this.hudOn = on;
    this.hudEl.hidden = !on;
    $('#touch').hidden = !(on && (IN.device === 'touch' || ('ontouchstart' in window && window.innerWidth < 900)));
    this.last = {};
  },
  _set(key, el, prop, val) { if (this.last[key] !== val) { this.last[key] = val; el[prop] = val; } },
  _style(key, el, prop, val) { if (this.last[key] !== val) { this.last[key] = val; el.style[prop] = val; } },
  updateHud() {
    if (!this.hudOn) return;
    const E = this.el;
    this._style('xp', E.xpfill, 'width', (P.xp / P.xpNext * 100).toFixed(1) + '%');
    this._set('lv', E.lvnum, 'textContent', String(P.level));
    // build slots
    const sig = P.weapons.map(w => (w.evo || w.id) + w.lv).join() + '|' + Object.entries(P.passives).map(e => e.join('')).join();
    if (this.last.sig !== sig) {
      this.last.sig = sig;
      let w = '', p = '';
      for (let i = 0; i < 6; i++) {
        const x = P.weapons[i];
        w += x ? `<div class="slot w${x.evo ? ' evo' : ''}" title="${esc(wname(x))}">${esc(wseal(x))}<span class="lv">${x.evo ? '極' : x.lv}</span></div>` : '<div class="slot empty">·</div>';
      }
      const ps = Object.keys(P.passives);
      for (let i = 0; i < 6; i++) {
        const id = ps[i];
        p += id ? `<div class="slot p" title="${esc(PASSIVES[id].name)}">${esc(PASSIVES[id].seal)}<span class="lv">${P.passives[id]}</span></div>` : '<div class="slot p empty">·</div>';
      }
      E.wslots.innerHTML = w; E.pslots.innerHTML = p;
    }
    // day / boss
    const S = G.stage;
    const boss = G.boss && !G.boss.dying;
    if (this.last.bossOn !== !!boss) { this.last.bossOn = !!boss; E.bossbar.hidden = !boss; E.daybox.hidden = !!boss; }
    if (boss) {
      const b = G.boss;
      this._set('bn', E.bossname, 'textContent', b.def.name);
      this._set('bs', E.bosssub, 'textContent', b.def.sub);
      const f = (bossHpFrac(b) * 100).toFixed(2) + '%';
      this._style('bf', E.bossfill, 'width', f); this._style('bl', E.bosslag, 'width', f);
    } else if (S) {
      this._set('dn', E.dayname, 'textContent', S.day + '　' + S.title);
      this._style('tf', E.timefill, 'width', (G.t01 * 100).toFixed(1) + '%');
      this._style('ts', E.timesun, 'left', (G.t01 * 100).toFixed(1) + '%');
      const rem = Math.max(0, G.dur - G.t);
      this._set('tt', E.timetxt, 'innerHTML', rem > 0 ? `<small>${S.night ? '距天亮' : '距日落'}</small>${fmtTime(rem)}` : '<small>最後一波</small>決戰');
    }
    const nb = G.nineBar;
    if (this.last.nine !== !!nb) { this.last.nine = !!nb; E.ninebar.hidden = !nb; }
    if (nb) { this._style('nc', E.ninech, 'width', (nb.p * 100).toFixed(1) + '%'); this._style('nn', E.nineneed, 'width', (nb.need * 100).toFixed(1) + '%'); }
    this._set('k', E.kills, 'textContent', fmtNum(G.kills));
    this._set('c', E.coins, 'textContent', fmtNum(G.coinsRun));
    // wall
    const wallOn = S && S.wall;
    if (this.last.wallOn !== wallOn) { this.last.wallOn = wallOn; E.wallbox.hidden = !wallOn; }
    if (wallOn) {
      this._style('wf', E.wallfill, 'height', (G.wallHp / G.wallMax * 100).toFixed(1) + '%');
      const hit = G.wallFlash > 0.05;
      if (this.last.wh !== hit) { this.last.wh = hit; E.wallbox.classList.toggle('hit', hit); }
    }
    // hp
    const hpf = (Math.max(0, P.hp) / P.maxHp * 100).toFixed(1) + '%';
    this._style('hp', E.hpfill, 'width', hpf); this._style('hpl', E.hplag, 'width', hpf);
    this._set('hpt', E.hptxt, 'textContent', Math.ceil(Math.max(0, P.hp)) + ' / ' + P.maxHp);
    const dsig = P.dashMax + ':' + P.dashCharges;
    if (this.last.dash !== dsig) { this.last.dash = dsig; let h = '<span>墨步</span>'; for (let i = 0; i < P.dashMax; i++) h += `<i class="${i < P.dashCharges ? 'on' : ''}"></i>`; E.dash.innerHTML = h + '<span class="key">空白</span>'; }
    this._style('ul', E.ultfill, 'height', G.ult.toFixed(0) + '%');
    const ready = G.ult >= 100 && !G.ultActive;
    if (this.last.ur !== ready) { this.last.ur = ready; E.ult.classList.toggle('ready', ready); }
    this._set('us', E.ultseal, 'textContent', ULTS[G.ultKind].seal);
    this._set('uk', E.ultkey, 'textContent', IN.device === 'pad' ? 'X' : 'Q');
    // witness objective
    const W = G.witness;
    const objOn = W && (W.state === 'wait' || W.state === 'follow');
    if (this.last.obj !== !!objOn) { this.last.obj = !!objOn; E.objective.hidden = !objOn; }
    if (objOn) {
      this._set('ot', E.objtxt, 'textContent', W.state === 'wait' ? `救出${WITNESS[W.id].name}` : `護送${WITNESS[W.id].name}回城門`);
      this._style('oh', E.objhp, 'width', (W.hp / W.maxHp * 100).toFixed(0) + '%');
    }
    // non-blocking speech lines
    if (this.sayQ.length) {
      this.sayT -= 1 / 60;
      if (this.sayT <= 0) this._nextSay();
    }
  },
  say(lines) {
    if (!lines || !lines.length) return;
    this.sayQ.push(...lines);
    if (!this.sayEl) this._nextSay();
  },
  _nextSay() {
    if (this.sayEl) { this.sayEl.remove(); this.sayEl = null; }
    const l = this.sayQ.shift();
    if (!l) return;
    const el = document.createElement('div');
    el.className = 'say';
    el.innerHTML = `<span class="seal">${esc(SPEAKERS[l.s].name)}</span><span>${esc(l.t)}</span>`;
    $('#app').appendChild(el);
    this.sayEl = el; this.sayT = 3.2;
  },

  // ======================= transient =======================
  banner(title, sub, dur, cls) {

  bossIntro(name, sub) { this.banner(name, sub, 2.8, 'boss'); },
  toast(msg, kind) {

    t.className = 'toast ' + (kind || '');

  // ======================= screens =======================
  show(html, cls) {
    this.nav.onSel = null;
    this.screens.innerHTML = `<section class="screen ${cls || ''}">${html}</section>`;
    return this.screens.firstChild;
  },
  clear() { this.screens.innerHTML = ''; this.nav.items = []; this.nav.back = null; this.nav.onSel = null; },
  setNav(items, back, idx, onSel) {
    this.nav.items = items.filter(Boolean);
    this.nav.back = back || null;
    this.nav.onSel = onSel || null;
    this.nav.cool = 2;
    this.nav.idx = clamp(idx || 0, 0, Math.max(0, this.nav.items.length - 1));
    this.nav.items.forEach((el, i) => {
      el.addEventListener('mouseenter', () => { this.nav.idx = i; this._mark(); });
    });
    this._mark();
  },
  _mark() { this.nav.items.forEach((el, i) => el.classList.toggle('sel', i === this.nav.idx)); if (this.nav.onSel) this.nav.onSel(this.nav.idx); },
  navUpdate() {
    const N = this.nav;
    if (N.cool > 0) { N.cool--; return; }
    if (!N.items.length && !N.back) return;
    if (N.items.length) {
      if (ACT.up() || ACT.left()) { N.idx = (N.idx - 1 + N.items.length) % N.items.length; this._mark(); AU.sfx('uiMove'); }
      if (ACT.down() || ACT.right()) { N.idx = (N.idx + 1) % N.items.length; this._mark(); AU.sfx('uiMove'); }
      if (keyHit('Enter') || keyHit('NumpadEnter') || padHit(0)) { const el = N.items[N.idx]; if (el && !el.disabled) el.click(); return; }
    }
    if (N.back && ACT.cancel()) N.back();
  },
  bind(root, sel, fn) { root.querySelectorAll(sel).forEach(el => el.addEventListener('click', e => { AU.sfx('select'); fn(el, e); })); },

      ${Object.entries(DIFFICULTY).map(([k, d]) => `<button class="diff slipbg btn" data-d="${k}"><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p></button>`).join('')}
      </div><p class="note" style="margin-top:1.2em">難度只影響敵人的血量與傷害。之後可以在標題畫面重新開始時更換。</p></div><footer><button class="btn inkb" data-a="back">返回</button></footer></div>`);

  // ---------- map (the ten days)
  mapScreen() {
    const camp = SAVE.data.campaign;
    if (!camp) return this.titleScreen();
    const W = SAVE.data.witnesses;
    const days = STAGES.map((S, i) => {
      const cleared = !!(camp.clearedDays && camp.clearedDays[S.id]);
      const isNext = i === camp.next && !camp.done;
      const locked = i > camp.next;
      const wit = Object.keys(WITNESS).filter(k => WITNESS[k].stage === S.id);
      const witTxt = wit.map(k => W[k] ? `<span style="color:#1f6a58">✓ ${esc(WITNESS[k].name)}</span>` : `<span style="opacity:.6">？見證</span>`).join(' ');
      return `<button class="day slipbg btn ${locked ? 'locked' : ''} ${isNext ? 'next' : ''}" data-i="${i}" ${locked ? 'disabled' : ''}>

        <span class="dnum">${esc(S.day)}</span><h3>${esc(S.title)}</h3>
        <p>${locked ? '……' : esc(S.brief)}</p>

        <div class="maprow"><div class="note">難度：${esc(DIFFICULTY[camp.diff].name)}　·　機關會一天天累積下去；失敗了可以從當天開始時重來。</div><div class="wit" title="見證">${witRow}</div></div>

        <button class="btn inkb" data-a="back">標題</button>
        <button class="btn inkb" data-a="codex">竹簡</button>
        <button class="btn inkb" data-a="shop">工坊</button>

        ${!camp.done ? `<button class="btn slipb" data-a="go">出城：${esc(STAGES[camp.next].day)}</button>` : ''}

  // ---------- workshop

      const items = WORKSHOP.map(u => {

  // ---------- codex
  codexScreen(tab, back) {
    const D = SAVE.data;
    const tabs = [['wit', '見證'], ['lore', '典故'], ['wpn', '機關'], ['enemy', '楚軍'], ['end', '結局']];
    let list = [];
    if (tab === 'wit') list = WITNESS_ORDER.map(k => ({ id: k, seal: D.witnesses[k] ? WITNESS[k].name[0] : '？', title: D.witnesses[k] ? WITNESS[k].name : '尚未見證', lock: !D.witnesses[k], body: D.witnesses[k] ? `<h3>${esc(WITNESS[k].name)}</h3><p>${esc(WITNESS_CODEX[k])}</p>` : `<h3>尚未見證</h3><p>${esc(WITNESS[k].hint)}</p><p class="meta">在該日找到被困城外的人，護送回城門。</p>` }));
    else if (tab === 'lore') list = LORE.map(l => ({ id: l.id, seal: l.title[0], title: l.title, body: `<h3>${esc(l.title)}</h3>${l.quote ? `<blockquote>${esc(l.quote)}</blockquote>` : ''}<p>${esc(l.text)}</p>` }));
    else if (tab === 'wpn') {
      for (const k in WEAPONS) { const w = WEAPONS[k], seen = D.seenWeapons[k] || !w.unlock; list.push({ id: k, seal: w.seal, title: seen ? w.name : '？？', lock: !seen, body: seen ? `<h3>${esc(w.name)}</h3><p>${esc(w.desc)}</p><p>${esc(w.lore)}</p><p class="meta">${esc(evoHint(k))}</p>${w.unlock ? `<p class="meta">解鎖：守住${esc(STAGE_BY_ID[w.unlock].day)}</p>` : ''}` : `<h3>？？</h3><p>守住${esc(STAGE_BY_ID[w.unlock].day)}後，墨家會造出新的機關。</p>` }); }
      for (const k in EVOS) { const e = EVOS[k], seen = D.seenWeapons[k]; list.push({ id: k, seal: seen ? e.seal : '？', title: seen ? e.name + '（進化）' : '進化・？？', lock: !seen, body: seen ? `<h3>${esc(e.name)}</h3><p>${esc(e.desc)}</p>` : `<h3>進化・？？</h3><p>${esc(evoHint(e.from))}</p>` }); }
    } else if (tab === 'enemy') {

      <footer><button class="btn inkb" data-a="back">返回</button></footer></div>`);

  chooseUpgrade(i) {
    const o = this._lvOpts && this._lvOpts[i];

      this.levelupScreen(); return;

    applyUpgrade(o);

    G.pendingLevels--;
    afterModal();

    const E = { A: ['結局一', '雨中', '墨子與三百墨者，在雨中離開了宋國。'], B: ['結局二', '公輸', '他成了天下最好的匠人。'], C: ['結局三', '開門', '治於神者，眾人不知其功。這一回，眾人知之。'] }[id];
    const seen = SAVE.data.endings;
    const missing = ['A', 'B', 'C'].filter(k => !seen[k]);

// ==== 17_cutscene.js ====
// ---------------------------------------------------------------------------
// 17_cutscene.js — story scenes: staged actors, camera shots, typewriter lines,
// title/quote cards, the ending choice, and in-battle witness talks.
// ---------------------------------------------------------------------------
const CS = {
  active: false, steps: [], i: -1, actors: {}, props: [], onDone: null, onChoice: null,
  typing: null, shown: 0, full: '', waiting: false, cam: null, camSnap: true, hint: '', mode: 'scene', talkDone: null, speaker: null,

  play(scene, onDone, opts) {
    opts = opts || {};
    this.active = true; this.mode = 'scene';
    this.steps = Array.isArray(scene) ? scene : scene.steps;
    this.i = -1; this.onDone = onDone; this.hint = '';
    if (!opts.keepActors) { this.actors = {}; this.props = []; }
    if (scene.actors) for (const k in scene.actors) this.addActor(k, scene.actors[k]);
    this.camSnap = !opts.keepCam;
    G.mode = 'cutscene';
    UI.hud(false);
    UI.clear();
    if (!this.cam) this.shot('wide');
    this.next();
  },
  // compact dialogue during battle (witness talks); pauses the game
  talk(lines, done) {
    this.active = true; this.mode = 'talk';
    this.steps = lines; this.i = -1; this.onDone = done; this.actors = {};
    G.mode = 'talk';
    this.next();
  },
  addActor(key, spec) {
    const sp = SPEAKERS[key] || SPEAKERS[key.replace(/\d+$/, '')];
    const model = sp && sp.model !== 'player' ? M[sp.model] : null;
    this.actors[key] = { key, model, player: sp && sp.model === 'player', x: spec[0], z: spec[1], yaw: spec[2] || 0, y: spec[3] || 0, tx: null, tz: null, speed: 1.6, phase: rnd() * 6, talk: 0, vis: true };
  },
  pos(key) { const a = this.actors[key]; return a ? [a.x, a.z] : [0, 8]; },
  shot(kind, a, b) {
    let eye, tgt;
    if (kind === 'wide') { eye = [9, 11, 31]; tgt = [0, 3.4, 6]; }
    else if (kind === 'gate') { eye = [1.5, 4.2, 25]; tgt = [0, 8.2, 0]; }
    else if (kind === 'wall') { eye = [-12, 4.5, 21]; tgt = [-3, 11, -2]; }
    else if (kind === 'far') { eye = [2, 28, 64]; tgt = [0, 4, 12]; }
    else if (kind === 'two') {
      const A = this.pos(a), B = this.pos(b);
      const mx = (A[0] + B[0]) / 2, mz = (A[1] + B[1]) / 2;
      let dx = B[0] - A[0], dz = B[1] - A[1];
      const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
      let nx = -dz, nz = dx;
      if (nz < 0) { nx = -nx; nz = -nz; }
      const dist = 5.5 + l * 0.6;
      eye = [mx + nx * dist + dx * 0.8, 2.9, mz + nz * dist + dz * 0.8]; tgt = [mx, 1.55, mz];
    } else if (kind === 'close') {
      const A = this.pos(a);
      eye = [A[0] + 1.6, 2.35, A[1] + 3.9]; tgt = [A[0], 1.75, A[1]];
    } else { eye = [0, 30, 40]; tgt = [0, 0, 12]; }
    this.cam = { eye, tgt };
  },
  next() {
    this.i++;
    const st = this.steps[this.i];
    if (!st) return this.finish();
    const W = SAVE.data.witnesses;
    if (st.if && !W[st.if]) return this.next();
    if (st.ifnot && W[st.ifnot]) return this.next();
    if (st.ifany && !WITNESS_ORDER.some(k => W[k])) return this.next();
    if (st.cam) this.shot(st.cam, st.a, st.b);
    if (st.act) this.action(st.act);
    if (st.hint) { this.hint = st.hint; return this.next(); }
    if (st.end) { this.end(st.end); return; }
    if (st.choice) { this.waiting = false; UI.choices(st.choice, o => { AU.sfx('select'); this.onChoice(o.id); }); return; }
    if (st.quote || st.title) {
      this.waiting = true;
      const html = st.quote
        ? `<div><div class="q ${st.strike ? 'strike' : ''}">${esc(st.quote)}</div><div class="src">${esc(st.src || '')}</div></div>`
        : `<div><div class="dayt">${esc(st.day || '')}</div><div class="stg">${esc(st.title)}</div><div class="brief">${esc(st.sub || '')}</div></div>`;
      UI.card(html, () => this.advance());
      this.typing = null;
      return;
    }
    if (st.n || st.s) {
      this.waiting = true;
      const name = st.s ? SPEAKERS[st.s].name : '';
      if (this.mode === 'talk') UI.dialog({ name }, !st.s);
      else UI.dialog({ name }, !st.s);
      this.full = st.n || st.t; this.shown = 0; this.typing = true;
      UI.dialogText('');
      this.speaker = st.s || null;
      if (st.s && this.actors[st.s]) this.actors[st.s].talk = 1.2;
      return;
    }
    this.next();
  },
  advance() {
    if (!this.active || !this.waiting) return;
    if (this.typing) { this.typing = false; this.shown = this.full.length; UI.dialogText(this.full); return; }
    AU.sfx('uiMove');
    this.waiting = false;
    this.next();
  },
  skip() {
    if (!this.active) return;
    // jump to the next choice / end in this scene, or finish
    for (let k = this.i + 1; k < this.steps.length; k++) {
      const st = this.steps[k];
      if (st.choice || st.end) { this.i = k - 1; this.waiting = false; this.typing = false; return this.next(); }
      if (st.act) this.action(st.act, true);
      if (st.hint) this.hint = st.hint;
    }
    this.finish();
  },
  finish() {
    this.active = false; this.waiting = false; this.typing = false;
    const fn = this.onDone; this.onDone = null;
    if (this.mode === 'talk') { UI.clear(); }
    if (fn) fn();
  },
  end(id) {
    this.active = false;
    SAVE.data.endings[id] = true;
    if (!SAVE.data.endingOrder) SAVE.data.endingOrder = [];
    SAVE.data.endingOrder.push(id);
    SAVE.save();
    G.mode = 'ending';
    AU.music('ending');
    UI.endScreen(id, this.hint);
  },
  action(a, instant) {
    const A = this.actors;
    const walk = (k, x, z, sp) => { const o = A[k]; if (!o) return; if (instant) { o.x = x; o.z = z; } else { o.tx = x; o.tz = z; o.speed = sp || 1.6; } };
    switch (a) {
      case 'moziLeave': walk('mozi', 5, 70, 1.5); break;
      case 'arrow': if (!instant) { this.props.push({ kind: 'arrow', x: 1.5, y: 9, z: 26, vx: -0.2, vy: -3, vz: -16, t: 0, stuck: false }); } break;
      case 'messenger': walk('chu', 3, 16.5, 5); break;
      case 'cheer': World.cheer(1); if (!instant) AU.sfx('victory'); break;
      case 'rain': World.rainOverride = 1; AU.setAmbience(1, 0.35); break;
      case 'moziArrive': { const o = A.mozi; if (o) { const tx = o.x, tz = o.z; o.x = 4; o.z = 42; walk('mozi', tx, tz, 1.4); } break; }
      case 'gongLeave': walk('gong', 20, 64, 1.5); break;
      case 'walkAway': walk('mozi', -1, 70, 1.3); walk('qin', -3, 70, 1.3); walk('wzw', 1, 69, 1.3); walk('mozhe', -6, 72, 1.3); walk('mozhe2', 5, 72, 1.3); break;
      case 'goWithGong': walk('gong', 20, 64, 1.4); walk('wzw', 18.5, 63, 1.4); break;
      case 'bolt': if (!instant) AU.sfx('ladder'); break;
      case 'lvOut': this.addActor('lv', [0.8, 1.2, 0]); walk('lv', 1.2, 4.6, 1.2); break;
      case 'gateOpen': this.gateOpening = true; if (!instant) AU.sfx('gate'); break;
      case 'crowdOut': {
        const spots = { he: [2.4, 8.6], shi: [-1.4, 6.2], qinshi: [-4.2, 7.4], tao: [-2.8, 9.6], bing: [4.6, 7.8], gouzi: [5.8, 10.2] };
        for (const k in spots) { this.addActor(k, [rnd.range(-1.5, 1.5), 0.5, 0]); walk(k, spots[k][0], spots[k][1], 1.6 + rnd() * 0.4); }
        for (let i = 0; i < 16; i++) { const key = 'folk' + i; this.actors[key] = { key, model: M.crowdFolk[i % 4], x: rnd.range(-2, 2), z: 0.5, yaw: 0, y: 0, tx: rnd.range(-9, 9), tz: rnd.range(10, 17), speed: 1.3 + rnd() * 0.6, phase: rnd() * 6, talk: 0, vis: true }; if (instant) { const o = this.actors[key]; o.x = o.tx; o.z = o.tz; } }
        World.cheer(0.6);
        break;
      }
      case 'music': if (!instant) { AU.music('ending'); } break;
    }
  },
  update(dt) {
    if (this.typing) {
      this.shown = Math.min(this.full.length, this.shown + dt * 38);
      UI.dialogText(this.full.slice(0, Math.floor(this.shown)));
      if (Math.floor(this.shown) % 3 === 0) AU.sfx('typing');
      if (this.shown >= this.full.length) this.typing = false;
    }
    if (this.active && (ACT.confirm() || IN.mouse.hit[0] && G.mode === 'talk')) this.advance();
    if (this.active && (keyHit('Tab') || keyHit('Escape')) && this.mode === 'scene') this.skip();
    if (this.gateOpening) { World.doorOpen = Math.min(1, (World.doorOpen || 0) + dt * 0.35); }
    for (const k in this.actors) {
      const o = this.actors[k];
      o.phase += dt * 3; o.talk = Math.max(0, o.talk - dt);
      if (o.tx != null) {
        const dx = o.tx - o.x, dz = o.tz - o.z, l = Math.hypot(dx, dz);
        if (l < 0.1) { o.tx = null; }
        else { const s = Math.min(l, o.speed * dt); o.x += dx / l * s; o.z += dz / l * s; o.yaw = dampAngle(o.yaw, Math.atan2(dx, dz), 6, dt); o.walking = true; }
      } else o.walking = false;
    }
    for (const p of this.props) {
      if (p.stuck) continue;
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vy -= 6 * dt;
      if (p.y < 1.2 && p.z < 9) { p.stuck = true; AU.sfx('ladder'); FXP.dust(p.x, p.z, 2, 0.4); }
    }
    // camera
    if (this.mode === 'scene' && this.cam) {
      const c = R.cam, k = this.camSnap ? 1 : 1 - Math.exp(-2.6 * dt);
      for (let i = 0; i < 3; i++) { c.eye[i] = lerp(c.eye[i], this.cam.eye[i], k); c.target[i] = lerp(c.target[i], this.cam.tgt[i], k); }
      c.eye[0] += Math.sin(R.time * 0.3) * 0.004; c.eye[1] += Math.sin(R.time * 0.23) * 0.003;
      this.camSnap = false;
      R.shadowFocus = [c.target[0], 0, c.target[2]];
    }
  },
  draw() {
    const t = R.time;
    for (const k in this.actors) {
      const o = this.actors[k];
      if (!o.vis) continue;
      const bob = o.walking ? Math.abs(Math.sin(o.phase * 2.2)) * 0.07 : Math.sin(o.phase * 0.7) * 0.012;
      const nod = o.talk > 0 ? Math.sin(o.phase * 5) * 0.04 : 0;
      if (o.player) {
        P.x = o.x; P.z = o.z; P.face = o.yaw; P.moving = !!o.walking; P.vx = o.walking ? Math.sin(o.yaw) * 1.6 : 0; P.vz = o.walking ? Math.cos(o.yaw) * 1.6 : 0;
        P.phase += o.walking ? 0.05 : 0; P.aimX = Math.sin(o.yaw); P.aimZ = Math.cos(o.yaw);
        const st = G.stage; G.stage = null; drawPlayer(); G.stage = st;
      } else if (o.model) o.model.add(o.x, o.y + bob, o.z, o.yaw, nod, o.walking ? Math.sin(o.phase * 2.2) * 0.04 : 0, 1, 1, 1);
    }
    for (const p of this.props) if (p.kind === 'arrow') M.arrowChu.add(p.x, p.y, p.z, Math.atan2(p.vx, p.vz), p.stuck ? 0.3 : -Math.atan2(p.vy, Math.hypot(p.vx, p.vz)), 0, 1.4, 1.4, 1.4);
    // an umbrella over 公輸盤 in the rain ending
    if (this.actors.gong && World.rainOverride) {
      const g = this.actors.gong;
      if (!this._umb) { const b = MB(); b.cy('#7a5a3a', 0, 0, 0, 0.02, 0.04, 2.2, 5); b.push(); b.at(0, 1.1, 0); b.color('#b0433a'); b.cyl(0.05, 1.05, 0.45, 12); b.pop(); this._umb = b.build('umbrella'); }
      this._umb.add(g.x + 0.25, 1.35, g.z + 0.1, 0, 0.05, 0.1, 1, 1, 1);
    }
    void t;
  },
};

// ==== 18_save.js ====
// ---------------------------------------------------------------------------
// 18_save.js — local save (localStorage) + per-viewer cloud save when the page
// runs as a claude.ai artifact with the db capability. Export/import as text.
// ---------------------------------------------------------------------------
const SAVE_KEY = 'moshou-save-v1';
const SAVE = {
  data: null, remoteRef: null, writing: false, queued: false, timer: 0, dirty: false,
  defaults() {
    return {
      v: 1, coins: 0, workshop: {}, witnesses: {}, endings: {}, cleared: {}, best: {}, seenEnemies: {}, seenWeapons: {},
      ultKind: 'sanbai', campaign: null, tipsShown: false, lore: {},
      settings: { vol: 0.8, music: 0.6, sfx: 0.8, quality: 'ultra', shake: 1, dmgNums: true, aim: 'auto' },
      stats: { kills: 0, runs: 0, deaths: 0, clears: 0, time: 0 }, updated: 0,
    };
  },
  merge(d, o) {
    for (const k in o) {
      if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]) && d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) this.merge(d[k], o[k]);
      else d[k] = o[k];
    }
    return d;
  },
  load() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
    this.data = this.defaults();
    if (raw) { try { this.merge(this.data, JSON.parse(raw)); } catch (e) { /* corrupted: keep defaults */ } }
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches && !raw) this.data.settings.shake = 0.4;
  },
  save() {
    this.data.updated = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* storage blocked */ }
    this.queueRemote();
  },
  seeEnemy(k) { if (!this.data.seenEnemies[k]) { this.data.seenEnemies[k] = 1; this.dirty = true; } },
  seeWeapon(k) { if (!this.data.seenWeapons[k]) { this.data.seenWeapons[k] = 1; this.dirty = true; } },
  exportText() {
    const json = JSON.stringify(this.data);
    return 'MOSHOU1:' + btoa(unescape(encodeURIComponent(json)));
  },
  importText(txt) {
    txt = (txt || '').trim();
    if (!txt.startsWith('MOSHOU1:')) return false;
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(txt.slice(8)))));
      if (!d || typeof d !== 'object' || d.v !== 1) return false;
      this.data = this.merge(this.defaults(), d);
      this.save();
      return true;
    } catch (e) { return false; }
  },
  reset() { const s = this.data.settings; this.data = this.defaults(); this.data.settings = s; this.save(); },
  // ---- claude.ai per-viewer store (optional)
  async initRemote() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/save');
      const snap = await ref.get();
      this.remoteRef = ref;
      if (snap.exists) {
        const body = snap.data();
        const remote = body && body.json ? JSON.parse(body.json) : null;
        if (remote && remote.v === 1 && (remote.updated || 0) > (this.data.updated || 0)) {
          this.data = this.merge(this.defaults(), remote);
          try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ }
          if (typeof onSaveReloaded === 'function') onSaveReloaded();
        } else if ((this.data.updated || 0) > (remote ? remote.updated || 0 : 0)) this.queueRemote();
      } else if (this.data.updated) this.queueRemote();
    } catch (e) { this.remoteRef = null; }
  },
  queueRemote() {
    if (!this.remoteRef) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flushRemote(), 1500);
  },
  async flushRemote() {
    if (!this.remoteRef) return;
    if (this.writing) { this.queued = true; return; }
    this.writing = true;
    try { await this.remoteRef.set({ json: JSON.stringify(this.data), updated: this.data.updated || Date.now() }); }
    catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) this.remoteRef = null; }
    this.writing = false;
    if (this.queued) { this.queued = false; this.flushRemote(); }
  },
};

// ==== 19_main.js ====
// ---------------------------------------------------------------------------
// 19_main.js — boot, main loop, game flow (campaign, days, results, endings),
// gameplay camera, simulation / test hooks.
// ---------------------------------------------------------------------------
const CAM = { x: 0, z: 12, zoom: 1, zoomT: 1, focus: null };
let _last = 0, _fpsAcc = 0, _fpsN = 0, _fps = 60, _lowFpsT = 0;

function boot() {
  SAVE.load();
  const cv = document.getElementById('gl');
  if (!R.init(cv)) {
    document.getElementById('screens').innerHTML = '<section class="screen" style="display:grid;place-items:center;text-align:center;padding:24px"><div><h2 style="font-family:var(--f-display)">這台裝置不支援 WebGL2</h2><p class="note">請使用最新版的 Chrome、Edge 或 Firefox，並確認已開啟硬體加速。</p></div></section>';
    return;
  }
  onResize();
  R.setQuality(SAVE.data.settings.quality || 'ultra');
  buildModels(); buildEnvMeshes(); buildBossModels(); setupEnemyParts(); buildPlayerRig();
  FX.init(); UI.init(); inputInit(cv);
  onResize();
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') openPause(); });
  World.build('title');
  titleCamera(0, true);
  G.mode = 'boot';
  UI.bootScreen();
  const start = e => {
    if (G.mode !== 'boot') return;
    AU.init();
    AU.music('title');
    goTitle();
    IN.hitQ.clear(); UI.nav.cool = 3;
    window.removeEventListener('keydown', start); window.removeEventListener('pointerdown', start);
  };
  window.addEventListener('keydown', start); window.addEventListener('pointerdown', start);
  SAVE.initRemote();
  requestAnimationFrame(loop);
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
  R.resize(w, h, dpr);
  if (FX.cv) FX.resize(w, h, dpr);
  if (UI.screens) UI.resize();
}
function onSaveReloaded() {
  R.setQuality(SAVE.data.settings.quality || 'ultra');
  AU.applyVolumes();
  if (G.mode === 'title') UI.titleScreen();
  else if (G.mode === 'map') UI.mapScreen();
}
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => UI.toast('無法切換全螢幕', 'warn'));
    else document.exitFullscreen();
  } catch (e) { UI.toast('無法切換全螢幕', 'warn'); }
}

// ---------------- main loop ----------------
function loop(now) {
  const dt = Math.min(0.05, Math.max(0.0001, (now - _last) / 1000 || 0.016));
  _last = now;
  inputPoll(dt);
  try { frame(dt); } catch (err) { console.error(err); document.title = 'ERR ' + (err && err.message); }
  inputEndFrame();
  requestAnimationFrame(loop);
  // performance watchdog: suggest a lower quality when frames drag
  _fpsAcc += dt; _fpsN++;
  if (_fpsAcc > 1) { _fps = _fpsN / _fpsAcc; _fpsAcc = 0; _fpsN = 0; if (G.mode === 'play' && _fps < 40 && R.quality.level !== 'low') { _lowFpsT++; if (_lowFpsT === 6) UI.toast('畫面有點卡，可以到設定調低畫質', 'warn'); } else _lowFpsT = Math.max(0, _lowFpsT - 1); }
}

function frame(dtReal) {
  R.time += dtReal;
  const m = G.mode;
  if (m === 'play') playFrame(dtReal);
  else if (m === 'intro') {                        // day title card over the battlefield, camera already on 魏子葳
    updateGameCamera(dtReal);
    World.update(dtReal, CAM.x, CAM.z);
    pUpdate(dtReal);
    drawGame(0);
    if (ACT.confirm() || ACT.pause()) endIntro();
  } else if (m === 'levelup' || m === 'chest' || m === 'pause' || m === 'talk' || m === 'result') {
    if (m === 'levelup') {
      for (let n = 1; n <= 4; n++) if (ACT.choice(n)) UI.chooseUpgrade(n - 1);
      if (ACT.reroll()) UI.rerollUpgrade();
      if (keyHit('KeyX')) UI.skipUpgrade();
      if (keyHit('KeyB') && G.banishes > 0) { UI._banMode = !UI._banMode; UI.toast(UI._banMode ? '選一張除名' : '取消除名', 'warn'); }
    }
    if (m === 'chest' && (ACT.confirm() || IN.mouse.hit[0]) && UI._chestReveal) UI._chestReveal();
    if (m === 'pause' && ACT.pause() && !UI.nav.back) closePause();
    if (m === 'talk') CS.update(dtReal);
    UI.navUpdate();
    drawGame(0);
    World.update(0.0, CAM.x, CAM.z);
  } else if (m === 'cutscene') {
    CS.update(dtReal);
    World.update(dtReal, R.cam.target[0], R.cam.target[2]);
    pUpdate(dtReal); chipUpdate(dtReal); marksUpdate(dtReal);
    World.draw(R.cam.target[0], R.cam.target[2]);
    CS.draw();
    marksDraw(); pDraw(); chipDraw();
    UI.navUpdate();
  } else {
    // title / map / menus: slow cinematic camera over the current world
    titleCamera(dtReal);
    World.update(dtReal, R.cam.target[0], R.cam.target[2]);
    pUpdate(dtReal); chipUpdate(dtReal);
    World.draw(R.cam.target[0], R.cam.target[2]);
    if (World.stage === 'title') {
      P.x = 1.2; P.z = 8.5; P.face = 0.05; P.moving = false; P.vx = P.vz = 0; P.aimX = 0; P.aimZ = -1;
      const st = G.stage; G.stage = null; drawPlayer(); G.stage = st;
      for (let i = 0; i < 5; i++) M.npcMozhe.add(-5 + i * 2.6 + (i > 2 ? 3 : 0), 0, 14 + (i % 2) * 1.5, Math.PI * 0.02 * i, 0, 0, 1, 1, 1);
    }
    pDraw(); chipDraw();
    UI.navUpdate();
    if (m === 'boot' && ACT.any()) { /* handled by listener */ }
  }
  FX.update(dtReal);
  FX.draw();
  UI.updateHud();
  if (G.mode === 'play' || G.mode === 'cutscene' || G.mode === 'title' || G.mode === 'map' || G.mode === 'boot') {
    const rain = World.rainOverride != null ? World.rainOverride : ((World.env && World.env.weather && World.env.weather.rain) || 0);
    AU.setAmbience(rain, World.env && !World.env.dark ? 0.6 : 0.2);
  }
  R.render();
}

function titleCamera(dt, snap) {
  const t = R.time;
  const eye = [9 + Math.sin(t * 0.05) * 2, 3.6 + Math.sin(t * 0.07) * 0.3, 27 + Math.cos(t * 0.05) * 1.5], tgt = [-1, 7.4, 1];
  const k = snap ? 1 : 1 - Math.exp(-1.5 * dt);
  for (let i = 0; i < 3; i++) { R.cam.eye[i] = lerp(R.cam.eye[i], eye[i], k); R.cam.target[i] = lerp(R.cam.target[i], tgt[i], k); }
  R.shadowFocus = [0, 0, 6];
}

function playFrame(dtReal) {
  // time scale: hit-stop and slow motion
  let ts = 1;
  if (G.hitStop > 0) { G.hitStop -= dtReal; ts = 0.05; }
  if (G.slowMo > 0) { G.slowMo -= dtReal; ts = Math.min(ts, G.slowFactor); R.post.desat = 0.35; } else R.post.desat = damp(R.post.desat, 0, 6, dtReal);
  const dt = dtReal * ts;
  G.time += dt;
  simStep(dt);
  if (ACT.ult()) tryUlt();
  if (ACT.pause()) { openPause(); return drawGame(dtReal); }
  if (IN.mouse.wheel) CAM.zoomT = clamp(CAM.zoomT + IN.mouse.wheel * 0.07, 0.8, 1.35);
  if (G.autoplay) autoResolvePending();
  if (G.mode === 'play' && !G.cleared && !G.failed) {
    if (G.pendingChests > 0) { G.mode = 'chest'; UI.chestScreen(); }
    else if (G.pendingLevels > 0) { G.mode = 'levelup'; UI.levelupScreen(); }
  }
  updateGameCamera(dtReal);
  drawGame(dtReal);
  // water ripples around moving things
  if (R.water.on) {
    const rp = R.water.rip; let n = 0;
    const add = (x, z, age, s) => { if (n >= 24) return; rp[n * 4] = x; rp[n * 4 + 1] = z; rp[n * 4 + 2] = age; rp[n * 4 + 3] = s; n++; };
    add(P.x, P.z, (G.time * 1.3) % 1.4, Math.min(1, Math.hypot(P.vx, P.vz) / 4) * 0.6 + 0.15);
    if (G.boss && !G.boss.dying) add(G.boss.x, G.boss.z, (G.time * 0.9) % 1.6, 1);
    for (let i = 0; i < EN.hi && n < 24; i += 7) if (EN.alive[i] === 1 && EN.type[i] !== BOSS_TYPE && len2(EN.x[i] - P.x, EN.z[i] - P.z) < 20) add(EN.x[i], EN.z[i], ((G.time + i * 0.37) * 1.2) % 1.5, 0.4);
    R.water.nr = n;
  }
}

// one deterministic-ish simulation step (also used by the headless sim)
function simStep(dt) {
  gridBuild();
  updatePlayer(dt);
  updateWeapons(dt);
  updateProjectiles(dt);
  updateZones(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateTimers(dt);
  updateEnemyProj(dt);
  updateTelegraphs(dt);
  updatePickups(dt);
  updateWitness(dt);
  updateSupport(dt);
  updateUlt(dt);
  updateDirector(dt);
  updateStageTimer(dt);
  if (!G.sim) {
    World.update(dt, P.x, P.z);
    pUpdate(dt); chipUpdate(dt); marksUpdate(dt);
  }
}

function updateGameCamera(dt) {
  const lx = P.vx * 0.3, lz = P.vz * 0.22;
  CAM.x = damp(CAM.x, P.x + lx, 5, dt); CAM.z = damp(CAM.z, P.z + lz, 5, dt);
  CAM.zoom = damp(CAM.zoom, CAM.zoomT, 6, dt);
  let fx = CAM.x, fz = CAM.z;
  if (CAM.focus && CAM.focus.t > 0) { CAM.focus.t -= dt; const k = smoothstep(0, 0.4, Math.min(CAM.focus.t, 1.6 - CAM.focus.t)); fx = lerp(fx, CAM.focus.x, k); fz = lerp(fz, CAM.focus.z - 4, k); }
  const H = 31 * CAM.zoom, D = 21 * CAM.zoom;
  const tx = fx + FX.shakeX, tz = fz + 2.6 + FX.shakeZ;
  R.cam.target[0] = tx; R.cam.target[1] = 0; R.cam.target[2] = tz;
  R.cam.eye[0] = tx; R.cam.eye[1] = H + FX.shakeY; R.cam.eye[2] = tz + D;
  R.cam.fov = 34 * DEG;
  R.shadowFocus = [fx, 0, fz - 2];
}

function drawGame(dt) {
  World.draw(CAM.x, CAM.z);
  marksDraw();
  drawPickups();
  drawEnemies();
  drawBoss();
  if (!P.dead) drawPlayer();
  drawWeapons();
  drawProjectiles();
  drawEnemyProj();
  drawZones();
  drawTelegraphs();
  drawWitness();
  drawUlt();
  pDraw();
  chipDraw();
}

// ---------------- flow ----------------
function goTitle() {
  G.mode = 'title';
  UI.hud(false); UI.clear();
  if (World.stage !== 'title') World.build('title');
  World.rainOverride = null;
  titleCamera(0, true);
  AU.music('title');
  UI.titleScreen();
}
function goMap() {
  G.mode = 'map';
  UI.hud(false);
  if (World.stage !== 'title') { World.build('title'); titleCamera(0, true); }
  AU.music('story');
  UI.mapScreen();
}
function startCampaign(diff) {
  SAVE.data.campaign = { diff, next: 0, checkpoints: {}, clearedDays: {}, done: false, started: Date.now() };
  SAVE.save();
  G.diff = diff;
  World.build('s1');
  World.setTime01(0);
  AU.music('story');
  CS.cam = null;
  CS.play(STORY.prologue, () => beginStage(0, false));
}
function startDay(i, replay) {
  const camp = SAVE.data.campaign;
  const S = STAGES[i];
  G.diff = camp ? camp.diff : 'normal';
  const pre = STORY[S.id + '_pre'];
  if (pre && !replay) {
    World.build(S.id);
    World.setTime01(0);
    AU.music('story');
    CS.cam = null;
    CS.play(pre, () => beginStage(i, replay));
  } else beginStage(i, replay);
}
function beginStage(i, replay) {
  const camp = SAVE.data.campaign;
  const S = STAGES[i];
  const snap = camp && camp.checkpoints[S.id] ? JSON.parse(JSON.stringify(camp.checkpoints[S.id])) : null;
  startStage(S.id, { replay, snapshot: snap });
  CAM.x = P.x; CAM.z = P.z; CAM.zoom = CAM.zoomT = 1;
  G.mode = 'intro';
  UI.hud(false);
  UI.card(`<div><div class="dayt">${esc(S.day)}</div><div class="stg">${esc(S.title)}</div><div class="brief">${esc(S.brief)}</div></div>`, () => endIntro());
  G.introT = 2.4;
  const tick = () => { if (G.mode !== 'intro') return; G.introT -= 0.1; if (G.introT <= 0) endIntro(); else setTimeout(tick, 100); };
  setTimeout(tick, 100);
}
function endIntro() {
  if (G.mode !== 'intro') return;
  UI.clear();
  G.mode = 'play';
  UI.hud(true);
  SAVE.data.stats.runs++;
  if (G.stage.id === 's1' && !SAVE.data.tipsShown) {
    TIPS_DAY1.forEach((t, k) => setTimeout(() => { if (G.mode === 'play' || G.mode === 'levelup') UI.toast(t, 'good'); }, 800 + k * 3400));
    SAVE.data.tipsShown = true; SAVE.save();
  }
}
function openPause() {
  if (G.mode !== 'play') return;
  G.mode = 'pause';
  UI.pauseScreen();
}
function closePause() {
  G.mode = 'play';
  UI.clear();
}
function afterModal() {
  if (G.pendingChests > 0) { G.mode = 'chest'; UI.chestScreen(); }
  else if (G.pendingLevels > 0) { G.mode = 'levelup'; UI.levelupScreen(); }
  else { G.mode = 'play'; UI.clear(); }
}
function abandonDay() {
  bankCoins(G.coinsRun);
  goMap();
}
function bankCoins(c) {
  SAVE.data.coins += Math.round(c);
  SAVE.data.stats.kills += G.kills;
  SAVE.save();
}
function onWitnessSaved(id) {
  const first = !SAVE.data.witnesses[id];
  if (G.witLog) G.witLog.push(id + ':saved@' + Math.round(G.t));
  SAVE.data.witnesses[id] = true;
  SAVE.save();
  World.cheer(1);
  if (G.sim) return;
  AU.sfx('witness');
  UI.toast('見證：' + WITNESS[id].name + (first ? '（竹簡已記下）' : ''), 'witness');
  CS.talk(WITNESS_TALK[id], () => { if (G.mode === 'talk') { G.mode = 'play'; UI.clear(); } });
}
function onStageFail() {
  if (G.sim) return;
  G.mode = 'result';
  const coins = Math.round(G.coinsRun);
  bankCoins(coins);
  SAVE.data.stats.deaths++;
  SAVE.save();
  AU.sfx('fail');
  AU.music('story');
  FX.banner(G.failReason === '城破了' ? '城破' : '倒下', G.failReason === '城破了' ? '楚軍登上了城頭' : '魏子葳倒下了', 2.4);
  setTimeout(() => { UI.hud(false); UI.resultScreen(false, { coins }); }, 1600);
}
function onBossDefeated() {
  if (G.cleared) return;
  G.cleared = true;
  if (G.sim) return;
  const S = G.stage;
  FX.banner(S.title.split('・')[0] + '・距', '楚軍退兵', 2.8);
  AU.sfx('victory');
  World.cheer(1);
  AU.music('story');
  setTimeout(() => stageClear(), 3200);
}
function stageClear() {
  const S = G.stage, i = STAGES.indexOf(S);
  // collect whatever is left on the field
  for (let k = 0; k < PK.hi; k++) if (PK.alive[k] && PK.kind[k] !== 6) collectPickup(k);
  const bonus = 60 + 30 * i;
  const coins = Math.round(G.coinsRun + bonus);
  bankCoins(coins);
  SAVE.data.cleared[S.id] = true;
  SAVE.data.stats.clears++;
  const b = SAVE.data.best[S.id] || {};
  SAVE.data.best[S.id] = { kills: Math.max(b.kills || 0, G.kills), level: Math.max(b.level || 0, P.level) };
  const camp = SAVE.data.campaign;
  if (camp && !G.replay) {
    camp.clearedDays[S.id] = true;
    if (i + 1 < STAGES.length) { camp.checkpoints[STAGES[i + 1].id] = snapshotBuild(); camp.next = Math.max(camp.next, i + 1); }
    else { camp.done = true; camp.next = STAGES.length - 1; }
  }
  SAVE.save();
  G.mode = 'result';
  UI.hud(false);
  UI.resultScreen(true, { coins });
}
function afterStageClearContinue() {
  const S = G.stage;
  if (G.replay) return goMap();
  const post = STORY[S.id + '_post'];
  // story after the battle, in the same field at dusk
  World.setTime01(1);
  enemyReset(); projReset(); pickupReset(); ZONES.length = 0; EPS.length = 0; TGS.length = 0; G.boss = null;
  CS.cam = null;
  const next = () => { if (S.id === 's6') playEndingScene(); else goMap(); };
  if (post) CS.play(post, next); else next();
}
function playEndingScene() {
  World.build('s6', { crowd: 1.6 });
  World.env = Object.assign({}, World.env, { keys: ENV_PRESETS.ending.keys, weather: ENV_PRESETS.ending.weather });
  World.setTime01(0);
  World.rainOverride = 1;
  R.env.showSky = true;
  AU.music('story');
  CS.cam = null;
  CS.onChoice = id => {
    const all = WITNESS_ORDER.every(k => SAVE.data.witnesses[k]);
    let branch;
    if (id === 'A') branch = STORY.endA;
    else if (id === 'B') branch = STORY.endB;
    else branch = all ? STORY.endC : STORY.endWait;
    UI.clear();
    CS.play(branch, () => { }, { keepActors: true, keepCam: true });
  };
  CS.play(STORY.ending, () => { });
}

// ---------------- test / debug hooks ----------------
// a sensible (not perfect) player: level what you have, chase evolutions, armour up, keep ~4 machines
const PASSIVE_TASTE = { tian: 70, cai: 60, jiang: 58, ai: 55, fei: 54, zhi: 50, kuo: 45, ming: 44, lv: 40, xian: 35, ci: 30, jie: 20 };
function botPickUpgrade(o) {
  if (G.botPolicy === 'naive') return o.find(x => x.type === 'w' && !x.isNew) || o.find(x => x.type === 'w') || o[0];
  const partners = new Set();
  for (const w of P.weapons) { const e = WEAPONS[w.id].evo; if (e && !w.evo && !e.union) partners.add(e.need); }
  let best = o[0], bs = -1e9;
  for (const x of o) {
    let sc = 0;
    if (x.type === 'w' && !x.isNew) sc = 100;
    else if (x.type === 'p' && partners.has(x.id)) sc = 92;
    else if (x.type === 'p' && x.id === 'fei' && (P.passives.fei || 0) < 3) sc = 88;
    else if (x.type === 'w' && x.isNew) sc = P.weapons.length < 4 ? 85 : 25;
    else if (x.type === 'p') sc = PASSIVE_TASTE[x.id] || 30;
    if (sc > bs) { bs = sc; best = x; }
  }
  return best;
}
function autoResolvePending() {
  if (G.ult >= 100 && !G.ultActive && (G.boss || EN.count > 140)) tryUlt();
  while (G.pendingLevels > 0) { applyUpgrade(botPickUpgrade(rollUpgrades())); G.pendingLevels--; }
  while (G.pendingChests > 0) { const r = rollChest(); if (r.evo) applyEvolution(r.evo); G.pendingChests--; }
}
function simRun(stageId, seconds, opts) {
  opts = opts || {};
  const t0 = performance.now();
  G.sim = true; G.autoplay = true;
  G.diff = opts.diff || 'normal';
  G.botPolicy = opts.policy || 'smart';
  startStage(stageId, { snapshot: opts.snapshot || null });
  if (opts.t) { G.t = opts.t; G.eventIdx = G.stage.events.findIndex(e => e.t >= opts.t); if (G.eventIdx < 0) G.eventIdx = G.stage.events.length; }
  G.mode = 'play';
  G.dmgTaken = {}; G.dmgLog = opts.log ? [] : null;
  const hpAt = [];
  const dt = 1 / 30;
  let steps = Math.round(seconds / dt), minHp = P.maxHp, bossT = null, lvlAt = {}, minWall = G.wallMax;
  for (let s = 0; s < steps; s++) {
    G.time += dt;
    simStep(dt);
    autoResolvePending();
    if (P.hp < minHp) minHp = P.hp;
    if (G.wallHp < minWall) minWall = G.wallHp;
    if (G.boss && bossT == null) bossT = G.t;
    const m = Math.floor(G.t / 60); if (!lvlAt[m]) lvlAt[m] = P.level;
    if (s % 600 === 0) hpAt.push(Math.round(P.hp) + '@' + Math.round(G.t) + ':' + EN.count);
    if (G.failed || G.cleared) break;
  }
  const res = {
    stage: stageId, t: +G.t.toFixed(1), level: P.level, kills: G.kills, hp: Math.round(P.hp), maxHp: P.maxHp, minHp: Math.round(minHp), wall: Math.round(G.wallHp), minWall: Math.round(minWall),
    failed: G.failed, reason: G.failReason, cleared: G.cleared, bossT, bossHp: G.boss ? Math.round(bossHpFrac(G.boss) * 100) : null, alive: EN.count, coins: Math.round(G.coinsRun),
    build: P.weapons.map(w => (w.evo || w.id) + w.lv).join(',') + ' | ' + Object.entries(P.passives).map(e => e.join('')).join(','), lvlAt, ms: Math.round(performance.now() - t0),
    dmg: Object.fromEntries(Object.entries(G.dmgBy).map(([k, v]) => [k, Math.round(v)])), taken: Object.fromEntries(Object.entries(G.dmgTaken).map(([k, v]) => [k, Math.round(v)])), hpAt, witness: G.witLog, log: G.dmgLog,
  };
  G.sim = false; G.autoplay = false;
  return res;
}
window.__moshou = {
  G, P, EN, SAVE, World, R, CS, UI, IN,
  sim: simRun,
  snap: snapshotBuild,
  campaign(diff, tries, policy, workshop) {
    const out = []; let snap = null;
    const savedCleared = Object.assign({}, SAVE.data.cleared), savedWs = SAVE.data.workshop;
    SAVE.data.cleared = {};
    SAVE.data.workshop = workshop || {};
    for (const S of STAGES) {
      let r, k = 0; const fails = [];
      do {
        r = simRun(S.id, S.dur + 240, { snapshot: snap ? JSON.parse(JSON.stringify(snap)) : null, diff, policy }); k++;
        if (!r.cleared) fails.push(r.reason + '@' + r.t + ' lv' + r.level + ' wall' + r.wall + ' boss' + r.bossHp);
      } while (!r.cleared && k < (tries || 3));
      out.push({ day: S.id, tries: k, fails, t: r.t, lv: r.level, kills: r.kills, hp: r.hp + '/' + r.maxHp, minHp: r.minHp, wall: r.wall, minWall: r.minWall, cleared: r.cleared, why: r.reason, bossT: r.bossT, bossHp: r.bossHp, build: r.build, taken: r.taken, dmg: r.dmg, wit: r.witness });
      if (!r.cleared) break;
      SAVE.data.cleared[S.id] = true;
      snap = snapshotBuild();
    }
    SAVE.data.cleared = savedCleared; SAVE.data.workshop = savedWs;
    return out;
  },
  start(stageId, opts) {
    opts = opts || {};
    AU.init();
    G.diff = opts.diff || 'normal';
    startStage(stageId, { snapshot: opts.snapshot || null });
    CAM.x = P.x; CAM.z = P.z;
    if (opts.t) { G.t = opts.t; G.eventIdx = G.stage.events.findIndex(e => e.t >= opts.t); if (G.eventIdx < 0) G.eventIdx = G.stage.events.length; }
    G.mode = 'play'; UI.clear(); UI.hud(true);
    if (opts.god) G.god = true;
    if (opts.auto) G.autoplay = true;
  },
  advance(seconds, noRender) {
    const dt = 1 / 30, n = Math.round(seconds / dt);
    G.sim = true;
    for (let s = 0; s < n; s++) {
      G.time += dt; simStep(dt);
      autoResolvePending();
    }
    G.sim = false;
    updateGameCamera(1);
  },
  boss() { G.t = G.dur; G.eventIdx = G.stage.events.length - 1; },
  ending: playEndingScene, title: goTitle, map: goMap, newGame: startCampaign, day: startDay,
  win() {
    if (G.mode === 'levelup' || G.mode === 'chest') { G.pendingLevels = 0; G.pendingChests = 0; G.mode = 'play'; UI.clear(); }
    if (!G.boss) { const ev = G.stage.events[G.stage.events.length - 1]; G.t = G.dur; G.eventIdx = G.stage.events.length; startBoss(ev.id); }
    EN.hp[G.boss.main] = 0;
  },
  mode() { return G.mode; },
  clearNow() { G.cleared = true; G.boss = null; stageClear(); },
  scene(id) { World.build(G.stage ? G.stage.id : 's1'); CS.cam = null; CS.play(STORY[id], () => goTitle()); },
};

boot();

})();
