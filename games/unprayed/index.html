/* 斷香 UNPRAYED — layout: full-bleed WebGL stage under ink-and-cinnabar overlays */
:root {
  --ink: #0e0c0b; --ink2: #1a1614; --ink3: #251f1b;
  --panel: rgba(20, 16, 14, 0.94); --panel2: rgba(34, 27, 23, 0.96);
  --paper: #efe4cc; --paper-dim: #b8aa8f; --paper-faint: rgba(239, 228, 204, 0.55);
  --line: rgba(239, 228, 204, 0.16); --line2: rgba(226, 178, 76, 0.38);
  --cinnabar: #c8382b; --cinnabar-deep: #8e1f19; --gold: #e2b24c; --gold-dim: #9a7a35; --ember: #ff8a3d;
  --fire: #ff7a3a; --thunder: #a98bff; --water: #4fc3d9; --seal: #f2d16b; --paperE: #e9e2d0;
  --f-display: "DXDisplay", "Noto Serif TC", "Noto Serif CJK TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC", "PMingLiU", "Microsoft JhengHei", serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
#gl, #hud2d, #touch, #scene, .modal, .act { touch-action: none; }
button { font-family: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#gl, #hud2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud2d { pointer-events: none; }
#touch { position: absolute; inset: 0; touch-action: none; }
#app:not(.in-run) #touch { pointer-events: none; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 75% at 50% 48%, transparent 55%, rgba(5, 3, 3, 0.62) 100%); }
#hurtfx { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 45%, rgba(200, 30, 20, 0.6) 100%); transition: opacity 0.35s; }
#ultfx { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse 85% 75% at 50% 50%, transparent 50%, rgba(255, 190, 70, 0.35) 100%); transition: opacity 0.4s; }
#ultfx.on { opacity: 1; animation: ultpulse 0.9s ease-in-out infinite alternate; }
@keyframes ultpulse { from { filter: brightness(0.9); } to { filter: brightness(1.25); } }
.layer { position: absolute; inset: 0; pointer-events: none; }
.layer > * { pointer-events: auto; }
[hidden] { display: none !important; }

/* ---------- shared pieces ---------- */
.seal { --c: var(--paperE); display: inline-grid; place-items: center; width: 2.4em; height: 2.4em; border-radius: 0.32em; background: #1b1512; background: color-mix(in srgb, var(--c) 22%, #1b1512); border: 1.5px solid var(--c); border-color: color-mix(in srgb, var(--c) 75%, transparent); color: var(--c); font-family: var(--f-display); font-weight: 900; font-size: 1em; line-height: 1; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.35); flex: none; }
.seal.round { border-radius: 50%; }
.seal.evo { background: radial-gradient(circle at 50% 40%, #f6d77a, #b7861f); color: #3a1806; border-color: #ffe9a8; box-shadow: 0 0 14px rgba(255, 210, 110, 0.6); }
.seal.pact { --c: #ff6b5b; }
.el-fire { --c: var(--fire); } .el-thunder { --c: var(--thunder); } .el-water { --c: var(--water); } .el-seal { --c: var(--seal); } .el-paper { --c: var(--paperE); }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 46px; padding: 0 1.3em; border-radius: 6px; font-weight: 700; font-size: 1rem; letter-spacing: 0.12em; color: var(--paper); background: linear-gradient(180deg, #2e2420, #1c1613); border: 1px solid var(--line2); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); transition: transform 0.08s, filter 0.15s; }
.btn:active { transform: translateY(1px) scale(0.98); }
.btn.primary { background: linear-gradient(180deg, #d24434, #94231a); border-color: #ff9a7a; color: #fff4e4; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4); }
.btn.gold { background: linear-gradient(180deg, #e8bd5a, #a77a22); border-color: #ffe4a0; color: #2a1606; }
.btn.ghost { background: rgba(20, 16, 14, 0.6); border-color: var(--line); }
.btn[disabled] { filter: grayscale(0.8) brightness(0.6); pointer-events: none; }
.panel { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.32em; color: var(--gold); }
.muted { color: var(--paper-dim); }
.tnum { font-variant-numeric: tabular-nums; }
.close-x { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; font-size: 1.3rem; color: var(--paper-dim); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); }

/* ---------- title ---------- */
#title { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; padding: calc(var(--sat) + 4vh) 16px calc(var(--sab) + 28px); background: linear-gradient(180deg, rgba(10, 8, 7, 0.15), rgba(10, 8, 7, 0) 40%, rgba(10, 8, 7, 0.75) 100%); pointer-events: auto; }
.title-wrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 14px; text-align: center; }
.title-mark { position: relative; font-family: var(--f-display); font-weight: 900; font-size: clamp(5.4rem, 31vw, 11rem); line-height: 0.92; writing-mode: vertical-rl; letter-spacing: 0.04em; color: #f4ead6; text-shadow: 0 0 30px rgba(255, 160, 80, 0.35), 0 4px 0 rgba(0, 0, 0, 0.6); animation: titleIn 1.6s cubic-bezier(.2, .8, .2, 1) both; }
.title-mark .crack { color: transparent; -webkit-text-stroke: 1.5px rgba(255, 210, 150, 0.85); position: absolute; inset: 0; clip-path: polygon(0 52%, 100% 44%, 100% 47%, 0 55%); text-shadow: none; }
.title-seal { position: absolute; right: -0.85em; bottom: 0.2em; writing-mode: horizontal-tb; font-size: 0.16em; line-height: 1.05; padding: 0.35em 0.3em; color: #fff3e0; background: var(--cinnabar); border-radius: 4px; letter-spacing: 0; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.3); transform: rotate(-4deg); }
.title-en { font-family: var(--f-body); font-weight: 600; letter-spacing: 0.62em; font-size: 0.82rem; color: var(--gold); margin-right: -0.62em; animation: fadeUp 1.4s 0.5s both; }
.title-tag { font-size: 1.02rem; letter-spacing: 0.22em; color: var(--paper); text-shadow: 0 2px 8px #000; animation: fadeUp 1.4s 0.9s both; }
.title-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: fadeUp 1.2s 1.2s both; }
.title-actions .btn.primary { min-width: 220px; min-height: 56px; font-size: 1.18rem; letter-spacing: 0.4em; padding-left: 1.7em; }
.title-foot { font-size: 0.72rem; color: var(--paper-dim); letter-spacing: 0.1em; text-align: center; }
@keyframes titleIn { from { opacity: 0; filter: blur(8px); transform: translateY(14px) scale(1.04); } to { opacity: 1; filter: none; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- story scenes ---------- */
#scene { background: #000; pointer-events: auto; }
#sceneCv { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px max(20px, var(--sal)) calc(var(--sab) + 34px); background: linear-gradient(0deg, rgba(0, 0, 0, 0.92) 55%, rgba(0, 0, 0, 0)); text-align: center; }
.scene-speaker { font-size: 0.8rem; letter-spacing: 0.35em; color: var(--gold); min-height: 1.2em; margin-bottom: 8px; }
.scene-line { font-size: clamp(1.12rem, 4.8vw, 1.5rem); line-height: 1.85; letter-spacing: 0.08em; white-space: pre-line; max-width: 30em; margin: 0 auto; min-height: 3.7em; text-shadow: 0 2px 10px #000; }
.scene-tap { margin-top: 12px; font-size: 0.72rem; letter-spacing: 0.3em; color: var(--paper-dim); animation: blink 1.6s ease-in-out infinite; }
.scene-skip { position: absolute; top: calc(var(--sat) + 12px); right: 14px; min-height: 38px; font-size: 0.82rem; padding: 0 14px; }
@keyframes blink { 50% { opacity: 0.3; } }

/* ---------- hub ---------- */
#hub { position: absolute; inset: 0; pointer-events: none; }
.hub-top { position: absolute; top: calc(var(--sat) + 10px); left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.hub-name { font-family: var(--f-display); font-weight: 900; font-size: 1.5rem; letter-spacing: 0.12em; text-shadow: 0 2px 10px #000; }
.hub-name small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.24em; color: var(--paper-dim); margin-top: 2px; }
.merit-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(15, 12, 10, 0.78); border: 1px solid var(--line2); font-weight: 700; pointer-events: auto; }
.merit-chip .seal { width: 1.9em; height: 1.9em; font-size: 0.82rem; }
.hub-menu { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(var(--sab) + 18px); display: grid; gap: 10px; background: linear-gradient(0deg, rgba(8, 6, 5, 0.95) 60%, rgba(8, 6, 5, 0)); pointer-events: auto; }
.hub-menu .btn.primary { min-height: 58px; font-size: 1.15rem; letter-spacing: 0.3em; }
.hub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.hub-grid .btn { min-height: 62px; padding: 6px 4px; flex-direction: column; gap: 3px; font-size: 0.82rem; letter-spacing: 0.08em; }
.hub-grid .btn .seal { width: 1.8em; height: 1.8em; font-size: 0.9rem; }
.badge-dot { position: absolute; top: 6px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--cinnabar); box-shadow: 0 0 6px var(--cinnabar); }

/* dialogue box */
#dialog { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px calc(var(--sab) + 14px); pointer-events: auto; }
.dlg-box { position: relative; padding: 16px 18px 18px; min-height: 128px; background: linear-gradient(180deg, rgba(30, 24, 20, 0.96), rgba(16, 12, 10, 0.97)); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5); }
.dlg-name { position: absolute; top: -15px; left: 16px; padding: 4px 14px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.25em; background: var(--cinnabar); color: #fff3e4; border-radius: 4px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4); }
.dlg-name.narr { display: none; }
.dlg-text { font-size: 1.04rem; line-height: 1.8; letter-spacing: 0.05em; min-height: 3.6em; }
.dlg-next { position: absolute; right: 14px; bottom: 8px; font-size: 0.72rem; color: var(--gold); animation: blink 1.4s infinite; }
.dlg-skip { position: absolute; right: 10px; top: -40px; min-height: 32px; font-size: 0.75rem; padding: 0 12px; }

/* ---------- full-screen sheets (codex, merit, lore, settings, prep, results) ---------- */
.sheet { position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(10, 8, 7, 0.97); pointer-events: auto; padding-top: var(--sat); }
.sheet-head { position: relative; padding: 16px 64px 10px 18px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 900; font-size: 1.55rem; letter-spacing: 0.14em; }
.sheet-head p { margin: 4px 0 0; font-size: 0.82rem; color: var(--paper-dim); line-height: 1.6; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px calc(var(--sab) + 24px); touch-action: pan-y; }
.sheet-foot { padding: 12px 16px calc(var(--sab) + 14px); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.sheet-foot .btn { flex: 1; }
.tabs { display: flex; gap: 6px; padding: 10px 16px 0; overflow-x: auto; }
.tab { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 0.86rem; letter-spacing: 0.1em; border: 1px solid var(--line); color: var(--paper-dim); }
.tab.on { border-color: var(--gold); color: var(--ink); background: var(--gold); font-weight: 700; }
.grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.entry { position: relative; display: flex; gap: 10px; align-items: flex-start; padding: 12px; min-width: 0; border-radius: 8px; background: var(--ink2); border: 1px solid var(--line); text-align: left; }
.entry .seal { font-size: 1.05rem; }
.entry h4 { margin: 0; font-size: 1rem; letter-spacing: 0.08em; }
.entry .sub { font-size: 0.72rem; color: var(--paper-dim); letter-spacing: 0.06em; margin-top: 2px; }
.entry.locked { opacity: 0.55; }
.entry.locked .seal { filter: grayscale(1); }
.detail { margin-top: 14px; padding: 16px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line2); }
.detail h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: 1.35rem; letter-spacing: 0.1em; }
.detail .wish { margin: 10px 0 0; font-size: 0.9rem; color: var(--paper-dim); line-height: 1.8; font-style: italic; }
.detail p { line-height: 1.8; margin: 8px 0 0; font-size: 0.95rem; }
.detail .row { display: flex; gap: 12px; align-items: center; }
.lv-list { margin: 8px 0 0; padding-left: 1.2em; font-size: 0.88rem; line-height: 1.8; color: var(--paper); }
.cost { display: inline-flex; align-items: center; gap: 4px; color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.merit-item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 8px; background: var(--ink2); border: 1px solid var(--line); }
.merit-item + .merit-item { margin-top: 8px; }
.merit-item h4 { margin: 0; font-size: 1rem; }
.merit-item p { margin: 3px 0 0; font-size: 0.8rem; line-height: 1.6; color: var(--paper-dim); }
.merit-item .btn { min-height: 40px; padding: 0 12px; font-size: 0.86rem; letter-spacing: 0.04em; }
.owned-tag { font-size: 0.78rem; color: var(--paper-dim); letter-spacing: 0.1em; }
.section-t { margin: 18px 0 10px; font-size: 0.8rem; letter-spacing: 0.3em; color: var(--gold); }
.section-t:first-child { margin-top: 2px; }

/* prep */
.weapon-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.weapon { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px 12px; border-radius: 10px; background: var(--ink2); border: 1.5px solid var(--line); text-align: center; min-width: 0; }
.weapon.on { border-color: var(--gold); background: linear-gradient(180deg, #33281c, #1c1511); box-shadow: 0 0 0 1px var(--gold) inset; }
.weapon.locked { opacity: 0.5; }
.weapon .seal { font-size: 1.3rem; }
.weapon b { font-size: 0.98rem; letter-spacing: 0.1em; }
.weapon small { font-size: 0.68rem; color: var(--paper-dim); line-height: 1.45; }
.wdesc { margin-top: 10px; padding: 12px 14px; border-radius: 8px; background: var(--panel2); font-size: 0.9rem; line-height: 1.75; }
.heat-list { display: grid; gap: 8px; }
.heat { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 8px; background: var(--ink2); border: 1px solid var(--line); text-align: left; }
.heat.on { border-color: var(--cinnabar); background: linear-gradient(90deg, rgba(200, 56, 43, 0.25), var(--ink2)); }
.heat b { font-size: 0.98rem; letter-spacing: 0.1em; }
.heat span { font-size: 0.8rem; color: var(--paper-dim); }
.heat i { font-style: normal; width: 22px; height: 22px; border-radius: 4px; border: 1.5px solid var(--line2); display: grid; place-items: center; color: #fff; flex: none; }
.heat.on i { background: var(--cinnabar); border-color: #ff9a7a; }
.heat-sum { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 0; font-size: 0.85rem; color: var(--paper-dim); }
.heat-sum b { color: var(--cinnabar); font-size: 1.2rem; font-family: var(--f-display); }

/* ---------- in-run HUD ---------- */
#hud { pointer-events: none; }
#hud > * { pointer-events: none; }
.hud-top { position: absolute; top: calc(var(--sat) + 8px); left: 10px; right: 10px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
.hp-wrap { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.hp-row { display: flex; align-items: center; gap: 8px; }
.lvl { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 0.95rem; color: #2a1606; background: radial-gradient(circle at 50% 35%, #f7d987, #b5862a); border: 1.5px solid #ffe6a6; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }
.bars { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 260px; }
.hpbar { position: relative; height: 14px; border-radius: 7px; background: rgba(10, 6, 5, 0.75); border: 1px solid rgba(255, 200, 150, 0.25); overflow: hidden; }
.hpbar .fill { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, #8e1f19, #d8402f 70%, #ff9a5a); transition: transform 0.15s; }
.hpbar .lag { position: absolute; inset: 0; transform-origin: left; background: rgba(255, 230, 200, 0.55); transition: transform 0.6s 0.15s; }
.hpbar .tip { position: absolute; top: -3px; width: 10px; height: 20px; margin-left: -5px; background: radial-gradient(circle, #fff3c0, #ff8a3d 45%, rgba(255, 120, 40, 0) 70%); transition: left 0.15s; }
.hpbar .txt { position: absolute; right: 6px; top: -1px; font-size: 0.68rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.xpbar { height: 5px; border-radius: 3px; background: rgba(10, 6, 5, 0.75); overflow: hidden; }
.xpbar .fill { height: 100%; transform-origin: left; background: linear-gradient(90deg, #a77a22, #f2cf6b); transition: transform 0.2s; }
.slots { display: flex; gap: 3px; flex-wrap: nowrap; padding-left: 2px; }
.slot { position: relative; width: 25px; height: 25px; font-size: 0.7rem; flex: none; }
.slot .seal { width: 25px; height: 25px; font-size: 0.74rem; border-radius: 5px; }
.slot .seal.round { border-radius: 50%; }
.slot .pips { position: absolute; left: 0; right: 0; bottom: -5px; display: flex; justify-content: center; gap: 2px; }
.slot .pips i { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 3px #000; }
.slot .cd { position: absolute; inset: 0; border-radius: 5px; background: conic-gradient(rgba(0, 0, 0, 0.62) var(--p, 0%), transparent 0); }
.slot.empty .seal { opacity: 0.25; }
.debt { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 700; color: var(--gold); padding-left: 2px; margin-top: 4px; text-shadow: 0 1px 2px #000; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pause-btn { pointer-events: auto !important; width: 42px; height: 42px; border-radius: 50%; background: rgba(15, 12, 10, 0.7); border: 1px solid var(--line2); display: grid; place-items: center; }
.pause-btn i { display: block; width: 12px; height: 14px; border-left: 4px solid var(--paper); border-right: 4px solid var(--paper); }
.stage-chip { text-align: right; font-size: 0.72rem; color: var(--paper-dim); letter-spacing: 0.12em; text-shadow: 0 1px 3px #000; }
.stage-chip b { display: block; color: var(--paper); font-size: 0.86rem; letter-spacing: 0.2em; }
.kills { font-variant-numeric: tabular-nums; }

/* boss bar */
.bossbar { position: absolute; top: calc(var(--sat) + 96px); left: 50%; transform: translateX(-50%); width: min(92vw, 520px); text-align: center; }
.bossbar .bname { font-family: var(--f-display); font-weight: 900; font-size: 1.02rem; letter-spacing: 0.3em; text-shadow: 0 2px 6px #000, 0 0 12px rgba(255, 150, 60, 0.4); }
.bossbar .bname small { font-family: var(--f-body); font-weight: 600; font-size: 0.7rem; letter-spacing: 0.2em; color: var(--gold); margin-left: 6px; }
.bbar { position: relative; height: 10px; margin-top: 5px; border-radius: 2px; background: rgba(10, 6, 5, 0.8); border: 1px solid rgba(255, 210, 140, 0.45); overflow: hidden; }
.bbar .fill { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, #b5862a, #f2cf6b, #fff0b8); transition: transform 0.12s; }
.bbar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(0, 0, 0, 0.8); }
.pbar { height: 5px; margin: 3px auto 0; width: 70%; border-radius: 3px; background: rgba(10, 6, 5, 0.8); overflow: hidden; }
.pbar .fill { height: 100%; transform-origin: left; background: linear-gradient(90deg, #d8b04a, #fff2c2); transition: transform 0.12s; }
.pbar.broken .fill { background: #ffd56a; animation: blink 0.4s infinite; }
.bstate { margin-top: 4px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.2em; color: #ffd56a; text-shadow: 0 1px 4px #000; min-height: 1.1em; }
.elitebars { position: absolute; top: calc(var(--sat) + 96px); left: 50%; transform: translateX(-50%); width: min(92vw, 520px); display: grid; gap: 6px; }

/* barks / subtitles */
.bark { position: absolute; left: 50%; top: calc(var(--sat) + 178px); transform: translateX(-50%); width: min(88vw, 440px); text-align: center; padding: 6px 12px; border-radius: 8px; background: rgba(10, 8, 7, 0.55); border: 1px solid rgba(255, 210, 140, 0.18); font-size: 0.9rem; line-height: 1.55; letter-spacing: 0.06em; opacity: 0; transition: opacity 0.4s; }
.bark.on { opacity: 1; }
.bark b { display: block; font-size: 0.7rem; letter-spacing: 0.3em; color: var(--gold); margin-bottom: 2px; }
.bark.soul { border-color: rgba(160, 210, 255, 0.4); }
.bark.soul b { color: #bfe0ff; }

/* big banners */
.banner { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.banner .inner { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 28px; animation: bannerIn 0.6s cubic-bezier(.2, .9, .2, 1) both; }
.banner.out .inner { animation: bannerOut 0.6s ease-in both; }
.banner .num { font-size: 0.82rem; letter-spacing: 0.6em; color: var(--gold); margin-right: -0.6em; }
.banner .big { font-family: var(--f-display); font-weight: 900; font-size: clamp(3rem, 15vw, 5rem); letter-spacing: 0.18em; margin-right: -0.18em; text-shadow: 0 0 24px rgba(255, 140, 60, 0.45), 0 4px 0 #000; }
.banner .line { font-size: 0.98rem; letter-spacing: 0.2em; color: var(--paper); text-shadow: 0 2px 6px #000; }
.banner .rule { width: 160px; height: 2px; background: linear-gradient(90deg, transparent, var(--cinnabar), transparent); }
.banner.boss .big { font-size: clamp(2.2rem, 10.5vw, 3.6rem); letter-spacing: 0.1em; margin-right: -0.1em; }
.banner.boss .inner { background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0) 70%); padding: 40px 30px; }
.banner.warn .big { color: #ffd56a; font-size: clamp(3rem, 16vw, 5.4rem); }
@keyframes bannerIn { from { opacity: 0; transform: scale(1.18); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes bannerOut { to { opacity: 0; transform: scale(0.96); filter: blur(4px); } }
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 70px); transform: translateX(-50%); padding: 6px 18px; border-radius: 999px; font-weight: 700; letter-spacing: 0.3em; background: rgba(10, 8, 7, 0.8); border: 1px solid currentColor; animation: toastIn 2.2s ease both; white-space: nowrap; }
@keyframes toastIn { 0% { opacity: 0; transform: translate(-50%, -8px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.hint { position: absolute; left: 50%; bottom: calc(var(--sab) + 170px); transform: translateX(-50%); width: min(86vw, 360px); padding: 10px 14px; border-radius: 10px; text-align: center; font-size: 0.92rem; line-height: 1.6; background: rgba(15, 12, 10, 0.86); border: 1px solid var(--line2); animation: toastIn 4.2s ease both; }

/* action buttons */
.actions { position: absolute; right: calc(var(--sar) + 16px); bottom: calc(var(--sab) + 26px); display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; }
#app.lefty .actions { right: auto; left: calc(var(--sal) + 16px); }
.act { pointer-events: auto !important; position: relative; display: grid; place-items: center; border-radius: 50%; font-family: var(--f-display); font-weight: 900; color: var(--paper); touch-action: none; }
.act-ult { width: 64px; height: 64px; font-size: 1.5rem; background: radial-gradient(circle at 50% 40%, #3a2c1a, #1a1410); border: 2px solid rgba(226, 178, 76, 0.4); }
.act-ult svg { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); }
.act-ult.ready { color: #2a1606; background: radial-gradient(circle at 50% 35%, #ffe7a0, #d39a2c); border-color: #fff0c0; animation: ready 1s ease-in-out infinite alternate; }
@keyframes ready { from { box-shadow: 0 0 10px rgba(255, 200, 90, 0.5); } to { box-shadow: 0 0 28px rgba(255, 210, 110, 0.95); } }
.act-dash { width: 86px; height: 86px; font-size: 2rem; background: radial-gradient(circle at 50% 38%, rgba(70, 80, 110, 0.85), rgba(20, 22, 32, 0.9)); border: 2px solid rgba(170, 200, 255, 0.5); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5); }
.act-dash:active, .act-dash.press { transform: scale(0.94); }
.act-dash .pips { position: absolute; bottom: -10px; display: flex; gap: 4px; }
.act-dash .pips i { width: 10px; height: 4px; border-radius: 2px; background: #9fc4ff; box-shadow: 0 0 4px #9fc4ff; }
.act-dash .pips i.off { background: rgba(160, 190, 255, 0.2); box-shadow: none; }

/* ---------- level-up (求籤) ---------- */
.modal { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--sat) + 12px) 12px calc(var(--sab) + 12px); background: rgba(6, 4, 3, 0.78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); pointer-events: auto; animation: fadeIn 0.25s both; }
@keyframes fadeIn { from { opacity: 0; } }
.lv-head { text-align: center; margin-bottom: 10px; }
.lv-head .eyebrow { display: block; }
.lv-head h2 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 900; font-size: 2rem; letter-spacing: 0.4em; margin-right: -0.4em; }
.build { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 12px; max-width: 420px; }
.build .seal { width: 30px; height: 30px; font-size: 0.82rem; }
.build .lv { position: relative; }
.build .lv b { position: absolute; right: -4px; bottom: -4px; font-size: 0.6rem; background: var(--ink); border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 6px; padding: 0 3px; line-height: 1.3; }
.build .sep { width: 1px; background: var(--line); margin: 0 4px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(100%, 560px); }
.qian { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 0 7px 12px; border-radius: 10px 10px 4px 4px; text-align: center; background: linear-gradient(180deg, #f1e2bd, #dcc792); color: #2b1b10; border: 2px solid #a8823c; box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55), inset 0 0 0 3px rgba(255, 255, 255, 0.25); transition: transform 0.18s, box-shadow 0.18s; animation: drawQian 0.5s cubic-bezier(.2, .9, .2, 1) both; }
.qian:nth-child(2) { animation-delay: 0.07s; } .qian:nth-child(3) { animation-delay: 0.14s; }
@keyframes drawQian { from { opacity: 0; transform: translateY(40px) rotate(-3deg); } to { opacity: 1; transform: none; } }
.qian .rank { width: calc(100% + 14px); padding: 6px 0 5px; border-radius: 8px 8px 0 0; font-family: var(--f-display); font-weight: 900; font-size: 0.86rem; letter-spacing: 0.3em; color: #fff3e0; background: var(--cinnabar); }
.qian.r-top .rank { background: linear-gradient(90deg, #b5862a, #f2cf6b, #b5862a); color: #3a1806; }
.qian.r-low .rank { background: #4a3a30; }
.qian .seal { width: 2.7rem; height: 2.7rem; font-size: 1.2rem; margin-top: 4px; }
.qian h3 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 1.08rem; letter-spacing: 0.08em; line-height: 1.25; }
.qian .kind { font-size: 0.66rem; letter-spacing: 0.14em; color: #7a5a30; font-weight: 700; }
.qian .stars { color: #b5862a; letter-spacing: 1px; font-size: 0.82rem; line-height: 1; }
.qian .info { font-size: 0.74rem; line-height: 1.55; color: #3a2a1a; text-align: left; }
.qian .wish { font-size: 0.66rem; line-height: 1.5; color: #7a6040; font-style: italic; text-align: left; }
.qian .combo { font-size: 0.66rem; line-height: 1.45; color: #8e1f19; font-weight: 700; text-align: left; width: 100%; }
.qian.sel { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 0 3px #ffe08a, 0 16px 30px rgba(0, 0, 0, 0.7); }
.qian.banmode { filter: sepia(0.2) brightness(0.9); }
.qian.banmode::after { content: '棄'; position: absolute; inset: 30% 20%; display: grid; place-items: center; font-family: var(--f-display); font-size: 2.6rem; color: rgba(142, 31, 25, 0.75); border: 3px solid rgba(142, 31, 25, 0.75); border-radius: 10px; transform: rotate(-12deg); }
.lv-actions { display: flex; gap: 8px; margin-top: 14px; width: min(100%, 560px); }
.lv-actions .btn { flex: 1; min-height: 50px; font-size: 0.92rem; letter-spacing: 0.1em; padding: 0 8px; }
.lv-actions .btn.primary { flex: 1.6; font-size: 1.05rem; letter-spacing: 0.25em; }
.lv-actions .btn.on { border-color: var(--cinnabar); color: #ffb0a0; }

/* crossroads */
.cross-list { display: grid; gap: 10px; width: min(100%, 440px); }
.cross { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 10px; text-align: left; background: var(--panel2); border: 1px solid var(--line2); animation: drawQian 0.45s both; }
.cross .seal { font-size: 1.4rem; width: 2.6em; height: 2.6em; --c: var(--gold); }
.cross b { display: block; font-family: var(--f-display); font-size: 1.15rem; letter-spacing: 0.15em; }
.cross i { display: block; font-style: normal; font-size: 0.8rem; color: var(--paper-dim); margin-top: 2px; }
.cross span { display: block; font-size: 0.9rem; margin-top: 6px; line-height: 1.55; }

/* pause, results */
.pause-box { width: min(100%, 360px); padding: 22px 18px 18px; display: grid; gap: 10px; text-align: center; }
.pause-box h2 { margin: 0 0 6px; font-family: var(--f-display); font-size: 1.7rem; letter-spacing: 0.4em; margin-right: -0.4em; }
.pause-build { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 6px; }
.res-wrap { width: min(100%, 440px); max-height: 100%; overflow-y: auto; padding: 22px 18px 18px; text-align: center; }
.res-title { font-family: var(--f-display); font-weight: 900; font-size: 2.6rem; letter-spacing: 0.3em; margin: 6px -0.3em 4px 0; }
.res-title.win { color: #ffd56a; text-shadow: 0 0 20px rgba(255, 200, 90, 0.4); }
.res-sub { font-size: 0.9rem; color: var(--paper-dim); letter-spacing: 0.1em; }
.res-merit { margin: 16px auto 4px; display: inline-flex; align-items: baseline; gap: 10px; padding: 10px 20px; border-radius: 10px; background: linear-gradient(180deg, rgba(226, 178, 76, 0.2), rgba(226, 178, 76, 0.05)); border: 1px solid var(--line2); }
.res-merit b { font-family: var(--f-display); font-size: 2.2rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0; }
.stat { padding: 8px 4px; border-radius: 8px; background: var(--ink2); border: 1px solid var(--line); }
.stat b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.68rem; color: var(--paper-dim); letter-spacing: 0.1em; }
.unlock-note { margin: 8px 0; padding: 10px; border-radius: 8px; font-size: 0.86rem; background: rgba(200, 56, 43, 0.16); border: 1px solid rgba(200, 56, 43, 0.5); }

/* settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row label { font-size: 0.95rem; }
.set-row small { display: block; font-size: 0.74rem; color: var(--paper-dim); margin-top: 2px; }
.set-row input[type=range] { width: 46%; accent-color: var(--gold); }
.toggle { position: relative; width: 50px; height: 28px; border-radius: 14px; background: #3a302a; border: 1px solid var(--line); flex: none; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper-dim); transition: left 0.15s; }
.toggle.on { background: var(--cinnabar); }
.toggle.on::after { left: 24px; background: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.seg button { min-height: 34px; padding: 0 10px; font-size: 0.85rem; white-space: nowrap; }
.seg button.on { background: var(--gold); color: var(--ink); font-weight: 700; }
.codebox { width: 100%; min-height: 70px; margin-top: 8px; padding: 10px; border-radius: 8px; background: var(--ink); color: var(--paper); border: 1px solid var(--line); font-family: ui-monospace, Menlo, monospace; font-size: 0.7rem; word-break: break-all; user-select: text; -webkit-user-select: text; }

/* transitions */
#smoke { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 60%, #2a2422, #0d0a09); transition: opacity 0.7s; }
#smoke.on { opacity: 1; pointer-events: auto; }
#deathfx { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity 1.2s; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.85)); }
#deathfx.on { opacity: 1; }
#deathfx div { font-family: var(--f-display); font-weight: 900; font-size: clamp(2.6rem, 13vw, 4rem); letter-spacing: 0.5em; margin-right: -0.5em; color: #e9dcc0; text-shadow: 0 0 20px rgba(255, 120, 60, 0.35); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); z-index: 50; transition: opacity 0.6s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .ember { width: 6px; height: 6px; border-radius: 50%; background: #ffb060; box-shadow: 0 0 12px 4px rgba(255, 140, 60, 0.6); animation: blink 1s infinite; }
#loading p { margin-top: 14px; font-size: 0.8rem; letter-spacing: 0.4em; color: var(--paper-dim); }
.err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--ink); z-index: 60; line-height: 1.8; }

@media (min-width: 760px) {
  .sheet-head, .sheet-body, .sheet-foot, .tabs { width: 100%; max-width: 680px; margin-left: auto; margin-right: auto; box-sizing: border-box; }
  .dlg-box { max-width: 720px; margin: 0 auto; }
  #dialog { display: flex; flex-direction: column; align-items: stretch; }
  .dlg-skip { right: calc(50% - 350px); }
}
@media (min-width: 720px) {
  .hub-menu { left: 50%; right: auto; transform: translateX(-50%); width: 520px; background: none; }
  .bossbar, .elitebars { top: calc(var(--sat) + 70px); }
  .bark { top: calc(var(--sat) + 150px); }
}
@media (max-height: 640px) {
  .qian .wish { display: none; }
  .title-mark { font-size: clamp(4rem, 20vh, 8rem); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

「這筆帳，你算不過我。」`,speaker:"bai"},{art:"death",text:`魏子葳死在第九十九級台階上。
他的妹妹，被抬進了香雲裡。`},{art:"incense",text:"然後，有人為他點了一炷香。"}],Ds=[{id:"intro",when:t=>!t.flags.intro,lines:[["po","醒啦？……嘖，糊紙紮的就是不一樣，燒起來味道特別重。"],["wei","……這是哪？"],["po","「一炷香」，我的香舖。你死了，小子。別緊張，死人我見多了。"],["po","不過有人給你燒香——我。一天一炷，最便宜的那種。"],["po","香不斷，人就散不了。拜的人多了，你就是神；只剩我一個瞎老太婆拜你嘛……你算是個很小、很小的神。"],["wei","漪呢？"],["po","上去了。（她用拐杖指了指天花板，又好像指得更高）敕封院要把她放在香雲裡煉四十九天，煉成新的水娘娘。"],["po","要上去，得先過紙城。人燒給死人的東西都在那兒——紙錢、紙馬、紙人。還有神。"],["wei","神擋，就殺神。"],["po","好大的口氣。去吧，死了就回來，我這炷香還燒得起。"]],flag:"intro",tutorial:!0},{id:"win1",when:(t,e)=>e&&e.win&&!t.flags.win1,lines:[["po","……你身上沒有銅臭了。"],["wei","他最後跟我說了句話。"],["po","說什麼？"],["wei","他說：「原來，是這兩個字啊。」"],["po","（沉默了很久）……那你跟他說了什麼？"],["wei","謝謝。"],["po","……嗯。這兩個字，八十年沒人跟他說過了。"],["po","下一座殿是河。你妹妹以前救人的那條河。"],["po","香重了，路就難走。要是還想再上去一趟，給周濟公送送行——（她從櫃台底下摸出一把更粗的香）——就燒這個。"]],flag:"win1",unlockHeat:!0},{id:"death1",when:(t,e)=>e&&!e.win&&!t.flags.death1,lines:[["po","回來啦？香灰還熱著呢。"],["wei","我被一群紙人圍死了。紙人。我自己糊了十年的東西。"],["po","你糊的是給死人用的。上面那些，是給神用的，不一樣。"],["po","記著：你在上面每撿一點香灰，就是撿了一個人的願。願撿多了，你就會變強——可你也會越來越像神。"],["wei","像神不好嗎？"],["po","（笑）你上去看看那些神，再回來問我。"]],flag:"death1"},{id:"general",when:(t,e)=>e&&!e.win&&e.killedBy==="general"&&!t.flags.general,lines:[["wei","有個紙紮的將軍，背著四面旗。"],["po","那是給大戶人家出殯開路的。活人花大錢糊他，就為了在死人面前爭一口氣。"],["po","你打不過他不丟人——他身上扛著十幾戶人家的面子。"],["po","不過面子這種東西，紙糊的。他衝過來的時候是一條直線，你往旁邊一閃，面子就摔在地上了。"]],flag:"general"},{id:"twins",when:(t,e)=>e&&!e.win&&e.killedBy==="twins"&&!t.flags.twins,lines:[["wei","一對紙童，一個金的，一個綠的。綠的一直在補金的。"],["po","金童玉女，送葬的時候站在棺材前頭。你殺了一個，另一個會發瘋——它們被糊出來的時候，就是一對。"],["po","要我說，先讓那個會補的閉嘴。拿符封她的嘴，她就補不了。"]],flag:"twins"},{id:"boss1",when:(t,e)=>e&&!e.win&&e.reachedBoss&&!t.flags.boss1,lines:[["wei","我見到他了。周濟公。他一直叫我收下、收下……"],["po","他給你什麼，你都別拿。拿了，就是欠他的。"],["wei","他身上連著四個香爐。"],["po","那是他的命。神的命就是香。斷了香，金身就撐不住。"],["po","你站在香爐旁邊，把香掐了。很簡單——簡單到這八十年，沒有一個人想過要這樣做。"]],flag:"boss1"},{id:"jinshen",when:(t,e)=>e&&!e.win&&e.jinshenBroken&&!t.flags.jinshenTalk,lines:[["wei","我斷了他的香。金身裂開的時候……我好像看見裡面有個人。"],["po","……當然有人。"],["po","每一尊神裡面，都有一個人。"]],flag:"jinshenTalk"},{id:"debt",when:(t,e)=>e&&!e.win&&e.debt>=2&&!t.flags.debtTalk,lines:[["po","你身上一股銅臭。拿了他的元寶吧？"],["wei","我需要那點血。"],["po","神給的東西都要還，連本帶利。你倒好，死了就不用還了。划算。"]],flag:"debtTalk"},{id:"mansion",when:(t,e)=>e&&!e.win&&e.stage>=1&&!t.flags.mansion,lines:[["po","紙宅？那裡的房子都是燒下去的。有人給祖先燒了三層樓的洋房，還附車庫。"],["wei","我還看到一台紙糊的賓士。"],["po","活人自己買不起，就燒給死人。這叫孝順。"]],flag:"mansion"},{id:"many",when:t=>t.deaths>=6&&!t.flags.many,lines:[["po","第幾次了？"],["wei","別數了。"],["po","我沒在數。我是看香——你每回來一次，香就短一截。"],["po","不過沒關係，我還有一整箱。"]],flag:"many"},{id:"heat1",when:t=>t.flags.win1&&t.bestHeat>=1&&!t.flags.heat1,lines:[["po","你知道我這間舖子為什麼叫「一炷香」嗎？"],["wei","因為你只賣得出一炷？"],["po","……因為從前，有個人一天只給我燒一炷香。"],["wei","誰？"],["po","一個傻子。"]],flag:"heat1"},{id:"heat3",when:t=>t.bestHeat>=3&&!t.flags.heat3,lines:[["po","神死了以後會去哪裡？我也不知道。"],["po","我只知道，神活著的時候，連覺都不能睡。千千萬萬個人在你耳邊說話，白天說，晚上也說。"],["po","（她摸著櫃台上一道很舊的刻痕）……六十年，我一次都沒睡過。"],["wei","……你說什麼？"],["po","我說我老了，記錯了。去吧。"]],flag:"heat3"},{id:"heat6",when:t=>t.bestHeat>=6&&!t.flags.heat6,lines:[["po","……我以前，也住在雲上。"],["po","後來，有個人替我斷了香。他跟你一樣，是個糊紙紮的。手很巧，脾氣很壞。"],["wei","他叫什麼？"],["po","姓魏。"],["po","所以我欠你們魏家一炷香。不多不少，就一炷。"]],flag:"heat6"}],Xe=[[["po","你知道我怎麼瞎的嗎？……香煙燻的。燒了一輩子香，最後連香長什麼樣子都看不見了。"]],[["wei","你為什麼要幫我？"],["po","誰幫你了？我做生意的。你把神殺光了，大家就不燒香了，我香舖就倒了。"],["po","……所以我是在害我自己。你說我圖什麼呢。"]],[["po","你妹妹小時候常來買香。一次只買一炷，說是給水娘娘的。"],["po","她說，水娘娘一個人待在河裡，一定很寂寞。"]],[["po","敕封院那個白無咎，你知道他今年幾歲？二十九。"],["po","已經封了十一尊神了。"]],[["wei","上面的紙紮，為什麼都要殺我？"],["po","因為它們是燒給神的。對它們來說，你是闖進主人家裡的賊。"]],[["po","紙城那位周濟公，以前是好人。"],["po","……上面那些神，以前都是好人。不是好人，誰拜他。"]],[["po","你身上那炷香，別讓它燒完。燒完了，我得再點一炷新的。"],["po","新的，不一定還是你。"]],[["wei","你這香舖一天能賣幾炷？"],["po","你上去打一場，下面就少十個人來買。你說呢？"]],[["po","願這種東西啊，聽多了就跟下雨一樣。一開始你還會一滴一滴數，後來就只剩下吵。"]],[["wei","（盯著供桌上那尊歪嘴的紙人）……這是我？"],["po","我摸著糊的。像不像？"],["wei","一點都不像。"],["po","那就對了。神像本來就不用像。"]]],Ke=[{name:"冥市",num:"一殿",line:"死人的東西，在這裡買賣。"},{name:"紙宅",num:"二殿",line:"燒下去的房子，住著燒下去的人。"},{name:"財神殿",num:"三殿",line:"八十年的香，從沒斷過。"}],$s=[{art:"drought",text:`八十年前，爐州大旱。
