/* 拼牆 — one dark street world: night wall, die-cut stickers, tape labels */
:root {
  --wall: #100c16; --ink: #0b0710; --paper: #efe6d6; --tape: #e9dfc4;
  --pink: #ff2fd1; --cyan: #2ef2ff; --yellow: #ffd21f; --chip: #2f8cff; --mult: #ff3554; --rival: #e9e7ee;
  --text: #f6f1fb; --dim: #a39cb3; --panel: rgba(13,9,19,0.9);
  --display: "PQBlack", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "PQBody", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --num: "PQLatinI", "PQLatin", "Arial Black", Impact, sans-serif;
  --serif: "PQSerif", "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--wall); color: var(--text); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
#app { position: relative; height: 100%; overflow: hidden; background: var(--wall) var(--wallimg, none); background-size: 320px; }
#app::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 70% at 70% -10%, rgba(255,190,90,0.16), transparent 60%), radial-gradient(140% 100% at 50% 120%, rgba(0,0,0,0.7), transparent 60%); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 1; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* ---------- buttons ---------- */
.btn { position: relative; font-family: var(--display); font-size: 17px; line-height: 1.1; padding: 11px 20px; border: 3px solid var(--ink); border-radius: 10px; background: var(--yellow); color: var(--ink); box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 5px 0 2px var(--ink); transform: rotate(-1deg); transition: transform .08s, box-shadow .08s, opacity .2s; }
.btn small { display: block; font-family: var(--body); font-size: 11px; opacity: .8; margin-top: 2px; }
.btn:active:not(:disabled) { transform: translateY(4px) rotate(-1deg); box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 1px 0 2px var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: #1e1729; color: var(--text); box-shadow: 0 0 0 2px rgba(255,255,255,0.55), 0 5px 0 2px #000; }
.btn.big { font-size: 24px; padding: 14px 30px; }
.btn.small { font-size: 13px; padding: 6px 12px; }
.icon-btn { width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 50%; background: #1e1729; color: var(--text); font-family: var(--display); font-size: 18px; box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.snd::before { content: "♪"; }
.icon-btn.snd.off { opacity: .5; }
.icon-btn.snd.off::before { content: "×"; }

/* ---------- loading ---------- */
#loading { align-items: center; justify-content: center; gap: 18px; }
.ld-logo { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--yellow); text-shadow: 3px 3px 0 var(--pink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 5px 6px 0 var(--ink); transform: rotate(-3deg); display: flex; flex-direction: column; align-items: center; }
.ld-logo small { font-family: var(--num); font-size: 22px; color: var(--cyan); letter-spacing: .08em; text-shadow: 2px 2px 0 var(--ink); }
.ld-bar { width: min(260px, 70vw); height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: #241b30; box-shadow: 0 0 0 2px rgba(255,255,255,.4); overflow: hidden; }
.ld-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--yellow), var(--pink)); transition: width .25s; }
.ld-txt { font-size: 13px; color: var(--dim); }

/* ---------- title ---------- */
#title { align-items: center; justify-content: space-between; padding: 16px 16px 26px; }
.t-stage { position: relative; flex: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.t-posters { position: absolute; inset: 0 0 20% 0; display: flex; align-items: center; justify-content: center; }
.t-posters canvas { position: absolute; height: min(78%, 470px); aspect-ratio: 3/4; filter: drop-shadow(6px 10px 0 rgba(0,0,0,.55)); transition: transform .6s cubic-bezier(.2,1.4,.4,1), opacity .5s; }
.t-head { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; margin-top: auto; margin-bottom: 4px; }
#tLogo { width: min(92vw, 560px); height: auto; filter: drop-shadow(0 8px 0 rgba(0,0,0,.6)); }
.t-tag { margin: 2px 0 0; font-family: var(--display); font-size: 15px; letter-spacing: .08em; color: var(--text); background: var(--ink); padding: 4px 12px; transform: rotate(-1.5deg); box-shadow: 0 0 0 2px rgba(255,255,255,.75); }
.t-menu { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; position: relative; z-index: 2; margin-top: 16px; }
#title .snd { position: absolute; top: 14px; right: 14px; z-index: 3; }

/* ---------- story ---------- */
#story { justify-content: flex-end; }
.st-scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.st-scene canvas { max-height: 72%; max-width: 92%; filter: drop-shadow(8px 10px 0 rgba(0,0,0,.6)); }
.st-box { position: relative; z-index: 2; margin: 0 16px 22px; padding: 14px 18px 12px; background: var(--panel); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 3px #fff, 6px 8px 0 3px var(--ink); max-width: 640px; align-self: center; width: calc(100% - 32px); box-sizing: border-box; cursor: pointer; }
.st-who { display: inline-block; font-family: var(--display); font-size: 15px; padding: 2px 10px; background: var(--yellow); color: var(--ink); transform: rotate(-2deg); margin-bottom: 6px; }
.st-who.rv { background: var(--rival); }
.st-who.nar { background: var(--tape); }
.st-line { margin: 0; font-size: 18px; line-height: 1.6; font-family: var(--body); text-wrap: pretty; }
.st-line.rv { font-family: var(--serif); }
.st-next { text-align: right; font-size: 12px; color: var(--dim); margin-top: 4px; }
.st-skip { position: absolute; top: 14px; right: 14px; z-index: 3; }

/* ---------- legend pick ---------- */
#pick { align-items: center; justify-content: safe center; padding: 20px 16px; gap: 10px; overflow-y: auto; }
.pk-h { margin: 0; font-family: var(--display); font-size: 26px; text-align: center; text-wrap: balance; }
.pk-h span { color: var(--yellow); margin: 0 .15em; }
.pk-sub { margin: 0 0 8px; color: var(--dim); font-size: 14px; text-align: center; }
.pk-list { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 900px; }
.pk { width: 220px; padding: 14px 14px 16px; background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 0 0 3px #fff, 6px 8px 0 3px var(--ink); text-align: left; display: flex; flex-direction: column; gap: 8px; transition: transform .15s; }
.pk:hover, .pk:focus-visible { transform: translateY(-4px) rotate(-1deg); }
.pk canvas { width: 100%; height: auto; border-radius: 8px; background: #19121f; }
.pk b { font-family: var(--display); font-size: 22px; }
.pk p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.pk i { font-style: normal; font-size: 12px; color: var(--dim); }

/* ---------- battle ---------- */
.b-top { display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px; position: relative; z-index: 3; }
.b-round { font-family: var(--display); font-size: 15px; padding: 4px 12px; background: var(--tape); color: var(--ink); transform: rotate(-2deg); box-shadow: 2px 3px 0 rgba(0,0,0,.6); white-space: nowrap; }
.b-legend { font-size: 12px; padding: 4px 10px; border: 2px solid var(--yellow); border-radius: 20px; color: var(--yellow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.b-legend.on { background: var(--yellow); color: var(--ink); }
.b-spacer { flex: 1; }
.b-crowd { display: flex; align-items: center; gap: 8px; padding: 2px 12px 4px; position: relative; z-index: 3; }
.cr-side { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.cr-side b { font-family: var(--display); font-size: 13px; }
.cr-side span { font-family: var(--num); font-size: 20px; font-variant-numeric: tabular-nums; }
.cr-side.me span { color: var(--yellow); }
.cr-side.rv span { color: var(--rival); }
.cr-meter { position: relative; flex: 1; height: 16px; border: 2px solid var(--ink); border-radius: 9px; background: var(--rival); box-shadow: 0 0 0 2px rgba(255,255,255,.35); overflow: hidden; }
.cr-meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, var(--yellow), var(--pink)); transition: width .9s cubic-bezier(.3,1.3,.5,1); }
.cr-meter i::after { content: ""; position: absolute; right: -2px; top: -2px; bottom: -2px; width: 4px; background: var(--ink); }
.cr-meter em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-family: var(--num); font-size: 11px; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }

.b-main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; z-index: 2; }
.b-wall { position: relative; flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center; gap: 10px; padding: 4px 12px 14px; }
.pw { position: relative; }
.pw canvas { display: block; width: 100%; height: 100%; }
.pw.mine { height: 100%; aspect-ratio: 3/4; max-width: 64%; filter: drop-shadow(5px 8px 0 rgba(0,0,0,.6)); }
.pw.mine.slap { animation: slap .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes slap { 0% { transform: scale(1.12) rotate(-2deg); } 60% { transform: scale(.97) rotate(.6deg); } 100% { transform: none; } }
.pw-empty { position: absolute; inset: 22% 12%; display: grid; place-items: center; text-align: center; font-family: var(--display); font-size: 15px; color: rgba(40,28,20,.55); line-height: 1.6; pointer-events: none; }
.pw.rival { align-self: flex-start; width: 28%; aspect-ratio: 3/4; transform: rotate(2.5deg); filter: drop-shadow(4px 6px 0 rgba(0,0,0,.6)); cursor: pointer; }
.rv-fx { position: absolute; left: 0; right: -6px; top: calc(100% + 30px); display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.rv-fx b { font-family: var(--display); font-weight: normal; font-size: 13px; background: var(--rival); color: var(--ink); padding: 1px 7px; transform: rotate(-3deg); box-shadow: 2px 2px 0 var(--ink); }
.rv-fx span { font-size: 11px; color: var(--dim); padding-left: 2px; }
.rv-score { position: absolute; left: -8px; bottom: -14px; background: var(--rival); color: var(--ink); border: 2px solid var(--ink); padding: 2px 8px 3px; transform: rotate(-4deg); box-shadow: 2px 3px 0 var(--ink); display: flex; flex-direction: column; align-items: flex-start; }
.rv-score small { font-size: 10px; font-family: var(--body); }
.rv-score b { font-family: var(--num); font-size: 18px; line-height: 1; }
.crowd { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 44px; pointer-events: none; }

.b-side { display: flex; gap: 8px; padding: 0 12px 6px; align-items: stretch; }
.sc { flex: 1; min-width: 0; background: var(--panel); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 2px rgba(255,255,255,.85), 4px 5px 0 2px var(--ink); padding: 7px 10px 8px; display: flex; flex-direction: column; gap: 4px; }
.sc-comp { font-family: var(--display); font-size: 17px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-comp em { font-style: normal; font-size: 12px; color: var(--dim); font-family: var(--body); margin-left: 4px; }
.sc-math { display: flex; align-items: center; gap: 5px; font-family: var(--num); font-variant-numeric: tabular-nums; }
.sc-math i { font-style: normal; color: var(--dim); font-size: 14px; }
.chip, .mult { font-size: 17px; padding: 1px 8px; border-radius: 7px; border: 2px solid var(--ink); color: #fff; min-width: 2ch; text-align: center; }
.chip { background: var(--chip); }
.mult { background: var(--mult); }
.tot { font-size: 23px; color: var(--yellow); text-shadow: 2px 2px 0 var(--ink); }
.pop { animation: pop .28s cubic-bezier(.2,1.8,.4,1); }
@keyframes pop { 0% { transform: scale(1.5); } 100% { transform: none; } }
.sc-bon { display: flex; gap: 5px; flex-wrap: wrap; }
.sc-bon span { font-size: 11px; font-family: var(--display); padding: 1px 7px; border-radius: 10px; border: 2px solid #4a4058; color: #6e6580; }
.sc-bon span.on { color: var(--ink); border-color: var(--ink); background: var(--yellow); }
.sc-bon span[data-b="rgb"].on { background: linear-gradient(90deg, var(--pink), var(--cyan), var(--yellow)); }
.sc-bon span[data-b="mono"].on { background: #fff; }
.sc-hint { font-size: 12px; color: var(--dim); line-height: 1.35; min-height: 1.35em; }
.sc-hint b { color: var(--cyan); font-weight: normal; font-family: var(--display); }
.rvinfo { display: none; width: 38%; flex: 0 0 auto; background: #1a1720; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 2px rgba(233,231,238,.8), 4px 5px 0 2px var(--ink); padding: 7px 10px; flex-direction: column; gap: 4px; }
.ladder { display: none; }
.ladder h4 { margin: 0 0 4px; font-family: var(--display); font-size: 13px; color: var(--dim); font-weight: normal; }
.lr { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: baseline; padding: 4px 6px; border-radius: 6px; font-size: 12px; color: var(--dim); }
.lr b { font-family: var(--display); font-weight: normal; font-size: 13px; color: var(--text); }
.lr span { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr i { font-style: normal; font-family: var(--num); white-space: nowrap; }
.lr em { font-style: normal; } .lr em.c { color: #7db6ff; } .lr em.m { color: #ff8396; }
.lr.cur { background: var(--yellow); color: var(--ink); } .lr.cur b, .lr.cur em.c, .lr.cur em.m { color: var(--ink); }
.lr.nxt { outline: 2px dashed var(--cyan); outline-offset: -2px; }
.rvi-now { display: flex; flex-direction: column; gap: 2px; }
.rvi-now b { font-family: var(--display); font-size: 14px; color: var(--ink); background: var(--rival); align-self: flex-start; padding: 0 8px; transform: rotate(-2deg); }
.rvi-now span { font-size: 12px; line-height: 1.4; color: var(--text); }
.rvi-next { font-size: 11px; color: var(--dim); }

.b-bottom { position: relative; z-index: 3; padding: 2px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.hand { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.acts { display: flex; gap: 12px; justify-content: space-between; }
.acts .btn { flex: 1; }
#btnPaste { font-size: 20px; }

/* ---------- cards ---------- */
.card { --cc: #888; position: relative; display: flex; flex-direction: column; height: clamp(84px, 12.8vh, 124px); padding: 0; border: 3px solid var(--ink); border-radius: 10px; background: #19121f; box-shadow: 0 0 0 2px var(--cc), 0 4px 0 2px #000; overflow: hidden; text-align: left; transition: transform .16s cubic-bezier(.2,1.5,.4,1), box-shadow .16s, filter .2s; touch-action: manipulation; }
.card.c-P { --cc: var(--pink); } .card.c-C { --cc: var(--cyan); } .card.c-Y { --cc: var(--yellow); }
.card canvas { display: block; width: 100%; flex: 1 1 auto; min-height: 0; object-fit: cover; }
.card .tp { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--cc); border: 2px solid var(--cc); font-family: var(--display); font-size: 12px; display: grid; place-items: center; }
.card .pt { position: absolute; top: 4px; right: 4px; font-family: var(--num); font-size: 13px; padding: 0 5px; border-radius: 6px; border: 2px solid var(--ink); background: var(--chip); color: #fff; }
.card .nm { font-family: var(--display); font-size: 13px; line-height: 1.1; padding: 3px 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; background: #120c18; }
.card .ef { font-size: 10px; line-height: 1.2; padding: 1px 6px 4px; color: var(--cc); background: #120c18; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.sel { transform: translateY(-9px) rotate(-1.5deg); box-shadow: 0 0 0 3px #fff, 0 0 18px 4px var(--cc), 0 9px 0 2px #000; }
.card.sel::after { content: "✔"; position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--cc); color: var(--ink); font-size: 16px; border: 2px solid var(--ink); }
.card.grey { --cc: #a8a5b2; filter: saturate(0.05) brightness(.9); }
.card.grey::before { content: "漂白"; position: absolute; z-index: 2; left: 50%; top: 32%; transform: translate(-50%, -50%) rotate(-14deg); font-family: var(--display); font-size: 15px; color: #ff4a5e; border: 3px solid #ff4a5e; padding: 0 6px; background: rgba(255,255,255,.85); }
.card.deal { animation: deal .38s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes deal { 0% { transform: translateY(60px) rotate(8deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.card.toss { animation: toss .3s ease-in forwards; pointer-events: none; }
@keyframes toss { to { transform: translateY(-120px) scale(.6) rotate(-12deg); opacity: 0; } }
.card.locked { pointer-events: none; }

/* ---------- overlays ---------- */
.coach { position: absolute; z-index: 20; max-width: 250px; padding: 7px 11px; background: var(--yellow); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 0 0 2px #fff, 4px 5px 0 2px var(--ink); font-size: 13px; line-height: 1.45; font-family: var(--body); pointer-events: none; animation: bob 1.4s ease-in-out infinite; }
.coach b { font-family: var(--display); font-weight: normal; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.coach::after { content: ""; position: absolute; width: 14px; height: 14px; background: var(--yellow); border: 3px solid var(--ink); border-top: 0; border-left: 0; left: var(--ax, 30px); bottom: -10px; transform: rotate(45deg); }
.coach.up::after { bottom: auto; top: -10px; transform: rotate(-135deg); }
.say { position: absolute; z-index: 21; right: 12px; top: 96px; max-width: min(330px, 62vw); display: flex; gap: 10px; align-items: center; padding: 8px 12px 8px 8px; background: #121016; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 2px var(--rival), 4px 5px 0 2px var(--ink); animation: sayIn .3s cubic-bezier(.2,1.5,.4,1); }
.say canvas { width: 54px; height: 54px; border-radius: 8px; flex: 0 0 54px; background: #000; }
.say b { font-family: var(--display); font-size: 12px; color: var(--rival); }
.say p { margin: 2px 0 0; font-family: var(--serif); font-size: 15px; line-height: 1.45; }
.say.me { left: 12px; right: auto; box-shadow: 0 0 0 2px var(--yellow), 4px 5px 0 2px var(--ink); }
.say.me b { color: var(--yellow); } .say.me p { font-family: var(--body); }
@keyframes sayIn { from { transform: translateY(-10px) scale(.95); opacity: 0; } }
.banner { position: absolute; z-index: 22; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-3deg); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.banner canvas { max-width: 90vw; height: auto; filter: drop-shadow(0 8px 0 rgba(0,0,0,.6)); }
.banner small { font-family: var(--display); font-size: 16px; background: var(--ink); padding: 4px 12px; box-shadow: 0 0 0 2px #fff; }
.tip { position: absolute; z-index: 23; left: 50%; bottom: 46%; transform: translateX(-50%); padding: 8px 14px; background: var(--ink); color: #fff; border: 2px solid var(--pink); border-radius: 10px; font-size: 14px; white-space: nowrap; animation: sayIn .2s; }

.modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5,3,9,.72); }
.m-card { position: relative; width: min(640px, 100%); max-height: calc(100% - 20px); overflow-y: auto; box-sizing: border-box; padding: 18px 18px 20px; background: #15101c; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 0 0 3px #fff, 6px 8px 0 3px var(--ink); }
.m-card.small { width: min(360px, 100%); text-align: center; }
.m-card h2 { margin: 0 0 10px; font-family: var(--display); font-size: 22px; }
.m-card h3 { margin: 16px 0 6px; font-family: var(--display); font-size: 16px; color: var(--yellow); }
.m-card p { margin: 0 0 8px; font-size: 14px; line-height: 1.65; color: var(--text); }
.m-x { position: absolute; top: 12px; right: 12px; }
.m-acts { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
.ctab { width: 100%; border-collapse: collapse; font-size: 13px; }
.ctab td { padding: 6px 6px; border-bottom: 1px solid #2a2236; vertical-align: middle; }
.ctab td:first-child { font-family: var(--display); font-size: 14px; white-space: nowrap; }
.ctab td.n { font-family: var(--num); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.ctab tr.hi td { background: rgba(255,210,31,.14); }
.ctab .chip, .ctab .mult { font-size: 12px; padding: 0 5px; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.7; }
.r-card { position: relative; width: min(720px, 100%); max-height: calc(100% - 10px); overflow-y: auto; box-sizing: border-box; padding: 16px 16px 20px; background: #15101c; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 0 0 3px #fff, 6px 8px 0 3px var(--ink); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.r-card canvas.rt { max-width: 92%; height: auto; }
.r-wall { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.r-wall { width: 100%; flex-wrap: nowrap; }
.r-wall figure { margin: 0; width: min(110px, 23%); display: flex; flex-direction: column; gap: 3px; align-items: center; }
.r-wall canvas { width: 100%; height: auto; filter: drop-shadow(3px 4px 0 rgba(0,0,0,.6)); }
.r-lab { font-family: var(--display); font-size: 13px; color: var(--yellow); align-self: flex-start; margin-bottom: -4px; }
.r-lab.rv { color: var(--rival); }
.r-wall figcaption { font-family: var(--num); font-size: 13px; color: var(--yellow); }
.r-wall figcaption.rv { color: var(--rival); }
.r-sum { font-family: var(--num); font-size: 26px; display: flex; gap: 14px; align-items: baseline; justify-content: center; flex-wrap: wrap; }
.r-sum .me { color: var(--yellow); } .r-sum .rv { color: var(--rival); } .r-sum i { font-style: normal; font-size: 14px; color: var(--dim); font-family: var(--body); }
.r-line { margin: 0; font-family: var(--serif); font-size: 16px; line-height: 1.6; max-width: 34em; }
.r-acts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ---------- studio ---------- */
.s-main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 4px 12px 12px; }
.s-poster { flex: 0 0 auto; height: 42vh; display: flex; justify-content: center; }
.s-poster canvas { height: 100%; aspect-ratio: 3/4; max-width: 100%; filter: drop-shadow(5px 8px 0 rgba(0,0,0,.6)); }
.s-side { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.s-side .sc { flex: 0 0 auto; }
.s-cat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 4px 12px; }
.s-cat h4 { margin: 4px 0 0; font-family: var(--display); font-size: 13px; color: var(--dim); }
.s-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.s-row .card { height: 118px; }

/* ---------- wide screens ---------- */
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .b-main { flex-direction: row; }
  .b-crowd { width: min(820px, 100%); box-sizing: border-box; margin: 0 auto; }
  .b-wall { padding: 8px 16px 40px; gap: 18px; }
  .pw.mine { max-width: 58%; }
  .pw.rival { width: 26%; }
  .b-side { flex-direction: column; width: 290px; padding: 8px 16px 8px 0; }
  .rvinfo { display: flex; width: auto; }
  .b-side { justify-content: flex-start; }
  .b-side .sc { flex: 0 0 auto; }
  .ladder { display: block; background: var(--panel); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 2px rgba(255,255,255,.5), 4px 5px 0 2px var(--ink); padding: 8px 8px; }
  .rv-fx { display: none; }
  .sc-comp { font-size: 22px; white-space: normal; }
  .chip, .mult { font-size: 22px; }
  .tot { font-size: 30px; }
  .sc-hint { font-size: 13px; }
  .b-bottom { flex-direction: row; align-items: flex-end; padding: 0 16px 14px; gap: 14px; }
  .hand { flex: 1; grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .card { height: clamp(120px, 19vh, 172px); }
  .card .nm { font-size: 15px; } .card .ef { font-size: 12px; }
  .acts { flex-direction: column; width: 160px; }
  .crowd { height: 72px; }
  .s-main { flex-direction: row; }
  .s-poster { height: auto; flex: 0 0 auto; width: min(46vw, calc((100vh - 90px) * .75)); }
  .s-poster canvas { width: 100%; height: auto; }
}
@media (max-height: 640px) and (max-aspect-ratio: 1/1) {
  .card { height: 82px; } .card .ef { display: none; }
  .crowd { height: 46px; }
}
@media (max-width: 620px) {
  .pk { width: 100%; max-width: 420px; flex-direction: row; align-items: center; gap: 12px; padding: 10px 12px; box-sizing: border-box; }
  .pk canvas { width: 108px; flex: 0 0 108px; }
  .pk .pk-t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pk b { font-size: 19px; } .pk p { font-size: 13px; }
  .pk-h { font-size: 22px; }
}
/* short landscape (phones on their side) */
@media (max-height: 560px) and (min-aspect-ratio: 5/4) {
  #battle { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr); grid-template-areas: "top top" "crowd crowd" "wall side" "wall bottom"; }
  .b-top { grid-area: top; padding: 4px 10px 2px; }
  .b-crowd { grid-area: crowd; padding: 0 10px 2px; }
  .b-main { display: contents; }
  .b-wall { grid-area: wall; padding: 2px 8px 6px 10px; min-height: 0; }
  .pw.mine { max-width: 70%; }
  .pw.rival { width: 26%; }
  .rv-fx { top: calc(100% + 26px); }
  .b-side { grid-area: side; padding: 2px 10px 4px 0; }
  .sc { padding: 4px 8px 5px; gap: 2px; }
  .sc-comp { font-size: 14px; } .chip, .mult { font-size: 14px; } .tot { font-size: 18px; } .sc-hint { font-size: 11px; min-height: 0; }
  .b-bottom { grid-area: bottom; padding: 0 10px 6px 0; gap: 5px; min-height: 0; }
  .card { height: clamp(62px, 17vh, 80px); }
  .card .ef { display: none; } .card .nm { font-size: 11px; } .card .tp { width: 18px; height: 18px; font-size: 10px; } .card .pt { font-size: 11px; }
  .acts .btn { padding: 6px 10px; font-size: 14px; } .acts .btn small { display: none; } #btnPaste { font-size: 16px; }
  .crowd { height: 34px; }
  .icon-btn { width: 32px; height: 32px; flex-basis: 32px; font-size: 15px; }
  .b-round { font-size: 13px; }
  #title { padding: 10px; }
  .t-posters { inset: 0 48% 0 0; }
  .t-posters canvas { height: min(88%, 330px); }
  .t-head { position: absolute; right: 2%; top: 4%; width: 46%; margin: 0; }
  #tLogo { width: 100% !important; }

const TITLE_STYLE = {
  P: { fill: ['#ffffff', '#ffd1fb', '#ff4fe6', '#9b2cff'], o2: '#2ef2ff', shadow: '#1d0526', subFill: ['#2ef2ff', '#1a6dff'], subO2: '#ffffff' },

  Y: { fill: ['#ffffff', '#fff3b0', '#ffd21f', '#ff6a1f'], o2: '#ff2fd1', shadow: '#2a1404', subFill: ['#2ef2ff', '#1a6dff'], subO2: '#0b0710' },
  G: { fill: ['#ffffff', '#e4e2ea', '#9a97a6', '#5b5868'], o2: '#ffffff', shadow: '#121116', subFill: ['#d8d6dc', '#8f8b97'], subO2: '#0b0710' }
};
function renderTitle(def, k, colorKey) {
  const st = TITLE_STYLE[colorKey || def.color]; const n = [...def.name].length;
  const seed = U.hashStr(def.id) % 991 + 7;
  const T = G.graffitiText({ text: def.name, size: (n <= 2 ? 200 : 150) * k, seed, fill: st.fill, outline2: st.o2, o1: 0.1, o2: 0.042, shadow: st.shadow, drips: n <= 2 ? 7 : 9, dripLen: [0.14, 0.8], spikes: 10, spikeLen: [0.07, 0.24], jag: 0.022, crack: 0.3, speckle: 0.45, rot: 6, maxWidth: 560 * k, spacing: -0.03 });
  const S = def.sub ? G.graffitiText({ text: def.sub, size: 46 * k, seed: seed + 3, font: G.F.latI, fill: st.subFill, outline2: st.subO2, o1: 0.16, o2: 0.06, drips: 3, dripLen: [0.2, 0.6], spikes: 0, jag: 0.02, rot: 3, crack: 0.2, spacing: 0.02, maxWidth: 360 * k }) : null;
  const W = Math.max(T.W, S ? S.W + 80 * k : 0), H = T.H + (S ? S.H * 0.55 : 0);
  const c = U.canvas(W, H), x = c.getContext('2d');
  const tx = (W - T.W) / 2; x.drawImage(T.canvas, tx, 0);
  let sub = null;
  if (S) { const sx = W / 2 + T.tw * 0.18 - S.cx + 0 * k, sy = T.cy + T.S * 0.48 - S.cy + S.S * 0.3; x.save(); x.translate(sx + S.cx, sy + S.cy); x.rotate(-0.05); x.drawImage(S.canvas, -S.cx, -S.cy); x.restore(); sub = { x: sx, y: sy }; }
  // anchor: centre of the main lettering
  return { canvas: c, cx: tx + T.cx, cy: T.cy, S: T.S, tw: T.tw, k };
}

/* ---------- the crowd in front of the wall ---------- */
const Crowd = (() => {
  let cv, ctx, W = 1, H = 1, dpr = 1, raf = 0, last = 0, split = 0.66;
  const people = [];
  function init(canvas) {
    cv = canvas; ctx = cv.getContext('2d'); const r = U.rng(31);
    for (let i = 0; i < 34; i++) people.push({ id: i, x: r(), tx: 0.5, s: 0.7 + r() * 0.55, kind: U.pick(r, ['phone', 'cap', 'hood', 'hair', 'phone', 'cap', 'arm']), rim: U.pick(r, ['#ffd21f', '#ff2fd1', '#2ef2ff']), side: 0, jump: 0, walk: r() * 6, hash: r() });

  }
  function resize() { if (!cv) return; const b = cv.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1); W = Math.max(1, b.width); H = Math.max(1, b.height); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); draw(); }
  function assign(share, instant) {
    const n = Math.round(U.clamp(share, 0, 1) * people.length);
    const order = people.slice().sort((a, b) => a.id - b.id);
    order.forEach((p, i) => { p.side = i < n ? 1 : -1; p.tx = p.side > 0 ? 0.02 + p.hash * (split - 0.07) : split + 0.02 + p.hash * (0.97 - split - 0.02); if (instant) p.x = p.tx; });
    kick();
  }
  function cheer(side) { for (const p of people) if (side === 0 || p.side === side) p.jump = 0.5 + Math.random() * 0.9; kick(); }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }
  function loop(t) {
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016; last = t; let moving = false;
    for (const p of people) { const d = p.tx - p.x; if (Math.abs(d) > 0.002) { p.x += Math.sign(d) * Math.min(Math.abs(d), dt * 0.32); p.walk += dt * 12; moving = true; } if (p.jump > 0) { p.jump = Math.max(0, p.jump - dt); moving = true; } }
    draw(); if (moving) raf = requestAnimationFrame(loop); else { raf = 0; last = 0; }
  }

    const hr = h * 0.17; const p = new Path2D();
    p.moveTo(-h * 0.33, 0); p.quadraticCurveTo(-h * 0.33, -h * 0.5, -h * 0.12, -h * 0.58); p.lineTo(h * 0.12, -h * 0.58); p.quadraticCurveTo(h * 0.33, -h * 0.5, h * 0.33, 0); p.closePath();
    p.moveTo(hr, -h * 0.72); p.arc(0, -h * 0.72, hr, 0, Math.PI * 2);
    if (kind === 'cap') { p.moveTo(-hr, -h * 0.76); p.lineTo(hr * 1.9, -h * 0.79); p.lineTo(hr * 1.9, -h * 0.74); p.lineTo(-hr, -h * 0.7); }
    if (kind === 'hood') { p.moveTo(-hr * 1.25, -h * 0.6); p.quadraticCurveTo(-hr * 1.3, -h * 0.98, 0, -h * 0.98); p.quadraticCurveTo(hr * 1.3, -h * 0.98, hr * 1.25, -h * 0.6); p.closePath(); }
    if (kind === 'hair') { p.moveTo(hr * 0.6, -h * 0.9); p.arc(0, -h * 0.92, hr * 0.55, 0, Math.PI * 2); }
    if (kind === 'phone' || kind === 'arm') { p.moveTo(h * 0.18, -h * 0.5); p.lineTo(h * 0.36, -h * 1.05); p.lineTo(h * 0.44, -h * 1.02); p.lineTo(h * 0.3, -h * 0.48); p.closePath(); }
    return p;
  }
  function draw() {
    if (!ctx) return; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const t = performance.now() / 1000;
    for (const p of people) {
      const h = H * 0.86 * p.s; const x = p.x * W; const jy = p.jump > 0 ? -Math.sin((p.jump % 0.5) / 0.5 * Math.PI) * h * 0.16 : 0; const bob = Math.abs(Math.sin(p.walk)) * h * 0.03;

      ctx.save(); ctx.translate(p.side > 0 ? 2 : -2, -1.5); ctx.fillStyle = rim; ctx.globalAlpha = 0.85; ctx.fill(P); ctx.restore();
      ctx.fillStyle = '#07050b'; ctx.fill(P);
      if (p.kind === 'phone') { ctx.fillStyle = p.side > 0 ? '#fff6c8' : '#e9e7ee'; ctx.fillRect(h * 0.34, -h * 1.16, h * 0.13, h * 0.2); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(h * 0.4, -h * 1.06, 0, h * 0.4, -h * 1.06, h * 0.4); g.addColorStop(0, 'rgba(255,240,200,0.35)'); g.addColorStop(1, 'rgba(255,240,200,0)'); ctx.fillStyle = g; ctx.fillRect(0, -h * 1.5, h, h); }

})();

const FACES = {};
function faceCrop(kind, v) {
  const key = kind + v; if (FACES[key]) return FACES[key];
  const L = heroLayer(kind, v, QUALITY.k); const k = L.k; const [hx, hy] = L.meta.head || [300, 420];
  const S = 120; const c = U.canvas(S, S), x = c.getContext('2d'); x.fillStyle = kind === 'mono' ? '#2a2830' : '#3a2a10'; x.fillRect(0, 0, S, S);
  const sw = 250 * k; for (const src of [L.outline, L.body]) x.drawImage(src, hx * k - sw / 2, hy * k - sw * 0.5, sw, sw, 0, 0, S, S);
  x.globalCompositeOperation = 'lighter'; x.drawImage(L.light, hx * k - sw / 2, hy * k - sw * 0.5, sw, sw, 0, 0, S, S);
  FACES[key] = c; return c;
}

  const dpr = Math.min(2, window.devicePixelRatio || 1); const s = scale * dpr;
  const A = G.graffitiText({ text: '拼牆', size: 190 * s, seed: 23, fill: ['#ffffff', '#fff3b0', '#ffd21f', '#ff6a1f'], outline2: '#ff2fd1', o1: 0.1, o2: 0.045, drips: 8, dripLen: [0.15, 0.7], spikes: 12, spikeLen: [0.08, 0.26], jag: 0.022, crack: 0.3, rot: 7, spacing: -0.02 });
  const B = G.graffitiText({ text: 'BURNER', size: 70 * s, seed: 29, font: G.F.latI, fill: ['#ffffff', '#d4fdff', '#2ef2ff', '#1a6dff'], outline2: '#ffffff', o1: 0.15, o2: 0.06, drips: 4, dripLen: [0.2, 0.6], spikes: 0, jag: 0.02, rot: 3, spacing: 0.04, crack: 0.2 });
  const W = Math.max(A.W, B.W + 120 * s), H = A.H + B.H * 0.45;
  const c = U.canvas(W, H), x = c.getContext('2d');
  x.drawImage(A.canvas, (W - A.W) / 2, 0);
  x.save(); x.translate(W / 2 + A.tw * 0.16, A.cy + A.S * 0.5); x.rotate(-0.06); x.drawImage(B.canvas, -B.cx, -B.cy); x.restore();
  G.crown(x, W / 2 - A.tw * 0.36, Math.max(30 * s, A.cy - A.S * 0.66), 64 * s, '#ffd21f', '#0b0710', -0.2);
  const out = cropAlpha(c); out._dpr = dpr; LOGO_CACHE[scale] = out; return out;
}
function cropAlpha(c) {
  const x = c.getContext('2d'); const d = x.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y += 2) for (let xx = 0; xx < c.width; xx += 2) if (d[(y * c.width + xx) * 4 + 3] > 20) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 <= x0) return c; const pad = 4; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width, x1 + pad); y1 = Math.min(c.height, y1 + pad);
  const o = U.canvas(x1 - x0, y1 - y0); o.getContext('2d').drawImage(c, -x0, -y0); return o;
}
function putCanvas(target, src, cssW) { target.width = src.width; target.height = src.height; target.getContext('2d').drawImage(src, 0, 0); if (cssW) target.style.width = cssW + 'px'; }
function soundButtons() {
  const sync = () => document.querySelectorAll('.icon-btn.snd').forEach(b => b.classList.toggle('off', !Snd.on));

/* ---------- title / attract mode ---------- */
const Title = (() => {
  let timer = 0, slots = [], running = false;
  const RECIPES = [
    ['bg_city', 'h_mech_C', 't_launch', 'fx_drip_P', 'fx_bolt'], ['bg_moon', 'h_beast_P', 't_roar', 'fx_splat', 'fx_crown'], ['bg_burst', 'h_ziwei', 't_kaiju', 'fx_dots', 'fx_crown'],
    ['bg_sea', 'h_pirate_Y', 'h_beast_C', 't_flag', 'fx_vs'], ['bg_brick', 'h_pirate_P', 't_sail', 'fx_drip_P', 'fx_splat'], ['bg_city', 'h_mech_Y', 'h_beast_P', 't_steel', 'fx_vs'], ['bg_moon', 'h_beast_C', 't_roar', 'fx_drip_C', 'fx_bolt']
  ];
  function init() {
    document.getElementById('btnDuel').addEventListener('click', () => { Snd.unlock(); Snd.play('click'); Main.toDuel(); });
    document.getElementById('btnStudio').addEventListener('click', () => { Snd.unlock(); Snd.play('click'); Main.toStudio(); });
    document.getElementById('btnHowTitle').addEventListener('click', () => { Snd.unlock(); Snd.play('click'); Help.open(); });
    const wrap = document.getElementById('tPosters');
    slots = [0, 1, 2].map(i => { const c = document.createElement('canvas'); c.style.transform = ['translateX(-58%) rotate(-9deg) scale(.86)', 'translateY(-4%) rotate(2deg)', 'translateX(58%) rotate(8deg) scale(.86)'][i]; c.style.zIndex = i === 1 ? 2 : 1; wrap.appendChild(c); return { c, i, recipe: null }; });
  }
  function drawLogo() { const t = document.getElementById('tLogo'); if (t._done) return; const lc = logoCanvas(innerWidth < 600 ? 0.62 : 0.9); putCanvas(t, lc); t.style.width = Math.min(innerWidth * 0.92, lc.width / lc._dpr) + 'px'; t._done = true; }
  const ready = ids => ids.every(id => LAYERS[id + '@' + QUALITY.k] || RULES.DEF[id].type === 'fx');
  async function assemble(slot, recipe) {
    const cards = recipe.map((id, j) => ({ uid: j + 1, def: RULES.DEF[id] }));
    for (let n = 1; n <= cards.length && running; n++) { composePoster(cards.slice(0, n), { k: QUALITY.k, target: slot.c, seed: 11 + slot.i }); slot.c.animate([{ filter: 'brightness(1.6) drop-shadow(6px 10px 0 rgba(0,0,0,.55))' }, { filter: 'brightness(1) drop-shadow(6px 10px 0 rgba(0,0,0,.55))' }], { duration: 260 }); await sleep(320); }
  }
  async function cycle() {
    if (!running) return;
    const avail = RECIPES.filter(ready); if (!avail.length) { timer = setTimeout(cycle, 400); return; }
    const slot = slots[(cycle.n = ((cycle.n || 0) + 1)) % 3];
    let rec = U.pick(Math.random, avail); if (slots.some(s => s.recipe === rec) && avail.length > 3) rec = avail.find(r => !slots.some(s => s.recipe === r)) || rec;
    slot.recipe = rec; await assemble(slot, rec);
    timer = setTimeout(cycle, 1600);
  }
  async function start() {
    running = true; drawLogo();
    const avail = RECIPES.filter(ready); const order = [1, 0, 2];
    for (const s of slots) { const rec = avail[order[s.i] % Math.max(1, avail.length)]; if (rec) { s.recipe = rec; const ids = s.i === 1 || avail.length > 2 ? rec : rec.slice(0, 3); composePoster(ids.map((id, j) => ({ uid: j + 1, def: RULES.DEF[id] })), { k: QUALITY.k, target: s.c, seed: 11 + s.i }); } }
    clearTimeout(timer); timer = setTimeout(cycle, 1800);
  }
  function stop() { running = false; clearTimeout(timer); }
  return { init, start, stop, drawLogo };
})();

/* ---- main.js ---- */
/* ============ 拼牆 · boot & routing ============ */
const Main = (() => {
  let readyAll = false, readyP = null, legendLast = null;
  const yieldFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  function progress(v, t) { const b = document.getElementById('ldBar'); if (b) b.style.width = Math.round(v * 100) + '%'; if (t) { const x = document.getElementById('ldTxt'); if (x) x.textContent = t; } }
  async function fonts() { const fams = ['PQBlack', 'PQBody', 'PQSerif', 'PQLatin', 'PQLatinI']; try { await Promise.race([Promise.all(fams.map(f => document.fonts.load(`40px "${f}"`, '拼牆鐵脊AB12'))), U.sleep(3500)]); } catch (e) { /* fall back */ } }
  function pickQuality() {
    const dpr = Math.min(2, window.devicePixelRatio || 1), vw = innerWidth, vh = innerHeight; const wide = vw >= 900 && vw >= vh;
    const css = wide ? Math.min(vw * 0.4, (vh - 300) * 0.75) : Math.min(vw * 0.64, vh * 0.44 * 0.75);
    QUALITY.k = Math.round(U.clamp(css * dpr / 600, 0.8, 1.5) * 20) / 20;
  }
  function wallTexture() {
    const c = U.canvas(320, 320), x = c.getContext('2d'); const r = U.rng(77);
    x.fillStyle = '#100c16'; x.fillRect(0, 0, 320, 320);
    for (let yy = 0; yy < 320; yy += 32) for (let xx = (yy / 32) % 2 ? -40 : 0; xx < 320; xx += 80) { x.fillStyle = U.mix('#17111e', '#211829', r()); x.fillRect(xx + 2, yy + 2, 76, 28); }
    x.globalAlpha = 0.35; for (let i = 0; i < 7; i++) G.splat(x, r() * 320, r() * 320, 5 + r() * 14, U.pick(r, ['#3a1440', '#123a44', '#3a3214']), r, { drops: 6 }); x.globalAlpha = 1;
    try { document.getElementById('app').style.setProperty('--wallimg', `url(${c.toDataURL('image/png')})`); } catch (e) { /* ignore */ }
  }
  function show(id) { for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id; }
  async function boot() {
    progress(0.05, '載入字型…'); await fonts();
    pickQuality(); wallTexture();
    FX.init(document.getElementById('fx'));
    Title.init(); Story.init(); Pick.init(); Help.init(); Result.init(); Studio.init(); Battle.init(); soundButtons();
    const first = ['bg_city', 'h_mech_C', 't_launch', 'bg_moon', 'h_beast_P', 't_roar'];
    for (let i = 0; i < first.length; i++) { progress(0.1 + 0.8 * i / first.length, '噴漆上牆中…'); await yieldFrame(); cardLayer(RULES.DEF[first[i]]); }
    progress(1, '好了');
    await yieldFrame();
    show('title'); Title.start();
    readyP = bgRender(); readyP.then(() => { readyAll = true; const s = document.getElementById('duelSub'); if (s) s.textContent = '對手：墨鴉 MONO'; });
  }
