<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>寸土 EVERY INCH</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Noto+Sans+TC:wght@500;700;900&family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --us:#9dff5c;--usD:#3f7a2a;--en:#ff5a3c;--gold:#ffd36a;--ink:#0b0f14;--panel:rgba(14,19,26,.86);--panel2:rgba(22,29,38,.92);--line:rgba(255,255,255,.12);--txt:#eef2f5;--mute:#93a1ad;
  --fz:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;--fn:"Saira Condensed","DIN Condensed","Bahnschrift","Arial Narrow",sans-serif;--fs:"Black Ops One","Saira Condensed",sans-serif}
.rot{--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;color:var(--txt);font-family:var(--fz);touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0;background:#0b0f14}
#cv{position:absolute;left:0;top:0;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-family:var(--fn);font-weight:800;letter-spacing:.02em}
.sten{font-family:var(--fs);letter-spacing:.06em}
.hide{display:none!important}

/* ── 共用：按鈕、面板 ── */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;font-weight:900;font-size:16px;letter-spacing:.08em;color:#10140c;
  background:linear-gradient(180deg,#c6ff8a,#7fd64a 55%,#5aa832);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.alt{color:var(--txt);background:linear-gradient(180deg,#3b4654,#262e38)}
.btn.red{color:#fff;background:linear-gradient(180deg,#ff7a5c,#d63a22)}
.btn.gold{color:#241a00;background:linear-gradient(180deg,#ffe9a0,#ffc23d 60%,#d99a14)}
.btn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.tag{display:inline-block;padding:2px 7px;font-size:11px;font-weight:900;letter-spacing:.08em;background:rgba(255,255,255,.08);border-left:3px solid var(--us)}
.tag.en{border-color:var(--en)}

/* ── 戰鬥 HUD ── */
#hud{pointer-events:none}
#hud .top{position:absolute;z-index:2;left:calc(var(--sl) + 6px);right:calc(var(--sr) + 6px);top:calc(var(--st) + 4px);height:46px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cmd{display:flex;align-items:center;gap:6px;pointer-events:none;min-width:0;flex:1}
.cmd.en{flex-direction:row-reverse}
.ava{width:42px;height:42px;flex:none;border-radius:8px;background:linear-gradient(160deg,#2b3a2a,#151c16);border:2px solid var(--us);overflow:hidden;position:relative}
.cmd.en .ava{border-color:var(--en);background:linear-gradient(160deg,#3a2220,#1c1212)}
.ava canvas{position:absolute;inset:0;width:100%;height:100%}
.bub{max-width:230px;padding:5px 9px;font-size:12.5px;line-height:1.35;font-weight:700;background:rgba(10,14,20,.82);border:1px solid rgba(157,255,92,.35);border-radius:4px 10px 10px 10px;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;white-space:normal}
.cmd.en .bub{border-color:rgba(255,90,60,.4);border-radius:10px 4px 10px 10px;text-align:right}
.bub.on{opacity:1;transform:none}
.bub b{display:block;font-size:10px;letter-spacing:.12em;color:var(--us);font-weight:900}
.cmd.en .bub b{color:#ff9a7f}
.mid{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
/* 手機直拿（畫面轉成橫的）時，收藏庫的圓鈕會落在頂部中間偏左：把計時器和旗數往右挪開，不讓它蓋住我方指揮部血條 */
.rot #hud .mid{transform:translateX(calc(150px - 8vh))}.rot .cmd.en .bub{max-width:190px}
.timer{font-size:22px;line-height:20px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.timer.low{color:#ff8a6a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.terr{display:flex;align-items:center;gap:6px}
.hqb{width:58px;height:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);position:relative;overflow:hidden;border-radius:2px}
.hqb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#5aa832,#9dff5c);transition:width .3s}
.hqb.en i{left:auto;right:0;background:linear-gradient(270deg,#d63a22,#ff7a5c)}
.flags{display:grid;grid-template-columns:repeat(3,12px);grid-template-rows:repeat(3,6px);gap:2px 3px;padding:3px 5px;background:rgba(0,0,0,.45);border-radius:3px}
.flags i{width:12px;height:6px;background:#556;border-radius:1px;transition:background .3s}
.flags i.u{background:var(--us)}.flags i.e{background:var(--en)}
#hud .side{position:absolute;z-index:1;right:calc(var(--sr) + 6px);top:calc(var(--st) + 56px);display:flex;flex-direction:row;gap:6px;pointer-events:auto}
.ib{width:38px;height:38px;border-radius:9px;background:rgba(12,16,22,.78);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px;font-weight:900}
.ib.on{border-color:var(--gold);color:var(--gold)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#hud .bot{position:absolute;left:calc(var(--sl) + 4px);right:calc(var(--sr) + 4px);bottom:calc(var(--sb) + 4px);display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.sup{position:relative;width:66px;height:66px;flex:none;pointer-events:none}
.sup canvas{width:66px;height:66px}
.sup .n{position:absolute;inset:0;display:grid;place-items:center;font-size:27px;color:#eaffd8;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.sup .l{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:9px;font-weight:900;letter-spacing:.2em;color:var(--us)}
.cards{display:flex;gap:5px;pointer-events:auto;flex-wrap:nowrap}
.card{position:relative;width:64px;height:78px;flex:none;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#2b3542,#151b23);border:1.5px solid rgba(255,255,255,.16);transition:transform .12s,border-color .12s;touch-action:none}
.card canvas{position:absolute;left:0;top:0;width:64px;height:58px}
.card .nm{position:absolute;left:0;right:0;bottom:0;height:20px;line-height:20px;text-align:center;font-size:11px;font-weight:900;background:rgba(0,0,0,.5);letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.card .c{position:absolute;left:3px;top:3px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:radial-gradient(circle at 40% 35%,#d8ffb0,#5cbf2c 60%,#2f6b17);color:#0d1a06;font-size:14px;line-height:20px;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.5)}
.card.ab{background:linear-gradient(180deg,#3b3424,#1b170e)}
.card.ab .c{background:radial-gradient(circle at 40% 35%,#fff0b8,#f2b52a 60%,#8a5d07);color:#221500}
.card.hero{background:linear-gradient(180deg,#4a3c18,#1c160a);border-color:rgba(255,211,106,.6)}
.card.hero .c{background:radial-gradient(circle at 40% 35%,#fff0b8,#f2b52a 60%,#8a5d07);color:#221500}
.card.no{filter:saturate(.25) brightness(.62)}
.card.sel{transform:translateY(-10px);border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,211,106,.35),0 8px 18px rgba(0,0,0,.5)}
.card .cd{position:absolute;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;font-size:20px;color:#fff;pointer-events:none}
.card .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(157,255,92,.14);pointer-events:none}
.card.used{opacity:.35}
.card .sk{position:absolute;right:3px;top:3px;padding:1px 5px;border-radius:6px;font-size:10px;font-weight:900;background:var(--gold);color:#241a00}
.card.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,211,106,.55),0 0 18px rgba(255,211,106,.6)}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0}
#banner .t{display:inline-block;padding:6px 26px;font-size:24px;font-weight:900;letter-spacing:.14em;color:#fff;background:linear-gradient(90deg,transparent,rgba(10,14,20,.85) 15%,rgba(10,14,20,.85) 85%,transparent);text-shadow:0 0 18px currentColor}
#banner.go{animation:ban 2.2s ease}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#hint{position:absolute;left:50%;bottom:calc(var(--sb) + 92px);transform:translateX(-50%);padding:6px 14px;font-size:13px;font-weight:700;border-radius:20px;background:rgba(10,14,20,.8);border:1px solid rgba(255,211,106,.45);color:#fff2c8;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#hint.on{opacity:1}
.sm .card{width:56px;height:70px}.sm .card canvas{width:56px;height:50px}.sm .card .nm{font-size:10px}
.sm .sup,.sm .sup canvas{width:56px;height:56px}.sm .sup .n{font-size:23px}
.sm .ava{width:36px;height:36px}.sm .bub{font-size:11.5px;max-width:190px}

/* ── 標題 ── */
#title{background:linear-gradient(90deg,rgba(6,9,14,.84),rgba(6,9,14,.62) 34%,rgba(6,9,14,.2) 56%,rgba(6,9,14,0) 70%)}
#brief,#base{background:rgba(9,12,17,.94)}
#title .logo{position:absolute;left:calc(var(--sl) + 34px);top:calc(var(--st) + 26px)}
#title .logo h1{font-size:64px;line-height:1;font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 4px 0 #1d2a14,0 0 30px rgba(157,255,92,.35)}
#title .logo h2{margin-top:6px;font-size:22px;color:var(--us);letter-spacing:.32em}
#title .logo p{margin-top:10px;font-size:13px;color:#dfe6eb;max-width:350px;line-height:1.6;text-shadow:0 1px 3px #000}
#title .menu{position:absolute;left:calc(var(--sl) + 34px);bottom:calc(var(--sb) + 26px);display:flex;flex-direction:column;gap:9px;align-items:flex-start}
#title .menu .btn{min-width:210px;justify-content:flex-start}
#title .menu .btn small{font-size:11px;font-weight:700;opacity:.7;letter-spacing:0}
#title .ver{position:absolute;right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 8px);font-size:11px;color:rgba(255,255,255,.45)}
.rothint{position:absolute;right:calc(var(--sr) + 14px);top:calc(var(--st) + 14px);font-size:11px;color:rgba(255,255,255,.55)}

/* ── 戰役地圖、基地、出擊 ── */
.bar{position:absolute;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);top:calc(var(--st) + 6px);height:40px;display:flex;align-items:center;gap:10px}
.bar .t{font-size:17px;font-weight:900;letter-spacing:.1em}
.bar .t small{font-size:11px;color:var(--mute);margin-left:8px;letter-spacing:.04em}
.bar .sp{flex:1}
.res{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:16px;font-size:15px}
.res i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;color:#241a00;background:radial-gradient(circle at 35% 30%,#fff3c0,#f0b429 60%,#8a5d07)}
.tabs{position:absolute;left:calc(var(--sl) + 8px);bottom:calc(var(--sb) + 8px);display:flex;gap:6px}
.tab{height:40px;padding:0 16px;font-weight:900;font-size:14px;letter-spacing:.1em;background:rgba(14,19,26,.85);border:1px solid var(--line);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.tab.on{background:linear-gradient(180deg,#3d5a2c,#22331a);border-color:var(--us);color:#eaffd8}
.side-panel{position:absolute;right:calc(var(--sr) + 8px);top:calc(var(--st) + 52px);bottom:calc(var(--sb) + 8px);width:min(300px,35%);padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.side-panel h3{font-size:19px;font-weight:900;letter-spacing:.06em}
.side-panel .sub{font-size:12px;color:var(--mute);margin-top:2px}
.side-panel p{font-size:13px;line-height:1.6;color:#d6dde3;margin-top:8px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.kv b{font-weight:900}
.ops{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.log{position:absolute;left:calc(var(--sl) + 8px);top:calc(var(--st) + 52px);width:min(330px,40%);max-height:calc(100% - 120px);padding:10px 12px;overflow-y:auto;touch-action:pan-y}
.log h4{font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
.log .e{font-size:12.5px;line-height:1.5;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.log .e b{color:var(--gold)}
.grid{position:absolute;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);top:calc(var(--st) + 52px);bottom:calc(var(--sb) + 58px);display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;overflow-y:auto;touch-action:pan-y;align-content:start;padding-bottom:6px}
.bld{padding:10px 12px 12px;position:relative}
.bld h4{font-size:15px;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between}
.bld h4 .lv{font-family:var(--fn);font-size:15px;color:var(--gold)}
.bld p{font-size:12px;line-height:1.5;color:#c9d2da;margin:5px 0 8px;min-height:36px}
.bld .nx{font-size:11.5px;color:#a9ff7c;margin-bottom:8px;min-height:17px}
.bld .btn{height:34px;font-size:13px;padding:0 12px;width:100%}
.bld canvas{float:right;width:64px;height:48px;margin:-2px -4px 0 6px}
.pips{display:flex;gap:3px;margin:4px 0 2px}
.pips i{flex:1;height:5px;background:rgba(255,255,255,.12)}
.pips i.on{background:var(--gold)}
/* 出擊準備 */
.brief{position:absolute;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);top:calc(var(--st) + 52px);bottom:calc(var(--sb) + 8px);display:flex;gap:10px}
.brief .l{width:36%;padding:14px;display:flex;flex-direction:column;overflow-y:auto;touch-action:pan-y}
.brief .r{flex:1;padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.rv{display:flex;gap:12px;align-items:center}
.rv .ava{width:62px;height:62px;border-radius:12px}
.rv h3{font-size:20px;font-weight:900}
.rv small{display:block;font-size:12px;color:#ff9a7f;letter-spacing:.1em}
.brief .say{margin-top:10px;padding:8px 10px;font-size:13px;line-height:1.55;background:rgba(255,90,60,.08);border-left:3px solid var(--en)}
.brief .intel{margin-top:10px;font-size:12.5px;line-height:1.6;color:#c9d2da}
.pool{display:flex;flex-wrap:wrap;gap:6px;overflow-y:auto;touch-action:pan-y;padding:4px 2px;flex:1;align-content:flex-start}
.pool .card{pointer-events:auto}
.pool .card.in{border-color:var(--us);box-shadow:0 0 0 2px rgba(157,255,92,.35)}
.pool .card.lock{opacity:.3}
.slots{display:flex;gap:5px;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px;min-height:92px}
.slots .card{pointer-events:auto}
.slots .empty{width:64px;height:78px;border:1.5px dashed rgba(255,255,255,.2);border-radius:8px}
.brief .go{margin-top:auto;display:flex;gap:8px;align-items:center;padding-top:8px}
.brief .go .btn{flex:1}
.info{font-size:12px;color:#c9d2da;line-height:1.5;min-height:36px}
.info b{color:#fff}
/* 對話 */
#dlg{background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(4,6,10,.85))}
#dlg .box{position:absolute;left:calc(var(--sl) + 20px);right:calc(var(--sr) + 20px);bottom:calc(var(--sb) + 16px);min-height:110px;padding:16px 18px 16px 150px;background:linear-gradient(180deg,rgba(18,24,32,.97),rgba(10,14,20,.97));border-top:2px solid rgba(157,255,92,.35)}
#dlg .who{font-size:13px;font-weight:900;letter-spacing:.2em;margin-bottom:6px}
#dlg .txt{font-size:16px;line-height:1.65;font-weight:500;min-height:52px}
#dlg .por{position:absolute;left:12px;bottom:10px;width:124px;height:124px}
#dlg .por canvas{width:124px;height:124px}
#dlg .nx{position:absolute;right:16px;bottom:10px;font-size:11px;color:var(--mute);animation:blink 1.2s infinite}
#dlg .chs{display:flex;flex-direction:column;gap:7px;margin-top:10px}
#dlg .chs .btn{justify-content:flex-start;height:auto;min-height:40px;padding:8px 16px;font-size:14px;text-align:left;letter-spacing:.02em}
#dlg .chs .btn small{display:block;font-size:11px;font-weight:700;opacity:.75}
/* 結算 */
#result{background:rgba(5,8,12,.55)}
#result .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92%);padding:20px 24px;text-align:center}
#result h2{font-size:40px;letter-spacing:.2em;font-weight:900}
#result .win{color:var(--us);text-shadow:0 0 24px rgba(157,255,92,.5)}
#result .lose{color:var(--en);text-shadow:0 0 24px rgba(255,90,60,.5)}
#result .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
#result .stats div{padding:8px 4px;background:rgba(255,255,255,.05)}
#result .stats b{display:block;font-family:var(--fn);font-size:24px}
#result .stats span{font-size:11px;color:var(--mute)}
#result .rw{font-size:14px;margin-bottom:14px;line-height:1.6}
/* 通用彈窗 */
#modal{background:rgba(4,6,10,.62)}
#modal .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,90%);max-height:88%;overflow-y:auto;padding:18px 20px;touch-action:pan-y}
#modal h3{font-size:19px;font-weight:900;margin-bottom:8px}
#modal p,#modal li{font-size:13.5px;line-height:1.65;color:#d6dde3}
#modal ul{padding-left:18px;margin:6px 0}
#modal .ops{justify-content:flex-end}
.toast{position:absolute;left:50%;top:calc(var(--st) + 56px);transform:translateX(-50%);padding:8px 16px;background:rgba(10,14,20,.9);border:1px solid var(--gold);color:#fff3c8;font-size:13px;font-weight:700;border-radius:20px;pointer-events:none;animation:toast 2.4s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.sm #title .logo h1{font-size:52px}.sm #title .logo p{font-size:12px;max-width:430px;line-height:1.5}.xs #title .logo p{display:none}
</style>
</head>
<body>
<div id="app"><canvas id="cv"></canvas><div id="ui"></div></div>
<script>
'use strict';
/* ───────────── 寸土 EVERY INCH — 共用工具 ───────────── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

    else if (this.items.length < this.cap) { o = this.make(); this.items.push(o); }
    else return null;

  }
  kill(o) { if (o.alive) { o.alive = false; this.free.push(o); } }
  each(fn) { const a = this.items; for (let i = 0; i < a.length; i++) if (a[i].alive) fn(a[i]); }
  clear() { this.free.length = 0; for (const o of this.items) { o.alive = false; this.free.push(o); } }
  get count() { return this.items.length - this.free.length; }
}

/* ───────────── 美術核心：外框、快取圖塊、隊伍配色 ───────────── */
const OUT = '#1a1720';

const SPR_S = 4;           // 圖塊快取解析度：每個世界單位 4 像素

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
/* 在世界座標 (x0,y0)-(x1,y1) 的範圍畫一張圖塊；之後以 (0,0) 為錨點貼上 */
function mkSpr(key, x0, y0, x1, y1, fn, scale) {
  const S = scale || SPR_S, pad = 2;

}

  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  if (sx !== undefined) ctx.scale(sx, sy === undefined ? sx : sy);
  ctx.drawImage(s.c, -s.ox, -s.oy, s.w, s.h); ctx.restore();
}
function rr(g, x, y, w, h, r) {
  g.beginPath();
  if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
  r = Math.min(r, w / 2, h / 2);
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();

function lg(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < stops.length; i += 2) gr.addColorStop(stops[i], stops[i + 1]); return gr; }

        g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();

/* 每格更新 */
function updateFx(dt) {
  SHAKE.a = Math.max(0, SHAKE.a - dt * 26);
  SHAKE.t += dt * 60;
  PT.each((p) => {
    p.life += dt;
    if (p.life >= p.max) { if (p.stamp && DECAL) stampDecal(p); PT.kill(p); return; }
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    if (p.type === 'smoke' || p.type === 'fire') p.vx += (WIND.x - p.vx) * 0.25 * dt;
    p.vy += p.ay * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vrot * dt;
    p.size += p.grow * dt;
    if (p.gy !== null && p.y >= p.gy && p.vy > 0) {
      p.y = p.gy;
      if (Math.abs(p.vy) > 40) { p.vy *= -p.bounce; p.vx *= 0.55; p.vrot *= 0.5; if (p.type === 'casing' && chance(0.3)) sfx('tink', p.x); }
      else { p.vy = 0; p.vx *= 0.8; p.vrot *= 0.6; p.ay = 0; if (!p.rest) p.rest = p.life; if (p.type === 'part') { p.vrot = 0; p.rot = Math.round(p.rot / Math.PI) * Math.PI + rnd(-0.12, 0.12); } }
      if (p.trail) p.trail = false;
    }
    if (p.trail && chance(0.5)) P('smoke', p.x, p.y, { vy: -6, max: 0.6, size: 0.06, grow: 0.25, alpha: 0.45, spr: FXS.smokeD });
    if (p.type === 'casing' && p.rest && p.life - p.rest > 0.4 && DECAL) { stampDecal(p); PT.kill(p); }
    if (p.type === 'part' && p.rest && p.life - p.rest > 0.6 && DECAL) { stampDecal(p); PT.kill(p); }
  });
}

/* 每格畫：layer 0 在單位底下、layer 1 在單位上面 */
function drawFx(c, layer) {
  const items = PT.items;
  let add = false;
  for (let i = 0; i < items.length; i++) {
    const p = items[i];
    if (!p.alive || (layer !== undefined && p.layer !== layer)) continue;
    const t = p.life / p.max;
    if (p.add !== add) { c.globalCompositeOperation = p.add ? 'lighter' : 'source-over'; add = p.add; }
    switch (p.type) {
      case 'flash':
        c.globalAlpha = 1; dspr(c, p.spr, p.x, p.y, p.rot, p.size); break;
      case 'glow': case 'ball':
        c.globalAlpha = p.type === 'ball' ? Math.max(0, 1 - t * t) : (1 - t) * p.alpha;
        dspr(c, p.spr, p.x, p.y, 0, p.size); break;
      case 'ring':
        c.globalAlpha = (1 - t) * p.alpha; dspr(c, p.spr, p.x, p.y, 0, p.size, p.size * (p.sy || 1)); break;
      case 'smoke': {
        const a = p.alpha * (t < 0.12 ? t / 0.12 : 1 - (t - 0.12) / 0.88);
        c.globalAlpha = Math.max(0, a); dspr(c, p.spr, p.x, p.y, p.rot, p.size); break;
      }
      case 'fire':
        c.globalAlpha = 1 - t; dspr(c, t < 0.4 ? FXS.gY : FXS.gO, p.x, p.y, 0, p.size * (1 - t * 0.5)); break;
      case 'spark':
        c.globalAlpha = 1 - t; dspr(c, FXS.spark, p.x, p.y, Math.atan2(p.vy, p.vx), 0.8); break;
      case 'chunk':
        c.globalAlpha = t > 0.8 ? (1 - t) * 5 : 1;
        c.fillStyle = p.col; c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillRect(-p.size, -p.size * 0.7, p.size * 2, p.size * 1.4); c.restore(); break;
      case 'casing':
        c.globalAlpha = 1; c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillStyle = p.col; c.fillRect(-1.3 * p.size, -0.55 * p.size, 2.6 * p.size, 1.1 * p.size);
        c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(-1.3 * p.size, -0.55 * p.size, 2.6 * p.size, 0.35 * p.size);
        c.restore(); break;
      case 'part':
        c.globalAlpha = 1; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(p.sx, 1); dspr(c, p.spr, 0, 0, 0); c.restore(); break;
      case 'text':
        c.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
        c.font = `900 ${Math.round(11 * p.size)}px "PingFang TC","Noto Sans TC",sans-serif`; c.textAlign = 'center';
        c.lineWidth = 3; c.strokeStyle = 'rgba(10,12,18,.85)'; c.strokeText(p.txt, p.x, p.y); c.fillStyle = p.col; c.fillText(p.txt, p.x, p.y); break;
    }
  }
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

/* ── 地面痕跡圖層：彈殼、焦痕、腳印、履帶印 ── */
function makeDecal(x0, y0, w, h, s) {

}

  g.translate(p.x, p.y); g.rotate(p.rot);

/* ── 載具動畫狀態 ── */
function newVehAnim(u, kind, pal) {
  u.vk = kind; u.pal = pal; u.face = u.face || 1; u.vx = u.vx || 0;
  u.dist = 0; u.pitch = 0; u.pitchV = 0; u.bob = 0; u.recoil = 0; u.coax = 0; u.ant = 0; u.antV = 0; u.aimA = 0; u.aimTA = 0;
  u.flash = 0; u.smokeT = 0; u.exT = 0; u.alpha = 1; u.wreck = false; u.burnT = 0;
  u.ramp = 0; u.pod = 0; u.jacks = 0; u.rotor = Math.random() * TAU; u.alt = 0; u.tilt = 0; u.spin = 0; u.radar = Math.random() * TAU;
  u.gunSide = 0; u.hpFrac = 1;
}
function animVeh(u, dt) {
  const prevV = u.prevVx || 0; u.prevVx = u.vx;
  const acc = (u.vx - prevV) / Math.max(dt, 0.001);
  u.dist += u.vx * dt;
  // 加減速時車身前後點頭（彈簧）
  const target = clamp(-acc * 0.0009 * u.face, -0.05, 0.05);
  u.pitchV += ((target - u.pitch) * 60 - u.pitchV * 9) * dt; u.pitch += u.pitchV * dt;
  u.bob = Math.abs(u.vx) > 2 ? Math.sin(u.dist * 0.35) * 0.5 : 0;
  u.recoil = Math.max(0, u.recoil - dt * 1.6);
  u.coax = Math.max(0, u.coax - dt * 12);
  u.flash = Math.max(0, u.flash - dt);
  // 天線彈簧
  u.antV += (-(u.ant) * 90 - u.antV * 5 - acc * 0.004 * u.face) * dt; u.ant += u.antV * dt;
  u.aimA = approachAng(u.aimA, u.aimTA, dt * 1.6);
  u.radar += dt * 2.4;
  if (u.vk === 'heli') { u.rotor += dt * 38; u.tilt = damp(u.tilt, clamp(u.vx * 0.006 * u.face, -0.22, 0.22), 3, dt); }
  // 排氣
  u.exT -= dt;
  if (u.exT <= 0 && !u.wreck && u.vk !== 'heli' && u.x !== undefined) {
    const moving = Math.abs(u.vx) > 3;
    u.exT = moving ? 0.12 : 0.5;
    const ex = u.vk === 'truck' ? 46 : -50;
    P('smoke', u.x + ex * u.face, u.y - 26, { vx: -u.face * rnd(10, 20) + WIND.x * 0.3, vy: -rnd(8, 18), max: rnd(0.7, 1.3), size: moving ? 0.12 : 0.08, grow: 0.32, alpha: moving ? 0.5 : 0.3, spr: FXS.smokeD });
    if (moving && (u.vk === 'tank' || u.vk === 'aa')) for (let i = 0; i < 2; i++) P('smoke', u.x - u.face * rnd(-40, 46), u.y - 2, { vx: -u.face * rnd(10, 30), vy: -rnd(6, 18), max: rnd(0.5, 0.8), size: 0.12, grow: 0.35, alpha: 0.6, spr: FXS.dust, layer: 0 });
    if (moving && DECAL && (u.vk === 'tank' || u.vk === 'aa')) { decalMark(u.x - u.face * 30, u.y - 2, 4, 1.3, 'rgba(110,100,92,.22)'); decalMark(u.x - u.face * 30, u.y + 2, 4, 1.3, 'rgba(110,100,92,.22)'); }
  }
  // 受損冒煙、起火
  if (!u.wreck && u.hpFrac < 0.55 && u.x !== undefined) {
    u.smokeT -= dt;
    if (u.smokeT <= 0) { u.smokeT = u.hpFrac < 0.25 ? 0.06 : 0.16; fxSmokeTrail(u.x - u.face * 18, u.y - 36, 1, true); if (u.hpFrac < 0.25) fxFlame(u.x - u.face * 22, u.y - 34, 0.7); }
  }
  if (u.wreck) {
    u.burnT += dt;
    if (u.burnT < 14 && chance(0.6)) fxFlame(u.x + rnd(-14, 14), u.y - 30, 1.1);
    if (u.burnT < 22 && chance(0.12)) fxSmokeTrail(u.x, u.y - 36, 1.6, true);
  }
}

/* 履帶：一圈粗帶子＋會流動的履帶片 */
function drawTrack(c, x0, x1, top, bot, offset, col) {
  const r = (bot - top) / 2, cy = (top + bot) / 2;
  const path = () => {
    c.beginPath(); c.moveTo(x0, top); c.lineTo(x1, top); c.arc(x1, cy, r, -Math.PI / 2, Math.PI / 2); c.lineTo(x0, bot); c.arc(x0, cy, r, Math.PI / 2, Math.PI * 1.5); c.closePath();
  };
  path(); c.lineWidth = 7 + OW * 2; c.strokeStyle = OUT; c.stroke();
  c.lineWidth = 7; c.strokeStyle = '#2b2a2c'; c.stroke();
  c.setLineDash([2.2, 2.6]); c.lineDashOffset = -offset; c.lineWidth = 5.6; c.strokeStyle = col || '#4a4846'; c.stroke(); c.setLineDash([]);
  c.fillStyle = '#1f1e21'; path(); c.fill();
}

function wreckSpr(kind, pal) {

function turretSpr(pal) {

/* 載具砲口在世界中的位置 */
function vehMuzzle(u, which) {
  const f = u.face;
  let px, py, a, len;
  if (u.vk === 'tank') { px = 22; py = -45 - 8 + 8; a = -u.aimA; len = 50 - u.recoil * 11; }
  else if (u.vk === 'apc') { px = 10; py = -43; a = -u.aimA; len = 20; }
  else if (u.vk === 'aa') { px = 0; py = -37 + (which || 0) * 3.2; a = -u.aimA - 0.05; len = 35; }
  else if (u.vk === 'heli') { const c = Math.cos(u.tilt), s = Math.sin(u.tilt); const lx = 36 + Math.cos(-u.aimA) * 18, ly = 12 + Math.sin(-u.aimA) * 18; return [u.x + f * (lx * c - ly * s), u.y + (lx * s + ly * c), f > 0 ? -u.aimA + u.tilt : Math.PI + u.aimA - u.tilt]; }
  else if (u.vk === 'truck') { const pa = -u.pod * 0.62; px = 6 + Math.cos(pa) * 9; py = -26 + Math.sin(pa) * 9 - 7; a = pa; len = 0; }
  const pc = Math.cos(u.pitch), ps = Math.sin(u.pitch);
  let lx = px + Math.cos(a) * len, ly = py + Math.sin(a) * len;
  const rx = lx * pc - ly * ps, ry = lx * ps + ly * pc;
  return [u.x + f * rx, u.y + ry, f > 0 ? a + u.pitch : Math.PI - a - u.pitch];
}

function updateHQ(dt) {

      }

}

/* ── 敵方指揮官 AI ── */
function aiUpdate(dt) {
  const R = B.rival, A = B.ai, P2 = R.ai;
  for (const k in B.aiCD) B.aiCD[k] = Math.max(0, B.aiCD[k] - dt);
  for (const k in B.cdAbil) B.cdAbil[k] = Math.max(0, B.cdAbil[k] - dt);
  A.lineT -= dt;
  A.t -= dt;
  if (A.t > 0) return;
  A.t = P2.think * rnd(0.7, 1.3);
  const sup = B.supply[1];
  // 每條線的威脅與兵力
  const thr = [0, 0, 0], own = [0, 0, 0], comp = [{ inf: 0, arm: 0, air: 0, veh: 0 }, { inf: 0, arm: 0, air: 0, veh: 0 }, { inf: 0, arm: 0, air: 0, veh: 0 }];
  for (const u of B.units) {
    if (!u.alive) continue;
    const v = u.cls === 'inf' ? 1 : u.cls === 'arm' ? 5 : u.cls === 'air' ? 4.5 : 3;
    if (u.side === 0) { const close = 1 + clamp((u.x - 900) / 900, 0, 1.4); thr[u.lane] += v * close; comp[u.lane][u.cls] += v; }
    else own[u.lane] += v;
  }
  // 敵人的旗被威脅：防守
  let defLane = -1, worst = 1.5;
  for (let l = 0; l < 3; l++) { const g = thr[l] - own[l] * 0.9; if (g > worst) { worst = g; defLane = l; } }
  const deck = R.deck;
  const choose = (lane) => {
    const c = comp[lane];
    const opts = [];
    for (const k of deck) {
      const d = UDEF[k]; if (!d || B.aiCD[k] > 0) continue;
      let w = 1;
      if (c.arm + c.veh > 2 && (k === 'at' || k === 'tank')) w += 3;
      if (c.air > 2 && (k === 'aa' || k === 'mg')) w += 4;
      if (c.inf > 3 && (k === 'mg' || k === 'flame' || k === 'mortar' || k === 'tank')) w += 2;
      if (c.air > 0 && k === 'heli') w -= 0.5;
      if (k === 'rifle') w += 0.8;
      if (P2.smart) w *= 1.3;
      opts.push([k, Math.max(0.1, w)]);
    }
    let sum = opts.reduce((a, b) => a + b[1], 0), r = Math.random() * sum;
    for (const [k, w] of opts) { r -= w; if (r <= 0) return k; }
    return opts.length ? opts[0][0] : 'rifle';
  };
  const tryDeploy = (lane, k) => {
    const d = UDEF[k]; if (!d) return false;
    if (sup < d.cost) return false;
    const z = deployZone(1, lane);
    const x = defLane === lane ? z[0] + rnd(20, 80) : z[0] + rnd(10, 60);
    deploy(1, k, lane, x);
    B.aiCD[k] = 4 + d.cost * 0.6;
    if ((k === 'tank' || k === 'heli' || k === 'mlrs') && A.lineT <= 0) { rivalSay('big'); A.lineT = 14; }
    if (k === 'tank' && B.tankSaid <= B.t) { radio(pick(RADIO.enemyTank)); B.tankSaid = B.t + 40; }
    if (k === 'heli' && B.heliSaid <= B.t) { radio(pick(RADIO.enemyHeli)); B.heliSaid = B.t + 40; }
    return true;
  };
  // 技能：打擠在一起的我軍
  if (R.abil.length && chance(P2.abil * 0.6)) {
    for (const ab of R.abil) {
      if ((B.aiCD['ab_' + ab] || 0) > 0 || sup < ABIL[ab].cost) continue;
      const tgt = clusterTarget(0, ab === 'smoke' ? 3 : 4.5);
      if (tgt && (ab !== 'smoke' || defLane >= 0)) {
        B.supply[1] -= ABIL[ab].cost; useAbility(1, ab, tgt.lane, tgt.x + rnd(-20, 20)); B.aiCD['ab_' + ab] = ABIL[ab].cd * 1.15;
        return;
      }
    }
  }
  // 英雄登場
  if (R.hero && !A.heroOut && B.t > A.heroT && sup >= HERO[R.hero].cost) {
    const lane = defLane >= 0 ? defLane : 1; const z = deployZone(1, lane);
    B.supply[1] -= HERO[R.hero].cost; spawnHero(1, R.hero, lane, z[0] + 40); A.heroOut = true;
    rivalSay('big'); banner(`${HERO[R.hero].name} 登場`, R.color);
    return;
  }
  if (A.heroOut) { const hu = B.units.find((u) => u.side === 1 && u.hero && u.alive); if (hu && hu.skillCd <= 0 && chance(0.5)) { const t = findTarget(hu, 400, { air: true }); if (t) heroSkill(hu); } }
  if (defLane >= 0) { tryDeploy(defLane, choose(defLane)); return; }
  // 進攻：存到一定補給再推
  if (sup >= Math.min(P2.save, B.supMax[1] - 0.5)) {
    let lane;
    if (P2.lane === 'center') lane = chance(0.6) ? 1 : rndi(0, 2);
    else if (P2.lane === 'weak') { let m = 1e9; for (let l = 0; l < 3; l++) { const s = thr[l] - own[l] * 0.3 + rnd(0, 1.5); if (s < m) { m = s; lane = l; } } }
    else { let m = -1e9; for (let l = 0; l < 3; l++) { const s = thr[l] - own[l] + rnd(0, 2); if (s > m) { m = s; lane = l; } } }
    let n = 0;
    while (n < 3 && tryDeploy(lane, choose(lane))) n++;
  }
}
function clusterTarget(side, minV) {
  let best = null, bv = minV;
  for (const u of B.units) {
    if (!u.alive || u.side !== side || u.cls === 'air') continue;
    let v = 0;
    for (const o of B.units) if (o.alive && o.side === side && o.cls !== 'air' && o.lane === u.lane && Math.abs(o.x - u.x) < 90) v += o.cls === 'inf' ? 1 : 2.5;
    if (v > bv) { bv = v; best = u; }
  }
  return best;
}

  if (!gest) return;

function autoPlayer(side, dt, deck) {
  B.auto = B.auto || [0, 0];
  B.auto[side] -= dt;
  if (B.auto[side] > 0) return;
  B.auto[side] = rnd(0.8, 1.8);
  const sup = B.supply[side];
  const opts = deck.filter((k) => { const d = ABIL[k] || HERO[k] || UDEF[k]; return d && d.cost <= sup && !(ABIL[k] && (B.cdAbil['a' + side + k] || 0) > 0) && !(HERO[k] && B.heroUsed['a' + side + k]); });
  if (!opts.length || (sup < 6 && chance(0.5))) return;
  const k = pick(opts);
  if (ABIL[k]) {
    const t = clusterTarget(1 - side, 3); if (!t) return;
    B.supply[side] -= ABIL[k].cost; useAbility(side, k, t.lane, t.x); B.cdAbil['a' + side + k] = ABIL[k].cd; return;
  }
  // 兵力最少的那條線
  const own = [0, 0, 0]; for (const u of B.units) if (u.alive && u.side === side) own[u.lane]++;
  let lane = 0; for (let l = 1; l < 3; l++) if (own[l] + rnd(0, 2) < own[lane]) lane = l;
  const z = deployZone(side, lane);
  if (HERO[k]) { B.heroUsed['a' + side + k] = true; B.supply[side] -= HERO[k].cost; spawnHero(side, k, lane, side ? z[0] + 40 : z[1] - 40); return; }
  deploy(side, k, lane, side ? z[0] + rnd(10, 80) : z[1] - rnd(10, 80));
}

/* ───────────── 主迴圈、畫布、橫向／旋轉處理 ───────────── */
const cv = $('#cv');
const ctx = cv.getContext('2d', { alpha: false });
const CAM = { x: 0, y: 0, z: 1, tx: 0, ty: 0, tz: 1, shake: 0, sx: 0, sy: 0, follow: true };

function layout() {
  const iw = innerWidth, ih = innerHeight, app = $('#app');
  VIEW.rot = ih > iw * 1.08;              // 直拿：整個畫面轉 90 度，橫著拿就能玩
  const W = VIEW.rot ? ih : iw, H = VIEW.rot ? iw : ih;
  VIEW.w = W; VIEW.h = H;
  app.style.width = W + 'px'; app.style.height = H + 'px';
  app.style.transform = VIEW.rot ? `translateX(${iw}px) rotate(90deg)` : 'none';
  VIEW.dpr = Math.min(2, window.devicePixelRatio || 1) * VIEW.quality;
  cv.width = Math.round(W * VIEW.dpr); cv.height = Math.round(H * VIEW.dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  document.documentElement.classList.toggle('rot', VIEW.rot);
  if (typeof onLayout === 'function') onLayout();
}
/* 螢幕座標 → 畫面（橫向）座標 */
function toLocal(cx, cy) { return VIEW.rot ? [cy, innerWidth - cx] : [cx, cy]; }
function worldToScreen(wx, wy) { return [(wx - CAM.x) * CAM.z + VIEW.w / 2, (wy - CAM.y) * CAM.z + VIEW.h / 2]; }
function screenToWorld(sx, sy) { return [(sx - VIEW.w / 2) / CAM.z + CAM.x, (sy - VIEW.h / 2) / CAM.z + CAM.y]; }
function applyCam(c) {
  const z = CAM.z * VIEW.dpr;
  c.setTransform(z, 0, 0, z, (VIEW.w / 2 - (CAM.x + CAM.sx) * CAM.z) * VIEW.dpr, (VIEW.h / 2 - (CAM.y + CAM.sy) * CAM.z) * VIEW.dpr);
}

let lastT = 0, fpsAcc = 0, fpsN = 0, frameMs = 16;
function frame(now) {
  requestAnimationFrame(frame);
  if (G.freeze) return;
  if (!lastT) lastT = now;
  let rdt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  G.rt += rdt;
  // 慢動作與停格
  G.timeScale = damp(G.timeScale, G.slowTarget, 10, rdt);
  if (G.hitStop > 0) { G.hitStop -= rdt; rdt *= 0.08; }
  const dt = rdt * G.timeScale * (G.speed || 1);
  G.dt = dt; G.t += dt;
  const t0 = performance.now();
  if (SCENES[G.scene] && SCENES[G.scene].update) SCENES[G.scene].update(dt, rdt);
  if (SCENES[G.scene] && SCENES[G.scene].render) SCENES[G.scene].render(ctx);
  frameMs = lerp(frameMs, performance.now() - t0, 0.05);
  autoQuality(rdt);
}
/* 太卡就降解析度，順就慢慢升回來（看真正的畫面間隔，GPU 慢也算得到） */
let qT = 0, qAcc = 0, qN = 0, qGood = 0;
function autoQuality(rdt) {
  if (G.freeze || G.scene === 'brief' || document.hidden) return;
  qT += rdt; qAcc += rdt; qN++;
  if (qT < 2) return;
  const avg = qAcc / qN; qT = 0; qAcc = 0; qN = 0;
  if (avg > 0.026 && VIEW.quality > 0.55) { VIEW.quality = Math.max(0.55, VIEW.quality - 0.15); qGood = 0; layout(); }
  else if (avg < 0.0185 && VIEW.quality < 1) { qGood++; if (qGood >= 3) { qGood = 0; VIEW.quality = Math.min(1, VIEW.quality + 0.1); layout(); } }
}

  step(sec, fps) { G.freeze = true; const k = Math.ceil(sec * (fps || 30)), dt = sec / k; for (let i = 0; i < k; i++) { G.rt += dt; G.t += dt; G.dt = dt; SCENES[G.scene].update(dt, dt); } SCENES[G.scene].render(ctx); return B ? { t: B.t.toFixed(1), units: B.units.filter((u) => u.alive).length, sup: B.supply.map((v) => v.toFixed(1)), flags: B.flags.map((f) => f.owner).join(''), hq: B.hq.map((h) => Math.round(h.hp)), parts: PT.count, over: B.over, res: B.result } : null; },
  cam(x, y, z) { G.freeze = true; if (x !== undefined) CAM.x = x; if (y !== undefined) CAM.y = y; if (z !== undefined) CAM.z = z; CAM.follow = false; CAM.userT = 999; SCENES[G.scene].render(ctx); },
  perf(n) { const t0 = performance.now(); for (let i = 0; i < (n || 30); i++) SCENES[G.scene].render(ctx); return ((performance.now() - t0) / (n || 30)).toFixed(2) + 'ms/frame render'; },
};

function campDefault() {
  const own = {}; for (const k in SECTORS) own[k] = SECTORS[k].own;
  return {
    v: 1, day: 1, money: 160, own, bld: { hq: 1, bar: 2, mot: 0, air: 0, art: 1 },
    deck: ['rifle', 'mg', 'at', 'mortar', 'boiler', 'smoke', 'medic'], heroes: ['boiler'],
    fates: {}, doctrines: [], seen: {}, log: [], threats: [], beaten: [], ending: null, done: false, wins: 0, losses: 0, kills: 0,
  };
}
function campNew() { CAMP = campDefault(); campSave(); store.set('campDay', CAMP); }
function campLoad() { CAMP = store.get('camp', null) || campDefault(); }
function campSave() { if (CAMP) store.set('camp', CAMP); }
function campSummary() { const c = store.get('camp', null); if (!c) return ''; const n = Object.values(c.own).filter((o) => o === 'us').length; return `第 ${c.day} 天・${n} 個據點`; }
function logAdd(txt) { CAMP.log.unshift({ d: CAMP.day, t: txt }); if (CAMP.log.length > 40) CAMP.log.length = 40; }
function owned(f) { return Object.keys(CAMP.own).filter((k) => CAMP.own[k] === f); }
function neighbors(s) { const out = []; for (const [a, b] of ROADS) { if (a === s) out.push(b); else if (b === s) out.push(a); } return out; }
function income() { return owned('us').reduce((a, k) => a + SECTORS[k].inc, 0); }
function rivalAlive(f) { const cap = Object.keys(SECTORS).find((k) => SECTORS[k].own === f && SECTORS[k].cap); return CAMP.own[cap] === f; }
function finalAct() { return ['kaz', 'holder', 'ilya'].every((f) => !rivalAlive(f)); }

/* ── 解鎖與加成：全部從基地等級推算 ── */
function unlocked() {
  const b = CAMP.bld, u = ['rifle', 'mg'];
  if (b.bar >= 2) u.push('at', 'mortar');
  if (b.bar >= 3) u.push('sniper', 'flame');
  if (b.mot >= 1) u.push('apc');
  if (b.mot >= 2) u.push('tank');
  if (b.mot >= 3) u.push('aa');
  if (b.mot >= 4) u.push('mlrs');
  if (b.air >= 1) u.push('heli');
  if (b.art >= 1) u.push('smoke', 'medic');
  if (b.art >= 2) u.push('barrage');
  if (b.art >= 3) u.push('airstrike');
  if (b.air >= 2) u.push('para');
  for (const h of CAMP.heroes) u.push(h);
  return u;
}
function hasDoc(d) { return CAMP.doctrines.includes(d); }
function battleMods() {
  const b = CAMP.bld;
  return {
    lv: { inf: (b.bar >= 4 ? 1 : 0) + (b.bar >= 5 ? 1 : 0), veh: (b.mot >= 5 ? 1.25 : 0) + (CAMP.own.foundry === 'us' ? 1 : 0) + (hasDoc('steel') ? 1.25 : 0), air: (b.air >= 3 ? 1.67 : 0) + (hasDoc('sky') ? 1.67 : 0) },
    supMax: 10 + (b.hq - 1) + (hasDoc('rush') ? 1 : 0),
    regen: 0.42 * (1 + 0.05 * (b.hq - 1)),
    hqHp: 4500 * (b.hq >= 5 ? 1.3 : 1),
    cdMul: (b.art >= 4 ? 0.8 : 1) * (hasDoc('sky') ? 0.85 : 1),
  };
}
function diffOf(sid) {
  const s = SECTORS[sid], f = CAMP.own[sid];
  const tier = { kaz: 0, holder: 1, ilya: 1.2, severin: 2, none: -0.5 }[f] || 0;
  return tier + (s.cap ? 1 : 0) + CAMP.day / 9 + CAMP.beaten.length * 0.35;
}

/* ── 戰役地圖場景 ── */
const MAPV = { sel: null, t: 0, bg: null, ox: 0, oy: 0, s: 1, hover: null, arrows: [] };
function goMap() {
  G.scene = 'map'; B = null; PT.clear();
  if (!CAMP) campLoad();
  setLoop('rotor', 0); setLoop('engine', 0); setLoop('fire', 0); setLoop('wind', 0.04);
  if (!MAPV.bg) buildMapBG();
  MAPV.sel = MAPV.sel && SECTORS[MAPV.sel] ? MAPV.sel : null;
  buildMapUI();
  show('map');
  mapLayout();
  campSave();
  checkStoryOnMap();
}
function mapLayout() {
  const panel = Math.min(312, VIEW.w * 0.36), top = 50, bot = 56;
  const aw = VIEW.w - panel - 16, ah = VIEW.h - top - bot;
  MAPV.s = Math.min(aw / 1000, ah / 600);
  MAPV.ox = 8 + (aw - 1000 * MAPV.s) / 2; MAPV.oy = top + (ah - 600 * MAPV.s) / 2;
}
function m2s(x, y) { return [MAPV.ox + x * MAPV.s, MAPV.oy + y * MAPV.s]; }
function buildMapBG() {
  const R = mulberry32(42);
  MAPV.bg = mkSpr(null, 0, 0, 1000, 600, (g) => {
    g.fillStyle = lg(g, 0, 0, 0, 600, [0, '#dfe7ee', 1, '#cfd9e2']); g.fillRect(-10, -10, 1020, 620);
    // 地形：遠方的山
    const mtn = (x, y, w, h) => { g.fillStyle = lg(g, x, y - h, x, y, [0, '#a9b7c4', 1, '#8a99a8']); g.beginPath(); g.moveTo(x - w, y); g.lineTo(x, y - h); g.lineTo(x + w, y); g.closePath(); g.fill(); g.fillStyle = '#f4f8fb'; g.beginPath(); g.moveTo(x - w * 0.35, y - h * 0.65); g.lineTo(x, y - h); g.lineTo(x + w * 0.35, y - h * 0.65); g.lineTo(x + w * 0.1, y - h * 0.55); g.closePath(); g.fill(); };
    for (let i = 0; i < 26; i++) mtn(640 + R() * 360, 200 + R() * 220, 30 + R() * 30, 40 + R() * 50);

    g.fillStyle = 'rgba(160,205,232,.65)'; g.beginPath(); g.ellipse(420, 380, 70, 30, -0.2, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2; g.beginPath(); g.ellipse(420, 380, 60, 22, -0.2, 3.6, 5.2); g.stroke();
    g.strokeStyle = 'rgba(150,196,224,.8)'; g.lineWidth = 9; g.beginPath(); g.moveTo(540, 0); g.bezierCurveTo(600, 200, 520, 380, 640, 600); g.stroke();
    g.strokeStyle = 'rgba(220,238,248,.9)'; g.lineWidth = 3; g.stroke();
    g.fillStyle = 'rgba(160,205,232,.55)'; g.beginPath(); g.ellipse(260, 70, 160, 40, 0.1, 0, TAU); g.fill();
    // 森林
    for (let i = 0; i < 260; i++) {
      const cx = [[160, 160], [330, 300], [720, 470], [480, 200], [880, 120], [120, 470]][i % 6];
      const x = cx[0] + (R() - 0.5) * 140, y = cx[1] + (R() - 0.5) * 90, h = 7 + R() * 6;
      g.fillStyle = R() > 0.5 ? '#5d7468' : '#4d6459'; g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + h * 0.4, y); g.lineTo(x - h * 0.4, y); g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(x - 1, y - h + 1, 2, 2);
    }
    // 紙張質感
    for (let i = 0; i < 5000; i++) { g.fillStyle = R() > 0.5 ? 'rgba(255,255,255,.35)' : 'rgba(80,100,120,.05)'; g.fillRect(R() * 1000, R() * 600, 1.4, 1.4); }
    // 經緯線
    g.strokeStyle = 'rgba(70,90,110,.09)'; g.lineWidth = 1; for (let x = 0; x < 1000; x += 50) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 600); g.stroke(); } for (let y = 0; y < 600; y += 50) { g.beginPath(); g.moveTo(0, y); g.lineTo(1000, y); g.stroke(); }
  }, 2);
}
SCENES.map = {
  update(dt, rdt) { MAPV.t += rdt; },
  render(c) {
    const dpr = VIEW.dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = '#0d1218'; c.fillRect(0, 0, VIEW.w, VIEW.h);
    const s = MAPV.s;
    c.save(); c.translate(MAPV.ox, MAPV.oy); c.scale(s, s);
    c.drawImage(MAPV.bg.c, -MAPV.bg.ox, -MAPV.bg.oy, MAPV.bg.w, MAPV.bg.h);
    // 勢力範圍
    c.save(); c.beginPath(); c.rect(0, 0, 1000, 600); c.clip();
    for (const k in SECTORS) {
      const S = SECTORS[k], f = CAMP.own[k], col = FACTION[f].color;
      c.fillStyle = rg(c, S.x, S.y, 0, 95, [0, rgba(col, 0.42), 0.6, rgba(col, 0.18), 1, rgba(col, 0)]);
      c.beginPath(); c.arc(S.x, S.y, 95, 0, TAU); c.fill();
    }
    c.restore();
    c.strokeStyle = 'rgba(30,30,40,.35)'; c.lineWidth = 1.5; c.strokeRect(0, 0, 1000, 600);
    // 道路
    c.lineCap = 'round';
    for (const [a, b] of ROADS) {
      const A = SECTORS[a], Bb = SECTORS[b];
      const same = CAMP.own[a] === CAMP.own[b];
      c.strokeStyle = 'rgba(40,40,50,.35)'; c.lineWidth = 5; c.beginPath(); c.moveTo(A.x, A.y); c.lineTo(Bb.x, Bb.y); c.stroke();
      c.strokeStyle = same ? rgba(FACTION[CAMP.own[a]].color, 0.9) : '#f2efe6'; c.lineWidth = 2.2; c.setLineDash(same ? [] : [6, 5]); c.stroke(); c.setLineDash([]);
    }
    // 可以進攻的路：發亮
    for (const k of attackable()) {
      for (const n of neighbors(k)) if (CAMP.own[n] === 'us') {
        const A = SECTORS[n], Bb = SECTORS[k];
        c.strokeStyle = `rgba(157,255,92,${0.5 + Math.sin(MAPV.t * 4) * 0.3})`; c.lineWidth = 3.4; c.setLineDash([10, 8]); c.lineDashOffset = -MAPV.t * 30;
        c.beginPath(); c.moveTo(A.x, A.y); c.lineTo(Bb.x, Bb.y); c.stroke(); c.setLineDash([]);
      }
    }
    // 威脅箭頭
    for (const th of CAMP.threats) drawThreat(c, th);
    // 據點
    for (const k in SECTORS) drawNode(c, k);
    c.restore();
  },
  down(x, y) { MAPV.press = [x, y]; },
  up(x, y) {
    if (!MAPV.press || Math.hypot(x - MAPV.press[0], y - MAPV.press[1]) > 14) return;
    let best = null, bd = 30;
    for (const k in SECTORS) { const [sx, sy] = m2s(SECTORS[k].x, SECTORS[k].y); const d = Math.hypot(sx - x, sy - y); if (d < bd) { bd = d; best = k; } }
    if (best) { MAPV.sel = best; sfx('tick'); renderMapPanel(); }
  },
};
function attackable() {
  const out = [];
  for (const k in SECTORS) {
    if (CAMP.own[k] === 'us') continue;
    if (SECTORS[k].locked && !finalAct()) continue;
    if (neighbors(k).some((n) => CAMP.own[n] === 'us')) out.push(k);
  }
  return out;
}
function drawThreat(c, th) {
  const A = SECTORS[th.from], Bb = SECTORS[th.to];
  const t = (MAPV.t * 0.8) % 1;
  const col = FACTION[th.fac].color;
  const dx = Bb.x - A.x, dy = Bb.y - A.y, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
  c.strokeStyle = rgba(col, 0.9); c.lineWidth = 5; c.beginPath(); c.moveTo(A.x + ux * 24, A.y + uy * 24); c.lineTo(Bb.x - ux * 30, Bb.y - uy * 30); c.stroke();
  const hx = Bb.x - ux * 26, hy = Bb.y - uy * 26;
  c.fillStyle = col; c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx - ux * 14 - uy * 9, hy - uy * 14 + ux * 9); c.lineTo(hx - ux * 14 + uy * 9, hy - uy * 14 - ux * 9); c.closePath(); c.fill();
  const px = lerp(A.x, Bb.x, t), py = lerp(A.y, Bb.y, t);
  c.fillStyle = '#fff'; c.beginPath(); c.arc(px, py, 3.4, 0, TAU); c.fill();
}
function drawNode(c, k) {
  const S = SECTORS[k], f = CAMP.own[k], col = FACTION[f].color;
  const sel = MAPV.sel === k, atk = attackable().includes(k);
  const r = S.cap ? 19 : 14;
  if (sel) { c.strokeStyle = '#ffd36a'; c.lineWidth = 3; c.beginPath(); c.arc(S.x, S.y, r + 7 + Math.sin(MAPV.t * 5) * 2, 0, TAU); c.stroke(); }
  if (atk) { c.strokeStyle = `rgba(157,255,92,${0.6 + Math.sin(MAPV.t * 4) * 0.3})`; c.lineWidth = 2; c.beginPath(); c.arc(S.x, S.y, r + 4, 0, TAU); c.stroke(); }
  c.fillStyle = 'rgba(20,24,30,.35)'; c.beginPath(); c.ellipse(S.x, S.y + r * 0.9, r * 1.1, r * 0.35, 0, 0, TAU); c.fill();
  c.beginPath(); c.arc(S.x, S.y, r, 0, TAU); c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = '#1a1720'; c.stroke();
  c.beginPath(); c.arc(S.x, S.y, r - 4, 0, TAU); c.fillStyle = '#1d232b'; c.fill();
  nodeIcon(c, S.icon, S.x, S.y, r - 6, col);
  if (S.locked && !finalAct()) { c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.arc(S.x, S.y, r - 4, 0, TAU); c.fill(); c.strokeStyle = '#ffd36a'; c.lineWidth = 2; c.strokeRect(S.x - 4, S.y - 2, 8, 7); c.beginPath(); c.arc(S.x, S.y - 3, 3.4, Math.PI, TAU); c.stroke(); }
  c.font = `900 ${(S.cap ? 14 : 12.5) / Math.max(0.8, MAPV.s)}px "Noto Sans TC","PingFang TC",sans-serif`; c.textAlign = 'center';
  c.lineWidth = 3.4; c.strokeStyle = 'rgba(240,244,248,.92)'; c.strokeText(S.name, S.x, S.y + r + 14); c.fillStyle = '#1a1f26'; c.fillText(S.name, S.x, S.y + r + 14);
}
function nodeIcon(c, ic, x, y, r, col) {
  c.save(); c.translate(x, y); c.fillStyle = '#eef2f5'; c.strokeStyle = '#eef2f5'; c.lineWidth = 1.6;
  const s = r / 8;
  c.scale(s, s);
  if (ic === 'hq' || ic === 'cap') { c.beginPath(); c.moveTo(-1, 7); c.lineTo(-1, -7); c.stroke(); c.fillStyle = col; c.beginPath(); c.moveTo(-1, -7); c.lineTo(7, -4); c.lineTo(-1, -1); c.closePath(); c.fill(); if (ic === 'cap') { c.fillStyle = '#ffd36a'; c.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * TAU / 5; c.lineTo(-5 + Math.cos(a) * 3, 4 + Math.sin(a) * 3); c.lineTo(-5 + Math.cos(a + 0.63) * 1.3, 4 + Math.sin(a + 0.63) * 1.3); } c.fill(); } }
  else if (ic === 'town') { c.fillRect(-6, -1, 5, 6); c.fillRect(1, -3, 5, 8); c.beginPath(); c.moveTo(-7, -1); c.lineTo(-3.5, -5); c.lineTo(0, -1); c.fill(); c.beginPath(); c.moveTo(0, -3); c.lineTo(3.5, -7); c.lineTo(7, -3); c.fill(); }
  else if (ic === 'oil') { c.beginPath(); c.moveTo(-5, 6); c.lineTo(0, -7); c.lineTo(5, 6); c.stroke(); c.beginPath(); c.moveTo(-3, 1); c.lineTo(3, 1); c.stroke(); c.fillRect(-7, 5, 14, 2); }
  else if (ic === 'radar') { c.beginPath(); c.arc(0, -1, 6, Math.PI * 0.9, Math.PI * 2.1); c.stroke(); c.beginPath(); c.moveTo(0, -1); c.lineTo(0, 7); c.stroke(); c.beginPath(); c.arc(0, -1, 1.6, 0, TAU); c.fill(); }
  else if (ic === 'post') { c.fillRect(-2, -5, 4, 12); c.fillRect(-5, -7, 10, 3); }
  else if (ic === 'depot') { c.strokeRect(-6, -4, 12, 10); c.beginPath(); c.moveTo(-6, -4); c.lineTo(6, 6); c.moveTo(6, -4); c.lineTo(-6, 6); c.stroke(); }
  else if (ic === 'factory') { c.fillRect(-7, 0, 14, 7); c.fillRect(-5, -7, 3, 8); c.fillRect(1, -5, 3, 6); }
  else if (ic === 'bell') { c.beginPath(); c.moveTo(-6, 4); c.quadraticCurveTo(-5, -7, 0, -7); c.quadraticCurveTo(5, -7, 6, 4); c.closePath(); c.fill(); c.beginPath(); c.arc(0, 6, 1.8, 0, TAU); c.fill(); }
  c.restore();
}

  if (c.tutorial) { CAMP.tutorial = false; CAMP.wins++; logAdd(win ? '擊退焦土幫的突襲。' : '前哨差點被搶光。'); campSave(); playStory(STORY.tutorialWin, () => goMap()); return; }

function aiTurn(events) {
  let defense = null;
  // 到期的進攻（有雷達才會提前一天預警）

  CAMP.threats = CAMP.threats.filter((t) => t.day > CAMP.day + 1);
  for (const t of due) if (CAMP.own[t.to] === 'us' && CAMP.own[t.from] === t.fac && !defense) defense = t;
  for (const f of RIVALS) {
    if (!rivalAlive(f) && f !== 'severin') continue;
    const mine = owned(f); if (!mine.length) continue;
    const late = finalAct() && f === 'severin';
    const p = late ? 0.75 : clamp(0.22 + mine.length * 0.06 + (CAMP.fear || 0) * 0.05, 0.2, 0.6);
    if (!chance(p)) continue;
    const opts = [];
    for (const k of mine) for (const n of neighbors(k)) {
      const o = CAMP.own[n];
      if (o === f || SECTORS[n].cap && o !== 'us') continue;
      if (n === 'p7' && owned('us').length > 3 && !late) continue;
      const w = o === 'us' ? (0.6 + owned('us').length * 0.12 + (late ? 2 : 0)) : o === 'none' ? 1.2 : 0.8;
      opts.push([k, n, o, w]);
    }
    if (!opts.length) continue;
    let sum = opts.reduce((a, b) => a + b[3], 0), r = Math.random() * sum, ch = opts[0];
    for (const o of opts) { r -= o[3]; if (r <= 0) { ch = o; break; } }
    const [from, to, o] = ch;
    if (o === 'us') {
      const radar = CAMP.own.radar === 'us';
      const th = { fac: f, from, to, day: CAMP.day + (radar ? 2 : 1) };
      if (radar) { CAMP.threats.push(th); events.push(`<b style="color:${FACTION[f].color}">${FACTION[f].name}</b>在${SECTORS[from].name}集結，明天要打你的<b>${SECTORS[to].name}</b>！（雷達站預警）`); }
      else if (!defense) { defense = th; events.push(`<b style="color:${FACTION[f].color}">${FACTION[f].name}</b>突襲你的<b>${SECTORS[to].name}</b>！`); }
    } else {
      const pa = owned(f).length, pd = o === 'none' ? 1 : owned(o).length;
      const win = chance(clamp(0.5 + (pa - pd) * 0.07, 0.25, 0.8));
      if (win) { CAMP.own[to] = f; const t = `${FACTION[f].name}從${o === 'none' ? '無主之地' : FACTION[o].name}手上搶下了${SECTORS[to].name}。`; logAdd(t); events.push(t); }
      else { const t = `${FACTION[f].name}進攻${SECTORS[to].name}失敗。`; events.push(t); }
    }
  }
  return defense;
}

  const rows = all.filter((k) => un.includes(k) || !HERO[k]).map((k) => {
    const d = ABIL[k] || HERO[k] || UDEF[k], ok = un.includes(k);
    return `<li style="${ok ? '' : 'opacity:.45'}"><b>${HERO[k] ? HERO[k].name : d.name}</b>（${costOf(k)} 補給）${ok ? '' : '・未解鎖'}<br>${esc(HERO[k] ? `大招「${HERO[k].skill}」：${HERO[k].skillDesc}` : d.desc)}${d.good ? `<br><span style="color:#a9ff7c">剋：${d.good}</span>　<span style="color:#ff9a7f">怕：${d.bad}</span>` : ''}</li>`;
  }).join('');
  openModal('部隊與技能', `<ul style="list-style:none;padding:0">${rows}</ul>`, [['關閉', null]]);
}

/* ── 劇情對話 ── */
function playStory(lines, done) {
  const d = $('#dlg');
  let i = 0, typing = null;
  const prevScene = G.scene;
  const step = () => {
    if (i >= lines.length) { d.classList.remove('on'); d.onclick = null; if (done) done(); return; }
    const [who, txt] = lines[i++];
    const P = PORTRAIT[who];
    d.innerHTML = `<div class="box panel"><div class="por">${P ? '<canvas width="248" height="248"></canvas>' : ''}</div><div class="who" style="color:${who === 'wei' || who === 'amo' || who === 'boiler' || who === 'sparrow' ? 'var(--us)' : who === '*' ? 'var(--mute)' : '#ff9a7f'}">${P ? P.name + '<span style="color:var(--mute);margin-left:8px;font-size:11px">' + P.role + '</span>' : '　'}</div><div class="txt"></div><div class="nx">點一下繼續 ▸</div></div>`;
    if (!P) $('.box', d).style.paddingLeft = '22px';
    if (P) $('.por canvas', d).getContext('2d').drawImage(portraitCanvas(who, 124, !(who === 'wei' || who === 'amo' || who === 'boiler' || who === 'sparrow')), 0, 0, 248, 248);
    const tx = $('.txt', d);
    let n = 0; clearInterval(typing);
    typing = setInterval(() => { n += 2; tx.textContent = txt.slice(0, n); if (n >= txt.length) { clearInterval(typing); typing = null; } }, 22);
    if (who !== '*') sfx('radio');
    d.onclick = () => { sfx('tick'); if (typing) { clearInterval(typing); typing = null; tx.textContent = txt; return; } step(); };
  };
  for (const x of $$('#ui > .scr')) if (x.id !== 'dlg' && x.id !== 'modal') x.classList.remove('on');
  d.classList.add('on');
  step();
}
function askChoice(title, opts) {
  const d = $('#dlg');
  d.innerHTML = `<div class="box panel" style="padding-left:22px"><div class="who" style="color:var(--gold)">${esc(title)}</div><div class="chs"></div></div>`;
  const ch = $('.chs', d);
  for (const [t, sub, fn] of opts) { const b = el('button', 'btn alt', `${esc(t)}<small>${esc(sub)}</small>`); b.onclick = (e) => { e.stopPropagation(); sfx('click'); d.classList.remove('on'); fn(); }; ch.appendChild(b); }
  d.onclick = null;
  for (const x of $$('#ui > .scr')) if (x.id !== 'dlg' && x.id !== 'modal') x.classList.remove('on');
  d.classList.add('on');
}

/* ───────────── 展示場：每種小兵、每個動作排一排（開發與截圖檢查用，網址加 #show） ───────────── */
SCENES.show = {
  units: [], mode: '',
  enter(arg) {
    this.mode = arg.replace(/^[=:]/, '') || 'soldiers';
    this.units = []; this.vehs = [];
    if (this.mode === 'veh') return this.enterVeh();
    const pals = ['us', 'red', 'kaz', 'holder', 'ilya', 'severin'];
    const cols = [
      { wk: 'ar', st: 'stand' }, { wk: 'ar', st: 'stand', walk: 26 }, { wk: 'ar', st: 'stand', walk: 60 },
      { wk: 'ar', st: 'kneel', fire: 0.28 }, { wk: 'ar', st: 'stand', fire: 0.35 }, { wk: 'ar', st: 'kneel', act: 'reload' },
      { wk: 'ar', st: 'stand', act: 'throw' }, { wk: 'mg', st: 'prone', fire: 0.09 }, { wk: 'rpg', st: 'kneel', fire: 2.6 },
      { wk: 'sr', st: 'prone', fire: 1.6, act2: 'bolt' }, { wk: 'ft', st: 'stand', fire: 0.05 }, { wk: 'ar', st: 'stand', act: 'cheer' },
      { wk: 'ar', st: 'stand', die: 'shot' }, { wk: 'ar', st: 'stand', die: 'blast' },
    ];
    pals.forEach((pal, row) => {
      cols.forEach((c, col) => {
        const u = { x: 40 + col * 72, y: 70 + row * 78, face: 1, cfg: c, home: 40 + col * 72 };
        newSoldierAnim(u, pal, c.wk);
        setStance(u, c.st); u.stb = 1; u.st0 = c.st;
        if (c.fire) { u.wantAim = true; u.aimTA = -0.05; u.aimA = -0.05; u.aimB = 1; }
        u.timer = rnd(0, 0.3);
        this.units.push(u);
      });
    });
    CAM.z = 1.4; CAM.x = 40 + 6.5 * 72; CAM.y = 70 + 2.6 * 78;
  },
  enterVeh() {
    const mk = (vk, pal, x, y, o) => { const u = Object.assign({ x, y, face: 1 }, o || {}); newVehAnim(u, vk, pal); this.vehs.push(u); return u; };
    mk('tank', 'us', 80, 120, { drive: 30 }); mk('tank', 'holder', 260, 120, { fireT: 1.2, face: -1 });
    mk('apc', 'us', 430, 120, { rampLoop: true }); mk('aa', 'ilya', 600, 120, { aaFire: true });
    mk('truck', 'us', 80, 240, { mlrs: true }); mk('heli', 'us', 270, 190, { hover: true }); mk('heli', 'ilya', 470, 190, { hover: true, face: -1 });
    const w = mk('tank', 'kaz', 620, 250, {}); w.wreck = true;
    CAM.z = 1.5; CAM.x = 350; CAM.y = 170;
  },
  update(dt) {
    for (const u of this.vehs) {
      u.t = (u.t || 0) + dt;
      if (u.drive) { u.vx = Math.sin(u.t * 0.8) > 0 ? u.drive : 0; }
      if (u.fireT) { u.ft = (u.ft || 0) - dt; u.aimTA = 0.06; if (u.ft <= 0) { u.ft = u.fireT; u.recoil = 1; u.antV += 3; const m = vehMuzzle(u); P('flash', m[0], m[1], { rot: m[2], max: 0.08, size: 1.6, spr: FXS.mf1 }); P('glow', m[0], m[1], { max: 0.15, size: 1.2, spr: FXS.gO, add: true }); for (let i = 0; i < 8; i++) P('smoke', m[0], m[1], { vx: Math.cos(m[2]) * rnd(20, 90) + rnd(-20, 20), vy: rnd(-30, 10), drag: 2, max: rnd(0.8, 1.6), size: 0.22, grow: 0.7, alpha: 0.7, spr: FXS.smoke }); } }
      if (u.rampLoop) u.ramp = clamp(Math.sin(u.t * 0.9) * 1.4, 0, 1);
      if (u.aaFire) { u.aimTA = 0.7; u.ft = (u.ft || 0) - dt; if (u.ft <= 0) { u.ft = 0.09; u.gunSide = 1 - u.gunSide; u.recoil = 1; const m = vehMuzzle(u, u.gunSide); P('flash', m[0], m[1], { rot: m[2], max: 0.05, size: 0.7, spr: FXS.mf0 }); } }
      if (u.mlrs) { u.jacks = clamp(Math.sin(u.t * 0.5) * 2, 0, 1); u.pod = u.jacks; }
      if (u.hover) { u.y = 190 + Math.sin(u.t * 1.6) * 4; u.vx = Math.sin(u.t * 0.6) * 40; u.aimTA = 0.25; }
      animVeh(u, dt);
    }
    for (const u of this.units) {
      const c = u.cfg;
      u.timer -= dt;
      if (c.walk) { u.vx = c.walk; u.x += c.walk * dt * 0.0; }
      if (c.fire && u.timer <= 0 && !u.act) {
        u.timer = c.fire; u.rec = 1; setExpr(u, chance(0.3) ? 's' : 'f', 0.4);
        if (typeof fxMuzzle === 'function') fxMuzzle(u);
        if (c.wk === 'rpg') { u.warhead = false; startReload(u); }
        if (c.act2 === 'bolt') startReload(u);
      }
      if (c.act && !u.act && u.timer <= 0) {
        u.timer = 0.6;
        if (c.act === 'reload') startReload(u);
        else if (c.act === 'throw') startThrow(u, u.x + 120, u.y);
        else if (c.act === 'cheer') startCheer(u, 2);
      }
      if (c.die) {
        if (!u.death && u.timer <= 0) { killSoldier(u, c.die, -1, 1); }
        if (u.gone || (u.death && u.death.t > 4)) { const keep = { x: u.home, y: u.y, face: 1, cfg: c, home: u.home }; Object.keys(u).forEach((k) => delete u[k]); Object.assign(u, keep); newSoldierAnim(u, keep.pal || u.pal || 'us', c.wk); }
      }
      animSoldier(u, dt);
      soldierRig(u);
    }
    if (typeof updateFx === 'function') updateFx(dt);
  },
  render(c) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#dfe6ee'; c.fillRect(0, 0, cv.width, cv.height);
    applyCam(c);
    c.lineJoin = 'round'; c.lineCap = 'round';
    for (let row = 0; row < 6; row++) {
      c.fillStyle = 'rgba(0,0,0,.06)'; c.fillRect(0, 70 + row * 78 - 1, 1100, 2);
    }
    for (const u of this.units) { c.fillStyle = 'rgba(30,40,60,.22)'; c.beginPath(); c.ellipse(u.x + (u.death ? u.death.ox || 0 : 0), u.y, 11, 2.6, 0, 0, TAU); c.fill(); }
    for (const u of this.vehs) { c.fillStyle = 'rgba(30,40,60,.22)'; c.beginPath(); c.ellipse(u.x, u.vk === 'heli' ? 250 : u.y, 46, 6, 0, 0, TAU); c.fill(); }
    if (typeof drawFx === 'function') drawFx(c, 0);
    for (const u of this.vehs) drawVehicle(c, u);
    for (const u of this.units) drawSoldier(c, u);
    if (typeof drawFx === 'function') drawFx(c, 1);
  },
};
window.__show = {
  step(sec, n) { G.freeze = true; const k = n || Math.ceil(sec * 60); for (let i = 0; i < k; i++) { G.t += sec / k; SCENES[G.scene].update(sec / k); } SCENES[G.scene].render(ctx); },
  cam(x, y, z) { G.freeze = true; CAM.x = x; CAM.y = y; CAM.z = z; SCENES[G.scene].render(ctx); },
};

/* 圖示：一個小兵在雪地上把綠旗升起來 */
SCENES.icon = {
  enter() { G.scene = 'icon'; this.u = { x: 0, y: 0, face: 1 }; newSoldierAnim(this.u, 'us', 'ar'); startRaise(this.u, 9, 99); this.u.act.t = 0.35; soldierRig(this.u); },
  update() {},
  render(c) {
    const S = Math.min(VIEW.w, VIEW.h), dpr = VIEW.dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, S); g.addColorStop(0, '#1b2a3c'); g.addColorStop(0.6, '#3e5a6e'); g.addColorStop(1, '#9fb6c9'); c.fillStyle = g; c.fillRect(0, 0, VIEW.w, VIEW.h);
    c.fillStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.arc(S * 0.72, S * 0.28, S * 0.2, 0, TAU); c.fill();
    c.fillStyle = '#5a6e7c'; c.beginPath(); c.moveTo(0, S * 0.7); for (let x = 0; x <= S; x += S / 10) c.lineTo(x, S * (0.6 + 0.07 * Math.sin(x * 0.03))); c.lineTo(S, S); c.lineTo(0, S); c.fill();
    c.fillStyle = '#e8eef3'; c.beginPath(); c.ellipse(S * 0.5, S * 1.02, S * 0.9, S * 0.3, 0, 0, TAU); c.fill();
    const k = S / 120;
    c.save(); c.translate(S * 0.4, S * 0.88); c.scale(k, k); c.lineJoin = 'round'; c.lineCap = 'round';
    // 旗桿＋旗子
    c.strokeStyle = OUT; c.lineWidth = 3.4; c.beginPath(); c.moveTo(14, 0); c.lineTo(14, -84); c.stroke(); c.strokeStyle = '#c9ccd2'; c.lineWidth = 1.6; c.stroke();
    dot(c, 14, -85, 2.4, '#e0c060');
    c.save(); c.translate(14, -82);
    const pts = []; for (let i = 0; i <= 6; i++) { const t = i / 6; pts.push([t * 46, Math.sin(1.2 - t * 3.2) * 4 * t]); }
    c.beginPath(); c.moveTo(0, 0); for (const q of pts) c.lineTo(q[0], q[1]); for (let i = 6; i >= 0; i--) c.lineTo(pts[i][0], pts[i][1] + 28); c.closePath();
    c.fillStyle = PAL.us.flagA; c.fill(); c.lineWidth = OW; c.strokeStyle = OUT; c.stroke();
    c.fillStyle = PAL.us.flagB; c.beginPath(); c.moveTo(18, 22); c.lineTo(24, 6); c.lineTo(30, 22); c.closePath(); c.fill();
    c.restore();
    c.fillStyle = 'rgba(40,52,72,.25)'; c.beginPath(); c.ellipse(4, 1, 22, 4, 0, 0, TAU); c.fill();
    this.u.x = 0; this.u.y = 0; drawSoldier(c, this.u);
    c.restore();
  },
};
window.__icon = () => { G.freeze = true; SCENES.icon.enter(); SCENES.icon.render(ctx); };
