<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>偷渡者 STOWAWAY</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05080c; --navy:#0c1520; --navy2:#122030; --panel:rgba(10,16,24,.9); --panel2:rgba(16,26,38,.94);
  --cream:#ece4d2; --cream2:#bdb5a3; --dim:#7d8794; --line:rgba(236,228,210,.16);
  --orange:#ff6a1a; --amber:#ffb03a; --red:#ff3d3d; --cyan:#6fe8ff; --green:#86f0a0; --blue:#5aa8ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --f:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;
  --m:'Chakra Petch','Noto Sans TC',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ink);color:var(--cream);font-family:var(--f);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#020305}
.hide{display:none!important}
.mono{font-family:var(--m);letter-spacing:.04em}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#topbar{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 0 calc(var(--sal) + 8px);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#topbar>*{pointer-events:auto}
#actchip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--orange);padding:5px 9px 6px;min-width:118px;border-radius:2px 2px 8px 8px}
#actchip .an{font:600 10px var(--m);color:var(--orange);letter-spacing:.18em}
#actchip .at{font-weight:900;font-size:15px;line-height:1.15;letter-spacing:.06em}
#actchip .ck{font:600 11px var(--m);color:var(--cream2);margin-top:1px;display:flex;gap:8px;align-items:center}
#actchip .ck .stg{color:var(--cyan)}
#objbox{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:2px 2px 8px 8px;padding:5px 9px 6px;font-size:12px;line-height:1.45;max-height:88px;overflow:hidden;transition:max-height .25s;cursor:pointer}
#objbox:not(.open) .o span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}
#objbox:not(.open) .o.info{display:none}
#objbox .o span{flex:1;min-width:0}
#objbox.open{max-height:70vh;overflow:auto}
#objbox .oh{font:600 10px var(--m);letter-spacing:.18em;color:var(--cream2);display:flex;justify-content:space-between}
#objbox .oh .tm{color:var(--amber);letter-spacing:.04em}
#objbox .o{display:flex;gap:6px;align-items:flex-start}
#objbox .o i{font-style:normal;flex:0 0 auto;width:12px;color:var(--orange)}
#objbox .o.done{color:var(--dim);text-decoration:line-through}
#objbox .o.done i{color:var(--green)}
#objbox .o.opt i{color:var(--cyan)}
#objbox .o b{color:var(--amber);font-weight:700}
#tbr{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tbtn{width:44px;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font:700 13px var(--m)}
.tbtn svg{width:20px;height:20px}
#parts{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 7px;font:700 12px var(--m);color:var(--amber);white-space:nowrap}

#lbtns{position:absolute;left:calc(var(--sal) + 8px);top:calc(var(--sat) + 120px);display:flex;flex-direction:column;gap:8px}
.lbtn{width:52px;min-height:50px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cream2);border-radius:4px 10px 10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--cream)}
.lbtn svg{width:22px;height:22px}
.lbtn.on{border-left-color:var(--orange);background:rgba(60,26,10,.9)}
.lbtn.hot{animation:hot 1s infinite}
.lbtn.off{opacity:.42}
@keyframes hot{50%{border-left-color:var(--amber);box-shadow:0 0 14px rgba(255,140,40,.45)}}

#toasts{position:absolute;left:calc(var(--sal) + 68px);right:calc(var(--sar) + 10px);top:calc(var(--sat) + 104px);display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:flex-start;max-width:460px}
.toast{background:rgba(12,18,26,.93);border:1px solid var(--line);border-left:4px solid var(--orange);padding:6px 10px;border-radius:4px;font-size:12.5px;line-height:1.42;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .25s ease-out;max-width:100%}
.toast.good{border-left-color:var(--green)}
.toast.loot{border-left-color:var(--amber)}
.toast.loot.r2{border-left-color:var(--blue)}
.toast.loot.r3{border-left-color:var(--amber);background:linear-gradient(90deg,rgba(80,52,8,.96),rgba(12,18,26,.95));box-shadow:0 0 24px rgba(255,176,58,.35)}
.toast.bad{border-left-color:var(--red)}
.toast.learn{border-left-color:var(--cyan);background:rgba(8,26,34,.95)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

#subs{position:absolute;left:50%;transform:translateX(-50%);width:min(94vw,520px);display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:center}
.sub{background:rgba(4,7,10,.78);padding:6px 12px;border-radius:6px;font-size:14px;line-height:1.45;text-align:center;animation:tin .2s;max-width:100%}
.sub b{color:var(--amber);margin-right:6px;font-weight:700}
.sub.mimic b{color:var(--cyan)}
.sub.out{opacity:0;transition:.5s}

#grab{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,20,20,.0);transition:box-shadow .2s}
#grab.on{box-shadow:inset 0 0 140px rgba(255,20,20,.55)}
#grab .gbx{position:absolute;left:50%;top:calc(var(--sat) + 106px);transform:translateX(-50%);width:min(88vw,420px);background:rgba(60,4,4,.92);border:1px solid #ff5a5a;border-radius:10px;padding:8px 12px;text-align:center;font-size:15px;line-height:1.45;animation:tin .2s;box-shadow:0 0 30px rgba(255,30,30,.4)}
#grab .gbx b{color:#fff;font-weight:900}
#grab .gbx span{font-size:12px;color:#ffd0d0}
#grab .gbx.op{background:rgba(8,40,52,.94);border-color:var(--cyan);box-shadow:0 0 30px rgba(111,232,255,.35);animation:tin .2s,opp 1s infinite}
#grab .gbx.op span{color:#cff6ff}
@keyframes opp{50%{box-shadow:0 0 44px rgba(111,232,255,.6)}}

/* 搖桿 */
#joy,#joyhint{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none!important;z-index:3}
#joy .jb,#joyhint .jb{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(236,228,210,.34);background:radial-gradient(circle,rgba(10,16,24,.12) 0,rgba(10,16,24,.5) 72%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.35)}
#joy .jb::after{content:'';position:absolute;inset:11px;border-radius:50%;border:1px dashed rgba(255,106,26,.5)}
#joy .jb::before{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(236,228,210,.35)}
#joy .jk{position:absolute;left:-27px;top:-27px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f6efe1,#bdb19a 70%,#8d826e);box-shadow:0 5px 16px rgba(0,0,0,.55),inset 0 -3px 6px rgba(0,0,0,.25);transition:background .15s,box-shadow .15s}
#joy.run .jk{background:radial-gradient(circle at 38% 32%,#ffc49a,#ff6a1a 70%,#b8420c);box-shadow:0 0 22px rgba(255,106,26,.75),inset 0 -3px 6px rgba(0,0,0,.25)}
#joy.run .jb{border-color:rgba(255,106,26,.75)}
#joy .jl{position:absolute;left:-60px;top:66px;width:120px;text-align:center;font:700 11px var(--m);color:var(--orange);letter-spacing:.16em;text-shadow:0 1px 4px #000}
#joyhint{animation:jh 2.4s ease-in-out infinite}
#joyhint .jb{border-style:dashed;border-color:rgba(236,228,210,.4);background:radial-gradient(circle,rgba(10,16,24,.05),rgba(10,16,24,.32) 72%)}
#joyhint span{position:absolute;left:-60px;top:-9px;width:120px;text-align:center;font-size:12px;font-weight:700;color:var(--cream);letter-spacing:.08em;text-shadow:0 1px 4px #000}
@keyframes jh{50%{opacity:.45}}
/* 屏息 */
#breath{position:absolute;right:calc(var(--sar) + 14px);bottom:calc(var(--bh,160px) + 62px);width:96px;height:96px;border-radius:50%;background:rgba(6,24,32,.94);border:2px solid var(--cyan);color:#e2f9ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 0 26px rgba(111,232,255,.4);touch-action:none;z-index:4}
#breath b{font-size:19px;font-weight:900;letter-spacing:.12em;padding-left:.12em}
#breath small{font:700 10px var(--f);color:var(--cyan);letter-spacing:.06em;max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#breath svg.rg{position:absolute;left:-6px;top:-6px;width:104px;height:104px;transform:rotate(-90deg);pointer-events:none}
#breath .rt{fill:none;stroke:rgba(111,232,255,.16);stroke-width:5}
#breath .rf{fill:none;stroke:var(--cyan);stroke-width:5;stroke-linecap:round;stroke-dasharray:301.6;transition:stroke-dashoffset .1s linear}
#breath.on{background:rgba(30,90,110,.96);transform:scale(.95)}
#breath.low{border-color:#ff8080;box-shadow:0 0 26px rgba(255,80,80,.5)}
#breath.low .rf{stroke:#ff8080}
#breath.alert{animation:brp .7s infinite}
@keyframes brp{50%{box-shadow:0 0 46px rgba(111,232,255,.9);transform:scale(1.06)}}
@media (min-aspect-ratio:13/10){#breath{bottom:calc(var(--sab) + 86px)}}

#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bottom>*{pointer-events:auto}
#actbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:0}
.abtn{min-width:58px;height:50px;padding:0 9px;background:var(--panel2);border:1px solid var(--line);border-bottom:3px solid var(--cream2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;letter-spacing:.04em;position:relative}
.abtn svg{width:20px;height:20px}
.abtn .ct{position:absolute;right:4px;top:2px;font:700 10px var(--m);color:var(--amber)}
.abtn.on{border-bottom-color:var(--orange);background:rgba(70,30,10,.95)}
.abtn.warn{border-bottom-color:var(--red)}
.abtn.r2{border-bottom-color:var(--blue)}
.abtn.r3{border-bottom-color:var(--amber)}
.abtn:disabled{opacity:.38}
.abtn.arm{animation:arm .9s infinite}
@keyframes arm{50%{background:rgba(100,46,10,.98)}}
#hint{font-size:12px;color:var(--cream2);text-align:center;background:rgba(4,7,10,.7);border-radius:6px;padding:4px 10px;align-self:center;max-width:94vw}
#crewbar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cc{position:relative;height:84px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:stretch}
.cc canvas{width:100%;height:46px;display:block}
.cc .nm{font-size:11px;font-weight:700;text-align:center;line-height:1.1;margin-top:1px;white-space:nowrap;overflow:hidden}
.cc .st{display:flex;justify-content:space-between;align-items:center;padding:1px 4px 0;font:700 10px var(--m)}
.cc .bpm{color:var(--green)}
.cc .bpm.y{color:var(--amber)}.cc .bpm.r{color:var(--red)}
.cc .hp{display:flex;gap:2px}
.cc .hp i{width:6px;height:6px;border-radius:1px;background:var(--green)}
.cc .hp i.x{background:#3a2626}
.cc .tk{position:absolute;left:0;right:0;top:0;font-size:9px;text-align:center;background:rgba(0,0,0,.55);color:var(--cream2);padding:1px 0;white-space:nowrap;overflow:hidden}
.cc .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--orange)}
.cc.sel{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange) inset,0 0 18px rgba(255,106,26,.35)}
.cc.grab{animation:grabb .35s infinite}
@keyframes grabb{50%{background:rgba(120,10,10,.9)}}
.cc.dead{opacity:.35;filter:grayscale(1)}
.cc.dead .tk{color:var(--red)}
.cc.panic .nm{color:var(--red)}
.cc .ico{position:absolute;right:3px;top:14px;display:flex;flex-direction:column;gap:1px}
.cc .ico span{width:13px;height:13px;border-radius:3px;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:8px}

/* landscape */
@media (min-aspect-ratio:13/10){
  #crewbar{position:fixed;left:calc(var(--sal) + 6px);top:calc(var(--sat) + 104px);bottom:calc(var(--sab) + 8px);width:128px;display:flex;flex-direction:column;gap:5px;overflow:auto}
  .cc{height:auto;min-height:62px;flex-direction:row;align-items:center}
  .cc canvas{width:48px;height:58px;flex:0 0 48px}
  .cc .meta{flex:1;min-width:0}
  #lbtns{left:calc(var(--sal) + 142px)}
  #bottom{padding-left:calc(var(--sal) + 140px)}
  #toasts{top:calc(var(--sat) + 60px)}
}

/* ---------- 面板 ---------- */
.panel{position:fixed;z-index:30;background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:4px 4px 12px 12px;box-shadow:0 18px 60px rgba(0,0,0,.6);padding:10px 12px 12px;max-width:94vw}
.panel h3{font-size:15px;font-weight:900;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h3 small{font:600 10px var(--m);color:var(--orange);letter-spacing:.2em}
.panel .x{width:36px;height:32px;border-radius:6px;background:rgba(255,255,255,.06);font-size:16px}
.panel p{font-size:12px;color:var(--cream2);line-height:1.5;margin-top:4px}
#pmenu{position:fixed;z-index:31;display:flex;flex-direction:column;gap:5px;min-width:136px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#pmenu .t{font:600 10px var(--m);letter-spacing:.14em;color:var(--orange);padding:2px 4px 0}
#pmenu button{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:7px;background:rgba(255,255,255,.05);font-size:14px;font-weight:700}
#pmenu button small{font-weight:400;color:var(--cream2);font-size:11px;margin-left:auto}
#pmenu button:disabled{opacity:.4}
#pmenu button.d{color:var(--red)}
#ppower{left:50%;top:50%;transform:translate(-50%,-50%);width:330px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.prow .pn{flex:1;font-size:13px;font-weight:700}
.prow .pn small{display:block;font-weight:400;color:var(--cream2);font-size:11px}
.prow .pp{display:flex;gap:3px}
.prow .pp i{width:12px;height:18px;border-radius:2px;background:#2a3340}
.prow .pp i.on{background:var(--amber);box-shadow:0 0 8px rgba(255,176,58,.6)}
.prow button{width:62px;height:34px;border-radius:7px;background:rgba(255,255,255,.07);font-weight:700;font-size:12px}
.prow button.on{background:var(--orange);color:#120800}
.pcap{display:flex;gap:4px;margin:8px 0 4px;align-items:center;font:700 12px var(--m)}
.pcap i{width:22px;height:14px;border-radius:2px;background:#2a3340}
.pcap i.u{background:var(--amber)}
#pcraft{left:50%;top:50%;transform:translate(-50%,-50%);width:340px}
.crow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .ci{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.06);display:grid;place-items:center}
.crow .ci svg{width:24px;height:24px}
.crow .cn{flex:1;font-size:13px;font-weight:700}
.crow .cn small{display:block;color:var(--cream2);font-weight:400;font-size:11px;line-height:1.35}
.crow button{min-width:64px;height:36px;border-radius:8px;background:var(--orange);color:#140900;font-weight:900;font-size:12px}
.crow button:disabled{background:#2a3340;color:var(--dim)}
#pbridge{left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);bottom:calc(var(--sab) + 96px);max-width:none;padding:7px 10px 8px}
#pbridge h3{font-size:13px}
#pbridge p{font-size:11px;margin-top:2px}
@media (min-aspect-ratio:13/10){#pbridge{left:calc(var(--sal) + 150px);bottom:calc(var(--sab) + 10px)}}
#pbridge .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#pbridge .row button{flex:1 1 auto;min-width:70px;height:40px;border-radius:8px;background:rgba(255,255,255,.07);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
#pbridge .row button small{font-weight:400;font-size:10px;color:var(--cream2)}
#pbridge .row button.go{background:var(--orange);color:#140900}
#pbridge .row button.go small{color:#3a1800}
#pbridge .row button:disabled{opacity:.35}

/* ---------- 全畫面 ---------- */
.screen{position:fixed;inset:0;z-index:50;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scr-in{min-height:100%;padding:calc(var(--sat) + 18px) calc(var(--sar) + 18px) calc(var(--sab) + 22px) calc(var(--sal) + 18px);display:flex;flex-direction:column}
.bigbtn{display:block;width:100%;padding:15px 14px;border-radius:12px;background:var(--orange);color:#140900;font-weight:900;font-size:17px;letter-spacing:.12em;text-align:center;box-shadow:0 8px 30px rgba(255,106,26,.35);position:relative;overflow:hidden}
.bigbtn small{display:block;font-weight:700;font-size:11px;letter-spacing:.1em;opacity:.75;margin-top:2px}
.bigbtn.sec{background:rgba(255,255,255,.07);color:var(--cream);box-shadow:none;border:1px solid var(--line);font-size:15px}
.bigbtn:disabled{opacity:.4}
.hz{height:8px;background:repeating-linear-gradient(-45deg,var(--orange) 0 10px,#140900 10px 20px);opacity:.9}
.lbl{font:600 10px var(--m);letter-spacing:.24em;color:var(--orange)}

#s-title{background:transparent;display:flex}
#s-title .scr-in{justify-content:flex-end;gap:10px;width:100%}
#s-title .logo{margin-bottom:auto;margin-top:12vh;text-align:center}
#s-title .logo .zh{font-weight:900;font-size:clamp(54px,16vw,96px);letter-spacing:.14em;line-height:1;text-shadow:0 0 40px rgba(255,106,26,.25);padding-left:.14em}
#s-title .logo .en{font:700 clamp(15px,4.4vw,22px) var(--m);letter-spacing:.62em;color:var(--orange);margin-top:10px;padding-left:.62em}
#s-title .logo .tag{margin-top:22px;font-size:15px;color:var(--cream2);letter-spacing:.3em;padding-left:.3em}
#s-title .meta{display:flex;justify-content:space-between;font:600 11px var(--m);color:var(--dim);letter-spacing:.1em;margin-top:6px}
.tmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-aspect-ratio:13/10) and (max-height:620px){
  #s-title .scr-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:26px;row-gap:8px;align-content:center;padding-top:calc(var(--sat) + 12px);padding-bottom:calc(var(--sab) + 12px)}
  #s-title .logo{grid-column:1;grid-row:1 / span 5;margin:0;align-self:center}
  #s-title .scr-in > :not(.logo){grid-column:2}
  #s-title .logo .zh{font-size:clamp(44px,15vh,88px)}
  #s-title .logo .tag{margin-top:14px}
  #s-title .bigbtn{padding:10px 14px;font-size:16px}

// ---------- 格柵 ----------
function drawGrate(c, n, t) {
  const x = n.x, y = n.y, s = 15;
  const sh = n.shake > 0 ? (Math.sin(t * 60) * 2 * Math.min(1, n.shake)) : 0;
  c.save(); c.translate(x + sh, y);
  c.fillStyle = '#0b0e12'; rr(c, -s - 3, -s - 3, s * 2 + 6, s * 2 + 6, 3); c.fill();
  c.fillStyle = '#4a5560'; rr(c, -s - 2, -s - 2, s * 2 + 4, s * 2 + 4, 3); c.fill();
  c.fillStyle = '#05070a'; c.fillRect(-s + 1, -s + 1, s * 2 - 2, s * 2 - 2);
  c.fillStyle = '#5c6874'; for (let k = -s + 3; k < s; k += 5) c.fillRect(-s + 1, k, s * 2 - 2, 2);
  if (n.sealed) { c.strokeStyle = '#ff8a3d'; c.lineWidth = 3; c.beginPath(); c.moveTo(-s, -s); c.lineTo(s, s); c.moveTo(s, -s); c.lineTo(-s, s); c.stroke(); c.strokeStyle = 'rgba(255,200,120,.5)'; c.lineWidth = 1; c.strokeRect(-s - 2, -s - 2, s * 2 + 4, s * 2 + 4); }
  if (n.drip > 0) { c.fillStyle = 'rgba(150,240,210,' + (.35 * Math.min(1, n.drip)) + ')'; c.beginPath(); c.ellipse(0, s + 4, 10 + n.drip * 6, 5 + n.drip * 2, 0, 0, TAU); c.fill(); }
  c.restore();
}

// ---------- 門 ----------
function drawDoor(c, d, t) {
  const o = d.broken ? 1 : d.open, L = d.len, heavy = d.kind !== 'door', thick = heavy ? 12 : 9;
  c.save(); c.translate(d.x, d.y);
  if (d.orient === 'h') c.rotate(Math.PI / 2);
  // 門板沿 y 方向（垂直門）
  const half = L / 2, slide = o * half * .92;
  const col1 = d.welded ? '#5a4a3a' : heavy ? '#6a5a3a' : '#56626e', col2 = d.welded ? '#3a2e24' : heavy ? '#3e3420' : '#36404a';
  for (const s of [-1, 1]) {
    const y0 = s < 0 ? -half - slide : slide, h = half;
    if (d.broken) { c.save(); c.rotate(s * .35); }
    const g = c.createLinearGradient(-thick / 2, 0, thick / 2, 0); g.addColorStop(0, col1); g.addColorStop(1, col2);
    c.fillStyle = '#0b0e12'; c.fillRect(-thick / 2 - 1, y0 - 1, thick + 2, h + 2);
    c.fillStyle = g; c.fillRect(-thick / 2, y0, thick, h);
    if (heavy) { c.save(); c.beginPath(); c.rect(-thick / 2, y0, thick, h); c.clip(); c.fillStyle = 'rgba(255,170,30,.6)'; for (let k = -20; k < h + 20; k += 12) { c.beginPath(); c.moveTo(-thick / 2, y0 + k); c.lineTo(thick / 2, y0 + k + 8); c.lineTo(thick / 2, y0 + k + 14); c.lineTo(-thick / 2, y0 + k + 6); c.fill(); } c.restore(); }
    if (d.broken) c.restore();
  }
  // 指示燈
  const lc = d.broken ? '#666' : d.welded ? '#ff8a3d' : d.state === 'open' ? '#86f0a0' : '#ff3d3d';
  c.fillStyle = lc; c.fillRect(thick / 2 + 2, -half - 6, 3, 4); c.fillRect(-thick / 2 - 5, half + 2, 3, 4);
  if (d.welded && o < .1) { c.strokeStyle = 'rgba(255,200,120,' + (.5 + .3 * Math.sin(t * 5)) + ')'; c.lineWidth = 2; c.beginPath(); for (let k = -half; k <= half; k += 6) c.lineTo((k / 6) % 2 ? 2 : -2, k); c.stroke(); }
  if (d.force > 0 && !d.broken) { c.fillStyle = 'rgba(255,60,60,' + (.25 + d.force * .5) + ')'; c.fillRect(-thick / 2 - 2, -3, thick + 4, 6); }
  c.restore();
}

// ---------- 船員（俯視） ----------
function drawCrew(c, m, t, opt = {}) {

  // 身體

  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 10.5, 15, 0, 0, TAU); c.fill();

  // 手臂
  const sw = Math.sin(walk + Math.PI) * 6 * mv;
  const armL = m.aim ? 10 : 4 + sw, armR = m.aim ? 10 : 4 - sw;
  c.fillStyle = mixHex(def.suit, '#000000', .15);
  rr(c, -3, -17, 8 + armL, 6, 3); c.fill(); rr(c, -3, 11, 8 + armR, 6, 3); c.fill();

// ---------- 道具使用 ----------
function itemActions(m) {

  }

}
function throwItem(m, it, x, y) {
  const d = dist(m.x, m.y, x, y);

  // 撞牆就停
  const dd = Math.hypot(x - m.x, y - m.y);
  if (dd > 2) { const hit = castRay(m.x, m.y, (x - m.x) / dd, (y - m.y) / dd, dd); if (hit < dd) { x = m.x + (x - m.x) / dd * (hit - 10); y = m.y + (y - m.y) / dd * (hit - 10); } }
  if (!takeItem(m, it)) return;
  cancelTask(m); m.ang = Math.atan2(y - m.y, x - m.x);
  W.fx.push({ type: 'throw', x0: m.x, y0: m.y, x1: x, y1: y, t: 0, dur: .45, it });
  setTimeout(() => {
    if (!W) return;
    if (it === 'flare') { W.traps.push({ type: 'flare', x, y, t: 0, dur: 25 }); AU.flare(x, y); noise(x, y, T * 2, 'flare'); hitWithFlare(x, y); }

}
function hitWithFlare(x, y) {

}

// ---------- 陷阱、誘餌、警報 ----------
function updateTraps(dt) {
  const b = W.beast;
  for (const t of W.traps) {
    t.t += dt;
    if (t.type === 'lure') {
      if (t.t > t.delay) { t.pulse -= dt; if (t.pulse <= 0) { t.pulse = .5; noise(t.x, t.y, T * 12, 'lure'); AU.lure(t.x, t.y); } }
      if (t.t > t.dur + t.delay) t.dead = true;
    } else if (t.type === 'alarm') {
      t.pulse -= dt; if (t.pulse <= 0) { t.pulse = .7; noise(t.x, t.y, T * 19, 'alarm'); AU.alarmPing(t.x, t.y); }
      if (t.t > t.dur) t.dead = true;
    } else if (t.type === 'flare') { if (t.t > t.dur) t.dead = true; }
    else if (t.type === 'ln2') { if (b && !b.inVent && b.state !== 'dead' && dist(b.x, b.y, t.x, t.y) < T * 1.3) { t.dead = true; b.frozen = 5; hurtBeast(b, 20, 'cold'); W.fx.push({ type: 'frost', x: t.x, y: t.y, t: 0, dur: 5 }); AU.freeze(t.x, t.y); chron('牠踩上液氮罐，被凍在原地。'); } }
    else if (t.type === 'sentry') {
      t.cd -= dt;
      if (b && !b.inVent && b.state !== 'dead' && t.ammo > 0) {
        const d = dist(t.x, t.y, b.x, b.y);
        if (d < T * 6 && hasLOS(t.x, t.y, b.x, b.y)) {
          const a = Math.atan2(b.y - t.y, b.x - t.x); t.aimA = lerpAng(t.aimA, a, dt * 8);
          if (t.cd <= 0 && Math.abs(angDiff(t.aimA, a)) < .25) { t.cd = .16; t.ammo--; hurtBeast(b, 4, 'sentry'); W.fx.push({ type: 'tracer', x0: t.x, y0: t.y, x1: b.x + R.f(-8, 8), y1: b.y + R.f(-8, 8), t: 0, dur: .06 }); AU.gun(t.x, t.y); t.nt = (t.nt || 0) - .16; if (t.nt <= 0) { t.nt = .6; noise(t.x, t.y, T * 9, 'gun'); } W.learn.sentry[t.room] = (W.learn.sentry[t.room] || 0) + 4; }
        }
        if (d < T * .9 && b.state !== 'stunned') { t.hpT = (t.hpT || 0) + dt; if (t.hpT > 1.6) { t.dead = true; W.fx.push({ type: 'boom', x: t.x, y: t.y, t: 0, dur: .5 }); AU.boom(t.x, t.y); toast('哨戒砲被牠撕爛了。', 'bad'); } }
      }
    } else if (t.type === 'fuel') { if (t.t > 0 && W.traps.some(o => o.type === 'flare' && !o.dead && dist(o.x, o.y, t.x, t.y) < T * 1.2)) explodeFuel(t); }
  }
  W.traps = W.traps.filter(t => !t.dead);

// ---------- 感測器、偵測器 ----------
function updateSensors(dt) {
  const b = W.beast;
  // 光點：會動的東西
  const movers = [];
  if (b && b.state !== 'dormant' && b.state !== 'dead' && b.state !== 'spaced' && b.moving) movers.push({ x: b.x, y: b.y, vent: b.inVent, beast: true });
  if (W.bot && !W.bot.dead && W.bot.moving) movers.push({ x: W.bot.x, y: W.bot.y, vent: false, bot: true });
  // 手持偵測器
  W.sweepT -= dt;
  const holders = W.crew.filter(m => !m.dead && m.cocoon < 0 && hasItem(m, 'tracker'));
  if (W.sweepT <= 0) {
    W.sweepT = 2;
    let nearest = Infinity;
    for (const h of holders) {
      const range = T * (8 + (h.id === 'su' ? 4 : 0) + (perkOn('calib') ? 2 : 0));
      W.fx.push({ type: 'sweep', x: h.x, y: h.y, r: range, t: 0, dur: .9 });
      for (const mv of movers) { const d = dist(h.x, h.y, mv.x, mv.y); if (d < range) { W.blips.push({ x: mv.x, y: mv.y, t: 0, vent: mv.vent, src: 'hand' }); nearest = Math.min(nearest, d); if (d < T * 6) for (const o of W.crew) if (dist(o.x, o.y, h.x, h.y) < T * 3) o.blipNear = 3; } }
    }
    if (holders.length) AU.tracker(nearest < Infinity ? nearest / T : -1);

  }
  // 艦橋感測器
  W.bridgeSweep = (W.bridgeSweep || 0) - dt;
  if (bridgeOn() && W.power.on.sensors && !W.sys.sensorsBroken && W.bridgeSweep <= 0) {
    W.bridgeSweep = perkOn('calib') ? 2 : 3;
    W.fx.push({ type: 'bsweep', t: 0, dur: 1.2 });
    for (const mv of movers) W.blips.push({ x: mv.x, y: mv.y, t: 0, vent: mv.vent, src: 'bridge' });
  }
  for (const bl of W.blips) bl.t += dt;
  W.blips = W.blips.filter(bl => bl.t < 2.2);
}

// ---------- 小蝸 ----------
function botGo(x, y) {
  const bot = W.bot;
  const p = findPath(Math.floor(bot.x / T), Math.floor(bot.y / T), Math.floor(x / T), Math.floor(y / T), 'crew');
  if (p) { bot.path = pathToPts(p); bot.pi = 0; }
}
function updateBot(dt) {
  const bot = W.bot; if (!bot || bot.dead) return;
  bot.moving = false;
  bot.lured = Math.max(0, bot.lured - dt);
  if (!bot.path) {
    bot.wait -= dt;
    if (bot.wait <= 0) { const rooms = ['mid', 'mess', 'cryo', 'life', 'storage', 'aft', 'work', 'quarters', 'med', 'fore'].map(id => ROOM[id]); const r = R.pick(rooms); botGo(r.x0 + R.f(.5, r.w - .5) * T, r.y0 + R.f(.5, r.h - .5) * T); bot.wait = R.f(6, 14); }
    return;
  }
  const p = bot.path[bot.pi]; if (!p) { bot.path = null; return; }
  if (p[2] != null) { const d = doorBetween(p[2], p[3], p[4], p[5]); if (d && !doorOpen(d)) { if (d.welded || d.jam || !W.power.on.doors) { bot.path = null; return; } setDoor(d, true); return; } }
  const dx = p[0] - bot.x, dy = p[1] - bot.y, d0 = Math.hypot(dx, dy), sp = T * (bot.lured ? 1.8 : 1.1) * dt;
  bot.moving = true; bot.ang = lerpAng(bot.ang, Math.atan2(dy, dx), dt * 6);
  if (sp >= d0) { bot.x = p[0]; bot.y = p[1]; bot.pi++; } else { bot.x += dx / d0 * sp; bot.y += dy / d0 * sp; }
  bot.nt = (bot.nt || 0) - dt; if (bot.nt <= 0) { bot.nt = bot.lured ? .5 : 1.4; noise(bot.x, bot.y, bot.lured ? T * 6 : T * 2.2, 'bot'); if (bot.lured) AU.botBeep(bot.x, bot.y); }
}

function updateFx(dt) {

function handleTap(sx, sy, dbl) {
  if (!W || W.phase !== 'play') return;
  if (UI.menuOpen) { hideMenu(); return; }
  const [wx, wy] = s2w(sx, sy);
  const px = 1 / CAM.z;
  const m = W.sel >= 0 ? W.crew[W.sel] : null;
  // 瞄準
  if (UI.aimMode) {
    const a = UI.aimMode; UI.aimMode = null;
    if (a.kind === 'throw') { if (!a.m.dead) throwItem(a.m, a.it, wx, wy); }
    else if (a.kind === 'weld') { const d = hitDoor(wx, wy, 22 * px), g = hitGrate(wx, wy, 24 * px); if (g) orderDo(a.m, 'grate', g, { act: g.sealed ? 'unseal' : 'seal' }); else if (d) orderDo(a.m, 'door', d, { act: d.welded ? 'cut' : 'weld' }); else toast('那裡沒有門或格柵。'); }
    refreshActbar(true); return;
  }
  // 艦橋模式
  if (UI.bridgeMode) {
    const d = hitDoor(wx, wy, 20 * px); if (d) { if (d.kind === 'airout') { remoteOuter(); } else remoteDoor(d); return; }
    const dm = hitDamper(wx, wy, 18 * px); if (dm) { remoteDamper(dm); return; }
    const r = roomAt(wx, wy); if (r) { roomMenu(r, sx, sy); return; }
    return;
  }
  // 點船員
  const hc = hitCrew(wx, wy, Math.max(26, 30 * px));
  if (hc && hc !== m) {
    if (m && !hc.dead && dist(m.x, m.y, hc.x, hc.y) < T * 2 && (hc.hp < 3 || hc.bpm > 120) && (hasItem(m, 'medkit') || hasItem(m, 'sedative'))) {
      const opts = [{ label: '選' + CREW[hc.ci].name, fn: () => selectCrew(hc.ci) }];
      if (hasItem(m, 'medkit') && hc.hp < 3) opts.push({ label: '幫' + CREW[hc.ci].name + '包紮', fn: () => useMedkit(m, hc) });
      if (hasItem(m, 'sedative')) opts.push({ label: '給' + CREW[hc.ci].name + '打鎮定劑', fn: () => useSedative(m, hc) });
      showMenu(CREW[hc.ci].name, opts, sx, sy); return;
    }
    if (!hc.dead && hc.cocoon < 0) { selectCrew(hc.ci); return; }
  }
  if (!m) {
    const d = hitDoor(wx, wy, 18 * px);
    if (d && bridgeOn() && W.power.on.doors) { remoteDoor(d); return; }
    toast('先點船員卡選一個人。'); return;
  }
  if (m.inVent) { const g = hitGrate(wx, wy, 30 * px); if (g) crawlTo(m, g); else toast('點一個格柵當出口。'); return; }
  if (m.grabbed) return;
  // 巢裡的人
  const cc = W.crew.find(o => o.cocoon >= 0 && dist(o.x, o.y, wx, wy) < 30);
  if (cc) { orderDo(m, 'nest', cc, { victim: cc }); bark(m, 'move'); return; }
  // 門
  const d = hitDoor(wx, wy, 20 * px);
  if (d) { doorMenu(m, d, sx, sy); return; }
  // 格柵
  const g = hitGrate(wx, wy, 18 * px);
  if (g && (hasItem(m, 'welder') || m.id === 'jie')) { grateMenu(m, g, sx, sy); return; }
  // 物件
  const p = hitProp(wx, wy, 22 * px);
  if (p) {
    if (p.k === 'box') { if (p.searched) toast('這裡翻過了。'); else orderDo(m, 'search', p); }

}

// ---------- 劇情播放 ----------
function playScene(lines, done, opts = {}) {
  const sc = $('#s-scene'); sc.classList.remove('hide');
  sc.innerHTML = `<div class="scr-in"><div class="sc-head">${opts.head || ''}</div><div id="sc-lines" style="display:flex;flex-direction:column;gap:9px"></div><div id="sc-foot" style="margin-top:6px"></div></div>`;
  const box = $('#sc-lines'), foot = $('#sc-foot');
  let k = 0;
  const next = () => {
    if (k >= lines.length) { if (opts.choices) { showChoices(opts.choices, foot, c => { sc.classList.add('hide'); done && done(c); }); } else { sc.classList.add('hide'); done && done(); } return; }
    const L = lines[k++];
    const row = el('div', 'line' + (L.nar ? ' nar' : ''));
    if (L.nar) row.innerHTML = `<div class="bub">${L.nar}</div>`;
    else { const def = CREWI[L.who]; row.innerHTML = `<canvas width="108" height="132"></canvas><div class="bub"><b>${def.name}・${def.role}</b>${L.t}</div>`; drawPortraitTo(row.querySelector('canvas'), L.who, null, false); }
    box.appendChild(row);
    while (box.children.length > 5) box.removeChild(box.firstChild);
    foot.innerHTML = `<div class="tapnext">點一下繼續</div>`;
    AU.ui('tap');
  };
  sc.onclick = e => { if (e.target.closest('.choice')) return; if (foot.querySelector('.choices')) return; next(); };
  next();
}
function showChoices(choices, foot, cb) {
  foot.innerHTML = ''; const box = el('div', 'choices'); foot.appendChild(box);
  for (const c of choices) {
    const b = el('button', 'choice', `<b>${c.name}</b><small>${c.sub}</small>${c.req ? `<span class="req">${c.req}</span>` : ''}`);
    b.disabled = !!c.dis;
    b.onclick = e => { e.stopPropagation(); AU.ui('ok'); cb(c); };
    box.appendChild(b);
  }
}
UI.interlude = n => {

  const lines = interludeLines(n);

  } else {

    });

// 逃生艇上的最後一場
function shuttleFinale() {
  const aboard = W.crew.filter(m => m.aboard && !m.dead);
  const armed = aboard.find(m => hasItem(m, 'harpoon') || hasItem(m, 'flamer') || hasItem(m, 'flare') || hasItem(m, 'prod'));
  let suited = false;
  const sc = $('#s-scene'); sc.classList.remove('hide');
  const stage = (head, text, opts, secs, onTimeout) => {
    sc.innerHTML = `<div class="scr-in"><div class="sc-head"><span class="lbl">LIFEBOAT NH-1</span><h2>${head}</h2></div><div class="line nar"><div class="bub" style="font-size:16px">${text}</div></div><div style="height:6px;background:#2a3340;border-radius:3px;overflow:hidden"><div id="fz-bar" style="height:100%;width:100%;background:var(--red)"></div></div><div class="choices" id="fz-c"></div></div>`;
    const cb = $('#fz-c'); let done = false; const t0 = performance.now();
    for (const o of opts) { const b = el('button', 'choice', `<b>${o.name}</b><small>${o.sub || ''}</small>`); b.disabled = !!o.dis; b.onclick = () => { if (done) return; done = true; AU.ui('ok'); o.fn(); }; cb.appendChild(b); }
    const tick = () => { if (done) return; const u = (performance.now() - t0) / 1000 / secs; const bar = $('#fz-bar'); if (bar) bar.style.width = Math.max(0, 100 - u * 100) + '%'; if (u >= 1) { done = true; onTimeout(); return; } requestAnimationFrame(tick); };
    requestAnimationFrame(tick); AU.stinger(2);
  };
  const lose = (who, why) => { killCrew(who, why); };
  const finish = () => { sc.classList.add('hide'); endRun(aliveCrew().filter(m => m.aboard).length ? 'stowaway' : 'lost'); };
  const step3 = () => stage('艙門', '牠被逼到艙門前，冠全張開了。你的手放在緊急洩壓的拉桿上。' + (suited ? '' : '<br><b style="color:#ff8080">有人還沒穿太空衣。</b>'), [
    { name: '拉下拉桿', sub: suited ? '所有人都穿好太空衣了' : '沒穿太空衣的人會被一起吸出去', fn: () => { if (!suited) { for (const m of aboard.slice(1)) if (!m.dead && R.chance(.6)) lose(m, '跟著牠一起被吸進了真空'); } flash(.6); AU.decompress(); chron('艙門炸開，牠被扯進了真空。'); setTimeout(finish, 1200); } },
  ], 5, () => { const v = R.pick(aboard.filter(m => !m.dead)); if (v) lose(v, '在逃生艇裡被牠拖走'); chron('牠撲了上來。'); step3b(); });
  const step3b = () => { if (!aliveCrew().filter(m => m.aboard).length) { finish(); return; } stage('最後一次', '牠撲倒了一個人，正把他往維修板裡拖。艙門就在牠背後。', [{ name: '拉下拉桿', sub: '現在，不然就沒機會了', fn: () => { flash(.6); AU.decompress(); for (const m of aboard) if (!m.dead && !suited && R.chance(.5)) lose(m, '跟著牠一起被吸進了真空'); setTimeout(finish, 1200); } }], 4, () => { for (const m of aboard) if (!m.dead) lose(m, '死在逃生艇裡'); setTimeout(finish, 800); }); };
  const step2 = () => stage('牠在艇上', '維修板被從裡面推開。牠從艇壁裡爬出來，落在你們和艙門之間。', [
    { name: armed ? '用' + (hasItem(armed, 'flamer') ? '火' : hasItem(armed, 'harpoon') ? '魚叉' : hasItem(armed, 'flare') ? '照明彈' : '電擊棒') + '把牠逼向艙門' : '沒有武器', sub: armed ? CREW[armed.ci].name + '動手' : '', dis: !armed, fn: () => { chron(CREW[armed.ci].name + '把牠逼向艙門。'); step3(); } },
    { name: '有人去當誘餌，引牠到艙門口', sub: '很可能會死', fn: () => { const v = aboard.filter(m => !m.dead).sort((a, b) => a.hp - b.hp)[0]; if (v && R.chance(.55)) lose(v, '在逃生艇裡當了誘餌'); else if (v) chron(CREW[v.ci].name + '引開了牠，活了下來。'); step3(); } },
  ], 6, () => { const v = R.pick(aboard.filter(m => !m.dead)); if (v) lose(v, '在逃生艇裡被牠拖走'); step3(); });

    { name: '先把武器拿出來', sub: armed ? '' : '艇上沒有武器', dis: !armed, fn: () => { step2(); } },

// ---------- 結束 ----------
function endRun(id) {
  if (!W || W.ended) return; W.ended = true; W.phase = 'over';
  hideMenu(); closeBridgeMode();
  const alive = W.crew.filter(m => !m.dead && !m.left);
  const win = ['strangle', 'spaced', 'burned', 'abandon', 'stowaway'].includes(id);
  let final = id;
  if (W.beacon) { }
  if (W.flags.beacon && !W.logs.includes('L01')) W.logs.push('L01');
  if (W.flags.cont && !W.logs.includes('L02')) W.logs.push('L02');
  if (W.confessed && !W.logs.includes('L08')) W.logs.push('L08');
  const have = new Set([...G.lore, ...W.logs]);
  const allButTruth = LORE.filter(f => f.id !== 'L16').every(f => have.has(f.id));
  const wen = crewById('wen');
  if (win && allButTruth && W.confessed && wen && !wen.dead && !wen.left) { final = 'truth'; W.logs.push('L16'); }
  else if (win && alive.length === 1) final = 'sole';
  // 獎勵
  const base = { strangle: 320, spaced: 260, burned: 240, abandon: 180, stowaway: 300, sole: 120, company: 60, lost: 30, truth: 500 }[final] ?? 50;
  const rew = [['結局：' + ENDINGS.find(e => e.id === final).name, base], ['活下來的人 ×' + alive.length, alive.length * 45], ['新的調查檔案 ×' + W.logs.filter(l => !G.lore.includes(l)).length, W.logs.filter(l => !G.lore.includes(l)).length * 35], ['救回來的次數 ×' + W.stats.rescues, W.stats.rescues * 20], ['擦身而過 ×' + (W.stats.close || 0), Math.min(8, W.stats.close || 0) * 12], ['屏住呼吸 ×' + (W.stats.holds || 0), Math.min(6, W.stats.holds || 0) * 15]];
  const total = rew.reduce((s, r) => s + r[1], 0);
  const firstEnd = !G.endings[final];
  G.money += total; G.voyages = (G.voyages || 0) + 1; if (win) G.wins = (G.wins || 0) + 1;
  G.endings[final] = (G.endings[final] || 0) + 1; if (final !== id) G.endings[id] = G.endings[id] || 0;
  const newLore = W.logs.filter(l => !G.lore.includes(l));
  for (const l of newLore) { G.lore.push(l); G.newLore.push(l); }
  const rec = { v: W.voyage, end: final, alive: alive.map(m => m.id), dead: W.crew.filter(m => m.dead).map(m => [m.id, m.why]), t: Math.round(W.t), chron: W.chron.slice(-14).map(c => [Math.round(c.t), c.text]), plan: W.plan };
  G.runs.unshift(rec); G.runs = G.runs.slice(0, 20);
  G.ckpt = null; saveG();
  // 解鎖提示
  const unl = [];
  if (G.voyages === 1) unl.push('第 2 航次起：牠會學人的聲音。');
  if (G.voyages === 2) unl.push('第 3 航次起：船上可能有人帶著公司的密令。');
  if (G.voyages === 3) unl.push('第 4 航次起：每次出航會遇到不同的開局狀況。');
  if (win && G.wins === 1) unl.push('出航準備已經開放：用分紅買裝備與訓練。');
  setTimeout(() => showResult(final, rew, total, firstEnd, newLore, unl), id === 'lost' ? 600 : 300);
}
function showResult(id, rew, total, firstEnd, newLore, unl) {
  S.mode = 'result'; $('#hud').classList.add('hide');

  h += `<div class="survivors">` + W.crew.map(m => `<div class="sv ${m.dead || m.left ? 'd' : ''}"><canvas width="108" height="132" data-id="${m.id}" data-st="${m.dead || m.left ? 'dead' : m.hp < 3 ? 'hurt' : ''}"></canvas><div class="sn">${CREW[m.ci].name}</div><div class="ss">${epitaph(m)}</div></div>`).join('') + `</div>`;

  h += `<div class="card"><h4>分紅</h4>` + rew.filter(r => r[1]).map(r => `<div class="rew"><span>${r[0]}</span><b>+${r[1]}</b></div>`).join('') + `<div class="rew" style="color:var(--cream);font-weight:900"><span>合計</span><b>+${total}（現有 ${G.money}）</b></div></div>`;

  $('#r-home').onclick = () => { sc.classList.add('hide'); showTitle(); };
  AU.stab(.7);
