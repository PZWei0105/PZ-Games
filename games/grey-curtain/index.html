<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>灰幕 GREY CURTAIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 灰幕 GREY CURTAIN — 冷戰美漫黑色硬派：墨黑、舊報紙、信號紅、芥末黃 */
/* 版面：直式單欄。上方任務列與時間軸，中間 2.5D 棋盤，下方手牌與行動列 */
:root {
  --night: #0e121a;
  --night2: #161c27;
  --night3: #1f2733;
  --ink: #121114;
  --paper: #efe6cf;
  --paper2: #d8c9a6;
  --red: #d7262e;
  --mustard: #f0b429;
  --steel: #5e7a8f;
  --teal: #2f8f8a;
  --muted: #9a9283;
  --fg: #efe6cf;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-hand: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", serif;
  --font-cap: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-sfx: "Bangers", "Impact", "Arial Black", sans-serif;
  --font-num: "Oswald", "Bebas Neue", "Arial Narrow", sans-serif;
  --c-move: #5e7a8f; --c-shoot: #b8322f; --c-melee: #c96a2b; --c-item: #7d7a3a; --c-disg: #6e5a80; --c-intel: #2f8f8a; --c-special: #c9a227;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--fg); font-family: var(--font-ui); font-size: 14px; overflow: hidden; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 620px; margin: 0 auto; background: var(--night); overflow: hidden; }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scr[hidden] { display: none !important; }
.halftone { background-image: radial-gradient(rgba(18,17,20,.55) 1.1px, transparent 1.4px); background-size: 6px 6px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; padding: 14px 16px 24px; }

/* ---------- 共用按鈕 ---------- */
.btn { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 4px; padding: 10px 16px; font-weight: 900; font-size: 15px; letter-spacing: .04em; box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--mustard); }
.btn.danger { background: var(--red); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--paper); border-color: var(--paper2); box-shadow: none; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; background: var(--night3); border: 2px solid var(--ink); border-radius: 6px; font-size: 18px; padding: 0; color: var(--paper); }
.icon-btn svg { width: 20px; height: 20px; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--ink); border-bottom: 3px solid var(--mustard); min-height: 54px; }
.topbar h2 { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: .06em; flex: 1; }
.topbar .pts { font-family: var(--font-num); font-size: 16px; color: var(--mustard); }
.eyebrow { font-family: var(--font-num); letter-spacing: .18em; font-size: 12px; color: var(--mustard); text-transform: uppercase; }

/* ---------- 標題 ---------- */
#scr-title { background: var(--night); }
.cover { position: relative; flex: 1; margin: 16px; border: 4px solid var(--ink); background: #1a2230; overflow: hidden; box-shadow: 0 0 0 3px var(--paper2), 8px 8px 0 3px var(--ink); display: flex; flex-direction: column; }
.cover-art { position: absolute; inset: 0; }
.cover-art svg { width: 100%; height: 100%; display: block; }
.cover-top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 12px; }
.cover-box { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); padding: 4px 8px; font-family: var(--font-num); font-weight: 700; line-height: 1; text-align: center; }
.cover-box b { display: block; font-size: 26px; }
.cover-box small { font-size: 11px; letter-spacing: .1em; }
.logo { position: relative; margin-top: 4px; text-align: center; }
.logo .zh { font-family: var(--font-cap); font-weight: 900; font-size: clamp(84px, 30vw, 150px); line-height: .9; color: var(--paper); letter-spacing: .05em; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--red), 7px 7px 0 var(--ink); }
.logo .en { font-family: var(--font-sfx); font-size: clamp(30px, 10vw, 46px); color: var(--mustard); letter-spacing: .08em; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); margin-top: 4px; }
.cover-tag { position: relative; margin: 6px auto 0; background: var(--ink); color: var(--paper); font-family: var(--font-cap); font-weight: 700; padding: 4px 12px; font-size: 13px; transform: rotate(-2deg); }
.title-menu { position: relative; margin-top: auto; padding: 16px; display: grid; gap: 10px; }
.title-menu .btn { width: 100%; font-size: 17px; }
.title-foot { text-align: center; color: var(--muted); font-size: 11px; padding: 0 16px 12px; position: relative; }

/* ---------- 酒館 ---------- */
.bar-scene { position: relative; margin: 14px 16px 6px; border: 3px solid var(--ink); background: #2b1a12; min-height: 170px; overflow: hidden; }
.bar-scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bar-say { position: relative; margin: 0 16px 10px; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-family: var(--font-hand); font-size: 15px; line-height: 1.55; }
.bar-say::before { content: "小蘭"; position: absolute; top: -12px; left: 12px; background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 3px; }
.hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 16px 16px; }
.hub-grid .btn { min-height: 64px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; padding: 10px 12px; }
.hub-grid .btn small { font-weight: 500; font-size: 11px; opacity: .75; letter-spacing: 0; }
.hub-grid .btn.wide { grid-column: span 2; }
.next-card { grid-column: span 2; background: var(--mustard); }
.next-card .no { font-family: var(--font-num); font-size: 13px; letter-spacing: .15em; }
.next-card .nm { font-size: 22px; font-weight: 900; }

/* ---------- 簡報 ---------- */
.dossier { margin: 14px 16px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 16px; position: relative; }
.dossier::after { content: "機密"; position: absolute; right: 14px; top: 12px; border: 3px solid var(--red); color: var(--red); font-weight: 900; padding: 0 8px; transform: rotate(8deg); font-size: 18px; letter-spacing: .2em; opacity: .85; }
.dossier h3 { margin: 4px 0 10px; font-family: var(--font-cap); font-size: 28px; font-weight: 900; }
.brief-map { width: 100%; height: 280px; display: block; border: 3px solid var(--ink); background: #0e1117; margin-top: 4px; }
.map-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; margin-top: 4px; color: #4a4438; }
.map-legend i { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--ink); margin-right: 4px; vertical-align: -1px; }
.dossier h4 { margin: 14px 0 6px; font-size: 13px; letter-spacing: .12em; border-bottom: 2px solid var(--ink); padding-bottom: 3px; }
.dossier ul { margin: 0; padding-left: 18px; line-height: 1.7; }
.dossier .issue { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-card { display: inline-flex; align-items: center; gap: 4px; background: var(--night3); color: var(--paper); border: 2px solid var(--ink); border-radius: 4px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
.brief-actions { display: flex; gap: 10px; padding: 0 16px 18px; }
.brief-actions .btn { flex: 1; }

/* ---------- 任務畫面 ---------- */
#scr-game { background: var(--night); }
.hud { display: flex; align-items: center; gap: 8px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top, 0px)); background: var(--ink); border-bottom: 2px solid #000; min-height: 46px; }
.hud-mission { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
.hud-mission b { font-family: var(--font-num); color: var(--mustard); font-size: 15px; letter-spacing: .06em; }
.hud-mission span { font-weight: 900; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.hud-t { font-family: var(--font-num); color: var(--muted); font-size: 13px; }
.hud-alert { font-weight: 900; font-size: 12px; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 3px; background: #2c3a32; color: #bfe5c8; letter-spacing: .08em; white-space: nowrap; }
.hud-alert[data-l="1"] { background: #5a4a14; color: #ffe38a; }
.hud-alert[data-l="2"] { background: #7a3a12; color: #ffc48a; }
.hud-alert[data-l="3"] { background: var(--red); color: #fff; animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { filter: brightness(1.5); } }
.hud-hp { display: flex; align-items: center; gap: 5px; }
.hp-bar { width: 64px; height: 10px; background: #000; border: 2px solid #000; }
.hp-bar i { display: block; height: 100%; background: linear-gradient(90deg, #d7262e, #f05a4a); transition: width .3s; }
.hud-hp span { font-family: var(--font-num); font-size: 15px; min-width: 18px; text-align: right; }
.timeline { display: flex; align-items: center; gap: 4px; padding: 5px 8px; background: #0a0d13; border-bottom: 2px solid var(--ink); overflow-x: auto; scrollbar-width: none; min-height: 44px; }
.timeline::-webkit-scrollbar { display: none; }
.tl-label { font-family: var(--font-num); font-size: 10px; color: var(--muted); letter-spacing: .1em; writing-mode: vertical-rl; transform: rotate(180deg); }
.tl-item { flex: 0 0 auto; width: 32px; height: 34px; border: 2px solid var(--ink); border-radius: 4px; background: var(--night3); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-size: 11px; font-weight: 900; line-height: 1; }
.tl-item .tt { font-family: var(--font-num); font-size: 9px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.tl-item.me { background: var(--mustard); color: var(--ink); width: 40px; }
.tl-item.me .tt { color: var(--ink); }
.tl-item.e { background: #3a2226; color: #ffb3a8; }
.tl-item.libra { background: #2a2a3e; color: #c8c3ff; }
.tl-item.ev { background: #1f3a3a; color: #9ff0e8; }
.tl-item.sleep { opacity: .5; }
.objective { padding: 4px 12px; font-size: 12px; color: var(--paper2); background: #0a0d13; display: flex; gap: 8px; align-items: center; min-height: 24px; }
.objective b { color: var(--mustard); font-weight: 900; letter-spacing: .1em; font-size: 11px; }
.objective .heli { margin-left: auto; font-family: var(--font-num); color: #9ff0e8; }
.board-wrap { position: relative; flex: 1; min-height: 160px; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.cam-ctl { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; gap: 5px; }
.cam-ctl .icon-btn { width: 34px; height: 34px; background: rgba(18,17,20,.82); border-color: #000; }
.side-ctl { position: absolute; left: 6px; top: 6px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.chip { background: rgba(18,17,20,.85); border: 2px solid #000; border-radius: 16px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--paper); }
.chip.on { background: var(--teal); color: #fff; }
.chip.vip { background: #1d3a52; color: #9fd6ff; }
.detail { background: var(--night2); border-top: 2px solid var(--ink); padding: 6px 12px; height: 74px; display: flex; gap: 10px; align-items: center; overflow: hidden; }
.detail .d-main { max-height: 100%; overflow-y: auto; }
.detail .d-main { flex: 1; min-width: 0; }
.detail .d-name { font-weight: 900; font-size: 14px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.detail .d-text { font-size: 12px; color: var(--paper2); line-height: 1.45; margin-top: 2px; }
.detail .d-hint { font-size: 12px; color: var(--muted); }
.tag { font-family: var(--font-num); font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1.5px solid var(--ink); background: var(--night3); font-weight: 700; }
.tag.cost { background: var(--mustard); color: var(--ink); }
.tag.noise { background: #24435a; color: #bfe3ff; }
.tag.chain { background: var(--red); color: #fff; font-family: var(--font-ui); }
.detail .btn { padding: 8px 12px; font-size: 13px; box-shadow: 3px 3px 0 var(--ink); }
.hand { display: flex; gap: 5px; padding: 8px 8px 6px; background: #0b0e14; justify-content: center; min-height: 112px; align-items: flex-end; }
.card { position: relative; flex: 0 1 62px; max-width: 74px; min-width: 50px; aspect-ratio: 62 / 96; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 6px; color: var(--ink); padding: 0; display: flex; flex-direction: column; overflow: hidden; transition: transform .12s, box-shadow .12s, opacity .2s; box-shadow: 2px 3px 0 #000; }
.card .band { height: 34%; background: var(--c-move); display: grid; place-items: center; border-bottom: 2px solid var(--ink); position: relative; }
.card .band svg { width: 62%; height: 72%; color: var(--paper); }
.card .cost { position: absolute; left: -2px; top: -2px; width: 22px; height: 22px; background: var(--mustard); border: 2px solid var(--ink); border-radius: 50%; font-family: var(--font-num); font-weight: 700; font-size: 13px; display: grid; place-items: center; z-index: 2; }
.card .nm { font-weight: 900; font-size: 12px; line-height: 1.15; padding: 4px 2px 0; text-align: center; flex: 1; display: flex; align-items: center; justify-content: center; word-break: keep-all; }
.card .meta { display: flex; justify-content: center; gap: 2px; padding: 0 2px 4px; }
.card .meta i { width: 5px; height: 5px; border-radius: 50%; background: #c9c0aa; border: 1px solid var(--ink); }
.card .meta i.on { background: #2b6a9a; }
.card .ty { font-size: 9px; font-weight: 700; text-align: center; color: #6a6252; letter-spacing: .08em; padding-bottom: 2px; }
.card.sel { transform: translateY(-12px); box-shadow: 0 0 0 3px var(--mustard), 3px 6px 0 #000; }
.card.dim { opacity: .45; }
.card.chainable::after { content: "連"; position: absolute; right: -2px; top: -2px; width: 20px; height: 20px; background: var(--red); color: #fff; border: 2px solid var(--ink); border-radius: 50%; font-size: 11px; font-weight: 900; display: grid; place-items: center; }
.card[data-t="射擊"] .band { background: var(--c-shoot); }
.card[data-t="近戰"] .band { background: var(--c-melee); }
.card[data-t="道具"] .band { background: var(--c-item); }
.card[data-t="偽裝"] .band { background: var(--c-disg); }
.card[data-t="情報"] .band { background: var(--c-intel); }
.card[data-t="特殊"] .band { background: var(--c-special); }
.actions { display: flex; gap: 6px; padding: 6px 8px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); background: #0b0e14; border-top: 1px solid #000; }
.actions .btn { padding: 8px 8px; font-size: 13px; box-shadow: 3px 3px 0 var(--ink); }
.actions .grow { flex: 1; }
.actions .end { background: var(--mustard); display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.actions .end small { font-size: 10px; font-weight: 700; opacity: .8; }
.actions .act-on { background: var(--teal); color: #fff; }
.actions .rw { position: relative; }
.actions .rw b { font-family: var(--font-num); }
.lock-input .hand, .lock-input .actions, .lock-input .cam-ctl { pointer-events: none; }
.lock-input .actions { opacity: .6; }

/* ---------- 橫幅、提示 ---------- */
#banner { position: absolute; left: 0; right: 0; top: 34%; display: flex; justify-content: center; pointer-events: none; z-index: 30; }
#banner .b { background: var(--ink); color: var(--paper); font-weight: 900; font-size: 20px; padding: 8px 22px; border: 3px solid var(--paper); transform: rotate(-3deg) scale(.6); opacity: 0; transition: transform .18s, opacity .18s; letter-spacing: .08em; box-shadow: 5px 5px 0 #000; }
#banner .b.show { transform: rotate(-3deg) scale(1); opacity: 1; }
#banner .b.red { background: var(--red); color: #fff; border-color: #fff; }
#banner .b.mustard { background: var(--mustard); color: var(--ink); border-color: var(--ink); }
#banner .b.libra { background: #2a2a3e; color: #d9d4ff; border-color: #a9a2ff; }
#banner .b.chain { background: var(--red); color: #fff; font-size: 26px; border-color: var(--mustard); }
#banner .b.chain small { display: block; font-size: 13px; color: var(--mustard); }
#toast { position: absolute; left: 50%; bottom: 190px; transform: translateX(-50%); z-index: 40; pointer-events: none; display: flex; flex-direction: column; gap: 6px; align-items: center; width: calc(100% - 32px); }
#toast .t { background: rgba(18,17,20,.94); color: var(--paper); border: 2px solid var(--mustard); padding: 7px 14px; border-radius: 4px; font-size: 13px; font-weight: 700; max-width: 100%; animation: toast 2.6s forwards; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
.tip { position: absolute; left: 10px; right: 54px; z-index: 35; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 5px 5px 0 #000; padding: 9px 12px 8px; font-size: 13px; line-height: 1.55; }
.tip b { display: block; font-size: 11px; letter-spacing: .15em; color: var(--red); margin-bottom: 2px; }
.tip .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.tip .row .btn { padding: 5px 12px; font-size: 13px; box-shadow: 2px 2px 0 var(--ink); }

/* ---------- 定格分格 ---------- */
#impact { position: absolute; inset: 0; z-index: 50; pointer-events: auto; display: grid; place-items: center; background: rgba(0,0,0,.35); }
#impact[hidden] { display: none; }
#impact .frame { position: relative; width: 92%; aspect-ratio: 16 / 10; border: 4px solid var(--ink); box-shadow: 0 0 0 3px var(--paper), 10px 10px 0 #000; overflow: hidden; background: #000; animation: slam .22s cubic-bezier(.2,1.6,.4,1) both; transform: rotate(-2.5deg); }
@keyframes slam { from { transform: rotate(-8deg) scale(1.35); opacity: 0; } to { transform: rotate(-2.5deg) scale(1); opacity: 1; } }
#impact canvas { width: 100%; height: 100%; display: block; }
#impact .lines { position: absolute; inset: 0; }
#impact .sfx { position: absolute; right: 6%; top: 10%; font-family: var(--font-sfx); font-size: clamp(48px, 16vw, 92px); color: var(--mustard); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; transform: rotate(-10deg); text-shadow: 5px 5px 0 var(--ink); line-height: 1; }
#impact .sfx.zh { font-family: var(--font-ui); font-weight: 900; }
#impact .cap { position: absolute; left: 0; bottom: 0; background: var(--mustard); color: var(--ink); border-top: 3px solid var(--ink); border-right: 3px solid var(--ink); font-family: var(--font-cap); font-weight: 900; padding: 4px 14px; font-size: 16px; }
.splash { position: absolute; inset: 0; z-index: 55; display: grid; place-items: center; background: rgba(10,12,18,.88); pointer-events: none; }
.splash .t { font-family: var(--font-cap); font-weight: 900; font-size: clamp(56px, 20vw, 110px); color: var(--paper); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--red); animation: slam .3s both; }
.splash .s { font-family: var(--font-sfx); color: var(--mustard); font-size: 26px; letter-spacing: .1em; text-align: center; }

/* ---------- 漫畫閱讀器 ---------- */
#comic { position: absolute; inset: 0; z-index: 60; background: #07090d; display: flex; flex-direction: column; }
#comic[hidden] { display: none; }
.comic-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top, 0px)); }
.comic-top .ttl { font-family: var(--font-num); letter-spacing: .2em; color: var(--muted); font-size: 12px; }
.comic-top .btn { padding: 5px 12px; font-size: 12px; box-shadow: 2px 2px 0 #000; }
.comic-stage { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; align-items: center; }
.page { width: 100%; max-width: 560px; background: var(--paper); border: 3px solid var(--ink); padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; box-shadow: 6px 6px 0 #000; margin-bottom: 14px; }

  if (p.shadow && d > 1.01 && nearWall(s, p.x, p.y)) return false;
  const dg = p.disguise;
  if (dg && dg.until > s.T) {
    if (ty.seesThrough) return true;
    if (dg.kind === 'janitor') return s.alert >= 2 || d <= 1.01;
    if (dg.kind === 'coat') return s.alert >= 3;
  }
  return true;
}

// ---------------- 尋路 ----------------
function enemyWalkable(s, x, y, e) {
  const p = tprop(s, x, y);
  if (!p.walk) return false;
  if (e && G.TYPES[e.type].fearSmoke && isSmoke(s, x, y)) return false;
  return true;
}
// 回傳從 (sx,sy) 往目標的第一步；goalFn(x,y) 判斷是否到達
function bfs(s, sx, sy, goalFn, passFn, maxLen) {
  const prev = new Map(); const start = K(sx, sy);
  prev.set(start, null);
  let q = [[sx, sy]]; let depth = 0;
  while (q.length && depth <= (maxLen || 99)) {
    const nq = [];
    for (const [x, y] of q) {
      if (!(x === sx && y === sy) && goalFn(x, y)) {
        const path = [[x, y]]; let k = prev.get(K(x, y));
        while (k && k !== start) { const [a, b] = k.split(',').map(Number); path.unshift([a, b]); k = prev.get(k); }
        return path;
      }
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy, nk = K(nx, ny);
        if (!inB(s, nx, ny) || prev.has(nk)) continue;
        if (!passFn(nx, ny)) continue;
        prev.set(nk, K(x, y)); nq.push([nx, ny]);
      }
    }
    q = nq; depth++;
  }
  return null;
}
function soundDist(s, x0, y0, x1, y1, maxD) {
  if (x0 === x1 && y0 === y1) return 0;
  const path = bfs(s, x0, y0, (x, y) => x === x1 && y === y1, (x, y) => !!tprop(s, x, y).sound || (x === x1 && y === y1), maxD);
  return path ? path.length : BIG;
}
function nextStep(s, e, tx, ty, opt) {
  opt = opt || {};
  const goalWalk = enemyWalkable(s, tx, ty, e) && !(opt.adjacent);
  const goal = (x, y) => goalWalk ? (x === tx && y === ty) : manh(x, y, tx, ty) <= 1;
  const pass1 = (x, y) => enemyWalkable(s, x, y, e) && !occupied(s, x, y, e);
  let path = bfs(s, e.x, e.y, goal, pass1, 40);
  if (!path) {
    // 允許穿過其他單位規劃（之後若被擋就等）
    const pass2 = (x, y) => enemyWalkable(s, x, y, e);
    path = bfs(s, e.x, e.y, goal, pass2, 40);
  }
  return path ? path[0] : null;
}
function stepToward(s, e, tx, ty, ev, opt) {
  opt = opt || {};
  const goalWalk = enemyWalkable(s, tx, ty, e) && !opt.adjacent;
  if (goalWalk ? (e.x === tx && e.y === ty) : manh(e.x, e.y, tx, ty) <= 1) return 'arrived';
  const st = nextStep(s, e, tx, ty, opt);
  if (!st) return 'blocked';
  const nd = dirTo(e.x, e.y, st[0], st[1]);
  if (opt.turnFirst && ((nd + 2) % 4) === e.dir) { e.dir = nd; ev.push({k: 'face', id: e.id, dir: nd}); return 'turned'; }
  if (occupied(s, st[0], st[1], e)) { e.dir = nd; ev.push({k: 'face', id: e.id, dir: nd}); return 'blocked'; }
  const from = [e.x, e.y];
  e.x = st[0]; e.y = st[1]; e.dir = nd;
  ev.push({k: 'move', id: e.id, path: [from, [e.x, e.y]], dir: nd});
  return 'moved';
}

// ---------------- 警戒 ----------------
function raiseAlert(s, lvl, ev) {
  if (lvl > s.alert) { s.alert = lvl; s.alertT = s.T; ev.push({k: 'alert', level: lvl}); }
  else if (lvl === s.alert) s.alertT = s.T;
}
function decayAlert(s, ev) {
  if (s.alert === 3 && s.T - s.lastSeenT >= 12) {
    s.alert = 2; s.alertT = s.T; ev.push({k: 'alert', level: 2});
    for (const e of s.enemies) if (standing(e) && e.mode === 'combat') { e.mode = 'search'; e.aiming = null; e.lookLeft = 3; }
  } else if (s.alert === 2 && s.T - s.alertT >= 15) {
    s.alert = 1; s.alertT = s.T; ev.push({k: 'alert', level: 1});
    for (const e of s.enemies) if (standing(e) && e.mode === 'search') { e.mode = 'return'; }
  } else if (s.alert === 1 && s.T - s.alertT >= 10) {
    s.alert = 0; s.alertT = s.T; ev.push({k: 'alert', level: 0});
  }
}
function triggerAlarm(s, pos, ev, by) {
  const first = s.alert < 3;
  s.alert = 3; s.alertT = s.T; s.lastKnown = pos.slice(); s.lastSeenT = s.T;
  if (first) { s.stats.alarms++; ev.push({k: 'alert', level: 3, by: by ? by.id : null}); }
  for (const e of s.enemies) {
    if (!standing(e)) continue;
    const ty = G.TYPES[e.type];
    if (ty.camera) continue;
    if (e.mode !== 'combat') { e.mode = 'combat'; e.aiming = null; }
  }
  if (s.player.disguise && s.player.disguise.kind === 'janitor') { s.player.disguise = null; ev.push({k: 'undisguise'}); }
  if (s.vip && !s.vip.dead) panic(s, 20, ev);
  if (first && !s.reinfDone) {
    const m = G.MISSIONS[s.mid];
    const reinf = (m && m.reinf) || [];
    const hasOfficerSlot = s.enemies.some(e => G.TYPES[e.type].officer);
    const officerUp = s.enemies.some(e => G.TYPES[e.type].officer && standing(e));
    if (reinf.length && (!hasOfficerSlot || officerUp)) {
      s.reinfDone = true;
      ev.push({k: 'banner', text: '增援趕到', tone: 'red'});
      for (const r of reinf) { const e = E.spawn(s, Object.assign({mode: 'combat'}, r), ev); e.mode = 'combat'; }
    }
  }
  hook(s, 'alarm', ev);
}
E.triggerAlarm = triggerAlarm; E.raiseAlert = raiseAlert;

function bark(s, e, kind) {
  const B = G.BARKS || {};
  const pool = (e.skin && B[e.skin + '_' + kind]) || B[e.type + '_' + kind] || B[kind] || null;
  if (!pool || !pool.length) return null;
  s.barkN = (s.barkN + 1) % 997;
  return pool[(s.barkN + e.id.length * 7) % pool.length];
}
function say(ev, id, text) { if (text) ev.push({k: 'say', id, text}); }
E.say = say;

function targetsOf(s) {
  const t = [{id: 'p', x: s.player.x, y: s.player.y}];
  if (s.vip && !s.vip.dead) t.push({id: 'v', x: s.vip.x, y: s.vip.y});
  return t;
}
function canDetect(s, e, t) {
  const r = sees(s, e, t.x, t.y);
  const d = dist(e.x, e.y, t.x, t.y);
  let seen = r === true;
  if (seen && t.id === 'p' && !recognizes(s, e, d)) seen = false;
  if (!seen && t.id === 'p' && G.TYPES[e.type].smell && standing(e) && !(e.blindUntil > s.T)) {
    const sm = G.TYPES[e.type].smell + (s.player.smellUntil > s.T ? 2 : 0);
    if (manh(e.x, e.y, t.x, t.y) <= sm && soundDist(s, e.x, e.y, t.x, t.y, sm) <= sm) seen = 'smell';
  }
  return seen;
}
function onSeen(s, e, t, ev) {
  const ty = G.TYPES[e.type];
  const d = dist(e.x, e.y, t.x, t.y);
  if (e.mode === 'combat') { s.lastKnown = [t.x, t.y]; s.lastSeenT = s.T; return; }
  if (ty.camera) { cameraAlarm(s, e, t, ev); return; }
  if (e.mode === 'suspicious') { e.susPos = [t.x, t.y]; return; }
  if (d <= 1.5 || ty.quick) bang(s, e, t, ev);
  else suspicious(s, e, t, ev);
}
function bang(s, e, t, ev) {
  e.dir = dirTo(e.x, e.y, t.x, t.y);
  if (t.id === 'p' && s.player.reflex > 0) {
    s.player.reflex--; ev.push({k: 'reflex'});
    suspicious(s, e, t, ev); return;
  }
  ev.push({k: 'spot', id: e.id, mark: '!'});
  say(ev, e.id, bark(s, e, 'spot'));
  s.bangFlag = true;
  triggerAlarm(s, [t.x, t.y], ev, e);
}
function suspicious(s, e, t, ev) {
  e.mode = 'suspicious'; e.susPos = [t.x, t.y]; e.dir = dirTo(e.x, e.y, t.x, t.y); e.aiming = null;
  ev.push({k: 'spot', id: e.id, mark: '?'});
  say(ev, e.id, bark(s, e, 'sus'));
  raiseAlert(s, 1, ev);
  if (G.TYPES[e.type].squad) {
    for (const o of s.enemies) {
      if (o === e || !standing(o) || o.type !== e.type || o.mode === 'combat' || o.mode === 'suspicious') continue;
      o.mode = 'investigate'; o.target = [t.x, t.y]; o.lookLeft = 2;
      ev.push({k: 'spot', id: o.id, mark: '?'});
    }
  }
}
function cameraAlarm(s, e, t, ev) {
  if (e.camT && s.T - e.camT < 6) return;
  e.camT = s.T;
  ev.push({k: 'spot', id: e.id, mark: '!'});
  ev.push({k: 'banner', text: '攝影機發現了你', tone: 'red'});
  raiseAlert(s, 2, ev);
  s.lastKnown = [t.x, t.y];
  const near = s.enemies.filter(o => standing(o) && !G.TYPES[o.type].fixed && o.mode !== 'combat')
    .sort((a, b) => manh(a.x, a.y, t.x, t.y) - manh(b.x, b.y, t.x, t.y)).slice(0, 2);
  for (const o of near) { o.mode = 'search'; o.target = null; o.lookLeft = 3; ev.push({k: 'spot', id: o.id, mark: '?'}); }
}
function shout(s, e, r, pos, ev) {
  for (const o of s.enemies) {
    if (o === e || !standing(o) || o.mode === 'combat' || G.TYPES[o.type].fixed) continue;
    if (manh(o.x, o.y, e.x, e.y) <= r) { o.mode = 'investigate'; o.target = pos.slice(); o.lookLeft = 2; }
  }
}

// 某單位移動或轉向之後：檢查它看不看得到人與屍體
function scan(s, e, ev) {
  if (!standing(e) || e.blindUntil > s.T || e.idle) return;
  for (const t of targetsOf(s)) {
    if (t.id === 'p' && s.player.ghost) continue;
    if (canDetect(s, e, t)) onSeen(s, e, t, ev);
  }
  const ty = G.TYPES[e.type];
  if (e.mode !== 'combat' && !ty.camera && !ty.fixed) {
    for (const b of s.enemies) {
      if (b === e || !isBody(b) || b.hidden || b.found) continue;
      if (sees(s, e, b.x, b.y) === true) {
        b.found = true;
        e.mode = 'investigate'; e.target = [b.x, b.y]; e.lookLeft = 2; e.wakeTarget = b.id;
        ev.push({k: 'spot', id: e.id, mark: '!?'});
        say(ev, e.id, bark(s, e, 'body'));
        raiseAlert(s, 2, ev);
        shout(s, e, 5, [b.x, b.y], ev);
        break;
      }
    }
  }
}
// 玩家／會計師移動到新格子時，所有敵人檢查一次
function scanTarget(s, t, ev) {
  for (const e of s.enemies) {
    if (!standing(e) || e.idle) continue;
    if (canDetect(s, e, t)) onSeen(s, e, t, ev);
  }
}

// ---------------- 噪音 ----------------
function emitNoise(s, x, y, r, ev, opt) {
  opt = opt || {};
  if (r <= 0) return;
  if (!opt.quiet) ev.push({k: 'noise', at: [x, y], r});
  let heard = 0;
  for (const e of s.enemies) {
    if (!standing(e) || e.mode === 'combat' || e.idle) continue;
    const ty = G.TYPES[e.type];
    const rr = r + (ty.smell ? 1 : 0);
    if (manh(e.x, e.y, x, y) > rr + 1) continue;
    if (soundDist(s, e.x, e.y, x, y, rr) > rr) continue;
    heard++;
    if (ty.camera) continue;
    if (ty.fixed || (ty.post && e.mode === 'post')) { e.dir = dirTo(e.x, e.y, x, y); e.holdFace = 2; ev.push({k: 'face', id: e.id, dir: e.dir}); if (!ty.fixed) { e.mode = 'investigate'; e.target = [x, y]; e.lookLeft = 2; } scan(s, e, ev); continue; }
    if (e.mode === 'suspicious') { e.susPos = [x, y]; continue; }
    e.mode = 'investigate'; e.target = [x, y]; e.lookLeft = 2; e.waitLeft = 0; e.radio = null;
    e.dir = dirTo(e.x, e.y, x, y);
    ev.push({k: 'spot', id: e.id, mark: '?'});
    if (heard <= 2) say(ev, e.id, bark(s, e, 'noise'));
    scan(s, e, ev);
  }
  if (heard) raiseAlert(s, r >= 5 ? 2 : 1, ev);
  if (s.vip && !s.vip.dead && r >= 4 && manh(s.vip.x, s.vip.y, x, y) <= 5) panic(s, 25, ev);
}
E.emitNoise = emitNoise;

// ---------------- 會計師（護送目標） ----------------
function panic(s, amt, ev) {
  const v = s.vip; if (!v || v.dead) return;
  v.panic = Math.max(0, Math.min(100, v.panic + amt));
  if (v.panic >= 100) {
    v.panic = 40;
    ev.push({k: 'say', id: 'v', text: (G.TEXT && G.TEXT.vipPanic) || '我不行了！'});
    ev.push({k: 'banner', text: '席林慌了', tone: 'red'});
    emitNoise(s, v.x, v.y, 5, ev);
  }
}
function hurtVip(s, dmg, ev) {
  const v = s.vip; if (!v || v.dead) return;
  v.hp -= dmg; s.stats.vipDmg = (s.stats.vipDmg || 0) + dmg;
  ev.push({k: 'hit', id: 'v', dmg});
  if (v.hp <= 0) { v.hp = 0; v.dead = true; ev.push({k: 'down', id: 'v', how: 'dead'}); hook(s, 'vipDown', ev); }
  else panic(s, 30, ev);
}
function vipFollow(s, steps, ev) {
  const v = s.vip, p = s.player;
  if (!v || v.dead || v.mode !== 'follow') return;
  if (manh(v.x, v.y, p.x, p.y) === 1) return;
  const pass = (x, y) => tprop(s, x, y).walk && !occupied(s, x, y, v) && !(x === p.x && y === p.y);
  const path = bfs(s, v.x, v.y, (x, y) => manh(x, y, p.x, p.y) === 1 && !occupied(s, x, y, v), pass, 30);
  if (!path) return;
  const n = Math.min(path.length, steps + 1);
  const from = [v.x, v.y]; const walked = [from];
  for (let i = 0; i < n; i++) {
    v.x = path[i][0]; v.y = path[i][1]; walked.push([v.x, v.y]);
    s.bangFlag = false;
    scanTarget(s, {id: 'v', x: v.x, y: v.y}, ev);
    if (s.bangFlag) break;
  }
  ev.push({k: 'move', id: 'v', path: walked});
}
E.setVipMode = function (s, mode) { if (s.vip && !s.vip.dead) s.vip.mode = mode; return [{k: 'vipmode', mode}]; };

// ---------------- 傷害 ----------------
function hurtPlayer(s, dmg, ev, src) {
  const p = s.player;
  p.hp -= dmg; s.stats.dmg += dmg;
  ev.push({k: 'hit', id: 'p', dmg, src});
  if (p.hp <= 0) { p.hp = 0; s.over = 'lose'; s.overWhy = 'dead'; ev.push({k: 'down', id: 'p', how: 'dead'}); }
}
function coverBetween(s, tx, ty, sx, sy) {
  const dx = Math.sign(sx - tx), dy = Math.sign(sy - ty);
  if (dx !== 0 && tprop(s, tx + dx, ty).cover) return true;
  if (dy !== 0 && tprop(s, tx, ty + dy).cover) return true;
  return false;
}
E.coverBetween = coverBetween;
function hurtEnemy(s, e, dmg, lethal, ev, how) {
  if (!e || e.dead || e.gone) return false;
  e.hp -= dmg;
  ev.push({k: 'hit', id: e.id, dmg});
  if (e.hp <= 0) { e.hp = 0; downEnemy(s, e, lethal ? 'dead' : 'ko', ev, how); return true; }
  return false;
}
function downEnemy(s, e, kind, ev, how) {
  const ty = G.TYPES[e.type];
  e.aiming = null;
  if (ty.camera) { e.gone = true; e.next = BIG; ev.push({k: 'down', id: e.id, how: 'broken'}); return; }
  if (ty.boss) {
    e.down = 'defeated'; e.downUntil = BIG; e.next = BIG; e.mode = 'down';
    ev.push({k: 'down', id: e.id, how: 'defeated'});
    hook(s, 'bossDown', e, ev);
    return;
  }
  if (kind === 'dead' && ty.noKill) kind = 'ko';
  if (kind === 'dead') {
    e.dead = true; e.next = BIG; e.mode = 'down'; s.stats.kills++; s.stats.killNames.push(e.name);
    ev.push({k: 'down', id: e.id, how: 'dead', cause: how});
  } else {
    e.down = kind; e.downUntil = s.T + (kind === 'sleep' ? 12 : 20); e.next = e.downUntil; e.mode = 'down';
    s.stats.kos++;
    ev.push({k: 'down', id: e.id, how: kind, cause: how});
  }
  e.found = false;
  if (s.vip && !s.vip.dead && manh(s.vip.x, s.vip.y, e.x, e.y) <= 3) panic(s, 10, ev);
  hook(s, 'enemyDown', e, ev);
}
function wake(s, e, ev) {
  e.down = null; e.mode = 'search'; e.target = null; e.lookLeft = 3; e.hidden = false; e.found = true;
  if (!s.lastKnown) s.lastKnown = [e.x, e.y];
  ev.push({k: 'wake', id: e.id});
  say(ev, e.id, bark(s, e, 'wake'));
  raiseAlert(s, 2, ev);
}
// 被攻擊但沒倒下：轉身、反應
function provoke(s, e, ev) {
  if (!standing(e) || e.mode === 'combat') return;
  if (e.stunUntil > s.T) { e.mode = 'suspicious'; e.susPos = [s.player.x, s.player.y]; return; }
  e.dir = dirTo(e.x, e.y, s.player.x, s.player.y);
  const t = {id: 'p', x: s.player.x, y: s.player.y};
  if (sees(s, e, t.x, t.y) === true) bang(s, e, t, ev);
  else { e.mode = 'investigate'; e.target = [t.x, t.y]; e.lookLeft = 3; ev.push({k: 'spot', id: e.id, mark: '?!'}); raiseAlert(s, 2, ev); }
}
function isBack(s, e) {
  if (!standing(e)) return true;
  if (e.stunUntil > s.T || e.blindUntil > s.T) return true;
  if (s.turn && s.turn.exposed[e.id]) return true;
  return sees(s, e, s.player.x, s.player.y) !== true;
}
E.isBack = isBack;

function explode(s, x, y, r, dc, da, breaks, ev, src) {
  ev.push({k: 'explode', at: [x, y], r});
  if (breaks) {
    for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) {
      if (!inB(s, xx, yy)) continue;
      const p = tprop(s, xx, yy);
      if (p.breakable || (p.cracked && (src === 'charge' || src === 'rocket'))) {
        s.tiles[yy][xx] = '.'; ev.push({k: 'tile', at: [xx, yy], ch: '.'});
      }
    }
  }
  const p = s.player;
  if (cheb(p.x, p.y, x, y) <= r) hurtPlayer(s, (p.x === x && p.y === y) ? dc : da, ev, 'blast');
  if (s.vip && !s.vip.dead && cheb(s.vip.x, s.vip.y, x, y) <= r) hurtVip(s, (s.vip.x === x && s.vip.y === y) ? dc : da, ev);
  for (const e of s.enemies.slice()) {
    if (e.dead || e.gone) continue;
    if (cheb(e.x, e.y, x, y) <= r) {
      const d = (e.x === x && e.y === y) ? dc : da;
      if (standing(e)) { if (!hurtEnemy(s, e, d, true, ev, src)) provoke(s, e, ev); }
      else if (!e.dead) { hurtEnemy(s, e, d, true, ev, src); }
    }
  }
  for (const L of s.lamps) if (L.on && cheb(L.x, L.y, x, y) <= r) { L.on = false; ev.push({k: 'lamp', id: L.id, on: false}); }
  recomputeLight(s);
  emitNoise(s, x, y, src === 'charge' ? 8 : (src === 'rocket' ? 9 : 7), ev, {quiet: true});
}

// ---------------- 回合 ----------------
function draw(s, n, ev) {
  for (let i = 0; i < n; i++) {
    if (!s.deck.length) {
      if (!s.discard.length) break;
      s.deck = shuffle(s, s.discard); s.discard = [];
      ev.push({k: 'reshuffle'});
    }
    s.hand.push(s.deck.pop());
  }
}
function startTurn(s, ev) {
  s.turnN++; s.stats.turns = s.turnN;
  s.turn = {n: s.turnN, actions: 0, max: 3, cost: 0, played: [], moved: false, hold: false, exposed: {}};
  const p = s.player;
  if (p.disguise && p.disguise.until <= s.T) { p.disguise = null; ev.push({k: 'undisguise'}); }
  draw(s, HAND - s.hand.length, ev);
  if (s.vip && !s.vip.dead) s.vip.panic = Math.max(0, s.vip.panic - 5);
  hook(s, 'turn', ev);
  // 偷聽：附近敵人的閒聊
  for (const e of s.enemies) {
    if (!standing(e) || !e.chat || !e.chat.length || e.mode === 'combat' || e.mode === 'suspicious') continue;
    if (manh(e.x, e.y, p.x, p.y) <= 4 && s.T - e.chatT > 8) { e.chatT = s.T; say(ev, e.id, e.chat.shift()); break; }
  }
  ev.push({k: 'turn', n: s.turnN, T: s.T});
}
E.startTurn = startTurn;

    e.mode = 'search'; e.target = [p.x, p.y]; e.lookLeft = 2;

    const g = s.enemies.filter(e => standing(e) && !G.TYPES[e.type].fixed && e.mode !== 'combat')

// ---------------- 玩家：目標選擇 ----------------

  let frontier = [[p.x, p.y]];
  for (let n = 1; n <= steps; n++) {
    const next = [];
    for (const [x, y] of frontier) {
      const cur = best.get(K(x, y));
      if (cur.n !== n - 1) continue;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (!inB(s, nx, ny) || !playerPass(s, nx, ny, mode)) continue;
        const c = cur.c + 1 + (card && card.ghost ? 0 : dangerAt(s, nx, ny) * 0.05);

// ---------------- 玩家：出牌 ----------------
function fail(why) { return {ok: false, why}; }
E.play = function (s, hi, target) {
  if (s.over) return fail('任務已結束');
  if (s.pendingChoice) return fail('先做決定');
  const id = s.hand[hi]; const c = G.CARD[id];
  if (!c) return fail('沒有這張牌');
  if (s.turn.actions >= s.turn.max) return fail('本回合行動次數用完了');
  const tg = targetsFor(s, c);
  if (tg.blocked) return fail(tg.blocked);
  // 驗證目標
  target = target || {};
  if (c.target === 'move') { const pth = tg.moves[K(target.x, target.y)]; if (!pth) return fail('到不了那裡'); target.path = pth; }
  else if (c.target === 'enemy') {
    if (target.lamp) { if (!(tg.lamps || []).includes(target.lamp)) return fail('打不到那盞燈'); }
    else if (!tg.ids.includes(target.id)) return fail('不在射程或視線內');
  }
  else if (c.target === 'adjEnemy' || c.target === 'adjBody' || c.target === 'anyEnemy') { if (!tg.ids.includes(target.id)) return fail(c.backOnly ? '只能從背後下手' : '目標不對'); }
  else if (c.target === 'tile' || c.target === 'adjTile' || c.target === 'adjDoor') { if (!tg.tiles.some(t => t[0] === target.x && t[1] === target.y)) return fail('丟不到那裡'); }
  else if (c.target === 'fake') {
    if (!tg.ids.includes(target.id)) return fail('他現在不會聽假情報');
    if (!E.fakeTiles(s, target.id).some(t => t[0] === target.x && t[1] === target.y)) return fail('那個地點太遠了');
  }
  const ev = [];
  const chain = G.matchChain(s.turn.played.concat([id]));
  let cost = c.cost; if (chain) cost = Math.max(0, cost - chain.off);
  s.turn.cost += cost; s.turn.actions++; s.turn.played.push(id);
  s.hand.splice(hi, 1); s.discard.push(id);
  if (c.once) s.usedOnce[id] = true;
  ev.push({k: 'card', id, cost, chain: chain ? chain.name : null});
  if (chain) ev.push({k: 'chain', name: chain.name, off: chain.off});
  applyCard(s, c, target, ev);
  after(s, ev);
  return {ok: true, ev};
};
E.previewCost = function (s, id) {
  const c = G.CARD[id];

  let cost = c.cost; if (chain) cost = Math.max(0, cost - chain.off);
  return {cost, chain};
};
// 蓋牌移動：任何一張牌丟掉，移動 1 格，Cost 2
E.stepOptions = function (s) { return moveOptions(s, null, 1); };

// 場景互動（不用卡）
E.actions = function (s) {

  for (const [dx, dy] of DIRS) {
    const x = p.x + dx, y = p.y + dy, ch = tileAt(s, x, y);
    if (ch === 'K') out.push({id: 'lock', label: '撬鎖', cost: 4, noise: 1, at: [x, y]});
    if (ch === 'P' && !s.powerCut) out.push({id: 'power', label: '剪電線', cost: 3, noise: 1, at: [x, y]});

  }

};
E.act = function (s, aid, at) {

  const a = E.actions(s).find(o => o.id === aid && (!at || (o.at[0] === at[0] && o.at[1] === at[1])));
  if (!a) return fail('這裡沒有可以操作的東西');

  else if (aid === 'power') {
    s.powerCut = true; s.blackoutUntil = s.T + s.turn.cost + 15; ev.push({k: 'blackout', until: s.blackoutUntil});
    ev.push({k: 'banner', text: '整層熄燈', tone: 'ink'});

      .sort((a, b) => manh(a.x, a.y, x, y) - manh(b.x, b.y, x, y)).slice(0, 1);

function doMove(s, path, noise, ghost, ev) {
  const p = s.player;
  const walked = [[p.x, p.y]];
  s.bangFlag = false;
  p.ghost = !!ghost;
  for (let i = 1; i < path.length; i++) {
    const [x, y] = path[i];
    p.x = x; p.y = y; walked.push([x, y]);
    p.shadow = false;
    if (!tprop(s, x, y).walk) continue; // 翻越中
    if (E.lasersOn(s) && tileAt(s, x, y) === 'L' && !ghost) {
      ev.push({k: 'move', id: 'p', path: walked.slice()}); walked.splice(0, walked.length - 1);
      ev.push({k: 'laser', at: [x, y]});
      ev.push({k: 'banner', text: '觸動雷射', tone: 'red'});
      triggerAlarm(s, [x, y], ev, null);
      break;
    }
    pickupAt(s, x, y, ev);
    if (!ghost) {
      scanTarget(s, {id: 'p', x, y}, ev);
      if (s.bangFlag) { break; }
    }
    if (s.over) break;
  }
  p.ghost = false;
  if (walked.length > 1) ev.push({k: 'move', id: 'p', path: walked});
  if (ghost) scanTarget(s, {id: 'p', x: p.x, y: p.y}, ev);
  s.turn.moved = true;
  if (noise > 0 && !s.turn.hold) emitNoise(s, p.x, p.y, noise, ev);
  vipFollow(s, Math.max(1, walked.length - 1), ev);
}
function pickupAt(s, x, y, ev) {
  for (const it of s.items) {
    if (it.taken || it.x !== x || it.y !== y) continue;
    it.taken = true;
    if (it.kind === 'file') { s.stats.files++; (s.out.files = s.out.files || []).push(it.id); ev.push({k: 'pickup', kind: 'file', id: it.id, at: [x, y]}); }
    else { ev.push({k: 'pickup', kind: 'obj', id: it.id, at: [x, y]}); hook(s, 'pickup', it, ev); }
  }
}

function breakDisguise(s, ev) {

// ---------------- 預測與預覽 ----------------
E.clone = s => JSON.parse(JSON.stringify(s));
E.counts = function (s, extraCost) {

// =================== 劇情流程 ===================
const Flow = {
  async next() {
    const mid = ORDER[save.progress];
    if (!mid) { Screens.hub(); return; }
    for (const seq of G.FLOW[mid].pre) {
      const key = seq + '@' + mid;
      if (save.seen[key]) continue;
      await this.seq(seq);
      save.seen[key] = true; persist();
    }
    Screens.brief(mid, 'story');
  },
  async seq(id) {
    if (/^cover\d$/.test(id)) { await G.Comic.cover(+id.slice(5)); return; }
    const r = await G.Comic.play(id, this.flagsView());
    for (const [k, v] of Object.entries(r.choices || {})) this.applyChoice(k, v);
    persist();
    if (r.choices && r.choices.ending) await this.ending(r.choices.ending);
  },
  flagsView() {
    const f = save.flags;
    return {lookfilm: !!f.lookfilm, trust: !!f.trust, gorman: f.gorman || 'spared', shilin: f.shilin === 'saved', allfiles: save.files.length >= 12};
  },
  applyChoice(k, v) {
    if (k === 'lookfilm') save.flags.lookfilm = v === 'look';
    else if (k === 'trust') save.flags.trust = v === 'trust';
    else if (k === 'ending') save.flags.ending = v;
  },
  async ending(id) {
    const en = G.ENDINGS[id];
    const kills3 = (save.kills['3-1'] || []).concat(save.kills['3-2'] || []);
    await G.Comic.play(en.seq, Object.assign(this.flagsView(), {kills3, endingTitle: en.title}));
    if (!save.endings.includes(id)) save.endings.push(id);
    save.progress = ORDER.length; persist();
    await G.Comic.credits(en.title, save.endings.length);
    Screens.hub();
  },
  async missionWin(mid, s, sc, mode) {
    // 紀錄
    const firstClear = mode === 'story' && ORDER[save.progress] === mid;
    const newFiles = (s.out.files || []).filter(f => !save.files.includes(f));
    save.files = save.files.concat(newFiles);
    const pts = mode === 'sim' ? 0 : Math.round((firstClear ? sc.points : sc.points * 0.5) - (newFiles.length ? 0 : 0));
    save.points += pts;
    const rank = 'SABCD';
    if (!save.best[mid] || rank.indexOf(sc.grade) < rank.indexOf(save.best[mid])) save.best[mid] = sc.grade;
    if (firstClear) {
      if (mid === '1-2') save.flags.gorman = s.out.gorman || 'spared';
      if (mid === '2-1') save.flags.ch2alarm = !!s.out.ch2alarm;
      if (mid === '2-2') save.flags.shilin = s.out.shilin || 'dead';
      save.kills[mid] = s.stats.killNames.slice();
      save.progress++;
    }
    persist();
    await Screens.result(mid, s, sc, pts, newFiles);
    if (firstClear) {
      for (const seq of G.FLOW[mid].post) await this.seq(seq);
      if (mid === '3-2') return; // 結局流程會自己回酒館
    } else if (mid === '3-2' && mode === 'replay') {
      await this.seq('final');
      return;
    }
    if (mode === 'story' || mode === 'replay') Screens.hub();
  },
};
G.Flow = Flow;

    </div>`;
  show('deck');
  $('#d-back').onclick = () => {
    if (save.deck.length < 20 || save.deck.length > 30) { toast('牌組要 20～30 張'); return; }
    AU().play('click'); goBack();
  };
  $$('[data-f]', sc).forEach(b => b.onclick = () => { deckFilter = b.dataset.f; Screens.deck(back); });
  $$('[data-a]', sc).forEach(b => b.onclick = () => { const id = b.dataset.a; if (count(id) >= 3) { toast('同名最多 3 張'); return; } if (save.deck.length >= 30) { toast('牌組最多 30 張'); return; } save.deck.push(id); persist(); AU().play('card'); Screens.deck(back); });
  $$('[data-m]', sc).forEach(b => b.onclick = () => { const id = b.dataset.m; const i = save.deck.indexOf(id); if (i < 0) return; save.deck.splice(i, 1); persist(); AU().play('click'); Screens.deck(back); });
  $$('[data-p]', sc).forEach(b => b.onclick = () => { save.deck = autoDeck(b.dataset.p); persist(); AU().play('card'); toast('已套用：' + b.textContent); Screens.deck(back); });
};
function autoDeck(style) {
  const pri = {
    ghost: ['sneak', 'sneak', 'sneak', 'knockout', 'knockout', 'drag', 'coin', 'slide', 'shadow', 'smoke', 'choke', 'tap', 'sneak', 'rope', 'natural', 'hold', 'supp', 'janitor', 'vault', 'reflex', 'fake', 'predict', 'radio', 'coat', 'knockout', 'drag', 'slide', 'coin', 'smoke', 'dash', 'climb', 'ferry', 'curtain', 'headshot', 'tap'],
    balanced: ['sneak', 'sneak', 'dash', 'knockout', 'knockout', 'choke', 'supp', 'smoke', 'coin', 'drag', 'vault', 'slide', 'flash', 'medkit', 'tap', 'cqc', 'pistol', 'sneak', 'natural', 'reflex', 'rope', 'predict', 'disarm', 'suppress', 'grenade', 'dash', 'smoke', 'supp', 'janitor', 'climb', 'headshot', 'adren', 'smg', 'coin', 'medkit'],
    assault: ['dash', 'dash', 'sneak', 'pistol', 'pistol', 'smg', 'shotgun', 'cqc', 'cqc', 'medkit', 'medkit', 'flash', 'smoke', 'grenade', 'suppress', 'adren', 'disarm', 'sneak', 'supp', 'knockout', 'reflex', 'dash', 'smg', 'grenade', 'rocket', 'sniper', 'headshot', 'slide', 'vault', 'suppress', 'shotgun', 'medkit', 'flash', 'cqc', 'sneak'],
  }[style];
  const own = new Set(save.owned); const out = []; const cnt = {};
  for (let pass = 0; pass < 4 && out.length < 30; pass++) for (const id of pri) {
    if (out.length >= 30) break;
    if (!own.has(id)) continue;
    if ((cnt[id] || 0) >= Math.min(3, pass + 1)) continue;
    cnt[id] = (cnt[id] || 0) + 1; out.push(id);
  }
  for (const id of save.owned) { while (out.length < 30 && (cnt[id] || 0) < 3) { cnt[id] = (cnt[id] || 0) + 1; out.push(id); } }
  return out.slice(0, 30);
}

Screens.help = function (from) {

  <div class="scroll help">
    <h3>卡牌就是行動</h3><p>移動、開槍、近身、偽裝、竊聽，全都是牌。每回合補到 6 張，最多做 3 個行動。點牌，再點棋盤上亮起的位置；第一次點是預覽，再點一次執行。</p>
    <h3>Cost 決定誰先動</h3><p>你這回合打出的牌，Cost 加起來就是你要等的時間。上方時間軸是接下來的行動順序；敵人頭上的 ×N 是他在你下次行動前能動幾次。強的牌往往很貴，貴就代表空檔。</p>
    <h3>被看見分兩段</h3><ul><li>紅色網點是視野。實心紅：看得見你。淡紅：太暗，要貼到 2 格內才認得出你。</li><li>第一次被瞄到，敵人頭上出現「?」。他下次行動時如果還看得見你，就會「!」拉警報。</li><li>貼身（相鄰）被看見、或被獵手與軍犬發現，會直接「!」。</li></ul>
    <h3>噪音</h3><p>每張牌都有噪音，附近的人會過來查看。這也是武器：丟硬幣、放收音機，把人引開。</p>
    <h3>背襲</h3><p>敵人看不見你的時候下手就是背襲（頭上會出現「背」）。擊昏、絞殺都要從背後。倒地的人如果被別人看見，會引起搜索；昏迷的人過一陣子會醒。用拖行藏屍，用繩索綁人。</p>
    <h3>掩體與明暗</h3><p>木箱與牆擋住視線；矮掩體不擋視線，但躲在後面中彈傷害減半。路燈底下最亮，打掉路燈就變暗。</p>
    <h3>連鎖</h3><p>照特定順序出牌會觸發連鎖，最後一張降 Cost。牌組畫面可以查全部連鎖。</p>
    <h3>沒有移動牌？</h3><p>按「蓋牌移動」，任何一張牌都能丟掉換移動 1 格（Cost 2）。</p>
    <h3>互動</h3><p>站在門、配電箱、繼電器旁邊，行動列會出現「互動」：撬鎖、剪電線、拆繼電器。</p>
    <h3>翻回上一格</h3><p>每關可以回到上一個回合開始 3 次，會扣評價。</p>
    <h3>鏡頭</h3><p>單指拖曳平移；兩指縮放、旋轉、上下推調整俯角。右上角按鈕可以轉 90 度、切換俯角、置中。電腦上滾輪縮放，Shift＋滾輪旋轉，右鍵拖曳旋轉與傾斜。</p>
  </div>`;
  show('help');
  $('#hp-back').onclick = () => { AU().play('click'); from === 'game' ? Game.resume() : from === 'title' ? Screens.title() : Screens.hub(); };
};

const ALERT_TXT = ['靜默', '起疑', '搜索', '交戰'];
const MODE_TXT = {patrol: '巡邏', post: '站哨', investigate: '查看動靜', suspicious: '起疑', search: '搜索', combat: '交戰', return: '回崗位', down: '倒地'};
const Game = {
  speed() { return save.settings.speed * (this.hurry ? 4 : 1); },
  wait(ms) { return new Promise(r => setTimeout(r, ms / this.speed())); },
  start(mid, mode) {
    const m = G.MISSIONS[mid];
    this.mid = mid; this.m = m; this.mode = mode;
    const flags = mode === 'sim' ? {} : Object.assign({}, save.flags);
    this.s = E.create(m, {seed: (Math.random() * 1e9) | 0, deck: save.deck.slice(), flags});
    this.hist = [JSON.stringify(this.s)]; this.rewinds = 0;
    this.sel = null; this.pv = null; this.lock = false; this.stepMode = false; this.focus = null; this.frozen = false;
    this.buildDOM();
    show('game');
    requestAnimationFrame(() => {
      if (!this.board) this.board = new G.Board($('#board'), {tapTile: (x, y) => this.onTile(x, y), tapUnit: id => this.onUnit(id), hover: (x, y) => this.onHover(x, y)});
      this.board.speed = save.settings.speed;
      this.board.resize(); this.board.setState(this.s, m);
      this.refresh();
      const line = G.TEXT.firstTurn[mid]; if (line) setTimeout(() => this.board.sayBubble('p', line), 400);
      AU().music('mission', {rain: !!m.rain});
      this.introTips();
    });
  },
  resume() { show('game'); requestAnimationFrame(() => { this.board.resize(); this.refresh(); }); AU().music('mission', {rain: !!this.m.rain}); },
  buildDOM() {
    const sc = $('#scr-game');
    sc.innerHTML = `<header class="hud">
        <div class="hud-mission"><b>${this.mode === 'sim' ? 'SIM' : '#' + ISSUE[this.mid] + ' ' + this.mid}</b><span>${esc(this.m.name)}</span><span class="hud-t" id="hud-t"></span></div>
        <div class="hud-alert" id="hud-alert" data-l="0">靜默</div>
        <div class="hud-hp"><div class="hp-bar"><i id="hud-hpbar" style="width:100%"></i></div><span id="hud-hp">20</span></div>
        <button class="icon-btn" id="g-menu" aria-label="選單">${G.ICON('menu')}</button>
      </header>
      <div class="timeline" id="timeline"></div>
      <div class="objective"><b>目標</b><span id="obj"></span><span class="heli" id="heli"></span></div>
      <div class="board-wrap" id="board-wrap"><canvas id="board"></canvas>
        <div class="side-ctl" id="side-ctl"></div>
        <div class="cam-ctl">
          <button class="icon-btn" data-cam="l" aria-label="向左轉">${G.ICON('rotL')}</button>
          <button class="icon-btn" data-cam="r" aria-label="向右轉">${G.ICON('rotR')}</button>
          <button class="icon-btn" data-cam="t" aria-label="切換俯角">${G.ICON('tilt')}</button>
          <button class="icon-btn" data-cam="+" aria-label="放大">${G.ICON('plus')}</button>
          <button class="icon-btn" data-cam="-" aria-label="縮小">${G.ICON('minus')}</button>
          <button class="icon-btn" data-cam="c" aria-label="回到自己">${G.ICON('target')}</button>
        </div>
      </div>
      <div class="detail" id="detail"></div>
      <div class="hand" id="hand"></div>
      <div class="actions" id="actions"></div>`;
    // 舊的畫布換新了
    if (this.board) { this.board.cv = $('#board'); this.board.ctx = this.board.cv.getContext('2d'); this.board.bindInput(); this.board.observe(); }
    $('#g-menu').onclick = () => this.menu();
    $$('[data-cam]', sc).forEach(b => b.onclick = () => {
      const B = this.board; AU().play('click');
      const c = b.dataset.cam;
      if (c === 'l') B.rotate(-Math.PI / 2); else if (c === 'r') B.rotate(Math.PI / 2);
      else if (c === 't') B.cyclePitch(); else if (c === '+') B.zoomBy(1.25); else if (c === '-') B.zoomBy(0.8);
      else { B.center(this.s.player.x, this.s.player.y); B.tgt.zoom = Math.max(B.tgt.zoom, 1); }
    });
    sc.onpointerdown = () => { if (this.lock) this.hurry = true; };
  },
  // ---------- 畫面更新 ----------
  pendingCost() {
    const s = this.s; let c = s.turn.cost;
    if (this.sel) {
      if (this.sel.kind === 'step') c += 2;
      else { const pc = E.previewCost(s, this.sel.id); c += pc.cost; }
    } else if (!s.turn.actions) c = 2;
    return Math.max(1, c);
  },
  refresh() {
    if (!this.s) return;
    this.renderHud(); this.renderTimeline(); this.renderHand(); this.renderDetail(); this.renderActions(); this.renderSide(); this.updateOverlay();
  },
  renderHud() {
    const s = this.s, p = s.player;
    $('#hud-hp').textContent = p.hp; $('#hud-hpbar').style.width = Math.min(100, p.hp / p.max * 100) + '%';
    const a = $('#hud-alert'); a.dataset.l = s.alert; a.textContent = ALERT_TXT[s.alert];
    $('#hud-t').textContent = 'T' + Math.round(s.T);
    $('#obj').textContent = s.objText || '';
    $('#heli').textContent = s.heliT ? '直升機 ' + Math.max(0, Math.ceil(s.heliT - s.T)) : '';
  },
  renderTimeline() {
    const s = this.s; const tl = E.timeline(s, this.pendingCost(), 11);
    const html = ['<span class="tl-label">NEXT</span>'];
    for (const it of tl) {
      const dt = Math.max(0, Math.round(it.t - s.T));
      if (it.id === 'p') { html.push(`<div class="tl-item me" title="你的下一回合"><span>我</span><span class="tt">+${Math.round(this.pendingCost())}</span></div>`); continue; }
      if (it.id === 'libra') { html.push(`<div class="tl-item libra" title="天秤"><span>秤</span><span class="tt">+${dt}</span></div>`); continue; }
      if (it.id === 'charge') { html.push(`<div class="tl-item ev"><span>爆</span><span class="tt">+${dt}</span></div>`); continue; }
      if (it.id.startsWith('ev:')) {
        const k = it.id.slice(3); if (k[0] === 'l') continue;
        const lab = k === 'heli' ? '機' : '增';
        html.push(`<div class="tl-item ev" title="${k === 'heli' ? '直升機' : '增援'}"><span>${lab}</span><span class="tt">+${dt}</span></div>`); continue;
      }
      const e = s.enemies.find(o => o.id === it.id); if (!e) continue;
      const nm = (e.name || '敵').replace(/^打手|^假人·/, '').slice(0, 1) || '敵';
      html.push(`<div class="tl-item e ${e.down ? 'sleep' : ''}" title="${esc(e.name)}"><span>${esc(nm)}</span><span class="tt">+${dt}</span></div>`);
    }
    $('#timeline').innerHTML = html.join('');
  },
  renderHand() {
    const s = this.s; const hand = $('#hand');
    const full = s.turn.actions >= s.turn.max;
    hand.innerHTML = s.hand.map((id, i) => {
      const c = G.CARD[id];
      let dim = full;
      if (!dim) { const tg = E.targetsFor(s, c); dim = !!tg.blocked || noTargets(tg); }
      const ch = !full && G.matchChain(s.turn.played.concat([id]));
      const pc = E.previewCost(s, id);
      const sel = (this.sel && this.sel.hi === i) || (this.stepMode);
      return cardHTML(id, {cls: (this.sel && this.sel.hi === i ? 'sel ' : '') + (dim && !this.stepMode ? 'dim ' : '') + (ch ? 'chainable' : ''), attr: `data-hi="${i}"`, cost: pc.cost}).replace('class="card', 'class="card' + (sel && this.stepMode ? ' sel' : ''));
    }).join('');
    $$('[data-hi]', hand).forEach(b => b.onclick = () => this.onCard(+b.dataset.hi));
  },
  renderDetail() {
    const s = this.s, d = $('#detail'); const sel = this.sel;
    if (this.stepMode) { d.innerHTML = `<div class="d-main"><div class="d-name">蓋牌移動</div><div class="d-hint">選一張要丟掉的牌，換成移動 1 格（Cost 2）。</div></div><button class="btn" id="dt-x">取消</button>`; $('#dt-x').onclick = () => { this.stepMode = false; this.refresh(); }; return; }
    if (!sel) {
      d.innerHTML = `<div class="d-main"><div class="d-name">回合 ${s.turnN}　<span class="tag">行動 ${s.turn.actions}／${s.turn.max}</span><span class="tag cost">本回合 Cost ${s.turn.cost}</span></div><div class="d-hint">${s.turn.actions >= s.turn.max ? '行動次數用完了，按「結束回合」讓時間流動。' : '點一張牌開始。點敵人可以看他的資料。'}</div></div>`;
      return;
    }
    if (sel.kind === 'step') {
      d.innerHTML = `<div class="d-main"><div class="d-name">蓋掉〈${esc(G.CARD[s.hand[sel.hi]].name)}〉移動 1 格 <span class="tag cost">Cost 2</span></div><div class="d-hint">${this.pv ? '再點一次同一格執行。' : '點旁邊亮起的格子。'}</div></div><button class="btn" id="dt-x">取消</button>`;
      $('#dt-x').onclick = () => this.clearSel(); return;
    }
    const c = G.CARD[sel.id]; const pc = E.previewCost(s, sel.id);
    let hint = '';
    const k = sel.tg.kind;
    if (this.pv) hint = this.previewText();
    else if (k === 'self') hint = '再點一次這張牌，或按「出牌」。';
    else if (k === 'move') hint = '點亮起的格子預覽路線，再點一次執行。紅色點是會被看見的格子。';
    else if (k === 'enemy') hint = '點準星框住的敵人' + ((sel.tg.lamps || []).length ? '或路燈' : '') + '，再點一次開火。';
    else if (k === 'adjEnemy') hint = c.backOnly ? '點身旁標著「背」的敵人。' : '點身旁的敵人。';
    else if (k === 'adjBody') hint = '點身旁倒地的人。';
    else if (k === 'tile' || k === 'adjTile') hint = '點亮起的格子預覽範圍，再點一次丟出。';
    else if (k === 'adjDoor') hint = '點旁邊上鎖的門。';
    else if (k === 'anyEnemy') hint = '點任何一個敵人。';
    else if (k === 'fake') hint = sel.fakeId ? '點他要去的地點。' : '先點一個沒在交戰的敵人。';
    d.innerHTML = `<div class="d-main"><div class="d-name">${esc(c.name)} <span class="tag cost">Cost ${pc.cost}${pc.chain ? '' : ''}</span><span class="tag noise">噪音 ${c.noise}</span>${pc.chain ? `<span class="tag chain">連鎖：${esc(pc.chain.name)} −${pc.chain.off}</span>` : ''}</div><div class="d-text">${esc(c.text)}</div>${hint ? `<div class="d-hint">${esc(hint)}</div>` : ''}</div>
      ${k === 'self' || this.pv ? '<button class="btn primary" id="dt-go">出牌</button>' : ''}<button class="btn" id="dt-x">取消</button>`;
    $('#dt-x').onclick = () => this.clearSel();
    const go = $('#dt-go'); if (go) go.onclick = () => this.commit(this.pv ? this.pv.target : {});
  },
  previewText() {
    const s = this.s, pv = this.pv;
    if (pv.path) { const n = pv.danger.filter(Boolean).length; return n ? `途中有 ${n} 格會被看見！再點一次照樣走。` : '路線安全。再點一次執行。'; }
    if (pv.enemy) {
      const e = s.enemies.find(o => o.id === pv.enemy); const back = E.isBack(s, e);
      const c = G.CARD[this.sel.id];
      let t = `目標：${e.name}（${back ? '背襲' : '正面'}）`;
      if (c.dmg) { let dmg = c.dmg; if (c.id === 'headshot') dmg = back && e.mode !== 'combat' ? c.dmg : c.dmgAlert; if (G.TYPES[e.type].armor && !back) dmg = Math.floor(dmg / 2); if (E.coverBetween(s, e.x, e.y, s.player.x, s.player.y)) dmg = Math.ceil(dmg / 2); t += `，傷害 ${dmg}／剩 ${e.hp}`; }
      return t + '。再點一次確認。';
    }
    if (pv.lamp) return '打掉這盞燈，周圍會變暗。再點一次開火。';
    if (pv.tile) return '再點一次同一格確認。';
    return '再點一次確認。';
  },
  renderActions() {
    const s = this.s, a = $('#actions');
    const acts = E.actions(s);
    const full = s.turn.actions >= s.turn.max;
    const cost = s.turn.actions ? s.turn.cost : 2;

  renderSide() {

    side.innerHTML = out.join('');
    const v = $('#sd-vip'); if (v) v.onclick = () => { if (this.lock) return; AU().play('click'); E.setVipMode(s, s.vip.mode === 'follow' ? 'wait' : 'follow'); this.refresh(); };
    const f = $('#sd-frz'); if (f) f.onclick = () => { this.frozen = !this.frozen; if (!this.frozen) for (const e of s.enemies) if (e.next > 1e8 && !e.dead && !e.tied && !e.gone) e.next = s.T + 1; this.refresh(); };
    const r = $('#sd-rst'); if (r) r.onclick = () => this.start(this.mid, this.mode);
  },
  updateOverlay() {
    const s = this.s, o = {};
    o.vision = s.enemies.filter(e => E.standing(e) && !e.idle).map(e => Object.assign({id: e.id, sus: e.mode === 'suspicious'}, E.visionOf(s, e)));
    o.counts = E.counts(s, this.pendingCost());
    o.focus = this.focus;
    if (s.tapUntil > s.T || (s.predict && s.predict.until > s.T)) {
      const fc = E.forecast(s, Math.max(4, this.pendingCost() + 1));
      if (!(s.tapUntil > s.T)) { const id = s.predict.id; fc.paths = {[id]: fc.paths[id] || []}; fc.seen = []; }
      o.forecast = fc;
    }
    const sel = this.sel;
    if (this.stepMode) { /* 等玩家選牌 */ }
    else if (sel) {
      const tg = sel.tg;
      if (tg.kind === 'move') o.tiles = Object.keys(tg.moves).map(k => k.split(',').map(Number));
      else if (tg.kind === 'tile' || tg.kind === 'adjTile' || tg.kind === 'adjDoor') o.tiles = tg.tiles;
      else if (tg.kind === 'fake' && sel.fakeId) o.tiles = sel.fakeTiles;
      if (tg.ids) { o.targetIds = tg.ids; o.targetColor = ['knockout', 'cqc', 'disarm', 'predict', 'fake', 'drag', 'rope'].includes(sel.id) ? '#f0b429' : '#d7262e'; }
      if (tg.lamps && tg.lamps.length) { const L = s.lamps.filter(l => tg.lamps.includes(l.id)); o.tiles = (o.tiles || []).concat(L.map(l => [l.x, l.y])); }
      if (['adjEnemy', 'enemy'].includes(tg.kind)) o.backIds = (tg.ids || []).filter(id => E.isBack(s, s.enemies.find(e => e.id === id)));
      if (tg.kind === 'fake' && !sel.fakeId) o.targetIds = tg.ids;
    }
    if (this.pv) {
      if (this.pv.path) { o.path = this.pv.path; o.pathDanger = this.pv.danger; }
      if (this.pv.sel) o.sel = this.pv.sel;
      if (this.pv.area) o.area = this.pv.area;
      if (this.pv.noise) o.noiseAt = this.pv.noise;

  // ---------- 操作 ----------
  clearSel() { this.sel = null; this.pv = null; this.stepMode = false; this.refresh(); },
  onCard(i) {
    if (this.lock) return;

      this.stepMode = false;
      this.sel = {kind: 'step', hi: i, tg: {kind: 'move', moves: E.stepOptions(s)}}; this.pv = null;

    const tg = E.targets(s, i);

    this.sel = {kind: 'card', hi: i, id: s.hand[i], tg}; this.pv = null;

  onHover(x, y) {
    if (this.lock || !this.sel || !this.sel.tg || this.sel.tg.kind !== 'move') return;
    const path = this.sel.tg.moves[x + ',' + y];
    if (!path) return;

    this.pv = {x, y, path, danger: path.map(([a, b], i) => i > 0 && E.dangerAt(this.s, a, b) > 0), sel: [x, y], target: {x, y}};

  onTile(x, y) {
    if (this.lock) return;
    const s = this.s, sel = this.sel;
    const here = s.enemies.find(o => !o.gone && o.x === x && o.y === y);
    if (!sel) {
      if (here) return this.onUnit(here.id);
      if (s.player.x === x && s.player.y === y) return this.onUnit('p');
      return;
    }
    const tg = sel.tg;
    const same = this.pv && this.pv.x === x && this.pv.y === y;
    if (tg.kind === 'move') {
      const path = tg.moves[x + ',' + y];
      if (!path) { if (here) return this.onUnit(here.id); toast('到不了那裡'); return; }
      if (same) return this.commit({x, y});
      this.pv = {x, y, path, danger: path.map(([a, b], i) => i > 0 && E.dangerAt(s, a, b) > 0), sel: [x, y], target: {x, y}};
      AU().play('tick'); this.renderDetail(); this.updateOverlay(); return;
    }
    if (tg.kind === 'tile' || tg.kind === 'adjTile' || tg.kind === 'adjDoor') {
      if (!tg.tiles.some(t => t[0] === x && t[1] === y)) { if (here && tg.kind === 'tile') { /* 對人丟也行 */ } else { toast('不在範圍內'); return; } }
      if (same) return this.commit({x, y});
      const c = G.CARD[sel.id]; const area = [];
      const r = c.blast != null ? c.blast : 0;
      for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) if (xx >= 0 && yy >= 0 && xx < s.W && yy < s.H) area.push([xx, yy]);
      this.pv = {x, y, sel: [x, y], area, noise: c.lure ? [x, y, c.lure] : (c.id === 'radio' ? [x, y, 4] : null), tile: true, target: {x, y}};
      AU().play('tick'); this.renderDetail(); this.updateOverlay(); return;
    }
    if (tg.kind === 'enemy') {
      const L = s.lamps.find(l => l.x === x && l.y === y && (tg.lamps || []).includes(l.id));
      if (L && !here) { if (this.pv && this.pv.lamp === L.id) return this.commit({lamp: L.id}); this.pv = {lamp: L.id, x, y, sel: [x, y], target: {lamp: L.id}}; this.renderDetail(); this.updateOverlay(); return; }
    }
    if (tg.kind === 'fake' && sel.fakeId) {
      if (!sel.fakeTiles.some(t => t[0] === x && t[1] === y)) { toast('那個地點太遠或走不到'); return; }
      if (same) return this.commit({id: sel.fakeId, x, y});
      this.pv = {x, y, sel: [x, y], tile: true, target: {id: sel.fakeId, x, y}}; this.renderDetail(); this.updateOverlay(); return;
    }
    if (here) return this.onUnit(here.id);
  },
  onUnit(id) {

    const e = s.enemies.find(o => o.id === id); if (!e) return;

  async commit(target) {

  async rewind(force) {

  // ---------- 動畫 ----------
  async run(ev) {

    this.lock = false; this.hurry = false;
    $('#scr-game').classList.remove('lock-input');
    if (this.s.pendingChoice) {
      const ch = this.s.pendingChoice;
      const r = await G.Comic.inMissionChoice(ch.id, Flow.flagsView());
      const ev2 = E.resolveChoice(this.s, r);
      if (ch.id === 'gorman' && r === 'kill') AU().play('gun');
