  async animate(ev) {
    const B = this.board, s = this.s;
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i];
      switch (e.k) {
        case 'card': if (e.id !== '_act' && e.id !== '_step') AU().play('play'); else AU().play('click'); await this.wait(60); break;
        case 'chain': AU().play('chain'); await banner('連鎖！' + e.name, 'chain', 900, 'Cost −' + e.off); this.tip('chain'); break;
        case 'move': {
          // 合併同時段多個敵人的移動
          if (e.id !== 'p' && e.id !== 'v') {
            const batch = [e]; const used = new Set([e.id]);
            while (i + 1 < ev.length && (ev[i + 1].k === 'move' || ev[i + 1].k === 'face') && ev[i + 1].id !== 'p' && ev[i + 1].id !== 'v' && !used.has(ev[i + 1].id)) { i++; batch.push(ev[i]); used.add(ev[i].id); }
            await Promise.all(batch.map(b => b.k === 'move' ? this.tweenMove(b.id, b.path, b.fly ? 70 : 95, b.dir) : (this.face(b.id, b.dir), null)));
          } else {
            await this.tweenMove(e.id, e.path, e.id === 'p' ? 115 : 105);
          }
          break;
        }
        case 'face': this.face(e.id, e.dir); break;
        case 'spot': {
          const col = e.mark === '!' ? '#d7262e' : e.mark === '?' ? '#f0b429' : '#c9c2b0';
          B.addFx({type: 'mark', id: e.id, text: e.mark, color: col, dur: e.mark === '!' ? 1.2 : 0.9});
          if (e.mark === '!') { AU().play('alert'); B.flashA = 0.35; B.flashC = '#d7262e'; await this.wait(380); }
          else if (e.mark === '?') { AU().play('sus'); this.tip('sus'); await this.wait(220); }
          else await this.wait(120);
          break;
        }
        case 'alert': { const a = $('#hud-alert'); if (a) { a.dataset.l = e.level; a.textContent = ALERT_TXT[e.level]; } if (e.level === 3) { AU().music('mission', {alert: true}); this.tip('alarm'); } else if (e.level === 0) AU().music('mission', {alert: false}); break; }
        case 'noise': B.addFx({type: 'ring', at: e.at, r: e.r, dur: 0.8}); break;
        case 'shoot': {
          const from = e.id === 'p' ? [s.player.x, s.player.y] : this.posOf(e.id);
          B.addFx({type: 'tracer', a: from, b: e.at, dur: 0.35});
          const big = {supp: ['pff', 0.8, '#e9e3cf'], pistol: ['BLAM!', 1, '#ffd23a'], smg: ['BRRAT!', 1.1, '#ffd23a'], shotgun: ['BOOM!', 1.25, '#ff8a2a'], sniper: ['KRAK!', 1.2, '#ffd23a'], suppress: ['TAT-TAT', 0.9, '#ffd23a'], headshot: ['KRAK!', 1.2, '#ff5a3a'], rocket: ['FWOOSH', 1.1, '#ff8a2a']}[e.gun] || ['BANG!', 1, '#ffd23a'];
          B.addFx({type: 'sfx', at: e.id === 'p' ? from : e.at, text: e.id === 'p' ? big[0] : 'BANG!', size: big[1], color: e.id === 'p' ? big[2] : '#ff6a4a', dur: 0.75});
          AU().play(e.gun === 'supp' ? 'supp' : e.gun === 'shotgun' || e.gun === 'rocket' ? 'boom' : 'gun');
          B.shake = Math.max(B.shake, e.gun === 'supp' ? 0.1 : 0.35);
          await this.wait(260);
          break;
        }
        case 'aim': AU().play('aim'); B.addFx({type: 'mark', id: e.id, text: '◎', color: '#ff3a3a', dur: 0.8}); await this.wait(200); break;
        case 'bite': B.addFx({type: 'sfx', at: e.at, text: '嗷！', size: 1, color: '#ff6a4a', dur: 0.7}); AU().play('bite'); B.shake = 0.3; await this.wait(240); break;
        case 'melee': {
          const p = B.pos.p; const t = this.posOf(e.to);
          if (p && t) { const ox = p.x, oy = p.y; await this.tween(110, k => { p.x = ox + (t[0] - ox) * 0.35 * Math.sin(k * Math.PI); p.y = oy + (t[1] - oy) * 0.35 * Math.sin(k * Math.PI); }); p.x = ox; p.y = oy; }
          const txt = {knockout: e.back ? 'THWACK!' : 'POW!', choke: '嘶……', cqc: 'WHAM!', disarm: '喀嚓'}[e.kind] || 'POW!';
          B.addFx({type: 'sfx', at: t || [s.player.x, s.player.y], text: txt, size: 1, color: e.kind === 'choke' ? '#e9e3cf' : '#ffd23a', dur: 0.75});
          AU().play(e.kind === 'choke' ? 'choke' : 'punch'); B.shake = Math.max(B.shake, 0.25);
          await this.wait(160);
          break;
        }
        case 'panel': if (save.settings.panels) await this.impact(e); break;
        case 'hit': {
          const at = e.id === 'p' ? [s.player.x, s.player.y] : e.id === 'v' ? [s.vip.x, s.vip.y] : this.posOf(e.id);
          if (at) B.addFx({type: 'num', at, text: '−' + e.dmg, color: e.id === 'p' ? '#ff3a3a' : '#ffb03a', dur: 0.9});
          const pp = B.pos[e.id]; if (pp) pp.flashT = B.time + 0.18;
          if (e.id === 'p') { const hp = $('#hud-hp'); if (hp) { hp.textContent = Math.max(0, s.player.hp); $('#hud-hpbar').style.width = Math.max(0, s.player.hp / s.player.max * 100) + '%'; } B.flashA = 0.3; B.flashC = '#ff2020'; AU().play('hurt'); }
          await this.wait(120);
          break;
        }
        case 'down': {
          const pp = B.pos[e.id];
          if (e.how === 'water' || e.how === 'fall' || e.how === 'broken') { if (pp) { pp.fade = 1; await this.tween(320, k => { pp.fade = 1 - k; }); } AU().play(e.how === 'water' ? 'splash' : 'fall'); break; }
          if (pp) await this.tween(220, k => { pp.lie = k; });
          if (e.how === 'ko' || e.how === 'sleep') B.addFx({type: 'sfx', at: this.posOf(e.id) || [0, 0], text: e.how === 'sleep' ? 'Zzz' : 'KO', size: 0.8, color: '#9fc3ff', dur: 0.8});
          if (e.id === 'p') { AU().play('death'); }
          if (e.how === 'ko' || e.how === 'sleep') this.tip('body');
          break;
        }
        case 'wake': { const pp = B.pos[e.id]; if (pp) await this.tween(200, k => { pp.lie = 1 - k; }); B.addFx({type: 'mark', id: e.id, text: '!?', color: '#f0b429', dur: 0.9}); break; }
        case 'throw': B.addFx({type: 'arc', a: [s.player.x, s.player.y], b: e.at, dur: 0.38, color: e.item === 'coin' ? '#f0b429' : e.item === 'smoke' ? '#c9c2b0' : e.item === 'radio' ? '#8a5a3a' : '#5a6a4a'}); AU().play('throw'); await this.wait(360); break;
        case 'explode': B.addFx({type: 'boom', at: e.at, r: e.r, dur: 0.8}); B.addFx({type: 'sfx', at: e.at, text: 'KA-BOOM!', size: 1.5, color: '#ff8a2a', dur: 1}); B.shake = 1; B.flashA = 0.5; B.flashC = '#ffd38a'; AU().play('explode'); await this.wait(500); break;
        case 'flash': B.addFx({type: 'flash', at: e.at, dur: 0.6}); B.flashA = 0.6; B.flashC = '#ffffff'; AU().play('flash'); await this.wait(300); break;
        case 'smoke': AU().play('smoke'); B.dirty = true; await this.wait(200); break;
        case 'sfx': B.addFx({type: 'sfx', at: e.at, text: e.text, size: e.kind === 'small' ? 0.7 : 1, color: '#ffd23a', dur: 0.7}); if (e.kind === 'zap') AU().play('zap'); else AU().play('tick'); await this.wait(150); break;
        case 'say': B.sayBubble(e.id, e.text, e.long); AU().play(e.id === 'libra' ? 'radio' : 'say'); await this.wait(e.id === 'libra' || e.long ? 900 : 260); break;
        case 'banner': AU().play(e.tone === 'red' ? 'alert2' : 'click'); await banner(e.text, e.tone, 950); break;
        case 'cutin': await G.Comic.play('cutin_' + e.id, Flow.flagsView()); break;
        case 'objective': $('#obj').textContent = e.text; toast('目標更新：' + e.text); break;
        case 'pickup': AU().play(e.kind === 'file' ? 'paper' : 'pickup'); B.addFx({type: 'sfx', at: e.at, text: e.kind === 'file' ? '檔案' : '到手', size: 0.8, color: e.kind === 'file' ? '#9fd6ff' : '#f0b429', dur: 0.8}); if (e.kind === 'file') toast('取得檔案〈' + G.FILES[e.id].title + '〉'); await this.wait(240); break;
        case 'heal': B.addFx({type: 'num', at: [s.player.x, s.player.y], text: '+' + e.amt, color: '#7dff9a', dur: 0.9}); AU().play('heal'); await this.wait(200); break;
        case 'stun': B.addFx({type: 'mark', id: e.id, text: '✶', color: '#ffd36b', dur: 0.8}); break;
        case 'blind': B.addFx({type: 'mark', id: e.id, text: '◎', color: '#ffffff', dur: 0.8}); break;
        case 'disarm': B.addFx({type: 'mark', id: e.id, text: '空手', color: '#f0b429', dur: 0.9}); break;
        case 'delay': B.addFx({type: 'mark', id: e.id, text: '+' + e.by, color: '#9fd6ff', dur: 0.9}); break;
        case 'hide': { const pp = B.pos[e.id]; AU().play('drag'); if (pp) { pp.fade = 1; } B.dirty = true; await this.wait(150); break; }
        case 'tie': AU().play('rope'); B.addFx({type: 'mark', id: e.id, text: '綁', color: '#c9c2b0', dur: 0.8}); await this.wait(150); break;
        case 'disguise': AU().play('cloth'); B.addFx({type: 'sfx', at: [s.player.x, s.player.y], text: '換裝', size: 0.8, color: '#e9e3cf', dur: 0.7}); await this.wait(200); break;
        case 'undisguise': toast('偽裝解除了'); break;
        case 'reflex': await banner('反應！他以為自己看錯了', 'mustard', 900); break;
        case 'splash': if (e.id === 'water') break; await this.splash(e.id); break;
        case 'tap': AU().play('radio'); toast('竊聽開始：橘色虛線是他們接下來的路線'); break;
        case 'predict': AU().play('tick'); break;
        case 'lure': AU().play(e.off ? 'click' : 'radio'); break;
        case 'charge': AU().play('tick'); toast('定時炸藥：' + Math.round(e.t - s.T) + ' 後爆炸'); break;
        case 'relay': AU().play('zap'); break;
        case 'blackout': AU().play('power'); B.dirty = true; break;
        case 'lamp': AU().play('glass'); B.dirty = true; break;
        case 'lasers': B.dirty = true; break;
        case 'tile': B.dirty = true; break;
        case 'laser': AU().play('alert2'); break;
        case 'spawn': { const pp = B.pos[e.id]; this.board.syncAll(); const q = B.pos[e.id]; if (q) { q.alpha = 0; await this.tween(200, k => { q.alpha = k; }); } void pp; break; }
        case 'reshuffle': toast('牌庫洗回來了'); break;
        case 'turn': AU().play('turn'); break;
        case 'endturn': break;
        case 'choice': break;
        case 'win': case 'lose': break;
        default: break;
      }
      if (s.over === 'lose' && e.k === 'down' && e.id === 'p') break;
    }
  },
  posOf(id) {
    const p = this.board.pos[id]; if (p) return [p.x, p.y];
    if (id === 'p') return [this.s.player.x, this.s.player.y];
    const e = this.s.enemies.find(o => o.id === id); return e ? [e.x, e.y] : null;
  },
  face(id, dir) { const p = this.board.pos[id]; if (p) p.face = dir; this.board.dirty = true; },
  tween(ms, fn) {
    return new Promise(res => {
      const d = ms / this.speed(); const t0 = performance.now();
      const step = () => { const k = Math.min(1, (performance.now() - t0) / Math.max(1, d)); fn(k); this.board.dirty = true; if (k < 1) requestAnimationFrame(step); else res(); };
      requestAnimationFrame(step);
    });
  },
  async tweenMove(id, path, ms, dir) {
    const B = this.board; let p = B.pos[id];
    if (!p) { B.syncAll(); p = B.pos[id]; if (!p) return; }
    for (let i = 1; i < path.length; i++) {
      const [ax, ay] = path[i - 1], [bx, by] = path[i];
      const d = E.util.dirTo(ax, ay, bx, by); p.face = d;
      if (id === 'p' || id === 'v') AU().play('step');
      await this.tween(ms, k => { p.x = ax + (bx - ax) * k; p.y = ay + (by - ay) * k; p.hop = Math.sin(k * Math.PI) * 0.6; });
      p.x = bx; p.y = by; p.hop = 0;
    }
    if (dir != null) p.face = dir;
  },
  async impact(e) {
    const host = $('#impact'); const B = this.board; const s = this.s;
    const tgt = e.to ? this.posOf(e.to) : e.at; if (!tgt) return;
    const focus = e.kind === 'shot' || e.kind === 'rocket' ? tgt : [Math.round((tgt[0] + s.player.x) / 2), Math.round((tgt[1] + s.player.y) / 2)];
    const cap = {knockout: '擊昏', choke: '絞殺', cqc: '摔投', shot: '一槍', rocket: '火箭筒', fall: '墜落'}[e.kind] || '';
    const sfx = {knockout: 'THWACK!', choke: '嘶——', cqc: 'WHAM!', shot: 'KRAK!', rocket: 'KA-BOOM!', fall: '啊——'}[e.kind] || 'POW!';
    const zh = /[^\x00-\x7F]/.test(sfx);
    host.innerHTML = `<div class="frame"><canvas width="720" height="450"></canvas><svg class="lines" viewBox="0 0 160 100" preserveAspectRatio="none">${speedLines()}</svg><div class="sfx ${zh ? 'zh' : ''}">${esc(sfx)}</div><div class="cap">${esc(cap)}</div></div>`;
    host.hidden = false;
    const cv = $('canvas', host);
    try { B.renderCloseup(cv, focus, {zoom: 3.1, pitch: 32, pts: [tgt, [s.player.x, s.player.y]]}); } catch (err) { console.error(err); }
    AU().play('impact');
    await new Promise(res => { let done = false; const fin = () => { if (done) return; done = true; host.hidden = true; host.innerHTML = ''; res(); }; host.onpointerdown = fin; setTimeout(fin, 900 / Math.max(1, save.settings.speed * 0.8)); });
  },
  async splash(id) {
    const d = document.createElement('div'); d.className = 'splash';
    d.innerHTML = id === 'ferry' ? '<div><div class="t">擺渡人</div><div class="s">FERRYMAN</div></div>' : '<div><div class="t">灰幕</div><div class="s">THE CURTAIN FALLS</div></div>';
    $('#app').appendChild(d); AU().play('impact');
    await sleep(950 / save.settings.speed); d.remove();
  },
  // ---------- 結束 ----------
  async finish() {
    const s = this.s;
    if (s.over === 'win') {
      AU().music('off');
      await banner(this.mid === '2-2' ? '撐到了' : '任務完成', 'mustard', 1100);
      if (this.mode === 'sim') { Screens.hub(); return; }
      const sc = E.score(s, this.m);
      await Flow.missionWin(this.mid, s, sc, this.mode);
      return;
    }
    AU().music('off');
    const why = s.overWhy === 'vip' ? '席林死了。帶不出去的貨，就不叫貨。' : '擺渡人沒有回來。';
    this.tip('rewind');
    const opts = [];
    if (this.rewinds < 3) opts.push({label: `翻回上一格（剩 ${3 - this.rewinds}）`, v: 'rw', cls: 'primary'});
    opts.push({label: '重新開始', v: 'retry'}, {label: this.mode === 'story' ? '回酒館' : '離開', v: 'quit'});
    const v = await modal(`<h3>任務失敗</h3><p>${esc(why)}</p>`, opts);
    if (v === 'rw') { const ok = await this.rewind(true); if (!ok) this.start(this.mid, this.mode); }
    else if (v === 'retry') this.start(this.mid, this.mode);
    else this.mode === 'replay' ? Screens.chapters() : Screens.hub();
  },
  // ---------- 教學 ----------
  introTips() {
    if (this.mid === '1-1') { this.tip('first'); setTimeout(() => this.tip('camera'), 50); }
    if (this.s.vip) this.tip('vip');
    if (this.mid === '3-2') this.tip('libra');
  },
  tipQ: [],
  tip(key) {
    if (!save.settings.tips || save.tips[key] || !G.TIPS[key]) return;
    if (this.tipQ.includes(key)) return;
    this.tipQ.push(key);
    if (this.tipQ.length === 1) this.showTip();
  },
  showTip() {
    const key = this.tipQ[0]; if (!key) return;
    save.tips[key] = 1; persist();
    const wrap = $('#board-wrap'); if (!wrap) { this.tipQ = []; return; }
    const d = document.createElement('div'); d.className = 'tip'; d.style.bottom = '8px';
    d.innerHTML = `<b>提示</b>${esc(G.TIPS[key])}<div class="row"><button class="btn primary">知道了</button></div>`;
    wrap.appendChild(d);
    $('button', d).onclick = () => { d.remove(); this.tipQ.shift(); if (this.tipQ.length) this.showTip(); };
  },
};
G.Game = Game;
function noTargets(tg) {
  if (tg.blocked) return true;
  switch (tg.kind) {
    case 'move': return !Object.keys(tg.moves).length;
    case 'enemy': return !(tg.ids.length || (tg.lamps || []).length);
    case 'adjEnemy': return !tg.ids.length && !(tg.front || []).length;
    case 'adjBody': case 'anyEnemy': case 'fake': return !tg.ids.length;
    case 'tile': case 'adjTile': case 'adjDoor': return !(tg.tiles || []).length;
    default: return false;
  }
}
function speedLines() {
  let out = '';
  for (let i = 0; i < 42; i++) {
    const a = i / 42 * Math.PI * 2; const r1 = 38 + (i % 3) * 6, r2 = 130;
    const x1 = 80 + Math.cos(a) * r1, y1 = 50 + Math.sin(a) * r1 * 0.62, x2 = 80 + Math.cos(a) * r2, y2 = 50 + Math.sin(a) * r2 * 0.62;
    const w = 0.4 + (i % 4) * 0.35;
    out += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="#121114" stroke-width="${w}" opacity=".75"/>`;
  }
  return out;
}

// =================== 啟動 ===================
function init() {
  window.addEventListener('resize', () => { if (Game.board && G.curScreen === 'game') Game.board.resize(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) AU().music('pause'); else AU().music('resume'); });
  Screens.title();
  Cloud.init();
}
G.boot = init;
})();

;GC.boot();

</script>
