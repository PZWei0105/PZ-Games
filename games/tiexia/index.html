<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>鐵匣三千里</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* 版面概念：夜裡的說書台。深靛夜色當底，葉子牌一般的紙牌、朱紅印章、黃銅燈火。 */
:root {
  --night: #0c0f16;
  --night-2: #131823;
  --night-3: #1b2230;
  --night-4: #252e3f;
  --line: #2d3647;
  --ink: #ece5d6;
  --ink-dim: #a3a9b6;
  --ink-faint: #677083;
  --paper: #e4dbc6;
  --paper-2: #cfc3a8;
  --paper-ink: #24211c;
  --paper-dim: #6d6455;
  --zhu: #cf3f2a;
  --zhu-deep: #8f2416;
  --dian: #4374bd;
  --qing: #2f9a83;
  --jin: #d6a54d;
  --jin-deep: #9a7330;
  --lantern: #f2b45e;
  --hp: #c8392b;
  --blk: #7aaee3;
  --good: #6fbf73;
  --f-display: "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "PMingLiU", serif;
  --f-body: "LXGW WenKai TC", "Noto Serif TC", "Noto Serif CJK TC", "PingFang TC", "Microsoft JhengHei", serif;
  --r: 10px;
  color-scheme: dark;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
/* 外層已經讓開瀏海與底部橫條時，裡面就不要再讓一次 */
:root.rootpad { --sat: 0px; --sab: 0px; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--jin); outline-offset: 2px; }
.f-d { font-family: var(--f-display); }
#app { position: relative; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
#bg { position: absolute; inset: 0; z-index: 0; background: var(--night); }
#bg canvas { width: 100%; height: 100%; display: block; transition: filter .6s; }
#bg.dim canvas { filter: blur(2.5px) brightness(.55) saturate(.85); }
#bg.dimc::before { content: ""; position: absolute; inset: 0; background: rgba(6,8,12,.55); z-index: 1; pointer-events: none; }
#bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 30%, transparent 40%, rgba(5,7,11,.72) 100%); pointer-events: none; }
#screen { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; }
#fx { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
#fxc { position: absolute; inset: 0; width: 100%; height: 100%; }
#overlay { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
#toasts { position: absolute; left: 50%; top: calc(var(--sat) + 56px); transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { background: rgba(19,24,35,.94); border: 1px solid var(--line); border-left: 3px solid var(--jin); padding: 7px 14px; border-radius: 8px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: toastIn .35s ease-out; max-width: 100%; text-align: center; }
.toast.clue { border-left-color: var(--zhu); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ===== 通用 ===== */
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.pad { padding-inline: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 8px;
  background: linear-gradient(180deg, #2a3446, #1d2534); border: 1px solid #3a4558; color: var(--ink); font-family: var(--f-display); font-weight: 700; letter-spacing: .08em;
  box-shadow: 0 3px 0 #0a0d13, inset 0 1px 0 rgba(255,255,255,.06); transition: transform .08s, filter .15s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a0d13; }
.btn.zhu { background: linear-gradient(180deg, #d6482f, #9e2b1a); border-color: #e2654c; color: #fff4e8; }
.btn.jin { background: linear-gradient(180deg, #dcae5a, #9a7330); border-color: #ecc77d; color: #241a08; }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); color: var(--ink-dim); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.seal { display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 900; color: #fff6ea; background: var(--zhu); border-radius: 6px; line-height: 1;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 2px 6px rgba(0,0,0,.35); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--night-3); border: 1px solid var(--line); font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.muted { color: var(--ink-dim); }
.faint { color: var(--ink-faint); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 900; margin: 0; text-wrap: balance; letter-spacing: .04em; }
.panel { background: rgba(17,21,31,.92); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
.st-攻 { --st: var(--zhu); } .st-守 { --st: var(--dian); } .st-變 { --st: var(--qing); }
.stseal { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--st); color: #fff; font-family: var(--f-display); font-weight: 900; font-size: 13px; line-height: 1; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25); }

/* ===== 頂部資訊列 ===== */
.hud { position: relative; z-index: 5; padding: calc(var(--sat) + 6px) 12px 6px; display: flex; flex-direction: column; gap: 5px;
  background: linear-gradient(180deg, rgba(8,10,15,.95), rgba(8,10,15,.6) 80%, transparent); }
.hud-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hud-title { font-family: var(--f-display); font-weight: 900; font-size: 15px; letter-spacing: .08em; white-space: nowrap; }
.hud-day { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.hud-sp { flex: 1; }
.hud-stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.hud-stat b { font-family: var(--f-display); font-weight: 900; }
.ico { width: 16px; height: 16px; display: inline-block; flex: none; }
.hud-relics { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.hud-relics::-webkit-scrollbar { display: none; }
.relic { flex: none; width: 26px; height: 26px; border-radius: 6px; background: var(--night-3); border: 1px solid #3c475b; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 900; font-size: 13px; color: var(--jin); }
.relic.r-R, .relic.r-B { border-color: var(--jin-deep); background: #2a2416; }
.relic.r-Z { border-color: #6d3d33; color: #f0a28f; }
.relic.r-Q { border-color: #555; color: #ddd; }
.pots { display: flex; gap: 4px; flex: none; }
.pot { width: 26px; height: 26px; border-radius: 50%; border: 1px dashed #3c475b; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 900; font-size: 12px; color: var(--ink-faint); }
.pot.has { border-style: solid; border-color: #5e7c6f; background: #18302a; color: #bfe8d6; }
.iconbtn { width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: rgba(27,34,48,.8); border: 1px solid var(--line); flex: none; }
.iconbtn svg { width: 18px; height: 18px; }

/* ===== 茶樓 ===== */
.hub { flex: 1; display: flex; flex-direction: column; align-items: center; padding: calc(var(--sat) + 18px) 16px calc(var(--sab) + 18px); gap: 14px; min-height: 0; }
.hub-title { text-align: center; margin-top: 4vh; }
.hub-title .t1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(44px, 13vw, 84px); letter-spacing: .12em; line-height: 1.05; color: var(--paper);
  text-shadow: 0 2px 0 #000, 0 0 40px rgba(242,180,94,.18); filter: url(#roughen); }
.hub-title .t2 { margin-top: 6px; font-size: 13px; letter-spacing: .5em; color: var(--ink-dim); text-indent: .5em; }
.hub-title .seal { width: 46px; height: 46px; font-size: 15px; margin-top: 10px; transform: rotate(-6deg); }
.teller { width: min(560px, 100%); text-align: center; min-height: 3.2em; font-size: 15px; color: var(--ink); padding: 0 8px; }
.teller .who { color: var(--jin); font-family: var(--f-display); font-weight: 700; }
.hub-menu { width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.plaque { position: relative; display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 10px 18px; border-radius: 6px; text-align: left;
  background: linear-gradient(180deg, #3a2a1e, #26190f); border: 1px solid #5a412c; box-shadow: 0 4px 0 #120b06, inset 0 1px 0 rgba(255,220,170,.12); color: #f4e6cf; }
.plaque:active { transform: translateY(2px); box-shadow: 0 2px 0 #120b06; }
.plaque .pg { font-family: var(--f-display); font-weight: 900; font-size: 24px; color: var(--lantern); width: 30px; text-align: center; }
.plaque .pt { font-family: var(--f-display); font-weight: 900; font-size: 18px; letter-spacing: .12em; }
.plaque .ps { font-size: 12px; color: #c9b597; }
.plaque.main { background: linear-gradient(180deg, #b23a24, #7a2213); border-color: #d9654a; box-shadow: 0 4px 0 #3d1008, inset 0 1px 0 rgba(255,220,200,.2); }
.plaque.main .pg { color: #ffe1b8; }
.plaque .badge { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: var(--zhu); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
.hub-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(420px, 100%); }
.hub-row .plaque { flex-direction: column; gap: 2px; min-height: 64px; padding: 8px 6px; align-items: center; text-align: center; }
.hub-row .plaque .pg { width: auto; font-size: 20px; }
.hub-row .plaque .pt { font-size: 14px; letter-spacing: .06em; }
.money { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--jin); }

/* ===== 整頁面板 ===== */
.page { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.page-head { padding: calc(var(--sat) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, rgba(8,10,15,.96), rgba(8,10,15,.7)); border-bottom: 1px solid var(--line); }
.page-head h2 { font-size: 20px; flex: 1; }
.page-body { flex: 1; min-height: 0; padding: 14px 16px calc(var(--sab) + 18px); }
.page-foot { padding: 10px 16px calc(var(--sab) + 12px); display: flex; gap: 10px; justify-content: center; background: linear-gradient(0deg, rgba(8,10,15,.96), rgba(8,10,15,.6)); }
.sec { margin-bottom: 18px; }
.sec h3 { font-size: 15px; letter-spacing: .1em; color: var(--jin); margin-bottom: 8px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.opt { position: relative; text-align: left; padding: 12px; border-radius: 10px; background: var(--night-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.opt.on { border-color: var(--jin); background: #221d14; box-shadow: 0 0 0 1px var(--jin) inset; }
.opt.locked { opacity: .45; }
.opt .og { font-family: var(--f-display); font-weight: 900; font-size: 26px; line-height: 1; color: var(--lantern); }
.opt .on_ { font-family: var(--f-display); font-weight: 900; font-size: 16px; }
.opt .od { font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }

/* ===== 劇情 ===== */
.scene { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; position: relative; }
.evg { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) rotate(-4deg); font-family: var(--f-display); font-weight: 900; font-size: min(52vw, 260px); line-height: 1; color: rgba(236,229,214,.07); pointer-events: none; filter: url(#roughen); }
.scene-title { position: absolute; top: calc(var(--sat) + 16px); left: 16px; display: flex; align-items: center; gap: 10px; }
.scene-title .seal { width: 34px; height: 34px; font-size: 14px; }
.scene-title span { font-family: var(--f-display); font-weight: 900; font-size: 18px; letter-spacing: .15em; text-shadow: 0 2px 8px #000; }
.scene-skip { position: absolute; top: calc(var(--sat) + 14px); right: 14px; }
.dlg { margin: 0 12px calc(var(--sab) + 14px); padding: 18px 18px 16px; min-height: 150px; border-radius: 14px; background: rgba(10,12,18,.9); border: 1px solid #333d50; box-shadow: 0 -10px 40px rgba(0,0,0,.4); position: relative; cursor: pointer; }
.dlg .spk { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.dlg .spk .seal { width: 34px; height: 34px; font-size: 17px; transform: rotate(-4deg); }
.dlg .spk .nm { font-family: var(--f-display); font-weight: 900; font-size: 16px; letter-spacing: .1em; }
.dlg .txt { font-size: 17px; line-height: 1.75; max-width: 62ch; min-height: 3.5em; }
.dlg .txt.narr { color: #d9d2c2; }
.dlg .more { position: absolute; right: 16px; bottom: 10px; width: 10px; height: 10px; border-right: 2px solid var(--jin); border-bottom: 2px solid var(--jin); transform: rotate(45deg); animation: bob 1s infinite; }
@keyframes bob { 50% { transform: translateY(3px) rotate(45deg); } }
.choices { margin: 0 12px calc(var(--sab) + 14px); display: flex; flex-direction: column; gap: 10px; }
.dlg.ctx { min-height: 0; cursor: default; margin-bottom: 10px; padding: 12px 16px; opacity: .92; }
.dlg.ctx .txt { min-height: 0; font-size: 15px; }
.dlg.ctx .spk { margin-bottom: 4px; } .dlg.ctx .spk .seal { width: 26px; height: 26px; font-size: 13px; }
.choice { text-align: left; padding: 14px 16px; min-height: 54px; border-radius: 10px; background: rgba(28,22,15,.94); border: 1px solid #6b4f33; color: #f6e8d2; font-size: 16px; box-shadow: 0 3px 0 #0c0805; }
.choice:active { transform: translateY(2px); }
.choice .hint { display: block; font-size: 12.5px; color: #c4ab86; margin-top: 3px; }
.choice.key { border-color: var(--zhu); background: rgba(60,18,12,.94); }

/* ===== 地圖 ===== */
.map-wrap { flex: 1; min-height: 0; position: relative; }
.map-scroll { position: absolute; inset: 0; }
.map-inner { position: relative; width: 100%; }
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node { position: absolute; transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: var(--f-display); font-weight: 900; font-size: 21px; background: var(--paper); color: var(--paper-ink); border: 2px solid #3c3428; box-shadow: 0 4px 0 #0a0807, 0 0 0 4px rgba(12,15,22,.6); }
.node.t-elite { background: #3c1a14; color: #ff9c86; border-color: #a33d2a; }
.node.t-boss, .node.t-finale { width: 66px; height: 66px; font-size: 27px; background: var(--zhu); color: #fff2e4; border-color: #f18a72; }
.node.t-story { background: #1c2b44; color: #cfe0ff; border-color: #4f6f9f; }
.node.t-inn { background: #2b2412; color: var(--lantern); border-color: #8a6a2c; }
.node.t-shop { background: #173028; color: #9fe0c6; border-color: #3a7a64; }
.node.t-event { background: #241c33; color: #d8c4ff; border-color: #6a55a0; }
.node.visited { filter: grayscale(.8) brightness(.6); }
.node.avail { animation: pulse 1.4s infinite; cursor: pointer; }
.node.cur { box-shadow: 0 0 0 4px var(--jin), 0 0 24px rgba(214,165,77,.6); filter: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 4px 0 #0a0807, 0 0 0 4px rgba(214,165,77,.25); } 50% { box-shadow: 0 4px 0 #0a0807, 0 0 0 9px rgba(214,165,77,.55); } }
.node .nl { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; font-size: 11px; font-family: var(--f-body); font-weight: 400; color: var(--ink-dim); white-space: nowrap; text-shadow: 0 1px 3px #000; }
.cart { position: absolute; width: 34px; height: 34px; transform: translate(-50%, -135%); pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.6)); transition: left .5s, top .5s; }
.map-legend { position: absolute; left: 12px; bottom: calc(var(--sab) + 74px); font-size: 11px; color: var(--ink-faint); }
.map-foot { padding: 8px 12px calc(var(--sab) + 10px); display: flex; gap: 8px; align-items: center; background: linear-gradient(0deg, rgba(8,10,15,.97), rgba(8,10,15,.5)); }

/* ===== 隊伍狀態（地圖下方等） ===== */
.party-mini { display: flex; gap: 8px; flex: 1; min-width: 0; }
.pm { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; background: rgba(19,24,35,.85); border: 1px solid var(--line); }
.pm .seal { width: 26px; height: 26px; font-size: 14px; flex: none; }
.pm .pmn { font-size: 12px; color: var(--ink-dim); line-height: 1.2; }
.bar { position: relative; height: 8px; border-radius: 99px; background: #2a1414; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #8f2416, var(--hp)); border-radius: 99px; transition: width .35s; }
.pm .hpn { font-variant-numeric: tabular-nums; font-size: 12px; font-family: var(--f-display); font-weight: 700; }
.aff { font-size: 11px; color: #f0a28f; }

/* ===== 牌 ===== */
.card { --w: 74px; position: relative; width: var(--w); aspect-ratio: 5 / 7; border-radius: 8px; color: var(--paper-ink); flex: none; container-type: inline-size;
  background: radial-gradient(120% 90% at 30% 15%, #f3ecdb, var(--paper) 55%, #d6cab0); box-shadow: 0 3px 0 #8c7f63, 0 6px 14px rgba(0,0,0,.45);
  border: 1px solid #b6a685; overflow: hidden; line-height: 1.3; transition: transform .16s, box-shadow .16s, opacity .2s; }
.card::before { content: ""; position: absolute; inset: 0; background-image: var(--grain); opacity: .13; mix-blend-mode: multiply; pointer-events: none; }
.card::after { content: ""; position: absolute; inset: 5%; border: 1px solid rgba(110,95,70,.28); border-radius: 5px; pointer-events: none; }
.card .ow { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--owc, #444); z-index: 3; }
.card .cost { position: absolute; left: 6%; top: 5%; width: 24cqw; height: 24cqw; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6d083, #a77a2b); border: 1px solid #6e4e18;
  display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 900; color: #2a1c05; font-size: 15cqw; z-index: 2; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.card .stance { position: absolute; right: 6%; top: 5%; width: 21cqw; height: 21cqw; border-radius: 50%; background: var(--st); color: #fff; display: flex; align-items: center; justify-content: center;
  font-family: var(--f-display); font-weight: 900; font-size: 12.5cqw; z-index: 2; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.3); }
.card .glyph { display: none; }
.card .art { position: absolute; left: 4%; right: 4%; top: 3.5%; height: 41%; border-radius: 4px; background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 1; }
.card .nm { position: absolute; left: 4%; right: 4%; top: 44.5%; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: 16cqw; letter-spacing: .02em; z-index: 2; line-height: 1.12; white-space: nowrap; }
.card .tp { position: absolute; right: 7%; top: 35.5%; text-align: right; font-size: 8.5cqw; color: #5d5245; z-index: 2; letter-spacing: .06em; background: rgba(246,240,226,.88); padding: 0 1.8cqw; border-radius: 1.5cqw; line-height: 1.35; }
.card .ds { position: absolute; left: 7%; right: 6%; top: 58%; bottom: 3.5%; font-size: 12.2cqw; line-height: 1.26; color: #3b352b; z-index: 2; display: block; text-align: center; overflow: hidden; }
.card .ds b { color: var(--zhu-deep); font-family: var(--f-display); }

.party { display: flex; gap: 8px; padding: 5px 8px 2px; position: relative; z-index: 3; }

/* ===== 核心：亂數、工具、牌、存檔資料 ===== */
const R = {
  next(st) { // mulberry32，state 存在 st.s
    let t = (st.s = (st.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  int(st, a, b) { return a + Math.floor(R.next(st) * (b - a + 1)); },
  pick(st, arr) { return arr[Math.floor(R.next(st) * arr.length)]; },
  chance(st, p) { return R.next(st) < p; },
  shuffle(st, arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(R.next(st) * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
  weighted(st, w) { const keys = Object.keys(w); const tot = keys.reduce((s, k) => s + w[k], 0); let r = R.next(st) * tot; for (const k of keys) { r -= w[k]; if (r < 0) return k; } return keys[keys.length - 1]; },
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const deepCopy = (o) => JSON.parse(JSON.stringify(o));
const CN_NUM = ['〇','一','二','三','四','五','六','七','八','九','十'];
function cnNum(n) {
  if (n <= 10) return CN_NUM[n];
  if (n < 20) return '十' + (n % 10 ? CN_NUM[n % 10] : '');
  const t = Math.floor(n / 10), o = n % 10;
  return CN_NUM[t] + '十' + (o ? CN_NUM[o] : '');
}
function dayLabel(day) { // day 1 = 臘月初一
  if (day <= 30) return '臘月' + (day <= 10 ? '初' + cnNum(day) : cnNum(day));
  const d = day - 30;
  return '正月' + (d <= 10 ? '初' + cnNum(d) : cnNum(d));
}

/* 牌的定義（含精修） */
function cardDef(ci) {
  const base = CARDS[ci.id];
  if (!base) return null;
  if (!ci.up || !base.u) return base;
  const u = base.u;
  return Object.assign({}, base, {c: u.c !== undefined ? u.c : base.c, d: u.d || base.d, ops: u.ops || base.ops, x: u.x || base.x, _up: 1});
}
function cardName(ci) { const d = CARDS[ci.id]; return d ? d.n + (ci.up ? '＋' : '') : '?'; }
function canUpgrade(ci) { const d = CARDS[ci.id]; return !!(d && !ci.up && d.u); }

/* ===== 茶樓（永久）資料 ===== */
function newMeta() {
  return {
    v: 1, money: 0, upgrades: {}, clues: [], deductions: [], newDeductions: [], endings: {},
    comps: [], classes: ['dao'], seenCards: [], routesRun: {}, runs: 0, deaths: 0, wins: 0,
    tutorial: 0, introSeen: 0, prologueSeen: 0, heatMax: 0, heat: 0, lastSummary: null,
    settings: {music: 1, sfx: 1, fast: 0},
  };
}
function metaUp(meta, id) { return meta.upgrades[id] || 0; }
function knows(meta, d) { return meta.deductions.indexOf(d) >= 0; }
function hasClueMeta(meta, c) { return meta.clues.indexOf(c) >= 0; }

/* 推論成形：回傳新形成的推論 id 陣列 */
function formDeductions(meta) {
  const formed = [];
  for (const id of Object.keys(DEDUCTIONS)) {
    if (knows(meta, id)) continue;
    const ok = DEDUCTIONS[id].need.some(pair => pair.every(c => hasClueMeta(meta, c)));
    if (ok) { meta.deductions.push(id); meta.newDeductions.push(id); formed.push(id); }
  }
  return formed;
}
