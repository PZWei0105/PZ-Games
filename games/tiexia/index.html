/* ===== 一趟鏢：開局、地圖、獎勵、市集、條件與效果 ===== */
const Run = {};

Run.create = function (meta, opt) {
  const seed = (opt.seed != null ? opt.seed : Math.floor(Math.random() * 2 ** 31)) >>> 0;
  const cls = CLASSES[opt.cls];
  const run = {
    v: 1, seed, rng: {s: seed}, cls: opt.cls, route: opt.route, comp: opt.comp, compState: 'with', guest: null,
    act: 1, day: 1, heat: opt.heat || 0,
    hp: 0, maxHp: 0, compHp: 0, compMaxHp: 0, gold: 99,
    deck: [], relics: ['qi_flag'], potions: [null, null, null],
    aff: 3 + (metaUp(meta, 'laoke') ? 1 : 0), clues: [], flags: {}, talks: {}, eventsSeen: [],
    seals: 3 + metaUp(meta, 'feng'), sealed: [], removeCost: 60,
    map: null, screen: null, combat: null, uid: 1,
    stats: {fights: 0, elites: 0, bosses: 0, breaks: 0, combos: 0, hejis: 0, maxHit: 0, newClues: 0},
    reveal: {},
  };
  run.maxHp = cls.hp + 6 * metaUp(meta, 'fan');
  run.hp = run.maxHp;
  run.gold = 99 + 30 * metaUp(meta, 'yin') - (run.heat >= 4 ? 20 : 0);
  cls.start.forEach(id => Run.addCard(run, id));
  if (run.heat >= 3) Run.addCard(run, 'cu_jiushang');
  if (metaUp(meta, 'yao')) run.potions[0] = R.pick(run.rng, POTION_IDS);
  if (metaUp(meta, 'chuanjia')) Run.gainRelic(run, R.pick(run.rng, RELIC_POOL.C));
  return run;
};

Run.addCard = function (run, id, up) { const c = {uid: run.uid++, id, up: up ? 1 : 0}; run.deck.push(c); return c; };
Run.removeCard = function (run, uid) { const i = run.deck.findIndex(c => c.uid === uid); if (i >= 0) run.deck.splice(i, 1); };
Run.hasRelic = (run, id) => run.relics.indexOf(id) >= 0;
Run.gainRelic = function (run, id) {
  if (!id || Run.hasRelic(run, id)) return false;
  run.relics.push(id);
  const r = RELICS[id];
  if (r && r.onGain) r.onGain.forEach(([k, v]) => { if (k === 'maxHp') { run.maxHp += v; run.hp += v; } });
  return true;
};
Run.gainPotion = function (run, id) { const i = run.potions.indexOf(null); if (i < 0) return false; run.potions[i] = id; return true; };

/* 目前在隊上的同伴 key（含客串） */
Run.activeComp = function (run) {
  if (run.compState === 'with' && run.comp) return run.comp;
  if (run.guest) return run.guest;
  return null;
};
Run.joinComp = function (run, key) {
  const c = COMPANIONS[key];
  run.compMaxHp = c.hp; run.compHp = c.hp;
  c.start.forEach(id => Run.addCard(run, id));
};
Run.compLeave = function (run, state) {
  const key = run.comp;
  run.compState = state;
  run.deck = run.deck.filter(c => CARDS[c.id].o !== key);
};
Run.guestJoin = function (run, key) {
  run.guest = key;
  Run.joinComp(run, key);
};
Run.guestLeave = function (run) {
  const key = run.guest; if (!key) return;
  run.guest = null;
  run.deck = run.deck.filter(c => CARDS[c.id].o !== key);
};

/* ===== 線索 ===== */
Run.gainClue = function (run, meta, id) {
  if (run.clues.indexOf(id) < 0) run.clues.push(id);
  if (meta.clues.indexOf(id) < 0) { meta.clues.push(id); run.stats.newClues++; return 'new'; }
  return 'old';
};

/* ===== 地圖 ===== */
Run.ACT_ROWS = {
  1: [['story'], 2, 2, ['story'], 2, 2, 2, ['boss']],
  2: [['story'], 2, 2, ['story'], 2, 2, 2, ['boss']],
  3: [['story'], 2, 2, 2, ['finale']],
};
Run.ROW_TYPES = {
  1: {1: {fight: 5, event: 3}, 2: {fight: 4, event: 3, shop: 2, elite: 1}, 4: {fight: 4, event: 3, elite: 3}, 5: {fight: 3, event: 3, shop: 2, inn: 2}, 6: {fight: 3, event: 2, elite: 2, inn: 3}},
  2: {1: {fight: 5, event: 3}, 2: {fight: 4, event: 3, shop: 2, elite: 2}, 4: {fight: 4, event: 3, elite: 3}, 5: {fight: 3, event: 3, shop: 2, inn: 2}, 6: {fight: 3, event: 2, elite: 2, inn: 3}},
  3: {1: {fight: 4, event: 3, shop: 2}, 2: {elite: 3, fight: 4, event: 3}, 3: {inn: 4, fight: 3, shop: 2}},
};
Run.genMap = function (run, act) {
  const rng = run.rng, rowsDef = Run.ACT_ROWS[act], rows = [];
  rowsDef.forEach((def, r) => {
    let nodes;
    if (Array.isArray(def)) nodes = [{type: def[0]}];
    else {
      const cnt = R.chance(rng, 0.6) ? 3 : 2;
      const w = Run.ROW_TYPES[act][r];
      nodes = [];
      for (let i = 0; i < cnt; i++) {
        let t = R.weighted(rng, w);
        let guard = 0;
        while (guard++ < 6 && nodes.some(n => n.type === t) && t !== 'fight') t = R.weighted(rng, w);
        nodes.push({type: t});
      }
    }
    nodes.forEach((n, i) => {
      n.row = r; n.idx = i; n.next = []; n.visited = 0;
      const cnt = nodes.length;
      n.x = cnt === 1 ? 0.5 : 0.18 + (0.64 * i) / (cnt - 1) + (R.next(rng) - 0.5) * 0.08;
    });
    rows.push(nodes);
  });
  // 保證：每折至少一間市集；倒數一排至少一間客棧
  const flat = rows.flat();
  if (!flat.some(n => n.type === 'shop')) {
    const cand = flat.filter(n => n.type === 'fight' && n.row >= 2 && n.row <= rows.length - 3);
    if (cand.length) R.pick(rng, cand).type = 'shop';
  }
  const pre = rows[rows.length - 2];
  if (!pre.some(n => n.type === 'inn')) R.pick(rng, pre).type = 'inn';
  // 連線
  for (let r = 0; r < rows.length - 1; r++) {
    const a = rows[r], b = rows[r + 1];
    a.forEach((n, i) => {
      const t = a.length === 1 ? null : Math.round((i * (b.length - 1)) / Math.max(1, a.length - 1));
      if (a.length === 1) b.forEach((_, j) => n.next.push(j));
      else if (b.length === 1) n.next.push(0);
      else {
        n.next.push(t);
        if (R.chance(rng, 0.45)) { const alt = clamp(t + (R.chance(rng, 0.5) ? 1 : -1), 0, b.length - 1); if (n.next.indexOf(alt) < 0) n.next.push(alt); }
      }
    });
    b.forEach((m, j) => {
      if (!a.some(n => n.next.indexOf(j) >= 0)) {
        let best = 0, bd = 9; a.forEach((n, i) => { const d = Math.abs(n.x - m.x); if (d < bd) { bd = d; best = i; } });
        a[best].next.push(j);
      }
    });
    a.forEach(n => n.next.sort((x, y) => x - y));
  }
  // 「？」在進入時才決定；有地圖透視就先決定
  flat.forEach(n => { if (n.type === 'event') n.q = 1; });
  run.map = {act, rows, cur: null};
  return run.map;
};
Run.resolveQ = function (run, node) {
  if (!node.q || node.real) return node.real || node.type;
  const r = R.next(run.rng);
  node.real = r < 0.74 ? 'event' : r < 0.9 ? 'fight' : 'shop';
  return node.real;
};
Run.revealMap = function (run) { run.map.rows.flat().forEach(n => { if (n.q) Run.resolveQ(run, n); }); run.map.revealed = 1; };
Run.availableNodes = function (run) {
  const m = run.map;
  if (!m.cur) return m.rows[0];
  const n = m.rows[m.cur.row][m.cur.idx];
  if (m.cur.row + 1 >= m.rows.length) return [];
  return n.next.map(j => m.rows[m.cur.row + 1][j]);
};

/* ===== 遭遇 ===== */
Run.pickEncounter = function (run, kind) {
  const act = run.act;
  const table = (act === 3 ? ENCOUNTERS.yan[3] : ENCOUNTERS[run.route][act]);
  if (kind === 'boss') return table.boss;
  let list = kind === 'elite' ? table.elite : table.normal;
  if (kind === 'normal' && table.easy && run.stats.fights < 2) list = table.easy;
  return deepCopy(R.pick(run.rng, list));
};

/* ===== 牌池與獎勵 ===== */
Run.weiPool = function (run, rarity) {
  return CARD_LIST.filter(c => (c.cls === run.cls || c.cls === 'gen') && c.r === rarity && run.sealed.indexOf(c.id) < 0).map(c => c.id);
};
Run.compPool = function (run, rarity) {
  const key = Run.activeComp(run);
  if (!key || COMPANIONS[key].guest) return [];
  return CARD_LIST.filter(c => c.cls === key && c.r === rarity && run.sealed.indexOf(c.id) < 0).map(c => c.id);
};
Run.rollRarity = function (run, kind) {
  const w = kind === 'boss' ? {R: 1} : kind === 'elite' ? {C: 45, U: 40, R: 15} : kind === 'shop' ? {C: 55, U: 35, R: 10} : {C: 63, U: 31, R: 6};
  return R.weighted(run.rng, w);
};
Run.rollCard = function (run, kind, exclude, forceSide) {
  for (let tries = 0; tries < 30; tries++) {
    const side = forceSide || (R.chance(run.rng, 0.32) ? 'comp' : 'wei');
    let rar = Run.rollRarity(run, kind);
    let pool = side === 'comp' ? Run.compPool(run, rar) : Run.weiPool(run, rar);
    if (!pool.length && rar === 'R') pool = side === 'comp' ? Run.compPool(run, 'U') : Run.weiPool(run, 'U');
    if (!pool.length) pool = Run.weiPool(run, rar);
    pool = pool.filter(id => exclude.indexOf(id) < 0);
    if (pool.length) return R.pick(run.rng, pool);
  }
  return null;
};
Run.cardChoices = function (run, kind, n) {
  n = n || (Run.hasRelic(run, 'xuanhu') ? 2 : 3);
  const out = [];
  for (let i = 0; i < n; i++) { const id = Run.rollCard(run, kind, out); if (id) out.push(id); }
  return out;
};
Run.combatRewards = function (run, kind) {
  const rng = run.rng;
  let gold = kind === 'boss' ? R.int(rng, 50, 65) : kind === 'elite' ? R.int(rng, 25, 35) : R.int(rng, 12, 20);
  if (Run.hasRelic(run, 'suanpan')) gold += 10;
  if (run.heat >= 4) gold = Math.floor(gold * 0.75);
  const rw = {gold, cards: Run.cardChoices(run, kind), potion: null, relic: null, relicChoices: null, kind, taken: {}};
  if (kind !== 'boss' && R.chance(rng, kind === 'elite' ? 0.55 : 0.38)) rw.potion = R.pick(rng, POTION_IDS);
  if (kind === 'elite') rw.relic = Run.rollRelic(run, null);
  if (kind === 'boss') rw.relicChoices = Run.rollBossRelics(run);
  return rw;
};
Run.rollRelic = function (run, tier) {
  const t = tier || R.weighted(run.rng, {C: 58, U: 34, R: 8});
  let pool = RELIC_POOL[t].filter(id => !Run.hasRelic(run, id));
  if (!pool.length) pool = [].concat(RELIC_POOL.C, RELIC_POOL.U, RELIC_POOL.R).filter(id => !Run.hasRelic(run, id));
  return pool.length ? R.pick(run.rng, pool) : null;
};
Run.rollBossRelics = function (run) {
  const pool = R.shuffle(run.rng, RELIC_POOL.B.filter(id => !Run.hasRelic(run, id)));
  const out = pool.slice(0, 1);
  const r2 = Run.rollRelic(run, 'R'); if (r2 && out.indexOf(r2) < 0) out.push(r2);
  return out;
};

/* ===== 市集 ===== */
Run.priceMul = function (run) { return (Run.hasRelic(run, 'zhangben') ? 0.8 : 1) * (Run.hasRelic(run, 'shumiling') ? 0.9 : 1); };
Run.genShop = function (run) {
  const rng = run.rng, mul = Run.priceMul(run);
  const cards = [], ex = [];
  for (let i = 0; i < 5; i++) {
    const id = Run.rollCard(run, 'shop', ex, i < 3 ? 'wei' : 'comp');
    if (!id) continue; ex.push(id);
    const r = CARDS[id].r;
    let p = r === 'R' ? R.int(rng, 135, 155) : r === 'U' ? R.int(rng, 64, 76) : R.int(rng, 40, 50);
    cards.push({id, price: Math.round(p * mul), sold: 0});
  }
  if (cards.length) { const s = R.pick(rng, cards); s.price = Math.round(s.price / 2); s.sale = 1; }
  const pots = R.shuffle(rng, POTION_IDS.slice()).slice(0, 3).map(id => ({id, price: Math.round(R.int(rng, 24, 36) * mul), sold: 0}));
  const rel = [];
  for (let i = 0; i < 2; i++) { const id = Run.rollRelic(run, i === 0 ? 'C' : R.chance(rng, 0.7) ? 'U' : 'R'); if (id && rel.every(x => x.id !== id)) { const t = RELICS[id].r; rel.push({id, price: Math.round((t === 'R' ? 230 : t === 'U' ? 175 : 140) * mul), sold: 0}); } }
  return {cards, pots, rel, removeUsed: 0};
};

/* ===== 條件 ===== */
Run.cond = function (run, meta, expr) {
  if (!expr) return true;
  const toks = expr.split(/([&|()])/).map(s => s.trim()).filter(Boolean);
  let i = 0;
  const parseExpr = () => { let v = parseTerm(); while (toks[i] === '|') { i++; const r = parseTerm(); v = v || r; } return v; };
  const parseTerm = () => { let v = parseFactor(); while (toks[i] === '&') { i++; const r = parseFactor(); v = v && r; } return v; };
  const parseFactor = () => {
    const t = toks[i];
    if (t === '(') { i++; const v = parseExpr(); i++; return v; }
    i++;
    let neg = 0, a = t; while (a[0] === '!') { neg ^= 1; a = a.slice(1); }
    if (a === '') { const v = parseFactor(); return neg ? !v : v; }
    const v = Run.atom(run, meta, a);
    return neg ? !v : v;
  };
  return !!parseExpr();
};
Run.atom = function (run, meta, a) {
  const comp = Run.activeComp(run);
  let m;
  if ((m = a.match(/^comp!=(\w+)$/))) return comp !== m[1];
  if ((m = a.match(/^comp=(\w+)$/))) return comp === m[1];
  if ((m = a.match(/^know=(\w+)$/))) return knows(meta, m[1]);
  if ((m = a.match(/^clue=(\w+)$/))) return hasClueMeta(meta, m[1]) || run.clues.indexOf(m[1]) >= 0;
  if ((m = a.match(/^flag=(\w+)$/))) return !!run.flags[m[1]];
  if ((m = a.match(/^relic=(\w+)$/))) return Run.hasRelic(run, m[1]);
  if ((m = a.match(/^route=(\w+)$/))) return run.route === m[1];
  if ((m = a.match(/^aff>=(\d+)$/))) return run.aff >= +m[1];
  if ((m = a.match(/^aff<=(\d+)$/))) return run.aff <= +m[1];
  if ((m = a.match(/^gold>=(\d+)$/))) return run.gold >= +m[1];
  if (a === 'potion') return run.potions.some(Boolean);
  if (a === 'first') return meta.runs === 0;
  if (a === 'yeBetray') return comp === 'ye' && run.compState === 'with' && run.aff <= 2 && !run.flags.yeTore && !run.flags.yanExposed;
  if (a === 'xianSees') return comp === 'xian' && run.compState === 'with' && run.aff >= 6;
  if ((m = a.match(/^act=(\d)$/))) return run.act === +m[1];
  console.warn('未知條件', a);
  return false;
};

/* 好感等級 */
Run.affLevel = function (aff) {
  if (aff >= 7) return {n: '生死之交', lv: 3};
  if (aff >= 5) return {n: '相熟', lv: 2};
  if (aff >= 3) return {n: '同路', lv: 1};
  return {n: '生疏', lv: 0};
};

/* ===== 簡單效果（不需要介面） ===== 回傳要給玩家看的提示字串，或 null */
Run.applyEffect = function (run, meta, e) {
  const [k, a, b] = e;
  const comp = Run.activeComp(run);
  switch (k) {
    case 'gold': run.gold = Math.max(0, run.gold + a); return (a >= 0 ? '銀 +' : '銀 ') + a;
    case 'hp': run.hp = clamp(run.hp + a, 1, run.maxHp); return a >= 0 ? '魏子葳回復 ' + a : '魏子葳失去 ' + (-a) + ' 氣血';
    case 'healAll': run.hp = clamp(run.hp + a, 1, run.maxHp); if (comp) run.compHp = clamp(run.compHp + a, 1, run.compMaxHp); return '全隊回復 ' + a + ' 氣血';
    case 'maxHp': run.maxHp += a; run.hp += a; return '氣血上限 +' + a;
    case 'healPct': { run.hp = clamp(run.hp + Math.round(run.maxHp * a / 100), 1, run.maxHp); if (comp) run.compHp = clamp(run.compHp + Math.round(run.compMaxHp * a / 100), 1, run.compMaxHp); return '喘了口氣：全隊回復 ' + a + '% 氣血'; }
    case 'day': run.day += a; return '天數 +' + a;
    case 'aff': {
      if (!comp || COMPANIONS[comp].guest || run.compState !== 'with') return null;
      run.aff = clamp(run.aff + a, 0, 10); return COMPANIONS[comp].n + ' 好感 ' + (a >= 0 ? '+' : '') + a;
    }
    case 'affIf': {
      if (comp !== a || run.compState !== 'with') return null;
      run.aff = clamp(run.aff + b, 0, 10); return COMPANIONS[a].n + ' 好感 ' + (b >= 0 ? '+' : '') + b;
    }
    case 'flag': run.flags[a] = 1; return null;
    case 'clue': { const r = Run.gainClue(run, meta, a); return (r === 'new' ? '新線索：' : '線索：') + '【' + CLUES[a].n + '】'; }
    case 'relic': return Run.gainRelic(run, a) ? '得到信物【' + RELICS[a].n + '】' : null;
    case 'relicRand': { const id = Run.rollRelic(run, a); return id && Run.gainRelic(run, id) ? '得到信物【' + RELICS[id].n + '】' : null; }
    case 'potion': return Run.gainPotion(run, a) ? '得到丹藥【' + POTIONS[a].n + '】' : '丹藥袋滿了';
    case 'potionRand': { const id = R.pick(run.rng, POTION_IDS); return Run.gainPotion(run, id) ? '得到丹藥【' + POTIONS[id].n + '】' : '丹藥袋滿了'; }
    case 'losePotion': { const i = run.potions.findIndex(Boolean); if (i >= 0) { const n = POTIONS[run.potions[i]].n; run.potions[i] = null; return '失去丹藥【' + n + '】'; } return null; }
    case 'card': { const c = Run.addCard(run, a); return '得到牌【' + cardName(c) + '】'; }
    case 'cardRand': { const id = Run.rollCard(run, 'boss', [], 'wei') || Run.rollCard(run, 'elite', []); if (!id) return null; const c = Run.addCard(run, id); return '得到牌【' + cardName(c) + '】'; }
    case 'curse': { const c = Run.addCard(run, a); return '牌組多了【' + cardName(c) + '】'; }
    case 'upgradeRand': {
      const cand = run.deck.filter(c => canUpgrade(c) && (!b || CARDS[c.id].st === b));
      R.shuffle(run.rng, cand); const got = cand.slice(0, a); got.forEach(c => { c.up = 1; });
      return got.length ? '精修：' + got.map(cardName).join('、') : null;
    }
    case 'transformRand': {
      const cand = run.deck.filter(c => CARDS[c.id].o === 'wei' && CARDS[c.id].cls !== 'curse');
      if (!cand.length) return null;
      const c = R.pick(run.rng, cand); const old = cardName(c);
      const nid = Run.rollCard(run, 'normal', [c.id], 'wei'); if (!nid) return null;
      c.id = nid; c.up = 0; return old + ' 變成了 ' + cardName(c);
    }
    case 'cureOrHeal': {
      const i = run.deck.findIndex(c => CARDS[c.id].cls === 'curse');
      if (i >= 0) { const n = cardName(run.deck[i]); run.deck.splice(i, 1); return '刪去【' + n + '】'; }
      run.hp = clamp(run.hp + a, 1, run.maxHp); return '魏子葳回復 ' + a;
    }
    case 'gamble': { if (R.chance(run.rng, 0.5)) { run.gold += a; return '贏了！銀 +' + a; } run.gold = Math.max(0, run.gold - a); return '輸了。銀 -' + a; }
    case 'gambleFlag': {
      if (R.chance(run.rng, 0.5)) { const id = Run.rollRelic(run, 'C'); if (id) { Run.gainRelic(run, id); return '贏了！得到【' + RELICS[id].n + '】'; } return '贏了，可惜莊家什麼也拿不出來'; }
      if (comp && run.compState === 'with') { run.aff = clamp(run.aff - 2, 0, 10); return '輸了。旗差點沒贖回來。' + COMPANIONS[comp].n + ' 好感 -2'; }
      return '輸了。旗差點沒贖回來。';
    }
    case 'reveal': Run.revealMap(run); return '本折地圖全部現形';
    case 'compLeave': Run.compLeave(run, a); return null;
    case 'meet': if (meta.comps.indexOf(a) < 0) { meta.comps.push(a); return '人物誌多了一頁：' + COMPANIONS[a].n; } return null;
  }
  return undefined; // 交給介面處理
};

/* ===== 一趟結束：結算賞錢 ===== */
Run.finish = function (run, meta, result) {
  const s = run.stats;
  let money = s.fights + s.elites * 2 + s.bosses * 5 + (run.act - 1) * 4 + s.newClues * 2;
  let newEnding = false;
  if (result.type === 'ending') {
    money += 8;
    if (!meta.endings[result.ending]) { newEnding = true; money += 15; }
    meta.endings[result.ending] = (meta.endings[result.ending] || 0) + 1;
    meta.wins++;
    if (run.heat >= meta.heatMax && meta.heatMax < 5) meta.heatMax = run.heat + 1;
  } else meta.deaths++;
  money = Math.round(money * (1 + 0.25 * run.heat));
  meta.money += money;
  meta.runs++;
  meta.routesRun[run.route] = (meta.routesRun[run.route] || 0) + 1;
  const formed = formDeductions(meta);
  meta.lastSummary = {type: result.type, ending: result.ending || null, act: run.act, money, newEnding, formed, route: run.route, comp: run.comp, cls: run.cls, day: run.day, stats: deepCopy(s), clues: run.clues.slice()};
  return meta.lastSummary;
};

/* ---- src/engine/combat.js ---- */
/* ===== 戰鬥引擎 =====
 * 所有動畫都透過 fx(type, data) 回呼（回傳 Promise）；測試時傳入空函式即可。
 */
const Combat = {};
const NOFX = async () => {};

function mkHero(key, name, g, hp, maxHp) {
  return {key, name, g, hp, maxHp, block: 0, st: {str: 0, weak: 0, vuln: 0, bleed: 0, thorns: 0, thornsPerm: 0, guard: 0}, down: false, saved: false};
}

Combat.create = function (run, meta, enc) {
  const cs = {
    t: 0, phase: 'start', energy: 3, maxEnergy: 3, qi: 0, qiMax: 6,
    heroes: {wei: mkHero('wei', '魏子葳', '葳', run.hp, run.maxHp), comp: null},
    puppet: null, enemies: [], draw: [], hand: [], discard: [], exhaust: [],
    powers: {}, tf: null, stats: {breaks: 0, combos: 0, hejis: 0, maxHit: 0},
    cf: {firstBreak: 0, firstHit: 0, weiSaved: 0}, nextTurn: {draw: 0, energy: 0},
    kind: enc.kind || 'normal', assist: enc.assist ? Object.assign({done: 0}, enc.assist) : null,
    lastTarget: null, uidc: 1, log: [], comboSet: null, enrageSaid: {},
  };
  const ck = Run.activeComp(run);
  if (ck) {
    const c = COMPANIONS[ck];
    cs.heroes.comp = mkHero(ck, c.n, c.g, Math.max(1, run.compHp), run.compMaxHp);
    if (ck === 'xian') cs.puppet = {armor: 10 + (Run.hasRelic(run, 'hongxian') ? 8 : 0), pow: 3 + (Run.hasRelic(run, 'hongxian') ? 1 : 0)};
  }
  ['xuanhu', 'xueshu', 'wuzhui'].forEach(r => { if (Run.hasRelic(run, r)) cs.maxEnergy++; });
  cs.energy = cs.maxEnergy;
  cs.qiMax = 6; cs.qiCost = Run.hasRelic(run, 'longlin') ? 5 : 6;
  // 牌組
  const deck = run.deck.map(c => ({uid: c.uid, id: c.id, up: c.up}));
  R.shuffle(run.rng, deck);
  const innate = deck.filter(c => (cardDef(c).x || {}).innate);
  cs.draw = deck.filter(c => !(cardDef(c).x || {}).innate).concat(innate); // 抽牌從尾端拿
  // 敵人
  enc.grp.forEach(id => cs.enemies.push(Combat.mkEnemy(run, cs, id)));
  // 可用套路
  cs.comboSet = COMBOS.filter(k => k.cls === run.cls || k.cls === ck).map(k => k.id);
  return cs;
};

Combat.mkEnemy = function (run, cs, id) {
  const d = ENEMIES[id];
  const boss = d.tier === 'b';
  const sc = boss ? BOSS_SCALE[run.act] : ACT_SCALE[run.act];
  const hpMul = d.tier === 'e' ? 1 + (sc.hp - 1) * 0.72 : sc.hp;
  let hp = R.int(run.rng, d.hp[0], d.hp[1]) * hpMul;
  let atk = sc.atk;
  if (run.heat >= 1) hp *= 1.1;
  if (run.heat >= 5 && boss) { hp *= 1.15; atk *= 1.1; }
  hp = Math.round(hp);
  return {uid: 'e' + (cs.uidc++), id, n: d.n, g: d.g, tier: d.tier, hp, maxHp: hp, block: 0, pipAdd: boss ? 0 : (sc.pip || 0),
    st: {str: 0, weak: 0, vuln: 0, bleed: 0, stun: 0}, atkMul: atk, intent: null, bombs: [],
    ai: {idx: 0, last: null, used: {}, turns: 0}, dead: false, pass: d.pass || {}, enraged: 0, phase2: 0, fresh: 0};
};

/* ===== 查詢 ===== */
Combat.live = cs => cs.enemies.filter(e => !e.dead);
Combat.heroList = cs => [cs.heroes.wei, cs.heroes.comp].filter(h => h && !h.down);
Combat.heroByKey = (cs, key) => key === 'wei' ? cs.heroes.wei : cs.heroes.comp && cs.heroes.comp.key === key ? cs.heroes.comp : null;
Combat.owner = (cs, cd) => cd.o === 'wei' ? cs.heroes.wei : (cs.heroes.comp && cs.heroes.comp.key === cd.o ? cs.heroes.comp : null);
Combat.compAlive = cs => !!(cs.heroes.comp && !cs.heroes.comp.down);

Combat.canPlay = function (run, cs, ci) {
  const cd = cardDef(ci);
  if (cs.phase !== 'player') return {ok: 0, why: '不是你的回合'};
  if ((cd.x || {}).unplayable) return {ok: 0, why: '這張牌無法打出'};
  const ow = Combat.owner(cs, cd);
  if (!ow || ow.down) return {ok: 0, why: (ow ? ow.name : '持有者') + '已經倒下'};
  if (cd.c > cs.energy) return {ok: 0, why: '內力不足'};
  return {ok: 1};
};
Combat.needsTarget = function (cs, ci) {
  const cd = cardDef(ci);
  return cd.tg === 'e' && Combat.live(cs).length > 1;
};

/* 敵人招式的傷害（每段） */
Combat.enemyHit = function (cs, e, base, targetHero) {
  let d = Math.round(base * e.atkMul) + e.st.str;
  if (e.st.weak > 0) d = Math.floor(d * 0.75);
  if (targetHero && targetHero.st.vuln > 0) d = Math.floor(d * 1.5);
  return Math.max(0, d);
};
Combat.intentTargetHero = function (cs, e) {
  const it = e.intent; if (!it) return null;
  let tk = it.target;
  if (tk === 'comp' && (!Combat.compAlive(cs) || cs.heroes.wei.st.guard)) tk = 'wei';
  if (tk === 'comp') return cs.heroes.comp;
  if (tk === 'wei') return cs.heroes.wei;
  return null;
};
/* 給介面看的意圖摘要 */
Combat.intentInfo = function (cs, e) {
  const it = e.intent; if (!it) return null;
  const mv = ENEMIES[e.id].moves[it.mv];
  const out = {n: mv.n, st: it.st, p: it.p, maxP: it.maxP, broken: it.broken, unbreak: it.p == null, charge: it.chargeLeft, target: it.target, parts: []};
  const th = Combat.intentTargetHero(cs, e);
  let tgt = it.target;
  if (tgt === 'comp' && th && th.key === 'wei') tgt = 'wei';
  out.target = tgt;
  mv.ops.forEach(op => {
    const k = op[0];
    if (k === 'atk') {
      const hit = Combat.enemyHit(cs, e, op[1], it.target === 'all' ? null : th);
      out.parts.push({k: 'atk', v: hit, hits: op[2] || 1});
    } else if (k === 'block' || k === 'blockAllies' || k === 'blockOther') out.parts.push({k: 'def', v: op[1]});
    else if (k === 'str' || k === 'strAll' || k === 'strOther') out.parts.push({k: 'buff', v: op[1], t: '力+' + op[1]});
    else if (k === 'weak') out.parts.push({k: 'debuff', t: '虛弱' + op[1]});
    else if (k === 'vuln') out.parts.push({k: 'debuff', t: '破綻' + op[1]});
    else if (k === 'bleed') out.parts.push({k: 'debuff', t: '流血' + op[1]});
    else if (k === 'heal') out.parts.push({k: 'buff', t: '回復' + op[1]});
    else if (k === 'summon') out.parts.push({k: 'summon', t: '召喚'});
    else if (k === 'steal') out.parts.push({k: 'debuff', t: '搶銀' + op[1]});
    else if (k === 'drainQi') out.parts.push({k: 'debuff', t: '散氣'});
  });
  out.total = out.parts.filter(p => p.k === 'atk').reduce((s, p) => s + p.v * p.hits, 0);
  return out;
};

/* ===== 意圖 ===== */
Combat.chooseIntent = function (run, cs, e) {
  const d = ENEMIES[e.id];
  let ai = d.ai;
  if (e.phase2 && d.pass.phase2) ai = {type: 'cycle', seq: d.pass.phase2.seq};
  let mv;
  const liveCnt = Combat.live(cs).length;
  const okMove = k => {
    const m = d.moves[k];
    if (m.ops.some(o => o[0] === 'summon') && liveCnt >= 4) return false;
    if (ai.once && ai.once.indexOf(k) >= 0 && e.ai.used[k]) return false;
    if (m.ops.some(o => o[0] === 'strOther') && Combat.live(cs).length < 2) return false;
    return true;
  };
  if (ai.type === 'cycle') {
    for (let g = 0; g < ai.seq.length; g++) { const k = ai.seq[e.ai.idx % ai.seq.length]; e.ai.idx++; if (okMove(k)) { mv = k; break; } }
  } else {
    if (ai.first && e.ai.turns === 0 && okMove(ai.first)) mv = ai.first;
    else {
      const w = {}; Object.keys(ai.w).forEach(k => { if (k !== e.ai.last && okMove(k)) w[k] = ai.w[k]; });
      if (!Object.keys(w).length) Object.keys(ai.w).forEach(k => { if (okMove(k)) w[k] = ai.w[k]; });
      mv = R.weighted(run.rng, w);
    }
  }
  if (!mv) mv = Object.keys(d.moves)[0];
  e.ai.last = mv; e.ai.used[mv] = 1; e.ai.turns++;
  const m = d.moves[mv];
  let p = m.p;
  if (p != null && run.heat >= 2 && e.tier === 'e') p += 1;
  if (p != null && e.pipAdd) p += e.pipAdd;
  let target = m.tg;
  if (m.tg === 'hero') target = Combat.compAlive(cs) && R.chance(run.rng, 0.4) ? 'comp' : 'wei';
  else if (m.tg === 'comp') target = Combat.compAlive(cs) ? 'comp' : 'wei';
  else if (m.tg === 'low') { const hs = Combat.heroList(cs); hs.sort((a, b) => a.hp - b.hp); target = hs[0].key === 'wei' ? 'wei' : 'comp'; }
  e.intent = {mv, st: m.st, p, maxP: p, tg: m.tg, target, charge: m.charge || 0, chargeLeft: m.charge || 0, broken: 0};
};

/* ===== 傷害 ===== */
Combat.calcPlayerDmg = function (cs, hero, e, base, opt) {
  let d = base + (hero ? hero.st.str : 0) + ((opt && opt.bonus) || 0);
  if (hero && hero.st.weak > 0) d = Math.floor(d * 0.75);
  if (e && e.st.vuln > 0) d = Math.floor(d * 1.5);
  return Math.max(0, d);
};
Combat.damageEnemy = async function (run, cs, e, amt, fx, opt) {
  if (!e || e.dead) return 0;
  opt = opt || {};
  if (Run.hasRelic(run, 'langya') && ['helian_chi', 'helian_qi', 'xue'].indexOf(e.id) >= 0) amt = Math.floor(amt * 1.25);
  let blocked = 0;
  if (!opt.pierce) { blocked = Math.min(e.block, amt); e.block -= blocked; }
  const loss = amt - blocked;
  e.hp -= loss;
  if (amt > cs.stats.maxHit) cs.stats.maxHit = amt;
  await fx('hitEnemy', {uid: e.uid, amt, blocked, loss, src: opt.src || 'card'});
  if (e.hp <= 0) await Combat.killEnemy(run, cs, e, fx);
  else await Combat.checkEnrage(run, cs, e, fx);
  return loss;
};
Combat.checkEnrage = async function (run, cs, e, fx) {
  const ps = e.pass;
  if (ps.enrage && !e.enraged && e.hp <= e.maxHp * ps.enrage.at) {
    e.enraged = 1;
    if (ps.enrage.say) await fx('say', {text: ps.enrage.say, uid: e.uid});
    for (const op of ps.enrage.ops) {
      if (op[0] === 'str') { e.st.str += op[1]; await fx('status', {uid: e.uid, s: 'str'}); }
      if (op[0] === 'summon') await Combat.summon(run, cs, op[1], op[2] || 1, fx);
    }
  }
  if (ps.phase2 && !e.phase2 && e.hp <= e.maxHp * ps.phase2.at) {
    e.phase2 = 1; e.ai.idx = 0;
    if (ps.phase2.say) await fx('say', {text: ps.phase2.say, uid: e.uid});
  }
};
Combat.killEnemy = async function (run, cs, e, fx) {
  if (e.dead) return;
  e.hp = 0; e.dead = true; e.intent = null; e.bombs = [];
  await fx('kill', {uid: e.uid});
  if (Run.hasRelic(run, 'xueyu')) await Combat.healHero(cs, cs.heroes.wei, 3, fx);
  if (cs.powers.jieshi && cs.puppet) { cs.puppet.pow += 2; cs.puppet.armor += 5; await fx('puppet', {act: 'buff'}); }
  // 連線：牽機死，沈拓倒
  for (const o of cs.enemies) {
    if (!o.dead && ENEMIES[e.id].pass && ENEMIES[e.id].pass.linked === o.id) {
      await fx('say', {text: '線斷了。沈拓的身子晃了晃，直挺挺地倒下。', uid: o.uid});
      await Combat.killEnemy(run, cs, o, fx);
    }
  }
  if (e.id === 'shen') {
    const q = cs.enemies.find(o => o.id === 'qianji' && !o.dead);
    if (q) { q.st.str += 4; await fx('say', {text: '牽機老人的手指抽了一下：「我的作品……」', uid: q.uid}); await fx('status', {uid: q.uid, s: 'str'}); }
  }
};
Combat.damageHero = async function (run, cs, h, amt, fx, opt) {
  if (!h || h.down) return 0;
  opt = opt || {};
  // 弦的阿木先擋
  if (h.key === 'xian' && cs.puppet && cs.puppet.armor > 0 && !opt.pierce) {
    const a = Math.min(cs.puppet.armor, amt); cs.puppet.armor -= a; amt -= a;
    await fx('puppet', {act: 'hit', amt: a});
    if (amt <= 0) return 0;
  }
  if (!opt.pierce && h.key === 'wei' && !cs.cf.firstHit && Run.hasRelic(run, 'huxinjing')) { cs.cf.firstHit = 1; amt = Math.floor(amt / 2); }
  let blocked = 0;
  if (!opt.pierce) { blocked = Math.min(h.block, amt); h.block -= blocked; }
  const loss = amt - blocked;
  h.hp -= loss;
  await fx('hitHero', {key: h.key, amt, blocked, loss});
  if (h.hp <= 0) await Combat.heroFalls(run, cs, h, fx);
  return loss;
};
Combat.heroFalls = async function (run, cs, h, fx) {
  if (h.key === 'wei') {
    if (!cs.cf.weiSaved && Run.hasRelic(run, 'daoqiao')) { cs.cf.weiSaved = 1; h.hp = 1; h.block += 15; await fx('say', {text: '程萬里的刀鞘擋下了這一擊。'}); return; }
    h.hp = 0; h.down = true; cs.phase = 'lost'; await fx('heroDown', {key: 'wei'}); return;
  }
  if (h.key === 'zhong' && !h.saved) { h.saved = true; h.hp = 1; await fx('say', {text: '鍾九晃了晃，又站穩了：「老子當年……可沒這麼容易死。」'}); return; }
  h.hp = 0; h.down = true; h.block = 0;
  await fx('heroDown', {key: h.key});
};
Combat.healHero = async function (cs, h, amt, fx) {
  if (!h || h.down) return;
  const before = h.hp; h.hp = Math.min(h.maxHp, h.hp + amt);
  if (h.hp > before) await fx('heal', {key: h.key, amt: h.hp - before});
};
Combat.gainBlock = async function (cs, h, amt, fx) {
  if (!h || h.down || amt <= 0) return;
  h.block += amt; await fx('block', {key: h.key, amt});
};

/* ===== 破招 ===== */
Combat.reducePips = async function (run, cs, e, n, fx, ctx) {
  const it = e.intent;
  if (!it || it.broken || it.p == null || e.dead || n <= 0) return;
  it.p = Math.max(0, it.p - n);
  await fx('pip', {uid: e.uid, p: it.p});
  if (it.p === 0) await Combat.breakIntent(run, cs, e, fx, ctx);
};
Combat.breakIntent = async function (run, cs, e, fx, ctx) {
  const it = e.intent;
  if (!it || it.broken) return;
  const info = Combat.intentInfo(cs, e);
  it.broken = 1; it.p = 0;
  e.st.vuln = Math.max(e.st.vuln, 1);
  if (it.charge) e.st.stun = Math.max(e.st.stun, 1);
  let gain = 2;
  if (!cs.cf.firstBreak) { cs.cf.firstBreak = 1; if (Run.hasRelic(run, 'yandai')) gain++; }
  cs.qi = Math.min(cs.qiMax, cs.qi + gain);
  cs.stats.breaks++; cs.tf.broke = 1;
  await fx('break', {uid: e.uid, charged: !!it.charge});
  await fx('qi', {qi: cs.qi});
  if (ctx && ctx.stunOnBreak) { e.st.stun = Math.max(e.st.stun, 1); await fx('status', {uid: e.uid, s: 'stun'}); }
  if (ctx && ctx.xieli && it.st === '攻' && info.total > 0) {
    await fx('say', {text: '卸力！', short: 1, uid: e.uid});
    await Combat.damageEnemy(run, cs, e, info.total * ctx.xieli, fx, {src: 'xieli'});
  }
  if (cs.powers.daoyi) for (const o of Combat.live(cs)) await Combat.damageEnemy(run, cs, o, cs.powers.daoyi, fx, {src: 'power'});
  if (cs.powers.jingang) await Combat.gainBlock(cs, cs.heroes.wei, cs.powers.jingang, fx);
  if (Run.hasRelic(run, 'bagua')) await Combat.draw(run, cs, 1, fx);
};
Combat.stanceTargets = function (cs, cd, target) {
  if (!cd.st) return [];
  const beats = STANCE_BEATS[cd.st];
  const ok = e => e && !e.dead && e.intent && !e.intent.broken && e.intent.p != null && e.intent.st === beats;
  if (cd.tg === 'e') return target && ok(target) ? [target] : [];
  if (cd.tg === 'a') return Combat.live(cs).filter(ok);
  const c = Combat.live(cs).filter(ok);
  c.sort((a, b) => (a.intent.p - b.intent.p) || (Combat.intentInfo(cs, b).total - Combat.intentInfo(cs, a).total));
  return c.slice(0, 1);
};
Combat.chaiBest = function (cs) {
  const c = Combat.live(cs).filter(e => e.intent && !e.intent.broken && e.intent.p != null);
  c.sort((a, b) => a.intent.p - b.intent.p);
  return c[0] || null;
};

/* ===== 抽牌 ===== */
Combat.draw = async function (run, cs, n, fx) {
  const got = [];
  for (let i = 0; i < n; i++) {
    if (cs.hand.length >= 10) break;
    if (!cs.draw.length) {
      if (!cs.discard.length) break;
      cs.draw = R.shuffle(run.rng, cs.discard); cs.discard = [];
      await fx('shuffle', {});
    }
    const c = cs.draw.pop();
    cs.hand.push(c); got.push(c);
    if ((cardDef(c).x || {}).drawDrain) { cs.energy = Math.max(0, cs.energy - 1); }
  }
  if (got.length) await fx('draw', {cards: got});
  return got;
};

/* ===== 開戰 ===== */
Combat.start = async function (run, meta, cs, fx) {
  fx = fx || NOFX;
  cs.phase = 'start';
  for (const e of cs.enemies) Combat.chooseIntent(run, cs, e);
  await fx('sync', {});
  const W = cs.heroes.wei, C = cs.heroes.comp;
  if (Run.hasRelic(run, 'qi_flag')) { await Combat.gainBlock(cs, W, 4, fx); await Combat.gainBlock(cs, C, 4, fx); }
  if (Run.hasRelic(run, 'modaoshi')) W.st.str += 1;
  if (Run.hasRelic(run, 'xiangnang')) await Combat.gainBlock(cs, C, 7, fx);
  if (Run.hasRelic(run, 'jiuhu') && C && C.key === 'zhong') C.st.str += 1;
  const xs = metaUp(meta, 'xiansheng'); if (xs) cs.qi = Math.min(cs.qiMax, cs.qi + xs);
  cs.tf = {played: [], broke: 0, sancai: 0, combos: {}, heji: 0, atkCount: 0, nextAtk: 0, first: 1};
  if (Run.hasRelic(run, 'huozhe')) for (const e of Combat.live(cs)) await Combat.damageEnemy(run, cs, e, 4, fx, {src: 'relic'});
  let pipCut = 0;
  if (Run.hasRelic(run, 'hufu')) pipCut++;
  if (C && C.key === 'ye' && !C.down) pipCut++;
  if (pipCut) for (const e of Combat.live(cs)) await Combat.reducePips(run, cs, e, pipCut, fx, null);
  await Combat.beginPlayerTurn(run, meta, cs, fx);
};

Combat.beginPlayerTurn = async function (run, meta, cs, fx) {
  cs.t++;
  cs.phase = 'player';
  cs.tf = {played: [], broke: 0, sancai: 0, combos: {}, heji: 0, atkCount: cs.tf ? cs.tf.atkCount : 0, nextAtk: 0, first: 1};
  const W = cs.heroes.wei, C = cs.heroes.comp;
  // 流血（我方）
  for (const h of Combat.heroList(cs)) {
    if (h.st.bleed > 0) { const b = h.st.bleed; h.st.bleed--; await Combat.damageHero(run, cs, h, b, fx, {pierce: 1}); if (cs.phase === 'lost') return; }
  }
  for (const h of [W, C]) if (h) h.block = 0;
  if (Run.hasRelic(run, 'xueshu')) { W.hp = Math.max(1, W.hp - 1); await fx('hitHero', {key: 'wei', amt: 1, blocked: 0, loss: 1}); }
  cs.energy = cs.maxEnergy + cs.nextTurn.energy;
  let drawN = 5 + cs.nextTurn.draw;
  cs.nextTurn = {draw: 0, energy: 0};
  if (cs.t === 1 && Run.hasRelic(run, 'hutouxue')) drawN += 2;
  if (Run.hasRelic(run, 'yexing')) drawN += cs.t === 1 ? -1 : 1;
  if (cs.t === 3 && Run.hasRelic(run, 'gengxiang')) { cs.energy += 2; drawN += 2; }
  await fx('turn', {side: 'player', t: cs.t});
  // 心法
  if (cs.powers.flagwall) { await Combat.gainBlock(cs, W, cs.powers.flagwall, fx); await Combat.gainBlock(cs, C, cs.powers.flagwall, fx); }
  if (cs.powers.zhama) await Combat.gainBlock(cs, W, cs.powers.zhama, fx);
  if (cs.powers.laozu && C && C.key === 'zhong') await Combat.gainBlock(cs, C, cs.powers.laozu, fx);
  if (cs.powers.wusi) for (const e of Combat.live(cs)) await Combat.reducePips(run, cs, e, cs.powers.wusi, fx, null);
  if (cs.powers.guanyin) for (let i = 0; i < 3; i++) { const l = Combat.live(cs); if (!l.length) break; await Combat.damageEnemy(run, cs, R.pick(run.rng, l), cs.powers.guanyin, fx, {src: 'power'}); }
  if (C && C.key === 'bai' && !C.down) { const l = Combat.live(cs); if (l.length) { const e = R.pick(run.rng, l); e.st.bleed += 3; await fx('status', {uid: e.uid, s: 'bleed'}); } }
  // 援手
  if (cs.assist && !cs.assist.done && cs.t === cs.assist.turn) {
    cs.assist.done = 1;
    await fx('assist', {text: cs.assist.say});
    await Combat.runOps(run, meta, cs, cs.assist.ops, {owner: null, src: 'assist'}, fx);
  }
  if (Combat.checkEnd(cs)) return;
  await Combat.draw(run, cs, drawN, fx);
  await fx('sync', {});
};

/* ===== 出牌 ===== */
Combat.playCard = async function (run, meta, cs, uid, targetUid, fx) {
  fx = fx || NOFX;
  const idx = cs.hand.findIndex(c => c.uid === uid);
  if (idx < 0) return false;
  const ci = cs.hand[idx];
  const chk = Combat.canPlay(run, cs, ci);
  if (!chk.ok) return false;
  const cd = cardDef(ci);
  const owner = Combat.owner(cs, cd);
  let target = null;
  if (cd.tg === 'e') {
    target = cs.enemies.find(e => e.uid === targetUid && !e.dead) || Combat.live(cs)[0] || null;
    if (target) cs.lastTarget = target.uid;
  }
  cs.energy -= cd.c;
  cs.hand.splice(idx, 1);
  const isAtk = cd.t === '攻擊';
  const ctx = {owner, target, card: ci, def: cd, xieli: 0, stunOnBreak: 0, killed: 0, isAtk, nextAtkUsed: 0};
  const xo = cd.ops.find(o => o[0] === 'xieli'); if (xo) ctx.xieli = xo[1];
  await fx('play', {card: ci, target: target ? target.uid : null, owner: owner.key});
  // 架式相剋：單體牌只剋目標，全體牌剋所有人，其他牌剋「最快破招」的那一個
  for (const e of Combat.stanceTargets(cs, cd, target)) await Combat.reducePips(run, cs, e, 1, fx, ctx);
  if (cs.tf.first) {
    cs.tf.first = 0;
    if (Run.hasRelic(run, 'xingmu')) for (const e of Combat.live(cs)) await Combat.reducePips(run, cs, e, 1, fx, ctx);
  }
  if (Combat.checkEnd(cs)) { cs.discard.push(ci); return true; }
  // 效果
  await Combat.runOps(run, meta, cs, cd.ops, ctx, fx);
  // 心法觸發
  if (cd.st === '守' && cs.powers.buluo) { const l = Combat.live(cs); if (l.length) await Combat.damageEnemy(run, cs, R.pick(run.rng, l), cs.powers.buluo, fx, {src: 'power'}); }
  if (isAtk && cs.powers.jili && ctx.target && !ctx.target.dead) { ctx.target.st.bleed += cs.powers.jili; await fx('status', {uid: ctx.target.uid, s: 'bleed'}); }
  // 記錄
  cs.tf.played.push({id: ci.id, st: cd.st, o: cd.o});
  if (cd.st === '攻') {
    cs.tf.atkCount++;
    if (Run.hasRelic(run, 'yanling') && cs.tf.atkCount % 3 === 0) { cs.qi = Math.min(cs.qiMax, cs.qi + 1); await fx('qi', {qi: cs.qi}); }
  }
  // 牌去哪裡
  const x = cd.x || {};
  if (x.exhaust) { cs.exhaust.push(ci); await fx('exhaust', {card: ci}); }
  else if (x.returnTop) cs.draw.push(ci);
  else cs.discard.push(ci);
  if (Combat.checkEnd(cs)) return true;
  // 三才
  if (!cs.tf.sancai) {
    const sts = cs.tf.played.map(p => p.st);
    if (sts.indexOf('攻') >= 0 && sts.indexOf('守') >= 0 && sts.indexOf('變') >= 0) {
      cs.tf.sancai = 1;
      await fx('sancai', {});
      cs.qi = Math.min(cs.qiMax, cs.qi + 1); await fx('qi', {qi: cs.qi});
      if (Run.hasRelic(run, 'sancaiyin')) cs.energy++;
      await Combat.draw(run, cs, 1, fx);
    }
  }
  // 套路
  for (const kid of cs.comboSet) {
    if (cs.tf.combos[kid]) continue;
    const k = COMBOS.find(c => c.id === kid);
    const L = k.seq.length, P = cs.tf.played;
    if (P.length < L) continue;
    const tail = P.slice(P.length - L);
    const ok = k.seq.every((tok, i) => {
      if (tok[0] === '@') { const o = tok.slice(1, tok.length - 1), s = tok[tok.length - 1]; return tail[i].o === o && tail[i].st === s; }
      return tail[i].id === tok;
    });
    if (!ok) continue;
    cs.tf.combos[kid] = 1; cs.stats.combos++;
    await fx('combo', {id: kid});
    const lt = cs.enemies.find(e => e.uid === cs.lastTarget && !e.dead) || Combat.live(cs)[0] || null;
    const kOwner = k.duo ? (cs.heroes.comp && !cs.heroes.comp.down ? cs.heroes.comp : cs.heroes.wei) : (k.cls === run.cls ? cs.heroes.wei : (cs.heroes.comp || cs.heroes.wei));
    await Combat.runOps(run, meta, cs, k.ops, {owner: kOwner, target: lt, src: 'combo'}, fx);
    if (Run.hasRelic(run, 'shanzi')) { cs.qi = Math.min(cs.qiMax, cs.qi + 1); await fx('qi', {qi: cs.qi}); await Combat.draw(run, cs, 1, fx); }
    if (Combat.checkEnd(cs)) return true;
  }
  await fx('sync', {});
  return true;
};

Combat.condMet = function (cs, cond, ctx) {
  const t = ctx.target;
  if (cond === 'tgtVuln') return !!(t && t.st.vuln > 0);
  if (cond === 'brokeTurn') return !!cs.tf.broke;
  if (cond === 'hasBlock') return !!(ctx.owner && ctx.owner.block > 0);
  if (cond === 'played3') return cs.tf.played.length >= 3;
  if (cond.indexOf('tgtIntent') === 0) { const s = cond.slice(9); return !!(t && t.intent && !t.intent.broken && t.intent.st === s); }
  if (cond.indexOf('anyIntent') === 0) { const s = cond.slice(9); return Combat.live(cs).some(e => e.intent && !e.intent.broken && e.intent.st === s); }
  if (cond.indexOf('playedSt') === 0) { const s = cond.slice(8); return cs.tf.played.some(p => p.st === s); }
  return false;
};

/* 我方效果 */
Combat.runOps = async function (run, meta, cs, ops, ctx, fx) {
  const W = cs.heroes.wei, C = cs.heroes.comp;
  const owner = ctx.owner;
  for (const op of ops) {
    if (Combat.checkEnd(cs)) return;
    const k = op[0];
    const tgt = () => { if (ctx.target && !ctx.target.dead) return ctx.target; const l = Combat.live(cs); return l.length ? (ctx.target = l[0]) : null; };
    const atkBonus = () => { if (ctx.isAtk && !ctx.nextAtkUsed && cs.tf.nextAtk) { ctx.nextAtkUsed = 1; const b = cs.tf.nextAtk; cs.tf.nextAtk = 0; return b; } return 0; };
    switch (k) {
      case 'dmg': case 'dmgPierce': {
        const hits = op[2] || 1;
        for (let i = 0; i < hits; i++) { const e = tgt(); if (!e) break; const d = Combat.calcPlayerDmg(cs, owner, e, op[1], {bonus: i === 0 ? atkBonus() : 0}); await Combat.damageEnemy(run, cs, e, d, fx, {pierce: k === 'dmgPierce'}); if (e.dead) ctx.killed = 1; }
        break;
      }
      case 'dmgC': { const e = tgt(); if (!e) break; const bonus = Combat.condMet(cs, op[2], ctx) ? op[3] : 0; const d = Combat.calcPlayerDmg(cs, owner, e, op[1] + bonus, {bonus: atkBonus()}); await Combat.damageEnemy(run, cs, e, d, fx); if (e.dead) ctx.killed = 1; break; }
      case 'dmgX2': { const e = tgt(); if (!e) break; let d = Combat.calcPlayerDmg(cs, owner, e, op[1], {bonus: atkBonus()}); if (Combat.condMet(cs, op[2], ctx)) d *= 2; await Combat.damageEnemy(run, cs, e, d, fx); if (e.dead) ctx.killed = 1; break; }
      case 'dmgAll': { const hits = op[2] || 1; const b = atkBonus(); for (let i = 0; i < hits; i++) for (const e of Combat.live(cs)) await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, owner, e, op[1], {bonus: i === 0 ? b : 0}), fx); break; }
      case 'dmgLast': { const hits = op[2] || 1; for (let i = 0; i < hits; i++) { const e = tgt(); if (!e) break; await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, owner, e, op[1]), fx, {src: ctx.src}); } break; }
      case 'xdmg': { const n = op[2] === 'played' ? cs.tf.played.length + 1 : cs.stats.breaks + 2; for (let i = 0; i < n; i++) { const e = tgt(); if (!e) break; await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, owner, e, op[1], {bonus: i === 0 ? atkBonus() : 0}), fx); } break; }
      case 'xdmgAll': { const n = cs.tf.played.length + 1; for (let i = 0; i < n; i++) { const l = Combat.live(cs); if (!l.length) break; for (const e of l) await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, owner, e, op[1]), fx); } break; }
      case 'dmgBleed': { const e = tgt(); if (!e) break; await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, owner, e, e.st.bleed * op[1], {bonus: atkBonus()}), fx); break; }
      case 'dmgBleed1': { const hits = op[2] || 1; for (let i = 0; i < hits; i++) { const e = tgt(); if (!e) break; await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, owner, e, op[1], {bonus: i === 0 ? atkBonus() : 0}), fx); if (!e.dead) { e.st.bleed += 1; await fx('status', {uid: e.uid, s: 'bleed'}); } } break; }
      case 'dmgPup': { const e = tgt(); if (!e || !cs.puppet) break; await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, owner, e, cs.puppet.pow * op[1], {bonus: atkBonus()}), fx); break; }
      case 'execute': { const e = tgt(); if (e && e.tier !== 'b' && e.st.bleed >= op[1]) { await fx('say', {text: '一擊必殺！', short: 1, uid: e.uid}); await Combat.damageEnemy(run, cs, e, e.hp + e.block, fx, {pierce: 1}); } break; }
      case 'block': await Combat.gainBlock(cs, owner, op[1], fx); break;
      case 'blockC': await Combat.gainBlock(cs, owner, op[1] + (Combat.condMet(cs, op[2], ctx) ? op[3] : 0), fx); break;
      case 'blockLow': await Combat.gainBlock(cs, owner, owner.hp < owner.maxHp / 2 ? op[2] : op[1], fx); break;
      case 'blockComp': await Combat.gainBlock(cs, Combat.compAlive(cs) ? C : W, op[1], fx); break;
      case 'blockWei': await Combat.gainBlock(cs, W, op[1], fx); break;
      case 'blockAll': await Combat.gainBlock(cs, W, op[1], fx); if (Combat.compAlive(cs)) await Combat.gainBlock(cs, C, op[1], fx); break;
      case 'blockIntents': { const tot = Combat.live(cs).reduce((s, e) => { if (!e.intent || e.intent.broken || e.intent.st !== '攻') return s; const inf = Combat.intentInfo(cs, e); return s + inf.total; }, 0); await Combat.gainBlock(cs, owner, Math.min(op[1], tot), fx); break; }
      case 'draw': await Combat.draw(run, cs, op[1], fx); break;
      case 'nextDraw': cs.nextTurn.draw += op[1]; break;
      case 'energy': cs.energy += op[1]; await fx('energy', {}); break;
      case 'qi': cs.qi = Math.min(cs.qiMax, cs.qi + op[1]); await fx('qi', {qi: cs.qi}); break;
      case 'str': owner.st.str += op[1]; await fx('status', {key: owner.key, s: 'str'}); break;
      case 'tgtStr': { const e = tgt(); if (e) { e.st.str += op[1]; await fx('status', {uid: e.uid, s: 'str'}); } break; }
      case 'weak': case 'vuln': case 'bleed': { const e = tgt(); if (e) { e.st[k] += op[1]; await fx('status', {uid: e.uid, s: k}); } break; }
      case 'weakAll': case 'vulnAll': case 'bleedAll': { const s = k.slice(0, -3); for (const e of Combat.live(cs)) { e.st[s] += op[1]; await fx('status', {uid: e.uid, s}); } break; }
      case 'vulnLast': case 'bleedLast': { const e = tgt(); if (e) { const s = k === 'vulnLast' ? 'vuln' : 'bleed'; e.st[s] += op[1]; await fx('status', {uid: e.uid, s}); } break; }
      case 'bleedX2': { const e = tgt(); if (e) { e.st.bleed *= 2; await fx('status', {uid: e.uid, s: 'bleed'}); } break; }
      case 'stunLast': { const e = tgt(); if (e) { e.st.stun = Math.max(1, e.st.stun); await fx('status', {uid: e.uid, s: 'stun'}); } break; }
      case 'strip': { const e = tgt(); if (e && e.block) { e.block = Math.max(0, e.block - op[1]); await fx('status', {uid: e.uid, s: 'block'}); } break; }
      case 'chai': { const e = tgt(); if (e) await Combat.reducePips(run, cs, e, op[1] + Combat.chaiBonus(run, owner), fx, ctx); break; }
      case 'chaiStun': { const e = tgt(); if (e) { ctx.stunOnBreak = 1; await Combat.reducePips(run, cs, e, op[1] + Combat.chaiBonus(run, owner), fx, ctx); ctx.stunOnBreak = 0; } break; }
      case 'chaiAll': for (const e of Combat.live(cs)) await Combat.reducePips(run, cs, e, op[1] + Combat.chaiBonus(run, owner), fx, ctx); break;
      case 'chaiBest': { const e = Combat.chaiBest(cs); if (e) await Combat.reducePips(run, cs, e, op[1] + Combat.chaiBonus(run, owner), fx, ctx); break; }
      case 'guard': W.st.guard = 1; await fx('status', {key: 'wei', s: 'guard'}); await fx('sync', {}); break;
      case 'thorns': owner.st.thorns += op[1]; await fx('status', {key: owner.key, s: 'thorns'}); break;
      case 'thornsPerm': owner.st.thornsPerm += op[1]; await fx('status', {key: owner.key, s: 'thorns'}); break;
      case 'xieli': break;
      case 'selfDmg': await Combat.damageHero(run, cs, owner, op[1], fx, {pierce: 1}); break;
      case 'healAll': await Combat.healHero(cs, W, op[1], fx); await Combat.healHero(cs, C, op[1], fx); break;
      case 'nextAtk': cs.tf.nextAtk += op[1]; break;
      case 'power': cs.powers[op[1]] = (cs.powers[op[1]] || 0) + op[2]; await fx('power', {k: op[1]}); break;
      case 'if': if (Combat.condMet(cs, op[1], ctx)) await Combat.runOps(run, meta, cs, op[2], ctx, fx); else if (op[3]) await Combat.runOps(run, meta, cs, op[3], ctx, fx); break;
      case 'ifKill': if (ctx.killed) await Combat.runOps(run, meta, cs, op[1], ctx, fx); break;
      case 'discardRand': for (let i = 0; i < op[1] && cs.hand.length; i++) { const j = Math.floor(R.next(run.rng) * cs.hand.length); const c = cs.hand.splice(j, 1)[0]; cs.discard.push(c); await fx('discard', {card: c}); } break;
      case 'gold': run.gold += op[1]; await fx('gold', {amt: op[1]}); break;
      case 'pupAtk': if (cs.puppet) { if (cs.puppet.armor <= 0) cs.puppet.armor = 1; for (let i = 0; i < op[1]; i++) { const l = Combat.live(cs); if (!l.length) break; const e = ctx.target && !ctx.target.dead ? ctx.target : R.pick(run.rng, l); await fx('puppet', {act: 'atk', uid: e.uid}); await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, null, e, cs.puppet.pow), fx, {src: 'puppet'}); } } break;
      case 'pupArmor': if (cs.puppet) { cs.puppet.armor = Math.max(0, cs.puppet.armor + op[1]); await fx('puppet', {act: 'armor', amt: op[1]}); } break;
      case 'pupPow': if (cs.puppet) { cs.puppet.pow += op[1]; await fx('puppet', {act: 'pow', amt: op[1]}); } break;
      case 'bomb': { const e = tgt(); if (e) { e.bombs.push({dmg: op[1], fuse: op[2]}); await fx('bomb', {uid: e.uid}); } break; }
      case 'bombAll': for (const e of Combat.live(cs)) { e.bombs.push({dmg: op[1], fuse: op[2]}); await fx('bomb', {uid: e.uid}); } break;
      case 'detonate': { const e = tgt(); if (e) await Combat.detonate(run, cs, e, fx, 1, op[1] || 0); break; }
      case 'detonateX2': { const e = tgt(); if (e) await Combat.detonate(run, cs, e, fx, 2, 0); break; }
      case 'fuseAll': for (const e of Combat.live(cs)) e.bombs.forEach(b => { b.fuse = Math.max(1, b.fuse + op[1]); }); await fx('sync', {}); break;
      default: console.warn('未知效果', k);
    }
  }
};
Combat.chaiBonus = (run, owner) => (owner && owner.key === 'ye' && Run.hasRelic(run, 'qiuchi') ? 1 : 0);
Combat.bombDmg = function (run, cs, b) { return b.dmg + (cs.powers.xiaoshi || 0) + (Run.hasRelic(run, 'jiuhu') ? 3 : 0); };
Combat.detonate = async function (run, cs, e, fx, mul, plus) {
  if (!e.bombs.length) return;
  const bs = e.bombs; e.bombs = [];
  for (const b of bs) {
    if (e.dead) break;
    const d = (Combat.bombDmg(run, cs, b) + (plus || 0)) * mul;
    await fx('explode', {uid: e.uid, dmg: d});
    await Combat.damageEnemy(run, cs, e, e.st.vuln > 0 ? Math.floor(d * 1.5) : d, fx, {pierce: 1, src: 'bomb'});
  }
};

/* ===== 合擊 ===== */
Combat.canHeji = (cs) => cs.phase === 'player' && Combat.compAlive(cs) && cs.qi >= cs.qiCost && !cs.tf.heji;
Combat.heji = async function (run, meta, cs, fx) {
  fx = fx || NOFX;
  if (!Combat.canHeji(cs)) return false;
  const C = cs.heroes.comp;
  cs.qi -= cs.qiCost; cs.tf.heji = 1; cs.stats.hejis++;
  await fx('heji', {comp: C.key});
  await fx('qi', {qi: cs.qi});
  const ctx = {owner: C, target: null, src: 'heji'};
  if (C.key === 'ye') {
    for (const e of Combat.live(cs)) if (e.intent && !e.intent.broken && e.intent.p != null) { await fx('pip', {uid: e.uid, p: 0}); await Combat.breakIntent(run, cs, e, fx, null); }
    await Combat.runOps(run, meta, cs, [['dmgAll', 10]], ctx, fx);
  } else if (C.key === 'xian') {
    if (cs.puppet) { cs.puppet.armor += 15; await fx('puppet', {act: 'armor', amt: 15}); }
    await Combat.runOps(run, meta, cs, [['pupAtk', 6]], ctx, fx);
  } else if (C.key === 'zhong') {
    await Combat.runOps(run, meta, cs, [['dmgAll', 8]], ctx, fx);
    for (const e of Combat.live(cs)) await Combat.detonate(run, cs, e, fx, 2, 0);
  } else if (C.key === 'bai') {
    await Combat.runOps(run, meta, cs, [['dmgAll', 8], ['bleedAll', 8]], ctx, fx);
  }
  Combat.checkEnd(cs);
  await fx('sync', {});
  return true;
};

/* ===== 丹藥 ===== */
Combat.usePotion = async function (run, meta, cs, slot, arg, fx) {
  fx = fx || NOFX;
  const id = run.potions[slot]; if (!id || cs.phase !== 'player') return false;
  run.potions[slot] = null;
  const W = cs.heroes.wei, C = cs.heroes.comp;
  await fx('potion', {id});
  const ctx = {owner: W, target: null, src: 'potion'};
  switch (id) {
    case 'jinchuang': { const h = arg === 'comp' && Combat.compAlive(cs) ? C : W; await Combat.healHero(cs, h, 15, fx); break; }
    case 'dali': W.st.str += 2; await fx('status', {key: 'wei', s: 'str'}); break;
    case 'mihun': for (const e of Combat.live(cs)) await Combat.reducePips(run, cs, e, 2, fx, null); break;
    case 'pili': for (const e of Combat.live(cs)) await Combat.damageEnemy(run, cs, e, 12, fx, {src: 'potion'}); break;
    case 'huiqi': cs.qi = Math.min(cs.qiMax, cs.qi + 3); await fx('qi', {qi: cs.qi}); break;
    case 'huxin': await Combat.gainBlock(cs, W, 12, fx); if (Combat.compAlive(cs)) await Combat.gainBlock(cs, C, 12, fx); break;
    case 'huanhun': if (C) { if (C.down) { C.down = false; C.hp = Math.ceil(C.maxHp / 2); await fx('revive', {key: C.key}); } else await Combat.healHero(cs, C, 20, fx); } else await Combat.healHero(cs, W, 20, fx); break;
    case 'shaodao': cs.energy += 2; await fx('energy', {}); break;
    case 'tougu': { const e = cs.enemies.find(x => x.uid === arg && !x.dead) || Combat.live(cs)[0]; if (e) { e.st.vuln += 2; e.st.bleed += 6; await fx('status', {uid: e.uid, s: 'vuln'}); } break; }
    case 'qingxin': await Combat.draw(run, cs, 3, fx); break;
  }
  Combat.checkEnd(cs);
  await fx('sync', {});
  return true;
};

/* ===== 收招（回合結束） ===== */
Combat.endTurn = async function (run, meta, cs, fx) {
  fx = fx || NOFX;
  if (cs.phase !== 'player') return;
  cs.phase = 'enemy';
  const W = cs.heroes.wei, C = cs.heroes.comp;
  // 手上的詛咒
  for (const c of cs.hand) { const x = cardDef(c).x || {}; if (x.endHurt) await Combat.damageHero(run, cs, W, x.endHurt, fx, {pierce: 1}); }
  if (Combat.checkEnd(cs)) return;
  if (Run.hasRelic(run, 'ruanjia') && W.block === 0) await Combat.gainBlock(cs, W, 5, fx);
  // 阿木出手
  if (cs.puppet && cs.puppet.armor > 0 && Combat.compAlive(cs)) {
    const l = Combat.live(cs);
    if (l.length) { const e = R.pick(run.rng, l); await fx('puppet', {act: 'atk', uid: e.uid}); await Combat.damageEnemy(run, cs, e, Combat.calcPlayerDmg(cs, null, e, cs.puppet.pow), fx, {src: 'puppet'}); }
  }
  // 火藥引信
  for (const e of Combat.live(cs)) {
    if (!e.bombs.length) continue;
    const keep = [];
    for (const b of e.bombs) { b.fuse--; if (b.fuse <= 0) { if (!e.dead) { const d = Combat.bombDmg(run, cs, b); await fx('explode', {uid: e.uid, dmg: d}); await Combat.damageEnemy(run, cs, e, e.st.vuln > 0 ? Math.floor(d * 1.5) : d, fx, {pierce: 1, src: 'bomb'}); } } else keep.push(b); }
    if (!e.dead) e.bombs = keep;
  }
  if (Combat.checkEnd(cs)) return;
  // 棄手牌
  const hand = cs.hand; cs.hand = [];
  for (const c of hand) { const x = cardDef(c).x || {}; if (x.ethereal) cs.exhaust.push(c); else cs.discard.push(c); }
  await fx('discardHand', {cards: hand});
  // 我方狀態遞減（虛弱），敵方破綻遞減
  for (const h of [W, C]) if (h) { if (h.st.weak > 0) h.st.weak--; h.st.thorns = 0; }
  for (const e of Combat.live(cs)) if (e.st.vuln > 0) e.st.vuln--;
  await fx('turn', {side: 'enemy', t: cs.t});
  // 敵人行動
  for (const e of cs.enemies.slice()) {
    if (e.dead) continue;
    if (e.fresh) { e.fresh = 0; continue; }
    if (e.st.bleed > 0) { const b = e.st.bleed; e.st.bleed--; await Combat.damageEnemy(run, cs, e, b, fx, {pierce: 1, src: 'bleed'}); if (e.dead) { if (Combat.checkEnd(cs)) return; continue; } }
    e.block = 0;
    if (e.pass.turnBlock) { e.block += e.pass.turnBlock; await fx('enemyBlock', {uid: e.uid, amt: e.pass.turnBlock}); }
    const it = e.intent;
    let keep = false;
    if (!it) { /* 沒有意圖 */ }
    else if (it.broken) { await fx('fizzle', {uid: e.uid}); }
    else if (e.st.stun > 0) { e.st.stun--; await fx('stunSkip', {uid: e.uid}); }
    else if (it.chargeLeft > 0) { it.chargeLeft--; keep = true; await fx('charge', {uid: e.uid}); }
    else { await Combat.enemyAct(run, meta, cs, e, fx); }
    if (cs.phase === 'lost' || Combat.checkEnd(cs)) return;
    if (!e.dead) {
      if (it && it.broken && e.st.stun > 0) { /* 蓄力被破：下回合也定身 */ }
      if (!keep) Combat.chooseIntent(run, cs, e);
    }
  }
  // 敵方虛弱遞減、我方破綻遞減、守護解除
  for (const e of Combat.live(cs)) if (e.st.weak > 0) e.st.weak--;
  for (const h of [W, C]) if (h) { if (h.st.vuln > 0) h.st.vuln--; h.st.guard = 0; }
  for (const e of cs.enemies) e.fresh = 0;
  if (Combat.checkEnd(cs)) return;
  await Combat.beginPlayerTurn(run, meta, cs, fx);
};

Combat.enemyAct = async function (run, meta, cs, e, fx) {
  const d = ENEMIES[e.id], it = e.intent, mv = d.moves[it.mv];
  await fx('enemyAct', {uid: e.uid, mv: it.mv, n: mv.n, st: it.st});
  const targets = () => {
    if (it.target === 'all') return Combat.heroList(cs);
    const h = Combat.intentTargetHero(cs, e);
    return h && !h.down ? [h] : [cs.heroes.wei];
  };
  for (const op of mv.ops) {
    if (e.dead || cs.phase === 'lost') return;
    const k = op[0];
    switch (k) {
      case 'atk': {
        const hits = op[2] || 1;
        for (let i = 0; i < hits; i++) {
          for (const h of targets()) {
            if (e.dead) break;
            const dmg = Combat.enemyHit(cs, e, op[1], h);
            await fx('enemyStrike', {uid: e.uid, key: h.key});
            await Combat.damageHero(run, cs, h, dmg, fx);
            if (cs.phase === 'lost') return;
            const th = h.st.thorns + h.st.thornsPerm;
            if (th > 0 && !h.down) await Combat.damageEnemy(run, cs, e, th, fx, {src: 'thorns'});
          }
        }
        break;
      }
      case 'block': e.block += op[1]; await fx('enemyBlock', {uid: e.uid, amt: op[1]}); break;
      case 'blockAllies': for (const o of Combat.live(cs)) { o.block += op[1]; await fx('enemyBlock', {uid: o.uid, amt: op[1]}); } break;
      case 'blockOther': { const os = Combat.live(cs).filter(o => o !== e); const o = os.length ? R.pick(run.rng, os) : e; o.block += op[1]; await fx('enemyBlock', {uid: o.uid, amt: op[1]}); break; }
      case 'str': e.st.str += op[1]; await fx('status', {uid: e.uid, s: 'str'}); break;
      case 'strAll': for (const o of Combat.live(cs)) { o.st.str += op[1]; await fx('status', {uid: o.uid, s: 'str'}); } break;
      case 'strOther': { const os = Combat.live(cs).filter(o => o !== e); const o = os.length ? os[0] : e; o.st.str += op[1]; await fx('status', {uid: o.uid, s: 'str'}); break; }
      case 'weak': case 'vuln': case 'bleed': for (const h of targets()) { h.st[k] += op[1]; await fx('status', {key: h.key, s: k}); } break;
      case 'heal': { const before = e.hp; e.hp = Math.min(e.maxHp, e.hp + op[1]); await fx('enemyHeal', {uid: e.uid, amt: e.hp - before}); break; }
      case 'steal': { const g = Math.min(run.gold, op[1]); run.gold -= g; if (g) await fx('steal', {uid: e.uid, amt: g}); break; }
      case 'summon': await Combat.summon(run, cs, op[1], op[2] || 1, fx); break;
      case 'drainQi': cs.qi = Math.max(0, cs.qi - op[1]); await fx('qi', {qi: cs.qi}); break;
    }
  }
  if (!e.dead && cs.phase !== 'lost') await fx('enemyDone', {uid: e.uid});
};
Combat.summon = async function (run, cs, id, n, fx) {
  for (let i = 0; i < n; i++) {
    if (Combat.live(cs).length >= 4) break;
    const ne = Combat.mkEnemy(run, cs, id);
    cs.enemies.push(ne);
    Combat.chooseIntent(run, cs, ne);
    await fx('summon', {uid: ne.uid});
  }
};

Combat.checkEnd = function (cs) {
  if (cs.phase === 'lost' || cs.heroes.wei.down) { cs.phase = 'lost'; return true; }
  if (!Combat.live(cs).length) { cs.phase = 'won'; return true; }
  return false;
};

/* 戰後把狀態寫回這趟鏢 */
Combat.writeBack = function (run, cs) {
  run.hp = Math.max(1, cs.heroes.wei.hp);
  const C = cs.heroes.comp;
  if (C) {
    run.compHp = C.down ? Math.max(1, Math.round(run.compMaxHp * 0.2)) : Math.max(1, C.hp);
  }
  if (Run.hasRelic(run, 'hulu')) { run.hp = Math.min(run.maxHp, run.hp + 4); if (C) run.compHp = Math.min(run.compMaxHp, run.compHp + 4); }
  run.stats.breaks += cs.stats.breaks; run.stats.combos += cs.stats.combos; run.stats.hejis += cs.stats.hejis;
  run.stats.maxHit = Math.max(run.stats.maxHit, cs.stats.maxHit);
};

/* ---- src/engine/flow.js ---- */
/* ===== 流程：每個畫面之間怎麼走（不碰介面，可無頭測試、可隨時存檔續玩） ===== */
const Flow = {};

Flow.push = function (run, ...scrs) { run.queue.unshift(...scrs); };
Flow.next = function (run, meta) {
  run.screen = run.queue.length ? run.queue.shift() : {t: 'map'};
  Flow.onEnter(run, meta);
  return run.screen;
};
Flow.onEnter = function (run, meta) {
  const s = run.screen;
  if (s.t === 'scene' && s.pi == null) { s.pi = 0; s.i = 0; s.choice = null; s.parts = SCENES[s.id].choicesFirst ? Flow.PARTS_CF : Flow.PARTS; }
  if (s.t === 'combat' && !run.combat) run.combat = Combat.create(run, meta, s.enc);
  if (s.t === 'shop' && !s.shop) s.shop = Run.genShop(run);
  if (s.t === 'event' && !s.id) s.id = Flow.pickEvent(run);
  if (s.t === 'event' && run.eventsSeen.indexOf(s.id) < 0) run.eventsSeen.push(s.id);
  if (s.t === 'reward') (s.rw.cards || []).forEach(id => Flow.seeCard(meta, id));
};
Flow.seeCard = function (meta, id) { if (meta.seenCards.indexOf(id) < 0) meta.seenCards.push(id); };

/* ===== 開一趟新鏢 ===== */
Flow.newRun = function (meta, opt) {
  const run = Run.create(meta, opt);
  Run.joinComp(run, opt.comp);
  run.deck.forEach(c => Flow.seeCard(meta, c.id));
  if (meta.comps.indexOf(opt.comp) < 0) meta.comps.push(opt.comp);
  run.queue = [];
  Run.genMap(run, 1);
  if (metaUp(meta, 'toushi')) Run.revealMap(run);
  run.map.cur = {row: 0, idx: 0}; run.map.rows[0][0].visited = 1;
  const native = ROUTES[opt.route].comp;
  if (opt.comp !== native) run.queue.push({t: 'scene', id: 'depart_' + opt.comp});
  run.queue.push({t: 'scene', id: ROUTES[opt.route].acts[1].start, meet: native});
  Flow.next(run, meta);
  return run;
};

/* ===== 地圖 ===== */
Flow.enterNode = function (run, meta, node) {
  const m = run.map;
  m.cur = {row: node.row, idx: node.idx}; node.visited = 1;
  run.day++;
  const type = node.q ? Run.resolveQ(run, node) : node.type;
  const act = run.act;
  const RA = act === 3 ? null : ROUTES[run.route].acts[act];
  const list = [];
  switch (type) {
    case 'story': list.push({t: 'scene', id: act === 3 ? ACT3.start : node.row === 0 ? RA.start : RA.mid}); break;
    case 'fight': list.push({t: 'combat', enc: {grp: Run.pickEncounter(run, 'normal'), kind: 'normal'}, reward: 'normal'}); break;
    case 'elite': list.push({t: 'combat', enc: {grp: Run.pickEncounter(run, 'elite'), kind: 'elite'}, reward: 'elite'}); break;
    case 'event': list.push({t: 'event'}); break;
    case 'shop': list.push({t: 'shop'}); break;
    case 'inn': list.push({t: 'inn'}); break;
    case 'boss':
      list.push({t: 'scene', id: RA.bossPre}, {t: 'combat', enc: {grp: Run.pickEncounter(run, 'boss'), kind: 'boss'}, reward: 'boss'}, {t: 'scene', id: RA.bossPost}, {t: 'actEnd'});
      break;
    case 'finale':
      if (run.guest) list.push({t: 'scene', id: 'bai_bye', guestLeave: 1});
      list.push({t: 'scene', id: ACT3.finale});
      break;
  }
  Flow.push(run, ...list);
  return Flow.next(run, meta);
};
Flow.pickEvent = function (run) {
  let pool = EVENTS.filter(e => (!e.route || (run.act < 3 && e.route === run.route)) && run.eventsSeen.indexOf(e.id) < 0);
  if (!pool.length) pool = EVENTS.filter(e => !e.route);
  return R.pick(run.rng, pool).id;
};

/* ===== 劇情場景 ===== */
Flow.PARTS = ['beats', 'fight', 'after', 'choices', 'say', 'cfight', 'cafter', 'go'];
Flow.PARTS_CF = ['beats', 'choices', 'say', 'cfight', 'cafter', 'fight', 'after', 'go'];
Flow.sceneChoices = function (run, meta, sc) {
  let ch = sc.choices;
  if (typeof ch === 'string') {
    const m = ch.match(/^join_(\w+?)(_native)?$/);
    if (m) { const key = m[1]; ch = (!m[2] || Run.activeComp(run) === key) ? AFF_JOIN[key] : null; }
  }
  if (!ch) return [];
  return ch.map((c, k) => ({c, k})).filter(o => !o.c.if || Run.cond(run, meta, o.c.if));
};
Flow.choiceObj = function (run, meta, scr) {
  if (scr.choice == null) return null;
  const sc = SCENES[scr.id];
  let ch = sc.choices;
  if (typeof ch === 'string') { const m = ch.match(/^join_(\w+?)(_native)?$/); ch = AFF_JOIN[m[1]]; }
  return ch[scr.choice];
};
/* 往前走到下一個要顯示的東西：{beat}｜{choices}｜{combat}｜{done}｜{ending}  */
Flow.sceneStep = function (run, meta, notes) {
  notes = notes || [];
  const scr = run.screen;
  const sc = SCENES[scr.id];
  for (let guard = 0; guard < 200; guard++) {
    const part = scr.parts[scr.pi];
    const ch = Flow.choiceObj(run, meta, scr);
    const list = part === 'beats' ? sc.beats : part === 'after' ? sc.after : part === 'say' ? (ch && ch.say) : part === 'cafter' ? (ch && ch.after) : null;
    if (list) {
      while (scr.i < list.length) {
        const b = list[scr.i];
        if (b.if && !Run.cond(run, meta, b.if)) { scr.i++; continue; }
        if (b.fx) { scr.i++; Flow.applyEffs(run, meta, b.fx, notes); continue; }
        return {beat: b, notes};
      }
      scr.pi++; scr.i = 0; continue;
    }
    if (part === 'choices') {
      if (scr.choice == null) {
        const vis = Flow.sceneChoices(run, meta, sc);
        if (vis.length) return {choices: vis, notes};
      }
      scr.pi++; scr.i = 0; continue;
    }
    if (part === 'fight' || part === 'cfight') {
      const fdef = part === 'fight' ? sc.fight : ch && ch.fight;
      scr.pi++; scr.i = 0;
      if (fdef) { Flow.sceneCombat(run, meta, fdef); return {combat: true, notes}; }
      continue;
    }
    if (part === 'go' || part == null) {
      const go = (ch && ch.go) || sc.next || null;
      return Flow.sceneFinish(run, meta, go, notes);
    }
    scr.pi++;
  }
  return {done: true, notes};
};
Flow.sceneTap = function (run) { run.screen.i++; };
Flow.sceneChoose = function (run, meta, k) {
  const scr = run.screen;
  scr.choice = k;
  const ch = Flow.choiceObj(run, meta, scr);
  const notes = [];
  if (ch.eff) Flow.applyEffs(run, meta, ch.eff, notes);
  scr.pi = scr.parts.indexOf('say'); scr.i = 0;
  return notes;
};
Flow.sceneCombat = function (run, meta, fdef) {
  const scr = run.screen;
  let grp = fdef.grp;
  if (typeof grp === 'string') grp = Run.pickEncounter(run, grp === 'easy' ? 'normal' : grp);
  else grp = deepCopy(R.pick(run.rng, grp));
  const kind = fdef.boss ? 'boss' : 'normal';
  Flow.push(run, {t: 'combat', enc: {grp, kind, assist: fdef.assist || null, bg: (SCENES[scr.id] && SCENES[scr.id].bg) || null}, reward: fdef.boss ? null : 'normal'}, scr);
  Flow.next(run, meta);
};
Flow.sceneFinish = function (run, meta, go, notes) {
  const scr = run.screen;
  if (scr.meet) { const n = Run.applyEffect(run, meta, ['meet', scr.meet]); if (n) notes.push(n); }
  if (scr.guestLeave) Run.guestLeave(run);
  if (scr.talk) { /* 交心結束 */ }
  if (go === 'READ') go = TRUE_NEEDS.every(d => knows(meta, d)) ? 'y_bai' : (Run.activeComp(run) === 'zhong' && run.compState === 'with' && run.aff >= 7 ? 'END:E8' : 'END:E4');
  if (go && go.indexOf('END:') === 0) { Flow.ending(run, meta, go.slice(4)); return {ending: go.slice(4), notes}; }
  if (go) { Flow.push(run, {t: 'scene', id: go}); }
  Flow.next(run, meta);
  return {done: true, notes};
};

/* ===== 效果（劇情、奇遇共用） ===== */
Flow.applyEffs = function (run, meta, effs, notes, info) {
  info = info || {};
  for (let i = 0; i < effs.length; i++) {
    const e = effs[i];
    const k = e[0];
    if (k === 'luck') {
      const win = R.chance(run.rng, e[1]);
      info.luck = win;
      Flow.applyEffs(run, meta, win ? e[2] : e[3], notes, info);
      continue;
    }
    if (k === 'gamble' || k === 'gambleFlag') { const n = Run.applyEffect(run, meta, e); info.luck = n.indexOf('贏') === 0; if (n) notes.push(n); continue; }
    if (k === 'fight' || k === 'upgradeChoose' || k === 'removeChoose' || k === 'cardReward') {
      const rest = effs.slice(i + 1);
      let scr;
      if (k === 'fight') {
        const grp = typeof e[1] === 'string' ? Run.pickEncounter(run, e[1]) : deepCopy(R.pick(run.rng, e[1]));
        scr = {t: 'combat', enc: {grp, kind: e[1] === 'elite' ? 'elite' : 'normal'}, reward: null};
      } else if (k === 'upgradeChoose') scr = {t: 'pick', mode: 'upgrade', n: e[1]};
      else if (k === 'removeChoose') scr = {t: 'pick', mode: 'remove', n: e[1]};
      else scr = {t: 'reward', rw: {gold: 0, cards: Run.cardChoices(run, 'normal'), taken: {}}};
      const list = [scr]; if (rest.length) list.push({t: 'effs', effs: rest});
      Flow.push(run, ...list);
      return info;
    }
    if (k === 'card' || k === 'curse') Flow.seeCard(meta, e[1]);
    const n = Run.applyEffect(run, meta, e);
    if (n === undefined) console.warn('沒處理的效果', k);
    else if (n) notes.push(n);
  }
  return info;
};
Flow.runEffsScreen = function (run, meta) {
  const notes = [];
  const effs = run.screen.effs;
  run.screen = {t: 'map'};
  const queueBefore = run.queue.length;
  Flow.applyEffs(run, meta, effs, notes);
  Flow.next(run, meta);
  return notes;
};

/* ===== 戰鬥結束 ===== */
Flow.combatWon = function (run, meta) {
  const scr = run.screen, cs = run.combat;
  Combat.writeBack(run, cs);
  run.stats.fights++;
  if (cs.kind === 'elite') run.stats.elites++;
  if (cs.kind === 'boss') run.stats.bosses++;
  run.combat = null;
  if (scr.reward) Flow.push(run, {t: 'reward', rw: Run.combatRewards(run, scr.reward)});
  return Flow.next(run, meta);
};
Flow.dead = function (run, meta) {
  if (run.combat) Combat.writeBack(run, run.combat);
  run.hp = 0;
  run.combat = null;
  const sum = Run.finish(run, meta, {type: 'death'});
  run.screen = {t: 'dead', summary: sum};
  run.done = 1;
  return sum;
};
Flow.ending = function (run, meta, id) {
  const sum = Run.finish(run, meta, {type: 'ending', ending: id});
  run.screen = {t: 'ending', id, summary: sum};
  run.ending = id; run.done = 1;
  return sum;
};

/* ===== 戰利品 ===== */
Flow.rewardTakeGold = function (run, rw) { if (rw.taken.gold || !rw.gold) return; rw.taken.gold = 1; run.gold += rw.gold; };
Flow.rewardTakeCard = function (run, meta, rw, id) { if (rw.taken.card) return; rw.taken.card = 1; const c = Run.addCard(run, id); Flow.seeCard(meta, id); return c; };
Flow.rewardSeal = function (run, meta, rw, idx) {
  if (run.seals <= 0 || rw.taken.card) return false;
  const id = rw.cards[idx];
  run.sealed.push(id); run.seals--;
  const nid = Run.rollCard(run, rw.kind === 'boss' ? 'boss' : rw.kind === 'elite' ? 'elite' : 'normal', rw.cards.concat([id]));
  if (nid) { rw.cards[idx] = nid; Flow.seeCard(meta, nid); } else rw.cards.splice(idx, 1);
  return true;
};
Flow.rewardTakePotion = function (run, rw) { if (rw.taken.potion || !rw.potion) return false; if (!Run.gainPotion(run, rw.potion)) return false; rw.taken.potion = 1; return true; };
Flow.rewardTakeRelic = function (run, rw, id) {
  if (rw.taken.relic) return;
  if (rw.relicChoices && rw.relicChoices.indexOf(id) < 0) return;
  if (!rw.relicChoices && rw.relic !== id) return;
  rw.taken.relic = 1; Run.gainRelic(run, id);
};

/* ===== 客棧 ===== */
Flow.talkScene = function (run) {
  const comp = Run.activeComp(run);
  if (!comp) return null;
  if (comp === 'bai') return run.talks.bai ? 'chat_generic' : 'bai_t1';
  const lv = run.talks[comp] || 0;
  if (lv === 0) return comp + '_t1';
  if (lv === 1) return comp + '_t2';
  if (lv === 2 && run.aff >= 5) return comp + '_t3';
  return 'chat_generic';
};
Flow.innChoose = function (run, meta, opt) {
  const scr = run.screen;
  const notes = [];
  if (scr.done) return notes;
  scr.done = 1;
  if (opt === 'rest') {
    const h = Math.round(run.maxHp * 0.35); run.hp = Math.min(run.maxHp, run.hp + h);
    if (Run.activeComp(run)) run.compHp = Math.min(run.compMaxHp, run.compHp + Math.round(run.compMaxHp * 0.35));
    notes.push('歇了一夜：全隊回復三成半氣血');
  } else if (opt === 'train') {
    Flow.push(run, {t: 'pick', mode: 'upgrade', n: 1});
  } else if (opt === 'talk') {
    const comp = Run.activeComp(run);
    const sid = Flow.talkScene(run);
    run.talks[comp] = (run.talks[comp] || 0) + (sid === 'chat_generic' ? 0 : 1);
    if (sid === 'chat_generic') { const n = Run.applyEffect(run, meta, ['aff', 1]); if (n) notes.push(n); run.compHp = Math.min(run.compMaxHp, run.compHp + 10); }
    Flow.push(run, {t: 'scene', id: sid, talk: comp});
  }
  scr.notes = notes;
  return notes;
};

/* ===== 挑牌（精修／刪牌） ===== */
Flow.pickable = function (run, mode) {
  if (mode === 'upgrade') return run.deck.filter(canUpgrade);
  if (mode === 'remove') return run.deck.slice();
  return [];
};
Flow.pickDone = function (run, meta, uids) {
  const scr = run.screen;
  const notes = [];
  (uids || []).forEach(uid => {
    const c = run.deck.find(x => x.uid === uid); if (!c) return;
    if (scr.mode === 'upgrade') { c.up = 1; notes.push('精修：' + cardName(c)); }
    if (scr.mode === 'remove') { Run.removeCard(run, uid); notes.push('刪去：' + cardName(c)); }
  });
  Flow.next(run, meta);
  return notes;
};

/* ===== 市集 ===== */
Flow.shopBuy = function (run, meta, kind, idx) {
  const sh = run.screen.shop;
  const it = kind === 'card' ? sh.cards[idx] : kind === 'pot' ? sh.pots[idx] : sh.rel[idx];
  if (!it || it.sold || run.gold < it.price) return false;
  if (kind === 'pot' && run.potions.indexOf(null) < 0) return false;
  run.gold -= it.price; it.sold = 1;
  if (kind === 'card') { Run.addCard(run, it.id); Flow.seeCard(meta, it.id); }
  if (kind === 'pot') Run.gainPotion(run, it.id);
  if (kind === 'rel') Run.gainRelic(run, it.id);
  return true;
};
Flow.shopRemove = function (run, uid) {
  const sh = run.screen.shop;
  if (sh.removeUsed || run.gold < run.removeCost) return false;
  run.gold -= run.removeCost; run.removeCost += 25; sh.removeUsed = 1;
  Run.removeCard(run, uid);
  return true;
};

/* ===== 奇遇 ===== */
Flow.eventChoose = function (run, meta, k) {
  const scr = run.screen;
  if (scr.chosen != null) return;
  const ev = EVENTS.find(e => e.id === scr.id);
  const ch = ev.choices[k];
  scr.chosen = k;
  const notes = [];
  const info = Flow.applyEffs(run, meta, ch.eff, notes);
  scr.result = ch.say || (info.luck === true ? ch.sayWin : info.luck === false ? ch.sayLose : '') || '';
  scr.notes = notes;
};

/* ===== 一折結束 ===== */
Flow.actAdvance = function (run, meta) {
  const notes = [];
  const list = [];
  if (run.act === 2) {
    const comp = run.comp;
    if (run.compState === 'with' && run.aff <= 1) {
      if (comp === 'ye') { Run.compLeave(run, 'left'); list.push({t: 'scene', id: 'leave_ye'}); }
      if (comp === 'xian') { Run.compLeave(run, 'left'); list.push({t: 'scene', id: 'leave_xian'}); }
      if (comp === 'zhong') { Run.compLeave(run, 'dead'); list.push({t: 'scene', id: 'dead_zhong'}); }
      Run.guestJoin(run, 'bai');
      list.push({t: 'scene', id: 'join_bai'});
    }
  }
  run.act++;
  const hp = Math.round(run.maxHp * 0.4);
  run.hp = Math.min(run.maxHp, run.hp + hp);
  if (Run.activeComp(run)) run.compHp = Math.min(run.compMaxHp, run.compHp + Math.round(run.compMaxHp * 0.4));
  notes.push('趕路的空檔：全隊回復四成氣血');
  Run.genMap(run, run.act);
  if (metaUp(meta, 'toushi')) Run.revealMap(run);
  run.map.cur = {row: 0, idx: 0}; run.map.rows[0][0].visited = 1;
  list.push({t: 'scene', id: run.act === 3 ? ACT3.start : ROUTES[run.route].acts[run.act].start});
  Flow.push(run, ...list);
  Flow.next(run, meta);
  return notes;
};

/* ---- src/ui/audio.js ---- */
/* ===== 音效與配樂（全部即時合成，不需要音檔） ===== */
const Sfx = (() => {
  let ctx = null, master = null, sfxGain = null, musGain = null, noiseBuf = null;
  let musicOn = true, sfxOn = true, musTimer = null, musMode = null, musStep = 0;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      sfxGain = ctx.createGain(); sfxGain.gain.value = sfxOn ? 0.75 : 0; sfxGain.connect(master);
      musGain = ctx.createGain(); musGain.gain.value = musicOn ? 0.32 : 0; musGain.connect(master);
      const len = ctx.sampleRate * 1.5; noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }
  const now = () => ctx.currentTime;
  function env(g, t, a, peak, dcy, end) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(end || 0.0001, t + a + dcy); }
  function noise(t, dur, type, freq, q, peak, out) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
    const g = ctx.createGain(); env(g, t, 0.004, peak, dur);
    s.connect(f); f.connect(g); g.connect(out || sfxGain); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
    return f;
  }
  function tone(t, freq, dur, type, peak, out, slide) {
    const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    const g = ctx.createGain(); env(g, t, 0.005, peak, dur);
    o.connect(g); g.connect(out || sfxGain); o.start(t); o.stop(t + dur + 0.05);
  }
  const P = {
    click() { const t = now(); noise(t, 0.05, 'bandpass', 1800, 2, 0.35); tone(t, 220, 0.06, 'triangle', 0.2); },
    xingmu() { const t = now(); noise(t, 0.09, 'lowpass', 900, 1, 0.9); tone(t, 140, 0.12, 'sine', 0.6, null, 90); },
    card() { const t = now(); const f = noise(t, 0.12, 'bandpass', 2400, 0.8, 0.22); f.frequency.exponentialRampToValueAtTime(5200, t + 0.1); },
    draw() { const t = now(); noise(t, 0.07, 'highpass', 3500, 0.7, 0.12); },
    slash() { const t = now(); const f = noise(t, 0.18, 'bandpass', 1200, 1.2, 0.5); f.frequency.exponentialRampToValueAtTime(6000, t + 0.15); },
    hit(big) { const t = now(); tone(t, big ? 110 : 150, 0.18, 'sine', big ? 1 : 0.7, null, 45); noise(t, big ? 0.22 : 0.12, 'lowpass', big ? 900 : 1400, 0.7, big ? 0.9 : 0.6); },
    block() { const t = now(); tone(t, 660, 0.25, 'square', 0.08); tone(t, 990, 0.2, 'triangle', 0.12); noise(t, 0.06, 'highpass', 4000, 1, 0.2); },
