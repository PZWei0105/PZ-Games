  /* ---- 骨架 ---- */
  function ik(h, f, L1, L2, preferDown) {
    let dx = f[0] - h[0], dy = f[1] - h[1]; let d = hypot(dx, dy) || 1e-6;
    const mx = L1 + L2 - 1e-4; let ft = f;
    if (d > mx) { ft = [h[0] + dx / d * mx, h[1] + dy / d * mx]; d = mx; }
    const a = atan2(dy, dx);
    const c = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    const A = Math.acos(max(-1, min(1, c)));
    const k1 = [h[0] + cos(a - A) * L1, h[1] + sin(a - A) * L1];
    if (preferDown == null) return {knee: k1, foot: ft};
    const k2 = [h[0] + cos(a + A) * L1, h[1] + sin(a + A) * L1];
    return {knee: (k1[1] >= k2[1]) === !!preferDown ? k1 : k2, foot: ft};
  }
  function solve(sp, p) {
    const bk = sp.bulk || 1;
    const hip = p.hip, u = U(p.lean + (sp.hunch ? 0.18 : 0)), n = [cos(p.lean + (sp.hunch ? 0.18 : 0)), sin(p.lean + (sp.hunch ? 0.18 : 0))];
    const TP = (s, f) => [hip[0] + u[0] * s * B.torso + n[0] * f * bk, hip[1] + u[1] * s * B.torso + n[1] * f * bk];
    const sh = TP(1, 0);
    const hc = add(sh, U(p.lean + p.head + (sp.hunch ? 0.1 : 0)), B.neck + B.hr);
    const fsh = TP(0.95, 0.012), bsh = TP(0.96, -0.022);
    const fel = add(fsh, D(p.fs), B.ua), fha = add(fel, D(p.fe), B.fa);
    let bel = add(bsh, D(p.bs), B.ua), bha = add(bel, D(p.be), B.fa);
    if (sp.two) {
      // 雙手兵器：後手抓在桿上
      const tgt = add(fha, D(p.w), -(sp.grip2 || 0.22));
      const r = ik(bsh, tgt, B.ua, B.fa, true);
      bel = r.knee; bha = r.foot;
    }
    const fhip = TP(0.02, 0.018), bhip = TP(0.02, -0.02);
    const fl = ik(fhip, p.ff, B.th, B.sh), bl = ik(bhip, p.bf, B.th, B.sh);
    return {TP, u, n, hip, sh, hc, fsh, bsh, fel, fha, bel, bha, fhip, bhip, fk: fl.knee, ffo: fl.foot, bkn: bl.knee, bfo: bl.foot};
  }

  /* ---- 物理：彩帶、馬尾、鬍鬚、鎖鍊（螢幕座標的 verlet 鏈） ---- */
  function chain(A, key, anchor, n, seg, opt) {
    opt = opt || {};
    if (A.lite) { const ch0 = A.phys && A.phys[key]; if (ch0 && ch0.length === n) { const dx = anchor[0] - ch0[0].x, dy = anchor[1] - ch0[0].y; return ch0.map(q => [q.x + dx, q.y + dy]); } const out = []; for (let i = 0; i < n; i++) out.push([anchor[0] - A.side * i * seg * 0.7, anchor[1] + i * seg * 0.7]); return out; }
    let ch = A.phys[key];
    if (!ch || ch.length !== n) { ch = A.phys[key] = []; for (let i = 0; i < n; i++) ch.push({x: anchor[0] - A.side * i * seg * 0.7, y: anchor[1] + i * seg * 0.7, px: anchor[0] - A.side * i * seg * 0.7, py: anchor[1] + i * seg * 0.7}); }
    ch[0].x = ch[0].px = anchor[0]; ch[0].y = ch[0].py = anchor[1];
    if (A.dt > 0) {
      const g = (opt.g == null ? 0.42 : opt.g) * A.S / 170, damp = opt.damp || 0.9;
      const wind = (opt.wind == null ? 0.18 : opt.wind) * A.S / 170 * (0.6 + 0.4 * sin(A.t * 2.1 + key.length));
      for (let i = 1; i < n; i++) {
        const q = ch[i]; const vx = (q.x - q.px) * damp, vy = (q.y - q.py) * damp;
        q.px = q.x; q.py = q.y; q.x += vx - wind - A.side * (opt.back || 0) * A.S / 170; q.y += vy + g;
        if (opt.orbit) { const a0 = A.t * opt.orbit + i * 0.25, rr = seg * i * 0.95; const tx = anchor[0] + cos(a0) * rr, ty = anchor[1] - seg * 0.6 + sin(a0) * rr * 0.4; q.x += (tx - q.x) * 0.5; q.y += (ty - q.y) * 0.5; }
        if (opt.floor != null && q.y > opt.floor) q.y = opt.floor;
      }
      for (let it = 0; it < 3; it++) for (let i = 1; i < n; i++) {
        const a = ch[i - 1], b = ch[i]; let dx = b.x - a.x, dy = b.y - a.y; const d = hypot(dx, dy) || 1e-6; const k = (d - seg) / d;
        if (i === 1) { b.x -= dx * k; b.y -= dy * k; } else { a.x += dx * k * 0.5; a.y += dy * k * 0.5; b.x -= dx * k * 0.5; b.y -= dy * k * 0.5; }
      }
    }
    return ch.map(q => [q.x, q.y]);
  }

const FX = (() => {

    c = cv.getContext('2d'); resize(); window.addEventListener('resize', resize);
  }
  function resize() { const r = app.getBoundingClientRect(); W = r.width; H = r.height; dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function loop() {
    c.clearRect(0, 0, W, H);

    for (const p of parts) {
      p.life -= 1; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag;
      const a = Math.max(0, p.life / p.max);
      if (p.kind === 'line') { c.strokeStyle = p.col.replace('A', a.toFixed(3)); c.lineWidth = p.w; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); c.stroke(); }
      else if (p.kind === 'flake') { c.fillStyle = p.col.replace('A', (a * 0.8).toFixed(3)); c.save(); c.translate(p.x, p.y); c.rotate(p.rot += p.vr); c.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); c.restore(); }
      else { c.fillStyle = p.col.replace('A', a.toFixed(3)); c.beginPath(); c.arc(p.x, p.y, p.r * (0.6 + a * 0.4), 0, 7); c.fill(); }

  }
  function add(p) { parts.push(p); if (!running) { running = true; requestAnimationFrame(loop); } }
  function burst(x, y, o) {
    o = o || {};
    const n = o.n || 18, col = o.col || 'rgba(120,20,12,A)';
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (o.speed || 5) * (0.4 + Math.random());
      const life = 26 + Math.random() * 22;
      add({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 1.5), g: o.g == null ? 0.25 : o.g, drag: 0.96, r: (o.r || 3) * (0.5 + Math.random()), life, max: life, col, kind: o.kind || 'dot', w: o.w || 2, rot: 0, vr: (Math.random() - 0.5) * 0.3});
    }
  }

  }
  function num(el, text, cls, dy) { const p = rel(el); return dom(text, 'fnum ' + (cls || ''), p.x, p.y + (dy || 0) - 10); }
  function numAt(x, y, text, cls) { return dom(text, 'fnum ' + (cls || ''), x, y - 10); }
  function stampAt(x, y, ch, col) { const d = dom(ch, 'stamp', x, y, 950); if (col) d.style.background = col; return d; }
  function stamp(el, ch, col) { const p = rel(el); const d = dom(ch, 'stamp', p.x, p.y - p.h * 0.1, 950); if (col) d.style.background = col; return d; }
  function slash(el, col, wide) {
    const p = rel(el);
    const ang = -30 + Math.random() * 60, len = Math.max(110, p.w * 1.5) * (wide ? 1.4 : 1);
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('class', 'slash'); svg.setAttribute('width', len); svg.setAttribute('height', 40);
    svg.style.left = (p.x - len / 2) + 'px'; svg.style.top = (p.y - 20) + 'px'; svg.style.transform = 'rotate(' + ang + 'deg)';
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M2 22 Q ' + len / 2 + ' ' + (wide ? 2 : 10) + ' ' + (len - 2) + ' 18');
    path.setAttribute('stroke', col || '#fff4e6'); path.setAttribute('stroke-width', wide ? 7 : 4); path.setAttribute('fill', 'none'); path.setAttribute('stroke-linecap', 'round');
    path.style.strokeDasharray = len * 1.2; path.style.strokeDashoffset = len * 1.2; path.style.filter = 'drop-shadow(0 0 6px ' + (col || 'rgba(255,220,180,.9)') + ')';

    path.animate([{strokeDashoffset: len * 1.2, opacity: 1}, {strokeDashoffset: 0, opacity: 1, offset: 0.45}, {strokeDashoffset: 0, opacity: 0}], {duration: 360 / speed, easing: 'ease-out'});
    setTimeout(() => svg.remove(), 420 / speed);

  function flash() { dom('', 'flash', null, null, 500); }
  function banner(text, cls) { const d = dom('<div class="bm">' + text + '</div>', 'banner-mid ' + (cls || ''), null, null, 1150); return d; }

const Store = {

  save() {

  async flush() {

function actName(run) { return run.act === 3 ? ACT3.n : ROUTES[run.route].acts[run.act].n; }
function hudHTML(run) {

function bindHud(root, run) {

}
function compTip(run) {

function showDeck(cards, title, opts) {

function cardTipHTML(ci) {
  const cd = cardDef(ci);

  let h = '<b>' + esc(cd.n) + (ci.up ? '＋' : '') + '</b>　' + (cd.st ? cd.st + '．' : '') + esc(cd.t) + (cd.c != null ? '．內力 ' + cd.c : '') + '<br>' + cardDescHTML(ci).replace(/<b[^>]*>/g, '').replace(/<\/b>/g, '');

}

/* ===== 非一趟鏢內的劇情播放（開場、茶樓、尾聲） ===== */
function playBeats(beats, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    setBg(opts.bg || 'night'); ambient(opts.bg); lastBeat = null;
    $('#screen').innerHTML = '<div class="scene">' + (opts.title ? '<div class="scene-title"><span class="seal" style="background:#7a2416">說</span><span>' + esc(opts.title) + '</span></div>' : '') + '<button class="btn sm ghost scene-skip" id="skipB">略過</button><div id="dlgArea"></div></div>';
    const list = beats.filter(b => !b.fx && (!b.if || (S.run ? Run.cond(S.run, S.meta, b.if) : condNoRun(b.if, opts.ctx))));
    let i = 0;
    const next = () => { if (i >= list.length) return resolve(); showBeat(list[i++], next); };
    $('#skipB').onclick = (e) => { e.stopPropagation(); i = list.length; resolve(); };
    next();
  });
}
function condNoRun(c, ctx) { const m = c.match(/^comp=(\w+)$/); if (m) return ctx && ctx.comp === m[1]; return false; }
let typeTimer = null, lastBeat = null, ambTimer = null;
function stopAmbient() { if (ambTimer) { clearInterval(ambTimer); ambTimer = null; } }
function ambient(bg) { stopAmbient(); if (['nanling', 'yan', 'platform', 'shan', 'night'].indexOf(bg) >= 0) { FX.snow(18); ambTimer = setInterval(() => FX.snow(3), 700); } }
function showBeat(b, onDone) {
  lastBeat = b;
  const area = $('#dlgArea'); if (!area) return;
  const sp = b.s ? SPEAKERS[b.s] : null;
  area.innerHTML = '<div class="dlg" tabindex="0" role="button" aria-label="繼續">' + (sp ? '<div class="spk">' + sealOf(b.s) + '<span class="nm">' + esc(sp.n) + '</span></div>' : '') +
    '<div class="txt' + (sp ? '' : ' narr') + '"></div><div class="more"></div></div>';
  const dlg = $('.dlg', area), txt = $('.txt', area);
  const full = b.t;
  let k = 0, done = false;
  clearInterval(typeTimer);
  const step = S.meta.settings.fast ? 4 : 2;
  typeTimer = setInterval(() => { k += step; txt.textContent = full.slice(0, k); if (k >= full.length) { clearInterval(typeTimer); done = true; } }, 28);
  const go2 = () => {
    if (!done) { clearInterval(typeTimer); txt.textContent = full; done = true; return; }
    Sfx.play('page'); onDone();
  };
  dlg.onclick = go2;
  dlg.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go2(); } };
  dlg.focus({preventScroll: true});
}
function showChoices(list, onPick, hintFn) {
  const area = $('#dlgArea'); if (!area) return;
  let ctx = '';
  if (lastBeat) { const sp = lastBeat.s ? SPEAKERS[lastBeat.s] : null; ctx = '<div class="dlg ctx" style="margin:0 12px 10px">' + (sp ? '<div class="spk">' + sealOf(lastBeat.s) + '<span class="nm">' + esc(sp.n) + '</span></div>' : '') + '<div class="txt' + (sp ? '' : ' narr') + '">' + esc(lastBeat.t) + '</div></div>'; }
  area.innerHTML = ctx + '<div class="choices">' + list.map((o, i) => {
    const t = o.c ? o.c.t : o.t;
    const key = /揭穿|當眾宣讀|放了他|殺了他|交給|跟弦走|不交/.test(t);
    const hint = hintFn ? hintFn(o) : '';
    return '<button class="choice' + (key ? ' key' : '') + '" data-i="' + i + '">' + esc(t) + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</button>';
  }).join('') + '</div>';
  $$('.choice', area).forEach(b => b.onclick = () => { Sfx.play('xingmu'); onPick(list[+b.dataset.i].k != null ? list[+b.dataset.i].k : +b.dataset.i); });
}

/* ===== 一趟鏢內的畫面 ===== */
function renderRun() {
  const run = S.run;
  const t = run.screen.t;
  if (t === 'effs') { const n = Flow.runEffsScreen(run, S.meta); save(); notesToast(n); return renderRun(); }
  const F = {scene: renderScene, map: renderMap, combat: () => CombatUI.render(), reward: renderReward, shop: renderShop, inn: renderInn, event: renderEvent, pick: renderPick, actEnd: renderActEnd, ending: renderEnding, dead: renderDead};
  (F[t] || renderMap)();
}

function renderScene() {
  const run = S.run, scr = run.screen, sc = SCENES[scr.id];
  lastBeat = null;
  setBg(sc.bg || 'night'); Sfx.music('scene'); ambient(sc.bg);
  $('#screen').innerHTML = '<div class="scene"><div class="scene-title"><span class="seal" style="background:#7a2416">' + esc((sc.title || '　')[0]) + '</span><span>' + esc(sc.title || '') + '</span></div><button class="btn sm ghost scene-skip" id="skipB">略過</button><div id="dlgArea"></div></div>';
  $('#skipB').onclick = (e) => { e.stopPropagation(); sceneSkip(); };
  if (S.runIntro) {
    const ri = S.runIntro; S.runIntro = null;
    const beats = [{s: 'teller', t: '（醒木一拍）' + TEAHOUSE.routeStart[ri.route] + (TEAHOUSE.compStart[ri.comp] || '')}];
    let i = 0; const nx = () => { if (i < beats.length) showBeat(beats[i++], nx); else sceneAdvance(); }; nx();
    return;
  }
  sceneAdvance();
}
function sceneAdvance() {
  const r = Flow.sceneStep(S.run, S.meta);
  save();
  notesToast(r.notes);
  if (r.beat) showBeat(r.beat, () => { Flow.sceneTap(S.run); sceneAdvance(); });
  else if (r.choices) showChoices(r.choices, (k) => { const n = Flow.sceneChoose(S.run, S.meta, k); save(); notesToast(n); sceneAdvance(); });
  else render();
}
function sceneSkip() {
  const all = [];
  for (let g = 0; g < 300; g++) {
    const r = Flow.sceneStep(S.run, S.meta);
    all.push(...(r.notes || []));
    if (r.beat) { Flow.sceneTap(S.run); continue; }
    save(); notesToast(all);
    if (r.choices) { showChoices(r.choices, (k) => { const n = Flow.sceneChoose(S.run, S.meta, k); save(); notesToast(n); sceneAdvance(); }); return; }
    render(); return;
  }
}

/* ===== 地圖 ===== */
const NODE_G = {fight: '戰', elite: '險', event: '奇', shop: '市', inn: '棧', story: '劇', boss: '首', finale: '終'};
const NODE_N = {fight: '打鬥', elite: '精英', event: '奇遇', shop: '市集', inn: '客棧', story: '劇情', boss: '首領', finale: '終局'};
function renderMap() {
  const run = S.run, m = run.map;
  const bgType = run.act === 3 ? 'yan' : run.route + (run.act === 2 ? '2' : '');
  setBg(bgType); Sfx.music('map');
  const rows = m.rows.length, gap = 112, padTop = 90, padBot = 110;
  const H = padTop + padBot + gap * (rows - 1);
  const avail = Run.availableNodes(run);
  const isAvail = n => avail.indexOf(n) >= 0;
  const yOf = r => padTop + gap * (rows - 1 - r);
  let lines = '';
  m.rows.forEach((row, r) => row.forEach(n => n.next.forEach(j => {
    const b = m.rows[r + 1][j];
    const walked = n.visited && b.visited;
    const live = m.cur && m.cur.row === r && m.cur.idx === n.idx;
    lines += '<line x1="' + (n.x * 100) + '%" y1="' + yOf(r) + '" x2="' + (b.x * 100) + '%" y2="' + yOf(r + 1) + '" stroke="' + (walked ? '#d6a54d' : live ? '#e9dfc9' : 'rgba(220,210,190,.25)') + '" stroke-width="' + (walked || live ? 3 : 2) + '" stroke-dasharray="' + (walked ? '0' : '6 7') + '" stroke-linecap="round"/>';
  })));
  let nodes = '';
  m.rows.forEach((row, r) => row.forEach(n => {
    let type = n.type;
    let g = NODE_G[type], lab = NODE_N[type];
    if (n.q) { if (n.real && (n.visited || m.revealed)) { type = n.real; g = NODE_G[type]; lab = NODE_N[type]; } else { g = '？'; lab = '未知'; type = 'event'; } }
    if (n.type === 'story') lab = r === 0 ? (run.act === 3 ? '雁門' : '劇情') : '劇情';
    const cur = m.cur && m.cur.row === r && m.cur.idx === n.idx;
    const cls = ['node', 't-' + type, n.visited ? 'visited' : '', isAvail(n) ? 'avail' : '', cur ? 'cur' : ''].join(' ');
    nodes += '<button class="' + cls + '" data-r="' + r + '" data-i="' + n.idx + '" style="left:' + (n.x * 100) + '%;top:' + yOf(r) + 'px" aria-label="' + lab + '"' + (isAvail(n) ? '' : ' tabindex="-1"') + '>' + g + '<span class="nl">' + lab + '</span></button>';
  }));
  const cur = m.cur ? m.rows[m.cur.row][m.cur.idx] : null;
  const cart = cur ? '<div style="position:absolute;left:' + (cur.x * 100) + '%;top:' + yOf(cur.row) + 'px">' + Art.CART + '</div>' : '';
  $('#screen').innerHTML = hudHTML(run) + '<div class="map-wrap"><div class="map-scroll scroll" id="mapS"><div class="map-inner" style="height:' + H + 'px"><svg class="map-svg">' + lines + '</svg>' + nodes + cart + '</div></div></div>' +
    '<div class="map-foot">' + partyMini(run) + '</div>';
  bindHud($('#screen'), run);
  $$('.node.avail').forEach(b => b.onclick = () => {
    const n = m.rows[+b.dataset.r][+b.dataset.i];
    Sfx.play('xingmu');
    Flow.enterNode(run, S.meta, n); save(); render();
  });
  const ms = $('#mapS');
  const target = cur ? yOf(cur.row) : H;
  ms.scrollTop = Math.max(0, target - ms.clientHeight * 0.62);
}

function pickCards(cards, n, title, done) {
  const sel = new Set();
  const body = '<div class="cards-grid">' + cards.map(c => '<div class="cardwrap" data-uid="' + c.uid + '" style="cursor:pointer">' + cardHTML(c) + '</div>').join('') + '</div><div style="display:flex;justify-content:center;margin-top:14px"><button class="btn zhu" id="pkOk" disabled>確定</button></div>';
  const m = modal(title, body);
  const ok = $('#pkOk', m);
  $$('.cardwrap', m).forEach(w => w.onclick = () => {
    const uid = +w.dataset.uid;
    if (sel.has(uid)) sel.delete(uid); else { if (sel.size >= n) { const f = sel.values().next().value; sel.delete(f); } sel.add(uid); }
    $$('.cardwrap', m).forEach(x => $('.card', x).classList.toggle('sel', sel.has(+x.dataset.uid)));
    ok.disabled = sel.size === 0;
  });
  ok.onclick = () => { closeModal(); done(Array.from(sel)); };
}

function hubLine() {
  const meta = S.meta;
  const pool = TEAHOUSE.idle.slice();
  const rr = meta.routesRun;
  ['guan', 'shan', 'shui'].forEach(r => { if (!rr[r] && meta.runs > 0) pool.push(TEAHOUSE.hints[r], TEAHOUSE.hints[r]); });
  if (meta.runs > 1) { if (!knows(meta, 'D2')) pool.push(TEAHOUSE.hints.noD2); if (!knows(meta, 'D3')) pool.push(TEAHOUSE.hints.noD3); if (!knows(meta, 'D6')) pool.push(TEAHOUSE.hints.noD6); }
  if (!meta.runs) return '<span class="who">小六：</span>白先生講這個故事講了二十年。故事一樣，結局從來沒有一晚是一樣的。';
  if (meta.lastSummary && Math.random() < 0.35) {
    const ls = meta.lastSummary;
    if (ls.type === 'death') return '<span class="who">老蔡：</span>昨晚魏子葳死在第' + cnNum(ls.act) + '折！白先生，你怎麼講的？';
    if (ls.ending) return '<span class="who">書生：</span>昨晚的結局是「' + ENDINGS[ls.ending].n + '」。……真的就這樣嗎？';
  }
  const [s, t] = pool[Math.floor(Math.random() * pool.length)];
  return '<span class="who">' + esc(SPEAKERS[s].n) + '：</span>' + esc(t);
}
async function revealDeductions() {
  const meta = S.meta;
  while (meta.newDeductions.length) {
    const id = meta.newDeductions[0];
    const d = DEDUCTIONS[id];
    const pair = d.need.find(p => p.every(c => hasClueMeta(meta, c)));
    await new Promise(res => {
      const el = document.createElement('div'); el.className = 'reveal';
      el.innerHTML = '<div class="rv"><div class="rk">推 論 成 立</div><div class="pair">' + pair.map(c => clueCard(c)).join('<span class="f-d" style="font-size:26px;color:var(--jin)">＋</span>') + '</div>' +
        '<h2 class="rn">' + esc(d.n) + '</h2><div class="rs"><span class="muted">書生：</span>' + esc(d.say) + '</div><div class="ru">往後的說法裡：' + esc(d.unlock) + '</div><button class="btn jin" style="margin-top:6px">記下了</button></div>';

  const enemy = (uid) => cs() && cs().enemies.find(e => e.uid === uid);

  /* ===== 選牌、目標 ===== */
  function selTarget() {
    const c = cs(); const ci = c.hand.find(x => x.uid === sel); if (!ci) return null;
    const cd = cardDef(ci); if (cd.tg !== 'e') return null;
    const live = Combat.live(c); return live.length === 1 ? live[0] : null;
  }
  function comboNext(ci) {
    const c = cs(); if (!c.tf) return [];
    const P = c.tf.played; const cd = cardDef(ci); const out = [];
    for (const kid of c.comboSet) {
      if (c.tf.combos[kid]) continue;
      const k = COMBOS.find(x => x.id === kid); const L = k.seq.length;
      const match = (tok, p) => tok[0] === '@' ? (p.o === tok.slice(1, tok.length - 1) && p.st === tok[tok.length - 1]) : p.id === tok;
      for (let j = L - 1; j >= 1; j--) {
        if (P.length < j) continue;
        const tail = P.slice(P.length - j);
        if (tail.every((p, i) => match(k.seq[i], p)) && match(k.seq[j], {id: ci.id, o: cd.o, st: cd.st})) { out.push({k, step: j + 1, L}); break; }
      }
    }
    return out;
  }
  function wouldBreak(ci, target) {
    const c = cs(); const cd = cardDef(ci);
    let list = Combat.stanceTargets(c, cd, target);
    const chai = cd.ops.some(o => /^chai/.test(o[0]));
    if (chai) {
      if (cd.ops.some(o => o[0] === 'chaiAll')) list = Combat.live(c).filter(e => e.intent && !e.intent.broken && e.intent.p != null);
      else if (cd.ops.some(o => o[0] === 'chaiBest')) { const b = Combat.chaiBest(c); if (b && list.indexOf(b) < 0) list = list.concat([b]); }
      else if (target && target.intent && !target.intent.broken && target.intent.p != null && list.indexOf(target) < 0) list = list.concat([target]);
    }
    return list;
  }
  function onCard(uid) {

      ['.fnote .nrow', '<b>守剋攻、攻剋變、變剋守。</b>打出剋制牠的牌，菱形（架勢點）就少一個。歸零就<b>破招</b>：兵器脫手、那招作廢，還會露出破綻。'],
      ['#handZone', '點一張牌看說明，再點一次（或點敵人）出招。內力在左邊的金錢裡，每回合 3 點。'],
      ['.ctl', '破招會攢<b>氣</b>。氣滿了，點右邊的金色按鈕，和同伴使出<b>合擊</b>。攻、守、變各打一張還有<b>三才</b>獎勵。'],

      const [selr, html] = steps[i]; const el = $(selr); if (!el) { i++; return show(); }
      showTip(el, html + '<br><span class="faint" style="font-size:12px">點任何地方繼續（' + (i + 1) + '/' + steps.length + '）</span>');

  function flatOps(ops, out) { out = out || []; (ops || []).forEach(o => { out.push(o[0]); o.forEach(x => { if (Array.isArray(x) && Array.isArray(x[0])) flatOps(x, out); else if (Array.isArray(x) && typeof x[0] === 'string' && x !== o) flatOps([x], out); }); }); return out; }
  function cardKind(cd) {
    const ks = flatOps(cd.ops);
    if (ks.indexOf('pupAtk') >= 0) return 'puppet';
    if (ks.some(k => k === 'bomb' || k === 'bombAll')) return 'bomb';
    if (ks.some(k => /^detonate/.test(k)) && !ks.some(k => /^dmg/.test(k))) return 'fire';
    if (cd.t === '心法') return 'power';
    const dm = ks.filter(k => /^(dmg|xdmg|execute|detonate)/.test(k));
    if (dm.some(k => /All/.test(k)) || (dm.length && cd.tg !== 'e')) return 'atkAll';
    if (dm.length) return 'atk';
    const chai = ks.some(k => /^chai/.test(k)), block = ks.some(k => /^block/.test(k) || k === 'guard' || k === 'pupArmor');
    if (chai && cd.tg === 'e') return 'chai';

    if (chai) return 'chaiAll';

        Stage.hold(uid); Stage.poseFor(uid, m.pose || 'cast', 150);
        if (m.fx === 'bell') { Stage.ringWaves(uid, 'back', Stage.COL.gold, 4); Sfx.play('clang'); teller('鈴聲一響，地底下有東西爬了起來。', 2000); }
        else if (m.fx === 'whistle') { Stage.ringWaves(uid, 'head', Stage.COL.ink, 3); teller('一聲尖哨。樹梢上，有人應了。', 2000); }
        else if (m.fx === 'roar') { Stage.roar(uid); const a = Stage.actor(uid); if (a) Stage.shock(a.home.x, a.home.y, 'rgba(62,80,48,.7)'); }
        else if (m.fx === 'gears') { const p = Stage.anchorOf(uid, 'chest'); if (p) Stage.sparks(p[0], p[1], 16); Sfx.play('clang'); teller('機括聲一響，又放下一個人偶。', 2000); }
        await Stage.wait(320); break;
      }
      case 'steal': {
        Stage.hold(uid); Stage.poseFor(uid, 'cast', 150); Stage.paper(uid, 26, 220); await Stage.wait(300); break;
      }
      case 'sweep': Stage.hold(uid); Stage.poseFor(uid, 'chainSpin', 140); await Stage.wait(260);
        if (!flatOps(ENEMIES[e.id].moves[d.mv].ops).some(x => x === 'atk')) { Stage.poseFor(uid, 'chainThrow', 80); await Stage.chainSweep(uid, tgts, 520); }
        break;
      case 'wave': Stage.hold(uid); Stage.poseFor(uid, 'windHigh', 140); await Stage.wait(220); break;
      case 'moon': { const a = Stage.actor(uid); if (a) a.arc = sz.SC * 0.35; await Stage.approach(uid, tgt === 'all' ? 'wei' : tgt, 'windHigh'); break; }
      case 'paper': Stage.hold(uid); Stage.poseFor(uid, 'cast', 150); Stage.paperStorm(30); await Stage.wait(300); break;
      default: Stage.hold(uid); Stage.poseFor(uid, 'cast', 160); await Stage.wait(260);
    }
  }
  async function onEnemyStrike(d) {
    if (!cur || !cur.foe || cur.actor !== d.uid) return;
    const k = cur.kind, m = cur.m, uid = d.uid;
    if (k === 'melee') { const ks = m.s || ['high']; await Stage.swing(uid, ks[cur.hits % ks.length], {col: m.col || null}); if (m.big) Stage.bigSlash(-1); }
    else if (k === 'ranged') { Stage.poseFor(uid, 'release', 50); await Stage.arrow(uid, d.key); Stage.poseFor(uid, m.pose || 'aim', 140); }
    else if (k === 'throw') { Stage.poseFor(uid, 'strikeHigh', 70); await Stage.proj(uid, d.key, m.proj || 'dart'); Stage.poseFor(uid, 'windHigh', 120); }
    else if (k === 'hook') { Stage.poseFor(uid, 'strikeHigh', 70); await Stage.chainThrow(uid, d.key, {head: 'hook', white: m.white, hold: 160, dur: m.big ? 280 : 220}); if (m.big) Stage.bigSlash(-1); }
    else if (k === 'chain') { Stage.poseFor(uid, 'chainThrow', 70); await Stage.chainThrow(uid, d.key); }
    else if (k === 'verdict') { Stage.poseFor(uid, 'writeDown', 80); const p = Stage.anchorOf(d.key, 'chest'); if (p) Stage.dropChar('chg-' + uid, p[1]); await Stage.wait(170); Stage.bigSlash(-1); }
    else if (k === 'wave') { if (!cur.waved) { cur.waved = 1; Stage.poseFor(uid, 'strikeHigh', 90); await Stage.wave(-1, 760); } }
    else if (k === 'sweep') { if (!cur.swept) { cur.swept = 1; Stage.poseFor(uid, 'chainThrow', 80); await Stage.chainSweep(uid, heroKeys(), 520); } }
    else if (k === 'moon') { Stage.poseFor(uid, 'strikeHigh', 70); const p = Stage.anchorOf(d.key, 'chest'); const sz = Stage.size(); if (p) Stage.crescent(p[0], p[1] - sz.SC * 0.1, sz.SC * 0.55, -1); Stage.invert(60); await Stage.wait(140); }
    else if (k === 'paper') { if (!cur.papered) { cur.papered = 1; Stage.paperStorm(40); Stage.bigSlash(0, 'white'); await Stage.wait(260); } }
    else { await Stage.swing(uid, 'high'); }
    cur.hits++;
    // 寫在頭頂的字落下來（索命）
    const chg = CHARGE[cur.key];
    if (chg && chg.at === 'target' && k !== 'verdict' && Stage.charAt('chg-' + uid)) { const p = Stage.anchorOf(d.key, 'chest'); if (p) Stage.dropChar('chg-' + uid, p[1]); await Stage.wait(160); Stage.bigSlash(-1); }
  }
  function onResize() { if (!$('#stagebox')) return; Stage.resize(); layoutOverlay(); }
  return {render: renderCombat, fx, onResize, onEnd: null};
})();

/* 中斷在敵方回合時，從頭讓敵方把回合走完（存檔只會停在玩家回合，這是保險） */
Combat.endTurnResume = async function (run, meta, cs, fx) { cs.phase = 'player'; await Combat.endTurn(run, meta, cs, fx); };

/* ---- src/main.js ---- */
/* ===== 開機 ===== */
(function boot() {
  const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
  const start = (data) => {
  try { const rs = getComputedStyle(document.documentElement); if (parseFloat(rs.paddingTop) > 0 || parseFloat(rs.paddingBottom) > 0) document.documentElement.classList.add('rootpad'); } catch (e) {}
    document.documentElement.style.setProperty('--grain', Art.grainURL());
    FX.init();
    const local = Store.loadLocal();
    S.meta = newMeta();
    if (data && data.meta) adoptBlob({v: 1, meta: data.meta, run: data.run});
    else if (local) adoptBlob(local);
    FX.setSpeed(S.meta.settings.fast ? 1.8 : 1);
    S.view = data && data.view ? data.view : 'title';
    render();
    document.addEventListener('pointerdown', () => { S.touched = true; Sfx.init(); Sfx.setMusic(S.meta.settings.music); Sfx.setSfx(S.meta.settings.sfx); }, {capture: true});
    Store.initRemote().then(remote => {
      if (!Store.ref) return;
      const localT = (local && local.t) || 0;
      if (remote && remote.t > localT && !S.touched && (S.view === 'title' || S.view === 'hub')) { adoptBlob(remote); Store.saveLocal(Store.blob()); render(); }
      else save();
    });
    window.addEventListener('resize', debounce(() => {
      FX.resize();
      if (S.busy) return;
      curBg = null;
      if (S.view === 'run' && S.run && S.run.screen.t === 'scene') { setBg(SCENES[S.run.screen.id].bg || 'night'); return; }
      if (S.view === 'run' && S.run && S.run.screen.t === 'combat') { CombatUI.onResize(); return; }
      if (S.view === 'run' || S.view === 'hub' || S.view === 'title') render();
    }, 300));
  };
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({meta: S.meta, run: S.run, view: S.view === 'title' ? 'hub' : S.view}));
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || null);
})();
/* 測試用：網址加上 #debug 時開放內部狀態 */
try { if (location.hash === '#debug') window.__T = {S, Flow, Combat, Run, render, CARDS, cardDef, FX, Stage}; } catch (e) {}

})();
