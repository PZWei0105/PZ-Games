<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>千古一宿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="霧中渡口的一間老客棧，每晚都有不同時代的歷史名人上岸住一晚。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>/* 千古一宿 — 夜渡燈籠紙 */
/* 版面：全螢幕地圖；上方木牌狀態列、下方燈籠工具列；面板是燈籠紙，對話是卷軸 */
:root {
  --night: #0f1626;
  --night-2: #172036;
  --night-3: #222d4a;
  --paper: #f3e6c8;
  --paper-2: #e6d3a8;
  --paper-3: #d6bf8c;
  --ink: #2a1c1a;
  --ink-2: #5a4636;
  --ink-3: #8a735c;
  --lantern: #d4462f;
  --lantern-2: #ff8a4c;
  --seal: #b5302a;
  --gold: #e2b456;
  --gold-2: #f6dc96;
  --jade: #3f8f84;
  --jade-2: #6fc2b4;
  --mist: #c9d3dc;
  --good: #6fae5a;
  --bad: #d4553f;
  --wood: #5a3622;
  --wood-2: #3b2216;
  --f-display: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC", "PMingLiU", serif;
  --f-body: "LXGW WenKai TC", "Noto Serif TC", "Kaiti TC", "DFKai-SB", serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--paper); font-family: var(--f-body); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
button { font-family: var(--f-body); color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
.ui { position: absolute; inset: 0; pointer-events: none; }
.ui > * { pointer-events: auto; }

/* ---------- 上方狀態列 ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 8px; padding: calc(var(--safe-t) + 8px) max(16px, var(--safe-r)) 0 max(16px, var(--safe-l)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.plaque { background: linear-gradient(180deg, #6b4128 0%, var(--wood) 45%, var(--wood-2) 100%); border: 1px solid #2a160d; box-shadow: inset 0 1px 0 rgba(255, 220, 170, .22), 0 3px 10px rgba(0, 0, 0, .45); border-radius: 10px; color: var(--gold-2); }
.rankBox { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; flex: none; }
.rankLamp { width: 30px; height: 36px; flex: none; position: relative; }
.rankLamp i { position: absolute; left: 4px; right: 4px; top: 6px; bottom: 2px; border-radius: 9px 9px 11px 11px; background: radial-gradient(circle at 50% 45%, #ffe2a0 0%, #ff9a4a 38%, var(--lantern) 72%, #8a2016 100%); box-shadow: 0 0 calc(6px + var(--glow, 4) * 2px) rgba(255, 150, 70, .75); }
.rankLamp b { position: absolute; left: 12px; top: 0; width: 6px; height: 6px; background: #2a160d; border-radius: 2px; }
.rankTxt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rankName { font-family: var(--f-display); font-weight: 900; font-size: 15px; letter-spacing: .08em; white-space: nowrap; }
.fameBar { width: 92px; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, .45); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .6); }
.fameBar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--gold-2)); transition: width .6s ease; }
.hudMid { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 60px); display: flex; justify-content: center; }
.hud .grow { flex: 1; }
@media (min-width: 720px) { .hudMid { position: static; transform: none; flex: 1; } .hud .grow { display: none; } }
.clock { padding: 5px 12px; font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .06em; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.clock small { font-family: var(--f-body); font-weight: 400; color: var(--paper-2); font-size: 12px; }
.res { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
.chip { display: flex; align-items: center; gap: 5px; padding: 3px 10px 3px 6px; font-family: var(--f-display); font-weight: 900; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip .ic { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.ic.coin { background: radial-gradient(circle at 35% 35%, #fff2b0, var(--gold) 55%, #a8741e); box-shadow: inset 0 0 0 2px rgba(120, 70, 10, .35); position: relative; }
.ic.coin::after { content: ""; position: absolute; inset: 5px; border: 1.5px solid rgba(110, 60, 10, .55); border-radius: 2px; }
.ic.insp { background: radial-gradient(circle at 40% 35%, #e6f6ff, #8cc7e8 55%, #3f6f9a); box-shadow: 0 0 6px rgba(150, 210, 255, .6); }
.ic.wine { background: radial-gradient(circle at 40% 35%, #f0c48a, #a86a3a 60%, #5a3420); border-radius: 40% 40% 45% 45%; }
.chip.flash { animation: chipFlash .5s ease; }
@keyframes chipFlash { 30% { transform: scale(1.12); filter: brightness(1.4); } }
.gearBtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-size: 17px; }

/* ---------- 夜晚：速度 ---------- */
.speed { position: absolute; right: max(16px, var(--safe-r)); top: calc(var(--safe-t) + 92px); display: flex; flex-direction: column; gap: 6px; padding: 6px; }
.speed button { width: 40px; height: 34px; border-radius: 8px; font-family: var(--f-display); font-weight: 900; font-size: 13px; color: var(--gold-2); background: rgba(0, 0, 0, .25); }
.speed button.on { background: var(--gold); color: var(--wood-2); box-shadow: 0 0 10px rgba(240, 190, 90, .5); }
.speed .pause.on { background: var(--jade); color: #fff; }

/* ---------- 下方工具列 ---------- */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(16px, var(--safe-r)) calc(var(--safe-b) + 10px) max(16px, var(--safe-l)); display: flex; justify-content: center; pointer-events: none; }
.dockIn { pointer-events: auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; gap: 4px; width: 100%; max-width: 520px; padding: 8px 8px 6px; position: relative; }
.dockBtn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; border-radius: 10px; color: var(--paper); font-size: 12px; letter-spacing: .04em; position: relative; min-width: 0; }
.dockBtn .glyph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 19px; color: var(--wood-2); background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%); box-shadow: inset 0 -3px 0 var(--paper-3), 0 3px 8px rgba(0, 0, 0, .4); transition: transform .12s; }
.dockBtn:active .glyph { transform: translateY(2px) scale(.96); }
.dockBtn .dot { position: absolute; top: 0; right: calc(50% - 26px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--seal); color: #fff; font-size: 10px; font-family: var(--f-display); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--night); }
.dockBtn.lit .glyph { background: linear-gradient(180deg, #ffd27a, #e8963a); }
.lightBtn { position: relative; justify-self: center; transform: translateY(-14px); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lightBtn .lamp { width: 64px; height: 74px; position: relative; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); }
.lightBtn .lamp::before { content: ""; position: absolute; left: 6px; right: 6px; top: 12px; bottom: 4px; border-radius: 24px 24px 28px 28px; background: radial-gradient(circle at 50% 42%, #fff1c0 0%, #ffb35a 32%, var(--lantern) 66%, #7a1c12 100%); box-shadow: 0 0 22px rgba(255, 140, 60, .7), inset 0 -6px 10px rgba(80, 10, 0, .4); animation: lampBreath 2.6s ease-in-out infinite; }
.lightBtn .lamp::after { content: "點燈"; position: absolute; inset: 22px 0 0; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: 15px; color: #5a1408; letter-spacing: .12em; text-shadow: 0 1px 0 rgba(255, 220, 160, .6); }
.lightBtn .cap { position: absolute; left: 22px; right: 22px; top: 4px; height: 10px; background: var(--wood-2); border-radius: 3px; }
.lightBtn .cap2 { position: absolute; left: 22px; right: 22px; bottom: 0; height: 8px; background: var(--wood-2); border-radius: 3px; }
.lightBtn span.lbl { font-size: 11px; color: var(--gold-2); white-space: nowrap; }
@keyframes lampBreath { 50% { box-shadow: 0 0 34px rgba(255, 160, 70, .95), inset 0 -6px 10px rgba(80, 10, 0, .4); } }
.dock.night .dockIn { grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr; }
.nightPlay { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 4px; transform: translateY(-8px); }
.nightPlay .ring { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #ffe0a0, #e8963a 60%, #a85a1e); box-shadow: 0 0 18px rgba(255, 160, 70, .55), inset 0 -4px 0 rgba(90, 30, 0, .35); color: #5a1408; font-size: 18px; font-weight: 900; }
.nightPlay.paused .ring { background: radial-gradient(circle at 50% 40%, #b8f0e0, #4f9a8c 60%, #2a5a50); color: #fff; box-shadow: 0 0 18px rgba(110, 220, 190, .5), inset 0 -4px 0 rgba(0, 40, 30, .35); animation: lampBreath 2s ease-in-out infinite; }
.nightPlay .lbl { font-size: 11px; color: var(--gold-2); }

/* ---------- 浮動訊息 ---------- */
.feed { position: absolute; left: max(16px, var(--safe-l)); top: calc(var(--safe-t) + 102px); display: flex; flex-direction: column; gap: 6px; width: min(78vw, 330px); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 10px; background: rgba(20, 26, 44, .88); border: 1px solid rgba(230, 200, 140, .25); box-shadow: 0 4px 14px rgba(0, 0, 0, .45); color: var(--paper); font-size: 13px; line-height: 1.35; animation: toastIn .3s ease; }
.toast.tense { border-color: rgba(230, 90, 60, .7); background: rgba(60, 20, 18, .9); }
.toast.legend { border-color: rgba(240, 200, 100, .9); background: linear-gradient(90deg, rgba(90, 60, 10, .95), rgba(40, 26, 10, .92)); }
.toast.wish { border-color: rgba(140, 210, 255, .7); }
.toast.out { animation: toastOut .3s ease forwards; }
.toast canvas, .toast .pf { width: 34px; height: 34px; border-radius: 8px; background: var(--night-3); flex: none; image-rendering: pixelated; }
.toast b { color: var(--gold-2); font-weight: 700; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-14px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-14px); } }

/* ---------- 底部面板（燈籠紙） ---------- */
.sheetWrap { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 8, 16, .35); opacity: 0; transition: opacity .2s; padding: 0 max(0px, var(--safe-r)) 0 max(0px, var(--safe-l)); }
.sheetWrap.on { opacity: 1; }
.sheetWrap.clear { background: transparent; pointer-events: none; }
.sheetWrap.clear .sheet { pointer-events: auto; }
.sheet { width: 100%; max-width: 560px; max-height: min(74vh, 640px); display: flex; flex-direction: column; background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0; box-shadow: 0 -6px 30px rgba(0, 0, 0, .5); transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .9, .25, 1); position: relative; overflow: hidden; }
.sheetWrap.on .sheet { transform: none; }
.sheet::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 60% at 50% 0%, rgba(255, 250, 235, .7), transparent 60%), repeating-linear-gradient(90deg, rgba(120, 90, 50, .04) 0 2px, transparent 2px 7px), repeating-linear-gradient(0deg, rgba(120, 90, 50, .035) 0 1px, transparent 1px 9px); }
.sheet > * { position: relative; }
.sheetHead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid rgba(90, 70, 54, .18); }
.sheetHead h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 19px; letter-spacing: .06em; text-wrap: balance; flex: 1; min-width: 0; }
.sheetHead .sub { font-size: 12px; color: var(--ink-3); }
.xBtn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); font-size: 20px; flex: none; background: rgba(90, 70, 54, .08); }
.grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(90, 70, 54, .25); margin: 8px auto -2px; }
.sheetBody { padding: 12px 16px calc(16px + var(--safe-b)); overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; flex-direction: column; gap: 12px; }
.sheetBody p { margin: 0; line-height: 1.6; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--ink-3); font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 11px; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: var(--paper); background: linear-gradient(180deg, #e0583e, var(--seal)); box-shadow: inset 0 -3px 0 rgba(80, 10, 0, .35), 0 2px 6px rgba(80, 30, 10, .3); transition: transform .1s; white-space: nowrap; }
.btn:active { transform: translateY(1px) scale(.98); }
.btn.alt { color: var(--ink); background: linear-gradient(180deg, #fff4dc, var(--paper-2)); box-shadow: inset 0 -3px 0 var(--paper-3), 0 2px 6px rgba(80, 30, 10, .2); }
.btn.jade { background: linear-gradient(180deg, #55a99c, var(--jade)); box-shadow: inset 0 -3px 0 rgba(0, 40, 30, .35), 0 2px 6px rgba(0, 40, 30, .3); }
.btn.gold { color: var(--wood-2); background: linear-gradient(180deg, var(--gold-2), var(--gold)); box-shadow: inset 0 -3px 0 #a8741e, 0 2px 6px rgba(80, 50, 0, .3); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn[disabled], .btn.off { filter: grayscale(.8) brightness(.9); opacity: .55; pointer-events: none; }
.btn .cost { font-size: 12px; font-weight: 700; opacity: .9; font-variant-numeric: tabular-nums; }
.grow { flex: 1; }

/* 卡片與清單 */
.card { background: rgba(255, 252, 240, .55); border: 1px solid rgba(120, 90, 50, .18); border-radius: 12px; padding: 10px 12px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255, 252, 240, .55); border: 1px solid rgba(120, 90, 50, .16); min-width: 0; }
.li .grow { min-width: 0; }
.li h4 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 15px; letter-spacing: .03em; }
.li .t { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; }
.pf { width: 48px; height: 48px; flex: none; border-radius: 10px; background: radial-gradient(circle at 50% 30%, #3a4a6a, #1c2438); image-rendering: pixelated; display: block; box-shadow: inset 0 0 0 2px rgba(240, 210, 150, .35); }
.pf.lg { width: 88px; height: 88px; border-radius: 14px; }
.tag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 999px; font-size: 11.5px; background: rgba(90, 70, 54, .1); color: var(--ink-2); white-space: nowrap; }
.tag.red { background: rgba(181, 48, 42, .14); color: var(--seal); }
.tag.green { background: rgba(80, 140, 70, .16); color: #3f6f30; }
.tag.gold { background: rgba(226, 180, 86, .25); color: #7a5414; }
.tag.blue { background: rgba(60, 120, 170, .14); color: #2f5f88; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.bar { height: 7px; border-radius: 4px; background: rgba(90, 70, 54, .15); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--jade), var(--jade-2)); }
.bar.mood i { background: linear-gradient(90deg, #d46a4a, #e8b84a 50%, #6fae5a); background-size: 300% 100%; }
.needs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.need { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--ink-2); }
.wishBox { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(110, 170, 210, .14), rgba(110, 170, 210, .04)); border: 1px dashed rgba(60, 120, 170, .35); }
.wishBox.done { background: linear-gradient(90deg, rgba(110, 175, 90, .18), rgba(110, 175, 90, .04)); border-style: solid; border-color: rgba(80, 140, 70, .35); }
.wishBox .w { font-size: 14px; line-height: 1.5; color: var(--ink); }
.seal { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 4px; background: var(--seal); color: #fff2e0; font-family: var(--f-display); font-weight: 900; font-size: 12px; transform: rotate(-4deg); box-shadow: 0 1px 0 rgba(0, 0, 0, .2); }
.seal.blue { background: #3f6f9a; }
.seal.green { background: #4f8a3c; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.secT { font-family: var(--f-display); font-weight: 900; font-size: 14px; color: var(--ink-2); letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
.secT::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(90, 70, 54, .3), transparent); }

/* 建造抽屜 */
.tabs { display: flex; gap: 6px; padding: 0 16px; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 8px 14px; border-radius: 999px; font-family: var(--f-display); font-weight: 700; font-size: 14px; color: var(--ink-2); background: rgba(90, 70, 54, .08); white-space: nowrap; }
.tab.on { background: var(--wood); color: var(--gold-2); }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.bitem { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; border-radius: 12px; background: rgba(255, 252, 240, .6); border: 1px solid rgba(120, 90, 50, .16); text-align: center; position: relative; min-width: 0; }
.bitem canvas { width: 72px; height: 64px; image-rendering: pixelated; object-fit: contain; }
.bitem b { font-family: var(--f-display); font-size: 14px; }
.bitem .cost { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; display: flex; gap: 6px; }
.bitem.lock { opacity: .55; }
.bitem .lockTxt { font-size: 12px; color: var(--seal); }
.bitem .own { position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--ink-3); }
.placeBar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 18px); display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: rgba(15, 22, 38, .92); border: 1px solid rgba(230, 200, 140, .3); box-shadow: 0 6px 20px rgba(0, 0, 0, .5); width: min(calc(100vw - 24px), 440px); }
.placeBar .msg { flex: 1; min-width: 0; font-size: 13.5px; color: var(--paper); line-height: 1.4; }
.placeBar .pf { width: 40px; height: 40px; }
.placeBar .msg.bad { color: #ffb4a2; }
.roundBtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 900; color: #fff; flex: none; }
.roundBtn.ok { background: linear-gradient(180deg, #7fc06a, #4f8a3c); box-shadow: inset 0 -3px 0 rgba(0, 40, 0, .3); }
.roundBtn.no { background: linear-gradient(180deg, #e0583e, var(--seal)); box-shadow: inset 0 -3px 0 rgba(80, 10, 0, .35); }
.roundBtn.rot { background: rgba(255, 255, 255, .1); font-size: 13px; }
.roundBtn.off { opacity: .4; pointer-events: none; }
.overlayToggle { position: absolute; left: max(16px, var(--safe-l)); bottom: calc(var(--safe-b) + 92px); display: flex; flex-direction: column; gap: 6px; }

vial"},"writer":"A6"},{"id":"curie_xray","name":"小居禮","icon":"xray","effect":{"type":"heal"},"writer":"A6"},{"id":"edison_bulb","name":"燈泡","icon":"bulb","effect":{"type":"nightMood","v":3},"writer":"A6"},{"id":"tesla_coil","name":"特斯拉線圈","icon":"coil","effect":{"type":"decor","decor":"tesla_coil"},"writer":"A6"},{"id":"tesla_pigeon","name":"白鴿","icon":"pigeon","effect":{"type":"decor","decor":"pigeon"},"writer":"A6"},{"id":"acdc","name":"交直流","icon":"coil","effect":{"type":"insp","v":6},"writer":"S2"},{"id":"napoleon_hat","name":"雙角帽","icon":"bicorne","effect":{"type":"traitMood","trait":"ruler","v":5},"writer":"A7"},{"id":"losers_cups","name":"敗者之觴","icon":"cups","effect":{"type":"sadMood","v":6},"writer":"S2"},{"id":"cleo_pearl","name":"醋中珍珠","icon":"pearl","effect":{"type":"venue","venue":"hall","sales":0.3},"writer":"A7"},{"id":"carpet","name":"那張地毯","icon":"carpet","effect":{"type":"venue","venue":"bath","mood":6},"writer":"S2"},{"id":"caesar_dice","name":"盧比孔的骰子","icon":"dice","effect":{"type":"bet","v":0.3},"writer":"A7"},{"id":"caesar_laurel","name":"桂冠","icon":"laurel","effect":{"type":"fame","v":8},"writer":"A7"},{"id":"chinggis_bow","name":"大汗之弓","icon":"bow","effect":{"type":"venue","venue":"dojo","sales":0.3},"writer":"A7"},{"id":"round_table","name":"萬國圓桌","icon":"table","effect":{"type":"venue","venue":"hall","mood":8},"writer":"MAIN"},{"id":"dream_watch","name":"停走的懷錶","icon":"watch","effect":{"type":"insp","v":4},"writer":"S2"}],"scenes":[{"id":"shijiu","title":"詩酒逢","writer":"S1","cast":{"libai":["s1","s2"],"dufu":["s1"]},"venues":["tavern","garden"],"relic":"libai_poem","outline":"杜甫認出偶像李白，激動到結巴；李白醉醺醺、根本不認識這個無名小子。杜甫把李白的詩一首首背出來，李白愣住、大笑、拉他坐下喝酒。抉擇：掌櫃送上一壺好酒（消耗美酒，結果更好：李白在酒肆牆上題詩）／不打擾讓他們自己喝（仍成知己，但沒有題壁）。史實：744年洛陽相遇，後同遊梁宋，杜甫寫『醉眠秋共被，攜手日同行』。"},{"id":"mengbai","title":"夢李白","writer":"S1","cast":{"libai":["s3"],"dufu":["s2","s3"]},"venues":[],"relic":"two_cups","outline":"史實上兩人745年分別後再沒見過，杜甫寫了很多思念李白的詩（『故人入我夢，明我長相憶』『千秋萬歲名，寂寞身後事』）。在館裡兩個老人重逢。杜甫擔心李白流放，李白還在說笑。抉擇：把涼亭清空讓他們獨處／陪他們喝一杯。苦甜交加，結尾兩隻酒杯留在桌上。"},{"id":"qingping","title":"清平調","writer":"S1","cast":{"libai":["s1","s2","s3"],"yangguifei":["s1"]},"venues":["stage","garden","tavern"],"relic":"qingping","outline":"楊貴妃要一首新詞，李白醉醺醺提筆就寫『雲想衣裳花想容，春風拂檻露華濃』。惡搞高力士脫靴：李白伸腳要人替他脫靴，阿渡冷冷說『自己脫』。抉擇：掌櫃替他磨墨／叫阿渡去脫靴（阿渡翻白眼）。"},{"id":"zhujiu","title":"煮酒論英雄","writer":"S1","cast":{"caocao":["s1"],"liubei":["s1"]},"venues":["tavern","garden"],"relic":"caocao_plum","outline":"曹操溫青梅酒，問天下誰是英雄；劉備列出袁紹、劉表等，曹操一一否定，說『今天下英雄，惟使君與操耳』，劉備嚇得筷子掉了。若當晚是雷雨夜，雷聲正好替他掩飾（聞雷失箸）；若不是，掌櫃可以選擇失手打翻托盤製造巨響替劉備掩護（曹操會多看掌櫃一眼），或什麼都不做（曹操起疑）。條件：雷雨夜或有青梅效果更好。"},{"id":"guayin","title":"掛印封金","writer":"S1","cast":{"guanyu":["s2"],"caocao":["s1","s2","s3"]},"venues":[],"relic":"guanyu_seal","outline":"關羽把曹操送的金銀封好、漢壽亭侯印掛起，請掌櫃轉交，自己要去找大哥。曹操收下時長嘆『雲長真義士也』，攔或不攔？抉擇：掌櫃當面轉交（兩人見最後一面、互敬一杯）／等天亮再讓曹操發現（曹操一個人對著印發呆）。"},{"id":"guagu","title":"刮骨療毒","writer":"S1","cast":{"guanyu":["s3"],"huatuo":["s1","s2"]},"venues":["chess"],"relic":"guanyu_chess","outline":"華佗發現關羽右臂中毒入骨，要刮骨。關羽伸出手臂，一邊跟掌櫃下圍棋一邊喝酒談笑，旁觀的客人嚇到不敢看，刀刮在骨頭上嗤嗤響。小彩蛋：華佗說『總覺得這件事，我本來沒機會做』（演義的時間錯亂）。抉擇：掌櫃故意讓他贏／認真下（關羽反而更高興）。"},{"id":"sangu","title":"三顧茅廬","writer":"S1","cast":{"liubei":["s2"],"zhugeliang":["s1"]},"venues":["teahouse"],"relic":"zgl_fan","outline":"需要劉備第三次在茶室遇到諸葛亮才觸發。前兩次只是短短兩三句（第一次：先生出門了；第二次：先生在睡覺，劉備在旁邊等）。第三次：諸葛亮醒來吟『大夢誰先覺，平生我自知』，提出隆中對、三分天下，劉備如魚得水。抉擇：掌櫃想叫醒他（劉備攔住：讓先生睡）／陪劉備一起等。請同時寫 short1、short2 兩段短戲。"},{"id":"jisheng","title":"既生瑜","writer":"S1","cast":{"zhouyu":["s1","s2"],"zhugeliang":["s1","s2","s3"]},"venues":["chess","teahouse"],"relic":null,"outline":"周瑜挑戰諸葛亮下棋，諸葛亮搖著扇子從容應對，周瑜越下越氣，『既生瑜，何生亮！』喜劇。抉擇：掌櫃偷偷給周瑜使眼色支招（諸葛亮看穿、笑而不語，故意輸一子——周瑜贏了，s2 心願可達成）／不插手（周瑜輸）。結尾掌櫃小聲說：其實正史上的周郎氣度恢弘，是演義冤枉了他。"},{"id":"quwu","title":"曲有誤，周郎顧","writer":"S1","cast":{"zhouyu":["s1","s2"],"mozart":["s1","s2","s3"]},"venues":["stage","music"],"relic":"zhou_gu","outline":"莫札特在台上演奏，聽說台下有個『錯一個音就會回頭』的東方將軍，故意彈錯一個音試他；周瑜立刻回頭。兩人隔著台子大笑，即興合奏（琴與古琴）。抉擇：掌櫃起鬨再錯一次／讓他們合奏到最後。"},{"id":"hongmen","title":"鴻門宴","writer":"S1","cast":{"xiangyu":["s2"],"liubang":["s2"]},"venues":["hall"],"relic":"xiangyu_jade","outline":"宴會廳大場面。項羽設宴，范增（NPC）三次舉玉玦示意，項羽不理；項莊（NPC）拔劍起舞『意在沛公』；劉邦冷汗直流；樊噲（NPC）闖進來大口吃生豬腿。抉擇：掌櫃宣布『本館宴席不許見刀』叫停舞劍（劉邦感激，項羽不太高興）／讓舞劍繼續，劉邦藉口如廁，掌櫃帶他從後門溜到渡口。結尾范增把劉邦送的玉斗摔碎『豎子不足與謀』，碎片留在館裡。NPC 用 who 寫成 npc:范增 等。"},{"id":"sixiangyu","title":"至今思項羽","writer":"S1","cast":{"xiangyu":["s3"],"liqingzhao":["s2"]},"venues":[],"relic":"lqz_poem","outline":"整部遊戲最動人的跨時代場面之一。項羽兵敗、一個人喝悶酒；南渡逃難的李清照認出那雙重瞳。她告訴他：一千多年後，還有人因為他不肯過江東而敬他；她當面念出『生當作人傑，死亦為鬼雄。至今思項羽，不肯過江東』。項羽沉默很久，然後大笑。抉擇：掌櫃說『渡口有船』（項羽：『……不渡了。』）／什麼都不說，替他斟滿酒。極度含蓄，不提死亡細節。"},{"id":"dazhangfu","title":"大丈夫當如此","writer":"S1","cast":{"qinshihuang":["s1","s2"],"liubang":["s1"]},"optional":{"xiangyu":["s1"]},"venues":[],"relic":null,"outline":"秦始皇擺足排場入館（儀仗、黑衣甲士），劉邦醉醺醺看得目瞪口呆：『嗟乎，大丈夫當如此也！』若項羽（s1）也在場，他雙手抱胸：『彼可取而代也。』秦始皇聽見，冷冷回頭。抉擇：掌櫃打圓場『兩位喝多了』／不插手（秦始皇記住了這兩張臉）。項羽的台詞寫成 opt。喜劇加一點寒意。"},{"id":"tuqiong","title":"圖窮匕見","writer":"S1","cast":{"jingke":["s1"],"qinshihuang":["s1"]},"venues":[],"relic":"jingke_map","outline":"荊軻在館裡認出秦王，捧著督亢地圖，請掌櫃『替我把這幅圖送給那位大人』。抉擇：拒絕並說『本館不許動刀』（荊軻沉默、喝酒、唱易水歌，秦王始終不知道）／把圖送去（圖窮匕見！秦王繞著宴會廳的柱子跑，掌櫃情急之下把藥囊砸過去——致敬夏無且；沒有人受傷，天一亮兩人各自回到歷史）。不寫血腥。"},{"id":"chibi","title":"赤壁懷古","writer":"S2","cast":{"sushi":["s1","s2","s3"],"zhouyu":["s1","s2"]},"optional":{"zhugeliang":["s1","s2","s3"]},"venues":["tavern","garden"],"relic":"sushi_chibi","outline":"蘇軾見到周瑜本人，激動地念『遙想公瑾當年，小喬初嫁了，雄姿英發。羽扇綸巾，談笑間，檣櫓灰飛煙滅』；周瑜聽得很受用。若諸葛亮也在場：『羽扇綸巾？那是在下。』學術公案當場爆發。抉擇：掌櫃問蘇軾『您寫的到底是誰』（蘇軾大笑：都是，也都不是）／替周瑜說話。"},{"id":"dianliu","title":"電流之戰","writer":"S2","cast":{"edison":["s2"],"tesla":["s1","s2"]},"venues":["lab"],"relic":"acdc","outline":"愛迪生和特斯拉在工坊比賽：誰能讓萬國館的燈先亮。愛迪生的直流電拉了一堆粗電線；特斯拉的交流電讓燈泡在空中無線發亮。抉擇：選交流電／選直流電／『兩種都用』（兩人都很不爽，但館裡從此燈火通明）。結果不同、遺珍相同。"},{"id":"yuanliang","title":"牛頓，原諒我","writer":"S2","cast":{"einstein":["s1","s2","s3"],"newton":["s1","s2"]},"venues":["tower","study"],"relic":"einstein_note","outline":"愛因斯坦見到偶像牛頓。牛頓講萬有引力，愛因斯坦小心地說時空會彎曲；牛頓不悅。愛因斯坦真心致敬：『牛頓，請原諒我。你走的路，是你那個時代思想與創造力最高的人唯一可能走的路。』（真實引言的意譯）抉擇：讓他們在星空下吵到天亮（靈感大增）／端上一顆蘋果（若有蘋果樹更好笑）。"},{"id":"alps","title":"阿爾卑斯","writer":"S2","cast":{"einstein":["s2","s3"],"curie":["s3"]},"venues":["garden"],"relic":"edelweiss","outline":"兩位老朋友回憶1913年一起在阿爾卑斯山健行：愛因斯坦走到懸崖邊突然抓住居禮夫人的手臂說『我想知道的是，電梯掉進虛空時，乘客到底發生了什麼』。溫暖的友情。抉擇：送壺好茶／讓他們繼續走一圈。"},{"id":"douhua","title":"鬥畫","writer":"S2","cast":{"davinci":["s1","s2","s3"],"michelangelo":["s1","s2"]},"venues":["atelier"],"relic":"douhua_wall","outline":"宿敵相見。米開朗基羅嘲笑達文西『你連一匹銅馬都鑄不出來』（真實軼事）。兩人當場各畫一面牆：達文西畫萬國館的晨霧，米開朗基羅畫館裡的客人肌肉（每個人都被畫得很壯）。抉擇：掛達文西的／掛米開朗基羅的／兩幅並排掛（兩人都氣炸，但客人很愛）。"},{"id":"yingxiong","title":"英雄","writer":"S2","cast":{"beethoven":["s2"],"napoleon":["s2"]},"venues":["stage","music","hall"],"relic":"beethoven_page","outline":"貝多芬在館裡試演新交響曲，扉頁寫著『波拿巴』。他得知面前這位剛把皇冠戴到自己頭上，怒撕扉頁：『他也不過是個凡人！』拿破崙一頭霧水，還想給他頒勳章。抉擇：掌櫃撿起撕掉的扉頁／替拿破崙解釋。"},{"id":"anhun","title":"安魂曲","writer":"S2","cast":{"mozart":["s3"],"beethoven":["s1","s2","s3"]},"venues":["music","stage"],"relic":"requiem","outline":"病重的莫札特在樂坊彈〈落淚之日〉，只寫到第八小節就停住。貝多芬（若是晚年已聾，就把手放在琴上感受振動）聽得落淚。莫札特說『剩下的，交給你們這些年輕人了』。抉擇：勸莫札特去休息／讓他彈到天亮。苦甜。"},{"id":"ditan","title":"地毯裡的女王","writer":"S2","cast":{"cleopatra":["s1"],"caesar":["s1","s2","s3"]},"venues":[],"relic":"carpet","outline":"一卷沉甸甸的地毯被送到凱撒房門口，攤開——埃及豔后滾了出來。凱撒愣住，然後大笑，被她的膽識征服（保持闔家觀賞）。阿渡抱怨這地毯有多重。抉擇：掌櫃親自扛地毯／叫阿渡扛（阿渡碎碎念）。"},{"id":"shuren","title":"兩個輸家","writer":"S2","cast":{"napoleon":["s3"],"xiangyu":["s3"]},"venues":["tavern"],"relic":"losers_cups","outline":"兩個曾經擁有天下、最後輸掉一切的人在酒肆對飲。拿破崙說滑鐵盧，項羽說垓下；互相比誰輸得更慘，然後比誰贏得更漂亮。最後互敬一杯。抉擇：拿最好的酒來／掌櫃也坐下陪一杯。"},{"id":"wenli","title":"問禮","writer":"S2","cast":{"kongzi":["s1"],"laozi":["s1","s2"]},"venues":["teahouse"],"relic":"kong_bamboo","outline":"孔子向老子問禮，老子說『去子之驕氣與多欲，態色與淫志，是皆無益於子之身』。孔子出來後對弟子說：鳥我知道能飛、魚我知道能游……至於龍，我不知道，今天見到老子，他就像龍吧。抉擇：奉茶在旁聽（得靈感）／識趣退下。"},{"id":"dongxi","title":"東西二聖","writer":"S2","cast":{"kongzi":["s1","s2","s3"],"socrates":["s1","s2"]},"venues":["teahouse","garden"],"relic":"dongxi","outline":"蘇格拉底用他的追問法問孔子『什麼是禮？』孔子答仁與禮，蘇格拉底繼續追問，掌櫃夾在中間翻譯得滿頭大汗。最後兩人發現『知之為知之，不知為不知，是知也』跟『我只知道我一無所知』是同一件事，相視大笑。抉擇：掌櫃認真翻譯／故意翻得很簡略（結果更好笑）。"},{"id":"baiwan","title":"百萬先生","writer":"S2","cast":{"marcopolo":["s1","s2"],"zhenghe":["s1","s2"]},"venues":["canteen","tavern","pier"],"relic":"treasure_ship","outline":"馬可波羅在食堂對一群客人吹噓東方的一切都是『上百萬』；鄭和在旁邊靜靜聽，最後淡淡說自己的船隊有六十二艘寶船、兩萬七千人。全場安靜。馬可波羅：『……你這個比我還誇張。』『不，我這是真的。』抉擇：替鄭和作證／讓馬可波羅繼續講（客人聽得很開心）。"},{"id":"sanyue","title":"三月不知肉味","writer":"S2","cast":{"kongzi":["s1","s2","s3"],"mozart":["s1","s2","s3"]},"venues":["music","stage"],"relic":"kong_shao","outline":"莫札特演奏，孔子聽得渾然忘我，嘆『不圖為樂之至於斯也』，整晚不肯吃肉，食堂的紅燒肉原封不動送回來。莫札特很得意。抉擇：照樣端肉給孔子／換成清茶。"},{"id":"dieyu","title":"蝶與時間","writer":"S2","cast":{"zhuangzi":["s1","s2","s3"],"einstein":["s1","s2","s3"]},"venues":["garden","tower"],"relic":"dream_watch","outline":"主線線索。愛因斯坦說時間是相對的，這裡的時鐘走得不對；莊子問他：你怎麼知道你不是一隻夢見自己在思考時間的蝴蝶？兩人越聊越懷疑：萬國館本身是什麼？愛因斯坦的懷錶在館裡停了。抉擇：掌櫃岔開話題（不洩漏館的祕密）／反問他們覺得這裡是什麼（兩人各給一個美得要命的答案）。"},{"id":"lizhi","title":"荔枝之爭","writer":"S2","cast":{"sushi":["s3"],"yangguifei":["s1"]},"venues":["canteen","garden"],"relic":null,"outline":"兩個荔枝狂熱者在館裡相遇，只剩最後一盤荔枝。蘇軾說『日啖荔枝三百顆』，楊貴妃說『一騎紅塵妃子笑』，兩人比誰更愛荔枝。抉擇：給貴妃／給東坡／對半分。純喜劇。"}],"ordinary":[{"id":"o_scholar","name":"落第書生","region":"hua","traits":["poem","poor"],"wealth":1},{"id":"o_merchant","name":"長安商人","region":"hua","traits":["travel","lavish"],"wealth":3},{"id":"o_swords","name":"江湖俠客","region":"hua","traits":["martial","wine"],"wealth":2},{"id":"o_veteran","name":"戍邊老兵","region":"hua","traits":["martial","wine"],"wealth":1},{"id":"o_escort","name":"鏢師","region":"hua","traits":["martial","travel"],"wealth":2},{"id":"o_embroider","name":"繡娘","region":"hua","traits":["art"],"wealth":2},{"id":"o_legion","name":"羅馬軍團兵","region":"med","traits":["martial","wine"],"wealth":2},{"id":"o_athenian","name":"雅典學徒","region":"med","traits":["philo"],"wealth":1},{"id":"o_venetian","name":"威尼斯商人","region":"west","traits":["travel","lavish"],"wealth":3},{"id":"o_viking","name":"維京水手","region":"west","traits":["wine","martial"],"wealth":2},{"id":"o_bard","name":"吟遊詩人","region":"west","       if (o && o !== ignoreUid) return { ok: false, reason: '跟別的東西重疊了' };

  // ---------- 一晚開始 ----------

  // ---------- 移動 ----------

  // ---------- 決策 ----------

  function decide(a) {

  // ---------- 報到 ----------
  // 帳房前排隊的位置：從門口往外找可以站的格子

  // ---------- 鬍子 ----------
  const BEARDS = {
    goatee(pb, p, oy) { pb.span(17 + oy, 13, 14, p.beard); pb.span(17 + oy, 17, 18, p.beard); pb.rect(15, 20 + oy, 2, 3, p.beard); pb.set(16, 22 + oy, p.beardS); },

    },
    stubble(pb, p, oy) { for (let x = 9; x <= 22; x += 2) pb.set(x, 19 + oy, p.beardS); for (let x = 10; x <= 21; x += 2) pb.set(x, 20 + oy, p.beardS); pb.span(17 + oy, 13, 18, p.beard); pb.span(20 + oy, 14, 17, p.beard); },
    mongol(pb, p, oy) { pb.span(17 + oy, 12, 19, p.beard); pb.vline(12, 18 + oy, 21 + oy, p.beard); pb.vline(19, 18 + oy, 21 + oy, p.beard); pb.rect(15, 20 + oy, 2, 3, p.beard); },
    longwhite(pb, p, oy, look) { BEARDS.long(pb, p, oy, Object.assign({ beardLen: 30 }, look)); },

  // ---------- 帽子與頭飾 ----------
  const HATS = {
    futou(pb, p, oy, back) { // 幞頭

    warcrown(pb, p, oy) { // 項羽金冠＋束髮

    beret(pb, p, oy) {
      const h = p.hat, s = p.hatS;
      pb.ellipse(14.5, 5 + oy, 11, 4.5, h); pb.span(8 + oy, 5, 24, s); pb.span(2 + oy, 9, 15, p.hatH); pb.set(15, 0 + oy, h);
    },
    straw(pb, p, oy) { // 梵谷草帽

    furhat(pb, p, oy) { // 蒙古皮帽

    diadem(pb, p, oy) { // 埃及金頭冠＋眼鏡蛇

  // ---------- 配件 ----------
  const ACC = {
    gourd(pb, p, oy) { pb.ellipse(24, 30 + oy, 2.2, 2.4, '#d6a03c'); pb.ellipse(24, 27 + oy, 1.4, 1.5, '#d6a03c'); pb.set(25, 31 + oy, '#9a6a1e'); pb.set(23, 26 + oy, '#c23b3b'); pb.set(24, 28 + oy, '#c23b3b'); },

  // ---------- 組裝 ----------
  const cache = new Map();
  function compose(look, view = 'front', frame = 0, expr = 'normal') {
    const p = pal(look);
    const pb = new PB();
    const back = view === 'back';
    const bob = (frame === 1 || frame === 3) ? -1 : 0;
    const oy = bob;
    const hairFn = HAIRS[look.hair || 'topknot'] || HAIRS.topknot;
    // 身後
    if (look.cape && !back) ACC.cape(pb, p, oy, look);
    if (look.longBack && !back) HAIRS.behindLong(pb, p, oy);
    if (look.accBack) for (const a of [].concat(look.accBack)) ACC[a] && ACC[a](pb, p, oy, look);
    // 身體
    const body = BODIES[look.body || 'robe'] || robe;
    body(pb, p, look, frame, 0, back);
    // 頭
    if (back) headBack(pb, p, look, oy); else head(pb, p, look, oy);
    if (!back) { eyes(pb, p, look, expr, oy); mouth(pb, p, look, expr, oy); }
    if (look.beard && !back) BEARDS[look.beard] && BEARDS[look.beard](pb, p, oy, look);
    hairFn(pb, p, oy, back, look);
    if (look.hat) HATS[look.hat] && HATS[look.hat](pb, p, oy, back, look);
    if (look.hat2) HATS[look.hat2] && HATS[look.hat2](pb, p, oy, back, look);
    if (!back && look.acc) for (const a of [].concat(look.acc)) ACC[a] && ACC[a](pb, p, oy, look);
    if (back && look.cape) ACC.cape(pb, p, oy, look);
    pb.outline();
    return pb;
  }
  function get(id, look, view = 'front', frame = 0, expr = 'normal', scale = 1) {
    const k = id + '|' + view + '|' + frame + '|' + expr + '|' + scale;
    let cv = cache.get(k);
    if (!cv) { cv = compose(look, view, frame, expr).toCanvas(scale); cache.set(k, cv); }
    return cv;
  }
  // 胸像（對話用）：裁上半身
  function portrait(id, look, expr = 'normal', scale = 6) {
    const k = id + '|portrait|' + expr + '|' + scale;
    let cv = cache.get(k);
    if (!cv) {
      const pb = compose(look, 'front', 0, expr);
      const full = pb.toCanvas(1);
      cv = document.createElement('canvas'); cv.width = 34 * scale; cv.height = 34 * scale;
      const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(full, 0, 0, 32, 33, scale, scale * 1, 32 * scale, 33 * scale);
      cache.set(k, cv);
    }
    return cv;
  }
  return { PB, compose, get, portrait, W, H, HAIRS, HATS, ACC, BEARDS, BODIES, SKIN, pal, clearCache: () => cache.clear() };
})();

  function scaffold(w, h, t) {
    const pw = w * T, ph = h * T;
    const [cv, x] = mk(pw + 8, ph + 40);
    const top = 34 - Math.round(t * 10);
    for (let i = 2; i < pw + 6; i += 14) VL(x, i, top, ph + 36, '#c9a46a');
    for (let j = top + 4; j < ph + 36; j += 12) HL(x, 2, pw + 5, j, '#b8935a');
    for (let i = 2; i < pw - 8; i += 14) LINE(x, i, top + 4, i + 14, top + 16, '#a8834a');
    R(x, 6, top + 8, pw - 4, Math.max(4, (ph + 28 - top) * (1 - t)), 'rgba(230,220,200,0.85)');
    for (let i = 10; i < pw; i += 18) R(x, i, ph + 30, 10, 6, '#8a6a3a');
    return { img: cv, ox: -4, oy: -36 };
  }

      if (a.kind === 'staff') { const lines = STAFF_LINES[a.staff] || STAFF_LINES[a.lookKey]; if (lines) G.SIM.say(a, G.pick(lines)); else G.SIM.say(a, '有什麼吩咐？'); G.AUDIO.sfx('tap'); return; }
      G.AUDIO.sfx('tap'); G.PANELS.openGuest(a); return;
    }
    if (dbl) { const z = G.R.cam.tz < 2.2 ? 2.8 : 1.5; G.R.setZoom(z, p.x, p.y); G.UI.closeSheet(); return; }
    const b = pickBuilding(p);
    if (b) { G.AUDIO.sfx('tap'); for (const o of G.SIM.agents) o.selected = false; G.BUILDUI.select(b); return; }
    const tx = Math.floor(w.x / T), ty = Math.floor(w.y / T);
    if (G.landAt(tx, ty) === 3) { const pl = G.plotAt(tx, ty); if (pl) { G.AUDIO.sfx('tap'); G.BUILDUI.plotSheet(pl); return; } }
    // 點空地：收起面板
    const cs = G.UI.curSheet(); if (cs && cs.o.clear) cs.close();
    G.SEL = null; for (const o of G.SIM.agents) o.selected = false;
  }
  function paintAt(p) {
    const w = wpos(p); const tx = Math.floor(w.x / T), ty = Math.floor(w.y / T);
    if (lastPaint && lastPaint[0] === tx && lastPaint[1] === ty) return;
    // 沿直線補齊（手指移動很快時）
    if (lastPaint) { const [lx, ly] = lastPaint; const n = Math.max(Math.abs(tx - lx), Math.abs(ty - ly)); for (let i = 1; i < n; i++) { const ix = Math.round(lx + (tx - lx) * i / n), iy = Math.round(ly + (ty - ly) * i / n); G.BUILDUI.paintAt(ix, iy); } }
    lastPaint = [tx, ty];
    G.BUILDUI.paintAt(tx, ty);
    edgePan(p);
  }

  // ---------- 長按拖客人 ----------
  function beginDragInvite(a, p) {
    if (['sleep', 'leaving', 'boardWait', 'gone', 'queue', 'arrive'].includes(a.state)) { G.SIM.say(a, a.state === 'sleep' ? '……zzz' : '等一下。'); return; }
    G.vibrate(15); G.AUDIO.sfx('spark');
    const el = G.UI.h('div', { class: 'dragGhost' }, G.UI.full(a.lookKey, a.look, 'surprise', 2));
    G.UI.root.append(el);
    const hint = G.UI.h('div', { class: 'hint' }, '請' + a.name + '去…');
    G.UI.root.append(hint);
    I.dragInvite = { a, el, hint, hover: null };
    moved = true;
    updateDragInvite(p);
  }
  function updateDragInvite(p) {
    const d = I.dragInvite; if (!d) return;
    d.el.style.left = p.x + 'px'; d.el.style.top = p.y + 'px';
    const b = pickBuilding(p); d.hover = b && G.LAYOUT[b.type] ? b : null;
    d.hint.style.left = p.x + 'px'; d.hint.style.top = (p.y - 70) + 'px';
    d.hint.textContent = d.hover ? (G.PANELS.venueOK(d.a, d.hover) ? '放開：請去' + G.BUILD[d.hover.type].name : G.BUILD[d.hover.type].name + '現在不行') : '請' + d.a.name + '去…';
    edgePan(p);
  }
  function endDragInvite(b) {
    const d = I.dragInvite; if (!d) return;
    I.dragInvite = null; d.el.remove(); d.hint.remove();
    if (b) G.PANELS.doInvite(d.a, b);
    I.dragging = false;
  }
  return I;
})();


/* ---- 19_main.js ---- */
'use strict';
/* 啟動、主迴圈、存檔時機、換場淡出 */
G.MAIN = (function () {
  const M = {}; const T = G.T;
  let last = 0, saveT = 0, titleT = 0;
  function normalize(S) {
    if (S.phase !== 'day') S.phase = 'day';
    G.NIGHT = null;
    if (!S.story) S.story = { ch: 0, seen: {}, ending: null };
    S.story.seen = S.story.seen || {}; S.story.pending = S.story.pending || [];
    return S;
  }
  function setup(S) {
    G.S = normalize(S);
    G.rebuildGrid();
    G.SIM.reset(); G.SIM.staff();
    if (!G.S.plan) { G.FLOW.plan(G.STORY.forcedPlan(G.S.night + 1)); }
    if (!G.S.shop || G.S.shop.night !== G.S.night) G.FLOW.restock();
    G.ART.clear();
  }
  M.fitZoom = () => G.clamp(Math.min(G.R.W / 360, (G.R.H - 140) / 300), 0.9, 2.2);
  M.boot = async function (hotData) {
    const cv = document.getElementById('cv'); const ui = document.getElementById('ui');
    G.UI.init(ui);
    let saved = null;
    try { if (hotData && hotData.S && hotData.S.builds) saved = G.migrate(hotData.S); } catch (e) { saved = null; }
    if (!saved) saved = G.load();
    setup(saved || G.newState());
    G.R.init(cv);
    G.input.init(cv);
    G.R.centerOn(13 * T, 20 * T, M.fitZoom());
    G.titleMode = true;
    requestAnimationFrame(loop);
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.S && G.S.phase === 'day') G.save(); G.AUDIO.suspend(); } else G.AUDIO.resume(); });
    window.addEventListener('pagehide', () => { if (G.S && G.S.phase === 'day') G.save(); });
    const hasProgress = !!saved && (saved.night > 0 || (saved.story && saved.story.seen && saved.story.seen.prologue));
    G.AUDIO.music('title');
    const k = await G.SCN.title(hasProgress);
    G.titleMode = false;
    if (k === 'new' && hasProgress) { M.newGame(); return; }
    G.AUDIO.music('day');
    G.UI.refreshDock();
    if (!G.S.story.seen.prologue) await G.STORY.prologue();
    else if (G.S.story.pending && G.S.story.pending.length) await G.STORY.onDay();
  };
  function loop(ts) {
    const dt = Math.min(0.05, ((ts - last) / 1000) || 0.016); last = ts;
    try {
      const S = G.S;
      if (S) {
        if (S.phase === 'night') { G.FLOW.update(dt); if (!G.UI.sceneOpen) G.STORY.tick(); }
        else if (S.phase === 'day') G.SIM.dayUpdate(dt);
        G.BUILDUI.tickConstruction(dt);
        if (G.titleMode) { titleT += dt; G.R.cam.x += Math.sin(titleT * 0.12) * 3 * dt; }
        if (!G.freeze) G.R.frame(dt);
        G.UI.tick(dt);
        perfWatch(dt);
        saveT += dt; if (saveT > 25 && S.phase === 'day' && !G.titleMode) { saveT = 0; G.save(); }
      }
    } catch (e) { console.error(e); }
    requestAnimationFrame(loop);
  }
  // 太慢就自動降畫質（只降不升；設定裡可以改回來）
  let ema = 16, slowT = 0, watchT = 0;
  function perfWatch(dt) {
    if (document.hidden || G.freeze) return;
    watchT += dt; if (watchT < 4) return;
    ema = ema * 0.94 + dt * 1000 * 0.06;
    if (ema > 38 && G.settings.quality !== 'low' && !G.settings.qualityLocked) { slowT += dt; if (slowT > 2.5) { G.settings.quality = 'low'; G.saveSettings(); G.R.resize(); G.UI.toast({ text: '畫面有點吃力，已自動切到省電畫質。可以在「設定」改回來。', icon: 'lamp', life: 5 }); slowT = 0; } }
    else slowT = Math.max(0, slowT - dt);
  }
  M.fade = function (fn) {
    const el = G.UI.h('div', { style: { position: 'absolute', inset: 0, background: '#0b1022', opacity: 0, transition: 'opacity .45s', pointerEvents: 'auto', zIndex: 5 } });
    G.UI.root.append(el);
    requestAnimationFrame(() => { el.style.opacity = 1; });
    setTimeout(() => { try { fn(); } catch (e) { console.error(e); } el.style.transition = 'opacity .8s'; el.style.opacity = 0; setTimeout(() => el.remove(), 850); }, 480);
  };
  M.newGame = async function () {
    for (const p of G.UI.root.querySelectorAll('.panel')) p._close && p._close();
    G.UI.closeSheet();
    if (G.BUILDUI.active) G.BUILDUI.cancel();
    setup(G.newState());
    G.save();
    G.R.centerOn(13 * T, 20 * T, M.fitZoom());
    G.UI.refreshDock();
    G.AUDIO.music('day');
    await G.STORY.prologue();
  };
  M.loadState = function (S) {
    for (const p of G.UI.root.querySelectorAll('.panel')) p._close && p._close();
    G.UI.closeSheet();
    setup(S); G.save(); G.UI.refreshDock();
  };
  return M;
})();
(function () {
  let booted = false;
  const hot = window.claude && window.claude.hot;
  // 頁面更新時保留白天的進度
  try { if (hot && hot.snapshot) hot.snapshot(() => (G.S && G.S.phase === 'day' ? { S: G.S } : {})); } catch (e) { }
  const start = (data) => { if (booted) return; booted = true; G.MAIN.boot(data || {}).catch((e) => console.error(e)); };
  const go = () => { if (hot && hot.ready) { try { hot.ready(start); return; } catch (e) { } } start((hot && hot.data) || {}); };
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', go); else go();
})();
