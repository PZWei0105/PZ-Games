<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>末班列車</title>
<meta name="theme-color" content="#070b14">
<meta name="description" content="灰日之下的南行列車 Roguelike。管理爐溫、車廂與乘客，在位子用完之前抵達暖城。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="末班列車">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=Oswald:wght@500;700&family=Special+Elite&display=swap">
<style>/* 末班列車 SOUTHBOUND
   版面概念：畫布永遠在背後跑著雪原與列車；介面分兩種材質——「鐵」（琺瑯鐵牌：導航、資源、按鈕）與「紙」（車票、電報、行車日誌：人與故事）。
   暖色＝有熱、還活著；冷色＝失溫。 */
:root {
  --night: #070b14;
  --steel: #161e2b;
  --steel-2: #222c3d;
  --steel-3: #303c52;
  --frost: #e7eef8;
  --frost-2: #a9b8cd;
  --mist: #66768e;
  --ember: #ff9a3c;
  --ember-2: #ffd08a;
  --ember-deep: #b8561c;
  --blood: #e0483a;
  --aurora: #6ff2cf;
  --cold: #7fb6ff;
  --paper: #ebe2cd;
  --paper-2: #ddd1b6;
  --ink: #2a2017;
  --ink-2: #6a5741;
  --stamp: #b8301c;
  --f-disp: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Oswald", "Noto Sans TC", "PingFang TC", sans-serif;
  --f-type: "Special Elite", "Courier New", "Noto Serif TC", monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --hud-h: 50px;
  --noise: none;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night); color: var(--frost); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none; touch-action: manipulation; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
#app {
  position: fixed; top: 0; bottom: 0; left: 50%; width: min(100vw, 480px); transform: translateX(-50%);
  z-index: 1; overflow: hidden;
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.serif { font-family: var(--f-disp); }
.type { font-family: var(--f-type); }
.dim { color: var(--frost-2); }
.warm { color: var(--ember-2); }
.cold { color: var(--cold); }
.bad { color: #ff7a6a; }
.good { color: #8ff0b4; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }
:focus-visible { outline: 2px solid var(--ember-2); outline-offset: 2px; }

/* ---------- 按鈕：琺瑯鐵牌 ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer; border-radius: 9px; min-height: 48px; padding: 10px 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 16px;
  letter-spacing: .06em; position: relative; transition: transform .12s, filter .2s, opacity .2s;
}
.btn:active { transform: translateY(1px) scale(.985); }
.btn:disabled { opacity: .38; cursor: default; filter: saturate(.3); }
.btn-primary {
  color: #2a1404; background: linear-gradient(180deg, #ffc477 0%, #ff9a3c 52%, #e57a22 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(120,40,0,.35), 0 6px 18px rgba(255,120,30,.28), 0 0 0 1px #8a3e0e;
  text-shadow: 0 1px 0 rgba(255,255,255,.35);
}
.btn-steel {
  color: var(--frost); background: linear-gradient(180deg, #2f3b51, #1c2535);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.35), 0 0 0 1px rgba(150,180,220,.22), 0 6px 16px rgba(0,0,0,.4);
}
.btn-ghost { color: var(--frost-2); background: transparent; box-shadow: inset 0 0 0 1px rgba(170,195,230,.28); font-weight: 500; }
.btn-danger { color: #fff; background: linear-gradient(180deg, #e2574a, #a8261b); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 1px #5e120b; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 7px; }
.btn-wide { width: 100%; }
.btn .sub { font-weight: 500; font-size: 12px; opacity: .75; letter-spacing: 0; }

/* ---------- 鐵牌面板 ---------- */
.plate {
  background: linear-gradient(180deg, rgba(34,44,61,.96), rgba(20,27,39,.97));
  border-radius: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(150,180,220,.14), 0 10px 26px rgba(0,0,0,.45);
  position: relative;
}
.plate.rivets::before, .plate.rivets::after {
  content: ""; position: absolute; top: 8px; width: 5px; height: 5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #8c9ab0, #3a4558 70%); box-shadow: 0 1px 0 rgba(0,0,0,.6);
}
.plate.rivets::before { left: 8px; } .plate.rivets::after { right: 8px; }
.enamel {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 5px;
  background: linear-gradient(180deg, #23426e, #172d4d); color: #eef4ff; font-family: var(--f-disp); font-weight: 700;
  box-shadow: inset 0 0 0 1.5px #d7e3f5, inset 0 0 0 3px #1a3256, 0 2px 6px rgba(0,0,0,.4); letter-spacing: .12em; font-size: 13px;
}
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 12px; background: rgba(160,190,230,.12); color: var(--frost-2); white-space: nowrap; }
.chip.warm { background: rgba(255,154,60,.16); color: var(--ember-2); }
.chip.cold { background: rgba(127,182,255,.15); color: #bcd8ff; }
.chip.bad { background: rgba(224,72,58,.18); color: #ffb3a8; }
.chip.good { background: rgba(80,220,150,.14); color: #a9f5c8; }

/* ---------- 紙：車票、電報、日誌 ---------- */
.paper {
  background-color: var(--paper); color: var(--ink);
  background-image: var(--noise), linear-gradient(180deg, rgba(255,255,255,.35), rgba(0,0,0,.04));
  background-size: 180px 180px, 100% 100%;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 14px 30px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.4);
}
.stamp {
  display: inline-block; font-family: var(--f-disp); font-weight: 900; color: var(--stamp); border: 3px solid currentColor;
  padding: 1px 9px 2px; border-radius: 4px; letter-spacing: .22em; transform: rotate(-11deg); filter: url(#rough);
  mix-blend-mode: multiply; opacity: .88; line-height: 1.3;
}

/* ---------- HUD ---------- */
#hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 6; padding: calc(var(--safe-t) + 6px) 10px 6px;
  background: linear-gradient(180deg, rgba(6,9,16,.96) 0%, rgba(8,12,20,.86) 80%, rgba(8,12,20,0) 100%);
  display: flex; align-items: center; gap: 6px; pointer-events: none;
}
#hud .res { display: inline-flex; align-items: center; gap: 3px; font-family: var(--f-num); font-size: 15px; font-weight: 500; color: var(--frost); min-width: 0; pointer-events: auto; }
#hud .res .ico { width: 17px; height: 17px; }
#hud .res.low { color: #ff8b7a; }
#hud .res.low .ico { animation: lowpulse 1.2s ease-in-out infinite; }
#hud .grow { flex: 1; }
#hud .seats {
  display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 9px 2px; border-radius: 6px; pointer-events: auto;
  background: linear-gradient(180deg, #24170a, #140d06); box-shadow: inset 0 0 0 1px #6a4416, 0 0 14px rgba(255,150,50,.18);
  color: var(--ember-2); font-family: var(--f-num); font-size: 18px; font-weight: 700; text-shadow: 0 0 8px rgba(255,170,70,.6);
}
#hud .seats small { font-family: var(--f-body); font-size: 10px; font-weight: 500; color: #c89a5a; text-shadow: none; letter-spacing: .1em; }
#hud .day { font-family: var(--f-num); font-size: 13px; color: var(--frost-2); pointer-events: auto; }
#hud .day b { font-size: 16px; color: var(--frost); font-weight: 500; }
@keyframes lowpulse { 50% { opacity: .35; } }

/* ---------- 標題 ---------- */
.title { justify-content: flex-end; padding: calc(var(--safe-t) + 22px) 22px calc(var(--safe-b) + max(150px, 21vh)); }
.title .logo { position: absolute; right: 18px; top: calc(var(--safe-t) + 28px); display: flex; flex-direction: row-reverse; gap: 10px; align-items: flex-start; }
.title h1 {
  margin: 0; writing-mode: vertical-rl; font-family: var(--f-disp); font-weight: 900; font-size: clamp(64px, 19vw, 96px);
  line-height: 1; letter-spacing: .08em; color: #f3f6fb;
  background: linear-gradient(180deg, #ffffff 0%, #dfe8f5 46%, #ffd9a6 78%, #ff9a3c 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 6px 22px rgba(0,0,0,.65)) drop-shadow(0 0 30px rgba(255,150,60,.12));
}
.title .vert-sub { writing-mode: vertical-rl; font-family: var(--f-disp); font-size: 14px; letter-spacing: .5em; color: var(--frost-2); margin-top: 10px; text-shadow: 0 2px 8px #000; }
.title .en { font-family: var(--f-num); font-weight: 700; letter-spacing: .5em; font-size: 15px; color: var(--ember-2); text-shadow: 0 0 12px rgba(255,150,60,.5); }
.title .lead { max-width: 15em; font-family: var(--f-disp); font-size: 15px; line-height: 1.9; color: var(--frost); text-shadow: 0 2px 10px #000, 0 0 2px #000; }
.title .menu { display: grid; gap: 10px; width: min(100% - 96px, 290px); }
.title .ver { position: absolute; left: 22px; right: 22px; bottom: calc(var(--safe-b) + 14px); }
.title .ver { font-family: var(--f-type); font-size: 11px; color: var(--mist); letter-spacing: .08em; }
.tap-start {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px;
  padding-bottom: calc(var(--safe-b) + 18vh); cursor: pointer; background: radial-gradient(ellipse at 50% 70%, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 100%);
}
.tap-start b { font-family: var(--f-disp); font-size: 17px; letter-spacing: .4em; color: var(--ember-2); animation: breathe 2.4s ease-in-out infinite; text-shadow: 0 0 14px rgba(255,150,60,.7); }
.tap-start span { font-size: 12px; color: var(--mist); letter-spacing: .2em; }
@keyframes breathe { 50% { opacity: .45; } }

/* ---------- 開場字幕 ---------- */
.intro { align-items: center; justify-content: center; padding: 0 30px; cursor: pointer; }
.intro .line { font-family: var(--f-disp); font-size: 21px; line-height: 1.8; text-align: center; letter-spacing: .08em; text-shadow: 0 2px 14px #000, 0 0 3px #000; opacity: 0; transform: translateY(8px); transition: opacity .9s, transform .9s; }
.intro .line.on { opacity: 1; transform: none; }
.intro .skip { position: absolute; bottom: calc(var(--safe-b) + 20px); right: 20px; }

/* ---------- 月台：選人 ---------- */
.board { padding-top: calc(var(--safe-t) + 14px); }
.board header { padding: 0 16px 10px; display: grid; gap: 4px; }
.board header h2 { margin: 0; font-family: var(--f-disp); font-weight: 900; font-size: 24px; letter-spacing: .06em; text-shadow: 0 2px 10px #000; }
.board header p { margin: 0; color: var(--frost-2); font-size: 13px; text-shadow: 0 1px 6px #000; }
.board .list { flex: 1; padding: 4px 14px 110px; display: grid; gap: 12px; align-content: start; }
.board footer {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(var(--safe-b) + 14px); display: flex; gap: 12px; align-items: center;
  background: linear-gradient(180deg, rgba(7,11,20,0), rgba(7,11,20,.94) 34%);
}
.board footer .count { font-family: var(--f-num); font-size: 26px; font-weight: 700; color: var(--ember-2); min-width: 64px; }
.board footer .count small { font-size: 13px; color: var(--frost-2); font-weight: 500; }

.ticket {
  position: relative; display: grid; grid-template-columns: 86px 1fr; gap: 12px; padding: 12px 14px 12px 12px; border-radius: 7px; cursor: pointer;
  transition: transform .22s cubic-bezier(.2,.9,.3,1.2), box-shadow .2s;
  -webkit-mask: radial-gradient(circle 9px at 0 50%, transparent 97%, #000 100%) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, transparent 97%, #000 100%) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 9px at 0 50%, transparent 97%, #000 100%) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, transparent 97%, #000 100%) right / 51% 100% no-repeat;
}
.ticket::after { content: ""; position: absolute; left: 104px; top: 10px; bottom: 10px; border-left: 2px dashed rgba(42,32,23,.22); }
.ticket .pic { width: 86px; height: 104px; border-radius: 4px; overflow: hidden; background: #1a2130; box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
.ticket .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ticket .body { display: grid; gap: 4px; align-content: start; min-width: 0; padding-left: 10px; }
.ticket .no { font-family: var(--f-type); font-size: 11px; color: var(--ink-2); letter-spacing: .06em; display: flex; justify-content: space-between; gap: 6px; }
.ticket .nm { font-family: var(--f-disp); font-weight: 900; font-size: 21px; line-height: 1.15; display: flex; align-items: baseline; gap: 8px; }
.ticket .nm small { font-family: var(--f-body); font-size: 12px; font-weight: 500; color: var(--ink-2); }
.ticket .role { font-size: 12.5px; color: #4a3b2b; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ticket .bio { font-family: var(--f-disp); font-size: 13.5px; line-height: 1.6; color: #3b2e21; }
.ticket .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
.ticket .tag { font-size: 11px; padding: 1px 7px; border-radius: 3px; background: rgba(42,32,23,.09); color: #4a3a2a; border: 1px solid rgba(42,32,23,.18); }
.ticket .tag.spec { background: #2a2017; color: var(--paper); border-color: #2a2017; }
.ticket .stamp { position: absolute; right: 14px; bottom: 12px; font-size: 18px; opacity: 0; transform: rotate(-14deg) scale(1.8); transition: opacity .18s, transform .22s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
.ticket.sel { transform: translateX(4px) rotate(-.4deg); }
.ticket.sel .stamp { opacity: .9; transform: rotate(-14deg) scale(1); }
.ticket .punch { position: absolute; left: 96px; top: 50%; width: 15px; height: 15px; margin-top: -7px; border-radius: 50%; background: #0b0f17; box-shadow: inset 0 2px 3px rgba(0,0,0,.8), 0 0 0 1px rgba(42,32,23,.4); opacity: 0; transform: scale(.3); transition: .18s; }
.ticket.sel .punch { opacity: 1; transform: scale(1); }
.ticket.off { filter: grayscale(.6) brightness(.82); }

/* ---------- 地圖 ---------- */
.mapscr { padding-top: calc(var(--safe-t) + var(--hud-h)); }
.map-head { padding: 6px 14px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.map-head .act { display: grid; gap: 2px; }
.map-head .act b { font-family: var(--f-disp); font-weight: 900; font-size: 20px; letter-spacing: .08em; text-shadow: 0 2px 8px #000; }
.map-head .act span { font-size: 11px; color: var(--frost-2); letter-spacing: .1em; }
.map-head .km { font-family: var(--f-num); text-align: right; font-size: 12px; color: var(--frost-2); line-height: 1.3; }
.map-head .km b { display: block; font-size: 19px; color: var(--frost); font-weight: 500; }
.map-wrap { flex: 1; position: relative; margin: 0 8px; border-radius: 14px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(140,170,210,.16), 0 10px 30px rgba(0,0,0,.4); background-color: rgba(8,13,24,.78); background-image: linear-gradient(rgba(120,150,200,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(120,150,200,.07) 1px, transparent 1px), radial-gradient(ellipse at 50% 0%, rgba(255,160,80,.06), transparent 60%); background-size: 26px 26px, 26px 26px, 100% 100%; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.map-wrap::after { content: "南行・SOUTHBOUND ↓"; position: absolute; right: 12px; bottom: 10px; font-family: var(--f-type); font-size: 10px; letter-spacing: .2em; color: rgba(170,190,220,.35); pointer-events: none; }
.map-wrap .scroll { position: absolute; inset: 0; }
.map-inner { position: relative; width: 100%; }
.map-inner > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node {
  position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: radial-gradient(circle at 50% 38%, #2c3a55, #121a2a 72%); box-shadow: inset 0 0 0 2px #4b5d7d, 0 4px 12px rgba(0,0,0,.55);
  display: grid; place-items: center; color: #c9d6ea; transition: transform .2s;
}
.node .ico { width: 24px; height: 24px; }
.node .lbl { position: absolute; top: 53px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px; background: rgba(7,11,20,.72); color: var(--frost-2); text-shadow: 0 1px 3px #000; font-family: var(--f-disp); letter-spacing: .06em; pointer-events: none; }
.node .lbl:empty { display: none; }
.node.fog { background: radial-gradient(circle at 50% 38%, #1d2638, #0e1420 72%); color: #59677f; box-shadow: inset 0 0 0 2px #2d3850, 0 4px 12px rgba(0,0,0,.5); }
.node.reach { box-shadow: inset 0 0 0 2.5px var(--ember), 0 0 0 4px rgba(255,154,60,.18), 0 0 22px rgba(255,154,60,.45); color: #fff; animation: nodepulse 1.6s ease-in-out infinite; }
.node.done { opacity: .5; }
.node.cur { box-shadow: inset 0 0 0 2.5px var(--ember-2), 0 0 26px rgba(255,200,120,.5); color: var(--ember-2); }
.node.boss { width: 64px; height: 64px; margin: -32px 0 0 -32px; background: radial-gradient(circle at 50% 38%, #4a1d18, #1a0907 72%); box-shadow: inset 0 0 0 2.5px #b8402e, 0 0 26px rgba(224,72,58,.35); color: #ffb1a4; }
.node.boss .ico { width: 32px; height: 32px; }
.node.boss .lbl { top: 66px; color: #ffc2b8; font-weight: 700; }
.node.elite { box-shadow: inset 0 0 0 2px #a35a2a, 0 4px 12px rgba(0,0,0,.55); color: #ffbf8f; }
.node.reach.elite { box-shadow: inset 0 0 0 2.5px var(--ember), 0 0 0 4px rgba(255,154,60,.18), 0 0 22px rgba(255,154,60,.45); }
@keyframes nodepulse { 50% { transform: scale(1.07); } }
.map-foot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 10px calc(var(--safe-b) + 10px); }
.navbtn { appearance: none; border: 0; cursor: pointer; min-height: 56px; border-radius: 10px; display: grid; place-items: center; gap: 1px; padding: 6px 0 5px; color: var(--frost); font-size: 12.5px; font-weight: 500;
  background: linear-gradient(180deg, #273246, #182131); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 1px rgba(150,180,220,.18), 0 6px 14px rgba(0,0,0,.4); position: relative; }
.navbtn .ico { width: 22px; height: 22px; color: var(--ember-2); }
.navbtn .badge { position: absolute; top: 5px; right: 8px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--blood); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; font-family: var(--f-num); }

/* ---------- 底部抽屜 ---------- */
#sheet-veil { position: absolute; inset: 0; z-index: 20; background: rgba(2,4,9,.55); opacity: 0; transition: opacity .25s; }
#sheet-veil.open { opacity: 1; }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 86%; display: flex; flex-direction: column;
  border-radius: 20px 20px 0 0; background: linear-gradient(180deg, #212b3c, #141b27 40%); box-shadow: 0 -1px 0 rgba(180,200,235,.18), 0 -16px 40px rgba(0,0,0,.55);
  transform: translateY(102%); transition: transform .34s cubic-bezier(.2,.9,.2,1);
}
#sheet.open { transform: none; }
#sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(180,200,235,.3); margin: 8px auto 2px; flex: none; }
#sheet .sh-body { padding: 8px 16px calc(var(--safe-b) + 16px); overflow-y: auto; overscroll-behavior: contain; }
.sh-title { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.sh-title h3 { margin: 0; font-family: var(--f-disp); font-size: 21px; font-weight: 900; letter-spacing: .05em; }
.sh-title .x { margin-left: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--frost-2); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-num); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 10px; background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 1px rgba(150,180,220,.12); }
.seg button { appearance: none; border: 0; cursor: pointer; border-radius: 7px; padding: 8px 4px; background: transparent; color: var(--frost-2); display: grid; gap: 1px; justify-items: center; font-size: 14px; font-weight: 700; }
.seg button small { font-size: 11px; font-weight: 400; font-family: var(--f-num); letter-spacing: .02em; }
.seg button.on { background: linear-gradient(180deg, #3a2a18, #24180c); color: var(--ember-2); box-shadow: inset 0 0 0 1px #8a5a22, 0 0 14px rgba(255,150,60,.2); }
.seg button.on.f1 { background: linear-gradient(180deg, #1c2a3e, #111a28); color: #bcd8ff; box-shadow: inset 0 0 0 1px #3f6290; }
.seg button.on.f3 { background: linear-gradient(180deg, #4a2412, #2a1006); color: #ffc79a; box-shadow: inset 0 0 0 1px #c25a20, 0 0 18px rgba(255,110,40,.35); }
.forecast { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; }
.forecast div { background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px 4px; text-align: center; box-shadow: inset 0 0 0 1px rgba(150,180,220,.1); }
.forecast small { display: block; font-size: 11px; color: var(--frost-2); }
.forecast b { font-family: var(--f-num); font-weight: 500; font-size: 18px; }
.warnline { font-size: 13px; color: #ffb3a8; display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; }
.note { font-size: 13px; color: var(--frost-2); line-height: 1.6; }

/* ---------- 全螢幕層：事件、廣播、結算 ---------- */
#overlay { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; background: rgba(3,5,10,.62); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
#overlay.fade-in { animation: fadein .35s ease-out; }
@keyframes fadein { from { opacity: 0; } }
.doc-wrap { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: calc(var(--safe-t) + 16px) 14px calc(var(--safe-b) + 18px); display: flex; flex-direction: column; justify-content: center; }
.doc { border-radius: 5px; overflow: hidden; animation: docin .5s cubic-bezier(.2,.9,.25,1); }
@keyframes docin { from { transform: translateY(26px) rotate(-1.2deg); opacity: 0; } }
.doc .vig { display: block; width: 100%; height: 188px; background: #0b111c; }
.doc .head { padding: 14px 18px 0; display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.doc .head h2 { margin: 0; font-family: var(--f-disp); font-weight: 900; font-size: 24px; letter-spacing: .05em; text-wrap: balance; }
.doc .head .where { font-family: var(--f-type); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.doc .txt { padding: 8px 18px 4px; font-family: var(--f-disp); font-weight: 500; font-size: 16.5px; line-height: 1.95; color: #2b2117; }
.doc .txt p { margin: 0 0 .7em; }
.doc .txt em { font-style: normal; color: #8a2a14; }
.doc .choices { padding: 6px 14px 16px; display: grid; gap: 9px; }
.choice {
  appearance: none; text-align: left; cursor: pointer; width: 100%; border-radius: 7px; padding: 11px 14px 10px; display: grid; gap: 3px;
  background: rgba(255,255,255,.34); border: 1px solid rgba(42,32,23,.32); color: var(--ink); font-family: var(--f-disp); font-weight: 700; font-size: 16px; line-height: 1.45;
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 2px 0 rgba(42,32,23,.12); transition: background .15s, transform .1s;
}
.choice:active { transform: translateY(1px); background: rgba(255,255,255,.55); }
.choice .who { font-family: var(--f-body); font-weight: 700; font-size: 12px; color: #fff; background: #2a2017; border-radius: 3px; padding: 0 6px; justify-self: start; letter-spacing: .04em; }
.choice small { font-family: var(--f-body); font-weight: 500; font-size: 12.5px; color: #6a5741; }
.choice small .bad { color: #a8301c; } .choice small .good { color: #2d7a4a; }
.choice:disabled { opacity: .45; cursor: default; }
.doc .result { padding: 4px 18px 16px; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.delta { font-family: var(--f-num); font-size: 14px; padding: 2px 9px; border-radius: 4px; background: rgba(42,32,23,.1); color: #2a2017; display: inline-flex; gap: 4px; align-items: center; }
.delta.neg { background: rgba(168,48,28,.14); color: #8a2410; }
.delta.pos { background: rgba(45,122,74,.14); color: #1f5e37; }
.doc .stamp { position: absolute; }
.doc-actions { padding: 0 14px 16px; display: grid; gap: 8px; }
.btn-ink { color: var(--paper); background: #2a2017; box-shadow: 0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.12); }

/* 廣播 */
.radio { align-items: center; justify-content: center; padding: 20px; cursor: pointer; background: radial-gradient(ellipse at 50% 45%, rgba(20,12,4,.55), rgba(2,3,6,.9) 70%); }
.radio .set {
  width: min(100%, 360px); border-radius: 16px; padding: 18px 18px 16px; position: relative;
  background: linear-gradient(180deg, #3b2817, #24170c); box-shadow: inset 0 1px 0 rgba(255,220,170,.2), inset 0 0 0 1px #5a3c1e, 0 20px 50px rgba(0,0,0,.7);
}
.radio .dial { height: 46px; border-radius: 8px; position: relative; overflow: hidden; background: linear-gradient(180deg, #ffe2a6, #ffb95e); box-shadow: inset 0 2px 8px rgba(80,30,0,.6), 0 0 30px rgba(255,170,70,.35); }
.radio .dial::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(60,25,0,.55) 0 1px, transparent 1px 12px); }
.radio .dial i { position: absolute; top: 4px; bottom: 4px; width: 3px; background: #b3170c; box-shadow: 0 0 6px #ff3b1f; left: 20%; transition: left 1.6s cubic-bezier(.3,.8,.2,1); }
.radio .dial span { position: absolute; bottom: 3px; font-family: var(--f-num); font-size: 9px; color: rgba(70,30,0,.75); }
.radio .clock { display: flex; justify-content: space-between; margin: 10px 2px 8px; font-family: var(--f-type); font-size: 12px; color: #d9b07a; letter-spacing: .1em; }
.radio .voice { min-height: 7.5em; font-family: var(--f-disp); font-size: 17px; line-height: 1.9; color: #ffe8c4; text-shadow: 0 0 12px rgba(255,170,80,.35); }
.radio .voice .q { color: #fff4e0; }
.radio .voice .caret { display: inline-block; width: 8px; height: 1em; background: #ffcf8a; vertical-align: -2px; animation: breathe .8s steps(2) infinite; margin-left: 2px; }
.radio .count { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-top: 8px; }
.radio .count b { font-family: var(--f-num); font-size: 64px; line-height: 1; color: #ffd08a; text-shadow: 0 0 22px rgba(255,160,60,.7); font-weight: 700; }
.radio .count span { font-family: var(--f-disp); color: #d9b07a; letter-spacing: .2em; }
.radio .count.zero b { color: #8a96a8; text-shadow: none; }
.radio .hint { text-align: center; font-size: 12px; color: #8f7552; margin-top: 10px; letter-spacing: .2em; }
.radio .grille { height: 34px; margin-top: 14px; border-radius: 6px; background: repeating-linear-gradient(0deg, #1a1007 0 3px, #3a2714 3px 6px); box-shadow: inset 0 0 0 1px #4d3319; }

/* ---------- 列車管理 ---------- */
.trainscr { padding-top: calc(var(--safe-t) + var(--hud-h)); }
.tr-top { padding: 4px 12px 8px; display: grid; gap: 8px; }
.heatbar { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; }
.heatbar .lbl { font-size: 12px; color: var(--frost-2); }
.heatbar .val { font-family: var(--f-num); font-size: 20px; }
.tr-list { flex: 1; padding: 0 12px calc(var(--safe-b) + 90px); display: grid; gap: 10px; align-content: start; }
.car { padding: 0; overflow: hidden; }
.car .art { display: block; width: 100%; height: 74px; }
.car .info { padding: 8px 12px 10px; display: grid; gap: 6px; }
.car .row1 { display: flex; align-items: center; gap: 8px; }
.car .row1 b { font-family: var(--f-disp); font-size: 16px; font-weight: 900; letter-spacing: .04em; }
.car .row1 .grow { flex: 1; }
.warmth { height: 6px; border-radius: 3px; background: rgba(127,182,255,.18); overflow: hidden; }
.warmth i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7fb6ff, #ffb35a); transition: width .5s; }
.seats-row { display: flex; gap: 6px; flex-wrap: wrap; }
.mini { width: 42px; height: 50px; border-radius: 5px; overflow: hidden; position: relative; cursor: pointer; box-shadow: 0 0 0 1px rgba(255,255,255,.12); background: #0c121d; flex: none; }
.mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini .hpb { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.6); overflow: hidden; }
.mini .hpb i { display: block; height: 100%; background: #8ff0b4; }
.mini.hurt .hpb i { background: #ffb35a; } .mini.crit .hpb i { background: #ff6a5a; }
.mini .st { position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1px #000; }
.mini .st.stress { background: #b07cff; } .mini .st.broke { background: #ff4a3a; } .mini .st.resolve { background: #ffd34a; }
.mini.empty { display: grid; place-items: center; color: rgba(170,190,220,.35); font-size: 18px; box-shadow: inset 0 0 0 1px rgba(170,190,220,.18); background: transparent; cursor: default; }
.mini.guard::after { content: ""; position: absolute; left: 3px; top: 3px; width: 8px; height: 8px; background: var(--ember); clip-path: polygon(50% 0, 100% 30%, 82% 100%, 18% 100%, 0 30%); }
.tr-actions { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(var(--safe-b) + 12px); display: flex; gap: 8px; background: linear-gradient(180deg, rgba(7,11,20,0), rgba(7,11,20,.95) 35%); }
.tr-actions .btn { flex: 1; }

/* 乘客詳情 */
.pdetail { display: grid; grid-template-columns: 116px 1fr; gap: 14px; }
.pdetail .big { width: 116px; height: 140px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 8px 20px rgba(0,0,0,.5); }
.pdetail .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bars { display: grid; gap: 7px; font-size: 12px; }
.bar { display: grid; grid-template-columns: 34px 1fr 52px; gap: 8px; align-items: center; }
.bar .t { height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar .t i { display: block; height: 100%; border-radius: 4px; }
.bar .v { font-family: var(--f-num); text-align: right; font-size: 13px; }
.bar.hp .t i { background: linear-gradient(90deg, #3fae78, #8ff0b4); }
.bar.st .t i { background: linear-gradient(90deg, #6d4bd6, #c49cff); }
.traits { display: grid; gap: 6px; margin: 12px 0; }
.trait { padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(150,180,220,.1); font-size: 13px; }
.trait b { color: var(--ember-2); margin-right: 6px; }
.trait.neg b { color: #ff9c8c; }
.storyline { font-family: var(--f-disp); font-size: 14px; line-height: 1.8; color: var(--frost); padding: 10px 12px; border-left: 2px solid var(--ember-deep); background: rgba(255,154,60,.05); border-radius: 0 8px 8px 0; margin: 8px 0; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btnrow .btn { flex: 1; min-width: 120px; }
.carpick { display: grid; gap: 8px; margin-top: 8px; }

/* ---------- 車站 ---------- */
.stationscr { padding-top: calc(var(--safe-t) + var(--hud-h)); }
.st-head { position: relative; height: 170px; flex: none; }
.st-head canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.st-head .name { position: absolute; left: 16px; bottom: 12px; display: grid; gap: 4px; }
.st-head .name b { font-family: var(--f-disp); font-size: 26px; font-weight: 900; letter-spacing: .08em; text-shadow: 0 2px 12px #000; }
.st-head .name span { font-size: 12px; color: var(--frost-2); text-shadow: 0 1px 6px #000; }
.st-list { flex: 1; padding: 10px 12px calc(var(--safe-b) + 90px); display: grid; gap: 10px; align-content: start; }
.svc { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px; cursor: pointer; text-align: left; border: 0; color: inherit; width: 100%; }
.svc .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,154,60,.12); color: var(--ember-2); box-shadow: inset 0 0 0 1px rgba(255,154,60,.3); }
.svc .ic .ico { width: 24px; height: 24px; }
.svc b { display: block; font-family: var(--f-disp); font-size: 16px; font-weight: 900; letter-spacing: .04em; }
.svc small { color: var(--frost-2); font-size: 12.5px; }
.svc.used { opacity: .45; }
.trade { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(150,180,220,.1); }
.trow .lhs { display: flex; align-items: center; gap: 8px; font-family: var(--f-num); font-size: 16px; }
.trow .lhs .arrow { color: var(--mist); }
.shopcar { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px; border-radius: 10px; background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(150,180,220,.1); align-items: center; }
.shopcar canvas { width: 100%; height: 52px; display: block; grid-column: 1 / -1; }
.shopcar b { font-family: var(--f-disp); font-weight: 900; }
.shopcar small { display: block; color: var(--frost-2); font-size: 12px; line-height: 1.5; }

/* ---------- 戰鬥 ---------- */
.battlescr { padding-top: calc(var(--safe-t)); }
.b-hud { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 8px 12px 0; }
.b-hud .round { font-family: var(--f-num); font-size: 13px; color: var(--frost-2); letter-spacing: .1em; }
.b-hud .round b { font-size: 20px; color: var(--frost); }
.b-hud .hull { flex: 1; display: grid; gap: 3px; }
.b-hud .hull .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--frost-2); }
.b-hud .hull .lbl b { font-family: var(--f-num); color: var(--frost); font-size: 13px; font-weight: 500; }
.b-hud .hull .t { height: 8px; border-radius: 4px; background: rgba(0,0,0,.5); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(150,180,220,.2); }
.b-hud .hull .t i { display: block; height: 100%; background: linear-gradient(90deg, #8a9bb5, #d7e2f2); transition: width .4s; }
.b-hud .coalb { font-family: var(--f-num); display: inline-flex; gap: 4px; align-items: center; font-size: 15px; }
.storm { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 46px); z-index: 3; padding: 3px 12px; border-radius: 99px; background: rgba(210,225,255,.12); box-shadow: inset 0 0 0 1px rgba(210,225,255,.35); font-size: 12.5px; color: #e9f1ff; white-space: nowrap; }
.storm b { font-family: var(--f-num); font-size: 15px; }
.storm.near { background: rgba(255,90,70,.2); box-shadow: inset 0 0 0 1px #ff7a6a; animation: lowpulse 1s infinite; }
.b-stage { position: relative; flex: 1; }
.intent {
  position: absolute; z-index: 4; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 2px; pointer-events: none;
}
.intent .bub { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 7px; white-space: nowrap; font-size: 12.5px; font-weight: 700;
  background: rgba(10,14,22,.88); box-shadow: inset 0 0 0 1px rgba(255,130,100,.55), 0 3px 10px rgba(0,0,0,.6); color: #ffd6cc; }
.intent .bub .ico { width: 15px; height: 15px; }
.intent .bub.sab { box-shadow: inset 0 0 0 1.5px #ffcc4a, 0 0 18px rgba(255,190,60,.45); color: #ffe7a6; }
.intent .bub.buff { box-shadow: inset 0 0 0 1px rgba(160,200,255,.55); color: #d4e6ff; }
.intent .bub.stun { box-shadow: inset 0 0 0 1px rgba(200,200,200,.4); color: #b9c2d0; }
.intent .tg { font-size: 10.5px; color: #e9eef6; background: rgba(8,12,20,.72); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.intent .tg:empty { display: none; }
.ehp { position: absolute; z-index: 4; transform: translateX(-50%); width: 98px; pointer-events: none; display: grid; gap: 2px; }
.ehp .t { height: 6px; border-radius: 3px; background: rgba(0,0,0,.65); overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.ehp .t i { display: block; height: 100%; background: linear-gradient(90deg, #d4402e, #ff8a6a); transition: width .35s; }
.ehp .t .arm { background: linear-gradient(90deg, #7a8ba6, #c9d6ea); }
.ehp .nm { font-size: 11px; text-align: center; color: #f1d9d2; text-shadow: 0 1px 3px #000, 0 0 2px #000; white-space: nowrap; display: flex; justify-content: center; gap: 4px; align-items: center; }
.ehp .nm .num { font-size: 12px; }
.ehp .sts { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
.sts .s { font-size: 10px; padding: 0 4px; border-radius: 3px; background: rgba(0,0,0,.7); color: #fff; font-family: var(--f-num); white-space: nowrap; flex: none; }
.sts .s.burn { background: #a83a12; } .sts .s.mark { background: #7a5a12; } .sts .s.stun { background: #555f70; } .sts .s.weak { background: #3d4f8a; } .sts .s.chan { background: #9a7a10; } .sts .s.frost { background: #2f6aa8; } .sts .s.arm { background: #4b5a72; }
.etap { position: absolute; z-index: 5; transform: translate(-50%, -50%); border-radius: 50%; border: 0; background: transparent; cursor: pointer; }
.etap.can { box-shadow: 0 0 0 2px rgba(255,208,138,.0); }
.etap.can::after { content: ""; position: absolute; inset: 12%; border-radius: 50%; border: 2px dashed rgba(255,208,138,.85); animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.b-win { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 8px; }
.win { position: relative; border-radius: 10px 10px 6px 6px; cursor: pointer; aspect-ratio: 0.78; min-height: 0; border: 0; padding: 0; background: transparent; }
.win .wl { position: absolute; left: 4px; right: 4px; bottom: 4px; display: grid; gap: 2px; pointer-events: none; }
.win .wn { font-size: 11.5px; font-weight: 700; text-align: center; text-shadow: 0 1px 3px #000, 0 0 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win .t { height: 6px; border-radius: 3px; background: rgba(0,0,0,.7); overflow: hidden; }
.win .t i { display: block; height: 100%; background: linear-gradient(90deg, #3fae78, #8ff0b4); transition: width .35s; }
.win .t.res i { background: linear-gradient(90deg, #c86a12, #ffd34a); }
.win .t.res { height: 4px; }
.win .wst { position: absolute; top: 4px; left: 4px; right: 4px; display: flex; gap: 2px; flex-wrap: wrap; pointer-events: none; }
.win.sel { filter: drop-shadow(0 0 10px rgba(255,190,90,.75)); }
.win.done { filter: brightness(.6) saturate(.6); }
.win.down { filter: grayscale(1) brightness(.45); }
.win.tgt::after { content: ""; position: absolute; inset: -3px; border-radius: 12px; border: 2px dashed #8ff0b4; animation: lowpulse 1s infinite; }
.win .armtag { position: absolute; top: -8px; right: -2px; font-family: var(--f-num); font-size: 12px; padding: 0 6px; border-radius: 9px; background: #4b5a72; box-shadow: 0 0 0 1px #9fb0c8; }
.win .ulti { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: 10px; padding: 0 6px; border-radius: 9px; background: linear-gradient(180deg, #ffd34a, #e08a12); color: #3a1a00; font-weight: 700; white-space: nowrap; box-shadow: 0 0 12px rgba(255,200,60,.7); }
.b-panel { position: relative; z-index: 3; padding: 8px 8px calc(var(--safe-b) + 10px); display: grid; gap: 8px; }
.b-skills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; min-height: 92px; }
.skill {
  appearance: none; border: 0; cursor: pointer; border-radius: 9px; padding: 7px 6px 6px; display: grid; gap: 2px; align-content: start; text-align: left; color: var(--frost);
  background: linear-gradient(180deg, #273246, #172030); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 1px rgba(150,180,220,.2); position: relative; min-height: 88px;
}
.skill b { font-family: var(--f-disp); font-weight: 900; font-size: 14px; letter-spacing: .02em; }
.skill small { font-size: 11px; line-height: 1.38; color: var(--frost-2); }

/* ---------- 浮動特效 ---------- */

  text-shadow: 0 2px 0 #000, 0 0 10px rgba(0,0,0,.8), 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000; animation: popup 1s cubic-bezier(.2,.9,.3,1) forwards; }

.pop.heal { color: #8ff0b4; }
.pop.frost { color: #a9d4ff; font-size: 20px; }
.pop.small { font-size: 18px; }
.pop.word { font-family: var(--f-disp); font-weight: 900; font-size: 22px; color: #ffe2c8; }
@keyframes popup { 0% { transform: translate(-50%, -30%) scale(.6); opacity: 0; } 18% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -150%) scale(1); opacity: 0; } }
.bigstamp { position: absolute; transform: translate(-50%, -50%) rotate(-12deg); font-family: var(--f-disp); font-weight: 900; font-size: 34px; color: #e2402a; border: 4px solid currentColor; padding: 0 12px; border-radius: 6px; letter-spacing: .2em;
  background: rgba(255,240,230,.06); text-shadow: 0 0 1px rgba(0,0,0,.5); animation: stampin .9s cubic-bezier(.2,1.6,.4,1) forwards; filter: url(#rough); }
@keyframes stampin { 0% { transform: translate(-50%, -50%) rotate(-24deg) scale(2.6); opacity: 0; } 22% { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(1.04); } }
.cutin { position: absolute; inset: 0; display: grid; place-items: center; animation: cutbg 1.25s ease-out forwards; background: radial-gradient(ellipse at 50% 50%, rgba(255,140,40,.25), rgba(0,0,0,.75) 60%); }
.cutin .band { position: relative; width: 120%; height: 168px; transform: rotate(-7deg); background: linear-gradient(90deg, rgba(30,14,4,0), rgba(30,14,4,.96) 18%, rgba(30,14,4,.96) 82%, rgba(30,14,4,0)); display: flex; align-items: center; justify-content: center; gap: 18px; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,190,90,.5); animation: bandin 1.25s cubic-bezier(.2,.9,.2,1) forwards; }
.cutin .band img { height: 160px; width: 132px; object-fit: cover; border-radius: 6px; box-shadow: 0 0 0 2px #ffcf7a; }
.cutin .band b { font-family: var(--f-disp); font-weight: 900; font-size: 44px; letter-spacing: .12em; color: #fff1d6; text-shadow: 0 0 24px rgba(255,150,50,.9), 0 3px 0 #6a2a00; }

@keyframes cutbg { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes bandin { 0% { transform: rotate(-7deg) translateX(-60%); } 18% { transform: rotate(-7deg) translateX(0); } 80% { transform: rotate(-7deg) translateX(2%); } 100% { transform: rotate(-7deg) translateX(70%); } }
.flash { position: absolute; inset: 0; background: #fff; animation: flash .35s ease-out forwards; mix-blend-mode: screen; }
.flash.red { background: #ff2a10; mix-blend-mode: normal; animation-duration: .5s; }

/* ---------- 吐司 ---------- */

.toast { justify-self: center; max-width: 100%; padding: 8px 14px; border-radius: 8px; font-size: 13.5px; line-height: 1.45; background: rgba(12,17,27,.95); box-shadow: inset 3px 0 0 var(--ember), 0 8px 22px rgba(0,0,0,.55), 0 0 0 1px rgba(150,180,220,.14);
  animation: toastin .35s cubic-bezier(.2,.9,.3,1.2), toastout .4s ease-in forwards; animation-delay: 0s, var(--life, 2.6s); }
.toast.cold { box-shadow: inset 3px 0 0 var(--cold), 0 8px 22px rgba(0,0,0,.55), 0 0 0 1px rgba(150,180,220,.14); }

/* ---------- 行車中 ---------- */
.travel { pointer-events: auto; cursor: pointer; }

.log-list { flex: 1; padding: 0 12px calc(var(--safe-b) + 84px); display: grid; gap: 10px; align-content: start; }

.frag .src { margin-top: 6px; font-size: 12px; color: var(--ink-2); }

.endrow b { font-family: var(--f-disp); font-size: 17px; font-weight: 900; }
.endrow small { display: block; color: var(--frost-2); font-size: 12.5px; line-height: 1.5; }
.endrow.locked b { color: var(--mist); }

/* ---------- 雜項 ---------- */
.tip { position: absolute; z-index: 25; max-width: 270px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.55; background: #fff3dc; color: #2a1a08; box-shadow: 0 10px 26px rgba(0,0,0,.55); animation: toastin .35s cubic-bezier(.2,.9,.3,1.2); }
.tip b { color: #a2400e; }
.tip .ok { margin-top: 8px; display: flex; justify-content: flex-end; }
.tip .ok button { appearance: none; border: 0; background: #2a1a08; color: #fff3dc; border-radius: 6px; padding: 5px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
.pane { padding: 14px; display: grid; gap: 10px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--frost-2); }
.field input[type=range] { width: 100%; accent-color: var(--ember); }
.field textarea { width: 100%; min-height: 70px; border-radius: 8px; background: #0b111c; color: var(--frost); border: 1px solid rgba(150,180,220,.25); padding: 8px; font-family: var(--f-type); font-size: 12px; user-select: text; -webkit-user-select: text; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.pick-list { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(150,180,220,.12); cursor: pointer; text-align: left; border: 0; color: inherit; width: 100%; }
.pick img { width: 44px; height: 52px; border-radius: 6px; object-fit: cover; }
.pick b { font-family: var(--f-disp); font-size: 15px; }
.pick small { display: block; font-size: 12px; color: var(--frost-2); }
.pick.on { box-shadow: inset 0 0 0 2px var(--ember), 0 0 14px rgba(255,154,60,.25); background: rgba(255,154,60,.08); }
.pick.off { opacity: .45; }
.pick .cost { font-family: var(--f-num); font-size: 15px; color: var(--ember-2); }
.relic { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(150,180,220,.12); }
.relic .ri { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,154,60,.12); color: var(--ember-2); }
.relic .ri .ico { width: 22px; height: 22px; }
.relic b { font-family: var(--f-disp); font-size: 15px; }
.relic small { display: block; font-size: 12.5px; color: var(--frost-2); line-height: 1.5; }
#rotate { position: fixed; inset: 0; z-index: 100; background: #070b14; display: grid; place-items: center; text-align: center; }
#rotate b { display: block; font-family: var(--f-disp); font-size: 22px; letter-spacing: .1em; }

.shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(3px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- 戰鬥車窗細節 ---------- */
.win .wimg { position: absolute; inset: 0; border-radius: 10px 10px 6px 6px; overflow: hidden; background: #2a160a;
  box-shadow: inset 0 0 0 3px #0b0e14, inset 0 0 0 5px #3a4252, 0 6px 14px rgba(0,0,0,.6); }
.win .wimg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.win .wimg::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 3px #0b0e14, inset 0 0 0 5px #4a5466, inset 0 -40px 30px -10px rgba(0,0,0,.75); pointer-events: none; }
.win .frost { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s;
  background: radial-gradient(ellipse at 0 100%, rgba(230,242,255,.95), rgba(230,242,255,0) 55%), radial-gradient(ellipse at 100% 0, rgba(230,242,255,.85), rgba(230,242,255,0) 50%), rgba(170,205,255,.25); mix-blend-mode: screen; }
.win .glass { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.14) 0 18%, rgba(255,255,255,0) 19% 60%, rgba(255,255,255,.07) 61% 66%, rgba(255,255,255,0) 67%); }
.win .wl { z-index: 2; }
.win .wst { z-index: 2; }
.claw { position: absolute; inset: -6px; z-index: 3; pointer-events: none; border-radius: 12px; animation: claw .55s ease-out forwards;
  background: linear-gradient(118deg, transparent 0 30%, rgba(255,70,50,.95) 31% 33%, transparent 34% 44%, rgba(255,70,50,.95) 45% 47%, transparent 48% 58%, rgba(255,70,50,.95) 59% 61%, transparent 62%); }
.claw.ice { background: linear-gradient(118deg, transparent 0 30%, rgba(190,225,255,.95) 31% 33%, transparent 34% 44%, rgba(190,225,255,.95) 45% 47%, transparent 48% 58%, rgba(190,225,255,.95) 59% 61%, transparent 62%); }
@keyframes claw { 0% { clip-path: inset(0 100% 0 0); opacity: 1; } 35% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 0; } }
.endturn.pulse { animation: endpulse 1.2s ease-in-out infinite; }
@keyframes endpulse { 50% { box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 0 0 1px #8a3e0e, 0 0 26px rgba(255,150,60,.75); } }
.b-stage .etap { z-index: 5; }

.tr-list, .st-list, .log-list, .board .list, .pick-list, .trade { grid-auto-rows: max-content; }
.car .art { height: 92px; }

.ovr { flex: 1; min-height: 0; display: flex; flex-direction: column; }

#hud .res { cursor: pointer; }
.legend { display: grid; gap: 8px; }

</svg>
<script>/* ---- 00_core.js ---- */
'use strict';
/* ============ 基礎工具 ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),

};
const sleep = ms => new Promise(r => setTimeout(r, ms));
function h1(n) { n = (n << 13) ^ n; return 1 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824; } // [-1,1]
function h01(n) { return (h1(n | 0) + 1) / 2; }
function hstr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmt(n) { return (n > 0 ? '+' : '') + n; }

const DBG = { fast: 1 };
/* ============ 局內亂數（可存檔重現） ============ */
let RUN = null;   // 目前這一趟
let META = null;  // 跨局的紀錄
function rnd() {
  if (!RUN) return Math.random();
  RUN.rs = (RUN.rs + 0x6D2B79F5) | 0;
  let t = RUN.rs;
  t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);

}
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

const chance = p => rnd() < p;
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(list, wf) { let tot = 0; for (const x of list) tot += wf(x); let r = rnd() * tot; for (const x of list) { r -= wf(x); if (r <= 0) return x; } return list[list.length - 1]; }

/* ============ 存檔 ============ */
const SAVE_NS = 'southbound.v1.';
const Store = {
  mem: {},
  get(k) { try { const v = localStorage.getItem(SAVE_NS + k); if (v != null) return JSON.parse(v); } catch (e) { } return this.mem[k] ?? null; },
  set(k, v) { this.mem[k] = JSON.parse(JSON.stringify(v)); try { localStorage.setItem(SAVE_NS + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(SAVE_NS + k); } catch (e) { } },
};
function defaultMeta() {
  return {
    v: 1, runs: 0, frags: {}, endings: {}, met: {}, seen: {}, best: { act: 0, km: 0, saved: 0 },
    unlocked: { pax: [], cars: [] }, history: [],
    settings: { music: .65, sfx: .85, vib: true, text: 1, anim: 1 },
  };
}
function loadMeta() {
  const m = Store.get('meta');
  const d = defaultMeta();
  if (!m) return d;
  return Object.assign(d, m, { settings: Object.assign(d.settings, m.settings || {}), best: Object.assign(d.best, m.best || {}), unlocked: Object.assign(d.unlocked, m.unlocked || {}) });
}
function saveMeta() { Store.set('meta', META); }
function saveRun() { if (RUN && !RUN.over) Store.set('run', RUN); }
function clearRun() { Store.del('run'); }
function exportCode() {
  const data = { meta: META, run: RUN && !RUN.over ? RUN : null };
  return 'SB1.' + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function importCode(code) {

function uid() { RUN.uidN = (RUN.uidN || 10) + 1; return 'u' + RUN.uidN; }

function mkPax(src) {

  const p = { uid: uid(), pid: t.pid || null, n: t.n, age: t.age, sex: t.sex, role: t.role, spec: t.spec, cls: t.cls, traits: (t.traits || []).slice(), bio: t.bio, look: t.look || null, stress: 10, broke: null, resolve: null, boarded: RUN ? RUN.day : 1, guard: false, car: null };
  p.maxHp = t.hp + (p.traits.includes('tough') ? 6 : 0) + (p.traits.includes('bear') ? 10 : 0); p.hp = p.maxHp;
  return p;
}
function lookOf(p) { return p.look || LOOKS[p.pid] || LOOKS.wei; }

function pxByPid(pid) { return RUN && RUN.pax.find(p => p.pid === pid && p.alive !== false); }

function occOf(c) { return RUN.pax.filter(p => p.car === c.uid).length; }
function totalSeats() { return bodyCars().reduce((a, c) => a + seatCap(c), 0); }
function autoSeat(p) {
  if (p.pid === 'wei') { p.car = RUN.cars[0].uid; return; }
  const cars = bodyCars().filter(c => seatCap(c) > 0);
  const free = cars.find(c => occOf(c) < seatCap(c));
  p.car = (free || cars.sort((a, b) => seatCap(b) - seatCap(a))[0] || RUN.cars[0]).uid;
}
function reseatAll() { RUN.pax.forEach(p => { const c = RUN.cars.find(c => c.uid === p.car); if (!c || (p.pid !== 'wei' && seatCap(c) === 0)) autoSeat(p); }); rebalanceSeats(); }
function rebalanceSeats() {
  const w = warmMap(), cars = bodyCars().filter(c => seatCap(c) > 0);
  cars.forEach(c => { let over = occOf(c) - seatCap(c); if (over <= 0) return;
    RUN.pax.filter(p => p.car === c.uid && p.pid !== 'wei').slice(0, over).forEach(p => { const free = cars.filter(o => o !== c && occOf(o) < seatCap(o)).sort((a, b) => (w[b.uid] ?? 1) - (w[a.uid] ?? 1))[0]; if (free) p.car = free.uid; }); });
}

/* ---- 熱 ---- */
function stokerCount() { let n = 0; RUN.pax.forEach(p => { if (p.spec === 'stoker') n += (p.pid === 'lu' && RUN.upg.luDouble) ? 2 : 1; }); return Math.min(3, n); }
function heatOutput(level = RUN.furnace) { return Math.max(1, HEAT_BASE[level] + stokerCount() * 2 + (hasRelic('heater') ? 2 : 0) - (RUN.coldWave ? 3 : 0)); }
const ACT_COLD = { 1: 1, 2: 1.25, 3: 1.5 };
function carNeed(c) { return (CARS[c.type].heat || 0) * (c.insul ? .6 : 1) * (c.armor <= 0 ? 1.5 : 1) * (ACT_COLD[RUN.act] || 1); }
function warmMap(level = RUN.furnace) {
  let rem = heatOutput(level); const eff = RUN.upg.pipes ? .95 : .89, out = {};
  bodyCars().forEach((c, k) => {
    const need = carNeed(c); if (need <= 0) { out[c.uid] = c.type === 'cargo' ? .2 : 1; return; }
    const e = Math.pow(eff, k), del = Math.min(need, rem * e); rem -= del / e; out[c.uid] = del / need;
  });
  if (rem > 0.5) bodyCars().forEach(c => { if (carNeed(c) > 0) out[c.uid] = Math.min(1.2, out[c.uid] + rem * .03); });
  RUN.cars.forEach(c => { if (CARS[c.type].fixed) out[c.uid] = 1.1; });
  return out;
}
function heatNeedTotal() { return bodyCars().reduce((a, c) => a + carNeed(c), 0); }
function warmOf(p) { if (p.pid === 'wei') return 1.1; return warmMap()[p.car] ?? 1; }
function warmLabel(w) { return w >= 1 ? ['溫暖', 'warm'] : w >= .6 ? ['微涼', ''] : w >= .3 ? ['寒冷', 'cold'] : ['凍僵', 'bad']; }
function coalPerDay(level = RUN.furnace) { const n = bodyCars().length; return COAL_BASE[level] + Math.ceil(Math.max(0, n - 4) / 2) - (level === 3 && hasRelic('coalstar') ? 1 : 0); }
function foodPerDay() {
  let eat = 0; RUN.pax.forEach(p => { eat += p.traits.includes('child') || p.traits.includes('infant') ? .5 : p.traits.includes('bear') ? 1.5 : 1; });
  let k = RATION[RUN.ration].k;
  if (RUN.pax.some(p => p.spec === 'cook')) k *= hasCar('kitchen') ? .75 : .85;
  if (RUN.pax.some(p => p.traits.includes('thrifty'))) k *= .9;
  if (RUN.flags.moGives) k *= .95;
  return eat / 2 * k;
}
function stressMul(p) { let k = 1; if (p.traits.includes('calm')) k *= .7; if (p.traits.includes('steady')) k *= .8; if (hasRelic('icon')) k *= .85; if (RUN.hope >= 75) k *= .8; if (RUN.hope <= 30) k *= 1.25; if (p.resolve === 'stalwart') k *= .5; return k; }
function addStress(p, n) { if (!p || p.pid === 'wei' && n > 0) { if (p) p.stress = clamp(p.stress + n * .6, 0, 100); return; } p.stress = clamp(p.stress + (n > 0 ? n * stressMul(p) : n), 0, 100); }

/* ---- 結果紀錄（事件、每日結算） ---- */
let OUT = null;
function outStart() { OUT = { d: {}, lines: [] }; }
function outDelta(k, n) { if (!OUT || !n) return; OUT.d[k] = (OUT.d[k] || 0) + n; }
function res(k, n) {
  if (!n) return 0; const caps = { coal: coalCap(), food: foodCap(), parts: partsCap(), hope: 100, seats: 999 };
  const before = RUN[k]; RUN[k] = clamp(Math.round((RUN[k] + n) * 10) / 10, 0, caps[k] ?? 9999);
  if (k === 'hope' && RUN.hope < 20 && hasRelic('drawing') && !RUN.flags['drawing' + RUN.act]) { RUN.flags['drawing' + RUN.act] = 1; RUN.hope += 15; }
  const d = Math.round((RUN[k] - before) * 10) / 10; outDelta(k, d); return d;
}
function killPax(p, why) {

  RUN.stats.deaths++; RUN.guards = RUN.guards.filter(u => u !== p.uid);

}

function hurtPax(p, n) { if (!p) return; p.hp = clamp(p.hp - n, 0, p.maxHp); if (p.hp <= 0) { if (p.pid === 'wei') p.hp = 1; else killPax(p, '傷得太重，沒能撐過去'); } }
function healPax(p, n) { if (!p) return; p.hp = clamp(p.hp + n, 0, p.maxHp); }

/* ---- 抽屜 ---- */
let SHEET_CB = null, SHEET_T = null;
function sheet(html, mount, o = {}) {
  const s = $('#sheet'), v = $('#sheet-veil'); if (SHEET_T) { clearTimeout(SHEET_T); SHEET_T = null; }
  s.innerHTML = `<div class="grab"></div><div class="sh-body">${html}</div>`; s.hidden = false; v.hidden = false;
  requestAnimationFrame(() => { s.classList.add('open'); v.classList.add('open'); });

function closeSheet() {

}

function askConfirm(title, text, ok = '確定', cancel = '取消', danger = false) {

function showBroadcast(bc, done) {
  const lines = bc.lines; let i = 0, ci = 0, typing = true, finished = false;

  const v = $('#rd-v');

    if (!typing) return;
    if (i >= lines.length) { typing = false; v.innerHTML = lines.map(l => `<div class="q">「${l}」</div>`).join(''); countDown(); return; }
    ci++; const shown = lines.slice(0, i).map(l => `<div class="q">「${l}」</div>`).join('') + `<div class="q">「${plain[i].slice(0, ci)}<span class="caret"></span></div>`;
    v.innerHTML = shown; if (ci % 2) AU.play('tick');
    if (ci >= plain[i].length) { i++; ci = 0; setTimeout(step, 420); } else setTimeout(step, 46 / (META.settings.text || 1));
  };
  const countDown = () => { const el = $('#rd-n'); if (!el) return; const a = prev, b = bc.n, t0 = performance.now(); const f = now => { const k = Math.min(1, (now - t0) / 900); el.textContent = Math.round(lerp(a, b, ease.out(k))); if (k < 1) requestAnimationFrame(f); else if (a !== b) { AU.play(b > a ? 'gain' : 'lose'); el.parentElement.animate([{ transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 300 }); } }; requestAnimationFrame(f); finished = true; };
  setTimeout(step, 1200);
  o.addEventListener('click', () => {
    if (typing) { typing = false; v.innerHTML = lines.map(l => `<div class="q">「${l}」</div>`).join(''); countDown(); return; }
    if (!finished) return;
    AU.setAmb({ radio: 0 }); closeOverlay(); done && done();
  });
}
