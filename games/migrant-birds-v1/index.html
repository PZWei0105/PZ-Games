<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>候鳥不歸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
:root{
  --night:#0f191c; --deep:#142227; --raise:#1a2b31; --line:#243840; --line2:#34505a;
  --fog:#94a7a2; --paper:#ebe4d6; --paper2:#cbc3b2;
  --lamp:#dca052; --lamp2:#f0c27f; --blossom:#dca79d; --seal:#b8473a;
  --white:#f3f0e8; --whiteink:#58564f;
  --f-kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti","KaiTi",serif;
  --f-body:"Noto Serif TC","Songti TC","PMingLiU","MingLiU","Source Han Serif TC",serif;
  --fs:17px;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night)}
body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:var(--fs);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit}
button:focus-visible,textarea:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--lamp2);outline-offset:2px}

/* ---------- layout ---------- */
#app{height:100%;display:grid;grid-template-rows:auto minmax(150px,38%) minmax(0,1fr);gap:10px;padding-inline:16px;padding-block:0 6px;box-sizing:border-box;max-width:1320px;margin-inline:auto}
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1.38fr) minmax(360px,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:30px;padding-block:0 18px}
  #hud{grid-column:1/-1}
  #stage{align-self:center;aspect-ratio:16/10;max-height:calc(100% - 12px)}
  #panel{padding-top:4px}
}
@media (max-height:520px) and (orientation:landscape){
  #app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:18px}
  #hud{grid-column:1/-1}
  #stage{max-height:calc(100% - 12px)}
}

/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:8px;padding-block:10px 2px;min-width:0}
#hud-ch{flex:1;min-width:0;font-family:var(--f-kai);font-size:15px;letter-spacing:.14em;color:var(--paper2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud-clock{display:flex;align-items:center;gap:8px;font-family:var(--f-kai);color:var(--lamp2);font-size:15px;letter-spacing:.1em;white-space:nowrap}
#hud-clock .dots{display:flex;gap:3px}
#hud-clock .dots i{width:5px;height:5px;border-radius:50%;background:#2d4148}
#hud-clock .dots i.on{background:var(--lamp)}
.hb{appearance:none;background:none;border:1px solid var(--line2);color:var(--paper2);font-family:var(--f-kai);font-size:14px;min-width:36px;height:32px;padding:0 9px;border-radius:3px;cursor:pointer;letter-spacing:.06em;transition:border-color .2s,color .2s}
.hb:hover{border-color:var(--lamp);color:var(--paper)}
@media (max-width:430px){#hud-clock .dots{display:none}#hud-ch{letter-spacing:.04em;font-size:14px}.hb{padding:0 7px;min-width:32px}#hud{gap:6px}}

/* ---------- stage (a mounted scroll painting) ---------- */
#stage{position:relative;overflow:hidden;border-radius:2px;background:#0b1114;margin:6px;box-shadow:0 0 0 1px #3a5058,0 0 0 5px var(--night),0 0 0 6px #22343a;cursor:pointer;min-height:0}
.bgl{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease,filter 1.4s ease}
.bgl svg,#map svg{width:100%;height:100%;display:block}
#map{position:absolute;inset:0;background:#101c21;transition:filter 1.4s ease}
#fx,#veil{position:absolute;inset:0;pointer-events:none}
#fx{width:100%;height:100%}
#veil{transition:background 1.4s ease}
#fadebar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--white);opacity:.75;transition:width 1.4s ease;pointer-events:none}
#map text{font-family:var(--f-kai);font-size:3.2px;fill:var(--paper);paint-order:stroke;stroke:#0e181c;stroke-width:.9px;stroke-linejoin:round}
#map text.dim{fill:#9aaca7}
#map text.gone{fill:#f3f0e8;opacity:.72}
#map text.nw{font-size:2.4px;fill:#1d1c19;stroke:#f3f0e8;stroke-width:1.4px;letter-spacing:.3px}
#map .node{cursor:pointer}
#map .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(1.6)}}
.flock{animation:fly 46s linear infinite}
.flock.f2{animation-duration:66s;animation-delay:-24s}
@keyframes fly{from{transform:translateX(-140px)}to{transform:translateX(540px)}}
.tw{animation:tw 3.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .22s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(.86) scaleX(1.06)}}
.steam{animation:steam 3.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}50%{opacity:.55}100%{opacity:0;transform:translateY(-8px)}}

/* ---------- text panel ---------- */
#panel{position:relative;min-height:0;display:flex;flex-direction:column;cursor:pointer}
#scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 4px 44px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior:contain}
#log{font-size:var(--fs);line-height:1.95;letter-spacing:.02em;max-width:34em}
#log>*{margin:0 0 .85em;animation:rise .55s ease both}
#log .dl p{margin:0}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dlg{display:flex;gap:11px;align-items:flex-start}
.seal{flex:none;width:28px;height:28px;border:1.5px solid var(--c);color:var(--c);font-family:var(--f-kai);font-size:16px;line-height:1;display:grid;place-items:center;border-radius:3px;margin-top:5px;background:rgba(255,255,255,.02);font-weight:700}
.dl{min-width:0}
.who{display:block;font-family:var(--f-kai);font-size:12.5px;letter-spacing:.16em;color:var(--c);line-height:1.5}
.sys{font-size:.86em;color:var(--fog);border-left:2px solid var(--line2);padding-left:11px;line-height:1.85}
.center{text-align:center;font-family:var(--f-kai);font-size:1.12em;letter-spacing:.08em;margin-inline:auto!important;max-width:22em}
.song{font-family:var(--f-kai);color:var(--blossom);border-left:1px solid rgba(220,167,157,.45);padding-left:12px;letter-spacing:.06em}
.ledger{font-family:var(--f-kai);color:var(--lamp2);background:rgba(220,160,82,.07);border:1px solid rgba(220,160,82,.28);padding:10px 14px;letter-spacing:.1em;border-radius:2px}
.carve,.call{font-family:var(--f-kai);text-align:center;letter-spacing:.3em;font-size:1.22em}
.call{color:var(--lamp2)}
.script,.stele{font-family:var(--f-kai);border:1px solid var(--line2);padding:12px 14px;line-height:2.05;background:rgba(235,228,214,.035)}
.stele{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.1));color:var(--paper2);letter-spacing:.06em}
.echo{font-family:var(--f-kai);color:var(--lamp);padding-left:20px;position:relative}
.echo::before{content:'';position:absolute;left:0;top:.98em;width:12px;height:1.5px;background:var(--lamp)}
.dzp .dz{display:inline-block;animation:dz 1.7s ease forwards;animation-delay:var(--d)}
.fs-mem.now .dz{animation-delay:calc(var(--d) - 1.5s)}
@keyframes dz{to{opacity:.05;filter:blur(2px);transform:translate(var(--x),var(--y))}}
#choices{display:flex;flex-direction:column;gap:8px;max-width:34em;padding-bottom:10px}
.chb{appearance:none;text-align:left;background:var(--deep);border:1px solid var(--line2);color:var(--paper);font:inherit;font-size:.95em;line-height:1.65;padding:11px 14px 11px 36px;border-radius:3px;position:relative;cursor:pointer;transition:border-color .2s,background .2s;animation:rise .45s ease both}
.chb::before{content:'';position:absolute;left:14px;top:1.35em;width:12px;height:1.5px;background:var(--lamp)}
.chb:hover,.chb:focus-visible{border-color:var(--lamp);background:#1c2e35}
#more{position:absolute;right:4px;bottom:6px;font-family:var(--f-kai);font-size:12px;color:var(--lamp);letter-spacing:.24em;animation:breath 1.8s ease-in-out infinite;pointer-events:none}
@keyframes breath{50%{opacity:.3}}

/* ---------- night map panel ---------- */
.hstat{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hh{font-family:var(--f-kai);font-size:1.5em;color:var(--lamp2);letter-spacing:.1em}
.hl{color:var(--fog);font-size:.9em}
.hl b{color:var(--paper);font-weight:600}
.hhint{color:var(--fog);font-size:.86em}
.llist{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.lrow{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--deep);border:1px solid var(--line);color:var(--paper);font:inherit;font-size:.92em;padding:10px 12px;border-radius:3px;cursor:pointer;text-align:left;transition:border-color .2s}
.lrow:hover{border-color:var(--lamp)}
.lrow.live{border-color:#5a4a2e}
.lrow .ln{font-family:var(--f-kai);letter-spacing:.08em}
.lrow .lt{font-size:.8em;color:var(--fog);display:flex;gap:6px;align-items:center;white-space:nowrap}
.lrow.live .lt{color:var(--lamp2)}
.lrow em{font-style:normal;color:#1d1c19;background:var(--white);padding:0 5px;border-radius:2px;font-size:.92em}
.lrow.gone{opacity:.55;background:transparent;border-style:dashed}
.lrow.idle{opacity:.75}
.lwait{appearance:none;background:none;border:none;color:var(--fog);font:inherit;font-size:.85em;margin-top:14px;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.lprev h3{font-family:var(--f-kai);font-size:1.35em;letter-spacing:.12em;margin:0 0 .3em;font-weight:700}
.ldesc{margin:0 0 .5em}
.lnote{font-size:.85em;color:var(--white);opacity:.82;margin:0}
.lbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.go,.pk-ok,.fr-ok,.tr-go,.tsb.main{appearance:none;background:var(--lamp);color:#1a140c;border:1px solid var(--lamp);font-family:var(--f-kai);font-size:1.02em;letter-spacing:.14em;padding:10px 20px;border-radius:3px;cursor:pointer;transition:background .2s}
.go:hover,.pk-ok:hover,.fr-ok:hover,.tr-go:hover{background:var(--lamp2)}
.go{display:flex;gap:10px;align-items:baseline}
.go small{font-family:var(--f-body);font-size:.72em;letter-spacing:0;opacity:.75}
.go.alt{background:transparent;color:var(--lamp2)}
.bk,.x,.vol-b button,.cf-b button,.tsb{appearance:none;background:none;border:1px solid var(--line2);color:var(--paper2);font-family:var(--f-kai);font-size:.95em;letter-spacing:.1em;padding:9px 14px;border-radius:3px;cursor:pointer;transition:border-color .2s,color .2s}
.bk:hover,.x:hover,.vol-b button:hover,.cf-b button:hover,.tsb:hover{border-color:var(--lamp);color:var(--paper)}
button:disabled{opacity:.4;cursor:default}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translate(-50%,-8px);background:rgba(20,34,39,.95);border:1px solid var(--line2);color:var(--paper);font-family:var(--f-kai);font-size:14px;letter-spacing:.12em;padding:8px 16px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:70;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- overlays ---------- */
#ov{position:fixed;inset:0;z-index:50;overflow-y:auto;background:rgba(7,12,14,.93);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-sizing:border-box;display:flex;overscroll-behavior:contain}
#ov>div{width:min(680px,100%);margin:auto;animation:rise .5s ease both}
.fs-h h2,.pk-h h2,.bk-h h2{font-family:var(--f-kai);font-size:1.7em;letter-spacing:.24em;margin:0 0 .25em;font-weight:700}
.fs-h p,.pk-h p{margin:0;color:var(--paper2);line-height:1.85}
.fs-sub{color:var(--fog)!important;font-size:.9em;margin-top:.2em!important}

.ov-title{background:#070b0d!important;cursor:pointer}
.tc{display:flex;flex-direction:column;align-items:center;gap:30px;min-height:60vh;justify-content:center}
.tc-in{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:20px}
.tc-a{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.2;font-family:var(--f-kai);font-size:16px;letter-spacing:.5em;color:var(--fog)}
.tc-b{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.12;font-family:var(--f-kai);font-weight:700;font-size:clamp(52px,12vw,80px);letter-spacing:.18em;margin:0;color:var(--paper);animation:inkin 2s ease both}
.tc-c{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.2;font-family:var(--f-kai);font-size:16px;letter-spacing:.3em;color:var(--lamp2);margin-top:3.2em;animation:rise 2s .8s ease both}
.tc-tap,.wh-tap{font-family:var(--f-kai);font-size:12px;letter-spacing:.34em;color:var(--fog);animation:breath 2s ease-in-out infinite}
@keyframes inkin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.ov-white{background:var(--white)!important;-webkit-backdrop-filter:none;backdrop-filter:none;cursor:pointer;animation:whiten 1.6s ease both}
@keyframes whiten{from{background:rgba(243,240,232,0)}}
.wh{text-align:center;font-family:var(--f-kai);font-size:1.15em;letter-spacing:.14em;line-height:2.4;min-height:50vh;display:flex;flex-direction:column;justify-content:center;gap:24px;color:var(--whiteink)}
.wh-l p{margin:0 0 .6em;animation:rise 1.4s ease both}
.wh-tap{color:#9a968c}

.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:18px 0 6px}
.pkc{appearance:none;text-align:left;display:grid;grid-template-columns:32px 1fr;grid-template-rows:auto 1fr;column-gap:10px;row-gap:2px;background:var(--deep);border:1px solid var(--line2);color:var(--paper);font:inherit;padding:12px;border-radius:3px;cursor:pointer;transition:border-color .25s,box-shadow .25s,opacity 1s,filter 1s,transform 1s}
.pkc .ic{grid-row:1/3;width:30px;height:30px;color:var(--blossom)}
.pkc .ic svg{width:100%;height:100%}
.pkc .pn{font-family:var(--f-kai);font-size:1.04em;letter-spacing:.08em}
.pkc .pd{font-size:.8em;color:var(--fog);line-height:1.7}
.pkc.on{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp),0 0 22px rgba(220,160,82,.22)}
.pkc.on .ic{color:var(--lamp2)}
.pkc.gone{opacity:0;filter:blur(6px);transform:translateY(-10px)}
.pk-f{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:-18px;padding:16px 0 4px;background:linear-gradient(rgba(7,12,14,0),rgba(7,12,14,.96) 35%)}
.pk-n{color:var(--fog);font-size:.9em}

.frow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:18px 0 10px}
.fb{appearance:none;background:none;border:1px solid transparent;border-radius:3px;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--paper2);font-family:var(--f-kai);min-width:0;transition:border-color .3s,background .3s}
.fb svg{width:100%;max-width:34px;height:auto;aspect-ratio:40/96;animation:sway 5s ease-in-out infinite;transform-origin:50% 90%;transition:filter 2.6s ease,opacity 2.6s ease,transform 2.6s ease}
.fb:nth-child(2n) svg{animation-delay:-1.3s}
.fb:nth-child(3n) svg{animation-delay:-2.6s}
.fb span{white-space:nowrap;font-size:11.5px;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:clip}
.fb.sel{border-color:var(--line2);background:rgba(255,255,255,.035)}
.fb.lost{color:#8e948f}
.fb.lost svg{animation:none;opacity:.75}
.fb.going svg{filter:brightness(3.2) saturate(0);opacity:.3;transform:translateY(-18px) rotate(14deg)}
@keyframes sway{50%{transform:rotate(3deg)}}
.fs-d{min-height:130px;border-top:1px solid var(--line);padding-top:14px}
.fs-d h3{font-family:var(--f-kai);font-size:1.25em;letter-spacing:.2em;margin:0 0 .4em;color:var(--lamp2);font-weight:700}
.fs-d h3.lostt{color:#8e948f}
.fs-mem{margin:0;line-height:2.05;font-size:1.02em}
.fs-mem.lostm{color:#a9aea9}
.fs-hint{color:var(--fog);margin:0}
.fs-btns{margin-top:14px}
.fs-ok{appearance:none;background:transparent;color:var(--white);border:1px solid var(--white);font-family:var(--f-kai);font-size:1.02em;letter-spacing:.2em;padding:10px 22px;border-radius:3px;cursor:pointer;transition:background .2s,color .2s}
.fs-ok:hover{background:var(--white);color:#1d1c19}
.fr-f{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.fr-n{color:var(--fog);font-size:.86em}

.vw-pre{font-family:var(--f-kai);font-size:1.28em;line-height:1.8;color:var(--lamp2);background:rgba(220,160,82,.06);border:1px solid rgba(220,160,82,.25);padding:14px 16px;margin:16px 0;min-height:3.6em;letter-spacing:.06em}
.vw-r{margin-bottom:14px}
.vw-l{font-size:.8em;color:var(--fog);letter-spacing:.18em;margin-bottom:6px}
.vw-cs{display:flex;flex-wrap:wrap;gap:8px}
.vwc{appearance:none;background:var(--deep);border:1px solid var(--line2);color:var(--paper);font:inherit;font-size:.92em;padding:8px 12px;border-radius:3px;cursor:pointer;text-align:left;line-height:1.5}
.vwc.on{border-color:var(--lamp);color:var(--lamp2);background:#221f18}

.ov-trial #ov,.ov-trial{align-items:flex-start}
.tr{display:flex;flex-direction:column;gap:14px}
.tr-top{display:grid;gap:8px}
.tr-r{font-family:var(--f-kai);letter-spacing:.24em;color:var(--fog);font-size:.9em}
.tr-g{display:flex;align-items:center;gap:10px;font-family:var(--f-kai);color:var(--paper2)}
.tg{flex:1;height:10px;background:#1b2a30;border-radius:5px;position:relative;overflow:hidden}
.tg i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6f8c86,#c9884e 55%,#b2493a);background-size:calc(100vw - 80px) 100%;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.tg b{position:absolute;top:0;bottom:0;width:2px;background:var(--white);opacity:.85}
.tr-s{font-family:var(--f-kai);font-size:1.3em;letter-spacing:.24em}
.tr-s[data-lv="3"]{color:#e0806a}
.tr-s[data-lv="2"]{color:var(--lamp2)}
.tr-s[data-lv="1"]{color:#a9c7b8}
.tr-mid{background:var(--deep);border:1px solid var(--line);border-radius:3px;padding:14px 14px 4px;line-height:1.9;min-height:120px}
.tr-mid .dlg{margin-bottom:.8em}
.tr-mid .dl p{margin:0}
.tr-react{color:var(--paper2);margin:0 0 .8em}
.tr-tip,.tr-quiet{color:var(--fog);font-size:.88em;margin:0 0 .7em}
.tr-hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tc2{appearance:none;text-align:left;background:#172229;border:1px solid var(--line2);color:var(--paper);font:inherit;padding:11px 12px;border-radius:3px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:72px;transition:border-color .2s}
.tc2:hover{border-color:var(--lamp)}
.tc2 .tn{font-family:var(--f-kai);font-size:1.05em;letter-spacing:.1em;color:var(--lamp2)}
.tc2 .th{font-size:.8em;color:var(--fog);line-height:1.6}
.tc2.weak{background:transparent}
.tc2.weak .tn{color:var(--paper2)}
.tc2.plea{border-color:var(--lamp)}
.tc2.sel{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp)}

<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ==========================================================
   候鳥不歸 — engine
   ========================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const CN = '〇一二三四五六七八九十';

/* ---------- registries (filled by story files) ---------- */
const SC = {}, HUB = {}, ITEMS = {}, PEOPLE = {}, COMP = {};
let FEATHERS = [];
const CH = { p: '序章　梅嶺茶寮', s1: '第一站　杏花坳', s2: '第二站　鹽井鎮', v1: '第一卷　杏花與鹽' };
function scene(id, def) { SC[id] = Array.isArray(def) ? { beats: def } : def; }
function hub(id, def) { HUB[id] = def; }

/* ---------- state ---------- */
const KEY = 'houniao.save.v1', PKEY = 'houniao.pref.v1';
let S = null, lastSaved = null;
let PREF = { sound: true, size: 'm' };
function newState() {
  return {
    v: 1, ch: 'p', scene: 'p_open', mode: 'scene', hub: null, hour: 0, fade: 0,
    f: {}, seenEv: {}, wit: [], book: [], names: {}, namesOrder: [],
    self: { mother: 1, father: 1, sister: 1, road: 1, name: 1, lantern: 1, dawn: 1 },
    lost: [], comp: [], ends: {}, snap: {}, t: Date.now(), pt: 0
  };
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};
function save() { const now = Date.now(); if (S.t) S.pt = (S.pt || 0) + Math.min(Math.max(0, now - S.t), 300000); S.t = now; lastSaved = JSON.stringify(S); store.set(KEY, lastSaved); }
const GAME_VER = 'v1.1';
function loadSave() {
  const raw = store.get(KEY); if (!raw) return null;
  try { const o = JSON.parse(raw); return o && o.v === 1 ? o : null; } catch (e) { return null; }
}
function loadPrefs() { try { const o = JSON.parse(store.get(PKEY) || '{}'); PREF = Object.assign(PREF, o); } catch (e) { /* ignore */ } }
function savePrefs() { store.set(PKEY, JSON.stringify(PREF)); }
function applyPrefs() {
  document.documentElement.style.setProperty('--fs', { s: '15.5px', m: '17px', l: '19px' }[PREF.size] || '17px');
  Au.setOn(PREF.sound);
  const sb = $('#b-sound'); if (sb) { sb.textContent = PREF.sound ? '聲' : '靜'; sb.setAttribute('aria-pressed', PREF.sound ? 'true' : 'false'); }
}

/* ---------- authoring helpers ---------- */
const has = k => !!S.self[k];
const comp = id => S.comp.includes(id);
const item = id => S.book.some(b => b.id === id);
const val = v => (typeof v === 'function' ? v(S) : v);

/* ---------- runtime ---------- */
const R = { q: [], tap: null, tapAt: 0, sel: null, keyOnce: null };

function enterScene(id, opt) {
  const sc = SC[id];
  if (!sc) { console.error('missing scene', id); return; }
  S.scene = id; S.mode = 'scene'; S.beat = 0; R.q = [];
  if (sc.ch) S.ch = sc.ch;
  save();
  UI.clear(); HUD.render();
  Stage.hideMap();
  if (sc.bg) Stage.bg(val(sc.bg));
  if (sc.amb) Au.amb(sc.amb);
  if (sc.fade != null) setFade(val(sc.fade));
  if (opt && opt.echo) UI.echo(opt.echo);
  step();
}
function nextBeat() {
  if (R.q.length) return R.q.shift();
  const sc = SC[S.scene];
  return sc && S.beat < sc.beats.length ? sc.beats[S.beat++] : undefined;
}
function step() {
  for (let guard = 0; guard < 800; guard++) {
    let b = nextBeat();
    if (b === undefined) { console.warn('scene ended without flow:', S.scene); return; }
    while (typeof b === 'function') b = b(S);
    if (b == null || b === false || b === '') continue;
    if (Array.isArray(b)) { R.q = b.concat(R.q); continue; }
    if (typeof b === 'string') { UI.say(b); return UI.wait(step); }
    if (b.do) b.do(S);
    if (b.snap) snapChapter(b.snap);
    if (b.bg) Stage.bg(val(b.bg));
    if (b.amb) Au.amb(b.amb);
    if (b.sfx) Au.sfx(b.sfx);
    if (b.fade != null) setFade(val(b.fade));
    if (b.wit) witness(b.wit);
    if (b.names) recordNames(b.names);
    if (b.card) toast('得到說詞　' + b.card);
    if (b.t != null) { UI.say(val(b.t), b.cls, b.who); return UI.wait(step); }
    if (b.choice) { const cs = b.choice.filter(c => !c.if || c.if(S)); return UI.choices(cs); }
    if (b.go) return enterScene(val(b.go));
    if (b.back) return backToHub(b);
    if (b.hub) return enterHub(b.hub);
    if (b.ui) return UIX[b.ui](b, step);
  }
}
function choose(c) {
  Au.sfx('pluck');
  const t = val(c.t);
  if (c.do) c.do(S);
  if (c.go) return enterScene(val(c.go), { echo: c.quiet ? null : t });
  if (!c.quiet) UI.echo(t);
  step();
}

/* ---------- hub (a night of hours) ---------- */
function locFaded(l) { return l.edge != null && S.hour > l.edge; }
function locEv(l) { if (locFaded(l)) return null; return (l.ev || []).find(e => !S.seenEv[e.id] && (!e.if || e.if(S))) || null; }
function locScout(l) { return (l.scout && comp('dou') && !S.f.scoutUsed && !locFaded(l) && (!l.scout.if || l.scout.if(S))) ? l.scout : null; }
function hubFade() { const hb = HUB[S.hub]; return Math.round(hb.fade[0] + (hb.fade[1] - hb.fade[0]) * (S.hour / hb.hours.length)); }
function enterHub(id) {
  const hb = HUB[id];
  if (S.hub !== id) { S.hub = id; S.hour = 0; }
  S.mode = 'hub'; S.scene = null; R.q = []; R.sel = null;
  save();
  UI.clear(); HUD.render();
  if (hb.amb) Au.amb(hb.amb);
  setFade(hubFade());
  MapView.render();
}
function backToHub(b) {
  const hb = HUB[S.hub];
  if (!b.free) S.hour += (typeof b.back === 'number' ? b.back : 1);
  if (S.hour >= hb.hours.length) { S.hour = hb.hours.length; setFade(hb.fade[1]); return enterScene(hb.onDawn); }
  enterHub(S.hub);
}
function goLoc(l, scout) {
  Au.sfx('page');
  if (scout) { S.f.scoutUsed = 1; R.sel = null; return enterScene(scout.sc); }
  const ev = locEv(l); if (!ev) return;
  S.seenEv[ev.id] = 1; R.sel = null; S.lastLoc = l.id;
  enterScene(ev.sc);
}
const MapView = {
  render() {
    Stage.showMap(Paint.map(S.hub, R.sel));
    UI.hubPanel();
  },
  pick(id) { R.sel = id; Au.sfx('page'); this.render(); }
};

/* ---------- fading ---------- */
function setFade(v) { S.fade = Math.max(0, Math.min(100, v)); applyFade(); }
function applyFade() {
  const f = (S ? S.fade : 0) / 100;
  const flt = `saturate(${(1 - f * 0.82).toFixed(3)}) sepia(${(f * 0.22).toFixed(3)}) brightness(${(1 + f * 0.3).toFixed(3)}) contrast(${(1 - f * 0.34).toFixed(3)})`;
  ['#bgA', '#bgB', '#map'].forEach(s => { const e = $(s); if (e) e.style.filter = f > 0.01 ? flt : ''; });
  const inner = Math.max(6, 80 - f * 64);
  $('#veil').style.background = `radial-gradient(ellipse 78% 74% at 50% 52%, rgba(243,240,232,0) ${inner}%, rgba(243,240,232,${Math.min(0.97, f * 1.08).toFixed(3)}) 100%)`;
  $('#fadebar').style.width = (f * 100).toFixed(1) + '%';
  FX.fade = f; Au.fade(f);
}

/* ---------- ledger helpers ---------- */
function witness(id) {
  (Array.isArray(id) ? id : [id]).forEach(i => {
    if (!ITEMS[i]) { console.warn('no item', i); return; }
    if (!S.wit.includes(i) && !item(i)) { S.wit.push(i); toast('記住了　' + val(ITEMS[i].n)); }
  });
}
function recordNames(arr) {
  const [key, place, list] = arr; const L = val(list) || [];
  S.names[key] = { place, list: L };
  if (!S.namesOrder.includes(key)) S.namesOrder.push(key);
  toast(`渡簿　${place}　${L.length} 個名字`);
}
function snapChapter(ch) { const c = JSON.parse(JSON.stringify(S)); c.snap = {}; S.snap[ch] = JSON.stringify(c); }
function restoreChapter(ch) {
  const raw = S.snap[ch]; if (!raw) return;
  const snaps = S.snap; S = JSON.parse(raw); S.snap = snaps;
  closeOv(); resume();
}
function resume() {
  HUD.render();
  if (S.mode === 'hub' && S.hub) { S.mode = 'scene'; const id = S.hub; enterHub(id); }
  else enterScene(S.scene);
}

/* ---------- stage ---------- */
const Stage = {
  cur: 0, curId: null, mapOn: false,
  bg(id) {
    const dyn = Paint.isDyn(id);
    if (id === this.curId && !dyn && !this.mapOn) return;
    this.curId = id;
    const A = [$('#bgA'), $('#bgB')];
    const nx = A[this.cur ^ 1], pv = A[this.cur];
    nx.innerHTML = Paint.bg(id);
    nx.style.opacity = 1; pv.style.opacity = 0; this.cur ^= 1;
    FX.set(Paint.fxOf(id));
    applyFade();
  },
  showMap(svg) { const m = $('#map'); m.innerHTML = svg; m.hidden = false; this.mapOn = true; FX.set('none'); applyFade(); },
  hideMap() { const m = $('#map'); if (!m.hidden) { m.hidden = true; m.innerHTML = ''; } this.mapOn = false; }
};

/* ---------- text panel ---------- */
function fmt(t) { return esc(t).replace(/\n/g, '<br>'); }
const UI = {
  clear() { $('#log').innerHTML = ''; $('#choices').innerHTML = ''; $('#more').hidden = true; R.tap = null; },
  say(text, cls, who) {
    let t = text, sp = who;
    if (typeof t === 'string' && !sp) {
      const m = /^([^\s|]{1,2})\|([\s\S]*)$/.exec(t);
      if (m && PEOPLE[m[1]]) { sp = m[1]; t = m[2]; }
    }
    const log = $('#log'); let node;
    if (sp && PEOPLE[sp]) {
      const P = PEOPLE[sp];
      node = h('div', 'dlg' + (cls ? ' ' + cls : ''));
      node.style.setProperty('--c', P.c);
      node.innerHTML = `<span class="seal" aria-hidden="true">${esc(P.s || sp)}</span><div class="dl"><span class="who">${esc(val(P.n))}</span><p>${fmt(t)}</p></div>`;
    } else {
      node = h('p', 'nar' + (cls ? ' ' + cls : ''));
      node.innerHTML = fmt(t);
    }
    if (cls && cls.split(' ').includes('dissolve')) dissolveText(node.querySelector('p') || node);
    log.appendChild(node); UI.scroll();
  },
  wait(cb) { R.tap = cb; R.tapAt = performance.now(); $('#more').hidden = false; },
  choices(cs) {
    const box = $('#choices'); box.innerHTML = '';
    cs.forEach(c => {
      const bt = h('button', 'chb'); bt.type = 'button'; bt.innerHTML = fmt(val(c.t));
      bt.onclick = () => { box.innerHTML = ''; choose(c); };
      box.appendChild(bt);
    });
    UI.scroll();
    const first = box.querySelector('button'); if (first && !('ontouchstart' in window)) first.focus({ preventScroll: true });
  },
  echo(t) { if (!t) return; const p = h('p', 'echo'); p.textContent = t; $('#log').appendChild(p); UI.scroll(); },
  scroll() { const sc = $('#scroll'); requestAnimationFrame(() => { sc.scrollTop = sc.scrollHeight; }); },
  hubPanel() {
    UI.clear();
    const hb = HUB[S.hub], n = hb.hours.length, left = n - S.hour;
    const log = $('#log');
    const top = h('div', 'hstat');
    top.innerHTML = `<span class="hh">${esc(hb.hours[S.hour])}時</span><span class="hl">離天亮，還有 <b>${left}</b> 個時辰</span>`;
    log.appendChild(top);

function dissolveText(p) {
  const txt = p.textContent; p.textContent = '';
  const chars = Array.from(txt); const n = chars.length;
  chars.forEach((ch, i) => {
    const s = h('span', 'dz'); s.textContent = ch;
    const back = n - 1 - i;
    s.style.setProperty('--d', (1.6 + back * 0.07 + Math.random() * 0.15).toFixed(2) + 's');
    s.style.setProperty('--x', ((Math.random() - 0.5) * 16).toFixed(1) + 'px');
    s.style.setProperty('--y', (-6 - Math.random() * 14).toFixed(1) + 'px');
    p.appendChild(s);
  });
  p.classList.add('dzp');
}

UIX.trial = (b, next) => {
  const T = TRIAL; let fear = T.start(S); const used = new Set(); let round = 0; let busy = false;
  const ov = openOv(`<div class="tr">
    <div class="tr-top"><div class="tr-r"></div>

    <div class="tr-hand"></div></div>`, 'ov-trial');
  const g = $('.tg i', ov), gm = $('.tg b', ov), st = $('.tr-s', ov), mid = $('.tr-mid', ov), hd = $('.tr-hand', ov), rr = $('.tr-r', ov);
  gm.style.left = T.good + '%';
  const upd = () => {
    g.style.width = fear + '%';
    const lv = fear > T.mid ? 3 : fear > T.good ? 2 : 1;
    st.textContent = ['', '人心漸定', '人心浮動', '群情洶湧'][lv]; st.dataset.lv = lv; g.dataset.lv = lv;
  };
  const line = (who, t) => { const P = PEOPLE[who]; return `<div class="dlg" style="--c:${P.c}"><span class="seal" aria-hidden="true">${esc(P.s || who)}</span><div class="dl"><span class="who">${esc(val(P.n))}</span><p>${fmt(t)}</p></div></div>`; };
  const cardHTML = (k, c) => `<button type="button" class="tc2${k === 'basic' || k === 'silence' ? ' weak' : ''}${k === 'plea' ? ' plea' : ''}" data-k="${k}"><span class="tn">${esc(c.n)}</span><span class="th">${esc(val(c.h))}</span></button>`;
  function showRound() {
    busy = false; upd();
    rr.textContent = round < 4 ? `井邊　第${CN[round + 1]}句` : '井邊　最後一句';
    const acc = round < 4 ? val(T.rounds[round]) : val(T.final);
    mid.innerHTML = line('韓', acc) + `<p class="tr-tip">${round < 4 ? '挑一句話回他。' : '天就要亮了。'}</p>`;
    const keys = round < 4 ? Object.keys(T.cards).filter(k => !used.has(k) && (!T.cards[k].if || T.cards[k].if(S))) : [];
    let html = keys.map(k => cardHTML(k, T.cards[k])).join('');
    if (round < 4) html += cardHTML('basic', T.basic) + cardHTML('silence', T.silence);
    else html = cardHTML('plea', T.plea);
    hd.innerHTML = html;
    $$('.tc2', hd).forEach(bt => bt.onclick = () => select(bt.dataset.k, bt));
  }
  function select(k, bt) {
    if (busy) return;
    $$('.tc2', hd).forEach(x => x.classList.toggle('sel', x === bt));
    let bar = $('.tr-say', hd);
    if (!bar) { bar = h('div', 'tr-say'); hd.appendChild(bar); }
    const c = k === 'basic' ? T.basic : k === 'silence' ? T.silence : k === 'plea' ? T.plea : T.cards[k];
    bar.innerHTML = `<p>${esc(c.n)}：${esc(val(c.h))}</p><button type="button" class="tr-go">${k === 'silence' ? '閉上嘴' : '說出來'}</button>`;
    $('.tr-go', bar).onclick = () => play(k);
    Au.sfx('pluck');
  }
  function play(k) {
    if (busy) return; busy = true;
    const c = k === 'basic' ? T.basic : k === 'silence' ? T.silence : k === 'plea' ? T.plea : T.cards[k];
    let d;
    if (k === 'plea') d = T.plea.d(fear);
    else if (k === 'basic' || k === 'silence') d = c.d;
    else { const m = val(c.d); d = (m[round] != null) ? m[round] : c.def; used.add(k); }
    const react = T.react(k, round, d, S, fear);
    const said = val(c.line);
    mid.innerHTML = (said ? line('葳', said) : `<p class="tr-quiet">他沒有開口。</p>`) + `<p class="tr-react">${fmt(react)}</p>`;
    hd.innerHTML = `<div class="tr-say"><p></p><button type="button" class="tr-go">${round < 4 ? '下一句' : '看結果'}</button></div>`;
    fear = Math.max(0, Math.min(100, fear + d)); upd();
    Au.sfx(d <= -15 ? 'gasp' : d > 0 ? 'angry' : 'murmur');
    $('.tr-go', hd).onclick = () => { round++; if (round > 4) finish(); else showRound(); };
  }
  function finish() { S.f.fearEnd = fear; S.f.trialDone = 1; closeOv(); next(); }
  showRound();
};

/* ==========================================================
   候鳥不歸 — painter (SVG scenes, map, icons, feathers)
   ========================================================== */
const Paint = (() => {
  const W = 400, H = 250; let uid = 0;
  const r1 = n => Math.round(n * 10) / 10;
  function rng(seed) { let s = (seed >>> 0) || 1; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function K() {
    const p = 'p' + (++uid) + '_', defs = []; let n = 0;
    const st = a => a.map(([o, c, op]) => `<stop offset="${o}" stop-color="${c}"${op != null ? ` stop-opacity="${op}"` : ''}/>`).join('');
    return {
      lin(stops, x1 = 0, y1 = 0, x2 = 0, y2 = 1) { const id = p + (n++); defs.push(`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${st(stops)}</linearGradient>`); return `url(#${id})`; },
      rad(stops, cx = .5, cy = .5, r = .5) { const id = p + (n++); defs.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${st(stops)}</radialGradient>`); return `url(#${id})`; },
      radU(stops, cx, cy, r) { const id = p + (n++); defs.push(`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${r}">${st(stops)}</radialGradient>`); return `url(#${id})`; },
      clip(x, y, w, hh) { const id = p + (n++); defs.push(`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${hh}"/></clipPath>`); return `url(#${id})`; },
      out(inner, o = {}) { return `<svg viewBox="${o.vb || `0 0 ${W} ${H}`}" preserveAspectRatio="${o.par || 'xMidYMid slice'}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"${o.cls ? ` class="${o.cls}"` : ''}><defs>${defs.join('')}</defs>${inner}</svg>`; }
    };
  }
  function smooth(pts) {
    let d = `M${r1(pts[0][0])} ${r1(pts[0][1])}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ` C${r1(p1[0] + (p2[0] - p0[0]) / 6)} ${r1(p1[1] + (p2[1] - p0[1]) / 6)} ${r1(p2[0] - (p3[0] - p1[0]) / 6)} ${r1(p2[1] - (p3[1] - p1[1]) / 6)} ${r1(p2[0])} ${r1(p2[1])}`;
    }
    return d;
  }
  function ridgePts(y, amp, seed, fr = 1, bowl = 0) {
    const r = rng(seed); const ph = [r() * 6.28, r() * 6.28, r() * 6.28, r() * 6.28]; const pts = [];
    for (let i = 0; i <= 24; i++) {
      const x = -20 + i * (W + 40) / 24, u = (x - W / 2) / (W / 2);
      let yy = y - amp * (0.5 * Math.sin(x / (64 / fr) + ph[0]) + 0.27 * Math.sin(x / (29 / fr) + ph[1]) + 0.14 * Math.sin(x / (13 / fr) + ph[2]) + 0.07 * Math.sin(x / (6 / fr) + ph[3]));
      yy -= bowl * u * u; pts.push([x, yy]);
    }
    return pts;

function townNames(n) {
  const SU = '趙宋李王張劉陳楊黃周吳徐孫馬朱胡郭何林高羅鄭梁謝唐許鄧馮曹彭曾蕭田董潘袁蔡蔣余杜葉程蘇呂丁任盧姚沈鍾姜崔譚陸范汪廖石金賈夏韋方白鄒孟熊秦邱江尹薛段雷侯龍史陶黎賀顧毛郝龔邵萬錢嚴武戴莫孔向湯';
  const GI = ['鐵柱', '來福', '秀英', '德順', '大牛', '二牛', '春花', '秋菊', '滿倉', '招弟', '根生', '水生', '桂香', '有財', '翠蓮', '玉蘭', '長生', '金寶', '銀寶', '小翠', '鳳英', '守義', '平安', '喜順', '福全', '大柱', '二柱', '冬梅', '春生', '小六', '寶珠', '鹽生', '井生', '鹵娃', '石根', '銀花', '福妹', '有田', '得旺', '三寶', '玉珍', '秀蓮', '大川', '順子', '阿滿', '桃花', '二丫', '老九', '小栓', '改改'];
  const fixed = ['趙鐵柱', '趙小虎', '宋來福', '李秀英', '王德順'];
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const out = fixed.slice(); const seen = new Set(out);
  while (out.length < n) { const nm = SU[(rnd() * SU.length) | 0] + GI[(rnd() * GI.length) | 0]; if (!seen.has(nm)) { seen.add(nm); out.push(nm); } }
  return out;
}
