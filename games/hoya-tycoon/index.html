<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>好野人</title>
<meta name="description" content="台灣派對大富翁：旺來市">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* 好野人：台式招牌 × 城市模型
   版面：全螢幕立體城市，介面像釘在街角的招牌，貼著畫面四邊 */
:root {
  --ink: #15121d;
  --panel: #1e1a2b;
  --panel-2: #2a2539;
  --panel-3: #362f49;
  --line: rgba(255, 255, 255, 0.1);
  --fg: #f6f1e7;
  --muted: #a9a2bb;
  --paper: #fff7e8;
  --paper-ink: #2a2230;
  --red: #e8322b;
  --yellow: #ffd23f;
  --green: #1fa463;
  --pink: #ff4fa3;
  --cyan: #2fd3ff;
  --orange: #ff8a1d;
  --gold: #f3c24b;
  --font: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-num: "Barlow Condensed", "Noto Sans TC", "Noto Sans CJK TC", sans-serif;
  --font-serif: "Noto Serif TC", "Noto Serif CJK TC", "PMingLiU", serif;
  --u: clamp(11px, 0.55vw + 0.55vh + 4px, 16px);
  --r: 12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--font); font-size: var(--u); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font-family: inherit; color: inherit; }
input, textarea { font-family: inherit; user-select: text; -webkit-user-select: text; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; }
#board { position: absolute; inset: 0; display: block; touch-action: none; cursor: grab; }
#board.grabbing { cursor: grabbing; }

/* ---------- 按鈕 ---------- */
.btn { --c: var(--panel-3); --t: var(--fg); --s: #1a1626; appearance: none; border: 0; border-radius: 10px; padding: 0.62em 1.05em; font-weight: 900; font-size: 1em; letter-spacing: 0.02em;
  background: var(--c); color: var(--t); box-shadow: 0 0.28em 0 var(--s), inset 0 1px 0 rgba(255, 255, 255, 0.18); cursor: pointer; transform: translateY(0); transition: transform 0.06s, box-shadow 0.06s, filter 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 0.4em; line-height: 1.15; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(0.22em); box-shadow: 0 0.06em 0 var(--s), inset 0 1px 0 rgba(255, 255, 255, 0.18); }
.btn[disabled] { filter: grayscale(0.8) brightness(0.7); cursor: not-allowed; transform: none; }
.btn.y { --c: var(--yellow); --t: #241c10; --s: #a3780e; }
.btn.r { --c: var(--red); --t: #fff; --s: #8c1712; }
.btn.g { --c: var(--green); --t: #fff; --s: #0c5c35; }
.btn.p { --c: var(--pink); --t: #fff; --s: #96245d; }
.btn.c { --c: var(--cyan); --t: #062431; --s: #13789a; }
.btn.ghost { --c: rgba(255, 255, 255, 0.07); --s: rgba(0, 0, 0, 0.35); }
.btn.sm { font-size: 0.86em; padding: 0.45em 0.8em; border-radius: 8px; }
.btn.lg { font-size: 1.18em; padding: 0.78em 1.3em; }
.btn .sub { font-weight: 700; font-size: 0.78em; opacity: 0.85; }
.btn.stack { flex-direction: column; gap: 0.1em; }
.icon-btn { width: 2.6em; height: 2.6em; padding: 0; border-radius: 10px; }
.icon-btn svg { width: 1.35em; height: 1.35em; }

/* ---------- 上方招牌列 ---------- */
#topbar { position: absolute; top: calc(var(--safe-t) + 8px); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: stretch; z-index: 5; pointer-events: none; }
#topbar > * { pointer-events: auto; }
.act-sign { display: flex; align-items: center; gap: 0.6em; background: var(--panel); border-radius: 10px; padding: 0.35em 0.75em 0.35em 0.4em; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); border: 1px solid var(--line); white-space: nowrap; }
.act-sign .act { background: var(--red); color: #fff; font-weight: 900; padding: 0.25em 0.55em; border-radius: 7px; letter-spacing: 0.06em; }
.act-sign[data-act="2"] .act { background: var(--orange); }
.act-sign[data-act="3"] .act { background: linear-gradient(90deg, var(--pink), #7b5cff); box-shadow: 0 0 12px rgba(255, 79, 163, 0.6); }
.act-sign .round { font-weight: 800; color: var(--muted); }
.act-sign .round b { color: var(--fg); font-family: var(--font-num); font-size: 1.2em; }
.hot-sign { display: flex; align-items: center; gap: 0.4em; background: #2b1630; color: #ffd6ea; border-radius: 10px; padding: 0.35em 0.7em; border: 1px solid rgba(255, 79, 163, 0.45); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 0 14px rgba(255, 79, 163, 0.25); font-weight: 800; white-space: nowrap; }
.hot-sign i { width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: 0.35; } }

#tools { position: absolute; top: calc(var(--safe-t) + 8px); right: 10px; display: flex; gap: 6px; z-index: 6; }
#tools .btn, #camtools .btn { --c: rgba(30, 26, 43, 0.88); --s: rgba(0, 0, 0, 0.45); border: 1px solid var(--line); }
#camtools { position: absolute; right: 10px; top: calc(var(--safe-t) + 3.6em); display: flex; flex-direction: column; gap: 6px; z-index: 4; }

/* ---------- 玩家招牌 ---------- */
#players { position: absolute; left: 10px; top: calc(var(--safe-t) + 8px); display: flex; flex-direction: column; gap: 6px; z-index: 5; width: min(15.5em, 30vw); }
.chip { position: relative; display: grid; grid-template-columns: 2.8em 1fr; gap: 0.15em 0.55em; align-items: center; background: var(--panel); border-radius: 11px; padding: 0.42em 0.6em 0.42em 0.45em;
  border: 1px solid var(--line); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); transition: transform 0.25s, box-shadow 0.25s, opacity 0.3s; overflow: visible; }
.chip::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--pc); }
.chip.turn { transform: translateX(6px); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 0 0 2px var(--pc), 0 0 22px color-mix(in srgb, var(--pc) 45%, transparent); }
.chip.ghost { opacity: 0.6; filter: grayscale(0.7); }
.chip .ava { grid-row: span 2; width: 2.8em; height: 2.8em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--pc) 60%, #fff), var(--pc)); display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25); overflow: hidden; }
.chip .ava canvas { width: 2.6em; height: 2.6em; }
.chip .nm { display: flex; align-items: center; gap: 0.35em; font-weight: 900; min-width: 0; }
.chip .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .nm .tag { font-size: 0.72em; padding: 0.05em 0.4em; border-radius: 5px; background: rgba(255, 255, 255, 0.1); color: var(--muted); font-weight: 800; flex: none; }
.chip .nm .rank { font-family: var(--font-num); font-weight: 800; color: var(--muted); flex: none; }
.chip .nm .cards { margin-left: auto; display: inline-flex; align-items: center; gap: 0.15em; font-size: 0.78em; font-weight: 800; color: #d9d2ea; flex: none; }
.chip .nm .tag.st { color: #ffd6a8; background: rgba(255, 138, 29, 0.18); }
.chip .nm .rank.first { color: var(--gold); }
.chip .money { display: flex; align-items: baseline; gap: 0.5em; min-width: 0; }
.chip .cash { font-family: var(--font-num); font-weight: 800; font-size: 1.28em; color: #fff; }
.chip .cash.down { color: #ff8c84; }
.chip .cash.up { color: #9cf0b8; }
.chip .worth { font-size: 0.78em; color: var(--muted); white-space: nowrap; }
.chip .worth b { font-family: var(--font-num); color: #d9d2ea; font-weight: 700; }
.chip .bubble { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%) scale(0.6); transform-origin: left center; opacity: 0; background: var(--paper); color: var(--paper-ink); font-weight: 800; padding: 0.45em 0.7em; border-radius: 10px;
  max-width: 16em; width: max-content; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25); transition: opacity 0.18s, transform 0.18s; pointer-events: none; line-height: 1.35; z-index: 3; }
.chip .bubble::before { content: ""; position: absolute; left: -7px; top: 50%; margin-top: -7px; border: 7px solid transparent; border-left: 0; border-right-color: var(--paper); }
.chip .bubble.show { opacity: 1; transform: translateY(-50%) scale(1); }
.chip .bubble.big { font-size: 1.15em; background: var(--yellow); }
.chip .bubble.big::before { border-right-color: var(--yellow); }
.chip .float { position: absolute; right: 0.6em; top: -0.2em; font-family: var(--font-num); font-weight: 900; font-size: 1.25em; pointer-events: none; animation: rise 1.5s ease-out forwards; text-shadow: 0 2px 0 #000; }
@keyframes rise { 0% { transform: translateY(6px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-26px); opacity: 0; } }

/* ---------- 右下：骰子與動作 ---------- */
#dock { position: absolute; right: 12px; bottom: calc(var(--safe-b) + 12px); display: flex; align-items: flex-end; gap: 10px; z-index: 6; }
#dock .side { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.roll-btn { width: 6.6em; height: 6.6em; border-radius: 50%; border: 0; cursor: pointer; position: relative; background: radial-gradient(circle at 38% 30%, #fff1a8, var(--yellow) 45%, #e0a90c);
  box-shadow: 0 0.42em 0 #94690a, 0 0 0 0.35em rgba(255, 210, 63, 0.18), 0 10px 30px rgba(0, 0, 0, 0.45); font-weight: 900; color: #2b1d07; font-size: 1em; display: grid; place-items: center; transition: transform 0.07s, box-shadow 0.07s; }
.roll-btn:active { transform: translateY(0.3em); box-shadow: 0 0.12em 0 #94690a, 0 0 0 0.35em rgba(255, 210, 63, 0.18); }
.roll-btn .dd { display: flex; gap: 0.25em; margin-bottom: 0.15em; }
.roll-btn .dd i { width: 1.25em; height: 1.25em; border-radius: 0.28em; background: #fff; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18); position: relative; }
.roll-btn .dd i::after { content: ""; position: absolute; inset: 0; margin: auto; width: 0.3em; height: 0.3em; border-radius: 50%; background: var(--red); }
.roll-btn .lbl { font-size: 1.12em; letter-spacing: 0.08em; line-height: 1; }
.roll-btn.go { animation: pulse 1.3s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0.42em 0 #94690a, 0 0 0 0.35em rgba(255, 210, 63, 0.18), 0 10px 30px rgba(0, 0, 0, 0.45); } 50% { box-shadow: 0 0.42em 0 #94690a, 0 0 0 0.75em rgba(255, 210, 63, 0.08), 0 10px 30px rgba(0, 0, 0, 0.45); } }
.wait-sign { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.6em 0.9em; font-weight: 800; color: var(--muted); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); display: flex; align-items: center; gap: 0.55em; max-width: 18em; }
.wait-sign .dot { width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--pc, var(--yellow)); animation: blink 1s infinite; flex: none; }

/* ---------- 手牌 ---------- */
#hand { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 8px); transform: translateX(-50%); display: flex; justify-content: center; align-items: flex-end; z-index: 5; pointer-events: none; height: 9.4em; }
#hand .card { pointer-events: auto; margin: 0 -0.9em; transform-origin: 50% 120%; transition: transform 0.2s, margin 0.2s; }
#hand .card:hover, #hand .card.sel { transform: translateY(-1.1em) rotate(0deg) !important; z-index: 2; margin: 0 0.1em; }
#hand.small { height: 5.4em; }
#hand.small .card { transform: scale(0.62) !important; margin: 0 -2.1em; transform-origin: 50% 100%; }

.card { --k: var(--orange); width: 7.4em; height: 10.2em; border-radius: 0.8em; background: var(--paper); color: var(--paper-ink); position: relative; flex: none; display: flex; flex-direction: column; align-items: center; padding: 0.45em 0.45em 0.5em; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.28), 0 10px 22px rgba(0, 0, 0, 0.35); cursor: pointer; overflow: hidden; }
.card.react { --k: var(--cyan); }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3.9em; background: var(--k); }
.card::after { content: ""; position: absolute; left: 0; right: 0; top: 3.9em; height: 0.5em; background: radial-gradient(circle at 0.25em 0, transparent 0.24em, var(--paper) 0.26em) 0 0 / 0.5em 0.5em repeat-x; }
.card .kind { position: relative; z-index: 1; align-self: flex-start; font-size: 0.66em; font-weight: 900; color: rgba(0, 0, 0, 0.62); letter-spacing: 0.08em; }
.card .ic { position: relative; z-index: 1; width: 3.4em; height: 3.4em; margin-top: -0.2em; display: grid; place-items: center; background: #fff; border-radius: 50%; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18); border: 0.16em solid var(--paper-ink); }
.card .ic svg { width: 2.1em; height: 2.1em; }
.card .nm { font-weight: 900; font-size: 1.12em; margin-top: 0.35em; letter-spacing: 0.04em; }
.card .tx { font-size: 0.68em; line-height: 1.38; text-align: center; color: #5a4f5e; margin-top: 0.2em; font-weight: 600; }
.card .pr { position: absolute; right: 0.4em; bottom: 0.35em; font-family: var(--font-num); font-weight: 800; font-size: 0.82em; color: #b23b2c; }
.card.usable { box-shadow: 0 6px 0 rgba(0, 0, 0, 0.28), 0 0 0 3px var(--yellow), 0 0 18px rgba(255, 210, 63, 0.55); }
.card.dim { filter: grayscale(0.4) brightness(0.8); }
.card.back { background: repeating-linear-gradient(45deg, #2b2440 0 8px, #241f37 8px 16px); border: 3px solid #3d355a; }
.card.back::before, .card.back::after { display: none; }

/* ---------- 決定面板（招牌） ---------- */
#sheet { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 12px); transform: translateX(-50%); width: min(30em, calc(100vw - 24px)); z-index: 20; }
#sheet.mid { bottom: auto; top: 50%; transform: translate(-50%, -50%); }
.panel { background: var(--panel); border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 8px 0 rgba(0, 0, 0, 0.4), 0 20px 50px rgba(0, 0, 0, 0.5); overflow: hidden; animation: popin 0.22s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes popin { from { transform: translateY(12px) scale(0.96); opacity: 0; } }
.panel .hd { --hc: var(--red); background: var(--hc); color: #fff; padding: 0.55em 0.9em; display: flex; align-items: center; gap: 0.6em; font-weight: 900; letter-spacing: 0.04em; font-size: 1.08em; position: relative; }
.panel .hd::after { content: ""; position: absolute; inset: 4px; border: 1.5px solid rgba(255, 255, 255, 0.45); border-radius: 9px; pointer-events: none; }
.panel .hd .who { margin-left: auto; font-size: 0.8em; font-weight: 800; opacity: 0.9; }
.panel .bd { padding: 0.85em 0.95em 0.95em; display: flex; flex-direction: column; gap: 0.7em; }
.panel .row { display: flex; gap: 0.55em; flex-wrap: wrap; }
.panel .row > .btn { flex: 1 1 8em; }
.panel p { margin: 0; line-height: 1.6; color: #e6dfef; }
.panel .note { font-size: 0.82em; color: var(--muted); line-height: 1.5; }
.timer { height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--yellow); transform-origin: left; }

.lot-card { display: grid; grid-template-columns: auto 1fr; gap: 0.2em 0.8em; align-items: center; background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 0.6em 0.75em; position: relative; overflow: hidden; }
.lot-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0.55em; background: var(--dc); }
.lot-card .lname { font-weight: 900; font-size: 1.3em; padding-left: 0.3em; }
.lot-card .ldist { font-size: 0.8em; font-weight: 900; color: #fff; background: var(--dc); padding: 0.15em 0.5em; border-radius: 6px; justify-self: start; }
.lot-card .lprice { grid-column: 2; grid-row: 1 / span 2; justify-self: end; text-align: right; }
.lot-card .lprice b { display: block; font-family: var(--font-num); font-size: 1.7em; color: #c2281f; line-height: 1; }
.lot-card .lprice small { color: #7a6c7f; font-weight: 700; }
.rent-table { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 0.45em; font-size: 0.8em; padding-left: 0.3em; }
.rent-table div { background: rgba(0, 0, 0, 0.05); border-radius: 6px; padding: 0.25em 0.2em; text-align: center; }
.rent-table div.on { background: var(--dc); color: #fff; }
.rent-table small { display: block; font-weight: 800; opacity: 0.75; font-size: 0.86em; }
.rent-table b { font-family: var(--font-num); font-size: 1.12em; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0.3em 0.9em; font-size: 0.92em; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; font-weight: 800; text-align: right; }

.opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5em, 1fr)); gap: 0.5em; }
.opt { background: var(--panel-2); border: 2px solid transparent; border-radius: 10px; padding: 0.6em 0.5em; font-weight: 900; cursor: pointer; text-align: center; line-height: 1.3; transition: border-color 0.15s, background 0.15s; color: var(--fg); }
.opt small { display: block; font-weight: 700; color: var(--muted); font-size: 0.8em; margin-top: 0.15em; }
.opt.on { border-color: var(--yellow); background: #3a3220; }
.opt:disabled { opacity: 0.45; cursor: not-allowed; }
.stepper { display: flex; align-items: center; gap: 0.5em; }
.stepper .val { min-width: 2.2em; text-align: center; font-family: var(--font-num); font-weight: 800; font-size: 1.4em; }

.bid { display: flex; align-items: center; justify-content: center; gap: 0.4em; background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 0.4em; }
.bid .amt { font-family: var(--font-num); font-weight: 800; font-size: 2.2em; min-width: 4.5em; text-align: center; color: #c2281f; }

/* ---------- 大字幕／新聞／事件卡 ---------- */
#stage { position: absolute; inset: 0; pointer-events: none; z-index: 30; display: grid; place-items: center; }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-4deg); background: var(--bc, var(--red)); color: #fff; font-weight: 900; font-size: clamp(30px, 6.5vw, 74px); padding: 0.12em 0.7em 0.18em; letter-spacing: 0.06em; white-space: nowrap;
  box-shadow: 0 0.12em 0 rgba(0, 0, 0, 0.45); text-shadow: 0 0.06em 0 rgba(0, 0, 0, 0.35); border: 0.07em solid #fff; outline: 0.05em solid var(--bc, var(--red)); animation: slam 0.42s cubic-bezier(0.2, 1.6, 0.4, 1); }
.banner small { display: block; font-size: 0.32em; font-weight: 800; letter-spacing: 0.04em; text-align: center; margin-top: 0.1em; opacity: 0.95; }
.banner.out { animation: slamout 0.3s forwards; }
@keyframes slam { from { transform: translate(-50%, -50%) rotate(-4deg) scale(2.2); opacity: 0; } }
@keyframes slamout { to { transform: translate(-50%, -50%) rotate(-4deg) scale(0.8); opacity: 0; } }

.news { position: absolute; left: 0; right: 0; bottom: 18%; display: flex; flex-direction: column; align-items: flex-start; animation: newsin 0.45s cubic-bezier(0.2, 1.2, 0.4, 1); filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.35)); }
.news .flash { margin-left: 6vw; background: #fff; color: #c8102e; font-weight: 900; padding: 0.15em 0.6em; font-size: clamp(16px, 2.2vw, 26px); letter-spacing: 0.12em; display: flex; gap: 0.5em; align-items: center; }
.news .flash i { width: 0.6em; height: 0.6em; border-radius: 50%; background: #c8102e; animation: blink 0.6s infinite; }
.news .head { margin-left: 6vw; margin-right: 6vw; background: linear-gradient(90deg, #c8102e, #e8322b); color: #fff; font-weight: 900; font-size: clamp(24px, 4.4vw, 52px); padding: 0.12em 0.5em; letter-spacing: 0.04em; border-left: 0.2em solid var(--yellow); }

const HY = {};

// ===== src/core/util.js =====
// ===== 好野人：共用小工具（瀏覽器、Node、Cloudflare 都能跑） =====
HY.version = '1.0.0';

HY.util = (function () {
  // 可序列化的亂數（xorshift128），狀態存在牌局裡，存檔／斷線重連都接得回來
  function seedFrom(n) {
    let s = (n >>> 0) || 0x9e3779b9;
    const out = [];
    for (let i = 0; i < 4; i++) { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; out.push(s >>> 0 || 1); }
    return out;
  }
  function next(st) {
    const r = st.rng;
    let t = r[3];
    let s = r[0];
    r[3] = r[2]; r[2] = r[1]; r[1] = s;
    t ^= t << 11; t >>>= 0;
    t ^= t >>> 8;
    r[0] = (t ^ s ^ (s >>> 19)) >>> 0;
    return r[0] / 4294967296;
  }
  const rnd = (st) => next(st);
  const int = (st, n) => Math.floor(next(st) * n);
  const pick = (st, arr) => arr[int(st, arr.length)];
  function shuffle(st, a) { for (let i = a.length - 1; i > 0; i--) { const j = int(st, i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function weighted(st, items, wf) {
    let tot = 0; const ws = items.map((x) => { const w = Math.max(0, wf(x)); tot += w; return w; });
    if (tot <= 0) return items.length ? items[int(st, items.length)] : null;
    let r = next(st) * tot;
    for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];

    try {

      if (c) { const a = new Uint32Array(1); c.getRandomValues(a); return a[0] % n; }

  const r10 = (v) => Math.round(v / 10) * 10;
  const r5 = (v) => Math.round(v / 5) * 5;

    const v = Math.round(n);
    const s = Math.abs(v).toLocaleString('en-US');
    return (v < 0 ? '-' : '') + s + '萬';
  };
  return { seedFrom, rnd, int, pick, shuffle, weighted, cryptoInt, cryptoSeed, clamp, r10, r5, clone, money };

  // ---- 格子清單（照前進順序） ----
  // k：start 起點、lot 地產、mrt 捷運站、news 爆料公社、shop 便利商店、invoice 發票對獎、claw 夾娃娃機店、
  //    jail 國道塞車、hall 里民活動中心、tax 國稅局、lux_tax 豪宅稅、temple 土地公廟、auction 法拍屋、
  //    speed 測速照相、cityhall 市政府
  const T = [
    // 外圈（40 格），從起點往左
    [11, 9, 'start', '起點'],
    [10, 9, 'lot', '大雞排', 'night', 60],

    [8, 9, 'lot', '珍奶店', 'night', 60],

    [5, 9, 'mrt', '旺來站', 'mrt', 200],
    [4, 9, 'lot', '柑仔店', 'old', 80],
    [3, 9, 'invoice', '發票對獎'],
    [2, 9, 'lot', '古早味冰', 'old', 80],
    [1, 9, 'lot', '紅磚古厝', 'old', 100],
    [0, 9, 'jail', '國道塞車'],
    [0, 8, 'lot', '學生套房', 'uni', 100],
    [0, 7, 'news', '爆料公社'],
    [0, 6, 'lot', '早午餐店', 'uni', 100],
    [0, 5, 'hall', '里民活動中心'],
    [0, 4, 'lot', '補習街', 'uni', 120],
    [0, 3, 'tax', '國稅局'],
    [0, 2, 'lot', '廟口肉圓', 'temple', 120],
    [0, 1, 'lot', '金紙行', 'temple', 120],
    [0, 0, 'temple', '土地公廟'],
    [1, 0, 'lot', '宮廟咖啡', 'temple', 140],
    [2, 0, 'mrt', '港口站', 'mrt', 200],
    [3, 0, 'lot', '海產熱炒', 'harbor', 150],
    [4, 0, 'shop', '便利商店'],
    [5, 0, 'lot', '觀光魚市', 'harbor', 150],
    [6, 0, 'lot', '海景民宿', 'harbor', 170],
    [7, 0, 'auction', '法拍屋'],

    [10, 0, 'lot', '晶圓廠', 'tech', 200],
    [11, 0, 'speed', '測速照相'],
    [11, 1, 'news', '爆料公社'],
    [11, 2, 'mrt', '園區站', 'mrt', 200],
    [11, 3, 'lot', '電影城', 'mall', 220],
    [11, 4, 'lot', '百貨公司', 'mall', 220],
    [11, 5, 'lot', '精品旗艦店', 'mall', 240],
    [11, 6, 'lot', '景觀豪宅', 'lux', 300],
    [11, 7, 'lux_tax', '豪宅稅'],
    [11, 8, 'lot', '首富官邸', 'lux', 350],

    if (r[4]) { t.d = r[4]; t.p = r[5]; }
    return t;
  });

  // ---- 路網 ----
  const link = (a, b, act) => { tiles[a].nx.push(act ? { to: b, act } : { to: b }); };
  for (let i = 0; i < 39; i++) link(i, i + 1);
  link(39, 0);
  // 橫向捷徑：活動中心(15) → 文青咖啡(40) … 河景大樓(49) → 精品旗艦店(36)

  for (let i = 40; i < 49; i++) link(i, i + 1);
  link(49, 36);

  link(5, 50, 2);
  link(50, 51); link(51, 52); link(52, 45);
  link(45, 53, 2);
  link(53, 54); link(54, 55); link(55, 56); link(56, 26);
  // 新路上的格子本身也標記「第二幕才開放」
  for (const i of [50, 51, 52, 53, 54, 55, 56]) tiles[i].act = 2;

  // ---- 地塊（地產蓋在路旁） ----
  for (const t of tiles) {
    let px = null; let py = null;
    if (t.id <= 39) {
      if (t.y === 9) { px = t.x; py = 10; }
      if (t.x === 0) { px = -1; py = t.y; }
      if (t.y === 0) { px = t.x; py = -1; }
      if (t.x === 11) { px = 12; py = t.y; }
      if (t.id === 0) { px = 12; py = 10; }
      if (t.id === 11) { px = -1; py = 10; }
      if (t.id === 20) { px = -1; py = -1; }
      if (t.id === 31) { px = 12; py = -1; }
    } else if (t.id >= 40 && t.id <= 49) {
      if (t.id === 45) continue;
      if (t.x <= 5) { px = t.x; py = 4; } else { px = t.x; py = 6; }
    } else {
      if (t.y >= 6) { px = 5; py = t.y; } else { px = 7; py = t.y; }
    }
    t.plot = [px, py];
  }

  // ---- 地段名單 ----
  const lotsOf = {};
  for (const t of tiles) if (t.d) (lotsOf[t.d] = lotsOf[t.d] || []).push(t.id);

  // ---- 裝飾（不影響遊戲，只給畫面用） ----
  const decor = [
    // 左上：河濱公園（靠廟口）
    { k: 'park', x: 1, y: 1, w: 3, h: 2 },
    { k: 'court', x: 4, y: 1, w: 2, h: 2 },
    { k: 'trees', x: 1, y: 3, w: 5, h: 1 },
    // 右上：園區校園
    { k: 'campus', x: 8, y: 1, w: 3, h: 3 },
    { k: 'trees', x: 8, y: 4, w: 3, h: 1 },
    // 左下：住宅巷弄
    { k: 'alley', x: 1, y: 6, w: 4, h: 3 },
    // 右下：河濱
    { k: 'river', x: 7, y: 7, w: 4, h: 2 },
  ];

  return {
    id: 'wanglai',
    name: '旺來市',
    sub: '夜市、老街、漁港、園區，全都在這座城',
    w: 12, h: 10,

    start: 0, jail: 11, temple: 20,
    tiles, DIST, lotsOf, decor,
    // 第二幕開放的地段
    lateDist: ['new'],
  };
})();

// ===== src/core/engine.js =====
// ===== 好野人：規則引擎 =====
// 牌局是一個純資料物件（可以存檔、可以從伺服器送給玩家），引擎是一台狀態機：
//   newGame() 開局 → prompt() 看現在在等誰做什麼決定 → act() 收到決定 → 自動往下跑到下一個決定
// 每一步產生的「事件」放在 st.ev，畫面拿去播動畫。
HY.rules = {

HY.engine = (function () {

    if (!L || L.o !== s || L.m) return false;
    if (T(st, id).k !== 'lot') return false;
    if (L.lv >= maxLv(st, s, id)) return false;

    if (!L || L.o < 0 || L.m) return 0;
    if (L.sz >= st.round) return 0;
    let r;

    else {

      if (ownsAll(st, L.o, t.d)) r *= L.lv === 0 ? R.SET_L0 : R.SET_LV;
      if (L.br === 'shop') r *= R.SHOP_RENT;

      if (st.hot && st.hot === t.d) r *= t.d === 'art' ? R.HOT_ART : R.HOT;
