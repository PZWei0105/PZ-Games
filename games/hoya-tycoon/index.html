    };
    for (const t of m.tiles) if (t.d) st.lots[t.id] = { o: -1, lv: 0, m: false, sz: 0, hn: 0, nail: 0, br: null };
    for (const d of Object.keys(m.DIST)) st.dist[d] = { i: 1 };
    if (st.dist.new) st.dist.new.i = 0.85;
    // 出場順序：隨機
    st.order = U.shuffle(st, st.players.map((p) => p.id));
    // 季度開始的回合
    const Rr = st.cfg.rounds;
    st.seasonAt = [0, 1, 2, 3, 4, 5].map((k) => 1 + Math.floor((k * Rr) / 6));
    // 開局每人一張卡
    for (const p of st.players) giveCard(st, p.id, 1, true);
    emit(st, { t: 'start', order: st.order.slice(), rounds: Rr });
    push(st, { k: 'next' });
    run(st);
    return st;
  }

  // ================= 主迴圈 =================
  function run(st) {
    let guard = 0;
    while (!st.prompt && !st.over) {
      if (++guard > 20000) throw new Error('engine loop');
      if (!st.q.length) st.q.push({ k: 'next' });
      const t = st.q.shift();
      const h = TASK[t.k];
      if (!h) throw new Error('no task ' + t.k);
      h(st, t);
    }
  }

  // ================= 卡片 =================
  function cardPool(st, ghostOnly) {
    let pool = C.pool(st.cfg.intensity);
    if (ghostOnly) pool = pool.filter((k) => ['cone', 'block', 'turtle', 'seize', 'report'].includes(k));
    return pool;
  }
  function giveCard(st, s, what, quiet) {
    const p = P(st, s);
    const got = [];
    const n = typeof what === 'number' ? what : 1;
    for (let i = 0; i < n; i++) {
      if (p.cards.length >= R.HAND) break;
      let k = typeof what === 'string' ? what : null;
      if (!k || !C.allowed(k, st.cfg.intensity)) {
        const pool = cardPool(st, p.ghost);
        k = U.weighted(st, pool, (x) => (C.byK[x].mean >= 2 ? 0.8 : 1.15));
      }
      if (k) { p.cards.push(k); got.push(k); }
    }
    if (got.length && !quiet) emit(st, { t: 'cardGet', s, cards: got });
    return got;
  }
  function takeCard(st, s, k) { const p = P(st, s); const i = p.cards.indexOf(k); if (i >= 0) { p.cards.splice(i, 1); return true; } return false; }
  function streamFee(st, user) {
    for (const p of active(st)) if (p.id !== user && trait(st, p.id) === 'stream') { p.cash += R.STREAM; emit(st, { t: 'stream', s: p.id, amt: R.STREAM }); }
  }

  // ================= 付錢（不夠就籌錢、再不夠就破產） =================
  // to：玩家座位、或 -1 公庫
  function payTask(from, to, amt, why, extra) { return Object.assign({ k: 'pay', from, to, amt: Math.max(0, Math.round(amt)), why }, extra || {}); }
  function gain(st, s, amt, why, extra) {
    if (amt <= 0) return;
    const p = P(st, s);
    if (p.ghost) return;
    p.cash += Math.round(amt);
    emit(st, Object.assign({ t: 'pay', from: -1, to: s, amt: Math.round(amt), why }, extra || {}));
  }
  function liquidOptions(st, s) {
    return ownedLots(st, s).filter((id) => !st.lots[id].m).map((id) => ({ id, v: U.r10(lotValue(st, id) * R.MORT) }));
  }
  function liquidPlan(st, s, need) {
    // 先抵押租金效益最低的地
    const opts = liquidOptions(st, s).map((o) => Object.assign(o, { r: rentOf(st, o.id) / Math.max(1, o.v) + (st.lots[o.id].lv * 0.05) }));
    opts.sort((a, b) => a.r - b.r || a.v - b.v);
    const pick = []; let got = 0;
    for (const o of opts) { if (got >= need) break; pick.push(o.id); got += o.v; }
    return pick;
  }
  function mortgage(st, s, id, quiet) {
    const L = st.lots[id];
    if (!L || L.o !== s || L.m) return 0;
    const v = U.r10(lotValue(st, id) * R.MORT);
    L.m = true;
    P(st, s).cash += v;
    if (!quiet) emit(st, { t: 'mort', s, tile: id, amt: v });
    return v;
  }
  function redeemCost(st, id) { return U.r10(lotValue(st, id) * R.REDEEM); }

  function bankrupt(st, s, creditor) {
    const p = P(st, s);
    if (p.ghost) return;
    const left = Math.max(0, p.cash);
    if (creditor >= 0 && left > 0 && !P(st, creditor).ghost) { P(st, creditor).cash += left; emit(st, { t: 'pay', from: s, to: creditor, amt: left, why: 'bankrupt' }); }
    p.cash = 0;
    const lots = ownedLots(st, s);
    for (const id of lots) Object.assign(st.lots[id], { o: -1, lv: 0, m: false, sz: 0, hn: 0, nail: 0, br: null });
    p.cards = [];
    p.ghost = true; p.jail = 0; p.turtle = 0; p.skip = 0; p.fixed = 0;
    p.st.bankruptAt = st.round;
    for (const k of Object.keys(st.cones)) if (st.cones[k] === s) delete st.cones[k];
    emit(st, { t: 'bankrupt', s, lots, creditor });
    st.side = st.side.filter((o) => o.from !== s && o.to !== s);
    if (active(st).length <= 1) push(st, { k: 'gameOver', why: 'last' });
  }

  // ================= 事件效果 =================
  function pickDist(st, s, spec) {
    const open = Object.keys(M(st).DIST).filter((d) => d !== 'mrt' && distOpen(st, d));
    if (spec === 'rand') return U.pick(st, open);
    if (spec === 'hot') return st.hot || U.pick(st, open);
    if (spec === 'mine') {
      const cnt = {};
      for (const id of ownedLots(st, s)) { const d = T(st, id).d; if (d !== 'mrt') cnt[d] = (cnt[d] || 0) + lotValue(st, id); }
      const best = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
      return best || U.pick(st, open);
    }
    return spec;
  }
  function moveHot(st, d, by) {
    if (!d || !st.dist[d] || d === 'mrt') return;
    st.hot = d;
    emit(st, { t: 'hot', d, by });
  }
  function downgrade(st, spec, n, why) {
    let cand = Object.keys(st.lots).map(Number).filter((id) => st.lots[id].o >= 0 && st.lots[id].lv > 0 && st.lots[id].lv < 4 && T(st, id).k === 'lot');
    if (spec !== 'any') cand = cand.filter((id) => T(st, id).d === spec);
    U.shuffle(st, cand);
    const hit = cand.slice(0, n);
    for (const id of hit) { const L = st.lots[id]; L.lv--; if (L.lv < 3) L.br = null; }
    if (hit.length) emit(st, { t: 'down', tiles: hit, why });
    return hit;
  }

  function applyFx(st, s, fxList, ctx) {
    ctx = ctx || {};
    const tasks = [];
    const p = P(st, s);
    const sev = (v) => (v < 0 ? v * ({ friendly: 0.6, standard: 1, chaos: 1.35 }[st.cfg.intensity] || 1) : v);
    for (const fx of fxList || []) {
      if (fx.cash != null) {
        const v = U.r10(sev(fx.cash));
        if (v >= 0) { gain(st, s, v, 'event'); p.st.evGain += v; } else { tasks.push(payTask(s, -1, -v, 'event')); p.st.evLoss += -v; }
      }
      if (fx.pct != null) {
        const v = U.r10(p.cash * sev(fx.pct));
        if (v >= 0) { gain(st, s, v, 'event'); p.st.evGain += v; } else if (v < 0) { tasks.push(payTask(s, -1, -v, 'event')); p.st.evLoss += -v; }
      }
      if (fx.each != null) {
        const v = U.r10(fx.each);
        for (const o of active(st)) {
          if (o.id === s) continue;
          if (v > 0) tasks.push(payTask(o.id, s, v, 'event'));
          else if (v < 0) tasks.push(payTask(s, o.id, -v, 'event'));
        }
      }
      if (fx.all != null) {
        const v = U.r10(sev(fx.all));
        for (const o of active(st)) { if (v > 0) gain(st, o.id, v, 'event'); else if (v < 0) tasks.push(payTask(o.id, -1, -v, 'event')); }
      }
      if (fx.allPct != null) {
        for (const o of active(st)) {
          const v = U.r10(o.cash * sev(fx.allPct));
          if (v > 0) gain(st, o.id, v, 'event'); else if (v < 0) tasks.push(payTask(o.id, -1, -v, 'event'));
        }
      }
      if (fx.fromLead != null) { const l = leader(st, s); if (l >= 0) tasks.push(payTask(l, s, fx.fromLead, 'event')); }
      if (fx.leadPct != null) { const l = leader(st, -1); if (l >= 0) { const v = U.r10(P(st, l).cash * -sev(fx.leadPct)); if (v > 0) tasks.push(payTask(l, -1, v, 'event')); ctx.lead = l; } }
      if (fx.lastGets != null) { const l = lastPlace(st, s); if (l >= 0) gain(st, l, fx.lastGets, 'event'); }
      if (fx.leadToLast != null) { const a = leader(st, -1); const b = lastPlace(st, -1); if (a >= 0 && b >= 0 && a !== b) tasks.push(payTask(a, b, fx.leadToLast, 'event')); }
      if (fx.card != null) giveCard(st, s, fx.card);
      if (fx.loseCard) { for (let i = 0; i < fx.loseCard && p.cards.length; i++) { const k = p.cards.splice(U.int(st, p.cards.length), 1)[0]; emit(st, { t: 'cardLose', s, card: k }); } }
      if (fx.jail) tasks.push({ k: 'goJail', s });
      if (fx.go != null) {
        const to = fx.go === 'start' ? M(st).start : fx.go === 'temple' ? M(st).temple : fx.go;
        tasks.push({ k: 'warp', s, to, salary: fx.go === 'start', land: fx.go !== 'start' });
      }
      if (fx.step != null) {
        const path = stepAlong(st, p.pos, fx.step);
        if (path.length) tasks.push({ k: 'move', s, path, back: fx.step < 0 });
      }
      if (fx.idx != null) {
        const d = pickDist(st, s, fx.d === '@' ? ctx.pick : fx.d);
        if (d && st.dist[d]) { setIdx(st, d, idx(st, d) + fx.idx); emit(st, { t: 'idx', d, v: fx.idx, now: idx(st, d) }); ctx.d = d; }
      }
      if (fx.idxAll != null) {
        for (const d of Object.keys(st.dist)) if (d !== 'mrt') setIdx(st, d, idx(st, d) + fx.idxAll);
        emit(st, { t: 'idx', d: 'all', v: fx.idxAll });
      }
      if (fx.hot != null) {
        const d = fx.hot === 'mine' || fx.hot === 'rand' ? pickDist(st, s, fx.hot) : fx.hot;
        moveHot(st, d, s); ctx.d = d;
      }
      if (fx.rentMod != null) { st.mods.push({ k: 'rent', d: fx.d || 'all', v: fx.rentMod, until: st.round + (fx.r || 1) - (fx.r ? 0 : 0) }); emit(st, { t: 'mod', k: 'rent', d: fx.d || 'all', v: fx.rentMod, r: fx.r || 1 }); }
      if (fx.buildMod != null) { st.mods.push({ k: 'build', v: fx.buildMod, until: st.round + (fx.r || 3) }); emit(st, { t: 'mod', k: 'build', v: fx.buildMod, r: fx.r || 3 }); }
      if (fx.down != null) downgrade(st, fx.d || 'any', fx.n || 1, ctx.tag || 'event');
      if (fx.up) {
        const mine = ownedLots(st, s).filter((id) => T(st, id).k === 'lot' && !st.lots[id].m && st.lots[id].lv < Math.min(3, maxLv(st, s, id)));
        if (mine.length) { const id = U.pick(st, mine); const L = st.lots[id]; L.lv++; if (L.lv === 3 && !L.br) L.br = 'tower'; emit(st, { t: 'build', s, tile: id, lv: L.lv, free: true }); }
      }
      if (fx.skip) { p.skip += fx.skip; emit(st, { t: 'status', s, k: 'skip', n: fx.skip }); }
      if (fx.turtle) { p.turtle = Math.max(p.turtle, fx.turtle); emit(st, { t: 'status', s, k: 'turtle', n: fx.turtle }); }
      if (fx.chain) st.chains.push({ s, key: fx.chain, at: st.round + (fx.delay || 2) });
      if (fx.vote) tasks.push({ k: 'vote', s });
      if (fx.auction) tasks.push({ k: 'auctionTile', s });
      if (fx.dividend) {
        for (const id of M(st).lotsOf.tech || []) { const L = st.lots[id]; if (L.o >= 0 && !L.m) gain(st, L.o, U.r10(R.TECH_DIV * fx.dividend * idx(st, 'tech') * (trait(st, L.o) === 'engineer' ? 1.5 : 1)), 'dividend'); }
      }
      if (fx.discount) { p.disc = fx.discount; emit(st, { t: 'status', s, k: 'disc', n: fx.discount }); }
      if (fx.luxTax) {
        for (const id of M(st).lotsOf.lux || []) { const L = st.lots[id]; if (L.o >= 0) tasks.push(payTask(L.o, -1, U.r10(lotValue(st, id) * fx.luxTax), 'tax')); }
      }
      if (fx.propTax) for (const o of active(st)) { const v = U.r10(propValue(st, o.id) * fx.propTax); if (v > 0) tasks.push(payTask(o.id, -1, v, 'tax')); }
      if (fx.payEach != null) { const w = fx.who === '@' ? ctx.pick : s; for (const o of active(st)) if (o.id !== w) tasks.push(payTask(w, o.id, fx.payEach, 'vote')); }
      if (fx.gain != null) { const w = fx.who === '@' ? ctx.pick : s; gain(st, w, fx.gain, 'vote'); }
      if (fx.payPct != null) { const w = fx.who === '@' ? ctx.pick : s; const v = U.r10(P(st, w).cash * fx.payPct); if (v > 0) tasks.push(payTask(w, -1, v, 'vote')); }
      if (fx.mayor != null) { const w = fx.who === '@' || fx.mayor === '@' ? ctx.pick : s; tasks.push({ k: 'hotPick', s: w, why: 'mayor' }); }
      if (fx.give != null) tasks.push({ k: 'pickPlayer', s, act: 'give', n: fx.give });
      if (fx.take != null) tasks.push({ k: 'pickPlayer', s, act: 'take', n: fx.take });
    }
    return tasks;
  }

  function fillText(st, s, txt, ctx) {
    ctx = ctx || {};
    const l = ctx.lead != null ? ctx.lead : leader(st, -1);
    const z = lastPlace(st, -1);
    return String(txt || '')
      .replace(/\{me\}/g, nm(st, s))
      .replace(/\{lead\}/g, l >= 0 ? nm(st, l) : '首富')
      .replace(/\{last\}/g, z >= 0 ? nm(st, z) : '最後一名')
      .replace(/\{d\}/g, ctx.d ? dname(st, ctx.d) : '某個地段');
  }

  // ================= 抽事件 =================
  function drawFrom(st, s, deck, list) {
    const used = st.decks[deck] || (st.decks[deck] = []);
    let pool = list.filter((e) => !used.includes(e.id));
    if (!pool.length) { st.decks[deck] = []; pool = list.slice(); }
    const rk = rankOf(st, s); const n = active(st).length;
    const lead = rk === 0; const trail = n > 1 && rk === n - 1;
    const hasLots = ownedLots(st, s).length > 0;
    const e = U.weighted(st, pool, (x) => {
      let w = x.w || 1;
      const tg = x.tags || [];
      if (tg.includes('mean') && st.cfg.intensity === 'friendly') return 0;
      if (tg.includes('act2') && st.act < 2) return 0;
      if (tg.includes('lots') && !hasLots) return 0;
      if (tg.includes('lead')) w *= lead ? 2.6 : 0.45;
      if (tg.includes('trail')) w *= trail ? 2.6 : rk >= n / 2 ? 1 : 0.4;
      return w;
    });
    (st.decks[deck] = st.decks[deck] || []).push(e.id);
    return e;
  }

  // ================= 任務 =================
  const TASK = {};

  TASK.next = (st) => {
    if (st.over) return;
    if (!st.started) { st.started = true; st.ti = 0; push(st, { k: 'roundStart' }); return; }
    st.ti++;
    if (st.ti >= st.order.length) { st.ti = 0; st.round++; push(st, { k: 'roundStart' }); return; }
    push(st, { k: 'turnStart', s: st.order[st.ti] });
  };

  TASK.roundStart = (st) => {
    if (st.round > st.cfg.rounds) { push(st, { k: 'gameOver', why: 'time' }); return; }
    st.mods = st.mods.filter((m) => m.until >= st.round);
    snapshot(st);
    const tasks = [];
    const k = st.seasonAt.indexOf(st.round);
    if (k >= 0 && st.round > 1 && k > st.season) {
      st.season = k;
      // 地價慢慢回歸
      for (const d of Object.keys(st.dist)) {
        if (d === 'mrt') continue;
        if (d === 'new' && st.act >= 2) setIdx(st, d, idx(st, d) + R.NEW_GROW);
        else setIdx(st, d, idx(st, d) + (1 - idx(st, d)) * 0.15);
      }
      if (k === 2) tasks.push({ k: 'actChange', n: 2 });
      else if (k === 4) tasks.push({ k: 'actChange', n: 3 });
      else tasks.push({ k: 'season' });
    } else if (st.round === 1) {
      emit(st, { t: 'act', n: 1, round: 1 });
    }
    if (st.round === st.cfg.rounds && st.cfg.rounds > 3) tasks.push({ k: 'lastRound' });
    tasks.push({ k: 'turnStart', s: st.order[st.ti] });
    push(st, ...tasks);
  };

  function snapshot(st) {
    st.hist.push({ r: st.round, w: st.players.map((p) => worth(st, p.id)) });
    for (const p of st.players) { const w = worth(st, p.id); if (w > p.st.peak) p.st.peak = w; }
  }

  TASK.actChange = (st, t) => {
    st.act = t.n;
    emit(st, { t: 'act', n: t.n, round: st.round });
    const fx = EV.FIXED['act' + t.n];
    if (t.n === 2) {
      emit(st, { t: 'season', id: fx.id, title: fx.title, text: fx.text, tag: 'open' });
      moveHot(st, 'new', -1);
      push(st, ...applyFx(st, st.order[0], fx.fx));
    } else {
      emit(st, { t: 'season', id: fx.id, title: fx.title, text: fx.text, tag: 'night' });
    }
  };

  TASK.season = (st) => {
    const e = drawFrom(st, -1, 'season', EV.SEASON);
    const ctx = { tag: e.fxTag || 'season' };
    const s0 = st.order[st.ti];
    emit(st, { t: 'season', id: e.id, title: e.title, text: e.text, tag: e.fxTag || '' });
    push(st, ...applyFx(st, s0, e.fx, ctx));
  };

  TASK.lastRound = (st) => {
    const fx = EV.FIXED.last;
    emit(st, { t: 'season', id: fx.id, title: fx.title, text: fx.text, tag: 'last' });
    const r = ranking(st); const n = r.length;
    const prizes = [];
    r.forEach((x, i) => {
      // 越後面抽到大紅包機率越高
      const luck = n > 1 ? i / (n - 1) : 0.5;
      const table = [50, 100, 150, 200, 300, 500];
      const v = U.weighted(st, table, (a) => { const j = table.indexOf(a); return 1 + luck * j * 0.9 + (1 - luck) * (table.length - j) * 0.35; });
      prizes.push({ s: x.s, amt: v });
      P(st, x.s).cash += v;
    });
    emit(st, { t: 'lucky', prizes });
  };

  TASK.turnStart = (st, t) => {
    const s = t.s;
    const p = P(st, s);
    st.cur = s; st.again = false;
    p.built = false; p.dbl = 0;
    emit(st, { t: 'turn', s, round: st.round });
    const tasks = [];
    // 該引爆的連鎖事件
    const due = st.chains.filter((c) => c.s === s && c.at <= st.round);
    if (due.length && !p.ghost) { st.chains = st.chains.filter((c) => !due.includes(c)); for (const c of due) tasks.push({ k: 'chainFire', s, key: c.key }); }
    if (p.ghost) tasks.push({ k: 'ghostTurn', s });
    else if (p.skip > 0) { tasks.push({ k: 'skipTurn', s }); }
    else if (p.jail > 0) tasks.push({ k: 'jailTurn', s });
    else tasks.push({ k: 'menu', s });
    push(st, ...tasks);
  };

  TASK.skipTurn = (st, t) => { const p = P(st, t.s); p.skip--; emit(st, { t: 'skip', s: t.s }); push(st, { k: 'turnEnd', s: t.s }); };

  TASK.chainFire = (st, t) => {
    const s = t.s; const e = EV.CHAIN[t.key];
    if (!e || P(st, s).ghost) return;
    let text = e.text; let fx = e.fx || [];
    if (e.rand) { const v = U.weighted(st, e.rand, (x) => x.w || 1); text = v.text; fx = v.fx; }
    const ctx = {};
    const tasks = applyFx(st, s, fx, ctx);
    emit(st, { t: 'event', deck: 'chain', id: e.id, s, title: e.title, text: fillText(st, s, text, ctx) });
    push(st, ...tasks);
  };

  // ---- 回合選單：擲骰、出卡、加蓋 ----
  function menuData(st, s) {
    const p = P(st, s);
    const cards = p.cards.filter((k, i) => C.byK[k] && C.byK[k].t === 'act' && C.allowed(k, st.cfg.intensity) && p.cards.indexOf(k) === i && cardUsable(st, s, k));
    const build = p.ghost || p.built ? [] : ownedLots(st, s).filter((id) => canBuild(st, s, id));
    return { cards, build };
  }
  function cardUsable(st, s, k) {
    const p = P(st, s);
    switch (k) {
      case 'renew': return ownedLots(st, s).some((id) => T(st, id).k === 'lot' && !st.lots[id].m && st.lots[id].lv < 3);
      case 'excavator': return Object.keys(st.lots).some((id) => { const L = st.lots[id]; return L.o >= 0 && L.o !== s && L.lv > 0 && L.lv < 4 && T(st, +id).d !== 'old'; });
      case 'seize': return Object.keys(st.lots).some((id) => { const L = st.lots[id]; return L.o >= 0 && L.o !== s; });
      case 'swap': return ownedLots(st, s).some((id) => st.lots[id].lv < 4) && Object.keys(st.lots).some((id) => { const L = st.lots[id]; return L.o >= 0 && L.o !== s && L.lv < 4; });
      case 'report': case 'turtle': return active(st).some((o) => o.id !== s);
      case 'stay': return !p.ghost && !p.jail;
      case 'dice': return !p.ghost && !p.turtle;
      case 'redpacket': case 'equal': return !p.ghost;
      default: return true;
    }
  }
  TASK.menu = (st, t) => {
    const s = t.s;
    if (st.over) return;
    const d = menuData(st, s);
    ask(st, 'turn', [s], { s, cards: d.cards, build: d.build, again: st.again });
  };

  TASK.jailTurn = (st, t) => {
    const s = t.s; const p = P(st, s);
    ask(st, 'jail', [s], { s, fine: R.JAIL_FINE, left: p.jail, canPay: p.cash >= R.JAIL_FINE });
  };

  // ---- 擲骰 ----
  TASK.roll = (st, t) => {
    const s = t.s; const p = P(st, s);
    let d1; let d2; let dbl = false;
    if (p.fixed) { const n = p.fixed; d1 = Math.min(6, Math.ceil(n / 2)); d2 = n - d1; if (d2 < 1) { d2 = 1; d1 = n - 1; } p.fixed = 0; dbl = false; }
    else { d1 = 1 + U.int(st, 6); d2 = 1 + U.int(st, 6); dbl = d1 === d2; }
    let steps = d1 + d2;
    if (p.turtle > 0) { steps = 1; p.turtle--; dbl = false; }
    emit(st, { t: 'dice', s, d: [d1, d2], steps, dbl, turtle: steps === 1 && d1 + d2 > 1 });
    if (dbl) {
      p.dbl++; p.st.dbl++;
      if (p.dbl >= 3) { emit(st, { t: 'speeding', s }); push(st, { k: 'goJail', s }, { k: 'turnEnd', s }); return; }
      st.again = true;
    } else st.again = false;
    push(st, { k: 'rollWindow', s, steps }, { k: 'turnEnd', s });
  };

  // ---- 插嘴時機 ----
  function holders(st, card, exclude) {
    return st.players.filter((o) => !exclude.includes(o.id) && o.cards.includes(card) && C.allowed(card, st.cfg.intensity)).map((o) => o.id);
  }
  function orderFrom(st, first, seats) {
    const n = st.players.length;
    return seats.slice().sort((a, b) => ((a - first + n) % n) - ((b - first + n) % n));
  }

  TASK.rollWindow = (st, t) => {
    const seats = holders(st, 'block', [t.s]);
    if (!seats.length || t.steps <= 1) { push(st, { k: 'moveSteps', s: t.s, steps: t.steps }); return; }
    ask(st, 'win', seats, { trig: 'roll', s: t.s, steps: t.steps, next: { k: 'moveSteps', s: t.s, steps: t.steps } });
  };

  TASK.moveSteps = (st, t) => {
    const s = t.s;
    const opts = routeOptions(st, s, t.steps);
    if (opts.length > 1) { ask(st, 'path', [s], { s, steps: t.steps, opts }); return; }
    push(st, { k: 'move', s, path: opts[0].path });
  };

  TASK.move = (st, t) => {
    const s = t.s; const p = P(st, s);
    const path = t.path || [];
    if (!path.length) { push(st, { k: 'land', s, tile: p.pos }); return; }
    const tasks = [];
    const ghost = p.ghost;
    emit(st, { t: 'move', s, path: path.slice(), back: !!t.back, ghost });
    for (let i = 0; i < path.length; i++) {
      const id = path[i];
      const last = i === path.length - 1;
      if (!ghost && !t.back && id === M(st).start) tasks.push({ k: 'passStart', s, landed: last });
      if (!last && !ghost && !t.back) {
        const L = st.lots[id];
        if (L && L.o >= 0 && L.o !== s) { const f = passFee(st, id); if (f > 0) tasks.push(payTask(s, L.o, f, 'pass', { tile: id })); }
      }
    }
    const end = path[path.length - 1];
    p.pos = end;
    if (st.cones[end] != null) { const by = st.cones[end]; delete st.cones[end]; emit(st, { t: 'coneHit', s, tile: end, by }); }
    tasks.push({ k: 'land', s, tile: end, noRide: !!t.noRide });
    push(st, ...tasks);
  };

  TASK.warp = (st, t) => {
    const p = P(st, t.s);
    p.pos = t.to;
    emit(st, { t: 'warp', s: t.s, to: t.to });
    const tasks = [];
    if (t.salary) tasks.push({ k: 'passStart', s: t.s, landed: true });
    if (t.land) tasks.push({ k: 'land', s: t.s, tile: t.to, noRide: true });
    push(st, ...tasks);
  };

  TASK.passStart = (st, t) => {
    const s = t.s; const p = P(st, s);
    if (p.ghost) return;
    let v = salaryOf(st, s);
    gain(st, s, v, 'salary');
    // 園區股利
    let div = 0;
    for (const id of M(st).lotsOf.tech || []) { const L = st.lots[id]; if (L.o === s && !L.m) div += R.TECH_DIV * idx(st, 'tech') * (trait(st, s) === 'engineer' ? 1.5 : 1); }
    if (div > 0) gain(st, s, U.r10(div), 'dividend');
    // 落後補助：最後一名而且跟第一名差很多
    const r = ranking(st);
    if (r.length > 1 && r[r.length - 1].s === s && r[0].w > r[r.length - 1].w * 1.6) { gain(st, s, R.AID, 'aid'); giveCard(st, s, 1); }
    else if (!p.cards.length) giveCard(st, s, 1);
  };

  TASK.goJail = (st, t) => {
    const p = P(st, t.s);
    if (p.ghost) return;
    p.pos = M(st).jail; p.jail = trait(st, t.s) === 'taxi' ? 1 : 2; p.st.jail++; st.again = false;
    emit(st, { t: 'jail', s: t.s });
  };

  // ---- 落地 ----
  TASK.land = (st, t) => {
    const s = t.s; const p = P(st, s); const id = t.tile; const tl = T(st, id);
    emit(st, { t: 'land', s, tile: id });
    if (p.ghost) { push(st, { k: 'haunt', s, tile: id }); return; }
    const tasks = [];
    switch (tl.k) {
      case 'lot': case 'mrt': {
        const L = st.lots[id];
        if (L.o < 0) tasks.push({ k: 'offerBuy', s, tile: id });
        else if (L.o === s) { if (tl.k === 'lot') tasks.push({ k: 'offerUp', s, tile: id }); }
        else tasks.push({ k: 'rent', s, tile: id }, { k: 'offerBuyout', s, tile: id });
        if (tl.k === 'mrt' && !t.noRide) tasks.push({ k: 'offerRide', s, tile: id });
        break;
      }
      case 'news': tasks.push({ k: 'drawEvent', s, deck: 'news' }); break;
      case 'temple': {
        for (const lid of M(st).lotsOf.temple || []) { const L = st.lots[lid]; if (L.o >= 0 && L.o !== s && !L.m) gain(st, L.o, U.r10(R.INCENSE * (1 + L.lv * 0.5) * idx(st, 'temple')), 'incense', { tile: lid }); }
        tasks.push({ k: 'drawEvent', s, deck: 'temple' });
        break;
      }
      case 'shop': tasks.push({ k: 'shop', s }); break;
      case 'invoice': tasks.push({ k: 'invoice', s }); break;
      case 'claw': if (p.cash >= R.CLAW) ask(st, 'claw', [s], { s, price: R.CLAW }); break;
      case 'tax': tasks.push({ k: 'tax', s, lux: false }); break;
      case 'lux_tax': tasks.push({ k: 'tax', s, lux: true }); break;
      case 'auction': tasks.push({ k: 'auctionTile', s }); break;
      case 'hall': tasks.push({ k: 'vote', s }); break;
      case 'speed': if (trait(st, s) === 'taxi') emit(st, { t: 'dodge', s }); else ask(st, 'speed', [s], { s, fine: R.SPEED_FINE, canPay: p.cash >= R.SPEED_FINE }); break;
      case 'cityhall': tasks.push({ k: 'hotPick', s, why: 'cityhall' }); break;
      case 'jail': emit(st, { t: 'visit', s }); break;
      default: break;
    }
    push(st, ...tasks);
  };

  TASK.offerBuy = (st, t) => {
    const s = t.s; const id = t.tile;
    if (st.lots[id].o >= 0) return;
    const price = buyPrice(st, s, id);
    if (P(st, s).cash >= price) ask(st, 'buy', [s], { s, tile: id, price });
    else push(st, { k: 'auction', tile: id, from: s });
  };

  TASK.buyWindow = (st, t) => {
    const s = t.s; const id = t.tile;
    const snap = U.r10(t.price * R.SNATCH);
    const seats = holders(st, 'snatch', [s]).filter((o) => !P(st, o).ghost && P(st, o).cash >= snap);
    if (!seats.length) { push(st, { k: 'doBuy', s, tile: id, price: t.price }); return; }
    ask(st, 'win', seats, { trig: 'buy', s, tile: id, price: t.price, snap, next: { k: 'doBuy', s, tile: id, price: t.price } });
  };

  TASK.doBuy = (st, t) => {
    const s = t.s; const id = t.tile; const p = P(st, s); const L = st.lots[id];
    if (L.o >= 0) return;
    if (p.ghost || p.cash < t.price) { push(st, { k: 'auction', tile: id, from: s }); return; }
    p.cash -= t.price; L.o = s; p.st.buys++;
    if (t.snatch) p.st.cards++;
    if (p.disc < 1 && !t.snatch && !t.auction) p.disc = 1;
    emit(st, { t: 'buy', s, tile: id, price: t.price, snatch: !!t.snatch, auction: !!t.auction });
    const d = T(st, id).d;
    if (d && d !== 'mrt' && ownsAll(st, s, d)) emit(st, { t: 'set', s, d });
  };

  TASK.offerUp = (st, t) => {
    const s = t.s; const id = t.tile; const L = st.lots[id];
    if (L.o !== s || !canBuild(st, s, id)) return;
    const lv = L.lv + 1;
    ask(st, 'upgrade', [s], { s, tile: id, lv, cost: buildCost(st, s, id, lv), branch: lv === 3, landmark: lv === 4 });
  };
  function doBuild(st, s, id, br, free) {
    const L = st.lots[id]; const p = P(st, s);
    const lv = L.lv + 1;
    const cost = free ? 0 : buildCost(st, s, id, lv);
    if (p.cash < cost) return false;
    p.cash -= cost; L.lv = lv; p.st.builds++;
    if (lv === 3) L.br = br === 'shop' ? 'shop' : 'tower';
    if (lv === 4) p.st.landmark++;
    emit(st, { t: 'build', s, tile: id, lv, cost, br: L.br, free: !!free });
    return true;
  }

  TASK.rent = (st, t) => {
    const s = t.s; const id = t.tile; const L = st.lots[id];
    const owner = L.o;
    if (owner < 0 || owner === s) return;
    const amt = rentOf(st, id);
    if (amt <= 0) { emit(st, { t: 'noRent', s, tile: id, why: L.m ? 'mort' : L.sz >= st.round ? 'seized' : 'holiday' }); return; }
    const ctx = { k: 'payRent', s, owner, tile: id, amt, mult: 1, cuts: [] };
    const seats = [];
    if (P(st, s).cards.some((k) => k === 'free' || k === 'blame')) seats.push(s);
    if (P(st, owner).cards.includes('hike') && !P(st, owner).ghost) seats.push(owner);
    for (const o of holders(st, 'cut', [s, owner])) if (!P(st, o).ghost) seats.push(o);
    const allowedSeats = seats.filter((x) => P(st, x).cards.some((k) => ['free', 'blame', 'hike', 'cut'].includes(k) && C.allowed(k, st.cfg.intensity)));
    if (!allowedSeats.length) { push(st, ctx); return; }
    ask(st, 'win', allowedSeats, { trig: 'rent', s, owner, tile: id, amt, next: ctx });
  };

  TASK.payRent = (st, t) => {
    const s = t.s; const owner = t.owner;
    if (P(st, owner).ghost) return;
    let amt = U.r10(t.amt * (t.mult || 1));
    if (t.free) { emit(st, { t: 'rentFree', s, tile: t.tile, amt }); return; }
    const pre = [];
    let blame = t.blame;
    if (t.mirrored != null) { pre.push(payTask(s, t.mirrored, R.MIRROR_FINE, 'mirror')); blame = null; }
    const payer = blame != null ? blame : s;
    if (payer === owner) return;
    const tasks = pre.concat([payTask(payer, owner, amt, 'rent', { tile: t.tile, blamed: blame != null ? s : undefined, hike: t.mult > 1 })]);
    for (const c of t.cuts || []) tasks.push(payTask(owner, c, U.r10(amt * R.CUT), 'cut', { tile: t.tile }));
    push(st, ...tasks);
  };

  TASK.offerBuyout = (st, t) => {
    const s = t.s; const id = t.tile;
    if (!buyoutOk(st, s, id)) return;
    const offer = offerPrice(st, s, id);
    ask(st, 'buyout', [s], { s, tile: id, owner: st.lots[id].o, offer });
  };

  TASK.offerRide = (st, t) => {
    const s = t.s; const p = P(st, s);
    if (p.ghost || (p.cash < R.MRT_FARE && trait(st, s) !== 'taxi')) return;
    const stations = (M(st).lotsOf.mrt || []).filter((id) => id !== t.tile && tileOpen(st, id));
    if (!stations.length) return;
    ask(st, 'mrt', [s], { s, from: t.tile, stations, fare: trait(st, s) === 'taxi' ? 0 : R.MRT_FARE });
  };

  // ---- 冤魂 ----
  TASK.ghostTurn = (st, t) => {
    const s = t.s; const p = P(st, s);
    p.ghostCard = (p.ghostCard || 0) + 1;
    if (p.ghostCard >= 2) { p.ghostCard = 0; giveCard(st, s, 1); }
    push(st, { k: 'menu', s });
  };
  TASK.haunt = (st, t) => {
    const L = st.lots[t.tile];
    if (L && L.o >= 0 && !P(st, L.o).ghost) {
      L.hn = st.round + 2;
      P(st, t.s).st.haunts++;
      emit(st, { t: 'haunt', s: t.s, tile: t.tile, owner: L.o });
    }
  };

  // ---- 事件 ----
  TASK.drawEvent = (st, t) => {
    const s = t.s;
    const list = t.deck === 'temple' ? EV.TEMPLE : EV.NEWS;
    const e = drawFrom(st, s, t.deck, list);
    if (e.choices) {
      const choices = e.choices.map((c) => ({ label: c.label, note: c.note || '' }));
      ask(st, 'event', [s], { s, eid: e.id, deck: t.deck, title: e.title, text: fillText(st, s, e.text), choices });
      return;
    }
    const ctx = {};
    const tasks = applyFx(st, s, e.fx, ctx);
    emit(st, { t: 'event', deck: t.deck, id: e.id, s, title: e.title, lv: e.lv, verse: e.verse, text: fillText(st, s, e.text, ctx) });
    push(st, ...tasks);
  };

  TASK.pickPlayer = (st, t) => {
    const others = activeIds(st).filter((x) => x !== t.s);
    if (!others.length) return;
    ask(st, 'pick', [t.s], { s: t.s, act: t.act, n: t.n, opts: others });
  };

  TASK.shop = (st, t) => {
    const s = t.s; const p = P(st, s);
    const pool = cardPool(st, false);
    const n = trait(st, s) === 'stream' ? 4 : 3;
    const offers = [];
    const bag = U.shuffle(st, pool.slice());
    for (const k of bag) { if (offers.length >= n) break; offers.push({ k, price: U.r10(C.byK[k].price * (trait(st, s) === 'stream' ? 0.8 : 1)) }); }
    if (p.cards.length >= R.HAND || p.cash < Math.min(...offers.map((o) => o.price))) { emit(st, { t: 'shopSkip', s, full: p.cards.length >= R.HAND }); return; }
    ask(st, 'shop', [s], { s, offers });
  };

  TASK.invoice = (st, t) => {
    const s = t.s;
    const prize = U.weighted(st, EV.INVOICE, (x) => x.w);
    if (prize.cash > 0) { P(st, s).cash += prize.cash; P(st, s).st.evGain += prize.cash; }
    emit(st, { t: 'invoice', s, name: prize.name, amt: prize.cash, text: prize.text });
  };

  TASK.tax = (st, t) => {
    const s = t.s; const p = P(st, s);
    const pct = t.lux ? U.r10(propValue(st, s) * R.LUX_PCT) : U.r10(worth(st, s) * R.TAX_PCT);
    const flat = t.lux ? R.LUX_FLAT : R.TAX_FLAT;
    if (pct <= 0) { emit(st, { t: 'taxFree', s, lux: !!t.lux }); return; }
    ask(st, 'tax', [s], { s, lux: !!t.lux, pct, flat, cash: p.cash });
  };

  TASK.auctionTile = (st, t) => {
    const free = Object.keys(st.lots).map(Number).filter((id) => st.lots[id].o < 0 && tileOpen(st, id));
    if (!free.length) { emit(st, { t: 'auctionNone', s: t.s }); gain(st, t.s, 50, 'event'); return; }
    // 偏好有人在收集的地段，比較有戲
    const id = U.weighted(st, free, (x) => { const d = T(st, x).d; const ids = M(st).lotsOf[d] || []; return 1 + ids.filter((o) => st.lots[o].o >= 0).length; });
    emit(st, { t: 'auctionCall', s: t.s, tile: id });
    push(st, { k: 'auction', tile: id, from: t.s, house: true });
  };

  TASK.auction = (st, t) => {
    const id = t.tile;
    if (st.lots[id].o >= 0) return;
    const seats = active(st).filter((o) => o.cash >= 10).map((o) => o.id);
    if (!seats.length) { emit(st, { t: 'auctionEnd', tile: id, bids: [], win: -1 }); return; }
    const base = Math.max(10, U.r10(T(st, id).p * (T(st, id).k === 'mrt' ? 1 : idx(st, T(st, id).d)) * 0.3));
    ask(st, 'auction', seats, { tile: id, min: base, from: t.from, house: !!t.house, list: U.r10(T(st, id).p * (T(st, id).k === 'mrt' ? 1 : idx(st, T(st, id).d))) });
  };

  TASK.vote = (st, t) => {
    const s = t.s;
    const e = drawFrom(st, s, 'vote', EV.VOTE);
    let opts;
    if (e.opts === 'yesno') opts = [{ v: 'yes', label: '贊成' }, { v: 'no', label: '反對' }];
    else if (e.opts === 'dist') {
      const open = Object.keys(M(st).DIST).filter((d) => d !== 'mrt' && distOpen(st, d));
      const scored = open.map((d) => ({ d, w: (M(st).lotsOf[d] || []).filter((id) => st.lots[id].o >= 0).length + U.rnd(st) }));
      scored.sort((a, b) => b.w - a.w);
      opts = scored.slice(0, 3).map((x) => ({ v: x.d, label: dname(st, x.d) }));
    } else opts = active(st).map((o) => ({ v: o.id, label: o.name }));
    const seats = st.players.map((o) => o.id);
    ask(st, 'vote', seats, { s, eid: e.id, title: e.title, text: e.text, kind: e.opts, opts, price: R.VOTE_PRICE, max: 2 });
  };

  TASK.hotPick = (st, t) => {
    const s = t.s;
    if (P(st, s).ghost) return;
    const dists = Object.keys(M(st).DIST).filter((d) => d !== 'mrt' && distOpen(st, d));
    ask(st, 'hot', [s], { s, dists, cur: st.hot, why: t.why, cash: t.why === 'cityhall' ? 100 : 0 });
  };

  TASK.turnEnd = (st, t) => {
    const s = t.s; const p = P(st, s);
    if (st.over) return;
    if (st.again && !p.ghost && !p.jail && st.cur === s) {
      st.again = false;
      emit(st, { t: 'again', s });
      push(st, { k: 'menu', s });
      return;
    }
    st.again = false;
    push(st, { k: 'next' });
  };

  TASK.pay = (st, t) => {
    const from = t.from; const to = t.to; const amt = t.amt;
    if (amt <= 0) return;
    const p = P(st, from);
    if (p.ghost) return;
    if (to >= 0 && P(st, to).ghost) return;
    if (p.cash >= amt) {
      p.cash -= amt;
      if (to >= 0) P(st, to).cash += amt;
      if (t.why === 'rent') {
        p.st.rentPaid += amt; if (to >= 0) { P(st, to).st.rentGot += amt; if (amt > P(st, to).st.maxRent) P(st, to).st.maxRent = amt; }
      }
      emit(st, { t: 'pay', from, to, amt, why: t.why, tile: t.tile, blamed: t.blamed, hike: t.hike });
      return;
    }
    // 現金不夠：先抵押
    const opts = liquidOptions(st, from);
    const could = opts.reduce((a, o) => a + o.v, 0);
    if (p.cash + could < amt) {
      // 全部抵押也不夠：破產
      for (const o of opts) mortgage(st, from, o.id, true);
      emit(st, { t: 'broke', s: from, need: amt, to });
      bankrupt(st, from, to);
      return;
    }
    const need = amt - p.cash;
    ask(st, 'raise', [from], { s: from, need, amt, to, why: t.why, opts, plan: liquidPlan(st, from, need), next: t });
  };

  TASK.gameOver = (st, t) => {
    if (st.over) return;
    st.over = true;
    st.prompt = null;
    snapshot(st);
    const r = st.players.map((p) => ({ s: p.id, w: worth(st, p.id), ghost: p.ghost, at: p.st.bankruptAt })).sort((a, b) => b.w - a.w || (a.ghost ? 1 : 0) - (b.ghost ? 1 : 0) || b.at - a.at);
    st.result = { why: t.why, rank: r, awards: awards(st) };
    emit(st, { t: 'over', why: t.why, rank: r });
  };

  function awards(st) {
    const list = [];
    const ps = st.players;
    const top = (f, min) => { let best = null; for (const p of ps) { const v = f(p); if (v > (min || 0) && (!best || v > best.v)) best = { s: p.id, v }; } return best; };
    const add = (k, name, b, fmt) => { if (b) list.push({ k, name, s: b.s, v: b.v, text: fmt(b.v) }); };
    add('rentKing', '收租王', top((p) => p.st.rentGot), (v) => '總共收了 ' + U.money(v) + ' 租金');
    add('victim', '最慘房客', top((p) => p.st.rentPaid), (v) => '總共繳了 ' + U.money(v) + ' 租金');
    add('bigRent', '一筆入魂', top((p) => p.st.maxRent), (v) => '單筆收到 ' + U.money(v));
    add('cards', '插嘴王', top((p) => p.st.cards), (v) => '出了 ' + v + ' 張插嘴卡');
    add('hit', '眾矢之的', top((p) => p.st.hit), (v) => '被卡片指定 ' + v + ' 次');
    add('nail', '最強釘子戶', top((p) => p.st.refused), (v) => '拒絕收購 ' + v + ' 次');
    add('buyout', '併購大亨', top((p) => p.st.buyouts), (v) => '收購成功 ' + v + ' 次');
    add('jail', '國道常客', top((p) => p.st.jail), (v) => '塞了 ' + v + ' 次國道');
    add('dbl', '豹子王', top((p) => p.st.dbl), (v) => '擲出 ' + v + ' 次豹子');
    add('luck', '天選之人', top((p) => p.st.evGain - p.st.evLoss), (v) => '事件淨賺 ' + U.money(v));
    add('builder', '建築狂人', top((p) => p.st.builds, 2), (v) => '蓋了 ' + v + ' 層樓');
    add('ghost', '最兇冤魂', top((p) => p.st.haunts), (v) => '鬧鬼 ' + v + ' 次');
    add('auction', '法拍獵人', top((p) => p.st.auctions), (v) => '標下 ' + v + ' 塊地');
    return list;
  }

  // ================= 決定（玩家或電腦回覆） =================
  const isInt = (x) => typeof x === 'number' && Number.isInteger(x);
  const PROMPT = {};

  PROMPT.turn = {
    valid(st, p, s, a) {
      if (!a) return null;
      const pl = P(st, s);
      if (a.a === 'roll') return { a: 'roll' };
      if (a.a === 'build' && isInt(a.tile) && p.build.includes(a.tile)) {
        const L = st.lots[a.tile];
        return { a: 'build', tile: a.tile, br: L.lv + 1 === 3 ? (a.br === 'shop' ? 'shop' : 'tower') : null };
      }
      if (a.a === 'card' && typeof a.card === 'string' && p.cards.includes(a.card) && pl.cards.includes(a.card)) return validCard(st, s, a);
      return null;
    },
    resolve(st, p) {
      const s = p.s; const a = p.ans[s]; const pl = P(st, s);
      if (a.a === 'roll') {
        if (pl.ghost) { push(st, { k: 'ghostRoll', s }); return; }
        push(st, { k: 'roll', s }); return;
      }
      if (a.a === 'build') { if (doBuild(st, s, a.tile, a.br)) pl.built = true; push(st, { k: 'menu', s }); return; }
      if (a.a === 'card') { useCard(st, s, a); return; }
    },
  };

  TASK.ghostRoll = (st, t) => {
    const s = t.s;
    const d = 1 + U.int(st, 6);
    emit(st, { t: 'dice', s, d: [d], steps: d, ghost: true });
    const opts = routes(st, P(st, s).pos, d);
    // 冤魂：挑一條會撞到最有錢的人的地
    const ldr = leader(st, -1);
    let best = opts[0]; let bw = -1;
    for (const o of opts) { const L = st.lots[o.to]; const w = (L && L.o >= 0 ? 2 + (L.o === ldr ? 3 : 0) + L.lv : 0) + U.rnd(st); if (w > bw) { bw = w; best = o; } }
    push(st, { k: 'move', s, path: best.path }, { k: 'turnEnd', s });
  };

  function validCard(st, s, a) {
    const k = a.card; const c = C.byK[k];
    if (!c || c.t !== 'act' || !C.allowed(k, st.cfg.intensity) || !cardUsable(st, s, k)) return null;
    const pl = P(st, s);
    const others = activeIds(st).filter((x) => x !== s);
    switch (k) {
      case 'dice': return isInt(a.n) && a.n >= 2 && a.n <= 12 ? { a: 'card', card: k, n: a.n } : null;
      case 'stay': case 'redpacket': case 'equal': return pl.ghost && k !== 'cone' ? null : { a: 'card', card: k };
      case 'renew': { const L = st.lots[a.tile]; return isInt(a.tile) && L && L.o === s && !L.m && L.lv < 3 && T(st, a.tile).k === 'lot' ? { a: 'card', card: k, tile: a.tile, br: a.br === 'shop' ? 'shop' : 'tower' } : null; }
      case 'cone': return isInt(a.tile) && a.tile >= 0 && a.tile < M(st).tiles.length && tileOpen(st, a.tile) && a.tile !== M(st).start && st.cones[a.tile] == null && !st.players.some((o) => o.pos === a.tile && !o.ghost) ? { a: 'card', card: k, tile: a.tile } : null;
      case 'report': case 'turtle': return isInt(a.target) && others.includes(a.target) ? { a: 'card', card: k, target: a.target } : null;
      case 'seize': { const L = st.lots[a.tile]; return isInt(a.tile) && L && L.o >= 0 && L.o !== s ? { a: 'card', card: k, tile: a.tile } : null; }
      case 'excavator': { const L = st.lots[a.tile]; return isInt(a.tile) && L && L.o >= 0 && L.o !== s && L.lv > 0 && L.lv < 4 && T(st, a.tile).d !== 'old' ? { a: 'card', card: k, tile: a.tile } : null; }
      case 'swap': {
        const A = st.lots[a.mine]; const B = st.lots[a.tile];
        return isInt(a.mine) && isInt(a.tile) && A && B && A.o === s && B.o >= 0 && B.o !== s && A.lv < 4 && B.lv < 4 ? { a: 'card', card: k, mine: a.mine, tile: a.tile } : null;
      }
      default: return null;
    }
  }

  function useCard(st, s, a) {
    const k = a.card; const pl = P(st, s);
    takeCard(st, s, k);
    pl.st.cards++;
    emit(st, { t: 'card', s, card: k, target: a.target, tile: a.tile, mine: a.mine, n: a.n });
    streamFee(st, s);
    let victim = -1;
    if (k === 'report' || k === 'turtle') victim = a.target;
    if (k === 'seize' || k === 'excavator' || k === 'swap') victim = st.lots[a.tile].o;
    if (victim >= 0) P(st, victim).st.hit++;
    const fx = { k: 'cardFx', s, card: k, target: a.target, tile: a.tile, mine: a.mine, n: a.n, br: a.br };
    if (victim >= 0 && P(st, victim).cards.includes('mirror') && C.allowed('mirror', st.cfg.intensity)) {
      ask(st, 'win', [victim], { trig: 'target', s, victim, card: k, next: fx });
      return;
    }
    push(st, fx);
  }

  TASK.cardFx = (st, t) => {
    const s = t.s; const pl = P(st, s); const k = t.card;
    const back = () => push(st, { k: 'menu', s });
    if (t.mirrored) { push(st, payTask(s, t.mirrored, R.MIRROR_FINE, 'mirror'), { k: 'menu', s }); return; }
    switch (k) {
      case 'dice': pl.fixed = t.n; push(st, { k: 'roll', s }); return;
      case 'stay': st.again = false; emit(st, { t: 'stay', s }); push(st, { k: 'land', s, tile: pl.pos, noRide: true }, { k: 'turnEnd', s }); return;
      case 'renew': { const L = st.lots[t.tile]; if (L.o === s && L.lv < 3) { L.lv++; if (L.lv === 3) L.br = t.br || 'tower'; emit(st, { t: 'build', s, tile: t.tile, lv: L.lv, free: true, br: L.br }); } back(); return; }
      case 'redpacket': { const tasks = []; for (const o of active(st)) if (o.id !== s) tasks.push(payTask(o.id, s, R.REDPACKET, 'redpacket')); tasks.push({ k: 'menu', s }); push(st, ...tasks); return; }
      case 'cone': st.cones[t.tile] = s; emit(st, { t: 'cone', s, tile: t.tile }); back(); return;
      case 'report': { const v = U.r10(P(st, t.target).cash * R.REPORT); push(st, payTask(t.target, -1, v, 'report'), { k: 'menu', s }); return; }
      case 'turtle': P(st, t.target).turtle = R.TURTLE; emit(st, { t: 'status', s: t.target, k: 'turtle', n: R.TURTLE }); back(); return;
      case 'seize': st.lots[t.tile].sz = st.round + R.SEIZE - 1; emit(st, { t: 'seize', s, tile: t.tile, until: st.round + R.SEIZE - 1 }); back(); return;
      case 'excavator': { const L = st.lots[t.tile]; if (L.lv > 0 && L.lv < 4) { L.lv--; if (L.lv < 3) L.br = null; emit(st, { t: 'down', tiles: [t.tile], why: 'excavator', s }); } back(); return; }
      case 'swap': {
        const A = st.lots[t.mine]; const B = st.lots[t.tile];
        if (A.o === s && B.o >= 0 && B.o !== s) { const o = B.o; B.o = s; A.o = o; B.nail = 0; A.nail = 0; emit(st, { t: 'swap', s, mine: t.mine, tile: t.tile, other: o }); }
        back(); return;
      }
      case 'equal': {
        const act = active(st);
        const tot = act.reduce((x, o) => x + o.cash, 0);
        const each = U.r10(tot / act.length);
        const before = act.map((o) => ({ s: o.id, c: o.cash }));
        for (const o of act) o.cash = each;
        emit(st, { t: 'equal', s, each, before });
        back(); return;
      }
      default: back();
    }
  };

  PROMPT.jail = {
    valid(st, p, s, a) {
      if (!a) return null;
      if (a.a === 'pay' && P(st, s).cash >= R.JAIL_FINE) return { a: 'pay' };
      if (a.a === 'roll') return { a: 'roll' };
      return null;
    },
    resolve(st, p) {
      const s = p.s; const a = p.ans[s]; const pl = P(st, s);
      if (a.a === 'pay') {
        pl.cash -= R.JAIL_FINE; pl.jail = 0;
        emit(st, { t: 'pay', from: s, to: -1, amt: R.JAIL_FINE, why: 'jail' });
        push(st, { k: 'menu', s });
        return;
      }
      push(st, { k: 'jailRoll', s });
    },
  };
  TASK.jailRoll = (st, t) => {
    const s = t.s; const pl = P(st, s);
    const d1 = 1 + U.int(st, 6); const d2 = 1 + U.int(st, 6);
    const dbl = d1 === d2;
    emit(st, { t: 'dice', s, d: [d1, d2], steps: d1 + d2, dbl, jail: true });
    if (dbl) { pl.jail = 0; emit(st, { t: 'unjail', s }); push(st, { k: 'rollWindow', s, steps: d1 + d2 }, { k: 'turnEnd', s }); return; }
    pl.jail--;
    if (pl.jail <= 0) {
      // 塞滿兩回合：繳錢出來直接走
      pl.jail = 0;
      emit(st, { t: 'unjail', s, paid: true });
      push(st, payTask(s, -1, R.JAIL_FINE, 'jail'), { k: 'rollWindow', s, steps: d1 + d2 }, { k: 'turnEnd', s });
      return;
    }
    emit(st, { t: 'stuck', s, left: pl.jail });
    push(st, { k: 'turnEnd', s });
  };

  PROMPT.path = {
    valid(st, p, s, a) { return a && isInt(a.i) && a.i >= 0 && a.i < p.opts.length ? { i: a.i } : null; },
    resolve(st, p) { const o = p.opts[p.ans[p.s].i]; push(st, { k: 'move', s: p.s, path: o.path }); },
  };

  PROMPT.buy = {
    valid(st, p, s, a) { return a && typeof a.buy === 'boolean' ? { buy: a.buy } : null; },
    resolve(st, p) {
      const s = p.s;
      if (p.ans[s].buy && P(st, s).cash >= p.price) push(st, { k: 'buyWindow', s, tile: p.tile, price: p.price });
      else { emit(st, { t: 'pass', s, tile: p.tile }); push(st, { k: 'auction', tile: p.tile, from: s }); }
    },
  };

  PROMPT.upgrade = {
    valid(st, p, s, a) { return a && typeof a.up === 'boolean' ? { up: a.up, br: a.br === 'shop' ? 'shop' : 'tower' } : null; },
    resolve(st, p) {
      const s = p.s; const a = p.ans[s];
      if (a.up && canBuild(st, s, p.tile) && st.lots[p.tile].lv + 1 === p.lv) doBuild(st, s, p.tile, a.br);
    },
  };

  PROMPT.win = {
    valid(st, p, s, a) {
      if (!a) return null;
      if (!a.use) return { use: false };
      const pl = P(st, s);
      const k = a.card;
      if (typeof k !== 'string' || !pl.cards.includes(k) || !C.allowed(k, st.cfg.intensity)) return null;
      if (p.trig === 'roll' && k === 'block') return { use: true, card: k };
      if (p.trig === 'buy' && k === 'snatch' && pl.cash >= p.snap) return { use: true, card: k };
      if (p.trig === 'target' && k === 'mirror' && s === p.victim) return { use: true, card: k };
      if (p.trig === 'rent') {
        if (s === p.s && k === 'free') return { use: true, card: k };
        if (s === p.s && k === 'blame') {
          const ok = isInt(a.target) && a.target !== p.s && a.target !== p.owner && P(st, a.target) && !P(st, a.target).ghost;
          return ok ? { use: true, card: k, target: a.target } : null;
        }
        if (s === p.owner && k === 'hike') return { use: true, card: k };
        if (s !== p.s && s !== p.owner && k === 'cut') return { use: true, card: k };
      }
      return null;
    },
    resolve(st, p) {
      const next = Object.assign({}, p.next);
      const seats = orderFrom(st, p.s != null ? p.s : 0, p.seats);
      const used = (s, k, extra) => { takeCard(st, s, k); P(st, s).st.cards++; emit(st, Object.assign({ t: 'card', s, card: k, react: true }, extra || {})); streamFee(st, s); };
      if (p.trig === 'roll') {
        const s = seats.find((x) => p.ans[x] && p.ans[x].use);
        if (s != null) { used(s, 'block', { target: p.s }); next.steps = Math.max(1, Math.floor(p.steps / 2)); P(st, p.s).st.hit++; }
      } else if (p.trig === 'buy') {
        const s = seats.find((x) => p.ans[x] && p.ans[x].use && P(st, x).cash >= p.snap);
        if (s != null) { used(s, 'snatch', { tile: p.tile, target: p.s }); next.s = s; next.price = p.snap; next.snatch = true; emit(st, { t: 'snatched', s, from: p.s, tile: p.tile }); }
      } else if (p.trig === 'target') {
        const a = p.ans[p.victim];
        if (a && a.use) { used(p.victim, 'mirror', { target: p.s }); next.mirrored = p.victim; emit(st, { t: 'mirrored', s: p.victim, user: p.s, card: p.card }); }
      } else if (p.trig === 'rent') {
        // 先漲租，再免租／嫁禍，最後抽成
        const o = p.ans[p.owner];
        if (o && o.use && o.card === 'hike') { used(p.owner, 'hike', { tile: p.tile, target: p.s }); next.mult = 2; }
        const a = p.ans[p.s];
        let mirrorAsk = -1;
        if (a && a.use && a.card === 'free') { used(p.s, 'free', { tile: p.tile }); next.free = true; }
        else if (a && a.use && a.card === 'blame') {
          used(p.s, 'blame', { tile: p.tile, target: a.target });
          P(st, a.target).st.hit++;
          next.blame = a.target;
          // 被嫁禍的人可以反彈
          if (P(st, a.target).cards.includes('mirror') && C.allowed('mirror', st.cfg.intensity)) mirrorAsk = a.target;
        }
        const cuts = [];
        for (const x of seats) { const c = p.ans[x]; if (x !== p.s && x !== p.owner && c && c.use && c.card === 'cut' && cuts.length < 3) { used(x, 'cut', { tile: p.tile, target: p.owner }); cuts.push(x); } }
        next.cuts = cuts;
        if (mirrorAsk >= 0) { push(st, { k: 'blameMirror', s: p.s, victim: mirrorAsk, next }); return; }
      }
      push(st, next);
    },
  };
  TASK.blameMirror = (st, t) => {
    ask(st, 'win', [t.victim], { trig: 'target', s: t.s, victim: t.victim, card: 'blame', next: t.next });
  };

  PROMPT.buyout = {
    valid(st, p, s, a) { return a && typeof a.offer === 'boolean' ? { offer: a.offer } : null; },
    resolve(st, p) {
      const s = p.s;
      if (!p.ans[s].offer || !buyoutOk(st, s, p.tile)) return;
      const owner = st.lots[p.tile].o;
      const fee = refuseFee(st, p.tile);
      emit(st, { t: 'buyoutAsk', s, owner, tile: p.tile, offer: p.offer });
      ask(st, 'reply', [owner], { s: owner, buyer: s, tile: p.tile, offer: p.offer, fee, canRefuse: P(st, owner).cash >= fee });
    },
  };
  PROMPT.reply = {
    valid(st, p, s, a) {
      if (!a || typeof a.accept !== 'boolean') return null;
      if (!a.accept && !p.canRefuse) return null;
      return { accept: a.accept };
    },
    resolve(st, p) {
      const owner = p.s; const buyer = p.buyer; const id = p.tile; const L = st.lots[id];
      if (L.o !== owner) return;
      if (p.ans[owner].accept) {
        if (P(st, buyer).cash < p.offer) { emit(st, { t: 'buyoutFail', s: buyer, tile: id }); return; }
        P(st, buyer).cash -= p.offer; P(st, owner).cash += p.offer;
        L.o = buyer; L.nail = 0; L.hn = 0; L.sz = 0;
        P(st, buyer).st.buyouts++; P(st, owner).st.sold++;
        emit(st, { t: 'buyoutDone', s: buyer, owner, tile: id, offer: p.offer });
        const d = T(st, id).d;
        if (d && d !== 'mrt' && ownsAll(st, buyer, d)) emit(st, { t: 'set', s: buyer, d });
      } else {
        const fee = Math.min(p.fee, P(st, owner).cash);
        P(st, owner).cash -= fee; P(st, buyer).cash += fee;
        L.nail = st.round + R.NAIL - 1;
        P(st, owner).st.refused++;
        emit(st, { t: 'buyoutNo', s: buyer, owner, tile: id, fee, until: L.nail });
      }
    },
  };

  PROMPT.auction = {
    valid(st, p, s, a) {
      if (!a || !isInt(a.bid)) return null;
      if (a.bid === 0) return { bid: 0 };
      if (a.bid < p.min || a.bid > P(st, s).cash || a.bid % 10 !== 0) return null;
      return { bid: a.bid };
    },
    resolve(st, p) {
      const bids = p.seats.map((s) => ({ s, bid: Math.min(p.ans[s] ? p.ans[s].bid : 0, P(st, s).cash) })).filter((b) => b.bid >= p.min);
      bids.sort((a, b) => b.bid - a.bid);
      let win = -1; let price = 0;
      if (bids.length) {
        const topBid = bids[0].bid;
        const tied = bids.filter((b) => b.bid === topBid);
        const w = tied.length > 1 ? U.pick(st, tied) : tied[0];
        win = w.s; price = w.bid;
      }
      emit(st, { t: 'auctionEnd', tile: p.tile, bids: p.seats.map((s) => ({ s, bid: p.ans[s] ? p.ans[s].bid : 0 })), win, price });
      if (win >= 0) { P(st, win).st.auctions++; push(st, { k: 'doBuy', s: win, tile: p.tile, price, auction: true }); }
    },
  };

  PROMPT.vote = {
    valid(st, p, s, a) {
      if (!a || !isInt(a.o) || a.o < 0 || a.o >= p.opts.length) return null;
      const pl = P(st, s);
      let x = isInt(a.x) ? U.clamp(a.x, 0, p.max) : 0;
      if (pl.ghost) x = 0;
      while (x > 0 && pl.cash < x * p.price) x--;
      return { o: a.o, x };
    },
    resolve(st, p) {
      const tally = p.opts.map(() => 0);
      const detail = [];
      for (const s of p.seats) {
        const a = p.ans[s] || { o: 0, x: 0 };
        const pl = P(st, s);
        const base = pl.ghost ? 1 : 1 + (trait(st, s) === 'chief' ? 2 : 0);
        const x = Math.min(a.x, Math.floor(pl.cash / p.price));
        if (x > 0) { pl.cash -= x * p.price; pl.st.votesBought += x; }
        tally[a.o] += base + x;
        detail.push({ s, o: a.o, n: base + x, x });
      }
      const top = Math.max(...tally);
      const tied = tally.map((v, i) => (v === top ? i : -1)).filter((i) => i >= 0);
      let w = tied[0];
      if (tied.length > 1) {
        const prop = p.ans[p.s];
        w = prop && tied.includes(prop.o) ? prop.o : U.pick(st, tied);
      }
      const opt = p.opts[w];
      emit(st, { t: 'voteEnd', id: p.eid, title: p.title, kind: p.kind, opts: p.opts, tally, detail, win: w });
      const e = EV.byId[p.eid];
      let fx = [];
      if (p.kind === 'yesno') fx = e.fx[opt.v] || [];
      else fx = e.fx.win || [];
      const ctx = { pick: opt.v };
      push(st, ...applyFx(st, p.s, fx, ctx));
    },
  };

  PROMPT.event = {
    valid(st, p, s, a) { return a && isInt(a.c) && a.c >= 0 && a.c < p.choices.length ? { c: a.c } : null; },
    resolve(st, p) {
      const s = p.s; const e = EV.byId[p.eid]; const ch = e.choices[p.ans[s].c];
      const ctx = {};
      const tasks = applyFx(st, s, ch.fx, ctx);
      emit(st, { t: 'event', deck: p.deck, id: p.eid, s, title: p.title, text: p.text, choice: ch.label });
      push(st, ...tasks);
    },
  };

  PROMPT.pick = {
    valid(st, p, s, a) { return a && isInt(a.o) && p.opts.includes(a.o) ? { o: a.o } : null; },
    resolve(st, p) {
      const s = p.s; const o = p.ans[s].o;
      if (p.act === 'give') push(st, payTask(s, o, p.n, 'event'));
      else push(st, payTask(o, s, p.n, 'event'));
    },
  };

  PROMPT.shop = {
    valid(st, p, s, a) { return a && isInt(a.i) && a.i >= -1 && a.i < p.offers.length ? { i: a.i } : null; },
    resolve(st, p) {
      const s = p.s; const i = p.ans[s].i; const pl = P(st, s);
      if (i < 0) { emit(st, { t: 'shopSkip', s }); return; }
      const o = p.offers[i];

// ===== src/core/ai.js =====
// ===== 電腦玩家：只看場上公開的資訊做決定，跟真人一樣不能偷看別人的卡和出價 =====
HY.ai = (function () {
  const E = HY.engine;

  // 電腦自己的小亂數（不動到牌局的亂數，牌局才能重播）

  // ---- 人潮：每一格平均每回合被停留的機率（隨機走路估出來，依地圖和幕別快取） ----

    const pass = new Array(M(st).tiles.length).fill(0);

    for (let i = 0; i < N; i++) {

      fake.players[0].pos = pos;
      const opts = E.routes(fake, pos, steps);
      const o = opts[Math.floor(rr() * opts.length)];

      cnt[pos]++;

        case 'reply': {
          const keep = worthToMe(st, s, pr.tile) + threat(st, s, pr.tile, pr.buyer) * 0.5;
          const accept = pr.offer + (pr.canRefuse ? pr.fee : 1e9) >= keep * (0.95 + pp.thrift * 0.1) || p.cash < pr.fee;
          return { accept: !pr.canRefuse ? true : accept };
        }
        case 'auction': {
          let val = worthToMe(st, s, pr.tile);
          for (const o of opps(st, s)) val = Math.max(val, val + threat(st, s, pr.tile, o.id) * 0.3);
          const cap = p.cash - reserve(st, s) * 0.5;
          let bid = Math.min(cap, val * (0.7 + rnd() * 0.3 + pp.agg * 0.1));
          bid = Math.floor(bid / 10) * 10;
          if (bid < pr.min) return { bid: 0 };
          return { bid: Math.min(bid, Math.floor(p.cash / 10) * 10) };
        }
        case 'vote': return vote(st, s, pr);
        case 'event': {
          const EVD = HY.events.byId[pr.eid];
          let bi = 0; let bv = -1e9;
          EVD.choices.forEach((c, i) => { const v = fxValue(st, s, c.fx) + rnd() * 40; if (v > bv) { bv = v; bi = i; } });
          return { c: bi };
        }
        case 'pick': {
          if (pr.act === 'take') { let b = pr.opts[0]; for (const o of pr.opts) if (st.players[o].cash > st.players[b].cash) b = o; return { o: b }; }
          const r = E.ranking(st).map((x) => x.s).filter((x) => pr.opts.includes(x));
          return { o: r[r.length - 1] };
        }
        case 'shop': {
          if (p.cards.length >= 4 || p.cash < reserve(st, s) + 120) return { i: -1 };
          let bi = -1; let bv = 0;
          pr.offers.forEach((o, i) => { const v = cardRate(st, s, o.k) - o.price * 0.004 + rnd() * 0.2; if (o.price <= p.cash - reserve(st, s) && v > bv) { bv = v; bi = i; } });
          return { i: bv > 0.55 ? bi : -1 };
        }
        case 'claw': return { play: p.cash > reserve(st, s) + 120 && p.cards.length < 4 && rnd() < 0.65 };
        case 'tax': return { o: pr.pct <= pr.flat ? 'pct' : 'flat' };
        case 'speed': return { o: pr.canPay && p.cash - pr.fine > reserve(st, s) * 0.5 ? 'fine' : 'jail' };
        case 'mrt': {
          const here = expectFrom(st, s, pr.from);
          let best = -1; let bv = here + pr.fare + 40;
          for (const to of pr.stations) {
            const v = expectFrom(st, s, to) + tileScore(st, s, to) * 0.5;
            if (v > bv) { bv = v; best = to; }
          }
          return { to: best };
        }
        case 'raise': return { lots: pr.plan };
        case 'hot': {
          const val = {};
          for (const d of pr.dists) val[d] = 0;
          for (const id of E.ownedLots(st, s)) { const d = T(st, id).d; if (val[d] != null) val[d] += E.rentOf(st, id) * (traffic(st).land[id] || 0.02) * left(st) * opps(st, s).length * 0.5; }
          // 也可以把熱點從別人那邊移走
          for (const id in st.lots) { const L = st.lots[id]; const d = T(st, +id).d; if (L.o >= 0 && L.o !== s && val[d] != null) val[d] -= E.rentOf(st, +id) * 0.08; }
          let bd = null; let bv = -1e9;
          for (const d of pr.dists) if (val[d] > bv) { bv = val[d]; bd = d; }
          if (pr.cash && bv < pr.cash * 0.8) return { cash: true };
          return { d: bd || pr.dists[0] };
        }
        default: return E.fallback(st, s);
      }
    } catch (e) {
      return E.fallback(st, s);
    }
  }

  function fxValue(st, s, fx) {
    let v = 0;
    const n = opps(st, s).length;
    for (const f of fx || []) {
      if (f.cash) v += f.cash;
      if (f.pct) v += st.players[s].cash * f.pct;
      if (f.each) v += f.each * n;
      if (f.card) v += 60 * (typeof f.card === 'number' ? f.card : 1);
      if (f.skip) v -= 80 * f.skip;
      if (f.step) v += 5;
      if (f.take) v += f.take;
      if (f.give) v -= f.give;
      if (f.chain) {
        const c = HY.events.CHAIN[f.chain];
        if (c) {
          let ev = 0;
          if (c.rand) { let tw = 0; for (const x of c.rand) { tw += x.w || 1; ev += (x.w || 1) * fxValue(st, s, x.fx); } ev /= tw || 1; } else ev = fxValue(st, s, c.fx);
          v += ev * (0.4 + rnd() * 0.4);
        }
      }
    }
    return v;
  }

  // 卡片好不好用（買卡用）
  function cardRate(st, s, k) {
    const pp = per(st, s);
    const base = { dice: 0.9, stay: 0.5, renew: 1, redpacket: 0.8, cone: 0.6, report: 0.7, turtle: 0.6, seize: 0.75, excavator: 0.8, swap: 0.9, equal: 0.5, free: 1, hike: 0.85, cut: 0.7, block: 0.55, mirror: 0.75, snatch: 0.7, blame: 0.95 }[k] || 0.5;
    const meanK = C.byK[k] ? C.byK[k].mean : 0;
    let v = base + (meanK >= 2 ? (pp.mean - 0.5) * 0.4 : 0);
    if (k === 'equal') { const avg = opps(st, s).reduce((a, o) => a + o.cash, st.players[s].cash) / (opps(st, s).length + 1); v = st.players[s].cash < avg * 0.6 ? 1.2 : 0.2; }
    return v;
  }

  // ---- 自己的回合：出卡、加蓋，最後擲骰 ----
  function turn(st, s, pr) {
    const p = st.players[s];
    const pp = per(st, s);
    const ms = meanScale(st);
    const ldr = E.leader(st, s);
    const meRank = E.rankOf(st, s);
    const cards = pr.cards || [];
    const has = (k) => cards.includes(k);
    // 冤魂：有卡就整人
    if (p.ghost) {
      const lead = E.leader(st, -1);
      if (has('turtle') && lead >= 0 && rnd() < 0.7) return { a: 'card', card: 'turtle', target: lead };
      if (has('report') && lead >= 0 && rnd() < 0.7) return { a: 'card', card: 'report', target: lead };
      if (has('seize')) { const t = bestLotOf(st, lead, (L) => true); if (t >= 0 && rnd() < 0.7) return { a: 'card', card: 'seize', tile: t }; }
      if (has('cone')) { const c = coneSpot(st, s); if (c >= 0) return { a: 'card', card: 'cone', tile: c }; }
      return { a: 'roll' };
    }
    // 1) 好用的卡
    if (has('renew')) {
      let bt = -1; let bg = 0;
      for (const id of E.ownedLots(st, s)) { const L = st.lots[id]; if (T(st, id).k !== 'lot' || L.m || L.lv >= 3) continue; const g = rentIf(st, id, s, L.lv + 1) - rentIf(st, id, s, L.lv); if (g > bg) { bg = g; bt = id; } }
      if (bt >= 0) return { a: 'card', card: 'renew', tile: bt, br: 'tower' };
    }
    if (has('redpacket') && (p.cash < 400 || rnd() < 0.35)) return { a: 'card', card: 'redpacket' };
    if (has('equal')) {
      const act = st.players.filter((o) => !o.ghost);
      const avg = act.reduce((a, o) => a + o.cash, 0) / act.length;
      if (p.cash < avg * 0.6 && avg - p.cash > 250) return { a: 'card', card: 'equal' };
    }
    if (ldr >= 0 && meRank > 0 && rnd() < pp.mean * ms) {
      if (has('excavator')) { const t = bestLotOf(st, ldr, (L, id) => L.lv > 0 && L.lv < 4 && T(st, id).d !== 'old'); if (t >= 0) return { a: 'card', card: 'excavator', tile: t }; }
      if (has('seize')) { const t = bestLotOf(st, ldr, (L) => !L.m); if (t >= 0 && E.rentOf(st, t) >= 120) return { a: 'card', card: 'seize', tile: t }; }
      if (has('report') && st.players[ldr].cash >= 500) return { a: 'card', card: 'report', target: ldr };
      if (has('turtle') && rnd() < 0.6) return { a: 'card', card: 'turtle', target: ldr };
      if (has('swap')) {
        const mine = E.ownedLots(st, s).filter((id) => st.lots[id].lv < 4).sort((a, b) => E.lotValue(st, a) - E.lotValue(st, b));
        const theirs = bestLotOf(st, ldr, (L) => L.lv < 4);
        if (mine.length && theirs >= 0 && E.lotValue(st, theirs) - E.lotValue(st, mine[0]) > 200) return { a: 'card', card: 'swap', mine: mine[0], tile: theirs };
      }
    }
    if (has('report') && rnd() < 0.25 * pp.mean * ms) {
      const rich = opps(st, s).sort((a, b) => b.cash - a.cash)[0];
      if (rich && rich.cash > 800) return { a: 'card', card: 'report', target: rich.id };
    }
    if (has('cone') && rnd() < 0.5) { const c = coneSpot(st, s); if (c >= 0) return { a: 'card', card: 'cone', tile: c }; }
    // 2) 加蓋（一回合一次）
    if (pr.build && pr.build.length) {
      let bt = -1; let bv = 0;
      for (const id of pr.build) {
        const L = st.lots[id];
        const cost = E.buildCost(st, s, id, L.lv + 1);
        if (p.cash - cost < reserve(st, s) * (0.9 + pp.thrift * 0.3)) continue;
        const g = (rentIf(st, id, s, L.lv + 1) - rentIf(st, id, s, L.lv)) * (traffic(st).land[id] || 0.02) * left(st) * opps(st, s).length;
        const v = g / cost + (L.lv + 1 === 4 ? 0.5 : 0);
        if (v > bv) { bv = v; bt = id; }
      }
      if (bt >= 0 && (bv > 0.25 || left(st) > 4)) return { a: 'build', tile: bt, br: (traffic(st).pass[bt] || 0) > 0.42 && rnd() < 0.6 ? 'shop' : 'tower' };
    }
    // 3) 喬骰子：前面有大好機會或大危險
    if (has('dice')) {
      const base = expectFrom(st, s, p.pos);
      let bn = 0; let bv = base + 140;
      for (let n = 2; n <= 12; n++) {
        for (const r of E.routes(st, p.pos, n)) { const v = routeScore(st, s, r); if (v > bv) { bv = v; bn = n; } }
      }
      if (bn) return { a: 'card', card: 'dice', n: bn };
    }
    if (has('stay')) {
      const here = tileScore(st, s, p.pos);
      if (here > 50 && expectFrom(st, s, p.pos) < -150) return { a: 'card', card: 'stay' };
    }
    return { a: 'roll' };
  }

  function bestLotOf(st, owner, filter) {
    let bt = -1; let bv = -1;
    if (owner < 0) return -1;
    for (const id of E.ownedLots(st, owner)) {
      const L = st.lots[id];
      if (!filter(L, id)) continue;
      const v = E.rentOf(st, id) * (0.5 + (traffic(st).land[id] || 0.02) * 10) + L.lv * 30;
      if (v > bv) { bv = v; bt = id; }
    }
    return bt;
  }
  // 三角錐放在對手前面、剛好是自己的貴地，逼他停下來
  function coneSpot(st, s) {
    let best = -1; let bv = 80;
    for (const o of opps(st, s)) {
      for (let n = 2; n <= 9; n++) {
        for (const r of E.routes(st, o.pos, n)) {
          for (const id of r.path) {
            const L = st.lots[id];
            if (!L || L.o !== s || st.cones[id] != null) continue;
            if (st.players.some((x) => x.pos === id && !x.ghost)) continue;
            const v = E.rentOf(st, id) / Math.max(1, Math.abs(n - 5) + 1);
            if (v > bv) { bv = v; best = id; }
          }
        }
      }
    }
    return best;
  }

  // ---- 插嘴 ----
  function react(st, s, pr) {
    const p = st.players[s];
    const pp = per(st, s);
    const ms = meanScale(st);
    if (pr.trig === 'target') return { use: p.cards.includes('mirror') };
    if (pr.trig === 'roll') {
      const ldr = E.leader(st, -1);
      const want = (pr.s === ldr || E.rankOf(st, pr.s) < E.rankOf(st, s)) && pr.steps >= 6 && rnd() < 0.45 * pp.mean * ms + 0.1;
      return { use: want, card: 'block' };
    }
    if (pr.trig === 'buy') {
      const val = worthToMe(st, s, pr.tile) + threat(st, s, pr.tile, pr.s) * 0.5;
      const ok = val > pr.snap * 1.05 && p.cash - pr.snap > reserve(st, s) * 0.5;
      return { use: ok, card: 'snatch' };
    }
    if (pr.trig === 'rent') {
      if (s === pr.s) {
        const big = pr.amt >= Math.max(130, p.cash * 0.12);
        if (p.cards.includes('blame') && big) {
          const cand = st.players.filter((o) => !o.ghost && o.id !== s && o.id !== pr.owner);
          if (cand.length) {
            const ldr = cand.sort((a, b) => E.worth(st, b.id) - E.worth(st, a.id))[0];
            if (rnd() < 0.55 + pp.mean * 0.4) return { use: true, card: 'blame', target: ldr.id };
          }
        }
        if (p.cards.includes('free') && big) return { use: true, card: 'free' };
        return { use: false };
      }
      if (s === pr.owner) return { use: p.cards.includes('hike') && pr.amt >= 110 && rnd() < 0.85, card: 'hike' };
      return { use: p.cards.includes('cut') && pr.amt * R.CUT >= 35 && rnd() < 0.8, card: 'cut' };
    }
    return { use: false };
  }

  // ---- 投票 ----
  function vote(st, s, pr) {
    const p = st.players[s];
    const EVD = HY.events.byId[pr.eid];
    const scores = pr.opts.map((o) => {
      let fx;
      if (pr.kind === 'yesno') fx = EVD.fx[o.v] || [];
      else fx = EVD.fx.win || [];
      return fxImpact(st, s, fx, o.v);
    });
    let bi = 0;
    scores.forEach((v, i) => { if (v > scores[bi] + rnd() * 3) bi = i; });
    const spread = Math.max(...scores) - Math.min(...scores);
    let x = 0;
    if (!p.ghost && spread > 180 && p.cash > reserve(st, s) + 150) x = spread > 380 && p.cash > reserve(st, s) + 300 ? 2 : 1;
    return { o: bi, x };
  }
  function fxImpact(st, s, fx, pick) {
    let v = 0;
    const p = st.players[s];
    const mine = E.ownedLots(st, s);
    const valIn = (d) => mine.filter((id) => d === 'all' || T(st, id).d === d).reduce((a, id) => a + E.lotValue(st, id) + E.rentOf(st, id) * 3, 0);
    for (const f of fx) {
      const d = f.d === '@' ? pick : f.d;
      if (f.idx != null) v += f.idx * valIn(d);
      if (f.idxAll != null) v += f.idxAll * valIn('all');
      if (f.all != null) v += f.all;
      if (f.propTax) v -= E.propValue(st, s) * f.propTax;
      if (f.rentMod != null) {
        // 不收租：地多的人吃虧
        const myRent = mine.reduce((a, id) => a + E.rentOf(st, id), 0);
        let theirs = 0; for (const id in st.lots) { const L = st.lots[id]; if (L.o >= 0 && L.o !== s) theirs += E.rentOf(st, +id); }
        v += (theirs - myRent) * 0.15;
      }
      if (f.hot) { const hd = f.hot === '@' ? pick : f.hot; v += valIn(hd) * 0.2; }
      if (f.payEach != null) v += pick === s ? -f.payEach * opps(st, s).length : (f.payEach * 0.9);
      if (f.gain != null) v += pick === s ? f.gain : -f.gain * 0.2;
      if (f.payPct != null) v += pick === s ? -p.cash * f.payPct : 15;
      if (f.mayor != null) v += pick === s ? 80 : 0;
    }
    if (typeof pick === 'number' && pick !== s) {
      // 選人：負面的投首富，正面的不想投對手
      const ldr = E.leader(st, s);
      const neg = fx.some((f) => f.payEach != null || f.payPct != null);
      if (neg && pick === ldr) v += 60;
    }
    return v;
  }

  // ---- 交易 ----
  function tradeValueFor(st, s, give, get, other) {
    // s 的角度：拿到 get、付出 give
    let v = 0;
    v += (get.cash || 0) - (give.cash || 0);
    for (const id of get.lots || []) v += worthToMe(st, s, id) + threat(st, s, id, other) * 0.4;
    for (const id of give.lots || []) v -= worthToMe(st, s, id) + threat(st, s, id, other) * 0.5;
    for (const k of get.cards || []) v += 60 * cardRate(st, s, k);
    for (const k of give.cards || []) v -= 60 * cardRate(st, s, k);
    return v;
  }
  function judgeTrade(st, s, t) {
    // 別人提議給 s：s 拿到 t.give、付出 t.get
    const pp = per(st, s);
    let v = tradeValueFor(st, s, t.get, t.give, t.from);
    // 缺現金的時候，現金比較香
    if (st.players[s].cash < reserve(st, s)) v += (t.give.cash || 0) * 0.15;
    const scale = Math.max(100, (t.give.cash || 0) + (t.get.cash || 0) + (t.give.lots || []).length * 150 + (t.get.lots || []).length * 150);
    return v > scale * (0.02 + pp.thrift * 0.05);
  }
  const memo = new WeakMap();
  function seen(st, key, gap) {
    let m = memo.get(st); if (!m) { m = {}; memo.set(st, m); }
    if (m[key] != null && st.round - m[key] < gap) return true;
    m[key] = st.round;
    return false;
  }
  function tradeIdea(st, s) {
    const p = st.players[s];
    if (p.ghost) return null;
    const res = reserve(st, s);
    const ideas = [];
    const missing = {}; // 我差一塊的地段 → 那一塊
    const theirMissing = []; // 別人差一塊、那一塊在我手上
    for (const d of Object.keys(M(st).lotsOf)) {
      if (d === 'mrt') continue;
      const ids = M(st).lotsOf[d];
      for (const o of st.players) {
        if (o.ghost) continue;
        const own = ids.filter((id) => st.lots[id].o === o.id);
        const miss = ids.filter((id) => st.lots[id].o !== o.id);
        if (own.length === ids.length - 1 && miss.length === 1 && own.length >= 1) {
          const id = miss[0]; const L = st.lots[id];
          if (L.o < 0 || L.lv >= 4 || st.players[L.o].ghost) continue;
          if (o.id === s) missing[d] = id;
          else if (L.o === s) theirMissing.push({ d, id, who: o.id });
        }
      }
    }
    // 1) 互相成全：我拿你的、你拿我的
    for (const d of Object.keys(missing)) {
      const a = missing[d]; const owner = st.lots[a].o;
      const mine = theirMissing.find((x) => x.who === owner);
      if (!mine) continue;
      const diff = Math.round((E.lotValue(st, a) - E.lotValue(st, mine.id)) / 10) * 10;
      const cash = Math.max(0, diff);
      if (cash > p.cash - res * 0.5) continue;
      if (seen(st, 'sw' + a + ':' + mine.id, 4)) continue;
      ideas.push({ to: owner, give: { cash, lots: [mine.id], cards: [] }, get: { cash: diff < 0 ? -diff : 0, lots: [a], cards: [] }, v: 500 });
    }
    // 2) 出錢買最後一塊
    for (const d of Object.keys(missing)) {
      const id = missing[d]; const owner = st.lots[id].o;
      const myGain = worthToMe(st, s, id);
      const theirKeep = worthToMe(st, owner, id) + threat(st, owner, id, s) * 0.5;
      let cash = Math.ceil((theirKeep * (1.02 + rnd() * 0.12)) / 10) * 10;
      cash = Math.max(cash, Math.ceil(E.lotValue(st, id) * 1.2 / 10) * 10);
      if (cash > myGain * 0.97 || cash > p.cash - res * 0.6) continue;
      if (seen(st, 'buy' + id, 4)) continue;
      ideas.push({ to: owner, give: { cash, lots: [], cards: [] }, get: { cash: 0, lots: [id], cards: [] }, v: myGain - cash });
    }
    if (!ideas.length) return null;
    ideas.sort((a, b) => b.v - a.v);
    const o = ideas[0]; delete o.v;
    return o;
  }

  return { decide, judgeTrade, tradeIdea, reseed, traffic, worthToMe, reserve };
})();

// ===== src/core/host.js =====
// ===== 主持人：推動牌局（電腦思考、超時代打、交易逾時、節奏） =====
// 單機版和連線伺服器共用。
//   io.now()、io.setTimeout(fn, ms)、io.clearTimeout(t)
//   io.out(evs)：把事件送出去（畫面播動畫／廣播給玩家）
//   io.human(seat)：這個位置是不是真人在控制（否則就是電腦）
// 節奏：mode 'ack' → 畫面播完動畫呼叫 release() 才繼續；mode 'timer' → 用事件長度估算等待時間
HY.Host = (function () {
  const E = HY.engine;
  const AI = HY.ai;

  // 每種事件大概要播多久（毫秒）
  const PACE = {
    start: 600, act: 2600, season: 4200, lucky: 3400, turn: 350, dice: 1250, move: 0, warp: 800, pay: 520, buy: 1000, build: 1000,
    set: 1700, card: 1400, snatched: 1500, mirrored: 1500, buyoutAsk: 600, buyoutDone: 1800, buyoutNo: 1800, auctionCall: 1400, auctionEnd: 3000,
    voteEnd: 3600, event: 3000, idx: 500, hot: 1200, down: 1400, jail: 1500, speeding: 1600, invoice: 2200, claw: 2000, bankrupt: 3200,
    trade: 1800, tradeAsk: 300, tradeNo: 400, haunt: 1300, equal: 2200, swap: 1600, seize: 1300, cone: 900, coneHit: 1100, ride: 600,
    stream: 300, shopBuy: 900, again: 900, stay: 800, status: 700, cardGet: 600, noRent: 900, rentFree: 1200, unjail: 900, stuck: 1100,
    over: 0, mort: 500, redeem: 500, dodge: 1200, skip: 1100, visit: 300, land: 120, auctionNone: 1300, mod: 600, broke: 900, taxFree: 700,
  };
  function paceOf(evs, speed) {
    let ms = 0;
    for (const e of evs) {
      if (e.t === 'move') ms += 260 * e.path.length + 300;
      else if (e.t === 'pay' && e.why === 'rent') ms += 1100;

      const p = this.st.prompt;

          this.flushSide();

      } else {
        this.tradeT.set(t.id, this.io.setTimeout(() => {
          this.tradeT.delete(t.id);
          if (this.st.side.find((x) => x.id === t.id)) { E.replyTrade(this.st, t.to, t.id, false); this.flushSide(); }

    replyTrade(s, id, yes) {
      const r = E.replyTrade(this.st, s, id, yes);

      return r;

    manage(s, a) { const r = E.manage(this.st, s, a); if (r.ok) this.flushSide(); return r; }
    // 交易／抵押不影響現在在等的決定，只把事件送出去
    flushSide() {

      if (this.st.over) this.cancelAll();
    }

    maybeAiTrade(s) {
      if (this.lastTradeRound[s] === this.st.round) return;
      if (Math.random() > 0.35) return;
      this.lastTradeRound[s] = this.st.round;
      const idea = AI.tradeIdea(this.st, s);
      if (!idea) return;

    }

    // 電腦角色的台詞（統一由主持人決定，連線時大家看到的一樣）

        const c = HY.chars.byId[st.players[s].char];
        if (!c || !c.lines[k]) return false;
        const talk = c.ai ? c.ai.talk : 0.7;
        if (Math.random() > p * (0.55 + talk * 0.5)) return false;
        if (now - (this.saidAt[s] || 0) < 2600) return false;
        const list = c.lines[k];
        const i = Math.floor(Math.random() * list.length);

        switch (e.t) {
          case 'start': { const ai = st.players.filter((p) => this.isAI(p.id)); if (ai.length) say(ai[Math.floor(Math.random() * ai.length)].id, 'start', 1); break; }

          case 'buyoutDone': say(e.owner, 'sold', 0.75); break;
          case 'buyoutNo': say(e.owner, 'refuse', 0.85); break;
          case 'card': if (!say(e.s, 'cardUse', 0.45) && e.target != null) say(e.target, 'cardHit', 0.6); break;
          case 'jail': say(e.s, 'jail', 0.6); break;
          case 'dice': if (e.dbl) say(e.s, 'double', 0.3); break;
          case 'bankrupt': say(e.s, 'broke', 1); break;

  function fitText(ctx, text, maxW, size, weight) {

  // 招牌：bg 底色、fg 字色

  // ---------- 遮雨棚（立體） ----------
  function awning(R, a, b, z, out, drop, cols) {
    const v = R.v; const ctx = R.ctx;
    const ox = out[0]; const oy = out[1];
    const n = cols.length * 3;
    for (let i = 0; i < n; i++) {
      const t0 = i / n; const t1 = (i + 1) / n;
      const p0 = [a[0] + (b[0] - a[0]) * t0, a[1] + (b[1] - a[1]) * t0];
      const p1 = [a[0] + (b[0] - a[0]) * t1, a[1] + (b[1] - a[1]) * t1];
      const pts = [[p0[0], p0[1], z], [p1[0], p1[1], z], [p1[0] + ox, p1[1] + oy, z - drop], [p0[0] + ox, p0[1] + oy, z - drop]];
      v.screen(ctx);
      ctx.beginPath();
      pts.forEach((p, j) => { const x = v.px(p[0], p[1], p[2]); const y = v.py(p[0], p[1], p[2]); if (j) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      ctx.closePath();

    v.screen(ctx);
    ctx.beginPath();
    ctx.moveTo(v.px(a[0] + ox, a[1] + oy, z - drop), v.py(a[0] + ox, a[1] + oy, z - drop));
    ctx.lineTo(v.px(b[0] + ox, b[1] + oy, z - drop), v.py(b[0] + ox, b[1] + oy, z - drop));
    ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.stroke();
  }

  // 前方（面向馬路）方向
  const DIRV = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] };
  function frontEdge(cx, cy, hx, hy, front) {
    switch (front) {
      case 'n': return [[cx - hx, cy - hy], [cx + hx, cy - hy]];
      case 's': return [[cx - hx, cy + hy], [cx + hx, cy + hy]];
