  }
  function sizeFor(front, wAlong, depth) { return front === 'n' || front === 's' ? [wAlong / 2, depth / 2] : [depth / 2, wAlong / 2]; }

  // ---------- 屋頂小物 ----------
  function tank(R, x, y, z) {
    const v = R.v; const ctx = R.ctx;
    // 支架
    box(v, ctx, { x0: x - 0.07, y0: y - 0.07, x1: x + 0.07, y1: y + 0.07, z0: z, z1: z + 0.05, c: '#6b7280' });
    cyl(v, ctx, x, y, 0.075, z + 0.05, z + 0.2, '#d6dde6', '#eef2f6', LINE);
  }
  function tinShed(R, x, y, z, w, d, col) {
    const v = R.v; const ctx = R.ctx;
    box(v, ctx, { x0: x - w / 2, y0: y - d / 2, x1: x + w / 2, y1: y + d / 2, z0: z, z1: z + 0.16, c: col, line: LINE, deco(c, f) {
      c.strokeStyle = 'rgba(255,255,255,0.28)'; c.lineWidth = 1.2;
      for (let i = 3; i < f.w; i += 4) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i, f.h); c.stroke(); }
    }, top(c) { c.fillStyle = 'rgba(255,255,255,0.14)'; for (let i = 0; i < 6; i++) c.fillRect(x - w / 2, y - d / 2 + (d * i) / 6, w, d / 18); } });
  }

  // ---------- 一般建築 ----------
  // b：{ id, cx, cy, front, lv, br, own(擁有者顏色), name, dist, dcol, tone }
  const TONES = {
    warm: ['#f1dfc4', '#f6e7d0'], brick: ['#b9643b', '#c97a4c'], cool: ['#dfe7ee', '#e9eef3'], gold: ['#f0dfb8', '#f5e9c9'],
    sea: ['#d9ece9', '#e4f3f0'], glass: ['#c9d6ea', '#d7e2f2'], neon: ['#e9dfe8', '#f1e8ef'], lux: ['#ece7df', '#f4f0e8'],
    green: ['#e2e9d6', '#eaf0df'], river: ['#d6e6f0', '#e1eef6'], concrete: ['#d9dbdf', '#e4e6ea'], mrt: ['#d9dbdf', '#e4e6ea'],
  };
  function wallOf(b) { const t = TONES[b.tone] || TONES.warm; return t[Math.floor(hash(b.id, 3) * t.length)]; }

  function stall(R, b) {
    const v = R.v; const ctx = R.ctx;
    const [hx, hy] = sizeFor(b.front, 0.56, 0.46);
    const wall = wallOf(b);
    const x0 = b.cx - hx; const x1 = b.cx + hx; const y0 = b.cy - hy; const y1 = b.cy + hy;
    box(v, ctx, { x0, y0, x1, y1, z1: 0.36, c: wall, line: LINE, front: b.front, deco(c, f) {
      tiles(c, f, wall, f.k);
      if (f.front) {
        c.fillStyle = shade('#2b2a33', 1); c.fillRect(f.w * 0.12, f.h * 0.42, f.w * 0.76, f.h * 0.58);
        c.fillStyle = R.night > 0.5 ? shade('#ffcf7a', 1, true) : shade('#5a4a3a', 1); c.fillRect(f.w * 0.16, f.h * 0.48, f.w * 0.68, f.h * 0.46);
        c.fillStyle = shade('#cfc6b8', 1); c.fillRect(f.w * 0.12, f.h * 0.82, f.w * 0.76, f.h * 0.18);
        sign(c, f.w * 0.06, f.h * 0.06, f.w * 0.88, f.h * 0.26, b.name.slice(0, 4), b.own, '#fff', R, f.k);
      } else {
        c.fillStyle = shade(wall, f.k * 0.9); c.fillRect(f.w * 0.3, f.h * 0.35, f.w * 0.4, f.h * 0.3);
      }
    } });
    const e = frontEdge(b.cx, b.cy, hx, hy, b.front); const o = DIRV[b.front];
    awning(R, e[0], e[1], 0.27, [o[0] * 0.13, o[1] * 0.13], 0.07, [b.own, '#ffffff']);
  }

  function townhouse(R, b) {
    const v = R.v; const ctx = R.ctx;
    const [hx, hy] = sizeFor(b.front, 0.62, 0.66);
    const wall = wallOf(b);
    const H = 0.92;
    const x0 = b.cx - hx; const x1 = b.cx + hx; const y0 = b.cy - hy; const y1 = b.cy + hy;
    box(v, ctx, { x0, y0, x1, y1, z1: H, c: wall, line: LINE, front: b.front, deco(c, f) {
      tiles(c, f, wall, f.k);
      const gf = 34;
      if (f.front) {
        // 一樓店面＋鐵捲門
        c.fillStyle = shade('#3a3946', 1); c.fillRect(f.w * 0.08, f.h - gf, f.w * 0.84, gf);
        c.fillStyle = R.night > 0.5 ? shade('#ffd48a', 1, true) : shade('#665a4c', 1); c.fillRect(f.w * 0.11, f.h - gf * 0.55, f.w * 0.78, gf * 0.55);
        c.fillStyle = shade('#9aa1ab', 1); c.fillRect(f.w * 0.11, f.h - gf + 4, f.w * 0.78, gf * 0.36);
        c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 0.8;
        for (let y = f.h - gf + 6; y < f.h - gf * 0.58; y += 2.6) { c.beginPath(); c.moveTo(f.w * 0.11, y); c.lineTo(f.w * 0.89, y); c.stroke(); }
        sign(c, f.w * 0.04, f.h - gf - 15, f.w * 0.92, 13, b.name, b.own, '#fff', R, f.k);
        windows(c, { w: f.w, h: f.h - gf - 16, side: f.side, k: f.k }, R, { cols: 2, rows: 2, mx: 6, top: 6, bot: 2, bars: true, ac: true, seed: b.id * 3, frame: '#59606c' });
      } else {
        windows(c, { w: f.w, h: f.h - 6, side: f.side, k: f.k }, R, { cols: 1, rows: 3, mx: f.w * 0.25, top: 6, bot: 2, bars: f.side !== 'n', seed: b.id * 5, frame: '#59606c' });
      }
    } });
    // 直式招牌
    const e = frontEdge(b.cx, b.cy, hx, hy, b.front); const o = DIRV[b.front];
    const sx = e[1][0] - (e[1][0] - e[0][0]) * 0.12; const sy = e[1][1] - (e[1][1] - e[0][1]) * 0.12;
    const px = o[0] * 0.16; const py = o[1] * 0.16;
    const sx0 = Math.min(sx, sx + px) - (o[0] ? 0 : 0.02); const sx1 = Math.max(sx, sx + px) + (o[0] ? 0 : 0.02);
    const sy0 = Math.min(sy, sy + py) - (o[1] ? 0 : 0.02); const sy1 = Math.max(sy, sy + py) + (o[1] ? 0 : 0.02);
    box(v, ctx, { x0: sx0, y0: sy0, x1: sx1, y1: sy1, z0: 0.4, z1: 0.86, c: b.own, line: LINE, deco(c, f) {
      if (f.w < 10) return;
      sign(c, 1, 1, f.w - 2, f.h - 2, b.name, b.own, '#fff8d6', R, f.k, true);
    } });
    // 頂樓：水塔＋鐵皮加蓋
    const bx = b.cx - o[0] * 0.14; const by = b.cy - o[1] * 0.14;
    tinShed(R, bx + (o[1] ? 0.08 : 0), by + (o[0] ? 0.08 : 0), H, 0.3, 0.26, '#5b8fc7');
    tank(R, b.cx + o[0] * 0.17 - (o[1] ? 0.15 : 0), b.cy + o[1] * 0.17 - (o[0] ? 0.15 : 0), H);
    awning(R, e[0], e[1], 0.3, [o[0] * 0.12, o[1] * 0.12], 0.06, [b.own, shade(b.own, 0.75, true)]);
  }

  function tower(R, b) {
    const v = R.v; const ctx = R.ctx;
    const [hx, hy] = sizeFor(b.front, 0.74, 0.72);
    const wall = wallOf(b);
    const H = 1.5;
    const x0 = b.cx - hx; const x1 = b.cx + hx; const y0 = b.cy - hy; const y1 = b.cy + hy;
    box(v, ctx, { x0, y0, x1, y1, z1: H, c: wall, line: LINE, front: b.front, deco(c, f) {
      tiles(c, f, wall, f.k);
      const gf = 30;
      c.fillStyle = shade('#3b3a48', f.k); c.fillRect(0, f.h - gf, f.w, gf);
      if (f.front) {
        c.fillStyle = R.night > 0.5 ? shade('#ffd48a', 1, true) : shade('#7b8a99', 1); c.fillRect(f.w * 0.06, f.h - gf * 0.62, f.w * 0.88, gf * 0.56);
        sign(c, f.w * 0.04, f.h - gf - 1, f.w * 0.92, 12, b.name, b.own, '#fff', R, f.k);
      } else {
        c.fillStyle = R.night > 0.5 ? shade('#f7c873', 0.9, true) : shade('#8796a5', 0.9); c.fillRect(f.w * 0.1, f.h - gf * 0.6, f.w * 0.8, gf * 0.45);
      }
      windows(c, { w: f.w, h: f.h - gf - 4, side: f.side, k: f.k }, R, { cols: 3, rows: 4, mx: 5, top: 5, bot: 2, ac: true, bars: hash(b.id, 7) < 0.5, seed: b.id * 7 + f.side.charCodeAt(0), floorLine: wall, balcony: '#c8c2b8' });
    } });
    // 頂樓：水塔＋廣告看板
    const o = DIRV[b.front];
    tank(R, b.cx - o[0] * 0.18 - (o[1] ? 0.18 : 0), b.cy - o[1] * 0.18 - (o[0] ? 0.18 : 0), H);
    tank(R, b.cx - o[0] * 0.18 + (o[1] ? 0.04 : 0), b.cy - o[1] * 0.18 + (o[0] ? 0.04 : 0), H);
    const e = frontEdge(b.cx, b.cy, hx * 0.86, hy * 0.86, b.front);
    const bx0 = Math.min(e[0][0], e[1][0]) - (o[0] ? 0.015 : 0); const bx1 = Math.max(e[0][0], e[1][0]) + (o[0] ? 0.015 : 0);
    const by0 = Math.min(e[0][1], e[1][1]) - (o[1] ? 0.015 : 0); const by1 = Math.max(e[0][1], e[1][1]) + (o[1] ? 0.015 : 0);
    // 支架
    box(v, ctx, { x0: bx0, y0: by0, x1: bx1, y1: by1, z0: H, z1: H + 0.08, c: '#5f6673' });
    box(v, ctx, { x0: bx0, y0: by0, x1: bx1, y1: by1, z0: H + 0.08, z1: H + 0.34, c: b.own, line: LINE, deco(c, f) {
      if (f.w < 20) return;
      sign(c, 1, 1, f.w - 2, f.h - 2, b.name, b.own, '#fff', R, f.k);
    } });
  }

  function famous(R, b) {
    const v = R.v; const ctx = R.ctx;
    const [hx, hy] = sizeFor(b.front, 0.8, 0.62);
    const wall = '#3a2f3f';
    const H = 0.78;
    const x0 = b.cx - hx; const x1 = b.cx + hx; const y0 = b.cy - hy; const y1 = b.cy + hy;
    box(v, ctx, { x0, y0, x1, y1, z1: H, c: (side) => (side === b.front ? '#40324a' : '#e8dccb'), line: LINE, front: b.front, deco(c, f) {
      if (f.front) {
        // 大招牌
        sign(c, 3, 3, f.w - 6, f.h * 0.42, b.name, b.own, '#ffe066', R, 1);
        c.fillStyle = R.night > 0.4 ? shade('#ffcf7a', 1, true) : shade('#c99a62', 1);
        c.fillRect(f.w * 0.07, f.h * 0.55, f.w * 0.86, f.h * 0.42);
        c.fillStyle = 'rgba(60,30,20,0.35)';
        for (let i = 0; i < 4; i++) c.fillRect(f.w * (0.12 + i * 0.21), f.h * 0.58, f.w * 0.04, f.h * 0.38);
        // 燈籠
        for (let i = 0; i < 4; i++) {
          const lx = f.w * (0.14 + i * 0.24);
          c.fillStyle = shade('#e23d3d', 1, R.night > 0.5); c.beginPath(); c.ellipse(lx, f.h * 0.5, 3.4, 4.4, 0, 0, 7); c.fill();
        }

        tiles(c, f, '#e8dccb', f.k);
        windows(c, f, R, { cols: 2, rows: 1, mx: 8, top: 8, bot: f.h * 0.45, seed: b.id, frame: '#59606c' });
      }
    } });
    // 屋頂立體招牌字
    box(v, ctx, { x0: b.cx - 0.05, y0: b.cy - 0.05, x1: b.cx + 0.05, y1: b.cy + 0.05, z0: H, z1: H + 0.12, c: '#555' });
    // 排隊人潮
    const o = DIRV[b.front];
    const e = frontEdge(b.cx, b.cy, hx, hy, b.front);
    const ppl = ['#e34b4b', '#3b82f6', '#22a06b', '#f2b33d', '#8b5cf6'];
    for (let i = 0; i < 5; i++) {
      const t = 0.12 + i * 0.19;
      const px = e[0][0] + (e[1][0] - e[0][0]) * t + o[0] * 0.2; const py = e[0][1] + (e[1][1] - e[0][1]) * t + o[1] * 0.2;
      person(R, px, py, ppl[(i + b.id) % ppl.length], Math.sin(R.t * 3 + i) * 0.006);
    }
  }

  function person(R, x, y, col, bob) {
    const v = R.v; const ctx = R.ctx;
    v.screen(ctx);
    const sx = v.px(x, y); const sy = v.py(x, y, 0) - (bob || 0) * v.kz;
    const s = v.k / 100;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(sx, sy, 5 * s, 2 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = shade(col, 1); rr(ctx, sx - 3.6 * s, sy - 15 * s, 7.2 * s, 13 * s, 3 * s); ctx.fill();
    ctx.fillStyle = shade('#f1c9a5', 1); ctx.beginPath(); ctx.arc(sx, sy - 18.5 * s, 3.6 * s, 0, 7); ctx.fill();
    ctx.fillStyle = shade('#2b2b33', 1); ctx.beginPath(); ctx.arc(sx, sy - 19.6 * s, 3.6 * s, Math.PI, 0); ctx.fill();
  }

  // 待售牌
  function forSale(R, b, price) {
    const v = R.v; const ctx = R.ctx;
    const o = DIRV[b.front];
    const cx = b.cx + o[0] * 0.18; const cy = b.cy + o[1] * 0.18;
    const along = b.front === 'n' || b.front === 's' ? [1, 0] : [0, 1];
    for (const sgn of [-1, 1]) {
      const px = cx + along[0] * 0.17 * sgn; const py = cy + along[1] * 0.17 * sgn;
      box(v, ctx, { x0: px - 0.018, y0: py - 0.018, x1: px + 0.018, y1: py + 0.018, z1: 0.3, c: '#d1d5db' });
    }
    const hx = along[0] ? 0.24 : 0.02; const hy = along[1] ? 0.24 : 0.02;
    box(v, ctx, { x0: cx - hx, y0: cy - hy, x1: cx + hx, y1: cy + hy, z0: 0.16, z1: 0.42, c: '#fbfaf5', line: LINE, deco(c, f) {
      if (f.w < 20) return;
      c.fillStyle = shade(b.dcol, 1); c.fillRect(0, 0, f.w, f.h * 0.3);
      c.fillStyle = '#ffffff'; c.textAlign = 'center'; c.textBaseline = 'middle';
      fitText(c, '待售', f.w * 0.8, f.h * 0.24); c.fillText('待售', f.w / 2, f.h * 0.16);
      c.fillStyle = shade('#1f2430', 1, true);
      fitText(c, b.name, f.w * 0.9, f.h * 0.3, 900); c.fillText(b.name, f.w / 2, f.h * 0.5);
      c.fillStyle = shade('#c2281f', 1, true);
      fitText(c, price, f.w * 0.9, f.h * 0.26, 800); c.fillText(price, f.w / 2, f.h * 0.8);
    } });
  }

  // 已買下的空地：旗子＋小圍籬
  function flag(R, b) {
    const v = R.v; const ctx = R.ctx;
    const x = b.cx - 0.12; const y = b.cy - 0.1;
    cyl(v, ctx, x, y, 0.016, 0, 0.62, '#d1d5db', '#eee');
    v.screen(ctx);
    const px = v.px(x, y); const pz = v.py(x, y, 0.6);
    const s = v.k / 100;
    const wave = Math.sin(R.t * 4 + b.id) * 3;
    ctx.beginPath();
    ctx.moveTo(px, pz);
    ctx.quadraticCurveTo(px + 16 * s, pz - 4 * s + wave * s, px + 30 * s, pz + 2 * s);
    ctx.lineTo(px + 30 * s, pz + 18 * s);
    ctx.quadraticCurveTo(px + 16 * s, pz + 12 * s + wave * s, px, pz + 16 * s);
    ctx.closePath();
    ctx.fillStyle = shade(b.own, 1, R.night > 0.5); ctx.fill();

    }
    // 動畫播完：給主持人放行、顯示輪到我的決定
    after() {
      if (this.dead || !this.ws) return;
      if (this.client.release) this.client.release();
      this.showPrompt();
    }
    spd() { const lag = this.q.length > 2 ? 0.35 : this.q.length > 0 ? 0.7 : 1; return lag / this.speed; }
    wait(ms) { return new Promise((r) => setTimeout(r, ms * this.spd())); }

    // ---------- 招牌列 ----------
    render() {
      const st = this.ws; if (!st) return;
      this.el.act.dataset.act = st.act;
      this.el.act.querySelector('.act').textContent = ACT_SHORT[st.act] || '';
      this.el.act.querySelector('.round').innerHTML = '第 <b>' + Math.min(st.round, st.cfg.rounds) + '</b> / ' + st.cfg.rounds + ' 輪';
      if (st.hot) { this.el.hot.hidden = false; this.el.hot.querySelector('span').textContent = '打卡熱點：' + HY.maps[st.map].DIST[st.hot].name + ' 租金 ×' + (st.hot === 'art' ? '1.8' : '1.5'); } else this.el.hot.hidden = true;
      this.renderPlayers();
      this.renderHand();
      this.renderDock();
    }
    renderPlayers() {
      const st = this.ws;
      const rank = E.ranking(st).map((x) => x.s);
      const order = st.order;
      const html = order.map((s) => {
        const p = st.players[s]; const c = CH[p.char];
        const r = rank.indexOf(s);
        const worth = E.worth(st, s);
        const n = p.nCards != null ? p.nCards : p.cards.length;
        const tags = [];
        if (p.jail) tags.push('塞車'); if (p.turtle) tags.push('烏龜'); if (p.skip) tags.push('休息');
        const who = this.client.label ? this.client.label(s) : (p.ai ? '電腦' : '');
        return `<div class="chip${st.cur === s && !st.over ? ' turn' : ''}${p.ghost ? ' ghost' : ''}" data-s="${s}" style="--pc:${c.color}">
          <div class="ava"></div>
          <div class="nm"><span>${esc(p.name)}</span>${who ? `<span class="tag">${esc(who)}</span>` : ''}${tags.map((t) => `<span class="tag st">${t}</span>`).join('')}<span class="cards" title="手牌">${IC.I.cards.replace('<svg', '<svg style="width:.95em;height:.95em"')}${n}</span><span class="rank${r === 0 ? ' first' : ''}">${p.ghost ? '冤魂' : r === 0 ? '首富' : '#' + (r + 1)}</span></div>
          <div class="money"><span class="cash num">${M(p.cash)}</span><span class="worth">身價 <b>${M(worth)}</b></span></div>
          <div class="bubble"></div>
        </div>`;
      }).join('');
      this.el.players.innerHTML = html;
      for (const s of order) {
        const p = st.players[s]; const c = CH[p.char];
        const a = this.el.players.querySelector(`.chip[data-s="${s}"] .ava`);
        const ic = HY.ui.tokens.icon(c.token, c.color, 44, 2);
        if (a && ic) { const cv = document.createElement('canvas'); cv.width = ic.width; cv.height = ic.height; cv.getContext('2d').drawImage(ic, 0, 0); a.appendChild(cv); }
      }
    }
    chip(s) { return this.el.players.querySelector(`.chip[data-s="${s}"]`); }
    // 玩家頭上冒字
    say(s, text, big) {
      const ch = this.chip(s); if (!ch) return;
      const b = ch.querySelector('.bubble'); if (!b) return;
      b.textContent = text; b.classList.toggle('big', !!big);
      b.classList.add('show');
      clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 2600 + text.length * 70);
    }
    floatChip(s, amt) {
      const ch = this.chip(s); if (!ch || !amt) return;
      const f = document.createElement('div'); f.className = 'float';
      f.style.color = amt > 0 ? '#9cf0b8' : '#ff8c84';
      f.textContent = (amt > 0 ? '+' : '') + M(amt);
      ch.appendChild(f); setTimeout(() => f.remove(), 1500);
      const c = ch.querySelector('.cash'); if (c) { c.classList.remove('up', 'down'); void c.offsetWidth; c.classList.add(amt > 0 ? 'up' : 'down'); }
    }
    setCash(s, v) { const ch = this.chip(s); if (!ch) return; const c = ch.querySelector('.cash'); if (c) c.textContent = M(v); }

    // ---------- 吐司、字幕 ----------
    toast(html, ms) {
      const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html;
      this.el.toasts.appendChild(t);
      while (this.el.toasts.children.length > 3) this.el.toasts.firstChild.remove();
      setTimeout(() => t.remove(), ms || 2400);
    }
    async banner(text, sub, col, ms) {
      const b = document.createElement('div'); b.className = 'banner';
      if (col) b.style.setProperty('--bc', col);
      b.innerHTML = esc(text) + (sub ? '<small>' + esc(sub) + '</small>' : '');
      this.el.stage.appendChild(b);

      b.classList.add('out'); setTimeout(() => b.remove(), 320);
    }
    nm(s) { return s >= 0 && this.ws.players[s] ? '<b style="color:' + CH[this.ws.players[s].char].color + '">' + esc(this.ws.players[s].name) + '</b>' : '公庫'; }
    pname(s) { return s >= 0 && this.ws.players[s] ? this.ws.players[s].name : '公庫'; }
    tname(id) { return HY.maps[this.ws.map].tiles[id].n; }
    log(html) { this.logList.push(html); if (this.logList.length > 200) this.logList.shift(); if (this.logPanel) this.logPanel(); }

    tokenAt(s) { const k = this.board.tok[s]; return k ? [k.x, k.y] : [0, 0]; }
    plotAt(id) { return this.board.plotCenter(id); }
    focusTile(id, zoom) { const t = HY.maps[this.ws.map].tiles[id]; this.board.follow = -1; this.board.focus(t.x, t.y, zoom || Math.max(this.board.v.cam.zoom, this.board.followZoom())); this.poke(1500); }

    // ---------- 事件動畫 ----------
    async anim(e) {
      const ws = this.ws; const B = this.board;
      const P = (s) => ws.players[s];
      this.poke(1200);
      switch (e.t) {
        case 'start': {
          SFX.playMusic('act1');
          await this.banner('好野人', '旺來市・' + ws.cfg.rounds + ' 輪定勝負', '#e8322b', 1500);
          const ord = e.order.map((s) => this.pname(s)).join(' → ');
          this.toast('出場順序：' + esc(ord), 3600);
          break;
        }
        case 'act': {
          ws.act = e.n; B.setAct(e.n);
          if (e.n > 1 || e.round > 1) { SFX.play('act'); SFX.playMusic(MUSIC[e.n]); await this.banner(ACT_NAME[e.n], e.n === 2 ? '新路通車・地價開始翻騰' : e.n === 3 ? '不夜城・租金全面上漲' : '', e.n === 3 ? '#b03cff' : e.n === 2 ? '#ff8a1d' : '#e8322b', 1900); }
          this.render();

        }
        case 'season': {
          SFX.play('news');
          if (e.tag === 'typhoon' || e.tag === 'rain') { B.rain(5); SFX.play('wind', 3.5); }
          if (e.tag === 'quake') { B.quake(1); SFX.play('rumble'); }
          if (e.tag === 'fireworks') { const t = HY.maps[ws.map].tiles[35]; B.fireworks(t.plot ? t.plot[0] : t.x, t.plot ? t.plot[1] : t.y); }
          if (e.tag === 'open') { ws.act = Math.max(ws.act, 2); B.setState(ws); }
          await this.news(e.title, e.text, e.tag === 'last' ? '最後一輪' : '季度新聞');
          break;
        }
        case 'lucky': {
          SFX.play('lucky');
          await this.reveal('尾牙抽紅包', e.prizes.map((x) => ({ s: x.s, v: '+' + M(x.amt) })), 2600);
          for (const x of e.prizes) { P(x.s).cash += x.amt; this.setCash(x.s, P(x.s).cash); this.floatChip(x.s, x.amt); }
          break;
        }
        case 'turn': {
          ws.cur = e.s;
          this.renderPlayers();
          if (B.t - B.userCam > 2.5) { B.follow = e.s; B.camGoal = null; }
          break;
        }
        case 'dice': {
          if (e.ghost) { await this.dice(e.d, e.steps, true); break; }
          await this.dice(e.d, e.steps, false, e.turtle);
          if (e.dbl && !e.jail) this.toast(this.nm(e.s) + ' 擲出<b>豹子</b>！');
          break;
        }
        case 'move': {
          const s = e.s;
          if (B.t - B.userCam > 2.5) { B.follow = s; }
          await B.hop(s, e.path, { speed: this.spd(), back: e.back, ghost: e.ghost, onStep: (i) => SFX.play('hop', i) });
          P(s).pos = e.path[e.path.length - 1];
          break;
        }
        case 'warp': { SFX.play('swoosh'); B.warp(e.s, e.to); P(e.s).pos = e.to; await this.wait(600); break; }
        case 'ride': { this.toast(this.nm(e.s) + ' 搭捷運到 <b>' + esc(this.tname(e.to)) + '</b>'); SFX.play('door'); break; }
        case 'land': break;
        case 'pay': await this.animPay(e); break;
        case 'buy': {
          const p = P(e.s); const L = ws.lots[e.tile];
          L.o = e.s; p.cash -= e.price; this.setCash(e.s, p.cash); this.floatChip(e.s, -e.price);
          B.setState(ws);
          const [x, y] = this.plotAt(e.tile);
          B.sparkle(x, y, 0.5, CH[p.char].color, 18); B.float(x, y, 1.2, '成交', '#ffd23f', 1.1);

          this.log(this.nm(e.s) + (e.auction ? ' 標下 ' : e.snatch ? ' 搶下 ' : ' 買下 ') + esc(this.tname(e.tile)) + ' ' + M(e.price));
          await this.wait(850);
          break;
        }
        case 'pass': this.toast(this.nm(e.s) + ' 不買 <b>' + esc(this.tname(e.tile)) + '</b>，送拍賣'); await this.wait(500); break;
        case 'build': {
          const L = ws.lots[e.tile]; const p = P(e.s);

          } else {

            await this.wait(900);
          }
          this.log(this.nm(e.s) + ' 把 ' + esc(this.tname(e.tile)) + ' 升到 Lv' + e.lv + (e.free ? '（免費）' : ''));
          break;
        }
        case 'set': {
          const D = HY.maps[ws.map].DIST[e.d];

        case 'mirrored': SFX.play('refuse'); await this.banner('反彈！', this.pname(e.s) + ' 把卡彈回給 ' + this.pname(e.user), '#2fd3ff', 1400); break;

        }
        case 'buyoutDone': {

          P(e.s).cash -= e.offer; P(e.owner).cash += e.offer;

        }
        case 'buyoutNo': {

          ws.lots[e.tile].nail = e.until; B.setState(ws);

          this.log(this.nm(e.owner) + ' 拒絕收購 ' + esc(this.tname(e.tile)) + (e.fee ? '，付 ' + M(e.fee) + ' 和解金' : ''));

          B.setState(ws); B.quake(0.4); SFX.play('rumble');
          this.toast((e.why === 'excavator' ? '怪手拆掉一層：' : '建築受損：') + e.tiles.map((id) => esc(this.tname(id))).join('、'));

        }
        case 'jail': SFX.play('jail'); P(e.s).pos = HY.maps[ws.map].jail; P(e.s).jail = 2; this.board.warp(e.s, HY.maps[ws.map].jail); await this.banner('國道塞車', this.pname(e.s) + ' 塞在路上動彈不得', '#4b5563', 1300); break;

        case 'stream': this.floatChip(e.s, e.amt); P(e.s).cash += e.amt; this.setCash(e.s, P(e.s).cash); break;
        case 'status': {
          const t = { turtle: '變成烏龜，接下來只能走 1 步', skip: '要休息 ' + e.n + ' 回合', disc: '下一塊地打 7 折' }[e.k];

        case 'skip': this.toast(this.nm(e.s) + ' 這回合休息'); await this.wait(700); break;
        case 'again': await this.banner('豹子！再擲一次', '', '#ffd23f', 900); break;
        case 'stay': this.toast(this.nm(e.s) + ' 停車不走，再處理一次這一格'); break;

        case 'rentFree': SFX.play('pop'); await this.banner('免租！', this.pname(e.s) + ' 省下 ' + M(e.amt), '#1fa463', 1100); break;

        case 'coneHit': { delete ws.cones[e.tile]; B.setState(ws); SFX.play('refuse'); this.toast(this.nm(e.s) + ' 被三角錐擋下來了'); await this.wait(600); break; }
        case 'seize': { ws.lots[e.tile].sz = e.until; B.setState(ws); SFX.play('gavel'); this.toast('<b>' + esc(this.tname(e.tile)) + '</b> 被查封到第 ' + e.until + ' 輪'); await this.wait(600); break; }
        case 'swap': {

    // ---------- 骰子 ----------
    async dice(d, steps, ghost, turtle) {
      SFX.play('shake');
      const wrap = document.createElement('div'); wrap.className = 'dice-wrap';
      const pip = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
      const face = (n) => '<div class="f f' + n + (n === 1 ? ' one' : n === 4 ? ' four' : '') + '">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map((k) => (pip[n].includes(k) ? '<i style="grid-area:' + (Math.ceil(k / 3)) + '/' + (((k - 1) % 3) + 1) + '"></i>' : '')).join('') + '</div>';
      const rot = { 1: [0, 0], 2: [0, -90], 3: [-90, 0], 4: [90, 0], 5: [0, 90], 6: [0, 180] };
      const dies = d.map((n) => {
        const el = document.createElement('div'); el.className = 'die';
        el.innerHTML = [1, 2, 3, 4, 5, 6].map(face).join('');
        wrap.appendChild(el);
        return { el, n };
      });
      if (ghost) wrap.style.filter = 'hue-rotate(220deg) saturate(0.4) opacity(0.85)';
      this.el.stage.appendChild(wrap);
      const t0 = performance.now(); const dur = 700 * this.spd();
      await new Promise((res) => {
        const step = (t) => {
          const u = Math.min(1, (t - t0) / dur);
          dies.forEach((o, i) => {
            const [rx, ry] = rot[o.n];
            const spin = (1 - u) * (1 - u);
            o.el.style.transform = 'translateY(' + (-Math.sin(u * Math.PI) * 60) + 'px) rotateX(' + (rx + spin * (720 + i * 180)) + 'deg) rotateY(' + (ry + spin * (540 + i * 90)) + 'deg)';
          });
          if (u < 1) requestAnimationFrame(step); else res();
        };
        requestAnimationFrame(step);
      });
      SFX.play('diceLand');
      const sum = document.createElement('div'); sum.className = 'dice-sum';
      sum.textContent = turtle ? '烏龜：1 步' : steps + ' 步';
      this.el.stage.appendChild(sum);
      await this.wait(520);
      wrap.remove(); sum.remove();
    }

  G.p_win = function (p, s) {
    const st = this.ws; const pl = st.players[s];
    let title; let cards = []; let extra = '';
    if (p.trig === 'roll') { title = `${esc(this.pname(p.s))} 擲出 ${p.steps} 步`; cards = ['block']; }
    else if (p.trig === 'buy') { title = `${esc(this.pname(p.s))} 要買 ${esc(this.tname(p.tile))}（${M(p.price)}）`; cards = ['snatch']; extra = `搶標要付 ${M(p.snap)}`; }
    else if (p.trig === 'target') { title = `${esc(this.pname(p.s))} 對你出了「${CARDS[p.card].name}」`; cards = ['mirror']; }
    else if (p.trig === 'rent') {
      if (s === p.s) { title = `你要付 ${M(p.amt)} 租金給 ${esc(this.pname(p.owner))}`; cards = ['free', 'blame']; }
      else if (s === p.owner) { title = `${esc(this.pname(p.s))} 要付你 ${M(p.amt)} 租金`; cards = ['hike']; }
      else { title = `${esc(this.pname(p.s))} 要付 ${M(p.amt)} 給 ${esc(this.pname(p.owner))}`; cards = ['cut']; extra = `抽成可以拿 ${M(Math.round(p.amt * HY.rules.CUT / 10) * 10)}`; }
    }
    cards = cards.filter((k) => pl.cards.includes(k) && HY.cards.allowed(k, st.cfg.intensity));
    const btns = cards.map((k) => `<button class="btn p lg" data-a="${k}">出「${CARDS[k].name}」</button>`).join('');
    this.sheet(`<div class="panel"><div class="hd" style="--hc:#ff4fa3">插嘴時間！<span class="who">${esc(pl.name)}</span></div><div class="bd">
      <p style="font-weight:800">${title}</p>${extra ? `<p class="note">${extra}</p>` : ''}
      <div style="display:flex;gap:.6em;justify-content:center">${cards.map((k) => this.cardHTML(k)).join('')}</div>${this.timerHTML()}
      <div class="row">${btns}<button class="btn" data-a="no">不出</button></div></div></div>`, (a) => {
      if (a === 'no') return this.answer(s, { use: false });
      if (a === 'blame') {
        const others = st.players.filter((o) => !o.ghost && o.id !== p.s && o.id !== p.owner);
        return this.pickPlayer('要嫁禍給誰？', others.map((o) => o.id), (t) => this.answer(s, { use: true, card: 'blame', target: t }), () => this.showPrompt(true));
      }

      ${this.timerHTML()}<div class="row"><button class="btn r lg" data-a="yes">出價收購</button><button class="btn" data-a="no">算了</button></div></div></div>`, (a) => this.answer(s, { offer: a === 'yes' }));

  G.p_auction = function (p, s) {
    const st = this.ws; const cash = st.players[s].cash;
    let bid = Math.min(cash, Math.max(p.min, Math.round(p.list * 0.8 / 10) * 10));
    bid = Math.floor(bid / 10) * 10;
    const draw = () => {
      this.sheet(`<div class="panel"><div class="hd" style="--hc:#8d6e63">${p.house ? '法拍屋' : '拍賣'}・暗標<span class="who">${esc(st.players[s].name)}</span></div><div class="bd">

        <div class="bid"><button class="btn sm" data-a="-50">-50</button><button class="btn sm" data-a="-10">-10</button><span class="amt num">${M(bid)}</span><button class="btn sm" data-a="+10">+10</button><button class="btn sm" data-a="+50">+50</button><button class="btn sm" data-a="+200">+200</button></div>
        ${this.timerHTML()}<div class="row"><button class="btn y lg" data-a="bid" ${bid >= p.min && bid <= cash ? '' : 'disabled'}>出價 ${M(bid)}</button><button class="btn" data-a="pass">不標</button></div></div></div>`, (a) => {
        if (a === 'bid') return this.answer(s, { bid });
        if (a === 'pass') return this.answer(s, { bid: 0 });
        bid = Math.max(p.min, Math.min(Math.floor(cash / 10) * 10, bid + parseInt(a, 10)));
        draw();
      }, true);
      this.shownKey = p.id + ':' + s;
    };
    draw();
  };

  G.p_vote = function (p, s) {
    const st = this.ws; const pl = st.players[s];
    let o = -1; let x = 0;
    const base = pl.ghost ? 1 : 1 + (E.trait(st, s) === 'chief' ? 2 : 0);
    const draw = () => {
      this.sheet(`<div class="panel"><div class="hd" style="--hc:#2f6b4a">${TL('chat')} 里民大會<span class="who">${esc(pl.name)}</span></div><div class="bd">
        <p style="font-weight:900;font-size:1.12em">${esc(p.title)}</p><p class="note">${esc(p.text)}</p>
        <div class="opt-grid">${p.opts.map((op, i) => `<button class="opt${o === i ? ' on' : ''}" data-a="o${i}">${esc(op.label)}</button>`).join('')}</div>
        ${pl.ghost ? '<p class="note">冤魂也有一票，但不能買票。</p>' : `<div class="stepper"><span>買票（每票 ${M(p.price)}）</span><button class="btn sm" data-a="x-">－</button><span class="val">${x}</span><button class="btn sm" data-a="x+">＋</button><span class="note">你一共 ${base + x} 票</span></div>`}
        ${this.timerHTML()}<div class="row"><button class="btn y lg" data-a="go" ${o >= 0 ? '' : 'disabled'}>投下去</button></div></div></div>`, (a) => {
        if (a[0] === 'o') { o = +a.slice(1); draw(); return; }
        if (a === 'x-') { x = Math.max(0, x - 1); draw(); return; }
        if (a === 'x+') { if (pl.cash >= (x + 1) * p.price) x = Math.min(p.max, x + 1); draw(); return; }
        if (a === 'go') this.answer(s, { o, x });
      }, true);
      this.shownKey = p.id + ':' + s;
    };
    draw();
  };

      <div class="row"><button class="btn y" data-a="fine" ${p.canPay ? '' : 'disabled'}>繳罰單 ${M(p.fine)}</button><button class="btn" data-a="jail">去國道塞車</button></div></div></div>`, (a) => this.answer(s, { o: a }));

      <p class="note">搭到別站會直接停在那一站。${p.fare ? '車資付給這一站的站主。' : ''}</p>${this.timerHTML()}
      <div class="opt-grid">${p.stations.map((id) => `<button class="opt" data-a="${id}">${esc(this.tname(id))}<small>${this.tileHint(id, s)}</small></button>`).join('')}</div>
      <div class="row"><button class="btn" data-a="no">不搭</button></div></div></div>`, (a) => this.answer(s, { to: a === 'no' ? -1 : +a }));

  G.p_raise = function (p, s) {
    const st = this.ws;
    const sel = new Set(p.plan);
    const draw = () => {
      const got = p.opts.filter((o) => sel.has(o.id)).reduce((a, o) => a + o.v, 0);
      this.sheet(`<div class="panel"><div class="hd" style="--hc:#e8322b">現金不夠！要抵押地籌錢<span class="who">還差 ${M(p.need)}</span></div><div class="bd">

        <div class="pick-lots">${p.opts.map((o) => { const t = mapOf(st).tiles[o.id]; return `<button class="opt${sel.has(o.id) ? ' on' : ''}" data-a="${o.id}" style="--dc:${mapOf(st).DIST[t.d].color}">${esc(t.n)} <small>+${M(o.v)}</small></button>`; }).join('')}</div>
        <p>已選：<b class="num">${M(got)}</b>／需要 ${M(p.need)}</p>${this.timerHTML()}
        <div class="row"><button class="btn y lg" data-a="ok" ${got >= p.need ? '' : 'disabled'}>確認抵押</button><button class="btn" data-a="auto">照建議</button></div></div></div>`, (a) => {
        if (a === 'ok') return this.answer(s, { lots: [...sel] });
        if (a === 'auto') return this.answer(s, { lots: p.plan });
        const id = +a; if (sel.has(id)) sel.delete(id); else sel.add(id); draw();

      this.shownKey = p.id + ':' + s;

    draw();

  G.p_hot = function (p, s) {

      <p class="note">熱點地段的租金 ×1.5（文創區 ×1.8）。現在熱點：${st.hot ? esc(distName(st, st.hot)) : '沒有'}</p>${this.timerHTML()}
      <div class="opt-grid">${p.dists.map((d) => { const mine = (mapOf(st).lotsOf[d] || []).filter((id) => st.lots[id].o === s).length; return `<button class="opt${st.hot === d ? ' on' : ''}" data-a="${d}" style="border-left:.4em solid ${mapOf(st).DIST[d].color}">${esc(distName(st, d))}<small>你有 ${mine} 塊</small></button>`; }).join('')}</div>
      ${p.cash ? `<div class="row"><button class="btn y" data-a="cash">不動熱點，領 ${M(p.cash)} 便當錢</button></div>` : ''}</div></div>`, (a) => this.answer(s, a === 'cash' ? { cash: true } : { d: a }), true);
  };

  // ---------- 加蓋（擲骰前） ----------
  G.buildFlow = function (pr) {
    const st = this.ws; const s = pr.s;
    const names = ['空地', '小店', '透天厝', '大樓', '地標'];
    const rows = pr.build.map((id) => {
      const L = st.lots[id]; const t = mapOf(st).tiles[id];
      const cost = E.buildCost(st, s, id, L.lv + 1);
      return `<button class="opt" data-a="${id}" style="border-left:.4em solid ${mapOf(st).DIST[t.d].color};text-align:left">${esc(t.n)}<small>${names[L.lv]} → ${L.lv + 1 === 4 ? '地標' : names[L.lv + 1]}・${M(cost)}</small></button>`;
    }).join('');
    this.board.highlight({ seat: s, items: pr.build.map((id) => ({ tile: id, label: names[st.lots[id].lv + 1], col: '#7bd389' })) });
    this.pickTile = (tile) => { if (pr.build.includes(tile)) { pick(tile); return true; } return false; };
    const pick = (id) => {
      const L = st.lots[id];
      if (L.lv + 1 === 3) {
        this.sheet(`<div class="panel"><div class="hd" style="--hc:#1fa463">${esc(this.tname(id))}：蓋大樓還是開名店？</div><div class="bd"><div class="opt-grid">
          <button class="opt" data-a="tower">大樓<small>租金正常，被收購要多付 0.3 倍</small></button><button class="opt" data-a="shop">名店<small>租金 75 折，別人路過都要付過路費</small></button></div>
          <div class="row"><button class="btn" data-a="back">返回</button></div></div></div>`, (a) => { if (a === 'back') return this.buildFlow(pr); this.answer(s, { a: 'build', tile: id, br: a }); });
      } else this.answer(s, { a: 'build', tile: id });
    };
    this.sheet(`<div class="panel"><div class="hd" style="--hc:#1fa463">加蓋一層（每回合一次）</div><div class="bd"><p class="note">選一塊你的地升級，點地圖上的綠框也可以。</p>
      <div class="opt-grid">${rows}</div><div class="row"><button class="btn" data-a="cancel">先不要</button></div></div></div>`, (a) => {
      if (a === 'cancel') { this.clearSheet(); this.showPrompt(true); return; }
      pick(+a);
    });
  };

  // ---------- 出主動卡 ----------
  G.useCardFlow = function (s, k) {
    const st = this.ws; const c = CARDS[k];
    const others = st.players.filter((p) => !p.ghost && p.id !== s).map((p) => p.id);
    const send = (extra) => this.answer(s, Object.assign({ a: 'card', card: k }, extra || {}));
    const back = () => { this.clearSheet(); this.showPrompt(true); };
    const lotPick = (title, ids, cb) => {
      if (!ids.length) { this.toast('現在沒有可以選的地'); return back(); }
      this.board.highlight({ seat: s, items: ids.map((id) => ({ tile: id, label: this.tname(id), col: '#ff4fa3' })) });
      this.pickTile = (tile) => { if (ids.includes(tile)) { cb(tile); return true; } return false; };
      this.sheet(`<div class="panel"><div class="hd" style="--hc:#d96a0c">「${c.name}」${esc(title)}</div><div class="bd"><p class="note">點地圖上發亮的地，或從下面選。</p>
        <div class="pick-lots">${ids.map((id) => { const t = mapOf(st).tiles[id]; const L = st.lots[id]; return `<button class="opt" data-a="${id}" style="--dc:${mapOf(st).DIST[t.d].color}">${esc(t.n)} <small>${L.o >= 0 && L.o !== s ? esc(this.pname(L.o)) + '・' : ''}Lv${L.lv}・租 ${M(E.rentOf(st, id))}</small></button>`; }).join('')}</div>
        <div class="row"><button class="btn" data-a="cancel">取消</button></div></div></div>`, (a) => { if (a === 'cancel') return back(); cb(+a); });
    };
    switch (k) {
      case 'dice': {
        const pos = st.players[s].pos;
        const rows = [];
        for (let n = 2; n <= 12; n++) { const r = E.routes(st, pos, n); rows.push(`<button class="opt" data-a="${n}"><span class="num" style="font-size:1.3em">${n}</span><small>${r.map((x) => esc(this.tname(x.to))).join(' / ')}</small></button>`); }
        this.sheet(`<div class="panel"><div class="hd" style="--hc:#d96a0c">喬骰子：要擲幾點？</div><div class="bd"><div class="opt-grid">${rows.join('')}</div><div class="row"><button class="btn" data-a="cancel">取消</button></div></div></div>`, (a) => { if (a === 'cancel') return back(); send({ n: +a }); });
        return;
      }
      case 'stay': case 'redpacket': case 'equal':
        this.sheet(`<div class="panel"><div class="hd" style="--hc:#d96a0c">使用「${c.name}」？</div><div class="bd"><p>${esc(c.text)}</p><div class="row"><button class="btn y" data-a="ok">使用</button><button class="btn" data-a="cancel">取消</button></div></div></div>`, (a) => (a === 'ok' ? send() : back()));
        return;
      case 'report': case 'turtle':
        this.pickPlayer('「' + c.name + '」要對誰用？', others, (t) => send({ target: t }), back);
        return;
      case 'renew': {
        const ids = E.ownedLots(st, s).filter((id) => mapOf(st).tiles[id].k === 'lot' && !st.lots[id].m && st.lots[id].lv < 3);
        lotPick('要升級哪一塊？', ids, (id) => {
          if (st.lots[id].lv + 1 === 3) this.sheet(`<div class="panel"><div class="hd" style="--hc:#d96a0c">蓋大樓還是開名店？</div><div class="bd"><div class="opt-grid"><button class="opt" data-a="tower">大樓</button><button class="opt" data-a="shop">名店</button></div></div></div>`, (b) => send({ tile: id, br: b }));
          else send({ tile: id });
        });
        return;
      }
      case 'seize': lotPick('要查封哪一塊？', Object.keys(st.lots).map(Number).filter((id) => st.lots[id].o >= 0 && st.lots[id].o !== s), (id) => send({ tile: id })); return;
      case 'excavator': lotPick('要拆哪一塊？', Object.keys(st.lots).map(Number).filter((id) => { const L = st.lots[id]; return L.o >= 0 && L.o !== s && L.lv > 0 && L.lv < 4 && mapOf(st).tiles[id].d !== 'old'; }), (id) => send({ tile: id })); return;
      case 'swap': {
        const mine = E.ownedLots(st, s).filter((id) => st.lots[id].lv < 4);
        lotPick('先選你要換出去的地', mine, (a) => {
          const theirs = Object.keys(st.lots).map(Number).filter((id) => st.lots[id].o >= 0 && st.lots[id].o !== s && st.lots[id].lv < 4);
          lotPick('要換到誰的哪一塊？', theirs, (b) => send({ mine: a, tile: b }));
        });
        return;
      }
      case 'cone': {
        const set = new Set();
        for (const o of st.players) {
          if (o.ghost || o.id === s) continue;
          for (let n = 2; n <= 9; n++) for (const r of E.routes(st, o.pos, n)) for (const id of r.path) set.add(id);
        }
        const ok = [...set].filter((id) => id !== mapOf(st).start && st.cones[id] == null && !st.players.some((x) => x.pos === id && !x.ghost) && E.tileOpen(st, id));
        lotPick('要放在哪一格？（對手前面的路）', ok.slice(0, 40), (id) => send({ tile: id }));
        return;
      }
      default: back();
    }
  };

  // ---------- 交易邀請（別人提給我的） ----------
  G.showTrades = function () {
    const st = this.ws; if (!st) return;
    const offer = (st.side || []).find((t) => this.client.mine(t.to));

  // ---------- 側邊面板 ----------
  G.win = function (title, body, foot, color) {

    scr.addEventListener('click', (e) => { if (e.target === scr) close(); });
    const close = () => { scr.remove(); if (this.logPanel && scr._log) this.logPanel = null; };
    scr.querySelector('[data-a="close"]').onclick = () => { SFX.play('click'); close(); };
    this.root.appendChild(scr);
    return { el: scr, close };
  };

  G.panel = function (k) {
    if (!this.ws) return;
    if (k === 'assets') return this.assetsPanel();
    if (k === 'trade') return this.tradePanel();
    if (k === 'chat') return this.chatPanel();
    if (k === 'log') {
      const w = this.win(TL('list') + ' 紀錄', '<div class="log"></div>');

      const fill = () => { const l = w.el.querySelector('.log'); if (l) l.innerHTML = this.logList.slice().reverse().map((x) => '<div>' + x + '</div>').join('') || '<div>還沒有紀錄</div>'; };
      this.logPanel = fill; fill();
      return;
    }
    if (k === 'menu') return this.menuPanel();
  };

  G.assetsPanel = function () {
    const st = this.ws; const s = this.viewer();
    if (s < 0) return;
    const p = st.players[s];
    const ids = E.ownedLots(st, s);
    const names = ['空地', '小店', '透天厝', '大樓', '地標'];
    const draw = () => {
      const rows = ids.map((id) => {
        const t = mapOf(st).tiles[id]; const L = st.lots[id];
        const act = L.m ? `<button class="btn sm g" data-a="r${id}" ${p.cash >= E.redeemCost(st, id) ? '' : 'disabled'}>贖回 ${M(E.redeemCost(st, id))}</button>` : `<button class="btn sm" data-a="m${id}">抵押 +${M(Math.round(E.lotValue(st, id) * HY.rules.MORT / 10) * 10)}</button>`;

      }).join('');
      w.el.querySelector('.bd').innerHTML = `<dl class="kv"><dt>現金</dt><dd class="num">${M(p.cash)}</dd><dt>身價</dt><dd class="num">${M(E.worth(st, s))}</dd><dt>地產</dt><dd>${ids.length} 塊</dd></dl>
        <div class="lots">${rows || '<p class="note">還沒有地。</p>'}</div><p class="note">抵押拿地價一半，抵押中收不到租金；贖回要多付一點利息。</p>`;
    };

    w.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]'); if (!b || b.dataset.a === 'close') return;

  G.tradePanel = function () {
    const st = this.ws; const me = this.viewer();
    if (me < 0 || st.players[me].ghost) { this.toast('冤魂不能交易'); return; }
    const others = st.players.filter((p) => !p.ghost && p.id !== me);
    if (!others.length) return;
    let to = others[0].id;
    const give = { cash: 0, lots: new Set(), cards: [] }; const get = { cash: 0, lots: new Set(), cards: [] };
    const w = this.win(TL('trade') + ' 提出交易', '', '<button class="btn" data-a="cancel">取消</button><button class="btn y" data-a="send">送出提案</button>', '#1fa463');
    const lotsBtns = (owner, set) => E.ownedLots(st, owner).filter((id) => st.lots[id].lv < 4 || true).map((id) => { const t = mapOf(st).tiles[id]; return `<button class="opt${set.has(id) ? ' on' : ''}" data-l="${owner}:${id}" style="--dc:${mapOf(st).DIST[t.d].color}">${esc(t.n)}<small> Lv${st.lots[id].lv}</small></button>`; }).join('') || '<span class="note">沒有地</span>';
    const draw = () => {
      w.el.querySelector('.bd').innerHTML = `<div class="opt-grid">${others.map((p) => `<button class="opt${p.id === to ? ' on' : ''}" data-to="${p.id}" style="border-color:${CH[p.char].color}">${esc(p.name)}</button>`).join('')}</div>
        <div class="trade-cols"><div><div class="sec-title">你給</div><div class="cashin"><span>現金</span><input type="number" id="tg" min="0" step="10" value="${give.cash}"><span>萬</span></div><div class="pick-lots">${lotsBtns(me, give.lots)}</div></div>
        <div><div class="sec-title">你要</div><div class="cashin"><span>現金</span><input type="number" id="tr" min="0" step="10" value="${get.cash}"><span>萬</span></div><div class="pick-lots">${lotsBtns(to, get.lots)}</div></div></div>
        <p class="note">對方有 30 秒可以考慮。電腦玩家會看划不划算決定。</p>`;
    };
    draw();
    w.el.addEventListener('input', (e) => { if (e.target.id === 'tg') give.cash = Math.max(0, Math.round((+e.target.value || 0) / 10) * 10); if (e.target.id === 'tr') get.cash = Math.max(0, Math.round((+e.target.value || 0) / 10) * 10); });
    w.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-to],[data-l],[data-a]'); if (!b) return;
      if (b.dataset.a === 'close') return;
      SFX.play('click');
      if (b.dataset.to) { to = +b.dataset.to; get.lots.clear(); draw(); return; }
      if (b.dataset.l) { const [o, id] = b.dataset.l.split(':').map(Number); const set = o === me ? give.lots : get.lots; if (set.has(id)) set.delete(id); else set.add(id); draw(); return; }
      if (b.dataset.a === 'cancel') return w.close();
      if (b.dataset.a === 'send') {
        const r = this.client.trade(me, { to, give: { cash: give.cash, lots: [...give.lots], cards: [] }, get: { cash: get.cash, lots: [...get.lots], cards: [] } });
        if (r && r.ok === false) { this.toast({ busy: '你已經有一筆交易在等回覆', targetBusy: '對方正在考慮別的交易', bad: '交易內容不成立（錢不夠或地不是他的）' }[r.err] || '提案失敗'); return; }
        this.toast('提案送出，等對方回覆…');
        w.close();
      }
    });
  };

  G.chatPanel = function () {
    const st = this.ws; const me = this.viewer();

      ${online ? '<div class="sec-title">打字</div><div class="cashin"><input id="chatin" maxlength="40" placeholder="說點什麼（40 字內）" style="font-family:var(--font);font-size:1em"><button class="btn y sm" data-a="send">送出</button></div><div class="chatlog"></div>' : '<p class="note">語音嗆聲可以在選單裡開關。</p>'}`);
    const send = (text, kind) => { if (me < 0) return; this.client.chat(me, text, kind); };
    w.el.addEventListener('click', (e) => {
      const t = e.target.closest('[data-t]'); const em = e.target.closest('[data-e]'); const a = e.target.closest('[data-a="send"]');
      if (t) { send(TAUNTS[+t.dataset.t], { taunt: +t.dataset.t }); w.close(); }
      if (em) { send(em.dataset.e, { emoji: true }); w.close(); }

    });
    const inp = w.el.querySelector('#chatin');

  // 收到聊天／台詞
  G.onChat = function (s, text, meta) {

    this.chatList.push({ name: p.name, text, col: CH[p.char].color });

  G.menuPanel = function () {

      <div class="cashin"><span style="width:4em">音效</span><input type="range" id="vs" min="0" max="1" step="0.05" value="${v.sfx}"></div>

      <div class="sec-title">動畫速度</div>
      <div class="seg"><button class="opt${this.speed === 0.8 ? ' on' : ''}" data-sp="0.8">慢一點</button><button class="opt${this.speed === 1 ? ' on' : ''}" data-sp="1">正常</button><button class="opt${this.speed === 1.6 ? ' on' : ''}" data-sp="1.6">快轉</button></div>
      <div class="sec-title">鏡頭</div><p class="note">拖曳移動、滾輪或兩指縮放、兩指旋轉；鍵盤 Q／E 轉 45 度，空白鍵擲骰。</p>
      ${online ? `<div class="sec-title">連線</div><div class="opt-grid"><button class="opt${auto ? ' on' : ''}" data-a="auto">${auto ? '托管中（按這裡取消）' : '讓電腦幫我打'}</button></div>` : ''}
      <div class="row" style="display:flex;gap:.5em;flex-wrap:wrap"><button class="btn" data-a="rules">${TL('help')} 怎麼玩</button><button class="btn r" data-a="quit">離開這局</button></div>`);
    w.el.addEventListener('input', (e) => { if (e.target.id === 'vm') SFX.setVol('music', +e.target.value); if (e.target.id === 'vs') SFX.setVol('sfx', +e.target.value); });
    w.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a],[data-sp]'); if (!b || b.dataset.a === 'close') return;
      SFX.play('click');
      if (b.dataset.sp) { this.speed = +b.dataset.sp; try { localStorage.setItem('hy.speed', this.speed); } catch (er) { /* 沒關係 */ } w.el.querySelectorAll('[data-sp]').forEach((x) => x.classList.toggle('on', x === b)); return; }
      const a = b.dataset.a;
      if (a === 'snd') { SFX.setOn(!SFX.vol.on); b.classList.toggle('on', SFX.vol.on); b.textContent = SFX.vol.on ? '聲音：開' : '聲音：關'; }
      if (a === 'tts') { SFX.setSpeak(!SFX.speakOn); b.classList.toggle('on', SFX.speakOn); b.textContent = SFX.speakOn ? '語音嗆聲：開' : '語音嗆聲：關'; }

        b.outerHTML = '<span class="note">確定要離開？</span><button class="btn r" data-a="quit2">確定離開</button>';

  };
})();

// ===== src/ui/screens.js =====
// ===== 開場、開局設定、規則 =====
HY.ui = HY.ui || {};
HY.ui.screens = (function () {
  const SFX = HY.ui.sfx;
  const IC = HY.ui.icons;
  const esc = HY.ui.esc;
  const CH = HY.chars;
  const R = HY.rules;

  function tokenCanvas(c, size) {
    const ic = HY.ui.tokens.icon(c.token, c.color, size || 54, 2);
    const cv = document.createElement('canvas');
    if (ic) { cv.width = ic.width; cv.height = ic.height; cv.getContext('2d').drawImage(ic, 0, 0); }

  }

  // ---------- 開場：旋轉的城市模型 ----------
  function title(app, o) {
    const wrap = document.createElement('div');
    wrap.className = 'title-scene';
    wrap.style.cssText = 'position:absolute;inset:0';
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:absolute;inset:0';
    wrap.appendChild(cv);
    const b = new HY.ui.Board(cv);
    // 展示用的城市：蓋好一些房子
    const demo = HY.engine.newGame({ players: ['wei', 'chun', 'zha', 'cai'].map((c, i) => ({ name: 'P' + i, char: c, ai: true })), seed: 2026 });
    const lv = { 1: 4, 3: 2, 4: 3, 7: 1, 9: 2, 12: 3, 14: 1, 18: 2, 21: 3, 23: 4, 25: 2, 28: 3, 29: 2, 34: 4, 35: 3, 37: 3, 39: 2, 40: 3, 42: 2, 46: 3, 48: 2, 49: 4 };
    Object.keys(lv).forEach((id, i) => { demo.lots[id].o = i % 4; demo.lots[id].lv = lv[id]; if (lv[id] === 3 && i % 2) demo.lots[id].br = 'shop'; });
    demo.hot = 'night'; demo.cur = -1;
    demo.players.forEach((p, i) => { p.pos = [0, 5, 20, 33][i]; });
    const dark = o.night !== false;
    if (dark) demo.act = 3;
    b.setState(demo, true);
    b.padTop = 40; b.padBot = 40;
    const size = () => { b.resize(app.clientWidth, app.clientHeight, Math.min(2, window.devicePixelRatio || 1)); b.overview(true); b.v.cam.zoom *= app.clientWidth < 700 ? 1.25 : 1.05; b.v.update(); };
    size();
    let dead = false; let last = performance.now();
    const loop = (t) => { if (dead) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; b.v.cam.rot += dt * 0.06; b.v.update(); b.frame(dt); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    const ui = document.createElement('div');
    ui.id = 'title';
    ui.innerHTML = `<div class="logo"><div class="neon"><span>好野</span><span>人</span></div><div class="en">HOYA TYCOON</div><div class="tag">台灣派對大富翁・旺來市</div></div>
      <div class="menu">
        ${o.resume ? `<button class="btn g lg stack" data-a="resume"><span style="display:inline-flex;align-items:center;gap:0.4em">${IC.I.resume.replace('<svg', '<svg style="width:1.1em;height:1.1em"')} 繼續上一局</span><span class="sub">第 ${o.resume.round} / ${o.resume.rounds} 輪・${o.resume.n} 位玩家</span></button>` : ''}
        <button class="btn ${o.resume ? 'ghost' : 'y'} lg" data-a="local">${IC.I.dice.replace('<svg', '<svg style="width:1.3em;height:1.3em"')} ${o.resume ? '開新的一局' : '開始遊戲'}</button>
        ${o.online ? `<button class="btn p lg" data-a="online">${IC.I.users.replace('<svg', '<svg style="width:1.3em;height:1.3em"')} 好友連線</button>` : ''}
        <button class="btn ghost" data-a="rules">${IC.I.help.replace('<svg', '<svg style="width:1.2em;height:1.2em"')} 怎麼玩</button>
      </div>
      <div class="foot">${o.foot || '2～6 人・電腦補位・一局約 30～75 分鐘'}</div>`;
    wrap.appendChild(ui);
    app.appendChild(wrap);
    const onR = () => size();
    window.addEventListener('resize', onR);
    ui.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-a]'); if (!btn) return;
      SFX.unlock(); SFX.play('click');
      if (!SFX.ready) return;
      SFX.playMusic('lobby');
      const a = btn.dataset.a;
      if (a === 'rules') return rules(app);

  // ---------- 開局設定 ----------
  function setup(app, o) {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('hy.setup') || 'null'); } catch (e) { saved = null; }
    const list = CH.LIST;
    const st = saved && saved.seats && saved.seats.length >= 2 ? saved : {
      seats: [{ char: 'wei', name: '我', ai: false }, { char: 'chun', name: '林阿春', ai: true }, { char: 'zha', name: '蔡阿炸', ai: true }, { char: 'cai', name: '阿財', ai: true }],
      intensity: 'standard', length: 'standard',
    };
    const scr = document.createElement('div'); scr.className = 'screen solid';
    const free = () => list.filter((c) => !st.seats.some((s) => s.char === c.id));
    const draw = () => {
      const n = st.seats.length;
      const rounds = HY.engine.roundsFor(st.length, n);
      scr.innerHTML = `<div class="win" style="width:min(52em,100%)"><div class="hd" style="--hc:var(--red)">開一局 好野人<button class="btn sm ghost x" data-a="back">${IC.I.close.replace('<svg', '<svg style="width:1em;height:1em"')}</button></div><div class="bd">
        <div class="sec-title">玩家（${n} 人，點頭像換角色）</div>
        <div class="seats">${st.seats.map((s, i) => { const c = CH.byId[s.char]; return `<div class="seat${!s.ai ? ' me' : ''}" style="--pc:${c.color}">
          ${n > 2 ? `<button class="btn sm ghost rm" data-a="rm${i}" title="移除">${IC.I.close.replace('<svg', '<svg style="width:.9em;height:.9em"')}</button>` : ''}
          <div class="who"><span class="ava" data-a="ch${i}"></span><span><b>${esc(c.name)}</b><br><small style="color:var(--muted)">${esc(c.title)}</small></span></div>
          <input id="nm${i}" maxlength="8" value="${esc(s.name)}" aria-label="名字">
          <div class="ctl"><button class="btn sm ${s.ai ? '' : 'y'}" data-a="hu${i}">${IC.I.person.replace('<svg', '<svg style="width:1em;height:1em"')} 真人</button><button class="btn sm ${s.ai ? 'c' : ''}" data-a="ai${i}">${IC.I.bot.replace('<svg', '<svg style="width:1em;height:1em"')} 電腦</button></div>
          <div class="trait"><b>${esc(c.traitName)}</b>：${esc(c.traitText)}</div></div>`; }).join('')}
          ${n < 6 ? '<button class="seat" data-a="add" style="align-items:center;justify-content:center;cursor:pointer;border:2px dashed rgba(255,255,255,.18);color:var(--muted);font-weight:900;font-size:1.1em;min-height:8em">＋ 加一位</button>' : ''}</div>
        <p class="note">好幾個真人可以輪流用同一台裝置玩；要各自用手機連線，請回大廳選「好友連線」。</p>
        <div class="sec-title">整人強度</div>
        <div class="seg">${['friendly', 'standard', 'chaos'].map((k) => `<button class="opt${st.intensity === k ? ' on' : ''}" data-i="${k}">${R.INT_NAME[k]}<small>${{ friendly: '整人卡只出溫和的，死守不用付錢', standard: '大部分整人卡都會出現', chaos: '均富、換地全開，收購更便宜' }[k]}</small></button>`).join('')}</div>
        <div class="sec-title">局長</div>
        <div class="seg">${['quick', 'standard', 'long'].map((k) => `<button class="opt${st.length === k ? ' on' : ''}" data-l="${k}">${R.LEN_NAME[k]}<small>${HY.engine.roundsFor(k, n)} 輪・約 ${R.LEN_MIN[k]} 分鐘</small></button>`).join('')}</div>
      </div><div class="ft"><button class="btn" data-a="back">返回</button><button class="btn y lg" data-a="go">開始！（${rounds} 輪）</button></div></div>`;
      scr.querySelectorAll('.seat .ava').forEach((a, i) => a.appendChild(tokenCanvas(CH.byId[st.seats[i].char], 48)));
    };
    const pickChar = (i) => {
      const cur = st.seats[i].char;
      const opts = list.filter((c) => c.id === cur || !st.seats.some((s) => s.char === c.id));
      const pop = document.createElement('div'); pop.className = 'screen';
      pop.innerHTML = `<div class="win"><div class="hd">選角色</div><div class="bd"><div class="char-pick">${opts.map((c) => `<button class="opt${c.id === cur ? ' on' : ''}" data-c="${c.id}" style="border-color:${c.color}"><span class="cv"></span><b>${esc(c.name)}</b><span class="t">${esc(c.title)}・${esc(c.traitName)}<br>${esc(c.traitText)}</span></button>`).join('')}</div></div></div>`;
      pop.querySelectorAll('[data-c]').forEach((b) => b.querySelector('.cv').appendChild(tokenCanvas(CH.byId[b.dataset.c], 54)));
      pop.addEventListener('click', (e) => {
        const b = e.target.closest('[data-c]');
        if (b) { SFX.play('pop'); const s = st.seats[i]; const old = CH.byId[s.char]; s.char = b.dataset.c; if (s.ai || s.name === old.name) s.name = s.ai ? CH.byId[s.char].name : s.name; draw(); }
        pop.remove();
      });
      scr.appendChild(pop);
    };
    draw();
    scr.addEventListener('input', (e) => { const m = /^nm(\d)$/.exec(e.target.id || ''); if (m) st.seats[+m[1]].name = e.target.value.slice(0, 8); });
    scr.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a],[data-i],[data-l]'); if (!b) return;
      SFX.play('click');
      if (b.dataset.i) { st.intensity = b.dataset.i; return draw(); }
      if (b.dataset.l) { st.length = b.dataset.l; return draw(); }
      const a = b.dataset.a;
      if (a === 'back') { scr.remove(); o.onBack && o.onBack(); return; }
      if (a === 'add') { const c = free()[0]; if (c) st.seats.push({ char: c.id, name: c.name, ai: true }); return draw(); }
      let m;
      if ((m = /^rm(\d)$/.exec(a))) { st.seats.splice(+m[1], 1); return draw(); }
      if ((m = /^ch(\d)$/.exec(a))) return pickChar(+m[1]);
      if ((m = /^hu(\d)$/.exec(a))) { const s = st.seats[+m[1]]; s.ai = false; if (s.name === CH.byId[s.char].name) s.name = '玩家' + (+m[1] + 1); return draw(); }
      if ((m = /^ai(\d)$/.exec(a))) { const s = st.seats[+m[1]]; s.ai = true; s.name = CH.byId[s.char].name; return draw(); }
      if (a === 'go') {
        st.seats.forEach((s) => { s.name = (s.name || '').trim() || CH.byId[s.char].name; });
        if (!st.seats.some((s) => !s.ai)) st.seats[0].ai = false;
        try { localStorage.setItem('hy.setup', JSON.stringify(st)); } catch (er) { /* 存不了沒關係 */ }
        scr.remove();
        o.onStart({ players: st.seats.map((s) => ({ name: s.name, char: s.char, ai: s.ai })), intensity: st.intensity, length: st.length });
      }
    });
    app.appendChild(scr);
    return scr;
  }

  // ---------- 規則 ----------
  function rules(root) {
    const scr = document.createElement('div'); scr.className = 'screen';
    const card = (c, h, p) => `<div class="r" style="--rc:${c}"><h4><i>${h[0]}</i>${h}</h4><p>${p}</p></div>`;
    scr.innerHTML = `<div class="win" style="width:min(58em,100%)"><div class="hd" style="--hc:var(--red)">怎麼玩 好野人<button class="btn sm ghost x" data-a="close">${IC.I.close.replace('<svg', '<svg style="width:1em;height:1em"')}</button></div><div class="bd">
      <p>擲骰子在旺來市繞，買地、蓋房、收租。回合數到了，<b>身價最高</b>的人就是好野人。身價＝現金＋所有地的價值。</p>
      <div class="rules">
        ${card('#e8322b', '買地收租', '停到空地可以買，不買就全員暗標拍賣。停到別人的地要付租金；收齊同一區租金加成，還能蓋地標。')}
        ${card('#1fa463', '加蓋', '每回合擲骰前可以把任一塊自己的地升一級；停在自己的地上還能再升一次。第三級選「大樓」或「名店」（別人路過都要付錢）。')}
        ${card('#ff4fa3', '插嘴卡', '別人擲完骰、付租金、買地的時候，手上有對應的卡就會跳出來問你要不要「插嘴」：免租、嫁禍、漲租、抽成、搶標、攔路、反彈。')}
        ${card('#d96a0c', '主動卡', '自己回合擲骰前用：喬骰子、怪手拆房、查封、烏龜、檢舉、三角錐、都更、紅包…便利商店和夾娃娃機都買得到。')}
        ${card('#e8322b', '強制收購', '付完租金後，可以出 1.5 倍價錢收購那塊地。地主可以賣，也可以付一筆錢「死守」當釘子戶。老街和地標不能被收購。')}
        ${card('#2f6b4a', '里民大會', '停到活動中心或遇到選舉，全員同時投票，可以花錢買票。蓋焚化爐在哪、誰最機車、普發現金……結果會改變地價。')}
        ${card('#1e66c8', '岔路與捷運', '路上有捷徑和十字路口，經過岔路要選路。第二幕新城大道通車，重劃區開賣。停在捷運站可以搭到別站。')}
        ${card('#b03cff', '三幕', '第一幕開發、第二幕爭奪、第三幕決戰。每一季會播季度新聞：颱風、打房、米其林夜市……第三幕城市變夜景，租金全面上漲。')}
        ${card('#4c1d95', '破產變冤魂', '付不出錢會先抵押地，還不夠就破產。破產的人變冤魂，繼續飄、繼續鬧鬼、繼續出整人卡。')}
        ${card('#ffd23f', '打卡熱點', '熱點所在的地段租金 ×1.5。停在市政府、某些事件和投票會移動熱點。')}
      </div>
      <p class="note">交易隨時都能提：從右上角的「交易」選對象，拿現金、地互換。冤魂不能交易。</p>
    </div></div>`;
    scr.addEventListener('click', (e) => { if (e.target === scr || e.target.closest('[data-a="close"]')) { SFX.play('click'); scr.remove(); } });
    root.appendChild(scr);
  }

  return { title, setup, rules, tokenCanvas };
})();

// ===== src/ui/local.js =====
// ===== 單機：同一台裝置上的牌局（真人輪流＋電腦） =====
// 牌局隨時自動存在這台裝置上：不小心關掉、手機把分頁收掉，回來按「繼續上一局」就接得回去。
HY.ui = HY.ui || {};
HY.ui.LocalClient = (function () {
  const E = HY.engine;
  const KEY = 'hy.local';
  const SAVE_V = 1;

  function valid(o) {
    try {
      if (!o || o.sv !== SAVE_V || !o.cfg || !o.st) return false;
      const st = o.st;
      if (st.v !== 1 || st.over || !HY.maps[st.map] || !Array.isArray(st.players)) return false;
      if (st.players.length < 2 || st.players.length > 6 || !st.prompt) return false;
      if (!Array.isArray(o.cfg.players) || o.cfg.players.length !== st.players.length) return false;
      return st.players.every((p) => HY.chars.byId[p.char]);
    } catch (e) { return false; }
  }

  class LocalClient {
    constructor(cfg, saved) {
      this.cfg = cfg;
      if (saved) {
        this.st = saved;
        this.st.side = [];     // 存檔前還沒談完的交易作廢
        this.st.ev = [];
        this.resumed = true;
      } else this.st = E.newGame({ players: cfg.players, intensity: cfg.intensity, length: cfg.length });
      this.humans = new Set(cfg.players.map((p, i) => (p.ai ? -1 : i)).filter((i) => i >= 0));
      this.cbs = [];
      this.ui = null;
      this.outN = 0;
      this.saveT = null;
      this.stopped = false;
      const io = {
        now: () => Date.now(),
        setTimeout: (f, ms) => setTimeout(f, ms),
        clearTimeout: (t) => clearTimeout(t),
        out: (evs) => { this.outN++; this.emit(evs); },
        human: (s) => this.humans.has(s),
        say: (s, text, meta) => { if (this.ui) this.ui.onChat(s, text, Object.assign({ line: true }, meta)); },
      };
      this.host = new HY.Host(this.st, io, { mode: 'ack', timers: false, think: [380, 820] });
    }
    on(cb) { this.cbs.push(cb); }
    start() { this.host.flush(); }
    snap() { const v = {}; for (const k of Object.keys(this.st)) if (k !== 'q' && k !== 'ev' && k !== 'rng') v[k] = this.st[k]; return HY.util.clone(v); }
    emit(evs) { const s = this.snap(); for (const cb of this.cbs) cb({ evs, st: s }); this.autosave(); }
    mine(s) { return this.humans.has(s); }
    humansHere() { return this.humans.size; }
    label(s) { return this.humans.has(s) ? (this.humans.size > 1 ? '' : '你') : '電腦'; }
    act(s, a, pid) {
      const n = this.outN;
      const r = this.host.answer(s, a, pid);
      if (r.ok && this.outN === n) this.emit([]);
      return r;
    }
    trade(s, offer) { const n = this.outN; const r = this.host.trade(s, offer); if (r.ok && this.outN === n) this.emit([]); return r; }
    replyTrade(s, id, yes) { const n = this.outN; const r = this.host.replyTrade(s, id, yes); if (this.outN === n) this.emit([]); return r; }
    manage(s, a) { const n = this.outN; const r = this.host.manage(s, a); if (this.outN === n) this.emit([]); return r; }
    chat(s, text, meta) { if (this.ui) this.ui.onChat(s, text, meta || {}); }
    release() { this.host.release(); }
    deadline() { return 0; }

    // ---------- 自動存檔 ----------
    data() { return { sv: SAVE_V, v: HY.version, at: Date.now(), cfg: this.cfg, st: HY.util.clone(this.st) }; }
    autosave() { if (this.stopped || this.saveT) return; this.saveT = setTimeout(() => { this.saveT = null; this.saveNow(); }, 700); }
    saveNow() {
      if (this.saveT) { clearTimeout(this.saveT); this.saveT = null; }
      try {
        if (this.st.over) localStorage.removeItem(KEY);
        else localStorage.setItem(KEY, JSON.stringify(this.data()));
      } catch (e) { /* 存不了就算了，照樣能玩 */ }
    }
    stop() { if (!this.stopped) { this.saveNow(); this.stopped = true; } this.host.stop(); }
  }

  // 這台裝置上有沒有沒打完的牌局
  LocalClient.saved = function () {
    let o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { o = null; }
    return valid(o) ? o : null;
  };
  LocalClient.clearSaved = function () { try { localStorage.removeItem(KEY); } catch (e) { /* 沒關係 */ } };
  LocalClient.valid = valid;
  return LocalClient;
})();

// ===== src/ui/main.js =====
// ===== 啟動 =====
(function () {
  const app = document.getElementById('app');
  const SFX = HY.ui.sfx;
  const S = HY.ui.screens;
  const LC = HY.ui.LocalClient;
  const MUSIC = ['lobby', 'act1', 'act2', 'act3'];
  let game = null; let client = null; let title = null;
  HY.cfg = HY.cfg || {};

  function clearAll() {
    if (game) { game.destroy(); game = null; }
    if (client) { if (client.stop) client.stop(); client = null; }
    if (title) { title.close(); title = null; }
    app.querySelectorAll('.screen').forEach((x) => x.remove());
  }
  function home() {
    clearAll();
    SFX.playMusic('lobby');
    showTitle();
  }
  function showTitle() {
    const sv = LC.saved();
    title = S.title(app, {
      online: !!HY.cfg.online,
      resume: sv ? { round: sv.st.round, rounds: sv.st.cfg.rounds, n: sv.st.players.length } : null,
      onResume: () => { const s = LC.saved(); if (s) resumeLocal(s); else home(); },
      onLocal: () => S.setup(app, { onStart: startLocal }),
      onOnline: () => HY.net && HY.net.lobby(app, { onEnter: startOnline, onBack: () => {} }),
    });
  }
  function startLocal(cfg, saved) {
    clearAll();
    client = new LC(cfg, saved || null);
    game = new HY.ui.Game(app, client, { onHome: home, onAgain: () => startLocal(cfg) });
    client.ui = game;
    client.start();
  }
  // 接續存起來的牌局（壞掉的存檔就丟掉，回大廳）
  function resumeLocal(sv) {
    try {
      startLocal(sv.cfg, sv.st);
      SFX.playMusic(MUSIC[sv.st.act] || 'act1');
      if (game) game.toast('接續上一局・第 ' + sv.st.round + ' / ' + sv.st.cfg.rounds + ' 輪', 3200);
      return true;
    } catch (e) {
      if (window.console) console.error(e);
      LC.clearSaved();
      home();
      return false;
    }
  }
  // 連線房間開局（net.js 會呼叫）
  function startOnline(netClient) {
    if (title) { title.close(); title = null; }
    if (game) { game.destroy(); game = null; }
    client = netClient;
    game = new HY.ui.Game(app, client, { onHome: () => { if (client && client.leave) client.leave(); home(); } });
    client.ui = game;
    if (client.ready) client.ready();
    return game;
  }
  // 頁面更新時帶著走的牌局（只有單機牌局需要）
  function snapshot() {
    if (client && client instanceof LC && !client.st.over && !client.stopped) return { local: client.data() };
    return {};
  }
  HY.app = { home, startLocal, resumeLocal, startOnline, snapshot, get game() { return game; } };

  // 分頁被收起來或關掉之前，先存一次
  const flushSave = () => { if (client && client instanceof LC && !client.stopped) client.saveNow(); };
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

  const boot = (data) => {
    if (HY.ui.assets) HY.ui.assets.load();
    const carried = data && data.local && LC.valid(data.local) ? data.local : null;
    if (HY.net && HY.net.probe) HY.net.probe().then((ok) => { HY.cfg.online = ok; if (!game && !app.querySelector('.screen')) { if (title) title.close(); showTitle(); if (HY.net.autoJoin) HY.net.autoJoin(app); } });
    if (carried && resumeLocal(carried)) return;
    showTitle();
  };
  const whenFonts = (data) => {
    if (document.fonts && document.fonts.ready) {
      let done = false;
      const go = () => { if (!done) { done = true; boot(data); } };
      document.fonts.ready.then(go);
      setTimeout(go, 1200);
    } else boot(data);
  };

  // 在 Claude 裡打開時：頁面更新也接得回正在玩的牌局
  const hot = (window.claude && window.claude.hot) || null;
  let started = false;
  const start = (data) => { if (started) return; started = true; whenFonts(data || {}); };
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => snapshot()); } catch (e) { /* 沒有也沒關係 */ } }
  if (hot && typeof hot.ready === 'function') {
    try { hot.ready(start); } catch (e) { start(hot.data || {}); }
    setTimeout(() => start((hot && hot.data) || {}), 2500);
  } else start((hot && hot.data) || {});
})();

</script>
