function startDay(first){
  const st=S.st;
  st.energy = DAY_ENERGY + (first && hasRelic('thermos') ? 1 : 0) + (st.day>=5 && hasRelic('incense') ? 1 : 0);
  st.pressure=false; st.freeConf=false; st.laptopUsed=false; st.seal=false; st.media=false; st.tail=null;
  const ready = st.labs.filter(l=>l.ready<=st.day);
  st.labs = st.labs.filter(l=>l.ready>st.day);
  const labNews = [];
  for(const l of ready){ const lc = labClueOf(l.obj); if(lc && !st.found[lc.id]){ markFound(lc.id); labNews.push(lc.id); } }
  draw(HAND + (hasRelic('notebook')?1:0));
  return labNews;
}
function draw(n){
  const st=S.st;
  const got=[];
  for(let i=0;i<n;i++){
    if(!st.draw.length){ if(!st.discard.length) break; st.draw = rshuffle(st.discard); st.discard=[]; }
    const u = st.draw.shift(); st.hand.push(u); got.push(u);
  }
  return got;
}
const cardByUid = uid => S.run.deck.find(c=>c.uid===uid);

// ---------- 紅線卷宗 ----------
function grantFrag(id, inCase){
  const run=S.run; if(!run || run.mode!=='campaign') return false;
  run.frags = run.frags || {};
  if(run.frags[id]) return false;
  run.frags[id] = {inCase:!!inCase, at:run.caseIdx};
  return true;
}
function fragsOwned(){ const run=S.run; return FRAG_ORDER.filter(id=>run && run.frags && run.frags[id]); }

// ---------- 線索 ----------
function markFound(id, silent){
  const st=S.st; if(st.found[id]) return false;
  st.found[id]=true; st.foundOrder.push(id); if(!silent) st.fresh[id]=true;
  const c = S.cs.clues[id];
  if(c && c.frag && S.run.mode==='campaign'){
    if(grantFrag(c.frag, true)){ st.fragFound.push(c.frag); healCred(2); }
  }
  return true;
}
function markHeard(id){
  const st=S.st; if(st.heard[id]) return false;
  st.heard[id]=true; st.heardOrder.push(id); st.fresh[id]=true; return true;
}
function labClueOf(obj){ return Object.values(S.cs.clues).find(c=>c.labOf===obj); }
function isHidden(c){ return c.unlock||c.searchOnly||c.shoujing||c.src==='LAB'||c.src==='BRIEF'; }

function availableAt(src, cat){
  const cs=S.cs, st=S.st, out=[];
  for(const c of Object.values(cs.clues)){
    if(c.src!==src || st.found[c.id] || st.gone[c.id] || isHidden(c)) continue;
    if(c.cat==='民俗') continue;
    if(cat && c.cat!==cat) continue;
    out.push({t:'clue',id:c.id,ord:c.ord});
  }
  if(cs.sus[src] && (!cat || cat==='訊問')){
    for(const s of Object.values(cs.stmts)){
      if(s.who!==src || st.heard[s.id] || s.auto) continue;
      if(s.gate && s.gate.clue && !st.found[s.gate.clue]) continue;
      out.push({t:'stmt',id:s.id,ord:s.ord});
    }
  }
  out.sort((a,b)=>a.ord-b.ord || (a.t===b.t?0:(a.t==='stmt'?-1:1)) || (a.id<b.id?-1:1));
  return out;
}
function leadsAt(src){ return availableAt(src,null).length; }
function reveal(src, cat, n){
  const got=[];
  for(const it of availableAt(src,cat).slice(0,n)){
    if(it.t==='clue'){ markFound(it.id); got.push({t:'clue',id:it.id}); }
    else { markHeard(it.id); got.push({t:'stmt',id:it.id}); }
  }
  return got;
}
function revealRandom(cat, n){
  const cs=S.cs, st=S.st;
  const pool = Object.values(cs.clues).filter(c=>c.cat===cat && !st.found[c.id] && !st.gone[c.id] && !isHidden(c) && !c.frag);
  return rshuffle(pool).slice(0,n).map(c=>{ markFound(c.id); return c.id; });
}

// ---------- 目標 ----------
function targetsFor(tgt){
  const cs=S.cs, st=S.st;
  if(tgt==='loc') return cs.locOrder.slice();
  if(tgt==='sus') return cs.susOrder.slice();
  if(tgt==='person') return ['V'].concat(cs.susOrder);
  if(tgt==='place') return cs.locOrder.concat(['V']);
  if(tgt==='obj') return Object.values(cs.clues).filter(c=>c.obj && st.found[c.id] && !st.labSent[c.obj]).map(c=>c.id);
  if(tgt==='stmt') return st.heardOrder.filter(id=>cs.stmts[id].fact && !st.exposed[id] && !st.divine[id]);
  return [];
}
function cardCost(card, target){
  const d = cardDef(card);
  let c = d.cost;
  if(d.cat==='調閱' && hasRelic('laptop') && !S.st.laptopUsed) c--;
  if(d.cat==='民俗'){ if(hasRelic('beads')) c--; if(S.st.folkFree>0) c=0; if(S.st.day===MAX_DAY) c=0; }
  if(d.cat==='訊問' && target && S.st.lawyer[target]) c++;
  if(S.cs && S.cs.finale && d.cat==='民俗') c--;
  return Math.max(0,c);
}
function cardUsable(card, target){
  const d = cardDef(card);
  const cs=S.cs, st=S.st;
  if(d.tgt==='none'){
    const fx=d.fx;
    if(fx.whisper) return !!nextWhisper();
    if(fx.shoujing) return Object.values(cs.clues).some(c=>c.shoujing&&!st.found[c.id]);
    if(fx.random) return Object.values(cs.clues).some(c=>c.cat===fx.random.cat&&!st.found[c.id]&&!st.gone[c.id]&&!isHidden(c)&&!c.frag);
    if(fx.heal) return S.run.cred < S.run.maxCred;
    return true;
  }
  if(!target) return false;
  if(!targetsFor(d.tgt).includes(target)) return false;
  if(d.fx.reveal) return availableAt(target, d.fx.reveal.cat).length>0;
  if(d.fx.kind==='phone') return Object.values(cs.clues).some(c=>c.src===target&&c.kind==='phone'&&!st.found[c.id]&&!st.gone[c.id]);
  if(d.fx.kind==='motive') return !!motiveClueFor(target);
  if(d.fx.search) return !st.searched[target];
  return true;
}
function motiveClueFor(target){
  const cs=S.cs, st=S.st;
  return Object.values(cs.clues).find(c=>c.kind==='motive'&&(c.who===target||(target==='V'&&c.src==='V'))&&!st.found[c.id]&&!st.gone[c.id]&&!isHidden(c));
}

// ---------- 出牌 ----------
function playCard(uid, target){
  const st=S.st, cs=S.cs;
  const card = cardByUid(uid); if(!card || !st.hand.includes(uid)) return {err:'這張牌不在手上'};
  const d = cardDef(card);
  const cost = cardCost(card, target);
  if(st.energy < cost) return {err:'行動力不夠'};
  if(!cardUsable(card, target)) return {err:'這裡查不到東西了'};
  st.energy -= cost;
  if(d.cat==='調閱' && hasRelic('laptop') && !st.laptopUsed) st.laptopUsed = true;
  if(d.cat==='民俗' && st.folkFree>0) st.folkFree--;
  st.hand = st.hand.filter(u=>u!==uid);
  if(d.fx.exhaust) st.exhausted.push(uid); else st.discard.push(uid);
  const res = {card:d.name, cat:d.cat, id:card.id, got:[], msgs:[]};
  const fx = d.fx;
  const before = st.fragFound.length;
  if(fx.reveal){ res.got = reveal(target, fx.reveal.cat, fx.reveal.n); }
  if(fx.kind==='phone'){ const c = Object.values(cs.clues).find(c=>c.src===target&&c.kind==='phone'&&!st.found[c.id]&&!st.gone[c.id]); if(c){ markFound(c.id); res.got.push({t:'clue',id:c.id}); } }
  if(fx.kind==='motive'){ const c = motiveClueFor(target); if(c){ markFound(c.id); res.got.push({t:'clue',id:c.id}); } }
  if(fx.lab!=null){ const c = cs.clues[target]; sendLab(c.obj, fx.lab, res); }
  if(fx.whisper){ for(let i=0;i<fx.whisper;i++){ const w = nextWhisper(); if(w){ markFound(w.id); res.got.push({t:'clue',id:w.id}); } } if(!res.got.length) res.msgs.push('亡者已經沒有話要說了。'); }
  if(fx.energy){ st.energy += fx.energy; res.msgs.push(`行動力 +${fx.energy}`); }
  if(fx.draw){ const g = draw(fx.draw); res.msgs.push(`抽了 ${g.length} 張牌`); }
  if(fx.search){ st.searched[target]=true;
    const c = Object.values(cs.clues).find(c=>c.src===target&&c.searchOnly&&!st.found[c.id]);
    if(c){ markFound(c.id); res.got.push({t:'clue',id:c.id}); }
    else res.msgs.push(`${pname(target)}的住處翻了一整個下午，什麼都沒找到。`);
  }
  if(fx.truth){ res.divine = divine(target, fx.truth); }
  if(fx.pressure){ st.pressure = true; res.msgs.push('今天下一次對質，你會把人逼到牆角。'); }
  if(fx.freeConf){ st.freeConf = true; res.msgs.push('下一次對質不花行動力。'); }
  if(fx.random){ const ids = revealRandom(fx.random.cat, fx.random.n); ids.forEach(id=>res.got.push({t:'clue',id})); if(!ids.length) res.msgs.push('打聽了一圈，沒有新消息。'); }
  if(fx.tail){ st.tail = target; res.msgs.push(`今晚你會跟著${pname(target)}。`); }
  if(fx.seal){ st.seal = true; res.msgs.push('現場封鎖。今晚沒有人能動證據。'); if(fx.sceneForensic){ const g = reveal('L0','鑑識',fx.sceneForensic); res.got.push(...g); } }
  if(fx.shoujing){
    const c = Object.values(cs.clues).find(c=>c.shoujing&&!st.found[c.id]);
    if(c){ markFound(c.id); res.got.push({t:'clue',id:c.id}); } else res.msgs.push('這個案子沒有受驚的證人。香已經點了，就當替自己收一收。');
  }
  if(fx.heal){ healCred(fx.heal); res.msgs.push(`信譽 +${fx.heal}`); }
  if(fx.media){ st.media = true; res.msgs.push('新聞今晚就會播。有人會坐不住。'); }
  res.frags = st.fragFound.slice(before);
  log(`使用「${d.name}」${target?'：'+targetName(target):''}`);
  return res;
}
function targetName(t){
  if(!t) return '';
  const cs=S.cs;
  if(t==='V') return '被害人';
  if(cs.sus[t]) return cs.sus[t].name;
  if(cs.locs[t]) return cs.locs[t].name;
  if(cs.clues[t]) return cs.clues[t].title;
  if(cs.stmts[t]) return pname(cs.stmts[t].who)+'的證詞';
  return t;
}
function nextWhisper(){
  const cs=S.cs, st=S.st;
  return Object.values(cs.clues).filter(c=>c.kind==='whisper'&&c.src==='V'&&!st.found[c.id]).sort((a,b)=>a.ord-b.ord)[0];
}
function sendLab(obj, delay, res){
  const st=S.st;
  st.labSent[obj]=true;
  const d = hasRelic('bento') ? 0 : delay;
  if(d===0){ const lc = labClueOf(obj); if(lc){ markFound(lc.id); res.got.push({t:'clue',id:lc.id}); } }
  else { st.labs.push({obj, ready: st.day + d}); res.msgs.push('已送鑑識中心，明天早上出結果。'); }
}
function divine(sid, mode){
  const st=S.st, s=S.cs.stmts[sid];
  let out;
  if(mode==='poly') out = s.truth ? 'true' : 'lie';
  else {
    const toss = () => { const x=rnd(); return x<1/3 ? 'laugh' : (s.truth?'true':'lie'); };
    out = toss(); if(out==='laugh' && mode==='jiaobei2') out = toss();
  }
  st.divine[sid] = mode==='poly' ? 'poly-'+out : 'jb-'+out;
  return {sid, mode, out};
}

// ---------- 基本偵查 ----------
function basicTargets(){ return S.cs.locOrder.concat(['V'], S.cs.susOrder, targetsFor('obj')); }
function basicUsable(target){
  const cs=S.cs;
  if(cs.clues[target]) return targetsFor('obj').includes(target);
  return leadsAt(target)>0;
}
function basicCost(target){ return BASIC_COST + (S.cs.sus[target] && S.st.lawyer[target] ? 1 : 0); }
function basicAction(target){
  const st=S.st, cs=S.cs;
  const cost = basicCost(target);
  if(st.energy<cost) return {err:'行動力不夠（基本偵查要 '+cost+' 點）'};
  if(!basicUsable(target)) return {err:'這裡查不到東西了'};
  st.energy -= cost;
  const res = {card:'基本偵查', cat:'常駐', id:'basic', got:[], msgs:[]};
  const before = st.fragFound.length;
  if(cs.clues[target]) sendLab(cs.clues[target].obj, 1, res);
  else res.got = reveal(target, null, 1);
  res.frags = st.fragFound.slice(before);
  log(`基本偵查：${targetName(target)}`);
  return res;
}

// ---------- 對質 ----------
function explainConflict(s, c){
  const cs=S.cs;
  const f = c.facts.find(f=>conflict(s.fact,f)); if(!f) return '';
  const a = s.fact, who = a.who ? pname(a.who) : '';
  const traits = c.anon && c.chips.length ? `（證據裡的人：${c.chips.map(([k,v])=>chipText(k,v)).join('、')}——和${who}吻合）` : '';
  if(a.k==='at' && f.k==='at') return `${who}說${cs.slots[a.slot].name}在「${locName(a.loc)}」，可是這份證據顯示，那時${pro(a.who)}在「${locName(f.loc)}」。一個人不能同時在兩個地方。${traits}`;
  if(a.k==='at' && f.k==='notat') return `${who}說${cs.slots[a.slot].name}在「${locName(a.loc)}」，可是「${locName(a.loc)}」的紀錄證明，${pro(a.who)}根本不在那裡。`;
  if(a.k==='notat' && f.k==='at') return `${who}說${a.slot==null?'那天晚上':cs.slots[a.slot].name}沒去過「${locName(a.loc)}」，可是這份證據顯示，${pro(a.who)}${cs.slots[f.slot].name}就在那裡。${traits}`;
  if(a.k==='nottouch') return `${who}說從沒碰過${cs.W.name}，可是這份證據把${pro(a.who)}和${cs.W.name}連在一起。`;
  if(a.k==='norel') return `${who}否認「${MOTIVES[a.rel].tag}」，可是這份證據把這層關係攤在桌上。`;
  if(a.k==='nocontact') return `${who}說那天沒和被害人聯絡，可是${cs.slots[f.slot].name}他們通過電話。`;
  if(a.k==='deadby') return `${who}說${hm(a.t)}到的時候人已經死了，可是被害人${hm(f.t)}還活著。`;
  return '這兩件事不可能同時成立。';
}
function confrontCost(){ return S.st.freeConf ? 0 : 1; }
function confront(sid, cid){
  const st=S.st, cs=S.cs;
  const s = cs.stmts[sid], c = cs.clues[cid];
  if(!s || !c) return {err:'資料錯誤'};
  if(st.exposed[sid]) return {err:'這句話已經被拆穿了'};
  const cost = confrontCost();
  if(st.energy<cost) return {err:'行動力不夠（對質要 1 點）'};
  st.energy -= cost; st.freeConf=false;
  const pressured = st.pressure; st.pressure=false;
  const hit = !s.truth && c.adm && c.facts.some(f=>conflict(s.fact,f));
  if(hit){
    const eff = exposeStmt(sid);
    const res = {ok:true, sid, cid, explain:explainConflict(s,c), got:eff.got, reaction:reactionFor(s)};
    if(pressured){ const extra = pressureBonus(s.who); if(extra) res.got.push(extra); }
    log(`對質成功：${pname(s.who)}的證詞被拆穿`);
    return res;
  }
  st.wrongConf++;
  let lost = 1;
  if(pressured) lost = 0;
  else if(hasRelic('amulet') && !st.amuletUsed){ st.amuletUsed=true; lost=0; }
  if(lost) loseCred(lost);
  log(`對質失敗：${pname(s.who)}`);
  return {ok:false, sid, cid, lost, why: !c.adm ? '這種東西拿到法庭上，只會被笑。' : (s.fact ? missReason(s,c) : '這句話本來就不是能查證的事。'), reaction: fpick(['你到底有沒有證據？','這跟我有什麼關係？','警察先生，你是不是搞錯人了？','……你們就只有這樣？'])};
}
function missReason(s, c){
  const cs=S.cs;
  if(c.frag) return '這是七年前的東西。跟這句話，跟這個案子，都沒有關係。';
  if(c.anon){
    const other = c.facts.some(f=>f.who && f.who!==s.fact.who);
    if(other && c.chips.length) return `證據裡那個人的特徵（${c.chips.map(([k,v])=>chipText(k,v)).join('、')}），跟${pname(s.fact.who)}對不上——那根本不是${pro(s.fact.who)}。`;
  }
  const f0 = c.facts[0];
  if(!f0) return '這份證據和這句話，說的根本不是同一件事。';
  if(f0.slot!=null && s.fact.slot!=null && f0.slot!==s.fact.slot) return `時間對不上：證據講的是${cs.slots[f0.slot].name}，${pro(s.fact.who)}講的是${cs.slots[s.fact.slot].name}。`;
  if(f0.who && s.fact.who && f0.who!==s.fact.who) return '這份證據講的是別人。';
  return '這份證據和這句話並不矛盾。';
}
function exposeStmt(sid){
  const st=S.st, cs=S.cs;
  const got=[];
  if(st.exposed[sid]) return {got};
  st.exposed[sid]=true;
  if(!st.heard[sid]) markHeard(sid);
  const s = cs.stmts[sid];
  for(const t of Object.values(cs.stmts)){
    if(t.auto && t.gate && t.gate.exp===sid && !st.heard[t.id]){ markHeard(t.id); got.push({t:'stmt',id:t.id}); }
  }
  if(s.onExp){
    for(const id of (s.onExp.unlockFound||[])){ if(st.gone[id]) delete st.gone[id]; if(!st.found[id]){ markFound(id); got.push({t:'clue',id}); } }
    for(const id of (s.onExp.exposeAlso||[])){ if(!st.exposed[id]){ const g = exposeStmt(id); got.push(...g.got); } }
  }
  return {got};
}
function pressureBonus(pid){
  const cs=S.cs, st=S.st;
  const pool = Object.values(cs.clues).filter(c=>c.who===pid && !st.found[c.id] && !st.gone[c.id] && !isHidden(c) && c.cat!=='民俗' && !c.frag);
  if(!pool.length) return null;
  const c = rpick(pool); markFound(c.id); return {t:'clue',id:c.id};
}
function reactionFor(s){
  const cs=S.cs; const p = cs.sus[s.who];
  if(!p) return '';
  const P = pro(s.who);
  if(p.role==='C') return fpick(['……（'+P+'的手指在桌下一直敲。）','「我、我可能記錯了……」','（'+P+'舔了舔嘴唇，眼神飄向門口。）','「你們……你們調這個幹嘛？」','（沉默了很久。額頭上全是汗。）']);
  if(s.topic==='cover') return '（他整個人垮下來，雙手摀住臉。）';
  return fpick(['「……好啦，我說實話。」','（'+P+'嘆了一口氣。）','「你們怎麼連這個都查得到……」','（'+P+'看了你很久，終於放棄了。）']);
}

// ---------- 可見資訊的整理 ----------
function visiblePairs(){
  const cs=S.cs, st=S.st; const out=[];
  for(const sid of st.heardOrder){ const s=cs.stmts[sid]; if(!s.fact||s.truth||st.exposed[sid]) continue;
    for(const cid of st.foundOrder){ const c=cs.clues[cid]; if(c.adm && c.facts.some(f=>conflict(s.fact,f))){ out.push([sid,cid]); break; } } }
  return out;
}
// 三要件：只看已經找到、有證據能力、身分明確的證據
function pillars(pid){
  const cs=S.cs, st=S.st;
  const out={scene:false, means:false, motive:false, away:false, lies:0, src:{}};
  for(const cid of st.foundOrder){ const c=cs.clues[cid]; if(!c.adm || c.anon) continue;
    for(const f of c.facts){ if(f.who!==pid) continue;
      if(f.k==='at' && f.slot===1 && f.loc==='L0'){ out.scene=true; out.src.scene=cid; }
      if(f.k==='at' && f.slot===1 && f.loc!=='L0'){ out.away=true; out.src.away=cid; }
      if(f.k==='touch'){ out.means=true; out.src.means=cid; }
      if(f.k==='rel'){ out.motive=true; out.src.motive=cid; } } }
  out.lies = Object.keys(st.exposed).filter(id=>cs.stmts[id].who===pid).length;
  return out;
}
function objective(level){
  const o = objective0(level), st=S.st;
  if(st && st.energy<1 && !/逮捕。$/.test(o)) return st.day>=MAX_DAY ? '頭七的行動力用完了。心裡有答案，就趁今晚逮捕；沒有，這案子就要成懸案了。' : '今天的行動力用完了，按「收工」。明天——'+o;
  return o;
}
function objective0(level){
  const cs=S.cs, st=S.st;
  if(!st.heardOrder.length) return '先用「偵訊」問問嫌疑人，聽聽他們怎麼說；再到案發現場採證。';
  const weapon = Object.values(cs.clues).find(c=>c.obj && st.found[c.id]);
  if(level>=2 && visiblePairs().length) return '有人的說法，和你手上的證據對不上。到「人物」點開那個人，按「對質」。';
  const ready = cs.susOrder.find(pid=>{ const p=pillars(pid); return p.scene&&p.means&&p.motive&&!p.away; });
  if(ready) return `${pname(ready)}的時機、手段、動機都有證據了。準備好，就逮捕。`;
  if(!weapon) return '先到案發現場採證，把凶器找出來。';
  if(!st.labSent[weapon.obj]) return '凶器找到了，記得送驗。';
  const left = cs.susOrder.filter(pid=>!pillars(pid).away);
  if(level>=2 && left.length===1) return `只剩${pname(left[0])}沒有不在場證明。把${pro(left[0])}的時機、手段、動機湊齊。`;
  return '誰在案發時段到過現場？誰碰過凶器？誰有動機？把三件事湊齊，再逮捕。';
}

// ---------- 提示（沙盤推演） ----------
function useHint(){
  const st=S.st, cs=S.cs;
  if(st.energy<1) return {err:'行動力不夠（沙盤推演要 1 點）'};
  st.energy -= 1; st.hints++;
  const deep = st.hintStep % 2 === 1; st.hintStep++;
  const pairs = visiblePairs();
  if(pairs.length){
    const [sid,cid] = rpick(pairs); const s=cs.stmts[sid];
    return {msg: deep ? `拿「${cs.clues[cid].title}」去對質${pname(s.who)}這句話：「${shorten(s.text,28)}」` : `你手上已經有能拆穿某個人的證據了。仔細比對「${pname(s.who)}」說過的每一句話，特別是時間和地點。`};
  }
  const cId = cs.truth.culprit;
  const rounds = bossRoundsFor(cId).filter(r=>!r.cleared);
  for(const r of rounds){
    const s = cs.stmts[r.sid];
    const haveProof = st.foundOrder.some(cid=>{ const c=cs.clues[cid]; return c.adm && c.facts.some(f=>conflict(s.fact,f)); });
    if(haveProof) continue;
    const cand = Object.values(cs.clues).filter(c=>c.adm && !st.found[c.id] && !st.gone[c.id] && c.facts.some(f=>conflict(s.fact,f)));
    const reach = cand.filter(c=>!isHidden(c) && c.cat!=='民俗');
    if(!deep) return {msg:`時機、手段、動機——其中「${r.d.label}」這一環，你手上的證據還接不起來。`};
    if(reach.length){ const c = rpick(reach); return {msg:`去「${srcName(c.src)}」用「${c.cat}」查，會有收穫。`}; }
    const lab = cand.find(c=>c.src==='LAB'); if(lab) return {msg:'凶器還沒送驗，或結果還沒出來。'};
    return {msg:'有些證據只有在拆穿某個人之後才會浮出來。先從說謊的人下手。'};
  }
  return {msg: deep ? '看看推理板：只有一個人的謊言，能被你手上的證據一路拆到底。' : '證據應該夠了。誰同時具備時機、手段、動機？'};
}
function shorten(t,n){ t=String(t); return t.length>n ? t.slice(0,n)+'…' : t; }

// ---------- 夜晚 ----------
const FOLK_NIGHT = [
  {text:'凌晨三點零七分，辦公室的日光燈閃了三下。你抬頭，白板上的照片全都歪向同一邊。',fx:null},
  {text:'你夢到被害人站在床尾，一句話也不說，只是一直看著你。醒來的時候，枕頭邊多了一張金紙。',fx:'whisper'},
  {text:'半夜手機響了一聲，是一則沒有號碼的訊息，內容只有一個字：「冷」。',fx:null},
  {text:'你在樓梯間聽見有人在數數，數到七就停了。回頭，什麼都沒有。',fx:'folkFree'},
  {text:'你把案發現場的照片攤在桌上，看到一半睡著了。醒來時，其中一張被翻到背面。',fx:null},
  {text:'路口的金爐凌晨還在燒，火光裡好像有人蹲著。你走過去，只剩一堆灰。',fx:'folkFree'},
  {text:'你洗澡的時候，浴室的鏡子起霧，上面慢慢浮出一個小小的手印。',fx:'whisper'},
];
function runNight(){
  const cs=S.cs, st=S.st;
  const nr = mkR(((cs.baseSeed||cs.seed) ^ Math.imul(st.day+11, 2654435761))>>>0);
  const ev = [];
  const cId = cs.truth.culprit;
  const destroyable = () => Object.values(cs.clues).filter(c=>c.destr && !st.found[c.id] && !st.gone[c.id] && !isHidden(c)).sort((a,b)=>(b.who===cId)-(a.who===cId) || (a.id<b.id?-1:1));
  let attempts = cs.finale ? 2 : 1;
  let p = [0,0.25,0.35,0.45,0.55,0.65][cs.diff] || 0.45;
  p += st.alert*0.15;
  if(hasRelic('reporter')) p/=2;
  const rolls = [nr.f(), nr.f()];
  if(st.tail){
    const t = st.tail, tp = cs.sus[t];
    if(t===cId){
      const cand = destroyable();
      if(cand.length){ const c = cand[0]; markFound(c.id); ev.push({kind:'tail',text:`你跟著${tp.name}到了${srcName(c.src)}附近。${pro(t)}想處理掉什麼，被你當場撞見——「${c.title}」保住了。`,got:c.id}); }
      else ev.push({kind:'tail',text:`${tp.name}整晚待在家，燈一直沒關。凌晨三點，${pro(t)}在陽台燒東西，燒完又把灰沖進水溝。`});
      attempts = 0;
    } else if(tp.role==='AS'){
      const c = Object.values(cs.clues).find(c=>c.who===t && c.kind==='rec' && c.facts.some(f=>f.k==='at'&&f.who===t&&f.slot===1));
      if(c && !st.found[c.id]){ markFound(c.id); ev.push({kind:'tail',text:`你跟著${tp.name}，發現${pro(t)}又去了一次${srcName(c.src)}。這個人藏著事情。`,got:c.id}); }
      else if(c) ev.push({kind:'tail',text:`${tp.name}又去了一趟${srcName(c.src)}，坐了很久才回家。`});
      else ev.push({kind:'tail',text:`${tp.name}整晚都在家，沒什麼異狀。`});
    } else ev.push({kind:'tail',text:`${tp.name}整晚都在家，十一點就關燈了。沒什麼異狀。`});
  }
  if(st.media && attempts>0){
    const pool = Object.values(cs.clues).filter(c=>c.who===cId && !st.found[c.id] && !st.gone[c.id] && !isHidden(c) && c.cat!=='民俗' && !c.frag);
    if(pool.length){ const c = nr.pick(pool); markFound(c.id); ev.push({kind:'media',text:'新聞一播出來，有人就坐不住了。半夜，一通匿名電話打進大隊。',got:c.id}); }
    attempts = 0;
  }
  if(st.seal) attempts = 0;
  for(let i=0;i<attempts;i++){
    if(rolls[i]>=p) continue;
    const cand = destroyable(); if(!cand.length) break;
    const c = cand[0]; st.gone[c.id]=true;
    ev.push({kind:'destroy',text:destroyText(c)});
  }
  st.alert = 0;
  if(st.day===3){
    const exp = Object.values(cs.clues).filter(c=>c.keep===3 && !st.found[c.id] && !st.gone[c.id]);
    exp.forEach(c=>st.gone[c.id]=true);
    const places = [...new Set(exp.map(c=>srcName(c.src)))];
    ev.push({kind:'expire',text: places.length ? `72 小時到了。${places.join('、')}的監視器畫面，已經被新的畫面蓋掉。` : '72 小時到了。多數店家的監視器畫面已經被覆蓋——還好你早一步調到了。'});
  }
  if(st.day===4){
    st.lawyer[cId]=true;
    const inn = cs.susOrder.filter(id=>id!==cId && cs.sus[id].role!=='AC');
    const extra = nr.f()<0.7 && inn.length ? nr.pick(inn) : null;
    if(extra) st.lawyer[extra]=true;
    const names = nr.shuffle([cId].concat(extra?[extra]:[])).map(pname);
    ev.push({kind:'lawyer',text:`${names.join('和')}請了律師。之後偵訊${names.length>1?'他們':pro(cId)}，每次要多花 1 點行動力。`});
  }
  if(nr.f()<0.35 || st.day===6){
    const f = cs.finale ? {text:'凌晨三點零七分，你的手機亮了。來電顯示是一支七年前就停用的號碼。你接起來，電話那頭只有誦經聲。',fx:'folkFree'} : nr.pick(FOLK_NIGHT);
    const e = {kind:'folk',text:f.text};
    if(f.fx==='whisper'){ const w = nextWhisper(); if(w){ markFound(w.id); e.got=w.id; } }
    if(f.fx==='folkFree'){ st.folkFree = 1; e.text += '（明天第一張民俗牌不用行動力）'; }
    ev.push(e);
  }
  st.discard.push(...st.hand); st.hand=[];
  st.nights.push({day:st.day, ev});
  st.day++;
  if(st.day>MAX_DAY){ st.cold = true; return {ev, cold:true}; }
  const labNews = startDay(false);
  labNews.forEach(id=>ev.push({kind:'lab',text:'鑑識中心的報告出來了。',got:id}));
  if(st.day===MAX_DAY) ev.push({kind:'last',text:'今天是頭七。天黑之前，這是最後的機會。民俗牌今天不用行動力。'});
  return {ev, cold:false};
}
function destroyText(c){
  const where = srcName(c.src);
  if(c.kind==='cctv' || c.kind==='after') return `${where}的監視器主機「剛好」壞了，硬碟怎麼樣都讀不出來。`;
  if(c.kind==='buy') return `${where}的老闆突然改口，說那幾天根本沒人來買東西。`;
  if(c.kind==='alive') return '那晚的證人換了手機號碼，怎麼樣都聯絡不上了。';
  if(c.kind==='wit') return `${where}那邊有個證人突然什麼都不記得了，一直搖頭，看起來很害怕。`;
  if(c.kind==='motive') return '一個知道內情的人改口了，說那些話都是聽別人講的。';
  return `有人比你早一步。${where}的一條線索沒了。`;
}

// ---------- 逮捕與審訊 ----------
function bossRoundsFor(pid){
  const cs=S.cs, st=S.st;
  return cs.bossDef[pid].map(d=>{
    if(d.stmts && d.stmts.length){
      const unexp = d.stmts.filter(id=>!st.exposed[id]);
      if(!unexp.length) return {d, cleared:true};
      const sid = unexp[0], s = cs.stmts[sid];
      return {d, cleared:false, sid, fact:s.fact, truth:s.truth, text:(d.texts&&d.texts[sid])||d.text};
    }

  S.boss = {pid, wrong:0, badgeUsed:false, pre, done:false, won:false};
  log(`逮捕：${pname(pid)}`);
  if(!bossCurrent().cur){ S.boss.done=true; S.boss.won=true; st.solved=true; }

  const cs=S.cs, st=S.st, b=S.boss;
  const {cur} = bossCurrent();

  const c = cs.clues[cid];
  const hit = !cur.truth && c.adm && c.facts.some(f=>conflict(cur.fact,f));
  if(hit){
    const s = cs.stmts[cur.sid];

    if(!after.cur){ b.done=true; b.won=true; res.win=true; st.solved=true; }

function loseCred(n){ const run=S.run; run.cred = Math.max(0, run.cred-n); if(run.cred<=0) run.over = true; }
function healCred(n){ const run=S.run; run.cred = Math.min(run.maxCred, run.cred+n); }

// ---------- 結案 ----------
function rateCase(){
  const st=S.st, cs=S.cs;
  const cId = cs.truth.culprit;
  const exposedC = Object.keys(st.exposed).filter(id=>cs.stmts[id].who===cId).length;
  let sc = 100 - 5*(st.day-1) - 6*st.wrongConf - 7*st.wrongPres - 5*st.hints - 10*st.failedArrests + Math.min(10, 2*exposedC);
  sc = Math.max(0, Math.min(100, sc));
  return {score:sc, grade: sc>=88?'S':sc>=74?'A':sc>=58?'B':'C'};
}
function finishCase(){
  const st=S.st, cs=S.cs, run=S.run;
  const solved = !!st.solved;
  const rt = solved ? rateCase() : {score:0, grade:'懸'};
  const gain = solved ? ({S:5,A:4,B:3,C:2})[rt.grade] : 0;
  if(solved) healCred(gain); else loseCred(6);
  const granted = [];
  if(run.mode==='campaign') for(const fid of (cs.frags||[])) if(grantFrag(fid,false)) granted.push(fid);
  const rec = {idx:run.caseIdx, title:cs.title, victim:cs.victim.name, culprit:cs.sus[cs.truth.culprit].name, solved, grade:rt.grade, day:st.day, finale:cs.finale, code:cs.code||null};
  run.history.push(rec);
  return Object.assign({gain, lost: solved?0:6, granted, fragFound:st.fragFound.slice()}, rt, rec);
}
function truthReport(){
  const cs=S.cs;
  const rows = cs.susOrder.map(pid=>{
    const p = cs.sus[pid];
    return {pid, name:p.name, nick:p.nick, role:p.role, culprit: pid===cs.truth.culprit,
      lines: cs.truth.lines[pid]||['','',''], why: cs.truth.why[pid]||'',
      motive: cs.truth.motiveOf && cs.truth.motiveOf[pid] ? MOTIVES[cs.truth.motiveOf[pid]].tag : null};
  });
  rows.sort((a,b)=>(b.culprit-a.culprit));
  return rows;
}

function retryCase(){
  const run=S.run; if(!run || !run.cp) return false;
  const cp = clone(run.cp);
  Object.assign(run, cp);
  run.retries = (run.retries||0)+1; run.salt = (run.salt||0)+1;
  run.cred = Math.max(run.cred, 10); run.over = false; run.recon = null; run.ending = null;
  S.cs=null; S.st=null; S.boss=null;
  return true;
}
function reconState(){ const run=S.run; if(!run.recon) run.recon = {q:0, wrong:0}; return run.recon; }
function reconAnswer(opt, fragIds){
  const R = reconState(); const Q = RECON[R.q];
  if(!Q) return {err:'已經還原完了'};
  const o = Q.opts[opt];
  if(!o) return {err:'先選一個答案'};
  if(!o.ok){ R.wrong++; return {ok:false, msg:Q.hint}; }
  const have = new Set(fragIds||[]);
  if(!Q.need.some(g=>g.every(id=>have.has(id)))){ R.wrong++; return {ok:false, partial:true, msg:Q.part}; }
  R.q++;
  return {ok:true, scene:Q.scene, done:R.q>=RECON.length};
}

function rollRewards(grade){
  const keys = Object.keys(CARD_DB);
  const w = k => [6,3,1][CARD_DB[k].rare];
  const picks = [];
  const pickOne = (filter) => {
    const cand = keys.filter(k=>!picks.includes(k) && (!filter || filter(k)));
    let tot = cand.reduce((a,k)=>a+w(k),0), x = rnd()*tot;
    for(const k of cand){ x-=w(k); if(x<0) return k; }
    return cand[cand.length-1];
  };
  if(grade==='S' || grade==='A') picks.push(pickOne(k=>CARD_DB[k].rare>=1));
  while(picks.length<3) picks.push(pickOne());
  return rshuffle(picks);
}
function relicChoices(n){
  const own = S.run.relics;
  return rshuffle(Object.keys(RELIC_DB).filter(k=>!own.includes(k))).slice(0,n);

function sfx(kind){
  if(!AC || !S.meta.sound) return;
  try{
    const t = AC.currentTime;
    const noise = (dur, freq, q, vol) => {
      const len = Math.floor(AC.sampleRate*dur); const b = AC.createBuffer(1,len,AC.sampleRate); const d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const s = AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;

    };

      const d = delay||0; const o = AC.createOscillator(); o.type=type; const g=AC.createGain();
      o.frequency.setValueAtTime(f1, t+d); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d+dur);
      g.gain.setValueAtTime(vol, t+d); g.gain.exponentialRampToValueAtTime(0.0001, t+d+dur);
      o.connect(g); g.connect(AC.destination); o.start(t+d); o.stop(t+d+dur+0.05);
    };
    if(kind==='flip') noise(0.07, 2200, 1.2, 0.35);
    else if(kind==='stamp'){ tone('sine',95,38,0.32,0.9); noise(0.05,500,0.8,0.5); }
    else if(kind==='bell'){ tone('sine',880,null,1.8,0.25); tone('sine',1318,null,1.2,0.12); tone('sine',1760,null,0.6,0.05); }
    else if(kind==='bad'){ tone('triangle',190,120,0.22,0.35); tone('triangle',150,95,0.25,0.3,0.12); }
    else if(kind==='candle'){ noise(0.6, 380, 0.7, 0.35); }
    else if(kind==='win'){ tone('sine',523,null,0.5,0.2); tone('sine',659,null,0.6,0.18,0.12); tone('sine',784,null,1.2,0.18,0.24); }
    else if(kind==='thread'){ tone('triangle',330,null,1.4,0.22); tone('sine',660,null,1.0,0.08,0.02); tone('sine',990,null,0.6,0.04,0.03); }
    else if(kind==='tick'){ noise(0.03, 3000, 2, 0.15); }

}
const AMB = {mode:null, stop:null};
function brownBuffer(sec){ const len=Math.floor(AC.sampleRate*sec); const b=AC.createBuffer(1,len,AC.sampleRate); const d=b.getChannelData(0); let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; } return b; }
function ambient(mode){
  if(!AC || !S.meta.sound || !S.meta.amb) mode = null;
  if(AMB.mode===mode) return;
  if(AMB.stop){ try{ AMB.stop(); }catch(e){} AMB.stop=null; }
  AMB.mode = mode; if(!mode) return;
  try{
    const t=AC.currentTime; const out=AC.createGain(); out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(1,t+1.6); out.connect(AC.destination);
    const nodes=[], timers=[];
    const loopNoise=(vol,freq)=>{ const s=AC.createBufferSource(); s.buffer=brownBuffer(4); s.loop=true; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; const g=AC.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(out); s.start(); nodes.push(s); };
    const hum=(freq,vol)=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=freq; const g=AC.createGain(); g.gain.value=vol; o.connect(g); g.connect(out); o.start(); nodes.push(o); };
    const chirp=()=>{ const t0=AC.currentTime; for(let i=0;i<3;i++){ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=4100+Math.random()*400; const g=AC.createGain(); const s=t0+i*0.07; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(0.01,s+0.01); g.gain.linearRampToValueAtTime(0,s+0.05); o.connect(g); g.connect(out); o.start(s); o.stop(s+0.06); } };
    const thump=()=>{ const t0=AC.currentTime; [0,0.22].forEach((d,i)=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(72,t0+d); o.frequency.exponentialRampToValueAtTime(40,t0+d+0.15); const g=AC.createGain(); g.gain.setValueAtTime(i?0.05:0.08,t0+d); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.2); o.connect(g); g.connect(out); o.start(t0+d); o.stop(t0+d+0.22); }); };
    const bell=()=>{ const t0=AC.currentTime; [[523,0.018],[1046,0.007],[1568,0.003]].forEach(([f,v])=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f; const g=AC.createGain(); g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+3.5); o.connect(g); g.connect(out); o.start(t0); o.stop(t0+3.6); }); };
    if(mode==='office'){ loopNoise(0.045,420); hum(100,0.005); hum(120,0.003); }
    if(mode==='night'){ loopNoise(0.06,300); timers.push(setInterval(()=>{ if(Math.random()<0.8) chirp(); }, 800)); }
    if(mode==='boss'){ hum(55,0.018); hum(82.4,0.007); loopNoise(0.03,200); timers.push(setInterval(thump, 1100)); }
    if(mode==='temple'){ loopNoise(0.035,260); hum(110,0.005); timers.push(setInterval(()=>{ if(Math.random()<0.4) bell(); }, 5200)); }
    AMB.stop=()=>{ const t2=AC.currentTime; out.gain.cancelScheduledValues(t2); out.gain.setValueAtTime(out.gain.value,t2); out.gain.linearRampToValueAtTime(0,t2+0.6); timers.forEach(clearInterval); setTimeout(()=>{ nodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); try{ out.disconnect(); }catch(e){} }, 700); };
  }catch(e){ AMB.mode=null; }
}

  if(t.mark==='染棕髮') hairC = '#5b3e27';
  let lines='';
  for(let cm=150; cm<=190; cm+=10){ const y=Y(cm).toFixed(1); lines += `<line x1="0" x2="100" y1="${y}" y2="${y}" stroke="#ffffff1c" stroke-width=".7"/><text x="3" y="${(Y(cm)-1.8).toFixed(1)}" font-size="6" fill="#ffffff4d" font-family="IBM Plex Mono,monospace">${cm}</text>`; }
  const cx=52, hr=12, hy=top+hr+2;
  const body = `<path d="M6 133 C 8 ${hy+34}, 30 ${hy+21}, ${cx} ${hy+19} C ${cx+22} ${hy+21}, 96 ${hy+34}, 98 133 Z" fill="${skin}"/>`;
  const neck = `<rect x="${cx-5.5}" y="${hy+8}" width="11" height="13" fill="${skin}"/>`;
  const head = `<ellipse cx="${cx}" cy="${hy}" rx="${hr}" ry="${hr+1.8}" fill="${skin}"/>`;
  let hair = '';
  if(t.mark!=='光頭'){
    if(t.gender==='F'){
      const long = t.mark==='長捲髮' || (t.mark!=='俐落短髮' && (p.hair||0)%2===0);
      const end = long ? hy+26 : hy+7;
      const wave = t.mark==='長捲髮' ? ` Q ${cx-hr-6} ${hy+14} ${cx-hr-1} ${end}` : '';
      hair = `<path d="M${cx-hr-2.5} ${end}${wave} Q ${cx-hr-5} ${hy-7} ${cx} ${hy-hr-4.5} Q ${cx+hr+5} ${hy-7} ${cx+hr+2.5} ${end} L ${cx+hr-2} ${end} Q ${cx+hr} ${hy-1} ${cx+3} ${hy-hr+2} Q ${cx-hr+1} ${hy-2} ${cx-hr+2} ${end} Z" fill="${hairC}"/>`;
    } else {
      hair = `<path d="M${cx-hr-.5} ${hy-1} Q ${cx-hr} ${hy-hr-6} ${cx} ${hy-hr-4} Q ${cx+hr} ${hy-hr-6} ${cx+hr+.5} ${hy-1} Q ${cx+hr-3} ${hy-hr+1} ${cx} ${hy-hr+1} Q ${cx-hr+3} ${hy-hr+1} ${cx-hr-.5} ${hy-1} Z" fill="${hairC}"/>`;
    }
  }
  let extra = '';
  if(/眼鏡/.test(t.mark||'')) extra += `<path d="M${cx-8} ${hy} h6 M${cx+2} ${hy} h6" stroke="${t.mark==='金框眼鏡'?'#c9a13b':'#0a0a0a'}" stroke-width="1.6"/>`;
  if(t.mark==='金項鍊') extra += `<path d="M${cx-8} ${hy+19} Q ${cx} ${hy+28} ${cx+8} ${hy+19}" stroke="#c9a13b" stroke-width="1.5" fill="none"/>`;
  if(t.mark==='手臂刺青') extra += `<path d="M16 ${hy+33} q4 -5 8 0 t8 0 M18 ${hy+39} q4 -5 8 0" stroke="#00000080" stroke-width="1.3" fill="none"/>`;
  if(t.mark==='左眉有疤') extra += `<path d="M${cx-9} ${hy-7} l5 5" stroke="#e0424e" stroke-width="1.1" opacity=".85"/>`;
  if(t.mark==='手腕刺青') extra += `<path d="M84 ${hy+36} l6 4" stroke="#00000080" stroke-width="1.6"/>`;
  return `<svg viewBox="0 0 100 133" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="100" height="133" fill="#172220"/>${lines}${body}${neck}${head}${hair}${extra}</svg>`;
}

function slotTag(s){ const cs=S.cs; return `<span class="tag slot s${s}">${cs.slots[s].name} ${cs.slots[s].range}</span>`; }
function factTags(f, mode, anon){
  const cs=S.cs; const out=[];
  if(!f) return '';
  if(f.who) out.push(anon ? '<span class="tag anon">身分不明</span>' : `<span class="tag who">${esc(pname(f.who))}</span>`);
  const claim = mode==='claim';
  if(f.k==='at'||f.k==='notat'){
    out.push(f.slot!=null ? slotTag(f.slot) : '<span class="tag slot">整晚</span>');
    const pre = f.k==='notat' ? (claim?'沒去過 ':'不在 ') : (claim?'自稱在 ':'在 ');
    out.push(`<span class="tag loc ${f.k==='notat'?'neg':''}">${pre}${esc(locName(f.loc))}</span>`);
  }
  if(f.k==='touch') out.push(`<span class="tag obj">${claim?'承認碰過':'碰過'} ${esc(cs.W.name)}</span>`);
  if(f.k==='nottouch') out.push(`<span class="tag obj neg">沒碰過 ${esc(cs.W.name)}</span>`);
  if(f.k==='rel') out.push(`<span class="tag rel">${claim?'承認：':''}${esc(MOTIVES[f.rel].tag)}</span>`);
  if(f.k==='norel') out.push(`<span class="tag rel neg">否認：${esc(MOTIVES[f.rel].tag)}</span>`);
  if(f.k==='contact'){ out.push('<span class="tag rel">與被害人通話</span>'); if(f.slot!=null) out.push(slotTag(f.slot)); }
  if(f.k==='nocontact') out.push('<span class="tag rel neg">否認當天通話</span>');
  if(f.k==='alive') out.push(`<span class="tag time">${hm(f.t)} 被害人還活著</span>`);
  if(f.k==='deadby') out.push(`<span class="tag time">${hm(f.t)} 被害人已經死了</span>`);
  return out.join('');
}
function clueTags(c){
  if(c.frag) return '<span class="tag thread">紅線卷宗・七年前</span>';

  if(c.obj) parts.unshift(`<span class="tag obj">物證：${esc(S.cs.W.name)}</span>`);
  return parts.join('');
}

function camStatus(id){
  const cs=S.cs, st=S.st;
  const cams = Object.values(cs.clues).filter(c=>c.src===id && (c.kind==='cctv'||c.kind==='after') && c.keep);
  if(!cams.length) return '';
  const un = cams.filter(c=>!st.found[c.id] && !st.gone[c.id]);
  const lost = cams.filter(c=>st.gone[c.id] && !st.found[c.id]);
  if(!un.length && lost.length) return '<span class="cam gone">監視器畫面已消失</span>';
  if(!un.length) return '<span class="cam">監視器：已調閱</span>';
  if(un.some(c=>c.keep===3)) return `<span class="cam warn">監視器只保存 72 小時</span>`;
  return '<span class="cam">監視器保存七天</span>';
}

function vBoard(){

  const rows = cs.susOrder.map(pid=>{
    const cells = [0,1,2].map(slot=>{
      const ent=[];
      for(const sid of st.heardOrder){ const s=cs.stmts[sid]; const f=s.fact; if(!f||f.who!==pid) continue;
        if((f.k==='at'&&f.slot===slot) || (f.k==='notat'&&(f.slot===slot||f.slot==null))){
          const by = s.who!==pid ? `（${esc(pname(s.who))}說）` : '';
          ent.push(`<span class="ent claim ${st.exposed[sid]?'exp':''}">${f.k==='notat'?'自稱沒去過':'自稱在'} ${esc(locName(f.loc))}${by}</span>`);
        } }
      for(const cid of st.foundOrder){ const c=cs.clues[cid]; if(!c.adm||c.anon) continue;
        for(const f of c.facts){ if(f.who!==pid) continue;
          if(f.k==='at'&&f.slot===slot) ent.push(`<span class="ent ev">在 ${esc(locName(f.loc))}<small>${esc(c.title)}</small></span>`);
          if(f.k==='notat'&&(f.slot===slot||f.slot==null)) ent.push(`<span class="ent ev not">不在 ${esc(locName(f.loc))}<small>${esc(c.title)}</small></span>`);
        } }
      return `<td class="${slot===1?'s1':''}">${ent.join('')||'<span class="dim">—</span>'}</td>`;
    }).join('');
    return `<tr><td class="who">${esc(cs.sus[pid].name)}</td>${cells}</tr>`;
  }).join('');
  const anon = st.foundOrder.map(id=>cs.clues[id]).filter(c=>c.anon&&c.chips.length);
  const anonRows = anon.map(c=>{
    const f=c.facts[0]; const on=U.boardHL===c.id;
    return `<button class="anon-row ${on?'on':''}" data-a="board-hl" data-c="${c.id}"><div class="grow"><div style="font-weight:700;font-size:13.5px">${esc(c.title)}</div><div class="chips" style="margin-top:4px">${f&&f.slot!=null?slotTag(f.slot):''}${f&&f.loc?`<span class="tag loc">${esc(locName(f.loc))}</span>`:''}${c.chips.map(([k,v])=>`<span class="chip t">${esc(chipText(k,v))}</span>`).join('')}</div></div><span class="dim" style="font-size:11px">${on?'比對中':'比對'}</span></button>`;
  }).join('');
  const hl = U.boardHL ? cs.clues[U.boardHL] : null;

    const p=cs.sus[pid]; let m=0, tot=0;
    const tds = TRAIT_COLS.map(([k])=>{ const want = hl ? hl.chips.find(([kk])=>kk===k) : null; const match = want && String(p.traits[k])===String(want[1]); if(want){ tot++; if(match) m++; } return `<td class="${match?'m':''}">${esc(chipText(k,p.traits[k]))}</td>`; }).join('');
    return `<tr><td style="font-weight:700">${esc(p.name)}</td>${tds}${hl?`<td class="mono ${m===tot?'full':''}">${m}/${tot}</td>`:''}</tr>`;
  }).join('')}</table>`;
  return `<div class="sec-h"><h3>三要件</h3><span class="line"></span></div>
    <p class="dim" style="font-size:12px;margin:0 0 6px">亮起來的，是你手上身分明確的證據。點一下可以看是哪一條。</p>

    <p class="dim" style="font-size:12px;margin:0 0 6px">虛線是本人說的，實線是證據。同一格裡對不上，就是破綻。</p>

    ${anonRows?`<div class="anonlist">${anonRows}</div>`:'<p class="dim" style="font-size:13px">還沒有。</p>'}
    <div class="sec-h"><h3>特徵比對</h3><span class="line"></span></div>
    <p class="dim" style="font-size:12px;margin:0 0 6px">${hl?`正在比對「${esc(hl.title)}」。亮起來的格子和證據裡的特徵一樣。`:'點上面一條身分不明的線索，這裡會亮出吻合的特徵。'}</p>
    <div class="traitgrid">${tg}</div>
    <div class="hintbox"><div class="grow" style="font-size:13px">卡住了？小茹陪你把案情從頭推一遍。<br><span class="dim">每次花 1 點行動力；連續用會說得更直白。會影響評價。</span></div><button class="btn small gold" data-a="hint">沙盤推演</button></div>`;
}

function actionsFor(t){
  const st=S.st, cs=S.cs; const out=[];
  for(const uid of st.hand){ const card=cardByUid(uid); if(!card) continue; const d=cardDef(card);
    if(d.tgt==='none'||d.tgt==='stmt') continue;
    if(!targetsFor(d.tgt).includes(t)) continue;
    const cost = cardCost(card,t); const ok = cardUsable(card,t) && cost<=st.energy;
    out.push(`<button class="act c-${d.cat}" data-a="play-on" data-u="${uid}" data-t="${t}" ${ok?'':'disabled'}><span class="ac">${cost}</span>${esc(d.name)}${card.up?'＋':''}</button>`); }
  const bc = basicCost(t);
  const bu = basicUsable(t) && st.energy>=bc;
  out.push(`<button class="act" data-a="basic-on" data-t="${t}" ${bu?'':'disabled'}><span class="ac">${bc}</span>${cs.clues[t]?'基本偵查：送驗':'基本偵查'}</button>`);
  return out.join('');
}

function divineHTML(d){
  const block = (up) => up
    ? '<svg width="46" height="30" viewBox="0 0 46 30"><path d="M3 4 Q23 -2 43 4 Q38 28 23 28 Q8 28 3 4Z" fill="#b8232f"/><path d="M6 6 Q23 1 40 6" stroke="#f3b7b0" stroke-width="3" fill="none"/></svg>'
    : '<svg width="46" height="30" viewBox="0 0 46 30"><path d="M3 26 Q23 32 43 26 Q38 2 23 2 Q8 2 3 26Z" fill="#8d1a24"/></svg>';
  if(d.mode==='poly'){
    const lie = d.out==='lie';
    return `<div style="text-align:center;padding:6px 0"><svg width="220" height="60" viewBox="0 0 220 60"><polyline fill="none" stroke="${lie?'#e0424e':'#6fbf8a'}" stroke-width="2" points="0,30 20,28 40,32 60,29 80,31 100,${lie?'6':'27'} 110,${lie?'54':'33'} 120,${lie?'10':'29'} 130,${lie?'50':'31'} 150,30 170,31 190,29 220,30"/></svg><div class="serif" style="font-size:20px;font-weight:900;color:${lie?'#ff8d95':'#9fe0b5'}">${lie?'有說謊反應':'沒有說謊反應'}</div><div class="msg">${esc(shorten(S.cs.stmts[d.sid].text,30))}</div><div class="dim" style="font-size:12px">測謊結果不具證據能力。</div></div>`;
  }
  const map = {true:[true,false,'聖筊','神明說：這句是真話。'], lie:[false,false,'陰筊','神明說：這句話有鬼。'], laugh:[true,true,'笑筊','神明笑而不答。']}[d.out];
  return `<div style="text-align:center;padding:6px 0"><div class="row" style="justify-content:center;gap:14px">${block(map[0])}${block(map[1])}</div><div class="serif" style="font-size:22px;font-weight:900;color:var(--joss2);margin-top:6px">${map[2]}</div><div class="msg">${map[3]}</div><div class="msg dim">「${esc(shorten(S.cs.stmts[d.sid].text,30))}」</div><div class="dim" style="font-size:12px">神明的答案，法庭不採信。</div></div>`;
}

/* =========================================================
   流程
   ========================================================= */
function startCampaign(){
  lsDel(SAVE_KEY);
  newRun('campaign');
  S.meta.stats.runs++; saveMeta();
  if(!S.meta.tutorialSeen){ U.slide=0; U.slidesNext='prologue'; S.screen='slides'; }
  else goPrologue();
}
function goPrologue(){ goStory('序　凌晨三點零七分', STORY.prologue, 'intro'); }
function goIntro(){
  const i = S.run.caseIdx;
  goStory(i===4 ? `卷宗一・紅線　終章　${CAMPAIGN[i].lunar}` : `卷宗一・紅線　第 ${i+1} 案　${CAMPAIGN[i].lunar}`, STORY.intro[i], 'case');
}
function startQuick(seed, diff, fromLink){
  lsDel(SAVE_KEY);
  newRun('quick', {diff, seed, fromLink});
  S.meta.stats.quick++; saveMeta();
  if(!S.meta.tutorialSeen){ U.slide=0; U.slidesNext='quickcase'; S.screen='slides'; }
  else beginCase();
}
function beginCase(){
  startCase();
  Object.assign(U,{tab:'map', sel:null, layer:null, filter:'全部', bossView:null, boardHL:null});
  S.screen='brief';
}
function storyNext(){
  const n = U.storyQ ? U.storyQ.next : 'title';
  if(n==='intro') goIntro();
  else if(n==='case') beginCase();
  else if(n==='reward') goReward();
  else if(n==='recon'){ reconState(); U.recon={opt:null, frags:[], msg:null}; S.screen='recon'; }
  else if(n==='choice'){ S.screen='choice'; }
  else if(n.indexOf('ending:')===0) goEnding(n.slice(7));
  else S.screen='title';
}
function goEnding(kind){
  U.endView={kind}; S.screen='ending';
  S.meta.endings[kind]=true; saveMeta();
  if(kind==='truth'||kind==='silence') lsDel(SAVE_KEY);
  sfx(kind==='truth'?'thread':'candle');
}
function goNight(){
  const ended = S.st.day;
  U.sel=null; U.layer=null;
  const r = runNight();
  U.nightView = {ev:r.ev, ended, cold:r.cold};
  S.boss=null; U.bossView=null;
  S.screen='night';
  sfx('candle');
}
function goResult(){
  const r = finishCase();
  U.resultView = r;
  const s = S.meta.stats; if(r.solved){ s.solved++; if(s[r.grade]!=null) s[r.grade]++; } else s.cold++;
  s.frags += (r.fragFound||[]).length;
  saveMeta();
  S.boss=null; U.bossView=null; U.layer=null;
  S.screen='result';
  sfx(r.solved?'win':'candle');
}
function afterResult(){
  const run=S.run;
  const h = run.history[run.history.length-1];
  const r = U.resultView || {};
  if(run.mode==='quick'){ lsDel(SAVE_KEY); S.run=null; S.cs=null; S.st=null; S.screen='title'; return; }
  if(run.over){ goStory('停職', STORY.endings.bad.paras, 'ending:bad'); return; }
  const i = run.caseIdx;
  if(i===4){ if(h.solved) goStory('終章　還原那一夜', STORY.reconIntro, 'recon'); else goStory('懸案', STORY.endings.lose.paras, 'ending:lose'); return; }
  const cp = S.cs.sus[S.cs.truth.culprit];
  const ctx = {culprit:h.culprit, victim:h.victim, cpr: cp.gender==='F'?'她':'他'};
  const o = STORY.outro[i];
  const paras = (h.solved?o.win(ctx):o.lose(ctx)).slice();
  for(const fid of (r.granted||[])){ paras.push('—'); if(FRAGS[fid].grant) paras.push(FRAGS[fid].grant); paras.push('[['+fid+']]'); }
  paras.push('—'); paras.push(...o.beat);
  goStory(`卷宗一・紅線　第 ${i+1} 案之後`, paras, 'reward');
}
function goReward(){
  const h = S.run.history[S.run.history.length-1];
  U.rewardView = {cards: rollRewards(h.grade), relics: h.grade==='S' ? relicChoices(2) : [], pickedCard:null, pickedRelic:null};
  S.screen='reward';
}
function nextCaseIntro(){
  S.run.caseIdx++;
  U.layer=null;
  goIntro();
}
function badEndCheck(){
  if(S.run && S.run.over){
    U.layer=null; S.boss=null; U.bossView=null;
    if(S.run.mode==='quick'){
      const r = finishCase(); r.suspended = true; U.resultView = r;
      S.meta.stats.cold++; saveMeta();
      S.screen='result'; sfx('bad'); return true;
    }
    goStory('停職', STORY.endings.bad.paras, 'ending:bad'); return true;
  }
  return false;
}
function openTarget(t){
  if(t==='V') U.layer={type:'victim'};
  else if(S.cs.sus[t]) U.layer={type:'sus', id:t};
  else if(S.cs.locs[t]) U.layer={type:'loc', id:t};
}
function selectCard(uid){
  if(U.sel && U.sel.uid===uid){ U.sel=null; return; }
  const card=cardByUid(uid); if(!card) return;
  const d=cardDef(card);
  U.sel={uid};
  if(d.tgt==='loc'||d.tgt==='place') switchTab('map');
  else if(d.tgt==='sus'||d.tgt==='person') switchTab('people');
  else if(d.tgt==='stmt'){ if(!targetsFor('stmt').length){ toast('還沒有能問的證詞','bad'); U.sel=null; } else U.layer={type:'pickStmt', uid}; }
  else if(d.tgt==='obj'){ const ts=targetsFor('obj').filter(t=>cardUsable(card,t)); if(!ts.length){ toast('沒有能送驗的物證——先去現場採證','bad'); U.sel=null; } else if(ts.length===1){ doPlay(ts[0]); } else U.layer={type:'pickObj', uid}; }
}
function switchTab(t){ clearFreshTab(); U.tab=t; U.boardHL=null; }
function clearFreshTab(){ const st=S.st; if(!st) return; if(U.tab==='ev') for(const id of st.foundOrder) delete st.fresh[id]; }
function doPlay(target){
  const sel=U.sel; if(!sel) return;
  const res = sel.basic ? basicAction(target) : playCard(sel.uid, target);
  if(res.err){ toast(res.err,'bad'); sfx('bad'); return; }
  U.sel=null;
  sfx(res.frags&&res.frags.length ? 'thread' : res.divine ? 'bell' : 'flip');
  U.layer={type:'reveal', res};
}
function afterRevealTips(res){
  const cs=S.cs;
  if(!res) return;
  const got = res.got||[];
  if(res.frags && res.frags.length) showTip('frag');
  if(got.some(g=>g.t==='clue' && cs.clues[g.id].cat!=='民俗' && !cs.clues[g.id].frag)) showTip('clue');
  if(got.some(g=>g.t==='stmt')) showTip('stmt');
  if(got.some(g=>g.t==='clue' && cs.clues[g.id].cat==='民俗')) showTip('folk');
  if(S.run.mode==='campaign' && S.run.caseIdx===0 && visiblePairs().length) showTip('conflict');
  if(S.st.foundOrder.filter(id=>!cs.clues[id].pre).length>=5) showTip('board');
}
function shareURL(code){
  if(EMBED) return '';
  try{ if(!/^https?:$/.test(location.protocol)) return ''; return location.origin + location.pathname + (code?('#case-'+code):''); }catch(e){ return ''; }
}
function doShare(text, code){
  const url = shareURL(code);
  const full = url ? text+'\n'+url : text;
  const fallback = () => {
    const done = () => { toast('已經複製到剪貼簿'); render(); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(full).then(done, ()=>{ U.layer={type:'shareText', text:full}; render(); }); return; }
    }catch(e){}
    U.layer={type:'shareText', text:full};
  };
  if(!EMBED && navigator.share){
    try{ navigator.share({title:'頭七', text, url:url||undefined}).catch(err=>{ if(!(err && err.name==='AbortError')) fallback(); }); return; }
    catch(e){}
  }
  fallback();
}

function render(){
  const app = $('#app'), layer = $('#layer');
  const keyOf = () => S.screen + ':' + U.tab;
  const key = keyOf();
  const main = document.getElementById('main'), side = document.getElementById('side');
  const keep = main && U._scrollKey===key ? main.scrollTop : 0;
  const keepSide = side ? side.scrollTop : 0;
  const lsc = document.getElementById('lscroll');
  const lkeep = lsc && U.layer && U._layerKey===U.layer ? lsc.scrollTop : 0;
  let html='';
  switch(S.screen){
    case 'title': html=vTitle(); break;
    case 'quick': html=vQuick(); break;
    case 'slides': html=vSlides(); break;
    case 'records': html=vRecords(); break;
    case 'story': html=vStory(); break;
    case 'brief': html=vBrief(); break;
    case 'play': html=vPlay(); break;
    case 'boss': html=vBoss(); break;
    case 'night': html=vNight(); break;
    case 'result': html=vResult(); break;
    case 'reward': html=vReward(); break;
    case 'rest': html=vRest(); break;
    case 'recon': html=vRecon(); break;
    case 'choice': html=vChoice(); break;
    case 'ending': html=vEnding(); break;
    default: html=vTitle();
  }
  app.innerHTML = html;
  app.dataset.screen = S.screen;
  const toastHTML = U.toastMsg && Date.now()-U.toastMsg.id < 2400 ? `<div class="toast ${U.toastMsg.kind==='bad'?'bad':''}">${esc(U.toastMsg.msg)}</div>` : '';
  layer.innerHTML = vLayer() + toastHTML;
  const m2 = document.getElementById('main');
  if(m2 && keep && U._scrollKey===key) m2.scrollTop = keep;
  const s2 = document.getElementById('side'); if(s2 && keepSide) s2.scrollTop = keepSide;
  U._scrollKey = key;
  const l2 = document.getElementById('lscroll');
  if(l2 && lkeep) l2.scrollTop = lkeep;
  if(U.layer){ U._layerKey = U.layer; U.layer._r = true; }
  postRender();
  ambient(ambForScreen());
}
function postRender(){
  const tw = document.querySelector('.tw');
  if(tw && tw.dataset.k !== U.twKey){
    U.twKey = tw.dataset.k; const full = tw.dataset.full; let i=0; tw.textContent='';
    clearInterval(U.twTimer);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ tw.textContent=full; }
    else U.twTimer = setInterval(()=>{ i+=1; const el=document.querySelector('.tw'); if(!el){ clearInterval(U.twTimer); return; } el.textContent=full.slice(0,i); if(i>=full.length) clearInterval(U.twTimer); }, 32);
  }
  const clash = document.getElementById('clash');
  if(clash){
    const a=document.getElementById('clash-a'), b=document.getElementById('clash-b'), p=clash.querySelector('svg.th path');
    if(a&&b&&p){
      const R=clash.getBoundingClientRect(), ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
      const z = clash.offsetWidth ? (R.width/clash.offsetWidth) : 1;
      const x1 = (ra.left-R.left+ra.width*0.72)/z, y1 = (ra.bottom-R.top-4)/z;
      const x2 = (rb.left-R.left+rb.width*0.3)/z, y2 = (rb.top-R.top+6)/z;
      const my = (y1+y2)/2;
      p.setAttribute('d', `M${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1+30).toFixed(1)} ${(my-10).toFixed(1)}, ${(x2-30).toFixed(1)} ${(my+10).toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`);
    }
  }
  const ta = document.getElementById('shareTa'); if(ta){ try{ ta.focus(); ta.select(); }catch(e){} }
}
let toastTimer=null;
function handle(e){
  const el = e.target.closest('[data-a]');
  if(!el || el.disabled) return;
  const a = el.dataset.a; const fn = A[a];
  if(!fn) return;
  e.preventDefault();
  audioInit();
  const prevToast = U.toastMsg;
  try{ fn(el.dataset, el, e); }
  catch(err){ console.error(err); toast('出了點問題：'+(err && err.message || err),'bad'); }
  save();
  render();
  if(U.toastMsg && U.toastMsg!==prevToast){ clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ U.toastMsg=null; const t=document.querySelector('.toast'); if(t) t.remove(); }, 2500); }
}
function readHash(){
  try{
    const m = /^#case-([0-9A-Za-z]{3}-?[0-9A-Za-z]{3})$/.exec(location.hash||'');
    if(!m) return null;
    const x = decodeCase(m[1]);
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    return x;
  }catch(e){ return null; }
}
function boot(data){
  loadMeta();
  const link = readHash();
  if(data && data.save && restore(data.save)){}
  else S.screen='title';
  if(link){ U.linkCode = link; if(S.screen==='title') S.screen='quick'; }
  document.addEventListener('click', handle);
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && U.layer){ A['close-layer'](); render(); return; }
    const t = e.target;
    if((e.key==='Enter'||e.key===' ') && t && t.getAttribute && t.getAttribute('role')==='button'){ handle(e); return; }
    if(e.key==='Enter' && t && t.id==='codeIn'){ e.preventDefault(); A['quick-code'](); render(); }
  });
  document.addEventListener('input', e=>{ if(e.target && e.target.id==='codeIn') U.quickCode = e.target.value; });
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); U.installEvt=e; if(S.screen==='title') render(); });
  let lastWide = isWide();
  window.addEventListener('resize', ()=>{ const w=isWide(); if(w!==lastWide){ lastWide=w; if(S.screen==='play') render(); } });
  render();
}
(function(){
  try{ if(window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({save: S.run ? snapshot() : null})); }catch(e){}
  const hot = window.claude && window.claude.hot;
  if(hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
