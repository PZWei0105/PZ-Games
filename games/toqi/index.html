<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>頭七</title>
<meta name="description" content="現代刑案推理牌組遊戲。死者只有七天——七天之內，靠證據拆穿謊言。主線《卷宗一：紅線》五案與終章，加上可以分享給朋友的單案挑戰。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=IBM+Plex+Mono:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#0c1312; --night2:#111b19; --night3:#172321; --night4:#1e2c29;
  --line:#283835; --line2:#34473f;
  --fluo:#d8e6e1; --fluo2:#a9bdb7; --fluo3:#7a918b;
  --manila:#d9c8a0; --manila2:#cbb886; --manila3:#b4a06c; --ink:#221c12; --ink2:#5b4f39;
  --thread:#b8232f; --thread2:#e0424e; --joss:#c9a13b; --joss2:#e3c262; --tape:#e7c01f;
  --c-fx:#5aa59b; --c-rec:#8196d8; --c-leg:#d39c47; --c-int:#cb6a5f; --c-folk:#c9a13b; --c-sp:#a9b6b2;
  --ok:#6fbf8a; --bad:#e0424e;
  --f-display:"Cactus Classical Serif","Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
html,body{height:100%;background:var(--night);}
body{margin:0;color:var(--fluo);font-family:var(--f-sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow:hidden;}
*{box-sizing:border-box;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--joss2);outline-offset:2px;}
#app{height:100%;display:flex;justify-content:center;background:
  radial-gradient(120% 60% at 50% -10%, rgba(120,190,170,.10), transparent 60%),
  repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px), var(--night);}
.col{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;position:relative;}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 18px;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.serif{font-family:var(--f-serif);}
.fhand{font-family:var(--f-hand);}
.dim{color:var(--fluo3);} .dim2{color:var(--fluo2);}
.row{display:flex;gap:8px;align-items:center;}
.grow{flex:1;min-width:0;}
.hidden{display:none!important;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--line2);background:var(--night3);font-weight:600;letter-spacing:.04em;transition:transform .12s, background .15s, border-color .15s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(180deg,#c7313c,#9b1b26);border-color:#e0424e55;color:#fff4ef;box-shadow:0 6px 18px -8px #e0424e99;}
.btn.gold{background:linear-gradient(180deg,#d8b24a,#a8832a);border-color:#f0d27a66;color:#1d1609;}
.btn.ghost{background:transparent;}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;}
.btn[disabled]{opacity:.35;pointer-events:none;}
.btn.block{width:100%;}
.linkbtn{color:var(--fluo2);text-decoration:underline;text-underline-offset:3px;font-size:13px;}

.footbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--night);}
.still,.still *{animation:none!important;}
.act[disabled]{opacity:.35;pointer-events:none;}
.paper.can{box-shadow:0 0 0 2px var(--joss2),0 0 20px -6px var(--joss2);}

/* ---------- title ---------- */
.title-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;position:relative;overflow:hidden;}
.title-lamp{position:absolute;inset:-20% -10% auto;height:70%;background:radial-gradient(50% 50% at 50% 30%, rgba(210,240,230,.12), transparent 70%);pointer-events:none;animation:flick 6s infinite;}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.45}49%{opacity:1}72%{opacity:.8}73%{opacity:1}}
.logo{position:relative;display:flex;align-items:center;gap:18px;}
.logo-v{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:clamp(84px,24vw,128px);line-height:1.02;color:#efe7d6;text-shadow:0 0 24px rgba(255,255,255,.08), 0 2px 0 #000;}
.logo-v span{display:block;}
.logo-side{display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.logo-seal{width:54px;height:54px;border:3px solid var(--thread2);color:var(--thread2);font-family:var(--f-display);font-size:18px;line-height:1.05;display:grid;place-items:center;text-align:center;transform:rotate(-6deg);border-radius:4px;box-shadow:inset 0 0 0 2px transparent;opacity:.9;}
.logo-sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.35em;color:var(--fluo3);}
.logo-tag{font-family:var(--f-hand);font-size:17px;color:var(--fluo2);max-width:13em;}
.thread-svg{position:absolute;inset:0;pointer-events:none;}
.thread-svg path{fill:none;stroke:var(--thread);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 4px #e0424e66);stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.8s .3s ease-out forwards;}
@keyframes draw{to{stroke-dashoffset:0}}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);position:relative;}
.menu-note{font-size:12px;color:var(--fluo3);text-align:center;}
.candles{display:flex;gap:6px;align-items:flex-end;justify-content:center;}
.candle{width:12px;display:flex;flex-direction:column;align-items:center;}
.candle .flame{width:8px;height:12px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 50% 70%, #fff6c8, #f2b640 55%, #e0424e00 75%);animation:fl 1.2s infinite alternate;transform-origin:50% 100%;}
.candle .wax{width:8px;height:18px;background:linear-gradient(90deg,#e8dfc9,#f7f1e3,#cfc4aa);border-radius:2px 2px 1px 1px;}
.candle.out .flame{visibility:hidden;}
.candle.out .wax{height:8px;background:#5a5347;}
.candle.today .wax{box-shadow:0 0 0 1px var(--joss2);}
@keyframes fl{0%{transform:scale(1,1) rotate(-2deg)}100%{transform:scale(.85,1.15) rotate(2deg)}}

/* ---------- story ---------- */
.story{flex:1;display:flex;flex-direction:column;}
.story .scroll{padding-top:28px;}
.story-kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.3em;color:var(--thread2);margin-bottom:14px;}
.story p{font-family:var(--f-serif);font-size:17px;line-height:1.95;margin:0 0 1.05em;color:#e7ece8;max-width:34em;}
.story p.q{font-family:var(--f-hand);font-size:18px;}
.story p.sys{font-family:var(--f-sans);font-size:13px;color:var(--joss2);border-left:2px solid var(--joss);padding-left:10px;}
.story .end{display:flex;justify-content:flex-end;padding:12px 16px calc(12px);border-top:1px solid var(--line);}
.fadein{animation:fadein .6s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- briefing ---------- */
.folder{margin-top:18px;background:linear-gradient(180deg,var(--manila),var(--manila2));color:var(--ink);border-radius:4px 14px 6px 6px;padding:18px 16px 16px;position:relative;box-shadow:0 18px 40px -20px #000;}
.folder:before{content:"";position:absolute;top:-14px;left:0;width:42%;height:16px;background:var(--manila);border-radius:8px 10px 0 0;}
.folder .no{font-family:var(--f-mono);font-size:11px;color:var(--ink2);letter-spacing:.08em;}
.folder h2{font-family:var(--f-display);font-size:26px;line-height:1.25;margin:4px 0 10px;text-wrap:balance;}
.folder .stamp-conf{position:absolute;right:14px;top:14px;border:2px solid #a31d28;color:#a31d28;font-family:var(--f-display);padding:2px 8px;transform:rotate(8deg);font-size:14px;opacity:.85;}
.folder p{margin:0 0 10px;font-size:14.5px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0;}
.kv dt{color:var(--ink2);} .kv dd{margin:0;}
.brief-sus{display:grid;gap:8px;margin-top:12px;}
.brief-sus .bs{display:flex;gap:10px;align-items:center;background:#0000000d;border-radius:6px;padding:6px 8px;}

/* ---------- HUD ---------- */
.hud{padding:10px 16px 8px;background:linear-gradient(180deg,#0f1817,#0c1312);border-bottom:1px solid var(--line);position:relative;z-index:3;}
.hud-top{display:flex;align-items:center;gap:10px;}
.hud-title{flex:1;min-width:0;font-family:var(--f-serif);font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud-no{font-family:var(--f-mono);font-size:10.5px;color:var(--fluo3);}
.iconbtn{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);background:var(--night2);}
.hud-mid{display:flex;align-items:flex-end;gap:12px;margin-top:6px;}
.hud-days{display:flex;flex-direction:column;gap:2px;}
.hud-label{font-size:10.5px;letter-spacing:.12em;color:var(--fluo3);}
.hud-cred{flex:1;min-width:0;}
.bar{height:8px;border-radius:4px;background:#26302e;overflow:hidden;position:relative;}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8d1a24,var(--thread2));border-radius:4px;transition:width .4s;}
.bar.low i{animation:pulse 1s infinite alternate;}
@keyframes pulse{to{filter:brightness(1.6)}}
.hud-en{display:flex;gap:4px;align-items:center;}
.pip{width:14px;height:14px;transform:rotate(45deg);border:1.5px solid var(--joss);border-radius:2px;background:transparent;transition:background .2s;}
.pip.on{background:var(--joss2);box-shadow:0 0 8px #e3c26277;}
.window-banner{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fluo2);}
.window-banner b{font-family:var(--f-mono);color:var(--fluo);font-weight:600;}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:var(--night);position:relative;z-index:2;}
.tab{padding:10px 0 9px;font-size:14px;color:var(--fluo3);position:relative;letter-spacing:.08em;}
.tab.on{color:var(--fluo);}
.tab.on:after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:var(--thread2);}
.tab .dot{position:absolute;top:8px;margin-left:3px;width:7px;height:7px;border-radius:50%;background:var(--thread2);}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:16px 0 8px;}
.sec-h h3{margin:0;font-size:13px;letter-spacing:.2em;color:var(--fluo2);font-weight:600;}
.sec-h .line{flex:1;height:1px;background:var(--line);}

/* ---------- seal ---------- */
.seal{flex:none;width:40px;height:40px;border:2px solid var(--thread2);color:var(--thread2);border-radius:5px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;line-height:1;background:#e0424e0d;}
.seal.small{width:30px;height:30px;font-size:16px;}
.seal.gold{border-color:var(--joss);color:var(--joss2);background:#c9a13b10;}

/* ---------- map ---------- */
.map{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--night2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:104px;transition:border-color .15s, transform .12s, opacity .15s;}
.tile:active{transform:scale(.98);}
.tile.scene{grid-column:1/-1;min-height:96px;background:
  linear-gradient(135deg, transparent 0 78%, var(--tape) 78% 81%, #111 81% 84%, var(--tape) 84% 87%, transparent 87%), var(--night2);}
.tile .tname{font-weight:700;font-size:15px;line-height:1.3;}
.tile .tmeta{font-size:12px;color:var(--fluo3);}
.leads{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.lead{width:7px;height:7px;border-radius:50%;background:var(--fluo3);opacity:.9;}
.lead.fx{background:var(--c-fx);} .lead.rec{background:var(--c-rec);} .lead.leg{background:var(--c-leg);} .lead.int{background:var(--c-int);}
.leads .none{font-size:11px;color:var(--fluo3);}
.cam{font-family:var(--f-mono);font-size:10.5px;color:var(--fluo3);}
.cam.warn{color:var(--joss2);} .cam.gone{color:var(--fluo3);text-decoration:line-through;}
.targeting .tile, .targeting .person{opacity:.35;}
.targeting .can{opacity:1;border-color:var(--joss2);box-shadow:0 0 0 1px var(--joss2), 0 0 18px -6px var(--joss2);animation:glow 1.2s infinite alternate;}
@keyframes glow{to{box-shadow:0 0 0 1px var(--joss2), 0 0 26px -4px var(--joss2);}}
.victim-tile{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;}

/* ---------- people ---------- */
.people{display:flex;flex-direction:column;gap:10px;}
.person{display:flex;gap:12px;align-items:stretch;text-align:left;border:1px solid var(--line);background:var(--night2);border-radius:var(--r);padding:10px;transition:border-color .15s, opacity .15s;}
.person .pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.person .pname{font-weight:700;font-size:16px;}
.person .pnick{font-family:var(--f-hand);color:var(--fluo2);font-size:14px;margin-left:6px;font-weight:400;}
.person .pjob{font-size:12.5px;color:var(--fluo2);}
.person.victim{background:linear-gradient(90deg,#1b1414,var(--night2));border-color:#3a2626;}
.mug{flex:none;width:72px;height:96px;border-radius:4px;overflow:hidden;background:#18211f;position:relative;}
.mug svg{display:block;width:100%;height:100%;}
.mug.big{width:120px;height:160px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--fluo2);white-space:nowrap;}
.badge.red{border-color:#e0424e88;color:#ff8d95;}
.badge.gold{border-color:#c9a13b88;color:var(--joss2);}
.cracks{display:flex;gap:3px;}
.cracks i{width:12px;height:6px;border-radius:2px;background:#2d3a37;}
.cracks i.on{background:var(--thread2);}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{font-size:11.5px;line-height:1.5;padding:1px 7px;border-radius:4px;background:#ffffff0d;border:1px solid #ffffff14;color:var(--fluo2);white-space:nowrap;}
.chip.t{background:#c9a13b1a;border-color:#c9a13b55;color:#ecd48a;}
.chip.hl{background:var(--joss2);color:#1a1406;border-color:var(--joss2);}
.paper .chip{background:#00000010;border-color:#00000024;color:var(--ink);}
.paper .chip.t{background:#a1720c1c;border-color:#8b5e0a55;color:#5a3c05;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:4px;border:1px solid;white-space:nowrap;}
.tag.who{border-color:#8196d866;color:#b8c5f0;}
.tag.slot{border-color:#5aa59b66;color:#9fd6cd;}
.tag.slot.s1{border-color:#e0424e88;color:#ff9aa1;background:#e0424e14;}
.tag.loc{border-color:#d39c4766;color:#f0c98a;}
.tag.obj{border-color:#a9b6b266;color:#d2dbd8;}
.tag.rel{border-color:#cb6a5f66;color:#f0a79f;}
.tag.time{border-color:#c9a13b66;color:#ecd48a;}
.tag.neg{border-style:dashed;}
.tag.anon{border-color:#ffffff33;color:var(--fluo2);background:#ffffff08;}
.paper .tag.who{color:#26356b;border-color:#26356b55;} .paper .tag.slot{color:#1e5a52;border-color:#1e5a5255;}
.paper .tag.slot.s1{color:#8e1620;border-color:#8e162077;background:#8e16200d;}
.paper .tag.loc{color:#6e4a0f;border-color:#6e4a0f55;} .paper .tag.obj{color:#3c3c3c;border-color:#3c3c3c44;}
.paper .tag.rel{color:#7d2a22;border-color:#7d2a2255;} .paper .tag.time{color:#6d5207;border-color:#6d520755;}
.paper .tag.anon{color:var(--ink2);border-color:#00000033;background:#0000000a;}

/* ---------- evidence (paper tag) ---------- */
.ev-list{display:flex;flex-direction:column;gap:12px;}
.paper{position:relative;background:linear-gradient(180deg,var(--manila),var(--manila2));color:var(--ink);border-radius:6px;padding:12px 12px 12px 18px;box-shadow:0 10px 24px -16px #000, inset 0 0 0 1px #00000014;text-align:left;width:100%;display:block;}
.paper:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:6px 0 0 6px;background:var(--cat,#777);}
.paper .ptop{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.paper .pcat{font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:700;}
.paper .pno{font-family:var(--f-mono);font-size:10.5px;color:var(--ink2);margin-left:auto;}
.paper .ptitle{font-family:var(--f-serif);font-weight:900;font-size:16px;line-height:1.35;margin:2px 0 4px;}
.paper .ptime{font-family:var(--f-mono);font-size:11.5px;color:#6a5a3a;}
.paper .ptext{font-size:14px;line-height:1.7;margin:6px 0 8px;}
.paper .ptags{display:flex;flex-wrap:wrap;gap:5px;}
.paper.cat-鑑識{--cat:var(--c-fx);} .paper.cat-調閱{--cat:var(--c-rec);} .paper.cat-走訪{--cat:var(--c-leg);} .paper.cat-民俗{--cat:var(--c-folk);} .paper.cat-訊問{--cat:var(--c-int);}
.paper.folk{background:linear-gradient(180deg,#f0dc86,#e2c865);}
.paper.folk .ptext{font-family:var(--f-hand);font-size:16px;color:#6e1a15;}
.paper.cctv .ptext{font-family:var(--f-mono);font-size:12.5px;background:#11201c;color:#9fe0bd;padding:8px 10px;border-radius:4px;letter-spacing:.01em;position:relative;overflow:hidden;}
.paper.cctv .ptext:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff0a 0 1px,transparent 1px 3px);pointer-events:none;}
.paper.gone{filter:grayscale(1) brightness(.7);}
.newtag{font-family:var(--f-mono);font-size:10px;font-weight:600;background:var(--thread);color:#fff;padding:0 5px;border-radius:3px;letter-spacing:.08em;}
.stampnote{position:absolute;right:10px;bottom:10px;font-family:var(--f-display);color:#a31d28;border:1.5px solid #a31d28;padding:0 6px;font-size:12px;transform:rotate(-6deg);opacity:.8;}
.paper.pick{outline:2px solid transparent;transition:outline-color .15s, transform .12s;}
.paper.pick.on{outline-color:var(--thread2);transform:translateY(-2px);}
.paper.mini .ptext{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;}
.filters{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fchip{flex:none;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--fluo2);}
.fchip.on{background:var(--fluo);color:var(--night);border-color:var(--fluo);}

/* ---------- statements ---------- */
.stmts{display:flex;flex-direction:column;gap:10px;}
.stmt{border-left:3px solid var(--c-int);background:var(--night3);border-radius:0 8px 8px 0;padding:10px 12px;position:relative;}
.stmt .q{font-family:var(--f-hand);font-size:16px;line-height:1.65;color:#eef3f0;}
.stmt .q:before{content:"「";color:var(--fluo3);} .stmt .q:after{content:"」";color:var(--fluo3);}
.stmt .srow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.stmt.exposed{border-left-color:#555;}
.stmt.exposed .q{color:var(--fluo3);text-decoration:line-through;text-decoration-color:var(--thread2);text-decoration-thickness:2px;}
.stmt .exp-stamp{position:absolute;right:10px;top:8px;font-family:var(--f-display);font-size:14px;color:var(--thread2);border:1.5px solid var(--thread2);padding:0 6px;transform:rotate(8deg);}
.stmt.confess{border-left-color:var(--ok);}
.stmt.pick{cursor:pointer;}
.stmt.pick.on{outline:2px solid var(--joss2);}
.divine{font-size:11.5px;padding:1px 7px;border-radius:4px;background:#c9a13b22;color:var(--joss2);border:1px solid #c9a13b55;}

/* ---------- board ---------- */
.board{overflow-x:auto;margin:0 -16px;padding:0 16px;}
.tl{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:12.5px;}
.tl th{font-weight:600;color:var(--fluo2);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tl th.s1{color:#ff9aa1;}
.tl td{vertical-align:top;padding:6px;border-bottom:1px solid var(--line);}
.tl td.s1{background:#e0424e0a;}
.tl .who{font-weight:700;white-space:nowrap;}
.ent{display:block;margin:0 0 4px;padding:2px 6px;border-radius:4px;line-height:1.45;}
.ent.claim{border:1px dashed #d39c4788;color:#f0c98a;}
.ent.claim.exp{text-decoration:line-through;opacity:.55;}
.ent.ev{border:1px solid #8196d888;color:#c4d0f5;background:#8196d812;}
.ent.ev.not{border-style:dashed;}
.ent small{display:block;font-size:10.5px;color:var(--fluo3);}
.anonlist{display:flex;flex-direction:column;gap:8px;}
.anon-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--night2);border:1px solid var(--line);text-align:left;width:100%;}
.mm{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;}
.mm .who{font-weight:700;}
.traitgrid{overflow-x:auto;margin:0 -16px;padding:0 16px;}
.tg{border-collapse:collapse;font-size:12px;min-width:480px;width:100%;}
.tg th,.tg td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.tg th{color:var(--fluo3);font-weight:500;}
.tg td.m{color:#1a1406;background:var(--joss2);border-radius:3px;}
.hintbox{margin-top:14px;border:1px dashed var(--line2);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;}

/* ---------- dock / hand ---------- */
.dock{border-top:1px solid var(--line);background:linear-gradient(180deg,#0e1716,#0a100f);padding:8px 0 10px;position:relative;z-index:3;}
.dock-info{display:flex;align-items:center;gap:10px;padding:0 16px 6px;font-size:12px;color:var(--fluo3);}
.hand{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 4px;scrollbar-width:none;}
.hand::-webkit-scrollbar{display:none;}
.card{flex:none;width:84px;height:118px;border-radius:9px;position:relative;text-align:left;padding:22px 8px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#1b2826,#141e1c);border:1px solid var(--line2);transition:transform .15s, box-shadow .15s, opacity .15s;overflow:hidden;}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--cc,#777);}
.card .cost{position:absolute;top:8px;left:7px;width:20px;height:20px;transform:rotate(45deg);border:1.5px solid var(--joss);background:#0c1312;display:grid;place-items:center;}
.card .cost span{transform:rotate(-45deg);font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--joss2);}
.card .cat{position:absolute;top:9px;right:8px;font-size:10px;color:var(--cc);letter-spacing:.1em;}
.card .cname{font-family:var(--f-serif);font-weight:900;font-size:15px;line-height:1.2;margin-top:8px;}
.card .cup{font-size:10px;color:var(--joss2);}
.card .ctxt{font-size:10px;line-height:1.35;color:var(--fluo3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 2px var(--joss2), 0 10px 22px -8px #000;}
.card.poor{opacity:.45;}
.card.c-鑑識{--cc:var(--c-fx);} .card.c-調閱{--cc:var(--c-rec);} .card.c-走訪{--cc:var(--c-leg);} .card.c-訊問{--cc:var(--c-int);} .card.c-民俗{--cc:var(--c-folk);background:linear-gradient(180deg,#2a2412,#171409);} .card.c-特殊{--cc:var(--c-sp);}
.card.basic{border-style:dashed;background:#0f1716;--cc:#56645f;}
.card.big{width:132px;height:184px;padding:28px 12px 12px;}
.card.big .cname{font-size:20px;}
.card.big .ctxt{-webkit-line-clamp:6;font-size:12px;}
.card.big .cost{width:24px;height:24px;top:10px;left:10px;}
.endday{flex:none;width:72px;height:118px;border-radius:9px;border:1px solid #c9a13b55;background:#15150e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--joss2);}
.selbar{position:absolute;left:10px;right:10px;bottom:calc(100% + 8px);background:#101a18f2;border:1px solid var(--joss);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px -12px #000;backdrop-filter:blur(6px);animation:fadein .2s both;}
.selbar .st{flex:1;min-width:0;font-size:13px;}
.selbar .st b{font-family:var(--f-serif);font-size:15px;}

/* ---------- sheet ---------- */
#layer{position:fixed;inset:0;z-index:20;pointer-events:none;}
.veil{position:absolute;inset:0;background:#000a;animation:fadein .2s both;pointer-events:auto;}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:600px;max-height:88%;background:var(--night2);border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;pointer-events:auto;animation:sheetin .28s cubic-bezier(.2,.8,.2,1) both;padding-bottom:env(safe-area-inset-bottom,0px);}
@keyframes sheetin{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);}
.sheet-h h2{margin:0;font-family:var(--f-serif);font-size:19px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sheet .scroll{padding-top:12px;}
.sheet-f{padding:10px 16px 12px;border-top:1px solid var(--line);display:flex;gap:8px;}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);}
.actions{display:flex;flex-wrap:wrap;gap:8px;}
.act{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--night3);font-size:13px;}
.act .ac{font-family:var(--f-mono);color:var(--joss2);font-size:12px;}
.act.c-鑑識{border-color:#5aa59b88;} .act.c-調閱{border-color:#8196d888;} .act.c-走訪{border-color:#d39c4788;} .act.c-訊問{border-color:#cb6a5f88;} .act.c-民俗{border-color:#c9a13b88;}

/* ---------- overlay (reveal / result) ---------- */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;}
.ov-box{width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--night2);border:1px solid var(--line2);border-radius:16px;animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both;overflow:hidden;}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.ov-h{padding:14px 16px 6px;display:flex;align-items:center;gap:10px;}
.ov-h h2{margin:0;font-family:var(--f-serif);font-size:20px;font-weight:900;}
.ov-b{padding:6px 16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.ov-f{padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);}
.flipin{animation:flipin .45s cubic-bezier(.2,.8,.2,1) both;}
@keyframes flipin{from{transform:perspective(600px) rotateX(-70deg) translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.msg{font-size:13.5px;color:var(--fluo2);}

/* ---------- confront ---------- */
.clash{position:relative;display:flex;flex-direction:column;gap:30px;padding:6px 0;}
.clash svg.th{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.clash svg.th path{fill:none;stroke:var(--thread2);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1s .15s ease-out forwards;filter:drop-shadow(0 0 5px #e0424e);}
.clash.miss svg.th path{stroke:#6b7a76;filter:none;stroke-dasharray:6 6;animation:none;stroke-dashoffset:0;}
.bigstamp{position:absolute;left:50%;top:50%;font-family:var(--f-display);font-size:64px;color:var(--thread2);border:5px solid var(--thread2);padding:0 18px;border-radius:8px;background:#0c1312cc;transform:translate(-50%,-50%) rotate(-10deg);animation:stamp .5s .9s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none;letter-spacing:.1em;white-space:nowrap;text-shadow:0 0 12px #e0424e88;}
.bigstamp.gray{color:#8a9894;border-color:#8a9894;text-shadow:none;animation-delay:.2s;}
.bigstamp.gold{color:var(--joss2);border-color:var(--joss2);}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-10deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}
.shake{animation:shake .4s 1.05s both;}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.explain{border-left:3px solid var(--thread2);padding:8px 12px;background:#e0424e10;border-radius:0 8px 8px 0;font-size:14px;line-height:1.7;animation:fadein .4s 1.2s both;}
.explain.miss{border-left-color:#6b7a76;background:#ffffff08;animation-delay:.3s;}
.react{font-family:var(--f-hand);font-size:16px;color:var(--fluo2);animation:fadein .4s 1.4s both;}

/* ---------- boss ---------- */
.boss{flex:1;display:flex;flex-direction:column;background:radial-gradient(70% 45% at 50% 18%, rgba(255,236,190,.16), transparent 65%), #070a0a;}
.boss-top{padding:14px 16px 0;display:flex;align-items:center;gap:10px;}
.boss-stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 16px 0;}
.lampcone{position:relative;}
.lampcone:before{content:"";position:absolute;left:50%;top:-40px;width:260px;height:230px;transform:translateX(-50%);background:radial-gradient(50% 60% at 50% 0%, rgba(255,240,200,.14), transparent 70%);pointer-events:none;}
.heart{display:flex;gap:5px;justify-content:center;}
.heart i{width:34px;height:8px;border-radius:2px;background:linear-gradient(90deg,#8d1a24,var(--thread2));position:relative;}
.heart i.cl{background:#2b3532;}
.heart i.cl:after{content:"";position:absolute;inset:-2px 40%;background:#070a0a;transform:skewX(-30deg);}
.roundlabel{font-size:11px;letter-spacing:.3em;color:var(--fluo3);}
.speech{position:relative;margin:4px 16px 0;background:#e9e3d4;color:#1c1811;border-radius:12px;padding:14px 16px;font-family:var(--f-hand);font-size:18px;line-height:1.7;min-height:88px;}
.speech:before{content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom-color:#e9e3d4;border-top:0;}
.speech .who{font-family:var(--f-sans);font-size:12px;color:#6b624f;display:block;margin-bottom:4px;letter-spacing:.1em;}
.boss-log{padding:10px 16px;display:flex;flex-direction:column;gap:6px;}
.boss-log .bl{font-size:12.5px;color:var(--fluo3);border-left:2px solid var(--line2);padding-left:8px;}
.boss-log .bl.ok{border-left-color:var(--thread2);color:var(--fluo2);}
.boss-actions{margin-top:auto;padding:12px 16px 14px;display:flex;gap:10px;border-top:1px solid #ffffff10;}
.caret{display:inline-block;width:.5em;height:1em;background:#1c1811;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}

/* ---------- night ---------- */
.night{flex:1;display:flex;flex-direction:column;background:radial-gradient(60% 40% at 50% 28%, rgba(242,182,64,.10), transparent 60%), #050707;}
.night .candles{margin-top:36px;transform:scale(1.5);}
.night h2{text-align:center;font-family:var(--f-display);font-size:30px;margin:28px 0 4px;letter-spacing:.2em;}
.night .sub{text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--fluo3);letter-spacing:.25em;}
.nev{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #ffffff0d;opacity:0;animation:fadein .6s both;}
.nev p{margin:0;font-family:var(--f-serif);font-size:15px;line-height:1.8;}
.nev.folk p{font-family:var(--f-hand);font-size:16px;color:#f0dc8f;}
.blow .flame{animation:blowout 1.2s .6s forwards!important;}
@keyframes blowout{0%{transform:scale(1)}40%{transform:scale(.6,1.4) rotate(-20deg);opacity:.8}100%{transform:scale(0);opacity:0}}

/* ---------- result ---------- */
.result{flex:1;display:flex;flex-direction:column;}
.grade{font-family:var(--f-display);font-size:92px;line-height:1;color:var(--thread2);text-align:center;margin-top:8px;text-shadow:0 0 30px #e0424e55;}
.grade.cold{color:#8a9894;text-shadow:none;font-size:72px;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
.stat{background:var(--night2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;}
.stat span{font-size:11px;color:var(--fluo3);}
.confession{font-family:var(--f-hand);font-size:16.5px;line-height:1.9;white-space:pre-wrap;background:var(--night2);border-left:3px solid var(--thread2);padding:12px 14px;border-radius:0 8px 8px 0;}

/* ---------- reward / rest ---------- */
.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.choice{display:flex;flex-direction:column;align-items:center;gap:8px;}
.rest-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rest-opt{border:1px solid var(--line2);border-radius:12px;background:var(--night2);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px;}
.rest-opt b{font-family:var(--f-serif);font-size:17px;}
.rest-opt span{font-size:12.5px;color:var(--fluo2);}
.relic{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--night3);text-align:left;width:100%;}
.relic b{display:block;font-size:14px;}
.relic span{font-size:12px;color:var(--fluo2);}
.deckgrid{display:flex;flex-wrap:wrap;gap:8px;}

/* ---------- toast / tip ---------- */
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:#1b2826f2;border:1px solid var(--line2);border-radius:999px;padding:8px 16px;font-size:13px;pointer-events:none;animation:toast 2.4s both;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:40;}
.toast.bad{border-color:#e0424e88;color:#ffb3b8;}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.tip{position:absolute;left:12px;right:12px;bottom:calc(100% + 10px);display:flex;gap:10px;align-items:flex-start;background:#15201e;border:1px solid #8196d866;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;pointer-events:auto;animation:fadein .3s both;box-shadow:0 12px 30px -14px #000;}
.tip .av{flex:none;width:30px;height:30px;border-radius:50%;background:#8196d833;color:#c4d0f5;display:grid;place-items:center;font-family:var(--f-serif);font-weight:900;font-size:14px;}
.tip b{color:#c4d0f5;}

/* ---------- help ---------- */
.help-item{padding:12px 0;border-bottom:1px solid var(--line);}
.help-item h4{margin:0 0 4px;font-family:var(--f-serif);font-size:17px;}
.help-item p{margin:0;color:var(--fluo2);font-size:14px;line-height:1.75;}
.slides{flex:1;display:flex;flex-direction:column;}
.slide-illu{height:170px;border-radius:12px;background:var(--night2);border:1px solid var(--line);display:grid;place-items:center;margin:18px 0 14px;overflow:hidden;position:relative;}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0;}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2);}
.dots i.on{background:var(--thread2);}


/* =========================================================
   新增：寬螢幕、三要件、紅線卷宗、終章、結局、設定
   ========================================================= */
.h2{font-size:24px;margin:0 0 6px;font-weight:900;text-wrap:balance;line-height:1.35;}
.story p.divider{text-align:center;color:var(--fluo3);font-size:12px;font-family:var(--f-sans);letter-spacing:.3em;margin:10px 0 18px;max-width:none;}
.tip.inline{position:relative;left:auto;right:auto;bottom:auto;box-shadow:none;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--fluo3);}
.legend span{display:flex;gap:5px;align-items:center;}
.objective{margin-top:8px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--fluo);background:#e3c26210;border:1px solid #c9a13b44;border-radius:8px;padding:6px 10px;line-height:1.5;}
.obj-k{flex:none;font-size:11px;letter-spacing:.15em;color:var(--joss2);padding-top:1px;}
.card .ico{position:absolute;right:6px;bottom:6px;width:26px;height:26px;color:var(--cc,#9aa);opacity:.32;pointer-events:none;}
.card.big .ico{width:40px;height:40px;right:10px;bottom:10px;}
.card.sel .ico{opacity:.6;}
.mug.hit{animation:shake .35s both;}

/* 三要件 */
.pillars{display:flex;flex-direction:column;gap:6px;}
.prow{display:grid;grid-template-columns:5.2em 1fr auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--night2);}
.prow.away{opacity:.55;}
.pname2{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pdots{display:flex;gap:6px;flex-wrap:wrap;}
.pdot{font-size:12px;padding:3px 10px;border-radius:999px;border:1px dashed var(--line2);color:var(--fluo3);}
.pdot.on{border-style:solid;border-color:var(--joss);background:#c9a13b22;color:var(--joss2);}
.pdot[disabled]{cursor:default;}
.pstate{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.badge.linkish{cursor:pointer;}
.anon-row.on{border-color:var(--joss2);}
.tg td.full{color:var(--joss2);font-weight:700;}

/* 紅線卷宗 */
.paper.frag{background:linear-gradient(180deg,#eadad5,#dbc2bc);--cat:var(--thread);}
.paper.frag .ptext{white-space:pre-wrap;}
.paper.frag.mini .ptext{white-space:normal;}
.paper .tag.thread{border-color:#8e162077;color:#8e1620;background:#8e16200d;}
.tag.thread{border-color:#e0424e88;color:#ff9aa1;}
.seal.thread{border-color:var(--thread2);color:#ff9aa1;background:#e0424e18;}
.fragcard{display:flex;gap:12px;align-items:flex-start;border:1px solid #b8232f55;background:linear-gradient(180deg,#1d1414,#140f0f);border-radius:10px;padding:12px;text-align:left;width:100%;}
.fragcard .fc-date{font-size:11px;color:#ff9aa1;letter-spacing:.1em;}
.fragcard .fc-title{font-family:var(--f-serif);font-weight:900;font-size:16px;line-height:1.4;}
.fragcard .fc-text{font-size:13.5px;line-height:1.75;color:var(--fluo2);white-space:pre-wrap;margin-top:4px;}
.fragcard.pick{cursor:pointer;transition:border-color .15s, box-shadow .15s;}
.fragcard.pick.on{border-color:var(--thread2);box-shadow:0 0 0 1px var(--thread2),0 0 22px -8px var(--thread2);}
.fraglist{display:flex;flex-direction:column;gap:8px;}
.fraglist.full{gap:16px;}
.fragbanner,.fragnote{display:flex;gap:10px;align-items:flex-start;border:1px solid #e0424e66;background:#e0424e12;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;color:#ffd6d9;}
.fragbanner svg,.fragnote svg{flex:none;color:var(--thread2);margin-top:2px;}
.fragnote{margin:12px 0 0;}

/* 真相重建 */
.tl.truth td{font-size:12.5px;line-height:1.55;min-width:9em;}
.tl.truth td.who{min-width:6em;}
.tl.truth tr.cul td{background:#e0424e0d;}
.whys{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.why{font-size:13.5px;line-height:1.7;display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line2);padding-left:10px;}
.why.cul{border-left-color:var(--thread2);}
.why b{font-size:14px;}

/* 終章：還原 */
.recon{background:radial-gradient(60% 35% at 50% 0%, rgba(224,66,78,.08), transparent 70%), var(--night);}
.qtitle{font-family:var(--f-display);font-size:26px;line-height:1.4;margin:6px 0 14px;text-wrap:balance;font-weight:400;}
.qprog{display:flex;gap:6px;margin:4px 0 14px;}

function slotName(s){ return ['案發前','案發時段','案發後'][s]; }

function genCase(seed, opts){
  opts = opts || {};
  let last = null;
  for(let k=0;k<80;k++){
    let cs = null;
    try { cs = buildCase(((seed>>>0) + k*104729)>>>0, opts); }
    catch(e){ last = e && e.stack || e; continue; }
    const v = validateCase(cs);
    if(v.ok){ cs.baseSeed = seed>>>0; return cs; }
    last = v.errs.join('; ');
  }
  throw new Error('案件生成失敗：'+last);
}

function buildCase(seed, opts){
  const r = mkR(seed);
  const A = opts.authored || null;
  const diff = opts.diff || 2;
  const finale = !!(opts.finale || (A && A.finale));

  const cs = { seed, diff, finale, n, setting:setting.key, place:setting.place, H, authored: A ? A.key : null,
    victim:null, sus:{}, susOrder:[], locs:{}, locOrder:[], clues:{}, stmts:{}, bossDef:{}, truth:{}, frags:[],
    slots:[0,1,2].map(s=>({range:rangeOf(s), spoken:spokenOf(s), name:slotName(s)})), W:null, scared:null };
  let cid=0, sid=0;
  const addClue = o => { const id='c'+(++cid); cs.clues[id]=Object.assign({id,cat:'鑑識',kind:'misc',src:'L0',ord:5,title:'',time:'',text:'',chips:[],facts:[],adm:true,destr:false,keep:0,guard:false,anon:false,unlock:false,searchOnly:false,shoujing:false,pre:false,obj:null,labOf:null,who:null,frag:null},o); return id; };
  const addStmt = o => { const id='s'+(++sid); cs.stmts[id]=Object.assign({id,ord:5,gate:null,auto:false,onExp:null,truth:true,topic:'misc',fact:null},o); return id; };

  // ---------- 人物 ----------
  const usedSur=new Set(), usedGiven=new Set(), usedNick=new Set();
  function mkPerson(g){
    let sur, given, nick, tries=0;
    do { sur=r.pick(SURNAMES); } while(usedSur.has(sur)); usedSur.add(sur);
    do { given=r.pick(g==='M'?MALE_GIVEN:FEMALE_GIVEN); } while(usedGiven.has(given)); usedGiven.add(given);
    do { nick = r.chance(0.55) ? '阿'+given.slice(-1) : r.pick(g==='M'?NICK_M:NICK_F); tries++; }
    while((usedNick.has(nick)||RESERVED_NICK.has(nick)) && tries<40);

    usedNick.add(nick);
    return {name:sur+given, nick, gender:g};
  }
  function rollTraits(g, e){

    t.betel = g==='M' ? r.chance(0.3) : r.chance(0.05);
    t.vehicle = r.w(VEHICLES.map(v=>[v, v.includes('機車')?3:1.5]));
    t.shoe = String(g==='M' ? r.pick([25,26,26,27,27,28]) : r.pick([23,23,24,24,25]));
    t.mark = r.pick(g==='M'?MARK_M:MARK_F);
    t.smell = (e && OCC_SMELL.has(e.smell)) ? e.smell : (t.betel?'檳榔味':(t.smoke!=='none'?'菸味':'汗味'));
    return t;

  cs.susOrder = r.shuffle(ids);

    text: finale ? '鎮安宮？我十年沒去過那間廟了。' : `${sceneShort}？我好幾個月沒去那邊了。那天晚上我連附近都沒經過。`});
  const sM = addStmt({who:cId,topic:'means',ord:2,truth:false,gate:{clue:cW},fact:F.nottouch(cId,'W'),
    text: finale ? '香爐？那種東西，廟裡的人誰都能拿。我碰都沒碰過。' : `那${WCL}${W.name}？我從來沒看過，更不用說碰。`});
  const sR = addStmt({who:cId,topic:'motive',ord:1,truth:false,fact:F.norel(cId,C.motive),
    text: finale ? '我跟那個尪姨無冤無仇。七年前的案子？意外就是意外。' : (Cm.lie ? r.pick(Cm.lie) : vfix(r.pick(M.lie)))});
  addStmt({who:cId,topic:'contact',ord:2,truth:false,fact:F.nocontact(cId,null),
    text: finale ? '那天我沒跟她聯絡。我們很多年沒講話了。' : '那天我們沒聯絡。最後一次講話，大概是上禮拜吧。'});
  if(!finale) addStmt({who:cId,topic:'misc',ord:3,truth:true,fact:F.at(cId,2,locOf(need.cS2)),
    text: need.cS2==='store' ? `十點多我有去${LOCS.store.name}買個東西，怎樣，買東西也犯法？` : need.cS2==='laundry' ? '後來我去洗衣服，衣服髒了不能洗喔？' : '後來我去加油，然後就回家了。'});
  addStmt({who:cId,topic:'misc',ord:4,truth:true,fact:null,
    text: finale ? '子葳，我是看著你長大的。你阿嬤的事，我也很難過。' : r.pick([`${V.nick||V.name}這個人喔，最近整個人都怪怪的，得罪的人多了。`, '你們警察就是這樣，抓不到人就隨便找一個。', `我跟${vhe}沒什麼好講的。人都死了，還要怎樣？`])});
  let sDB = null;
  if(hasDeadby){
    sDB = addStmt({who:cId,topic:'deadby',ord:9,truth:false,gate:{exp:sA2},auto:true,fact:F.deadby(tArr),
      text: finale ? `……好。我是去了。我只是想跟她好好談。但我${hm(tArr)}到的時候，她已經倒在那裡了！` : `……好，我承認我有去。但我${hm(tArr)}到的時候，${vhe}已經倒在地上了！我怕被牽連，才跑的！`});
  } else {
    addStmt({who:cId,topic:'confess',ord:9,truth:true,gate:{exp:sA2},auto:true,fact:F.at(cId,1,'L0'),
      text:`……好，我承認我有去找${vhe}。但人不是我殺的！我們吵完我就走了！`});
  }
  cs.stmts[sA2].onExp = {exposeAlso:[sS]};

  cs.bossDef[cId] = [
    {key:'alibi',label:'不在場證明',stmts:[sA1,sA2],texts:{
      [sA1]: finale ? '那晚我在大隊值班。你要我叫整個大隊來作證嗎？' : `我說過了，${spokenOf(1)}我在${LOCS[X1].name}。你們要我講幾次？`,
      [sA2]: finale ? '好，我不在大隊。我回家了。我一個老人家，晚上回家睡覺不行嗎？' : `好，我不在${LOCS[X1].name}……但我在家！我整晚都在家！`}},
    {key:'scene',label:'現身現場',stmts:[sS],text: finale ? '就算我不在家好了。你有什麼證據，證明我那晚上過鎮安宮？' : `就算我不在家又怎樣？你有證據證明我去過${sceneShort}嗎？`},
    {key:'means',label:'凶器',stmts:[sM],text: finale ? '香爐？你要說我拿香爐打人？證據呢？' : `那${WCL}${W.name}？我連碰都沒碰過。你們拿得出證據嗎？`},
    {key:'motive',label:'動機',stmts:[sR],text: finale ? M.boss : (Cm.boss || vfix(M.boss))},
  ];
  if(sDB) cs.bossDef[cId].push({key:'deadby',label:'最後掙扎',stmts:[sDB],text: finale ? `對！我去了！可是我${hm(tArr)}到的時候，她已經倒在神桌前面了！你們不能拿這個定我的罪！` : `我承認我去過！可是我${hm(tArr)}到的時候，${vhe}已經倒在那裡了！我只是嚇到跑掉而已！`});

  // 自白
  const post = need.cS2==='store' ? '我去超商買了漂白水，想把手上的東西洗掉。可是怎麼洗都洗不掉。' : need.cS2==='laundry' ? '我去洗衣店，把衣服洗了三次。那個味道還在。' : '我去加油站買了去漬油，把車子擦了一整晚。';
  if(finale) cs.confession = null;
  else if(C.why) cs.confession = `「……」${C.name}盯著桌面很久，聲音乾得像砂紙。\n「${C.why}」\n「那天晚上${hm(tArr)}，我去找${vhe}，想跟${vhe}好好談。${vhe}不肯。」\n「我抓起那${WCL}${W.name}……回過神來，${vhe}已經不動了。」\n「${post}」`;
  else cs.confession = `「……」${C.name}盯著桌面很久，聲音乾得像砂紙。\n「那天晚上${hm(tArr)}，我去找${vhe}，${M.purpose(motiveCtx)}。${vhe}${M.trigger(motiveCtx)}。」\n「我抓起那${WCL}${W.name}……我只是想讓${vhe}閉嘴。回過神來，${vhe}已經不動了。」\n「${post}」`;

  // 真相時間線：兇手
  cs.truth.lines[cId] = [
    `${hm(tCall)} 打電話給${V.name}，約好見面。${hm(tOutC)} ${finale?'刷卡離開大隊':'出門'}。`,
    `${hm(tArr)} 到${sceneShort}。${hasDeadby?`${hm(tAlive)} 時${V.name}還活著。`:''}${hm(tMurder)} 左右行兇，${hm(tLeave)} 離開。`,
    finale ? `${hm(tStationBack)} 回到大隊，補簽值班簿，叫陳冠宇替他作證。` : afterText.replace(/^\d\d:\d\d，/, hm(tAfter)+' ')
  ];
  cs.truth.why[cId] = finale ? '兇手。琴姨要去地檢署說出七年前的事。' : `兇手。動機：${M.label}。`;
  cs.truth.needX1 = LOCS[X1].name;

  // =========================================================
  // 說謊的無辜者 AS（藏秘密）
  // =========================================================
  if(asId){
    const AS = cs.sus[asId];
    const secLoc = locOf(AS.secret), fakeLoc = locOf(AS.fake, asId);
    const t1 = slotStart(1) - r.int(5,25), t2 = slotStart(2) + r.int(5,40);
    const recId = addClue({cat:'調閱',kind:'rec',src:secLoc,ord:0,title:LOCS[AS.secret].rec,time:`${hm(t1)} / ${hm(t2)}`,
      text:LOCS[AS.secret].recAt({P:AS.name,t1:hm(t1),t2:hm(t2),nick:AS.nick,he:pr(AS)}),facts:[F.at(asId,1,secLoc)],who:asId});
    addClue({cat:'調閱',kind:'phone',src:asId,ord:2,title:'基地台定位',time:rangeOf(1),
      text:`${AS.name}的手機在${rangeOf(1)}之間，連線的是${LOCS[AS.secret].name}附近的基地台。`,facts:[F.at(asId,1,secLoc)],who:asId});
    if(AS.fake==='home'){
      addClue({cat:'調閱',kind:'homecam',src:asId,ord:1,title:'社區大門監視器',time:`${hm(t1-8)} / ${hm(t2+9)}`,
        text:`${AS.name}住處的社區大門監視器：${hm(t1-8)} 出門，${hm(t2+9)} 才回來。`,facts:[F.notat(asId,1,fakeLoc)],who:asId});
    } else if(AS.fake==='office'){
      const tOff = slotStart(0)+r.int(10,45);
      addClue({cat:'調閱',kind:'punch',src:asId,ord:1,title:'公司門禁打卡',time:hm(tOff),
        text:`${AS.name}當晚 ${hm(tOff)} 就刷卡下班了，之後沒有再進公司。`,facts:[F.notat(asId,1,fakeLoc)],who:asId});
    } else {
      addClue({cat:'調閱',kind:'rec',src:fakeLoc,ord:2,title:LOCS[AS.fake].rec,time:rangeOf(1),
        text:LOCS[AS.fake].recNot({P:AS.name,range:rangeOf(1),he:pr(AS)}),facts:[F.notat(asId,1,fakeLoc)],who:asId});
    }
    const a1 = addStmt({who:asId,topic:'alibi',ord:0,truth:false,fact:F.at(asId,1,fakeLoc),text:`${spokenOf(1)}？我${claimText(AS.fake,asId,true)}。`});
    addStmt({who:asId,topic:'confess',ord:9,truth:true,gate:{exp:a1},auto:true,fact:F.at(asId,1,secLoc),text:secret.confess});
    cs.stmts[a1].onExp = {unlockFound:[recId]};
    addMotiveBits(asId, 0.5);
    addTouchBits(asId);
    addStmt({who:asId,topic:'misc',ord:3,truth:true,fact:null,text:r.pick([`${V.name}？人是不壞啦，就是最近脾氣很差。`,'我知道的都講了，可以走了嗎？','那天的事我真的不想再想了。'])});
    cs.bossDef[asId] = [
      {key:'alibi',label:'不在場證明',stmts:[a1],texts:{[a1]:`我說過了，那時候我${claimText(AS.fake,asId,true)}！`}},
      {key:'scene',label:'現身現場',fact:F.notat(asId,1,'L0'),truth:true,text:`我那時候根本不在${sceneShort}！你們去查啊！查到了再來找我！`},
    ];
    cs.truth.lines[asId] = ['', `${hm(t1)}–${hm(t2)} 在${LOCS[AS.secret].name}。`, ''];
    cs.truth.why[asId] = `沒有殺人。說自己「${claimText(AS.fake,asId,false).replace(/，.*$/,'')}」是謊話——那一個小時，${pr(AS)}${secret.story}`;
  }

  // =========================================================
  // 去過現場的無辜者 AV（案發前到過）
  // =========================================================
  if(avId){
    const AV = cs.sus[avId];
    const zLoc = locOf(AV.z, avId);
    const tA1 = slotStart(0) + r.int(4,18), tA2 = tA1 + r.int(20,32);
    if(AV.traits.smoke!=='none'){
      addClue({cat:'鑑識',kind:'cold',src:'L0',ord:2,title:'菸蒂（已冷）',time:'',
        text:`窗台的菸灰缸裡有兩截${AV.traits.smoke}菸蒂，菸灰早就冷透了，壓在一張傍晚出刊的報紙上——推估比案發時間早了至少一個鐘頭。`,
        chips:[['smoke',AV.traits.smoke]],facts:[F.at(avId,0,'L0')],anon:true,who:avId});
    } else if(AV.gender==='F'){
      addClue({cat:'鑑識',kind:'cold',src:'L0',ord:2,title:'兩只茶杯',time:'',
        text:'桌上有兩只茶杯，其中一只杯緣有淡淡的口紅印。茶早就涼透了，表面浮著一層茶垢——是案發前一個多小時泡的。',
        chips:[['gender','F']],facts:[F.at(avId,0,'L0')],anon:true,who:avId});
    } else {
      addClue({cat:'鑑識',kind:'cold',src:'L0',ord:2,title:'乾掉的泥腳印',time:'',
        text:`門口有一組乾掉的泥腳印，約${AV.traits.shoe}號，泥已經乾透裂開——是案發前一個多小時留下的，鞋底花紋和${ROPE?'水漬':'血跡'}鞋印不同。`,
        chips:[['shoe',AV.traits.shoe]],facts:[F.at(avId,0,'L0')],anon:true,who:avId});
    }
    const moto = AV.traits.vehicle.includes('機車');
    addClue({cat:'調閱',kind:'cctv',src:'L0',ord:r.int(0,1),keep:3,destr:true,title:'巷口監視器 CAM-01',time:`${hm(tA1)}–${hm(tA2)}`,
      text:`${hm(tA1)} 一名身高約${AV.traits.height}公分的${AV.gender==='M'?'男子':'女子'}${rideAnon(AV.traits.vehicle)}來，走進巷子；${hm(tA2)} 出來，用力甩上${moto?'座墊':'車門'}，${moto?'騎':'開'}得很快。`,
      chips:[['gender',AV.gender],['height',AV.traits.height],['vehicle',AV.traits.vehicle]],facts:[F.at(avId,0,'L0')],anon:true,who:avId});

    if(LOCS[AV.z].witAt){

    addStmt({who:avId,topic:'alibi',ord:0,truth:true,fact:F.at(avId,1,zLoc),text:`${spokenOf(1)}？我${claimText(AV.z,avId)}，很多人都看到了。`});
    const v2 = addStmt({who:avId,topic:'scene',ord:1,truth:false,fact:F.notat(avId,null,'L0'),text:`那天我沒去找${vhe}。我們好一陣子沒見了。`});
    const reason = AV.visit || (AV.motive ? MOTIVES[AV.motive].reason : '為了一點小事');
    addStmt({who:avId,topic:'confess',ord:9,truth:true,gate:{exp:v2},auto:true,fact:F.at(avId,0,'L0'),
      text:`……我${spokenHour(H-1)}多是有去找${vhe}，${reason}，吵了一架。但我${hm(tA2)}就走了！我走的時候${vhe}還好好的，還在那邊罵人！`});
    const bonus = addClue({cat:'走訪',kind:'wit',src:'UNLOCK',unlock:true,title:AV.name+'的補充證詞',time:hm(tA2),
      text:`「我要走的時候，${vhe}在講電話。${vhe}叫對方『${C.nick}』，還說：『你${spokenHour(H)}過來，我們把話講清楚。』」`,
      facts:[F.contact(cId,0)],who:cId});
    cs.stmts[v2].onExp = {unlockFound:[bonus]};
    addMotiveBits(avId, 0.4);
    addTouchBits(avId);
    cs.bossDef[avId] = [
      {key:'alibi',label:'不在場證明',fact:F.at(avId,1,zLoc),truth:true,text:`${spokenOf(1)}我${claimText(AV.z,avId)}！你去問啊！`},
      {key:'scene',label:'現身現場',fact:F.notat(avId,1,'L0'),truth:true,text:`我承認我${spokenHour(H-1)}多去過！可是${spokenHour(H)}以後，我根本不在那裡！`},
    ];
    cs.truth.lines[avId] = [`${hm(tA1)} 到${sceneShort}找${V.name}，${reason}吵了一架，${hm(tA2)} 離開。`, `在${LOCS[AV.z].name}。`, ''];
    cs.truth.why[avId] = `沒有殺人。案發前一個小時去過${sceneShort}、吵過架——怕被懷疑，才說那天沒去。`;
  }

  // =========================================================
  // 誠實者 H
  // =========================================================
  for(const hid of hIds){
    const Hp = cs.sus[hid];
    const yLoc = locOf(Hp.y, hid);
    const t1 = slotStart(1)-r.int(4,15), t2 = slotStart(2)+r.int(20,50);
    let conf;
    if(Hp.y==='home') conf = {cat:'調閱',kind:'homecam',src:hid,title:'社區大門監視器',text:`${Hp.name}住處的社區大門監視器：${hm(slotStart(0)+r.int(20,50))} 回家之後，整晚沒有再出門。`};
    else if(Hp.y==='office') conf = {cat:'調閱',kind:'punch',src:hid,title:'公司門禁打卡',text:`${Hp.name}當晚 ${hm(slotStart(2)+r.int(25,55))} 才刷卡離開公司。`};
    else if(LOCS[Hp.y].recAt && Hp.y!=='temple') conf = {cat:'調閱',kind:'rec',src:yLoc,title:LOCS[Hp.y].rec,text:LOCS[Hp.y].recAt({P:Hp.name,he:pr(Hp),t1:hm(t1),t2:hm(t2),nick:Hp.nick})};
    else conf = {cat:'走訪',kind:'wit',src:yLoc,title:LOCS[Hp.y].npc+'的證詞',text:LOCS[Hp.y].witAt({nick:Hp.nick,he:pr(Hp),spoken:spokenOf(1),t1:hm(slotStart(1)+r.int(5,40))})};
    addClue(Object.assign({ord:1,time:'',facts:[F.at(hid,1,yLoc)],who:hid},conf));
    addClue({cat:'調閱',kind:'phone',src:hid,ord:2,title:'基地台定位',time:rangeOf(1),
      text:`${Hp.name}的手機在${rangeOf(1)}之間，連線的是${cs.locName[yLoc]}附近的基地台。`,facts:[F.at(hid,1,yLoc)],who:hid});
    addStmt({who:hid,topic:'alibi',ord:0,truth:true,fact:F.at(hid,1,yLoc),text:`${spokenOf(1)}？我${claimText(Hp.y,hid)}。`});
    addMotiveBits(hid, 0);
    addTouchBits(hid);
    addStmt({who:hid,topic:'misc',ord:3,truth:true,fact:null,text:r.pick([`說實話，想要${vhe}死的人不只一個。`,`${C.nick}最近手頭好像很緊，到處跟人借錢。`,'我該講的都講了。你們快點抓到人吧，這裡大家晚上都不敢出門了。'])});
    cs.bossDef[hid] = [
      {key:'alibi',label:'不在場證明',fact:F.at(hid,1,yLoc),truth:true,text:`${spokenOf(1)}我${claimText(Hp.y,hid)}，這你們早就知道了吧？`},
      {key:'scene',label:'現身現場',fact:F.notat(hid,1,'L0'),truth:true,text:`我那天晚上根本沒靠近${sceneShort}。你們抓錯人了。`},
    ];
    cs.truth.lines[hid] = ['', `在${cs.locName[yLoc]}。`, ''];
    cs.truth.why[hid] = '沒有殺人，也沒有說謊。';
  }

  // =========================================================
  // 包庇者 AC（終章）
  // =========================================================
  if(acId){
    const AC = cs.sus[acId];
    const stLoc = locOf('station');
    addClue({cat:'調閱',kind:'rec',src:stLoc,ord:2,title:'值班簽到簿',time:rangeOf(1),text:LOCS.station.recAt({P:AC.name}),facts:[F.at(acId,1,stLoc)],who:acId});
    const ac1 = addStmt({who:acId,topic:'cover',ord:0,truth:false,fact:F.at(cId,1,stLoc),text:'隊長那晚一直在大隊。九點多還叫我去買便當，我可以作證。'});
    addStmt({who:acId,topic:'confess',ord:9,truth:true,gate:{exp:ac1},auto:true,fact:F.at(acId,1,stLoc),
      text:`……是隊長叫我這樣說的。他說只是怕麻煩。他那晚${spokenHour(H+1)}多才回來，褲管上都是香灰。`});
    const gps = addClue({cat:'調閱',kind:'gps',src:'UNLOCK',unlock:true,title:'公務車GPS紀錄',time:`${hm(tArr-12)}–${hm(tLeave+15)}`,
      text:`陳冠宇交出的公務車行車紀錄：${hm(tArr-12)} 駛離大隊，${hm(tArr-2)} 停在鎮安宮後山的產業道路，${hm(tLeave+3)} 才發動離開。當晚借車的人：郭振邦。`,
      facts:[F.at(cId,1,'L0')],who:cId});
    cs.stmts[ac1].onExp = {unlockFound:[gps]};
    addStmt({who:acId,topic:'alibi',ord:1,truth:true,fact:F.at(acId,1,stLoc),text:'我那晚在大隊值班，整晚都在。'});
    addStmt({who:acId,topic:'misc',ord:3,truth:true,fact:null,text:'學長，你不要再問了。隊長對我們都很好。'});

  // ---------- 無辜者的動機與凶器接觸 ----------

      addStmt({who:pid,topic:'motive',ord:1,truth:true,fact:F.norel(pid,other),text:r.pick([`我跟${vhe}沒什麼過節，真的。`,'我們之間沒什麼好說的，就普通認識。'])});
      return;
    }
    const m = MOTIVES[p.motive];
    const pm = p.mev || {};
    const ctx = {P:p.name,V:V.name,nick:p.nick,amt:r.pick([20,30,45,60,90]),he:pr(p),vhe,spouse:spouseOf(p),vspouse};
    const useRec = r.chance(0.5);
    const ev = useRec ? (pm.rec || m.rec(ctx)) : (pm.wit || m.wit(ctx));
    addClue({cat:useRec?'調閱':'走訪',kind:'motive',src:useRec?(r.chance(0.5)?pid:'V'):'V',ord:2,destr:!useRec,title:ev.title,time:'',text:ev.text,facts:[F.rel(pid,p.motive)],who:pid});
    const lieLine = pm.lie ? r.pick(pm.lie) : vfix(r.pick(m.lie));
    const admitLine = pm.admit ? r.pick(pm.admit) : vfix(r.pick(m.admit));
    if(r.chance(lieOdds)){
      const s = addStmt({who:pid,topic:'motive',ord:1,truth:false,fact:F.norel(pid,p.motive),text:lieLine});
      addStmt({who:pid,topic:'confess',ord:9,truth:true,gate:{exp:s},auto:true,fact:F.rel(pid,p.motive),text:admitLine});
    } else {
      addStmt({who:pid,topic:'motive',ord:1,truth:true,fact:F.rel(pid,p.motive),text:admitLine});
    }
    cs.truth.motiveOf = cs.truth.motiveOf || {}; cs.truth.motiveOf[pid] = p.motive;
  }
  function addTouchBits(pid){
    if(!touchers.includes(pid)) return;
    if(r.chance(0.5)){
      const s = addStmt({who:pid,topic:'means',ord:2,truth:false,gate:{clue:cW},fact:F.nottouch(pid,'W'),text:`那${WCL}${W.name}？沒印象，我沒碰過。`});
      addStmt({who:pid,topic:'confess',ord:9,truth:true,gate:{exp:s},auto:true,fact:F.touch(pid,'W'),text:`……那是${sceneShort}裡的東西，我平常就會用到。我怕你們懷疑我，才說沒碰過。`});

  addClue({cat:'走訪',kind:'bg',src:'V',ord:0,title: A&&A.bgTitle ? A.bgTitle : '家屬的說法',time:'',
    text: A && A.bg ? A.bg : (finale ? '廟裡的師姐說，琴姨這幾天一直在翻舊東西，還說「欠秀蘭姊的，這次要還」。出事前一晚，她在神桌前跪了一整夜。'

  // ---------- 受驚的證人（收驚） ----------
  if(!finale && diff>=2 && r.chance(0.45)){
    const sc = r.pick(SCARED);

    const named = r.chance(0.5);

        : `收完驚，證人終於開口：「那個人${MARK_PHRASE[C.traits.mark]}……出來的時候，手上都是紅的……」`,
      chips: named ? [] : [['mark',C.traits.mark]],facts:[F.at(cId,1,'L0')],anon:!named,who:cId});
  }

  // ---------- 亡者低語（民俗，不具證據能力） ----------
  const vWhisper = C.traits.vehicle.includes('機車') ? '……一直有……機車的聲音……好吵……' : '……車門……關上的聲音……';
  const ws = [
    {text:`……好冷……我一直聞到……${C.traits.smell}……`,chips:[['smell',C.traits.smell]]},
    r.chance(0.5) ? {text:MARK_WHISPER[C.traits.mark].replace(/他/g,pr(C)),chips:[['mark',C.traits.mark]]} : {text:vWhisper,chips:[['vehicle',C.traits.vehicle]]},
    {text:M.whisper.replace(/他(?!們)/g,pr(C)),chips:[]},
  ];
  if(A && A.whisperExtra) ws.push({text:A.whisperExtra,chips:[]});
  ws.forEach((w,i)=>addClue({cat:'民俗',kind:'whisper',src:'V',ord:i,adm:false,title:'亡者低語',time:'',text:w.text,chips:w.chips,facts:[]}));

  // ---------- 紅線卷宗（舊案碎片） ----------
  if(A && A.frags){
    for(const fg of A.frags){

      cs.frags.push(fg.id);
      cs.truth.fragClue = cs.truth.fragClue || {}; cs.truth.fragClue[fg.id] = id;
    }
  }

  cs.title = A ? A.title : `${setting.place}${V.job}命案`;
  cs.caseNo = `南刑偵字第 115${pad2(r.int(1,12))}${pad2(r.int(1,28))}-${pad2(r.int(1,99))} 號`;
  cs.discovery = A ? A.setting.discovery : setting.discovery(V.name, ROPE);
  cs.sceneShort = sceneShort;
  cs.sceneFull = A && A.setting.sceneFull ? A.setting.sceneFull : `${setting.place}・${setting.sceneName}`;
  return cs;
}

/* =========================================================
   驗證：保證每一案都能靠證據破
   ========================================================= */
function validateCase(cs){
  const errs = [];
  const clues = Object.values(cs.clues), stmts = Object.values(cs.stmts);
  const admClues = clues.filter(c=>c.adm);
  for(const s of stmts){
    if(!s.fact) continue;
    const hits = admClues.filter(c=>c.facts.some(f=>conflict(s.fact,f)));
    if(s.truth && hits.length) errs.push(`真話 ${s.id} 被 ${hits.map(h=>h.id).join(',')} 推翻`);
    if(!s.truth && !hits.length) errs.push(`謊言 ${s.id} 無法拆穿`);
  }
  for(let i=0;i<clues.length;i++) for(let j=i+1;j<clues.length;j++)
    for(const f of clues[i].facts) for(const g of clues[j].facts) if(conflict(f,g)) errs.push(`證據 ${clues[i].id}/${clues[j].id} 互相矛盾`);
  const cId = cs.truth.culprit;
  const safe = c => c.adm && c.guard && !c.destr && !c.keep && !c.searchOnly && !c.unlock && !c.shoujing;
  for(const d of cs.bossDef[cId]){
    for(const stId of d.stmts){
      const s = cs.stmts[stId];
      if(!clues.some(c=>safe(c) && c.facts.some(f=>conflict(s.fact,f)))) errs.push(`真兇回合 ${d.key}/${stId} 沒有保底證據`);
    }
  }
  for(const pid of cs.susOrder){
    if(pid===cId) continue;
    for(const d of cs.bossDef[pid]){
      if(d.truth && clues.some(c=>c.facts.some(f=>conflict(d.fact,f)))) errs.push(`無辜者 ${pid} 的真話被推翻`);
    }
    if(clues.some(c=>c.facts.some(f=>f.k==='at'&&f.who===pid&&f.slot===1&&f.loc==='L0'))) errs.push(`無辜者 ${pid} 被放進案發現場`);
  }
  const C = cs.sus[cId];
  const anon = clues.filter(c=>c.anon && c.adm && c.who===cId);
  const keys = new Set(); anon.forEach(c=>c.chips.forEach(([k])=>keys.add(k)));
  if(!cs.finale){
    for(const pid of cs.susOrder){ if(pid===cId) continue; const p=cs.sus[pid]; if(![...keys].some(k=>String(p.traits[k])!==String(C.traits[k]))) errs.push(`匿名特徵分不出 ${pid}`); }
  }
  for(const s of stmts){ if(/undefined|NaN|\[object/.test(s.text)) errs.push(`文字錯誤 ${s.id}`); }
  for(const c of clues){ if(/undefined|NaN|\[object/.test(c.text+c.title)) errs.push(`文字錯誤 ${c.id}`); }
  return {ok:errs.length===0, errs};
}

// 機制用亂數：固定在案件裡（同一個案件代碼，抽牌順序一樣）
function rnd(){
  const st = S.st;
  if(st && st.rs!=null){
    const a = (st.rs + 0x6D2B79F5)|0; st.rs = a>>>0;
    let t = Math.imul(a^a>>>15, 1|a); t = t+Math.imul(t^t>>>7, 61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  }
  return Math.random();
}
const frnd = () => Math.random();          // 純文字變化用
const rpick = a => a[Math.floor(rnd()*a.length)];
const fpick = a => a[Math.floor(frnd()*a.length)];
function rshuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const clone = o => JSON.parse(JSON.stringify(o));

function cardDef(card){
  const base = CARD_DB[card.id];
  if(!card.up || !base.up) return base;
  return Object.assign({}, base, base.up, {fx: (base.up.fx||base.fx)});
}

// ---------- 案件代碼 ----------
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function encodeCase(seed, diff){
  let v = (seed % 134217728) * 4 + (diff-1);
  let s = '';
  for(let i=0;i<6;i++){ s = B32[v % 32] + s; v = Math.floor(v/32); }
  return s.slice(0,3)+'-'+s.slice(3);
}
function decodeCase(code){
  const c = String(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/[IL]/g,'1').replace(/O/g,'0');
  if(c.length!==6) return null;
  let v = 0;
  for(const ch of c){ const i = B32.indexOf(ch); if(i<0) return null; v = v*32 + i; }
  const diff = (v % 4) + 1, seed = Math.floor(v/4);
  return {seed, diff, code: c.slice(0,3)+'-'+c.slice(3)};
}

// ---------- 開局 ----------
function newRun(mode, opts){
  opts = opts || {};
  const seed = opts.seed!=null ? opts.seed : Math.floor(Math.random()*134217728);
  S.run = { mode, seed, caseIdx:0, cred:20, maxCred:20, diff: opts.diff||2,
    deck: STARTER.map(id=>({uid:newUid(), id, up:false})), relics:[], history:[], avoid:[], over:false,
    frags:{}, cp:null, salt:0, retries:0, recon:null, ending:null, fromLink:!!opts.fromLink };
  if(mode==='quick') S.run.code = encodeCase(seed, S.run.diff);
  return S.run;
}
function caseOpts(run){
  if(run.mode==='quick') return {diff: run.diff, n: run.diff<=1?3:4};
  const i = run.caseIdx;
  return {authored: CAMPAIGN[i], diff:[1,2,3,4,5][i], redThread: i<4};
}
function caseSeed(run){
  if(run.mode==='quick') return run.seed>>>0;
  return (run.seed + run.caseIdx*7717 + run.salt*104729)>>>0;
}
function startCase(){
  const run = S.run;
  if(run.mode==='campaign'){
    run.cp = clone({caseIdx:run.caseIdx, cred:run.cred, deck:run.deck, relics:run.relics, history:run.history, frags:run.frags, avoid:run.avoid});
  }
  const cs = genCase(caseSeed(run), caseOpts(run));
  S.cs = cs;
  if(run.mode==='quick') cs.code = run.code;
  run.avoid.push(cs.setting);
  const st = S.st = { day:1, energy:0, hand:[], draw:[], discard:[], exhausted:[], rs:((cs.baseSeed^0x9E3779B9)>>>0),
    found:{}, foundOrder:[], heard:{}, heardOrder:[], exposed:{}, gone:{}, fresh:{}, labs:[], labSent:{}, divine:{},
    lawyer:{}, tail:null, seal:false, media:false, pressure:false, freeConf:false, laptopUsed:false, amuletUsed:false,
    wrongConf:0, wrongPres:0, hints:0, hintStep:0, failedArrests:0, alert:0, log:[], nights:[], solved:false, cold:false,
    folkFree:0, arrested:null, searched:{}, fragFound:[] };
  st.draw = rshuffle(run.deck.map(c=>c.uid));
  for(const c of Object.values(cs.clues)) if(c.pre) markFound(c.id, true);
  if(cs.finale) addFinaleWhispers();
  if(run.mode==='campaign' && cs.authored==='funeralhome') grantFrag('F5', true);
  if(hasRelic('caiLine')){ const got = revealRandom('走訪',1); got.forEach(id=>st.fresh[id]=true); }
  startDay(true);
  return cs;
}
