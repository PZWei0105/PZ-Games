    if (u.isPlayer) for (const [k, n] of Object.entries(u.powers)) out.push(`<span class="stc pw" data-tip="${esc(POWER_NAME[k])}（持續）：${esc(POWER_DESC[k] ? POWER_DESC[k](n) : '')}">${esc(POWER_NAME[k])}${n > 1 ? `<b>${n}</b>` : ''}</span>`);
    return out.join('');
  }
  function intentHTML(e) {
    const it = getIntent(e);
    const mv = ENEMIES[e.id].moves[e.move] || {};
    let main;

  }
  function wishHTML(e) {
    if (!e.duMax) return '';
    return `<div class="wishes">${e.wishes.map(w => e.known[w] ? `<span class="wish on" data-tip="心願「${w}」：${esc(WISH_INFO[w])}<br>對上的供品效果加倍。">${ICON(w)}<b>${w}</b></span>` : `<span class="wish" data-tip="還不知道的心願。問神、或對上它的供品，就會知道。">？</span>`).join('')}</div>`;

    el.innerHTML = `<div class="intentwrap"></div>

      <div class="bars">
        <div class="bar yuanbar" data-tip="${esc(L.yuan || '怨')}：斬它，歸零就${esc(L.san || '打散')}。"><label>${esc(L.yuan || '怨')}</label><i></i><em></em><span></span></div>
        ${e.duMax ? `<div class="bar dubar" data-tip="${esc(L.du || '渡')}：供它，滿了就${esc(L.duDone || '送走')}。"><label>${esc(L.du || '渡')}</label><i></i><span></span></div>` : ''}
      </div>
      <div class="state"></div>
      <div class="wishwrap"></div>
      <div class="sts"></div>`;
    el.addEventListener('click', ev => { ev.stopPropagation(); onEnemyClick(e); });
    return el;
  }
  function updEnemy(el, e) {
    const yb = el.querySelector('.yuanbar');
    yb.querySelector('i').style.width = Math.max(0, e.yuan / e.yuanMax * 100) + '%';
    yb.querySelector('span').textContent = `${Math.max(0, e.yuan)}／${e.yuanMax}`;
    const em = yb.querySelector('em'); em.textContent = e.block > 0 ? e.block : ''; em.classList.toggle('on', e.block > 0);
    yb.classList.toggle('mad', e.yuan > e.yuanMax * .66);
    yb.classList.toggle('calm', e.yuan < e.yuanMax * .33);
    const db = el.querySelector('.dubar');
    if (db) { db.querySelector('i').style.width = Math.min(100, e.du / e.duMax * 100) + '%'; db.querySelector('span').textContent = `${Math.round(e.du)}／${e.duMax}`; db.classList.toggle('near', e.du >= e.duMax * .75); }
    const s = stateOf(e);
    const st = el.querySelector('.state');
    const sh = `<span class="stt s-${s}" data-tip="${s === '狂' ? '狂：怨太重了。供的效果減半，攻擊變強。' : s === '靜' ? '靜：安靜下來了。供的效果 ×1.5，攻擊變弱。小心別把它打散。' : '怨：一般狀態。'}">${esc(stateLabel(e, s))}</span>`;
    if (st._h !== sh) { st.innerHTML = sh; st._h = sh; }
    el.classList.toggle('st-mad', s === '狂'); el.classList.toggle('st-calm', s === '靜');
    const ww = el.querySelector('.wishwrap'); const wh = wishHTML(e); if (ww._h !== wh) { ww.innerHTML = wh; ww._h = wh; }
    el.querySelector('.sts').innerHTML = statusChips(e);
  }
  function render() {
    const cb = G.cb;
    if (!root || !cb) return;
    const es = root.querySelector('.eside');
    for (const e of cb.enemies) {
      let el = enEls.get(e.uid);
      if (e.done || e.gone) continue;
      if (!el) { el = enemyEl(e); enEls.set(e.uid, el); es.appendChild(el); }
      updEnemy(el, e);
      const iw = el.querySelector('.intentwrap');
      const ih = cb.phase === 'over' ? '' : intentHTML(e);
      if (iw._h !== ih) { iw.innerHTML = ih; iw._h = ih; }

    }
    es.dataset.n = alive().length;
    // player
    const p = cb.p;
    const pl = root.querySelector('.pl');

    const fires = pl.querySelectorAll('.fires i');
    const r = p.hp / p.maxHp;
    fires.forEach((f, i) => f.classList.toggle('out', r <= [0, 1 / 3, 2 / 3][i]));

    const inc = root.querySelector('.incense');
    inc.querySelector('b').textContent = p.energy;
    const shown = Math.max(p.baseEnergy, p.energy);
    inc.querySelector('.sticks').innerHTML = Array.from({ length: Math.min(8, shown) }, (_, i) => `<i class="${i < p.energy ? 'lit' : ''}"></i>`).join('');
    inc.classList.toggle('empty', p.energy === 0);

    const jb = root.querySelector('.jiaobtn');
    const canJ = cb.phase === 'player' && !cb.busy && cb.jiao.left > 0;
    jb.disabled = !canJ;
    jb.classList.toggle('ready', canJ);
    jb.classList.toggle('fixed', !!cb.jiao.fixed);
    jb.querySelectorAll('.streak i').forEach((x, i) => x.classList.toggle('on', i < cb.jiao.streak));
    jb.querySelector('.jleft').textContent = cb.jiao.left > 1 ? '×' + cb.jiao.left : cb.jiao.fixed ? '必聖' : '';
    // piles
    root.querySelector('.drawp b').textContent = cb.draw.length;
    root.querySelector('.discp b').textContent = cb.discard.length;
    root.querySelector('.exhp b').textContent = cb.exhaust.length;
    const et = root.querySelector('.endturn');
    et.disabled = cb.phase !== 'player' || cb.busy;
    et.classList.toggle('nudge', cb.phase === 'player' && !cb.hand.some(c => canPlay(c)) && !cb.comps.some(c => c.charge >= c.need) && cb.jiao.left <= 0);
    // companions
    root.querySelector('.comps').innerHTML = cb.comps.map((c, i) => {
      const Cp = compDef(c.id);
      const ready = c.charge >= c.need;
      return `<button class="comp ${ready ? 'ready' : ''}" data-cact="assist" data-ci="${i}" style="--cc:${Cp.color}" data-tip="<b>${esc(Cp.name)}・${esc(Cp.assistName)}</b>：${esc(Cp.assistDesc)}<br><small>${esc(Cp.chargeDesc)}（${c.charge}/${c.need}）</small>">
        <span class="cfig">${figHTML(Cp.fig)}</span><span class="pips">${Array.from({ length: c.need }, (_, k) => `<i class="${k < c.charge ? 'on' : ''}"></i>`).join('')}</span>${ready ? '<span class="cr">援</span>' : ''}</button>`;
    }).join('');
    renderHand();
    UI.hud();
  }
  function layoutHand() {
    const cb = G.cb;
    const hand = root.querySelector('.hand');
    const W = hand.clientWidth, n = cb.hand.length;
    const cw = parseFloat(getComputedStyle(root).getPropertyValue('--cw')) || 120;
    const step = n > 1 ? Math.min(cw * 0.94, (Math.max(cw, W - 8) - cw) / (n - 1)) : 0;
    const x0 = (W - (step * (n - 1) + cw)) / 2;
    cb.hand.forEach((c, i) => {
      const el = handEls.get(c.uid);
      if (!el) return;
      const mid = (n - 1) / 2;
      el.style.setProperty('--x', (x0 + i * step) + 'px');
      el.style.setProperty('--y', Math.abs(i - mid) * Math.min(6, 30 / n) + 'px');
      el.style.setProperty('--r', (n > 1 ? (i - mid) * Math.min(4, 22 / n) : 0) + 'deg');
      el.style.zIndex = el.classList.contains('sel') ? 60 : 10 + i;
    });
  }
  function renderHand() {
    const cb = G.cb;
    const hand = root.querySelector('.hand');
    const live = new Set(cb.hand.map(c => c.uid));
    for (const [id, el] of handEls) if (!live.has(id)) { el.remove(); handEls.delete(id); }
    for (const c of cb.hand) {
      let el = handEls.get(c.uid);
      const html = cardHTML(c, { inCombat: true });
      if (!el) {
        el = document.createElement('div');
        el.className = 'hcard enter';
        el.dataset.uid = c.uid;
        hand.appendChild(el);
        handEls.set(c.uid, el);
        setTimeout(() => el.classList.remove('enter'), 30);
        bindCard(el, c);
      }
      if (el._h !== html) { el.innerHTML = html; el._h = html; }
      el.classList.toggle('playable', canPlay(c));
      el.classList.toggle('sel', sel === c);
    }
    layoutHand();
    const zoom = root.querySelector('.cardzoom');
    if (sel && cb.hand.includes(sel)) {
      zoom.innerHTML = cardHTML(sel, { inCombat: true }) + `<div class="zhelp">${needsTarget(sel) ? '點一隻鬼出手' : '再點一次牌打出'}</div>`;
      zoom.hidden = false;
    } else zoom.hidden = true;
  }

  /* ---------- input ---------- */
  function bind() {
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-cact]');
      if (b) {
        e.stopPropagation();
        const a = b.dataset.cact;
        SND.play('click');
        if (a === 'end') { cancelSel(); endTurn(); }
        else if (a === 'jiao') { cancelSel(); throwJiao(); }
        else if (a === 'drawpile') UI.showDeck(G.cb.draw.slice(), '抽牌堆（順序已打亂）');
        else if (a === 'discpile') UI.showDeck(G.cb.discard, '棄牌堆');
        else if (a === 'exhpile') UI.showDeck(G.cb.exhaust, '消耗');
        else if (a === 'assist') onAssist(+b.dataset.ci);
        return;
      }
      if (!e.target.closest('.hcard') && !e.target.closest('.en')) cancelSel();
    });
    window.removeEventListener('keydown', onKey); window.addEventListener('keydown', onKey);
    window.removeEventListener('resize', onResize); window.addEventListener('resize', onResize);
  }
  function onResize() { if (root && document.body.contains(root)) layoutHand(); }
  function onKey(e) {
    if (G.screen !== 'combat' || !G.cb || G.cb.phase !== 'player' || $('#modal').children.length || !$('#scene').hidden) return;
    const cb = G.cb;
    if (e.key === 'e' || e.key === 'E') { cancelSel(); endTurn(); return; }
    if (e.key === 'j' || e.key === 'J') { cancelSel(); throwJiao(); return; }
    if (e.key === 'Escape') { cancelSel(); return; }
    const n = e.key === '0' ? 10 : parseInt(e.key, 10);
    if (n >= 1 && n <= cb.hand.length) { selectCard(cb.hand[n - 1]); return; }
    if ((e.key === 'Enter' || e.key === ' ') && sel) { e.preventDefault(); if (!needsTarget(sel)) tryPlay(sel, null); else if (alive().length === 1) tryPlay(sel, alive()[0]); }
  }
  function bindCard(el, c) {
    el.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      const cb = G.cb;
      if (!cb || cb.phase !== 'player') return;
      drag = { c, el, x0: ev.clientX, y0: ev.clientY, moved: false };
      el.setPointerCapture && el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener('pointermove', ev => {
      if (!drag || drag.el !== el) return;
      const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
      if (!drag.moved && Math.hypot(dx, dy) > 14) {
        drag.moved = true;
        if (!canPlay(c)) { denyAnim(el, c); drag = null; return; }
        sel = c; el.classList.add('dragging'); render();
      }
      if (drag && drag.moved) {
        if (needsTarget(c)) { el.style.setProperty('--dx', '0px'); el.style.setProperty('--dy', '-40px'); drawAim(el, ev.clientX, ev.clientY); highlightUnder(ev.clientX, ev.clientY); }
        else { el.style.setProperty('--dx', dx + 'px'); el.style.setProperty('--dy', dy + 'px'); }
      }
    });
    const up = ev => {
      if (!drag || drag.el !== el) return;
      const d = drag; drag = null;
      el.classList.remove('dragging');
      el.style.removeProperty('--dx'); el.style.removeProperty('--dy');
      hideAim();
      if (!d.moved) { selectCard(c); return; }
      const hz = root.querySelector('.handzone').getBoundingClientRect();
      if (needsTarget(c)) { const t = enemyUnder(ev.clientX, ev.clientY); if (t) { tryPlay(c, t); return; } cancelSel(); return; }
      if (ev.clientY < hz.top - 10) { tryPlay(c, null); return; }
      cancelSel();
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', () => { if (drag && drag.el === el) { drag = null; el.classList.remove('dragging'); hideAim(); } });
  }
  function enemyUnder(x, y) {
    for (const e of alive()) {
      const el = enEls.get(e.uid); if (!el) continue;
      const r = el.getBoundingClientRect();
      if (x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8) return e;
    }
    return null;
  }
  function highlightUnder(x, y) { const t = enemyUnder(x, y); for (const [id, el] of enEls) el.classList.toggle('aimed', !!(t && t.uid === id)); }
  function drawAim(fromEl, x, y) {
    const svg = root.querySelector('.aim');
    const sr = root.querySelector('.stage').getBoundingClientRect();
    const fr = fromEl.getBoundingClientRect();

class CaseFailed extends Error { constructor(info) { super('case failed'); this.info = info; } }
const STORY = {
  persist: false,   // du/san/epi：拿到的牌放進法壇（永久）
  async truth(id) {
    if (!TRUTHS[id] || hasTruth(id)) return false;
    CM().truths[id] = Date.now();
    saveGame();
    await SCN.truthPop(id);
    return true;
  },
  async name(id) {
    if (!MINER_INFO[id] || hasName(id)) return;
    CM().names[id] = 1;
    saveGame();
    await SCN.namePop(id);
  },
  wish(w) {
    if (!G.run) return;
    G.run.wishes = G.run.wishes || [];
    if (!G.run.wishes.includes(w)) G.run.wishes.push(w);
    UI.toast(`${ICON(w)}<b>心願揭露：「${w}」</b><br><small>${esc(WISH_INFO[w])} 對上的供品，效果加倍。</small>`, 'wish', 3200);
    SND.play('discover');
  },
  set(k, v) {
    const val = v === undefined ? 1 : v;
    CM().flags[k] = val;
    if (k === 'join_meifeng' && !CM().comps.meifeng) { CM().comps.meifeng = true; UI.toast(`${figMini('meifeng')}<b>美鳳</b> 成為夥伴<br><small>援「哭路頭」：打出陰牌會充能。</small>`, 'comp', 3600); SND.play('discover'); }
    if (k === 'join_longge' && !CM().comps.longge) { CM().comps.longge = true; UI.toast(`${figMini('longge')}<b>龍哥</b> 成為夥伴<br><small>援「起乩」：你受傷時會充能。</small>`, 'comp', 3600); SND.play('discover'); }
    if (k === 'agui_voice') UI.toast(`${figMini('agui')}<b>紙妹開光了</b><br><small>她的援變成「阿桂」。</small>`, 'comp', 3200);
    saveGame();
  },
  deckTarget() { return (STORY.persist || !G.run) ? 'base' : 'run'; },
  addCard(id, up) {
    const c = { id, up: up ? 1 : 0 };
    if (STORY.deckTarget() === 'base') { CM().base.push(c); if (G.run) G.run.deck.push(mkCard(id, up)); }
    else G.run.deck.push(mkCard(id, up));
    markSeen('cards', id);
  },
  async act(st) {
    const r = G.run;
    const n = st.n || 0;
    switch (st.do) {
      case 'gold':
        if (r) r.gold = Math.max(0, r.gold + n); else CM().bankGold = (CM().bankGold || 0) + n;
        if (n) UI.toast(`${ICON('錢')}香油錢 ${n > 0 ? '+' : ''}${n}`, n > 0 ? 'good' : 'bad');
        SND.play('coin');
        break;
      case 'hp':
        if (r) { r.hp = clamp(r.hp + n, 1, r.maxHp); UI.toast(`${ICON('陽火')}陽火 ${n > 0 ? '+' : ''}${n}`, n > 0 ? 'good' : 'bad'); SND.play(n > 0 ? 'heal' : 'hit'); }
        break;
      case 'maxhp':
        if (r) { r.maxHp += n; r.hp = clamp(r.hp + Math.max(0, n), 1, r.maxHp); }
        else CM().bonusMaxHp = (CM().bonusMaxHp || 0) + n;
        UI.toast(`${ICON('陽火')}最大陽火 ${n > 0 ? '+' : ''}${n}`, n > 0 ? 'good' : 'bad');
        break;
      case 'merit': CM().merit += n; UI.toast(`${ICON('功德')}功德 +${n}`, 'good'); break;
      case 'karma': CM().karma += n; UI.toast(`${ICON('業')}業 +${n}`, 'bad'); break;
      case 'rep': CM().rep = Math.max(0, CM().rep + n); UI.toast(`${ICON('香火')}香火 ${n > 0 ? '+' : ''}${n}`, n > 0 ? 'good' : 'bad'); break;
      case 'card':
        STORY.addCard(st.id, st.up);
        await SCN.cardPop(st.id, STORY.deckTarget() === 'base');
        break;
      case 'curse':
        STORY.addCard(st.id);
        await SCN.cardPop(st.id, STORY.deckTarget() === 'base', true);
        break;
      case 'relic':
        if (r && RELICS[st.id] && !r.relics.includes(st.id)) { r.relics.push(st.id); applyRelicGain(st.id); UI.toast(`${relicHTML(st.id)}<b>得到法器「${esc(RELICS[st.id].name)}」</b><br><small>${esc(RELICS[st.id].desc)}</small>`, 'relic', 3600); SND.play('discover'); markSeen('relics', st.id); }
        else if (r && RELICS[st.id]) { r.gold += 30; UI.toast(`${relicHTML(st.id)}<b>「${esc(RELICS[st.id].name)}」你已經有了</b><br><small>拿去給罔市估價：香油錢 +30</small>`, 'good', 3200); SND.play('coin'); }
        break;
      case 'item':
        if (r && ITEMS[st.id]) { if (r.items.length < (r.itemSlots || 3)) { r.items.push(st.id); UI.toast(`${itemHTML(st.id, 0)}<b>得到供品「${esc(ITEMS[st.id].name)}」</b>`, 'good'); } else UI.toast('供品欄滿了', 'bad'); }
        break;
      case 'boss':
        if (r) { r.bossMods = r.bossMods || { du: 0, yuan: 0 }; r.bossMods[st.k] = (r.bossMods[st.k] || 0) + n; if (st.k === 'du') UI.toast(`${ICON('渡')}法事開始時，渡 +${n}%`, 'good'); else UI.toast(`${ICON('怨')}首領的怨 ${n}%`, n < 0 ? 'good' : 'bad'); }
        break;
      case 'fight': {
        await SCN.hideForCombat();
        const res = await CAMP.scriptFight(st.enemies, st.kind || 'normal', st);
        if (!res.win) throw new CaseFailed({ fight: st.enemies });
        const main = res.outcomes.find(o => o.id === st.enemies[0]) || res.outcomes[0];
        CM().flags.last = main ? main.how : 'san';
        CM().flags['fight_' + st.enemies[0]] = CM().flags.last;
        break;
      }
      case 'remove':
        if (r) {
          const cands = r.deck.filter(c => !cdef(c).perm);
          const pick = await UI.pickCards(cands, { title: '刪去一張牌', sub: '從牌組裡拿掉一張。', min: 1, max: 1, cancel: true, cancelLabel: '不刪' });
          if (pick && pick[0]) { r.deck.splice(r.deck.indexOf(pick[0]), 1); SND.play('fire'); }
        }
        break;
      case 'upgrade':
        if (r) {
          const cands = r.deck.filter(c => !c.up && cdef(c).u && !['咒'].includes(cdef(c).el));
          const pick = await UI.pickCards(cands, { title: '開光一張牌', sub: '升級一張牌。', min: 1, max: 1, showUpgrade: true, cancel: true, cancelLabel: '算了' });
          if (pick && pick[0]) { pick[0].up = 1; SND.play('discover'); }
        }
        break;
    }
    UI.hud();
    saveGame();
  },
};
function figMini(id) { return `<span class="figmini">${figHTML(id)}</span>`; }
function applyRelicGain(id) {
  const R = RELICS[id], r = G.run;
  if (!R || !r) return;
  if (R.maxHp) { r.maxHp += R.maxHp; r.hp += R.maxHp; }
  if (R.slots) r.itemSlots = (r.itemSlots || 3) + R.slots;
}

/* ============================================================
   直譯器
   ============================================================ */
function safeIf(fn) { try { return !!fn(); } catch (e) { console.warn('劇本條件錯誤', e); return false; } }
async function runScript(steps, ctx = {}) {
  if (!steps) return;
  let pages = [];
  const flush = async () => { if (pages.length) { const p = pages; pages = []; await SCN.play(p, { bg: ctx.bg, keep: true, key: ctx.key }); } };
  for (const st of steps) {
    if (st == null) continue;
    if (typeof st === 'string') { pages.push(st); continue; }
    if (st.bg) { pages.push({ bg: st.bg }); ctx.bg = st.bg; continue; }
    if (st.sfx) { pages.push({ sfx: st.sfx }); continue; }
    await flush();
    if (st.truth) { await STORY.truth(st.truth); continue; }
    if (st.name) { await STORY.name(st.name); continue; }
    if (st.wish) { STORY.wish(st.wish); continue; }
    if (st.set) { STORY.set(st.set, st.v); continue; }
    if (st.do) { await STORY.act(st); continue; }
    if (st.choose) {
      const opts = (st.opts || []).filter(o => !o.if || safeIf(o.if));
      const opt = await SCN.choose(st.choose, opts);
      if (opt && opt.then) await runScript(opt.then, ctx);
      continue;
    }
    if ('if' in st) { const br = safeIf(st.if) ? st.then : st.else; if (br) await runScript(br, ctx); continue; }
    if ('jiao' in st) {
      const r = st.jiao === true ? (Math.random() < .5 ? 'sheng' : Math.random() < .5 ? 'xiao' : 'yin') : st.jiao;
      await SCN.jiao(r);
      const br = st.jiao === true ? st[r] : st.then;
      if (br) await runScript(br, ctx);
      continue;
    }
  }
  await flush();
}
/* 播一段劇本：開場景層 → 跑 → 關 */
async function playScript(steps, o = {}) {
  if (!steps || !steps.length) return;
  const prev = STORY.persist;
  STORY.persist = !!o.persist;
  try {
    await runScript(steps, { bg: o.bg || 'black', key: o.key });
  } finally {
    STORY.persist = prev;
    SCN.close();
  }
}
Object.assign(HHZ, { runScript, playScript, STORY });

  q1: { title: '元神花園', script: [
    {bg:'garden'},
    '紅布還綁在眼睛上。你卻看得清清楚楚。',
    '一條碎石子路，兩邊是一座接一座的花園，竹籬笆隔開，一路排到看不見的地方。',
    '每座花園門口插一塊木牌，寫著名字。都是活人的名字。',
    '空氣很涼，有濕泥土跟線香的味道。很遠很遠的上面，你聽見自己的聲音在唸咒。',
    '@美鳳：「遮是……啥物所在？」',
    '@魏子葳：「元神花園。帳本上寫，每個活人在下面都有一座。花開得好，人就好。」',
    '「尤美鳳」那塊牌子後面，雜草長到膝蓋。咸豐草、牛筋草、昭和草，擠成一團。',
    '雜草正中間，一株鳳仙花，紅的，開得很兇。',
    '@美鳳：「看啥？雜草嘛是草。」',
    '她蹲下去，用塗了紅指甲油的指甲，彈了一下那朵花。',
    '@美鳳：「細漢我爸摘這種花共我染指甲。伊講，這花佮我仝名。」',
    '她站起來，檳榔嚼得很快。',
    '下一塊牌子：魏子葳。',
    '你的花園，一半修剪得很整齊。草皮、兩盆發財樹、一排黃金葛。像保險公司的一樓大廳。',
    '另一半是枯的。草是褐色的，一碰就碎。土乾到裂開。',
    '枯掉的那一半正中間，有一塊方形的死土。',
    '四四方方，邊切得筆直，像先用尺量過才下的鏟子。土是灰的，沒有草，沒有蟲，沒有味道。',
    '你蹲下來看。你看過很多現場。枯死的東西，邊緣是爛的。這塊不是。',
    '這是被挖走的。挖的人很有耐心。',
    {truth:'withered'},
    '@美鳳：「你這塊，本來種啥？」',
    '@魏子葳：「不知道。大概是前女友。」',
    '@美鳳：「你有前女友？」',
    '@魏子葳：「……沒有。」',
    '背上一輕。紙妹自己爬下來了。這是她今晚第一次放開你。',
    '她走到那塊死土旁邊，蹲下，把兩隻紙手平平地貼在灰土上。像冬天把手放在暖爐上面。',
    '@魏子葳：「走了。」',
    '她沒動。你去拉她，紙手臂被拉長，發出很細的撕裂聲。她還是不放。',
    '你只好整個把她抱起來。她很輕，比一疊金紙還輕。',
    '一路上，她的臉都越過你的肩膀，看著那塊土，一直看到它被竹籬笆擋住。',
    '遠處傳來鐵鍊拖地的聲音。一隊陰兵走過田埂，沒有腳步聲。',
  ]},

  q2: { title: '陰間戶政事務所', script: [
    {bg:'bridge'},
    '奈何橋是一座水泥橋。欄杆刷過很多次漆，最上面一層是紅的，剝落的地方露出綠的、白的。',
    '橋頭擺了一張折疊桌、一個大鋁鍋、一疊紙杯。一個阿婆在舀湯。',

      '美鳳也舉起手，揮得很大力。那一晚她站在花車上，本來是要替這個新娘哭的。',
      '佩芸轉身過橋了。紅傘在霧裡縮成一個小紅點，然後不見了。',
    ], else:[

    {bg:'office'},
    '橋的盡頭是一棟兩層樓的水泥房子。磨石子地板，日光燈，綠色鐵窗。門口的牌子：陰間戶政事務所。',
    '服務時間：子時至寅時。裡面冷氣很強，有舊紙、樟腦丸跟印泥的味道。',

    '她從包包摸出一疊壽金，折三折，塞進警衛的口袋。警衛看了一眼，換了一張號碼牌給你：〇〇四。',
    '@魏子葳：「這是行賄。」',
    '@美鳳：「這號做人情世事。」',
    '幾隻小鬼在塑膠椅底下鑽來鑽去，偷撕別人的號碼牌。',
    '~叮咚。〇〇四號，請到三號櫃台。',
    '三號櫃台的承辦員是個瘦男人，油頭，黑框眼鏡，手臂套著藍色袖套。三十年前的公務員都戴這種袖套。',
    '他看了紙妹一眼。',
    '@承辦員：「紙紮的免抽號碼牌。紙紮的歸冥器科，三樓。」',
    '@承辦員：「辦啥物？」',
    '@美鳳：「查人。尤俊雄，我爸。」',
    '@承辦員：「個資法。只能查直系親屬。」',
    '他推過來一盒印泥。美鳳按了手印。紙上浮出一行字：尤美鳳，父，尤俊雄。',
    '承辦員打開一台電腦。黑底，綠字。他用兩根手指打字，打得很慢。',
    '@承辦員：「尤俊雄。民國八十四年七月十三歿。」',
    '@承辦員：「狀態：未報到。」',
    '@美鳳：「未報到……是啥物意思？」',
    '@承辦員：「就是無來報到。」',
    '他把畫面往下捲了幾行。',
    '@承辦員：「同一日，同一坑，閣有六筆。攏是未報到。」',
    '@魏子葳：「名字。」',
    '@承辦員：「個資法。」',
    '@魏子葳：「那一天五坑死了三十四個。其他二十七個呢？」',
    '@承辦員：「二十七個，攏有報到。」',
    '二十七個報到了。七個沒有。你前兩天才知道，有七個人在坑裡敲了三天。',
    {truth:'unreported'},
    '美鳳盯著螢幕。她的拇指還沾著印泥，一直按在自己的黑洋裝上，按出一個紅印子。',
    '@承辦員：「你咧？你欲查啥人？」',
    '你張開嘴。',

    '沒有一個是你的人。',
    '阿公？你想了一下。你沒有什麼要問他的。',
    '@魏子葳：「沒有。」',
    '承辦員拿起一顆章，蓋在表格上。章上刻著一個字：無。',

    {if:()=>OUT('c1')==='du', then:[
      '承辦員沒有打字。他推了推眼鏡。',
      '@承辦員：「彼個印尼的喔？伊無佇阮遮。」',
      '@承辦員：「他回他自己的地方去了。」',
      '你想起深潭邊的石灘。阿迪跪在濕石頭上，一邊哭，一邊把禱詞翻給你聽：瓦尤，我們回家。',
    ], else:[
      '承辦員打了幾個字。',
      '@承辦員：「查無此人。」',
      '他沒有看你，下巴往隔壁窗口抬了一下。',

    '隔壁窗口的牌子是手寫的：散魂。窗口後面沒有人，只有一個鐵的收件籃，空的。',
    '@魏子葳：「那個窗口辦什麼？」',
    '@承辦員：「散掉的不歸我們管。都往下沉。」',
    '@承辦員：「沉到哪？誰知道。」',
    '你低頭。磨石子地板的縫裡，有黑色的灰，細得像香灰，一點一點往下飄。',
    '不是掉下去。是被吸下去的。',
    {truth:'sinking'},
    {if:()=>OUT('c1')==='san'||OUT('c2')==='san'||OUT('c3')==='san', then:[

    ], else:[
      '你想起纏在小宇身上的那團「驚」。你把它打散的時候，沒有想過它會去哪裡。',
    ]},
  ]},

  q3: { title: '血湖', script: [
    {bg:'bloodlake'},
    '戶政事務所的後門推開，是一片湖。',
    '湖水是紅的。不是夕陽那種紅，是放了很久、快要變黑的那種紅。',
    {sfx:'water'},
    '熱氣從水面冒上來，帶著鐵鏽味。跟烏溪排水口那一段的水，一模一樣的味道。',
    '湖裡站著很多女人，水淹到胸口、到脖子。她們不動。只有嘴唇在動，像在叫誰。',
    '@美鳳：「血湖。」',
    '@美鳳：「我哭過兩百外場打血盆。道士扮目連，錫杖拍破紙糊的血盆城，孝女跪咧啉一杯紅酒。」',
    '@美鳳：「啉落去，我就開始哭。」',
    '@美鳳：「原來是真的。」',
    '離岸邊最近的那個女人抬起頭，看著你。',

    '她看你的臉，看得很仔細，像在對照片。',
    '@阿嬤：「你……你是淑貞的囝？」',
    '你媽的名字，從一個比你年輕的女人嘴裡說出來。',
    '@阿嬤：「我是蔡月娥。你阿公的某。」',
    '民國五十九年，你媽出生那一晚，你阿嬤難產走了。家裡只有一個產婆。你知道的就這麼多。',
    '她死的時候二十四歲。她現在還是二十四歲。你三十。',
    '@魏子葳：「妳沒看過我媽長大。妳怎麼認得我？」',
    '@阿嬤：「你阿公逐年落來，攏會提相片予我看。淑貞讀冊、淑貞嫁翁、淑貞抱囡仔。」',
    '@阿嬤：「彼個囡仔，就是你。」',
    '@阿嬤：「伊逐年七月十六來，坐佇岸頂，講規暝的話。膝頭攏是塗。」',
    '@阿嬤：「你阿公……每年七月十五都去五坑口跪，跪到天光。」',

    '@魏子葳：「跪什麼？」',
    '@阿嬤：「我問過。伊講：欠人的。」',
    '@魏子葳：「阿公過世了。六月的事。」',
    '她低頭看著湖水，看了很久，像在翻一本日曆。',
    '@阿嬤：「按呢……今年伊袂來矣。」',
    '@阿嬤：「伊毋敢來救我。伊講，法師不渡自家人。」',
    '你知道這一條。壇規貼在神明桌旁邊，阿公的毛筆字：法師不渡自家人。',
    '你第一次讀到，把它讀成一條除外責任：自家人，不在承保範圍內。很合理。',
    '現在你站在這條規定的這一邊。另一邊，泡著一個二十四歲的女人，泡了五十六年。',
    '@美鳳：「你欲救伊無？」',
    {choose:'血湖邊。阿嬤看著你。', opts:[
      {label:'破血湖', sub:'犯壇規「法師不渡自家人」。這一戰，渡的法會反咬你。', then:[
        '你把外套脫了，走進湖裡。',
        '湖水是溫的，跟人的體溫一樣。它不像水，像很多隻手，從腳踝一路抓上來。',
        '@阿嬤：「毋通！你是法師——」',
        '@魏子葳：「我是做保險的。」',
        '壇規沒有寫但書。你知道你在鑽漏洞。你這一行的人，最會鑽漏洞。',

        '你彎腰捧起一口湖水，喝了。溫的，鐵鏽味，尾巴有一點甜。',

        '湖面一下子滾了起來。所有的女人同時轉過頭。',

        {do:'fight', enemies:['amah'], kind:'elite'},
        {if:()=>F('last')==='du', then:[

          '阿嬤不見了。她剛才站的地方，浮著一小撮黑灰。',
          '黑灰沒有散開。它往下沉。',
          '「散掉的不歸我們管。都往下沉。」你想起那個戴袖套的承辦員。',
          '湖裡的女人一個一個轉過身去，把背對著你。',
          '美鳳在岸上，手摀著嘴。她沒有叫你。',

      ]},

        '她看了一眼你的口袋。',
        '@阿嬤：「無要緊，我等習慣了。」',
        '@阿嬤：「明年……你會閣來無？」',
        '@魏子葳：「我不知道。」',
        '@阿嬤：「按呢就好。」',
        '她往後退。湖水淹過她的肩膀、她的下巴。銀簪在水面上亮了一下。',
        '你轉身走。你沒有回頭。',
        '阿公大概也是這樣走的。一年一次，五十幾年。',
      ]},
    ]},
  ]},

  pre: [
    {bg:'underworld'},
    '回去的路是一道很長的土坡，兩邊是黑的。很遠的上面，錄音的你還在唸：天清清，地靈靈。',

    '@陰差：「滯留亡魂：林秋桂。民國八十五年生，民國九十七年七月十五日歿，得年十二。」',
    '@陰差：「死因：墜落。查無報到，依法拘提。」',

        '你坐在第二排，正對著第一排那張空椅。',
        '五娘繼續唱。你聽不懂一半的戲詞。前面那張空椅在打拍子，椅腳在地上叩、叩地響。',
        '三個小時。你的腳凍到沒有知覺。現在是八月。',
        '唱到五娘投荔枝那一段，空椅不打拍子了。你聽見很小聲的，一個老人在跟著哼。',
        '散場時，班主給你一個紅包，比剛剛那個薄。',
        '第一排的椅子上，留下一小撮白色的棉絮。',
        {do:'hp', n:-6}, {do:'merit', n:1}, {do:'gold', n:15},
      ]},
    ]},
  ]},

  { id:'binlang', title:'兩點的客人', bg:'street', cases:[1,2,3], once:true, script:[
    '縣道邊的檳榔攤，招牌是一整排粉紅色的 LED：「阿珠檳榔　菁仔　雙子星　包葉」。',
    '阿珠四十八歲，穿螢光綠背心，包檳榔的手速比你打字還快。',
    '@阿珠：「少年仔，你是添丁壇的？」',
    '她丟了一包雙子星給你，不收錢。',
    '@阿珠：「我有代誌拜託你。」',
    '她打開收銀的鐵盒。裡面一疊一疊的，全是冥紙。',
    '@阿珠：「逐暗兩點，一台砂石車停佇遐。一个查埔人落來，買兩包菁仔、一罐保力達，付的攏是這款錢。」',
    '兩年了。每天晚上一百五十塊的檳榔，換一疊冥紙。',
    '你問她那個男人長什麼樣子。她指了指牆上的結婚照：男人穿西裝，笑得很土，嘴角有一點檳榔汁的紅。',
    '@阿珠：「阮翁。開砂石車，兩冬前佇第九彎翻落去。」',
    '@阿珠：「我欲做生意。你共伊趕走，我予你五千。」',
    {choose:'兩點快到了。', opts:[
      {label:'收錢辦事', sub:'五千塊，打散他（戰鬥）', then:[
        '兩點整。一台沒有開燈的砂石車，停在攤子前面。',
        '駕駛座的門打開。你先動手。',
        {do:'fight', enemies:['guhun'], kind:'elite'},
        {if:()=>F('last')==='san', then:[
          '砂石車不見了。鐵盒裡再也沒有出現過冥紙。',
          '阿珠數了五千塊給你，還包了一大袋檳榔，說給你拿去拜。',
          '一個月後你經過。晚上十點，阿珠的攤子就收了，鐵捲門拉下來，LED 招牌暗著。',
          '@阿珠：「兩點又無人客。開遐爾晏，欲創啥。」',
          {do:'gold', n:55}, {do:'item', id:'binlang_p'},
        ], else:[
          '他靜下來了，站在攤子前面，手裡還捏著兩張冥紙，不知道該交給誰。',
          '@砂石車司機：「阿珠，妳莫閣顧暗暝矣。這條路，暗時足危險。」',
          '阿珠把檳榔刀往砧板上一剁。「你若會煩惱，你就毋通死啊！」',
          '他笑了。笑得跟照片一樣土。然後就沒有了。',
          '阿珠只付了你一半。她說另一半，是她老公欠她的。',
          {do:'gold', n:25}, {do:'item', id:'binlang_p'},
        ]},
      ]},
      {label:'先問他要什麼', sub:'陪阿珠等到兩點（陽火 −5，功德 +1）', then:[
        '你坐在攤子旁的小板凳上陪她等。她包了四十幾顆檳榔，一句話都沒說。',
        '兩點整，一台沒開燈的砂石車停在攤前。一個男人下車走到窗口，臉是灰的，只有嘴角那一點紅是新的。',
        '@魏子葳：「大哥，你每天晚上來，是要做什麼？」',
        '他看著阿珠。看了很久。',
        '@砂石車司機：「伊一个查某人，半暝閣咧顧攤。這條路一暗過幾百台砂石車，我毋放心。」',
        '阿珠把檳榔刀往砧板上一剁。「你若會煩惱，你就毋通死啊！」',
        '她哭了。他把冥紙放在窗口，說這是最後一次。然後倒車，開走，車燈一次都沒有亮。',
        '隔天開始，阿珠每天晚上十二點就收攤。她說半夜那兩個鐘頭，本來是一天最好賺的。',
        '她沒有付你錢。她說你害她少賺，兩個人算扯平。',
        {do:'hp', n:-5}, {do:'merit', n:1}, {do:'item', id:'binlang_p'},
      ]},
    ]},
  ]},

  { id:'seven', title:'大夜班', bg:'street', cases:[2,3], once:true, script:[
    '凌晨兩點五十分，烏坑唯一一間便利商店。自動門「叮咚——」打開，店員抬頭：「歡迎光臨。」',
    '然後她低頭看著你腳邊：「妹妹也歡迎光臨。」你停住。紙妹也停住。',
    '店員叫小芬，大學休學回來顧店，眼睛下面兩圈黑。',
    '@小芬：「我從小就看得到。沒關係，這間店本來就很多。」',
    '紙妹走到關東煮前面，盯著白蘿蔔。小芬撈了一塊蘿蔔、一顆貢丸，放進紙碗推過去：「店長不在，算我的。」',
    '紙妹捧著碗湊近，熱氣一碰到她的臉，她就往後縮。紙做的臉，最怕水氣。',
    '虎爺趁亂跳上櫃台，把整鍋茶葉蛋撞翻了。',
    '小芬看得見鬼，看不見神明。她只看見茶葉蛋一顆一顆滾出來，其中一顆的殼，自己裂開了。',
    '@小芬：「……這個也是你帶來的？」',
    '@魏子葳：「那是神明。」',
    '@小芬：「神明在吃茶葉蛋。」',
    '@魏子葳：「神明確實在吃茶葉蛋。」',
    {if:()=>COMP('meifeng'), then:[
      '美鳳從冰櫃拿了兩瓶保力達、一包長壽，要小芬打統編。「我要報帳。」',
    ]},
    '三點十分。自動門「叮咚——」自己開了。',
    '沒有人進來。但最裡面那排貨架，泡麵一包一包被轉正，標籤全部朝外，排得像閱兵。',
    '冰櫃門打開，又關上。麥香奶茶少了一罐。',
    '@小芬：「阿德哥。以前的大夜班，做了十一年，前年在倉庫倒下去。」',
    '@小芬：「他每天幫我補貨、排面，比店長還認真。我只是每天要自己補二十塊。」',
    {choose:'阿德哥還在排泡麵。', opts:[
      {label:'讓他下班', sub:'替他打最後一次下班卡（功德 +1，得供品）', then:[
        '你在後面打卡鐘的最底下，找到一張舊卡片，名字寫著「德」。插進去，喀嚓。下班時間：三點十七分。',
        '貨架那邊安靜下來。最後一包泡麵轉到一半，停住了。',
        '冰櫃玻璃的霧氣上，有人用手指寫了兩個字：「辛苦」。',
        '@小芬：「……以後三點，就剩我一個了。」',
        '她把剩下的茶葉蛋全部包給你，說反正神明也吃過了。',
        {do:'merit', n:1}, {do:'item', id:'jidan'},
      ]},
      {label:'讓他繼續上班', sub:'你包下他的員工餐（香油錢 −15，香火 +1）', then:[
        '你在員工留言本上寫：「麥香奶茶，每日一罐，阿德哥自取。帳記添丁壇。」先付一個月，六百塊。',
        '小芬看著那行字，笑了。後來鎮上都在傳：添丁壇的孫，連大夜班都顧。',
        '冰櫃玻璃的霧氣上，有人用手指畫了一個讚。',
        {do:'gold', n:-15}, {do:'rep', n:1},
      ]},
    ]},
  ]},

  { id:'yinmiao', title:'求明牌', bg:'road', cases:[2,3], once:true, script:[
    '山路第九個彎，有一間很小的祠。一公尺高，紅磚牆，鐵皮頂，門楣寫著「大眾爺」。',
    '鬼月半夜，這裡比烏金宮還熱鬧。十幾台機車停在路邊，香爐插滿了香，供桌上一排大樂透彩券。',
    '一個穿藍白拖的阿伯蹲在香爐前，捧著一碗米，米上插三支香，等香灰掉下來，看落成什麼數字。',
    '他叫阿全。他說去年在這裡求到明牌，中了四十七萬。',
    '@阿全：「毋過大眾爺愛還願。我答應欲請一棚戲，猶未請。」',
    '@阿全：「這馬我逐暝眠夢，攏有人坐佇我床頭數錢。數甲天光。」',
    '說到這裡，他看你的眼神忽然變得很精。',
    '@阿全：「你是添丁仔的孫。添丁仔會『五鬼運財』，規庄攏知，伊毋做爾爾。」',
    '阿公壇裡有一個上鎖的鐵櫃，你沒有鑰匙。鎮上都說，添丁師那些「會，但毋做」的法，全鎖在裡面。',
    '阿全把一個紅包塞進你手裡，厚得像一本存摺。',
    '@阿全：「你共我做。這三萬予你，後擺中了，閣分你一成。」',
    '紙妹蹲在祠邊，用手指去戳那碗米。米粒一顆一顆，往下掉。',
    {choose:'三萬塊在你手上。', opts:[
      {label:'做五鬼運財', sub:'三萬，外加一成（得邪法，業 +2，香油錢 +60）', then:[
        '阿全比你還熟。五個碗、五炷香、一張黑色的符，他連符都準備好了。你只要唸。',
        '你唸了。香灰沒有往下掉，它往旁邊飄，分成五道，往五個方向去，像五個人各自出門辦事。',
        '阿全大笑，把整疊彩券抱在胸口。',
        '紙妹站起來，背對著你。一直到下山，她都沒有轉回來。',
        '那天晚上，你夢到有人坐在你床頭數錢。數的是你皮夾裡的。',
        {do:'gold', n:60}, {do:'card', id:'wugui'}, {do:'karma', n:2},
      ]},
      {label:'替他還願', sub:'你出錢請一棚布袋戲（香油錢 −30，功德 +1）', then:[
        '@魏子葳：「欠戲還戲。你夢到的那個，是來討債的，不是來送錢的。」',
        '你打給山下的布袋戲團，一棚三千，隔天晚上就來。',
        '整條山路只有一個觀眾：阿全。他坐在塑膠椅上從頭看到尾，一直在打瞌睡。',
        '戲演完，大眾爺祠的三支香，燒得一樣長。',
        '@阿全：「早知影遮爾俗，我去年就請矣。」',
        '他沒有把三萬給你。他說明年再中，一定分你。',
        {do:'gold', n:-30}, {do:'merit', n:1},
      ]},
      {label:'收下紅包，什麼都不做', sub:'他不會知道的（香油錢 +60，業 +1，得詛咒）', then:[
        '你收下紅包，對著祠拜三拜，嘴裡唸了一段連你自己都不知道是什麼的咒。',
        '阿全感動到握著你的手一直搖。',
        '回壇的路上，你背後一直有腳步聲。五個人的，不快不慢，跟著你。',
        '你做理賠，剪過幾百件詐領。這是你第一次自己收一筆。',
        {do:'gold', n:60}, {do:'karma', n:1}, {do:'curse', id:'yezhang'},
      ]},
    ]},
  ]},

  { id:'fortune', title:'鳥卦', bg:'street', cases:[5,6], once:true, script:[
    '烏金宮廟口，一張摺疊桌，一塊紅布：「鐵口直斷　字姓　八字　鳥卦　一次兩百」。',
    '算命仙戴著墨鏡，是真的瞎。桌上一個竹籠，裡面關著一隻文鳥。',
    '@算命仙：「少年仔，你後壁彼个查某囡仔，嘛予鳥仔抽一支。」',
    '紙妹躲到你背後。過了一下，又探出頭。',
    '你付了兩百。文鳥跳出籠子，在一排籤卡上走來走去，最後叼起一張，放在紙妹面前。算命仙摸著卡上的點字。',
    '@算命仙：「『等』。這支籤，我擺十幾冬，鳥仔毋捌抽過。」',
    '他把墨鏡往下拉。眼睛是兩團灰白。',
    '@算命仙：「你想欲予伊活轉來無？」',
    '@算命仙：「我有一个法，叫『借命』。你的陽壽借伊一段。紙身變肉身，會食飯，會大漢，會叫你的名。」',
    '@算命仙：「三冬換一冬。借伊十冬，你出三十冬。」',
    '你是做保險的，算得很快。三十歲男性，平均餘命四十七年。扣掉三十，你四十七歲走。',
    '她會長到二十二歲。會吃飯。會大聲叫你的名字。',
    '紙妹拿出她的紅筊，往地上一擲。',
    {jiao:'yin', then:[
      '陰筊。',
      '她撿起來，又擲一次。陰筊。',
      '第三次，她沒有擲。她把兩片筊杯按在你的手背上，平的那面朝下，按得很用力。',
    ]},
    {choose:'算命仙在等你的答案。', opts:[
      {label:'買下借命的法', sub:'她說不要。你想要。（得邪法，業 +2，香油錢 −30，陽火上限 −5）', then:[
        '算命仙收了你六千，把一張黃紙摺成三角形，塞進你胸前的口袋。',
        '@算命仙：「欲用的時陣，你家己會知。」',
        '那天晚上，紙妹一直坐在壇的另一頭，離你最遠的那個角落。',
        '你是做保險的。你很清楚自己剛剛做了什麼：你買了一張保單，受益人不是你。',
        {do:'gold', n:-30}, {do:'card', id:'jieming'}, {do:'karma', n:2}, {do:'maxhp', n:-5},
      ]},
      {label:'聽她的', sub:'只付兩百（得牌，功德 +1）', then:[
        '你把手從她的筊杯底下抽出來，站起身。',
        '算命仙沒有生氣。他把那張「等」的籤卡推過來。',
        '@算命仙：「送你。這支，是伊家己抽著的。」',
        '回去的路上，紙妹一直走在你旁邊。很近，近到她的紙袖子一路都擦著你的手背。',
        {do:'card', id:'zaiwen'}, {do:'merit', n:1},
      ]},
    ]},
  ]},

  { id:'grave', title:'遷葬公告', bg:'road', cases:[2,3,5], once:true, script:[
    '公墓在山莊工地上方的坡上。墓碑歪歪斜斜，大花咸豐草長得比人還高。',
    '每一座墓前都插著黃色木牌：「烏金山莊二期工程　無主墳墓　公告日起三十日內遷葬　逾期統一處理」。',
    '「統一處理」四個字，你在公文裡看過很多次。意思是：沒人認領的，一起挖掉。',
    '一座很小的墓，墓碑裂成兩半，名字只剩「黃門許氏」四個字。',
    '墓碑上坐著一個老阿婆，梳著髻，穿藍色大襟衫，膝蓋上放著那張公告。她不識字，一直盯著看。',
    '@路人：「少年仔，這張寫啥？」',
    '你唸給她聽。她聽完，點點頭：「按呢喔。」然後繼續坐著。',
    '一台怪手停在坡下，熄著火。工頭戴著安全帽走上來，手上拿著一疊名單。',
    '@工頭：「添丁壇的？剛好。這座最麻煩，怪手一靠近就熄火。你幫我清掉，一座三千。」',
    '@工頭：「後面還有十一座。你全部包，我算你三萬六。」',
    '阿婆把公告摺起來，放進大襟衫的口袋，拍了兩下。',
    {choose:'怪手在坡下等著。', opts:[
      {label:'清掉', sub:'三千一座，後面還有十一座（戰鬥）', then:[
        {do:'fight', enemies:['guhun','wuming'], kind:'normal'},
        {if:()=>F('last')==='san', then:[
          '阿婆散了。怪手一發就著。一個下午，十二座墓推平。',
          '工頭數了三萬六給你，還請你喝了一瓶蠻牛。',
          '你經過土堆的時候，看見那塊裂成兩半的墓碑被丟在最上面，「黃門許氏」四個字朝下。',
          {do:'gold', n:60},
        ], else:[
          '她靜下來以後，把口袋裡那張公告拿出來，攤平，還給你。',
          '@路人：「無要緊。我等遐久矣，換一个所在等，嘛仝款。」',
          '她走了。隔天，怪手把十二座墓一起推平。',
          '工頭只付了一座的錢。他說其他的，是怪手自己推的。',
          {do:'gold', n:15}, {do:'card', id:'wangsheng'},
        ]},
      ]},
      {label:'替她撿骨', sub:'撿骨師傅加塔位，你出（香油錢 −45，功德 +2）', then:[
        '你打給山下的撿骨師傅。撿骨八千，納骨塔最便宜的位子一萬二。你刷卡。',
        '墓打開，棺木早就爛了。骨頭很小，比你想像的小。',
        '師傅用米酒一根一根擦乾淨，從腳往上排進金斗甕，排成一個坐著的樣子。',
        '阿婆蹲在旁邊看，很認真，像在看人家幫她蓋房子。',
        '@路人：「我毋捌坐過遮爾好的厝。」',
        '你抱著金斗甕下坡的時候，怪手已經發動了。',
        '後面那十一座，你沒有錢了。怪手一座一座推過去，你一座一座聽著。',
        {do:'gold', n:-45}, {do:'merit', n:2},
      ]},
    ]},
  ]},

  { id:'moving', title:'鬼月搬厝', bg:'street', cases:[1,2,3,5,6], once:true, script:[
    '老街尾一間透天厝前面，停了一台搬家貨車，車斗上印著「大發搬家　一通電話到府服務」。',
    '兩個工人坐在路邊抽菸，不肯動。',
    '@路人：「鬼月搬厝，會紮物件走。加錢嘛無愛。」',
    '屋主叫志偉，四十歲，從桃園趕回來。他要在月底前把房子清空，交給江氏建設。',
    '@志偉：「兩百八十萬，簽約了。過期一天扣一萬。」',
    '@志偉：「我爸上個月走的。房子留給我，還有一百二十萬的債。」',
    '他一講完，屋裡的神明桌「咚」地響了一聲。',
    '你進去看。神明桌上是他爸的神主牌。香爐裡三支香，同時斷成兩截。',
    '牆角靠著一塊店招：「阿順麵店」。紅底白字，被油煙燻成咖啡色。這一樓，煮了四十年的麵。',
    '二樓樓梯口，一個穿白汗衫的老人擋在那裡，雙手張開。',
    '他不是在擋你。他在擋那兩個工人，像在擋一群要來拆他攤子的人。',
    {choose:'老人擋在樓梯口，不肯讓。', opts:[
      {label:'勸他讓開', sub:'替父子兩個把話講開（陽火 −4，功德 +1）', then:[
        '你對著樓梯口，把志偉的話一句一句講給他聽：兩百八十萬，一百二十萬的債，過期一天一萬。',
        '老人的手，慢慢放下來。',
        '@志偉：「阿爸……我無法度。」',
        '樓梯口沒有聲音。然後，牆角那塊「阿順麵店」的店招自己倒下來，正好倒在志偉腳邊。',
        '志偉愣了很久，把店招抱起來。',
        '@志偉：「這塊，我紮去桃園。我店門口，閣欠一塊招牌。」',
        '搬家的時候，神主牌先出門。老人跟在後面，走得很慢，每一步都回頭看一眼一樓的灶腳。',
        '志偉塞給你一千五。他說他本來想塞更多，但他真的沒有。',
        {do:'hp', n:-4}, {do:'merit', n:1}, {do:'gold', n:15},
      ]},
      {label:'把他清出去', sub:'志偉付五千，今晚就能搬（戰鬥）', then:[
        {do:'fight', enemies:['guhun','jing_e'], kind:'normal'},
        {if:()=>F('last')==='san', then:[
          '樓梯口空了。工人們把菸踩熄，一個小時搬完整間房子。',
          '志偉數了五千給你，還請你吃了一碗滷肉飯。',
          '他把神主牌用報紙包好，跟電鍋放在同一個紙箱裡。',
          '神主牌是空的。你知道，他不知道。',
          '他以後每年初一十五，還是會對著它拜。',
          {do:'gold', n:50},
        ], else:[
          '老人坐在樓梯上喘氣，汗衫濕透，像剛收完一整天的攤。',
          '你把志偉叫進來，讓他把話自己講一遍。',
          '搬家的時候，神主牌先出門。老人跟在後面，一路都沒有回頭。',
          '志偉付了你三千五，說剩下的一千五，下個月領薪水再匯。',
          '他說他爸以前就是這樣，吵完就沒事了。',
          {do:'gold', n:35},
        ]},
      ]},
    ]},
  ]},

  { id:'swim', title:'第六個', bg:'river', cases:[2,3], once:true, script:[
    '烏溪下游的三角石，水比較淺，是鎮上國中生偷游泳的地方。',
    '鬼月不能玩水，每個阿嬤都講過。五個國中男生還是脫到只剩內褲跳下去。你本來只是經過，然後聽見他們在數人。',
    '@路人：「一、二、三、四、五……六。」',
    '@路人：「欸，六個？誰多出來？」',
    '@路人：「你算錯啦。再算一次。一、二、三、四、五、六。」',
    '第六個笑得最開心。理平頭，嘴唇有一點紫，穿著老式的藍色尼龍泳褲——現在已經沒有人穿那種泳褲了。',
    '紙妹站在岸邊，離水很遠。她手裡的筊杯一直在抖。',
    '@路人：「喔，那是阿國啦。他每年夏天都在。他很會找扁石頭，打水漂可以跳十一下。」',
    '@魏子葳：「他什麼時候開始在的？」',
    '@路人：「我國一就在了。我哥國一的時候也在。」',
    '平頭男生看見你，對你招手，笑出一排白牙。',
    '@阿國：「阿兄，來耍啦！」',
    {choose:'第六個孩子在水裡對你招手。', opts:[
      {label:'下水，陪他玩到累', sub:'他得自己願意上岸（陽火 −8，功德 +1，得牌）', then:[
        '你脫了鞋，走進水裡。八月的溪水，冰得像冬天。',
        '你陪他打水漂。他跳十一下，你跳兩下，他笑到嗆水。你們比閉氣，比誰的石頭最扁，比到太陽掉到山後面。',
        '天快黑的時候，他爬上三角石坐著，腳泡在水裡，看著上游。',
        '@阿國：「阿兄，我欲轉去矣。阮阿母咧叫我食飯。」',
        '他跳下石頭，往上游走，水面沒有起一點波紋。走著走著，就沒有了。',
        '國中生們在岸上穿衣服。一個一個數：一、二、三、四、五。',
        '@路人：「……阿國咧？」',
        '沒有人回答。那天之後，他們說三角石的水，變得比較冷。',
        {do:'hp', n:-8}, {do:'merit', n:1}, {do:'card', id:'anhun'},
      ]},
      {label:'把他打散', sub:'趁他還沒拉人（戰鬥）', then:[
        '你踩進水裡，抽出符。平頭男生的笑停住了。',
        '水底的水草纏上你的小腿，一圈一圈，越纏越緊。',
        {do:'fight', enemies:['xiaogui','shuizao'], kind:'normal'},
        {if:()=>F('last')==='san', then:[
          '水面冒上來一串泡泡，然後什麼都沒有了。',
          '五個國中生愣在水裡。其中一個忽然哭出來。',
          '@路人：「你幹嘛打阿國！他又沒怎樣！」',
          '晚上，他們的家長一起來壇裡，包了一個大紅包，說謝謝你救了他們家的孩子。',
          '那五個孩子，沒有一個跟來。',
          {do:'gold', n:40}, {do:'rep', n:1},
        ], else:[
          '他安靜下來，坐在淺灘上，抱著膝蓋發抖。',
          '@阿國：「阿兄，我干焦想欲有人佮我耍。」',
          '你陪他坐到天黑。他往上游走了，走得很慢，一直回頭看那五個人。',
          {do:'merit', n:1},
        ]},
      ]},
      {label:'把國中生叫上岸', sub:'什麼都不處理，只是趕人（香火 +1）', then:[
        '@魏子葳：「全部上來！鬼月玩水，我打電話給你們班導！」',
        '五個人罵罵咧咧地上岸，一邊穿衣服一邊抱怨。',
        '你回頭看了一眼。平頭男生一個人站在水裡，對著你們揮手。一直揮。',
        '明年夏天，他還會在這裡，等人數到六。',
        {do:'rep', n:1},
      ]},
    ]},
  ]},

  { id:'phone', title:'三點十七分', bg:'altar', cases:[2,3], once:true, script:[
    {sfx:'phone'},
    '凌晨三點十七分，你的手機響了。',
    '來電顯示：「阿忠」。你的通訊錄裡沒有這個人。你接起來，那邊有風聲，還有一台電視在轉播棒球。',
    '@阿忠：「喂？……啊，歹勢歹勢，我敲毋著矣。」',
    '嘟。掛了。早上你回撥，是語音信箱。',
    '@阿忠：「我是阿忠，這馬無法度接，有代誌請留話，我等咧回你。」',
    '下午，一個女人來壇裡。她叫麗卿，五十幾歲，手裡握著一支很舊的手機，螢幕裂了一角。',
    '@麗卿：「阮翁上個月走的。伊的電話我逐月繳三百九十九，暗時睏袂去，就敲予伊，聽伊講『我等咧回你』。」',
    '@麗卿：「毋過這禮拜，鎮上有七、八个人講，半暝接著伊的電話。」',
    '她笑了一下，眼淚跟著掉下來。',
    '@麗卿：「伊生前就按呢。敲電話，逐擺都敲毋著。」',
    '紙妹坐在神明桌邊，捧著筊杯。你問她：阿忠還在這支電話裡？',
    {jiao:'sheng', then:[
      '聖筊。',
      '線沒斷，人就順著線，一直在找回家的號碼。找不到，就一直撥錯。要送他走，得先停話。',
    ]},
    '@麗卿：「停話，我就聽袂著伊的聲矣。」',
    {choose:'麗卿握著那支手機。', opts:[
      {label:'停話，送他走', sub:'她會失去最後一個聲音（功德 +1，陽火 −3）', then:[
        '你陪她去電信公司。櫃台小姐問停話原因，她說：「伊無需要矣。」',
        '停話之前，她撥了最後一次，開擴音，用你的手機錄下那句「我等咧回你」。',
        '櫃台小姐按下確認。回到壇裡，她說想再聽一次。你按下播放。',
        '錄音檔四十秒。裡面只有沙沙的雜音，一個字都沒有。',
        '麗卿沒有哭。她把手機收進皮包：「按呢嘛好。伊毋免閣敲毋著矣。」',
        '那天晚上三點十七分，你的手機沒有響。你醒著，等了一個小時。',
        {do:'merit', n:1}, {do:'hp', n:-3},
      ]},
      {label:'不停話', sub:'她塞給你六百塊，求你不要（香油錢 +30，得詛咒）', then:[
        '@麗卿：「拜託你。伊欲敲毋著，就予伊敲毋著。我擔。」',
        '她把六百塊壓在香爐底下，走了。',
        '那個月她繳了三百九十九。下個月也繳了。每天晚上三點十七分，你的手機都會響。',
        '@阿忠：「喂？……啊，歹勢，我閣敲毋著矣。」',
        '你每一次都接。你也說不出為什麼。',
        {do:'gold', n:30}, {do:'curse', id:'yinqi'},
      ]},
    ]},
  ]},

  { id:'bus', title:'末班車', bg:'road', cases:[2,3], once:true, script:[
    '往烏坑的末班公車，二十二點四十分從山下發車，九彎十八拐，終點站「烏金坑」。',
    '車上只有你、紙妹、虎爺，還有最後一排靠窗的一個女學生。',
    '她穿烏坑國中的舊制服，白上衣，藍百褶裙，書包抱在腿上，頭靠著車窗。',
    '司機從後照鏡看了你一眼，再看了她一眼。他叫阿滿伯，這條線開了三十年。',
    '@阿滿伯：「莫看伊。伊逐暗攏佇遐。坐到尾站，落車，沿路行轉去。行到第七彎，就無去矣。」',
    '@阿滿伯：「民國七十九年，補習了，赴無尾班車，家己行路轉去，予運煤的卡車挵著。」',
    '@阿滿伯：「我開這線三十冬。伊坐三十冬。」',
    '公車到了終點站。女學生站起來，對司機點點頭，下車，往山路走。',
    '她的皮鞋踩在柏油路上，沒有聲音。',
    {choose:'她一個人往黑暗的山路走去。', opts:[
      {label:'陪她走', sub:'走到第七彎，回程的車就沒了（陽火 −6，功德 +1，得牌）', then:[
        '你追上去，走在她旁邊。她看了你一眼，沒有躲。',
        '一路沒有路燈。紙妹牽著你另一隻手，虎爺走在最前面，尾巴翹得很高。',
        '第七彎到了。她停下來，書包抱得很緊，腳在發抖。',
        '彎道那頭，兩盞大燈亮起來，越來越近，引擎轟轟地響。這條路上，早就沒有運煤的卡車了。',
        '你往前一步，站到她前面。燈光穿過你的身體，穿過她的身體，然後就沒有了。',
        '她繼續往上走，一直走到一間屋頂塌了一半的透天厝前面。',
        '@女學生：「阿母，我轉來矣。」',
        '她走進去。你走了兩個小時的山路下山，鞋底磨穿一個洞。',
        '隔天晚上，阿滿伯的末班車，最後一排是空的。三十年來第一次。',
        '他說下個月這條線的末班車就要停駛了。沒有乘客。',
        '@阿滿伯：「伊是這班車，上尾一个人客。」',
        {do:'hp', n:-6}, {do:'merit', n:1}, {do:'card', id:'qianwang'},
      ]},
      {label:'回壇裡', sub:'不關你的事（得供品）', then:[
        '你沒有跟上去。阿滿伯熄了火，在站牌下點了一根菸，跟你聊天。',
        '他聊他開過幾次颱風夜，聊他女兒嫁去高雄。',
        '@阿滿伯：「多謝你陪我講話。這條路，暗時足寂寞。」',
        '他塞給你一包檳榔，開著空車下山。',
        '你走回壇裡的時候，山上那條路傳來很大的引擎聲，轟轟地響，然後停了。',
        '這條路上，早就沒有運煤的卡車了。',
        {do:'item', id:'binlang_p'},
      ]},
    ]},
  ]},

  { id:'backseat', title:'後座', bg:'road', cases:[2,3,5], once:true, script:[
    '你借了里長伯的機車。一台二十年的老野狼，發動要踩三次。',
    '紙妹坐在前面的菜籃裡，像一袋很乖的青蔥。',
    '虎爺趴在油箱上，尾巴垂下去，好幾次差點被前輪捲進去。',
    '下坡的時候，後避震「咚」地沉了一下。',
    '後座沒有人。後照鏡裡沒有人。但車頭開始變輕，整台車往後坐。',
    '老人講：鬼月騎車，後座忽然變重，莫看後照鏡，直直騎到廟口。',
    '第二個彎，又沉了一下。第三個彎，排氣管開始冒白煙。',
    '一個很有禮貌的聲音，在你耳朵後面說：',
    '@路人：「少年仔，順路，載阮到烏金宮就好。十五普渡，阮先去佔位。」',
    '「阮」。複數。',
    '你算了一下。野狼的載重大概一百五十公斤。你七十。後座至少四個。',
    {if:()=>COMP('meifeng'), then:[
      '美鳳騎著她的小綿羊從後面追上來，看了一眼你的後座，笑到差點摔車。',
      '@美鳳：「少年仔，你這台是咧載進香團喔？」',
    ]},
    {choose:'後座又沉了一下。第五個。', opts:[
      {label:'載到底', sub:'慢慢騎到廟口（陽火 −6，功德 +1，得牌）', then:[
        '你用時速二十公里，一路騎到烏金宮。後面的車一直按喇叭。',
        '背上越來越冷，冷到你的牙齒一直打架。',
        '到了廟埕，普渡桌還沒擺。後座一輕，又一輕，又一輕。',
        '他們就坐在空地上，等那一頓飯。',
        '有一個走之前，拍了拍你的安全帽。「少年仔，好心有好報。」',
        {do:'hp', n:-6}, {do:'merit', n:1}, {do:'card', id:'shishi'},
      ]},
      {label:'停車，請他們下來', sub:'燒一疊金紙當車資（香油錢 −15）', then:[
        '你停在路邊，對著後座講清楚：這台車載不動，你們自己走，車資另計。',
        '你燒了一疊小銀。後座一個一個輕了。',
        '@路人：「早期五十就有夠矣。這馬物價有夠貴。」',
        '最後一個下車前，嘆了很長的一口氣。',
        {do:'gold', n:-15},
      ]},
      {label:'催油門甩掉', sub:'野狼還有一點力（戰鬥）', then:[
        '你一催油門。後座傳來好幾聲怒吼，一隻冰冷的手抓住你的腰。',
        {do:'fight', enemies:['egui','egui'], kind:'normal'},
        {if:()=>F('last')==='san', then:[
          '後座輕了。一路順到山下。',
          '還車的時候，里長伯看著坐墊上四道長長的抓痕，要你賠八百。',
          {do:'gold', n:-15},
        ], else:[
          '後座安靜下來，乖乖坐好。那隻冰冷的手，改成輕輕扶著你的腰。',
          '你還是把他們載到了廟口。他們下車的時候，一個一個跟你說多謝。',
          {do:'merit', n:1},
        ]},
      ]},
    ]},
  ]},

  { id:'shoujing', title:'收驚阿枝嬤', bg:'street', cases:[1,2,3], once:true, script:[
    '老街柑仔店後面，阿枝嬤的客廳就是她的收驚所。一張藤椅，一碗米，一疊小孩子的衣服。',
    '她八十八歲，收驚收了六十年。一次一百，不開收據。',
    '@阿枝嬤：「添丁仔的孫？你收驚，是按怎收？」',
    '你照帳本上抄的咒，背了一段。',
    '@阿枝嬤：「毋著。你按呢是咧唸經，毋是咧叫囡仔。收驚，是叫。」',
    '一個年輕媽媽抱著一個哭不停的嬰仔衝進來。八個月大，哭了三天三夜，臉都哭紫了。',
    '阿枝嬤伸手接米碗。她的手在抖，抖到碗裡的米一直灑到地上。',
    '@阿枝嬤：「我這雙手，無法度矣。你來。」',
    '你用嬰仔的衣服包住米碗，在他頭頂上繞三圈。',
    '@魏子葳：「宥辰，轉來喔——」',
    '@阿枝嬤：「大聲一點。你是咧叫一个你足想欲伊轉來的人。」',
    '你再叫一次。這次你的聲音破了，連你自己都嚇一跳。',
    '嬰仔的哭聲停了。他打了一個嗝，睡著了。打開衣服，米面上凹下去一個小小的洞，像有人用手指按過。',
    '@阿枝嬤：「你細漢，你阿公收你收七暝。伊講你驚甲規身軀冷吱吱，來我遮借米。」',
    '@阿枝嬤：「收驚，一暝就好。收七暝——伊是疼你，疼甲驚。」',
    {choose:'阿枝嬤把米碗推到你面前。', opts:[
      {label:'跟她學', sub:'學一整晚，她把米碗傳給你（得法器，陽火 −3）', then:[
        '她教你怎麼抓米、怎麼叫名、怎麼看米面。一直教到雞啼。',
        '@阿枝嬤：「米若凹一空，是驚著；米若散開，是走毋見矣。」',
        '天亮的時候，她把那個用了六十年的米碗包進一條舊手帕，塞進你懷裡。',
        '@阿枝嬤：「我無後生會曉。予你，較贏予伊生菇。」',
        {do:'hp', n:-3}, {do:'relic', id:'mibowl'},
      ]},
      {label:'替她收完今天的客人', sub:'十二個囡仔（香火 +2，香油錢 +20，陽火 −5）', then:[
        '客廳外面，已經排了十二個媽媽、十二個孩子。',
        '你一個一個叫。叫到第八個，嗓子啞了。叫到第十二個，你幾乎發不出聲音。',
        '阿枝嬤坐在藤椅上收錢，一百、一百、一百，收完全部塞給你。',
        '@阿枝嬤：「我老矣，錢無路用。你較需要。」',
        '那天之後，鎮上的媽媽們開始抱著孩子，來壇裡找你。',
        {do:'rep', n:2}, {do:'gold', n:20}, {do:'hp', n:-5},
      ]},
    ]},
  ]},

  { id:'xiangpu', title:'順發香鋪', bg:'street', cases:[2,3,5,6], once:true, script:[
    '「順發香鋪」在老街中段，三坪大，天花板掛滿一串一串的蓮花金，風一吹就沙沙響。',
    '老闆阿發六十幾歲，一看到你就站起來。',
    '@阿發：「添丁壇的！來來來，鬼月特價！」',
    '他拿出一張護貝的價目表：天金、壽金、刈金、福金、大銀、小銀、經衣、庫錢、往生錢……一共十九種。',
    '@阿發：「好兄弟燒小銀佮經衣，祖先燒大銀、刈金，神明燒天金、壽金。燒毋著，伊收袂著。」',
    '你是做保險的。你第一次發現，陰間也有給付項目。',
    '阿發壓低聲音，從櫃台底下拿出一個紙盒。',
    '@阿發：「新貨。少年仔上愛。」',
    '紙做的智慧型手機、紙做的遊戲機、紙做的電動車鑰匙、紙做的信用卡，卡號是十六個 8。',
    '紙妹整個人趴在玻璃櫃上，盯著那台紙做的遊戲機，鼻子都壓扁了。',
    {if:()=>COMP('meifeng'), then:[
      '美鳳拿起那把紙做的電動車鑰匙，在手上拋了拋。',
      '@美鳳：「這个好。我先燒予家己，寄佇下面，等我落去開。」',
    ]},
    '@阿發：「你阿公毋捌來阮遮買。伊逐項攏去罔市遐。老人就是按呢，死忠。」',
    {choose:'阿發的計算機已經拿出來了。', opts:[
      {label:'買全套', sub:'好兄弟、祖先、神明各一份（香油錢 −35，得兩張牌）', then:[
        '阿發一邊包，一邊唸每一疊該怎麼摺、先燒哪一疊、燒完要敲三下金爐。',
        '你提著三大袋出門，像剛從百貨公司週年慶出來。',
        {do:'gold', n:-35}, {do:'card', id:'jinzhi'}, {do:'card', id:'kuqian'},
      ]},
      {label:'只買小銀跟經衣', sub:'夠用就好（香油錢 −15，得供品）', then:[
        '@阿發：「按呢爾？少年仔，你足儉。」',
        '他還是多塞了一疊給你，說是試用品。',
        {do:'gold', n:-15}, {do:'item', id:'jinzhi_p'},
      ]},
      {label:'買那台紙遊戲機', sub:'給紙妹（香油錢 −20，陽火上限 +3）', then:[
        '@魏子葳：「那台，包起來。」',
        '@阿發：「欲燒予啥人？」',
        '@魏子葳：「不燒。」',
        '阿發看著你，又看了看趴在玻璃櫃上的那尊紙紮玉女，沒有再問。',
        '紙妹抱著那台紙遊戲機，抱了一整晚。',
        '隔天早上，它的螢幕上多了一個用鉛筆畫的井字遊戲。她畫了圈，留了一格給你。',
        {do:'gold', n:-20}, {do:'maxhp', n:3},
      ]},
    ]},
  ]},

  { id:'jiaosai', title:'擲筊比賽', bg:'temple', cases:[2,3,5,6], once:true, script:[
    '烏金宮每年鬼月都辦擲筊比賽。連續聖筊最多的人，可以把供桌上那面五錢重的金牌帶回家。',
    '廟公阿土伯坐在供桌邊記分，一手拿紅筆，一手搧扇子。',
    '目前紀錄是雜貨店老闆：連續六個聖筊。全場歡呼，他激動到跪下去跟神明磕頭。',
    '紙妹拉你的袖子，指著供桌上那副磨得發亮的大木筊。',
    '你懂她的意思。你假裝不懂。',
    '她又拉。拉到你的袖子發出撕裂的聲音。',
    {if:()=>COMP('longge'), then:[
      '@龍哥：「彼副大筊，有一爿底下灌過鉛。我以前共廟公用的。」',
      '@魏子葳：「灌哪一邊？」',
      '@龍哥：「……袂記得矣。」',
    ]},
    {choose:'輪到你了。', opts:[
      {label:'自己上', sub:'用廟裡的大筊，誠心擲（擲筊）', then:[
        '你雙手捧著大木筊，舉到額頭，心裡默念。你不太確定該跟誰念。',
        {jiao:true,
          sheng:[
            '聖筊。第二個，聖筊。第三個、第四個、第五個。廟埕開始安靜。',
            '第七個聖筊落地的時候，整個廟埕炸開來。',
            '雜貨店老闆衝過來跟你握手，握到你手痛。阿土伯在紅紙上寫：「魏子葳　七」。',
            '你把金牌捐回廟裡，當普渡的經費。阿土伯把你的名字寫上功德榜，第一行。',
            {do:'rep', n:3}, {do:'merit', n:1},
          ],
          xiao:[
            '笑筊。兩片都平面朝上，在地上晃了兩圈。',
            '台下有人笑出聲。紙妹也在笑——她的肩膀一直抖，紙做的臉看不出表情。',
            '@阿土伯：「神明咧笑你。」',
            '他在紅紙上寫了一個零。雜貨店老闆拍拍你的肩，塞給你一瓶米酒，說明年再來。',
            {do:'item', id:'mijiu'},
          ],
          yin:[
            '陰筊。兩片都凸面朝上，定定地躺在地上。',
            '全場「喔——」了一聲。',
            '@路人：「添丁師的孫，神明毋插伊。」',
            '你撿起筊杯，放回供桌。紙妹把臉埋在你的袖子裡，不敢看大家。',
            {do:'rep', n:-1},
          ],
        },
      ]},
      {label:'讓紙妹擲', sub:'用她自己的紅筊（香火 +3，但拿不到金牌）', then:[
        '你把紙妹那副小小的紅筊放在手心。她的紙手搭在你的手背上。',
        '@阿土伯：「欸，彼毋是廟裡的筊！」',
        '你們一起擲出去。',
        {jiao:'sheng', then:[
          '聖筊。再擲，聖筊。再擲，聖筊。',
          '第九個。第十個。第十一個。',
          '廟埕裡沒有人說話了。雜貨店老闆的嘴張著，忘了闔起來。',
          '第十二個聖筊落地，紙妹把紅筊收回懷裡，不擲了。',
          '@阿土伯：「……袂算。毋是廟裡的筊，袂算。」',
          '沒有人在聽他說話。整個廟埕都在拍手，拍到阿土伯自己也跟著拍。',
          {do:'rep', n:3},
        ]},
      ]},
    ]},
  ]},

  { id:'rollcall', title:'點名', bg:'black', cases:[6], once:true, script:[
    '烏坑國中十年前就停辦了，國中生都搭車去山下讀。校舍還在：國小用一樓，二樓整層鎖著。',
    '暑假，校門用鐵鍊鎖著，操場的大花咸豐草長到膝蓋。',
    '普渡的鑼鼓從廟埕傳上來。學校的鐘，也響了。噹——噹——。不是電鈴，是掛在二樓走廊、要人去敲的那種銅鐘。',
    '紙妹站在校門口，一動也不動。然後她從鐵門的縫鑽了進去。你翻牆，褲子勾破一個洞。',
    '你認得這棟樓。你不記得你認得，但你的腳知道，往二樓的樓梯第十三階比較高。你沒有絆到。',
    '二樓最裡面那間教室亮著燈。門牌：七年甲班。',
    '講台上站著一個穿短袖襯衫的老師，戴粗框眼鏡，手上拿著點名簿。台下一個學生都沒有。',
    '他每叫一個名字，就停一下，在簿子上打勾，好像有人答了「有」。',
    '@游老師：「魏子葳。」',
    '老師抬頭，看見你。他推了推眼鏡，在簿子上寫了兩個字：轉學。',
    '@游老師：「林秋桂。」',
    '沒有人應。',
    '老師等了很久，在簿子上寫：缺。然後翻回第一頁，從頭再點一次。',
    '你走過去看那本點名簿。九十七學年度，七年甲班。林秋桂那一格，每一頁都是「缺」，一個疊一個，寫到紙都破了。',
    '@游老師：「伊阿嬤講，伊去溪仔耍水，無轉來。我毋捌看過這个學生，干焦想欲看一擺，伊生做啥款。」',
    '紙妹走到窗邊第三排的位子，爬上椅子，坐好。兩隻紙手放在桌上，平平的。',
    {choose:'老師又要點到她了。', opts:[
      {label:'讓她舉手', sub:'老師就能下課（陽火 −4，功德 +1，得牌）', then:[
        '@游老師：「林秋桂。」',
        '紙妹舉手。紙做的手，舉得很直。',
        '老師看了她很久。他的眼鏡起霧了。',
        '@游老師：「林秋桂，到。……原來妳生做這款。」',
        '他把「缺」劃掉，在旁邊寫了一個「到」。然後闔上點名簿，收進抽屜，關燈。',
        '教室暗了。紙妹沒有下來。她在黑暗裡，坐在那個位子上，坐了很久很久。',
        '你靠著走廊的牆陪她。一次都沒有看錶。',
        {do:'hp', n:-4}, {do:'merit', n:1}, {do:'card', id:'jiaoming'},
      ]},
      {label:'悄悄離開', sub:'把她抱走，什麼都不改變', then:[
        '你把紙妹從椅子上抱起來。她很輕，比一疊報紙還輕，但她的手抓著桌子邊緣，不肯放。',
        '你一根一根，把她的紙指頭掰開。',
        '走到校門口，你回頭。七年甲班的燈還亮著。',
        '@游老師：「林秋桂。」',
        '紙妹一路上都沒有擲筊。',
      ]},
    ]},
  ]},

  { id:'huache', title:'鳳凰號拋錨', bg:'road', cases:[3], once:true, script:[
    '半夜十一點，美鳳打電話來。',
    '@美鳳：「鳳凰號佇山路第五彎擺爛矣。你緊來。」',
    '你到的時候，她正一腳踹在輪胎上。',
    '她的電子花車，是一台改裝的三噸半貨車。車斗打開就是舞台：LED 燈管、兩支鋼管、一排乾冰機。',
    '車頭一隻壓克力鳳凰，翅膀輪流閃紅藍。',
    '@美鳳：「明仔載早起八點一場，下晡兩點一場。這台這馬共我擺爛？」',
    '你打開手機手電筒，看引擎。你看不懂引擎。你是做保險的。',
    '然後，舞台燈自己亮了。音響自己開了，放的是〈舞女〉。乾冰噴出來，整條山路白茫茫。',
    '乾冰裡，一個一個人影爬上車斗，開始跳舞。穿西裝的、穿雨鞋的、穿睡衣的，還有一個阿伯只穿一條四角褲。',
    '美鳳看了一眼，點了一根菸。',
    '@美鳳：「喔，閣來矣。這台我二手買的，前手載過三千場喪事。」',
    '@美鳳：「聽著音樂，就會起來跳。跳煞就走。你莫吵就好。」',
    '四角褲阿伯跳到一半，對美鳳比了一個讚。美鳳比回去。',
    '@美鳳：「彼个穿雨鞋的，是三冬前我哭的彼場。伊查某囝交代，伊上愛的歌愛放上大聲。」',
    '〈舞女〉放完了。接著放〈舞女〉。再來，還是〈舞女〉。',
    '@美鳳：「……壞佇這，干焦會放這首。跳袂煞，就無人欲落車。車就袂發。」',
    {choose:'第四遍〈舞女〉開始了。', opts:[
      {label:'陪他們跳完', sub:'跳到他們盡興（陽火 −6，得牌）', then:[
        '美鳳把菸一丟，爬上車斗，抓起麥克風。',
        '@美鳳：「各位！音響歹去，今仔日阮現場唱！」',
        '她唱〈舞女〉，唱〈燒肉粽〉，唱〈愛情恰恰〉。你被拉上去跳恰恰，跳到小腿抽筋。',
        '紙妹坐在車頭的壓克力鳳凰上，雙腳跟著節拍晃。虎爺趴在乾冰機上，被噴了一臉白霧，一直打噴嚏。',
        '天快亮的時候，人影一個一個下車。每一個下車前，都對美鳳鞠一個躬。',
        '四角褲阿伯最後一個走，對你眨了眨眼。引擎一發就著。',
        '@美鳳：「你看。做這行，觀眾嘛愛顧。」',
        {do:'hp', n:-6}, {do:'card', id:'huache'},
      ]},
      {label:'把他們清下車', sub:'美鳳要趕場（戰鬥）', then:[
        '@美鳳：「歹勢啦各位，今仔日趕場，後擺補！」',
        '你抽出符。音響的聲音扭曲成一聲長長的尖叫。',
        {do:'fight', enemies:['guhun','guhun'], kind:'normal'},
        {if:()=>F('last')==='san', then:[
          '乾冰散了。車斗上什麼都沒有。引擎一發就著。',
          '美鳳兩場都趕上了。她抽了三成給你，一張一張數，數得很大聲。',
          '後來她說，鳳凰號的舞台從那天起變得很乾淨，燈很亮，台下很空。',
          '@美鳳：「怪怪。親像少一寡物件。」',
          '她沒有說少了什麼。',
          {do:'gold', n:45},
        ], else:[
          '音樂停了。人影們站在車斗上，愣愣的，像派對被叫停的客人。',
          '四角褲阿伯第一個下車，一邊下一邊碎念。其他的跟在後面排隊，很有秩序。',
          '引擎一發就著。美鳳按了兩聲喇叭，當作道歉。',
          {do:'gold', n:20},
        ]},
      ]},
    ]},
  ]},

  { id:'laundry', title:'夜裡的運動服', bg:'street', cases:[2,3], once:true, script:[
    '鬼月晚上不能曬衣服。衣服會被好兄弟借去穿，收進來就帶著陰氣。',
    '老街後面的巷子，有一戶人家，每天晚上十點，準時把一件國中運動服晾出來。',
    '藍白色的，胸口繡著山下那間國中的校名，名字那一格，用簽字筆寫著一個「凱」字。',
    '阿凱的媽媽坐在門口的矮凳上，看著那件衣服。',
    '半夜，沒有風。運動服的袖子自己舉了起來，像有人把手伸進去。然後褲管動了一下。',
    '@阿凱媽媽：「伊轉來穿衫。」',
    '她的聲音很平靜。',
    '@阿凱媽媽：「伊彼工出門，無穿外套。」',
    '鄰居阿嬸從二樓窗戶探頭罵。',
    '@路人：「妳閣曝！規條巷仔的囡仔攏咧眠夢，夢著一个澹糊糊的囡仔徛佇床邊！」',
    '阿凱媽媽沒有回頭。',
    '早上，運動服是濕的，濕到滴水，有一股溪底的土腥味。她收進來，洗，晚上再晾。',
    '袖口有一圈洗不掉的黃，是溪底的泥。',
    '@阿凱媽媽：「我知影伊愛走。我只是想欲予伊穿燒燒才走。」',
    {choose:'運動服在沒有風的夜裡，輕輕晃著。', opts:[
      {label:'送阿凱走', sub:'把運動服燒給他——那是她最後一件（功德 +1，陽火 −3，得牌）', then:[
        '@魏子葳：「他每天晚上穿回來的，都是濕的。他冷，不是因為沒衣服，是因為他還在水裡。」',
        '她把運動服收進來，用熨斗燙了三遍，燙到冒煙，燙到燒燒的。摺好。',
        '你們在巷口的金爐燒。你放了一疊經衣在最底下。',
        '火起來的時候，她伸手想搶回來，又縮回去。灰往上飄，飄得很高，越過屋頂。',
        '@阿凱媽媽：「伊穿著矣。燒燒的。」',
        '那天晚上，巷子裡的孩子都睡得很好。只有她一個人坐在門口，看著空空的曬衣竿，坐到天亮。',
        {do:'merit', n:1}, {do:'hp', n:-3}, {do:'card', id:'zhishan'},
      ]},
      {label:'替她擋鄰居', sub:'讓她繼續曬（香火 −1，得供品）', then:[
        '你去敲阿嬸的門。',
        '@魏子葳：「阿嬸，她在曬她兒子的衣服。妳有意見，來添丁壇找我。」',
        '阿嬸把窗戶甩上。第二天，整條巷子都在說添丁壇的孫不懂規矩。',
        '阿凱媽媽塞給你一袋自己養的土雞生的蛋。',
        '運動服繼續每天晚上晾出去。每天早上，都是濕的。',

    ]},
  ]},

/* ---- story/ev_c4.js ---- */
defEvents([
  { id:'c4_yinzhuang', title:'陰狀', bg:'underworld', cases:[4], once:true, script:[
    '霧裡走出一高一矮。高的一身白，舌頭垂到胸口，帽子寫「一見大吉」；矮的一身黑，帽子寫「天下太平」。',
    '七爺八爺。你小時候在廟會看過，裡面是人。這兩個，裡面不是人。',
    '@七爺：「魏子葳。城隍廟傳票一張。有人告你。」',
    '@美鳳：「你予人告？告你啥？」',
    '@七爺：「剪人命錢。」',
    '@美鳳：「……這條，你確實有做。」',
    '@八爺：「拄好你家己落來，免阮閣起去陽間拘。」',
    '城隍廟在路的盡頭。紅牆，黑瓦。一進門，頭頂一塊黑底金字的大匾：爾來了。好像等你很久了。',
    '匾旁邊吊著一把算盤，比門板還長，珠子一顆有拳頭大。橫批：人有千算，天則一算。',
    '正中的大位是空的。城隍爺七月都在外面夜巡，今暗坐堂的是判官。紅袍，烏紗帽，一手厚簿，一手硃砂筆。',
    '兩邊長板凳坐滿看熱鬧的。有的穿壽衣，有的穿睡衣，有一個還戴著機車安全帽，下巴的帶子沒扣。',
    '@判官：「具狀人，陽間信女，住台北。狀曰：吾兒落水，保險公司說他是自殺，一毛不賠。」',
    '@判官：「吾兒怕水，從小就怕，連游泳課都不上。怕水的人，怎麼會自己走進水裡？」',
    '@判官：「那個姓魏的說，他很遺憾，但遺憾不在理賠範圍內。求城隍爺，替我討一個公道。」',
    '狀紙是原子筆寫的，好幾個地方把紙寫破了。你記得這個案子。台北，會議室。你記得那一巴掌，很響。',
    '@美鳳：「遺憾不在理賠範圍內？夭壽，連我都想欲共你搧落去。」',
    '旁聽席最後面，一個穿白汗衫的阿伯捧著鐵盒站起來喊：「下注！被告贏，一賠三！」',
    '美鳳摸出一疊壽金，啪一聲拍在鐵盒上。',
    '@美鳳：「押伊贏。想欲搧伊，佮押伊贏，是兩件代誌。」',
    '@判官：「被告，答辯。」',
    '@魏子葳：「第一，外套兩邊口袋塞滿石頭，拉鍊拉到底。石頭不會自己跑進口袋，更不會自己拉拉鍊。」',
    '@魏子葳：「第二，投保到出事，一年十一個月。差一個月，滿兩年。」',
    '@魏子葳：「第三，保險法第一百零九條加保單條款：訂約兩年內故意自殺，保險公司不負給付責任。」',
    '判官一揮手，頭頂的大算盤自己撥起來，喀啦喀啦響了很久。你心算比它快兩秒。戴安全帽的那個，對你舉起大拇指。',
    '@判官：「傳證人。」',
    {sfx:'water'},
    '側門打開。枷爺從枉死城押來一個年輕人，脖子套著木枷。枉死城，是橫死的人等的地方：等到他們本來該走的那一天。',
    '他全身濕透，每走一步就一灘水。外套口袋墜得很低，裡面的石頭互相敲。喀。喀。',
    '紙妹在你背上縮成一團。水濺到哪裡，她就把腳往上收。',
    '@判官：「證人。被告所講，是毋是事實？」',
    '@年輕人：「他說的都對。石頭是我自己撿的，拉鍊是我自己拉的。」',
    '@年輕人：「我怕水。我怕我到時候，會忍不住游上來。」',
    '旁聽席沒有人講話。賭盤阿伯的鐵盒，蓋上了。',
    '@年輕人：「可是，你可不可以輸？」',
    '@年輕人：「城隍爺判完，會去我媽夢裡講結果。她贏，就夢到：告著了。她輸，就夢到：是妳兒子自己走的。」',
    '@年輕人：「她現在每天罵你，罵完才睡得著。要是知道是我自己要走的，她就只剩一件事可以想：她哪裡做錯了。」',
    '@年輕人：「讓她恨你就好。」',
    '他看著你的臉，看了很久。',
    '@年輕人：「你看起來很習慣。」',
    '紙妹從你背後伸出一隻手，停在他濕透的袖子前面。沒有碰到。她怕水。',
    '@判官：「本庭只問事實。事實，是被告贏。除非被告家己認。」',
    {choose:'判官放下硃砂筆。整間城隍廟都在等你開口。', opts:[
      {label:'照實結案', sub:'你沒有錯（陽火 −4，得法器）', then:[
        '@魏子葳：「被告所陳，句句屬實。請依法駁回。」',
        '@判官：「照鏡。」',
        '衙役捧來一面巴掌大的銅鏡，舉到你面前。照妖鏡。說謊的人一照，鏡面就起霧。',
        '鏡子裡是你。臉色很白，領帶歪了。一點霧都沒有。',
        {do:'hp', n:-4},
        '然後，喀一聲。鏡子從正中間，裂成兩半。',
        '判官看了鏡子很久，又看了你很久。他沒有說為什麼。',
        '@判官：「原告之訴，駁回。今暗，城隍爺會去伊的夢裡，共伊講：汝囝，是家己行的。」',
        '驚堂木拍下去。頭頂的大算盤，一顆珠子自己滑到底。',
        '年輕人低下頭。枷爺拉著他從側門出去。他沒有再看你。',
        '美鳳去領錢。賭盤阿伯數給她一把生鏽的舊銅板，民國五十幾年的五角。她握了一下，全部倒回鐵盒。',
        '@美鳳：「無愛矣。」',
        '判官把那面破鏡子丟進你懷裡。',
        '@判官：「破鏡，本庭無愛。你紮去。」',
        {do:'relic', id:'bagua_r'},
        '走出城隍廟的時候，你低頭看。從側門到路口，一條濕的水痕，一直拖進霧裡。',
        '紙妹的臉越過你的肩膀，一直看著那條水痕。',
      ]},
      {label:'認諾', sub:'讓她贏（最大陽火 −3，功德 +1，得牌）', then:[
        '@魏子葳：「被告認諾。」',
        '@判官：「你知影你咧講啥？」',
        '@魏子葳：「民事訴訟法第三百八十四條。被告認諾，法院應本於其認諾，為被告敗訴之判決。」',
        '@魏子葳：「而且，沒有人看見石頭是他自己放的。自殺的舉證責任，在保險公司。」',
        '這是實話。也是你十年來，從來不讓對方律師講出口的那一句。',
        '判官翻他的厚簿，翻了很久，停在某一頁。',
        '@判官：「……陰律嘛有這條。」',
        '@判官：「原告之訴，准。被告減陽火，以償命錢。今暗，城隍爺會去伊的夢裡講：告著矣。」',
        '驚堂木拍下去。大算盤一整排珠子自己往下掉，像下雨。你覺得胸口被拿走一點東西，像一口氣少吸了半口。',
        {do:'maxhp', n:-3},
        '年輕人對你彎下腰。木枷太重，他彎得很慢，頭髮上的水滴了一地。',
        '@年輕人：「謝謝。」',
        '@魏子葳：「不用謝。她明天醒來，會更恨我。」',
        '@年輕人：「嗯。」',
        '枷爺拉著他出去。石頭喀、喀地響，越來越遠。',
        '美鳳把押下去的那疊壽金，從鐵盒推給賭盤阿伯。一句話都沒講。走出廟門，她才開口。',
        '@美鳳：「你害我輸一疊。」',
        '@魏子葳：「記我帳上。」',
        {do:'merit', n:1}, {do:'card', id:'qingting'},
        '你在保險公司十年，沒有輸過一件。',
        '這一件，你輸得很準。',
      ]},
    ]},
  ]},

  { id:'c4_yikouqi', title:'留一口氣', bg:'underworld', cases:[4], once:true, script:[
    '路很長，兩邊是看不見底的黑。頭頂上，你自己的聲音一直在唸：天清清，地靈靈。',
    '然後它停了。「奉請臨水陳——」停在一半。',
    '前面的路，暗了一截。美鳳停下來。很遠的上面，壇裡，你們的腳都不踏了。',
    {sfx:'phone'},
    '整個陰間響起一段鈴聲。手機預設的那一首，你用了七年，從來沒換過。',
    '路上的魂一個一個抬頭往上看。紙妹用兩隻紙手摀住耳朵。',
    '@美鳳：「你無關機喔？」',
    '@魏子葳：「開了勿擾。勿擾有一個例外：同一個號碼，三分鐘內打第二次，會響。」',
    '上面一聲低吼。然後「啪」的一聲，像一隻肉掌拍在玻璃上。',
    '@志誠：「喂？……添丁壇？有人佇咧無？」',
    '虎爺接了。還按到擴音。',
    '@魏子葳：「我是。」',
    '你一開口，很遠的上面，你的身體也跟著講了一遍。慢半拍，平平的，像別人在學你。',
    '@志誠：「我是老街尾剃頭店，阿福師的後生。里長伯予我這支電話。」',
    '剃頭店你記得。一次八十塊，小孩坐在扶手上架的木板上，剪完用熱毛巾敷後頸。',
    '@志誠：「醫生講阮阿爸是今暗。伊講欲死佇厝，醫院予阮留一口氣轉來。」',
    '留一口氣：救護車載回家，護理師一路用手捏著甦醒球，替他呼吸。到家，才停手。',
    '電話那頭，有一個很慢的呼吸聲。一下，停很久，再一下。',
    '@志誠：「阮小妹佇美國，趕袂轉來。這馬干焦我佮伊。鬼月過身，敢會歹？我……愛創啥？」',
    '路又暗了一截。黑暗裡有東西在動。你們身上的陽火，在一片黑裡，亮得像兩盞燈。',
    '@美鳳：「你莫講話。換我講。」',
    '咒要回來，電話就得掛。電話一掛，那頭就只剩他一個人。',
    {choose:'志誠在等。黑暗裡的東西，越靠越近。', opts:[
      {label:'讓美鳳講', sub:'咒停著，路暗著（戰鬥，得牌）', then:[
        '@美鳳：「少年仔，免驚。鬼月過身無歹，干焦較濟人佮伊做伙行。」',
        '@美鳳：「神明桌頂，先用紅紙遮起來。伊的眠床搬去廳裡，頭向內，腳向外。」',
        '@美鳳：「提幾个銀角仔，囥佇伊的手內。彼是手尾錢，後擺恁兄妹分。」',
        '她的話從上面、從她自己的身體裡，一個字一個字傳出去。一個步驟都沒漏。',
        '黑暗裡的東西貼上來了。很多隻冰冷的手，往你們肩膀上的火伸過來。',
        '你站到美鳳前面。紙妹的手臂，勒緊你的脖子。',
        {do:'fight', enemies:['guhun','guhun'], kind:'normal'},
        {if:()=>F('last')==='du', then:[
          '它們安靜下來以後，沒有走。一個一個蹲在美鳳旁邊，仰著頭，聽上面的聲音。',
          '一個兒子在跟他爸爸講話。它們大概很久沒聽過這種聲音了。',
        ], else:[
          '它們散了。灰落在美鳳腳邊，堆成一小圈。',
          '她講電話的聲音，一個字都沒有抖。',
        ]},
        '@美鳳：「目屎毋通滴落去伊身軀，伊會毋甘行。」',
        '@美鳳：「然後，佮伊講話。伊聽會著。人上尾一个走的，是耳空。」',
        '@美鳳：「莫講你驚。講你會好好過。」',
        '上面安靜了很久。',
        '@志誠：「阿爸……我會好好過。你免煩惱。」',
        '那個很慢的呼吸聲，停了。這次停了，就沒有再來。',
        '路的那一頭，走過來一個老人。病人服，手腕套著醫院的手環，手心握著幾個銅板，握得很緊。',
        '他聽見上面兒子的聲音，抬頭看。然後他看見你。',
        '@阿福師：「添丁仔的孫？你細漢，頭毛攏是我剃的。坐彼塊囡仔椅，一直咧振動。」',
        '他伸手，摸了一下你的頭。',
        '@阿福師：「傷長矣。」',
        '美鳳往前面一指。',
        '@美鳳：「阿伯，直直行。你囝有我教，免煩惱。」',
        '他握著銅板往前走，沒有回頭。',
        '上面，志誠開始哭。一開始很小聲，後來很大聲。',
        '@美鳳：「按呢就著。家己哭，莫請人替你哭。」',
        '電話斷了。',
        '~天清清，地靈靈——',
        '咒回來了，路一截一截亮回來。',
        '美鳳走在前面，一直沒講話。你看見她抬手抹了一下臉。很快，快到像只是在撥頭髮。',
        {do:'card', id:'qianwang'},
      ]},
      {label:'叫虎爺掛斷', sub:'先顧咒，先顧路（香油錢 +25，香火 −1）', then:[
        '@魏子葳：「我現在在辦法事，沒辦法處理。你先打給禮儀社，他們二十四小時都有人。」',
        '@志誠：「……歹勢。」',
        '@魏子葳：「虎爺，掛掉。」',
        '上面沒有動靜。',
        '@魏子葳：「兩顆雞蛋。」',
        '~虎爺低吼。',
        '@魏子葳：「三顆。」',
        '啪。',
        '~天清清，地靈靈——',
        '咒回來了，路一截一截亮回來。黑暗裡的東西，退回黑暗裡。',
        '你們繼續走。美鳳一路沒講話，檳榔嚼得很響。',
        '過了一陣子，路的那一頭，走過來一個老人。',
        '病人服，手腕套著醫院的手環。兩隻手空空的，一直回頭往上看，像在等誰叫他。',
        '你認得那張臉。剃頭店的阿福師。他沒認出你。他在找另一個聲音。',
        '美鳳抓住他的袖子，往前面一指。',
        '@美鳳：「阿伯，直直行。」',
        '他點點頭，走了。走幾步，又回頭看一次。',
        {sfx:'phone'},
        '上面又響了。這次不是你的。是〈愛情恰恰〉。',
        '紙妹的腳在你腰邊，跟著打了兩下拍子，又停住。',
        '@美鳳：「……我的。半暝敲予孝女的，攏是死人的囝。」',
        '恰恰響了九聲，停了。',
        '@魏子葳：「他明天會再打？」',
        '@美鳳：「會。欲請孝女，一場兩千。我會去。我會哭甲足好。」',
        '@美鳳：「這場抽三成予你。你介紹的。」',
        {do:'gold', n:25},
        '@美鳳：「明仔載規條老街攏會知，添丁壇的孫，叫阿福師的後生去揣禮儀社。」',
        {do:'rep', n:-1},
        '後來那一整段路，她都在哼〈愛情恰恰〉。哼得很小聲，一直哼錯同一個音。',
      ]},
    ]},
  ]},

  { id:'c4_jintong', title:'金童', bg:'underworld', cases:[4], once:true, script:[
    '路分成三叉。叉口立著一根石柱，三面刻字，兩面被磨平了，只剩一面：西方。',
    '石柱底下，站著一個紙紮的男孩。',
    '一公尺高，白臉，兩團胭脂圓腮，頭頂紮一個髻，綁紅繩。綠衫，舉著一支旗：金童前引西方路。',
    '他的下半身泡爛了。綠色的顏料一路流到腳底，像哭過。竹子做的旗桿，長了一層白毛。',
    '你認得他。',
    '阿公出殯那一晚，紙厝、紙車、金童一起推進火裡。他燒得最快，站得很直，一分鐘不到就沒了。',
    '@美鳳：「彼暗我佇花車頂，咧哭你阿公。伊燒起來，我有看著。燒甲足緊，親像咧趕路。」',
    '他的腳底貼著一張紅紙：罔市紙紮。背後另外貼一張：故　魏公添丁　收用。',

    '老鼠的鼻子，停了一下。',
    '@魏子葳：「妳認識牠？」',
    '@阿桂：「伊是第七个阿灰。」',
    '@阿桂：「頭一冬，鳥鼠落來井底，共阮阿爸的蘋果食了了。」',
    '@阿桂：「我共伊罵足久。伊毋走。後來，我就叫伊阿灰。」',
    '@阿桂：「阿灰死矣，伊的囝落來。我嘛叫伊阿灰。」',
    '@阿桂：「按呢，就親像攏是仝一隻，一直佇遮陪我。」',
    '做保險的，什麼東西的平均餘命都背過一點。家鼠，兩到三年。',
    '十八年，七代。',
    '她沒有月曆，沒有手機，沒有窗戶。她是用老鼠在算日子的。',
    {if:()=>F('route')==='scatter', then:[
      '@罔市：「坑內的鳥鼠，毋通拍。」',
      '@罔市：「文成講的。鳥鼠若走，人就愛走。伊們比人較早知影欲崩。」',
      '@罔市：「伊的便當是我包的。逐工攏留一喙轉來，講彼喙是予鳥鼠的。」',
      '@罔市：「七月十三彼工，便當盒無轉來。」',
      '她沒有再說。她看著阿桂懷裡那個便當盒，看了很久。',
    ], else:[
      '@美鳳：「坑內的鳥鼠，毋通拍。我爸講的。」',
      '@美鳳：「鳥鼠若走，人就愛走。伊們比人較早知影欲崩。」',
      '@美鳳：「伊的便當逐工攏留一喙轉來。我阿母罵伊討債，伊講彼喙是予同事的。」',
      '@美鳳：「同事，就是鳥鼠。」',
      '@美鳳：「……我逐工攏偷食彼喙。」',
      '她說完，把臉轉開。',
      '@美鳳：「看三小。」',
    ]},
    '阿灰往前跳了一步。阿桂把便當盒抱得更緊。',
    '@阿桂：「這是阮阿爸的。頂擺，就予恁食去矣。」',
    {choose:'阿灰盯著便當盒。虎爺的屁股，已經搖到第十下了。', opts:[
      {label:'照礦工的規矩，留一喙', sub:'阿桂的麵線，分一口給阿灰（陽火 −3，得牌）', then:[
        '@魏子葳：「阿桂。留一口給牠。」',
        '@阿桂：「……這是阮阿爸的。」',
        '@魏子葳：「妳阿爸也是礦工。」',
        '她看著便當盒，看了很久。然後把蓋子打開，麵線的熱氣在冰冷的坑道裡，直直往上冒。',
        '她用紙做的指頭，捏起一條很短的麵線，放在鐵軌上。',
        '@阿桂：「一喙就好喔。」',
        '阿灰吃得很快。吃完，用兩隻前腳洗了洗臉。',
        '然後牠忽然定住。兩隻耳朵，往後一貼。',
        '牠跑了。不是往你們，是往你們來的方向。',
        '牆縫裡、枕木底下、積水裡，一隻、十幾隻、幾十隻，全部往同一個方向跑。',
        '頭頂的坑木，發出很長的一聲。像一個老人，在睡夢裡呻吟。',
        '@阿桂：「坑木咧哭矣！走！」',
        '你們跟著老鼠往回跑了二十步，擠進岩壁上一個凹進去的避車洞。',
        {sfx:'thunder'},
        '剛剛阿灰坐的那一段，連坑木帶石頭，整片塌了下來。',
        '煤灰撲進避車洞，每個人都在咳。虎爺咳得最大聲，像一隻吞了毛球的貓。',
        '你爬過那堆碎石的時候，手掌被尖石割開一道口子。',
        {do:'hp', n:-3},
        '阿桂把便當盒的蓋子蓋回去。少了一口。',
        '@阿桂：「阮阿爸，嘛會按呢做。」',
        '她沒有見過她阿爸。她說得很確定。',
        '碎石堆頂上，阿灰又坐在那裡了，在洗鬍子。',
        {if:()=>F('route')==='seal', then:[
          '@阿桂：「阿灰。我閣會轉來。」',
          '阿灰看著她。牠不知道這是好消息，還是壞消息。',
          '你也不知道。',
        ], else:[
          '@阿桂：「阿灰。我欲走矣。」',
          '@阿桂：「以後，無人共恁號名矣。」',
          '阿灰看了她一眼，轉身鑽進石縫裡。',
          '十八年，七代。牠是最後一個被叫做阿灰的。',
        ]},
        {do:'card', id:'qingting'},
      ]},
      {label:'讓虎爺去', sub:'神明也是貓（陽火 −6，得牌）', then:[
        '@魏子葳：「虎爺，去。」',
        '你話還沒說完，牠已經飛出去了。',
        '阿灰一溜煙鑽進軌道底下。虎爺一頭撞上坑木，撞得整根木頭嗡嗡響，又追進黑暗裡。',
        '@阿桂：「虎爺！」',
        '黑暗裡乒乒乓乓。鐵軌、石頭、積水。然後，一聲很細的吱。',
        '虎爺走回來，嘴裡叼著阿灰，尾巴翹得老高，放慢腳步走到你腳邊，等你誇牠。',
        '阿灰的尾巴垂在牠嘴邊，還在動。',
        '@阿桂：「放！」',
        '虎爺看看她，看看你。很慢很慢地，把嘴張開。',
        '阿灰掉在地上，愣了一秒，逃進黑暗裡。牆縫裡、枕木底下，所有的老鼠都跟著跑光了。',
        '頭頂傳來很長的一聲。',
        '虎爺剛剛撞到的那根坑木，從中間裂開，裂縫一路往上爬。',
        '沒有老鼠先跑給你看。老鼠，早就被嚇光了。',
        '你只來得及把阿桂往後推。',
        {sfx:'thunder'},
        '石頭砸在你的左肩上，像有人拿鐵鎚敲了一下。',
        '~虎爺撲到你身上，一邊變大，一邊用背接住落下來的石頭。',
        {do:'hp', n:-6},
        '煤灰落定以後，虎爺抖了抖身子，舔了一下你的臉。表情有一點點像在道歉。只有一點點。',
        {do:'card', id:'huyao'},
        '阿桂站在碎石堆前面，看著老鼠跑走的那片黑暗。',
        '@阿桂：「伊們袂閣轉來矣。」',
        '@阿桂：「以後欲崩，無人會先共你講矣。」',
        '她把便當盒抱得很緊。一口都沒有少。',
        '她沒有來得及說再見。',
      ]},
    ]},
  ]},

  { id:'c8_lamp', title:'安全燈', bg:'tunnel', cases:[8], once:true, script:[
    '過了暗井，風巷變得很悶。空氣不動了，像整座山把一口氣憋住。',
    '前面的坑木上，掛著一盞燈。',
    '黃銅燈座，玻璃罩，罩子上面是一截細鐵網做的煙囪。燈座上打著一行字：「五坑救護隊」。',
    '燈是亮的，你們誰都沒有點它。火很小，黃的，很穩。',
    '然後，你看著它長高。火的頂端，多出一層淡淡的藍，像一頂薄薄的帽子。',
    '你認得這個。理賠部檔案室裡有一份民國七十三年的礦災報告，新人那年，只有你肯整理。',
    '第十四頁：「安全燈火焰出現藍色焰帽，表示瓦斯濃度達百分之一以上。」第十五頁：「達百分之五，任何火花皆可引爆。」',
    '第十六頁，是名單。',
    '@魏子葳：「瓦斯。再濃一點，一個火花，大家都會死。」',
    {if:()=>F('route')==='scatter', then:[
      '@罔市：「坑內，毋通講彼字。」',
      '她的聲音很平，像在糾正一個小孩拿筷子的方法。',
    ], else:[
      '@美鳳：「坑內毋通講死啦！」',
      '@魏子葳：「妳剛剛也講了。」',
      '@美鳳：「我是咧教你。教的，毋算。」',
    ]},
    {if:()=>OUT('c3')==='du', then:[
      '阿水伯的頭燈，停在那盞安全燈前面。',
      '@阿水伯：「彼葩，是阮救護隊的燈。」',
      '@阿水伯：「第二工，伊的火是黃的。」',
    ]},
    '瓦斯比空氣輕，會積在坑頂。你抬頭。頭頂的黑，看起來跟剛才一模一樣。',
    '@魏子葳：「身上有火的，全部拿出來。」',
    {if:()=>F('route')==='open', then:[
      '後面的風巷口，一百多盞燈正往這邊擠。燈海裡有一團火是活的，嘶嘶地響——有個阿伯提著他阿爸那年代的電石燈。',
      '八十幾歲的老礦工一回頭，整個人跳起來，衝過去一把搶下，用安全帽把那團火蓋熄。',
      '@鎮民：「電石燈！你是欲予規庄陪葬喔！」',
    ]},
    {if:()=>F('route')==='seal', then:[
      '美鳳從口袋摸出打火機，捏了很久，才放到你手上。',
      '@美鳳：「提去。我戒斷甲欲——」',
      '她自己停住了。',
    ]},
    {if:()=>F('route')!=='seal', then:[
      '罔市從布包裡拿出一盒火柴。火柴盒用塑膠袋包了兩層，橡皮筋綁得死緊。',
      '她沒有交給你。她又包了一層，塞回布包的最底下。',
      '@罔市：「我袂點。這馬袂。」',
      '你沒有問她，帶火柴進坑要做什麼。阿桂看著那個布包，也沒有問。',
    ]},
    {if:()=>F('route')==='scatter', then:[
      '江承恩把手機關機。螢幕暗掉之前，你瞄到他的桌布：烏金山莊的空拍圖。',
    ]},
    '@魏子葳：「手電筒也要關。開關會跳火花。」',
    '你說完，手心就濕了。前面這一段，一點光都不能有。',
    {choose:'安全燈的藍帽子，又長高了一點。', opts:[
      {label:'全部熄掉，摸著壓風管走', sub:'在全黑裡，跟著阿桂（陽火 −4，得牌）', then:[
        '你按下手電筒的開關。',
        {if:()=>F('route')==='open', then:[
          '身後，一百多盞燈從前面熄到後面。像一根很長的蠟燭，被人一口一口吹熄。',
        ]},
        '全黑。',
        '不是關燈的那種黑。是眼睛睜開、閉上，都一模一樣的黑。',
        '你的心跳，大得像有人在你的耳朵裡敲門。',
        '一隻紙做的手，摸到你的手，抓住。',
        '@阿桂：「手摸管仔。管仔會牽你去。」',
        '她把你另一隻手按在岩壁的壓風管上。鐵管是冰的，一直在微微地抖。',
        {if:()=>F('route')==='open', then:[
          '你聽見身後一百多個人，一個一個把手搭上前面那個人的肩膀。沒有人說話。',
        ]},
        {if:()=>F('route')==='seal', then:[
          '美鳳的手搭上你的肩膀。在抖。',
          {if:()=>COMP('longge'), then:['龍哥的手，搭上她的肩膀。']},
        ]},
        {if:()=>F('route')==='scatter', then:[
          '罔市的手搭上你的肩膀。很輕，很硬，指頭全是繭。',
          '江承恩走在最後面。你聽見他的皮鞋，一下一下踩進水裡。',
        ]},
        {sfx:'knock'},
        '壓風管在你手心裡，跳了四下。很遠。',
        '@阿桂：「聽著無？頭一个敲的，逐暗攏仝一个人，敲甲足規矩，一聲都無差。」',
        '@阿桂：「有一个足慢。敲一聲，歇足久。我攏驚伊袂閣敲。」',
        '@阿桂：「有一个足緊，親像咧趕欲下班。」',
        {if:()=>COMP('longge') && F('route')!=='scatter', then:[
          '黑暗裡，你聽見龍哥吸了一口氣。沒有吐出來。',
        ]},
        '@阿桂：「閣有一个，敲煞了，攏會加一聲。」',
        {if:()=>F('route')!=='scatter', then:[
          '@美鳳：「……彼是阮爸。」',
          '@美鳳：「伊敲阮兜的門，嘛攏加一聲。阮阿母足討厭。」',
        ]},
        '@阿桂：「頭犁低。頂面有一枝坑木。」',
        '你低頭。頭髮擦過一根濕冷的木頭。',
        '@魏子葳：「妳看得到？」',
        '@阿桂：「十八冬。」',
        '有一段，她的手從你手裡抽走了。你一個人站在全黑裡，一動也不敢動。',
        '你聽見襯衫口袋的釦子被打開，紙的聲音，很小，很快。然後她的手回來了。你這才發現，你一直沒有呼吸。',
        '@阿桂：「我毋知影佗一个是阮阿爸。」',
        '@阿桂：「十八冬，我攏咧臆。」',
        '@阿桂：「我臆是上細聲彼个。阿嬤講，阮阿爸講話足細聲。」',
        {if:()=>F('route')!=='seal', then:[
          '你肩膀上那隻手，握緊了一下。',
          '@罔市：「……細聲甲，欲聽無。」',
        ]},
        '你沒有說話。你把她的紙手握得更緊。紙在你手心裡，發出很小的聲音。',
        '@阿桂：「會使矣。」',
        '你按下開關。光刺得你睜不開眼睛。你的襯衫，從領子濕到腰。',
        {do:'hp', n:-4},
        '阿桂的紙臉上全是煤灰。她拉開你的手掌，放進一隻紙鶴，只有指甲那麼大。',
        '是你的名片摺的。翅膀上，還看得到半個「理賠」。',
        '@阿桂：「你佇烏暗內，有夠慢。我摺兩隻，你才行十步。」',
        '@魏子葳：「另外一隻呢？」',
        '@阿桂：「囥佇管仔頂矣。予伊們。」',
        '你看著身後的黑暗，什麼都看不見。但你知道，壓風管上有一隻紙鶴，跟著三短一長，一直在抖。',
        {do:'card', id:'agui_crane'},
      ]},
      {label:'等瓦斯退', sub:'等藍色的火帽消失再走（戰鬥）', then:[
        '@魏子葳：「等。風巷有風，瓦斯會散。」',
        '你說得很有把握。報告第十七頁，是這樣寫的。',
        '你們蹲在安全燈旁邊，看著那頂藍色的小帽子。',
        {if:()=>F('route')==='open', then:[
          '後面的人群也停下來了。一百多個人蹲在積水裡，沒有人說話。',
        ]},
        {sfx:'knock'},
        '牆那邊的敲聲，一下都沒有停。',
        '@阿桂：「伊們咧等。」',
        '@魏子葳：「我們也在等。」',
        '阿桂沒有再說話。',
        '第八分鐘，你背後的積水響了。',
        '不是腳步聲。是很多東西，一起從水裡站起來的聲音。',
        '暗井那邊爬上來的東西，追到了。它們也在等——等你們停下來。',
        {do:'fight', enemies:['sanhun','sanhun','wangliang'], kind:'normal'},
        {if:()=>F('last')==='du', then:[
          '它們靜下來以後，一個一個蹲在積水裡，跟你們一起等。',
          '散掉的東西也會等。它們只是忘了，自己在等什麼。',
          {do:'card', id:'anhun'},
        ], else:[
          '它們又碎了一次，沉回水裡。水面冒了幾個泡，就平了。',
          '坑道裡的冷，退了一點。散得乾淨，確實比較暖。',
          {do:'hp', n:5},
        ]},
        '第二十六分鐘，藍色的帽子縮回去了。',
        '安全燈的火，變回小小的、黃色的一點。然後，自己熄了。',
        '你們開著手電筒，走過那一段。什麼事都沒有發生。',
        '職業病又發作了。三短一長，一分鐘大概十二次。',
        '二十六分鐘，三百一十二次。',
        '三天，五萬一千八百四十次。',
        '你不知道他們中間，有沒有停下來休息。',
        '你希望有。',
      ]},
    ]},
  ]},

  { id:'c8_boot', title:'一隻膠鞋', bg:'tunnel', cases:[8], once:true, if:()=>!NAME('gao'), script:[
    '過了暗井，積水退成一大片爛泥。黑的，發亮的，踩下去會把鞋底吸住。',
    '爛泥正中間，站著一隻雨鞋。',
    '黑色的長筒膠鞋，礦工穿的那種。鞋底陷在泥裡，鞋筒直直地站著，像有人剛剛才把腳從裡面抽走。',
    '只有一隻。鞋尖對著風巷深處，七號風巷的方向。',
    '手電筒照過去。鞋筒內側，用白漆寫著一個字：「高」。',
    '礦工的雨鞋都長一樣。在更衣間裡，只能靠名字認。',
    '萬善祠的甕上，有一個高進發。',
    '你在腦子裡排時間序。這是你的專業。',
    '爆炸那天，他們往風巷跑。風巷有風，有空氣，坑裡的人都是這樣教的。',
    '他跑到這裡，一腳踩進泥裡，鞋子拔不出來。',
    '他沒有停下來拔。他光著一隻腳，繼續往裡面跑。',
    '這隻鞋，在這裡站了三十一年。',
    '三十一年前砌牆的人，扛著紅磚，從它旁邊走過去。阿公去牆上貼那七張符，也從它旁邊走過去。',
    '沒有人把它拔起來。',
    '鞋筒裡，露出一點紅色。',
    {if:()=>F('route')==='scatter', then:[
      '江承恩站在爛泥邊。他的皮鞋停在泥的邊緣，沒有再往前一步。',
    ]},
    {choose:'那隻鞋，在爛泥正中間。', opts:[
      {label:'踩進爛泥，把它拿出來', sub:'泥裡有東西（陽火 −5，擲筊）', then:[
        '你踩進去。',
        {sfx:'water'},
