const CAMP = {
  /* ---------- 開新局 ---------- */
  async newGame() {
    const keep = { settings: G.meta.settings, tips: G.meta.tips, codex: G.meta.codex, endings: G.meta.endings, clears: G.meta.clears, seenScenes: G.meta.seenScenes, plays: (G.meta.plays || 0) + 1 };
    G.meta = mergeMeta(Object.assign(defaultMeta(), keep));
    CM().base = STARTER.map(id => ({ id, up: 0 }));
    G.run = null;
    saveGame(true);
    await CAMP.startCase('c0');
  },
  async resumeOrHub() {
    if (G.run) return CAMP.resume();
    if (CM().next === 'c0' || !CM().base) return CAMP.newGame();
    return CAMP.toHub();
  },
  toHub() { G.cb = null; UI.go('hub'); },

  /* ---------- 案件 ---------- */
  buildRun(id) {
    const cfg = CASE_CFG[id];
    const maxHp = 60 + (CM().blessings.b_hp ? 6 : 0) + (CM().bonusMaxHp || 0);
    const gold = 50 + (CM().blessings.b_gold ? 40 : 0) + (CM().bankGold || 0);
    CM().bankGold = 0;
    const seed = newSeed();
    const base = id === 'c0' ? TUTORIAL_DECK.map(x => ({ id: x, up: 0 })) : (CM().base || STARTER.map(x => ({ id: x, up: 0 })));
    return {
      caseId: id, seed, combatSeed: seed, stage: 0, map: cfg.map ? genMap(id, new RNG(seed)) : [],
      hp: maxHp, maxHp, gold, deck: base.map(c => mkCard(c.id, c.up)), relics: [], items: [], itemSlots: 3 + (CM().blessings.b_slot ? 1 : 0),
      bossMods: { du: 0, yuan: 0 }, wishes: [], stats: { fights: 0, du: 0, san: 0, cards: 0, dmgTaken: 0 }, pending: { type: 'intro' }, revived: false, shops: {},
    };
  },
  async startCase(id) {
    G.meta.snaps[id] = deep(CM());
    G.run = CAMP.buildRun(id);
    CM().next = id;
    saveGame(true);
    if (id === 'c0') return CAMP.prologue();
    await CAMP.caseIntro();
  },
  async restartCase() {
    const id = G.run ? G.run.caseId : CM().next;
    G.meta.retries = G.meta.retries || {}; G.meta.retries[id] = (G.meta.retries[id] || 0) + 1;
    if (G.meta.snaps[id]) G.meta.camp = mergeMeta({ camp: deep(G.meta.snaps[id]) }).camp;
    G.run = CAMP.buildRun(id);
    G.cb = null;
    saveGame(true);
    if (id === 'c0') return CAMP.prologue();
    await CAMP.caseIntro();
  },
  async caseIntro() {
    const r = G.run, id = r.caseId, cfg = CASE_CFG[id];
    UI.setBg(cfg.bg); UI.music(cfg.music || 'case');
    await SCN.caseTitle(id);
    await playScript(CASES[id].intro, { bg: cfg.bg, key: id + 'intro' });
    r.pending = null; saveGame();
    UI.go('map');
  },
  async resume() {
    const r = G.run;
    if (!r) return CAMP.toHub();
    const p = r.pending;
    if (r.caseId === 'c0') return CAMP.prologue();
    if (!p) return UI.go('map');
    if (p.type === 'intro') return CAMP.caseIntro();
    if (p.type === 'node') {
      if (r.nodeSnap) Object.assign(r, deep(r.nodeSnap));
      if (G.meta.nodeCamp) G.meta.camp = mergeMeta({ camp: deep(G.meta.nodeCamp) }).camp;
      return CAMP.enterNode(p.stage, p.node, true);
    }
    if (p.type === 'boss') return CAMP.bossNode(true);
    if (p.type === 'post') return CAMP.postBoss(p.how, true);
    if (p.type === 'legacy') return CAMP.afterSummary();
    return UI.go('map');
  },

  /* ---------- 地圖節點 ---------- */
  async enterNode(si, ni, resumed) {
    const r = G.run;
    const st = r.map[si];
    if (!st) return UI.go('map');
    const node = st.kind === 'story' ? { t: 'q', key: st.key } : st.kind === 'boss' ? { t: 'B' } : st.nodes[ni];
    r.pending = { type: 'node', stage: si, node: ni };
    r.pos = { stage: si, node: ni };
    r.nodeSnap = deep({ hp: r.hp, maxHp: r.maxHp, deck: r.deck, gold: r.gold, relics: r.relics, items: r.items, itemSlots: r.itemSlots, bossMods: r.bossMods, wishes: r.wishes, stats: r.stats, shops: r.shops, revived: r.revived });
    G.meta.nodeCamp = deep(CM());
    saveGame();
    try {
      if (node.t === 'q') await CAMP.storyNode(st.key);
      else if (node.t === 'F') await CAMP.fightNode(node, 'normal');
      else if (node.t === 'L') await CAMP.fightNode(node, 'elite');
      else if (node.t === 'K') await CAMP.fightNode(node, 'elite');
      else if (node.t === 'E') await CAMP.eventNode(node);
      else if (node.t === 'S') await CAMP.shopNode(node);
      else if (node.t === 'R') await CAMP.restNode(node);
      else if (node.t === 'B') return CAMP.bossNode();
    } catch (e) {
      if (e instanceof CaseFailed) return CAMP.caseFail(e.info);
      throw e;
    }
    if (!G.run) return;
    st.done = ni == null ? 0 : ni;
    r.stage = si + 1;
    r.pending = null;
    saveGame();
    UI.go('map');
  },
  async storyNode(key) {
    const id = G.run.caseId;
    const C0 = CASES[id];
    const sec = C0[key];
    const steps = Array.isArray(sec) ? sec : sec && sec.script;
    UI.music(CASE_CFG[id].music || 'case');
    await playScript(steps, { bg: CASE_CFG[id].bg, key: id + key });
  },
  async fightNode(node, kind) {
    const r = G.run, cfg = CASE_CFG[r.caseId];
    const enemies = node.enc || (kind === 'elite' ? cfg.elites[0] : cfg.normals[0]);
    const res = await CAMP.fight(enemies, kind, { taboo: node.taboo || null });
    await CAMP.reward(kind, res);
  },
  async fight(enemies, kind, extra = {}) {
    const r = G.run, cfg = CASE_CFG[r.caseId];
    const n = cfg.no;
    const res = await runCombat(Object.assign({
      enemies, kind, caseN: n, title: extra.title || (kind === 'elite' ? '險' : kind === 'boss' ? '法事' : '鬥'),
      bg: extra.bg || cfg.fightBg, taboo: extra.taboo || null,
    }, extra));
    r.stats.fights++;
    if (!res.win) throw new CaseFailed({ kind, enemies });
    CAMP.applyOutcomes(res.outcomes);
    saveGame();
    return res;
  },
  async scriptFight(enemies, kind, st) {
    const res = await CAMP.fight(enemies, kind, { taboo: enemies.includes('amah') ? 'family' : null, title: kind === 'elite' ? '險' : '鬥' });
    UI.setBg(CASE_CFG[G.run.caseId].bg);
    return res;
  },
  applyOutcomes(outcomes) {
    const c = CM(), r = G.run;
    for (const o of outcomes) {
      if (o.boss) continue;
      if (o.spirit) continue;
      if (o.how === 'du') { c.merit += 1; c.duSouls += 1; if (r) r.stats.du++; }
      else { c.karma += 1; c.sanSouls += 1; if (r) r.stats.san++; }
    }
  },
  async eventNode(node) {
    const r = G.run;
    const n = caseNo(r.caseId);
    const seen = CM().eventsSeen || (CM().eventsSeen = {});
    let ev = node.ev && EVENTS[node.ev];
    if (!ev || (ev.once && seen[ev.id])) {
      const pool = Object.values(EVENTS).filter(e => (!e.cases || e.cases.includes(n)) && !(e.once && seen[e.id]) && (!e.if || safeIf(e.if)));
      const rng = new RNG(r.seed + r.stage * 131);
      ev = pool.length ? rng.pick(pool) : null;
    }
    if (!ev) { UI.toast('夜很安靜。什麼事都沒有。'); return; }
    node.ev = ev.id;
    seen[ev.id] = 1;
    saveGame();
    await SCN.eventTitle(ev.title);
    await playScript(ev.script, { bg: ev.bg || CASE_CFG[r.caseId].bg, key: 'ev' + ev.id });
    UI.setBg(CASE_CFG[r.caseId].bg);
  },

  /* ---------- 獎勵 ---------- */
  async reward(kind, res) {
    const r = G.run;
    const rng = new RNG(r.seed + r.stage * 977 + (kind === 'elite' ? 3 : 0));
    const gold = kind === 'elite' ? rng.int(26, 36) : rng.int(12, 20);
    const cards = rollCards(rng, 3, kind === 'elite' ? 'elite' : 'normal').map(id => mkCard(id, 0));
    const relic = kind === 'elite' ? (() => { const pool = relicPool(); return pool.length ? rng.pick(pool).id : null; })() : null;
    const item = rng.chance(kind === 'elite' ? .6 : .35) ? rng.pick(Object.keys(ITEMS)) : null;
    const du = res.outcomes.filter(o => !o.spirit && o.how === 'du').length, san = res.outcomes.filter(o => !o.spirit && o.how === 'san').length;
    await UI.go('reward', { gold, cards, relic, item, du, san, kind });
  },

  /* ---------- 紙紮店 ---------- */
  async shopNode(node) {
    const r = G.run;
    const key = 's' + r.stage;
    if (!r.shops[key]) {
      const rng = new RNG(r.seed + r.stage * 313);
      const ids = rollCards(rng, 5, 'shop');
      const price = id => ({ '常': 45, '奇': 72, '絕': 115, '邪': 70, '伴': 60 }[cdef(id).rar] || 50) + rng.int(-5, 8);
      const cards = ids.map(id => ({ c: mkCard(id, 0), cost: price(id), sold: false }));
      const sale = rng.int(0, cards.length - 1); cards[sale].cost = Math.floor(cards[sale].cost / 2); cards[sale].sale = true;
      const rp = relicPool(); rng.shuffle(rp);
      const relics = rp.slice(0, 2).map(x => ({ id: x.id, cost: ({ '常': 125, '奇': 170, '絕': 230, '邪': 160 }[x.rar] || 150) + rng.int(-10, 10), sold: false }));
      const it = rng.shuffle(Object.keys(ITEMS)).slice(0, 3).map(id => ({ id, cost: rng.int(28, 44), sold: false }));
      r.shops[key] = { cards, relics, items: it, removeCost: 60 + (CM().removes || 0) * 20, removed: false };
      saveGame();
    }
    UI.music('tan');
    await UI.go('shop', { key });
  },
  /* ---------- 廟 ---------- */
  async restNode(node) {
    UI.music('tan');
    await UI.go('rest', {});
  },

  /* ---------- 首領 ---------- */
  async bossNode(resumed) {
    const r = G.run, id = r.caseId, cfg = CASE_CFG[id];
    if (id === 'c8') return CAMP.finale(resumed);
    r.pending = { type: 'boss' };
    if (!r.bossSnap) r.bossSnap = { hp: r.hp, maxHp: r.maxHp, deck: deep(r.deck), gold: r.gold, relics: r.relics.slice(), items: r.items.slice(), bossMods: deep(r.bossMods), wishes: r.wishes.slice() };
    saveGame();
    UI.music('boss');
    if (!r.preSeen) { await playScript(CASES[id].pre, { bg: cfg.bg, key: id + 'pre' }); r.preSeen = 1; saveGame(); }
    let res;
    try {
      res = await CAMP.fight(cfg.boss, 'boss', { taboo: cfg.taboo, lines: CASES[id].lines, mods: r.bossMods, wishesKnown: r.wishes, title: '法事・' + cfg.title });
    } catch (e) {
      if (e instanceof CaseFailed) return CAMP.caseFail(Object.assign({ boss: true }, e.info));
      throw e;
    }
    const b = res.outcomes.find(o => o.boss);
    const how = b ? b.how : 'san';
    await CAMP.postBoss(how);
  },
  async postBoss(how, resumed) {
    const r = G.run, id = r.caseId, c = CM();
    if (!r.pending || r.pending.type !== 'post') {
      c.done[id] = how;
      if (how === 'du') { c.merit += 3; c.duSouls += 1; c.rep += 8; }
      else { c.karma += 3; c.sanSouls += 1; c.rep += 3; }
      c.ledger.push({ c: id, how, t: Date.now() });
      r.pending = { type: 'post', how };
      G.meta.postCamp = deep(CM());
      saveGame(true);
    } else if (G.meta.postCamp) {
      G.meta.camp = mergeMeta({ camp: deep(G.meta.postCamp) }).camp;
    }
    UI.music(how === 'du' ? 'memory' : 'sad');
    await playScript(CASES[id][how], { bg: CASE_CFG[id].bg, persist: true, key: id + how });
    r.pending = { type: 'legacy', how };
    saveGame(true);
    await CAMP.afterSummary();
  },
  async afterSummary() {
    const r = G.run, id = r.caseId;
    const how = (r.pending && r.pending.how) || CM().done[id];
    if (!r.summaryDone) { await UI.go('summary', { how }); return; } // 摘要畫面按下「傳承」後會呼叫 CAMP.legacyThenEpi
    await CAMP.legacyThenEpi();
  },
  async legacyThenEpi() {
    const r = G.run, id = r.caseId;
    r.summaryDone = 1; saveGame();
    if (!r.legacyDone) {
      await CAMP.legacyPick();
      r.legacyDone = 1; saveGame(true);
    }
    UI.music('tan');
    if (r.epiStarted && G.meta.epiCamp) G.meta.camp = mergeMeta({ camp: deep(G.meta.epiCamp) }).camp;
    else { G.meta.epiCamp = deep(CM()); r.epiStarted = 1; saveGame(true); }
    await playScript(CASES[id].epi, { bg: 'altar', persist: true, key: id + 'epi' });
    G.meta.epiCamp = null; G.meta.postCamp = null;
    CAMP.closeCase();
  },
  closeCase() {
    const r = G.run, id = r.caseId;
    const i = CASE_ORDER.indexOf(id);
    CM().next = CASE_ORDER[i + 1] || 'c8';
    G.run = null;
    saveGame(true);
    CAMP.toHub();
  },
  async legacyPick() {
    const r = G.run;
    const cands = r.deck.filter(c => { const d = cdef(c); return !['咒'].includes(d.el) && !d.miner && d.rar !== '基'; });
    if (!cands.length) return;
    const pick = await UI.pickCards(cands, { title: '傳承', sub: '從這一案的牌裡，選一張放進你的法壇（之後每一案都會帶著它）。', min: 1, max: 1, cancel: true, cancelLabel: '不傳承', btn: '放進法壇' });
    if (!pick || !pick[0]) return;
    const base = CM().base;
    if (base.length >= 12) {
      const out = await UI.pickCards(base.map(c => mkCard(c.id, c.up)).filter(c => !cdef(c).perm), { title: '法壇滿了', sub: '法壇最多 12 張。選一張拿掉。', min: 1, max: 1, cancel: true, cancelLabel: '不放了' });
      if (!out || !out[0]) return;
      const idx = base.findIndex(c => c.id === out[0].id && (c.up ? 1 : 0) === (out[0].up ? 1 : 0));
      if (idx >= 0) base.splice(idx, 1);
    }
    base.push({ id: pick[0].id, up: pick[0].up ? 1 : 0 });
    UI.toast(`<b>「${esc(cdef(pick[0]).name)}」放進了法壇</b>`, 'good');
    SND.play('stamp');
  },
  async caseFail(info = {}) {
    const r = G.run;
    if (!r) return CAMP.toHub();
    G.meta.retries = G.meta.retries || {};
    G.meta.retries[r.caseId] = (G.meta.retries[r.caseId] || 0) + 1;
    saveGame(true);
    let v = await SCN.failScreen(!!info.boss && !!r.bossSnap, !info.boss && !!r.nodeSnap, { tries: G.meta.retries[r.caseId], caseId: r.caseId, full: r.caseId === 'c8' });
    if (v === 'easy') { G.meta.settings.diff = 0; UI.toast('<b>改成「香客」難度</b><br><small>鬼的怨、傷害都降低了。故事完全一樣。</small>', 'good', 3200); v = info.boss ? 'boss' : 'node'; }
    if (v === 'map' && r.nodeSnap) {
      Object.assign(r, deep(r.nodeSnap));
      if (G.meta.nodeCamp) G.meta.camp = mergeMeta({ camp: deep(G.meta.nodeCamp) }).camp;
      r.pending = null;
      saveGame(true);
      return UI.go('map');
    }
    if (v === 'node' && r.nodeSnap && r.pos) {
      Object.assign(r, deep(r.nodeSnap));
      if (G.meta.nodeCamp) G.meta.camp = mergeMeta({ camp: deep(G.meta.nodeCamp) }).camp;
      saveGame(true);
      return CAMP.enterNode(r.pos.stage, r.pos.node);
    }
    if (v === 'boss' && r.bossSnap) {
      const s = r.bossSnap;
      Object.assign(r, { hp: r.caseId === 'c8' ? s.maxHp : Math.max(s.hp, Math.round(s.maxHp * .7)), maxHp: s.maxHp, deck: deep(s.deck), gold: s.gold, relics: s.relics.slice(), items: s.items.slice(), bossMods: deep(s.bossMods), wishes: s.wishes.slice(), revived: false });
      saveGame(true);
      return r.caseId === 'c8' ? CAMP.finale(true) : CAMP.bossNode(true);
    }
    if (v === 'hub') { CAMP.toHub(); return; }
    return CAMP.restartCase();
  },

  /* ---------- 序章 ---------- */
  async prologue() {
    const r = G.run;
    const C0 = CASES.c0;
    UI.music('none');
    if (!r.pro || r.pro < 1) { await playScript(C0.intro, { bg: 'black', key: 'c0intro' }); r.pro = 1; saveGame(); }
    if (r.pro < 2) { UI.music('tan'); await playScript(C0.q1.script, { bg: 'altar', key: 'c0q1' }); r.pro = 2; saveGame(); }
    if (r.pro < 3) {
      await playScript(C0.pre, { bg: 'altar', key: 'c0pre' });
      const res = await runCombat({ enemies: ['tut_jing', 'tut_yu'], kind: 'normal', caseN: 1, title: '收驚', bg: 'altar', tutorial: 'shoujing', lines: C0.lines, stack: ['dizhong', 'qixing', 'hushen', 'qingxiang', 'zhishan'], comps: ['agui'], music: 'fight' });
      if (!res.win) { r.hp = r.maxHp; saveGame(); await UI.modal({ title: '再來一次', html: '<p>小宇還在哭。深呼吸，再試一次。<br><small>先斬掉「驚」，再用帝鐘安撫小宇的魂，最後用衣服和他的名字把他叫回來。</small></p>', buttons: [{ label: '再試一次', value: 1, cls: 'pri' }] }); return CAMP.prologue(); }
      r.pro = 3; saveGame();
    }
    if (r.pro < 4) { await playScript(C0.du, { bg: 'altar', persist: true, key: 'c0du' }); r.pro = 4; saveGame(); }
    await playScript(C0.epi, { bg: 'altar', persist: true, key: 'c0epi' });
    CM().done.c0 = 'done';
    CM().next = 'c1';
    G.run = null;
    saveGame(true);
    CAMP.toHub();
  },

  /* ============================================================
     終章
     ============================================================ */
  async finale(resumed) {
    const r = G.run, c = CM(), C8 = CASES.c8;
    const route = c.flags.route || 'open';
    r.pending = { type: 'boss' };
    if (!r.bossSnap) r.bossSnap = { hp: r.hp, maxHp: r.maxHp, deck: deep(r.deck), gold: r.gold, relics: r.relics.slice(), items: r.items.slice(), bossMods: deep(r.bossMods), wishes: r.wishes.slice() };
    saveGame(true);
    try {
      if (route === 'seal') {
        if (!r.f1) { await playScript(C8.seal_pre, { bg: 'tunnel', key: 'c8seal' }); r.f1 = 1; saveGame(); }
        UI.music('boss');
        await CAMP.fight(['kengdi'], 'boss', { title: '封坑', bg: 'tunnel', taboo: 'turn', onStart: CAMP.returnedHelp });
        return CAMP.ending('seal');
      }
      if (route === 'open' && !r.f2) {
        if (!r.f1) { await playScript(C8.jiang_pre, { bg: 'minegate', key: 'c8jp' }); r.f1 = 1; saveGame(); }
        UI.music('boss');
        const res = await CAMP.fight(['jiang_hun'], 'boss', { title: '子時・江頭家', bg: 'minegate', taboo: 'yin', onStart: CAMP.returnedHelp });
        const b = res.outcomes.find(o => o.boss); const how = b ? b.how : 'san';
        c.flags.c8jiang = how;
        if (how === 'du') c.merit += 3; else c.karma += 3;
        saveGame(true);
        await playScript(how === 'du' ? C8.jiang_du : C8.jiang_san, { bg: 'minegate', persist: true, key: 'c8j' + how });
        r.f2 = 1; saveGame(true);
      }
      if (!r.f3) { await playScript(C8.pre, { bg: 'tunnel', key: 'c8pre' }); r.f3 = 1; saveGame(); }
      c.miners = {};
      UI.music('boss');
      const waves = [['miner_chen', 'miner_zhang', 'miner_gao'], ['miner_pasang', 'miner_ji'], ['miner_you', 'miner_lin']];
      await CAMP.fight(waves[0], 'boss', {
        title: '七聲', bg: 'tunnel', taboo: 'turn2', waves: waves.slice(1), lines: C8.lines,
        onStart: async B2 => { await CAMP.returnedHelp(B2); if (route === 'scatter') { B2.selfApply('陽氣', 3); await UIC.banner('邪法在你手上發燙'); await B2.zhanAll(6, { raw: true }); } await CAMP.nameCalls(waves[0]); },
        onWave: async ids => { await CAMP.breath(route); if (route === 'scatter') { await UIC.banner('邪火燒過風巷'); await B.zhanAll(6, { raw: true }); } await CAMP.nameCalls(ids); },
        onResolve: async (t, how) => { if (t.miner) { c.miners[t.miner] = how; saveGame(); const m = C8.miners[t.miner]; const pages = m && m[how]; if (pages) { await playScript(Array.isArray(pages) ? pages : [pages], { bg: 'tunnel', key: 'c8m' + t.miner + how }); UIC.render(); } } },
      });
    } catch (e) {
      if (e instanceof CaseFailed) {
        UI.music('sad');
        await playScript(C8.endings.third, { bg: 'tunnel', key: 'c8third' });
        G.meta.endings.third = (G.meta.endings.third || 0) + 1; saveGame(true);
        return CAMP.caseFail({ boss: true });
      }
      throw e;
    }
    const san = Object.values(c.miners).filter(v => v === 'san').length;
    for (const v of Object.values(c.miners)) { if (v === 'du') { c.merit += 2; c.duSouls++; } else { c.karma += 2; c.sanSouls++; } }
    saveGame(true);
    if (route === 'scatter' && san >= 4) return CAMP.ending('scatter');
    UI.music('memory');
    await playScript(C8.after_open, { bg: 'dawn', persist: true, key: 'c8after' });
    const all = Object.keys(MINER_INFO).every(k => c.miners[k] === 'du');
    if (all && c.flags.burned) return CAMP.ending('true');
    if (all) return CAMP.ending('paper');
    return CAMP.ending('unfinished');
  },
  /* 七聲的波與波之間：喘一口氣；開坑路線、香火夠旺，風巷口的人會一起喊 */

    if (c.flags.fight_amah === 'du') { B2.heal(5); helps.push('阿嬤的髮簪'); }

  async ending(kind) {

function callerOf(k) {
  const f = CM().flags;
  switch (k) {
    case 'lin': return '罔市';
    case 'you': return '美鳳';
    case 'ji': return compOn('longge') ? '龍哥' : '紀阿嬌';
    case 'pasang': return '尤幹';
    case 'chen': return CM().done.c3 === 'du' ? '阿水伯' : f.c3_son ? '陳志明' : compOn('meifeng') ? '美鳳' : '有人';
    case 'zhang': return f.c6_widows ? '張阿婆' : '江頭家';
    case 'gao': return f.c6_widows ? '高阿婆' : f.c8_gaofu ? '你' : '江頭家';
  }
  return '有人';
}
const TUTORIAL_DECK = ['qixing', 'qixing', 'qixing', 'hushen', 'hushen', 'dizhong', 'dizhong', 'qingxiang', 'qingxiang', 'zhishan', 'jiaoming'];

/* ---------- 地圖產生 ---------- */
function genMap(id, rng) {
  const cfg = CASE_CFG[id];
  let ni = 0, ei = 0, tabooN = 0;
  const normals = rng.shuffle(cfg.normals.slice());
  return cfg.map.map(st => {
    if (typeof st === 'string') {
      if (st === 'B') return { kind: 'boss' };
      return { kind: 'story', key: st };
    }
    return {
      kind: 'choice', nodes: st.map(t => {
        const n = { t };
        if (t === 'F') { n.enc = normals[ni++ % normals.length]; if (rng.chance(.35) && cfg.taboos) { n.taboo = rng.pick(cfg.taboos); tabooN++; } }
        if (t === 'L') { n.enc = cfg.elites[ei++ % cfg.elites.length]; if (cfg.taboos) n.taboo = rng.pick(cfg.taboos); }
        if (t === 'K') { n.enc = ['kengdi']; }
        return n;
      }),
    };
  });
}

        ${d.relic ? `<button class="rw ${taken.has('relic') ? 'done' : ''}" data-rw="relic">${relicHTML(d.relic)}法器：${esc(RELICS[d.relic].name)}<small>${esc(RELICS[d.relic].desc)}</small></button>` : ''}
      </div>
      <h3>${taken.has('card') ? '已選牌' : '選一張牌（或不拿）'}</h3>
      <div class="rw-cards ${taken.has('card') ? 'taken' : ''}">${d.cards.map((c, i) => `<div class="rw-card" data-rc="${i}">${cardHTML(c)}</div>`).join('')}</div>
      <div class="rw-btns"><button class="btn pri" data-rw="go">繼續</button></div>
    </div>`;
  };
  draw();
  await new Promise(res => {
    const on = e => {
      const b = e.target.closest('[data-rw],[data-rc]');
      if (!b) return;
      if (b.dataset.rc != null) {
        if (taken.has('card')) return;
        const c = d.cards[+b.dataset.rc];
        r.deck.push(mkCard(c.id, c.up)); markSeen('cards', c.id); taken.add('card'); SND.play('page');
        UI.toast(`<b>「${esc(cdef(c).name)}」加入牌組</b>`, 'good', 1600);
        draw(); UI.hud(); return;
      }
      const k = b.dataset.rw;
      if (k === 'item' && !taken.has('item')) { if (r.items.length < (r.itemSlots || 3)) { r.items.push(d.item); taken.add('item'); SND.play('coin'); } else UI.toast('供品欄滿了', 'bad'); draw(); UI.hud(); return; }
      if (k === 'relic' && !taken.has('relic')) { r.relics.push(d.relic); applyRelicGain(d.relic); markSeen('relics', d.relic); taken.add('relic'); SND.play('discover'); draw(); UI.hud(); return; }
      if (k === 'go') { scr.removeEventListener('click', on); saveGame(); res(); }
    };
    scr.addEventListener('click', on);
    if (AUTO.on) setTimeout(() => { if (!taken.has('card')) { const c = AUTO.pickReward(d.cards); if (c) { r.deck.push(mkCard(c.id, 0)); } } if (d.relic) { r.relics.push(d.relic); applyRelicGain(d.relic); } if (d.item && r.items.length < 3) r.items.push(d.item); scr.removeEventListener('click', on); res(); }, 0);

  const shopName = LS ? LS.name : '罔市紙紮', shopFig = LS ? LS.fig : 'wangshi';
  const draw = () => {
    scr.innerHTML = `<div class="shopscr">
      <div class="shop-head"><div class="sh-fig">${figHTML(shopFig, { ghost: !!(LS && LS.ghost) })}</div><div><h2>${esc(shopName)}</h2><p>${esc(line)}</p></div><div class="sh-gold">${ICON('錢')}${r.gold}</div></div>
      <div class="shop-cards">${S.cards.map((it, i) => `<div class="sitem ${it.sold ? 'sold' : ''} ${it.sale ? 'sale' : ''}" data-sc="${i}">${cardHTML(it.c)}<b class="price ${r.gold < it.cost ? 'poor' : ''}">${it.sold ? '已賣' : it.cost}${it.sale && !it.sold ? '<small>半價</small>' : ''}</b></div>`).join('')}</div>
      <div class="shop-row">
        ${S.relics.map((it, i) => `<button class="sbtn ${it.sold ? 'sold' : ''}" data-sr="${i}" ${it.sold ? 'disabled' : ''}>${relicHTML(it.id)}<span><b>${esc(RELICS[it.id].name)}</b><small>${esc(RELICS[it.id].desc)}</small></span><em class="${r.gold < it.cost ? 'poor' : ''}">${it.sold ? '已賣' : it.cost}</em></button>`).join('')}
        ${S.items.map((it, i) => `<button class="sbtn ${it.sold ? 'sold' : ''}" data-si="${i}" ${it.sold ? 'disabled' : ''}>${itemHTML(it.id, 0)}<span><b>${esc(ITEMS[it.id].name)}</b><small>${esc(ITEMS[it.id].desc)}</small></span><em class="${r.gold < it.cost ? 'poor' : ''}">${it.sold ? '已賣' : it.cost}</em></button>`).join('')}
        <button class="sbtn rm" data-srm="1" ${S.removed ? 'disabled' : ''}><span class="rmi">${ICON('火')}</span><span><b>燒掉一張牌</b><small>從牌組刪去一張（每家店一次）</small></span><em class="${r.gold < S.removeCost ? 'poor' : ''}">${S.removed ? '已用' : S.removeCost}</em></button>
      </div>
      <div class="rw-btns"><button class="btn pri" data-sleave="1">走了</button></div>
    </div>`;
  };
  draw();
  await new Promise(res => {
    const buy = (cost, fn) => { if (r.gold < cost) { SND.play('fail'); UI.toast('香油錢不夠', 'bad'); return false; } r.gold -= cost; SND.play('coin'); fn(); saveGame(); return true; };
    const on = async e => {
      const b = e.target.closest('[data-sc],[data-sr],[data-si],[data-srm],[data-sleave]');
      if (!b) return;
      if (b.dataset.sleave) { scr.removeEventListener('click', on); res(); return; }
      if (b.dataset.sc != null) { const it = S.cards[+b.dataset.sc]; if (it.sold) return; buy(it.cost, () => { it.sold = true; r.deck.push(mkCard(it.c.id, 0)); markSeen('cards', it.c.id); }); }
      else if (b.dataset.sr != null) { const it = S.relics[+b.dataset.sr]; if (it.sold) return; buy(it.cost, () => { it.sold = true; r.relics.push(it.id); applyRelicGain(it.id); markSeen('relics', it.id); }); }
      else if (b.dataset.si != null) { const it = S.items[+b.dataset.si]; if (it.sold) return; if (r.items.length >= (r.itemSlots || 3)) { UI.toast('供品欄滿了', 'bad'); return; } buy(it.cost, () => { it.sold = true; r.items.push(it.id); }); }

        if (S.removed || r.gold < S.removeCost) { SND.play('fail'); return; }

      }
      draw(); UI.hud();
    };
    scr.addEventListener('click', on);
    if (AUTO.on) setTimeout(() => { AUTO.shop(S, r); scr.removeEventListener('click', on); res(); }, 0);
  });
};

      else if (k === 'up') {
        const pick = await UI.pickCards(r.deck.filter(c => !c.up && cdef(c).u), { title: '開光', sub: '用硃砂筆點一張牌。', min: 1, max: 1, showUpgrade: true, cancel: true });
        if (!pick || !pick[0]) return;

      }
      saveGame(); UI.hud();
      scr.removeEventListener('click', on); res();
    };
    scr.addEventListener('click', on);
    if (AUTO.on) setTimeout(() => { if (r.hp < r.maxHp * .6) r.hp = Math.min(r.maxHp, r.hp + heal); else { const c = r.deck.filter(x => !x.up && cdef(x).u).sort((a, b) => AUTO.cardValue(b) - AUTO.cardValue(a))[0]; if (c) c.up = 1; } scr.removeEventListener('click', on); res(); }, 0);

/* ============================================================
   SCN — 劇情播放器
   ============================================================ */
const SCN = (() => {
  const L = () => $('#scene');
  let backlog = [];
  let auto = false;
  let cur = { bg: null, left: null, right: null };
  function parse(p) {
    if (p == null) return null;
    if (typeof p === 'object') { if (p.bg) return { kind: 'bg', bg: p.bg }; if (p.sfx) return { kind: 'snd', sfx: p.sfx }; return null; }
    const s = zmFix(String(p));
    if (s.startsWith('@')) { const i = s.indexOf('：'); return { kind: 'say', sp: s.slice(1, i), t: s.slice(i + 1) }; }
    if (s.startsWith('~')) return { kind: 'sfx', t: s.slice(1) };
    if (s.startsWith('#')) return { kind: 'title', t: s.slice(1) };
    return { kind: 'narr', t: s };
  }
  function hashOf(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h.toString(36); }
  function open() {
    const l = L();
    if (l.hidden) { l.hidden = false; l.className = 'scene in'; auto = !!G.meta.settings.auto; syncCtl(); }
  }
  function setBg(bg) {
    if (!bg || cur.bg === bg) return;
    cur.bg = bg;
    const box = L().querySelector('.sc-bg');
    const old = box.querySelector('.scbg');
    const n = document.createElement('div');
    n.className = 'scbg b-' + bg;
    n.innerHTML = PAPER.bg(bg);
    box.appendChild(n);
    requestAnimationFrame(() => n.classList.add('on'));
    if (old) { old.classList.remove('on'); setTimeout(() => old.remove(), 700); }
    clearFigs();
  }
  function clearFigs() { cur.left = cur.right = null; const f = L().querySelector('.sc-figs'); f.querySelector('.fl').innerHTML = ''; f.querySelector('.fr').innerHTML = ''; }
  function showFig(sp) {
    const id = PAPER.speaker(sp === '玉女' ? '紙妹' : sp === '紙妹' && flag('agui_voice') ? '阿桂' : sp);
    const f = L().querySelector('.sc-figs');
    const fl = f.querySelector('.fl'), fr = f.querySelector('.fr');
    fl.classList.remove('act'); fr.classList.remove('act');
    if (!id) return;
    const slot = sp === '魏子葳' || sp === '小子葳' ? 'left' : 'right';
    const el = slot === 'left' ? fl : fr;
    if (cur[slot] !== sp) {
      cur[slot] = sp;
      el.innerHTML = `<div class="sfig" data-sp="${esc(sp)}">${PAPER.fig(id, { ghost: GHOST_SPEAKERS.has(sp), flip: slot === 'right' })}</div>`;
    }
    el.classList.add('act');
  }
  function syncCtl() {
    const l = L();
    const a = l.querySelector('.sc-auto');
    if (a) a.classList.toggle('on', auto);
  }
  async function play(pages, o = {}) {
    const items = pages.map(parse).filter(Boolean);
    if (!items.length) return;
    open();
    const l = L();
    if (o.bg && !cur.bg) setBg(o.bg);
    const textKey = items.filter(p => p.t).slice(0, 3).map(p => p.t).join('|');
    const key = textKey ? hashOf((o.key || '') + textKey) : null;
    const seen = key && G.meta.seenScenes[key];
    if (key) G.meta.seenScenes[key] = 1;
    let skipping = false;
    const skipBtn = l.querySelector('.sc-skip');
    skipBtn.hidden = !seen || items.length < 3;
    skipBtn.onclick = e => { e.stopPropagation(); skipping = true; skipBtn.hidden = true; if (l._adv) l._adv(); };
    const box = l.querySelector('.sc-box'), big = l.querySelector('.sc-big');
    for (const p of items) {
      if (p.kind === 'bg') { setBg(p.bg); if (!skipping) await wait(220); continue; }
      if (p.kind === 'snd') { if (!skipping) SND.play(p.sfx); continue; }
      if (skipping) { if (p.t) backlog.push(p); continue; }
      await showPage(p, box, big);
    }
    skipBtn.hidden = true;
    if (!o.keep) close();
  }
  function fmt(t) { return esc(t).replace(/\n/g, '<br>'); }
  function showPage(p, box, big) {
    return new Promise(res => {
      const l = L();
      backlog.push(p); if (backlog.length > 120) backlog.shift();
      const speed = G.meta.settings.text || 2;
      const txt = box.querySelector('.sc-text'), sp = box.querySelector('.sc-sp'), more = box.querySelector('.sc-more');
      let target = txt;
      if (p.kind === 'sfx' || p.kind === 'title') {
        box.hidden = true; big.hidden = false;
        big.className = 'sc-big ' + p.kind;
        big.innerHTML = fmt(p.t);
        big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop');
        if (p.kind === 'title') SND.play('gong');
        else if (/叩|敲/.test(p.t)) SND.play('knock');
        target = null;
      } else {
        big.hidden = true; box.hidden = false;
        box.classList.toggle('speaking', p.kind === 'say');
        box.classList.toggle('me', p.kind === 'say' && (p.sp === '魏子葳' || p.sp === '小子葳'));
        sp.hidden = p.kind !== 'say';
        sp.textContent = p.kind === 'say' ? (p.sp === '紙妹' && flag('agui_voice') ? '阿桂' : p.sp) : '';
        if (p.kind === 'say') showFig(p.sp);
        else { const f = l.querySelector('.sc-figs'); f.querySelectorAll('.act').forEach(x => x.classList.remove('act')); }
      }
      let done = false, timer = null, i = 0, autoT = null;
      const chars = Array.from(p.t);
      const full = fmt(p.t);
      const finish = () => {
        if (target) target.innerHTML = full;
        done = true; clearInterval(timer); more.hidden = false;
        if (auto) { clearTimeout(autoT); autoT = setTimeout(() => { if (l._adv) adv({ auto: true }); }, 900 + chars.length * 55); }
      };
      if (target) {
        target.innerHTML = ''; more.hidden = true;
        if (SPEED.headless || AUTO.on || speed >= 9) finish();
        else timer = setInterval(() => { i += Math.max(1, Math.round(speed)); if (i >= chars.length) finish(); else target.innerHTML = fmt(chars.slice(0, i).join('')); }, 30);
      } else { done = true; more.hidden = false; if (auto) autoT = setTimeout(() => { if (l._adv) adv({ auto: true }); }, 1400); }
      const adv = e => {
        if (e && e.type === 'keydown' && !['Enter', ' ', 'ArrowRight'].includes(e.key)) return;
        if (e && e.target && e.target.closest && e.target.closest('.sc-choices, .sc-ctl, .sc-log')) return;
        if (e && e.type === 'keydown') e.preventDefault();
        if (!done) { finish(); return; }
        cleanup(); if (!(e && e.auto)) SND.play('page'); res();
      };
      const cleanup = () => { l.removeEventListener('click', adv); window.removeEventListener('keydown', adv); clearInterval(timer); clearTimeout(autoT); l._adv = null; };
      l._adv = () => { finish(); cleanup(); res(); };
      l.addEventListener('click', adv);
      window.addEventListener('keydown', adv);
      if (SPEED.headless || AUTO.on) setTimeout(() => { finish(); cleanup(); res(); }, 0);
    });
  }
  function choose(prompt, opts) {
    return new Promise(res => {
      open();
      const l = L();
      const box = l.querySelector('.sc-box'), big = l.querySelector('.sc-big'), ch = l.querySelector('.sc-choices');
      big.hidden = true;
      if (prompt) { box.hidden = false; box.classList.remove('speaking', 'me'); box.querySelector('.sc-sp').hidden = true; box.querySelector('.sc-text').innerHTML = `<span class="prompt">${fmt(zmFix(prompt))}</span>`; box.querySelector('.sc-more').hidden = true; }
      ch.hidden = false;
      ch.innerHTML = opts.map((c, i) => `<button class="sc-choice" data-ci="${i}"><b>${esc(zmFix(c.label))}</b>${c.sub ? `<small>${esc(zmFix(c.sub))}</small>` : ''}</button>`).join('');
      const on = e => {
        const b = e.target.closest('.sc-choice');
        if (!b) return;
        e.stopPropagation();
        ch.removeEventListener('click', on);
        SND.play('click');
        backlog.push({ kind: 'choice', t: '▸ ' + zmFix(opts[+b.dataset.ci].label) });
        ch.hidden = true; ch.innerHTML = '';
        res(opts[+b.dataset.ci]);
      };
      ch.addEventListener('click', on);
      if (SPEED.headless || AUTO.on) setTimeout(() => { ch.removeEventListener('click', on); ch.hidden = true; ch.innerHTML = ''; res(AUTO.pickChoice(opts)); }, 0);
    });
  }
  async function jiao(r) {
    SND.play('jiao');
    if (SPEED.headless || AUTO.on) return;
    const x = window.innerWidth / 2, y = window.innerHeight * .45;
    try { await FX.jiao(x, y, r, { hold: 900 }); } catch (e) { await wait(600); }
    SND.play('jiao_' + r);
    const b = document.createElement('div');
    b.className = 'jiaoname big j-' + r;
    b.innerHTML = `<b>${JIAO_NAME[r]}</b><small>${r === 'sheng' ? '一平一凸' : r === 'xiao' ? '兩面朝天' : '兩面伏地'}</small>`;
    b.style.left = x + 'px'; b.style.top = (y - 90) + 'px';
    $('#fx').appendChild(b);
    await sleep(1100);
    b.remove();
  }
  function close() {
    const l = L();
    if (l.hidden) return;
    l.classList.remove('in');
    l.hidden = true;
    cur = { bg: null, left: null, right: null };
    l.querySelector('.sc-bg').innerHTML = '';
    clearFigs();
    l.querySelector('.sc-box').hidden = true;
    l.querySelector('.sc-big').hidden = true;
  }
  async function hideForCombat() { close(); }
  /* 彈出卡片 */
  function popCard(html, cls, delay = 350) {
    return new Promise(res => {
      const el = document.createElement('div');
      el.className = 'popcard ' + cls;
      el.innerHTML = html;
      $('#modal').appendChild(el);
      requestAnimationFrame(() => el.classList.add('in'));
      const done = () => { el.removeEventListener('click', done); window.removeEventListener('keydown', kd); el.classList.remove('in'); setTimeout(() => el.remove(), 280); res(); };
      const kd = e => { if (['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); done(); } };
      setTimeout(() => { el.addEventListener('click', done); window.addEventListener('keydown', kd); }, delay);
      if (SPEED.headless || AUTO.on) setTimeout(done, 0);
    });
  }
  function truthPop(id) {
    const T = TRUTHS[id];
    const n = Object.keys(CM().truths).length, tot = TRUTH_ORDER.length;
    SND.play('stamp');
    return popCard(`<div class="pc-inner truth ${T.key ? 'key' : ''}"><div class="pc-label">${T.key ? '關鍵線索' : '線索'}</div><h3>${esc(T.title)}</h3><p>${esc(T.text)}</p><div class="pc-foot">線索牆 ${n}／${tot}</div><div class="pc-seal">${T.key ? '真' : '查'}</div></div>`, 'truthpop');
  }
  function namePop(id) {
    const m = MINER_INFO[id];
    const n = Object.keys(CM().names).length;
    SND.play('bell');
    return popCard(`<div class="pc-inner name"><div class="pc-fig">${PAPER.fig(m.fig, { ghost: true })}</div><div class="pc-label">你記下了一個名字</div><h3>${esc(m.name)}</h3><p>${m.age} 歲・五坑・七號風巷</p><div class="pc-foot">七個名字 ${n}／7</div></div>`, 'namepop');
  }
  function cardPop(id, perm, curse) {
    const c = mkCard(id, 0);
    SND.play(curse ? 'backlash' : 'discover');
    return popCard(`<div class="pc-inner cardp"><div class="pc-label">${curse ? '纏上了' : '得到一張牌'}${perm ? '・放進法壇' : ''}</div>${cardHTML(c)}</div>`, 'cardpop');
  }
  async function caseTitle(id) {
    const cfg = CASE_CFG[id];
    SND.play('gong');
    await popCard(`<div class="pc-inner casetitle"><div class="ct-no">${cfg.no ? '第' + '〇一二三四五六七八'[cfg.no] + '案' : '序章'}</div><h1>${esc(cfg.title)}</h1><div class="ct-date">${esc(cfg.date)}</div><p>${esc(TEASER[id] || '')}</p></div>`, 'casepop', 900);
  }
  async function eventTitle(t) { UI.toast(`<b>怪事・${esc(t)}</b>`, 'ev', 1800); await wait(300); }
  function failScreen(canBoss, canNode, o = {}) {
    SND.play('death');
    UI.music('sad');
    const tries = o.tries || 1;
    const easy = (canBoss || canNode) && diff() > 0 && tries >= 2;
    const tip = FAIL_TIPS[(tries + caseNo(o.caseId)) % FAIL_TIPS.length];
    return UI.modal({
      title: '法事失敗', cls: 'failm',
      html: `<p class="fail-t">陽火熄了。</p><p class="msub">你倒在地上，耳邊還有敲擊聲。叩、叩、叩——叩。</p><p class="fail-tip"><b>阿公的帳本上寫：</b>${esc(tip)}</p>${easy ? `<p class="fail-tip easy">卡住了嗎？可以改成「香客」難度再來：鬼的怨與傷害都會降低，劇情完全一樣（之後隨時可以在設定改回來）。</p>` : ''}`,
      dismiss: false,
      buttons: [
        ...(canNode ? [{ label: '重來這一場', value: 'node', cls: 'pri' }, { label: '退回地圖，換一條路', value: 'map' }] : []),
        ...(canBoss ? [{ label: o.full ? '重整法壇，再戰一次（陽火回滿）' : '重整法壇，再戰一次（陽火至少回到七成）', value: 'boss', cls: 'pri' }] : []),
        ...(easy ? [{ label: '改成香客難度，再戰一次', value: 'easy' }] : []),
        { label: '再開一壇（整案重來）', value: 'case' }, { label: '先回壇', value: 'hub' }],
    });
  }
  function showLog() {
    const l = L();
    let box = l.querySelector('.sc-log');
    if (box) { box.remove(); return; }
    box = document.createElement('div');
    box.className = 'sc-log';
    box.innerHTML = `<div class="lg-head"><b>紀錄</b><button class="btn sm" data-lgc="1">關閉</button></div><div class="lg-body">${backlog.map(p => p.kind === 'say' ? `<p class="lg-say"><b>${esc(p.sp)}</b>${fmt(p.t)}</p>` : p.kind === 'choice' ? `<p class="lg-ch">${esc(p.t)}</p>` : `<p class="lg-${p.kind}">${fmt(p.t)}</p>`).join('')}</div>`;
    l.appendChild(box);
    box.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('[data-lgc]')) box.remove(); });
    const b = box.querySelector('.lg-body'); b.scrollTop = b.scrollHeight;
  }
  function bindCtl() {
    const l = L();
    l.querySelector('.sc-ctl').addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('[data-sc]');
      if (!b) return;
      if (b.dataset.sc === 'log') showLog();
      if (b.dataset.sc === 'auto') { auto = !auto; G.meta.settings.auto = auto; syncCtl(); if (auto && l._adv) l._adv(); }
    });
  }
  return { play, choose, jiao, close, hideForCombat, truthPop, namePop, cardPop, caseTitle, eventTitle, failScreen, bindCtl, setBg };
})();

function availableTalks() {
  const c = CM();
  const doneIdx = CASE_ORDER.indexOf(c.next) - 1;
  return Object.entries(TALKS).filter(([k, t]) => {
    if (c.talks[k]) return false;
    const ai = CASE_ORDER.indexOf(t.after);
    if (ai < 0 || ai > doneIdx) return false;
    if (t.who === 'meifeng' && !c.comps.meifeng) return false;
    if (t.who === 'longge' && !c.comps.longge) return false;
    if (t.if && !safeIf(t.if)) return false;
    return true;
  }).map(([k, t]) => Object.assign({ key: k }, t)).sort((a, b) => CASE_ORDER.indexOf(a.after) - CASE_ORDER.indexOf(b.after));
}

      html: `${list.length ? `<div class="tlist">${list.map(t => `<button class="tbtn2 new" data-tk="${esc(t.key)}"><b>${esc(t.title)}</b><small>新</small></button>`).join('')}</div>` : '<p class="msub">現在沒有新的話。</p>'}${seen.length ? `<details><summary>聽過的話（${seen.length}）</summary><div class="tlist">${seen.map(([k, t]) => `<button class="tbtn2" data-tk="${esc(k)}"><b>${esc(t.title)}</b></button>`).join('')}</div></details>` : ''}`,
      buttons: [{ label: '算了', value: null }],
      onMount: (w, close) => { w.addEventListener('click', e => { const b = e.target.closest('[data-tk]'); if (b) close(b.dataset.tk); }); },
    });
    if (!v) return;
    const t = TALKS[v];
    CM().talks[v] = 1; saveGame();
    await playScript(t.script, { bg: t.bg || 'altar', persist: true, key: 'talk' + v });
    UI.go('hub');
  },
  async rewind() {
    const c = CM();
    const opts = CASE_ORDER.slice(1).filter(id => G.meta.snaps[id]);
    if (!opts.length) { UI.toast('還沒有可以重溯的案件。'); return; }
    const v = await UI.modal({
      title: '重溯', cls: 'rewindm',
      html: `<p class="msub">回到某一案開始的那一刻，重新選擇。<br>之後的進度會被覆蓋；已見過的結局、圖鑑、劇情略過紀錄會保留。</p><div class="tlist">${opts.map(id => `<button class="tbtn2" data-rw="${id}"><b>${esc(caseLabel(id))}</b><small>${c.done[id] ? (c.done[id] === 'du' ? '上次：送走' : c.done[id] === 'san' ? '上次：打散' : '上次：' + esc((ENDING_INFO[c.done[id]] || {}).name || '')) : ''}</small></button>`).join('')}</div>`,
      buttons: [{ label: '算了', value: null }],
      onMount: (w, close) => { w.addEventListener('click', e => { const b = e.target.closest('[data-rw]'); if (b) close(b.dataset.rw); }); },
    });
    if (!v) return;
    const ok = await UI.confirm('重溯', `回到〈${esc(CASE_CFG[v].title)}〉開始的時候？之後的進度會被覆蓋。`, '重溯', '算了');
    if (!ok) return;
    G.meta.camp = mergeMeta({ camp: deep(G.meta.snaps[v]) }).camp;
    G.run = null;
    saveGame(true);
    CAMP.startCase(v);
  },
  async sandbox() {
    const seenE = Object.values(ENEMIES).filter(d => G.meta.codex.enemies[d.id] && !d.id.startsWith('tut_') && !d.id.startsWith('miner_'));
    if (!seenE.length) { UI.toast('先去辦幾件案子，遇過的東西才能在這裡模擬。'); return; }
    const pick = new Set();
    const decks = { base: '我的法壇', all: '所有見過的牌（隨機 14 張）' };
    let deckMode = 'base';
    const v = await UI.modal({
      title: '模擬（試法）', cls: 'wide sandm',
      html: `<p class="msub">挑幾個遇過的對手（最多 3 個），用你的牌試試看。不會影響進度。</p>
        <div class="sb-deck">${Object.entries(decks).map(([k, l]) => `<button class="tab ${k === deckMode ? 'on' : ''}" data-dm="${k}">${l}</button>`).join('')}</div>
        <div class="egrid pick">${seenE.map(d => `<button class="ecx" data-se="${d.id}"><div class="ecx-fig">${figHTML(d.fig, { ghost: !d.noGhost })}</div><b>${esc(d.name)}</b><small>${d.spirit ? '精怪' : '亡魂'}${d.boss ? '・首領' : d.elite ? '・險' : ''}</small></button>`).join('')}</div>`,
      buttons: [{ label: '算了', value: null }, { label: '開始模擬', value: 'go', cls: 'pri' }],
      onMount: w => {
        w.addEventListener('click', e => {
          const b = e.target.closest('[data-se]'), dm = e.target.closest('[data-dm]');
          if (dm) { deckMode = dm.dataset.dm; w.querySelectorAll('[data-dm]').forEach(x => x.classList.toggle('on', x === dm)); }
          if (b) { const id = b.dataset.se; if (pick.has(id)) pick.delete(id); else if (pick.size < 3) pick.add(id); b.classList.toggle('sel', pick.has(id)); }
        });
      },
    });
    if (v !== 'go' || !pick.size) return;
    let deck;
    if (deckMode === 'base') deck = (CM().base || STARTER.map(id => ({ id, up: 0 }))).map(c => ({ id: c.id, up: c.up }));
    else { const pool = Object.keys(G.meta.codex.cards).filter(id => CARDS[id] && !['咒', '劇'].includes(CARDS[id].rar)); const rng = new RNG(newSeed()); deck = STARTER.slice(0, 6).map(id => ({ id, up: 0 })).concat(rng.shuffle(pool).slice(0, 8).map(id => ({ id, up: 0 }))); }
    const ids = [...pick];
    const boss = ids.some(id => ENEMIES[id].boss);
    const res = await runCombat({ enemies: ids, kind: boss ? 'boss' : ids.some(id => ENEMIES[id].elite) ? 'elite' : 'normal', sandbox: true, deck, hp: 70, maxHp: 70, caseN: 4, title: '模擬', bg: 'temple', comps: ['agui', 'huye', ...(CM().comps.meifeng ? ['meifeng'] : []), ...(CM().comps.longge ? ['longge'] : [])] });
    G.cb = null;
    const du = res.outcomes.filter(o => o.how === 'du').length, san = res.outcomes.filter(o => o.how === 'san').length;
    await UI.modal({ title: res.win ? '模擬結束' : '模擬失敗', html: `<p>${res.win ? `回合數 ${res.turns}。送走 ${du}、打散 ${san}。` : '陽火熄了。再調整看看。'}</p>`, buttons: [{ label: '回壇', value: null, cls: 'pri' }] });
    UI.go('hub');
  },
};

/* ---- src/auto.js ---- */
'use strict';
/* ============================================================
   還魂紙 — 自動測試機器人（只在測試模式開啟）
   policy: 'du'（盡量送走）| 'san'（盡量打散）
   ============================================================ */
const AUTO = {
  on: false, policy: 'du', log: [], turnCap: 60,
  combatStart(cb) { this.cur = { turns: 0 }; },
  combatEnd(cb, win) { this.log.push({ win, turns: cb.turn, hp: cb.p.hp, out: cb.outcomes.map(o => o.id + ':' + o.how).join(','), backlash: cb.stats.backlash, sanshen: cb.stats.sanshen }); },
  choose(cards, o) { return cards.slice(0, Math.max(o.min || 1, 1)); },
  prefer: [],
  pickChoice(opts) {
    for (const p of this.prefer) { const o = opts.find(x => new RegExp(p).test(x.label)); if (o) return o; }
    return opts[Math.floor(Math.random() * opts.length)] || opts[0];
  },
  cardValue(c) {
    const d = cdef(c);
    const rv = { '絕': 5, '劇': 4, '邪': this.policy === 'san' ? 4 : 0, '奇': 3, '伴': 3, '常': 2, '基': 0, '咒': -6 }[d.rar] ?? 1;
    const pref = this.policy === 'du' ? ['陰', '筊', '護', '陽'] : ['陽', '邪', '護', '陰'];
    const i = pref.indexOf(d.el);
    return rv * 2 + (c.up ? 2 : 0) + (i < 0 ? 0 : (3 - i) * .5) + Math.random() * .2;
  },
  pickCards(cards, o) {
    const t = (o && o.title) || '';
    const by = (dir) => cards.slice().sort((a, b) => dir * (this.cardValue(b) - this.cardValue(a)))[0];
    if (/傳承/.test(t)) { const b = by(1); return b ? [b] : []; }
    if (/法壇滿了|燒掉|灑淨/.test(t)) { const w = by(-1); return w ? [w] : []; }
    if (/開光/.test(t)) { const b = by(1); return b ? [b] : []; }
    if (o && o.cancel && Math.random() < .3) return null;
    return cards.length ? [cards[Math.floor(Math.random() * cards.length)]] : [];
  },
  modal(buttons) { if (this.takeEasy !== false && buttons.some(b => b.value === 'easy')) return 'easy'; if (buttons.some(b => b.value === 'map') && Math.random() < .5) return 'map'; const pri = buttons.find(b => /pri/.test(b.cls || '')); return pri ? (typeof pri.value === 'function' ? null : pri.value) : null; },
  pickReward(cards) {
    return cards.slice().sort((a, b) => this.cardValue(b) - this.cardValue(a))[0];
  },
  shop(S, r) {
    for (const it of S.relics) if (!it.sold && r.gold >= it.cost) { r.gold -= it.cost; it.sold = true; r.relics.push(it.id); applyRelicGain(it.id); }
    if (!S.removed && r.gold >= S.removeCost) { const pool = r.deck.filter(c => !cdef(c).perm); const w = pool.sort((a, b) => this.cardValue(a) - this.cardValue(b))[0]; if (w && this.cardValue(w) < 3) { r.gold -= S.removeCost; S.removed = true; r.deck.splice(r.deck.indexOf(w), 1); } }
    for (const it of S.cards) if (!it.sold && r.gold >= it.cost + 20 && this.cardValue(it.c) >= 6) { r.gold -= it.cost; it.sold = true; r.deck.push(mkCard(it.c.id, 0)); }
  },
  fails: {}, campaign: false,
  mapPick(r) {
    if (!G.run || G.screen !== 'map') return;
    const st = r.map[r.stage];
    if (!st) return;
    let ni = 0;
    if (st.kind === 'choice') {
      const ts = st.nodes.map(n => n.t);
      const lowHp = r.hp < r.maxHp * .58;
      const want = lowHp ? ['R', 'E', 'S', 'F', 'L', 'K'] : r.gold > 150 ? ['S', 'L', 'F', 'E', 'R', 'K'] : ['L', 'F', 'E', 'S', 'R', 'K'];
      ni = ts.indexOf(want.find(w => ts.includes(w)));
      if (ni < 0) ni = 0;
    }
    CAMP.enterNode(r.stage, ni);
  },
  hubNext() {
    const c = CM();
    if (c.done.c8) { this.finished = true; return; }
    if (G.run) { CAMP.resume(); return; }
    // spend merit / karma like a player would
    for (const b of Object.values(BLESSINGS)) if (!c.blessings[b.id] && c.merit - c.meritSpent >= b.cost && Math.random() < .7) { c.meritSpent += b.cost; c.blessings[b.id] = 1; if (b.patron) c.patron = b.patron; }
    for (const f of Object.values(FORBIDDEN)) if (!c.forbidden[f.id] && c.karma - c.karmaSpent >= f.cost && this.policy === 'san') { c.karmaSpent += f.cost; c.forbidden[f.id] = 1; }
    CAMP.startCase(c.next);
  },
  async onPlayerTurn() {
    if (!this.on) return;
    await sleep(0);
    const cb = G.cb;
    if (!cb || cb.over || cb.phase !== 'player') return;
    if (cb.turn > this.turnCap) { cb.p.hp = 0; await finishCombat(false); return; }
    let guard = 0;
    if (cb.jiao.left > 0) await throwJiao();
    while (!cb.over && cb.phase === 'player' && guard++ < 30) {
      for (let i = 0; i < cb.comps.length; i++) { const cp = cb.comps[i]; if (cp.charge >= cp.need) { await useAssist(i, this.target()); if (cb.over) return; } }
      if (cb.jiao.left > 0) { await throwJiao(); continue; }
      const mv = this.best();
      if (!mv) break;
      const ok = await playCard(mv.c, mv.t);
      if (!ok) break;
    }
    if (!cb.over && cb.phase === 'player') await endTurn();
  },
  target() {
    const a = alive();
    if (!a.length) return null;
    const sp = a.filter(e => e.spirit);
    if (sp.length) return sp.sort((x, y) => x.yuan - y.yuan)[0];
    return a.sort((x, y) => (x.boss ? 1 : 0) - (y.boss ? 1 : 0) || x.yuan - y.yuan)[0];
  },
  incoming() { let t = 0; for (const e of alive()) { const it = getIntent(e); if (it.t === 'atk') t += enemyDmg(e, it.d) * (it.n || 1); } return t; },
  best() {
    const cb = G.cb, p = cb.p;
    const hand = cb.hand.filter(c => canPlay(c));
    if (!hand.length) return null;
    const inc = this.incoming();
    const needBlock = inc - p.block;
    let best = null, bs = -1e9;
    for (const c of hand) {
      const d = cdef(c);
      const tgts = needsTarget(c) ? alive() : [null];
      for (const t of tgts) {
        let s = 0;
        const dv = d.v.d || 0, ov = d.v.o || 0, av = d.v.a || 0, bv = d.v.b || 0;
        if (bv && needBlock > 0) s += Math.min(bv, needBlock) * 1.2;
        if (t) {
          const st = stateOf(t);
          if (t.spirit) s += dv * 1.5 + (d.id === 'huyao' ? 30 : 0);
          else if (this.policy === 'san') s += dv * 1.4 + av * .3 + (ov ? -2 : 0);
          else {
            // du：先壓到「靜」，再供；別打散
            const zhan = zhanPreview(dv, c);
            const lethal = zhan >= t.yuan + t.block;
            if (dv) s += st === '狂' ? dv * 1.1 : st === '怨' ? dv * .6 : -dv * 2;
            if (lethal && dv) s -= 60;
            if (av) s += st === '靜' ? av * .1 : av * 1.2;
            if (ov && t.duMax) { const mult = st === '狂' ? .5 : st === '靜' ? 1.5 : 1; const w = d.wish && t.wishes.includes(d.wish) ? 2 : 1; s += ov * mult * w * 1.3; }
          }
        } else {
          if (d.tgt === 'all') { for (const e of alive()) { if (e.spirit || this.policy === 'san') s += (dv || 0) * 1.2; if (!e.spirit && this.policy === 'du') s += (d.v.o || 0) * (stateOf(e) === '狂' ? .5 : 1) + (d.v.a || 0) * (stateOf(e) === '靜' ? 0 : .8); } }
          if (d.power) s += 8;
          if (d.el === '筊') s += 4;
          if (d.id === 'lingqi' || d.id === 'qiji') s += 6;
        }
        if (d.el === '邪' && this.policy === 'du') s -= 3;
        const tb = cb.taboo;
        if ((tb === 'fire' && (d.tags || []).includes('火')) || (tb === 'blood' && (d.tags || []).includes('劍')) || (tb === 'noise' && cb.turnStat.played >= 3)) s -= 6;
        if (tb === 'family' && t && ENEMIES[t.id].family && (d.v.o || 0) > 0) s -= 1.5;
        s -= (effCost(c) || 0) * .5;
        if (s > bs) { bs = s; best = { c, t }; }
      }
    }
    return bs > 0 ? best : null;
  },
};

/* ---- src/main.js ---- */
'use strict';
/* ============================================================
   還魂紙 — 開機
   ============================================================ */
HHZ.onCloud = () => {
  const el = document.querySelector('.t-foot .cloud');
  if (!el) return;
  el.textContent = G.cloud.status === 'cloud' ? '☁ 已同步到你的帳號' : G.cloud.status === 'cloud-error' ? '☁ 雲端暫時連不上（已存在本機）' : '存檔在這台裝置';
};
function boot(hotData) {
  const saved = loadLocal();
  if (saved) applySave(saved);
  /* 頁面改版熱更新時，viewer 會把進度帶過來；比本機新就用它 */
  try {
    const h = hotData && hotData.save ? JSON.parse(hotData.save) : null;
    if (h && h.meta && (h.savedAt || 0) > (G.savedAt || 0)) applySave(h);
  } catch (e) { }
  SPEED.anim = G.meta.settings.anim || 1;
  bindGlobal();
  try { FX.init($('#fxc')); } catch (e) { }
  SCN.bindCtl();
  const test = !!window.__HHZ_TEST;
  if (test) { G.noSave = !!window.__HHZ_NOSAVE; }
  UI.go('title');
  if (!test) cloudInit(obj => {
    if (G.screen !== 'title') return;
    applySave(obj); LS.set(SAVE_KEY, JSON.stringify(obj));
    UI.go('title');
    UI.toast('已從雲端讀回較新的進度', 'good');
  });
  Object.assign(HHZ, { CAMP, UI, UIC, SCN, AUTO, MODALS, CM, runCombat, playScript, alive, stateOf, cdef, mkCard, flag });
}
(function () {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ save: JSON.stringify(packSave()) })); } catch (e) { }
  if (hot && typeof hot.ready === 'function') { try { hot.ready(boot); return; } catch (e) { } }
  boot((hot && hot.data) || {});
})();
