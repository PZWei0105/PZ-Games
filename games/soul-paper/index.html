<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>還魂紙</title>
<meta name="description" content="台灣民俗儀式 × 劇情牌組構築。鬼月三十天，八件案子。每一隻鬼，你都可以送走，也可以打散。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* ============================================================
   還魂紙 — 紙紮劇場 × 廟會霓虹
   ============================================================ */
:root {
  --ink: #0d0b1a; --ink2: #171327; --ink3: #221c38;
  --paper: #f4ecdd; --paper2: #e6d9bf; --paper3: #cbbd9f;
  --red: #d7263d; --mag: #c2185b; --pink: #e8508a; --gold: #f2c14e; --jade: #2fa37a; --blue: #4aa3df; --lav: #9b7fd4;
  --npink: #ff3d8b; --ncyan: #22e5ff; --nyel: #ffd23f; --ngreen: #39ff88;
  --txt: #efe6d6; --muted: #a99d8b; --line: rgba(255, 230, 190, .16);
  --e-yang: #d7263d; --e-yin: #5d5fe0; --e-hu: #d9a21e; --e-jiao: #ff3d8b; --e-xie: #7a0f2e; --e-zhou: #6d6875;
  --yuan: #ff3b55; --du: #22e5ff;
  --cw: 118px; --ch: 168px;
  --f-body: 'LXGW WenKai TC', 'Noto Serif TC', 'Noto Serif CJK TC', 'PingFang TC', 'Microsoft JhengHei', serif;
  --f-title: 'Noto Serif TC', 'Noto Serif CJK TC', 'LXGW WenKai TC', serif;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--txt); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
body { font-size: 16px; line-height: 1.55; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
#app { position: fixed; inset: 0; overflow: hidden; }
.ico { display: inline-flex; width: 1.15em; height: 1.15em; vertical-align: -.2em; margin-right: .2em; }
.ico svg { width: 100%; height: 100%; }

/* ---------- 背景 ---------- */
.bg { position: absolute; inset: 0; z-index: 0; background: var(--ink); }
.bg-art, .bg-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bg-art { transition: filter .8s; }
.bg.dim .bg-art { filter: brightness(.5) saturate(.85) blur(1.5px); }
.bg.mem .bg-art { filter: sepia(.62) saturate(.72) brightness(.88) contrast(.95); }
.bg.mem .bg-haze { background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(40,24,10,.55) 100%); }
.bg-haze { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(5, 3, 12, .65)); pointer-events: none; }
#fxc { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
#screen { position: absolute; inset: var(--sat) 0 var(--sab); z-index: 2; opacity: 0; transition: opacity .35s; }
#screen.in { opacity: 1; }
#fx { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
#modal { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#modal > * { pointer-events: auto; }
#toast { position: fixed; top: calc(64px + var(--sat)); left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
#tip { position: fixed; z-index: 60; max-width: 300px; padding: 9px 12px; background: rgba(20, 14, 30, .97); border: 1px solid rgba(242, 193, 78, .45); border-radius: 8px; font-size: 14px; line-height: 1.5; box-shadow: var(--shadow); pointer-events: none; }
#tip b { color: var(--gold); }

/* ---------- 按鈕 ---------- */
.btn { border: 1px solid rgba(242, 193, 78, .5); background: linear-gradient(#2a2140, #1a142a); padding: 9px 18px; border-radius: 10px; font-size: 16px; letter-spacing: .08em; transition: transform .12s, box-shadow .2s, background .2s; }
.btn:hover:not(:disabled) { box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(242, 193, 78, .35); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.pri { background: linear-gradient(#c62a44, #8f1531); border-color: #ff8fa0; color: #fff; box-shadow: 0 0 14px rgba(255, 61, 139, .35); }
.btn.danger { border-color: #ff6b6b; color: #ffb3b3; }
.btn.big { font-size: 20px; padding: 12px 28px; }
.btn.sm { font-size: 13px; padding: 4px 10px; }
.btn:disabled { opacity: .45; }

/* ============================================================
   卡牌（符紙）
   ============================================================ */
.card { position: relative; width: var(--cw); height: var(--ch); border-radius: 7px; color: #2a1a12; overflow: hidden; font-size: 12px; line-height: 1.35; box-shadow: 0 4px 12px rgba(0, 0, 0, .5); --ec: var(--e-yang); --pp: #f6dc8c; --pp2: #eac066; --ink-c: #9e1b2a; }
.card.el-陰 { --ec: var(--e-yin); --pp: #e3e6fb; --pp2: #c7ccf2; --ink-c: #2f33a8; }
.card.el-護 { --ec: var(--e-hu); --pp: #fbf3dc; --pp2: #eedcae; --ink-c: #8a5a00; }
.card.el-筊 { --ec: var(--e-jiao); --pp: #fde2ec; --pp2: #f6bcd2; --ink-c: #b0154f; }
.card.el-邪 { --ec: #ff2e54; --pp: #2a1018; --pp2: #160609; --ink-c: #ff4d6d; color: #f4d9dc; }
.card.el-咒 { --ec: #8a8490; --pp: #bdb8c2; --pp2: #9d97a5; --ink-c: #3a3540; }
.c-paper { position: absolute; inset: 0; background:
  repeating-linear-gradient(90deg, rgba(0, 0, 0, .025) 0 1px, transparent 1px 4px),
  radial-gradient(120% 80% at 50% 20%, var(--pp), var(--pp2)); border: 2px solid var(--ec); border-radius: 7px; }
.c-paper::after { content: ''; position: absolute; inset: 4px; border: 1px solid color-mix(in srgb, var(--ec) 45%, transparent); border-radius: 4px; }
.card.up .c-paper { box-shadow: inset 0 0 0 2px rgba(255, 215, 90, .75), inset 0 0 14px rgba(255, 210, 63, .45); }
.card.rar-絕 .c-paper { box-shadow: inset 0 0 12px rgba(255, 61, 139, .35); }
.c-cost { position: absolute; top: 4px; left: 4px; width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-title); font-weight: 900; font-size: 15px; color: #fff; background: radial-gradient(circle at 35% 30%, #ff6b55, #a3141f); border: 1.5px solid #ffe2a0; z-index: 2; box-shadow: 0 0 8px rgba(255, 80, 60, .6); }
.c-cost.cheap { background: radial-gradient(circle at 35% 30%, #5fe3a1, #137a4a); }
.c-cost.dear { background: radial-gradient(circle at 35% 30%, #9a8cff, #3a2a9a); }
.c-el { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; display: grid; place-items: center; font-family: var(--f-title); font-weight: 900; font-size: 12px; color: #fff; background: var(--ec); border-radius: 3px; transform: rotate(4deg); z-index: 2; }
.c-art { position: absolute; top: 18px; left: 0; right: 0; height: 58px; display: grid; place-items: center; }
.c-glyph { font-family: var(--f-title); font-weight: 900; font-size: 40px; color: var(--ink-c); text-shadow: 1px 1px 0 rgba(255, 255, 255, .35); opacity: .92; transform: rotate(-3deg); }
.el-邪 .c-glyph { text-shadow: 0 0 10px rgba(255, 30, 70, .6); }
.c-owner { position: absolute; bottom: 0; right: 4px; font-size: 10px; padding: 0 4px; border-radius: 3px; background: var(--cc); color: #fff; }
.c-name { position: absolute; top: 77px; left: 0; right: 0; text-align: center; font-family: var(--f-title); font-weight: 900; font-size: 14px; letter-spacing: .04em; color: var(--ink-c); }
.c-name i { font-style: normal; color: #c98a00; }
.c-meta { position: absolute; top: 96px; left: 4px; right: 4px; display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; }
.c-tag, .c-wish { font-size: 10px; padding: 0 3px; border-radius: 3px; background: rgba(0, 0, 0, .08); display: inline-flex; align-items: center; }
.el-邪 .c-tag { background: rgba(255, 255, 255, .08); }
.c-wish { background: #2fa37a; color: #fff; }
.c-wish .ico { width: 1em; height: 1em; }
.c-tag .ico { width: .95em; height: .95em; }
.c-desc { position: absolute; top: 112px; left: 6px; right: 6px; bottom: 5px; text-align: center; font-size: 11.5px; line-height: 1.32; overflow: hidden; }
.card.dl .c-desc { font-size: 10.8px; line-height: 1.26; }
.card.dxl .c-desc { font-size: 10px; line-height: 1.2; top: 110px; }
.c-desc b { color: var(--ink-c); font-size: 1.12em; }
.c-desc b.vup { color: #0d8a3e; } .c-desc b.vdown { color: #c2185b; } .c-desc b.vupg { color: #b07a00; }
.el-邪 .c-desc b.vup { color: #6dffb0; }
.c-kw { display: block; font-size: .92em; color: #7a5a2a; }
.kw { border-bottom: 1px dotted currentColor; }
.c-lock { position: absolute; left: 0; right: 0; top: 46%; text-align: center; background: rgba(215, 38, 61, .9); color: #fff; font-size: 11px; padding: 2px 0; transform: rotate(-8deg); z-index: 3; }
.card.locked { filter: saturate(.6); }
.card.unknown .c-paper { background: #2a2438; border-color: #4a4060; }
.card.unknown .c-name { color: #6a5f80; top: 45%; }

/* ============================================================
   HUD
   ============================================================ */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 8; display: flex; align-items: center; gap: 12px; padding: calc(7px + var(--sat)) 12px 7px; background: linear-gradient(rgba(10, 7, 20, .92), rgba(10, 7, 20, .55) 80%, transparent); pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-l { display: flex; align-items: center; gap: 12px; }
.h-case { display: flex; flex-direction: column; line-height: 1.1; padding: 2px 10px; border-left: 3px solid var(--npink); }
.h-case b { font-family: var(--f-title); font-size: 15px; } .h-case small { color: var(--muted); font-size: 12px; }
.h-hp { position: relative; width: 170px; height: 22px; border-radius: 11px; background: #2a1520; border: 1px solid #ff8a65; overflow: hidden; display: flex; align-items: center; }
.h-hp > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ff6a3d, #ffb347); box-shadow: 0 0 10px #ff6a3d; transition: width .3s; }
.h-hp .ico { position: relative; z-index: 1; margin-left: 5px; color: #fff; }
.h-hp span { position: relative; z-index: 1; margin-left: auto; margin-right: 8px; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px #000; }
.h-gold { display: flex; align-items: center; gap: 3px; color: var(--nyel); font-weight: 700; }
.hud-m { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.items { display: flex; gap: 5px; }
.item { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--gold); background: radial-gradient(circle at 35% 30%, #4a3a1a, #1d160a); display: grid; place-items: center; font-family: var(--f-title); font-weight: 900; font-size: 14px; color: var(--nyel); cursor: pointer; }
.item.empty { border-style: dashed; border-color: rgba(242, 193, 78, .3); background: transparent; cursor: default; }
.relics { display: flex; gap: 4px; flex-wrap: wrap; overflow: hidden; max-height: 32px; }
.relic { width: 28px; height: 28px; border-radius: 6px; border: 1.5px solid var(--gold); background: linear-gradient(135deg, #3b2b12, #1e1508); display: grid; place-items: center; font-family: var(--f-title); font-weight: 900; font-size: 14px; color: var(--gold); }
.relic.rr-奇 { border-color: var(--ncyan); color: var(--ncyan); } .relic.rr-絕 { border-color: var(--npink); color: var(--npink); } .relic.rr-邪 { border-color: #ff2e54; color: #ff2e54; background: #1a0508; }
.hud-r { display: flex; gap: 6px; }
.hbtn { min-width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: rgba(30, 22, 48, .85); display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 18px; padding: 0 8px; }
.hbtn small { font-size: 12px; }

/* ============================================================
   戰鬥
   ============================================================ */
.combat { position: absolute; inset: 0; display: flex; flex-direction: column; }
.stage { position: relative; flex: 1; min-height: 0; }
.c-top { position: absolute; top: 48px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 3; pointer-events: none; }
.c-title { font-family: var(--f-title); font-size: 15px; letter-spacing: .3em; color: var(--muted); }
.bossfight .c-title { color: var(--npink); text-shadow: 0 0 10px rgba(255, 61, 139, .6); }
.taboo { pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 20px; background: rgba(60, 5, 20, .82); border: 1px solid #ff4d6d; color: #ffd2da; font-size: 13px; box-shadow: 0 0 16px rgba(255, 45, 85, .35); max-width: 92vw; }
.taboo b { color: #fff; font-family: var(--f-title); letter-spacing: .1em; }
.taboo span { color: #ffb3c1; }
.taboo.flash { animation: flashred .9s; }
@keyframes flashred { 0%, 100% { box-shadow: 0 0 16px rgba(255, 45, 85, .35); } 30% { box-shadow: 0 0 40px #ff2e54; background: #7a0f2e; } }
.pside { position: absolute; left: 3%; bottom: 6px; width: 24%; display: flex; flex-direction: column; align-items: center; z-index: 2; }
.pl { position: relative; display: flex; flex-direction: column; align-items: center; }
.pl-fig { width: 150px; height: 240px; }
.pl-fig svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)); }
.pl.hit .pl-fig { animation: hitshake .38s; }
.pl.lunge .pl-fig { animation: plunge .38s; }
@keyframes plunge { 40% { transform: translateX(26px) rotate(3deg); } }
@keyframes hitshake { 20% { transform: translateX(-8px); filter: brightness(2) saturate(.3); } 50% { transform: translateX(6px); } }
.pl-bar { width: 190px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.fires { display: flex; gap: 10px; }
.fires i { width: 14px; height: 20px; border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #fff6b0, #ffb347 40%, #ff5a2a 75%); box-shadow: 0 0 10px #ff7a3a, 0 0 22px rgba(255, 110, 50, .5); animation: flick 1.2s infinite alternate; transform-origin: 50% 100%; }
.fires i:nth-child(2) { animation-delay: .3s; transform: scale(1.2); } .fires i:nth-child(3) { animation-delay: .6s; }
.fires i.out { background: #3a2a2a; box-shadow: none; animation: none; opacity: .5; }
@keyframes flick { to { transform: scaleY(1.12) scaleX(.92); } }
.hpbar { position: relative; width: 100%; height: 16px; border-radius: 8px; background: rgba(40, 15, 20, .9); border: 1px solid rgba(255, 140, 90, .6); overflow: hidden; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ff5a2a, #ffb347); transition: width .3s; }
.hpbar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; }
.hpbar em { position: absolute; left: -6px; top: -5px; font-style: normal; font-size: 12px; font-weight: 900; color: #fff; background: #3a6ea5; border: 1.5px solid #9fd4ff; border-radius: 6px; padding: 0 5px; opacity: 0; transform: scale(.6); transition: .2s; z-index: 2; }
.hpbar em.on { opacity: 1; transform: scale(1); }
.pl.low .hpbar { box-shadow: 0 0 12px #ff2e54; }
.sts { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 18px; }
.stc { font-size: 11px; padding: 0 5px; border-radius: 4px; background: rgba(40, 90, 60, .85); border: 1px solid #5fe3a1; }
.stc b { margin-left: 2px; }
.stc.bad { background: rgba(110, 20, 40, .85); border-color: #ff6b81; }
.stc.pw { background: rgba(60, 50, 120, .85); border-color: #a99bff; }
.comps { display: flex; gap: 6px; margin-top: 6px; }
.comp { position: relative; width: 58px; height: 64px; border-radius: 10px; border: 1.5px solid color-mix(in srgb, var(--cc) 70%, #fff); background: linear-gradient(rgba(30, 22, 48, .9), rgba(15, 10, 25, .95)); padding: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
.comp .cfig { width: 44px; height: 50px; overflow: hidden; display: block; }
.comp .cfig svg { width: 44px; height: 70px; }
.comp .pips { display: flex; gap: 2px; position: absolute; bottom: 3px; }
.comp .pips i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .18); }
.comp .pips i.on { background: var(--cc); box-shadow: 0 0 5px var(--cc); }
.comp.ready { box-shadow: 0 0 0 2px var(--cc), 0 0 18px var(--cc); animation: breathe 1.4s infinite; }
.comp .cr { position: absolute; top: 2px; right: 3px; font-family: var(--f-title); font-weight: 900; font-size: 14px; color: #fff; text-shadow: 0 0 6px var(--cc); }
@keyframes breathe { 50% { transform: translateY(-2px); } }

.eside { position: absolute; right: 2%; left: 28%; top: 96px; bottom: 6px; display: flex; justify-content: center; align-items: flex-end; gap: 1.5%; z-index: 2; }
.en { position: relative; flex: 0 1 220px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform .2s, filter .2s; }
.en-fig { width: calc(150px * var(--sc, 1)); height: calc(240px * var(--sc, 1)); max-height: 38vh; position: relative; }
.en-fig svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .6)); }
.en.st-mad .en-fig svg { filter: drop-shadow(0 0 14px rgba(255, 40, 70, .75)) drop-shadow(0 8px 18px rgba(0, 0, 0, .6)); }
.en.st-calm .en-fig svg { filter: drop-shadow(0 0 14px rgba(34, 229, 255, .6)) drop-shadow(0 8px 18px rgba(0, 0, 0, .6)); }
.en-name { font-family: var(--f-title); font-weight: 700; font-size: 15px; text-align: center; line-height: 1.15; text-shadow: 0 2px 4px #000; margin-top: -4px; }
.en-name small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.en-name .kind { display: inline-block; margin-left: 4px; font-size: 10px; padding: 0 4px; border-radius: 3px; background: rgba(34, 229, 255, .18); color: #9ff2ff; vertical-align: 2px; }
.en.spirit .en-name .kind { background: rgba(255, 255, 255, .12); color: #ddd; }
.bars { width: min(190px, 100%); display: flex; flex-direction: column; gap: 3px; margin-top: 3px; }
.bar { position: relative; height: 15px; border-radius: 8px; background: rgba(20, 10, 22, .92); overflow: hidden; border: 1px solid rgba(255, 255, 255, .15); display: flex; align-items: center; }
.bar label { position: relative; z-index: 2; font-size: 10px; font-weight: 900; width: 26px; text-align: center; color: #fff; text-shadow: 0 1px 2px #000; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .35s; }
.bar span { position: relative; z-index: 2; margin-left: auto; margin-right: 6px; font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px #000; }
.yuanbar i { background: linear-gradient(90deg, #8a0f24, var(--yuan)); }
.yuanbar.mad i { background: linear-gradient(90deg, #b3002a, #ff2e54); box-shadow: 0 0 10px #ff2e54; }
.yuanbar.calm i { background: linear-gradient(90deg, #5a1a3a, #c74a6a); }
.yuanbar em { position: absolute; right: -2px; top: -1px; z-index: 3; font-style: normal; font-size: 10px; font-weight: 900; background: #6b3aa5; border: 1px solid #d4b8ff; border-radius: 5px; padding: 0 4px; opacity: 0; }
.yuanbar em.on { opacity: 1; }
.dubar { border-color: rgba(34, 229, 255, .35); }
.dubar i { background: linear-gradient(90deg, #0b5f78, var(--du)); box-shadow: 0 0 8px var(--du); }
.dubar.near { box-shadow: 0 0 12px var(--du); }
.state { margin-top: 3px; }
.stt { display: inline-block; font-family: var(--f-title); font-weight: 900; font-size: 13px; padding: 0 10px; border-radius: 10px; letter-spacing: .2em; }
.stt.s-狂 { background: #6b0a1f; color: #ffc2cf; box-shadow: 0 0 10px #ff2e54; }
.stt.s-怨 { background: #3a2a44; color: #e0cfe8; }
.stt.s-靜 { background: #0b4a5a; color: #bff6ff; box-shadow: 0 0 10px var(--du); }
.wishes { display: flex; gap: 4px; margin-top: 3px; justify-content: center; flex-wrap: wrap; }
.wish { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px dashed rgba(47, 163, 122, .7); color: #9be8c5; min-width: 22px; text-align: center; }
.wish.on { border-style: solid; background: #1c6b4f; color: #fff; display: inline-flex; align-items: center; }

/* ---------- 手牌區 ---------- */

.splash { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle, rgba(60, 30, 5, .75), rgba(5, 2, 10, .85)); animation: fadein .25s; z-index: 35; }

/* ============================================================
   劇情
   ============================================================ */

.lg-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }

.pc-inner { position: relative; width: min(420px, 90vw); padding: 26px 26px 20px; border-radius: 12px; background: linear-gradient(#f7efdf, #e9dcc0); color: #2a1a12; box-shadow: 0 0 0 3px #7a1020, 0 20px 60px rgba(0, 0, 0, .7); text-align: center; transform: scale(.9); transition: transform .3s; }

function applySave(obj) {
  if (!obj || !obj.meta) return false;
  G.meta = mergeMeta(obj.meta);
  G.run = obj.run || null;
  G.savedAt = obj.savedAt || 0;
  return true;
}
let _saveTimer = null;
function saveGame(immediate) {
  if (G.noSave) return;
  const pack = packSave();
  G.savedAt = pack.savedAt;
  LS.set(SAVE_KEY, JSON.stringify(pack));
  if (G.cloud.ready) {
    G.cloud.pending = true;
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(cloudFlush, immediate ? 60 : 1500);
  }
}
function loadLocal() {
  const s = LS.get(SAVE_KEY);
  if (!s) return null;
  try { return JSON.parse(s); } catch (e) { return null; }
}
/* 雲端同步（artifact db capability；每位玩家私有的一份文件） */
async function cloudInit(onNewer) {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') { G.cloud.status = 'local'; return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) { G.cloud.status = 'local'; return; }
    const id = await user.id();
    if (!id) { G.cloud.status = 'local'; return; }
    G.cloud.db = db; G.cloud.uid = id;
    const snap = await db.doc('data/users/' + id + '/save').get();
    G.cloud.ready = true; G.cloud.status = 'cloud';
    if (snap.exists) {
      let obj = null;
      try { obj = JSON.parse(snap.data().payload); } catch (e) { obj = null; }
      if (obj && obj.savedAt > (G.savedAt || 0) + 2000) onNewer && onNewer(obj);
      else if ((G.savedAt || 0) > ((obj && obj.savedAt) || 0)) saveGame(true);
    } else saveGame(true);
  } catch (e) { G.cloud.status = 'local'; }
  HHZ.onCloud && HHZ.onCloud();
}
/* 雲端文件上限 256KB：太大時先丟「看過的劇情」紀錄，再只留最近兩個回溯點（本機存檔保持完整） */
function cloudPayload(pack) {
  const bytes = str => { try { return new TextEncoder().encode(str).length; } catch (e) { return str.length * 3; } };
  const LIM = 240000;
  let s = JSON.stringify(pack);
  if (bytes(s) * 1.1 < LIM) return s;
  const meta = Object.assign({}, pack.meta, { seenScenes: {} });
  s = JSON.stringify(Object.assign({}, pack, { meta }));
  if (bytes(s) * 1.1 < LIM) return s;
  const ids = Object.keys(meta.snaps || {}), keep = {};
  for (const id of ids.slice(-2)) keep[id] = meta.snaps[id];
  meta.snaps = keep;
  return JSON.stringify(Object.assign({}, pack, { meta }));
}
async function cloudFlush() {
  if (!G.cloud.ready || G.cloud.writing || !G.cloud.pending) return;
  G.cloud.writing = true; G.cloud.pending = false;
  try {
    const pack = packSave();
    await G.cloud.db.doc('data/users/' + G.cloud.uid + '/save').set({ savedAt: pack.savedAt, v: VERSION, payload: cloudPayload(pack) });
    G.cloud.status = 'cloud';
  } catch (e) {
    G.cloud.status = e && e.code === 'invalid_argument' ? 'local' : 'cloud-error';
    if (e && e.code === 'invalid_argument') G.cloud.ready = false;
  }
  G.cloud.writing = false;
  if (G.cloud.pending) setTimeout(cloudFlush, 1200);
  HHZ.onCloud && HHZ.onCloud();
}
function exportCode() {
  const json = JSON.stringify(packSave());
  return 'HHZ1:' + btoa(unescape(encodeURIComponent(json)));
}
function importCode(code) {
  code = String(code || '').trim();
  if (!code.startsWith('HHZ1:')) return false;
  try {
    const obj = JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));
    if (!obj.meta) return false;
    applySave(obj); saveGame(true);
    return true;
  } catch (e) { return false; }
}

/* ---------- campaign helpers ---------- */
function flag(k, v) { if (v === undefined) return CM().flags[k]; CM().flags[k] = v; }
/* 紙紮玉女的稱呼：取名前「玉女」→ 第二案美鳳取名後「紙妹」→ 第七案開光後「阿桂」 */
function zmNamed() { const c = CM(); return !!(c && (c.flags.zm_named || (c.done && c.done.c2))); }
function zmName() { return flag('agui_voice') ? '阿桂' : zmNamed() ? '紙妹' : '玉女'; }
function zmFix(s) { return (s == null || zmNamed()) ? s : String(s).replace(/紙妹/g, '玉女'); }
const hasTruth = id => !!CM().truths[id];
const hasName = id => !!CM().names[id];
const compOn = id => !!CM().comps[id];
const caseNo = id => +String(id || 'c0').slice(1);
function markSeen(kind, id) {
  const m = G.meta.codex[kind];
  if (m && !m[id]) m[id] = 1;
}
function diff() { return G.meta.settings.diff == null ? 1 : G.meta.settings.diff; }

/* ============================================================
   獎勵池
   ============================================================ */
function forbCards() { const out = []; for (const k in CM().forbidden) { const f = FORBIDDEN[k]; if (f && f.cards) out.push(...f.cards); } return out; }
function forbRelics() { const out = []; for (const k in CM().forbidden) { const f = FORBIDDEN[k]; if (f && f.relics) out.push(...f.relics); } return out; }
function cardPool(opts = {}) {
  const fc = new Set(forbCards());
  return Object.values(CARDS).filter(d => {
    if (['常', '奇', '絕'].includes(d.rar)) return true;
    if (d.rar === '邪') return fc.has(d.id);
    if (d.rar === '伴') {
      if (['agui_voice', 'longge_sword'].includes(d.id)) return false;
      if (d.id === 'agui_crane') return !!flag('agui_voice');
      return !!(d.owner && compOn(d.owner));
    }
    return false;
  });
}
function relicPool() {
  const fr = new Set(forbRelics());
  return Object.values(RELICS).filter(r => (!r.forb || fr.has(r.id)) && !(G.run && G.run.relics.includes(r.id)));
}
function rollCards(rng, n, tier = 'normal') {
  const pool = cardPool();
  const W = tier === 'elite' ? { '常': 40, '奇': 42, '絕': 18, '邪': 22, '伴': 22 } : tier === 'shop' ? { '常': 50, '奇': 36, '絕': 14, '邪': 20, '伴': 18 } : { '常': 60, '奇': 30, '絕': 8, '邪': 16, '伴': 18 };
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    const rar = rng.weighted(Object.entries(W).filter(([r]) => pool.some(d => d.rar === r)));
    const cands = pool.filter(d => d.rar === rar && !out.includes(d.id));
    if (!cands.length) continue;
    out.push(rng.pick(cands).id);
  }
  return out;
}

function hasRelic(id) { return !!(G.run && !G.cb?.sandbox && G.run.relics.includes(id)); }
function hasBless(id) { return !!(CM().blessings[id]) && !(G.cb && G.cb.sandbox); }
function alive() { return G.cb ? G.cb.enemies.filter(e => !e.done && !e.gone) : []; }
function stateOf(e) {
  if (!e) return '怨';
  const r = e.yuan / e.yuanMax;
  if (r > 0.66) return '狂';
  if (r < 0.33) return '靜';
  return '怨';
}
function stateLabel(e, s) {
  const L = ENEMIES[e.id].labels || {};
  if (s === '狂') return L.stMad || '狂';
  if (s === '靜') return L.stCalm || '靜';
  return '怨';
}
const DIFF_HP = [0.82, 1, 1.15], DIFF_DMG = [0.75, 1, 1.18], DIFF_DU = [0.85, 1, 1.1];

/* ---------- status helpers ---------- */
function addSt(t, st, n) {
  if (!t) return 0;
  t.st[st] = (t.st[st] || 0) + n;
  if (t.st[st] <= 0) delete t.st[st];
  return n;
}

/* ---------- damage math ---------- */
function enemyDmg(e, base) {
  let d = base * (e.dmgMul || 1) + (e.st['厲'] || 0);
  const s = stateOf(e);
  if (s === '狂') d *= 1.25; else if (s === '靜') d *= 0.75;
  if ((e.st['怯'] || 0) > 0) d *= 0.75;
  return Math.max(0, Math.floor(d));
}
function getIntent(e) {
  const d = ENEMIES[e.id];
  const mv = d.moves[e.move];
  if (!mv) return { t: 'unk' };
  return typeof mv.intent === 'function' ? mv.intent(e, E) : mv.intent;
}
function zhanPreview(base, card) {
  const cb = G.cb;
  if (!cb) return base;
  const p = cb.p;
  let d = base + (p.st['陽氣'] || 0) + (cb.turnStat ? cb.turnStat.zhanBonus : 0);
  if (card && cb.taboo === 'blood' && cardTags(card).includes('劍')) d *= 1.5;
  if ((p.st['虛'] || 0) > 0) d *= 0.75;
  return Math.max(0, Math.floor(d));
}
function gongPreview(base, card) {
  const cb = G.cb;
  if (!cb) return base;
  let o = base + (cb.p.st['誠心'] || 0);
  if (card && hasRelic('zhizhaxiang') && cardTags(card).includes('紙')) o += 2;
  if (card && cb.p.powers.kaitan && !cb.turnStat.yinPlayed && cardEl(card) === '陰') o += cb.p.powers.kaitan;
  return o;
}

/* ============================================================
   B — 玩家這邊的 API（牌、供品、夥伴、神明用）
   ============================================================ */
const B = {
  get cb() { return G.cb; },

  stateOf,
  float: (t, s, c) => UIC.float(t, s, c),
  sfx: n => SND.play(n),
  render: () => UIC.render(),

  async zhan(t, n, o = {}) {
    const cb = G.cb, p = cb.p;
    if (!t || t.done || cb.over) return 0;
    const E0 = ENEMIES[t.id];
    if (E0.noZhan) { await UIC.float(t, '這是孩子的魂，不能斬', 'resist'); return 0; }
    let d = n;
    const card = B.cur && B.cur.card;
    if (!o.raw) {
      d += (p.st['陽氣'] || 0) + cb.turnStat.zhanBonus;
      if (B.cur && B.cur.firstYang) { d += 8; B.cur.firstYang = false; }
      if (card && cb.taboo === 'blood' && cardTags(card).includes('劍')) d *= 1.5;
      if (card && E0.weakFire && cardTags(card).includes('火')) d *= 2;
      if (t.spirit && hasRelic('taomu_r')) d *= 1.5;
      if ((p.st['虛'] || 0) > 0) d *= 0.75;
      if ((t.st['破'] || 0) > 0) d *= 1.5;
    }
    d = Math.max(0, Math.floor(d));
    let blocked = 0;
    if (!o.bite) { blocked = Math.min(t.block, d); t.block -= blocked; d -= blocked; }
    const before = t.yuan;
    t.yuan -= d;
    if (o.safe || E0.noScatter) t.yuan = Math.max(1, t.yuan);
    const dealt = before - t.yuan;
    if (!o.quick) await UIC.strike(t, o.hit || 0);
    await UIC.hitEnemy(t, dealt, blocked, o);
    await afterYuanChange(t);
    if (t.yuan <= 0) await resolveEnemy(t, 'san', { bite: o.bite });
    return dealt;
  },
  async zhanAll(n, o = {}) {
    await UIC.sweep(o.fx);
    for (const e of alive().slice()) await B.zhan(e, n, Object.assign({}, o, { quick: true }));
  },
  async an(t, n) {
    const cb = G.cb;
    if (!t || t.done || cb.over) return 0;
    let a = n;
    const blocked = Math.min(t.block, a); t.block -= blocked; a -= blocked;
    const before = t.yuan;
    t.yuan = Math.max(1, t.yuan - a);
    const dealt = before - t.yuan;
    await UIC.calmEnemy(t, dealt, blocked);
    await afterYuanChange(t);
    return dealt;
  },
  async anAll(n) { for (const e of alive().slice()) await B.an(e, n); },
  async gong(t, n, o = {}) {
    const cb = G.cb;
    if (!t || t.done || cb.over) return 0;
    const card = o.card || null;
    let wish = o.wish || (card ? cardWish(card) : null);
    // 餓鬼搶食
    if (wish === '食' && !o.all && !ENEMIES[t.id].grabFood) {
      const g = alive().find(x => ENEMIES[x.id].grabFood && x !== t);
      if (g) { await UIC.float(g, '搶食！', 'debuff'); t = g; }
    }
    if (!t.duMax) { await UIC.float(t, '精怪沒有魂可渡', 'resist'); return 0; }
    let v = n, mult = 1, matched = false;
    if (!o.raw) {
      v += (cb.p.st['誠心'] || 0);
      if (card && hasRelic('zhizhaxiang') && cardTags(card).includes('紙')) v += 2;
      if (card && cardEl(card) === '陰' && cb.p.powers.kaitan && !cb.turnStat.yinBonusUsed) { v += cb.p.powers.kaitan; cb.turnStat.yinBonusUsed = true; }
      const s = stateOf(t);
      mult *= s === '狂' ? 0.5 : s === '靜' ? 1.5 : 1;
      if (wish && t.wishes.includes(wish)) {
        matched = true;
        mult *= (wish === '人' && (hasRelic('yuelao') || hasBless('b_love'))) ? 3 : 2;
        if (!t.known[wish]) { t.known[wish] = 1; await UIC.wishReveal(t, wish, true); }
        if ((t.st['執念'] || 0) > 0) { t.st['執念'] = Math.floor(t.st['執念'] / 2); if (!t.st['執念']) delete t.st['執念']; }
      }
      if ((t.st['聽'] || 0) > 0) { mult *= 1.5; addSt(t, '聽', -1); }
    }
    const amt = Math.max(0, Math.round(v * mult));
    t.du = Math.min(t.duMax, t.du + amt);
    await UIC.offerEnemy(t, amt, { matched, mult });
    if (!o.raw && cb.taboo === 'family' && ENEMIES[t.id].family && !cb.turnStat.familyPaid) { cb.turnStat.familyPaid = true; await backlash('法師不渡自家人'); }
    await afterDuChange(t);
    if (t.du >= t.duMax && !t.done) await resolveEnemy(t, 'du');
    return amt;
  },
  async gongAll(n, o = {}) { const oo = Object.assign({}, o, { all: true }); for (const e of alive().slice()) if (e.duMax) await B.gong(e, n, oo); else await UIC.float(e, '無魂', 'resist'); },
  block(n, o = {}) {
    const p = G.cb.p;
    let v = n;
    if (!o.raw && (p.st['寒'] || 0) > 0) v = Math.floor(v * 0.7);
    v = Math.max(0, v);
    p.block += v;
    UIC.float(p, '護身 +' + v, 'block');
    return v;
  },
  async draw(n) { return drawCards(n); },
  energy(n) { G.cb.p.energy += n; UIC.float(G.cb.p, '+' + n + ' 香', 'energy'); },
  nextEnergy(n) { G.cb.p.nextEnergy += n; UIC.float(G.cb.p, '下回合 +' + n + ' 香', 'energy'); },
  heal(n) {
    const p = G.cb.p;

    p.hp += v; UIC.float(p, '+' + v + ' 陽火', 'heal');
  },
  async loseHp(n, why) { return playerLoseHp(n, { why }); },
  apply(t, st, n) {
    if (!t || t.done) return 0;
    if (t.isPlayer) return B.selfApply(st, n);
    addSt(t, st, n);
    UIC.float(t, st + ' ' + n, STATUS[st] && STATUS[st].good ? 'buff' : 'debuff');
    return n;
  },
  selfApply(st, n) { addSt(G.cb.p, st, n); UIC.float(G.cb.p, st + (n > 0 ? ' +' : ' ') + n, STATUS[st] && STATUS[st].good ? 'buff' : 'debuff'); return n; },
  cleanse(k = 1) {

  purgeCurses() {

    for (const c of cur) { cb.hand.splice(cb.hand.indexOf(c), 1); cb.exhaust.push(c); }

  addCard(id, where = 'hand', o = {}) {

    else cb[where].push(c);
    UIC.cardAdded(c, where);

  },

  fixJiao(r) { G.cb.jiao.fixed = r; UIC.float(G.cb.p, '下一筊：' + JIAO_NAME[r], 'buff'); UIC.render(); },
  gold(n) { G.cb.bonusGold += n; },

const POWER_NAME = { shoutan: '守壇', wuying: '五營兵將', kaitan: '開壇', qingshen: '請神', lianjiao: '連筊', yangxiaogui: '養小鬼' };
const POWER_DESC = {
  shoutan: n => `每回合開始護身 ${n}。`, wuying: n => `每回合結束，隨機一個敵人斬 ${n}。`, kaitan: n => `每回合第一張陰牌，供 +${n}。`,
  qingshen: n => `每擲出一次聖筊，所有敵人供 ${n}。`, lianjiao: n => `每擲出一次聖筊，護身 ${n}。`, yangxiaogui: n => `每回合結束，隨機一個敵人斬 ${n}，你失去 1 陽火。`,
};
const JIAO_NAME = { sheng: '聖筊', xiao: '笑筊', yin: '陰筊' };

/* ============================================================
   E — 敵人這邊的 API
   ============================================================ */
const E = {
  get cb() { return G.cb; },
  get p() { return G.cb.p; },
  get rng() { return G.cb.rng; },
  get turn() { return G.cb.turn; },
  all: alive,
  async attack(e, d, n = 1) { let tot = 0; for (let i = 0; i < n; i++) { if (G.cb.over || e.done) break; tot += await enemyHit(e, d, i, n); } return tot; },
  async hits(e, arr) { let tot = 0; for (let i = 0; i < arr.length; i++) { if (G.cb.over || e.done) break; tot += await enemyHit(e, arr[i], i, arr.length); } return tot; },
  gainBlock(e, n) { e.block += n; UIC.float(e, '護怨 +' + n, 'block'); },
  blockAll(n) { for (const x of alive()) E.gainBlock(x, n); },
  heal(e, n) { const v = Math.min(n, e.yuanMax - e.yuan); e.yuan += v; UIC.float(e, '怨 +' + v, 'rage'); afterYuanChange(e); },
  buff(e, st, n) { addSt(e, st, n); UIC.float(e, st + ' +' + n, 'debuff'); },
  debuff(st, n) { const p = G.cb.p; addSt(p, st, n); p.fresh[st] = (p.fresh[st] || 0) + n; UIC.float(p, st + ' ' + n, 'debuff'); },
  curse(id, where = 'discard') { B.addCard(id, where); },
  async summon(id) {
    const cb = G.cb;
    if (alive().length >= 4) return null;
    const e = mkEnemy(id, cb);
    cb.enemies.push(e);
    chooseMove(e);
    markSeen('enemies', id);
    const d = ENEMIES[id];
    if (d.onStart) await d.onStart(E, e);
    await UIC.summon(e);
    return e;
  },
  lockCard(n = 1) {
    const cb = G.cb;
    const cands = cb.hand.filter(c => !c.locked && !cflag(c, 'unplay'));
    for (let i = 0; i < n && cands.length; i++) { const c = cands.splice(Math.floor(cb.rng.next() * cands.length), 1)[0]; c.locked = true; }
    UIC.float(cb.p, '紅線纏住了牌', 'debuff');
    UIC.render();
  },
  stealGold(e, n) { if (!G.run || G.cb.sandbox) return 0; const g = Math.min(G.run.gold, n); G.run.gold -= g; e.mem.stolen = (e.mem.stolen || 0) + g; if (g) UIC.float(e, '拿走 ' + g + ' 香油錢', 'gold'); return g; },
  giveGold(n) { G.cb.bonusGold += n; UIC.float(G.cb.p, '+' + n + ' 香油錢', 'gold'); },
  exhaustRandom() {
    const cb = G.cb;
    const cands = cb.hand.filter(c => !['sha', 'jing'].includes(c.id));
    if (!cands.length) return;
    const c = cb.rng.pick(cands);
    cb.hand.splice(cb.hand.indexOf(c), 1); cb.exhaust.push(c);
    UIC.float(cb.p, '「' + cdef(c).name + '」被收走了', 'debuff');
    UIC.render();
  },
  drainComp(id) { const cp = G.cb.comps.find(c => c.id === id); if (cp && cp.charge) { cp.charge = 0; UIC.float(G.cb.p, compDef(id).name + '被鎖住了', 'debuff'); UIC.render(); } },
  say(e, txt) { UIC.say(e, txt); },
  async banner(t) { await UIC.banner(t); },
  pickW(e, weights, o = {}) {
    const maxRep = o.maxRepeat || 2, noRep = o.noRepeat || [];
    const h = e.hist;
    let w = weights.filter(([m, wt]) => wt > 0 && !(noRep.includes(m) && h[h.length - 1] === m) && !(h.length >= maxRep && h.slice(-maxRep).every(x => x === m)));
    if (!w.length) w = weights.filter(([, wt]) => wt > 0);
    return G.cb.rng.weighted(w);
  },
};

/* ============================================================
   建立戰鬥
   ============================================================ */
function mkEnemy(id, cb) {
  const d = ENEMIES[id];
  const n = cb.caseN || 1;
  const dh = DIFF_HP[diff()] ?? 1, dd = DIFF_DMG[diff()] ?? 1, du = DIFF_DU[diff()] ?? 1;
  let hp = cb.rng.int(d.yuan[0], d.yuan[1]);
  let duMax = d.spirit ? 0 : (d.du || 0);
  if (d.scaleCase) { hp *= CASE_HP[n] || 1; duMax *= CASE_HP[n] || 1; }
  const faces = d.kengdi ? Math.min(20, CM().sanSouls || 0) : 0;
  if (d.kengdi) {
    const big = cb.kind === 'boss';
    hp = (big ? 100 : 40) + faces * (big ? 5 : 4);
    duMax = (big ? 80 : 30) + faces * (big ? 4 : 3);
  }
  hp = Math.round(hp * (cb.sandbox ? 1 : dh));
  duMax = Math.round(duMax * (cb.sandbox ? 1 : du));
  let wishes = d.wishes || [];
  if (typeof wishes === 'string' && wishes.startsWith('rand:')) wishes = [cb.rng.pick(wishes.slice(5).split(','))];
  const e = {
    uid: uid(), id, name: d.name, title: d.title || '', yuan: hp, yuanMax: hp, du: 0, duMax, block: 0, st: {}, mem: { faces }, move: null,
    done: null, gone: false, boss: !!d.boss, elite: !!d.elite, spirit: !!d.spirit, miner: d.miner || null, wishes: wishes.slice(), known: {},
    hist: [], turns: 0, forceNext: null, dmgMul: (d.scaleCase ? (CASE_DMG[n] || 1) : 1) * (cb.sandbox ? 1 : dd),
  };
  if (cb.revealAll) for (const w of e.wishes) e.known[w] = 1;
  return e;
}
function chooseMove(e) {
  const d = ENEMIES[e.id];
  let m;
  if (e.forceNext) { m = e.forceNext; e.forceNext = null; }
  else if (!e.hist.length && !e.move && d.first) m = d.first;
  else if (d.seq) { m = d.seq[e.mem.seqIdx = ((e.mem.seqIdx ?? -1) + 1) % d.seq.length]; }
  else if (d.ai) m = d.ai(e, E);
  else m = Object.keys(d.moves)[0];
  if (!d.moves[m]) m = Object.keys(d.moves)[0];
  e.move = m;
}

let _combatResolve = null;
async function runCombat(opts) {
  const run = G.run;
  const seed = opts.seed || (run ? (run.combatSeed = ((run.combatSeed || run.seed || 1) + 7919) >>> 0) : newSeed());
  const rng = new RNG(seed);
  const cb = G.cb = {
    rng, kind: opts.kind || 'normal', isBoss: opts.kind === 'boss', isElite: opts.kind === 'elite',
    sandbox: !!opts.sandbox, tutorial: opts.tutorial || null, caseN: opts.caseN != null ? opts.caseN : (run ? caseNo(run.caseId) : 1),
    title: opts.title || '', taboo: opts.taboo || null, bg: opts.bg || null,
    turn: 0, enemies: [], p: null, draw: [], hand: [], discard: [], exhaust: [],
    turnStat: freshTurnStat(), flags: {}, over: false, result: null, phase: 'setup', busy: false,
    jiao: { left: 0, turnResult: null, streak: 0, fixed: null },
    comps: [], bonusGold: 0, outcomes: [], lines: opts.lines || {}, saidLines: {},
    waves: opts.waves ? opts.waves.slice() : null, onResolve: opts.onResolve || null, onWave: opts.onWave || null,
    revealAll: !opts.sandbox && (hasBless('b_wish') || (run && run.relics.includes('mibowl'))),
    stats: { backlash: 0, sheng: 0, sanshen: 0 },
  };
  const deck = opts.deck || run.deck;
  const baseEnergy = 3;
  cb.p = {
    isPlayer: true, name: '魏子葳', uid: 'p',
    hp: opts.hp != null ? opts.hp : run.hp, maxHp: opts.maxHp || run.maxHp,
    block: 0, st: {}, powers: {}, energy: 0, baseEnergy, nextEnergy: 0, nextDraw: 0, mirror: 0, fresh: {},
  };
  cb.draw = rng.shuffle(deck.map(c => ({ uid: uid(), id: c.id, up: c.up })));
  if (opts.stack) { // 教學：把指定的牌放在抽牌堆頂
    for (const w of opts.stack.slice().reverse()) {
      const i = cb.draw.findIndex(c => c.id === w && !c._t);
      if (i >= 0) { const [c] = cb.draw.splice(i, 1); c._t = 1; cb.draw.push(c); }
    }
  }
  // 夥伴
  const comps = opts.comps || (opts.sandbox ? ['agui', 'huye'] : Object.keys(CM().comps).filter(k => CM().comps[k]));
  cb.comps = comps.filter(id => COMPANIONS[id]).map(id => ({ id, charge: 0, need: COMPANIONS[id].need - (id === 'huye' && hasBless('b_huye') ? 1 : 0) }));
  // 敵人
  const first = (opts.enemies && opts.enemies.length) ? opts.enemies : (cb.waves ? cb.waves.shift() : []);
  for (const id of first) { const e = mkEnemy(id, cb); cb.enemies.push(e); markSeen('enemies', id); }
  const boss = cb.enemies.find(e => e.boss);
  if (boss && opts.mods) {
    if (opts.mods.du) boss.du = Math.round(boss.duMax * clamp(opts.mods.du, 0, 90) / 100);
    if (opts.mods.yuan) boss.yuan = boss.yuanMax = Math.round(boss.yuanMax * (1 + opts.mods.yuan / 100));
  }
  if (boss && opts.wishesKnown) for (const w of opts.wishesKnown) if (boss.wishes.includes(w)) boss.known[w] = 1;
  for (const e of cb.enemies) chooseMove(e);

  UIC.mount(opts);
  if (AUTO.on) AUTO.combatStart(cb);
  const done = new Promise(res => { _combatResolve = res; });
  await wait(250);
  for (const e of cb.enemies.slice()) { const d = ENEMIES[e.id]; if (d.onStart) await d.onStart(E, e); }
  if (!cb.sandbox) {
    if (hasRelic('qixingjian_r')) B.selfApply('陽氣', 1);
    if (hasRelic('pinganfu')) B.block(6, { raw: true });
    if (hasBless('b_block')) B.block(4, { raw: true });
    if (hasRelic('longjiao_r')) { SND.play('horn'); await B.anAll(5); }
    if (hasRelic('wuyingqi')) for (let i = 0; i < 3; i++) { const a = alive(); if (a.length) await B.zhan(rng.pick(a), 4, { quick: true, raw: true }); }
    if (hasRelic('zhujian')) cb.draw.push(mkCard('zhihe'));
  }
  if (cb.taboo) await UIC.tabooIntro(cb.taboo);
  const lineE = boss || (cb.isBoss ? cb.enemies[0] : null);
  if (lineE && cb.lines.start) UIC.line(lineE, cb.lines.start);
  if (opts.onStart) await opts.onStart(B);
  UIC.render();
  await playerTurnStart();
  return done;
}
function freshTurnStat() { return { played: 0, yang: 0, yin: 0, zhanBonus: 0, yinBonusUsed: false, yinPlayed: 0, flipYin: false, hurt: 0 }; }

/* ============================================================
   回合
   ============================================================ */
async function playerTurnStart() {
  const cb = G.cb, p = cb.p;
  if (cb.over) return;
  cb.turn++;
  cb.phase = 'player-start';
  p.block = 0; p.mirror = 0;
  cb.turnStat = freshTurnStat();
  cb.jiao.left = 1; cb.jiao.turnResult = null;
  for (const c of cb.hand) c.locked = false;
  UIC.render();
  // 灼
  if ((p.st['灼'] || 0) > 0) { await playerLoseHp(p.st['灼'], { why: '灼' }); if (cb.over) return; addSt(p, '灼', -1); }
  // 香
  p.energy = p.baseEnergy + (p.nextEnergy || 0) - ((p.st['纏'] || 0) > 0 ? 1 : 0);
  p.nextEnergy = 0; delete p.st['纏'];
  if (!cb.sandbox) {
    if (cb.turn === 1 && hasRelic('lingpai')) p.energy += 1;
    if (hasRelic('xianglu') && cb.turn % 3 === 0) { p.energy += 1; UIC.float(p, '香爐 +1 香', 'energy'); }
  }
  // 持續
  if (p.powers.shoutan) B.block(p.powers.shoutan, { raw: true });
  // 抽牌
  let n = 5 + (p.nextDraw || 0) - (p.st['驚'] || 0);
  if (cb.turn === 1 && !cb.sandbox && hasBless('b_draw')) n += 1;
  p.nextDraw = 0; delete p.st['驚'];
  await drawCards(Math.max(1, n));
  if (cb.over) return;
  cb.phase = 'player';
  UIC.render();
  UIC.turnBanner();
  AUTO.onPlayerTurn();
  tutorialHints();
}

async function drawCards(n) {
  const cb = G.cb;
  const got = [];
  for (let i = 0; i < n; i++) {
    if (cb.hand.length >= 10) break;
    if (!cb.draw.length) {
      if (!cb.discard.length) break;
      cb.draw = cb.rng.shuffle(cb.discard);
      cb.discard = [];
      await UIC.reshuffle();
      if (cb.taboo === 'turn' || cb.taboo === 'turn2') { await backlash(TABOOS[cb.taboo].name); if (cb.over) break; }
    }
    const c = cb.draw.pop();
    cb.hand.push(c);
    got.push(c);
  }
  if (got.length) await UIC.drew(got);
  for (const c of got) {
    if (c.id === 'chuangshang') { await playerLoseHp(2, { why: '創傷' }); if (cb.over) break; }
    if (c.id === 'tongji') { const a = alive(); if (a.length) E.buff(cb.rng.pick(a), '厲', 1); }
  }
  return got;
}

function effCost(c) {
  const cb = G.cb;
  let cost = cardCost(c);
  if (cost == null) return null;
  if (cost === 'X') return cb ? cb.p.energy : 0;
  if (c.free) return 0;
  if (cb && (cb.p.st['噤'] || 0) > 0 && cardEl(c) === '陰') cost += 1;
  if (cardEl(c) === '邪' && hasRelic('fuzaixian')) cost -= 1;
  return Math.max(0, cost);
}
function canPlay(c) {
  const cb = G.cb;
  if (!cb || cb.phase !== 'player' || cb.busy || cb.over) return false;
  if (cflag(c, 'unplay') || cardCost(c) == null || c.locked) return false;
  if (cardCost(c) === 'X') return cb.p.energy > 0;
  return effCost(c) <= cb.p.energy;
}
function needsTarget(c) { return cdef(c).tgt === 'enemy'; }

async function playCard(c, target) {
  const cb = G.cb, p = cb.p;
  if (!canPlay(c)) return false;
  const d = cdef(c);
  if (needsTarget(c)) {
    const a = alive();
    if (!target || target.done) target = a.length === 1 ? a[0] : null;
    if (!target) return false;
  } else target = null;
  cb.busy = true;
  const cost = effCost(c);
  if (cardCost(c) === 'X') { B.spentX = p.energy; p.energy = 0; } else { p.energy -= cost; B.spentX = 0; }
  const hi = cb.hand.indexOf(c);
  if (hi >= 0) cb.hand.splice(hi, 1);
  const el = d.el, tags = d.tags || [];
  const firstYang = el === '陽' && !cb.flags.firstYang && hasRelic('tianpengchi');
  if (el === '陽') cb.flags.firstYang = 1;
  B.cur = { card: c, firstYang };
  cb.turnStat.played++;
  await UIC.playFly(c, target);
  // 禁忌
  if (cb.taboo === 'fire' && tags.includes('火')) await backlash('忌火');
  if (cb.taboo === 'blood' && tags.includes('劍')) await backlash('忌見血');
  if (cb.taboo === 'noise' && cb.turnStat.played >= 4) await backlash('忌喧嘩');
  if (cb.over) { cb.busy = false; return true; }
  if (d.fx) await d.fx(B, c, target);
  B.cur = null;
  // 去向
  c.free = false; c.locked = false;
  if (d.power) { /* 持續牌留在場上 */ }
  else if (cflag(c, 'ex')) cb.exhaust.push(c);
  else cb.discard.push(c);
  // 夥伴充能
  if (el === '陽') { cb.turnStat.yang++; charge('yang'); }
  if (el === '陰') { cb.turnStat.yin++; charge('yin'); }
  if (!cb.sandbox && G.run) { G.run.stats.cards = (G.run.stats.cards || 0) + 1; markSeen('cards', d.id); }
  // 法器
  if (el === '陰' && !cb.turnStat.yinPlayed) { cb.turnStat.yinPlayed = 1; if (hasRelic('dizhong_r') && !cb.over) await drawCards(1); }
  if (hasRelic('muyu') && cb.turnStat.played === 3 && !cb.over) await drawCards(1);
  cb.busy = false;
  UIC.render();
  await checkEnd();
  return true;
}
function charge(kind) {
  for (const cp of G.cb.comps) if (COMPANIONS[cp.id].charge === kind) cp.charge = Math.min(cp.need, cp.charge + 1);
}

async function endTurn() {
  const cb = G.cb, p = cb.p;
  if (!cb || cb.phase !== 'player' || cb.busy || cb.over) return;
  cb.busy = true;
  cb.phase = 'end';
  UIC.render();
  for (const c of cb.hand.slice()) {
    if (c.id === 'sha') { await playerLoseHp(2, { why: '煞' }); if (cb.over) return; }
  }
  if (p.powers.wuying) { const a = alive(); if (a.length) { await UIC.banner('五營兵將'); await B.zhan(cb.rng.pick(a), p.powers.wuying, { quick: true }); } }
  if (p.powers.yangxiaogui && !cb.over) { const a = alive(); if (a.length) { await B.zhan(cb.rng.pick(a), p.powers.yangxiaogui, { quick: true }); await playerLoseHp(1, { why: '養小鬼' }); } }
  if (cb.over) return;
  const keep = [];
  for (const c of cb.hand) {
    c.free = false; c.locked = false;
    if (cflag(c, 'eth')) cb.exhaust.push(c);
    else if (cflag(c, 'ret')) keep.push(c);
    else cb.discard.push(c);
  }
  cb.hand = keep;
  await UIC.discardHand();
  for (const st of ['寒', '虛']) { const tot = p.st[st] || 0; if (tot > 0 && tot - (p.fresh[st] || 0) > 0) addSt(p, st, -1); }
  delete p.st['噤'];
  cb.busy = false;
  await checkEnd();
  if (cb.over) return;
  await enemyPhase();
}

async function enemyPhase() {
  const cb = G.cb, p = cb.p;
  if (cb.over) return;
  cb.phase = 'enemy';
  p.fresh = {};
  UIC.render();
  await wait(220);
  for (const e of cb.enemies.slice()) {
    if (cb.over) return;
    if (e.done || e.gone) continue;
    await enemyAct(e);
    await checkEnd();
    if (cb.over) return;
  }
  for (const e of alive()) chooseMove(e);
  if (cb.over) return;
  await playerTurnStart();
}

async function enemyAct(e) {
  const cb = G.cb;
  const d = ENEMIES[e.id];
  e.block = 0;
  UIC.focusEnemy(e);
  // 焚（會打散！）
  if ((e.st['焚'] || 0) > 0) {
    const n = e.st['焚'];
    addSt(e, '焚', -1);
    await UIC.float(e, '焚 ' + n, 'debuff');
    await B.zhan(e, n, { raw: true, quick: true, burn: true });
    if (e.done) return;
  }
  // 執念
  if ((e.st['執念'] || 0) > 0 && e.duMax && e.du > 0) {
    const v = Math.min(e.du, e.st['執念']);
    e.du -= v;
    UIC.float(e, '執念：渡 -' + v, 'rage');
    UIC.render();
  }
  if ((e.st['定'] || 0) > 0) {
    delete e.st['定'];
    await UIC.float(e, '定身', 'debuff');
    await wait(300);
    e.hist.push('_stun'); e.turns++;
    for (const st of ['怯', '破']) if ((e.st[st] || 0) > 0) addSt(e, st, -1);
    return;
  }
  const mv = d.moves[e.move];
  await UIC.enemyMove(e, mv.name);
  await mv.fx(E, e);
  e.hist.push(e.move); e.turns++;
  for (const st of ['怯', '破']) if ((e.st[st] || 0) > 0) addSt(e, st, -1);
  UIC.render();
}

async function enemyHit(e, base, i, n) {
  const cb = G.cb, p = cb.p;
  let dmg = enemyDmg(e, base);
  await UIC.lunge(e, i, n);
  if (hasRelic('bagua_r') && !cb.flags.bagua && dmg > 0) { cb.flags.bagua = 1; dmg = Math.floor(dmg / 2); UIC.float(p, '照妖鏡', 'buff'); }
  const dealt = await damagePlayer(dmg, e);
  if (p.mirror > 0 && !e.done && !cb.over) { await UIC.float(p, '八卦鏡', 'buff'); await B.zhan(e, p.mirror, { raw: true, quick: true }); }
  return dealt;
}
async function damagePlayer(dmg, src) {
  const cb = G.cb, p = cb.p;
  let d = dmg;
  const blocked = Math.min(p.block, d);
  p.block -= blocked;
  d -= blocked;
  if (d > 0) { p.hp -= d; cb.turnStat.hurt += d; charge('hurt'); if (G.run && !cb.sandbox) G.run.stats.dmgTaken = (G.run.stats.dmgTaken || 0) + d; }
  await UIC.hitPlayer(dmg, blocked, d);
  if (p.hp <= 0) await playerDown(src);
  return d;
}
async function playerLoseHp(n, o = {}) {
  const cb = G.cb, p = cb.p;
  if (n <= 0 || cb.over) return;
  p.hp -= n;
  await UIC.hitPlayer(n, 0, n, o.why);
  if (p.hp <= 0) await playerDown(null);
}
async function playerDown(src) {
  const cb = G.cb, p = cb.p;
  if (cb.over) return;
  if (G.run && !cb.sandbox && !G.run.revived && (G.run.relics.includes('huanhunzhi_r') || hasBless('b_revive'))) {
    G.run.revived = true;
    p.hp = Math.max(1, Math.ceil(p.maxHp * 0.3));
    await UIC.revive();
    return;
  }
  p.hp = 0;
  cb.killer = src ? src.id : null;
  await finishCombat(false);
}
async function backlash(why) {
  const cb = G.cb;
  const T = TABOOS[cb.taboo] || { hp: 3 };
  cb.stats.backlash++;

async function afterYuanChange(e) {

async function afterDuChange(e) {

  if (!e || e.done) return;

/* ---------- 送走／打散 ---------- */
async function resolveEnemy(t, how, o = {}) {
  const cb = G.cb;
  if (t.done) return;
  t.done = how;
  if (how === 'san') t.yuan = 0;
  const bite = !!o.bite;
  cb.outcomes.push({ id: t.id, name: t.name, how, spirit: t.spirit, boss: t.boss, elite: t.elite, miner: t.miner, bite });
  if (!cb.sandbox) {
    if (how === 'san' && t.spirit && hasRelic('huyejin')) cb.bonusGold += 5;
    if (how === 'san' && !t.spirit && hasRelic('yangguiguan')) { B.heal(5); B.selfApply('陽氣', 1); }
  }
  await UIC.resolve(t, how);
  if (how === 'san' && !t.boss && cb.taboo === 'kill' && !t.spirit) await backlash('忌殺生');
  if (t.boss && !cb.waves) {
    for (const o2 of alive()) { o2.gone = true; await UIC.vanish(o2); }
  }
  if (cb.onResolve) await cb.onResolve(t, how);
}

async function checkEnd() {
  const cb = G.cb;
  if (cb.over) return;
  if (alive().length) return;
  if (cb.waves && cb.waves.length) {
    const next = cb.waves.shift();
    await wait(300);
    for (const id of next) { const e = mkEnemy(id, cb); cb.enemies.push(e); chooseMove(e); markSeen('enemies', id); const d = ENEMIES[id]; if (d.onStart) await d.onStart(E, e); await UIC.summon(e); }
    if (cb.onWave) await cb.onWave(next);
    UIC.render();
    return;
  }
  await finishCombat(true);
}

async function finishCombat(win) {
  const cb = G.cb;
  if (cb.over) return;
  cb.over = true;
  cb.result = win ? 'win' : 'lose';
  cb.phase = 'over';
  if (G.run && !cb.sandbox) {
    G.run.hp = Math.max(0, Math.min(cb.p.hp, G.run.maxHp));
    if (win) {
      const stolen = cb.enemies.reduce((a, e) => a + (e.done ? (e.mem.stolen || 0) : 0), 0);
      G.run.gold += stolen + cb.bonusGold + (hasRelic('xiangyou') ? 8 : 0);
      if (hasRelic('jingshui')) G.run.hp = Math.min(G.run.maxHp, G.run.hp + 4);
    }
  }
  if (AUTO.on) AUTO.combatEnd(cb, win);
  await UIC.combatOver(win);
  const r = _combatResolve; _combatResolve = null;
  r && r({ win, outcomes: cb.outcomes.slice(), turns: cb.turn, killer: cb.killer, backlash: cb.stats.backlash });
}

   擲筊
   ============================================================ */
function rollJiao(rng) { const x = rng.next(); return x < 0.5 ? 'sheng' : x < 0.75 ? 'xiao' : 'yin'; }
async function throwJiao() {
  const cb = G.cb, p = cb.p;
  if (!cb || cb.phase !== 'player' || cb.busy || cb.over || cb.jiao.left <= 0) return false;
  cb.busy = true;
  cb.jiao.left--;
  let r = cb.jiao.fixed || rollJiao(cb.rng);
  const wasFixed = !!cb.jiao.fixed;
  cb.jiao.fixed = null;
  await UIC.jiao(r);
  if (r === 'yin' && !wasFixed && hasRelic('laojiao') && !cb.flags.laojiao) {
    cb.flags.laojiao = 1;
    await UIC.float(p, '老筊杯：再擲一次', 'buff');
    r = rollJiao(cb.rng);
    await UIC.jiao(r);
  }
  if (r === 'yin' && (cb.turnStat.flipYin || hasRelic('zuobijiao'))) {
    if (hasRelic('zuobijiao') && !cb.turnStat.flipYin) await playerLoseHp(2, { why: '作弊筊' });
    if (cb.over) { cb.busy = false; return true; }
    r = 'sheng';
    await UIC.float(p, '陰筊翻成聖筊', 'buff');
  }
  cb.jiao.turnResult = r;
  charge('jiao');
  if (cb.taboo === 'ask') await backlash('忌問神');
  if (cb.taboo === 'yin' && r === 'yin') await backlash('忌陰筊');
  if (cb.over) { cb.busy = false; return true; }
  if (r === 'sheng') {
    cb.stats.sheng++;
    p.energy += 1;
    UIC.float(p, '聖筊 +1 香', 'energy');
    cb.jiao.streak++;
    if (p.powers.lianjiao) B.block(p.powers.lianjiao, { raw: true });
    if (p.powers.qingshen) await B.gongAll(p.powers.qingshen, { raw: true });
    if (cb.jiao.streak >= 3 && !cb.over) {
      cb.jiao.streak = 0;
      cb.stats.sanshen++;
      const pat = PATRONS[cb.sandbox ? 'linshui' : (CM().patron || 'linshui')] || PATRONS.linshui;
      await UIC.patronSplash(pat);
      await pat.fx(B);
    }
  } else if (r === 'xiao') {
    UIC.float(p, '笑筊：再想想', 'buff');
    await drawCards(1);
  } else {
    cb.jiao.streak = 0;
    B.selfApply('陰氣', 1);
  }
  cb.busy = false;
  UIC.render();
  await checkEnd();
  return true;
}

async function useItem(i, target) {
  const cb = G.cb;
  if (!G.run) return false;
  const id = G.run.items[i];
  if (!id) return false;
  const P = ITEMS[id];
  const inCombat = cb && G.screen === 'combat' && cb.phase === 'player' && !cb.busy && !cb.over;
  if (!inCombat) {
    if (P.outside) { G.run.items.splice(i, 1); G.run.hp = Math.min(G.run.maxHp, G.run.hp + 12); saveGame(); return true; }
    return false;
  }
  if (P.tgt === 'enemy') {
    const a = alive();
    if (!target || target.done) target = a.length === 1 ? a[0] : null;
    if (!target) return false;
  }
  cb.busy = true;
  G.run.items.splice(i, 1);
  await UIC.banner(P.name);
  await P.fx(B, target);
  cb.busy = false;
  UIC.render();
  await checkEnd();
  return true;
}
async function useAssist(i, target) {
  const cb = G.cb;
  const cp = cb.comps[i];
  if (!cp || cp.charge < cp.need || cb.phase !== 'player' || cb.busy || cb.over) return false;
  const Cp = compDef(cp.id);
  if (Cp.tgt) {
    const a = alive();
    if (!target || target.done) target = a.length === 1 ? a[0] : null;

  }
  cb.busy = true;
  cp.charge = 0;
  await UIC.assistSplash(cp.id);

  cb.busy = false;
  UIC.render();
  await checkEnd();
  return true;
}

    m: { sw: 30, ww: 25, hw: 26, aw: 11 },
    slim: { sw: 27, ww: 21, hw: 23, aw: 10 },
    stout: { sw: 36, ww: 32, hw: 31, aw: 13 },
    fat: { sw: 33, ww: 39, hw: 33, aw: 13 },
    f: { sw: 25, ww: 19, hw: 25, aw: 9 },
    fc: { sw: 28, ww: 27, hw: 31, aw: 11 },
    kid: { sw: 23, ww: 20, hw: 21, aw: 9 },
  };
  const geo = (b = 'm', o = {}) => Object.assign({ cx: 100, shY: 116, wY: 190, hY: 208, kY: 254, fY: 296, hk: 1 }, BUILD[b], o);

  /* base: 紙紮底座 */
  function base(w = 50, c = '#7e1a2c') {
    const x1 = 100 - w, x2 = 100 + w;
    return E(100, 316, w + 10, 4.5, 'rgba(0,0,0,.4)') +
      P(`M${x1 + 6} 304L${x2 - 6} 304L${x2} 309L${x1} 309Z`, lt(c, .15), 1.6) +
      P(`M${x1} 309L${x2} 309L${x2} 316L${x1} 316Z`, c, 1.6) +
      S(`M${x1 + 4} 312.5L${x2 - 4} 312.5`, C.gold, 1.4, 'stroke-dasharray="6 3"');
  }

  /* ---------- torso ---------- */
  function torsoD(g, o = {}) {
    const { cx, shY, wY } = g, sw = o.sw || g.sw, ww = o.ww || g.ww, bw = o.bw || g.hw, bot = o.bot || g.hY + 4, nk = o.nk || 9;
    return `M${cx - sw} ${shY + 5}Q${cx - sw + 1} ${shY - 3} ${cx - nk} ${shY - 5}L${cx + nk} ${shY - 5}Q${cx + sw - 1} ${shY - 3} ${cx + sw} ${shY + 5}` +
      `Q${cx + sw + 2} ${n1((shY + wY) / 2)} ${cx + ww} ${wY}L${cx + bw} ${bot}L${cx - bw} ${bot}L${cx - ww} ${wY}Q${cx - sw - 2} ${n1((shY + wY) / 2)} ${cx - sw} ${shY + 5}Z`;
  }
  /* soft cel shade on right third */
  function shadeR(g, o = {}) {
    const { cx, shY, wY } = g, sw = o.sw || g.sw, ww = o.ww || g.ww, bw = o.bw || g.hw, bot = o.bot || g.hY + 4;
    return F(`M${cx + sw * .45} ${shY - 3}Q${cx + sw - 1} ${shY - 2} ${cx + sw} ${shY + 5}Q${cx + sw + 2} ${n1((shY + wY) / 2)} ${cx + ww} ${wY}L${cx + bw} ${bot}L${cx + bw * .5} ${bot}Q${cx + ww * .55} ${wY - 30} ${cx + sw * .45} ${shY - 3}Z`, 'rgba(27,20,24,.16)');
  }

  /* ---------- arms ---------- */
  const POSE = {
    down: (g, s, x, y) => [[x + s * 5, y + 44], [x + s * 6, y + 86]],
    hold: (g, s, x, y) => [[x + s * 4, y + 47], [g.cx + s * 11, y + 60]],
    chest: (g, s, x, y) => [[x + s * 5, y + 44], [g.cx + s * 9, y + 36]],
    hip: (g, s, x, y) => [[x + s * 22, y + 32], [g.cx + s * (g.ww + 3), g.wY - 8]],
    up: (g, s, x, y) => [[x + s * 20, y - 6], [x + s * 18, y - 52]],
    out: (g, s, x, y) => [[x + s * 18, y + 34], [x + s * 38, y + 54]],
    wave: (g, s, x, y) => [[x + s * 24, y + 28], [x + s * 22, y - 18]],
    pocket: (g, s, x, y) => [[x + s * 8, y + 44], [g.cx + s * (g.ww - 1), g.wY + 8]],
    fwd: (g, s, x, y) => [[x + s * 8, y + 44], [x + s * 24, y + 64]],
    ear: (g, s, x, y) => [[x + s * 16, y + 38], [g.cx + s * 21, g.shY - 34]],
    behind: (g, s, x, y) => [[x + s * 4, y + 44], [x - s * 3, y + 72]],
    raise: (g, s, x, y) => [[x + s * 22, y + 16], [x + s * 34, y - 18]],
  };
  /* o: {pose|pts, c, skin, short(0..1), cuff, hand:'none'|'mitt'|'fist', w} → {s, h:[x,y]} */
  function arm(g, side, o) {
    const w = o.w || g.aw, sx = g.cx + side * (g.sw - w * .5), sy = g.shY + w * .5 - 2;
    const q = o.pts || POSE[o.pose || 'down'](g, side, sx, sy);
    const a = [[sx, sy], q[0], q[1]], skin = o.skin || C.paper;
    let s = '';
    if (o.short != null) {
      s += limb(a, w - 2, skin);
      const e = q[0], t = o.short, m = [sx + (e[0] - sx) * t, sy + (e[1] - sy) * t];
      s += limb([[sx, sy], m], w + 2, o.c);
    } else {
      s += limb(a, w, o.c);
      if (o.cuff) { const h = q[1], e = q[0], L = Math.hypot(h[0] - e[0], h[1] - e[1]) || 1, t = 6 / L; s += limb([[h[0] - (h[0] - e[0]) * t, h[1] - (h[1] - e[1]) * t], h], w + 1, o.cuff); }
    }
    if (!o.noseam) s += S(`M${n1(q[0][0] - 3)} ${n1(q[0][1] - 1)}L${n1(q[0][0] + 3)} ${n1(q[0][1] + 1)}`, 'rgba(27,20,24,.45)', 1.2);
    if (o.hand !== 'none') s += O(q[1][0], q[1][1], n1(w * .6), skin, ink(1.8));
    return { s, h: q[1].map(n1), e: q[0].map(n1) };
  }

  /* ---------- legs & shoes ---------- */
  function pants(g, c, o = {}) {
    const { cx, hY } = g, hw = o.hw || g.hw, top = o.top || g.wY - 2, end = o.end || g.fY, gap = o.gap || 3.5, ank = o.ank || hw - 5;
    const d = `M${cx - hw} ${top}L${cx + hw} ${top}L${cx + ank} ${end}L${cx + gap} ${end}L${cx} ${hY + 12}L${cx - gap} ${end}L${cx - ank} ${end}Z`;
    let s = P(d, c) + (o.pat ? F(d, o.pat, 'opacity=".6"') : '');
    s += S(`M${cx - ank * .5} ${hY + 14}L${cx - ank * .52} ${end - 5}M${cx + ank * .5} ${hY + 14}L${cx + ank * .52} ${end - 5}`, dk(c, .35), 1, 'opacity=".55"');
    if (o.trim) s += trim(`M${cx - ank + 1} ${end - 3}L${cx - gap - 1} ${end - 3}M${cx + gap + 1} ${end - 3}L${cx + ank - 1} ${end - 3}`, 2, o.trim);
    return s;
  }
  function bareLegs(g, o = {}) { // shins below shorts/skirt
    const sep = o.sep || g.hw * .5, y1 = o.y1 || g.kY - 10, c = o.c || C.paper, w = o.w || 9;
    return limb([[g.cx - sep, y1], [g.cx - sep - .5, g.fY + 2]], w, c) + limb([[g.cx + sep, y1], [g.cx + sep + .5, g.fY + 2]], w, c);
  }
  function shoes(g, type = 'shoe', c = INK, o = {}) {
    const sep = o.sep || (g.hw - 5) * .55, y = g.fY, out = [];
    for (const sd of [-1, 1]) {
      const x = g.cx + sd * sep;
      if (type === 'shoe') out.push(P(`M${x - 10} ${GY}Q${x - 11} ${y + 1} ${x - 3} ${y - 1}L${x + 3} ${y - 1}Q${x + 11} ${y + 1} ${x + 10} ${GY}Z`, c, 1.8) + S(`M${x - 7} ${y + 2}Q${x} ${y}  ${x + 7} ${y + 2}`, '#ffffff', 1.1, 'opacity=".35"'));
      else if (type === 'heel') out.push(P(`M${x - 7} ${GY}Q${x - 8} ${y} ${x} ${y - 2}Q${x + 8} ${y} ${x + 7} ${GY}Z`, c, 1.8) + P(`M${x - 2} ${GY}L${x + 2} ${GY}L${x + 1} ${GY + 3}L${x - 1} ${GY + 3}Z`, INK, 1));
      else if (type === 'boot') out.push(P(`M${x - 9} ${g.kY + 10}L${x + 9} ${g.kY + 10}L${x + 10} ${y}Q${x + 12} ${GY - 4} ${x + 11} ${GY}L${x - 11} ${GY}Q${x - 12} ${GY - 4} ${x - 10} ${y}Z`, c, 1.8) + S(`M${x - 9} ${g.kY + 16}L${x + 9} ${g.kY + 16}`, lt(c, .25), 1.5));
      else if (type === 'workboot') out.push(P(`M${x - 9} ${y - 12}L${x + 9} ${y - 12}L${x + 10} ${y}Q${x + 13} ${GY - 4} ${x + 12} ${GY}L${x - 12} ${GY}Q${x - 13} ${GY - 4} ${x - 10} ${y}Z`, c, 1.8) + S(`M${x - 11} ${GY - 3}L${x + 11} ${GY - 3}`, INK, 1.4) + S(`M${x - 4} ${y - 8}L${x + 4} ${y - 6}M${x - 4} ${y - 4}L${x + 4} ${y - 2}`, lt(c, .4), 1));
      else if (type === 'slipper') out.push(P(`M${x - 12} ${GY + 1}L${x + 12} ${GY + 1}L${x + 11} ${GY - 3}L${x - 11} ${GY - 3}Z`, '#f7f7fb', 1.4) + P(`M${x - 8} ${GY - 3}Q${x - 9} ${y - 3} ${x} ${y - 5}Q${x + 9} ${y - 3} ${x + 8} ${GY - 3}Z`, o.skin || C.paper, 1.4) + P(`M${x - 9} ${y + 1}L${x + 9} ${y + 1}L${x + 9} ${y + 6}L${x - 9} ${y + 6}Z`, o.strap || '#2f6fd6', 1.4));
      else if (type === 'bare') out.push(P(`M${x - 8} ${GY}Q${x - 9} ${y - 2} ${x} ${y - 4}Q${x + 9} ${y - 2} ${x + 8} ${GY}Z`, o.skin || C.paper, 1.6) + S(`M${x - 3} ${GY - 1}L${x - 3} ${GY - 3}M${x + 1} ${GY - 1}L${x + 1} ${GY - 3}`, INK, .9));
      else if (type === 'sneaker') out.push(P(`M${x - 11} ${GY}Q${x - 12} ${y} ${x - 3} ${y - 2}L${x + 3} ${y - 2}Q${x + 12} ${y} ${x + 11} ${GY}Z`, '#f4f4f4', 1.8) + S(`M${x - 10} ${GY - 3}L${x + 10} ${GY - 3}`, c, 2.4));
    }
    return out.join('');
  }

  /* =======================================================================
     HEAD  — local coords: face centre (0,0); chin y≈26
     ======================================================================= */
  const FACE = {

    round: 'M0 -26C15 -26 25 -15 25 0C25 15 14 25 0 25C-14 25 -25 15 -25 0C-25 -15 -15 -26 0 -26Z',
    long: 'M0 -28C12 -28 21 -19 21 -4C21 13 12 28 0 28C-12 28 -21 13 -21 -4C-21 -19 -12 -28 0 -28Z',
    square: 'M0 -28C14 -28 23 -20 23 -6L22 12C20 22 12 27 0 27C-12 27 -20 22 -22 12L-23 -6C-23 -20 -14 -28 0 -28Z',
    jowl: 'M0 -27C15 -27 24 -17 24 -3C26 15 16 28 0 28C-16 28 -26 15 -24 -3C-24 -17 -15 -27 0 -27Z',

    cold: () => F(sym('M-15.5 0.6Q-10 -3.4 -4 -0.4Q-9.5 2.3 -15.5 0.6Z'), INK) + S(sym('M-16.5 -1.8Q-10.5 -5.4 -3.5 -2.4'), INK, 1.3),
    line: () => S(sym('M-14 0Q-9.5 3 -5 0'), INK, 1.8),
    smile: () => S(sym('M-14 1.8Q-9.5 -4 -5 1.8'), INK, 2.1),
    sad: () => S(sym('M-14.5 -0.5Q-10 2.8 -5 1.8'), INK, 1.8) + O(-10, 1.2, 1.3, INK) + O(10, 1.2, 1.3, INK),
    wide: () => P(sym('M-15 0Q-9.5 -6.5 -4 0Q-9.5 6.5 -15 0Z'), '#fff', 1.4) + O(-9.5, 0, 2, INK) + O(9.5, 0, 2, INK),
    sharp: () => F(sym('M-16 -0.5L-10 -3.6L-4 -0.8L-10 1.6Z'), INK) + O(-9, -1.3, .8, '#fff') + O(11, -1.3, .8, '#fff'),
    glare: () => F(sym('M-15 0.4L-9 -2.2L-4.5 -0.2L-9.5 1.4Z'), INK) + O(-9.2, -0.6, .8, '#fff') + O(9.2, -0.6, .8, '#fff'),
    old: () => S(sym('M-14 0.6Q-9.5 -2.2 -5 0.6'), INK, 1.9) + S(sym('M-16.5 1L-19.5 -0.5M-16.5 3L-19.5 3.6'), INK, .9, 'opacity=".6"'),

    empty: () => P(sym(ALM), '#fffdf6', 1.3) + S(sym('M-15.5 -0.6Q-9.5 -6.4 -3.6 -1'), INK, 1.6),
    tired: () => S(sym('M-15 -0.5Q-9.5 -2.4 -4 -0.5'), INK, 1.6) + F(sym('M-13.5 -0.4Q-9.5 3.2 -5.5 -0.4Z'), INK) + S(sym('M-14 4.2Q-9.5 6.6 -5 4.2'), '#8a6f8a', 1, 'opacity=".8"'),
    crazy: () => P(sym('M-15 0Q-9.5 -6.5 -4 0Q-9.5 6.5 -15 0Z'), '#fff', 1.4) + O(-8, -1, 1.5, INK) + O(11.5, 1, 1.5, INK),
    shut: () => S(sym('M-14 0.5L-5 0.5'), INK, 1.8),
    none: () => '',
    hollow: () => E(-9.5, 0, 4.6, 5.6, '#0e0a10') + E(9.5, 0, 4.6, 5.6, '#0e0a10') + O(-9.5, 1, 1.3, '#ff5a5a') + O(9.5, 1, 1.3, '#ff5a5a'),
    fierce: () => P(sym('M-16 1L-10 -4.5L-3.5 -0.5L-10 3Z'), '#fff', 1.3) + O(-9.5, -0.5, 2.1, INK) + O(9.5, -0.5, 2.1, INK),
  };
  const BROW = {
    none: () => '',
    arch: c => S(sym('M-15 -9Q-10 -13.2 -4 -10.6'), c, 1.5),
    flat: c => S(sym('M-16 -9.8L-4 -10.4'), c, 2.3),
    stern: c => S(sym('M-16 -11.5L-4 -8.6'), c, 2.4),
    angry: c => S(sym('M-16.5 -13L-4 -7'), c, 3),
    worry: c => S(sym('M-15 -8.2L-4.5 -11.6'), c, 1.8),
    thick: c => S(sym('M-16.5 -9Q-10 -13.5 -3.5 -9.5'), c, 3.6),
    thin: c => S(sym('M-14 -10Q-9.5 -12 -5 -10.6'), c, 1.2),

  const LIP = '#b3122e';
  const MOUTH = {

    bow: () => F('M-3.6 14.6Q-1.8 12.8 0 14.1Q1.8 12.8 3.6 14.6Q0 17.8 -3.6 14.6Z', C.red),
    line: () => S('M-4.5 15.6L4.5 15.6', '#8e2238', 2),
    smile: () => S('M-6 13.6Q0 19.4 6 13.6', LIP, 2.1),
    grin: () => P('M-7.5 12.8Q0 13.4 7.5 12.8Q0 22.5 -7.5 12.8Z', '#7a0f22', 1.2) + F('M-6 13.3Q0 13.9 6 13.3L5.4 15.4Q0 16.2 -5.4 15.4Z', '#fff'),
    frown: () => S('M-5 17.4Q0 13.4 5 17.4', '#8e2238', 2),
    open: () => P('M-3.6 15.8Q0 11 3.6 15.8Q0 21 -3.6 15.8Z', '#5a0a18', 1.2),
    shout: () => P('M-7 13Q0 10 7 13Q5 23 0 23Q-5 23 -7 13Z', '#5a0a18', 1.3) + F('M-5.5 13Q0 11.4 5.5 13L5 14.8Q0 13.4 -5 14.8Z', '#fff'),
    smirk: () => S('M-4.5 15.8Q1 17 6.5 13.2', '#8e2238', 2),
    none: () => '',
    tiny: () => S('M-2.4 15.2L2.4 15.2', C.red, 2.4),
    sneer: () => S('M-6 16Q-1 13.6 6 15', '#8e2238', 2.2),
  };
  const EARS = sym('M-21.5 -5Q-28 -7 -27.5 1Q-27 8 -21 7Z');
  /* h: {shape, eyes, brows, bc, mouth, cheek, nose, ears, wr (wrinkles), skin, hair, hc, hat, hatc, over, under, back, k, tilt, dx, dy} */
  function head(g, h) {
    const k = h.k || g.hk || 1, cy = n1(g.shY - 16 - 26 * k + (h.dy || 0)), cx = g.cx + (h.dx || 0);
    const skin = h.skin || C.paper, hc = h.hc || INK;

    const hb = HAIR[h.hair] || {};
    // back layer: long hair etc + neck (drawn before torso)
    let back = (hb.b ? hb.b(hc) : '') + (h.back || '');
    const nb = n1((g.shY - cy) / k + 2);
    back += P(`M-7 16L-7 ${nb}L7 ${nb}L7 16Z`, skin, 1.8) + F(`M-7 ${nb - 8}L7 ${nb - 8}L7 ${nb}L-7 ${nb}Z`, 'rgba(27,20,24,.16)');
    // front layer
    let f = (hb.u ? hb.u(hc) : '') + (h.under || '');
    if (h.ears !== false) f += P(EARS, skin, 1.7) + S(sym('M-23.5 -1.5Q-25.5 0 -23.5 3'), 'rgba(27,20,24,.45)', 1);
    f += P(FACE[h.shape || 'egg'], skin, 2);
    f += E(-6, -14, 9, 5, '#ffffff', 'opacity=".35"');
    if (h.cheek !== 0) f += O(-14, 8.5, h.cr || 6, C.pink, `opacity="${h.cheek || .5}"`) + O(14, 8.5, h.cr || 6, C.pink, `opacity="${h.cheek || .5}"`);

    f += (BROW[h.brows || 'arch'] || BROW.arch)(h.bc || hc === '#e9e4ee' || hc === '#b9b4c0' ? (h.bc || '#8b8592') : INK);
    f += (EYE[h.eyes || 'dot'] || EYE.dot)();
    if (h.nose !== false) f += S('M0.8 3.5L-1.4 8.6L1.6 8.8', INK, 1, 'opacity=".55"');
    f += (MOUTH[h.mouth || 'dot'] || MOUTH.dot)();
    f += (h.face || '');
    f += (hb.f ? hb.f(hc) : '');
    f += (h.hat && HAT[h.hat] ? HAT[h.hat](h.hatc) : '');
    f += (h.over || '');
    return { b: `<g transform="${tf}">${back}</g>`, f: `<g transform="${tf}">${f}</g>`, cx, cy, k };
  }

  /* ---------- hair (b: behind body, u: behind face, f: over face) ---------- */
  const HAIR = {
    side: {
      u: c => P('M-24.5 1C-28 -26 -13 -40 2 -40C19 -40 29 -27 25 1L22 -10L-21 -10Z', c),
      f: c => P('M-24 -5C-26 -25 -12 -37 3 -37C18 -37 28 -26 25 -5L22 -9L18 -15L15 -9L9 -18L4 -13L-3 -21L-8 -17L-12 -23L-16.5 -16L-21 -13Z', c) + S('M-3 -33Q8 -35 17 -29', '#ffffff', 1.3, 'opacity=".28"'),
    },
    bowl: {
      u: c => P('M-26 4C-29 -26 -14 -39 0 -39C14 -39 29 -26 26 4L22 -8L-22 -8Z', c),

    },
    slick: {
      u: c => P('M-24.5 0C-28 -27 -13 -41 1 -41C18 -41 29 -28 24.5 0L22 -12L-22 -12Z', c),
      f: c => P('M-24.5 -6C-26 -30 -12 -41 2 -41C18 -41 27 -30 24.5 -6C23 -15 19 -20 12 -22Q5 -25.5 -1 -21.5Q-8 -24.5 -14 -21.5C-19 -19 -22.5 -14 -24.5 -6Z', c) + S('M-13 -34Q0 -39 14 -33M-8 -28Q2 -32 12 -27', '#ffffff', 1.4, 'opacity=".45"'),
    },
    buzz: {
      u: c => P('M-24 -2C-26 -26 -12 -36 0 -36C12 -36 26 -26 24 -2L21 -12L-21 -12Z', c),
      f: c => P('M-23.5 -8C-24 -26 -12 -34.5 0 -34.5C12 -34.5 24 -26 23.5 -8Q20 -19 0 -20.5Q-20 -19 -23.5 -8Z', c),
    },
    gray: { // short neat gray, side part, receding

    const L = `M${cx - sw} ${shY + 5}Q${cx - sw + 1} ${shY - 3} ${cx - 9} ${shY - 5}L${cx - 2} ${V}L${cx - 1} ${bot + 2}L${cx - bw} ${bot}L${cx - ww} ${wY}Q${cx - sw - 2} ${n1((shY + wY) / 2)} ${cx - sw} ${shY + 5}Z`;
    const R = `M${cx + sw} ${shY + 5}Q${cx + sw - 1} ${shY - 3} ${cx + 9} ${shY - 5}L${cx + 2} ${V}L${cx + (o.open ? 6 : 1)} ${bot + 2}L${cx + bw} ${bot}L${cx + ww} ${wY}Q${cx + sw + 2} ${n1((shY + wY) / 2)} ${cx + sw} ${shY + 5}Z`;
    let s = P(L, c) + P(R, dk(c, .08));
    // lapels
    s += P(`M${cx - 9} ${shY - 5}L${cx - 17} ${shY + 8}L${cx - 12} ${shY + 12}L${cx - 16} ${shY + 18}L${cx - 2} ${V}Z`, lt(c, .12), 1.6) + P(`M${cx + 9} ${shY - 5}L${cx + 17} ${shY + 8}L${cx + 12} ${shY + 12}L${cx + 16} ${shY + 18}L${cx + 2} ${V}Z`, lt(c, .06), 1.6);

    s += S(`M${cx - bw + 3} ${bot - 12}L${cx - 8} ${bot - 10}M${cx + 8} ${bot - 10}L${cx + bw - 3} ${bot - 12}`, dk(c, .35), 1.2); // pocket flaps

    s += seam(`M${cx - sw + 3} ${shY + 8}Q${cx - sw + 8} ${shY + 20} ${cx - sw + 5} ${shY + 34}M${cx + sw - 3} ${shY + 8}Q${cx + sw - 8} ${shY + 20} ${cx + sw - 5} ${shY + 34}`);

  /* 陰間・元神花園 — 灰色天空、怪異的花，一半枯萎 */

    const m = makeMode(name), t = ac.currentTime;
    [m.g.gain, m.w.gain].forEach(p => { p.setValueAtTime(0, t); p.linearRampToValueAtTime(m.def.vol || 1, t + Math.max(.05, fade)); });
    live.push(m); cur = m;
    while (live.length > 3) kill(live[0]);
  }
  function fadeOut(m, fade) {
    const t = ac.currentTime;
    [m.g.gain, m.w.gain].forEach(p => { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(0, t + Math.max(.05, fade)); });
    m.stopAt = t + Math.max(.05, fade);
  }
  function kill(m) {
    if (m.dead) return;
    m.dead = true;
    m.nodes.forEach(n => { try { n.stop(); } catch (e) { } });
    setTimeout(() => { try { m.g.disconnect(); m.w.disconnect(); } catch (e) { } }, 80);
    const k = live.indexOf(m); if (k >= 0) live.splice(k, 1);
    if (cur === m) cur = null;
  }
  function syncMusic() {
    if (!ac || !started) return;
    const target = musVol() > 0 ? want : 'none';
    if (cur && cur.name === target) return;
    if (cur) { fadeOut(cur, target === 'none' ? Math.min(fadeSec, 1.2) : fadeSec); cur = null; }
    if (target !== 'none' && MODES[target]) begin(target, fadeSec);
  }
  function pump() {
    if (!ac || !started) return;
    if (musVol() * .55 !== lastMV || sfxVol() * .9 !== lastSV) applyVol();   // 設定改了但沒呼叫 applyVol 也會跟上
    if (ac.state !== 'running') return;
    const t0 = ac.currentTime, hz = t0 + .2;
    for (let k = live.length - 1; k >= 0; k--) {
      const m = live[k];
      if (!m) continue;
      if (m.stopAt && t0 > m.stopAt + .05) { kill(m); continue; }
      if (m.next < t0 - .1) m.next = t0 + .03;                    // 分頁回來、計時器被節流後重新對齊
      const d = 60 / m.def.bpm / (m.def.sub || 1);
      for (let guard = 0; m.next < hz && guard < 32; guard++) {
        if (m.stopAt && m.next > m.stopAt) break;
        try { m.def.step(m, m.i, m.next, d); } catch (e) { }
        m.i++; m.next += d;
      }
    }
  }
  const MOOD = { calm: 'tan', tense: 'case', dark: 'under', dawn: 'memory' };   // 舊 setMood 名稱對應
  function setMusic(mode, o) {
    if (mode === undefined) return want;
    if (mode === null || mode === false || mode === '') mode = 'none';
    mode = MOOD[mode] || mode;
    if (mode !== 'none' && !MODES[mode]) return want;
    fadeSec = o && o.fade != null ? Math.max(.05, +o.fade || .05) : 1.6;
    want = mode;
    if (started && ac) syncMusic();
    return want;
  }
  function setMood(m) { mood = m; setMusic(m); }

  /* ---------------- 解鎖：第一次互動前完全不建立 AudioContext ---------------- */
  const quiet = p => { if (p && p.catch) p.catch(() => { }); };
  function start() {
    if (started) { if (ac && ac.state === 'suspended' && !document.hidden) { try { quiet(ac.resume()); } catch (e) { } } return; }
    if (!ensure()) return;
    started = true;
    try { if (ac.state === 'suspended') quiet(ac.resume()); } catch (e) { }
    try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch (e) { }   // iOS 解鎖
    applyVol();
    if (!pumpT) pumpT = setInterval(pump, 50);
    pump();
  }
  const EV = ['pointerdown', 'keydown', 'touchend'];
  function unlock() { start(); if (started) EV.forEach(e => document.removeEventListener(e, unlock, true)); }
  try { EV.forEach(e => document.addEventListener(e, unlock, true)); } catch (e) { }
  try {
    document.addEventListener('visibilitychange', () => {
      if (!ac || !started) return;
      try { quiet(document.hidden ? ac.suspend() : ac.resume()); } catch (e) { }
    });
  } catch (e) { }

  /* ---------------- 測試用：把一個音效或一段配樂離線算出來，回傳峰值／RMS／NaN 數 ---------------- */
  async function render(kind, name, sec = 4) {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return null;
    if (kind === 'music' ? !MODES[name] : !S[name]) throw new Error('unknown ' + kind + ' ' + name);
    const sr = ac ? ac.sampleRate : 44100, off = new OAC(2, Math.ceil(sr * sec), sr);
    const keep = [ac, master, comp, music, duckG, mWet, sfx, sWet, verb];
    let err = null;
    try {
      ac = off; buses(off);
      music.gain.value = mWet.gain.value = .5 * .55; sfx.gain.value = sWet.gain.value = .7 * .9;
      if (kind === 'music') {
        const m = makeMode(name), d = 60 / m.def.bpm / (m.def.sub || 1);
        m.g.gain.value = m.w.gain.value = m.def.vol || 1;
        for (m.next = .05; m.next < sec - .05; m.next += d) m.def.step(m, m.i++, m.next, d);
        m.nodes.forEach(n => { try { n.stop(sec); } catch (e) { } });
      } else S[name]();
    } catch (e) { err = e; }
    [ac, master, comp, music, duckG, mWet, sfx, sWet, verb] = keep;
    if (err) throw err;
    const buf = await off.startRendering();
    let peak = 0, sum = 0, nan = 0;
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < d.length; i++) { const v = d[i]; if (v !== v) { nan++; continue; } const a = v < 0 ? -v : v; if (a > peak) peak = a; sum += v * v; }
    }
    return { peak: +peak.toFixed(4), rms: +Math.sqrt(sum / (buf.length * buf.numberOfChannels)).toFixed(5), nan };
  }

  return {
    start, play, setMood, applyVol, music: setMusic, duck,
    names: () => Object.keys(S), modes: () => Object.keys(MODES),
    get started() { return started; },
    get mode() { return want; },
    get playing() { return cur ? cur.name : 'none'; },
    get state() { return ac ? ac.state : 'none'; },
    get mood() { return mood; },
    _render: render,
  };
})();

  const id = G.run && G.run.items[i];
  if (!id) return;
  const P = ITEMS[id];
  const inCombat = G.screen === 'combat' && G.cb && G.cb.phase === 'player';
  if (!inCombat) {
    if (P.outside) {
      const ok = await UI.confirm(P.name, `${esc(P.desc)}<br>現在就用嗎？`, '用', '留著');
      if (ok) { await useItem(i); SND.play('heal'); UI.hud(); }
    } else {
      const v = await UI.modal({ title: P.name, html: `<p>${esc(P.desc)}</p><p class="msub">只能在法事（戰鬥）中使用。</p>`, buttons: [{ label: '丟掉', value: 'drop' }, { label: '收著', value: null, cls: 'pri' }] });
      if (v === 'drop') { G.run.items.splice(i, 1); saveGame(); UI.hud(); }
    }
    return;
  }
  if (P.tgt === 'enemy' && alive().length > 1) { UIC.beginTarget({ item: i }); return; }
  await useItem(i);
  UI.hud();
};
UI.ACT.menu = async () => {
  const inCase = !!G.run;
  const v = await UI.modal({
    title: '選單', html: `<p class="msub">${inCase ? esc(caseLabel(G.run.caseId)) : ''}</p>`, buttons: [
      { label: '玩法', value: 'guide' }, { label: '設定', value: 'set' }, { label: '線索牆', value: 'clue' }, { label: '陰陽帳', value: 'ledger' },
      ...(inCase && G.run.caseId !== 'c0' ? [{ label: '再開一壇', value: 'restart', cls: 'danger' }] : []),
      { label: '回壇（存檔）', value: 'hub' }, { label: '繼續', value: null, cls: 'pri' }],
  });
  if (v === 'guide') MODALS.guide();
  if (v === 'set') MODALS.settings();
  if (v === 'clue') MODALS.clues();
  if (v === 'ledger') MODALS.ledger();
  if (v === 'hub') { if (G.screen === 'combat' && G.cb && !G.cb.over) { UI.toast('法事進行中，回壇後會從這場法事重新開始。', '', 3000); } CAMP.toHub(); }
  if (v === 'restart') {
    const ok = await UI.confirm('再開一壇', '這一案從頭再來一次：牌組、陽火、香油錢回到案件開始時。已經看過的劇情可以快速略過。', '重來', '算了');
    if (ok) { if (G.cb && !G.cb.over) G.cb.over = true; CAMP.restartCase(); }

};
function caseLabel(id) { const c = CASE_CFG[id]; if (!c) return ''; return c.no ? `第${'〇一二三四五六七八'[c.no]}案〈${c.title}〉・${c.date}` : `序章〈${c.title}〉`; }

'use strict';
/* ============================================================

const UIC = (() => {

  /* ---------- rendering ---------- */
  function statusChips(u) {
