#scr-battle{pointer-events:none}
#scr-league,#scr-garage,#scr-free,#scr-settings{background:radial-gradient(ellipse at 50% 0%,rgba(40,28,20,.9),rgba(8,9,14,.94) 60%)}
#scr-league::after,#scr-garage::after,#scr-free::after,#scr-settings::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.4px);background-size:7px 7px;z-index:-1}
#scr-battle.on{animation:none}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ───── 標題 ───── */
.logo{text-align:center;margin-top:calc(14vh + var(--st));filter:drop-shadow(0 6px 0 rgba(0,0,0,.5))}
.logo-zh{display:flex;justify-content:center;gap:.05em;font-family:var(--disp);font-weight:900;font-size:clamp(84px,26vw,150px);line-height:1}
.logo-zh span{display:inline-block;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--or),9px 9px 0 var(--ink);transform:skewX(-8deg)}
.logo-zh span:first-child{color:var(--or);text-shadow:6px 6px 0 #fff,9px 9px 0 var(--ink);transform:skewX(-8deg) rotate(-4deg)}
.logo-en{font-family:var(--disp);font-weight:900;letter-spacing:.38em;font-size:clamp(15px,4.6vw,24px);margin-top:10px;padding-left:.38em;color:var(--ye);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill}
.logo-sub{margin-top:8px;font-size:13px;color:#e8d8c4;letter-spacing:.3em;opacity:.85}
.logo.small{margin-top:calc(5vh + var(--st))}
.logo.small .logo-zh{font-size:clamp(56px,16vw,90px)}
.tap{position:absolute;left:0;right:0;bottom:calc(9vh + var(--sb));text-align:center;font-family:var(--disp);font-weight:900;font-size:18px;letter-spacing:.2em;animation:blink 1.4s ease-in-out infinite;text-shadow:2px 2px 0 var(--ink)}
@keyframes blink{50%{opacity:.25}}
.ver{position:absolute;right:12px;bottom:calc(8px + var(--sb));font-size:11px;color:var(--mut)}

/* ───── 主選單 ───── */
.menu-list{margin:auto auto calc(5vh + var(--sb));width:min(88vw,420px);display:flex;flex-direction:column;gap:12px}
.mbtn{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 20px;background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink),inset 0 0 0 1px #3a3f52;transform:skewX(-7deg);transition:transform .08s}
.mbtn>*{transform:skewX(7deg)}
.mbtn b{font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.06em}
.mbtn small{font-size:12px;color:var(--mut);text-align:right}
.mbtn.big{background:var(--or);padding:18px 22px}
.mbtn.big b{font-size:30px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.mbtn.big small{color:#2a1200;font-weight:700}
.mbtn:active:not(:disabled){transform:skewX(-7deg) translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.mbtn:disabled{opacity:.45}
.menu-foot{text-align:center;font-size:12px;color:var(--mut);margin-bottom:calc(14px + var(--sb))}

/* ───── 共用 ───── */
header.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 12px 10px;background:linear-gradient(#0c0d14,rgba(12,13,20,.85));border-bottom:3px solid var(--ink);box-shadow:0 2px 0 #2a2f3e}
header.bar h2{margin:0;font-family:var(--disp);font-weight:900;font-size:24px;letter-spacing:.08em;flex:1;text-shadow:2px 2px 0 var(--or)}
header.bar .sub{font-size:13px;color:var(--mut)}
.back{width:40px;height:40px;font-size:30px;line-height:36px;background:var(--panel2);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:6px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:12px 12px calc(24px + var(--sb))}
.btn{min-width:96px;padding:12px 18px;font-family:var(--disp);font-weight:900;font-size:18px;letter-spacing:.08em;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transform:skewX(-7deg);background:var(--panel2)}
.btn:active{transform:skewX(-7deg) translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.hot{background:var(--or);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:#2a2f3e}
.btn.danger{background:var(--rd)}
.dock{display:flex;gap:12px;justify-content:center;padding:12px 12px calc(14px + var(--sb));background:linear-gradient(rgba(12,13,20,0),rgba(12,13,20,.95) 30%)}
.sect{font-family:var(--disp);font-weight:900;font-size:16px;margin:14px 2px 8px;color:var(--ye);letter-spacing:.1em}

/* ───── 聯賽 ───── */
.league{display:flex;flex-direction:column;gap:12px}
.league>*,.plist>*,.settings>*{flex-shrink:0}
.tier{position:relative;margin:8px 0 2px;padding:12px 16px;background:repeating-linear-gradient(-45deg,#1b1e29 0 10px,#171a24 10px 20px);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.tier b{font-family:var(--disp);font-weight:900;font-size:24px;letter-spacing:.08em}
.tier i{font-style:normal;margin-left:10px;font-size:12px;letter-spacing:.2em;color:var(--or)}
.tier span{display:block;font-size:13px;color:#cbd2df;margin-top:4px}
.tier.t1 i{color:var(--cy)}
.ocard{position:relative;display:flex;gap:12px;text-align:left;padding:10px;background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.ocard::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 55%,color-mix(in srgb,var(--c) 22%,transparent));pointer-events:none}
.opor{flex:0 0 92px;height:108px;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);overflow:hidden;background:#222}
.opor svg{width:100%;height:100%;display:block}
.lockpor{height:100%;display:grid;place-items:center;font-family:var(--disp);font-size:44px;color:#3a3f52;background:repeating-linear-gradient(45deg,#1a1d27 0 6px,#20242f 6px 12px)}
.oinfo{flex:1;min-width:0}
.oinfo small{font-size:11px;color:var(--mut);letter-spacing:.06em}
.oinfo b{display:block;font-family:var(--disp);font-weight:900;font-size:24px;line-height:1.2;color:#fff;text-shadow:2px 2px 0 color-mix(in srgb,var(--c) 70%,#000)}
.oinfo b em{font-style:normal;font-size:13px;color:#cbd2df;margin-left:8px;font-family:var(--body);font-weight:700;text-shadow:none}
.oinfo p{margin:4px 0 6px;font-size:13px;line-height:1.45;color:#dfe4ee}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border:2px solid var(--ink);background:#2a2f3e;border-radius:3px}
.chip img{width:20px;height:20px}
.chip.stake{background:#3a2a10;color:var(--ye)}
.ocard.locked{opacity:.6}
.ocard.done .opor{filter:saturate(.6)}
.stamp{position:absolute;right:10px;top:8px;width:46px;height:46px;border:3px solid var(--rd);border-radius:50%;display:grid;place-items:center;color:var(--rd);font-family:var(--disp);font-weight:900;font-size:24px;transform:rotate(-14deg);opacity:.9}
.nowtag{position:absolute;right:-30px;top:12px;transform:rotate(35deg);background:var(--or);color:#fff;font-family:var(--disp);font-weight:900;font-size:12px;padding:3px 34px;border:2px solid var(--ink);letter-spacing:.2em}
.ocard.open{border-color:var(--or);animation:pulseC 1.8s ease-in-out infinite}
@keyframes pulseC{50%{box-shadow:4px 4px 0 var(--ink),0 0 18px color-mix(in srgb,var(--or) 60%,transparent)}}

/* ───── 彈窗 ───── */
.overlay{position:absolute;inset:0;display:none;pointer-events:auto}
.overlay.on{display:block}
#modal.on{display:flex;align-items:center;justify-content:center;background:rgba(5,6,10,.72);backdrop-filter:blur(3px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.mbox{width:min(92vw,460px);max-height:calc(100% - 40px - var(--st) - var(--sb));overflow-y:auto;touch-action:pan-y;background:var(--panel);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink),inset 0 0 0 1px #3a3f52;padding:16px;animation:popIn .26s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.85);opacity:0}}
.pre-head{display:flex;gap:12px}
.pre-por{flex:0 0 112px;height:130px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.pre-por svg{width:100%;height:100%;display:block}
.pre-t{flex:1;min-width:0}
.pre-t small{font-size:11px;color:var(--mut)}
.pre-t>b{display:block;font-family:var(--disp);font-weight:900;font-size:28px;line-height:1.15;text-shadow:2px 2px 0 color-mix(in srgb,var(--c) 70%,#000)}
.pre-t>span{display:block;font-size:13px;color:#dfe4ee;line-height:1.4;margin-top:2px}
.pre-top{display:flex;align-items:center;gap:8px;margin-top:8px}
.pre-top canvas{width:52px;height:52px}
.pre-top b{display:block;font-family:var(--disp);font-size:15px}
.pre-top span{font-size:12px;color:var(--mut)}
.pre-row{display:flex;gap:10px;margin-top:10px;font-size:13px;line-height:1.5;padding-top:10px;border-top:2px dashed var(--line)}
.pre-row b{flex:0 0 auto;font-family:var(--disp);color:var(--ye)}
.pre-mine{margin-top:12px;padding:8px 10px;background:#0f1118;border:2px solid var(--ink);font-size:12px;color:var(--mut)}
.pre-mine b{display:block;color:#fff;font-size:14px;margin-top:2px}
.pre-btns{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.pre-btns.col{flex-direction:column;align-items:stretch}

.result{text-align:center}
.res-stamp{display:inline-block;font-family:var(--disp);font-weight:900;font-size:62px;letter-spacing:.1em;padding:0 18px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--or);transform:rotate(-6deg);animation:stampIn .45s cubic-bezier(.2,1.6,.4,1)}
.result.lose .res-stamp{text-shadow:5px 5px 0 #4a5068;color:#cfd6e4}
@keyframes stampIn{from{transform:rotate(-6deg) scale(2.4);opacity:0}}
.res-score{font-family:var(--disp);font-weight:900;font-size:44px;margin-top:4px}
.res-score i{font-style:normal;color:var(--mut);margin:0 8px}
.res-vs{font-size:13px;color:var(--mut)}
.res-rounds{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.rd{font-size:12px;padding:3px 8px;border:2px solid var(--ink);font-weight:700}
.rd.w{background:var(--or);color:#fff}.rd.l{background:#3a3f52;color:#cfd6e4}.rd.draw{background:#2a2f3e}
.res-reward{margin-top:16px;text-align:left}
.res-reward h3{margin:0 0 8px;font-family:var(--disp);color:var(--ye);text-align:center;letter-spacing:.2em}
.reward{display:flex;gap:12px;align-items:center;padding:10px;background:#0f1118;border:3px solid var(--ink);margin-top:8px;animation:flipIn .6s .5s both}
@keyframes flipIn{from{transform:perspective(600px) rotateY(90deg);opacity:0}}
.reward img{width:76px;height:76px;flex:0 0 auto}
.reward small{font-size:11px;color:var(--mut)}
.reward b{display:block;font-family:var(--disp);font-size:22px;color:var(--ye)}
.reward span{font-size:12px;line-height:1.5;color:#dfe4ee}
.reward.up{border-color:var(--or);box-shadow:0 0 22px rgba(255,122,26,.5)}
.confirm{text-align:center}
.confirm>b{display:block;font-family:var(--disp);font-size:24px}
.confirm>span{display:block;font-size:13px;color:var(--mut);margin-top:6px}
.pause .btn{width:100%}

.tut{text-align:center}
.tut small{font-size:11px;letter-spacing:.3em;color:var(--or)}
.tut>b{display:block;font-family:var(--disp);font-weight:900;font-size:28px;margin:2px 0 6px}
.tut p{font-size:15px;line-height:1.7;margin:8px 0 0;color:#e6ebf3}
.tri svg{width:220px;height:170px;font-family:var(--disp)}

/* ───── 整備 ───── */
.garwrap{flex:1;display:flex;flex-direction:column;overflow-y:auto;touch-action:pan-y;padding-bottom:calc(16px + var(--sb))}
.gar-view{position:relative;flex:0 0 auto;height:min(34vh,260px);margin:10px 12px 0;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:radial-gradient(circle at 50% 60%,#3a2618,#120d0a 70%);overflow:hidden}
.gar-view canvas{position:absolute;inset:0;width:100%;height:100%}
.gtag{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:3px}
.testbtn{padding:8px 14px;font-family:var(--disp);font-weight:900;background:var(--cy);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:skewX(-7deg)}
.gar-stats{margin:10px 12px 0;padding:10px 12px;background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.st{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.st span{flex:0 0 36px;color:#cbd2df}
.st .bar{flex:1;height:10px;background:#0c0d14;border:2px solid var(--ink);position:relative;overflow:hidden}
.st .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--or),var(--ye));transition:width .35s}
.st em{flex:0 0 32px;font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.st em.up{color:#9dff6a}.st em.dn{color:#ff7a7a}
.st2{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.sp{margin-top:6px;font-size:12px;color:#dfe4ee}
.sp b{color:var(--ye);margin-right:6px;font-family:var(--disp)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 12px 0}
.slot{display:flex;flex-direction:column;align-items:center;padding:6px 2px;background:var(--panel2);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.slot img{width:46px;height:46px}
.slot b{font-family:var(--disp);font-size:14px}
.slot small{font-size:11px;color:var(--mut)}
.slot.sel{background:var(--or);box-shadow:3px 3px 0 var(--ink),0 0 0 2px #fff inset}
.slot.sel small{color:#2a1200}
.slothint{margin:8px 14px 0;font-size:12px;color:var(--mut)}
.plist{display:flex;flex-direction:column;gap:8px;margin:8px 12px 0}
.pcard{display:flex;gap:10px;text-align:left;padding:8px;background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.pcard.eq{border-color:var(--or);background:#2a1c12}
.pimg{flex:0 0 62px;height:62px;display:grid;place-items:center;background:#0f1118;border:2px solid var(--ink)}
.pimg img{width:58px;height:58px}
.pcard.locked .pimg{font-family:var(--disp);font-size:30px;color:#3a3f52}
.ptxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.4}
.ptxt b{font-family:var(--disp);font-size:18px}
.ptxt b em{font-style:normal;font-size:11px;margin-left:6px;color:var(--cy);font-family:var(--body)}
.ptxt b i{font-style:normal;font-size:11px;margin-left:6px;background:var(--or);color:#fff;padding:1px 6px;font-family:var(--body)}
.ptxt .pro{color:#b6f28a}.ptxt .con{color:#ffaaa0}
.pcard.locked{opacity:.55}

/* ───── 自由對戰／設定 ───── */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fopp{position:relative;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);overflow:hidden;aspect-ratio:240/300;background:#222}
.fopp svg{width:100%;height:100%;display:block}
.fopp b{position:absolute;left:0;right:0;bottom:0;padding:3px;background:rgba(0,0,0,.7);font-family:var(--disp);font-size:14px}
.fopp.sel{outline:3px solid var(--or);outline-offset:-3px;box-shadow:0 0 0 2px var(--or),3px 3px 0 var(--ink)}
.arow{display:flex;flex-wrap:wrap;gap:8px}
.achip{padding:8px 12px;background:var(--panel2);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:700;font-size:14px;text-align:left}
.achip small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.achip.sel{background:var(--or)}
.achip.sel small{color:#2a1200}
.settings .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 12px;background:var(--panel);border:3px solid var(--ink);margin-bottom:8px;font-weight:700;position:relative}
.settings input[type=range]{width:55%;accent-color:var(--or)}
.settings input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.tog{width:52px;height:28px;border:3px solid var(--ink);background:#2a2f3e;border-radius:16px;position:relative;transition:.2s}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#cfd6e4;transition:.2s}
input:checked+.tog{background:var(--or)}
input:checked+.tog::after{left:26px;background:#fff}
.settings select{font:inherit;padding:6px 8px;background:#0f1118;color:#fff;border:2px solid var(--ink)}
.note{padding:12px;background:#0f1118;border:2px solid var(--line);margin:12px 0;font-size:13px;line-height:1.6}
.note b{display:block;color:var(--ye);font-family:var(--disp);margin-bottom:4px}
.settings .reset{display:block;margin:18px auto 8px}
.settings .ver{position:static;text-align:center;margin-top:8px}

/* ───── 對話 ───── */
#dialog .dlg-bg{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35) 45%,rgba(0,0,0,.82))}
#dialog.shop .dlg-bg{background:radial-gradient(ellipse at 50% 30%,rgba(60,40,24,.6),rgba(0,0,0,.9))}
#dialog.rain .dlg-bg{background:linear-gradient(rgba(10,14,30,.6),rgba(0,0,0,.9))}
#dialog.cup .dlg-bg{background:radial-gradient(ellipse at 50% 20%,rgba(30,60,120,.55),rgba(0,0,0,.9))}
#dialog .skip{position:absolute;top:calc(12px + var(--st));right:12px;padding:8px 14px;font-size:13px;font-weight:700;background:rgba(0,0,0,.6);border:2px solid #3a3f52;border-radius:4px;z-index:3}
.dlg{position:absolute;left:0;right:0;bottom:calc(16px + var(--sb));padding:0 12px;display:flex;align-items:flex-end;gap:0;--c:#fff}
.dpor{position:relative;z-index:2;flex:0 0 auto;width:min(36vw,170px);aspect-ratio:240/280;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);transform:rotate(-3deg) translateY(10px);overflow:hidden;background:#222}
.dpor svg{width:100%;height:100%;display:block}
.dpor.pop{animation:porIn .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes porIn{from{transform:rotate(-3deg) translate(-30px,10px);opacity:0}}
.dlg.right{flex-direction:row-reverse}
.dlg.right .dpor{transform:rotate(3deg) translateY(10px)}
.dlg.right .dpor.pop{animation:porInR .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes porInR{from{transform:rotate(3deg) translate(30px,10px);opacity:0}}
.dbox{position:relative;flex:1;min-height:118px;margin-left:-14px;padding:12px 16px 26px 26px;background:#f6f0e4;color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.dlg.right .dbox{margin-left:0;margin-right:-14px;padding:12px 26px 26px 16px}
.dname{position:absolute;top:-20px;left:18px;padding:3px 14px;background:var(--c);color:var(--ink);font-family:var(--disp);font-weight:900;font-size:17px;border:3px solid var(--ink);transform:skewX(-8deg);box-shadow:3px 3px 0 var(--ink)}
.dname small{font-size:11px;margin-left:6px;font-family:var(--body);font-weight:700;opacity:.75}
.dlg.right .dname{left:auto;right:18px}
.dtext{font-size:17px;line-height:1.65;font-weight:700;min-height:2em;white-space:pre-wrap}
.dnext{position:absolute;right:12px;bottom:6px;font-style:normal;font-size:13px;animation:blink 1s infinite}
.dlg.nar{justify-content:center}
.dlg.nar .dpor{display:none}
.dlg.nar .dbox{margin:0;background:rgba(10,10,16,.92);color:#f3ecdf;border-color:#3a3f52;text-align:center;padding:18px 18px 26px}
.dlg.nar .dname{display:none}
.dlg.nar .dtext{font-weight:500;letter-spacing:.04em}

/* ───── 片尾 ───── */
.credits{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.65)}
.roll{position:absolute;left:0;right:0;top:100%;text-align:center;animation:roll 26s linear forwards}
.roll .logo{margin-top:0}
.roll p{margin:46px 0 0;font-size:20px;font-weight:700;line-height:1.6}
.roll p small{display:block;font-size:12px;color:var(--or);letter-spacing:.2em;margin-bottom:4px}
.roll h2{margin:80px 0 0;font-family:var(--disp);font-size:34px;letter-spacing:.3em}
@keyframes roll{to{transform:translateY(calc(-100% - 100vh))}}
.credits .skip{position:absolute;right:12px;bottom:calc(14px + var(--sb))}

/* ───── 對戰 HUD ───── */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:6px;padding:calc(8px + var(--st)) 8px 0;pointer-events:none}
.plate{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 6px;background:rgba(14,16,24,.88);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.plate.op{flex-direction:row-reverse;text-align:right}
.pmask{position:relative;flex:0 0 48px;height:48px}
.pmask .gauge{position:absolute;inset:0;transform:rotate(-90deg)}
.gtrack{fill:none;stroke:#2a2f3e;stroke-width:5}
.gfill{fill:none;stroke:var(--ye);stroke-width:5;stroke-dasharray:132;stroke-dashoffset:132;transition:stroke-dashoffset .25s}
.pm-in{position:absolute;inset:6px;border-radius:50%;overflow:hidden;border:2px solid var(--ink);background:#2a2f3e}
.pm-in svg{width:100%;height:100%;display:block}
.gfull{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:9px;font-weight:900;background:var(--ye);color:var(--ink);padding:0 4px;border:1.5px solid var(--ink);display:none;letter-spacing:.05em}
.plate.full .gfull{display:block;animation:blink .7s infinite}
.plate.full .gfill{stroke:#fff3a0;filter:drop-shadow(0 0 4px #ffd23f)}
.pinfo{flex:1;min-width:0}
.pname{font-family:var(--disp);font-weight:900;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin{height:8px;margin:3px 0;background:#05060a;border:1.5px solid var(--ink);overflow:hidden}
.spin i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#ff7a1a,#ffd23f);transition:transform .12s linear}
.plate.op .spin i{transform-origin:right;background:linear-gradient(270deg,var(--cy),#c6f4ff)}
.spin.low i{background:var(--rd)!important;animation:blink .5s infinite}
.prow{display:flex;align-items:center;gap:5px;font-size:10px;line-height:1}
.plate.op .prow{flex-direction:row-reverse}
.rpm{font-variant-numeric:tabular-nums;font-weight:700;color:#cbd2df;min-width:34px}
.lock{display:flex;gap:1.5px}
.lock i{width:7px;height:8px;background:#2a2f3e;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.lock i.on{background:#9dff6a}
.lock.broken i{background:var(--rd);animation:blink .4s infinite}
.mu{display:flex;gap:1px}
.mu i{width:8px;height:8px;background:#2a2f3e;clip-path:polygon(50% 0,100% 100%,0 100%)}
.mu i.on{background:#ffc94a}
.score{flex:0 0 auto;text-align:center;padding:2px 4px}
.sc{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1;text-shadow:2px 2px 0 var(--ink);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.sc i{font-style:normal;color:var(--mut);margin:0 3px;font-size:22px}
.sc .s0{color:var(--or)}
.pts{font-size:9px;color:var(--mut);margin-top:2px}
.pausebtn{position:absolute;right:8px;top:calc(76px + var(--st));width:34px;height:30px;font-size:11px;background:rgba(14,16,24,.8);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);pointer-events:auto;letter-spacing:-2px}
.comment{position:absolute;left:50%;top:calc(80px + var(--st));transform:translateX(-50%);width:min(86vw,440px);text-align:center;opacity:0;pointer-events:none}
.comment span{display:inline-block;padding:7px 14px;background:#f6f0e4;color:var(--ink);font-weight:800;font-size:14px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:skewX(-6deg)}
.comment em{font-style:normal;background:var(--ink);color:var(--ye);padding:1px 6px;margin-right:6px;font-size:11px}
.comment.show{animation:cmtIn .3s ease-out forwards}
@keyframes cmtIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

.launchbar{position:absolute;left:50%;bottom:calc(26px + var(--sb));transform:translateX(-50%) translateY(140%);width:min(90vw,420px);transition:transform .3s;pointer-events:none}
.launchbar.show{transform:translateX(-50%)}
.lb-tip{text-align:center;font-family:var(--disp);font-weight:900;font-size:16px;margin-bottom:8px;text-shadow:2px 2px 0 var(--ink);animation:blink 1.6s infinite}
.launchbar.active .lb-tip{animation:none;opacity:0}
.meter{position:relative;height:26px;background:linear-gradient(90deg,#3a4a2a,#7a7a2a 50%,#7a2a2a);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.meter .band{position:absolute;top:0;bottom:0;background:#b6ff2e;box-shadow:0 0 12px #b6ff2e}
.meter .mark{position:absolute;top:-8px;bottom:-8px;width:6px;margin-left:-3px;background:#fff;border:2px solid var(--ink)}
.meter span{position:absolute;top:30px;font-size:11px;font-weight:700;color:#cbd2df}
.meter .z0{left:0}.meter .z1{left:50%;transform:translateX(-50%);color:#b6ff2e}.meter .z2{right:0}
.launchbar[data-zone=perfect] .mark{background:#b6ff2e;box-shadow:0 0 10px #b6ff2e}
.launchbar[data-zone=over] .mark{background:var(--rd)}

.cmdpanel{position:absolute;left:0;right:0;bottom:0;padding:8px 8px calc(8px + var(--sb));background:linear-gradient(rgba(10,12,18,0),rgba(10,12,18,.92) 22%);transform:translateY(110%);transition:transform .25s cubic-bezier(.2,1.2,.4,1);pointer-events:auto}
.cmdpanel.show{transform:none}
.cmdtop{display:flex;gap:8px;align-items:stretch;margin:0 auto 8px;max-width:520px}
.cmddesc{flex:1;min-width:0;padding:6px 10px;background:rgba(14,16,24,.92);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:12px;line-height:1.35;color:#dfe4ee;display:flex;flex-direction:column;justify-content:center}
.cmddesc b{font-family:var(--disp);font-size:15px;color:#fff}
.gobtn{flex:0 0 96px;font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.1em;background:var(--or);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transform:skewX(-7deg)}
.gobtn:disabled{background:#3a3f52;color:#7a8196;text-shadow:none;-webkit-text-stroke:0}
.gobtn:not(:disabled){animation:goPulse 1s ease-in-out infinite}
@keyframes goPulse{50%{box-shadow:4px 4px 0 var(--ink),0 0 18px rgba(255,122,26,.8)}}
.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:520px;margin:0 auto}
.cmd{position:relative;display:flex;flex-direction:column;align-items:center;padding:7px 2px 6px;background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.cmd svg{width:34px;height:34px}
.cmd b{font-family:var(--disp);font-weight:900;font-size:18px;line-height:1.1;margin-top:2px}
.cmd small{font-size:10px;color:var(--mut)}
.cmd.rush{color:#ff5a46}.cmd.orbit{color:#8fe03a}.cmd.guard{color:#4cc0ff}.cmd.special{color:#ffd23f}
.cmd b{color:#fff}
.cmd.sel{transform:translateY(-6px);box-shadow:3px 9px 0 var(--ink);background:#262b3a}
.cmd.rush.sel{background:#5a1a14}.cmd.orbit.sel{background:#2a4a12}.cmd.guard.sel{background:#123a5a}.cmd.special.sel{background:#5a4a10}
.cmd:disabled{opacity:.38}
.cmd.special:not(:disabled){animation:spGlow 1.2s ease-in-out infinite}
@keyframes spGlow{50%{box-shadow:3px 3px 0 var(--ink),0 0 16px #ffd23f}}
.spbar{position:absolute;left:6px;right:6px;bottom:3px;height:3px;background:#2a2f3e}
.spbar i{display:block;height:100%;background:var(--ye);transform-origin:left}
.helpbtn{position:absolute;right:10px;top:-26px;width:28px;height:28px;border-radius:50%;background:#2a2f3e;border:2px solid var(--ink);font-weight:900;font-size:14px}

.banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.banner.show{opacity:1}
.vs{position:relative;width:100%;height:100%}
.vs-l,.vs-r{position:absolute;top:18%;width:52%;height:46%;border:4px solid var(--ink);overflow:hidden;box-shadow:6px 6px 0 var(--ink)}
.vs-l{left:-2%;transform:skewX(-8deg);animation:vsL .5s cubic-bezier(.2,1.2,.4,1) both}
.vs-r{right:-2%;top:30%;transform:skewX(-8deg);animation:vsR .5s .1s cubic-bezier(.2,1.2,.4,1) both}
.vs-l svg,.vs-r svg{width:100%;height:100%;display:block;transform:skewX(8deg) scale(1.1)}
.vs-l b,.vs-r b{position:absolute;bottom:6px;font-family:var(--disp);font-weight:900;font-size:30px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);transform:skewX(8deg)}
.vs-l b{left:16px}.vs-r b{right:16px}
@keyframes vsL{from{transform:skewX(-8deg) translateX(-110%)}}
@keyframes vsR{from{transform:skewX(-8deg) translateX(110%)}}
.vs-mid{position:absolute;left:0;right:0;top:41%;text-align:center;z-index:2}
.vs-mid i{font-family:var(--disp);font-weight:900;font-style:italic;font-size:86px;color:var(--ye);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);animation:vsPop .5s .45s cubic-bezier(.2,1.8,.4,1) both;display:inline-block}
@keyframes vsPop{from{transform:scale(3);opacity:0}}
.vs-info{position:absolute;left:6%;right:6%;bottom:13%;padding:10px 14px;background:rgba(10,12,18,.9);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);text-align:center;animation:fadeUp .4s .6s both}
.vs-info small{display:block;font-size:12px;color:var(--mut)}
.vs-info strong{display:block;font-family:var(--disp);font-size:24px;letter-spacing:.06em}
.vs-info span{display:block;font-size:12px;color:#ffd9a8;margin-top:2px;line-height:1.4}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
.rnd{text-align:center;animation:rndIn .45s cubic-bezier(.2,1.6,.4,1)}
.rnd small{display:block;font-family:var(--disp);font-size:18px;letter-spacing:.4em;color:var(--ye);text-shadow:2px 2px 0 var(--ink)}
.rnd b{display:block;font-family:var(--disp);font-weight:900;font-size:96px;line-height:1;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--or)}
.rnd b i{font-style:normal;color:var(--mut)}
.rnd span{display:inline-block;margin-top:6px;font-weight:800;font-size:15px;background:var(--ink);padding:4px 12px}
.rnd.rnd-score b{font-size:76px}
@keyframes rndIn{from{transform:scale(2);opacity:0}}
.go-txt{font-family:var(--disp);font-weight:900;font-size:min(26vw,120px);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--or);transform:skewX(-10deg) rotate(-6deg);animation:goIn .7s ease-out both}
@keyframes goIn{0%{transform:skewX(-10deg) rotate(-6deg) scale(2.6);opacity:0}25%{transform:skewX(-10deg) rotate(-6deg) scale(1);opacity:1}80%{opacity:1}100%{transform:skewX(-10deg) rotate(-6deg) scale(1.15);opacity:0}}
.fin{text-align:center;animation:finIn .5s cubic-bezier(.2,1.6,.4,1) both;margin-top:-10vh}
.fin small{display:inline-block;font-family:var(--disp);font-size:16px;background:var(--ink);padding:3px 12px;letter-spacing:.1em}
.fin b{display:block;font-family:var(--disp);font-weight:900;font-size:min(17vw,84px);line-height:1.05;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--or);transform:skewX(-8deg)}
.fin.f-op b{text-shadow:6px 6px 0 var(--cy)}
.fin.f-burst b{color:#fff6c8}
.fin i{display:block;font-style:italic;font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.2em;color:var(--ye);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.fin em{display:inline-block;margin-top:6px;font-style:normal;font-family:var(--disp);font-weight:900;font-size:40px;color:var(--or);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;animation:ptsUp 1.2s .4s both}
.fin.f-op em{color:var(--cy)}
.fin.f-draw b{text-shadow:6px 6px 0 #4a5068}
@keyframes finIn{from{transform:scale(2.2) rotate(-6deg);opacity:0}}
@keyframes ptsUp{0%{transform:scale(0)}30%{transform:scale(1.3)}50%{transform:scale(1)}100%{transform:translateY(-30px);opacity:.0}}

.cutin{position:absolute;left:0;right:0;top:30%;height:30%;pointer-events:none;opacity:0;--c:#ff7a1a}
.cutin.show{opacity:1}
.cutin .band{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 85%,#000),var(--c));border-top:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:skewY(-6deg);display:flex;align-items:center;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.4)}
.cutin.show .band{animation:bandIn 1.45s cubic-bezier(.2,1,.3,1) both}
.cutin.right .band{flex-direction:row-reverse;transform:skewY(6deg)}
.cutin.right.show .band{animation-name:bandInR}
.cutin .band::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 22px);animation:speed .3s linear infinite}
@keyframes speed{to{background-position:-24px 0}}
@keyframes bandIn{0%{transform:skewY(-6deg) translateX(-100%)}18%{transform:skewY(-6deg) translateX(0)}82%{transform:skewY(-6deg) translateX(0);opacity:1}100%{transform:skewY(-6deg) translateX(30%);opacity:0}}
@keyframes bandInR{0%{transform:skewY(6deg) translateX(100%)}18%{transform:skewY(6deg) translateX(0)}82%{transform:skewY(6deg) translateX(0);opacity:1}100%{transform:skewY(6deg) translateX(-30%);opacity:0}}
.cmask{position:relative;flex:0 0 auto;height:100%;max-width:42%;aspect-ratio:240/280;border-right:5px solid var(--ink);overflow:hidden}
.cutin.right .cmask{border-right:0;border-left:5px solid var(--ink)}
.cmask svg{width:100%;height:100%;display:block}
.cname{flex:1;min-width:0;padding:0 14px;position:relative}
.cutin.right .cname{text-align:right}
.cname small{display:block;font-weight:900;font-size:14px;color:var(--ink);letter-spacing:.2em}
.cname b{display:block;white-space:nowrap;font-family:var(--disp);font-weight:900;font-size:min(15vw,72px);line-height:1.05;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);animation:nameSlam .4s .2s cubic-bezier(.2,1.8,.4,1) both}
.cname i{display:block;font-style:normal;font-weight:800;font-size:13px;color:var(--ink);margin-top:4px}
@keyframes nameSlam{from{transform:scale(2.4);opacity:0}}
.replaytag{position:absolute;left:50%;top:calc(78px + var(--st));transform:translateX(-50%);font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.3em;color:#fff;background:var(--rd);border:3px solid var(--ink);padding:2px 14px 2px 20px;box-shadow:3px 3px 0 var(--ink);display:none;text-align:center}
.replaytag small{display:block;font-size:10px;letter-spacing:.1em;font-family:var(--body)}
.replaytag.show{display:block;animation:blink 1.2s infinite}

@media (min-width:700px){
  .hud{max-width:760px;left:50%;transform:translateX(-50%)}
  .pname{font-size:17px}
  .spin{height:10px}
}
@media (min-aspect-ratio:4/3) and (max-height:520px){
  .logo{margin-top:4vh}
  .menu-list{margin-bottom:2vh;gap:8px}
  .mbtn{padding:8px 16px}
}

#scr-battle .hud,#scr-battle .pausebtn{transition:opacity .7s}
#scr-battle.cine .hud,#scr-battle.cine .pausebtn{opacity:0;pointer-events:none}
.codebox{display:block;width:100%;min-height:96px;margin-top:12px;padding:10px;background:#0b0c12;color:#dfe4ee;border:2px solid var(--line);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;resize:none;-webkit-user-select:text;user-select:text;touch-action:auto}
.confirm .err{min-height:18px;margin-top:6px;font-size:12px;color:#ff6a5a}
.btn.sm{min-width:0;padding:9px 14px;font-size:15px}
.note .pre-btns{margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui">
    <section id="scr-title" class="screen"></section>
    <section id="scr-menu" class="screen"></section>
    <section id="scr-league" class="screen"></section>
    <section id="scr-garage" class="screen"></section>
    <section id="scr-free" class="screen"></section>
    <section id="scr-settings" class="screen"></section>
    <section id="scr-credits" class="screen"></section>
    <section id="scr-battle" class="screen"></section>
    <div id="dialog" class="overlay"></div>
    <div id="modal" class="overlay"></div>
  </div>
</div>
<script>globalThis.CS=globalThis.CS||{};CS.VERSION="1.0.0";CS.STANDALONE=false;
/* 逆旋 COUNTERSPIN — 遊戲資料：零件、核心、場地、對手、劇情、解說 */
(function (CS) {
  'use strict';

  // ───────────────────────── 零件 ─────────────────────────
  // 刃環 ring：接觸形狀與重量；配重 disk：重量分布；軸尖 tip：移動方式；核心 core：旋向與必殺
  CS.PARTS = {
    // 刃環
    weld:   { id: 'weld', slot: 'ring', name: '焊鋒', mass: .32, r: 1.18, atk: 6, def: 5, sta: 4, spd: 5, stab: 5, lock: 3, recoil: 1.0, kbDeal: 1.1, dmgTaken: 1.0, spinHit: 1.0,
      shape: 'hook4', col: '#ff8a2a', col2: '#a8450c', col3: '#ffd0a0', pro: '四片勾爪，攻守都不差', con: '沒有特別突出的地方' },
    drum:   { id: 'drum', slot: 'ring', name: '圓鼓', mass: .38, r: 1.2, atk: 3, def: 7, sta: 5, spd: 4, stab: 6, lock: 4, recoil: .8, kbDeal: .85, dmgTaken: .85, spinHit: .9,
      shape: 'drum8', col: '#ffd23f', col2: '#a8801a', col3: '#fff1b0', pro: '外緣滾圓，被撞時力道會滑開', con: '自己撞人也撞不太痛' },
    claw:   { id: 'claw', slot: 'ring', name: '颱爪', mass: .33, r: 1.25, atk: 9, def: 3, sta: 3, spd: 6, stab: 4, lock: 2, recoil: 1.15, kbDeal: 1.35, dmgTaken: 1.05, spinHit: 1.1,
      shape: 'claw3', col: '#b6ff2e', col2: '#5e8f0c', col3: '#efffc0', pro: '三片巨爪，撞擊力最高', con: '反作用力大，自己也容易受傷' },
    mirror: { id: 'mirror', slot: 'ring', name: '鏡環', mass: .30, r: 1.17, atk: 7, def: 5, sta: 7, spd: 5, stab: 6, lock: 3, recoil: .95, kbDeal: 1.05, dmgTaken: .95, spinHit: .8,
      shape: 'mirror6', col: '#dcd2ff', col2: '#7d6fc0', col3: '#ffffff', pro: '六片鏡刃，攻擊與持久兼具', con: '重量輕，硬碰硬時吃虧' },
    fin:    { id: 'fin', slot: 'ring', name: '恆旋刃', ai: true, mass: .34, r: 1.18, atk: 7, def: 6, sta: 6, spd: 6, stab: 7, lock: 4, recoil: .9, kbDeal: 1.05, dmgTaken: .9, spinHit: .9,
      shape: 'fin5', col: '#f2f6ff', col2: '#6f86bd', col3: '#ffffff', pro: '恆旋集團量產規格', con: '' },
    anvil:  { id: 'anvil', slot: 'ring', name: '鐵砧', ai: true, mass: .46, r: 1.21, atk: 4, def: 8, sta: 4, spd: 2, stab: 7, lock: 5, recoil: .7, kbDeal: .9, dmgTaken: .7, spinHit: .85,
      shape: 'anvil', col: '#cf4a3a', col2: '#6e1f16', col3: '#ffb0a0', pro: '老鐵親手打的鐵砧', con: '' },

    // 配重

      if (cmds[i] === 'special' && t.core.special === 'foresee') {
        const oc = cmds[1 - i] === 'special' ? 'guard' : cmds[1 - i];
        C[i] = { cmd: CS.COUNTER_OF[oc], aim: C[i].aim, foresee: true };
        t.gauge = 0;
        S.foresee[i] = 2;
        ev.push({ type: 'special', i, sp: 'foresee' });
      }
    }
    for (let i = 0; i < 2; i++) {
      const t = S.tops[i], o = S.tops[1 - i];
      if (t.state !== 'spin') continue;
      const c = C[i];
      t.lastCmd = c.cmd;
      // 看穿：時刻表發動中（或剛發動）且出了剋制的那一手
      const oc = C[1 - i].cmd;
      t.read = (c.foresee || S.foresee[i] > 0) && oc !== 'special' && c.cmd === CS.COUNTER_OF[oc];
      if (t.read) { t.gauge = Math.min(100, t.gauge + 15); ev.push({ type: 'read', i }); }
      if (c.cmd !== 'special') S.history[i].push(c.cmd);
      t.smash = false; t.breakGuard = false; t.railTime = 0; t.rushT = 0; t.dashT = 0;
      if (c.cmd === 'rush') doRush(S, t, c.aim, 1, ev, i);
      else if (c.cmd === 'orbit') t.mode = 'orbit';
      else if (c.cmd === 'guard') t.mode = 'guard';
      else if (c.cmd === 'special') applySpecial(S, i, c.aim, ev);
    }
    if (log) S.roundLog.push({ step: S.stepNo, kind: 'cmd', C: orig });
    S.phase = 'action';
    S.exT = T.exchangeT;
    return ev;
  }
  function cloneCmd(c) { return { cmd: c.cmd, aim: c.aim ? { x: c.aim.x, y: c.aim.y } : null, foresee: !!c.foresee }; }

  function doRush(S, t, aim, mul, ev, i) {
    const a = norm(aim || { x: -t.x, y: -t.y });
    const mu = t.mu;
    const fz = t.frozen > 0 ? .55 : 1;
    const fromRail = t.mode === 'orbit' && t.tip.rail > 1.2 ? 1.12 : 1;
    const dash = (T.dashBase + T.dashSpd * t.def.spd) * (1 + T.dashMu * mu) * (.75 + .25 * t.tip.grip) * mul * fz * fromRail;
    t.vx = t.vx * .25 + a.x * dash;
    t.vy = t.vy * .25 + a.y * dash;
    t.aim = a; t.dashT = T.dashT; t.rushT = T.rushWindow; t.mode = 'rush';
    t.breakGuard = mu >= 2; t.rushMu = mu; t.mu = 0;
    ev.push({ type: 'rush', i, mu, x: t.x, y: t.y, ax: a.x, ay: a.y, breakGuard: t.breakGuard });
  }

  function applySpecial(S, i, aim, ev) {
    const t = S.tops[i], o = S.tops[1 - i];
    const sp = t.core.special;
    t.gauge = 0;
    ev.push({ type: 'special', i, sp });
    switch (sp) {
      case 'steal':
        t.mode = 'steal';
        if (t.def.unfinished) t.lock -= 14;
        break;
      case 'ironwall':
        t.mode = 'ironwall'; t.vx *= .1; t.vy *= .1;
        break;
      case 'typhoon':
        t.mu = Math.max(t.mu, 2);
        doRush(S, t, aim || predictAim(t, o), 1.0, ev, i);
        t.breakGuard = true;
        break;
      case 'stellar':
        t.s = Math.min(1, t.s + .22); t.w = 0; t.mode = 'stellar';
        break;
      case 'smash':
        doRush(S, t, aim || predictAim(t, o), 1.2, ev, i);
        t.smash = true;
        break;
      case 'freeze':
        o.frozen = 2; t.mode = 'orbit';
        break;
      case 'reflect':
        t.mode = 'reflect';
        break;
      case 'normalize':
        o.mu = 0; o.gauge = Math.max(0, o.gauge - 40); t.mode = 'guard';
        break;
    }
  }

  function predictAim(t, o) {
    const px = o.x + o.vx * .3, py = o.y + o.vy * .3;
    return norm({ x: px - t.x, y: py - t.y });
  }
  function norm(v) { const d = Math.hypot(v.x, v.y) || 1; return { x: v.x / d, y: v.y / d }; }

  // ───────── 機關：每一手開始前先決定（定格時預告）─────────
  function magnetPositions(S, k) {
    const base = k * Math.PI / 2 + Math.PI / 4;
    return [{ x: Math.cos(base) * 4.8, y: Math.sin(base) * 4.8 }, { x: -Math.cos(base) * 4.8, y: -Math.sin(base) * 4.8 }];
  }

  function rollGimmick(S) {
    const A = S.A, g = S.gim;
    const tele = { gim: g, text: null };
    if (g === 'wind') {
      const k = Math.floor(rnd(S) * 8);
      const a = k * Math.PI / 4;
      const str = 2.6 + rnd(S) * 1.6;
      A.wind = { x: Math.cos(a) * str, y: Math.sin(a) * str, a, str };
      tele.wind = A.wind;
    } else if (g === 'tilt') {
      // 每兩手來一班車
      const on = S.exchangeNo % 2 === 1;
      if (on) {
        const side = rnd(S) < .5 ? -1 : 1;
        A.tilt = { x: side * 3.8, y: 0, side };
      } else A.tilt = null;
      tele.tilt = A.tilt;
    } else if (g === 'tide') {
      A.tideCycle++;
      const pat = [0, 0, 1, 1, 1];  // 0 乾 1 淹
      A.tide = pat[A.tideCycle % pat.length];
      A.tideNext = pat[(A.tideCycle + 1) % pat.length];
      tele.tide = A.tide; tele.tideNext = A.tideNext;
    } else if (g === 'magnet') {
      A.magnets = magnetPositions(S, S.exchangeNo);
      tele.magnets = A.magnets;
    } else if (g === 'shrink') {
      A.Rt = Math.max(7.2, A.Rt - .45);
      A.railR = T.railR * (A.Rt / T.R);
      tele.R = A.Rt;
    }
    S.tele = tele;
    return tele;
  }

  // ───────── 每一步 ─────────
  function step(S, dt) {
    const ev = [];
    if (S.phase !== 'action' && S.phase !== 'finish') return ev;
    S.t += dt; S.stepNo++;
    const A = S.A;
    if (A.R !== A.Rt) { const d = A.Rt - A.R; A.R += clamp(d, -dt * 1.2, dt * 1.2); }
    for (let i = 0; i < 2; i++) integrate(S, i, dt, ev);
    collide(S, dt, ev);
    for (let i = 0; i < 2; i++) walls(S, i, dt, ev);
    stepDebris(S, dt, ev);
    if (S.phase === 'action') {
      S.exT -= dt;
      if (S.exT <= 0) endExchange(S, ev);
    } else if (S.phase === 'finish') {
      S.finishT += dt;
      if (S.finishT > 2.2) {
        S.phase = 'roundOver';
        const f = S.finish;
        if (!f.draw) S.score[f.winner] += CS.FINISH[f.type].pts;
        ev.push({ type: 'roundOver', finish: f });
      }
    }
    return ev;
  }

  function integrate(S, i, dt, ev) {
    const t = S.tops[i], o = S.tops[1 - i], A = S.A;
    t.stateT += dt;
    if (t.state === 'out') {
      t.x += t.vx * dt; t.y += t.vy * dt; t.z += t.vz * dt; t.vz -= 16 * dt;
      if (t.z < 0) { t.z = 0; t.vz = -t.vz * .3; t.vx *= .7; t.vy *= .7; if (Math.abs(t.vz) < .6) t.vz = 0; }
      t.ang += t.dir * (6 + 30 * t.s) * dt; t.s = Math.max(0, t.s - .3 * dt);
      return;
    }
    if (t.state === 'burst') return;
    if (t.state === 'fallen') {
      const k = Math.exp(-3 * dt); t.vx *= k; t.vy *= k;
      t.x += t.vx * dt; t.y += t.vy * dt;
      t.tiltA = Math.min(1, t.tiltA + dt * 2.2);
      t.ang += t.dir * 2 * (1 - t.tiltA) * dt;
      return;
    }
    const tip = t.tip;
    let r = Math.hypot(t.x, t.y); if (r < 1e-6) r = 1e-6;
    const ux = t.x / r, uy = t.y / r;
    let ax = 0, ay = 0;
    const R = A.R;
    const bowl = T.bowlK * Math.pow(Math.min(r / R, 1.2), 1.25) + T.centerK * tip.center * (r / R);
    const sp = Math.hypot(t.vx, t.vy);
    const fz = t.frozen > 0 ? .5 : 1;

    if (t.mode !== 'orbit') { ax -= ux * bowl; ay -= uy * bowl; }

    // 軸尖：花瓣漂移＋自走
    if (sp > .05) {
      const vx = t.vx / sp, vy = t.vy / sp;
      const turn = T.driftK * tip.drift * t.s * t.dir * (A.ice ? .6 : 1);
      ax += -vy * turn * sp; ay += vx * turn * sp;
      const vFree = T.freeV + T.freeVk * tip.prop * t.s;
      if (sp < vFree && t.mode !== 'guard' && t.mode !== 'ironwall') {
        const pa = T.propK * tip.prop * t.s * (A.ice ? .5 : 1) * fz;
        ax += vx * pa; ay += vy * pa;
      }
    } else if (tip.prop > .5 && t.s > .3 && t.mode === 'idle') {
      const a = rnd(S) * TAU; t.vx += Math.cos(a) * .3; t.vy += Math.sin(a) * .3;
    }

    // 齒輪軸尖：經過加速軌時會被咬一下
    if (tip.rail > 1.2 && t.mode === 'idle' && Math.abs(r - A.railR) < .5 && !A.tide) {
      const tx = -uy * t.dir, ty = ux * t.dir;
      ax += tx * 2.5 * A.railBoost; ay += ty * 2.5 * A.railBoost;
    }

    switch (t.mode) {
      case 'rush':
        if (t.dashT > 0) {
          const thr = T.thrust * (.7 + .3 * tip.grip) * fz;
          ax += t.aim.x * thr; ay += t.aim.y * thr; t.dashT -= dt;
        }
        if (t.disk.homing && t.rushT > .2 && o.state === 'spin') {
          // 輕量：衝刺途中修正方向
          const dx = o.x - t.x, dy = o.y - t.y, d = Math.hypot(dx, dy) || 1;
          const vx = t.vx / (sp || 1), vy = t.vy / (sp || 1);
          const cross = vx * dy / d - vy * dx / d;
          ax += -vy * cross * sp * t.disk.homing; ay += vx * cross * sp * t.disk.homing;
        }
        if (t.rushT > 0) t.rushT -= dt;
        break;
      case 'orbit': {
        const rr = A.railR;
        const dr = r - rr;
        const vr = t.vx * ux + t.vy * uy;
        ax -= ux * (dr * T.orbitSpring + vr * 2.6);
        ay -= uy * (dr * T.orbitSpring + vr * 2.6);
        const tx = -uy * t.dir, ty = ux * t.dir;
        const vt = t.vx * tx + t.vy * ty;
        const onRail = Math.abs(dr) < .75 && !A.tide;
        const vtMax = (T.orbitVt + T.orbitVtSpd * t.def.spd) * (1 + .08 * t.mu) * (onRail ? A.railBoost : .7) * fz;
        const acc = (onRail ? T.orbitAcc * tip.rail * A.railBoost : 3) * fz;
        if (vt < vtMax) { ax += tx * acc; ay += ty * acc; }
        else { ax -= tx * (vt - vtMax) * 2; ay -= ty * (vt - vtMax) * 2; }
        if (onRail && t.frozen <= 0 && vt > vtMax * .55) t.railTime += dt;
        break;
      }
      case 'guard': case 'reflect': {
        const kG = T.guardK * tip.center;
        ax -= t.x * kG; ay -= t.y * kG;
        break;
      }
      case 'steal': {
        if (o.state === 'spin') {
          const dx = o.x - t.x, dy = o.y - t.y, d = Math.hypot(dx, dy) || 1;
          ax += dx / d * 6.5; ay += dy / d * 6.5;
        }
        break;
      }
      case 'ironwall':
        t.vx *= Math.exp(-14 * dt); t.vy *= Math.exp(-14 * dt);
        break;
      case 'stellar': {
        if (o.state === 'spin') {
          const dx = o.x - t.x, dy = o.y - t.y, d = Math.hypot(dx, dy) || 1;
          const lim = 3.8;
          if (d < lim) { const f = 18 * (1 - d / lim); o.vx += dx / d * f * dt; o.vy += dy / d * f * dt; }
        }
        break;
      }
    }

    // 場地機關
    if (A.wind) { ax += A.wind.x; ay += A.wind.y; }
    if (A.tilt) { ax += A.tilt.x; ay += A.tilt.y; }
    if (A.magnets) {
      for (const m of A.magnets) {
        const dx = m.x - t.x, dy = m.y - t.y, d2 = dx * dx + dy * dy;
        if (d2 < 36) { const d = Math.sqrt(d2) + 1e-6; const a = 30 / (d2 + 5); ax += dx / d * a; ay += dy / d * a; }
      }
    }

    t.vx += ax * dt; t.vy += ay * dt;
    let damp = tip.damp * (A.ice ? .4 : 1);
    if (t.mode === 'guard' || t.mode === 'reflect') damp += T.guardDamp;
    if (A.tide && r > T.tideR * (A.R / T.R)) damp += 2.0;
    const k = Math.exp(-damp * dt);
    t.vx *= k; t.vy *= k;
    t.x += t.vx * dt; t.y += t.vy * dt;

    // 轉速
    const sta = clamp(t.def.sta, 0, 14);
    let drain = T.drain * tip.drain * (1 - .024 * sta);
    if (t.mode === 'orbit') drain *= .7;
    if (t.mode === 'guard') drain *= .9;
    drain += (t.mode === 'orbit' ? 0 : T.drainSpd * sp) + T.drainWob * t.w;
    if (S.gim === 'heat' && r < T.heatR && !t.core.heatproof) drain += T.heatDrain;
    if (A.tide && r > T.tideR * (A.R / T.R)) drain *= 1.5;
    if (t.frozen > 0) drain *= 1.3;
    if (A.ice) drain *= .85;
    t.s -= drain * dt;
    if (t.core.regen) t.s = Math.min(1, t.s + t.core.regen * dt);

    // 晃動
    const base = t.s < .26 ? (.26 - t.s) / .26 : 0;
    if (t.w > base) t.w = Math.max(base, t.w - (.3 + .05 * t.def.stab) * dt);
    else t.w = Math.min(base, t.w + .7 * dt);
    t.tiltDir += (2 + 10 * t.w) * dt;

    t.ang += t.dir * (5 + 55 * t.s) * dt;
    if (t.ang > 1e4 || t.ang < -1e4) t.ang %= TAU;

    if (t.s <= .012) fall(S, i, ev);
  }

  function effMass(t) {
    let m = .45 + .55 * t.mass;
    if (t.mode === 'guard') m *= T.guardMass * t.tip.guard;
    else if (t.mode === 'reflect') m *= 1.9;
    else if (t.mode === 'ironwall') m *= 6;
    m *= 1 - t.w * .35;
    return m;
  }

  // ───────── 碰撞 ─────────
  function collide(S, dt, ev) {
    const a = S.tops[0], b = S.tops[1];
    if (a.state !== 'spin' || b.state !== 'spin') return;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), rs = a.r + b.r;
    if (d >= rs || d < 1e-6) { a.contact = b.contact = false; return; }
    const nx = dx / d, ny = dy / d, tx = -ny, ty = nx;
    const ma = effMass(a), mb = effMass(b);
    const ia = 1 / ma, ib = 1 / mb, mred = 1 / (ia + ib);
    const pen = rs - d;
    a.x -= nx * pen * ia * mred; a.y -= ny * pen * ia * mred;
    b.x += nx * pen * ib * mred; b.y += ny * pen * ib * mred;

    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny, vtRel = rvx * tx + rvy * ty;
    const sameSpin = a.dir === b.dir;
    const stealing = a.mode === 'steal' || b.mode === 'steal';
    const slip = -vtRel + T.VR * (a.dir * a.s * a.r + b.dir * b.s * b.r);
    const fresh = !a.contact || vn < -1.2;
    a.contact = b.contact = true;

    let Jn = 0;
    if (vn < 0) Jn = -(1 + (stealing ? .1 : T.rest)) * vn * mred;
    if (fresh && !stealing) {
      const rep = (sameSpin ? T.repelSame : T.repelOpp) * Math.min(1, Math.abs(slip) / 10) * Math.sqrt(Math.max(0, Math.min(a.s, b.s))) * mred * 2;
      Jn += rep;
    }
    const mu = sameSpin && !stealing ? T.muSame : T.muOpp;
    let Jt = 0;
    if (Jn > 0) Jt = Math.sign(slip) * Math.min(mu * Jn, Math.abs(slip) * mred * .4);

    // 攻擊者判定
    const appA = a.vx * nx + a.vy * ny, appB = -(b.vx * nx + b.vy * ny);
    let kbA = 1, kbB = 1, reflA = 0, reflB = 0, broke = false;
    if (fresh && Jn > .3) {
      kbB *= a.ring.kbDeal; kbA *= b.ring.kbDeal;
      if (a.rushT > 0 && appA > 0) kbB *= T.kbRush * (a.smash ? 1.5 : 1) * (1 + .1 * (a.rushMu || 0));
      if (b.rushT > 0 && appB > 0) kbA *= T.kbRush * (b.smash ? 1.5 : 1) * (1 + .1 * (b.rushMu || 0));
      if (b.mode === 'orbit' && b.tip.rail < 1.2) kbB *= T.kbOrbit;
      if (a.mode === 'orbit' && a.tip.rail < 1.2) kbA *= T.kbOrbit;
      kbB *= (b.tip.kbMul || 1) / b.disk.kbResist; kbA *= (a.tip.kbMul || 1) / a.disk.kbResist;
      if (a.read) kbB *= 1.3; if (b.read) kbA *= 1.3;
      // 卸力反震
      const guardB = b.mode === 'guard' || b.mode === 'reflect' || b.mode === 'ironwall';
      const guardA = a.mode === 'guard' || a.mode === 'reflect' || a.mode === 'ironwall';
      if (guardB && a.rushT > 0 && appA > 0) {
        if (a.breakGuard && b.mode === 'guard') broke = true;
        else reflA = b.mode === 'ironwall' ? 1.6 : b.mode === 'reflect' ? 1.5 : T.reflect * b.tip.guard;
      }
      if (guardA && b.rushT > 0 && appB > 0) {
        if (b.breakGuard && a.mode === 'guard') broke = true;
        else reflB = a.mode === 'ironwall' ? 1.6 : a.mode === 'reflect' ? 1.5 : T.reflect * a.tip.guard;
      }
      if (stealing) { kbA = kbB = .4; reflA = reflB = 0; }
    }

    if (broke) { if (b.mode === 'guard') kbB *= 1.3; if (a.mode === 'guard') kbA *= 1.3; }
    const JnA = Jn * (kbA + reflA * T.reflImp), JnB = Jn * (kbB + reflB * T.reflImp);
    a.vx += (-JnA * nx - Jt * tx) * ia; a.vy += (-JnA * ny - Jt * ty) * ia;
    b.vx += (JnB * nx + Jt * tx) * ib; b.vy += (JnB * ny + Jt * ty) * ib;

    // 轉速損失
    const lossA = (T.spinN * Jn + T.spinT * Math.abs(Jt)) / (a.inertia * (1 + .04 * a.def.sta)) * a.ring.spinHit;
    const lossB = (T.spinN * Jn + T.spinT * Math.abs(Jt)) / (b.inertia * (1 + .04 * b.def.sta)) * b.ring.spinHit;
    a.s -= lossA * (reflB ? .6 : 1); b.s -= lossB * (reflA ? .6 : 1);

    // 逆旋摩擦：轉速往中間拉平；奪旋強制吸走
    if (!sameSpin || stealing) {
      const ka = 1 / a.inertia, kb = 1 / b.inertia;
      const diff = a.s - b.s;
      if (stealing) {
        const thief = a.mode === 'steal' ? a : b, vic = thief === a ? b : a;
        const amt = Math.min(vic.s, (thief.def.unfinished ? .03 : .045) * dt);
        vic.s -= amt; thief.s = Math.min(1, thief.s + amt * .8);
      } else {
        const tr = diff * T.eqRate * dt;
        a.s -= tr * ka / (ka + kb) * 2; b.s += tr * kb / (ka + kb) * 2;
      }
      if (!fresh || stealing) ev.push({ type: 'grind', x: a.x + nx * a.r, y: a.y + ny * a.r, nx, ny, rate: Math.abs(diff) + (stealing ? .5 : .1), steal: stealing });
    }

    if (fresh && Jn > .5) {
      const imp = Jn + .4 * Math.abs(Jt);
      const sm = sameSpin ? 1.25 : .8;
      const base = T.dmg * Math.pow(imp, T.dmgPow) * sm;
      const attA = a.rushT > 0 && appA > 0, attB = b.rushT > 0 && appB > 0;
      let dB = base * Math.pow((4 + a.def.atk) / (4 + b.def.def), T.atkPow) * b.ring.dmgTaken * (attA ? 1.15 : .7);
      let dA = base * Math.pow((4 + b.def.atk) / (4 + a.def.def), T.atkPow) * a.ring.dmgTaken * (attB ? 1.15 : .7);
      if (attA) { dA *= a.ring.recoil; dB *= 1 + .15 * (a.rushMu || 0); }
      if (attB) { dB *= b.ring.recoil; dA *= 1 + .15 * (b.rushMu || 0); }
      if (b.mode === 'guard') dB *= .45; if (a.mode === 'guard') dA *= .45;
      if (a.mode === 'guard' && b.mode === 'guard') { dA *= .3; dB *= .3; }
      if (imp < 1.5) { dA *= imp / 1.5 * .3; dB *= imp / 1.5 * .3; }
      if (b.mode === 'ironwall') dB *= .3; if (a.mode === 'ironwall') dA *= .3;
      if (b.mode === 'reflect') { dB *= .4; dA *= 1.3; } if (a.mode === 'reflect') { dA *= .4; dB *= 1.3; }
      if (reflA) dA *= 1.4; if (reflB) dB *= 1.4;
      if (broke) { if (b.mode === 'guard') dB *= 1.35; if (a.mode === 'guard') dA *= 1.35; }
      if (a.read) dB *= 1.3; if (b.read) dA *= 1.3;
      if (stealing) { dA *= .3; dB *= .3; }
      a.lock -= dA; b.lock -= dB;
      a.hits++; b.hits++;

        for (let i = 0; i < 16; i++) spark(R, e.x, e.y, .4, e.ux * (6 + Math.random() * 6) + (Math.random() - .5) * 4, e.uy * (6 + Math.random() * 6) + (Math.random() - .5) * 4, 3 + Math.random() * 4, .5, '#ffffff', 2);
        flash(R, .35);
        R.crowdJump = 1;
        break;
      }
      case 'fall': {
        const t = S.tops[e.i];
        for (let i = 0; i < 5; i++) puff(R, t.x, t.y, .1, 1.2, 'rgba(210,200,180,.5)', .9);
        break;
      }
      case 'debrisBounce': {
        if (Math.random() < .5) for (let i = 0; i < 3; i++) spark(R, e.x, e.y, .1, (Math.random() - .5) * 4, (Math.random() - .5) * 4, 1 + Math.random() * 2, .25, '#ffe0a0', 1.5);
        break;
      }
    }
  }

  function updateFx(R, dt, dtSim) {
    R.time += dt;
    const ps = R.parts;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      p.life -= dt;
      if (p.life <= 0) { ps.splice(i, 1); continue; }
      const d = p.k === 's' ? dtSim * .8 + dt * .2 : dt;
      p.x += p.vx * d; p.y += p.vy * d; p.z += p.vz * d;
      if (p.k === 's') { p.vz -= 18 * d; if (p.z < 0) { p.z = 0; p.vz *= -.3; p.vx *= .6; p.vy *= .6; } const k = Math.exp(-2 * d); p.vx *= k; p.vy *= k; }
      else { const k = Math.exp(-1.5 * d); p.vx *= k; p.vy *= k; }
    }
    for (let i = R.rings.length - 1; i >= 0; i--) { const r = R.rings[i]; r.life -= dt; if (r.life <= 0) R.rings.splice(i, 1); }
    for (let i = R.texts.length - 1; i >= 0; i--) { const t = R.texts[i]; t.life -= dt; t.z += t.vz * dt; if (t.life <= 0) R.texts.splice(i, 1); }
    if (R.lines) { R.lines.t -= dt; if (R.lines.t <= 0) R.lines = null; }
    R.flash = Math.max(0, R.flash - dt * 2.8);
    R.crowdJump = Math.max(0, R.crowdJump - dt * 1.4);
    R.lightning = Math.max(0, R.lightning - dt * 3);
    R.cam.shake = Math.max(0, R.cam.shake - dt * 40);
    R.cam.sx = (Math.random() - .5) * R.cam.shake; R.cam.sy = (Math.random() - .5) * R.cam.shake;
  }

  // ───────── 繪製 ─────────
  function frame(R, S, dt, dtSim, timeScale) {
    const g = R.ctx, c = R.cam;
    updateFx(R, dt, dtSim);
    ambientUpdate(R, dt, S);
    g.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
    drawBackground(R, g);
    drawStadiumBack(R, g, S);
    drawFloorFx(R, g, S);
    // 陰影
    if (S) {
      for (let i = 0; i < 2; i++) drawShadow(R, g, S.tops[i], i);
      for (const p of S.debris) drawDebrisShadow(R, g, p);
    }
    drawRings(R, g);
    drawPuffs(R, g);
    // 依深度排序的物件
    const items = [];
    if (S) {
      for (let i = 0; i < 2; i++) { const t = S.tops[i]; if (t.state === 'burst') continue; const p = proj(R, t.x, t.y, 0); items.push({ y: p.y, k: 't', i, near: t.state === 'out' && t.z > .4 }); }
      S.debris.forEach((d, j) => { const p = proj(R, d.x, d.y, 0); items.push({ y: p.y, k: 'd', d, near: d.z > .9 }); });
    }
    items.sort((a, b) => a.y - b.y);
    for (const it of items) if (!it.near) drawItem(R, g, S, it, dtSim, timeScale);
    drawStadiumFront(R, g, S);
    for (const it of items) if (it.near) drawItem(R, g, S, it, dtSim, timeScale);
    drawParticles(R, g);
    drawFg(R, g);
    if (S) drawMarkers(R, g, S);
    drawTexts(R, g);
    drawOverlays(R, g);
  }

  function drawItem(R, g, S, it, dtSim, timeScale) {
    if (it.k === 't') drawTop(R, g, S.tops[it.i], it.i, dtSim, timeScale, S);
    else drawDebris(R, g, it.d);
  }

  function drawBackground(R, g) {
    const c = R.cam;
    if (!R.bg) { g.fillStyle = '#111'; g.fillRect(0, 0, R.W, R.H); return; }
    const bw = R.bg.width, zk = 1 + (c.zoom / c.zFit - 1) * .12;
    const off = (bw - R.W) / 2 - c.yaw * R.W * .55 - (c.x / 10) * R.W * .04;
    const jump = R.crowdJump * 6;
    g.save();
    g.translate(R.W / 2, R.H * .5); g.scale(zk, zk); g.translate(-R.W / 2, -R.H * .5);
    g.drawImage(R.bg, -clamp(off, 0, bw - R.W), -jump - (c.y / 10) * 8, bw, R.H);
    g.restore();
    if (R.lightning > 0) { g.fillStyle = `rgba(220,235,255,${R.lightning * .5})`; g.fillRect(0, 0, R.W, R.H); }
  }

  function drawFg(R, g) {
    if (!R.fgCrowd) return;
    const c = R.cam, H = R.H, W = R.W, A = R.arena, tm = R.time, jump = R.crowdJump;
    const ox = -c.yaw * W * .9;
    g.save();
    for (const m of R.fgCrowd) {
      const base = m.row ? H - 8 * m.s : H - 46 * m.s;
      const bob = Math.abs(Math.sin(tm * m.sp + m.ph)) * (2 + jump * 16) * m.s;
      const x = m.x + ox, y = base - bob, hs = 26 * m.s;
      if (x < -60 || x > W + 60) continue;
      // 手臂與應援物
      if (m.arm || jump > .3) {
        const sw = Math.sin(tm * (m.sp + 1) + m.ph) * .35;
        const hx = x + hs * .9 + Math.sin(sw) * hs * 1.4, hy = Math.max(H - 168, y - hs * 2.3 - jump * 10);
        g.strokeStyle = m.col; g.lineWidth = hs * .38; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x + hs * .7, y - hs * .4); g.lineTo(hx, hy); g.stroke();
        if (m.stick) {
          g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = m.stick; g.lineWidth = hs * .22; g.globalAlpha = .85;
          g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx + Math.sin(sw) * hs * .9, hy - hs * 1.3); g.stroke(); g.restore();
        }
        if (m.sign) {
          g.save(); g.translate(hx, hy - hs * .9); g.rotate(sw * .4);
          g.font = `900 ${Math.round(hs * .62)}px ${CS.FONT_STACK}`;
          const tw = g.measureText(m.sign).width + hs * .5;
          g.fillStyle = '#f6f0e4'; g.strokeStyle = '#0c0d14'; g.lineWidth = 2.5;
          g.fillRect(-tw / 2, -hs * .5, tw, hs); g.strokeRect(-tw / 2, -hs * .5, tw, hs);
          g.fillStyle = '#ff5a1f'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(m.sign, 0, hs * .04);
          g.restore();
        }
      }
      // 身體＋頭
      g.fillStyle = m.col;
      g.beginPath(); g.ellipse(x, y + hs * 1.25, hs * 1.6, hs * 1.2, 0, Math.PI, 0); g.fill();
      g.beginPath(); g.arc(x, y - hs * .2, hs * .82, 0, TAU); g.fill();
      // 輪廓光
      g.strokeStyle = CS.ArenaArt.hexA(A.accent, m.row ? .75 : .5); g.lineWidth = Math.max(2, hs * .11);
      g.beginPath(); g.arc(x, y - hs * .2, hs * .82, -2.7, -1.2); g.stroke();
      g.beginPath(); g.ellipse(x, y + hs * 1.25, hs * 1.6, hs * 1.2, 0, -2.9, -2.1); g.stroke();
    }
    g.restore();
  }

  function wallSeg(R, a0, a1, rIn, rOut, z0, z1) { // 多邊形四點（世界）
    return [proj(R, Math.cos(a0) * rIn, Math.sin(a0) * rIn, z0), proj(R, Math.cos(a1) * rIn, Math.sin(a1) * rIn, z0), proj(R, Math.cos(a1) * rOut, Math.sin(a1) * rOut, z1), proj(R, Math.cos(a0) * rOut, Math.sin(a0) * rOut, z1)];
  }
  function poly(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath(); }

  function inGap(A, a) {
    for (const gp of A.gaps) {
      const d = Math.abs(((a - gp.a * D) % TAU + TAU + Math.PI) % TAU - Math.PI);
      if (d < gp.hw * D) return true;
    }
    return false;
  }

  function segments(R) {
    const A = R.arena, n = 120, out = [];
    const cs = Math.cos(R.cam.yaw), sn = Math.sin(R.cam.yaw);
    for (let k = 0; k < n; k++) {
      const a0 = k / n * TAU, a1 = (k + 1) / n * TAU, am = (a0 + a1) / 2;
      const ry = Math.cos(am) * 10 * sn + Math.sin(am) * 10 * cs;
      out.push({ a0, a1, am, gap: inGap(A, am), far: ry < 0, ry });
    }
    return out;
  }

  function drawStadiumBack(R, g, S) {
    const c = R.cam, A = R.arena;
    if (!A) return;
    const segs = segments(R);
    R._segs = segs;
    // 場地外殼底座陰影
    const pc = proj(R, 0, 0, -BASE_H);
    g.save(); g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.ellipse(pc.x, pc.y + 8, (10 + LIP + .6) * c.zoom, (10 + LIP + .6) * c.zoom * c.cosT, 0, 0, TAU); g.fill(); g.restore();
    // 底座側面（近側可見）
    const rO = 10 + LIP;
    for (const s of segs) {
      if (s.far) continue;
      const pts = wallSeg(R, s.a0, s.a1, rO, rO, WALL_H, -BASE_H);
      const sh = .5 + .5 * Math.abs(Math.sin(s.am + c.yaw));
      g.fillStyle = CS.Art.shade(A.rim2, (sh - .6) * .5);
      poly(g, pts); g.fill();
    }
    // 地板
    const f = R.floor;
    g.save();
    const o = proj(R, 0, 0, 0);
    g.setTransform(R.dpr * c.zoom * Math.cos(c.yaw), R.dpr * c.zoom * c.cosT * Math.sin(c.yaw), -R.dpr * c.zoom * Math.sin(c.yaw), R.dpr * c.zoom * c.cosT * Math.cos(c.yaw), o.x * R.dpr, o.y * R.dpr);
    const wr = f.wr;
    g.drawImage(f.canvas, -wr, -wr, wr * 2, wr * 2);
    g.restore();
    // 出界口滑道（往外延伸的暗色舌頭）
    for (const gp of A.gaps) {
      const a0 = (gp.a - gp.hw) * D, a1 = (gp.a + gp.hw) * D;
      const pts = [proj(R, Math.cos(a0) * 10, Math.sin(a0) * 10, 0), proj(R, Math.cos(a1) * 10, Math.sin(a1) * 10, 0), proj(R, Math.cos(a1) * (rO + .4), Math.sin(a1) * (rO + .4), -.5), proj(R, Math.cos(a0) * (rO + .4), Math.sin(a0) * (rO + .4), -.5)];
      g.fillStyle = '#16161c'; poly(g, pts); g.fill();
    }
    // 遠側內牆
    for (const s of segs) {
      if (!s.far || s.gap) continue;
      const pts = wallSeg(R, s.a0, s.a1, 10, 10, 0, WALL_H);
      const facing = clamp(-s.ry / 10, 0, 1);
      g.fillStyle = CS.Art.shade(A.rim, -.15 + facing * .2);
      poly(g, pts); g.fill();
      // 牆面網點條紋
      if (s.a0 * 20 % 2 < 1) { g.fillStyle = 'rgba(0,0,0,.12)'; poly(g, pts); g.fill(); }
    }
    // 遠側牆頂
    drawLips(R, g, segs, true);
  }

  function drawLips(R, g, segs, far) {
    const A = R.arena, c = R.cam;
    for (const s of segs) {
      if (s.far !== far || s.gap) continue;
      const pts = wallSeg(R, s.a0, s.a1, 10, 10 + LIP, WALL_H, WALL_H);
      g.fillStyle = CS.Art.shade(A.rim, .22);
      poly(g, pts); g.fill();
    }
    // 出界口兩側的警示塊
    for (const gp of A.gaps) {
      for (const sgn of [-1, 1]) {
        const a = (gp.a + sgn * (gp.hw + 2.2)) * D;
        const pry = Math.cos(a) * 10 * Math.sin(c.yaw) + Math.sin(a) * 10 * Math.cos(c.yaw);
        if ((pry < 0) !== far) continue;
        const a0 = a - 2.2 * D, a1 = a + 2.2 * D;
        const pts = wallSeg(R, a0, a1, 9.98, 10 + LIP + .02, WALL_H + .02, WALL_H + .02);
        g.fillStyle = '#ffd23f'; poly(g, pts); g.fill(); g.lineWidth = 1.5; g.strokeStyle = K; g.stroke();
        const front = wallSeg(R, a0, a1, 10 + LIP, 10 + LIP, WALL_H, 0);
        if (!far) { g.fillStyle = '#16161a'; poly(g, front); g.fill(); }
      }
    }
    // 牆頂外緣線
    g.lineWidth = Math.max(1.5, c.zoom * .08); g.strokeStyle = K;
    g.beginPath();
    let open = false;
    for (const s of segs) {
      if (s.far !== far || s.gap) { open = false; continue; }
      const p0 = proj(R, Math.cos(s.a0) * 10, Math.sin(s.a0) * 10, WALL_H), p1 = proj(R, Math.cos(s.a1) * 10, Math.sin(s.a1) * 10, WALL_H);
      if (!open) { g.moveTo(p0.x, p0.y); open = true; }
      g.lineTo(p1.x, p1.y);
    }
    g.stroke();
  }

  function drawStadiumFront(R, g, S) {
    const A = R.arena, c = R.cam;
    if (!A) return;
    const segs = R._segs;
    const rO = 10 + LIP;
    // 近側外牆（擋住靠近邊緣的東西）
    for (const s of segs) {
      if (s.far || s.gap) continue;
      const pts = wallSeg(R, s.a0, s.a1, rO, rO, WALL_H, 0);
      const sh = Math.abs(Math.cos(s.am + c.yaw));
      g.fillStyle = CS.Art.shade(A.rim, -.25 - sh * .1);
      poly(g, pts); g.fill();
    }
    drawLips(R, g, segs, false);
    // 底座正面的聯賽名牌
    const fa = Math.PI / 2 - c.yaw;
    const front = proj(R, Math.cos(fa) * rO, Math.sin(fa) * rO, -BASE_H * .45);
    const sc = c.zoom / 22;
    if (sc > .3) {
      g.save(); g.translate(front.x, front.y); g.scale(sc, sc);
      const tier2 = A.id === 'arenaA' || A.id === 'arenaB' || A.id === 'summit';
      const label = tier2 ? '恆旋盃　PERPETUA CUP' : '底艙聯賽　UNDERHULL';
      g.font = `900 18px ${CS.FONT_STACK}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      const hw = g.measureText(label).width / 2 + 22;
      g.fillStyle = A.accent; g.strokeStyle = K; g.lineWidth = 3;
      g.beginPath(); g.moveTo(-hw, -15); g.lineTo(hw, -15); g.lineTo(hw - 9, 15); g.lineTo(-hw + 9, 15); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = K; g.fillText(label, 0, 1);
      g.restore();
    }
    // 縮圈：內圈護欄
    if (S && S.A.R < 9.95) {
      const Rr = S.A.R;
      g.lineWidth = Math.max(2, c.zoom * .25);
      for (const s of segs) {
        if (s.gap) continue;
        const p0 = proj(R, Math.cos(s.a0) * Rr, Math.sin(s.a0) * Rr, .35), p1 = proj(R, Math.cos(s.a1) * Rr, Math.sin(s.a1) * Rr, .35);
        g.strokeStyle = (Math.floor(s.a0 / TAU * 60) % 2) ? '#ffd23f' : '#16161a';
        g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.stroke();
      }
    }
  }

  // 地板上的動態效果（機關、預告）
  function drawFloorFx(R, g, S) {
    if (!S) return;
    const A = S.A, c = R.cam, t = R.time;
    g.save();
    const o = proj(R, 0, 0, 0);
    g.setTransform(R.dpr * c.zoom * Math.cos(c.yaw), R.dpr * c.zoom * c.cosT * Math.sin(c.yaw), -R.dpr * c.zoom * Math.sin(c.yaw), R.dpr * c.zoom * c.cosT * Math.cos(c.yaw), o.x * R.dpr, o.y * R.dpr);
    if (S.gim === 'heat') {
      const pulse = .55 + .25 * Math.sin(t * 3);
      const hg = g.createRadialGradient(0, 0, 0, 0, 0, CS.TUNE.heatR * 1.25);
      hg.addColorStop(0, `rgba(255,200,90,${pulse})`); hg.addColorStop(.6, `rgba(255,90,30,${pulse * .6})`); hg.addColorStop(1, 'rgba(255,60,20,0)');
      g.globalCompositeOperation = 'lighter'; g.fillStyle = hg; g.beginPath(); g.arc(0, 0, CS.TUNE.heatR * 1.25, 0, TAU); g.fill();
      g.globalCompositeOperation = 'source-over';
    }
    if (S.gim === 'tide') {
      const lvl = R._tide = lerp(R._tide || 0, A.tide ? 1 : 0, .04);
      if (lvl > .02) {
        const r0 = CS.TUNE.tideR;
        g.fillStyle = `rgba(40,90,140,${.45 * lvl})`;
        g.beginPath(); g.arc(0, 0, 10, 0, TAU); g.arc(0, 0, r0, 0, TAU, true); g.fill('evenodd');
        g.strokeStyle = `rgba(200,235,255,${.5 * lvl})`; g.lineWidth = .06;
        for (let k = 0; k < 3; k++) { const rr = r0 + .4 + ((t * .6 + k * .9) % 2.6); g.beginPath(); g.arc(0, 0, rr, 0, TAU); g.stroke(); }
      }
      if (A.tideNext && !A.tide && S.phase === 'freeze') {
        g.strokeStyle = `rgba(120,200,255,${.5 + .3 * Math.sin(t * 6)})`; g.lineWidth = .12; g.setLineDash([.4, .3]);
        g.beginPath(); g.arc(0, 0, CS.TUNE.tideR, 0, TAU); g.stroke(); g.setLineDash([]);
      }
    }
    if (A.wind) {
      const w = A.wind, a = Math.atan2(w.y, w.x);
      const alpha = S.phase === 'freeze' ? .55 + .2 * Math.sin(t * 5) : .22;
      g.save(); g.rotate(a); g.fillStyle = `rgba(182,255,46,${alpha})`; g.strokeStyle = `rgba(0,0,0,${alpha})`; g.lineWidth = .08;
      for (let k = -1; k <= 1; k++) {
        const ox = ((t * 3 + k * 3) % 9) - 4.5;
        g.beginPath(); g.moveTo(ox - 1.6, k * 2.6 - .35); g.lineTo(ox + .6, k * 2.6 - .35); g.lineTo(ox + .6, k * 2.6 - .9); g.lineTo(ox + 1.8, k * 2.6); g.lineTo(ox + .6, k * 2.6 + .9); g.lineTo(ox + .6, k * 2.6 + .35); g.lineTo(ox - 1.6, k * 2.6 + .35); g.closePath(); g.fill(); g.stroke();
      }
      g.restore();
    }
    if (A.tilt) {
      const side = A.tilt.side;
      const tg = g.createLinearGradient(-10 * side, 0, 10 * side, 0);
      tg.addColorStop(0, 'rgba(0,0,0,0)'); tg.addColorStop(1, `rgba(232,189,85,${.25 + .1 * Math.sin(t * 8)})`);
      g.fillStyle = tg; g.beginPath(); g.arc(0, 0, 10, 0, TAU); g.fill();
      g.fillStyle = `rgba(232,189,85,.7)`;
      for (let k = 0; k < 3; k++) { const ox = side * (2 + k * 2.2); g.beginPath(); g.moveTo(ox, -1); g.lineTo(ox + side * 1.2, 0); g.lineTo(ox, 1); g.closePath(); g.fill(); }
    }
    if (A.magnets) {
      for (const m of A.magnets) {
        g.strokeStyle = 'rgba(61,139,255,.75)'; g.lineWidth = .1;
        for (let k = 0; k < 3; k++) { const rr = ((t * 1.2 + k * .8) % 2.4) + .4; g.globalAlpha = 1 - rr / 2.8; g.beginPath(); g.arc(m.x, m.y, rr, 0, TAU); g.stroke(); }
        g.globalAlpha = 1;
        const mg = g.createRadialGradient(m.x, m.y, 0, m.x, m.y, 1.1); mg.addColorStop(0, '#d8ecff'); mg.addColorStop(.4, '#3d8bff'); mg.addColorStop(1, 'rgba(61,139,255,0)');
        g.fillStyle = mg; g.beginPath(); g.arc(m.x, m.y, 1.1, 0, TAU); g.fill();
      }
    }
    if (S.gim === 'rail') {
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = `rgba(182,255,46,${.25 + .15 * Math.sin(t * 4)})`; g.lineWidth = .5;
      g.beginPath(); g.arc(0, 0, A.railR, 0, TAU); g.stroke();
      g.globalCompositeOperation = 'source-over';
    }
    // 迴旋中：加速軌發光
    for (let i = 0; i < 2; i++) {
      const tp = S.tops[i];
      if (tp.mode === 'orbit' && tp.state === 'spin') {
        const a = Math.atan2(tp.y, tp.x);
        g.globalCompositeOperation = 'lighter';
        g.strokeStyle = R.teamCol[i]; g.globalAlpha = .55; g.lineWidth = .35;
        g.beginPath(); g.arc(0, 0, A.railR, a - tp.dir * .9, a, tp.dir < 0); g.stroke();
        g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      }
    }
    // 突擊瞄準預覽
    if (R.preview) drawPreview(R, g, S);
    g.restore();
  }

  function drawPreview(R, g, S) {
    const pv = R.preview;
    if (pv.kind === 'aim' || pv.kind === 'launch') {
      const pts = pv.path;
      if (!pts || pts.length < 2) return;
      const col = pv.kind === 'launch' ? (pv.zone === 'perfect' ? '#b6ff2e' : pv.zone === 'over' ? '#ff6a4a' : '#ffffff') : '#ff7a1a';
      g.lineCap = 'round';
      g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = .42; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.stroke();
      g.strokeStyle = col; g.lineWidth = .24; g.setLineDash([.5, .35]); g.lineDashOffset = -R.time * 2;
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.stroke(); g.setLineDash([]);
      const e = pts[pts.length - 1], e2 = pts[pts.length - 2], a = Math.atan2(e.y - e2.y, e.x - e2.x);
      g.fillStyle = col; g.beginPath(); g.moveTo(e.x + Math.cos(a) * .7, e.y + Math.sin(a) * .7); g.lineTo(e.x + Math.cos(a + 2.4) * .6, e.y + Math.sin(a + 2.4) * .6); g.lineTo(e.x + Math.cos(a - 2.4) * .6, e.y + Math.sin(a - 2.4) * .6); g.closePath(); g.fill();
      g.lineWidth = .08; g.strokeStyle = K; g.stroke();
    } else if (pv.kind === 'orbit') {
      const t = S.tops[0];
      g.strokeStyle = 'rgba(182,255,46,.7)'; g.lineWidth = .3; g.setLineDash([.6, .4]); g.lineDashOffset = R.time * 3 * t.dir;
      g.beginPath(); g.arc(0, 0, S.A.railR, 0, TAU); g.stroke(); g.setLineDash([]);
    } else if (pv.kind === 'guard') {
      const t = S.tops[0];
      g.strokeStyle = 'rgba(95,200,255,.75)'; g.lineWidth = .18; g.setLineDash([.4, .3]);
      g.beginPath(); g.moveTo(t.x, t.y); g.lineTo(0, 0); g.stroke(); g.setLineDash([]);

  }

  function drawShadow(R, g, t, i) {
    if (t.state === 'burst') return;
    const c = R.cam, p = proj(R, t.x + .25, t.y + .35, 0);
    const k = 1 / (1 + t.z * .4);
    const rx = t.r * c.zoom * 1.05 * k;
    g.fillStyle = `rgba(0,0,0,${.35 * k})`;
    g.beginPath(); g.ellipse(p.x, p.y, rx, rx * c.cosT, 0, 0, TAU); g.fill();
    if (t.state === 'spin' && t.z < .1) {
      const q = proj(R, t.x, t.y, 0);
      g.strokeStyle = R.teamCol[i]; g.globalAlpha = .55; g.lineWidth = Math.max(1.5, c.zoom * .08);
      g.beginPath(); g.ellipse(q.x, q.y, t.r * c.zoom * 1.22, t.r * c.zoom * 1.22 * c.cosT, 0, 0, TAU); g.stroke(); g.globalAlpha = 1;
    }
  }

  function drawDebrisShadow(R, g, d) {
    const c = R.cam, p = proj(R, d.x + .15, d.y + .2, 0);
    g.fillStyle = 'rgba(0,0,0,.3)';
    g.beginPath(); g.ellipse(p.x, p.y, .5 * c.zoom, .5 * c.zoom * c.cosT, 0, 0, TAU); g.fill();
  }

  function drawRings(R, g) {
    const c = R.cam;
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const r of R.rings) {
      const k = 1 - r.life / r.max, rr = lerp(r.r0, r.r1, 1 - Math.pow(1 - k, 2));
      const p = proj(R, r.x, r.y, .05);
      g.globalAlpha = 1 - k; g.strokeStyle = r.col; g.lineWidth = r.w * (1 - k * .5);
      g.beginPath(); g.ellipse(p.x, p.y, rr * c.zoom, rr * c.zoom * c.cosT, 0, 0, TAU); g.stroke();
    }
    g.restore();
  }

  function drawTop(R, g, t, i, dtSim, timeScale, S) {
    const c = R.cam, sp = R.tops[i];
    if (!sp) return;
    const vis = R.vis[i];
    const spinAng = t.dir * (5 + 58 * Math.max(0, t.s));
    vis.a += spinAng * dtSim;
    const realOmega = Math.abs(spinAng) * timeScale;
    const blurK = clamp((realOmega - 9) / 18, 0, 1);
    // 殘影軌跡
    const speed = Math.hypot(t.vx, t.vy);
    vis.trail.push({ x: t.x, y: t.y, z: t.z });
    if (vis.trail.length > 8) vis.trail.shift();
    const fall = t.state === 'fallen' ? t.tiltA : 0;
    const pz = t.z + FACE_Z * (1 - fall * .55);
    const P = proj(R, t.x, t.y, pz);
    const rpx = t.r * c.zoom;
    // 速度線
    if (speed > 6 && t.state === 'spin' && vis.trail.length > 3) {
      const a0 = vis.trail[0];
      const p0 = proj(R, a0.x, a0.y, pz);
      g.save(); g.globalCompositeOperation = 'lighter';
      const dx = P.x - p0.x, dy = P.y - p0.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
      for (const off of [-.7, 0, .7]) {
        const lg = g.createLinearGradient(p0.x, p0.y, P.x, P.y);
        lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(1, off === 0 ? R.teamCol[i] : 'rgba(255,255,255,.6)');
        g.strokeStyle = lg; g.lineWidth = off === 0 ? rpx * .5 : rpx * .12;
        g.beginPath(); g.moveTo(p0.x + nx * off * rpx - dx * .6, p0.y + ny * off * rpx - dy * .6); g.lineTo(P.x + nx * off * rpx * .7, P.y + ny * off * rpx * .7); g.stroke();
      }
      g.restore();
    }
    // 側面厚度與軸尖
    const th = .44 * c.zoom * c.sinT * (1 - fall * .6);
    const wob = t.state === 'spin' ? clamp(t.w, 0, 1) : 0;
    const prec = t.tiltDir || 0;
    const ox = Math.cos(prec) * wob * rpx * .18, oy = Math.sin(prec) * wob * rpx * .1;
    const tipBase = proj(R, t.x, t.y, t.z + .08);
    const tw = rpx * .6;
    CS.Art.drawTipSide(g, P.x + ox * .5, P.y + th, tw, Math.max(4, tipBase.y - (P.y + th)) / .9, sp.tip);
    g.save();
    g.translate(P.x + ox, P.y + oy);
    if (fall > 0) { g.rotate(fall * .9 * (i ? -1 : 1)); }
    g.beginPath(); g.ellipse(0, th, rpx, rpx * c.cosT, 0, 0, Math.PI); g.ellipse(0, 0, rpx, rpx * c.cosT, 0, Math.PI, 0, true); g.closePath();
    g.fillStyle = CS.Art.shade(sp.ring.col2, -.15); g.fill();
    g.lineWidth = Math.max(1.5, rpx * .06); g.strokeStyle = K; g.stroke();
    g.restore();
    // 正面（離屏合成：旋轉圖層＋固定光影）
    const oc = R.topCv[i];
    const need = Math.min(512, Math.ceil(rpx * 2.25 * R.dpr));
    if (Math.abs(oc.width - need) > need * .15 || oc.width < need) { oc.width = oc.height = need; }
    const og = oc.getContext('2d');
    const s2 = oc.width / 2, rr = s2 / 1.12;
    og.setTransform(1, 0, 0, 1, 0, 0); og.globalCompositeOperation = 'source-over'; og.globalAlpha = 1;
    og.clearRect(0, 0, oc.width, oc.height);
    og.translate(s2, s2);
    const scl = rr * 2 / (sp.R * 2);
    if (blurK > 0) {
      og.save(); og.rotate(vis.a * .07 + c.yaw); og.globalAlpha = blurK; og.drawImage(sp.blur, -sp.size / 2 * scl, -sp.size / 2 * scl, sp.size * scl, sp.size * scl); og.restore();
    }
    og.save(); og.rotate(vis.a + c.yaw); og.globalAlpha = 1 - blurK * .82; og.drawImage(sp.sharp, -sp.size / 2 * scl, -sp.size / 2 * scl, sp.size * scl, sp.size * scl); og.restore();
    og.globalAlpha = 1;
    og.globalCompositeOperation = 'source-atop';
    const lg = og.createLinearGradient(-rr, -rr, rr, rr);
    lg.addColorStop(0, 'rgba(255,255,255,.32)'); lg.addColorStop(.3, 'rgba(255,255,255,.32)'); lg.addColorStop(.305, 'rgba(255,255,255,0)');
    lg.addColorStop(.64, 'rgba(0,0,0,0)'); lg.addColorStop(.645, 'rgba(0,0,0,.2)'); lg.addColorStop(1, 'rgba(0,0,0,.34)');
    og.fillStyle = lg; og.fillRect(-s2, -s2, oc.width, oc.height);
    og.globalCompositeOperation = 'lighter';
    og.strokeStyle = 'rgba(255,255,255,.55)'; og.lineWidth = rr * .07; og.lineCap = 'round';
    og.beginPath(); og.arc(0, 0, rr * .84, 3.5, 4.3); og.stroke();
    og.strokeStyle = 'rgba(255,255,255,.3)'; og.lineWidth = rr * .04;
    og.beginPath(); og.arc(0, 0, rr * .5, 3.6, 4.2); og.stroke();
    // 畫到主畫面（壓成橢圓）
    g.save();
    g.translate(P.x + ox, P.y + oy);
    if (fall > 0) { g.rotate(fall * .9 * (i ? -1 : 1)); }
    if (wob > .02) { g.rotate(prec); g.scale(1, 1 - wob * .28); g.rotate(-prec); }
    g.scale(1, c.cosT * (1 - fall * .25) + fall * .25);

      }
      g.restore();
    }
