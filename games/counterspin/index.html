    const tell = R.tells[i];
    if (tell && t.state === 'spin') drawTell(R, g, t, P, rpx, tell, i);
    if (t.mode === 'guard' && t.state === 'spin' && S.phase === 'action') drawShield(R, g, P, rpx, .45, '#5fc8ff');
    if ((t.mode === 'ironwall' || t.mode === 'reflect') && t.state === 'spin') drawShield(R, g, P, rpx * 1.15, .8, t.mode === 'ironwall' ? '#ff6a1f' : '#dcd2ff');
    if (t.mode === 'steal' && t.state === 'spin') drawVortex(R, g, P, rpx, t.core.col, t.dir);
    if (t.mode === 'stellar' && t.state === 'spin') drawShield(R, g, P, rpx * 1.8, .5, '#ffe08a');
    if (t.frozen > 0 && t.state === 'spin') drawShield(R, g, P, rpx * 1.05, .5, '#bff6ff');
  }

  function drawShield(R, g, P, r, a, col) {
    const c = R.cam;
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a * (.75 + .25 * Math.sin(R.time * 8));
    g.strokeStyle = col; g.lineWidth = Math.max(2, r * .08);
    g.beginPath();
    for (let k = 0; k <= 6; k++) { const ang = k / 6 * TAU + R.time * .6; const x = P.x + Math.cos(ang) * r * 1.3, y = P.y + Math.sin(ang) * r * 1.3 * c.cosT; k ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
    g.globalAlpha *= .35; g.fillStyle = col; g.fill();
    g.restore();
  }
  function drawVortex(R, g, P, r, col, dir) {
    const c = R.cam;
    g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = col; g.lineWidth = Math.max(2, r * .07);
    for (let k = 0; k < 4; k++) {
      const a0 = -R.time * 6 * dir + k * TAU / 4;
      g.globalAlpha = .7;
      g.beginPath();
      for (let s = 0; s < 1; s += .1) { const rr = r * (1.9 - s * .9), a = a0 + s * 2 * dir; const x = P.x + Math.cos(a) * rr, y = P.y + Math.sin(a) * rr * c.cosT; s ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    g.restore();
  }

  function drawTell(R, g, t, P, rpx, tell, i) {
    const c = R.cam, tm = R.time;
    g.save(); g.globalCompositeOperation = 'lighter';
    const pulse = .6 + .4 * Math.sin(tm * 7);
    if (tell === 'rush') {
      const o = R._S && R._S.tops[1 - i];
      const a = o ? Math.atan2((proj(R, o.x, o.y, 0).y - P.y), (proj(R, o.x, o.y, 0).x - P.x)) : 0;
      g.fillStyle = `rgba(255,70,50,${.35 * pulse})`;
      g.beginPath(); g.ellipse(P.x, P.y, rpx * 1.7, rpx * 1.7 * c.cosT, 0, 0, TAU); g.fill();
      g.fillStyle = `rgba(255,90,60,${.85 * pulse})`;
      for (let k = 0; k < 3; k++) {
        const d = rpx * (1.5 + k * .55 + ((tm * 2) % .55));
        const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
        g.beginPath(); g.moveTo(x + Math.cos(a) * rpx * .35, y + Math.sin(a) * rpx * .35); g.lineTo(x + Math.cos(a + 2.3) * rpx * .35, y + Math.sin(a + 2.3) * rpx * .35); g.lineTo(x + Math.cos(a - 2.3) * rpx * .35, y + Math.sin(a - 2.3) * rpx * .35); g.closePath(); g.fill();
      }
    } else if (tell === 'orbit') {
      g.strokeStyle = `rgba(150,255,80,${.9 * pulse})`; g.lineWidth = Math.max(2, rpx * .1);
      for (let k = 0; k < 2; k++) {
        const a = tm * 3 * t.dir + k * Math.PI;
        g.beginPath(); g.ellipse(P.x, P.y, rpx * 1.5, rpx * 1.5 * c.cosT, 0, a, a + 1.6); g.stroke();
        const ea = a + 1.6, ex = P.x + Math.cos(ea) * rpx * 1.5, ey = P.y + Math.sin(ea) * rpx * 1.5 * c.cosT;
        g.beginPath(); g.arc(ex, ey, rpx * .14, 0, TAU); g.fillStyle = g.strokeStyle; g.fill();
      }
    } else if (tell === 'guard') {
      g.globalCompositeOperation = 'source-over';
      g.restore(); drawShield(R, g, P, rpx * 1.05, .9 * pulse, '#5fc8ff'); return;
    } else if (tell === 'special') {
      g.fillStyle = `rgba(255,224,138,${.4 * pulse})`;
      g.beginPath(); g.ellipse(P.x, P.y, rpx * 2, rpx * 2 * c.cosT, 0, 0, TAU); g.fill();
      for (let k = 0; k < 8; k++) { const a = k / 8 * TAU + tm; g.strokeStyle = `rgba(255,240,180,${.8 * pulse})`; g.lineWidth = 2; g.beginPath(); g.moveTo(P.x + Math.cos(a) * rpx * 1.3, P.y + Math.sin(a) * rpx * 1.3 * c.cosT); g.lineTo(P.x + Math.cos(a) * rpx * 2.2, P.y + Math.sin(a) * rpx * 2.2 * c.cosT); g.stroke(); }
    }
    g.restore();
  }

  function drawDebris(R, g, d) {
    const c = R.cam, sp = R.tops[d.owner];
    if (!sp || !sp.debris) return;
    const img = sp.debris[d.kind];
    const p = proj(R, d.x, d.y, d.z + .2);
    const s = c.zoom * (d.kind === 'ring' ? 2.1 : d.kind === 'disk' ? 1.6 : d.kind === 'core' ? 1.1 : 1.2);
    g.save(); g.translate(p.x, p.y); g.rotate(d.ang); g.scale(1, d.kind === 'tip' ? 1 : c.cosT + .2);
    g.drawImage(img, -s / 2, -s / 2, s, s);
    g.restore();
  }

  function drawParticles(R, g) {
    const c = R.cam;
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (const p of R.parts) {
      if (p.k !== 's') continue;
      const a = p.life / p.max;
      const p1 = proj(R, p.x, p.y, p.z), p0 = proj(R, p.x - p.vx * .035, p.y - p.vy * .035, p.z - p.vz * .035);
      g.globalAlpha = Math.min(1, a * 1.5); g.strokeStyle = p.col; g.lineWidth = p.w * (c.zoom / 20);
      g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.stroke();
    }
    g.restore();
    // 環境粒子（雪、雨、火星…）
    drawAmbient(R, g);
  }

  function drawPuffs(R, g) {
    const c = R.cam;
    g.save();
    for (const p of R.parts) {
      if (p.k !== 'p') continue;
      const a = p.life / p.max, pp = proj(R, p.x, p.y, p.z * .3), r = p.size * c.zoom * (1.5 - a * .8);
      g.globalAlpha = a * .45; g.fillStyle = p.col;
      g.beginPath(); g.ellipse(pp.x, pp.y, r, r * c.cosT, 0, 0, TAU); g.fill();
    }
    g.restore();
  }

  function ambientUpdate(R, dt, S) {
    if (!R.arena) return;
    const id = R.arena.id, A = R.ambient;
    const want = (id === 'roof' || id === 'summit') ? 90 : id === 'freezer' ? 60 : id === 'foundry' ? 40 : id === 'wreck' ? 25 : 18;
    while (A.length < want * R.quality) A.push(newAmb(R, id, true));
    for (let i = A.length - 1; i >= 0; i--) {
      const p = A[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0 || p.y > R.H + 20 || p.y < -40 || p.x < -40 || p.x > R.W + 40) A[i] = newAmb(R, id, false);
    }
    if ((id === 'roof' || id === 'summit') && Math.random() < dt * .08) R.lightning = 1;
  }
  function newAmb(R, id, init) {
    const W = R.W, H = R.H, r = Math.random;
    if (id === 'roof' || id === 'summit') return { k: 'rain', x: r() * W * 1.2 - W * .1, y: init ? r() * H : -20, vx: -120, vy: 900 + r() * 300, life: 3 };
    if (id === 'freezer') return { k: 'snow', x: r() * W, y: init ? r() * H : -10, vx: 10 + r() * 20, vy: 30 + r() * 40, life: 30, s: 1 + r() * 2.5 };
    if (id === 'foundry') return { k: 'ember', x: r() * W, y: init ? r() * H : H + 10, vx: (r() - .5) * 30, vy: -40 - r() * 80, life: 8, s: 1 + r() * 2 };
    return { k: 'dust', x: r() * W, y: init ? r() * H : r() * H, vx: (r() - .5) * 8, vy: (r() - .5) * 6, life: 6 + r() * 6, s: .8 + r() * 1.6 };
  }
  function drawAmbient(R, g) {
    g.save();
    for (const p of R.ambient) {
      if (p.k === 'rain') { g.strokeStyle = 'rgba(190,210,255,.35)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + p.vx * .02, p.y + p.vy * .02); g.stroke(); }
      else if (p.k === 'snow') { g.fillStyle = 'rgba(240,250,255,.8)'; g.beginPath(); g.arc(p.x, p.y, p.s, 0, TAU); g.fill(); }
      else if (p.k === 'ember') { g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255,150,60,.8)'; g.beginPath(); g.arc(p.x, p.y, p.s, 0, TAU); g.fill(); g.globalCompositeOperation = 'source-over'; }
      else { g.fillStyle = 'rgba(255,240,210,.18)'; g.beginPath(); g.arc(p.x, p.y, p.s, 0, TAU); g.fill(); }
    }
    g.restore();
  }

  function drawMarkers(R, g, S) {
    if (!R.showMarkers) return;
    const c = R.cam;
    for (let i = 0; i < 2; i++) {
      const t = S.tops[i];
      if (t.state !== 'spin') continue;
      const p = proj(R, t.x, t.y, t.z + FACE_Z + 1.25 + Math.sin(R.time * 4 + i) * .08);
      const s = clamp(c.zoom * .32, 6, 13);
      g.fillStyle = R.teamCol[i]; g.strokeStyle = K; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(p.x - s, p.y - s * 1.3); g.lineTo(p.x + s, p.y - s * 1.3); g.lineTo(p.x, p.y); g.closePath(); g.fill(); g.stroke();
    }
  }

  function drawTexts(R, g) {
    for (const t of R.texts) {
      const k = 1 - t.life / t.max;
      const p = proj(R, t.x, t.y, t.z);
      const pop = k < .12 ? .6 + k / .12 * .55 : k < .2 ? 1.15 - (k - .12) / .08 * .15 : 1;
      const a = t.life / t.max < .25 ? t.life / t.max / .25 : 1;
      g.save(); g.translate(p.x, p.y); g.rotate(t.rot); g.scale(pop, pop); g.globalAlpha = a;
      g.font = `900 ${t.size}px ${CS.FONT_STACK}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineJoin = 'round'; g.lineWidth = t.size * .2; g.strokeStyle = t.stroke; g.strokeText(t.str, 0, 0);
      g.fillStyle = t.col; g.fillText(t.str, 0, 0);
      g.restore();
    }
  }

  function drawOverlays(R, g) {
    const W = R.W, H = R.H, o = R.overlay;
    // 集中線
    if (R.lines) {
      const L = R.lines, p = proj(R, L.x, L.y, L.z), a = L.t / L.max;
      g.save(); g.globalAlpha = Math.min(1, a * 2); g.fillStyle = L.col;
      const n = 46, rnd = CS.Art.rng(Math.floor(L.seed));

      case 'freeze': if (!replay) toFreeze(); break;
    }
  }

  function vib(p) { try { if (CS.UI.settings().vib && navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

  function audioTick() {
    const au = A(); if (!au) return;
    const S = st.replay ? st.replay.S : st.S, R = st.R;
    const live = st.state === 'action' || st.state === 'finish' || st.state === 'replay' || st.state === 'command' || st.state === 'freezeIn' || st.state === 'cine';
    if (!live || S.phase === 'launch') { au.hums(null); return; }
    const freeze = st.state === 'command' || st.state === 'freezeIn' || st.state === 'cine';
    au.hums(S.tops.map(t => ({
      s: t.state === 'spin' ? t.s : 0, w: t.w,
      pan: clamp((CS.Render.proj(R, t.x, t.y, 0).x / R.W) * 2 - 1, -1, 1),
      rail: t.mode === 'orbit' && t.railTime > 0 && !freeze ? 1 : 0,
      rate: freeze ? .35 : st.ts,
    })));
  }

  // ───────── 流程 ─────────
  function setState(s) { st.state = s; st.stT = 0; }

  function toRoundStart() {
    setState('roundStart');
    st.hud.banner.classList.remove('show');
    const n = st.S.round;
    banner(`<div class="rnd"><small>ROUND</small><b>${n}</b><span>${st.S.score[0]} ： ${st.S.score[1]}</span></div>`, 'rndb', 1.2);
    if (A()) A().sfx('round');
  }

  function toAim() {
    setState('aim');
    const S = st.S;
    st.aiLaunch = CS.AI.launch(S, 1, st.opts.ai || st.opp.ai, st.rng);
    const band = Sim.sweetBand(S.tops[0].def);
    st.band = band;
    st.hud.band.style.left = (band.lo * 100) + '%'; st.hud.band.style.width = ((band.hi - band.lo) * 100) + '%';
    st.hud.mark.style.left = '0%';
    st.hud.launch.classList.add('show');
    st.hud.launch.classList.remove('active');
    S.tops[0].z = 1.4; S.tops[1].z = 1.4;
    S.tops[0].ang = 0;
    if (st.opts.tut) queueTut('launch');
    showTuts();
  }

  function doLaunch(angle, power) {
    const S = st.S;
    st.hud.launch.classList.remove('show', 'active');
    st.R.preview = null;
    S.tops[0].z = 0; S.tops[1].z = 0;
    const ev = Sim.launch(S, [{ angle, power }, st.aiLaunch]);
    if (A()) A().sfx('launch');
    for (const e of ev) onEvent(e, S, false);
    banner('<div class="go-txt">發射！</div>', 'gob', .7);
    st.lastHitT = -9;
    takeSnap();
    st.acc = 0;
    setState('action');
  }

  function takeSnap() {
    st.snaps.push({ snap: Sim.snapshot(st.S), t: st.S.t, step: st.S.stepNo });
    if (st.snaps.length > 4) st.snaps.shift();
  }

  function toFreeze() {
    setState('freezeIn');
    if (A()) A().sfx('freeze');
  }

  function toCommand() {
    setState('command');
    const S = st.S, R = st.R;
    st.exCount++;
    st.sel = null; st.aim = null;
    st.userZoom = 1; st.userYaw = 0;
    const prof = st.opts.ai || st.opp.ai;
    st.ai = S.foresee[1] > 0 ? null : CS.AI.decide(S, 1, prof, st.rng);
    // 徵兆
    let tell = st.ai ? st.ai.tell : null;
    if (S.foresee[0] > 0 && st.ai) tell = st.ai.cmd === 'special' ? 'special' : st.ai.cmd;
    R.tells = [null, tell];
    // 面板
    const P = st.hud.panel;
    P.classList.add('show');
    P.querySelectorAll('.cmd').forEach(b => b.classList.remove('sel'));
    const me = S.tops[0];
    const spBtn = P.querySelector('.cmd.special');
    spBtn.disabled = me.gauge < 100;
    spBtn.querySelector('.spbar i').style.transform = `scaleX(${me.gauge / 100})`;
    st.hud.go.disabled = true;
    st.hud.desc.querySelector('b').textContent = '';
    st.hud.desc.querySelector('span').textContent = '選一個指令';
    setComment(commentLine(), st.opp.tier ? '林曜' : '話筒');
    // 教學
    if (st.opts.tut) {
      queueTut('command'); queueTut('tells');
      if (st.opts.tut.includes('mu') && st.exCount >= 1) queueTut('mu');
      if (st.opts.tut.includes('special')) queueTut('special');
      if (st.opts.tut.includes('spinDir')) queueTut('spinDir');
      if (st.opts.tut.includes('reader')) queueTut('reader');
    }
    if (me.gauge >= 100 && !st.seenGauge) { st.seenGauge = true; queueTut('special'); }
    showTuts();
  }

  function commentLine() {
    const S = st.S, C = CS.COMMENTARY, me = S.tops[0], op = S.tops[1], o = st.oppChar.name;
    const pick = a => a[Math.floor(st.rng() * a.length)];
    const fill = (s, n) => s.replace('{o}', o).replace('{n}', n || '').replace('{c}', n || '');
    if (S.foresee[0] > 0 && st.ai) return fill(C.foresee, CS.CMDS[st.ai.cmd] ? CS.CMDS[st.ai.cmd].name : '必殺');
    const tele = S.tele;
    if (tele) {
      const G = C.gim;
      if (tele.gim === 'wind' && tele.wind) return G.wind.replace('{d}', dirWord(tele.wind.x, tele.wind.y));
      if (tele.gim === 'tilt') return tele.tilt ? G.tiltOn.replace('{d}', sideWord(tele.tilt.x)) : (st.exCount > 1 && st.rng() < .5 ? G.tiltOff : null) || genericLine();
      if (tele.gim === 'tide') { if (tele.tide && !st._tideWas) { st._tideWas = 1; return G.tideOn; } if (!tele.tide && st._tideWas) { st._tideWas = 0; return G.tideOff; } if (tele.tideNext && !tele.tide) return G.tideWarn; }
      if (tele.gim === 'shrink') return G.shrink;
      if (tele.gim === 'magnet' && st.rng() < .4) return G.magnet;
    }
    if (st.opp.ai.pattern === 'counterTop' && st.exCount >= 4 && st.rng() < .5) return C.o7hint;
    if (st.opp.ai.read >= .5 && st.exCount === 3) return fill(C.readerHint);
    if (op.lock <= 0 || op.lock < op.def.lockMax * .2) return fill(pick(C.oppLockLow));
    if (me.lock <= 0 || me.lock < me.def.lockMax * .2) return fill(pick(C.selfLockLow));
    if (op.gauge >= 100 && st.rng() < .6) return fill(pick(C.oppGauge));
    if (op.mu >= 2) return fill(pick(C.oppMu), op.mu);
    if (me.mu >= 2 && st.rng() < .6) return fill(pick(C.selfMu), me.mu);
    if (op.s < .25) return fill(pick(C.oppSpinLow));
    if (me.s < .25) return fill(pick(C.selfSpinLow));
    if (Sim.gapDistance(S, op) < 2.4) return fill(pick(C.oppNearGap));
    if (Sim.gapDistance(S, me) < 2.4) return fill(pick(C.selfNearGap));
    const tell = st.R.tells[1];
    if (tell && C.tell[tell] && st.rng() < .55) return fill(pick(C.tell[tell]));
    if (me.gauge >= 100) return fill(pick(C.selfGauge));
    return genericLine();
  }
  function genericLine() { const a = CS.COMMENTARY.generic; return a[Math.floor(st.rng() * a.length)]; }
  function dirWord(x, y) {
    // 世界座標 → 玩家看到的方向（鏡頭 yaw≈0）
    const a = Math.atan2(y, x) / (Math.PI / 4);
    const k = ((Math.round(a) % 8) + 8) % 8;
    return ['左邊', '左上方', '上方', '右上方', '右邊', '右下方', '下方', '左下方'][k]; // 風「從」哪裡來＝反方向
  }
  function sideWord(x) { return x < 0 ? '左邊' : '右邊'; }

  function selectCmd(c) {
    if (!st || st.state !== 'command') return;
    const S = st.S, me = S.tops[0];
    if (c === 'special' && me.gauge < 100) return;
    if (st.sel === c) { confirmCmd(); return; }
    st.sel = c;
    if (A()) A().sfx('select');
    st.hud.panel.querySelectorAll('.cmd').forEach(b => b.classList.toggle('sel', b.dataset.c === c));
    st.hud.go.disabled = false;
    let name, desc;
    if (c === 'special') { const sp = CS.SPECIALS[me.core.special]; name = '必殺「' + sp.name + '」'; desc = sp.desc + (me.def.unfinished ? '（未完成：自己的鎖扣會受損）' : ''); }
    else { name = CS.CMDS[c].name; desc = CS.CMDS[c].desc; }
    if (c === 'rush') { desc = '拖曳場地調整方向　' + (me.mu >= 2 ? '勢 ' + me.mu + '：能撞穿卸力！' : ''); }
    st.hud.desc.querySelector('b').textContent = name;
    st.hud.desc.querySelector('span').textContent = desc;
    if (c === 'rush' || (c === 'special' && (me.core.special === 'typhoon'))) {
      if (!st.aim) st.aim = Sim.predictAim(me, S.tops[1]);
      updateAimPreview();
    } else if (c === 'orbit') st.R.preview = { kind: 'orbit' };
    else if (c === 'guard') st.R.preview = { kind: 'guard' };
    else st.R.preview = null;
  }

  function updateAimPreview() {
    const S = st.S, me = S.tops[0];
    const path = ghostPath(me, st.aim, 1 + .3 * me.mu, .85);
    st.R.preview = { kind: 'aim', path };
  }

  // 預測軌跡：只算碗形重力、阻尼、推力（不算碰撞）
  function ghostPath(t, aim, mul, dur, launchV) {
    const T = CS.TUNE;
    let x = t.x, y = t.y, vx, vy;
    if (launchV) { vx = aim.x * launchV; vy = aim.y * launchV; }
    else {
      const dash = (T.dashBase + T.dashSpd * t.def.spd) * mul * (.75 + .25 * t.tip.grip);
      vx = t.vx * .25 + aim.x * dash; vy = t.vy * .25 + aim.y * dash;
    }
    const pts = [{ x, y }];
    let dashT = launchV ? 0 : T.dashT;
    const step = 1 / 60, R0 = st.S.A.R;
    for (let k = 0; k < dur / step; k++) {
      const r = Math.hypot(x, y) || 1e-6, ux = x / r, uy = y / r;
      const bowl = T.bowlK * Math.pow(Math.min(r / R0, 1.2), 1.25) + T.centerK * t.tip.center * (r / R0);
      let ax = -ux * bowl, ay = -uy * bowl;
      if (dashT > 0) { ax += aim.x * T.thrust; ay += aim.y * T.thrust; dashT -= step; }
      vx += ax * step; vy += ay * step;
      const kk = Math.exp(-t.tip.damp * step); vx *= kk; vy *= kk;
      x += vx * step; y += vy * step;
      if (Math.hypot(x, y) > R0 - t.r) { const rr = Math.hypot(x, y); x = x / rr * (R0 - t.r); y = y / rr * (R0 - t.r); pts.push({ x, y }); break; }
      if (k % 3 === 0) pts.push({ x, y });
    }
    return pts;
  }

  function confirmCmd() {
    if (!st || st.state !== 'command' || !st.sel) return;
    const S = st.S, me = S.tops[0];
    const prof = st.opts.ai || st.opp.ai;
    const myCmd = { cmd: st.sel, aim: st.aim };
    if (st.sel === 'rush' && !myCmd.aim) myCmd.aim = Sim.predictAim(me, S.tops[1]);
    if (!st.ai) st.ai = CS.AI.decide(S, 1, prof, st.rng, st.sel);
    st.pending = [myCmd, st.ai];
    st.hud.panel.classList.remove('show');
    setComment(null);
    st.R.preview = null; st.R.tells = [null, null];
    if (A()) A().sfx('confirm');
    const queue = [];
    if (myCmd.cmd === 'special') queue.push(0);
    if (st.ai.cmd === 'special') queue.push(1);
    if (queue.length) { st.cineQueue = queue; startCine(queue.shift()); }
    else resumeAction();
  }

  function resumeAction() {
    const S = st.S;
    const ev = Sim.applyCommands(S, st.pending);
    for (const e of ev) onEvent(e, S, false);
    takeSnap();
    st.tsTarget = 1; st.ts = .4;
    setState('action');
  }

  // ───────── 必殺演出 ─────────
  function startCine(i) {
    const S = st.S, t = S.tops[i];
    const sp = CS.SPECIALS[t.core.special];
    st.stats.specials += i === 0 ? 1 : 0;
    st.cine = { i, t: 0, dur: 1.45 };
    setState('cine');
    st.R.overlay.letter = 0;
    const ch = i === 0 ? 'wei' : st.opp.char;
    const nm = i === 0 ? '焊面' : st.oppChar.name;
    const col = t.core.col;
    const c = st.hud.cutin;
    c.style.setProperty('--c', col);
    c.className = 'cutin ' + (i ? 'right' : 'left');
    c.innerHTML = `<div class="band"><div class="cmask">${CS.Masks.svg(ch, { bg: true })}</div><div class="cname"><small>${nm}　必殺</small><b>${sp.name}</b><i>${sp.desc}</i></div></div>`;
    void c.offsetWidth; c.classList.add('show');
    if (A()) A().special(i);
    vib(30);
  }

  function stepCine(dt) {
    const c = st.cine, R = st.R;
    c.t += dt;
    R.overlay.letter = clamp(Math.min(c.t / .2, (c.dur - c.t) / .25), 0, 1);
    R.overlay.freeze = Math.max(0, R.overlay.freeze - dt * 4);
    if (c.t >= c.dur) {
      st.hud.cutin.classList.remove('show');
      R.overlay.letter = 0;
      st.cine = null;
      if (st.cineQueue && st.cineQueue.length) startCine(st.cineQueue.shift());
      else { st.cineQueue = null; resumeAction(); }
    }
  }

  // ───────── 終結與重播 ─────────
  function toFinish() {
    setState('finish');
    st.hud.panel.classList.remove('show');
    const f = st.S.finish;
    st.finishShown = false;
    setTimeout(() => {
      if (!st || st.state !== 'finish') return;
      const F = CS.FINISH[f.type];
      const winMe = !f.draw && f.winner === 0;
      if (f.draw) banner(`<div class="fin f-draw"><b>同時終結</b><small>DRAW · 不計分</small></div>`, 'finb', 0);
      else banner(`<div class="fin f-${f.type} ${winMe ? 'f-me' : 'f-op'}"><small>${winMe ? '焊面' : st.oppChar.name}</small><b>${F.name}</b><i>${F.en}</i><em>+${F.pts}</em></div>`, 'finb', 0);
      if (A()) A().finish(winMe, f.type);
      if (st.opts.tut) queueTut('finish');
    }, 650);
  }

  function afterFinish() {
    const S = st.S, f = S.finish;
    st.rounds.push({ type: f.type, winner: f.draw ? -1 : f.winner, draw: f.draw });
    st.hud.banner.classList.remove('show');
    // 決勝重播（分出勝負的那一下）
    const matchOver = S.score[0] >= CS.WIN_SCORE || S.score[1] >= CS.WIN_SCORE;
    if (CS.UI.settings().replay !== false && (matchOver || f.type !== 'spin')) startReplay();
    else toRoundEnd();
  }

  function startReplay() {
    const S = st.S, f = S.finish;
    // 焦點：出界時是把它打飛的那一下，其餘是終結瞬間
    let focus = f.t;
    if (f.type === 'out' && st.lastHitT > f.t - 1.2) focus = st.lastHitT;
    const t0 = focus - .9;
    let pick = null;
    for (const s of st.snaps) if (s.t <= t0) pick = s;
    if (!pick) pick = st.snaps[0];
    if (!pick) { toRoundEnd(); return; }
    const RS = Sim.restore(S, pick.snap);
    RS.finish = null; RS.phase = RS.phase === 'freeze' ? 'freeze' : 'action';
    const rp = st.replay = { S: RS, endT: Math.max(f.t + .5, focus + .9), logIdx: 0, log: S.roundLog.filter(e => e.kind === 'cmd' && e.step > pick.step), fT: f.t, focus, loser: f.loser };
    // 快轉到焦點前一秒（不出聲、不出特效）
    let g = 0;
    while (RS.t < t0 && g++ < 120 * 60) if (!replayStep(rp, RS, false)) break;
    st.R._S = RS;
    st.R.parts.length = 0; st.R.texts.length = 0;
    st.hud.replay.classList.add('show');
    setState('replay');
    st.acc = 0; st.hitstop = 0;
    if (A()) A().sfx('replay');
  }

  function replayStep(rp, RS, fx) {
    if (RS.phase === 'freeze') {
      const e = rp.log[rp.logIdx++];
      if (!e) return false;
      const ev = Sim.applyCommands(RS, e.C.map(c => ({ cmd: c.cmd, aim: c.aim, foresee: c.foresee })), false);
      if (fx) for (const x of ev) onEvent(x, RS, true);
    }
    const ev = Sim.step(RS, DT);
    if (fx) for (const x of ev) onEvent(x, RS, true);
    return !(RS.t >= rp.endT || RS.phase === 'roundOver');
  }

  function runReplay(dtReal) {
    const rp = st.replay, RS = rp.S;
    if (st.hitstop > 0) { st.hitstop -= dtReal; return 0; }
    const near = RS.t > rp.focus - .15 && RS.t < rp.focus + .3;
    const ts = near ? .25 : .6;
    const simDt = dtReal * ts;
    st.acc += simDt;
    while (st.acc >= DT) {
      st.acc -= DT;
      if (!replayStep(rp, RS, true)) { endReplay(); return simDt; }
      if (!st.replay) return simDt;
    }
    return simDt;
  }

  function endReplay() {
    if (!st.replay) return;
    st.replay = null;
    st.R._S = st.S;
    st.hud.replay.classList.remove('show');
    toRoundEnd();
  }

  function toRoundEnd() {
    setState('roundEnd');
    st.tsTarget = 1; st.ts = 1;
    const S = st.S;
    banner(`<div class="rnd rnd-score"><small>SCORE</small><b>${S.score[0]}<i>：</i>${S.score[1]}</b><span>${S.score[0] >= CS.WIN_SCORE ? '焊面 拿下勝利！' : S.score[1] >= CS.WIN_SCORE ? st.oppChar.name + ' 拿下勝利' : '先拿 4 分獲勝'}</span></div>`, 'rndb', 1.5);
  }

  function nextRound() {
    const S = st.S;
    st.hud.banner.classList.remove('show');
    if (S.score[0] >= CS.WIN_SCORE || S.score[1] >= CS.WIN_SCORE) { endMatch(); return; }
    st.snaps = [];
    st.R.parts.length = 0; st.R.rings.length = 0;
    Sim.startRound(S);
    toRoundStart();
  }

  function endMatch() {
    const S = st.S;
    const win = S.score[0] >= CS.WIN_SCORE;
    const res = { win, score: S.score.slice(), rounds: st.rounds.slice(), stats: st.stats, hits: S.tops[0].hits };
    setState('done');
    st.hud.banner.classList.remove('show');
    st.hud.panel.classList.remove('show');
    st.hud.launch.classList.remove('show', 'active');
    st.R.preview = null; st.R.tells = [null, null];
    setComment(null);
    if (A()) { A().hums(null); A().grind(0); }
    const cb = st.opts.onEnd;
    if (cb) cb(res, B);
  }

  // 結局用：在目前畫面上讓逆旋往內碎掉
  B.endingBurst = function (done) {
    if (!st) { done && done(); return; }
    const S = st.S;
    const t = S.tops[0];
    if (t.state !== 'spin') { t.state = 'spin'; t.x = 0; t.y = 0; t.vx = t.vy = 0; t.s = .9; }
    t.z = 0; t.vz = 0;
    S.tops[1].state = 'out'; S.tops[1].x = 30; S.tops[1].z = 0; S.tops[1].vz = 0;
    st.hud.launch.classList.remove('show', 'active'); st.R.preview = null; st.R.tells = [null, null];
    st.hud.el.classList.add('cine'); setComment(null);
    S.phase = 'action';
    setState('ending');
    let tt = 0;
    const R = st.R;
    st.endingTick = (dt) => {
      tt += dt;
      st.cam.x = t.x; st.cam.y = t.y; st.cam.zoom = R.cam.zFit * lerp(1.4, 2.6, Math.min(1, tt / 1.6)); st.cam.yaw = Math.sin(tt * .5) * .3;
      applyCam(Math.min(1, dt * 3));
      if (tt < 1.6) { t.s = .9; t.w = Math.min(.8, tt * .5); if (Math.random() < .3) CS.Render.spark(R, t.x, t.y, .6, (Math.random() - .5) * 8, (Math.random() - .5) * 8, 3, .4, '#ff9a3a', 2); }
      if (tt >= 1.6 && !st._eb) {
        st._eb = 1;
        const ev = Sim.forceBurst(S, 0);
        for (const e of ev) CS.Render.event(R, e, S);
        if (A()) A().burst();
        S.finish = null; S.phase = 'action';
        st.tsTarget = .25;
      }
      if (st._eb) { st.ts = lerp(st.ts, .35, dt * 2); const n = Math.round(dt * st.ts / DT) || 1; for (let k = 0; k < n; k++) Sim.step(S, DT); S.phase = 'action'; }
      CS.Render.frame(R, S, dt, dt * st.ts, st.ts);
      if (tt > 5.2) { st.endingTick = null; done && done(); }
    };
  };
  B.tickEnding = function (dt) { if (st && st.endingTick) { st.endingTick(Math.min(dt, .05)); return true; } return false; };

  // ───────── 輸入 ─────────
  B.pointer = function (type, e) {
    if (!st) return false;
    const R = st.R;
    const p = { x: e.clientX, y: e.clientY };
    if (type === 'down') st.pointers.set(e.pointerId, p);
    else if (type === 'move' && st.pointers.has(e.pointerId)) st.pointers.set(e.pointerId, p);
    else if (type === 'up' || type === 'cancel') st.pointers.delete(e.pointerId);
    // 跳過
    if (type === 'down') {
      if (st.state === 'intro' && st.stT > .5) { toRoundStart(); return true; }
      if (st.state === 'replay') { endReplay(); return true; }
      if (st.state === 'roundStart' && st.stT > .4) { toAim(); return true; }
    }

  // 整備畫面上方的立體預覽／試轉
  function setupGarView() {
    const cv = $('#scr-garage .gview');
    const box = cv.parentElement;
    const w = box.clientWidth, h = box.clientHeight;
    const R = CS.Render.create(cv);
    R.quality = save.settings.quality;
    R.cam.cosT = .62; R.cam.sinT = .78; R.cam.cy = .56;
    CS.Render.resize(R, w, h, Math.min(2, window.devicePixelRatio || 1));
    R.showMarkers = false;
    CS.Render.setArena(R, 'dock');
    R.bg = null; R.fg = null; R.fgCrowd = null;
    const view = { R, lo: null, S: null, t: 0 };
    view.setLo = (lo) => {
      view.lo = Object.assign({}, lo);
      CS.Render.setTops(R, [lo, { ring: 'fin', disk: 'heavy', tip: 'ball', core: 'std' }], { scratches: [save.scratches[lo.ring] || 0, 0], teamCol: ['#ff7a1a', '#9aa3b5'] });
      const S = CS.Sim.create({ arena: 'dock', seed: 7, topA: CS.Sim.buildTop(lo, { coreUnfinished: !save.coreDone }), topB: CS.Sim.buildTop({ ring: 'fin', disk: 'heavy', tip: 'ball', core: 'std' }) });
      CS.Sim.startRound(S);
      S.tops[0].x = 0; S.tops[0].y = 0; S.tops[0].z = .5;
      S.tops[1].state = 'out'; S.tops[1].x = 99;
      view.S = S; R._S = S;
    };
    view.setLo(save.lo);
    UI.garView = view;
  }

  function startTest() {
    const v = UI.garView; if (!v) return;
    const wrap = $('#scr-garage .garwrap');
    if (wrap && wrap.scrollTop > 0) { try { wrap.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { wrap.scrollTop = 0; } }
    v.setLo(save.lo);
    const S = v.S;
    S.tops[1].state = 'spin'; S.tops[1].x = 0; S.tops[1].y = 0; S.tops[1].s = 1; S.tops[1].mode = 'guard';
    S.tops[0].x = 0; S.tops[0].y = 6.2; S.tops[0].z = 0;
    CS.Sim.launch(S, [{ angle: -2.2, power: CS.Sim.sweetBand(S.tops[0].def).c }, { angle: 0, power: .2 }]);
    S.tops[1].vx = S.tops[1].vy = 0; S.tops[1].x = 0; S.tops[1].y = 0;
    garTest = { t: 0, phase: 0 };
    const tag = $('#scr-garage .gtag'); if (tag) tag.textContent = '試轉中：自由移動';
  }
  function stopTest() { garTest = null; if (UI.garView) UI.garView.setLo(save.lo); renderStats(); }

  function garTick(dt) {
    const v = UI.garView; if (!v || UI.cur !== 'garage') return;
    const R = v.R, S = v.S;
    v.t += dt;
    if (garTest) {
      garTest.t += dt;
      const tag = $('#scr-garage .gtag');
      // 0–2.3s 自由移動 → 迴旋 2.6s → 對訓練陀突擊
      if (S.phase === 'freeze') {
        garTest.phase++;
        if (garTest.phase === 1) { CS.Sim.applyCommands(S, [{ cmd: 'orbit' }, { cmd: 'guard' }]); if (tag) tag.textContent = '試轉中：迴旋（疊勢）'; }
        else if (garTest.phase === 2) { CS.Sim.applyCommands(S, [{ cmd: 'rush', aim: CS.Sim.norm({ x: S.tops[1].x - S.tops[0].x, y: S.tops[1].y - S.tops[0].y }) }, { cmd: 'guard' }]); if (tag) tag.textContent = '試轉中：突擊訓練陀'; }
        else { if (tag) tag.textContent = `轉速剩 ${Math.round(S.tops[0].s * 100)}%・勢 ${S.tops[0].mu}`; garTest = null; setTimeout(() => { if (UI.cur === 'garage' && !garTest) { v.setLo(save.lo); renderStats(); } }, 2200); }
      }
      if (S.phase === 'action' || S.phase === 'finish') {
        let acc = dt;
        while (acc > 0) { const ev = CS.Sim.step(S, 1 / 120); ev.forEach(e => CS.Render.event(R, e, S)); acc -= 1 / 120; }
      }
      S.tops[1].x *= .9; S.tops[1].y *= .9;
      const f = CS.Render.frameTargets(R, [S.tops[0], { x: 0, y: 0 }], 1, 1.4);
      R.cam.x += (f.x * .4 - R.cam.x) * .08; R.cam.y += (f.y * .4 - R.cam.y) * .08; R.cam.zoom += (R.cam.zFit * 1.05 - R.cam.zoom) * .08; R.cam.yaw = 0;
      CS.Render.frame(R, S, dt, dt, 1);
      if (S.finish) { garTest = null; setTimeout(() => { if (UI.cur === 'garage') { v.setLo(save.lo); } }, 1500); }
    } else {
      // 展示：停在中央慢慢轉
      const t = S.tops[0];
      t.x = 0; t.y = 0; t.z = .25 + Math.sin(v.t * 1.6) * .08; t.s = 1; t.w = 0; t.state = 'spin'; t.mode = 'idle';
      R.cam.x = 0; R.cam.y = 0; R.cam.zoom = R.cam.zFit * 5.2; R.cam.yaw = Math.sin(v.t * .4) * .5;
      CS.Render.frame(R, S, dt, dt * .5, .5);
    }
  }
