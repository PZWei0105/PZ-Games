<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="深艙">
<title>深艙 UNDERTOW</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#02070b; --deep:#061620; --deep2:#0a2230;
  --panel:rgba(6,19,27,.93); --panel2:rgba(10,30,42,.95);
  --line:rgba(95,231,255,.26); --line2:rgba(95,231,255,.5);
  --cyan:#5fe7ff; --cyan2:#c4f8ff; --amber:#ffb03a; --red:#ff4d5e; --green:#5fe39a;
  --violet:#b47cff; --gold:#ffc845; --text:#dbecf1; --mute:#7f98a3; --dim:#4b626d;
  --r0:#b9c4cc; --r1:#5fe39a; --r2:#4fb3ff; --r3:#b47cff; --r4:#ffc845; --r5:#ff4f5e;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","STSong","PMingLiU",serif;
  --num:"Rajdhani","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--abyss);color:var(--text);overflow:hidden;font-family:var(--sans);
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}

/* ===== 通用：切角按鈕、面板 ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:0 1.6em;
  font-size:16px;font-weight:700;letter-spacing:.16em;color:var(--cyan2);
  background:linear-gradient(180deg,rgba(40,120,150,.35),rgba(10,40,55,.6));
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:transform .12s,filter .12s}
.btn::before{content:"";position:absolute;inset:0;padding:1px;background:linear-gradient(135deg,var(--cyan),rgba(95,231,255,.15) 40%,rgba(95,231,255,.15) 60%,var(--cyan));
  clip-path:inherit;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.btn:active{transform:scale(.96);filter:brightness(1.3)}
.btn.primary{color:#021016;background:linear-gradient(180deg,#8ff0ff,#2fb9d8);text-shadow:none}
.btn.primary::before{background:linear-gradient(135deg,#fff,rgba(255,255,255,.2))}
.btn.warn{color:#1a0d00;background:linear-gradient(180deg,#ffd27a,#e08a12)}
.btn.ghost{background:rgba(6,19,27,.6);color:var(--text)}
.btn.small{min-height:38px;font-size:14px;padding:0 1.1em;letter-spacing:.1em}
.btn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:2px}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan);pointer-events:none}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;padding:2px 7px;border:1px solid var(--line2);color:var(--cyan);font-weight:700}
.rar0{color:var(--r0)}.rar1{color:var(--r1)}.rar2{color:var(--r2)}.rar3{color:var(--r3)}.rar4{color:var(--r4)}.rar5{color:var(--r5)}

/* ===== 遊戲中 HUD ===== */
#hud{position:absolute;inset:0;pointer-events:none}
#hud *{pointer-events:none}
#hud button{pointer-events:auto}
#hud-top{position:absolute;left:0;right:0;top:calc(var(--sat) + 8px);height:64px;display:flex;align-items:flex-start;padding:0 10px}
.hbtn{width:40px;height:40px;border-radius:50%;background:rgba(6,19,27,.75);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.hbtn svg{width:18px;height:18px}
#hud-sector{margin-left:8px;line-height:1.1;text-shadow:0 1px 4px #000}
#hud-sector .nm{font-size:13px;font-weight:700;letter-spacing:.1em}
#hud-sector .dp{font-family:var(--num);font-size:13px;color:var(--cyan);letter-spacing:.08em}
#hud-sector .bag{font-family:var(--num);font-size:12.5px;color:var(--gold);margin-top:3px}
#hud-sector .bag em{display:block;font-style:normal;color:#ffb35a;font-family:var(--sans);font-size:10.5px;margin-top:2px;letter-spacing:.06em}
#hud-pressure{position:absolute;left:50%;top:0;transform:translateX(-50%);width:84px;text-align:center}
#hud-pressure svg{width:58px;height:58px;display:block;margin:0 auto;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
#hud-pressure .pv{position:absolute;left:0;right:0;top:15px;font-family:var(--num);font-weight:700;font-size:18px;line-height:1}
#hud-pressure .pl{position:absolute;left:0;right:0;top:34px;font-size:9px;letter-spacing:.18em;color:var(--mute)}
#hud-pressure .ps{font-size:11px;letter-spacing:.14em;margin-top:2px;font-weight:700;text-shadow:0 1px 3px #000}
#minimap{position:absolute;right:10px;top:0;width:96px;height:112px;border:1px solid rgba(125,255,165,.38);background:#020e08;pointer-events:auto!important;border-radius:3px;box-shadow:0 0 12px rgba(125,255,165,.12)}
#hud-heart{position:absolute;left:calc(50% + 34px);top:6px;display:flex;align-items:center;gap:4px;font-family:var(--num);font-weight:700;font-size:16px;text-shadow:0 1px 3px #000}
#hud-heart.fast{animation:hb .5s infinite}
@keyframes hb{50%{transform:scale(1.15)}}
#hud-heart svg{width:16px;height:16px}
#hud-heart small{font-family:var(--sans);font-size:9px;color:var(--mute);font-weight:500;letter-spacing:.1em}
#hud-obj{position:absolute;right:10px;top:calc(var(--sat) + 126px);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.obj{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 7px;background:rgba(4,14,20,.72);border-left:2px solid var(--dim);color:var(--mute);letter-spacing:.04em}
.obj.done{border-left-color:var(--green);color:var(--green)}
.obj b{font-family:var(--num);font-size:12px;color:var(--text)}
#hud-weapons{position:absolute;left:10px;top:calc(var(--sat) + 250px);display:flex;flex-direction:column;gap:6px}
.wslot{width:44px;height:44px;border:1px solid var(--line);background:rgba(4,14,20,.78);position:relative;border-radius:3px}
.wslot canvas{width:100%;height:100%}
.wslot .lv{position:absolute;right:2px;bottom:1px;font-family:var(--num);font-size:11px;font-weight:700;color:var(--cyan2)}
.wslot.evo{border-color:var(--gold);box-shadow:0 0 10px rgba(255,200,69,.35)}
.wslot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.55) var(--p,0%),transparent 0);border-radius:3px}
#hud-wave{position:absolute;left:50%;top:calc(var(--sat) + 94px);transform:translateX(-50%);font-size:12px;letter-spacing:.14em;color:var(--mute);text-shadow:0 1px 3px #000;white-space:nowrap}
#hud-wave b{font-family:var(--num);font-size:16px;color:var(--text);margin-left:4px}
#hud-wave.hot b{color:var(--red)}
#hud-hp{position:absolute;left:12px;bottom:calc(var(--sab) + 12px);width:146px}
#hud-hp .row{display:flex;align-items:center;gap:6px;font-family:var(--num);font-weight:700;font-size:13px}
#hud-hp .bar{flex:1;height:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden;transform:skewX(-14deg)}
#hud-hp .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff6b5e,#ffb17a);width:100%}
#hud-hp .bar s{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.55);width:0}
#hud-hp .o2 i{background:linear-gradient(90deg,#3fb8ff,#a8ecff)}
#hud-hp .xp{height:4px;margin-top:4px;background:rgba(0,0,0,.6);position:relative}
#hud-hp .xp i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
#hud-hp .inv{display:flex;gap:10px;margin-top:5px;font-size:11px;color:var(--mute)}
#hud-hp .inv b{font-family:var(--num);color:var(--text);font-size:13px;margin-left:2px}
#subtitle{position:absolute;left:12px;right:116px;top:calc(var(--sat) + 152px);display:flex;justify-content:flex-start;pointer-events:none}
#subtitle .sb{max-width:520px;padding:6px 10px;background:linear-gradient(90deg,rgba(3,12,17,.88),rgba(3,12,17,.55));border-left:2px solid var(--cyan);font-size:12.5px;line-height:1.5;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s}
#subtitle .sb.on{opacity:1;transform:none}
#subtitle .sb .who{display:block;font-size:10px;letter-spacing:.12em;color:var(--cyan);margin-bottom:1px}
#subtitle .sb.radio{border-left-color:var(--amber)}
#subtitle .sb.radio .who{color:var(--amber)}
#subtitle .sb.voice{border-left-color:var(--red)}
#subtitle .sb.voice .who{color:var(--red)}
#subtitle .sb.crt{background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(3,24,12,.93),rgba(2,16,9,.72));border-left-color:#7dffa8;color:#c9ffd9;text-shadow:0 0 6px rgba(125,255,165,.4)}
#subtitle .sb.crt .who{color:#7dffa8;letter-spacing:.16em}
#subtitle .sb.crt.amber,#subtitle .sb.ai{background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(30,18,3,.93),rgba(20,12,2,.72));border-left-color:#ffb03a;color:#ffe6b8;text-shadow:0 0 6px rgba(255,176,58,.4)}
#subtitle .sb.crt.amber .who,#subtitle .sb.ai .who{color:#ffb03a}
#btn-track{position:absolute;right:6px;bottom:184px;width:52px;height:52px;border-radius:50%;background:rgba(2,14,8,.84);border:1.5px solid rgba(125,255,165,.45);color:#9fffbf;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:box-shadow .15s}
#btn-track svg{width:24px;height:24px}
#btn-track em{font-style:normal;font-size:9px;letter-spacing:.12em;font-weight:700;margin-top:-2px}
#btn-track.on{background:radial-gradient(circle at 50% 45%,rgba(125,255,165,.32),rgba(2,20,10,.88));border-color:#7dffa8;color:#eaffef;box-shadow:0 0 14px rgba(125,255,165,.45)}
#btn-track.ping{box-shadow:0 0 0 6px rgba(125,255,165,.22),0 0 22px rgba(125,255,165,.7)}
.term{position:relative;margin:2px -4px 6px;padding:14px 16px 12px;border:1px solid rgba(125,255,165,.35);border-radius:6px;overflow:hidden;cursor:pointer;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 40%,#06200f,#010804 75%);
  color:#c3ffd5;text-shadow:0 0 7px rgba(125,255,165,.5);box-shadow:inset 0 0 40px rgba(0,0,0,.85),0 0 18px rgba(125,255,165,.12)}
.term::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(125,255,165,.07),transparent 35%);pointer-events:none;animation:termFl 3.6s infinite}
.term .th{display:flex;justify-content:space-between;font-family:var(--num);font-size:11px;letter-spacing:.2em;color:rgba(125,255,165,.75);border-bottom:1px dashed rgba(125,255,165,.3);padding-bottom:6px;margin-bottom:10px}
.term .tw{font-size:12px;letter-spacing:.14em;color:#7dffa8;margin-bottom:8px}
.term .tt{font-size:15px;line-height:1.95;letter-spacing:.05em;min-height:7em;margin:0}
.term .tf{margin-top:10px;font-size:10px;color:rgba(125,255,165,.45);letter-spacing:.14em}
.term .cur{display:inline-block;width:.55em;height:1.05em;background:currentColor;vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
.term.amber{border-color:rgba(255,176,58,.4);background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 40%,#231503,#080401 75%);color:#ffe2ad;text-shadow:0 0 7px rgba(255,176,58,.5)}
.term.amber .th{color:rgba(255,190,90,.8);border-bottom-color:rgba(255,176,58,.3)}
.term.amber .tw{color:#ffb03a}
.term.amber .tf{color:rgba(255,176,58,.45)}
@keyframes blink{50%{opacity:0}}
@keyframes termFl{0%,100%{opacity:.55}50%{opacity:1}}
#banner{position:absolute;left:0;right:0;top:31%;text-align:center;pointer-events:none}
#banner .bn{display:inline-block;padding:10px 28px;font-size:20px;font-weight:900;letter-spacing:.3em;color:#fff;
  background:linear-gradient(90deg,transparent,rgba(120,10,20,.7),transparent);text-shadow:0 0 12px rgba(255,60,80,.9);animation:bnIn 2.4s forwards}
#banner .bn.cy{background:linear-gradient(90deg,transparent,rgba(10,70,90,.75),transparent);text-shadow:0 0 12px rgba(95,231,255,.9)}
#banner .bn.gd{background:linear-gradient(90deg,transparent,rgba(110,80,10,.75),transparent);text-shadow:0 0 12px rgba(255,200,69,.9)}
#banner .bn small{display:block;font-size:12px;letter-spacing:.2em;font-weight:500;margin-top:4px;opacity:.85}
@keyframes bnIn{0%{opacity:0;transform:scaleX(.6)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#toasts{position:absolute;left:12px;bottom:calc(var(--sab) + 96px);display:flex;flex-direction:column-reverse;gap:4px;align-items:flex-start}
.toast{font-size:12.5px;padding:4px 10px 4px 8px;background:rgba(3,12,17,.85);border-left:3px solid var(--r0);animation:tIn 3.2s forwards;white-space:nowrap}
.toast b{font-weight:700}
@keyframes tIn{0%{opacity:0;transform:translateX(-14px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0;transform:translateY(4px)}}
#bossbar{position:absolute;left:14px;top:calc(var(--sat) + 118px);width:calc(100vw - 150px);max-width:360px;text-align:left;transition:opacity .4s}
#bossbar .nm{font-size:12px;letter-spacing:.3em;color:#ffd0d4;text-shadow:0 0 8px rgba(255,60,80,.9);font-weight:700}
#bossbar .nm em{font-style:normal;font-size:10px;color:var(--mute);margin-left:6px;letter-spacing:.1em}
#bossbar .bar{height:7px;margin-top:3px;background:rgba(0,0,0,.65);border:1px solid rgba(255,90,100,.5);position:relative;overflow:hidden}
#bossbar .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b0122a,#ff5a6a);width:100%}
#bossbar .bar b{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.8}
#dockbar{position:absolute;left:50%;top:calc(var(--sat) + 220px);transform:translateX(-50%);text-align:center;font-weight:900;letter-spacing:.2em;font-size:15px;text-shadow:0 0 10px rgba(95,231,255,.8)}
#dockbar b{display:block;font-family:var(--num);font-size:34px;letter-spacing:.05em;color:#fff}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;opacity:0;transition:opacity .15s}
#joy.on{opacity:1}
#joy .base{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(95,231,255,.35);background:radial-gradient(circle,rgba(95,231,255,.08),rgba(95,231,255,.02) 70%)}
#joy .knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(200,250,255,.9),rgba(60,170,200,.7));box-shadow:0 0 14px rgba(95,231,255,.5)}
#joyhint{position:absolute;left:28px;bottom:calc(var(--sab) + 120px);font-size:11px;color:var(--mute);letter-spacing:.14em;opacity:.8}
#ctl{position:absolute;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 16px);width:212px;height:240px}
#btn-act{position:absolute;right:0;bottom:0;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,rgba(255,120,80,.35),rgba(60,10,10,.78));border:2px solid rgba(255,140,100,.75);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:900;letter-spacing:.12em;color:#ffe2d6;box-shadow:0 0 18px rgba(255,90,60,.3)}
#btn-act svg{width:28px;height:28px;margin-bottom:1px}
#btn-act b{font-family:var(--num);font-size:13px;letter-spacing:.04em;margin-top:1px;color:#fff}
#btn-act.empty{filter:grayscale(.8) brightness(.7)}
#btn-act.held{transform:scale(.94);filter:brightness(1.25)}
#btn-act.breath{background:radial-gradient(circle at 50% 40%,rgba(120,200,255,.32),rgba(4,24,36,.86));border-color:rgba(160,225,255,.85);color:#e6f6ff;box-shadow:0 0 18px rgba(120,200,255,.3)}
#btn-act.breath.held{background:radial-gradient(circle at 50% 40%,rgba(160,230,255,.55),rgba(10,50,70,.9));box-shadow:0 0 24px rgba(160,230,255,.6)}
#btn-act .ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--rc,#9fe0ff) var(--p,100%),rgba(255,255,255,.08) 0);-webkit-mask:radial-gradient(circle,transparent 45px,#000 46px);mask:radial-gradient(circle,transparent 45px,#000 46px);opacity:0;transition:opacity .2s}
#btn-act.breath .ring{opacity:1}
#btn-stance{position:absolute;right:96px;bottom:0;width:58px;height:58px;border-radius:50%;background:rgba(4,16,22,.84);border:1.5px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--mute)}
#btn-stance svg{width:22px;height:22px}
#btn-stance.quiet{background:radial-gradient(circle at 50% 40%,rgba(95,231,255,.3),rgba(5,30,40,.88));border-color:rgba(95,231,255,.85);color:var(--cyan2);box-shadow:0 0 14px rgba(95,231,255,.35)}
#btn-tool{position:absolute;right:97px;bottom:66px;width:56px;height:56px;border-radius:50%;background:rgba(30,12,4,.84);border:1.5px solid rgba(255,160,90,.6);display:flex;align-items:center;justify-content:center}
#btn-tool canvas{width:34px;height:34px}
#btn-tool.empty{opacity:.4}
#btn-ctx{position:absolute;right:0;bottom:128px;min-width:118px;height:46px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:14px;font-weight:900;letter-spacing:.12em;color:#04161c;background:linear-gradient(180deg,#a6f4ff,#36bfdc);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:transform .12s;overflow:hidden;white-space:nowrap}
#btn-ctx.warn{background:linear-gradient(180deg,#ffd98a,#e7951c)}
#btn-ctx.off{background:linear-gradient(180deg,#5d6d74,#36434a);color:#b9c8ce}
#btn-ctx.hide{background:linear-gradient(180deg,#c9f2d8,#5fb98a)}
#btn-ctx:active{transform:scale(.95)}
#btn-ctx i{position:absolute;left:0;bottom:0;height:4px;background:#fff;width:0}
#btn-decoy,#btn-med{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(4,16,22,.82);border:1.5px solid var(--line2);
  display:flex;align-items:center;justify-content:center}
#btn-decoy{right:160px;bottom:6px}
#btn-med{right:160px;bottom:62px}
#btn-decoy svg,#btn-med svg{width:22px;height:22px}
#btn-decoy b,#btn-med b,#btn-tool b{position:absolute;right:-3px;bottom:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--cyan);color:#021016;font-family:var(--num);font-size:12px;line-height:18px;text-align:center;font-weight:700}
#btn-tool b{background:#ffa36b}
#btn-decoy.empty,#btn-med.empty{opacity:.4}
#btn-decoy .cd,#btn-med .cd,#btn-tool .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.6) var(--p,0%),transparent 0)}
#btn-trap{position:absolute;left:50%;top:calc(var(--sat) + 132px);transform:translateX(-50%);height:40px;padding:0 18px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;letter-spacing:.2em;
  color:#2a1a00;background:linear-gradient(180deg,#ffe28a,#c98a12);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);filter:grayscale(.55) brightness(.75)}
#btn-trap.ready{filter:none;animation:trapPulse .6s infinite;background:linear-gradient(180deg,#fff2b0,#ffb020)}
#btn-trap small{font-size:10px;letter-spacing:.08em;font-weight:700}
@keyframes trapPulse{50%{transform:translateX(-50%) scale(1.08)}}
#hideov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
#hideov.on{opacity:1}
#hideov.locker{background:radial-gradient(ellipse at 50% 48%,transparent 30%,rgba(0,0,0,.7) 80%),repeating-linear-gradient(180deg,rgba(0,0,0,.6) 0 16px,rgba(0,0,0,0) 16px 34px)}
#hideov.low{background:linear-gradient(180deg,rgba(0,0,0,.88) 0,rgba(0,0,0,.8) 24%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 74%,rgba(0,0,0,.82) 88%)}
#hideov .lbl{position:absolute;left:50%;top:calc(var(--sat) + 190px);transform:translateX(-50%);font-size:12px;letter-spacing:.3em;color:rgba(200,235,250,.75);text-shadow:0 0 8px #000;white-space:nowrap}
#grain{position:absolute;inset:-80px;pointer-events:none;background-size:160px 160px;opacity:0;display:none}
#grain.on{display:block;opacity:.62;animation:grainMove .5s steps(4) infinite}
@keyframes grainMove{0%{transform:translate(0,0)}25%{transform:translate(-53px,31px)}50%{transform:translate(27px,-61px)}75%{transform:translate(-17px,-23px)}100%{transform:translate(0,0)}}
#hurt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(255,20,40,.0);transition:box-shadow .25s}
#pausehint{position:absolute;left:50%;bottom:calc(var(--sab) + 6px);transform:translateX(-50%);font-size:10px;color:var(--dim);letter-spacing:.2em}

/* ===== 全畫面頁（標題、母船） ===== */
.screen{position:absolute;inset:0;overflow:hidden}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(var(--sab) + 9vh)}
#title .logo{position:absolute;left:0;right:0;top:calc(var(--sat) + 14vh);text-align:center}
#title .logo h1{margin:0;font-family:var(--serif);font-weight:900;font-size:min(26vw,128px);letter-spacing:.12em;line-height:1;color:#e9fbff;
  text-shadow:0 0 30px rgba(95,231,255,.45),0 0 80px rgba(95,231,255,.25);padding-left:.12em}
#title .logo .en{font-family:var(--num);font-weight:600;font-size:min(5vw,22px);letter-spacing:1.05em;color:var(--cyan);margin-top:6px;padding-left:1em}
#title .logo .tg{margin-top:22px;font-family:var(--serif);font-size:15px;letter-spacing:.32em;color:var(--mute);opacity:0;animation:enIn 1.6s ease-out 3.9s forwards}
#title .logo h1{position:relative;display:inline-block}
#title .logo h1 .ghost{opacity:0;animation:enIn 1.8s ease-out 3.1s forwards}
#title .logo h1 .sl{position:absolute;left:0;top:0;right:0;padding-left:.12em;opacity:0;text-shadow:none;animation:slIn 1.3s ease-out forwards}
#title .logo .en i{font-style:normal;opacity:0;animation:enIn .7s ease-out forwards}
@keyframes slIn{0%{opacity:0;transform:translateY(2px)}55%{opacity:.85}100%{opacity:1;transform:none}}
@keyframes enIn{to{opacity:1}}
#title .acts{display:flex;flex-direction:column;gap:12px;width:min(78vw,300px)}
#title .foot{position:absolute;bottom:calc(var(--sab) + 12px);left:0;right:0;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.2em}

#hub{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,rgba(18,60,80,.45),rgba(2,7,11,.0) 60%)}
#hub .hdr{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 14px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(2,7,11,.9),rgba(2,7,11,.6))}
#hub .hdr .ship{flex:1;line-height:1.15}
#hub .hdr .ship b{display:block;font-family:var(--serif);font-size:18px;letter-spacing:.2em}
#hub .hdr .ship span{font-size:10px;letter-spacing:.3em;color:var(--mute);font-family:var(--num)}
#hub .cr{display:flex;align-items:center;gap:6px;font-family:var(--num);font-weight:700;font-size:20px;color:var(--gold);padding:4px 10px;border:1px solid rgba(255,200,69,.35);background:rgba(40,30,5,.4)}
#hub .cr small{font-family:var(--sans);font-size:10px;color:var(--mute);font-weight:500;letter-spacing:.1em}
#hub .body{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 24px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#hub .tabs{flex:none;display:flex;border-top:1px solid var(--line);background:rgba(2,9,13,.94);padding-bottom:var(--sab)}
#hub .tabs button{flex:1;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.14em;color:var(--mute);position:relative}
#hub .tabs button svg{width:22px;height:22px;opacity:.7}
#hub .tabs button.on{color:var(--cyan2)}
#hub .tabs button.on svg{opacity:1;filter:drop-shadow(0 0 6px rgba(95,231,255,.7))}
#hub .tabs button.on::after{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#hub .tabs button .dot{position:absolute;top:10px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--red)}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:4px 0 10px}
.sec-h h2{margin:0;font-family:var(--serif);font-size:18px;letter-spacing:.2em;font-weight:700}
.sec-h span{font-size:11px;color:var(--mute);letter-spacing:.12em}
.wrap{max-width:720px;margin:0 auto}

/* 下潛卡 */
.dive{position:relative;display:block;width:100%;text-align:left;margin-bottom:12px;padding:14px 14px 12px;overflow:hidden;background:linear-gradient(110deg,rgba(10,34,48,.95),rgba(4,14,20,.95));border:1px solid var(--line)}
.dive .art{position:absolute;right:0;top:0;bottom:0;width:46%;opacity:.55;-webkit-mask:linear-gradient(90deg,transparent,#000 60%);mask:linear-gradient(90deg,transparent,#000 60%)}
.dive .no{font-family:var(--num);font-size:12px;letter-spacing:.3em;color:var(--cyan)}
.dive h3{margin:2px 0 0;font-family:var(--serif);font-size:21px;letter-spacing:.14em;position:relative}
.dive .dp{font-family:var(--num);font-size:13px;color:var(--mute);letter-spacing:.1em;position:relative}
.dive .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11.5px;color:var(--mute);position:relative}
.dive .meta b{font-family:var(--num);color:var(--text);font-size:13px}
.dive .stars{display:flex;gap:4px;position:relative;margin-top:8px}
.dive .stars i{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--dim);font-style:normal;font-size:12px;color:var(--dim);transform:rotate(45deg)}
.dive .stars i span{transform:rotate(-45deg)}
.dive .stars i.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(255,200,69,.4)}
.dive.lock{filter:grayscale(.9) brightness(.55)}
.dive .go{position:absolute;right:12px;bottom:12px}
.dive .new{position:absolute;right:12px;top:12px}
.dive.endless{background:linear-gradient(110deg,rgba(48,20,60,.9),rgba(10,6,16,.95));border-color:rgba(180,124,255,.4)}
/* 整備 */
.upg{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line)}
.upg .ic{flex:none;width:44px;height:44px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;background:rgba(95,231,255,.06)}
.upg .ic svg{width:24px;height:24px}
.upg .tx{flex:1;min-width:0}
.upg .tx b{font-size:15px;letter-spacing:.08em}
.upg .tx p{margin:2px 0 0;font-size:12px;color:var(--mute);line-height:1.45}
.upg .pips{display:flex;gap:3px;margin-top:5px}
.upg .pips i{width:14px;height:4px;background:rgba(255,255,255,.12)}
.upg .pips i.on{background:var(--cyan);box-shadow:0 0 5px var(--cyan)}
.upg .buy{flex:none;min-width:84px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wcard{padding:10px;background:var(--panel);border:1px solid var(--line);min-height:112px}
.wcard canvas{width:56px;height:56px;display:block}
.wcard b{display:block;margin-top:4px;font-size:14px;letter-spacing:.06em}
.wcard p{margin:3px 0 0;font-size:11px;color:var(--mute);line-height:1.45}
.wcard.lock{opacity:.45}
.wcard .nz{font-size:10.5px;margin-top:4px}
/* 生還者 */
.sv{display:flex;gap:12px;padding:12px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line)}
.sv canvas{flex:none;width:64px;height:64px;border:1px solid var(--line);background:#071820}
.sv .tx{flex:1;min-width:0}
.sv .tx b{font-size:15px;letter-spacing:.08em}
.sv .tx b em{font-style:normal;font-size:11px;color:var(--mute);margin-left:6px;letter-spacing:.06em}
.sv .tx .pk{font-size:12px;color:var(--green);margin-top:3px}
.sv .tx p{margin:6px 0 0;font-size:12.5px;line-height:1.65;color:#b7cbd2;font-family:var(--serif)}
.sv.lock .tx b{color:var(--mute)}
.sv.lock canvas{filter:brightness(.25)}
/* 檔案 */
.lgsec{margin-bottom:16px}
.lgsec h4{margin:0 0 6px;font-size:12px;letter-spacing:.24em;color:var(--cyan);font-weight:700}
.lg{position:relative;display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);font-size:13.5px}
.lg small{display:block;font-size:11px;color:var(--mute);letter-spacing:.08em;margin-bottom:2px}
.lg.lock{color:var(--dim);border-style:dashed}
.lg.unread{border-left:2px solid var(--red)}
.lg.unread::after{content:"未讀";position:absolute;right:10px;top:9px;font-size:10px;color:var(--red);letter-spacing:.1em}
/* 藏品 */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.rl{padding:8px 6px 10px;text-align:center;background:var(--panel);border:1px solid var(--line);min-height:120px}
.rl canvas{width:60px;height:60px;display:block;margin:0 auto}
.rl b{display:block;font-size:12px;margin-top:4px;line-height:1.3}
.rl .st{font-size:11px;color:var(--gold);letter-spacing:.1em;margin-top:2px}
.rl.lock canvas{filter:brightness(0) opacity(.5)}
.rl.lock b{color:var(--dim)}

/* ===== 彈窗 ===== */
.modal{position:absolute;inset:0;background:rgba(1,5,8,.78);display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px);z-index:20;animation:mIn .2s}
@keyframes mIn{from{opacity:0}to{opacity:1}}
.mbox{width:min(100%,460px);max-height:100%;overflow-y:auto;padding:18px 16px;touch-action:pan-y}
.mbox h3{margin:0 0 4px;font-family:var(--serif);font-size:20px;letter-spacing:.2em;text-align:center}
.mbox .sub{text-align:center;font-size:12px;color:var(--mute);letter-spacing:.14em;margin-bottom:14px}
.mbox .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
/* 升級三選一 */
.lvup{width:min(100%,520px)}
.lvup h3{color:var(--cyan2);text-shadow:0 0 14px rgba(95,231,255,.6)}
.cards{display:flex;flex-direction:column;gap:9px}
.card{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 12px 12px 10px;background:linear-gradient(100deg,rgba(14,38,52,.97),rgba(5,16,22,.97));border:1px solid var(--line);
  animation:cIn .35s backwards;overflow:hidden}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--r2));box-shadow:0 0 14px var(--c,var(--r2))}
.card canvas{flex:none;width:58px;height:58px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3)}
.card .tx{flex:1;min-width:0}
.card .k{font-size:10.5px;letter-spacing:.18em;color:var(--c,var(--r2));font-weight:700}
.card b{display:block;font-size:17px;letter-spacing:.06em;margin-top:1px}
.card b em{font-style:normal;font-family:var(--num);font-size:14px;color:var(--mute);margin-left:6px}
.card p{margin:3px 0 0;font-size:12.5px;line-height:1.5;color:#bcd0d7}
.card .nz{display:inline-block;margin-top:5px;font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border:1px solid rgba(255,255,255,.18);color:var(--mute)}
.card.gold{background:linear-gradient(100deg,rgba(60,46,10,.97),rgba(16,12,4,.97));border-color:rgba(255,200,69,.6)}
.card:active{filter:brightness(1.25)}
.nz.n0{color:var(--green);border-color:rgba(95,227,154,.4)}.nz.n1{color:#9fd8ff}.nz.n2{color:var(--amber);border-color:rgba(255,176,58,.45)}.nz.n3{color:var(--red);border-color:rgba(255,77,94,.5)}
/* 結算 */
.res h3{font-size:26px}
.res .big{text-align:center;font-family:var(--num);font-size:40px;font-weight:700;color:var(--gold);text-shadow:0 0 18px rgba(255,200,69,.4);margin:6px 0}
.res .lines{font-size:13px;line-height:1.9}
.res .lines div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.08)}
.res .lines b{font-family:var(--num);font-size:15px}
.res .loot{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.res .loot span{font-size:11px;padding:2px 6px;border:1px solid currentColor;opacity:.9}
.res .stars{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.res .stars div{font-size:11px;text-align:center;color:var(--mute);width:90px}
.res .stars i{display:block;margin:0 auto 4px;width:28px;height:28px;border:1px solid var(--dim);transform:rotate(45deg)}
.res .stars .on{color:var(--gold)}
.res .stars .on i{border-color:var(--gold);background:rgba(255,200,69,.18);box-shadow:0 0 10px rgba(255,200,69,.5)}
.res .new{color:var(--gold);font-size:12px;text-align:center;margin-top:8px;letter-spacing:.1em}
/* 設定 */
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.set input[type=range]{width:46%;accent-color:var(--cyan)}
.set span small{display:block;font-size:11px;color:var(--mute);margin-top:2px;letter-spacing:.02em}
.tgl{width:52px;height:28px;border-radius:14px;background:rgba(255,255,255,.12);position:relative}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#89a1ab;transition:left .15s}
.tgl.on{background:rgba(95,231,255,.4)}
.tgl.on::after{left:27px;background:var(--cyan2)}
/* 地圖 */
.mapbox canvas{width:100%;display:block;background:#010a05;border:1px solid rgba(125,255,165,.35);border-radius:4px;box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 0 16px rgba(125,255,165,.1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}

/* ===== 劇情 ===== */
.story{position:absolute;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(var(--sat) + 30px) 28px calc(var(--sab) + 30px)}
.story canvas{position:absolute;inset:0;width:100%;height:100%}
.story .txt{position:relative;max-width:560px;font-family:var(--serif);font-size:18px;line-height:2;letter-spacing:.08em;text-align:center;color:#e6f6fa;text-shadow:0 2px 12px #000;min-height:6em;display:flex;align-items:center;justify-content:center}
.story .txt .ln{opacity:0;animation:lnIn 1.2s forwards}
.story .txt .sp{display:block;font-size:12px;letter-spacing:.3em;color:var(--cyan);margin-bottom:6px;font-family:var(--sans)}
@keyframes lnIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.story .tap{position:absolute;bottom:calc(var(--sab) + 26px);left:0;right:0;text-align:center;font-size:11px;letter-spacing:.4em;color:var(--mute);animation:blink 2s infinite}
.story .skip{position:absolute;top:calc(var(--sat) + 12px);right:14px;font-size:12px;letter-spacing:.2em;color:var(--mute);padding:8px}
.story .choice{position:relative;display:flex;flex-direction:column;gap:12px;margin-top:26px;width:min(86vw,380px)}
.story .choice .btn{min-height:56px;font-size:15px;letter-spacing:.1em;line-height:1.35;padding:6px 16px}
.story .choice .btn small{display:block;font-size:11.5px;color:rgba(0,10,16,.62);letter-spacing:.06em;font-weight:700;margin-top:2px}
@keyframes blink{50%{opacity:.35}}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .45s;z-index:40}
#fade.on{opacity:1}
#rot{display:none}
@media (orientation:landscape) and (max-height:500px){
  #hud-top{height:52px}
  #hud-pressure svg{width:48px;height:48px}
  #hud-pressure .pv{top:12px;font-size:15px}
  #hud-pressure .pl{top:28px}
  #minimap{width:84px;height:84px}
  #hud-heart{left:auto;right:100px}
  #hud-obj{top:calc(var(--sat) + 98px)}
  #hud-weapons{top:calc(var(--sat) + 58px);bottom:auto;right:auto;left:12px;flex-direction:row}
  #hud-wave{top:calc(var(--sat) + 76px)}
  #subtitle{top:auto;bottom:calc(var(--sab) + 12px);left:210px;right:250px;justify-content:center}
  #bossbar{top:calc(var(--sat) + 10px);left:calc(50% + 44px);right:auto;transform:none;width:min(210px,calc(50vw - 236px))}
  #dockbar{top:calc(var(--sat) + 90px)}
  #banner{top:30%}
  #btn-track{right:214px;bottom:2px}
  #btn-trap{top:calc(var(--sat) + 64px)}
  #hideov .lbl{top:calc(var(--sat) + 100px)}
  #title .logo{top:calc(var(--sat) + 6vh)}
  #title .logo h1{font-size:min(18vh,110px)}
}
@media (orientation:portrait) and (max-width:430px){
  #hud-heart small{display:none}
}
@media (min-width:900px){
  #ctl{transform:scale(1.08);transform-origin:right bottom}
  .story .txt{font-size:20px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="grain"></div>
  <div id="hurt"></div>
  <div id="hud" class="hidden">
    <div id="hideov"><div class="lbl"></div></div>
    <div id="hud-top">
      <button id="btn-pause" class="hbtn" aria-label="暫停"></button>
      <div id="hud-sector"><div class="nm"></div><div class="dp num"></div><div class="bag"></div></div>
      <div id="hud-pressure"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="rgba(3,12,17,.8)" stroke="rgba(255,255,255,.1)" stroke-width="5"/><circle id="pring" cx="30" cy="30" r="25" fill="none" stroke="#5fe7ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157" transform="rotate(-90 30 30)"/></svg><div class="pv num">0%</div><div class="pl">深壓</div><div class="ps">平靜</div></div>
      <div id="hud-heart"></div>
      <canvas id="minimap" width="192" height="224"></canvas>
    </div>
    <div id="hud-wave"></div>
    <div id="hud-obj"></div>
    <div id="subtitle"></div>
    <div id="dockbar" class="hidden"></div>
    <div id="banner"></div>
    <div id="toasts"></div>
    <div id="hud-hp">
      <div class="row"><span>生命</span><div class="bar hp"><s></s><i></i></div><span class="hpv num"></span></div>
      <div class="row o2row hidden" style="margin-top:4px"><span>氧氣</span><div class="bar o2"><i></i></div></div>
      <div class="inv"><span class="fls">震爆彈<b>1</b></span><span class="bat">電池<b>0</b></span><span class="fus hidden">保險絲<b>0</b></span><span class="key hidden">鑰卡<b style="color:#ff6b6b">●</b></span></div>

  startMusic() {

const SAVE_KEY = 'undertow.v1';
let G = null;
const MEM_STORE = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return MEM_STORE[k] || null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { MEM_STORE[k] = v; } }
function newG() {
  return {
    v: 1, credits: 0, meta: {}, weapons: ['rivet', 'arc'], survivors: {}, logs: {}, read: {}, relics: {},
    sectors: SECTORS.map((s, i) => ({ unlocked: i === 0, cleared: false, stars: [false, false, false], best: 0, runs: 0 })),
    endless: { unlocked: false, best: 0 }, endings: {}, tips: {}, seenPrologue: false, lastWeapon: 'rivet', lastTool: null,
    stats: { dives: 0, kills: 0, deaths: 0, extracts: 0, hunterKills: 0, credits: 0 },
    settings: { music: .7, sfx: .9, shake: true, vib: true, nums: true, voice: true, flash: true, grain: true },
    newStuff: {},
  };
}
function loadGame() {
  let d = null;
  try { d = JSON.parse(lsGet(SAVE_KEY) || 'null'); } catch (e) { d = null; }
  const g = newG();
  if (d && d.v === 1) {
    Object.assign(g, d);
    g.settings = Object.assign(newG().settings, d.settings || {});
    g.stats = Object.assign(newG().stats, d.stats || {});
    const base = newG().sectors;
    g.sectors = base.map((s, i) => Object.assign(s, (d.sectors || [])[i] || {}));
    g.endless = Object.assign({ unlocked: false, best: 0 }, d.endless || {});
    // v2.0：通關過的區段，補發該區的裝備藍圖（第一區改給焊槍）
    g.sectors.forEach((s, i) => { const bp = BLUEPRINT_PLAN[i]; if (s.cleared && bp && !g.weapons.includes(bp)) g.weapons.push(bp); });
    g.weapons = g.weapons.filter(id => WEAPONS[id]);
  }
  G = g;
  return g;
}
function saveGame() { try { lsSet(SAVE_KEY, JSON.stringify(G)); } catch (e) { } }
function metaLv(id) { return G.meta[id] || 0; }
function relicBonus(k) {
  let s = 0;
  for (const r of RELICS) { const st = G.relics[r.id] || 0; if (st && r.k === k) s += r.v * st; }
  return s;
}
function survPerk(k) { for (const id in G.survivors) if (G.survivors[id] && SURV[id] && SURV[id].perk === k) return true; return false; }
function survCount() { return SURV_ORDER.filter(id => G.survivors[id]).length; }
/* 存檔碼：換手機時可以帶走進度 */
function exportCode() { try { return 'UT1:' + btoa(unescape(encodeURIComponent(JSON.stringify(G)))); } catch (e) { return ''; } }
function importCode(s) {
  try {
    s = (s || '').trim(); if (!s.startsWith('UT1:')) return false;
    const d = JSON.parse(decodeURIComponent(escape(atob(s.slice(4))))); if (!d || d.v !== 1) return false;
    lsSet(SAVE_KEY, JSON.stringify(d)); loadGame(); return true;
  } catch (e) { return false; }
}

function genMap(si, seed, tier) {
  const S = sectorCfg(si, tier), rng = RNG(seed);
  const C = S.cols, F = S.floors;
  const M = { S, si, C, F, rooms: [], doors: [], ladders: [], vents: [], seed };
  const idx = (c, f) => f * C + c;
  for (let f = 0; f < F; f++) for (let c = 0; c < C; c++) {
    M.rooms.push({ i: idx(c, f), c, f, x0: c * RW, y0: f * FH, floorY: f * FH + FH - SLAB, theme: null, water: 0, breach: null, collapsed: false, explored: false,
      props: [], spots: [], vent: null, ladUp: null, ladDown: null, doorL: null, doorR: null, special: null, flick: rng.f(), seed: rng.int(1, 1e9), survivor: null, lightDead: false });
  }
  const R = (c, f) => (c < 0 || c >= C || f < 0 || f >= F) ? null : M.rooms[idx(c, f)];
  const sc = rng.int(0, C - 1);
  const start = R(sc, 0);
  const dc = sc < C / 2 ? C - 1 : 0;
  const dock = R(dc, F - 1);
  start.special = 'start'; dock.special = 'dock';
  // 崩塌艙（不能進的格子，讓結構更像迷宮）
  const nCol = C * F >= 20 ? rng.int(1, 2) : rng.int(0, 1);
  for (let k = 0, tries = 0; k < nCol && tries < 40; tries++) {
    const r = R(rng.int(0, C - 1), rng.int(1, F - 1));
    if (r.special || r.collapsed) continue;
    if (Math.abs(r.c - sc) + r.f <= 1) continue;
    r.collapsed = true; k++;
  }
  // 梯井
  const addLadder = (c, f) => {
    const up = R(c, f), dn = R(c, f + 1);
    if (!up || !dn || up.collapsed || dn.collapsed || up.ladDown) return false;
    const opts = [86, RW - 86, RW / 2 + 40, RW / 2 - 40];
    let lx = (dn.special === 'dock' || up.special === 'dock') ? rng.pick([60, RW - 60]) : rng.pick(opts);
    if (dn.ladDown && Math.abs(dn.ladDown.x - (c * RW + lx)) < 70) lx = RW - lx;
    if (up.ladUp && Math.abs(up.ladUp.x - (c * RW + lx)) < 70) lx = RW - lx;
    const L = { c, f, x: c * RW + lx, y1: up.floorY, y2: dn.floorY };
    M.ladders.push(L); up.ladDown = L; dn.ladUp = L; return true;
  };
  for (let f = 0; f < F - 1; f++) {
    const cols = rng.shuffle([...Array(C).keys()]);
    const n = C >= 4 ? rng.int(1, 2) : (rng.chance(.4) ? 2 : 1);
    let made = 0; for (const c of cols) { if (made >= n) break; if (addLadder(c, f)) made++; }
  }
  // 連通性：每間艙都要走得到
  const neighbors = (r) => {
    const out = [];
    const l = R(r.c - 1, r.f), rr = R(r.c + 1, r.f);
    if (l && !l.collapsed) out.push(l); if (rr && !rr.collapsed) out.push(rr);
    if (r.ladDown) out.push(R(r.c, r.f + 1)); if (r.ladUp) out.push(R(r.c, r.f - 1));
    return out;
  };
  const reach = () => { const seen = new Set([start.i]), q = [start]; while (q.length) { const r = q.shift(); for (const n of neighbors(r)) if (!seen.has(n.i)) { seen.add(n.i); q.push(n); } } return seen; };
  for (let guard = 0; guard < 30; guard++) {
    const seen = reach();
    const lost = M.rooms.filter(r => !r.collapsed && !seen.has(r.i));
    if (!lost.length) break;
    let fixed = false;
    for (const r of lost) {
      for (const [dc2, df] of [[0, -1], [0, 1]]) {
        const n = R(r.c + dc2, r.f + df);
        if (n && !n.collapsed && seen.has(n.i)) { if (df < 0 ? addLadder(r.c, r.f - 1) : addLadder(r.c, r.f)) { fixed = true; break; } }
      }
      if (fixed) break;
    }
    if (!fixed) {
      // 被坍塌艙包圍：打通一間相鄰的坍塌艙
      let open = null;
      for (const r of lost) { for (const [dc2, df] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { const n = R(r.c + dc2, r.f + df); if (n && n.collapsed) { open = n; break; } } if (open) break; }
      if (!open) break;
      open.collapsed = false;
    }
  }
  // 艙門
  for (let f = 0; f < F; f++) for (let c = 1; c < C; c++) {
    const a = R(c - 1, f), b = R(c, f);
    if (a.collapsed || b.collapsed) continue;
    const d = { i: M.doors.length, c, f, x: c * RW, y: a.floorY, a: a.i, b: b.i, state: rng.chance(.42) ? 'closed' : 'open', lock: null, hp: 100, hpMax: 100, open: 0, hitT: 0, shake: 0, weld: 0 };
    d.open = d.state === 'open' ? 1 : 0;
    M.doors.push(d); a.doorR = d; b.doorL = d;
  }
  // 圖距離
  const gdist = (from) => {
    const D = new Map([[from.i, 0]]), q = [from];
    while (q.length) { const r = q.shift(); for (const n of neighbors(r)) { if (!D.has(n.i)) { D.set(n.i, D.get(r.i) + 1); q.push(n); } } }
    return D;
  };
  const dStart = gdist(start);
  const ok = r => !r.collapsed && !r.special;
  // 上鎖的金庫：邊緣、沒梯井、只有一扇門的死巷
  const vaultCands = M.rooms.filter(r => ok(r) && (r.c === 0 || r.c === C - 1) && !r.ladUp && !r.ladDown && ((r.c === 0 && r.doorR && !r.doorL) || (r.c === C - 1 && r.doorL && !r.doorR)) && (dStart.get(r.i) || 0) >= 2);
  let vault = null;
  if (vaultCands.length) {
    vault = rng.pick(vaultCands); vault.special = 'vault';
    const d = vault.doorL || vault.doorR; d.state = 'locked'; d.lock = 'red'; d.open = 0; d.hp = 999; d.hpMax = 999;
  }
  // 最終區：收容深艙
  let deep = null;
  if (S.final) {
    const cands = M.rooms.filter(r => ok(r) && r.f === F - 1).sort((a, b) => (dStart.get(b.i) || 0) - (dStart.get(a.i) || 0));
    deep = cands[0] || M.rooms.filter(ok).pop(); deep.special = 'deep'; deep.theme = 'deep';
    // 深艙的梯子移到牆邊，中間留給收容槽
    if (deep.ladUp) {
      const up = R(deep.c, deep.f - 1); let lx = RW - 50;
      if (up && up.ladUp && Math.abs(up.ladUp.x - (deep.c * RW + lx)) < 70) lx = 50;
      deep.ladUp.x = deep.c * RW + lx;
    }
  }
  // 逃生艙
  const nPods = C * F >= 18 ? 2 : 1;
  const podC = rng.shuffle(M.rooms.filter(r => ok(r) && (dStart.get(r.i) || 0) >= 2));
  for (let k = 0; k < nPods && k < podC.length; k++) { podC[k].special = 'pod'; }
  // 主題
  const themes = rng.shuffle(S.themes.slice());
  let ti = 0;
  for (const r of M.rooms) {
    if (r.collapsed) continue;
    if (r.special === 'start') r.theme = 'airlock';
    else if (r.special === 'dock') r.theme = 'dock';
    else if (r.special === 'pod') r.theme = 'pod';
    else if (!r.theme) r.theme = themes[ti++ % themes.length];
    const lm = THEMES[r.theme].light;
    r.light = lm; // lit / emer / dark
  }
  // 通風口（獵手的通道）
  for (let f = 0; f < F; f++) {
    const cands = M.rooms.filter(r => r.f === f && !r.collapsed && r.special !== 'start' && r.special !== 'vault');
    if (!cands.length) continue;
    const n = C >= 4 ? 2 : 1;
    rng.shuffle(cands).slice(0, n).forEach(r => { const vx = r.x0 + rng.pick([70, RW - 70, RW / 2]); r.vent = { x: vx, y: r.y0 + 52, room: r.i, shake: 0 }; M.vents.push(r.vent); });
  }
  // 擺設
  GEN_BONUS = S.endless ? .04 + .008 * S.tier : si * .012;
  for (const r of M.rooms) if (!r.collapsed) layoutRoom(r, rng);
  // 生還者
  M.survivors = [];
  const named = S.survivors.filter(id => !G.survivors[id]);
  const nSurv = S.endless ? 2 : S.survivors.length;
  const survRooms = [];
  if (vault) survRooms.push(vault);
  const sc2 = rng.shuffle(M.rooms.filter(r => ok(r) && (dStart.get(r.i) || 0) >= 2 && r !== vault));
  for (const r of sc2) { if (survRooms.length >= nSurv) break; if (!survRooms.some(o => Math.abs(o.c - r.c) + Math.abs(o.f - r.f) < 2)) survRooms.push(r); }
  for (const r of sc2) { if (survRooms.length >= nSurv) break; if (!survRooms.includes(r)) survRooms.push(r); }
  survRooms.slice(0, nSurv).forEach((r, k) => {
    const id = named[k] || null;
    const name = id ? SURV[id].name : rng.pick(GENERIC_SURV);
    const x = r.x0 + freeX(r, rng, [64, RW - 64]);
    const s = { id, name, room: r.i, x, y: r.floorY, state: 'hide', t: 0, hue: id ? SURV[id].hue : rng.int(0, 360) };
    r.survivor = s; M.survivors.push(s);
  });
  // 搜索點：鑰卡、日誌、強化艙、一般
  const spotRooms = M.rooms.filter(r => !r.collapsed && r.spots.length);
  const takeSpot = (r, pref) => { const free = r.spots.filter(s => s.kind === 'loot'); if (!free.length) return null; return pref ? (free.find(pref) || free[0]) : rng.pick(free); };
  if (vault) {
    const dV = gdist(vault);
    const kc = rng.shuffle(spotRooms.filter(r => r !== vault && r.special !== 'start' && (dV.get(r.i) || 0) >= 2));
    const kr = kc[0] || spotRooms.find(r => r !== vault);
    if (kr) { const sp = takeSpot(kr); if (sp) { sp.kind = 'key'; sp.rar = 3; } }
    vault.spots.forEach(s => { if (s.kind === 'loot') s.rar = Math.max(s.rar, rng.chance(.5) ? 4 : 3); });
  }
  const logRooms = rng.shuffle(spotRooms.filter(r => r.special !== 'start'));
  S.logs.forEach((lid, k) => {
    const r = logRooms[k % logRooms.length]; if (!r) return;
    const sp = takeSpot(r, s => ['console', 'desk', 'body', 'server'].includes(s.prop)); if (sp) { sp.kind = 'log'; sp.log = lid; sp.rar = 2; }
  });
  const nCache = 3 + (C * F >= 20 ? 1 : 0);
  rng.shuffle(spotRooms.filter(r => r.special !== 'start')).slice(0, nCache).forEach(r => { const sp = takeSpot(r); if (sp) { sp.kind = 'cache'; sp.rar = 3; } });
  // 陷阱艙：有配電箱的艙，插上保險絲、灌水，就能把聆電死在裡面
  const trapPref = ['pump', 'power', 'laundry', 'workshop', 'tanks', 'freezer', 'storage', 'lab', 'mess', 'server'];
  const trapC = rng.shuffle(M.rooms.filter(r => ok(r) && r.special !== 'vault' && (r.doorL || r.doorR) && (dStart.get(r.i) || 0) >= 1))
    .sort((a, b) => (trapPref.includes(b.theme) ? 1 : 0) - (trapPref.includes(a.theme) ? 1 : 0));
  M.traps = [];
  const nTrap = C * F >= 20 ? 2 : 1;
  for (const r of trapC) {
    if (M.traps.length >= nTrap) break;
    if (M.traps.some(i => { const o = M.rooms[i]; return Math.abs(o.c - r.c) + Math.abs(o.f - r.f) < 2; })) continue;
    const left = !(r.vent && r.vent.x - r.x0 < RW / 2);
    r.trap = { bx: r.x0 + (left ? 62 : RW - 62), by: r.y0 + (r.f === 0 ? 18 : 0) + 104, vx: r.x0 + (left ? RW - 92 : 92), state: 'nofuse', flood: 0, seen: false };
    M.traps.push(r.i);
  }
  // 每個陷阱一定有一根保險絲放在別的艙
  for (const ti of M.traps) {
    const dT = gdist(M.rooms[ti]);
    const fc = rng.shuffle(spotRooms.filter(r => r.i !== ti && r.special !== 'start' && r.special !== 'vault' && (dT.get(r.i) || 0) >= 2 && r.spots.some(s => s.kind === 'loot')));
    const fr = fc[0] || spotRooms.find(r => r.i !== ti && r.spots.some(s => s.kind === 'loot'));
    if (fr) { const sp = takeSpot(fr); if (sp) { sp.kind = 'fuse'; sp.rar = 2; } }
  }
  // 起點房只給一點普通東西
  start.spots.forEach(s => { if (s.kind === 'loot') s.rar = Math.min(s.rar, 1); });
  // 住在站裡的東西：遊蕩的回聲人、長在牆裡的人
  M.residents = [];
  const far = rng.shuffle(M.rooms.filter(r => !r.collapsed && r.special !== 'start' && r.special !== 'dock' && r.special !== 'deep' && !r.survivor && (dStart.get(r.i) || 0) >= 2));
  for (let k = 0; k < S.husks && far.length; k++) { const r = far[k % far.length]; M.residents.push({ room: r.i, type: 'husk', x: r.x0 + rng.int(70, RW - 70) }); }
  let walls = 0;
  for (const r of rng.shuffle(far.slice())) {
    if (walls >= S.walls) break;
    if (M.traps.includes(r.i) || M.residents.some(o => o.room === r.i && o.type === 'wall')) continue;
    const gx = wallGap(r); if (gx == null) continue;

  }
  M.start = start.i; M.dock = dock.i; M.vault = vault ? vault.i : -1; M.deep = deep ? deep.i : -1;
  M.dist = dStart;
  return M;
}

/* 牆上空著、可以「長」一個人的位置（不擋家具、通風口、梯子） */
function wallGap(r) {
  const busy = r.props.map(p => [p.x - 10, p.x + p.w + 10]);
  if (r.vent) busy.push([r.vent.x - r.x0 - 44, r.vent.x - r.x0 + 44]);
  if (r.ladUp) busy.push([r.ladUp.x - r.x0 - 40, r.ladUp.x - r.x0 + 40]);
  if (r.ladDown) busy.push([r.ladDown.x - r.x0 - 40, r.ladDown.x - r.x0 + 40]);
  if (r.survivor) busy.push([r.survivor.x - r.x0 - 50, r.survivor.x - r.x0 + 50]);
  for (const x of [RW / 2, 120, RW - 120, 90, RW - 90, 150, RW - 150]) if (busy.every(([a, b]) => x + 30 < a || x - 30 > b)) return x;
  return null;
}
function freeX(r, rng, pref) {
  const bad = [];
  if (r.ladUp) bad.push(r.ladUp.x - r.x0); if (r.ladDown) bad.push(r.ladDown.x - r.x0);
  for (const p of pref) if (bad.every(b => Math.abs(b - p) > 50)) return p;
  return RW / 2;
}

function layoutRoom(r, rng) {
  const forb = [[0, 40], [RW - 40, RW]];
  if (r.ladUp) forb.push([r.ladUp.x - r.x0 - 30, r.ladUp.x - r.x0 + 30]);
  if (r.ladDown) forb.push([r.ladDown.x - r.x0 - 34, r.ladDown.x - r.x0 + 34]);
  const props = [];
  const fits = (x, w) => forb.every(([a, b]) => x + w <= a || x >= b) && props.every(p => x + w + 6 <= p.x || x >= p.x + p.w + 6);
  const place = (kind, x) => { const w = PROPW[kind]; if (x >= 34 && x + w <= RW - 34 && fits(x, w)) { props.push({ kind, x, w }); forb.push([x - 4, x + w + 4]); return true; } return false; };
  const must = (kind, xs) => { for (const x of xs) if (place(kind, x)) return; const x = xs[0], w = PROPW[kind]; for (let k = props.length - 1; k >= 0; k--) { const q = props[k]; if (!(x + w + 6 <= q.x || x >= q.x + q.w + 6)) props.splice(k, 1); } props.push({ kind, x, w }); forb.push([x - 4, x + w + 4]); };
  if (r.theme === 'dock') {
    for (const mx of [RW / 2 - PROPW.moonpool / 2 + 20, 128, 136, 112, 60, 48, 40]) if (place('moonpool', mx)) break;
    if (!props.some(p => p.kind === 'moonpool')) { props.push({ kind: 'moonpool', x: 128, w: PROPW.moonpool }); forb.push([124, 128 + PROPW.moonpool + 4]); }
    for (const cx of [44, 40, 250, 270]) if (place('console', cx)) break;
    // 撤離塢也要有地方躲：撐倒數的時候牠一定會來
    for (const lx of [126, 84, 270, 300, 240, 50]) if (place('locker', lx)) break;
  }
  else if (r.theme === 'deep') {
    const lad = r.ladUp ? r.ladUp.x - r.x0 : null;
    must('bigtank', lad == null ? [95, 110, 80] : lad > RW / 2 ? [100, 90, 80, 70] : [120, 130, 140, 150]);
  }
  else if (r.theme === 'pod') { must('podhatch', [RW / 2 - 37, 110, 180, 60, 230, 250]); }
  else if (r.theme === 'airlock') { must('hatch', r.c === 0 ? [40, 120, 200, 250] : [RW - 40 - 72, 160, 90, 40]); }
  const list = THEME_PROPS[r.theme] || ['crate'];
  for (let k = 0; k < 9; k++) {
    const kind = list[k % list.length];
    const w = PROPW[kind];
    let placed = false;
    for (let t = 0; t < 8 && !placed; t++) placed = place(kind, rng.int(40, RW - 40 - w));
  }
  if (rng.chance(.22) && r.special !== 'start') { for (let t = 0; t < 6; t++) if (place('body', rng.int(40, RW - 100))) break; }
  props.sort((a, b) => a.x - b.x);
  r.props = props;
  r.hides = props.filter(p => HIDEABLE[p.kind]).map(p => ({ x: r.x0 + p.x + p.w / 2, w: p.w, kind: p.kind, type: HIDEABLE[p.kind], room: r.i }));
  // 撤離塢：月池邊的維修坑也能躲（撐倒數的時候牠一定會來）
  const mp = props.find(p => p.kind === 'moonpool');
  if (mp) r.hides.push({ x: r.x0 + mp.x + mp.w - 24, w: 40, kind: 'grate', type: 'bed', room: r.i });
  r.machines = props.filter(p => MACHINES[p.kind]).map(p => ({ x: r.x0 + p.x + p.w / 2, kind: p.kind, room: r.i, on: 0, cd: 0, broken: false, pulse: 0 }));
  // 搜索點：每間 1～3 個
  const sp = props.filter(p => SEARCHABLE[p.kind]);
  rng.shuffle(sp);
  const n = r.special === 'dock' ? 0 : Math.min(sp.length, r.theme === 'pod' ? 1 : rng.int(1, 3));
  for (let k = 0; k < n; k++) {
    const p = sp[k];
    r.spots.push({ x: r.x0 + p.x + p.w / 2, y: r.floorY, prop: p.kind, kind: 'loot', rar: rollRarity(rng, GEN_BONUS), t: 0, done: false, room: r.i });

}

/* ============ 07 美術：房間背景快取、角色、物件、圖示 ============ */
let ART_SCALE = 1.6;
const HAZ = ['#e2b23a', '#1a1a1a'];

function hazard(ctx, x, y, w, h, step = 10) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();

  if (hi) { ctx.fillStyle = hi; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y, 2, h); }
  if (lo) { ctx.fillStyle = lo; ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x + w - 2, y, 2, h); }
}
function rivets(ctx, x0, x1, y, step, col) { ctx.fillStyle = col; for (let x = x0; x <= x1; x += step) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill(); } }

/* ---------- 房間背景（只畫一次，快取成圖） ---------- */
function paintRoom(r, M) {

  const fy = FH - SLAB; // 地板（房間內座標）
  r.glow = []; r.blink = []; r.lights = []; r.windows = [];
  if (r.collapsed) { paintCollapsed(ctx, r, rng, L, Rr, T, fy); return cv; }
  const th = THEMES[r.theme] || THEMES.storage;
  const wall = th.wall;
  // 牆面
  ctx.fillStyle = vgrad(ctx, T, fy, [[0, mixHex(wall, '#000000', .45)], [.35, wall], [.75, mixHex(wall, '#0a0f12', .15)], [1, mixHex(wall, '#000000', .35)]]);

    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x, T + 40, 1.5, fy - T - 40);
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(x + 1.5, T + 40, 1, fy - T - 40);
  }

  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(L, wy, RW - L - Rr, fy - wy);
  ctx.fillStyle = mixHex(wall, '#9fb6c2', .18); ctx.fillRect(L, wy - 4, RW - L - Rr, 4);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(L, wy, RW - L - Rr, 2);

  ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let x = 0; x < RW; x += 7) ctx.fillRect(x, fy + 3, 1, 5);

  // 地板與牆的陰影
  ctx.fillStyle = vgrad(ctx, fy - 26, fy, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.45)']]); ctx.fillRect(L, fy - 26, RW - L - Rr, 26);
  // 梯井

      ctx.fillStyle = '#ffb03a'; ctx.fillRect(mp.x - 15, fy - 34, 8, 5); ctx.fillRect(mp.x + mp.w + 7, fy - 34, 8, 5);

  paintSideWall(ctx, r, RW - Rr, Rr, T, fy, !!r.doorR, r.c === C - 1);
  if (r.f === 0) { ctx.fillStyle = vgrad(ctx, 0, T, [[0, '#0d1418'], [1, '#2a363d']]); ctx.fillRect(0, 0, RW, T); ctx.fillStyle = 'rgba(150,180,190,.25)'; ctx.fillRect(0, T - 2, RW, 2); rivets(ctx, 10, RW, 7, 22, 'rgba(160,190,200,.25)'); }

  for (const w of r.windows) {
    ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.fill(); ctx.restore();
    ctx.strokeStyle = '#5c6d75'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(w.x, w.y, w.r + 3, 0, TAU); ctx.stroke();

    ctx.strokeStyle = 'rgba(180,240,255,.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(w.x, w.y, w.r - 3, -2.4, -1.4); ctx.stroke();

/* ---------- 數值（被動、整備、藏品、生還者加成） ---------- */

/* ---------- 位置與結構 ---------- */
const floorOf = y => Math.floor((y - 2) / FH);
function roomAt(x, y) {
  const c = clamp(Math.floor(x / RW), 0, W.C - 1), f = clamp(floorOf(y), 0, W.F - 1);
  return W.rooms[f * W.C + c];
}
function doorAt(c, f) { if (c <= 0 || c >= W.C || f < 0 || f >= W.F) return null; return W.rooms[f * W.C + c].doorL; }
const passable = d => d && (d.state === 'open' || d.state === 'broken');
function losClear(x1, x2, f) {
  const a = Math.min(x1, x2), b = Math.max(x1, x2);
  for (let c = Math.ceil(a / RW); c * RW < b; c++) {
    if (c <= 0 || c >= W.C) return false;
    const d = doorAt(c, f); if (!d || d.state === 'locked') return false;
  }
  return true;
}
/* 水平移動與牆／門碰撞，回傳擋住的門 */
function moveX(e, nx, hw) {
  const f = clamp(floorOf(e.y), 0, W.F - 1);
  nx = clamp(nx, HULL + hw, W.C * RW - HULL - hw);
  const c0 = clamp(Math.floor(e.x / RW), 0, W.C - 1);
  let blocked = null;
  if (nx > e.x) {
    const bx = (c0 + 1) * RW;
    if (c0 + 1 < W.C && nx + hw > bx - WALLW / 2) { const d = doorAt(c0 + 1, f); if (!passable(d)) { nx = Math.min(nx, bx - WALLW / 2 - hw); blocked = d || 'wall'; } }
  } else if (nx < e.x) {
    const bx = c0 * RW;
    if (c0 > 0 && nx - hw < bx + WALLW / 2) { const d = doorAt(c0, f); if (!passable(d)) { nx = Math.max(nx, bx + WALLW / 2 + hw); blocked = d || 'wall'; } }
  }
  e.x = nx;
  return blocked;
}
function waterAt(r) { return r ? r.water * (FH - SLAB - 8) : 0; }

/* ---------- 聲音 ---------- */
let costCache = null, costDirty = true;
function markDoors() { costDirty = true; W.flowCache = {}; }
function soundCost() {
  if (!costDirty && costCache) return costCache;
  const N = W.rooms.length, INF = 99, D = [];
  for (let i = 0; i < N; i++) { D.push(new Float32Array(N).fill(INF)); D[i][i] = 0; }
  const link = (a, b, c) => { if (c < D[a][b]) { D[a][b] = c; D[b][a] = c; } };
  for (const r of W.rooms) {
    if (r.collapsed) continue;
    const right = r.c < W.C - 1 ? W.rooms[r.i + 1] : null;
    if (right && !right.collapsed) { const d = r.doorR; link(r.i, right.i, !d ? 2 : d.state === 'locked' ? 2 : d.state === 'closed' ? 1 : 0); }
    const below = r.f < W.F - 1 ? W.rooms[r.i + W.C] : null;
    if (below && !below.collapsed) link(r.i, below.i, r.ladDown ? .5 : 1.5);
  }
  for (let k = 0; k < N; k++) for (let i = 0; i < N; i++) { const dik = D[i][k]; if (dik >= INF) continue; for (let j = 0; j < N; j++) { const v = dik + D[k][j]; if (v < D[i][j]) D[i][j] = v; } }

}
function heardBy(p, x, y, mul) {
  const a = roomAt(p.x, p.y), b = roomAt(x, y);
  const c = soundCost()[a.i][b.i];
  const eff = p.r * Math.pow(.5, c) * (mul || 1);
  return Math.hypot(p.x - x, (p.y - y) * 1.1) <= eff;
}
function emitNoise(x, y, r, src, show) {
  if (r < 10) return;
  const p = { x, y, r, src, t: 0, dur: .7 };
  if (show !== false && r >= 90) W.pulses.push(p);
  if (src === 'player' || src === 'gun' || src === 'hide') W.noise = Math.min(1, W.noise + r / 900);
  // 小怪：閒晃的回聲人會過去看；牆裡的人被吵醒會尖叫；誘餌類的聲音會把牠們引走
  for (const e of W.foes) {
    if (e.dead) continue;
    if (e.type === 'husk' && e.idle && src !== 'husk' && src !== 'wall' && r >= 100 && heardBy(p, e.x, e.y - 40, 1)) { e.idle = false; e.inv = { x, y }; }

/* ---------- 站裡陸續冒出來的東西：沒有波次，只有零星的訪客 ---------- */

/* ---------- 深壓 ---------- */

/* 母聆：打不動也電不死，只能跑。林汐會不時把牠引開 */
function updateMother(dt) {

  if (m.dead) return;
  m.flash = Math.max(0, m.flash - dt * 6); m.cd -= dt; m.slowT = Math.max(0, (m.slowT || 0) - dt);
  if (m.state === 'grab') { m.atk = 1; m.mouth = 1; return; }
  if (m.stunT > 0) { m.stunT -= dt; m.moving = false; m.quad = approach(m.quad, 0, dt * 3); return; }
  m.lureT -= dt;
  if (m.state === 'lured') { if (m.lureT <= 0) { m.state = 'hunt'; m.lureT = 22; banner('牠回來了', '', ''); } m.x = -999; return; }
  if (m.lureT <= 0) { m.state = 'lured'; m.lureT = 16; W.subs.push({ who: '林汐（無線電）', text: '牠往我這邊來了……快走！', kind: 'radio', dur: 3 }); AU.play('motif', { vol: .9 }); return; }
  if (m.state === 'attack') {

    if (m.atkT >= .65 && !m.struck) { m.struck = true; if (W.state === 'play' && !p.hide && Math.abs(p.x - m.x) < 150 && floorOf(p.y) === floorOf(m.y)) { grabPlayer(m); return; } AU.play('swipe'); W.shake = 12; }
    if (m.atkT >= 1.2) { m.state = 'hunt'; m.atkT = 0; m.atk = 0; m.struck = false; m.cd = 1.4; }
    return;
  }
  m.atk = approach(m.atk, 0, dt * 3); m.mouth = approach(m.mouth, 0, dt * 2);
  // 牠追的是聲音：你躲起來、又不出聲，牠會從你面前走過去
  const hidden = p.hide && bodyNoise() < Math.abs(p.x - m.x);
  if (!hidden) { m.tx = p.x; m.ty = p.y; }
  else if (m.tx == null) { m.tx = m.x; m.ty = m.y; }
  if (!hidden && floorOf(p.y) === floorOf(m.y) && Math.abs(p.x - m.x) < 130 && m.cd <= 0 && W.state === 'play') { m.state = 'attack'; m.atkT = 0; m.struck = false; m.face = sgn(p.x - m.x); AU.play('sting', { force: true }); return; }
  const mv = hunterGoTo(m, m.tx, m.ty);

  if (mv.lad) { if (Math.abs(m.x - mv.lad.x) < 10) { m.climb = { lad: mv.lad, dir: mv.dir }; return; } mv.x = mv.lad.x; }
  const dx = mv.x - m.x; m.moving = Math.abs(dx) > 4; m.quad = approach(m.quad, m.moving ? 1 : 0, dt * 4); if (!m.moving) return;
  m.face = sgn(dx);
  const bl = moveX(m, m.x + clamp(dx, -spd * dt, spd * dt), 40); m.walk += dt * spd / 30;
  if (Math.random() < dt * 1.6) { AU.at('gallop', m.x, m.y, { vol: 1.6 }); W.shake = Math.max(W.shake, 3); }
  if (bl && bl !== 'wall' && bl.state === 'closed') { bl.hp -= m.H.door * dt; bl.shake = 2; if (bl.hp <= 0) breakDoor(bl); }
}

/* ---------- 心率：牠越近、你憋氣越久，心跳越快；心跳太快，牠聽得到 ---------- */
function updateHeart(dt) {
  const h = W.hunter, p = W.P, st = PS();
  let prox = 0;
  if (onMap(h)) { const d = Math.hypot(h.x - p.x, (h.y - p.y) * 1.4); prox = clamp(1 - d / (900 * st.sonar), 0, 1); if (h.state === 'hunt' || h.state === 'attack' || h.state === 'check') prox = Math.min(1, prox + .25); }
  else if (h && h.state === 'venting') { const d = Math.hypot(h.vent.x - p.x, (h.vent.y - p.y) * 1.4); prox = clamp(1 - d / (1100 * st.sonar), 0, 1) * .8; }
  else if (h && h.state === 'crawl') { const d = Math.hypot(h.cx - p.x, (h.cy - p.y) * 1.4); prox = clamp(1 - d / (1000 * st.sonar), 0, 1) * .7; }
  if (mobOn(W.mother)) prox = Math.max(prox, clamp(1 - Math.hypot(W.mother.x - p.x, W.mother.y - p.y) / 1000, 0, 1));
  W.heartProx = lerp(W.heartProx, prox, Math.min(1, dt * 2));
  W.scare = Math.max(0, W.scare - dt * .22);
  let target = 70 + W.heartProx * 58 * st.calm + W.pressure * .06 + (p.hp < p.hpMax * .35 ? 10 : 0) + (W.dock.called && !W.dock.arrived ? 12 : 0) + W.scare * 22;
  if (p.hold) target += Math.min(20, p.holdT * 2.5) * st.holdHeart;
  if (p.hide && st.calmHide) target -= 10;
  W.heart = lerp(W.heart, target, Math.min(1, dt * .8));
  W.heartT -= dt;
  if (W.heartT <= 0) { W.heartT = 60 / W.heart; if (W.heartProx > .18 || p.hp < p.hpMax * .3 || p.hide) AU.play('heart', { vol: (p.hide ? .4 : .25) + W.heartProx * .8 + (W.heart >= 148 ? .3 : 0) }); }
  // 配樂張力
  let tension = W.heartProx * .9 + W.pressure / 260;
  if (W.foes.some(e => !e.dead && e.chase && Math.abs(e.x - p.x) < 500 && floorOf(e.y) === floorOf(p.y))) tension += .3;
  if (W.dock.called && !W.dock.arrived) tension += .4;
  AU.tickMusic(dt, clamp(tension, 0, 1));
  AU.tickAmb(dt);
  AU.tickBreath(dt, W.heart, p.stealth || !!p.hide, AU.under, p.hold, !!p.hide);
}

/* ---------- 結束一趟 ---------- */
function endRun(kind) {
  if (W.finished) return;
  W.finished = true; W.state = 'over';
  AU.setUnder(false);
  const sum = settleRun(kind);
  const goEnding = (kind === 'dock' && W.ending);
  setTimeout(() => {
    if (goEnding) {
      const E = ENDINGS[W.ending];
      UI.story(E.lines, { ending: W.ending }, () => UI.results(sum));
    } else UI.results(sum);
  }, kind === 'dead' ? 200 : 600);
}
function settleRun(kind) {
  const ok = kind === 'dock' || kind === 'pod';
  const st = PS(), si = W.si, gs = W.S.endless ? null : G.sectors[si];
  const sum = { kind, ok, si, endless: !!W.S.endless, tier: W.tier, credits: 0, loot: W.bag.slice(), rescued: [], stars: [false, false, false], newStars: [], unlocked: [], relics: [], bps: [], logs: W.logsGot.slice(), kills: W.kills, dodges: W.dodges, escapes: W.escapes, caught: !!W.caughtBy, time: W.t, bonus: 0, ending: W.ending, hunterKill: W.obj.hunterKill };
  G.stats.dives++; G.stats.kills += W.kills;
  if (!ok) { G.stats.deaths++; if (gs) gs.runs++; saveGame(); return sum; }
  G.stats.extracts++;
  let credits = W.bagVal * st.credits;
  if (kind === 'dock') {
    for (const s of W.rescued) { if (s.id) { if (!G.survivors[s.id]) sum.rescued.push(s.id); G.survivors[s.id] = true; } else credits += 60; }
    if (W.ending === 'A') G.survivors.lin = true;
  }
  for (const id of W.relicsGot) { G.relics[id] = Math.min(3, (G.relics[id] || 0) + 1); sum.relics.push(id); }
  for (const id of W.bpsGot) { if (!G.weapons.includes(id)) { G.weapons.push(id); sum.bps.push(id); } }
  if (gs) {
    gs.runs++;
    const stars = [kind === 'dock', kind === 'dock' && W.obj.rescued >= W.obj.survivors, W.obj.hunterKill];
    stars.forEach((v, k) => { if (v) { sum.stars[k] = true; if (!gs.stars[k]) { gs.stars[k] = true; sum.newStars.push(k); credits += 120 + si * 60; } } });
    const finalNeedsEnding = W.S.final && !W.ending;
    if (kind === 'dock' && !finalNeedsEnding && !gs.cleared) {
      gs.cleared = true;
      const bp = BLUEPRINT_PLAN[si]; if (bp && !G.weapons.includes(bp)) { G.weapons.push(bp); sum.bps.push(bp); }
      if (si + 1 < SECTORS.length) { G.sectors[si + 1].unlocked = true; sum.unlocked.push(SECTORS[si + 1].name); }
      if (si === 2 && !G.endless.unlocked) { G.endless.unlocked = true; sum.unlocked.push('無盡深潛'); }
      sum.firstClear = true;
    }
    gs.best = Math.max(gs.best || 0, Math.round(W.bagVal));
    if (W.ending) G.endings[W.ending] = true;
  } else {
    if (kind === 'dock') { G.endless.best = Math.max(G.endless.best, W.tier); sum.nextTier = W.tier + 1; }
    credits *= 1 + .1 * W.tier;
  }
  if (kind === 'dock' && W.ending === 'C') { credits += 50000; sum.bounty = 50000; }
  credits = Math.round(credits);
  sum.credits = credits; G.credits += credits; G.stats.credits += credits;
  saveGame();
  return sum;
}

/* ---------- 站體外殼頂部 ---------- */
function drawHullTop(ctx, totW, t) {
  // 弧形頂殼
  ctx.fillStyle = '#0e171b';
  ctx.beginPath(); ctx.moveTo(-14, -12);
  ctx.quadraticCurveTo(totW / 2, -70, totW + 14, -12); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2d3a41'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-14, -12); ctx.quadraticCurveTo(totW / 2, -70, totW + 14, -12); ctx.stroke();
  // 肋條
  ctx.strokeStyle = 'rgba(80,100,110,.35)'; ctx.lineWidth = 3;
  for (let x = 40; x < totW; x += 90) { const yy = -12 - 58 * (1 - Math.pow((x - totW / 2) / (totW / 2 + 14), 2)) * .97; ctx.beginPath(); ctx.moveTo(x, -12); ctx.lineTo(x, yy + 4); ctx.stroke(); }
  // 纜繩往上消失
  ctx.strokeStyle = 'rgba(120,150,160,.28)'; ctx.lineWidth = 3;
  for (const fx of [.22, .78]) { const x = totW * fx; ctx.beginPath(); ctx.moveTo(x, -40); ctx.bezierCurveTo(x + 10, -300, x - 30, -600, x + 20, -1100); ctx.stroke(); }
  // 天線與信標
  for (const fx of [.1, .5, .9]) {
    const x = totW * fx, base = -12 - 58 * (1 - Math.pow((x - totW / 2) / (totW / 2 + 14), 2)) * .97;
    ctx.fillStyle = '#1a252b'; ctx.fillRect(x - 3, base - 70, 6, 72); ctx.fillRect(x - 16, base - 44, 32, 4);
    const on = (t * .8 + fx) % 1 < .18;
    ctx.fillStyle = on ? '#ff4d5e' : '#4a1a20'; ctx.beginPath(); ctx.arc(x, base - 74, 5, 0, TAU); ctx.fill();
    if (on) { ctx.fillStyle = 'rgba(255,77,94,.25)'; ctx.beginPath(); ctx.arc(x, base - 74, 22, 0, TAU); ctx.fill(); }
  }
  // 站名
  ctx.save(); ctx.fillStyle = 'rgba(180,210,220,.16)'; ctx.font = '900 34px "Noto Sans TC",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('瀚淵站  HANYUAN', totW / 2, -24); ctx.restore();
}

/* ---------- 海床 ---------- */
const seabedY = (x, totH) => totH + 214 + 10 + 16 * Math.sin(x * .013) + 8 * Math.sin(x * .041);
function seabedDots(totW, totH) { const out = []; for (let k = 0; k < 12; k++) { const x = (k * 211) % (totW + 500) - 250; out.push([x, seabedY(x, totH) - 3, k]); } return out; }
function drawSeabed(ctx, totW, totH, t) {

  if (onMap(hh) && roomAt(hh.x, hh.y) === pr) { m.fillStyle = hunterCol(hh.state); m.beginPath(); m.arc(mx(hh.x), my(hh.y) - 3, big ? 5 : 3, 0, TAU); m.fill(); }
  // 偵測器
  const px = mx(p.x), py = my(p.y) - 3, rr = TRACK_RANGE * PS().sonar / RW * cw;
  if (T.on) {
    m.strokeStyle = PH(.14); m.lineWidth = 1; m.beginPath(); m.arc(px, py, rr, 0, TAU); m.stroke();
    if (T.pingFx > 0) { m.strokeStyle = PH(.55 * T.pingFx); m.lineWidth = big ? 2 : 1.5; m.beginPath(); m.arc(px, py, rr * (1 - T.pingFx), 0, TAU); m.stroke(); }
  }
  for (const b of T.blips) {
    if (b.a <= 0) continue;
    const bx = mx(b.x), by = my(b.y), br = (b.big ? 3.4 : 2.3) * (big ? 1.6 : 1);
    m.fillStyle = `rgba(235,255,240,${b.a})`; m.shadowColor = '#7dffa8'; m.shadowBlur = 6;
    m.beginPath(); m.arc(bx, by, br, 0, TAU); m.fill(); m.shadowBlur = 0;
  }
  m.fillStyle = '#ffffff'; m.shadowColor = '#7dffa8'; m.shadowBlur = 6;
  m.beginPath(); m.arc(px, py, big ? 4.5 : 3, 0, TAU); m.fill(); m.shadowBlur = 0;
  if (T.on && !big) {
    m.font = '700 17px "Rajdhani",sans-serif'; m.fillStyle = 'rgba(2,14,8,.8)'; m.fillRect(0, h - 22, w, 22);
    m.fillStyle = PH(.95); m.fillText((Math.sin(t * 6) > 0 ? '● ' : '○ ') + (T.blips.length ? Math.max(1, Math.round(T.nearD * .025)) + ' M' : '— —'), 8, h - 6);
  }
  if (big) { const sy = (t * .22 % 1) * h; const g = m.createLinearGradient(0, sy - 60, 0, sy); g.addColorStop(0, PH(0)); g.addColorStop(1, PH(.14)); m.fillStyle = g; m.fillRect(0, sy - 60, w, 60); m.fillStyle = PH(.5); m.fillRect(0, sy, w, 1.5); }
  m.fillStyle = 'rgba(0,0,0,.2)'; for (let y = 0; y < h; y += 3) m.fillRect(0, y, w, 1);
}

function renderMenu(dt) {
  const ctx = R.ctx, t = R.t, w = R.w, h = R.h;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#08304a'); g.addColorStop(.35, '#041824'); g.addColorStop(1, '#000306');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // 光束
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 5; k++) { const x = w * (.15 + k * .2) + Math.sin(t * .2 + k) * 40; const gg = ctx.createLinearGradient(x, 0, x + 80, h * .7); gg.addColorStop(0, 'rgba(120,200,230,.08)'); gg.addColorStop(1, 'rgba(120,200,230,0)'); ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(x - 20, 0); ctx.lineTo(x + 30, 0); ctx.lineTo(x + 160, h * .75); ctx.lineTo(x + 40, h * .75); ctx.fill(); }
  ctx.restore();
  // 巨影
  const per = 46, ph = (t % per) / per;
  if (ph < .6) {
    const x = lerp(w * 1.5, -w * .6, ph / .6), y = h * .52 + Math.sin(t * .3) * 20, a = Math.sin(ph / .6 * Math.PI);
    ctx.save(); ctx.globalAlpha = .55 * a;
    ctx.fillStyle = '#01060a'; ctx.beginPath(); ctx.ellipse(x, y, w * .7, h * .1, .04, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + w * .6, y); ctx.quadraticCurveTo(x + w * .9, y - h * .06, x + w * 1.1, y + h * .03); ctx.quadraticCurveTo(x + w * .9, y + h * .02, x + w * .6, y + h * .04); ctx.fill();
    ctx.strokeStyle = 'rgba(95,231,255,.5)'; ctx.lineWidth = 2;
    for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.ellipse(x - w * .6, y - 6, 10 * k, 18 * k, 0, 0, TAU); ctx.stroke(); }
    ctx.restore();
  }
  // 研究站剪影
  const bx = w / 2, by = h * .78, sw = Math.min(w * .9, 560), sh = sw * .42;
  ctx.fillStyle = '#020a0f'; ctx.fillRect(bx - sw / 2, by - sh, sw, sh);
  ctx.fillRect(bx - 6, 0, 3, by - sh); ctx.fillRect(bx + sw * .3, 0, 2, by - sh);
  for (let k = 0; k < 6; k++) ctx.fillRect(bx - sw / 2 + 20 + k * (sw - 40) / 5, by, 10, h - by);
  const rows = 4, cols = 7;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const on = Math.sin(i * 7.1 + j * 3.3) > -.2;
    if (!on) continue;
    const fl = Math.sin(t * (2 + (i * cols + j) % 3) + i * j) > .92 ? .2 : 1;
    ctx.fillStyle = (i + j) % 4 === 0 ? `rgba(255,176,80,${.55 * fl})` : `rgba(140,220,240,${.4 * fl})`;
    ctx.fillRect(bx - sw / 2 + 18 + j * (sw - 36) / cols, by - sh + 14 + i * (sh - 20) / rows, (sw - 36) / cols - 12, 5);
  }
  for (const s of R.snow) {
    s.y += .0004 * s.z; if (s.y > 1.05) { s.y = -.05; s.x = Math.random(); }
    ctx.fillStyle = `rgba(190,230,240,${s.o * s.z})`; ctx.fillRect(s.x * w + Math.sin(t * .5 + s.x * 9) * 6, s.y * h, s.s * s.z, s.s * s.z);
  }
  const vg = ctx.createRadialGradient(w / 2, h * .45, Math.min(w, h) * .2, w / 2, h * .45, Math.max(w, h) * .8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
}

  pool.push({ kind: 'flash', icon: 'flash', wt: p.flashes ? .9 : 2 });

  while (out.length < 3 && pool.length) { const c = rng.weighted(pool, q => q.wt); out.push(c); pool.splice(pool.indexOf(c), 1); }

}

  lv(id, l) { if (W && W.P.gun === id) W.P.gunLv = l; },
  hunterNow() { const h = W.hunter; h.awayT = 0; h.heardAt = { x: W.P.x + 300, y: W.P.y }; },
  tp(x, y) { W.P.x = x; W.P.y = y; W.P.climb = null; },
  roomInfo() { return W.rooms.map(r => ({ i: r.i, c: r.c, f: r.f, th: r.theme, sp: r.special, col: r.collapsed, lu: !!r.ladUp, ld: !!r.ladDown, surv: r.survivor ? r.survivor.name : null })); },
};
boot();

</script>
