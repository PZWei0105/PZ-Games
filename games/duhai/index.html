    { id: 'wang', name: '王伯', note: '把田地都賣了，帶著女兒去台灣重新開始。' },
    { id: 'zhu', name: '阿珠', note: '王伯的女兒，十二歲。很快就跟阿水混熟了。' },
    { id: 'tu', name: '阿土', note: '打鐵的。不太講話，手很大。' },
    { id: 'xi', name: '吳阿細', note: '一個瘦小的「少年」，聲音很細，從不在人前解手。' },
  ];
  DH.PAX = PAX;
  const UNNAMED = 16;

  // ---------------- 建立新的一趟 ----------------
  function newRun(meta, opts) {
    opts = opts || {};
    const seed = opts.seed || (Date.now() % 2147483647);
    const r = {
      v: 1, seed, rng: R.make(seed), diff: opts.diff != null ? opts.diff : 1,
      telling: (meta && meta.tellings || 0) + 1,
      act: 1, map: null, pos: null, path: [],
      wei: { hp: BASE_HP.wei, maxHp: BASE_HP.wei },
      comp: {}, party: [],
      deck: [], items: ['zhaodan'], silver: 40, water: 6,
      pax: PAX.map((p) => ({ id: p.id, name: p.name, alive: true, fate: null })),
      paxUnnamed: UNNAMED, paxLostUnnamed: 0,
      xiu: { alive: true, bond: 0, born: false, told: false, knows: false, trust: 0, babyName: null, critical: false },
      shui: { bond: 0, lv: 0 },
      pers: { ren: 0, hen: 0, zha: 0, zhi: 0 },
      flags: {}, seen: {}, chain: {}, log: [],
      screen: 'scene', scene: { id: 'prologue', i: 0 }, battle: null, pending: null, shop: null,
      stats: { battles: 0, kills: 0, spared: 0, overboard: 0 },
      removeCost: 50, ended: null,
    };
    for (const k of DH.COMP_IDS) r.comp[k] = { joined: false, alive: true, hp: BASE_HP[k], maxHp: BASE_HP[k], bond: 0, injured: false, dead: false, away: false };
    for (const id of STARTER.wei) addCard(r, id);
    addCard(r, 'yunchuan');
    addCard(r, 'xinshi');
    // 前人的庇蔭
    if (opts.blessing && DH.ITEMS[opts.blessing]) r.items.push(opts.blessing);
    if (meta) r.flags.frameSeen = (meta.frameSeen || []).length;
    return r;
  }

  // ---------------- 牌組 ----------------
  function addCard(r, id, up) {
    const c = { uid: DH.newUid(), id, up: up ? 1 : 0 };
    r.deck.push(c);
    return c;
  }
  function removeCard(r, uid) { const i = r.deck.findIndex((c) => c.uid === uid); if (i >= 0) return r.deck.splice(i, 1)[0]; return null; }
  function removeCardId(r, id) { const i = r.deck.findIndex((c) => c.id === id); if (i >= 0) return r.deck.splice(i, 1)[0]; return null; }
  function upgradeCard(r, uid) { const c = r.deck.find((x) => x.uid === uid); if (c && canUpgrade(c)) c.up = 1; return c; }
  function canUpgrade(c) { const d = DH.CARDS[c.id]; return d && !c.up && !['curse', 'relic'].includes(d.type) && d.rarity !== 9 || (d && d.type === 'cargo' && !c.up && d.vals && Object.keys(d.vals).length); }
  const hasCard = (r, id) => r.deck.some((c) => c.id === id);

  // ---------------- 同伴 ----------------
  function joinComp(r, id) {
    const c = r.comp[id];
    if (!c || c.joined || c.dead) return false;
    if (r.party.length >= 2) return false;
    c.joined = true; r.party.push(id);
    for (const cid of STARTER[id]) addCard(r, cid);
    note(r, 'join', id);
    return true;
  }
  function killComp(r, id, how) {
    const c = r.comp[id];
    if (!c || c.dead) return;
    c.dead = true; c.alive = false; c.hp = 0; c.deathHow = how || 'battle';
    if (c.joined) {
      r.deck = r.deck.filter((x) => DH.CARDS[x.id].owner !== id);
      addCard(r, 'yi_' + id);
      r.party = r.party.filter((x) => x !== id);
      c.joined = false; c.wasParty = true;
    }
    note(r, 'death', id);
  }
  function injureComp(r, id) {
    const c = r.comp[id];
    if (!c || c.dead) return;
    if (c.injured) { killComp(r, id, 'wounds'); return 'dead'; }
    c.injured = true;
    addCard(r, 'injury_' + id);
    return 'injured';
  }
  function healInjury(r, id) {
    const c = r.comp[id];
    if (!c || !c.injured) return;
    c.injured = false;
    r.deck = r.deck.filter((x) => x.id !== 'injury_' + id);
  }

  // ---------------- 乘客 ----------------
  function paxAlive(r) { return r.pax.filter((p) => p.alive).length + r.paxUnnamed - r.paxLostUnnamed; }
  function namedAlive(r) { return r.pax.filter((p) => p.alive); }
  function losePax(r, n, cause, opts) {
    opts = opts || {};
    const lost = [];
    for (let i = 0; i < n; i++) {
      const named = namedAlive(r).filter((p) => !(opts.spare || []).includes(p.id));
      const unnamedLeft = r.paxUnnamed - r.paxLostUnnamed;
      const pickNamed = named.length && (unnamedLeft <= 0 || R.chance(r.rng, opts.namedChance != null ? opts.namedChance : 0.34));
      if (pickNamed) {
        const p = R.pick(r.rng, named);
        p.alive = false; p.fate = cause; lost.push(p.name); paxDied(r, p);
      } else if (unnamedLeft > 0) {
        r.paxLostUnnamed++; lost.push(null);
      }
    }
    if (lost.length) note(r, 'paxLost', { cause, lost });
    return lost;
  }
  function killPax(r, id, cause) { const p = r.pax.find((x) => x.id === id); if (p && p.alive) { p.alive = false; p.fate = cause; paxDied(r, p); note(r, 'paxLost', { cause, lost: [p.name] }); return true; } return false; }
  // 林生答應過的冊子：他走了，冊子就到魏子葳手上
  function paxDied(r, p) { if (p.id === 'lin' && r.flags.linPromise && !r.items.includes('diary')) r.items.push('diary'); }
  DH.paxAlive = paxAlive;

  function note(r, k, v) { r.log.push({ k, v, act: r.act }); }

  // ---------------- 性子 ----------------
  const PERS_NAME = { ren: '心軟', hen: '心狠', zha: '心計', zhi: '直' };
  function pers(r, k, n) { r.pers[k] = (r.pers[k] || 0) + (n == null ? 1 : n); }
  function persTop(r) {
    let best = null, bv = 0;
    for (const k in r.pers) if (r.pers[k] > bv) { bv = r.pers[k]; best = k; }
    return best ? PERS_NAME[best] : '還看不出來';
  }
  DH.PERS_NAME = PERS_NAME;

  // ---------------- 地圖 ----------------
  // 每段航程：一排一排的節點；部分排是固定劇情
  const ACT_PLAN = {
    1: ['gen', 'gen', 'gen', 'gen', 'gen', { t: 'night', ref: 'night' }, { t: 'boss', ref: 's_bazong' }],
    2: [{ t: 'fixed', ref: 's_blackwater' }, 'gen', 'gen', { t: 'fixed', ref: 's_penghu' }, 'gen', { t: 'fixed', ref: 's_zhongyuan' }, 'gen', { t: 'fixed', ref: 's_storm' }, { t: 'boss', ref: 's_hong' }],
    3: [{ t: 'fixed', ref: 's_sight' }, 'gen', 'gen', 'gen', { t: 'night', ref: 'lastnight' }, { t: 'boss', ref: 's_sandbar' }],
  };
  const NODE_W = {
    1: [['fight', 40], ['event', 34], ['night', 12], ['shop', 8], ['elite', 6]],
    2: [['fight', 38], ['event', 32], ['night', 14], ['shop', 8], ['elite', 8]],
    3: [['fight', 36], ['event', 34], ['night', 14], ['shop', 8], ['elite', 8]],
  };
  function genMap(r, act) {
    const plan = ACT_PLAN[act];
    const rows = [];
    let lastGenTypes = [];
    plan.forEach((p, ri) => {
      const row = [];
      if (p === 'gen') {
        const n = R.chance(r.rng, 0.35) ? 2 : 3;
        const cols = n === 2 ? [0, 2] : [0, 1, 2];
        const used = [];
        for (const col of cols) {
          let t;
          for (let tries = 0; tries < 12; tries++) {
            t = R.weighted(r.rng, NODE_W[act]);
            if (t === 'elite' && act === 1 && ri < 2) continue;
            if ((t === 'night' || t === 'shop') && rows.filter((rw) => rw.length > 1).length === 0) continue;
            if (t === 'night' && (lastGenTypes.includes('night') || (plan[ri + 1] && plan[ri + 1].t === 'night'))) continue;
            if (t === 'shop' && used.includes('shop')) continue;
            if (used.filter((x) => x === t).length >= 2) continue;
            break;
          }
          used.push(t);
          row.push({ id: act + '-' + ri + '-' + col, act, row: ri, col, t, ref: null, done: false });
        }
        lastGenTypes = used;
      } else {
        row.push({ id: act + '-' + ri + '-1', act, row: ri, col: 1, t: p.t, ref: p.ref, done: false });
        lastGenTypes = [p.t];
      }
      rows.push(row);
    });
    // 連線：相鄰欄
    for (let i = 0; i < rows.length - 1; i++) {
      for (const n of rows[i]) {
        n.next = rows[i + 1].filter((m) => Math.abs(m.col - n.col) <= 1 || rows[i + 1].length === 1 || rows[i].length === 1).map((m) => m.id);
        if (!n.next.length) n.next = [rows[i + 1][0].id];
      }
    }
    for (const n of rows[rows.length - 1]) n.next = [];
    // 確保下一排每個點都有人連到
    for (let i = 1; i < rows.length; i++) {
      for (const m of rows[i]) {
        if (!rows[i - 1].some((n) => n.next.includes(m.id))) {
          const near = rows[i - 1].slice().sort((a, b) => Math.abs(a.col - m.col) - Math.abs(b.col - m.col))[0];
          near.next.push(m.id);
        }
      }
    }
    return { act, rows };
  }
  function mapNode(r, id) { for (const row of r.map.rows) for (const n of row) if (n.id === id) return n; return null; }
  function availableNodes(r) {
    if (!r.map) return [];
    if (!r.pos) return r.map.rows[0].map((n) => n.id);
    const cur = mapNode(r, r.pos);
    return cur ? cur.next : [];
  }

  function startAct(r, act) {
    if (act > 1) {
      // 換一段航程：補一口氣（回復一半的缺口）
      r.wei.hp += Math.ceil((r.wei.maxHp - r.wei.hp) * 0.5);
      for (const id of r.party) { const c = r.comp[id]; if (!c.dead) c.hp += Math.ceil((c.maxHp - c.hp) * 0.5); }
    }
    r.act = act;
    r.map = genMap(r, act);
    r.pos = null;
    r.screen = 'map';
  }

  // 走到一個節點
  function enterNode(r, id) {
    if (!availableNodes(r).includes(id)) return false;
    const n = mapNode(r, id);
    r.pos = id; r.path.push(id);
    n.done = true;
    // 走一步，喝一點水：每三步一瓢（夜裡另外算）
    if (n.t === 'fight') {
      const pool = DH.encPool(r.act, 'normal').filter((e) => !(r.seen['enc_' + e] >= 2));
      const e = R.pick(r.rng, pool.length ? pool : DH.encPool(r.act, 'normal'));
      r.seen['enc_' + e] = (r.seen['enc_' + e] || 0) + 1;
      startScene(r, 'fightnode', { enc: e });
    } else if (n.t === 'elite') {
      const pool = DH.encPool(r.act, 'elite');
      startScene(r, 'fightnode', { enc: R.pick(r.rng, pool), elite: true });
    } else if (n.t === 'event') {
      const ev = pickEvent(r);
      startScene(r, ev || 'quietsea');
    } else if (n.t === 'night') {
      startNight(r, n.ref === 'lastnight' ? 'last' : null);
    } else if (n.t === 'shop') {
      openShop(r);
    } else if (n.t === 'fixed' || n.t === 'boss') {
      startScene(r, n.ref);
    }
    return true;
  }

  function pickEvent(r) {
    const all = Object.values(DH.SCENES).filter((s) => s.event && s.act === r.act && !r.seen[s.id] && (!s.req || s.req(r)));
    if (!all.length) return null;
    const pairs = all.map((s) => [s.id, s.weight || 10]);
    return R.weighted(r.rng, pairs);
  }

  // ---------------- 劇情（場景） ----------------
  function startScene(r, id, args) {
    const s = DH.SCENES[id];
    if (!s) throw new Error('no scene ' + id);
    r.seen[id] = (r.seen[id] || 0) + 1;
    r.screen = 'scene';
    r.scene = { id, i: 0, args: args || {}, stack: [] };
    advanceScene(r, true);
  }
  // 跳過不需要停下來的步驟（fx、if、goto、label），停在要顯示的步驟
  function advanceScene(r, first) {
    const sc = r.scene;
    let guard = 0;
    while (guard++ < 500) {
      const s = DH.SCENES[sc.id];
      if (sc.i >= s.steps.length) return endScene(r);
      const st = s.steps[sc.i];
      if (st.label != null && Object.keys(st).length === 1) { sc.i++; continue; }
      if (st.fx) { st.fx(r, sc.args, api(r)); sc.i++; if (r.screen !== 'scene' || r.scene !== sc) return; continue; }
      if (st.if) {
        const ok = st.if(r, sc.args);
        const lab = ok ? st.then : st.else;
        if (lab) jump(r, lab); else sc.i++;
        continue;
      }
      if (st.goto) { jump(r, st.goto); continue; }
      if (st.bg && Object.keys(st).length === 1) { r.bg = st.bg; sc.i++; continue; }
      if (st.call) {
        const target = typeof st.call === 'function' ? st.call(r, sc.args) : st.call;
        if (!target || !DH.SCENES[target]) { sc.i++; continue; }
        sc.stack.push({ id: sc.id, i: sc.i + 1, args: sc.args }); sc.id = target; sc.i = 0; r.seen[target] = (r.seen[target] || 0) + 1; continue;
      }
      if (st.pick) { r.pick = { kind: st.pick, resume: 'scene', why: st.why || null }; r.screen = 'pick'; return; }
      if (st.end) { return endScene(r, st.end); }
      if (st.fight) { return beginFight(r, typeof st.fight === 'function' ? st.fight(r, sc.args) : st.fight, st); }
      if (st.night) { return startNight(r, st.night); }
      if (st.shop) { return openShop(r, true); }
      if (st.show && !st.show(r, sc.args)) { sc.i++; continue; }
      // 顯示步驟（n / s / f / choice）
      return;
    }
  }
  function jump(r, label) {
    const sc = r.scene;
    const s = DH.SCENES[sc.id];
    const i = s.steps.findIndex((x) => x.label === label);
    if (i < 0) throw new Error('no label ' + label + ' in ' + sc.id);
    sc.i = i + 1;
  }
  function sceneStep(r) {
    if (r.screen !== 'scene') return null;
    const s = DH.SCENES[r.scene.id];
    return s.steps[r.scene.i] || null;
  }
  function sceneNext(r) {
    const st = sceneStep(r);
    if (!st || st.choice) return;
    r.scene.i++;
    advanceScene(r);
  }
  function sceneChoose(r, idx) {
    const st = sceneStep(r);
    if (!st || !st.choice) return false;
    const opts = visibleChoices(r, st);
    const o = opts[idx];
    if (!o || o.locked) return false;
    r.scene.lastChoice = o.t;
    if (o.fx) o.fx(r, r.scene.args, api(r));
    if (r.screen !== 'scene') return true;
    if (o.go) jump(r, o.go); else r.scene.i++;
    advanceScene(r);
    return true;
  }
  function visibleChoices(r, st) {
    const out = [];
    for (const o of st.choice) {
      if (o.show && !o.show(r, r.scene.args)) continue;
      const lockedWhy = o.req ? o.req(r, r.scene.args) : null;
      const t = typeof o.t === 'function' ? o.t(r, r.scene.args) : o.t;
      out.push(Object.assign({}, o, { t, locked: typeof lockedWhy === 'string' ? lockedWhy : (lockedWhy === false ? '不行' : null) }));
    }
    return out;
  }
  function endScene(r) {
    const sc = r.scene;
    if (sc && sc.stack && sc.stack.length) { const top = sc.stack.pop(); sc.id = top.id; sc.i = top.i; if (top.args) sc.args = top.args; return advanceScene(r); }
    const s = DH.SCENES[sc.id];
    r.scene = null;
    if (s && s.after) {
      s.after(r, sc.args, api(r));
      if (r.scene || ['battle', 'fin', 'death', 'map', 'night', 'shop', 'reward', 'pick'].includes(r.screen) && r.screen !== 'scene') return;
    }
    if (r.nightNeed) { r.pick = { kind: r.nightNeed, resume: 'map' }; r.nightNeed = null; r.screen = 'pick'; return; }
    toMap(r);
  }
  function toMap(r) {
    if (r.ended) return;
    if (r.pending) { r.screen = 'reward'; return; }
    // 這段走完了？
    const cur = r.pos ? mapNode(r, r.pos) : null;
    if (cur && !cur.next.length) {
      if (r.act < 3) { startAct(r, r.act + 1); return; }
    }
    r.screen = 'map';
  }

  // ---------------- 戰鬥 ----------------
  function battleAllies(r) {
    const allies = [{ id: 'wei', name: '魏子葳', hp: r.wei.hp, maxHp: r.wei.maxHp, sea: !!r.flags.weiSea }];
    for (const id of r.party) {
      const c = r.comp[id];
      if (!c || c.dead) continue;
      allies.push({ id, name: DH.OWNERS[id].name, hp: Math.max(1, c.hp), maxHp: c.maxHp, sea: !!SEA[id], injured: c.injured });
    }
    return allies;
  }
  const DIFF = [{ hp: 0.72, dmg: 0.72, xin: 0.75 }, { hp: 1.06, dmg: 1.06, xin: 1 }, { hp: 1.2, dmg: 1.2, xin: 1.15 }];
  function beginFight(r, encId, step) {
    const enc = DH.ENCOUNTERS[encId];
    if (encId === 'final_current') return beginCurrent(r, step);
    const objs = (enc.objs || []).map((o) => Object.assign({}, o));
    const alive = paxAlive(r);
    if (enc.hold) objs.push({ id: 'hold', kind: 'hold', name: '艙門', hp: 20, maxHp: 20, people: alive });
    if (enc.mode === 'storm' && encId === 'a2_storm') {
      const x = objs.find((o) => o.id === 'xiu');
      if (x && (!r.xiu.alive || r.xiu.born)) objs.splice(objs.indexOf(x), 1);
      if (x) { x.hp = x.maxHp = 16 + (r.xiu.bond >= 3 ? 4 : 0); }
    }
    let bar = [];
    if (enc.mode === 'tide') bar = r.flags.barPeople || [];
    const enemies = enc.enemies.map((e) => Object.assign({}, e));
    if (r.flags.bazongAngry && encId === 'a1_boss_fight') enemies[0].st = { str: 3 };
    const helperLv = r.shui.lv || 0;
    const b = B.create({
      mode: enc.mode || 'fight', enc: encId, title: enc.title, allies: battleAllies(r), objs, enemies,
      deck: r.deck.map((c) => ({ uid: c.uid, id: c.id, up: c.up })),
      seed: R.int(r.rng, 1e9) + 1, startPhase: enc.startPhase, waves: enc.waves, winCond: enc.winCond, maxTurns: enc.maxTurns,
      composure: (enc.composure || 30) + (r.items.includes('zhaodan') ? 0 : 0) + (r.pers.zhi || 0) * 2,
      purse: r.silver, items: r.items.slice(), flags: { people: alive, bribeOK: true, hsx: !!r.flags.hsx, jiuSoft: !!r.flags.jiuSoft, ready: !!(r.flags.prepared || r.flags.warned || r.flags.jiuExposed) }, bar,
      diffMul: DIFF[r.diff] || null, helper: { uses: helperLv >= 3 ? 2 : 1, lv: helperLv },
    });
    for (const a of b.allies) if (a.injured) a.injured = true;
    const it = step && step.intro;
    b.intro = typeof it === 'function' ? it(r) : (it || enc.intro || '');
    r.battle = b;
    r.battleCtx = { enc: encId, win: step && step.win, lose: step && step.lose, turn: step && step.turn, fail: step && step.fail, elite: enc.tier === 'elite', boss: enc.tier === 'boss', tier: enc.tier };
    r.screen = 'battle';
    B.begin(b);
    return b;
  }

  // 最後一程：只有他，和懷裡的囝仔
  function beginCurrent(r, step) {
    const deck = ['chengzhu', 'chengzhu', 'chengzhu', 'wangqian', 'wangqian', 'wangqian', 'huitou', 'huitou'].map((id) => ({ uid: DH.newUid(), id, up: 0 }));
    const b = B.create({
      mode: 'storm', enc: 'final_current', title: '最後一程', allies: [{ id: 'wei', name: '魏子葳', hp: Math.max(8, r.wei.hp), maxHp: r.wei.maxHp, noDie: true }],
      enemies: [{ def: 'current' }], deck, seed: R.int(r.rng, 1e9) + 1, waves: false, winCond: 'none', flags: { reach: 0 },
      helper: { uses: 0, used: 0 },
    });
    r.battle = b;
    r.battleCtx = { enc: 'final_current', win: step && step.win, tier: 'fixed' };
    r.screen = 'battle';
    B.begin(b);
    return b;
  }

  // 戰鬥結束後回寫
  function finishBattle(r) {
    const b = r.battle;
    const ctx = r.battleCtx;
    const res = b.result;
    const out = { result: res, lost: [], died: [], injured: [], notes: [] };
    r.stats.battles++;
    r.stats.kills += b.stats.killed.length;
    r.stats.spared += b.stats.yielded.length;
    r.stats.overboard += b.stats.overboard.length;
    r.silver = b.purse;
    if (b.stats.stolen) {
      // 打倒偷東西的人，就拿得回來
      let back = 0;
      for (const e of b.enemies) if (e.mem.loot && e.gone && e.gone !== 'flee') back += e.mem.loot;
      r.silver += back;

        const c = r.comp[k];
        if (c.dead) {
          Meta.remember(meta, { id: k, name: DH.OWNERS[k].name, how: c.deathHow, telling: r.telling });
          if (!meta.blessings.includes(BLESS[k])) meta.blessings.push(BLESS[k]);
        }
      }
      if (!r.xiu.alive) {
        Meta.remember(meta, { id: 'xiu', name: '秀娘', how: r.xiu.fate, telling: r.telling });
        if (!meta.blessings.includes('amulet')) meta.blessings.push('amulet');
      }
      for (const p of r.pax) if (!p.alive) Meta.remember(meta, { id: p.id, name: p.name, how: p.fate, telling: r.telling });
      for (const m of r.flags.memories || []) if (!meta.memories.includes(m)) meta.memories.push(m);
      // 下一段線索
      const n = ended.type === 'death' ? 1 : ended.id === 'true' ? 0 : 2;
      const q = [];
      for (const c of DH.CLUE_ORDER) {
        if (q.length >= n) break;
        if (!meta.frameSeen.includes(c)) q.push(c);
      }
      for (const c of q) meta.frameSeen.push(c);
      r.flags.clueQueue = q;
    },
    remember(meta, x) {
      if (meta.memorial.some((m) => m.id === x.id && m.how === x.how && m.telling === x.telling)) return;
      meta.memorial.push(x);
    },
    // 死掉之後：開始框架
    afterDeath(meta, r) {
      Meta.conclude(meta, r);
      r.battle = null;
      DH.Run.startScene(r, 'f_death');
    },
    canTrue(meta) { return meta.frameSeen.length >= 4; },
  };
  DH.Meta = Meta;
  DH.BLESS = BLESS;

  // 存檔碼（純文字，可以複製貼上）
  DH.encodeSave = function (obj) {
    const json = JSON.stringify(obj);
    const bytes = new TextEncoder().encode(json);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return 'DUHAI1:' + btoa(bin);
  };
  DH.decodeSave = function (code) {
    code = (code || '').trim();
    if (!code.startsWith('DUHAI1:')) throw new Error('不是渡海的存檔碼');
    const bin = atob(code.slice(7));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  };
})();

/* 渡海 — 結局後記：每個人後來怎麼了 */
(function () {
  const DH = globalThis.DH;
  const here = (r, id) => r.comp[id] && !r.comp[id].dead && !r.comp[id].away;

  DH.epilogue = function (r) {
    const out = [];
    const c = r.comp;
    // 老蔡
    if (c.cai.dead) {
      out.push({ who: 'cai', t: c.cai.deathHow === 'storm'
        ? '老蔡沒有回頭。他留在那場風颱裡。後來每年七月，阿水都會往海裡倒一碗酒——只倒一半，另一半他自己喝。他說，老蔡阿伯戒酒戒了一輩子，都只戒三天。'
        : '老蔡沒有走完這一趟。他的舵，後來被阿水拆下來，帶上了岸。' });
    } else if (r.flags.caiWithHong) {
      out.push({ who: 'cai', t: '老蔡跟著十三爺的船走了。後來有人說，海上有一艘不剃頭的船，掌舵的是一個嘴很臭的老頭，每次經過媽宮，都會往天后宮的方向，點三炷香。' });
    } else {
      out.push({ who: 'cai', t: '老蔡回頭了。第四十一趟，第四十二趟，第四十三趟……他一直跑到他的手握不住舵為止。他最後一趟，載的是一船要回唐山掃墓的人。' });
    }
    // 伊蘭
    if (r.flags.lanGiven) {
      out.push({ who: 'lan', t: r.flags.lanLastWords
        ? '伊蘭被押回了廈門。後來，再也沒有人聽過她的消息。只有魏子葳知道，她最後用她的話講的那一句，是什麼意思——他後來在府城，問過一個新港社來的老婦人。那句話是：「我差一點就到家了。」'
        : '伊蘭被押回了廈門。後來，再也沒有人聽過她的消息。她最後跟他講的那句話，他記了一輩子：「……你們唐山人。」' });
    } else if (c.lan.dead) {
      out.push({ who: 'lan', t: '伊蘭沒有回到新港社。她的鹿角刀，後來被送回社裡，交給她阿姨。社裡的人在公廨前面，用她們的話，唱了一整夜。' });
    } else if (r.ended && r.ended.id === 'lan') {
      out.push({ who: 'lan', t: '伊蘭後來教社裡的孩子寫紅毛字。最後一批會寫的人，都是她教的。' });
    } else {
      out.push({ who: 'lan', t: '伊蘭回到了新港社。社裡的人花了很久，才想起她是誰。她用她的話，重新學了一遍自己的名字。' });
    }
    // 黑狗
    if (c.gou.dead) {
      out.push({ who: 'gou', t: '黑狗沒有走到府城。那塊刻著「陳添丁」的腰牌，後來被送到一個賣豆花的婦人手上。她看了很久，收進懷裡，然後繼續賣豆花。' });
    } else if (r.flags.gouLook) {
      out.push({ who: 'gou', t: '黑狗在府城那條小巷的對面，站了一整個下午。豆花擔還在。顧擔的婦人旁邊，有一個十歲的少年在幫忙收碗，叫一個賣魚的男人「阿爸」。黑狗買了一碗豆花，付了錢，吃完，走了。' + (r.flags.gouCut ? '他的頭髮，已經長出短短的一層了。' : '他沒有剪辮子。') });
    } else if (r.flags.gouCut || r.flags.gouTake) {
      out.push({ who: 'gou', t: '黑狗剪了辮子，走進那條小巷。後來的事，沒有人知道。只知道那條巷子裡的豆花擔，從那年起，多了一個臉上有刀疤的男人在顧，收錢的時候從來不講話。' });
    } else {
      out.push({ who: 'gou', t: '黑狗上了岸，就不見了。有人說他回了府城，有人說他上了十三爺的船。他從來不讓人叫他添丁。' });
    }
    // 阿祿師
    if (c.lu.dead) {
      out.push({ who: 'lu', t: '阿祿師沒有上岸。後來，魏厝庄的人起了一間小小的王爺廟。廟裡那尊王爺，是從海上撈起來的，雕工很粗，漆是新的。' });
    } else {
      out.push({ who: 'lu', t: '阿祿師在諸羅的一個小庄頭，起了一間王爺廟。廟很小，香火卻很旺。每年中元，廟口都演一齣戲，演一艘偷渡的船、一場風颱、一群水鬼，還有一個很會唱歌的胖法師。' });
    }
    // 九叔
    const jf = r.flags.jiuFate;
    if (r.flags.jiuSoft) {
      out.push({ who: 'jiu', t: '九叔沒有再出海。有人在府城碼頭看過他，坐在石階上，手指頭還在撥一副看不見的算盤。' });
      if (jf === 'yielded') out.push({ who: 'chen', t: '陳老大把篙子丟了，跪在沙上。後來聽說他在鹿耳門扛貨，扛到腰都直不起來。' });
      else if (jf === 'sea') out.push({ who: 'chen', t: '陳老大落海了。沒有人去撈他。' });
      else if (jf === 'dead') out.push({ who: 'chen', t: '陳老大死在沙汕上。潮水漲上來，把他也種成了一顆芋。' });
    } else if (jf === 'yielded') out.push({ who: 'jiu', t: '九叔把剩下的銀子都留在船上，一個人划著舢舨走了。後來，鹿耳門外的沙汕上，有人在退潮的時候，看到一個老人站在沙上，一直站到潮水漲上來，才走。' });
    else if (jf === 'sea') out.push({ who: 'jiu', t: '九叔落海了。他的算盤，漂在沙汕旁邊，一顆一顆的珠子，被潮水打得嘩啦嘩啦響。' });
    else if (jf === 'dead') out.push({ who: 'jiu', t: '九叔死在他自己的船上。他的錢箱裡，有一疊一疊寫滿人名的紙。每一個名字後面，都寫著一個數目。' });
    // 十三爺
    const ho = r.flags.hongOutcome;
    if (ho === 'yielded') out.push({ who: 'hong', t: '洪十三把那面「鄭」字旗送給了他們。旗子後來掛在王爺廟的樑上，褪色褪到看不出字。' });
    else if (ho === 'killed') out.push({ who: 'hong', t: '洪十三死後第二年，海上就再也沒有人掛「鄭」字旗了。' });
    // 稻種
    if (!(r.ended && r.ended.id === 'sea')) {
      const seeds = r.deck.some((c) => c.id === 'daozhong');
      if (seeds) out.push({ who: 'wei', t: '那包稻種，他一直帶到了岸上。第一季的秧，插在一片沒有人要的荒地上。後來那一帶的田，都說是從那一包種分出去的。' });
      else out.push({ who: 'wei', t: (r.flags.hongOutcome === 'paid' ? '那包稻種，跟著其他的貨，一起搬上了十三爺的船。' : '那包稻種，沉在黑水溝裡了。') + '上岸以後，他用三天的工錢，跟人換了一小包別人的種。他說，種是會發的，不管是誰的。' });
    }
    // 乘客
    const total = 24 + (r.flags.drifterSaved ? 1 : 0);
    const lostNamed = r.pax.filter((p) => !p.alive);
    const aliveN = DH.paxAlive(r);
    let t = '這一趟，順興號的艙底，除了他們幾個，還載了' + DH.cn(total) + '個偷渡的人。' + (aliveN === total ? '一個都沒有少，全都上了岸。' : DH.cnq(aliveN) + '個上了岸。');
    if (lostNamed.length) t += '沒有上岸的人裡面，有名有姓的是：' + lostNamed.map((p) => p.name).join('、') + '。';
    const un = r.paxLostUnnamed;
    if (un > 0) t += '還有' + DH.cnq(un) + '個，' + (r.pax.find((p) => p.id === 'lin' && p.alive) || r.flags.linPromise ? '林生的冊子上有他們的名字。' : '沒有人記得他們的名字。');
    out.push({ who: 'pax', t });
    const died = total - aliveN;
    const ratio = Math.round((died / total) * 10);
    const said = died === 0 ? '這一趟，一個都沒有死。' : ratio === 0 ? '這一趟，十個裡面，死不到一個。' : '這一趟，十個裡面，死了' + DH.cnq(ratio) + '個。';
    out.push({ who: 'saying', t: '十個去，六個死，三個留，一個回頭。' + said + (ratio < 6 ? '比老話講的，少。' : ratio > 6 ? '比老話講的，多。' : '跟老話講的，一樣。') });
    return out;
  };
})();

      penghu_night: { sky: ['#0a0f1a', '#1a2233'], sea: ['#0d1828', '#060d18'], line: 'rgba(170,190,220,', horizon: 0.55, island: true, stars: true, lantern: true },
      storm_pre: { sky: ['#4a4426', '#a68f4a'], sea: ['#3a3f33', '#1f241c'], line: 'rgba(240,230,190,', horizon: 0.45 },
      storm: { sky: ['#0b1015', '#26303a'], sea: ['#121a22', '#06090d'], line: 'rgba(220,235,245,', horizon: 0.32, rain: true },
      fog: { sky: ['#3a4450', '#6a7480'], sea: ['#2a3440', '#18202a'], line: 'rgba(220,230,240,', horizon: 0.45, fog: true },
      ghost: { sky: ['#0a1416', '#16282a'], sea: ['#0b1a1c', '#040a0b'], line: 'rgba(150,220,210,', horizon: 0.45, fog: true, stars: false },
      beach: { sky: ['#5a7c95', '#d9cfae'], sea: ['#2d5a73', '#1b3a52'], line: 'rgba(250,250,245,', horizon: 0.55, sand: true },
      sandbar: { sky: ['#3a3f5a', '#d9a27a'], sea: ['#3a5470', '#1b2e48'], line: 'rgba(255,235,210,', horizon: 0.5, sand: true, sun: true },
      luermen: { sky: ['#7aa0bd', '#e8dcc0'], sea: ['#3d6e86', '#24506a'], line: 'rgba(255,255,250,', horizon: 0.55, island: true },
      land: { sky: ['#1a1410', '#2a2016'], sea: ['#1e1712', '#100c09'], line: 'rgba(200,170,120,', horizon: 0.7 },
      pudu: { sky: ['#1a0806', '#3a120c'], sea: ['#2a0e0a', '#120504'], line: 'rgba(255,170,110,', horizon: 0.72, lanterns: true, warm: true },
      pudu_dawn: { sky: ['#3a2a3a', '#d9a27a'], sea: ['#2a1a18', '#120a08'], line: 'rgba(255,200,160,', horizon: 0.72, lanterns: true, warm: true, sun: true },
    },
    draw(t) {
      const c = Sea.cx, W = Sea.w, H = Sea.h, p = Sea.P[Sea.preset] || Sea.P.night;
      Sea.amp += (Sea.targetAmp - Sea.amp) * 0.05;
      Sea.surge *= 0.94;
      const hz = H * p.horizon;
      let g = c.createLinearGradient(0, 0, 0, hz);
      g.addColorStop(0, p.sky[0]); g.addColorStop(1, p.sky[1]);
      c.fillStyle = g; c.fillRect(0, 0, W, hz + 1);
      if (p.stars) { c.fillStyle = 'rgba(230,236,255,.55)'; for (let i = 0; i < 70; i++) { const hx = Math.sin(i * 12.9898) * 43758.5453, hy = Math.sin(i * 78.233) * 12543.123; const x = (hx - Math.floor(hx)) * W, y = (hy - Math.floor(hy)) * hz * 0.95; const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.7 + i)); c.globalAlpha = tw * 0.7; c.fillRect(x, y, 1.4, 1.4); } c.globalAlpha = 1; }
      if (p.moon) { c.fillStyle = 'rgba(240,232,210,.85)'; c.beginPath(); c.arc(W * 0.78, hz * 0.32, Math.min(W, H) * 0.035, 0, 7); c.fill(); c.fillStyle = p.sky[0]; c.beginPath(); c.arc(W * 0.78 + Math.min(W, H) * 0.014, hz * 0.32 - 2, Math.min(W, H) * 0.032, 0, 7); c.fill(); }
      if (p.clouds || ['sea', 'penghu', 'beach', 'luermen'].includes(Sea.preset)) { c.fillStyle = 'rgba(255,255,255,.08)'; for (let i = 0; i < 5; i++) { const x = ((i * 0.23 + t * 0.004) % 1.3 - 0.15) * W, y = hz * (0.25 + (i % 3) * 0.17); c.beginPath(); c.ellipse(x, y, W * 0.16, hz * 0.04, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(x + W * 0.07, y - hz * 0.025, W * 0.09, hz * 0.035, 0, 0, 7); c.fill(); } }
      if (p.sun) { const sg = c.createRadialGradient(W * 0.3, hz, 0, W * 0.3, hz, H * 0.35); sg.addColorStop(0, 'rgba(255,210,150,.55)'); sg.addColorStop(1, 'rgba(255,210,150,0)'); c.fillStyle = sg; c.fillRect(0, 0, W, hz); }
      if (p.island) { c.fillStyle = 'rgba(30,40,50,.55)'; c.beginPath(); c.moveTo(0, hz); c.lineTo(W * 0.1, hz - H * 0.025); c.lineTo(W * 0.42, hz - H * 0.02); c.lineTo(W * 0.5, hz); c.closePath(); c.fill(); if (Sea.preset !== 'luermen') { c.fillStyle = '#7a2a1e'; c.fillRect(W * 0.3, hz - H * 0.045, W * 0.04, H * 0.025); } }
      if (p.rocks) { c.fillStyle = '#05080d'; c.beginPath(); c.moveTo(0, hz + 20); c.quadraticCurveTo(W * 0.12, hz - 40, W * 0.22, hz + 10); c.lineTo(W * 0.22, H); c.lineTo(0, H); c.fill(); }
      g = c.createLinearGradient(0, hz, 0, H);
      g.addColorStop(0, p.sea[0]); g.addColorStop(1, p.sea[1]);
      c.fillStyle = g; c.fillRect(0, hz, W, H - hz);
      if (p.sand) { c.fillStyle = 'rgba(214,190,140,.35)'; c.beginPath(); c.ellipse(W * 0.5, H * 0.86, W * 0.42, H * 0.06, 0, 0, 7); c.fill(); }
      // 版畫式的浪線
      const rows = 16, amp = (p.planks ? 0.2 : 1) * Sea.amp * (1 + Sea.surge * 2.2);
      for (let i = 0; i < rows; i++) {
        const k = i / rows, y0 = hz + (H - hz) * (k * k * 0.98 + 0.01), a = 4 + k * 14;
        c.strokeStyle = p.line + (0.08 + k * 0.22) + ')';
        c.lineWidth = 0.8 + k * 1.6;
        c.beginPath();
        const sp = 0.6 + i * 0.07, wl = 60 + k * 160;
        for (let x = -10; x <= W + 10; x += 12) {
          const y = y0 + Math.sin(x / wl + t * sp + i * 1.7) * a * amp + Math.sin(x / (wl * 0.37) - t * sp * 1.3 + i) * a * 0.3 * amp;
          if (x === -10) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.stroke();
      }
      if (Sea.surge > 0.05) { c.fillStyle = `rgba(220,240,255,${Sea.surge * 0.25})`; c.fillRect(0, 0, W, H); }
      if (p.planks) { c.strokeStyle = 'rgba(90,60,30,.35)'; c.lineWidth = 2; for (let x = 0; x < W; x += 70) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 30, H); c.stroke(); } }
      if (p.lamp) { const lg = c.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.35, Math.max(W, H) * 0.6); lg.addColorStop(0, 'rgba(255,170,80,.22)'); lg.addColorStop(1, 'rgba(255,170,80,0)'); c.fillStyle = lg; c.fillRect(0, 0, W, H); }
      if (p.lantern) { c.fillStyle = 'rgba(255,150,60,.8)'; c.beginPath(); c.arc(W * 0.32, H * p.horizon - H * 0.06, 3, 0, 7); c.fill(); }
      if (p.lanterns) {
        const band = c.createLinearGradient(0, H * 0.05, 0, H * 0.45); band.addColorStop(0, 'rgba(255,110,50,0)'); band.addColorStop(0.5, 'rgba(255,110,50,.16)'); band.addColorStop(1, 'rgba(255,110,50,0)');
        c.fillStyle = band; c.fillRect(0, H * 0.05, W, H * 0.4);
        for (let i = 0; i < 9; i++) {
          const x = W * (0.06 + i * 0.11), y = H * (0.18 + (i % 2) * 0.05) + Math.sin(t + i) * 3;
          const lg = c.createRadialGradient(x, y, 0, x, y, 70); lg.addColorStop(0, 'rgba(255,120,60,.35)'); lg.addColorStop(1, 'rgba(255,120,60,0)');
          c.fillStyle = lg; c.fillRect(x - 70, y - 70, 140, 140);
          c.fillStyle = '#d8402a'; c.beginPath(); c.ellipse(x, y, 9, 12, 0, 0, 7); c.fill();
          c.fillStyle = '#ffd08a'; c.fillRect(x - 1, y - 4, 2, 8);
        }
      }
      if (p.fog) { const fg = c.createLinearGradient(0, hz - 60, 0, H); fg.addColorStop(0, 'rgba(200,210,220,0)'); fg.addColorStop(0.4, 'rgba(200,210,220,.18)'); fg.addColorStop(1, 'rgba(200,210,220,.05)'); c.fillStyle = fg; c.fillRect(0, 0, W, H); }
      if (p.rain) { c.strokeStyle = 'rgba(200,220,235,.35)'; c.lineWidth = 1; c.beginPath(); for (const d of Sea.rain) { d.y += 0.03 * d.s; d.x -= 0.006 * d.s; if (d.y > 1) { d.y = 0; d.x = Math.random() * 1.2; } const x = d.x * W, y = d.y * H; c.moveTo(x, y); c.lineTo(x - 8, y + 22); } c.stroke(); }
    },
  });

  // ---------- 提示、面板 ----------
  UI.toast = (msg, ms) => {
    const old = UI.$('.toast'); if (old) old.remove();
    const el = UI.html(`<div class="toast" role="status">${esc(msg)}</div>`);
    document.body.appendChild(el);
    setTimeout(() => el.remove(), ms || 2200);
  };
  UI.tip = (text, x, y) => {
    UI.untip();
    const el = UI.html(`<div class="tip" role="tooltip">${text}</div>`);
    document.body.appendChild(el);
    const r = el.getBoundingClientRect();
    el.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + 'px';
    el.style.top = Math.max(8, Math.min(window.innerHeight - r.height - 8, y - r.height - 12)) + 'px';
    UI._tipT = setTimeout(UI.untip, 4200);
  };
  UI.untip = () => { clearTimeout(UI._tipT); const t = UI.$('.tip'); if (t) t.remove(); };

  UI.overlay = (title, bodyHtml, opts) => {
    opts = opts || {};
    UI.closeOverlay();
    const el = UI.html(`<div class="overlay" role="dialog" aria-label="${esc(title)}"><div class="wrap overlay-head"><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="關閉">${DH.ICONS.close}</button></div><div class="overlay-body"><div class="wrap">${bodyHtml}</div></div></div>`);
    el.addEventListener('click', (ev) => { if (ev.target.closest('[data-close]')) { UI.closeOverlay(); if (opts.onClose) opts.onClose(); } });
    document.body.appendChild(el);
    if (opts.onMount) opts.onMount(el);
    return el;
  };
  UI.closeOverlay = () => { const o = UI.$('.overlay'); if (o) o.remove(); };

  // 名詞解釋
  DH.GLOSS = {
    '浪': '浪有三個樣子，輪流來：平、起、湧。上面那排格子是接下來三回合的浪。',

    '談': '談判：這一場不看浪，看的是對方的心跟你的底氣。',

    blk: '擋：先吃掉傷害。下一回合開始時歸零。',
    steady: '穩：抵掉下一次浪擊，不會失衡。最多疊2層。',

/* 渡海 — 標題、設定、記憶簿、牌位 */
(function () {
  const DH = globalThis.DH;
  const UI = DH.UI;
  const esc = UI.esc;
  const T = (UI.Title = {});
  const DIFF_NAME = ['聽故事', '渡海', '黑水'];
  const DIFF_DESC = ['敵人弱三成。想先聽完故事的人。', '原本的難度。', '敵人強兩成。講過一遍以後才開。'];

  T.render = function (app) {
    UI.Sea.set('night', 0.7);
    UI.Snd.ambient('sea');
    const m = UI.meta;
    const inProgress = UI.run && !UI.run.ended && UI.run.screen !== 'fin';
    const first = m.tellings === 0 && !inProgress;
    app.innerHTML = `
      <div class="screen title-screen wrap">
        <div class="title-mark">
          <h1 class="title-big">${UI.vt('渡海')}</h1>
          <div class="title-sub">${UI.vt('十去，六死，三留，一回頭')}</div>
          <div class="title-seal" aria-hidden="true">順興<br>號</div>
        </div>
        <div class="title-menu">
          ${inProgress ? `<button class="btn primary" data-act="cont">繼續這一遍</button>` : ''}
          <button class="btn ${inProgress ? '' : 'primary'}" data-act="new">${first ? '開始' : '再講一遍'}</button>
          <div class="title-foot">
            <button class="btn small" data-act="book">${DH.ICONS.book} 記憶簿</button>
            <button class="btn small" data-act="tablets">牌位</button>
            <button class="btn small" data-act="help">怎麼玩</button>
            <button class="btn small" data-act="settings">${DH.ICONS.gear} 設定</button>
          </div>
        </div>
        <p class="title-note">${first ? '一個老人，在中元普渡的夜裡，講他年輕時坐偷渡船過黑水溝的事。<br>故事裡的他死在半路的時候，老人會說：不對，重講。' : `已經講了 ${m.tellings} 遍。` + (m.trueDone ? '　他把名字還回去了。' : '')}</p>
      </div>`;
    app.querySelector('[data-act="new"]').onclick = () => (inProgress ? T.confirmNew() : T.newTelling());
    const c = app.querySelector('[data-act="cont"]'); if (c) c.onclick = () => { UI.view = 'game'; UI.render(); };
    app.querySelector('[data-act="book"]').onclick = T.book;
    app.querySelector('[data-act="tablets"]').onclick = T.tablets;
    app.querySelector('[data-act="help"]').onclick = T.help;

  T.confirmNew = function () {
    UI.overlay('重新講一遍？', `<p>這一遍還沒講完。重新開始，這一遍就不算了（不會留下記憶，也不會多一塊牌位）。</p><div class="row-wrap"><button class="btn primary" id="cn-yes">重新講</button><button class="btn" data-close>不要</button></div>`, {
      onMount: (el) => { el.querySelector('#cn-yes').onclick = () => { UI.closeOverlay(); UI.run = null; T.newTelling(); }; },
    });
  };

  T.newTelling = function () {
    const m = UI.meta;
    const opts = { diff: m.lastDiff != null ? m.lastDiff : 1, blessing: null };
    const bless = (m.blessings || []).filter((id) => DH.ITEMS[id]);
    const owner = { compass: '老蔡', deerbag: '伊蘭', dogtag: '黑狗', redscarf: '阿祿師', amulet: '秀娘' };
    const draw = () => `
      <div class="book">
        <h3>難度</h3>
        <div class="seg" role="group" aria-label="難度">${DIFF_NAME.map((n, i) => `<button data-d="${i}" class="${opts.diff === i ? 'on' : ''}" ${i === 2 && m.diffUnlocked < 2 ? 'disabled' : ''}>${n}</button>`).join('')}</div>
        <p>${esc(DIFF_DESC[opts.diff])}</p>
        ${bless.length ? `<h3>前人的庇蔭</h3><p>死在海上的人，阿公每年都替他們點香。帶一樣他們留下的東西上船。</p>
          <div class="itemlist">${bless.map((id) => `<button class="itemrow person" data-b="${id}" style="${opts.blessing === id ? 'border-color:var(--lantern)' : ''}"><span class="glyph">${esc(DH.ITEMS[id].name[0])}</span><span><b>${esc(DH.ITEMS[id].name)}</b>（${esc(owner[id] || '')}）<p>${esc(DH.ITEMS[id].text)}</p></span></button>`).join('')}
          <button class="itemrow person" data-b="" style="${!opts.blessing ? 'border-color:var(--lantern)' : ''}"><span class="glyph">空</span><span><b>什麼都不帶</b><p>空手上船。</p></span></button></div>` : ''}
        <div class="row-wrap"><button class="btn primary" id="nt-go">開始講</button></div>
      </div>`;

      ${(m.memories || []).length ? `<h3>記得的小事</h3>${m.memories.map((x) => `<p>・${esc(MEMO[x] || x)}</p>`).join('')}` : ''}

  T.settings = function () {

      <h3>文字速度</h3>
      <div class="seg">${speeds.map(([n, v]) => `<button data-sp="${v}" class="${s.textSpeed === v ? 'on' : ''}">${n}</button>`).join('')}</div>
      <h3>存檔碼</h3>
      <p>${UI.Store.cloud ? '進度會自動存在你的帳號裡，換裝置打開也能接著玩。' : '進度存在這個瀏覽器裡。'}要搬到另一個版本（例如網頁版），把這串存檔碼複製過去貼上。</p>
      <textarea class="codebox" id="st-code" readonly></textarea>

        const msg = el.querySelector('#st-msg');

        else { b.dataset.armed = '1'; b.textContent = '再按一次，確定清除'; }
      };

  };
})();

/* 渡海 — 劇情畫面 */
(function () {
  const DH = globalThis.DH;
  const UI = DH.UI;
  const esc = UI.esc;
  const Run = DH.Run;
  const S = (UI.Scene = { log: [], last: null, timer: null, typing: false });
  const AMB = { storm: 'storm', storm_pre: 'sea', hold: 'hold', pudu: 'warm', pudu_dawn: 'warm', land: 'land', beach: 'land' };
  S.resetLog = () => { S.log = []; S.last = null; };

  function speakerHtml(who) {
    const sp = DH.SPEAKERS[who] || { name: who, c: '#999' };
    return `<div class="speaker"><i style="background:${sp.c}"></i>${esc(sp.name)}</div>`;
  }
  function seenBefore(id) { const m = UI.meta; return m && m.seenScenes && m.seenScenes.includes(id); }
  function markSeen(id) { const m = UI.meta; if (!m.seenScenes) m.seenScenes = []; if (!m.seenScenes.includes(id)) m.seenScenes.push(id); }

  S.render = function (app) {
    const r = UI.run;
    const st = Run.sceneStep(r);
    if (!st) { app.innerHTML = '<div class="screen"></div>'; return; }
    const sc = DH.SCENES[r.scene.id];
    const frame = !!sc.frame;
    const bg = frame ? (r.bg && r.bg.startsWith('pudu') ? r.bg : 'pudu') : (r.bg || 'night');
    UI.Sea.set(bg, bg === 'storm' ? 2.2 : bg === 'hold' ? 0.4 : 1);
    UI.Snd.ambient(AMB[bg] || 'sea');
    clearInterval(S.timer); S.typing = false;
    const canSkip = seenBefore(r.scene.id) && (r.telling > 1) && !st.choice;
    const tools = `<div class="scene-tools">${canSkip ? `<button class="btn small ghost" data-act="skip">跳過聽過的</button>` : ''}<button class="iconbtn" data-act="log" aria-label="前面講過的">${DH.ICONS.book}</button><button class="iconbtn" data-act="menu" aria-label="選單">${DH.ICONS.gear}</button></div>`;
    let stage = '', box = '';
    let who = null, text = null, kind = 'narr';
    if (st.title) {
      const t = UI.txt(st.title);
      app.innerHTML = `<div class="screen scene ${frame ? 'frame-tone' : ''}">${tools}<div class="titlecard" data-act="next"><div>${UI.vt(t)}</div></div></div>`;
      UI.Snd.motif();
      clearTimeout(S.tt); S.tt = setTimeout(() => { if (Run.sceneStep(UI.run) === st) S.next(); }, 3000);
      bindCommon(app);
      return;
    }
    if (st.blank) {
      app.innerHTML = `<div class="screen scene"><div class="titlecard" data-act="next"><div></div></div></div>`;
      clearTimeout(S.tt); S.tt = setTimeout(() => { if (Run.sceneStep(UI.run) === st) S.next(); }, 1400);
      bindCommon(app);
      return;
    }
    if (st.letter) {
      stage = `<div class="letter">${esc(st.letter)}</div>`;
      box = `<div class="line narr">（信紙已經被摸得起毛了。）</div><span class="cursor-next">▼</span>`;
    } else if (st.tablet) {
      stage = `<div class="tablet">${UI.vt(st.tablet)}</div>`;
      box = `<div class="line narr">（牌位上，終於有了字。）</div><span class="cursor-next">▼</span>`;
    } else if (st.epilogue) {
      const list = DH.epilogue(r);
      const pkey = { wei: 'wei', cai: 'cai', lan: 'lan', gou: 'gou', lu: 'lu', jiu: 'jiu', hong: 'hong', chen: 'chenlao', pax: 'lin', saying: 'old' };
      box = `<div class="speaker"><i style="background:var(--lantern)"></i>後來</div><div class="epilogue">${list.map((x) => `<div class="epi">${DH.portrait(pkey[x.who] || 'rioter')}<p>${esc(x.t)}</p></div>`).join('')}</div><div class="choices"><button class="btn primary" data-act="next">繼續</button></div>`;
    } else if (st.credits) {
      const names = (UI.meta.memorial || []).map((x) => x.name);
      const uniq = [...new Set(names)];
      box = `<div class="credits"><div class="credits-roll">
        <p class="h">渡海</p><p>那一夜在海上的人</p>
        ${[['魏子葳', '秀娘', '阿水'], ['老蔡', '伊蘭', '黑狗', '阿祿師'], ['林生', '陳阿嬤', '大頭', '細頭'], ['王伯', '阿珠', '阿土', '吳阿細'], ['九叔', '洪十三', '張把總']].map((row) => `<p class="names">${row.map((n) => `<span>${n}</span>`).join('')}</p>`).join('')}
        <p class="h">牌位</p>${uniq.length ? `<p class="names">${uniq.map((n) => `<span>${esc(n)}</span>`).join('')}</p>` : ''}<p>還有那些沒有人記得名字的</p>
        <p class="h">講古的人</p><p>阿水</p>
        <p class="h">　</p><p>謝謝你聽完。</p>
      </div></div><div class="choices"><button class="btn primary" data-act="next">完</button></div>`;
    } else if (st.choice) {
      const opts = Run.visibleChoices(r, st);
      const last = S.last;
      who = last && last.who;
      box = (last ? (last.who ? speakerHtml(last.who) : '') + `<div class="line ${last.who ? '' : 'narr'}">${esc(last.text)}</div>` : '') +
        `<div class="choices">${opts.map((o, i) => `<button class="choice" data-ch="${i}" ${o.locked ? 'disabled' : ''}>${esc(o.t)}${o.locked ? `<small>${esc(o.locked)}</small>` : ''}</button>`).join('')}</div>`;
    } else {
      if (st.s) { who = st.s; text = UI.txt(st.t); kind = 'speech'; }
      else if (st.f != null) { text = UI.txt(st.f); kind = 'frame'; }
      else { text = UI.txt(st.n); }
      box = (who ? speakerHtml(who) : '') + `<div class="line ${who ? '' : 'narr'} ${kind}" id="sc-line"></div><span class="cursor-next hide" id="sc-next">▼</span>`;
    }
    const pkey = who || (st.choice && S.last && S.last.who);
    const portrait = pkey ? `<div class="scene-portrait" id="sc-pt">${DH.portrait(pkey)}</div>` : '';
    app.innerHTML = `<div class="screen scene ${frame ? 'frame-tone' : ''}">${tools}<div class="scene-stage">${stage || portrait}</div><div class="textbox" ${st.choice || st.epilogue || st.credits ? '' : 'data-act="next" tabindex="0" role="button" aria-label="下一句"'}>${box}</div></div>`;
    const pt = app.querySelector('#sc-pt');
    if (pt) requestAnimationFrame(() => pt.classList.add('on'));
    bindCommon(app);
    app.querySelectorAll('[data-ch]').forEach((b) => (b.onclick = (ev) => { ev.stopPropagation(); UI.Snd.sfx('select'); S.choose(Number(b.dataset.ch)); }));
    if (text != null) {
      S.last = { who, text };
      S.log.push({ who, text, frame });
      if (S.log.length > 120) S.log.shift();
      S.type(text);
    }
    markSeen(r.scene.id);
  };

  function bindCommon(app) {
    app.querySelectorAll('[data-act="next"]').forEach((el) => (el.onclick = () => S.tap()));
    const tb = app.querySelector('.textbox[data-act="next"]');
    if (tb) tb.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.tap(); } };
    const sk = app.querySelector('[data-act="skip"]'); if (sk) sk.onclick = (e) => { e.stopPropagation(); S.skip(); };
    const lg = app.querySelector('[data-act="log"]'); if (lg) lg.onclick = (e) => { e.stopPropagation(); S.showLog(); };
    const mn = app.querySelector('[data-act="menu"]'); if (mn) mn.onclick = (e) => { e.stopPropagation(); UI.gameMenu(); };
  }

  S.type = function (text) {
    const el = UI.$('#sc-line');
    if (!el) return;
    const sp = UI.settings().textSpeed || 1;
    if (sp >= 99 || UI.reduced()) { el.textContent = text; S.done(); return; }
    let i = 0; S.typing = true;
    const per = Math.max(1, Math.round(sp * 1.4));
    clearInterval(S.timer);
    S.timer = setInterval(() => {
      i += per;
      el.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(S.timer); S.done(); }
    }, 34);
    S.fullText = text;
  };
  S.done = function () { S.typing = false; const n = UI.$('#sc-next'); if (n) n.classList.remove('hide'); };
  S.tap = function () {
    if (S.typing) { clearInterval(S.timer); const el = UI.$('#sc-line'); if (el) el.textContent = S.fullText; S.done(); return; }
    S.next();
  };
  S.next = function () {
    clearTimeout(S.tt);
    const r = UI.run;
    const st = Run.sceneStep(r);
    if (!st || st.choice) return;
    Run.sceneNext(r);
    UI.commit();
  };
  S.choose = function (i) {
    const r = UI.run;
    const st = Run.sceneStep(r);
    if (!st || !st.choice) return;
    const opts = Run.visibleChoices(r, st);
    if (opts[i]) { S.log.push({ who: 'wei', text: '〔' + opts[i].t + '〕' }); S.last = null; }
    Run.sceneChoose(r, i);
    UI.commit();
  };
  // 跳過已經聽過的段落：一路往下，遇到選擇、戰鬥或其他畫面就停
  S.skip = function () {
    const r = UI.run;
    let guard = 0;
    const id0 = r.scene && r.scene.id;
    while (guard++ < 400 && r.screen === 'scene') {
      const st = Run.sceneStep(r);
      if (!st || st.choice || st.epilogue || st.credits) break;
      if (st.s || st.n != null || st.f != null) { const t = UI.txt(st.s ? st.t : st.n != null ? st.n : st.f); S.last = { who: st.s || null, text: t }; S.log.push({ who: st.s || null, text: t }); }
      Run.sceneNext(r);
      if (r.scene && r.scene.id !== id0 && !seenBefore(r.scene.id)) break;
    }
    UI.commit();
  };
  S.showLog = function () {
    const html = S.log.slice(-60).map((x) => `<p>${x.who ? '<b style="color:' + (DH.SPEAKERS[x.who] || {}).c + '">' + esc((DH.SPEAKERS[x.who] || { name: x.who }).name) + '</b>　' : ''}${esc(x.text)}</p>`).join('');
    UI.overlay('前面講過的', html || '<p>還沒有。</p>', { onMount: (el) => { const b = el.querySelector('.overlay-body'); b.scrollTop = b.scrollHeight; } });
  };
})();

(function () {

          <button class="iconbtn" data-hud="menu" aria-label="選單">${DH.ICONS.gear}</button>
        </div>

  UI.bindHud = function (root) {

      cai: '舵公，六十一歲。過了四十趟黑水溝，每一趟都回頭。跟船尾那尊媽祖講話像在跟老伴吵嘴。海腳。',
      lan: '新港社的女人。十二歲被帶進鄭家當婢女，現在要回家。會讀紅毛字。',

    UI.overlay(DH.OWNERS[id].name, `<div class="book"><div style="width:120px">${DH.portrait(id)}</div><p>${esc(BIO[id] || '')}</p><p>${esc(rel)}</p></div>`);

  UI.gameMenu = function () {
    const html = `<div class="title-menu" style="margin:0 auto">

      <button class="btn" data-m="items">${DH.ICONS.item} 隨身物</button>
      <button class="btn" data-m="help">怎麼玩</button>
      <button class="btn" data-m="settings">${DH.ICONS.gear} 設定</button>

    </div>`;
    UI.overlay('選單', html, {
      onMount: (el) => {
        el.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => {
          const k = b.dataset.m; UI.closeOverlay();
          if (k === 'deck') UI.deckView(UI.run.deck, '牌組（' + UI.run.deck.length + '）');

          if (k === 'help') UI.Title.help();
          if (k === 'settings') UI.Title.settings();
          if (k === 'title') { UI.view = 'title'; UI.Store.saveNow(); UI.render(); }

  // ---------- 海圖 ----------
  M.render = function (app) {
    const r = UI.run;
    UI.Sea.set(r.act === 1 ? 'night' : r.act === 2 ? 'blackwater' : 'dawn', 0.8);
    UI.Snd.ambient('sea');
    const avail = Run.availableNodes(r);
    const rows = r.map.rows;
    const [aname, asub] = ACT_NAME[r.act];
    const nodeHtml = (n) => {
      const open = avail.includes(n.id);
      const glyph = n.t === 'fixed' ? (REF_LABEL[n.ref] || '程')[0] : n.t === 'night' && n.ref ? '夜' : DH.NODE_GLYPH[n.t];
      const label = n.ref && REF_LABEL[n.ref] ? REF_LABEL[n.ref] : DH.NODE_NAME[n.t];
      return `<div style="grid-column:${n.col + 1}"><div class="node t-${n.t} ${n.done ? 'done' : ''} ${r.pos === n.id ? 'here' : ''} ${open ? 'open' : ''}" data-node="${n.id}" ${open ? 'role="button" tabindex="0"' : ''} aria-label="${esc(label)}">${esc(glyph)}<span class="lbl">${esc(label)}</span></div></div>`;
    };
    app.innerHTML = `<div class="screen">${UI.hud()}
      <div class="wrap act-title"><b>${aname}</b><span>${esc(asub)}</span></div>
      <div class="chart" id="chart"><div class="chart-inner" id="chart-inner">
        <svg class="lines" id="chart-lines"></svg>
        ${rows.map((row, i) => `<div class="chart-row" data-row="${i}">${row.map(nodeHtml).join('')}</div>`).join('')}
        <p class="chart-legend">戰：遭遇　事：事件　夜：陪一個人過夜　市：黑市　險：硬仗　首：這一段的大關</p>
      </div></div></div>`;
    UI.bindHud(app);
    app.querySelectorAll('.node.open').forEach((el) => {
      const go = () => { UI.Snd.sfx('select'); Run.enterNode(UI.run, el.dataset.node); UI.Scene.last = null; UI.commit(); };
      el.onclick = go; el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    });
    requestAnimationFrame(() => M.lines(app));
  };
  M.lines = function (app) {
    const inner = app.querySelector('#chart-inner'), svg = app.querySelector('#chart-lines');
    if (!inner || !svg) return;
    const r = UI.run;
    const box = inner.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    const pos = {};
    inner.querySelectorAll('[data-node]').forEach((el) => { const b = el.getBoundingClientRect(); pos[el.dataset.node] = [b.left - box.left + b.width / 2, b.top - box.top + b.height / 2, b.width / 2]; });
    let s = '';
    const avail = Run.availableNodes(r);
    for (const row of r.map.rows) for (const n of row) for (const m of n.next || []) {
      const a = pos[n.id], b = pos[m];
      if (!a || !b) continue;
      const walked = r.path.includes(n.id) && r.path.includes(m);
      const live = n.id === r.pos && avail.includes(m);
      s += `<line x1="${a[0]}" y1="${a[1] + a[2]}" x2="${b[0]}" y2="${b[1] - b[2]}" stroke="${walked ? '#e8a83e' : live ? '#e8a83e' : '#3a5274'}" stroke-width="${walked ? 2.4 : 1.5}" stroke-dasharray="${walked ? '' : '4 5'}" opacity="${live || walked ? 1 : .7}"/>`;
    }
    svg.innerHTML = s;
    // 捲到目前的位置
    const chart = app.querySelector('#chart');
    const cur = r.pos ? pos[r.pos] : null;
    if (chart && cur) chart.scrollTop = Math.max(0, cur[1] - chart.clientHeight * 0.35);
  };
  M.REF_LABEL = REF_LABEL;
})();

/* ==== src/ui/battle.js ==== */
/* 渡海 — 牌戰畫面 */
(function () {
  const DH = globalThis.DH;

  const IC = DH.ICONS;
  const name = (b, id) => { const e = B.ent(b, id); return e ? e.name : id === 'hold' ? '艙門' : id; };
  const shortName = (b, id) => { const n = name(b, id); return n.length > 3 ? n.slice(0, 3) : n; };

  function seaFor(b) {
    if (b.enc === 'final_current') return 'storm';
    if (b.mode === 'storm') return 'storm';
    if (b.mode === 'tide') return 'sandbar';
    if (b.mode === 'talk') return 'hold';
    if (b.enc === 'a2_ghost') return 'ghost';
    if (b.enc === 'a3_beach') return 'beach';
    if (!b.waves) return 'land';
    const act = UI.run.act;
    return act === 1 ? 'night' : act === 2 ? 'blackwater' : 'dawn';
  }
  function ampFor(b) { if (!b.waves) return 0.5; const p = B.phaseName(b); return b.mode === 'storm' ? (p === '湧' ? 2.6 : 2) : p === '湧' ? 1.8 : p === '起' ? 1.15 : 0.6; }

  // ---------- 意圖 ----------
  function intentHtml(b, e) {
    if (!e.intent || e.gone) return '';
    const sum = DH.enemyIntentSummary(b, e);
    const chips = [];
    for (const a of sum) {
      const tg = a.tgt ? `<span class="tg">→${esc(shortName(b, a.tgt))}</span>` : '';
      switch (a.k) {
        case 'atk': chips.push(`${IC.atk}<span class="n">${a.n}${a.hits > 1 ? '×' + a.hits : ''}</span>${tg}${a.bleed ? `<span class="tg">血${a.bleed}</span>` : ''}`); break;
        case 'atkAll': chips.push(`${IC.atkAll}<span class="n">${a.n}${a.hits > 1 ? '×' + a.hits : ''}</span><span class="tg">全體${a.ship ? '・船' + a.ship : ''}${a.hold ? '・艙門' + a.hold : ''}</span>`); break;
        case 'blk': case 'blkAll': chips.push(`${IC.blk}<span class="n" style="color:#9fc4e6">${a.v}</span>${a.k === 'blkAll' ? '<span class="tg">全</span>' : ''}`); break;
        case 'str': case 'strAll': chips.push(`${IC.buff}<span class="tg">勁+${a.v}${a.k === 'strAll' ? '全' : ''}</span>`); break;
        case 'weakAll': chips.push(`${IC.debuff}<span class="tg">弱${a.v}全體</span>`); break;
        case 'weakT': chips.push(`${IC.debuff}<span class="tg">弱${a.v}${a.tgt ? '→' + esc(shortName(b, a.tgt)) : ''}</span>`); break;
        case 'offT': chips.push(`${IC.debuff}<span class="tg">失衡${a.tgt ? '→' + esc(shortName(b, a.tgt)) : ''}</span>`); break;
        case 'grab': chips.push(`${IC.grab}<span class="n">${a.n}</span><span class="tg">艙</span>`); break;
        case 'steal': chips.push(`${IC.coin}<span class="tg">搶${a.v}兩</span>`); break;
        case 'summon': chips.push(`${IC.summon}<span class="tg">叫人</span>`); break;
        case 'pressure': chips.push(`${IC.talk}<span class="n">${a.n}</span>`); break;
        case 'xinUp': chips.push(`${IC.buff}<span class="tg">心+${a.v}${a.all ? '全' : ''}</span>`); break;
        case 'tide': chips.push(`${IC.storm}<span class="tg">潮+${a.v}</span>`); break;
        case 'ship': chips.push(`${IC.atk}<span class="n">${a.n}</span><span class="tg">船</span>`); break;
        case 'sweep': chips.push(`${IC.grab}<span class="tg">捲人(${a.v})</span>`); break;
        case 'xiu': chips.push(`${IC.atk}<span class="n">${a.n}</span><span class="tg">秀娘</span>`); break;
        case 'heal': chips.push(`${IC.heart}<span class="tg">回${a.v}</span>`); break;
        case 'flee': chips.push(`${IC.flee}<span class="tg">要溜</span>`); break;
        case 'nothing': chips.push(e.intent.icon === 'charge' ? `${IC.charge}<span class="tg">蓄</span>` : `${IC.nothing}`); break;
        case 'custom': chips.push(`${IC.grab}<span class="tg">搶水</span>`); break;
        case 'aura': chips.push(`${IC.talk}<span class="tg">施壓+${e.auraPressure || 0}全</span>`); break;
        default: break;
      }
    }
    const cls = e.intent.icon === 'talk' ? 'i-talk' : e.intent.icon === 'blk' ? 'i-blk' : e.intent.icon === 'buff' ? 'i-buff' : '';
    return `<div class="intent ${cls}" data-intent="${e.id}" title="${esc(e.intent.label)}"><span class="tg" style="color:var(--paper)">${esc(e.intent.label)}</span>${chips.join('')}</div>`;
  }
  function intentTip(b, e) {
    const sum = DH.enemyIntentSummary(b, e);
    const parts = sum.map((a) => {
      const tg = a.tgt ? '打' + name(b, a.tgt) : '';

        case 'atkAll': return `打所有人 ${a.n}${a.hits > 1 ? '×' + a.hits : ''}${a.ship ? '；船身 ' + a.ship : ''}${a.hold ? '；艙門 ' + a.hold : ''}${a.weak ? '；所有人弱' + a.weak : ''}`;

        case 'grab': return `打艙門 ${a.n}；門破了就抓走一個人`;

        case 'heal': return `回 ${a.v} 體力`;

        case 'aura': return `只要他還在，對面每一次施壓都多 ${e.auraPressure || 0}`;

        default: return '';

    }).filter(Boolean);
    return `<b>${esc(e.name)}：${esc(e.intent.label)}</b><br>${esc(parts.join('；'))}`;
  }

  // ---------- 單位 ----------
  function stsHtml(o) {

  }
  function unitHtml(b, o, side) {

  // ---------- 動畫：重播紀錄 ----------
  function unitEl(id) { return UI.$(`.unit[data-id="${id}"]`) || UI.$(`[data-obj="${id}"]`); }

    if (!bar) return;
    const i = bar.querySelector('i'), s = bar.querySelector('span');

    if (s && max) s.textContent = (xin ? '心 ' : '') + hp + '/' + max;

    const W = (ms) => (fast ? UI.sleep(Math.min(ms, 30)) : UI.sleep(ms));

          const killed = ev.hp > 0;
          floatAt(ev.id, ev.hp > 0 ? '-' + ev.hp : ev.blk ? '擋' : '0', ev.hp > 0 ? 'dmg' : 'blk');
          const el = unitEl(ev.id); if (el && ev.hp > 0 && !fast) { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
          if (o) setBar(ev.id, ev.after, o.maxHp);
          setBlk(ev.id, ev.blkAfter);
          UI.Snd.sfx(ev.hp > 0 ? 'hit' : 'blk');
          await W(killed ? 230 : 150); break;
        }
        case 'blk': floatAt(ev.id, '+' + ev.n + (b.mode === 'talk' && ev.id === 'mind' ? '定' : '擋'), 'blk'); setBlk(ev.id, ev.after); UI.Snd.sfx('blk'); await W(110); break;
        case 'heal': floatAt(ev.id, '+' + ev.n, 'heal'); if (o) setBar(ev.id, ev.after, o.maxHp); UI.Snd.sfx('heal'); await W(140); break;
        case 'xin': floatAt(ev.id, '心-' + ev.n, 'xin'); if (o) setBar(ev.id, ev.after, o.xinMax, true); UI.Snd.sfx('xin'); await W(150); break;
        case 'xinUp': floatAt(ev.id, '心+' + ev.n, 'xin'); if (o) setBar(ev.id, ev.after, o.xinMax, true); await W(120); break;
        case 'storm': floatAt(ev.id, '風勢-' + ev.n, 'blk'); if (o) setBar(ev.id, ev.after, o.maxHp); await W(150); break;
        case 'st': if (ev.n > 0 && ev.k !== 'mark' || ev.k === 'mark' && ev.n > 0) floatAt(ev.id, (DH.ST_NAMES[ev.k] || ev.k) + (ev.k === 'off' ? '' : '+' + ev.n), 'st'); await W(70); break;
        case 'miss': floatAt(ev.id, '落空', 'miss'); await W(150); break;
        case 'counter': floatAt(ev.id, '反', 'st'); await W(80); break;
        case 'steadyHold': floatAt(ev.id, '站穩了', 'st'); await W(100); break;
        case 'stunned': floatAt(ev.id, '暈', 'st'); bark(name(b, ev.id) + '暈著，沒有動。'); await W(260); break;
        case 'gone': {
          const el = unitEl(ev.id);
          const how = { dead: '倒了', sea: '落海', yield: '不打了', flee: '溜了', calm: '風停了' }[ev.how] || '';
          floatAt(ev.id, how, ev.how === 'yield' ? 'xin' : 'st');
          if (ev.how === 'sea') bark(name(b, ev.id) + '被推下海了。');
          if (ev.how === 'yield') bark(name(b, ev.id) + '把傢伙放下了。');
          if (el && !fast) await el.animate(ev.how === 'sea' ? [{ transform: 'none', opacity: 1 }, { transform: 'translate(30px,60px) rotate(20deg)', opacity: 0 }] : [{ opacity: 1 }, { opacity: 0.15 }], { duration: 420, fill: 'forwards' }).finished.catch(() => {});
          break;
        }
        case 'down': { floatAt(ev.id, '倒下', 'dmg'); const el = unitEl(ev.id); if (el) el.classList.add('down'); bark(name(b, ev.id) + '倒下了。'); UI.Snd.sfx('down'); await W(420); break; }
        case 'act': {
          const el = unitEl(ev.id);
          if (el) { el.classList.add('acting'); }
          bark((ev.say ? name(b, ev.id) + '：「' + ev.say + '」' : name(b, ev.id) + '：' + ev.label));
          await W(ev.say ? 520 : 320);
          if (el) el.classList.remove('acting');
          break;
        }
        case 'enemyTurn': bark('——他們動手了——'); await W(260); break;
        case 'turn': { const wt = UI.$('.wavetrack .w.now'); if (wt && b.waves) wt.textContent = ev.phase; const bt = UI.$('.b-title .bt-turn'); if (bt) bt.textContent = '第' + ev.n + '回合'; bark('第' + ev.n + '回合' + (ev.phase === '湧' ? '・浪來了' : '')); await W(160); break; }
        case 'crash': BU.crashFx(); bark(ev.reason === 'card' ? '老蔡把船頭迎向浪——' : '浪打上來了！'); await W(700); break;
        case 'summon': bark('又有人上來了。'); BU.render(UI.$('#app')); BU.logPos = b.log.length > BU.logPos ? BU.logPos : BU.logPos; await W(300); break;
        case 'taken': floatAt('hold', '被抓走一個', 'dmg'); bark('艙門破了，有人被拖走了！'); await W(400); break;
        case 'swept': bark('一個浪打上來，捲走了一個人！'); UI.Snd.sfx('water'); await W(500); break;
        case 'rescue': bark('阿水跳下水，把人撈回來了。'); await W(400); break;
        case 'labor': bark(ev.n >= 5 ? '' : '艙底傳來秀娘咬著布的聲音。'); { const xo = UI.$('[data-obj="xiu"] span[title="產程"]'); if (xo) xo.textContent = '●'.repeat(ev.n) + '○'.repeat(Math.max(0, 5 - ev.n)); } await W(200); break;
        case 'birth': bark('孩子生下來了。所有人都聽見那一聲哭。'); UI.Snd.motif(); await W(900); break;
        case 'tide': bark('潮又漲了。'); await W(260); break;
        case 'drown': bark(ev.name + '沒有站住。'); UI.Snd.sfx('water'); { const el = UI.$(`[data-bar="${ev.id}"]`); if (el && !fast) await el.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(16px)' }], { duration: 500, fill: 'forwards' }).finished.catch(() => {}); } await W(300); break;
        case 'rescueBar': bark('把' + ev.name + '背回來了。'); { const el = UI.$(`[data-bar="${ev.id}"]`); if (el) el.remove(); } await W(260); break;
        case 'msg': bark(ev.text); await W(450); break;
        case 'toss': bark('擲筊：' + ev.r + '筊' + (ev.r === '聖' ? '！' : ev.r === '笑' ? '。' : '……')); UI.Snd.sfx('toss'); await W(500); break;
        case 'tal': bark('阿祿師貼上一張' + ev.k + '符。'); await W(200); break;
        case 'talFire': floatAt('lu', ev.k + '符', 'st'); await W(160); break;
        case 'power': bark((DH.CARDS[ev.id] || {}).name + '：生效了。'); await W(200); break;
        case 'energy': { const en = UI.$('#energy'); if (en) en.firstChild.textContent = b.energy; break; }
        case 'item': bark((DH.ITEMS[ev.item] || {}).name + '——'); floatAt(ev.id, '撐住了', 'heal'); await W(600); break;
        case 'bribe': bark('塞了 ' + ev.n + ' 兩銀子過去。'); await W(300); break;
        case 'turnFight': bark('翻臉了！'); await W(400); break;
        case 'retarget': bark(name(b, ev.id) + '改打' + name(b, ev.to) + '。'); await W(200); break;
        case 'anchor': bark('拋錨：浪停一回合。'); await W(200); break;
        case 'phaseSet': bark('轉舵：下一回合是' + ev.p + '。'); await W(200); break;
        case 'helper': bark('阿水！'); await W(200); break;
        case 'broken': floatAt(ev.id, '破了', 'dmg'); bark(ev.id === 'ship' ? '船身破了！' : '艙門破了！'); await W(400); break;
        case 'critical': bark('秀娘流了很多血……'); await W(600); break;
        case 'bleed': floatAt(ev.id, '血-' + ev.n, 'dmg'); await W(140); break;
        case 'selfdmg': floatAt(ev.id, '-' + ev.n, 'dmg'); await W(120); break;
        case 'steal': floatAt(ev.id, '搶' + ev.n + '兩', 'st'); await W(150); break;
        case 'power': break;
        default: break;
      }
    }
  };
})();

  // ---------- 戰後 ----------

  // ---------- 夜 ----------

    cai: '老蔡在船尾，一手扶舵，一手拿菸斗。', lan: '伊蘭一個人坐在船頭，背靠著錨。', gou: '黑狗坐在纜繩堆上，有一下沒一下地削著什麼。',
    lu: '阿祿師躺在米袋上，摸著肚子，望著天。', xiu: '秀娘睡不著，艙底太熱了。', shui: '阿水在桅頂上晃著腳。', rest: '靠著船板，什麼也不想。',

        <h2 class="panel-title">${esc(head)}</h2>
        <p class="fin-line">第${DH.cn(r.telling)}遍。${e.type === 'death' ? '講到第' + DH.cn(r.act) + '段。' : ''}${DH.cn(total)}個偷渡的人，${alive === total && e.type !== 'death' ? '全都上了岸' : DH.cnq(alive) + '個' + (e.type === 'death' ? '還在船上' : '上了岸')}。</p>
        ${comps.length ? `<div class="fin-comps">${comps.map(([n, s]) => `<span><b>${esc(n)}</b>${esc(s)}</span>`).join('')}</div>` : ''}
        ${newClues.length ? `<div class="fin-clues"><h3>記憶簿多了</h3>${newClues.map((c) => `<p>${esc(c)}</p>`).join('')}</div>` : ''}
        ${trueNote ? `<p class="fin-note">${esc(trueNote)}</p>` : ''}
      </div>
      <div class="title-menu"><button class="btn primary" data-act="again">再講一遍</button><button class="btn" data-act="title">回到標題</button></div>
    </div>`;
    app.querySelector('[data-act="again"]').onclick = () => { UI.run = null; UI.Title.newTelling(); };
    app.querySelector('[data-act="title"]').onclick = () => { UI.run = null; UI.view = 'title'; UI.commit(); };
    UI.save();
  };
})();

/* 渡海 — 開機與畫面切換 */
(function () {
  const DH = globalThis.DH;
  const UI = DH.UI;

  UI.view = 'title';
  UI.render = function () {
    const app = document.getElementById('app');
    UI.untip();
    const r = UI.run;
    if (!r || UI.view === 'title') { UI.Title.render(app); return; }
    switch (r.screen) {
      case 'scene': return UI.Scene.render(app);
      case 'map': return UI.Map.render(app);
      case 'battle': return UI.Battle.render(app);
      case 'reward': return UI.Screens.reward(app);
      case 'night': return UI.Screens.night(app);
      case 'pick': return UI.Screens.pick(app);
      case 'shop': return UI.Screens.shop(app);
      case 'death': return UI.Screens.death(app);
      case 'fin': return UI.Screens.fin(app);
      default: UI.Title.render(app);
    }
  };
  UI.commit = function () { UI.save(); UI.render(); };

  function fixUids(run) {
    // 讀回存檔後，避免新產生的牌撞號
    let max = 0;
    const scan = (arr) => { for (const c of arr || []) { const m = /^c(\d+)_/.exec(c.uid || ''); if (m) max = Math.max(max, Number(m[1])); } };
    if (run) { scan(run.deck); if (run.battle) { scan(run.battle.draw); scan(run.battle.hand); scan(run.battle.disc); scan(run.battle.exh); } }
    DH.setUidBase(max + 1);
  }

  function adopt(pkg) {
    UI.meta = Object.assign(DH.Meta.fresh(), pkg.meta || {});
    UI.meta.settings = Object.assign({ sound: true, music: true, textSpeed: 1 }, UI.meta.settings || {});
    UI.run = pkg.run || null;
    if (UI.run && UI.run.ended && UI.run.screen === 'fin') UI.run = null;
    DH.META = UI.meta;
    fixUids(UI.run);
  }

  function start(hot) {
    UI.Sea.init();
    const local = UI.Store.loadLocal();
    if (hot && hot.meta) adopt(hot); else adopt(local);
    UI.view = 'title';
    UI.render();
    // 第一次碰到畫面時，打開聲音（一定要在手勢裡同步建立）
    const unlock = () => { UI.Snd.unlock(); };
    window.addEventListener('pointerdown', unlock, { capture: true });
    window.addEventListener('keydown', unlock, { capture: true });
    // 雲端存檔（有的話）
    UI.Store.initCloud().then((cloud) => {
      if (!cloud) return;
      if (cloud.meta && (cloud.t || 0) > (local.t || 0) && UI.view === 'title') { adopt(cloud); UI.render(); UI.toast('接上了你在別的裝置的進度。'); }
      else UI.Store.saveNow();
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) UI.Store.saveNow(); });
  }
  UI.start = start;
  start(null);
})();
