<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>渡海</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* 版面：夜海為底；紙做的牌、木刻的人像浮在海上。手機直式為主，寬螢幕置中放大。 */
:root {
  --night: #0b1424;
  --night-2: #13203a;
  --night-3: #1e2e4a;
  --sea: #2c4d73;
  --foam: #d6dfe7;
  --mist: #8e9bb0;
  --paper: #eadcbf;
  --paper-2: #d9c7a3;
  --paper-ink: #2a2016;
  --lantern: #e8a83e;
  --lantern-dim: #9c7230;
  --cinnabar: #c4462f;
  --jade: #62a07a;
  --ochre: #caa13c;
  --iron: #868a93;
  --indigo: #5a87ba;
  --warm: #2a140f;
  --warm-2: #3d1c14;
  --ok: #7fb58c;
  --bad: #e06a52;
  --f-display: "Cactus Classical Serif", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "STKaiti", "Noto Serif TC", serif;
  --card-w: clamp(78px, 21.5vw, 128px);
  --gutter: 16px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--foam);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
#sea { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
#app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 980px; margin: 0 auto; padding-inline: var(--gutter); box-sizing: border-box; }
.hide { display: none !important; }
:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }

/* ---------- 按鈕 ---------- */
.btn {
  appearance: none; border: 1px solid var(--lantern-dim); background: rgba(19, 32, 58, .82);
  color: var(--foam); padding: .55em 1.1em; border-radius: 3px; cursor: pointer;
  font-family: var(--f-body); font-size: 1rem; letter-spacing: .04em; min-height: 42px;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--lantern); background: rgba(40, 52, 80, .9); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--lantern); color: #23170a; border-color: var(--lantern); font-weight: 700; }
.btn.primary:hover { background: #f0b553; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--mist); }
.btn.ghost:hover { color: var(--foam); }
.btn.small { min-height: 34px; padding: .3em .8em; font-size: .9rem; }
.iconbtn { appearance: none; background: transparent; border: 0; color: var(--mist); width: 40px; height: 40px; display: inline-grid; place-items: center; cursor: pointer; border-radius: 3px; }
.iconbtn:hover { color: var(--foam); background: rgba(255, 255, 255, .05); }
.ic { width: 1.15em; height: 1.15em; display: inline-block; vertical-align: -0.18em; }

/* ---------- 標題畫面 ---------- */
.title-screen { align-items: center; justify-content: center; text-align: center; gap: 22px; padding-block: 24px; overflow-y: auto; }
.title-mark { display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 18px; justify-content: center; }
.vt { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.04; row-gap: var(--vgap, .1em); }
.vt i { font-style: normal; display: block; }
.vt .vp { height: .5em; }
.title-big {
  font-family: var(--f-display); font-size: clamp(76px, 18vw, 150px); font-weight: 400;
  line-height: 1; color: var(--paper); margin: 0; --vgap: .06em;
  text-shadow: 0 0 40px rgba(232, 168, 62, .25);
}
.title-sub { font-size: clamp(15px, 3.6vw, 19px); color: var(--mist); margin-top: 8px; --vgap: .22em; }
.title-seal { width: 46px; height: 46px; border: 2px solid var(--cinnabar); color: var(--cinnabar); display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; line-height: 1.05; margin-top: 12px; transform: rotate(-4deg); }
.title-menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
.title-note { color: var(--mist); font-size: .9rem; max-width: 30em; }
.title-foot { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.fin-card { width: min(34em, 100%); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 18px; background: rgba(9, 13, 24, .8); border: 1px solid rgba(232, 168, 62, .35); border-radius: 4px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
.fin-card .panel-title { margin: 0; }
.fin-line { margin: 0; color: #eadfc8; line-height: 1.7; }
.fin-comps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: .92rem; color: #c9d3de; }
.fin-comps span { white-space: nowrap; }
.fin-comps b { font-weight: 400; color: var(--paper); margin-right: .35em; }
.fin-clues { width: 100%; text-align: left; border-top: 1px solid rgba(232, 168, 62, .25); padding-top: 10px; }
.fin-clues h3 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 1rem; color: var(--lantern); letter-spacing: .1em; }
.fin-clues p { margin: 0 0 6px; color: #d8e0e8; font-size: .95rem; }
.fin-note { margin: 0; color: #f0c987; font-size: .95rem; }

/* ---------- 抬頭（地圖／夜／市） ---------- */
.hud { position: relative; z-index: 3; padding-top: env(safe-area-inset-top, 0px); background: linear-gradient(rgba(11, 20, 36, .96), rgba(11, 20, 36, .7)); border-bottom: 1px solid rgba(232, 168, 62, .18); }
.hud-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 8px; }
.hud-party { display: flex; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
.hud-p { display: flex; align-items: center; gap: 6px; min-width: 0; cursor: pointer; }
.hud-p .pt { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--lantern-dim); }
.hud-p .hpmini { font-size: .82rem; font-variant-numeric: tabular-nums; color: var(--foam); line-height: 1.1; }
.hud-p .hpmini small { display: block; color: var(--mist); font-size: .72rem; }
.hud-p.dead { opacity: .4; }
.hud-p.hurt .pt { border-color: var(--bad); }
.hud-res { display: flex; gap: 12px; align-items: center; font-variant-numeric: tabular-nums; font-size: .92rem; }
.res { display: inline-flex; align-items: center; gap: 4px; color: var(--foam); }
.res .ic { color: var(--lantern); }
.res.water .ic { color: #8ec5e8; }
.res.low { color: var(--bad); }
.hud-tools { display: flex; gap: 2px; }
.act-title { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; }
.act-title b { font-family: var(--f-display); font-size: 1.25rem; font-weight: 400; color: var(--paper); letter-spacing: .1em; }
.act-title span { color: var(--mist); font-size: .85rem; }

/* ---------- 海圖 ---------- */
.chart { flex: 1; overflow-y: auto; position: relative; padding-block: 18px 120px; }
.chart-inner { position: relative; margin: 0 auto; width: min(560px, 100%); }
.chart svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.chart-row { display: grid; grid-template-columns: repeat(3, 1fr); height: 92px; align-items: center; justify-items: center; position: relative; }
.node {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; position: relative;
  font-family: var(--f-display); font-size: 24px; color: var(--paper); background: var(--night-2);
  border: 1.5px solid var(--night-3); cursor: default; transition: transform .15s, box-shadow .2s;
}
.node.t-boss { width: 70px; height: 70px; font-size: 30px; border-color: var(--cinnabar); color: #f3c9b9; }
.node.t-elite { border-color: #a5523f; }
.node.t-night { color: #c7d6ff; }
.node.t-shop { color: var(--ochre); }
.node.t-fixed { border-style: double; border-width: 4px; }
.node.done { opacity: .45; }
.node.here { box-shadow: 0 0 0 3px var(--lantern); }
.node.open { cursor: pointer; border-color: var(--lantern); animation: beckon 2.2s ease-in-out infinite; }
.node.open:hover { transform: scale(1.08); }
.node .lbl { position: absolute; top: 100%; margin-top: 4px; font-family: var(--f-body); font-size: .74rem; color: var(--mist); white-space: nowrap; letter-spacing: .05em; }
.node.open .lbl { color: var(--lantern); }
@keyframes beckon { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 168, 62, .0); } 50% { box-shadow: 0 0 0 7px rgba(232, 168, 62, .18); } }
.chart-legend { color: var(--mist); font-size: .85rem; text-align: center; padding: 6px 0 14px; }

/* ---------- 劇情 ---------- */
.scene { justify-content: flex-end; }
.scene.frame-tone { --tone: var(--warm); }
.scene-stage { flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; pointer-events: none; }
.scene-portrait { width: clamp(110px, 30vw, 190px); aspect-ratio: 1; max-width: 100%; border: 3px solid var(--paper-2); box-shadow: 0 10px 40px rgba(0, 0, 0, .55); opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
.scene-portrait.on { opacity: 1; transform: none; }
.scene-portrait .pt { display: block; width: 100%; height: 100%; }
.textbox {
  position: relative; margin: 0 auto calc(10px + env(safe-area-inset-bottom, 0px)); width: min(760px, calc(100% - 2 * var(--gutter)));
  background: rgba(10, 16, 30, .9); border: 1px solid rgba(232, 168, 62, .28); border-radius: 4px;
  padding: 16px 18px 14px; box-sizing: border-box; min-height: 150px; cursor: pointer;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .35);
}
.frame-tone .textbox { background: rgba(42, 20, 15, .92); border-color: rgba(232, 168, 62, .45); }
.speaker { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 6px; font-family: var(--f-display); font-size: 1.05rem; letter-spacing: .12em; }
.speaker i { width: 9px; height: 9px; display: inline-block; transform: rotate(45deg); }
.line { font-size: clamp(16px, 4.3vw, 19px); line-height: 1.85; color: var(--foam); min-height: 3.4em; white-space: pre-wrap; text-wrap: pretty; }
.line.narr { color: #c9d3de; }
.frame-tone .line { color: #f0dfc4; }
.line.frame { font-style: normal; }
.cursor-next { position: absolute; right: 14px; bottom: 8px; color: var(--lantern); font-size: .8rem; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.choice { text-align: left; padding: .6em .9em; border: 1px solid rgba(232, 168, 62, .4); background: rgba(232, 168, 62, .07); border-radius: 3px; cursor: pointer; font-size: clamp(15px, 4vw, 17px); line-height: 1.55; color: var(--foam); }
.choice:hover { background: rgba(232, 168, 62, .16); border-color: var(--lantern); }
.choice[disabled] { opacity: .45; cursor: not-allowed; }
.choice small { display: block; color: var(--mist); font-size: .82em; }
.scene-tools { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: 10px; display: flex; gap: 4px; z-index: 4; }
.scene-log { position: absolute; inset: 0; background: rgba(8, 12, 22, .96); z-index: 6; overflow-y: auto; padding: 50px var(--gutter) 30px; }
.scene-log p { max-width: 40em; margin: 0 auto 12px; }

.letter {
  margin: 0 auto 12px; width: min(420px, calc(100% - 2 * var(--gutter))); background: var(--paper); color: var(--paper-ink);
  padding: 22px 24px; font-family: var(--f-body); font-size: 17px; line-height: 2; white-space: pre-wrap;
  box-shadow: 0 16px 50px rgba(0, 0, 0, .6); transform: rotate(-1.2deg); border: 1px solid #b9a581; box-sizing: border-box;
}
.tablet { margin: 0 auto 14px; width: 120px; height: 300px; max-width: 100%; background: linear-gradient(#6b4a2c, #4a321d); border-radius: 50px 50px 6px 6px; display: grid; place-items: center; box-shadow: 0 16px 50px rgba(0, 0, 0, .6); border: 3px solid #2e1e10; }
.tablet .vt { font-family: var(--f-display); font-size: 36px; color: #f5e6c8; --vgap: .22em; animation: inkin 2.4s ease both; }
.titlecard { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; background: rgba(5, 8, 14, .92); }
.titlecard > div { font-family: var(--f-display); font-size: clamp(64px, 16vw, 120px); color: var(--paper); animation: inkin 2.4s ease forwards; }
.titlecard .vt { --vgap: .3em; }
@keyframes inkin { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: blur(0); } }
.epilogue { max-height: 46vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.epi { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start; }
.epi .pt { width: 42px; height: 42px; border-radius: 50%; }
.epi p { margin: 0; font-size: 15px; line-height: 1.75; color: #d8e0e8; min-width: 0; }
.credits { max-height: 52vh; overflow: hidden; position: relative; text-align: center; }
.credits-roll { animation: roll 38s linear forwards; }
.credits-roll p { margin: 0 0 10px; color: #f0dfc4; }
.credits-roll .names { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 1.1em; }
.credits-roll .names span { white-space: nowrap; }
.credits-roll .h { font-family: var(--f-display); font-size: 1.3rem; margin-top: 24px; color: var(--lantern); letter-spacing: .2em; }
@keyframes roll { from { transform: translateY(34vh); } to { transform: translateY(-100%); } }

/* ---------- 牌 ---------- */
.card {
  position: relative; width: var(--card-w); aspect-ratio: 5 / 7; flex: none; box-sizing: border-box;
  background: var(--paper); color: var(--paper-ink); border-radius: 4px; border: 1px solid #b9a581;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45); padding: 6px 6px 6px 9px; display: flex; flex-direction: column; overflow: hidden;
  cursor: pointer; user-select: none; transition: transform .16s ease, box-shadow .16s ease, opacity .2s;
  background-image: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .35), transparent 60%), linear-gradient(rgba(0, 0, 0, .0), rgba(120, 90, 40, .08));
}
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--oc, var(--iron)); }
.card .c-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.card .cost {
  width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--cinnabar); color: #fff6e6; font-family: var(--f-display); font-size: calc(var(--card-w) * .12);
}
.card .cost.free { background: #5c7a5c; }
.card .ctype { font-size: calc(var(--card-w) * .095); color: #7a6648; letter-spacing: .1em; }
.card .cname { font-family: var(--f-display); font-size: calc(var(--card-w) * .145); line-height: 1.2; margin: 3px 0 2px; letter-spacing: .04em; color: #1e160e; text-wrap: balance; }
.card .cname.up { color: #8a2f1f; }
.card .ctext { font-size: calc(var(--card-w) * .098); line-height: 1.38; color: #3a2c1e; flex: 1; overflow: hidden; }
.card .ctext b { color: #8a2f1f; font-weight: 700; }
.card .cowner { position: absolute; right: 5px; bottom: 4px; width: 1.55em; height: 1.55em; border: 1.5px solid var(--oc, #7a6648); color: var(--oc, #7a6648); font-family: var(--f-display); font-size: calc(var(--card-w) * .1); display: grid; place-items: center; transform: rotate(-6deg); opacity: .85; }
.card.t-curse { background: #b8ad98; }
.card.t-curse .cname { color: #3a2020; }
.card.t-cargo { background: #e4d3a8; }
.card.t-relic { background: #e8d9b2; box-shadow: 0 0 0 2px var(--lantern), 0 6px 18px rgba(0, 0, 0, .45); }
.card.t-pow .cname::after { content: '　式'; font-size: .62em; color: #7a6648; }
.card.cannot { opacity: .55; filter: saturate(.6); }
.card.sel { transform: translateY(-22px) scale(1.06); box-shadow: 0 0 0 2px var(--lantern), 0 16px 34px rgba(0, 0, 0, .6); z-index: 5; }
.card.flying { pointer-events: none; }
.card .tag { position: absolute; left: 8px; bottom: 4px; font-size: calc(var(--card-w) * .085); color: #8a2f1f; letter-spacing: .05em; }
.card.big { --card-w: min(220px, 56vw); cursor: default; }
.card.big .ctext { font-size: calc(var(--card-w) * .085); }

/* ---------- 戰鬥 ---------- */
.battle { padding-top: env(safe-area-inset-top, 0px); }
.b-top { display: flex; align-items: center; gap: 10px; padding-block: 6px; }
.wavetrack { display: flex; align-items: center; gap: 4px; }
.wavetrack .w { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--night-3); font-family: var(--f-display); font-size: 17px; color: var(--mist); background: rgba(19, 32, 58, .7); }
.wavetrack .w.now { border-color: var(--lantern); color: var(--paper); background: rgba(232, 168, 62, .14); width: 40px; height: 40px; font-size: 20px; }
.wavetrack .w.p-湧 { color: #9fd0ff; }
.wavetrack .w.now.p-湧 { border-color: #9fd0ff; color: #e3f2ff; background: rgba(120, 180, 240, .18); }
.wavetrack .w.p-陸 { color: #b8a27c; }
.wavelabel { font-size: .8rem; color: var(--mist); line-height: 1.2; display: flex; flex-direction: column; gap: 2px; }
.wavelabel b { font-weight: 400; color: #9fd0ff; white-space: nowrap; }
.b-title { flex: 1; text-align: right; color: var(--mist); text-shadow: 0 1px 2px rgba(0, 0, 0, .8); font-size: .85rem; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.b-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-title .bt-turn { font-size: .78rem; opacity: .8; }
.b-field { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; gap: 4px; }
.b-row { display: flex; justify-content: center; align-items: flex-end; gap: clamp(6px, 3vw, 26px); flex-wrap: nowrap; }
.unit { position: relative; display: flex; flex-direction: column; align-items: center; width: clamp(76px, 22vw, 124px); transition: opacity .4s, transform .3s; }
.unit .pwrap { position: relative; width: clamp(54px, 15vw, 88px); aspect-ratio: 1; }
.unit .pt { width: 100%; height: 100%; display: block; border: 2px solid #5a4a36; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
.unit.ally .pt { border-radius: 50%; }
.unit .uname { font-size: .82rem; color: var(--paper); text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 0 8px rgba(0, 0, 0, .6); margin-top: 3px; white-space: nowrap; letter-spacing: .04em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.bar { position: relative; width: 100%; height: 12px; background: #1b1416; border: 1px solid #000; border-radius: 2px; margin-top: 3px; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#d65b43, #9e3424); transition: width .35s ease; }
.bar.xin > i { background: linear-gradient(#b5a0e0, #7a65b0); }
.bar.ship > i { background: linear-gradient(#9b7a4f, #6b5032); }
.bar.storm > i { background: linear-gradient(#8fb6d9, #4f7aa5); }
.bar > span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 12px; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 1px #000; }
.blkbadge { position: absolute; left: -6px; bottom: -4px; min-width: 26px; height: 26px; padding: 0 3px; box-sizing: border-box; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; background: #5f8fbf; color: #fff; font-size: .8rem; font-weight: 700; display: grid; place-items: center; border: 1.5px solid #cfe2f5; font-variant-numeric: tabular-nums; }
.sts { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: 3px; min-height: 18px; }
.st { font-size: 11px; line-height: 16px; padding: 0 4px; border-radius: 2px; background: #2a3550; color: var(--foam); cursor: help; white-space: nowrap; }
.st.sea { background: rgba(10, 16, 30, .65); border: 1px solid #2f4f6f; color: #8fb0cf; }

<script>
/* ==== src/core/base.js ==== */
/* 渡海 — 基礎：命名空間、亂數、工具 */
(function () {
  const DH = (globalThis.DH = globalThis.DH || {});

  // ---- 可存檔的種子亂數（mulberry32）----
  const R = {
    make(seed) { return { s: (seed >>> 0) || 7 }; },
    next(r) {
      let t = (r.s = (r.s + 0x6d2b79f5) >>> 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    int(r, n) { return Math.floor(R.next(r) * n); },
    pick(r, arr) { return arr.length ? arr[R.int(r, arr.length)] : undefined; },
    chance(r, p) { return R.next(r) < p; },
    shuffle(r, arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = R.int(r, i + 1);
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    },
    weighted(r, pairs) { // [[item, w], ...]
      let tot = 0; for (const p of pairs) tot += p[1];
      let x = R.next(r) * tot;
      for (const p of pairs) { x -= p[1]; if (x < 0) return p[0]; }
      return pairs[pairs.length - 1][0];
    },
  };
  DH.R = R;

  DH.clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
  DH.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  DH.sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
  // 中文數字：cn 用在序數與十位（第二遍、二十個），cnq 用在單獨的數量（兩個、兩遍）
  DH.cn = (n) => {
    n = Math.floor(n);
    const d = '零一二三四五六七八九';
    if (n < 0) return '負' + DH.cn(-n);
    if (n < 10) return d[n];
    if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
    if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
    if (n < 1000) { const h = Math.floor(n / 100), rest = n % 100; return d[h] + '百' + (rest === 0 ? '' : rest < 10 ? '零' + d[rest] : (rest < 20 ? '一' : '') + DH.cn(rest)); }
    return String(n);
  };
  DH.cnq = (n) => (Math.floor(n) === 2 ? '兩' : DH.cn(n));

  // 浪相
  DH.PHASES = ['平', '起', '湧'];
  DH.OWNERS = {
    wei: { name: '魏子葳', short: '葳', color: '#c8553d' },
    cai: { name: '老蔡', short: '蔡', color: '#3d6b8c' },
    lan: { name: '伊蘭', short: '蘭', color: '#5a8a4f' },
    gou: { name: '黑狗', short: '狗', color: '#4a4a4a' },
    lu:  { name: '阿祿師', short: '祿', color: '#b8862f' },
    none:{ name: '無主', short: '　', color: '#8a7a68' },
  };
  DH.COMP_IDS = ['cai', 'lan', 'gou', 'lu'];
})();

/* ==== src/core/battle.js ==== */
/* 渡海 — 牌戰引擎（純邏輯，可在瀏覽器與 Node 執行） */
(function () {
  const DH = globalThis.DH;
  const R = DH.R;

  const ST_NAMES = {
    blk: '擋', steady: '穩', off: '失衡', weak: '弱', bleed: '血', str: '勁', counter: '反',
    stun: '暈', mark: '標', dodge: '閃', sick: '病',
  };
  DH.ST_NAMES = ST_NAMES;

  let UID = 1;
  DH.newUid = () => 'c' + (UID++) + '_' + Math.floor(Math.random() * 1e6).toString(36);
  DH.setUidBase = (n) => { UID = Math.max(UID, n); };

  // ---------- 小工具 ----------
  const phaseName = (b) => (b.waves ? DH.PHASES[b.phase] : '陸');
  const persons = (b) => b.allies.filter((a) => a.kind === 'person' && !a.down);
  const allyById = (b, id) => b.allies.find((a) => a.id === id);
  const enemyById = (b, id) => b.enemies.find((e) => e.id === id);
  const liveEnemies = (b) => b.enemies.filter((e) => !e.gone);
  const ent = (b, id) => allyById(b, id) || enemyById(b, id);
  const log = (b, ev) => { b.log.push(ev); };

  function st(o, k) { return (o.st && o.st[k]) || 0; }
  function addSt(b, o, k, n) {
    if (!o || !n) return;
    if (o.noStatus) return;
    if (k === 'weak' && o.immWeak && n > 0) return;
    o.st[k] = (o.st[k] || 0) + n;
    if (k === 'steady') o.st[k] = Math.min(o.st[k], 2);
    if (o.st[k] <= 0) delete o.st[k];
    log(b, { t: 'st', id: o.id, k, n, after: o.st[k] || 0 });
  }

  // ---------- 目標選擇（敵人意圖） ----------
  function pickAlly(b, rule) {
    const ps = persons(b);
    if (!ps.length) return null;
    const wei = ps.find((p) => p.id === 'wei');
    if (rule === 'wei') return wei || ps[0];
    if (rule === 'low') return ps.slice().sort((a, b2) => a.hp - b2.hp || (a.id === 'wei' ? 1 : -1))[0];
    if (rule === 'high') return ps.slice().sort((a, b2) => b2.hp - a.hp)[0];
    if (rule === 'comp') {
      const cs = ps.filter((p) => p.id !== 'wei');
      return cs.length ? R.pick(b.rng, cs) : wei;
    }
    if (rule === 'frail') return ps.slice().sort((a, b2) => a.maxHp - b2.maxHp)[0];
    if (rule === 'hold') return allyById(b, 'hold') || R.pick(b.rng, ps);
    if (rule === 'ship') return allyById(b, 'ship') || R.pick(b.rng, ps);
    if (rule === 'xiu') return allyById(b, 'xiu') || R.pick(b.rng, ps);
    if (rule === 'mind') return allyById(b, 'mind');
    return R.pick(b.rng, ps); // 'rand'
  }

  // ---------- 傷害計算 ----------
  function atkValue(b, src, tgt, base, o) {
    o = o || {};
    let d = base;
    if (src) d += st(src, 'str');
    if (o.ranged && b.waves && phaseName(b) === '起') d += 3;
    if (o.ranged && src && src.alwaysRise && !(b.waves && phaseName(b) === '起')) d += 3;
    if (o.flat) d += o.flat;
    if (src && st(src, 'weak') > 0 && !o.noWeak) d *= 0.75;
    if (tgt && st(tgt, 'off') > 0) d *= 1.5;
    if (src && src.side === 'enemy' && b.diffMul) d *= b.diffMul.dmg;
    return Math.max(0, Math.floor(d));
  }
  function persuadeValue(b, src, tgt, base, fromAtk) {
    let d = base;
    if (fromAtk && src) d += st(src, 'str');
    if (src && st(src, 'weak') > 0) d *= 0.75;
    if (tgt && st(tgt, 'off') > 0) d *= 1.5;
    if (tgt && tgt.xinMul) d *= tgt.xinMul;
    return Math.max(0, Math.floor(d));
  }
  DH.atkValue = atkValue;
  DH.persuadeValue = persuadeValue;

  // 對單一目標造成傷害（已計算好的數值）
  function dealDamage(b, tgt, dmg, src, o) {
    o = o || {};
    if (!tgt || tgt.gone || tgt.down) return 0;
    if (tgt.side === 'ally' && st(tgt, 'dodge') > 0 && !o.unavoidable) {
      addSt(b, tgt, 'dodge', -1);
      log(b, { t: 'miss', id: tgt.id });
      return 0;
    }
    let blocked = 0;
    if (!o.pierce) { blocked = Math.min(tgt.blk, dmg); tgt.blk -= blocked; }
    const rest = dmg - blocked;
    if (rest > 0) loseHp(b, tgt, rest, src);
    log(b, { t: 'dmg', id: tgt.id, n: dmg, blk: blocked, hp: rest, src: src ? src.id : null, after: tgt.hp, blkAfter: tgt.blk });
    // 反
    if (src && !o.noCounter && tgt.side === 'ally' && st(tgt, 'counter') > 0 && src.side === 'enemy' && !src.gone) {
      const c = st(tgt, 'counter');
      log(b, { t: 'counter', id: tgt.id, to: src.id, n: c });
      dealDamage(b, src, c, tgt, { noCounter: true });
    }
    return rest;
  }

  function loseHp(b, o, n, src) {
    if (n <= 0 || o.gone || o.down) return;
    o.hp -= n;
    if (o.noDie && o.hp < 1) o.hp = 1;
    if (o.side === 'ally' && o.kind === 'person') {
      b.stats.hpLost[o.id] = (b.stats.hpLost[o.id] || 0) + n;
      runHook(b, 'loseHp', o, n);
    }
    if (o.hp <= 0) {
      o.hp = 0;
      if (o.side === 'enemy') enemyGone(b, o, o.storm ? 'calm' : 'dead', src);
      else allyDown(b, o);
    }
  }

  function healAlly(b, o, n) {
    if (!o || o.down || n <= 0) return 0;
    const before = o.hp;
    o.hp = Math.min(o.maxHp, o.hp + n);
    const got = o.hp - before;
    if (got > 0) log(b, { t: 'heal', id: o.id, n: got, after: o.hp });
    return got;
  }

  function allyDown(b, a) {
    if (a.kind === 'person') {
      // 護身符：魏子葳第一次倒下改為 1 體力
      if (a.id === 'wei' && b.items.includes('amulet') && !b.flags.amuletUsed) {
        b.flags.amuletUsed = true; a.hp = 1;
        log(b, { t: 'item', item: 'amulet', id: a.id });
        return;
      }
      if (a.id !== 'wei' && b.items.includes('mazugold') && !b.flags.mazuUsed) {
        b.flags.mazuUsed = true; a.hp = 1;
        log(b, { t: 'item', item: 'mazugold', id: a.id });
        return;
      }
      a.down = true; a.blk = 0; a.st = {};
      log(b, { t: 'down', id: a.id });
      // 他的牌從此場戰鬥中消失
      for (const pile of ['hand', 'draw', 'disc']) {
        const keep = [];
        for (const c of b[pile]) {
          const def = DH.CARDS[c.id];
          if (def && def.owner === a.id) b.exh.push(c); else keep.push(c);
        }
        b[pile] = keep;
      }
      b.stats.downed.push(a.id);
      if (a.id === 'wei') { b.result = 'lose'; log(b, { t: 'end', r: 'lose' }); }
    } else if (a.kind === 'hold') {
      a.broken = true; a.hp = 0;
      log(b, { t: 'broken', id: a.id });
    } else if (a.kind === 'ship') {
      a.hp = 0; a.broken = true; log(b, { t: 'broken', id: a.id });
    } else if (a.kind === 'xiu') {
      a.hp = 0; a.critical = true; b.flags.xiuCritical = true;
      log(b, { t: 'critical', id: a.id });
    } else if (a.kind === 'mind') {
      a.hp = 0; b.result = 'fail'; log(b, { t: 'end', r: 'fail' });
    }
  }

  function enemyGone(b, e, how, src) {
    if (e.gone) return;
    if (how === 'dead' && e.onDeath) { /* 預留 */ }
    e.gone = how; e.intent = null; e.blk = 0;
    if (how === 'dead') b.stats.killed.push(e.def);
    if (how === 'yield') b.stats.yielded.push(e.def);
    if (how === 'sea') b.stats.overboard.push(e.def);
    if (how === 'flee') b.stats.fled.push(e.def);
    log(b, { t: 'gone', id: e.id, how });
    const def = DH.ENEMIES[e.def];
    if (def && def.onGone) def.onGone(b, e, how, api0(b));
    runHook(b, 'enemyGone', e, how);
    // 談判：主事的人鬆口了，旁邊的人也就不再壓
    if (b.mode === 'talk' && e.main && how === 'yield') {
      for (const o of liveEnemies(b)) enemyGone(b, o, 'yield', src);
    }
    // 群龍無首
    if (e.leader && how !== 'flee') {
      const rest = liveEnemies(b).filter((o) => o.xinMax);
      for (const o of rest) persuadeRaw(b, o, Math.ceil(o.xinMax * 0.5), null, true);
      if (rest.length) log(b, { t: 'msg', text: '群龍無首，其餘的人心生退意。' });
    }
    checkEnd(b);
  }

  function persuadeRaw(b, tgt, n, src, silent) {
    if (!tgt || tgt.gone || !tgt.xinMax) return 0;
    const d = Math.min(tgt.xin, n);
    tgt.xin -= d;
    if (!silent) log(b, { t: 'xin', id: tgt.id, n: d, after: tgt.xin });
    if (tgt.xin <= 0) enemyGone(b, tgt, 'yield', src);
    return d;
  }

  // ---------- 鉤子：式（power）與物品 ----------
  function runHook(b, hook, ...args) {
    if (b._inHook > 6) return;
    b._inHook = (b._inHook || 0) + 1;
    try {
      for (const p of b.powers.slice()) {
        const def = DH.CARDS[p.id];
        const owner = allyById(b, p.owner);
        if (!def || !def.hooks || !def.hooks[hook]) continue;
        if (owner && owner.down) continue;
        def.hooks[hook](api0(b, { owner, up: p.up, power: p }), ...args);
      }
      for (const it of b.items) {
        const def = DH.ITEMS[it];
        if (def && def.hooks && def.hooks[hook]) def.hooks[hook](api0(b, {}), ...args);
      }
    } finally { b._inHook--; }
  }

  // ---------- 浪 ----------
  function crash(b, reason) {
    log(b, { t: 'crash', reason: reason || 'wave' });
    for (const o of [...persons(b), ...liveEnemies(b)]) {
      if (o.sea || o.permSteady) continue;
      if (st(o, 'steady') > 0) { addSt(b, o, 'steady', -1); log(b, { t: 'steadyHold', id: o.id }); continue; }
      if (!st(o, 'off')) addSt(b, o, 'off', 1);
    }
    runHook(b, 'crash');
  }

  function upcomingPhases(b, n) {
    if (!b.waves) return Array(n).fill('陸');
    const out = [];
    let ph = b.phase, anchor = b.anchor, force = b.forceNext;
    for (let i = 0; i < n; i++) {
      out.push(DH.PHASES[ph]);
      if (anchor) { anchor = false; }
      else if (force != null) { ph = force; force = null; }
      else ph = nextPhaseIdx(b, ph);
    }
    return out;
  }
  function nextPhaseIdx(b, ph) {
    if (b.mode === 'storm') return ph === 1 ? 2 : 1;
    return (ph + 1) % 3;
  }
  DH.upcomingPhases = upcomingPhases;

  // ---------- 潮（沙汕） ----------
  function rescueOne(b, pid) {
    if (!b.bar || !b.bar.length) { log(b, { t: 'msg', text: '沙汕上已經沒有人了。' }); return null; }
    let i = pid ? b.bar.findIndex((p) => p.id === pid) : -1;
    if (i < 0) i = 0;
    const p = b.bar.splice(i, 1)[0];
    b.boat.push(p);
    b.stats.barRescued = (b.stats.barRescued || 0) + 1;
    log(b, { t: 'rescueBar', id: p.id, name: p.name });
    return p;
  }

  // ---------- API 給卡牌效果使用 ----------
  function api0(b, ctx) {
    ctx = ctx || {};
    const A = {
      b, ctx,
      phase: () => phaseName(b),
      mode: b.mode,
      owner: ctx.owner,
      persons: () => persons(b), enemies: () => liveEnemies(b),
      ally: (id) => allyById(b, id),
      attack(tgt, base, o) {
        o = o || {};
        const src = o.src || ctx.owner;
        if (!tgt || tgt.gone) return 0;
        let flat = o.flat || 0;
        if (src && src.id === 'wei' && b.hand.some((x) => x.id === 'xinshi')) flat -= 2;
        if (b.mode === 'talk') { return A.persuade(tgt, Math.max(0, base + flat), { fromAtk: true, src }); }
        if (tgt.storm && src && src.id === 'cai') base = Math.floor(base * 1.5);
        const d = atkValue(b, src, tgt, base, { ranged: o.ranged, flat });
        b.stats.dmgDealt += d;
        const dealt = dealDamage(b, tgt, d, src, o);
        if (o.onHit && !tgt.gone) o.onHit(tgt, dealt);
        return dealt;
      },
      attackAll(base, o) {
        let tot = 0;
        for (const e of liveEnemies(b)) tot += A.attack(e, base, o);
        return tot;
      },
      persuade(tgt, base, o) {
        if (!tgt || tgt.gone) return 0;
        if (!tgt.xinMax) { log(b, { t: 'msg', text: tgt.name + '聽不進去。', id: tgt.id }); return 0; }
        const src = (o && o.src !== undefined) ? o.src : ctx.owner;
        const d = persuadeValue(b, src, tgt, base, !!(o && o.fromAtk));
        b.stats.xinDealt += d;
        return persuadeRaw(b, tgt, d, src);
      },
      block(tgt, n) {
        if (!tgt) return;
        if (b.mode === 'talk') { if (ctx.mindBlk) return; ctx.mindBlk = true; tgt = allyById(b, 'mind'); }
        if (!tgt || tgt.down) return;
        if (tgt.kind === 'hold' && tgt.broken) return;
        let v = n;
        if (b.mode !== 'talk' && b.items.includes('rope') && tgt.kind === 'person') v += 0;
        tgt.blk += v;
        log(b, { t: 'blk', id: tgt.id, n: v, after: tgt.blk });
      },
      heal(tgt, n) {
        if (b.mode === 'talk') { if (ctx.mindHeal) return 0; ctx.mindHeal = true; tgt = allyById(b, 'mind'); }
        if (b.items.includes('deerbag') && ctx.def && ctx.def.herb) n += 2;
        return healAlly(b, tgt, n);
      },
      st(tgt, k, n) {
        if (!tgt) return 0;
        if (n === undefined) return st(tgt, k);
        if (tgt.noStatus) return 0;
        if (b.mode === 'talk' && tgt.side === 'ally' && k !== 'str') return 0;
        if (b.mode === 'talk' && k === 'bleed') return 0;
        addSt(b, tgt, k, n);
        return st(tgt, k);
      },
      tempStr(a, n) {
        if (!a || a.down) return;
        addSt(b, a, 'str', n);
        (b.flags.tmpStr = b.flags.tmpStr || []).push({ id: a.id, n });
      },
      delayHeal(a, n) { if (a) (b.flags.dheal = b.flags.dheal || []).push({ id: a.id, n }); },
      fireAllTalismans(times) { for (let i = 0; i < times; i++) for (const t of b.tal) fireTalisman(b, t); },
      stormHit(s, n) {
        if (!s || s.gone) return;
        s.hp = Math.max(0, s.hp - n);
        log(b, { t: 'storm', id: s.id, n, after: s.hp });
        if (s.hp <= 0) enemyGone(b, s, 'calm');
        checkEnd(b);
      },
      rescueOne(pid) { return rescueOne(b, pid); },
      cleanse(tgt, keys) {
        if (!tgt || !tgt.st) return;
        for (const k of keys || ['weak', 'off', 'bleed', 'stun']) if (tgt.st[k]) { delete tgt.st[k]; log(b, { t: 'cleanse', id: tgt.id, k }); }
      },
      draw(n) { drawCards(b, n); },
      energy(n) { b.energy += n; log(b, { t: 'energy', n }); },
      push(tgt, thr) {
        if (!tgt || tgt.gone || tgt.side !== 'enemy') return false;
        if (b.mode === 'talk') return false;
        thr += b.items.includes('hook') ? 4 : 0;
        if (st(tgt, 'off') > 0 && !tgt.pushImmune && tgt.hp <= thr) {
          enemyGone(b, tgt, 'sea', ctx.owner);
          return true;
        }
        return false;
      },
      selfDmg(a, n) { if (a && !a.down) { log(b, { t: 'selfdmg', id: a.id, n }); loseHp(b, a, n, null); } },
      talisman(kind, up) { addTalisman(b, kind, up); },
      toss() { return toss(b); },
      setNext(name) { b.forceNext = DH.PHASES.indexOf(name); log(b, { t: 'phaseSet', p: name }); },
      anchor() { b.anchor = true; log(b, { t: 'anchor' }); },
      crashNow() { crash(b, 'card'); },
      addToHand(id, up) {
        const c = { uid: DH.newUid(), id, up: up ? 1 : 0, tmp: true };
        if (b.hand.length < 10) b.hand.push(c); else b.disc.push(c);
        log(b, { t: 'gen', id });
      },
      taunt(by, enemyIds) {
        b.taunt = b.taunt || {};
        if (!enemyIds) b.taunt.all = by;
        else for (const id of enemyIds) b.taunt[id] = by;
        log(b, { t: 'taunt', by });
      },
      lowestAlly() { return persons(b).slice().sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]; },
      lowestEnemy() { return liveEnemies(b).slice().sort((a, c) => a.hp - c.hp)[0]; },
      intentDmg(e) { return intentAttackTotal(b, e); },
      phaseNext() { return upcomingPhases(b, 2)[1]; },
      msg(text) { log(b, { t: 'msg', text }); },
      rng: () => R.next(b.rng),
    };
    return A;
  }
  DH.battleApi = api0;

  // ---------- 符 ----------
  const TAL_MAX = 3;
  function addTalisman(b, kind, up) {
    if (b.tal.length >= TAL_MAX) b.tal.shift();
    b.tal.push({ k: kind, left: up ? 4 : 3, up: up ? 1 : 0 });
    log(b, { t: 'tal', k: kind });
    runHook(b, 'talisman', kind);
  }
  function fireTalisman(b, t) {
    const lu = allyById(b, 'lu');
    const A = api0(b, { owner: lu });
    const bonus = t.up ? 2 : 0;
    if (t.k === '鎮') {
      const a = A.lowestAlly(); if (a) A.block(a, 5 + bonus);
    } else if (t.k === '煞') {
      const e = A.lowestEnemy();
      if (e) {
        if (b.mode === 'talk') A.persuade(e, 5 + bonus, { src: null });
        else { const d = atkValue(b, null, e, 5 + bonus, {}) * (e.ghost ? 2 : 1); dealDamage(b, e, d, null, {}); }
      }
    } else if (t.k === '淨') {
      const a = persons(b).find((p) => st(p, 'weak') || st(p, 'bleed') || st(p, 'stun')) || A.lowestAlly();
      if (a) { A.cleanse(a, ['weak', 'bleed', 'stun']); A.heal(a, 2 + bonus); }
    }
    log(b, { t: 'talFire', k: t.k });
  }

  // ---------- 擲筊 ----------
  function toss(b) {
    let x = R.next(b.rng);
    let res = x < 0.5 ? '聖' : x < 0.75 ? '笑' : '陰';
    if (res === '陰' && b.flags.faith) res = '笑';
    log(b, { t: 'toss', r: res });
    return res;
  }

  // ---------- 抽牌 ----------
  function drawCards(b, n) {
    for (let i = 0; i < n; i++) {
      if (b.hand.length >= 10) break;
      if (!b.draw.length) {
        if (!b.disc.length) break;
        b.draw = R.shuffle(b.rng, b.disc); b.disc = [];
        log(b, { t: 'reshuffle' });
      }
      const c = b.draw.pop();
      b.hand.push(c);
      log(b, { t: 'draw', uid: c.uid });
      const def = DH.CARDS[c.id];
      if (def && def.onDraw) def.onDraw(api0(b, { card: c }), c);
    }
  }

  // ---------- 意圖 ----------
  function intentAttackTotal(b, e) {
    if (!e || !e.intent) return 0;
    let tot = 0;
    for (const a of e.intent.acts) {
      if (a.k === 'atk' || a.k === 'atkAll') {
        const tgt = a.tgt ? ent(b, a.tgt) : null;
        tot += atkValue(b, e, tgt, a.v, { ranged: a.ranged }) * (a.hits || 1);
      }
    }
    return tot;
  }

  function chooseIntents(b) {
    for (const e of liveEnemies(b)) {
      const def = DH.ENEMIES[e.def];
      const raw = def.ai(e, b, api0(b, {}));
      e.intent = resolveIntent(b, e, raw);
      e.mem.turns = (e.mem.turns || 0) + 1;
    }
    log(b, { t: 'intents' });
  }
  function resolveIntent(b, e, raw) {
    const it = { label: raw.label || '', acts: [], icon: raw.icon || 'atk', say: raw.say || null };
    for (const a of raw.acts) {
      const x = Object.assign({}, a);
      if (x.k === 'atk' || x.k === 'weakT' || x.k === 'offT' || x.k === 'grab' || x.k === 'pressure' || x.k === 'bleedT' || x.k === 'stunT') {
        const t = pickAlly(b, x.rule || 'rand');
        x.tgt = t ? t.id : null;
      }
      it.acts.push(x);
    }
    return it;
  }
  DH.intentAttackTotal = intentAttackTotal;

  function execIntent(b, e) {
    const it = e.intent;
    if (!it) return;
    log(b, { t: 'act', id: e.id, label: it.label, say: it.say });
    const A = api0(b, { owner: e });
    for (const a of it.acts) {
      if (e.gone || b.result) break;
      switch (a.k) {
        case 'atk': {
          for (let h = 0; h < (a.hits || 1); h++) {
            let tgt = retarget(b, e, a.tgt);
            if (!tgt) break;
            const d = atkValue(b, e, tgt, a.v, { ranged: a.ranged });
            const dealt = dealDamage(b, tgt, d, e, {});
            if (a.bleed && dealt > 0 && !tgt.down) addSt(b, tgt, 'bleed', a.bleed);
            if (a.weak && !tgt.down) addSt(b, tgt, 'weak', a.weak);
            if (b.result || e.gone) break;
          }
          break;
        }
        case 'atkAll': {
          for (let h = 0; h < (a.hits || 1); h++) {
            for (const tgt of persons(b)) {
              const d = atkValue(b, e, tgt, a.v, { ranged: a.ranged });
              dealDamage(b, tgt, d, e, {});
              if (b.result || e.gone) break;
            }
            if (a.ship) { const s = allyById(b, 'ship'); if (s && !s.broken) dealDamage(b, s, atkValue(b, e, null, a.ship, {}), e, {}); }
            if (a.hold) { const s = allyById(b, 'hold'); if (s && !s.broken) dealDamage(b, s, atkValue(b, e, null, a.hold, {}), e, {}); }
          }
          if (a.weak) for (const p of persons(b)) addSt(b, p, 'weak', a.weak);
          break;
        }
        case 'grab': { // 鉤人／擄人：先打艙門，門破了就抓人
          const hold = allyById(b, 'hold');
          if (hold && !hold.broken) {
            dealDamage(b, hold, atkValue(b, e, null, a.v, {}), e, {});
          } else if (hold && hold.broken) {
            if (hold.people > 0) { hold.people--; b.stats.taken++; log(b, { t: 'taken', id: e.id }); }
          }
          break;
        }
        case 'ship': { const s = allyById(b, 'ship'); if (s) { if (!s.broken) { const d = atkValue(b, e, s, a.v, {}); dealDamage(b, s, d, e, {}); } if (s.broken && a.sweep) sweepPerson(b); } break; }
        case 'sweep': {
          const s = allyById(b, 'ship');
          if (!s || s.blk < a.v) {
            if (s) { const used = Math.min(s.blk, a.v); s.blk -= used; }
            sweepPerson(b);
          } else { s.blk -= a.v; log(b, { t: 'msg', text: '纜繩撐住了，沒有人被捲走。' }); }
          break;
        }
        case 'xiu': { const x = allyById(b, 'xiu'); if (x && !x.critical && !x.safe) { const d = atkValue(b, e, x, a.v, {}); dealDamage(b, x, d, e, {}); } break; }
        case 'pressure': {
          const m = allyById(b, 'mind');
          if (m) { let v = a.v + (e.pressureBonus || 0); for (const o of liveEnemies(b)) v += o.auraPressure || 0; v -= (e.auraPressure || 0); const d = atkValue(b, e, m, v, {}); dealDamage(b, m, d, e, { noCounter: true }); }
          break;
        }
        case 'blk': { e.blk += a.v; log(b, { t: 'blk', id: e.id, n: a.v, after: e.blk }); break; }
        case 'blkAll': { for (const o of liveEnemies(b)) { o.blk += a.v; log(b, { t: 'blk', id: o.id, n: a.v, after: o.blk }); } break; }
        case 'str': { addSt(b, e, 'str', a.v); break; }
        case 'strAll': { for (const o of liveEnemies(b)) addSt(b, o, 'str', a.v); break; }
        case 'weakAll': { for (const p of persons(b)) addSt(b, p, 'weak', a.v); break; }
        case 'weakT': { const t = retarget(b, e, a.tgt, true); if (t) addSt(b, t, 'weak', a.v); break; }
        case 'offT': { const t = retarget(b, e, a.tgt, true); if (t && !t.sea) addSt(b, t, 'off', 1); break; }
        case 'stunT': { const t = retarget(b, e, a.tgt, true); if (t) addSt(b, t, 'stun', 1); break; }
        case 'bleedT': { const t = retarget(b, e, a.tgt, true); if (t) addSt(b, t, 'bleed', a.v); break; }
        case 'heal': { e.hp = Math.min(e.maxHp, e.hp + a.v); log(b, { t: 'heal', id: e.id, n: a.v, after: e.hp }); break; }
        case 'xinUp': { for (const o of a.all ? liveEnemies(b) : [e]) if (o.xinMax) { o.xin = Math.min(o.xinMax, o.xin + a.v); log(b, { t: 'xinUp', id: o.id, n: a.v, after: o.xin }); } break; }
        case 'steal': { const amt = Math.min(a.v, b.purse); b.purse -= amt; b.stats.stolen += amt; e.mem.loot = (e.mem.loot || 0) + amt; log(b, { t: 'steal', id: e.id, n: amt }); break; }
        case 'flee': { enemyGone(b, e, 'flee'); break; }
        case 'summon': { summon(b, a.def, a.n || 1); break; }
        case 'tide': { b.flags.tide += a.v; log(b, { t: 'tide', n: a.v }); break; }
        case 'labor': break;
        case 'storm': break;
        case 'nothing': break;
        case 'custom': { const def = DH.ENEMIES[e.def]; if (def.custom) def.custom(b, e, a, A); break; }
      }
      if (b.result) break;
    }
  }

  function sweepPerson(b) {
    const hold = allyById(b, 'hold');
    b.stats.swept++;
    log(b, { t: 'swept' });
    if (hold && hold.people > 0) hold.people--;
    else if (!hold) b.flags.people = (b.flags.people || 0) - 1;
  }

  function retarget(b, e, tgtId, nonAtk) {
    // 嘲諷
    if (!nonAtk && b.taunt) {
      const by = b.taunt[e.id] || b.taunt.all;
      if (by) {
        const t = allyById(b, by);
        const orig = allyById(b, tgtId);
        if (t && !t.down && !(b.taunt.all && orig && orig.id === by)) {
          if (!(orig && (orig.kind === 'hold' || orig.kind === 'ship' || orig.kind === 'mind'))) return t;
        }
      }
    }
    let t = allyById(b, tgtId);
    if (t && t.kind === 'person' && t.down) t = null;
    if (t && t.kind === 'xiu' && t.critical) t = null;
    if (!t) {
      const ps = persons(b);
      t = ps.find((p) => p.id === 'wei') || ps[0] || null;
      if (t) log(b, { t: 'retarget', id: e.id, to: t.id });
    }
    return t;
  }

  function summon(b, defId, n) {
    for (let i = 0; i < n; i++) {
      if (liveEnemies(b).length >= 4) return;
      const e = makeEnemy(b, defId);
      b.enemies.push(e);
      const def = DH.ENEMIES[defId];
      e.intent = resolveIntent(b, e, def.ai(e, b, api0(b, {})));
      log(b, { t: 'summon', id: e.id, def: defId });
    }
  }

  function makeEnemy(b, defId, over) {
    const def = DH.ENEMIES[defId];
    if (!def) throw new Error('no enemy ' + defId);
    b._eid = (b._eid || 0) + 1;
    const mul = b.diffMul ? b.diffMul.hp : 1;
    const hp = Math.round((over && over.hp ? over.hp : def.hp) * mul);
    const e = {
      id: 'e' + b._eid, def: defId, name: (over && over.name) || def.name, side: 'enemy',
      hp, maxHp: hp, blk: 0, st: {}, mem: {},
      sea: !!def.sea, boss: !!def.boss, pushImmune: !!(def.pushImmune || def.boss), leader: !!def.leader,
      ghost: !!def.ghost, gone: null, intent: null, art: def.art || defId,
    };
    const xin = over && over.xin != null ? over.xin : def.xin;
    if (xin) { e.xin = e.xinMax = Math.round(xin * (b.diffMul ? b.diffMul.xin : 1)); }
    if (def.xinMul) e.xinMul = def.xinMul;
    if (def.auraPressure) e.auraPressure = def.auraPressure;
    if (def.init) def.init(e, b);
    if (over && over.st) Object.assign(e.st, over.st);

  }

  // ---------- 建立戰鬥 ----------
  function create(spec) {
    const b = {
      v: 1, mode: spec.mode || 'fight', enc: spec.enc, title: spec.title || '',
      turn: 0, round: 0,
      waves: spec.waves !== false && spec.mode !== 'talk',
      phase: spec.startPhase != null ? spec.startPhase : 0,
      anchor: false, forceNext: null,
      energy: 0, energyMax: 3, drawN: 5,
      allies: [], enemies: [],
      draw: [], hand: [], disc: [], exh: [],
      played: [], powers: [], tal: [], items: (spec.items || []).slice(),
      helper: Object.assign({ uses: 1, used: 0, opts: ['water', 'news'] }, spec.helper || {}),
      log: [], rng: R.make(spec.seed || 1), result: null,
      flags: Object.assign({ tide: 0 }, spec.flags || {}),
      purse: spec.purse || 0,
      diffMul: spec.diffMul || null,
      stats: { killed: [], yielded: [], overboard: [], fled: [], downed: [], hpLost: {}, dmgDealt: 0, xinDealt: 0, taken: 0, swept: 0, stolen: 0, silverSpent: 0, rescued: 0, drowned: 0, cargoThrown: [], turns: 0 },
      maxTurns: spec.maxTurns || 0,
      bar: (spec.bar || []).map((x) => Object.assign({}, x)), boat: [], drowned: [],
      winCond: spec.winCond || 'enemies',
      _eid: 0,
    };
    if (b.mode === 'storm') { b.phase = spec.startPhase != null ? spec.startPhase : 1; }
    for (const a of spec.allies) {
      b.allies.push(Object.assign({ side: 'ally', kind: 'person', blk: 0, st: {}, down: false }, a, { st: Object.assign({}, a.st || {}) }));
    }
    for (const o of spec.objs || []) b.allies.push(Object.assign({ side: 'ally', blk: 0, st: {}, down: false }, o));
    if (b.mode === 'talk') {
      b.allies.push({ id: 'mind', kind: 'mind', side: 'ally', name: '底氣', hp: spec.composure || 30, maxHp: spec.composure || 30, blk: 0, st: {}, down: false });
    }
    for (const e of spec.enemies) b.enemies.push(makeEnemy(b, e.def, e));
    b.draw = R.shuffle(b.rng, spec.deck.map((c) => Object.assign({}, c)));
    // 先天（innate）牌放最上面
    const innate = b.draw.filter((c) => DH.CARDS[c.id] && DH.CARDS[c.id].innate);
    if (innate.length) { b.draw = b.draw.filter((c) => !innate.includes(c)).concat(innate); }
    // 已倒下的同伴的牌不進場
    for (const a of b.allies) if (a.kind === 'person' && a.down) {
      b.draw = b.draw.filter((c) => { const d = DH.CARDS[c.id]; if (d && d.owner === a.id) { b.exh.push(c); return false; } return true; });
    }
    return b;
  }

  function begin(b) {
    log(b, { t: 'begin' });
    runHook(b, 'battleStart');
    const enc = DH.ENCOUNTERS && DH.ENCOUNTERS[b.enc];
    if (enc && enc.onStart) enc.onStart(b, api0(b, {}));
    chooseIntents(b);
    startTurn(b);
    return b;
  }

  function startTurn(b) {
    if (b.result) return;
    b.turn++; b.stats.turns = b.turn;
    b.played = [];
    b.taunt = null;
    for (const a of b.allies) {
      if (a.kind === 'mind') { a.blk = 0; continue; }
      if (b.items.includes('basalt') && a.kind === 'person') a.blk = Math.floor(a.blk / 2); else a.blk = 0;
      if (a.st.counter) delete a.st.counter;
      if (a.st.dodge) delete a.st.dodge;
    }
    log(b, { t: 'turn', n: b.turn, phase: phaseName(b) });
    if (b.waves && phaseName(b) === '湧') crash(b, 'wave');
    if (b.flags.dheal) { for (const x of b.flags.dheal) healAlly(b, allyById(b, x.id), x.n); b.flags.dheal = null; }
    b.energy = b.energyMax + (b.flags.nextEnergy || 0);
    b.flags.nextEnergy = 0;
    runHook(b, 'turnStart');
    const enc = DH.ENCOUNTERS && DH.ENCOUNTERS[b.enc];
    if (enc && enc.onTurnStart) enc.onTurnStart(b, api0(b, {}));
    drawCards(b, b.drawN + (b.flags.nextDraw || 0));
    b.flags.nextDraw = 0;
    checkEnd(b);
  }

  // ---------- 出牌 ----------
  function cardCost(b, c) {
    const def = DH.CARDS[c.id];
    if (!def) return 99;
    let cost = def.cost;
    if (Array.isArray(cost)) cost = cost[c.up ? 1 : 0];
    if (c.costMod) cost += c.costMod;
    if (def.costFn) cost = def.costFn(b, c, cost);
    return Math.max(0, cost);
  }
  DH.cardCost = cardCost;

  function canPlay(b, uid, viaJettison) {
    if (b.result) return { ok: false, why: '戰鬥已結束' };
    const c = b.hand.find((x) => x.uid === uid);
    if (!c) return { ok: false, why: '不在手上' };
    const def = DH.CARDS[c.id];
    if (!def) return { ok: false, why: '未知' };
    if (viaJettison) {
      if (!def.jettison) return { ok: false, why: '不能拋' };
      const jc = def.jettison.cost || 0;
      if (b.energy < jc) return { ok: false, why: '氣不足' };
      return { ok: true };
    }
    if (def.unplayable) return { ok: false, why: def.unplayableWhy || '無法打出' };
    if (def.useNotAllowed) return { ok: false, why: def.useNotAllowed };
    if (def.modes && !def.modes.includes(b.mode)) return { ok: false, why: '此時用不上' };
    if (def.owner && def.owner !== 'none') {
      const o = allyById(b, def.owner);
      if (!o || o.down) return { ok: false, why: '無人可用' };
      if (st(o, 'stun') > 0) return { ok: false, why: DH.OWNERS[def.owner].name + '暈了' };
    }
    if (b.energy < cardCost(b, c)) return { ok: false, why: '氣不足' };
    if ((def.tgt === 'enemy' || def.tgt === 'ally') && !targetsFor(b, uid).length) return { ok: false, why: def.needXin ? '沒有聽得進去的人' : '沒有目標' };
    if (def.cond) { const r = def.cond(api0(b, { card: c, up: c.up }), c); if (r) return { ok: false, why: r }; }
    return { ok: true };
  }

  function targetsFor(b, uid) {
    const c = b.hand.find((x) => x.uid === uid);
    if (!c) return [];
    const def = DH.CARDS[c.id];
    const tg = def.tgt || 'none';
    if (tg === 'enemy') return liveEnemies(b).filter((e) => !(def.needXin && !e.xinMax) && !(e.storm && def.noStorm)).map((e) => e.id);
    if (tg === 'ally') {
      const kinds = def.kinds || ['person'];
      return b.allies.filter((a) => {
        if (a.down) return false;
        if (b.mode === 'talk') return a.kind === 'mind';
        if (a.kind === 'hold' && (a.broken || !kinds.includes('hold'))) return false;
        if (a.kind === 'ship' && !kinds.includes('ship')) return false;
        if (a.kind === 'xiu' && (a.critical || !kinds.includes('xiu'))) return false;
        if (a.kind === 'mind') return false;
        if (a.kind === 'person') return true;
        return kinds.includes(a.kind);
      }).map((a) => a.id);
    }
    return [];
  }

  function play(b, uid, tgtId, opt) {
    opt = opt || {};
    const chk = canPlay(b, uid, opt.jettison);
    if (!chk.ok) return chk;
    const idx = b.hand.findIndex((x) => x.uid === uid);
    const c = b.hand[idx];
    const def = DH.CARDS[c.id];
    const tg = def.tgt || 'none';
    let tgt = null;
    if (!opt.jettison && (tg === 'enemy' || tg === 'ally')) {
      const ok = targetsFor(b, uid);
      if (!ok.length) return { ok: false, why: '沒有目標' };
      if (!tgtId || !ok.includes(tgtId)) tgtId = ok.length === 1 ? ok[0] : null;
      if (!tgtId) return { ok: false, why: '請選目標' };
      tgt = ent(b, tgtId);
      if (b.mode === 'talk' && tg === 'ally') tgt = allyById(b, 'mind');
    }
    // 談判中：狠招會翻臉
    if (b.mode === 'talk' && def.harsh && !opt.jettison) {
      b.hand.splice(idx, 1); b.disc.push(c);
      b.result = 'turn'; log(b, { t: 'turnFight', card: c.id });
      return { ok: true, turned: true };
    }
    const cost = opt.jettison ? (def.jettison.cost || 0) : cardCost(b, c);
    b.energy -= cost;
    b.hand.splice(idx, 1);
    const owner = def.owner && def.owner !== 'none' ? allyById(b, def.owner) : null;
    const prev = b.played.length ? b.played[b.played.length - 1] : null;
    const follow = prev != null && prev !== (def.owner || 'none');
    const vals = {};
    if (def.vals) for (const k in def.vals) vals[k] = Array.isArray(def.vals[k]) ? def.vals[k][c.up ? 1 : 0] : def.vals[k];
    const ctx = { card: c, def, up: c.up, owner, t: tgt, v: vals, follow, prev, opt };
    log(b, { t: 'play', uid: c.uid, id: c.id, owner: def.owner, tgt: tgt ? tgt.id : null, jet: !!opt.jettison });
    const A = api0(b, ctx);
    if (opt.jettison) {
      def.jettison.fx(A, ctx);
      b.stats.cargoThrown.push(c.id);
      c.thrown = true;
      b.exh.push(c);
    } else {
      if (def.type === 'pow') {
        b.powers.push({ id: c.id, owner: def.owner, up: c.up });

        if (def.onPlay) def.onPlay(A, ctx);
      } else {
        def.fx(A, ctx);

      if (def.type === 'pow') { /* 式不回牌堆 */ }

      else b.disc.push(c);
    }
    b.played.push(def.owner || 'none');
    runHook(b, 'cardPlayed', c, def);
    checkEnd(b);
    return { ok: true };

  // 談判：塞錢
  function bribe(b) {
    if (b.mode !== 'talk') return { ok: false, why: '只有談判能塞錢' };
    const main = liveEnemies(b).find((e) => e.main) || liveEnemies(b)[0];
    const cost = 12 + (b.flags.bribes || 0) * 8;
    if (b.energy < 1) return { ok: false, why: '氣不足' };
    if (b.purse < cost) return { ok: false, why: '銀兩不足' };
    if (!main) return { ok: false, why: '沒有對象' };
    b.energy -= 1; b.purse -= cost; b.stats.silverSpent += cost; b.flags.bribes = (b.flags.bribes || 0) + 1;
    const greedy = main.greedy || 1;

  DH.bribeCost = (b) => 12 + (b.flags.bribes || 0) * 8;

  // 阿水幫手
  function helper(b, kind, tgtId) {
    if (b.helper.used >= b.helper.uses) return { ok: false, why: '阿水已經幫過了' };
    if (b.result) return { ok: false };
    const A = api0(b, {});
    if (kind === 'water') {
      const t = allyById(b, tgtId);
      if (!t || t.down || (t.kind !== 'person' && t.kind !== 'xiu')) return { ok: false, why: '選一個人' };
      if (t.kind === 'xiu' && t.critical) return { ok: false, why: '她要的不是水' };
      if (b.mode === 'talk') return { ok: false, why: '這裡用不上' };
      healAlly(b, t, 6 + (b.helper.lv || 0) * 2);

    } else if (kind === 'dive') {
      if (!b.stats.swept || b.stats.rescued >= b.stats.swept) return { ok: false, why: '沒有人落水' };
      b.stats.rescued++;
      const hold = allyById(b, 'hold'); if (hold) hold.people++;
      log(b, { t: 'rescue' });
    } else if (kind === 'carry') {
      if (b.mode !== 'tide' || !b.bar.length) return { ok: false, why: '沙汕上沒有人了' };
      rescueOne(b, tgtId || null);
    } else if (kind === 'trip') {
      const e = enemyById(b, tgtId);
      if (!e || e.gone || b.mode === 'talk') return { ok: false, why: '選一個敵人' };
      addSt(b, e, 'off', 1);
    } else return { ok: false };
    b.helper.used++;
    log(b, { t: 'helper', k: kind });
    checkEnd(b);
    return { ok: true };
  }

  // ---------- 回合結束 ----------
  function endTurn(b) {
    if (b.result) return;
    if (b.flags.tmpStr) {
      for (const x of b.flags.tmpStr) { const a = allyById(b, x.id); if (a && !a.down) { a.st.str = (a.st.str || 0) - x.n; if (a.st.str === 0) delete a.st.str; } }
      b.flags.tmpStr = null;
    }
    runHook(b, 'turnEnd');
    for (const t of b.tal.slice()) { fireTalisman(b, t); t.left--; }
    b.tal = b.tal.filter((t) => t.left > 0);
    if (b.result) return finishRound(b);
    // 手牌處理
    const keep = [];
    for (const c of b.hand) {
      const def = DH.CARDS[c.id];
      if (def && def.endInHand) def.endInHand(api0(b, { card: c }), c);
      if (def && def.retain) keep.push(c);
      else if (def && def.ethereal) b.exh.push(c);
      else b.disc.push(c);
    }
    b.hand = keep;
    if (b.result) return finishRound(b);
    // 我方狀態結算
    for (const a of persons(b)) {
      if (st(a, 'bleed') > 0) { const n = st(a, 'bleed'); log(b, { t: 'bleed', id: a.id, n }); loseHp(b, a, n, null); addSt(b, a, 'bleed', -1); }
      for (const k of ['weak', 'stun']) if (st(a, k) > 0) addSt(b, a, k, -1);
      if (b.result) return finishRound(b);
    }
    // 敵方回合
    log(b, { t: 'enemyTurn' });
    for (const e of b.enemies.slice()) {
      if (e.gone || b.result) continue;
      e.blk = 0;
      if (st(e, 'stun') > 0) { addSt(b, e, 'stun', -1); log(b, { t: 'stunned', id: e.id }); continue; }
      execIntent(b, e);
    }
    if (!b.result) {
      for (const e of liveEnemies(b)) {
        if (b.mode !== 'talk' && st(e, 'bleed') > 0) { const n = st(e, 'bleed'); log(b, { t: 'bleed', id: e.id, n }); loseHp(b, e, n, null); if (!e.gone) addSt(b, e, 'bleed', -1); }
        if (!e.gone) for (const k of ['weak']) if (st(e, k) > 0) addSt(b, e, k, -1);
      }
    }
    finishRound(b);
  }

  function finishRound(b) {
    b.round++;
    for (const o of [...b.allies, ...b.enemies]) if (o.st && o.st.off) delete o.st.off;
    const enc = DH.ENCOUNTERS && DH.ENCOUNTERS[b.enc];
    if (!b.result && enc && enc.onRoundEnd) enc.onRoundEnd(b, api0(b, {}));
    if (b.waves) {
      if (b.anchor) { b.anchor = false; }
      else if (b.forceNext != null) { b.phase = b.forceNext; b.forceNext = null; }
      else b.phase = nextPhaseIdx(b, b.phase);
    }
    checkEnd(b);
    if (b.result) return;
    chooseIntents(b);
    startTurn(b);
  }

  function checkEnd(b) {
    if (b.result) return b.result;
    const wei = allyById(b, 'wei');
    if (wei && wei.down) { b.result = 'lose'; return b.result; }
    if (b.winCond === 'enemies' || b.winCond === 'boss') {
      const live = liveEnemies(b);
      if (b.winCond === 'boss' ? !live.some((e) => e.boss) : !live.length) {
        b.result = 'win'; log(b, { t: 'end', r: 'win' });
      }
    }
    if (b.winCond === 'storm') {
      const s = b.enemies[0];
      if (s && (s.gone || s.hp <= 0)) { b.result = 'win'; log(b, { t: 'end', r: 'win' }); }
      else if (b.maxTurns && b.round >= b.maxTurns) { b.result = 'win'; b.flags.outlasted = true; log(b, { t: 'end', r: 'win' }); }
    }
    return b.result;
  }

  DH.Battle = {
    create, begin, startTurn, canPlay, targetsFor, play, endTurn, helper, bribe,
    checkEnd, phaseName, persons, liveEnemies, allyById, enemyById, ent, st, cardCost,
    upcomingPhases, chooseIntents, summon, crash, makeEnemy, addSt, dealDamage, persuadeRaw, healAlly, loseHp,
  };
})();

  // ---------- 文字與數值預覽 ----------
  function cardVals(defn, up) {
    const v = {};
    if (defn.vals) for (const k in defn.vals) v[k] = Array.isArray(defn.vals[k]) ? defn.vals[k][up ? 1 : 0] : defn.vals[k];
    return v;
  }
  DH.cardVals = cardVals;
  DH.cardRawText = (defn, up) => (Array.isArray(defn.text) ? defn.text[up ? 1 : 0] : defn.text);

  // 依戰況算出卡面數字（b 可為 null）
  DH.cardText = function (c, b, tgt) {
    const defn = C[c.id];
    if (!defn) return '';
    let t = DH.cardRawText(defn, c.up);
    if (b && b.mode === 'talk') t = defn.talkText || DH.talkify(t);
    const v = cardVals(defn, c.up);
    const owner = b && defn.owner && defn.owner !== 'none' ? b.allies.find((a) => a.id === defn.owner) : null;
    if (!tgt && b && b.enemies) { const live = b.enemies.filter((e) => !e.gone); if (live.length === 1) tgt = live[0]; }
    const flat = b && owner && owner.id === 'wei' && b.hand.some((x) => x.id === 'xinshi') ? -2 : 0;
    return t.replace(/\{(\w)\}/g, (m, k) => {
      const base = v[k];
      if (base == null) return m;
      if ((k === 'd' || k === 'e') && b && b.mode === 'talk') { const d = DH.persuadeValue(b, owner, tgt || null, Math.max(0, base + flat), true); return d === base ? String(d) : '«' + d + '»'; }
      if ((k === 'd' || k === 'e') && b) {
        const raw = tgt && tgt.storm && owner && owner.id === 'cai' ? Math.floor(base * 1.5) : base;
        const d = DH.atkValue(b, owner, tgt || null, raw, { ranged: defn.ranged, flat });
        return d === base ? String(d) : '«' + d + '»';
      }
      if ((k === 'p' || k === 'q') && b) { const d = DH.persuadeValue(b, owner, tgt || null, base); return d === base ? String(d) : '«' + d + '»'; }
      if (k === 'h' && b && b.items.includes('deerbag') && defn.herb) return '«' + (base + 2) + '»';
      return String(base);
    });
  };
  // 談判時，牌面上的字換成談判的講法（攻擊→說服，擋→定）
  DH.talkify = (t) => t
    .replace(/對所有敵人造成\{(d|e)\}傷害/g, '對所有人說服{$1}')
    .replace(/造成\{(d|e)\}傷害/g, '說服{$1}')
    .replace(/再造成\{(d|e)\}/g, '再說服{$1}')
    .replace(/造成等同(.+?)的傷害/g, '說服，力道等同$1')
    .replace(/[，、]血(\{n\}|\d+)/g, '')
    .replace(/回復\{h\}體力/g, '回復{h}')
    .replace(/所有己方回復\{h\}/g, '底氣回復{h}')
    .replace(/一人回復\{h\}/g, '底氣回復{h}')
    .replace(/^回復\{h\}/, '底氣回復{h}')
    .replace(/(選一人（或艙門、船身、秀娘）：|一人（或艙門、船身、秀娘）|魏子葳|黑狗|伊蘭|阿祿師|老蔡|體力比例最低的兩人各)擋\{b\}/g, '定{b}')
    .replace(/擋\{b\}/g, '定{b}')
    .replace(/，推\{n\}/g, '').replace(/推\{n\}。?/g, '');
  DH.cardName = (c) => (C[c.id] ? C[c.id].name + (c.up ? '＋' : '') : c.id);
  DH.TYPE_NAMES = { atk: '攻', skl: '技', pow: '式', cargo: '貨', curse: '傷', relic: '遺' };
})();

  // 意圖預覽：照出手順序，把前面的人這一輪做的「勁」「失衡」算進後面的人的數字
  function summarize(b, e) {
    const out = [];
    for (const a of e.intent.acts) {
      const tgt = a.tgt ? DH.Battle.ent(b, a.tgt) : null;
      if (a.k === 'atk') out.push({ k: 'atk', n: DH.atkValue(b, e, tgt, a.v, { ranged: a.ranged }), hits: a.hits || 1, tgt: a.tgt, ranged: a.ranged, bleed: a.bleed, weak: a.weak });
      else if (a.k === 'atkAll') out.push({ k: 'atkAll', n: DH.atkValue(b, e, null, a.v, {}), hits: a.hits || 1, ship: a.ship ? DH.atkValue(b, e, null, a.ship, {}) : 0, hold: a.hold ? DH.atkValue(b, e, null, a.hold, {}) : 0, weak: a.weak });
      else if (a.k === 'pressure') { let v = a.v + (e.pressureBonus || 0); for (const o of DH.Battle.liveEnemies(b)) if (o !== e) v += o.auraPressure || 0; out.push({ k: 'pressure', n: DH.atkValue(b, e, null, v, {}) }); }
      else if (a.k === 'grab' || a.k === 'ship' || a.k === 'xiu') out.push(Object.assign({}, a, { n: DH.atkValue(b, e, null, a.v, {}) }));
      else out.push(Object.assign({}, a));
    }
    return out;
  }
  DH.enemyIntentSummary = function (b, e) {
    if (!e.intent) return [];
    const undo = [];
    const bump = (o, k, v) => { if (!o || !o.st) return; undo.push([o, k, o.st[k]]); o.st[k] = (o.st[k] || 0) + v; };
    let res = [];
    try {
      for (const x of b.enemies) {
        if (x.gone || !x.intent) continue;
        if (x === e) { res = summarize(b, e); break; }
        if (x.st && x.st.stun > 0) continue;
        for (const a of x.intent.acts) {
          if (a.k === 'str') bump(x, 'str', a.v);
          else if (a.k === 'strAll') for (const o of DH.Battle.liveEnemies(b)) bump(o, 'str', a.v);
          else if (a.k === 'offT') { const t = a.tgt ? DH.Battle.ent(b, a.tgt) : null; if (t && !t.sea && !(t.st && t.st.off)) bump(t, 'off', 1); }
        }
      }
    } finally {
      for (let i = undo.length - 1; i >= 0; i--) { const [o, k, v] = undo[i]; if (v === undefined) delete o.st[k]; else o.st[k] = v; }
    }
    return res;
  };
})();
