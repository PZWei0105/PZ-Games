<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>不夜城</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 不夜城：霓虹賭城的夜。直式 720 寬的機台欄位為主，整體等比縮放；橫放時左右多出資訊板。
   單一深色主題（霓虹街機世界），所有顏色明確指定。 */
:root {
  color-scheme: dark;
  --ink: #0b0418;
  --night: #160733;
  --plum: #2a0f52;
  --pink: #ff2bd6;
  --cyan: #22e6ff;
  --gold: #ffd34d;
  --gold-d: #c47a0c;
  --violet: #a35cff;
  --lime: #5dff9e;
  --orange: #ff7a2e;
  --text: #fff6ff;
  --muted: #c8b5e8;
  --f-display: 'Bungee', 'Arial Black', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif;
  --f-led: 'Orbitron', 'Bungee', 'Arial Black', 'Noto Sans TC', sans-serif;
  --f-zh: 'Noto Sans TC', 'Noto Sans CJK TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --gold-grad: linear-gradient(180deg, #fffbe0 0%, #ffe07a 26%, #f2b528 55%, #c47a0c 82%, #7a4204 100%);
}
html, body { height: 100%; margin: 0; background: var(--ink); overflow: hidden; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { font-family: var(--f-zh); color: var(--text); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus { outline: none; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
button:disabled { cursor: default; }
.sym text { font-synthesis: none; font-weight: 900; }

#app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; background: radial-gradient(120% 80% at 50% 110%, #4a1260 0%, #1a0838 45%, var(--ink) 100%); }
#frame { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
#frame > .bg, #frame > .ovl, #frame > .fx, #fxc { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#frame > .bg { overflow: hidden; }
#frame > .ovl { z-index: 20; pointer-events: none; }
#frame > .ovl > * { pointer-events: auto; }
#fxc { z-index: 30; pointer-events: none; }
#fxc.in-ov { position: absolute; left: 0; top: 0; z-index: auto; }
#frame > .fx { z-index: 40; pointer-events: none; overflow: hidden; }
.col { position: absolute; top: 0; width: 720px; z-index: 10; }
.col.enter { animation: colIn .42s cubic-bezier(.2, .9, .3, 1); }
.col.leave { animation: colOut .24s ease-in forwards; }
@keyframes colIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
@keyframes colOut { to { opacity: 0; transform: scale(.97); } }
.side { position: absolute; top: 0; display: none; z-index: 5; flex-direction: column; justify-content: center; gap: 22px; }
body.land .side { display: flex; }
.side.l { align-items: flex-end; }
.side.r { align-items: flex-start; }

/* ---------- 夜景 ---------- */
.sky { position: absolute; inset: 0; background: radial-gradient(70% 40% at 50% 100%, rgba(255, 43, 214, .28) 0%, rgba(255, 43, 214, 0) 70%), radial-gradient(90% 50% at 50% -10%, #3b1a8a 0%, rgba(59, 26, 138, 0) 70%), linear-gradient(180deg, #0b0418 0%, #1a0838 42%, #3a0f5c 76%, #5a1462 100%); transition: filter .6s; }
.beams i { position: absolute; bottom: 30%; width: 260px; height: 130%; transform-origin: 50% 100%; opacity: .7; clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0); animation: beam 11s ease-in-out infinite alternate; }
.beams i:nth-child(1) { left: calc(50% - 420px); background: linear-gradient(to top, rgba(140, 220, 255, .28), rgba(140, 220, 255, 0) 85%); }
.beams i:nth-child(2) { left: calc(50% + 160px); background: linear-gradient(to top, rgba(255, 120, 230, .26), rgba(255, 120, 230, 0) 85%); animation-delay: -5s; animation-duration: 13s; }
@keyframes beam { from { transform: rotate(-30deg); } to { transform: rotate(26deg); } }
.bokeh i { position: absolute; border-radius: 50%; animation: floaty 20s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(24px, -70px); } }
.city { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; transition: opacity .6s; }
.skyline { display: block; width: 100%; height: 100%; }
.skyline .tw { animation: tw 6s steps(1) infinite; }
@keyframes tw { 0%, 64% { opacity: 1; } 65%, 100% { opacity: .12; } }
.skyline .beacon { animation: beacon 1.8s ease-in-out infinite; }
@keyframes beacon { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
.skyline .sign { animation: signf 8s steps(1) infinite; }
@keyframes signf { 0%, 88%, 92%, 100% { opacity: 1; } 89%, 91% { opacity: .2; } }
.haze { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: linear-gradient(to top, rgba(255, 43, 214, .2), rgba(255, 43, 214, 0)); }
#frame.scr-gems .city, #frame.scr-eight .city, #frame.scr-mary .city { opacity: .32; }
#frame.scr-gems .sky { filter: hue-rotate(-18deg) brightness(.85); }
#frame.scr-eight .sky { filter: hue-rotate(60deg) saturate(1.3) brightness(.8); }
#frame.scr-mary .sky { filter: hue-rotate(170deg) saturate(.9) brightness(.75); }
#frame.scr-gems .beams, #frame.scr-eight .beams, #frame.scr-mary .beams { opacity: .35; }

/* ---------- 跑馬燈泡 ---------- */
.bulbs { position: absolute; pointer-events: none; overflow: visible; }
/* glow drawn as a soft halo ring on each bulb (a drop-shadow filter over the whole blinking SVG was very heavy on phones) */
.bulbs circle { fill: #fff3c4; stroke: rgba(255, 214, 102, .42); stroke-width: 5px; paint-order: stroke; }
.bulbs .b0 { animation: bulbA 1s steps(1) infinite; }
.bulbs .b1 { animation: bulbA 1s steps(1) infinite -.5s; }
@keyframes bulbA { 0% { fill: #fffbe6; } 50% { fill: #8a5a12; } }
.cab.antic .bulbs .b0, .cab.antic .bulbs .b1, .reels.big ~ .bulbs circle { animation-duration: .24s; }

/* ---------- 按鈕 ---------- */
.btn-gold { position: relative; overflow: hidden; border: none; border-radius: 999px; height: 64px; padding: 0 34px; font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #4a2000; background: var(--gold-grad); box-shadow: 0 0 0 3px #6b3a00, 0 6px 0 #6b3a00, 0 10px 24px rgba(0, 0, 0, .55), inset 0 2px 0 rgba(255, 255, 255, .8); transition: transform .08s; }
.btn-gold:active { transform: translateY(3px); box-shadow: 0 0 0 3px #6b3a00, 0 3px 0 #6b3a00, 0 6px 14px rgba(0, 0, 0, .5), inset 0 2px 0 rgba(255, 255, 255, .8); }
.btn-gold:disabled { filter: grayscale(.8) brightness(.7); }
.btn-gold.wide { width: 100%; }
.btn-gold.sm { height: 48px; padding: 0 18px; font-size: 19px; }
.shine { position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, .75) 50%, rgba(255, 255, 255, 0) 100%); transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite; pointer-events: none; }
@keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
.btn-dim { border-radius: 999px; height: 56px; padding: 0 24px; font-size: 19px; font-weight: 700; color: var(--muted); background: rgba(20, 6, 40, .8); border: 2px solid #5a3a8a; }
.btn-dim.sm { height: 48px; padding: 0 16px; font-size: 17px; }
.btn-dim.danger { color: #fff; border-color: #ff4f7a; background: #5a0a24; }
.btn-neon { height: 56px; padding: 0 30px; border-radius: 999px; font-size: 20px; font-weight: 900; color: #04121c; background: linear-gradient(#bff7ff, #22e6ff 50%, #0b8fbf); border: none; box-shadow: 0 0 18px rgba(34, 230, 255, .6), inset 0 2px 0 rgba(255, 255, 255, .7); }

/* ---------- 標題 ---------- */
.title-scr { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.t-floaters { position: absolute; inset: 0; pointer-events: none; }
.t-fl { position: absolute; z-index: 0; animation: tfl 6s ease-in-out infinite; }
.t-fl::before, .t-fl::after { content: ""; position: absolute; z-index: -1; pointer-events: none; border-radius: 50%; }
.t-fl::before { inset: -14%; background: radial-gradient(closest-side, rgba(255, 220, 140, .38), rgba(255, 220, 140, .14) 45%, transparent); }
.t-fl::after { left: 14%; right: 14%; bottom: -9%; height: 18%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); }
.t-fl .sym { width: 100%; height: 100%; }
@keyframes tfl { 0%, 100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-22px) rotate(calc(var(--r) * -1)); } }
.t-mid { position: relative; display: flex; flex-direction: column; align-items: center; gap: 30px; transform: translateY(-30px); }
.t-sign { position: relative; width: 600px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; animation: signIn 1s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes signIn { from { transform: scale(.7); opacity: 0; } }
.t-box { position: absolute; inset: 0; border-radius: 46px; background: linear-gradient(180deg, rgba(30, 8, 60, .92), rgba(12, 3, 32, .95)); box-shadow: 0 0 0 4px #ff2bd6, 0 0 0 10px #12041f, 0 0 0 16px #c47a0c, 0 0 70px rgba(255, 43, 214, .55), inset 0 0 50px rgba(255, 43, 214, .3); }
.t-box .bulbs { left: 0; top: 0; }
.t-zh { position: relative; display: flex; gap: 10px; font-size: 164px; line-height: 1; font-weight: 900; color: #fff3fd; text-shadow: 0 0 4px #fff, 0 0 12px #ff7ae8, 0 0 26px #ff2bd6, 0 0 54px #ff2bd6, 0 0 100px #c0009e; }
.t-zh .flk { animation: flicker 5s steps(1) infinite; }
@keyframes flicker { 0%, 40%, 44%, 47%, 100% { opacity: 1; } 41%, 43%, 45%, 46% { opacity: .25; text-shadow: none; } }
.t-en { position: relative; font-family: var(--f-display); font-size: 25px; letter-spacing: 6px; color: #d4fbff; text-shadow: 0 0 6px #22e6ff, 0 0 18px #22e6ff, 0 0 34px #0b8fbf; }
.t-slogan { font-size: 24px; font-weight: 700; letter-spacing: 4px; color: #ffe9a0; text-shadow: 0 0 12px rgba(255, 179, 0, .6); }
.t-start { height: 96px; padding: 0 74px; font-size: 44px; letter-spacing: 14px; animation: startPulse 1.6s ease-in-out infinite; }
.t-start span { position: relative; padding-left: 14px; }
@keyframes startPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.t-hint { font-size: 18px; color: var(--muted); }

/* ---------- 頂端列 ---------- */
.topbar { position: relative; height: 92px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: linear-gradient(180deg, rgba(34, 10, 70, .96), rgba(18, 5, 42, .94)); border-bottom: 2px solid rgba(255, 211, 77, .45); box-shadow: 0 8px 26px rgba(0, 0, 0, .55); z-index: 3; }
.topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: linear-gradient(90deg, rgba(255, 43, 214, 0), #ff2bd6, #22e6ff, rgba(34, 230, 255, 0)); }
.tb-btn { flex: none; display: flex; align-items: center; justify-content: center; gap: 4px; height: 56px; border-radius: 28px; background: linear-gradient(#3a1a6a, #1c0a3c); border: 2px solid #8a6ac8; color: #fff; }
.tb-btn svg { width: 30px; height: 30px; }
.tb-btn.ico { width: 56px; }
.tb-btn.back { padding: 0 16px 0 8px; font-size: 19px; font-weight: 700; }
.tb-lv { flex: none; display: flex; align-items: center; gap: 6px; }
.tb-lv .xp-bar { width: 104px; }
.tb-name { flex: none; width: 128px; display: flex; flex-direction: column; gap: 6px; }
.tb-name b { font-size: 19px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coin-pill { position: relative; flex: 1 1 auto; min-width: 0; height: 60px; display: flex; align-items: center; gap: 6px; padding: 0 16px 0 8px; border-radius: 30px; overflow: hidden; background: linear-gradient(180deg, #2a0f52, #12042a); border: 2px solid var(--gold); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .14), 0 0 16px rgba(255, 211, 77, .35); }
.coin-pill .coin-ico { flex: none; }
.coin-num { flex: 1; text-align: right; font-family: var(--f-led); font-size: 25px; font-weight: 800; color: #ffe9a0; text-shadow: 0 0 10px rgba(255, 179, 0, .6); font-variant-numeric: tabular-nums; white-space: nowrap; }
.coin-pill .shine { animation-duration: 5s; opacity: .5; }
.coin-pill.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.08); box-shadow: 0 0 30px rgba(255, 211, 77, .9); } }
.lv-badge { position: relative; flex: none; width: 74px; height: 74px; }
.lv-badge svg { display: block; width: 100%; height: 100%; }
.lv-track { fill: #12041f; stroke: #3a1d66; stroke-width: 7; }
.lv-prog { fill: none; stroke: #ffd34d; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .7s; filter: drop-shadow(0 0 4px #ffb300); }
.lv-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-top: 8px; font-family: var(--f-display); font-size: 27px; font-weight: 400; color: #fff; }
.lv-badge small { position: absolute; left: 0; right: 0; top: 13px; text-align: center; font-family: var(--f-display); font-size: 11px; color: var(--gold); }
.lv-badge.sm { width: 62px; height: 62px; }
.lv-badge.sm .lv-num { font-size: 22px; padding-top: 7px; }
.lv-badge.sm small { top: 10px; font-size: 10px; }
.lv-badge.nudge { animation: nudge .5s 2; }
@keyframes nudge { 30% { transform: scale(1.2) rotate(-8deg); } 60% { transform: scale(1.15) rotate(8deg); } }
.xp-bar { position: relative; height: 18px; border-radius: 9px; overflow: hidden; background: #0c0218; border: 1.5px solid #5a3a8a; }
.xp-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 9px; background: linear-gradient(90deg, #22e6ff, #a35cff, #ff2bd6); transition: width .7s; }
.xp-bar span { position: absolute; inset: 0; text-align: center; font-family: var(--f-led); font-size: 10.5px; line-height: 16px; color: #fff; text-shadow: 0 1px 2px #000; }
.timed-pill { flex: none; position: relative; width: 132px; height: 60px; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; background: linear-gradient(#25104a, #12052a); border: 2px solid #5a3a8a; color: var(--muted); }
.tp-ico { position: absolute; left: 8px; top: 13px; width: 30px; height: 30px; color: #8a6ac8; }
.tp-ico svg { width: 100%; height: 100%; }
.tp-txt { padding-left: 26px; font-family: var(--f-led); font-size: 17px; font-weight: 700; color: #e6dcff; }
.tp-amt { padding-left: 26px; font-family: var(--f-led); font-size: 14px; color: var(--gold); }
.timed-pill.ready { border-color: var(--gold); color: #4a2000; background: var(--gold-grad); animation: timedGlow 1.1s ease-in-out infinite alternate; }
.timed-pill.ready .tp-ico { color: #6b3a00; }
.timed-pill.ready .tp-txt { font-family: var(--f-zh); font-weight: 900; color: #4a2000; font-size: 16px; }
.timed-pill.ready .tp-amt { color: #7a1a00; font-size: 16px; }
@keyframes timedGlow { from { box-shadow: 0 0 6px rgba(255, 211, 77, .5); } to { box-shadow: 0 0 26px rgba(255, 211, 77, 1); } }

/* ---------- 大廳 ---------- */
.lobby-scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
.ticker { flex: none; height: 52px; margin: 12px 16px 0; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 10px; border-radius: 26px; overflow: hidden; background: rgba(8, 2, 18, .82); border: 1.5px solid rgba(255, 211, 77, .5); box-shadow: inset 0 0 18px rgba(0, 0, 0, .8); }
.tk-ico { flex: none; width: 34px; height: 34px; }
.tk-ico svg { width: 100%; height: 100%; }
.tk-line { position: relative; flex: 1; height: 100%; overflow: hidden; }
.tk-item { position: absolute; left: 0; right: 0; top: 0; line-height: 50px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 19px; color: #f1e6ff; transform: translateY(100%); opacity: 0; transition: transform .45s, opacity .45s; }
.tk-item.in { transform: none; opacity: 1; }
.tk-item.out { transform: translateY(-100%); opacity: 0; }
.tk-item b { color: #7ff3ff; }
.tk-item em, .fd-row em { font-style: normal; font-family: var(--f-led); font-weight: 800; color: var(--gold); }
.tk-item.hot em { color: #ff9cf3; text-shadow: 0 0 10px #ff2bd6; }
.tk-fake { font-style: normal; font-size: 13px; font-weight: 900; padding: 1px 7px; margin-left: 8px; border-radius: 6px; background: #7ff3ff; color: #04121c; vertical-align: 2px; }
.evbar { flex: none; height: 50px; margin: 8px 16px 0; padding: 0 18px; display: flex; align-items: center; gap: 12px; border-radius: 25px; background: rgba(20, 6, 40, .75); border: 1.5px solid #5a3a8a; font-size: 18px; color: var(--muted); }
.ev-tag { flex: none; font-size: 15px; padding: 3px 10px; border-radius: 8px; background: #3a1d66; color: #e6dcff; }
.ev-txt { flex: 1; font-weight: 700; color: #fff; }
.ev-time { font-style: normal; font-family: var(--f-led); font-size: 15px; }
.evbar.live { border-color: #ff2bd6; background: linear-gradient(90deg, rgba(90, 10, 80, .9), rgba(40, 8, 70, .9)); box-shadow: 0 0 20px rgba(255, 43, 214, .45); }
.evbar.live .ev-tag { background: #ff2bd6; color: #fff; animation: tagPulse 1s ease-in-out infinite alternate; }
.evbar.live .ev-time { color: #ffd0f5; }
@keyframes tagPulse { to { box-shadow: 0 0 14px #ff2bd6; } }
.cards { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 6px; }
.mcard { position: relative; flex: 1 1 0; min-height: 196px; max-height: 330px; border-radius: 30px; overflow: hidden; text-align: left; border: 3px solid; padding: 0; color: #fff; transition: transform .12s; box-shadow: 0 12px 30px rgba(0, 0, 0, .55), inset 0 2px 0 rgba(255, 255, 255, .25); animation: cardIn .6s cubic-bezier(.2, 1.1, .4, 1) backwards; }
.mcard:nth-child(2) { animation-delay: .08s; }
.mcard:nth-child(3) { animation-delay: .16s; }
@keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(.96); } }
.mcard:active { transform: scale(.98); }
.mc-bg { position: absolute; inset: 0; }
.mcard.gems { --accent: #e3b6ff; --glow: #c04dff; border-color: #d39bff; background: radial-gradient(110% 140% at 85% 25%, #8a3cff 0%, #3a0f8a 42%, #14042e 100%); }
.mcard.gems .mc-bg { background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .05) 0 2px, transparent 2px 26px), repeating-linear-gradient(-45deg, rgba(255, 255, 255, .05) 0 2px, transparent 2px 26px), radial-gradient(60% 80% at 80% 50%, rgba(34, 230, 255, .25), transparent 70%); }
.mcard.eight { --accent: #ffc58a; --glow: #ff5a1f; border-color: #ffb066; background: radial-gradient(110% 140% at 85% 25%, #ff6a2a 0%, #a3120f 42%, #2a0404 100%); }
.mcard.eight .mc-bg { background: radial-gradient(18% 50% at 12% 105%, rgba(255, 196, 61, .55), transparent 70%), radial-gradient(14% 42% at 30% 108%, rgba(255, 122, 46, .6), transparent 70%), radial-gradient(18% 55% at 52% 106%, rgba(255, 196, 61, .45), transparent 70%), radial-gradient(14% 40% at 72% 108%, rgba(255, 90, 31, .55), transparent 70%), radial-gradient(18% 50% at 92% 106%, rgba(255, 196, 61, .5), transparent 70%); }
.mcard.mary { --accent: #b8ffd6; --glow: #19d97a; border-color: #7dffb5; background: radial-gradient(110% 140% at 85% 25%, #22e08a 0%, #0b6a42 42%, #03190f 100%); }
.mcard.mary .mc-bg { background-image: radial-gradient(rgba(255, 211, 77, .32) 2px, transparent 3px); background-size: 26px 26px; }
.mc-art { position: absolute; right: 22px; top: 50%; width: 262px; height: 184px; transform: translateY(-50%); }
.mc-art i { position: absolute; display: block; z-index: 0; }
.mc-art i::before, .mc-art i::after { content: ""; position: absolute; z-index: -1; pointer-events: none; border-radius: 50%; }
.mc-art i::before { inset: -14%; background: radial-gradient(closest-side, rgba(255, 255, 255, .26), rgba(255, 255, 255, .1) 45%, transparent); }
.mc-art i::after { left: 14%; right: 14%; bottom: -9%; height: 18%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); }
.mc-art .sym { width: 100%; height: 100%; }
.mc-art .a0 { width: 148px; height: 148px; left: 58px; top: 18px; z-index: 2; animation: bob 3.2s ease-in-out infinite; }
.mc-art .a1 { width: 100px; height: 100px; left: -8px; top: 72px; transform: rotate(-12deg); }
.mc-art .a2 { width: 100px; height: 100px; right: -6px; top: 6px; transform: rotate(12deg); }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.04); } }
.mc-info { position: absolute; left: 30px; top: 20px; bottom: 20px; max-width: 390px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.mc-name { font-size: 48px; font-weight: 900; letter-spacing: 3px; line-height: 1.1; text-shadow: 0 3px 0 rgba(0, 0, 0, .45), 0 0 24px var(--glow); }

.mc-sub { font-size: 16px; color: rgba(255, 255, 255, .85); }
.mc-jp { align-self: flex-start; margin-top: 8px; display: flex; align-items: center; gap: 10px; padding: 5px 14px; border-radius: 14px; background: rgba(0, 0, 0, .55); border: 1.5px solid rgba(255, 211, 77, .6); }
.mc-jp span { font-family: var(--f-display); font-size: 14px; color: var(--gold); }
.mc-jp b { font-family: var(--f-led); font-size: 24px; font-weight: 800; color: #fff; text-shadow: 0 0 10px #ffb300; font-variant-numeric: tabular-nums; }
.mc-jp.alt b { font-family: var(--f-zh); font-size: 19px; }
.mc-play { position: absolute; right: 24px; bottom: 18px; z-index: 3; height: 46px; padding: 0 24px; border-radius: 23px; display: flex; align-items: center; font-size: 21px; font-weight: 900; letter-spacing: 3px; color: #4a2000; background: var(--gold-grad); box-shadow: 0 0 0 2px #6b3a00, 0 4px 0 #6b3a00, 0 0 18px rgba(255, 211, 77, .6); }
.mcard.locked .mc-play { display: none; }
.mcard.locked .mc-art, .mcard.locked .mc-info, .mcard.locked .mc-bg { filter: grayscale(.85) brightness(.55); }
.mc-lock { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(5, 1, 12, .45); }
.mc-lock i { width: 60px; height: 60px; }
.mc-lock i svg { width: 100%; height: 100%; }
.mc-lock b { font-size: 30px; font-weight: 900; text-shadow: 0 2px 8px #000; }
.mc-lock small { font-size: 16px; color: var(--muted); }
.mcard .mc-bulbs { left: 8px; top: 8px; z-index: 2; }
.dock { flex: none; height: 138px; display: flex; justify-content: space-around; align-items: center; padding: 0 8px 10px; background: linear-gradient(180deg, rgba(11, 4, 24, 0), rgba(11, 4, 24, .92) 40%); }
.dk { position: relative; width: 124px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: none; padding: 0; }
.dk-ico { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 32%, #4a2290, #12052a 75%); border: 2.5px solid #a37bff; box-shadow: 0 0 18px rgba(163, 92, 255, .45), inset 0 3px 0 rgba(255, 255, 255, .2); transition: transform .1s; }
.dk:active .dk-ico { transform: scale(.92); }
.dk-ico svg { width: 56px; height: 56px; }
.dk span { font-size: 17px; font-weight: 700; color: #f1e6ff; }
.dk.reveal .dk-ico { border-color: #7ff3ff; box-shadow: 0 0 18px rgba(127, 243, 255, .5); }
.badge { position: absolute; top: -4px; right: 12px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; display: none; align-items: center; justify-content: center; font-size: 17px; font-weight: 900; color: #fff; background: #ff2b4f; border: 2px solid #fff; box-shadow: 0 0 12px #ff2b4f; }
.badge.on { display: flex; animation: badgePulse 1.2s ease-in-out infinite; }
@keyframes badgePulse { 50% { transform: scale(1.15); } }

/* ---------- 機台畫面 ---------- */
.mscr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; }
.mscr > * { flex: none; }
.mscr > .topbar { align-self: stretch; }
.m-logo { position: relative; flex: 1 1 auto !important; min-height: 0; max-height: 340px; width: 100%; display: flex; align-items: center; justify-content: center; }
.lg-sign { display: flex; flex-direction: column; align-items: center; transition: opacity .4s; }
.lg-sign b { font-size: 44px; font-weight: 900; letter-spacing: 8px; line-height: 1.1; color: #fff; }
.lg-sign small { font-family: var(--f-display); font-size: 14px; letter-spacing: 4px; }
.m-logo.gems b { text-shadow: 0 0 6px #fff, 0 0 16px #ff4fd8, 0 0 34px #c04dff; }
.m-logo.gems small { color: #8ff3ff; text-shadow: 0 0 10px #22e6ff; }
.m-logo.eight b { color: #fff3c4; text-shadow: 0 0 6px #fff, 0 0 16px #ff7a2e, 0 0 34px #ff2a00; }
.m-logo.eight small { color: #ffc58a; }
.m-logo.mary b { color: #fff8d0; text-shadow: 0 0 6px #fff, 0 0 16px #5dff9e, 0 0 34px #0b9a52; }
.m-logo.mary small { color: #ffd34d; }
.fs-bar { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 18px; opacity: 0; pointer-events: none; transition: opacity .4s; }
.fs-count { font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 0 16px #c04dff; }
.fs-mult { font-family: var(--f-display); font-size: 18px; color: #ffd34d; padding: 4px 12px; border-radius: 10px; background: rgba(0, 0, 0, .5); }
.fs-won { font-family: var(--f-led); font-size: 22px; color: #ffe9a0; }
.mscr.fs .fs-bar { opacity: 1; }
.mscr.fs .lg-sign { opacity: 0; }

/* JP 看板 */
.jp-board { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 6px; }
.jp-plate { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 16px; padding: 0 20px; background: linear-gradient(180deg, #1d0838, #0a0118); border: 2px solid var(--c); box-shadow: 0 0 14px var(--cg), inset 0 0 20px rgba(0, 0, 0, .8); }
.jp-plate::before { content: ''; position: absolute; inset: 3px; border-radius: 13px; border: 1px solid rgba(255, 255, 255, .08); pointer-events: none; }
.jp-GRAND { --c: #ffd34d; --cg: rgba(255, 211, 77, .55); width: 640px; height: 72px; }
.jp-MAJOR { --c: #c06bff; --cg: rgba(192, 107, 255, .5); }
.jp-MINOR { --c: #5dff9e; --cg: rgba(93, 255, 158, .45); }
.jp-MINI { --c: #22e6ff; --cg: rgba(34, 230, 255, .45); }
.jp-lab { font-family: var(--f-display); font-size: 25px; color: var(--c); text-shadow: 0 0 10px var(--cg); }
.jp-num { font-family: var(--f-led); font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 0 12px var(--c); font-variant-numeric: tabular-nums; }
.jp-row { display: flex; gap: 8px; width: 640px; }
.jp-row .jp-plate { flex: 1; height: 54px; padding: 0 12px; min-width: 0; }
.jp-row .jp-lab { font-size: 15px; }
.jp-row .jp-num { font-size: 20px; }
.jp-board.n2 .jp-row .jp-num { font-size: 26px; }
.jp-board.n2 .jp-row .jp-lab { font-size: 19px; }
.jp-plate.hit { animation: jpHit .3s 10 alternate; }
@keyframes jpHit { to { background: var(--c); box-shadow: 0 0 40px var(--c); } }

/* 機台外框 */
.cab { position: relative; }
.cab-glow { position: absolute; inset: -16px; border-radius: 46px; background: radial-gradient(closest-side, rgba(255, 43, 214, .55), rgba(255, 43, 214, 0)); filter: blur(10px); }
.cab-rim { position: absolute; inset: 0; border-radius: 32px; background: linear-gradient(150deg, #fff6c8 0%, #ffd34d 18%, #c47a0c 42%, #ffe07a 64%, #a35a08 84%, #fff0b3 100%); box-shadow: 0 14px 40px rgba(0, 0, 0, .7), inset 0 0 0 2px rgba(0, 0, 0, .3); }
.cab-rim::after { content: ''; position: absolute; inset: 16px; border-radius: 20px; background: #0c0220; box-shadow: inset 0 0 0 2px #ff2bd6, inset 0 0 26px rgba(255, 43, 214, .5); transition: box-shadow .3s; }
.cab-bulbs { position: absolute; left: 8px; top: 8px; }
.cab-win { position: absolute; left: 22px; top: 22px; }
.cab.eight .cab-glow { background: radial-gradient(closest-side, rgba(255, 106, 0, .6), rgba(255, 106, 0, 0)); }
.cab.eight .cab-rim { background: linear-gradient(150deg, #fff0d0 0%, #ff9a3d 16%, #b3200f 40%, #ff7a2e 62%, #7a0a05 84%, #ffd0a0 100%); }
.cab.eight .cab-rim::after { background: #170402; box-shadow: inset 0 0 0 2px #ff7a2e, inset 0 0 26px rgba(255, 90, 0, .5); }
.cab.mary .cab-glow { background: radial-gradient(closest-side, rgba(93, 255, 158, .45), rgba(93, 255, 158, 0)); }
.cab.mary .cab-rim::after { background: #04140c; box-shadow: inset 0 0 0 2px #5dff9e, inset 0 0 26px rgba(25, 217, 122, .45); }
.cab.antic .cab-rim::after { box-shadow: inset 0 0 0 3px #ffd34d, inset 0 0 50px rgba(255, 211, 77, .7); }
.cab.antic .cab-glow { background: radial-gradient(closest-side, rgba(255, 211, 77, .8), rgba(255, 211, 77, 0)); animation: anticGlow .25s infinite alternate; }
@keyframes anticGlow { to { opacity: .55; } }
.mscr.fs .cab-rim::after { box-shadow: inset 0 0 0 3px #c06bff, inset 0 0 60px rgba(162, 60, 255, .8); }
.mscr.fs .cab-glow { background: radial-gradient(closest-side, rgba(162, 60, 255, .8), rgba(162, 60, 255, 0)); }
.cab-in { position: absolute; inset: 0; }
.cab-win.eight { position: absolute; }
.cab-win.mary { left: 18px; top: 18px; }

/* 轉輪 */
.reels { position: relative; }
.reel { position: absolute; top: 0; overflow: hidden; border-radius: 10px; background: linear-gradient(90deg, #12042a 0%, #2a0f52 50%, #12042a 100%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07); }
.cab.eight .reel { background: linear-gradient(90deg, #1c0503 0%, #3d0c06 50%, #1c0503 100%); }
.strip { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
.cell { position: relative; display: flex; align-items: center; justify-content: center; }
.cell .sym { width: 84%; height: 84%; }
.cell.blur .sym { opacity: .72; transform: scaleY(1.22); }
.reel-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(8, 2, 18, .86) 0%, rgba(8, 2, 18, .45) 8.5%, rgba(8, 2, 18, 0) 13%, rgba(8, 2, 18, 0) 87%, rgba(8, 2, 18, .45) 91.5%, rgba(8, 2, 18, .86) 100%); }
.reel.bump { animation: rbump .2s ease-out; }
@keyframes rbump { 40% { transform: translateY(5px); } }
.reel.antic { box-shadow: inset 0 0 0 3px #ffd34d, inset 0 0 30px rgba(255, 211, 77, .6); animation: anticR .18s infinite alternate; }
@keyframes anticR { to { box-shadow: inset 0 0 0 3px #fff6c8, inset 0 0 44px rgba(255, 211, 77, .9); } }
.reel.xcol { background: linear-gradient(180deg, #3a0d8c, #a23cff 50%, #3a0d8c); box-shadow: inset 0 0 0 3px #ff7af0, 0 0 26px #c04dff; }
.rwin { position: absolute; left: -6px; right: -6px; border-top: 3px solid rgba(255, 211, 77, .85); border-bottom: 3px solid rgba(255, 211, 77, .85); pointer-events: none; box-shadow: 0 -2px 10px rgba(255, 211, 77, .35), 0 2px 10px rgba(255, 211, 77, .35); }
.cab.eight .rwin { border-color: rgba(255, 154, 61, .85); }
.win-lines { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
.wl { animation: wlIn .35s ease-out; }
@keyframes wlIn { from { opacity: 0; } }
.reels.has-win .cell:not(.win) .sym { opacity: .4; }
.cell.win::before { content: ''; position: absolute; inset: 5px; border-radius: 14px; border: 3px solid #ffd34d; box-shadow: 0 0 16px #ffd34d, inset 0 0 16px rgba(255, 211, 77, .5); animation: winBox .6s ease-in-out infinite alternate; }
.cell.win .sym { animation: winSym .6s ease-in-out infinite alternate; }
@keyframes winBox { to { box-shadow: 0 0 30px #ffd34d, inset 0 0 26px rgba(255, 211, 77, .8); } }
@keyframes winSym { to { transform: scale(1.1); } }
.cell.land .sym { animation: land .55s cubic-bezier(.2, 1.6, .4, 1); filter: drop-shadow(0 0 12px #ffe066); }
@keyframes land { from { transform: scale(1.45); } }
.cell.rv-near::after { content: '安排的'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: 8px; background: #7ff3ff; color: #04121c; font-size: 15px; font-weight: 900; white-space: nowrap; z-index: 2; }
.cell.rv-near { outline: 3px dashed #7ff3ff; outline-offset: -6px; border-radius: 12px; }
.cell.rv-near.above::after { top: auto; bottom: 4px; transform: translateX(-50%); }
.cell.rv-near.below::after { top: 4px; transform: translateX(-50%); }
.cell.rv-near.rv-hide { outline: none; }
.cell.rv-near.rv-hide::after { display: none; }
.expand { position: absolute; left: 0; right: 0; z-index: 2; border-radius: 12px; border: 3px solid #ffd34d; background: linear-gradient(180deg, #ff7af0 0%, #a23cff 45%, #3a0d8c 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transform: scaleY(.33); opacity: 0; transition: transform .5s cubic-bezier(.2, 1.4, .4, 1), opacity .2s; box-shadow: 0 0 30px #c04dff; }
.expand.in { transform: none; opacity: 1; }
.xw-sym { width: 92px; height: 92px; }
.xw-sym .sym { width: 100%; height: 100%; }
.xw-txt { font-family: var(--f-display); font-size: 34px; line-height: 1; text-align: center; color: #ffe07a; text-shadow: 0 3px 0 #5a1a90; }
.reels.big .reel { animation: bigPulse .5s infinite alternate; }
@keyframes bigPulse { to { box-shadow: inset 0 0 30px rgba(255, 211, 77, .5); } }

/* 烈焰八線：線號燈 */
.lb { position: absolute; z-index: 3; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 17px; color: var(--c); background: #200403; border: 2px solid var(--c); box-shadow: inset 0 0 8px rgba(0, 0, 0, .8); transition: background .15s; }
.lb.on { background: var(--c); color: #1a0505; border-color: #fff; box-shadow: 0 0 18px var(--c), 0 0 0 3px #1a0505; animation: lbOn .3s 3 alternate; z-index: 4; }
@keyframes lbOn { to { transform: scale(1.25); } }

/* 贏分 */
.winbar { width: 688px; height: 66px; display: flex; align-items: center; gap: 14px; }
.wb-led { flex: none; width: 330px; height: 62px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; border-radius: 14px; background: #07010f; border: 2px solid #4a2d78; box-shadow: inset 0 0 22px #000; }
.wb-lab { font-size: 18px; font-weight: 700; color: var(--muted); }
.wb-num { font-family: var(--f-led); font-size: 34px; font-weight: 900; color: #3a2a55; font-variant-numeric: tabular-nums; }
.winbar.hot .wb-led { border-color: var(--gold); box-shadow: inset 0 0 22px #000, 0 0 18px rgba(255, 211, 77, .55); }
.winbar.hot .wb-num { color: #ffe066; text-shadow: 0 0 14px #ffb300; animation: numFlash .45s 4 alternate; }
@keyframes numFlash { to { color: #fff; } }
.wb-msg { flex: 1; min-width: 0; font-size: 21px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb-msg.hot { color: #fff; text-shadow: 0 0 12px #ff2bd6; }
.wb-msg.tease { color: var(--gold); animation: tease .5s 5 alternate; }
@keyframes tease { to { transform: scale(1.06); text-shadow: 0 0 16px #ffb300; } }

/* 揭密條 */
.rv-strip { width: 688px; max-height: 128px; overflow: auto; display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: 12px; background: rgba(2, 16, 26, .9); border: 1.5px dashed #7ff3ff; }
.rv-tag { flex: none; padding: 2px 8px; border-radius: 6px; font-size: 14px; font-weight: 900; background: #7ff3ff; color: #04121c; }
.rv-body { display: flex; flex-direction: column; gap: 4px; }
.rv-line { font-size: 15.5px; line-height: 1.45; color: #d8fbff; }
.rv-line.ldw { color: #ffd2ad; }
.rv-line.near { color: #ffbdf3; }
.rv-line.honey { color: #cfffbd; }
.rv-line.antic { color: #fff3a8; }
.rv-note { margin-top: 14px; padding: 10px 14px; border-radius: 12px; border: 1.5px dashed #7ff3ff; background: rgba(2, 16, 26, .8); color: #d8fbff; font-size: 16px; line-height: 1.5; }
.rv-note b { display: inline-block; margin-right: 8px; padding: 1px 8px; border-radius: 6px; background: #7ff3ff; color: #04121c; font-size: 14px; }

/* 操作區 */
.ctl { width: 688px; display: flex; align-items: center; gap: 16px; padding-bottom: 14px; }
.ctl-l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.bet-box { height: 82px; display: flex; align-items: center; padding: 0 8px; border-radius: 41px; background: linear-gradient(180deg, #2a1052, #12052a); border: 2px solid #7a5ab8; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .1), 0 6px 16px rgba(0, 0, 0, .5); }
.bet-step { flex: none; width: 64px; height: 64px; border-radius: 50%; font-size: 42px; font-weight: 900; line-height: 1; color: #fff; background: radial-gradient(circle at 42% 30%, #7a4ce0, #2c1066 80%); border: 2px solid #b39bff; box-shadow: 0 3px 0 #1a0640; }
.bet-step:active { transform: translateY(2px); box-shadow: none; }
.bet-step:disabled { opacity: .35; }
.bet-step.capped { filter: grayscale(.7); opacity: .6; }
.bet-mid { flex: 1; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.bet-mid small { font-size: 15px; color: var(--muted); }
.bet-val { font-family: var(--f-led); font-size: 30px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.bet-val.pop { animation: pop .25s; }
@keyframes pop { 50% { transform: scale(1.18); color: var(--gold); } }
.ctl-row { display: flex; gap: 10px; }
.pill-btn { flex: 1; min-width: 0; height: 56px; border-radius: 28px; font-family: var(--f-display); font-size: 18px; color: #fff; background: linear-gradient(180deg, #3a1a6a, #1c0a3c); border: 2px solid #8a6ac8; box-shadow: 0 3px 0 #12052a; }
.pill-btn:active { transform: translateY(2px); box-shadow: none; }
.pill-btn:disabled { opacity: .45; }
.pill-btn.max { color: var(--gold); border-color: var(--gold); }
.pill-btn.on { color: #04121c; background: linear-gradient(180deg, #bff7ff, #22e6ff 55%, #0b8fbf); border-color: #e6fdff; box-shadow: 0 0 16px rgba(34, 230, 255, .7); }
.ctl.locked .bet-step, .ctl.locked .pill-btn.max { opacity: .4; }
.spin-btn { position: relative; flex: none; width: 176px; height: 176px; padding: 0; border: none; border-radius: 50%; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.sp-ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, #ff2bd6, #ffd34d, #22e6ff, #a35cff, #ff2bd6); box-shadow: 0 0 28px rgba(255, 43, 214, .6); animation: ring 3.5s linear infinite; }
@keyframes ring { to { transform: rotate(360deg); } }
.sp-core { position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 50% 28%, #ff9cf3 0%, #e0109c 45%, #6e0056 100%); box-shadow: inset 0 8px 14px rgba(255, 255, 255, .5), inset 0 -12px 20px rgba(0, 0, 0, .55), 0 6px 0 #3a002e; transition: transform .08s; }
.spin-btn.press .sp-core { transform: scale(.93); }
.sp-lab { position: relative; font-family: var(--f-display); font-size: 42px; font-weight: 400; color: #fff; text-shadow: 0 3px 0 rgba(90, 0, 70, .9), 0 0 16px rgba(255, 255, 255, .5); line-height: 1; }
.sp-sub { position: relative; display: block; margin-top: 4px; font-size: 18px; font-weight: 900; color: #ffe6fa; min-height: 18px; }
.spin-btn[data-s="spin"] .sp-core { background: radial-gradient(circle at 50% 28%, #ffd0a0 0%, #ff6a1f 45%, #7a2a00 100%); }
.spin-btn[data-s="auto"] .sp-core { background: radial-gradient(circle at 50% 28%, #c8fbff 0%, #12a8d8 45%, #053a5a 100%); }
.spin-btn[data-s="fs"] .sp-core { background: radial-gradient(circle at 50% 28%, #e6c6ff 0%, #8a2bff 45%, #2c0758 100%); }
.spin-btn[data-s="spin"] .sp-ring, .spin-btn[data-s="fs"] .sp-ring { animation-duration: .7s; }
.spin-btn.go .sp-core { background: radial-gradient(circle at 50% 28%, #d4ffe6 0%, #19c46a 45%, #04502a 100%); }
.spin-btn.go:not(.ready) .sp-core { filter: grayscale(.6) brightness(.7); }
.auto-menu { position: absolute; z-index: 30; width: 336px; padding: 16px; border-radius: 20px; background: rgba(22, 7, 51, .97); border: 2px solid var(--cyan); box-shadow: 0 0 30px rgba(34, 230, 255, .4), 0 20px 40px rgba(0, 0, 0, .7); animation: pop .25s; }
.am-title { margin-bottom: 10px; font-size: 20px; font-weight: 900; }
.am-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.am-opt { height: 56px; border-radius: 14px; font-family: var(--f-display); font-size: 20px; background: linear-gradient(180deg, #3a1a6a, #1c0a3c); border: 2px solid #8a6ac8; }
.am-opt:last-child { grid-column: span 2; font-family: var(--f-zh); font-weight: 900; }
.am-foot { margin-top: 10px; font-size: 14px; color: var(--muted); }

/* 小瑪莉 */
.mm-board { position: relative; }
.lamp { position: absolute; width: 88px; height: 88px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #1d3a2a, #08130d 75%); border: 2px solid #2e5a40; transition: background .08s; }
.lamp .sym { width: 74%; height: 74%; opacity: .5; }
.lamp.small .sym { width: 56%; height: 56%; }
.lp-x { position: absolute; right: 6px; bottom: 3px; font-style: normal; font-family: var(--f-display); font-size: 13px; color: var(--gold); }
.lamp.lucky { border-color: #5dff9e; }
.lamp.on, .lamp.lit { background: radial-gradient(circle at 50% 40%, #fffbe0, #ffcf3d 45%, #c26a00 100%); border-color: #fff6c8; box-shadow: 0 0 24px #ffd34d, inset 0 0 8px #fff; z-index: 2; }
.lamp.on .sym, .lamp.lit .sym { opacity: 1; }
.lamp.t1 { background: radial-gradient(circle at 50% 40%, rgba(255, 207, 61, .7), #2a2008 80%); }
.lamp.t1 .sym { opacity: .85; }
.lamp.t2 { background: radial-gradient(circle at 50% 40%, rgba(255, 207, 61, .35), #141408 80%); }
.lamp.t2 .sym { opacity: .7; }
.lamp.hit { animation: lampHit .32s steps(1) infinite; }
@keyframes lampHit { 50% { background: radial-gradient(circle at 50% 40%, #ffffff, #ff7af0 55%, #8a0060 100%); box-shadow: 0 0 34px #ff2bd6; } }
.lamp.rv-near { outline: 3px dashed #7ff3ff; outline-offset: 3px; }
.mm-board.stars .lamp.lit { animation: lampHit .2s steps(1) infinite; }
.mm-center { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 14px; border-radius: 20px; background: radial-gradient(circle at 50% 30%, #0f3a26, #04140c 80%); border: 2px solid rgba(255, 211, 77, .4); box-shadow: inset 0 0 40px rgba(0, 0, 0, .8); }
.mm-leds { display: flex; gap: 10px; width: 100%; }
.mm-led { flex: 1; display: flex; flex-direction: column; padding: 6px 12px; border-radius: 10px; background: #050505; border: 2px solid #333; }
.mm-led span { font-size: 14px; color: #ffb3b3; }
.mm-led b { font-family: var(--f-led); font-size: 28px; text-align: right; color: #ff3b3b; text-shadow: 0 0 10px rgba(255, 0, 0, .7); font-variant-numeric: tabular-nums; }
.mm-led.win b { color: var(--gold); text-shadow: 0 0 10px #ffb300; }
.mm-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mm-dice { width: 168px; height: 112px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #050505; border: 3px solid #5a1a1a; box-shadow: inset 0 0 20px #000; }
.mm-dice b { font-family: var(--f-led); font-size: 82px; font-weight: 900; letter-spacing: 6px; color: #ff2a2a; text-shadow: 0 0 16px #ff0000; }
.mm-dice.w { border-color: var(--lime); animation: diceW .25s 6 alternate; }
.mm-dice.l { border-color: #555; }
.mm-dice.l b { color: #6a2a2a; text-shadow: none; }
@keyframes diceW { to { box-shadow: 0 0 34px var(--lime); } }
.mm-rule { font-size: 14px; color: rgba(201, 255, 223, .6); }
.mm-ev { min-height: 44px; font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0 0 16px #5dff9e; opacity: 0; }
.mm-ev.in { opacity: 1; animation: evPop .5s cubic-bezier(.2, 1.6, .4, 1); }
.mm-ev.big { color: #ffe066; text-shadow: 0 0 20px #ffb300; }
.mm-ev.eat { color: #ffb0b0; text-shadow: none; }
@keyframes evPop { from { transform: scale(.5); } }
.mm-g { display: flex; gap: 10px; width: 100%; }
.g-btn { flex: 1; height: 72px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; border: 2px solid; color: #fff; box-shadow: 0 4px 0 rgba(0, 0, 0, .5); }
.g-btn b { font-size: 24px; font-weight: 900; }
.g-btn small { font-size: 13px; opacity: .85; }
.g-btn.small { background: linear-gradient(180deg, #4fb3ff, #1350d8); border-color: #bfe6ff; }
.g-btn.big { background: linear-gradient(180deg, #ff6a7a, #d0103e); border-color: #ffc2cc; }
.g-btn.take { color: #4a2000; background: var(--gold-grad); border-color: #fff3b0; }
.g-btn:disabled { opacity: .3; filter: grayscale(.6); }
.mscr.mary.pending .g-btn:not(:disabled) { animation: gPulse .7s ease-in-out infinite alternate; }
@keyframes gPulse { to { box-shadow: 0 0 20px rgba(255, 255, 255, .6); transform: translateY(-2px); } }
.mm-bets { width: 688px; display: flex; gap: 6px; }
.mm-bets.nudge { animation: nudgeX .4s 2; }
@keyframes nudgeX { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.mb { flex: 1; min-width: 0; height: 128px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border-radius: 16px; background: linear-gradient(180deg, #17402b, #0a1f15); border: 2px solid #2e6a48; box-shadow: 0 4px 0 #031009; }
.mb:active { transform: translateY(3px); box-shadow: none; }
.mb.on { border-color: var(--gold); box-shadow: 0 0 14px rgba(255, 211, 77, .5), 0 4px 0 #031009; }
.mb.pop { animation: pop .22s; }
.mb-odds { font-style: normal; font-family: var(--f-display); font-size: 15px; color: var(--gold); }
.mb-art { width: 54px; height: 54px; }
.mb-art .sym { width: 100%; height: 100%; }
.mb-n { min-width: 50px; padding: 0 6px; border-radius: 6px; text-align: center; font-family: var(--f-led); font-size: 22px; color: #ff3b3b; background: #050505; text-shadow: 0 0 8px #f00; }
.ctl.mary .spin-btn { width: 164px; height: 164px; }
.pill-btn.unit { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.pill-btn.unit small { font-family: var(--f-zh); font-size: 12px; color: var(--muted); }
.pill-btn.unit b { font-family: var(--f-led); font-size: 16px; font-weight: 700; }
.mm-total { flex: 1; min-width: 0; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; border-radius: 28px; background: #050505; border: 2px solid #333; }
.mm-total small { font-size: 12px; color: #aaa; }
.mm-total b { font-family: var(--f-led); font-size: 21px; color: var(--gold); }
.mscr.mary.busy .mb, .mscr.mary.busy .pill-btn:not(.auto) { opacity: .55; }

/* ---------- 全螢幕演出 ---------- */
.ov { position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(circle at 50% 45%, rgba(40, 8, 70, .82), rgba(3, 0, 8, .93) 70%); opacity: 0; transition: opacity .3s; overflow: hidden; }
.ov.in { opacity: 1; }
.ov.out { opacity: 0; }
.rays { position: absolute; left: 50%; top: 46%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; background: repeating-conic-gradient(from 0deg, rgba(255, 211, 77, .22) 0deg 7deg, rgba(255, 211, 77, 0) 7deg 18deg); -webkit-mask: radial-gradient(circle, #000 0%, transparent 62%); mask: radial-gradient(circle, #000 0%, transparent 62%); animation: rays 14s linear infinite; }
@keyframes rays { to { transform: rotate(360deg); } }
.bw-box, .fs-box, .lv-box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translateY(-30px); }
.bw-en { font-family: var(--f-display); font-size: 94px; line-height: 1; white-space: nowrap; background: linear-gradient(180deg, #fffbe0 0%, #ffe066 35%, #ff9a1f 70%, #c2410c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 #5a1a00) drop-shadow(0 0 26px rgba(255, 179, 0, .9)); }
.bw-en.pop { animation: bwPop .6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bwPop { from { transform: scale(.4); } }
.bigwin.t1 .bw-en { background-image: linear-gradient(180deg, #fff 0%, #ff9cf3 35%, #ff2bd6 70%, #8a0060 100%); filter: drop-shadow(0 6px 0 #4a0036) drop-shadow(0 0 30px rgba(255, 43, 214, .9)); }
.bigwin.t2 .bw-en { background-image: linear-gradient(180deg, #fff 0%, #bff7ff 30%, #22e6ff 60%, #1350d8 100%); filter: drop-shadow(0 6px 0 #062a5a) drop-shadow(0 0 34px rgba(34, 230, 255, .9)); }
.bigwin.t3 .bw-en, .bigwin.jp .bw-en { background-image: linear-gradient(90deg, #ff2bd6, #ffd34d, #5dff9e, #22e6ff, #a35cff, #ff2bd6); background-size: 300% 100%; animation: rainbow 2s linear infinite; filter: drop-shadow(0 6px 0 #2a0050) drop-shadow(0 0 36px rgba(255, 255, 255, .7)); }
@keyframes rainbow { to { background-position: 300% 0; } }
.bigwin.t1 .rays { background: repeating-conic-gradient(from 0deg, rgba(255, 43, 214, .25) 0deg 7deg, rgba(255, 43, 214, 0) 7deg 18deg); }
.bigwin.t2 .rays { background: repeating-conic-gradient(from 0deg, rgba(34, 230, 255, .25) 0deg 7deg, rgba(34, 230, 255, 0) 7deg 18deg); }
.bigwin.t3 .rays, .bigwin.jp .rays { background: repeating-conic-gradient(from 0deg, rgba(255, 211, 77, .3) 0deg 5deg, rgba(255, 43, 214, .2) 5deg 10deg, rgba(0, 0, 0, 0) 10deg 18deg); animation-duration: 7s; }
.bw-zh { font-size: 40px; font-weight: 900; letter-spacing: 10px; color: #fff; text-shadow: 0 0 18px #ff2bd6; }
.bw-num { margin-top: 16px; font-family: var(--f-led); font-size: 74px; font-weight: 900; color: #fff; text-shadow: 0 0 22px #ffd34d, 0 4px 0 #7a4204; font-variant-numeric: tabular-nums; }
.bigwin.done .bw-num { animation: numDone .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes numDone { 40% { transform: scale(1.18); } }
.bw-tap { position: absolute; bottom: 9%; font-size: 19px; color: rgba(255, 255, 255, .6); }
.jw-title { font-family: var(--f-display); font-size: 52px; line-height: 1; background: linear-gradient(180deg, #fffbe0, #ffd34d 50%, #c2410c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #5a1a00) drop-shadow(0 0 20px rgba(255, 179, 0, .8)); }
.jw-wrap { position: relative; width: 540px; height: 540px; }
.jw-wheel, .jw-wheel svg { width: 100%; height: 100%; display: block; }
.jw-bulb { animation: bulbA .5s steps(1) infinite; }
.jw-hub { position: absolute; left: 50%; top: 50%; width: 118px; height: 118px; margin: -59px 0 0 -59px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 36px; color: #7a2a00; background: var(--gold-grad); border: 3px solid #5a2a00; box-shadow: 0 0 0 5px #14051f, 0 0 26px rgba(255, 211, 77, .7); z-index: 2; }
.ov.jpwheel { background: radial-gradient(circle at 50% 45%, rgba(40, 8, 70, .94), rgba(3, 0, 8, .97) 70%); }
.jw-ptr { position: absolute; left: 50%; top: -22px; width: 64px; margin-left: -32px; z-index: 2; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
.jw-ptr svg { width: 100%; display: block; }
.jw-vals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 600px; }
.jv { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-radius: 12px; background: rgba(8, 2, 18, .9); border: 2px solid rgba(255, 255, 255, .15); }
.jv b { font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.jv span { font-family: var(--f-led); font-size: 20px; color: #fff; }
.jv-GRAND b { color: var(--gold); } .jv-MAJOR b { color: #c06bff; } .jv-MINOR b { color: var(--lime); } .jv-MINI b { color: var(--cyan); }
.jv.hit { border-color: var(--gold); box-shadow: 0 0 24px var(--gold); animation: pop .4s 3; }
.fs-en { font-family: var(--f-display); font-size: 92px; line-height: 1; background: linear-gradient(180deg, #fff, #e6c6ff 30%, #c06bff 60%, #5a13a8); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 #2a0050) drop-shadow(0 0 30px rgba(192, 107, 255, .9)); animation: bwPop .7s cubic-bezier(.2, 1.6, .4, 1); }
.fs-zh { font-size: 42px; font-weight: 900; letter-spacing: 10px; color: #fff; text-shadow: 0 0 18px #c04dff; }
.fs-n { font-family: var(--f-led); font-size: 80px; font-weight: 900; color: var(--gold); text-shadow: 0 0 24px #ffb300; }
.fs-rule { font-size: 22px; color: #f1e6ff; }
.lv-en { font-family: var(--f-display); font-size: 84px; line-height: 1; background: linear-gradient(180deg, #fff, #bff7ff 30%, #22e6ff 60%, #1350d8); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #062a5a) drop-shadow(0 0 26px rgba(34, 230, 255, .9)); animation: bwPop .7s cubic-bezier(.2, 1.6, .4, 1); }
.lv-n { font-family: var(--f-display); font-size: 64px; color: #fff; text-shadow: 0 0 20px #22e6ff; }
.lv-reward { font-family: var(--f-led); font-size: 46px; font-weight: 900; color: var(--gold); text-shadow: 0 0 18px #ffb300; }
.lv-line { font-size: 24px; font-weight: 700; color: #f1e6ff; }
.lv-line.hot { color: #ffb3f0; font-size: 30px; font-weight: 900; text-shadow: 0 0 14px #ff2bd6; animation: tease .5s 6 alternate; }
.stk-pop { position: absolute; left: 50%; top: 104px; width: 360px; margin-left: -180px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 18px; background: rgba(22, 7, 51, .96); border: 2.5px solid #c0c8e0; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); animation: stkIn .45s cubic-bezier(.2, 1.5, .4, 1); }
.stk-pop.r1 { border-color: #4fb3ff; box-shadow: 0 0 22px rgba(79, 179, 255, .6); }
.stk-pop.r2 { border-color: var(--gold); box-shadow: 0 0 28px rgba(255, 211, 77, .8); }
.stk-pop.out { transition: transform .4s, opacity .4s; transform: translateY(-30px); opacity: 0; }
@keyframes stkIn { from { transform: translateY(-40px) scale(.8); opacity: 0; } }
.stk-art { flex: none; width: 70px; height: 70px; border-radius: 12px; background: radial-gradient(#3a1a6a, #12052a); padding: 6px; }
.stk-art .sym { width: 100%; height: 100%; }
.stk-txt { display: flex; flex-direction: column; line-height: 1.25; }
.stk-txt small { font-size: 14px; color: var(--muted); }
.stk-txt b { font-size: 22px; font-weight: 900; }
.stk-txt span { font-size: 15px; color: var(--gold); }

/* ---------- 對話框 ---------- */
.modal { position: absolute; inset: 0; z-index: 22; display: flex; align-items: center; justify-content: center; background: rgba(5, 1, 12, .78); opacity: 0; transition: opacity .25s; }
.modal.in { opacity: 1; }
.modal.out { opacity: 0; }
.modal.locked .m-x { visibility: hidden; }
.m-card { width: 664px; max-height: calc(var(--colH, 1280px) - 110px); display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; background: linear-gradient(180deg, #24094e, #12042a); border: 3px solid var(--gold); box-shadow: 0 0 0 6px #12042a, 0 0 44px rgba(255, 43, 214, .45), 0 30px 60px rgba(0, 0, 0, .8); transform: scale(.9); transition: transform .3s cubic-bezier(.2, 1.4, .4, 1); }
.modal.in .m-card { transform: none; }
.m-head { position: relative; flex: none; height: 74px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #3d1078, #24094e); border-bottom: 2px solid rgba(255, 211, 77, .4); }
.m-head h3 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 0 0 14px #ff2bd6; }
.m-x { position: absolute; right: 12px; top: 11px; width: 52px; height: 52px; border-radius: 50%; font-size: 24px; font-weight: 900; color: #fff; background: linear-gradient(180deg, #ff6a7a, #b3102e); border: 2px solid #ffc2cc; }
.m-card > :last-child { padding: 20px 22px 24px; overflow-y: auto; overscroll-behavior: contain; }

/* 連續簽到 */
.streak { display: flex; flex-direction: column; gap: 16px; }
.sk-note, .sk-warn { text-align: center; font-size: 19px; color: var(--muted); }
.sk-warn { color: #ffb0b0; font-weight: 700; padding: 8px; border-radius: 12px; background: rgba(90, 10, 36, .6); border: 1.5px solid #ff4f7a; }
.sk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sk-day { position: relative; height: 138px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 16px; background: linear-gradient(180deg, #2c1060, #160733); border: 2px solid #5a3a8a; }
.sk-day small { font-size: 15px; color: var(--muted); }
.sk-day b { font-family: var(--f-led); font-size: 21px; color: var(--gold); }
.sk-day.big { grid-column: span 2; background: linear-gradient(180deg, #5a1a8a, #2a0a50); border-color: var(--gold); }
.sk-day.big b { font-size: 30px; }
.sk-day.today { border-color: var(--gold); box-shadow: 0 0 22px rgba(255, 211, 77, .7); animation: today 1s ease-in-out infinite alternate; }
@keyframes today { to { transform: translateY(-4px); } }
.sk-check { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; border-radius: 14px; font-style: normal; font-size: 64px; font-weight: 900; color: var(--lime); background: rgba(5, 20, 12, .6); text-shadow: 0 0 16px var(--lime); }
.sk-day.done .sk-check { display: flex; }
.sk-day.pop { animation: pop .4s; }
/* 轉盤 */
.wheel { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.wh-wrap { position: relative; width: 560px; height: 560px; }
.wh-wheel, .wh-svg { display: block; width: 100%; height: 100%; }
.wh-rot { transform-box: view-box; transform-origin: 0 0; }
.wh-seg.win { animation: segWin .3s 8 alternate; }
@keyframes segWin { to { filter: brightness(1.8); } }
.wb { fill: #fff3c4; }
.wb.b0 { animation: bulbA .8s steps(1) infinite; }
.wb.b1 { animation: bulbA .8s steps(1) infinite -.4s; }
.wh-ptr { position: absolute; left: 50%; top: -14px; width: 70px; margin-left: -35px; transform-origin: 50% 20%; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
.wh-ptr svg { display: block; width: 100%; }
.wh-ptr.flick { animation: flick .12s; }
@keyframes flick { 50% { transform: rotate(-14deg); } }
.wh-hub { position: absolute; left: 50%; top: 50%; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; font-size: 38px; font-weight: 900; color: #4a2000; background: var(--gold-grad); border: 4px solid #6b3a00; box-shadow: 0 0 0 5px #12041f, 0 0 26px rgba(255, 211, 77, .8); animation: startPulse 1.2s ease-in-out infinite; }
.wh-hub:disabled { animation: none; font-size: 26px; filter: grayscale(.4); }
.wh-msg { font-size: 21px; color: var(--muted); text-align: center; }
.wh-msg.hit { font-size: 28px; font-weight: 900; color: var(--gold); text-shadow: 0 0 14px #ffb300; }
/* 任務 */
.missions { display: flex; flex-direction: column; gap: 12px; }
.ms-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: rgba(40, 12, 80, .7); border: 2px solid #4a2d78; }
.ms-row.ready { border-color: var(--gold); box-shadow: 0 0 16px rgba(255, 211, 77, .4); }
.ms-row.claimed { opacity: .55; }
.ms-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.ms-text { font-size: 20px; font-weight: 700; }
.ms-bar { position: relative; height: 22px; border-radius: 11px; overflow: hidden; background: #0c0218; border: 1.5px solid #5a3a8a; }
.ms-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 11px; background: linear-gradient(90deg, #22e6ff, #5dff9e); }
.ms-bar span { position: absolute; inset: 0; text-align: center; font-family: var(--f-led); font-size: 12px; line-height: 19px; color: #fff; text-shadow: 0 1px 2px #000; }
.ms-side { flex: none; width: 128px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ms-rew { display: flex; align-items: center; gap: 6px; }
.ms-rew b { font-family: var(--f-led); font-size: 19px; color: var(--gold); }
.ms-side button { width: 100%; }
.ms-chest { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 16px; background: rgba(90, 20, 40, .5); border: 2px dashed #ff7a8a; }
.ms-chest.ready { border-style: solid; border-color: var(--gold); box-shadow: 0 0 22px rgba(255, 211, 77, .6); }
.ms-chest button { flex: 1; }
.chest-ico { flex: none; width: 76px; height: 70px; }
.chest-ico svg { width: 100%; height: 100%; }
.ms-chest.ready .chest-ico { animation: nudge .8s infinite; }
.ms-foot { text-align: center; font-size: 15px; color: var(--muted); }
/* 收集冊 */
.album { display: flex; flex-direction: column; gap: 14px; }
.al-tabs { display: flex; gap: 8px; }
.al-tab { position: relative; flex: 1; height: 62px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; font-size: 19px; font-weight: 900; background: rgba(40, 12, 80, .7); border: 2px solid #4a2d78; }
.al-tab small { font-family: var(--f-led); font-size: 13px; color: var(--muted); }
.al-tab.on { border-color: var(--gold); background: linear-gradient(180deg, #5a1a8a, #2a0a50); }
.al-tab.ready::after { content: '!'; position: absolute; right: -6px; top: -8px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; background: #ff2b4f; color: #fff; }
.al-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    [6.4, 7.5, 4.5, 5.5, 6.5, 7, 8, 14, 14, 18, 18, 20],
    [6.4, 6.6, 4.5, 5.5, 6.5, 7, 8, 14, 14, 18, 18, 20],
    [6.4, 2.6, 4.5, 5.5, 6.5, 7, 8, 14, 14, 18, 18, 20],
    [0, 2.2, 4.5, 5.5, 6.5, 7, 8, 14, 14, 18, 18, 20],
  ];
  const T_FS = [
    [0, 4, 3, 4, 5, 6, 7, 14, 14, 18, 18, 20],
    [2.4, 4, 3, 4, 5, 6, 7, 14, 14, 18, 18, 20],
    [2.4, 3.4, 3, 4, 5, 6, 7, 14, 14, 18, 18, 20],
    [2.4, 1.5, 3, 4, 5, 6, 7, 14, 14, 18, 18, 20],
    [0, 1.3, 3, 4, 5, 6, 7, 14, 14, 18, 18, 20],
  ];
  // 神秘 JP
  const JP_Q = { normal: 1 / 1900, honey: 1 / 900 };
  const JP_TIERS = [ // name, 倍數（× 總押注）, 權重
    { id: 'MINI', name: 'MINI', mult: 20, w: 56 },
    { id: 'MINOR', name: 'MINOR', mult: 60, w: 30 },
    { id: 'MAJOR', name: 'MAJOR', mult: 300, w: 11 },
    { id: 'GRAND', name: 'GRAND', mult: 1500, w: 3 },
  ];

  const sums = (t) => t.map((w) => w.reduce((a, b) => a + b, 0));
  const TOT = { normal: sums(T_NORMAL), honey: sums(T_HONEY), fs: sums(T_FS) };
  const TAB = { normal: T_NORMAL, honey: T_HONEY, fs: T_FS };

  function cell(table, tot, reel) { return SYMS[R.weighted(table[reel], tot[reel])]; }
  function drawGrid(kind) {
    const t = TAB[kind], tot = TOT[kind];
    const g = [];
    for (let r = 0; r < 5; r++) {
      const col = [];
      let hasS = false;
      for (let row = 0; row < 3; row++) {
        let s = cell(t, tot, r);
        while ((s === 'S' && hasS) || (s === 'W' && col.includes('W'))) s = cell(t, tot, r); // 每輪最多一個 BONUS、一個百搭
        if (s === 'S') hasS = true;
        col.push(s);
      }
      g.push(col);
    }
    return g;
  }

  function evaluate(g, bet, fs) {
    const lineBet = bet / LINES.length;
    const wins = [];
    let total = 0;
    for (let li = 0; li < LINES.length; li++) {
      const L = LINES[li];
      let target = null, n = 0;
      for (let r = 0; r < 5; r++) {
        const s = g[r][L[r]];
        if (s === 'S') break;
        if (s === 'W') { n++; continue; }
        if (target === null) { target = s; n++; continue; }
        if (s === target) { n++; continue; }
        break;
      }
      if (!target) continue;
      const m = PAY[target][n] || 0;
      if (m > 0) {
        const amt = m * lineBet * (fs ? FS_MULT : 1);
        wins.push({ line: li, sym: target, n, amount: amt, cells: L.slice(0, n).map((row, r) => [r, row]) });
        total += amt;
      }
    }
    const scat = [];
    for (let r = 0; r < 5; r++) for (let row = 0; row < 3; row++) if (g[r][row] === 'S') scat.push([r, row]);
    let scatWin = 0, fsAward = 0;
    if (scat.length >= 3) {
      scatWin = SCAT_PAY[Math.min(5, scat.length)] * bet * (fs ? FS_MULT : 1);
      fsAward = FS_AWARD[Math.min(5, scat.length)];
      total += scatWin;
    }
    return { wins, total, scat, scatWin, fsAward };
  }

  // 一次轉動（主遊戲或免費遊戲）。mode: 'normal' | 'honey'
  function spin(bet, mode, fs) {
    const kind = fs ? 'fs' : (mode === 'honey' ? 'honey' : 'normal');
    const raw = drawGrid(kind);
    let grid = raw, expanded = [];
    if (fs) {
      grid = raw.map((col, r) => (col.includes('W') ? (expanded.push(r), ['W', 'W', 'W']) : col));
    }
    const ev = evaluate(grid, bet, fs);
    let jp = null;
    if (!fs && R.random() < JP_Q[mode === 'honey' ? 'honey' : 'normal']) {
      const t = JP_TIERS[R.weighted(JP_TIERS.map((x) => x.w))];
      jp = { tier: t.id, name: t.name, mult: t.mult };
    }
    return { machine: ID, raw, grid, expanded, fs: !!fs, bet, ...ev, jp };
  }

  // 停輪前的期待感：已經出現兩個 BONUS，後面的輪都會放慢；四連大寶石時最後一輪也會放慢
  function anticipation(res) {
    const slow = new Array(5).fill(false);
    let s = 0;
    for (let r = 0; r < 5; r++) {
      if (s >= 2) slow[r] = true;
      if (res.raw[r].includes('S')) s++;
    }
    if (!slow[4]) for (const w of res.wins) if (w.n === 4 && HIGH.includes(w.sym)) slow[4] = true;
    return slow;
  }

  // 框外的「露出一角」：一般是隨機的；條件符合時故意放上差一點的符號
  function decorate(res) {
    const kind = res.fs ? 'fs' : 'normal';
    const peek = [];
    for (let r = 0; r < 5; r++) {
      let a = cell(TAB[kind], TOT[kind], r), b = cell(TAB[kind], TOT[kind], r);
      if (a === 'S' && res.raw[r].includes('S')) a = 'Q';
      if (b === 'S' && res.raw[r].includes('S')) b = 'J';
      peek.push([a, b]);
    }
    const near = [];
    if (res.scat.length === 2) {
      // 兩個 BONUS：讓沒有 BONUS 的最後一輪，在框上緣「差一格」露出第三個
      for (let r = 4; r >= 0; r--) if (!res.raw[r].includes('S')) { peek[r][0] = 'S'; near.push({ reel: r, sym: 'S', at: 'above', why: '第三個 BONUS 停在框外一格' }); break; }
    }
    for (const w of res.wins) {
      if (w.n === 4 && HIGH.includes(w.sym) && !near.length) {
        peek[4][w.cells[3][1] === 2 ? 1 : 0] = w.sym;
        near.push({ reel: 4, sym: w.sym, at: w.cells[3][1] === 2 ? 'below' : 'above', why: '第五顆' + NAMES[w.sym] + '就差一格' });
      }
    }
    return { peek, near };
  }

  return { ID, NAMES, LINES, PAY, SCAT_PAY, FS_AWARD, FS_MULT, SYMS, HIGH, JP_TIERS, JP_Q, spin, evaluate, anticipation, decorate, drawGrid, TAB };
})();

// ===== src/machines/eight.js =====
/* 烈焰八線：3 × 3 九宮格、8 條線（三橫、三直、兩斜）。
   王冠連成一線 → 轉 JP 轉盤；櫻桃從每列最左邊開始算；九格全是水果 → 全盤獎。 */
BYC.eight = (function () {
  const R = BYC.rng;
  const ID = 'eight';
  const SYMS = ['CR', 'R7', 'B7', 'BAR', 'ST', 'BL', 'WM', 'GR', 'OR', 'CH'];
  const NAMES = { CR: '王冠', R7: '紅七', B7: '藍七', BAR: 'BAR', ST: '星星', BL: '鈴鐺', WM: '西瓜', GR: '葡萄', OR: '柳橙', CH: '櫻桃' };
  // 線：[ [col,row] × 3 ]，編號照機台上的數字
  const LINES = [
    { no: 1, cells: [[0, 1], [1, 1], [2, 1]] }, // 中列
    { no: 2, cells: [[0, 0], [1, 0], [2, 0]] }, // 上列
    { no: 3, cells: [[0, 2], [1, 2], [2, 2]] }, // 下列
    { no: 4, cells: [[0, 0], [1, 1], [2, 2]] }, // 斜
    { no: 5, cells: [[0, 2], [1, 1], [2, 0]] }, // 斜
    { no: 6, cells: [[0, 0], [0, 1], [0, 2]] }, // 左直
    { no: 7, cells: [[1, 0], [1, 1], [1, 2]] }, // 中直
    { no: 8, cells: [[2, 0], [2, 1], [2, 2]] }, // 右直
  ];
  const PAY3 = { R7: 550, B7: 320, BAR: 170, ST: 110, BL: 65, WM: 55, GR: 32, OR: 27, CH: 21 };
  const ANY7 = 110;
  const CHERRY_ROW = [0, 1, 3]; // 每列最左邊 1／2 個櫻桃
  const FRUITS = ['WM', 'GR', 'OR', 'CH'];
  const ALLFRUIT = 5; // × 總押注
  const JP_TIERS = [
    { id: 'MINOR', name: 'MINOR', mult: 50, w: 68 },
    { id: 'MAJOR', name: 'MAJOR', mult: 250, w: 26 },
    { id: 'GRAND', name: 'GRAND', mult: 1000, w: 6 },
  ];
  // 各輪（直行）權重：王冠前兩輪多、第三輪少（兩個王冠等第三個的「差一點」就是這樣來的）
  const T = {
    normal: [
      [8, 2.2, 3, 5, 7, 9, 12, 14, 15, 11],
      [8, 2.2, 3, 5, 7, 9, 12, 14, 15, 11],
      [1.2, 2.2, 3, 5, 7, 9, 12, 14, 15, 11],
    ],
    honey: [
      [9, 3.6, 4.6, 7, 9, 10, 12, 14, 15, 12],
      [9, 3.6, 4.6, 7, 9, 10, 12, 14, 15, 12],
      [3.2, 3.6, 4.6, 7, 9, 10, 12, 14, 15, 12],
    ],
  };
  const TOT = {};
  for (const k in T) TOT[k] = T[k].map((w) => w.reduce((a, b) => a + b, 0));

  function cell(kind, col) { return SYMS[R.weighted(T[kind][col], TOT[kind][col])]; }
  function drawGrid(kind) {
    const g = [];
    for (let c = 0; c < 3; c++) {
      const col = [];
      for (let r = 0; r < 3; r++) {
        let s = cell(kind, c);
        while (s === 'CR' && col.includes('CR')) s = cell(kind, c); // 每一輪最多一個王冠
        col.push(s);
      }
      g.push(col);
    }
    return g; // g[col][row]
  }

  function evaluate(g, bet) {
    const lineBet = bet / 8;
    const wins = [];
    let total = 0, jpLine = null;
    for (const L of LINES) {
      const s = L.cells.map(([c, r]) => g[c][r]);
      if (s[0] === 'CR' && s[1] === 'CR' && s[2] === 'CR') { if (!jpLine) jpLine = L; continue; }
      if (s[0] === s[1] && s[1] === s[2] && PAY3[s[0]]) {
        const amt = PAY3[s[0]] * lineBet;
        wins.push({ line: L.no, sym: s[0], n: 3, amount: amt, cells: L.cells });
        total += amt;
      } else if (s.every((x) => x === 'R7' || x === 'B7')) {
        const amt = ANY7 * lineBet;
        wins.push({ line: L.no, sym: 'ANY7', n: 3, amount: amt, cells: L.cells });
        total += amt;
      } else if (L.no <= 3) {
        // 櫻桃：橫列由左往右
        let k = 0;
        while (k < 2 && s[k] === 'CH') k++;
        if (k > 0 && !(k === 2 && s[2] === 'CH')) {
          const amt = CHERRY_ROW[k] * lineBet;
          wins.push({ line: L.no, sym: 'CH', n: k, amount: amt, cells: L.cells.slice(0, k) });
          total += amt;
        }
      }
    }
    let allFruit = false;
    if (g.every((col) => col.every((x) => FRUITS.includes(x)))) { allFruit = true; total += ALLFRUIT * bet; }
    return { wins, total, jpLine, allFruit };
  }

  function once(bet, kind) {
    const grid = drawGrid(kind);
    const ev = evaluate(grid, bet);
    let jp = null;
    if (ev.jpLine) {
      const t = JP_TIERS[R.weighted(JP_TIERS.map((x) => x.w))];
      jp = { tier: t.id, name: t.name, mult: t.mult, line: ev.jpLine.no };
    }
    return { machine: ID, grid, raw: grid, bet, ...ev, jp };
  }
  const value = (r) => r.total + (r.jp ? r.jp.mult * r.bet : 0);
  // 蜜月期：輸的那一把，有一定機率偷偷重抽一次、取比較好的結果
  const HONEY_REDRAW = 0.33;
  function spin(bet, mode) {
    const kind = mode === 'honey' ? 'honey' : 'normal';
    let r = once(bet, 'normal');
    if (kind === 'honey' && value(r) < bet && R.random() < HONEY_REDRAW) {
      const r2 = once(bet, 'honey');
      if (value(r2) > value(r)) { r = r2; r.boosted = true; }
    }
    return r;
  }

  // 前兩輪在同一條線上有兩個王冠 → 第三輪放慢
  function twoCrownLines(g) {
    const out = [];
    for (const L of LINES) {
      const s = L.cells.map(([c, r]) => g[c][r]);
      if (L.no >= 6) continue; // 直線三格在同一輪，不算
      if (s[0] === 'CR' && s[1] === 'CR') out.push(L);
    }
    return out;
  }
  function anticipation(res) {
    const slow = [false, false, false];
    if (twoCrownLines(res.grid).length) slow[2] = true;
    return slow;
  }
  function decorate(res) {
    const peek = [];
    for (let c = 0; c < 3; c++) peek.push([cell('normal', c), cell('normal', c)].map((x) => (x === 'CR' ? 'BL' : x)));
    const near = [];
    if (!res.jp) {
      const L = twoCrownLines(res.grid).find((x) => res.grid[2][x.cells[2][1]] !== 'CR');
      if (L) {
        const row = L.cells[2][1];
        const at = row === 2 ? 'below' : 'above';
        peek[2][at === 'above' ? 0 : 1] = 'CR';
        near.push({ reel: 2, sym: 'CR', at, line: L.no, why: '第三個王冠停在框外一格' });
      }
    }
    return { peek, near };
  }

  return { ID, SYMS, NAMES, LINES, PAY3, ANY7, CHERRY_ROW, ALLFRUIT, JP_TIERS, spin, evaluate, anticipation, decorate };
})();

// ===== src/machines/mary.js =====
/* 金幣小瑪莉：外圈 24 盞燈、8 種水果押注。燈跑完停在哪盞，押那個水果的就照倍數賠。
   停在 LUCKY 會「送燈」：吃燈、送一兩盞、天女散花、開火車、大小三元、大四喜、縱橫四海，最稀有的是滿天星。
   中獎後可以比大小（1–13：小 1–6、大 8–13，開 7 莊家贏）。 */
BYC.mary = (function () {
  const R = BYC.rng;
  const ID = 'mary';
  const BETS = ['BAR', '77', 'ST', 'WM', 'BL', 'MG', 'OR', 'AP']; // 押注鈕順序
  const NAMES = { BAR: 'BAR', '77': '雙七', ST: '星星', WM: '西瓜', BL: '鈴鐺', MG: '芒果', OR: '橘子', AP: '蘋果', LUCKY: 'LUCKY' };
  const ODDS = { BAR: 100, '77': 40, ST: 30, WM: 20, BL: 20, MG: 15, OR: 10, AP: 5 };
  const ODDS_SMALL = { BAR: 50, '77': 2, ST: 2, WM: 2, BL: 2, MG: 2, OR: 2, AP: 2 };
  // 外圈 24 盞（順時針，從左上角開始）。small＝小圖（賠率較低）
  const LAMPS = [
    { s: 'OR' }, { s: 'BL' }, { s: 'BAR', small: true }, { s: 'BAR' }, { s: 'AP' }, { s: 'AP', small: true }, { s: 'MG' },
    { s: 'WM' }, { s: 'WM', small: true }, { s: 'LUCKY' }, { s: 'AP' }, { s: 'OR', small: true },
    { s: 'OR' }, { s: 'BL' }, { s: '77', small: true }, { s: '77' }, { s: 'AP' }, { s: 'MG', small: true }, { s: 'MG' },
    { s: 'ST' }, { s: 'ST', small: true }, { s: 'LUCKY' }, { s: 'AP' }, { s: 'BL', small: true },
  ];
  const odds = (L) => (L.s === 'LUCKY' ? 0 : L.small ? ODDS_SMALL[L.s] : ODDS[L.s]);
  const CORNERS = [0, 6, 12, 18];
  const HIGH_LAMPS = [3, 15]; // BAR、雙七（「差一點」的目標）

  // 機率：大圖、小圖、LUCKY 依設計比例分配
  function build(rBigMap, rSmall, pLucky) {
    const p = new Array(24).fill(0);
    const byBig = {}, bySmall = {};
    LAMPS.forEach((L, i) => { if (L.s === 'LUCKY') return; (L.small ? bySmall : byBig)[L.s] = ((L.small ? bySmall : byBig)[L.s] || []).concat(i); });
    for (const s of BETS) {
      if (byBig[s]) for (const i of byBig[s]) p[i] = rBigMap[s] / ODDS[s] / byBig[s].length;
      if (bySmall[s]) for (const i of bySmall[s]) p[i] = rSmall / ODDS_SMALL[s] / bySmall[s].length;
    }
    const used = p.reduce((a, b) => a + b, 0);
    const scale = (1 - pLucky) / used;
    for (let i = 0; i < 24; i++) p[i] = LAMPS[i].s === 'LUCKY' ? pLucky / 2 : p[i] * scale;
    return p;
  }
  // 各水果的大圖回收比例（調到單押任何一種都差不多 90%）
  const R_BIG = { BAR: 0.445, '77': 0.6, ST: 0.592, WM: 0.64, BL: 0.555, MG: 0.58, OR: 0.606, AP: 0.615 };
  const P = { normal: build(R_BIG, 0.18, 0.072), honey: build(Object.fromEntries(Object.entries(R_BIG).map(([k, v]) => [k, v * 1.3])), 0.2, 0.1) };

  const EVENTS = [
    { id: 'eat', name: '吃燈', w: 30 },
    { id: 'one', name: '送燈', w: 25 },
    { id: 'two', name: '送雙燈', w: 15 },
    { id: 'rain', name: '天女散花', w: 12 },
    { id: 'train', name: '開火車', w: 8 },
    { id: 'small3', name: '小三元', w: 4 },
    { id: 'big3', name: '大三元', w: 2 },
    { id: 'four', name: '大四喜', w: 3 },
    { id: 'corner', name: '縱橫四海', w: 1.5 },
    { id: 'stars', name: '滿天星', w: 0.2 },
  ];
  const nonLucky = (p) => p.map((x, i) => (LAMPS[i].s === 'LUCKY' ? 0 : x));
  function pickLamps(kind, k) {
    const w = nonLucky(P[kind]);
    const out = [];
    while (out.length < k) { const i = R.weighted(w); if (!out.includes(i)) out.push(i); }
    return out;
  }
  const bigOf = (s) => LAMPS.map((L, i) => (L.s === s && !L.small ? i : -1)).filter((i) => i >= 0);
  function event(kind) {
    const e = EVENTS[R.weighted(EVENTS.map((x) => x.w))];
    let lamps = [];
    switch (e.id) {
      case 'eat': break;
      case 'one': lamps = pickLamps(kind, 1); break;
      case 'two': lamps = pickLamps(kind, 2); break;
      case 'rain': lamps = pickLamps(kind, 3 + R.int(3)); break;
      case 'train': { const len = 3 + R.int(4); let st = R.int(24); const arr = []; while (arr.length < len) { if (LAMPS[st].s !== 'LUCKY') arr.push(st); st = (st + 1) % 24; } lamps = arr; break; }
      case 'small3': lamps = [R.pick(bigOf('OR')), R.pick(bigOf('MG')), R.pick(bigOf('BL'))]; break;
      case 'big3': lamps = [bigOf('WM')[0], bigOf('ST')[0], bigOf('77')[0]]; break;
      case 'four': lamps = bigOf('AP'); break;
      case 'corner': lamps = CORNERS.slice(); break;
      case 'stars': lamps = LAMPS.map((L, i) => (L.s === 'LUCKY' ? -1 : i)).filter((i) => i >= 0); break;
      default: break;
    }
    return { id: e.id, name: e.name, lamps };
  }

  function payOf(lamps, bets) {
    let win = 0;
    const hits = [];
    for (const i of lamps) {
      const L = LAMPS[i];
      const b = bets[L.s] || 0;
      if (b > 0) { const a = b * odds(L); win += a; hits.push({ lamp: i, sym: L.s, small: !!L.small, amount: a }); }
    }
    return { win, hits };
  }

  function once(bets, kind) {
    let lamp = R.weighted(P[kind]);
    let nearSwap = false;
    // 呈現：同樣是大蘋果，優先停在 BAR、雙七旁邊那顆（賠率完全一樣，只是看起來「差一點」）
    if (LAMPS[lamp].s === 'AP' && !LAMPS[lamp].small && R.random() < 0.6) {
      const cand = [4, 16].filter((i) => (bets[LAMPS[i === 4 ? 3 : 15].s] || 0) > 0);
      if (cand.length) { const to = R.pick(cand); nearSwap = to !== lamp; lamp = to; }
    }
    let lit = [lamp];
    let ev = null;
    if (LAMPS[lamp].s === 'LUCKY') { ev = event(kind); lit = ev.lamps; }
    const { win, hits } = payOf(lit, bets);
    return { machine: ID, lamp, event: ev, lit, win, hits, nearSwap };
  }

  const HONEY_REDRAW = 0.6;
  function spin(bets, mode) {
    const total = BETS.reduce((a, s) => a + (bets[s] || 0), 0);
    let r = once(bets, 'normal');
    if (mode === 'honey' && r.win < total && R.random() < HONEY_REDRAW) {
      const r2 = once(bets, 'honey');
      if (r2.win > r.win) { r = r2; r.boosted = true; }
    }
    r.bet = total;
    r.total = r.win;
    return r;
  }

  // 停下來的那盞旁邊就是 BAR／雙七（而且有押）→ 差一點
  function decorate(res, bets) {
    const near = [];
    if (!res.event) {
      for (const h of HIGH_LAMPS) {
        const d = (res.lamp - h + 24) % 24;
        if ((d === 1 || d === 23) && (bets[LAMPS[h].s] || 0) > 0) near.push({ lamp: h, sym: LAMPS[h].s, at: d === 1 ? 'passed' : 'short', why: (d === 1 ? '燈慢慢爬過' : '燈停在前一格，差一步就到') + NAMES[LAMPS[h].s], arranged: res.nearSwap });
      }
    }
    return { near };
  }

  // 比大小
  function guess(choice) {
    const n = 1 + R.int(13);
    const win = n === 7 ? false : choice === 'big' ? n >= 8 : n <= 6;

// ===== src/ui/music.js =====
/* 背景音樂：霓虹夜城的放克／城市流行節奏，即時合成、不重複。
   大廳、機台、免費遊戲各一種情緒；換場時在小節線上切換。 */
BYC.ui.music = (function () {
  let ctx = null, out = null, verbIn = null;
  let running = false, timer = null, mood = 'lobby', nextBar = 0, bar = 0;
  let bus = null;
  const burstCache = {};
  const R = Math.random;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function attach(audioCtx, dest, verb) {
    ctx = audioCtx; out = dest; verbIn = verb;
    bus = ctx.createGain(); bus.gain.value = 0.9; bus.connect(out);
  }

  // ---------- 預先算好的打擊樣本 ----------
  function burst(key, dur, hp, decayPow) {
    if (burstCache[key]) return burstCache[key];
    const sr = ctx.sampleRate, n = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    let prev = 0;
    for (let i = 0; i < n; i++) {
      const x = Math.random() * 2 - 1;
      const y = hp ? x - prev * 0.96 : x; prev = x;
      d[i] = y * Math.pow(1 - i / n, decayPow);
    }
    return (burstCache[key] = buf);
  }
  function play(buf, t, g, rate, wet) {
    const s = ctx.createBufferSource(); s.buffer = buf; if (rate) s.playbackRate.value = rate;
    const e = ctx.createGain(); e.gain.value = g; s.connect(e); e.connect(bus); if (wet && verbIn) e.connect(verbIn);
    s.start(t);
  }
  const hat = (t, g) => play(burst('hat', 0.05, true, 6), t, g);
  const ohat = (t, g) => play(burst('ohat', 0.28, true, 2.5), t, g);
  const clap = (t, g) => { const b = burst('clap', 0.18, false, 4); play(b, t, g, 1, true); play(b, t + 0.012, g * 0.7, 1.1); };
  function kick(t, g) {
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const e = ctx.createGain(); e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(g, t + 0.004); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(e); e.connect(bus); o.start(t); o.stop(t + 0.35);
  }
  function bass(t, m, dur, g, bright) {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m);
    const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = mtof(m - 12);
