      }
    }
    return beat * 4;
  }

  function loop() {
    if (!running || !ctx) return;
    while (nextBar < ctx.currentTime + 1.4) { nextBar += scheduleBar(Math.max(nextBar, ctx.currentTime + 0.05)); bar++; }
    timer = setTimeout(loop, 250);
  }
  function start() {
    if (!ctx || running) return;

  function duck(on) { if (!ctx || !running) return; bus.gain.setTargetAtTime(on ? 0.3 : 0.9, ctx.currentTime, 0.15); }

  return { attach, start, stop, setMood, duck, get running() { return running; }, get mood() { return mood; } };
})();

      timedNext: 0, wheelDay: '', streak: { day: 0, last: '' }, rescue: { day: '', n: 0 },
      missions: { day: '', list: [], chest: false },
      album: { owned: {}, claimed: {} },
      jp: { gems: { MINI: 0, MINOR: 0, MAJOR: 0, GRAND: 0 }, eight: { MINOR: 0, MAJOR: 0, GRAND: 0 } },
      stats: { total: {}, gems: {}, eight: {}, mary: {}, free: {}, sessions: 0, playMs: 0, timerReturns: 0, wheelNear: 0, honey: { bet: 0, won: 0, boosts: 0 } },
      reveal: { unlocked: false, on: false },
      settings: { sfx: 0.85, music: 0.5, turbo: false },
      seen: {},
    };
  }
  let data = defaults();
  let db = null, uid = null, writing = false, again = false, timer = null;
  const changeFns = [];
  function merge(base, src) {
    if (!src || typeof src !== 'object') return base;
    for (const k in src) {
      if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], src[k]);
      else base[k] = src[k];
    }
    return base;
  }
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) data = merge(defaults(), JSON.parse(raw)); } catch (e) { data = defaults(); }
    return data;
  }
  function persist() {
    data.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 無痕視窗等 */ }
    // 雲端寫入節流：最多每 6 秒一次（連續轉的時候不會每一轉都寫）
    if (db && uid && !timer) timer = setTimeout(() => { timer = null; cloudWrite(); }, 6000);
  }
  async function cloudWrite() {
    if (!db || !uid) return;
    if (writing) { again = true; return; }
    writing = true;
    try { await db.doc('data/users/' + uid + '/save').set(JSON.parse(JSON.stringify(data))); }
    catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) db = null; }
    writing = false;
    if (again) { again = false; cloudWrite(); }
  }
  async function connectCloud() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return false;
      const user = await window.claude.use('user');
      const id = user ? await user.id() : null;
      const d = await window.claude.use('db');
      if (!d || !id) return false;
      db = d; uid = id;
      const snap = await db.doc('data/users/' + uid + '/save').get();
      if (snap.exists) {
        const remote = snap.data();
        if ((remote.updatedAt || 0) > (data.updatedAt || 0)) {
          data = merge(defaults(), JSON.parse(JSON.stringify(remote)));
          try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
          changeFns.forEach((f) => f(data));
        } else if ((remote.updatedAt || 0) < (data.updatedAt || 0)) cloudWrite();
      } else cloudWrite();
      return true;
    } catch (e) { return false; }
  }
  // 離開頁面前把還沒寫上去的進度補寫一次
  function flush() { if (db && uid && timer) { clearTimeout(timer); timer = null; cloudWrite(); } }
  if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  function reset() { data = defaults(); persist(); changeFns.forEach((f) => f(data)); }
  return { load, persist, connectCloud, reset, onChange: (f) => changeFns.push(f), get data() { return data; }, get cloud() { return !!(db && uid); } };
})();

// ===== src/ui/meta.js =====
/* 經濟與「讓人一直回來」的系統：等級、押注上限、計時金幣、每日轉盤、連續簽到、破產救濟、
   蜜月期、每日任務、收集冊、限時活動、假的中獎跑馬燈、JP 累積。也記下揭密報告要用的數字。 */
BYC.meta = (function () {
  const S = () => BYC.ui.save.data;
  const save = () => BYC.ui.save.persist();
  const R = BYC.rng;

  // ---------- 押注與等級 ----------
  const BETS = [1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000];
  const BET_CAP = [[1, 4], [3, 5], [5, 6], [8, 7], [12, 8], [16, 9], [20, 10]]; // [等級, 最高押注索引]
  const UNLOCK = { gems: 1, eight: 2, mary: 3 };
  const HONEY_SPINS = 120;
  function maxBetIdx(lv) { let m = 4; for (const [l, i] of BET_CAP) if (lv >= l) m = i; return m; }
  const xpNeed = (lv) => Math.round(900 * Math.pow(lv, 1.55)); // 從 lv 升到 lv+1 需要的經驗
  function levelInfo() { const d = S(); const need = xpNeed(d.level); return { level: d.level, xp: d.xp, need, pct: Math.min(1, d.xp / need) }; }
  const levelReward = (lv) => 60000 * lv + 40000;
  function addXp(n) {
    const d = S();
    const ups = [];
    d.xp += n;
    while (d.xp >= xpNeed(d.level)) {
      d.xp -= xpNeed(d.level); d.level++;
      const reward = levelReward(d.level);
      d.coins += reward; bump('free', 'level', reward);
      const unlocked = Object.keys(UNLOCK).filter((k) => UNLOCK[k] === d.level);
      const cap = maxBetIdx(d.level) > maxBetIdx(d.level - 1) ? BETS[maxBetIdx(d.level)] : 0;
      ups.push({ level: d.level, reward, unlocked, cap });
    }
    return ups;
  }
  const mode = () => (S().honeyLeft > 0 ? 'honey' : 'normal');

  // ---------- 統計（揭密報告用） ----------
  function bump(group, key, n) { const g = S().stats[group] || (S().stats[group] = {}); g[key] = (g[key] || 0) + (n == null ? 1 : n); }

  // ---------- 時間 ----------
  const dayKey = (t) => { const d = new Date(t || Date.now()); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const yesterday = () => dayKey(Date.now() - 86400000);

  // ---------- 下注、派彩 ----------
  function debit(amount) { const d = S(); if (d.coins < amount) return false; d.coins -= amount; return true; }
  function credit(amount, source) { if (amount <= 0) return; S().coins += amount; if (source) bump('free', source, amount); save(); }

  // 每一轉結束後的共同記錄。info: {ldw, near, antic, anticPaid, fs, jp, boosted, tier}
  function recordSpin(machine, bet, win, info) {
    const d = S();
    const i = info || {};
    const ev = currentEvent();
    let bonus = 0;
    if (ev && ev.id === 'win10' && win > 0) bonus = Math.round(win * 0.1);
    d.coins += win + bonus;
    d.spins++;
    const honey = d.honeyLeft > 0;
    if (honey) { d.honeyLeft--; d.stats.honey.bet += bet; d.stats.honey.won += win; if (i.boosted) d.stats.honey.boosts++; }
    for (const g of ['total', machine]) {
      bump(g, 'spins'); bump(g, 'bet', bet); bump(g, 'won', win + bonus);
      if (win > 0) bump(g, 'hits');
      if (i.ldw) { bump(g, 'ldw'); bump(g, 'ldwLoss', bet - win); }
      if (i.near) bump(g, 'near');
      if (i.antic) bump(g, 'antic');
      if (i.anticPaid) bump(g, 'anticPaid');
      if (i.fs) bump(g, 'fs');
      if (i.jp) bump(g, 'jp');
      if (i.tier != null && i.tier >= 0) bump(g, 'big' + i.tier);
    }
    // JP 累積（GRAND 等慢慢往上漲）
    const jp = d.jp[machine];
    if (jp) for (const k in jp) jp[k] += { MINI: 0.002, MINOR: 0.006, MAJOR: 0.02, GRAND: 0.05 }[k] || 0;
    const xpMult = ev && ev.id === 'xp2' ? 2 : 1;
    const ups = addXp(Math.max(1, Math.round(bet / 100)) * xpMult);
    const missionDone = progressMissions(machine, { bet, win, ...i });
    const sticker = maybeSticker(machine);
    save();
    return { ups, missionDone, sticker, bonus };
  }

  // 免費遊戲、JP 這類「不是一般轉動」的派彩（沒有押注，只記贏的錢）
  function recordBonus(machine, win, kind, info) {
    const d = S();
    const i = info || {};
    if (win > 0) d.coins += win;
    for (const g of ['total', machine]) { bump(g, 'won', win); bump(g, kind + 'Won', win); }
    if (i.honey) d.stats.honey.won += win;
    let missionDone = [];
    if (i.tier != null && i.tier >= 0) {
      for (const g of ['total', machine]) bump(g, 'big' + i.tier);
      missionDone = progressMissions(machine, { bet: 0, win: 0, tier: i.tier, extra: true });
    }
    save();
    return { missionDone };
  }
  // 比大小：拿得分去賭，贏了變兩倍、輸了歸零
  function gamble(stake, won) {
    if (!debit(stake)) return -1;
    const payout = won ? stake * 2 : 0;
    S().coins += payout;
    for (const g of ['total', 'mary']) { bump(g, 'bet', stake); bump(g, 'won', payout); bump(g, 'gambles'); bump(g, 'gBet', stake); bump(g, 'gWon', payout); if (won) bump(g, 'gambleWins'); }
    if (won) guessWon(); else save();
    return payout;
  }

  // ---------- JP 顯示值（押越大，JP 越大） ----------
  function jpValue(machine, tier, mult, bet) { const p = (S().jp[machine] || {})[tier] || 0; return Math.round(bet * (mult + p)); }
  function jpWon(machine, tier) { const j = S().jp[machine]; if (j && tier in j) j[tier] = 0; }
  // 待在機台前，JP 也會自己慢慢漲（看起來像全城的人都在押）
  const DRIFT = { MINI: 0.0004, MINOR: 0.0012, MAJOR: 0.004, GRAND: 0.01 };
  function jpDrift(machine, sec) { const j = S().jp[machine]; if (!j) return; for (const k in j) j[k] += (DRIFT[k] || 0) * sec; }

  // ---------- 計時免費金幣 ----------
  const TIMED_MS = 2 * 3600 * 1000;
  const timedAmount = () => 100000 + 20000 * S().level;
  function timedLeft() { return Math.max(0, (S().timedNext || 0) - Date.now()); }
  function claimTimed() {
    if (timedLeft() > 0) return 0;
    const a = timedAmount();
    S().timedNext = Date.now() + TIMED_MS;
    credit(a, 'timed');
    return a;
  }

  // ---------- 每日轉盤（大獎格兩旁放最常中的格子：停在旁邊＝差一點） ----------
  const WHEEL = [
    { v: 50000, w: 24 }, { v: 10000000, w: 0.1, jackpot: true }, { v: 100000, w: 24 }, { v: 250000, w: 12 },
    { v: 150000, w: 18 }, { v: 1000000, w: 4 }, { v: 500000, w: 8 }, { v: 2000000, w: 1.4 },
  ];
  const wheelReady = () => S().wheelDay !== dayKey();
  function spinWheel() {
    if (!wheelReady()) return null;
    const idx = R.weighted(WHEEL.map((x) => x.w));
    const seg = WHEEL[idx];
    const jpIdx = WHEEL.findIndex((x) => x.jackpot);
    const near = !seg.jackpot && (idx === (jpIdx + 1) % WHEEL.length || idx === (jpIdx + WHEEL.length - 1) % WHEEL.length);
    const mult = 1 + (S().level - 1) * 0.05;
    const amount = Math.round(seg.v * mult / 1000) * 1000;
    S().wheelDay = dayKey();
    if (near) S().stats.wheelNear++;
    credit(amount, 'wheel');
    return { idx, amount, near, jpIdx, toward: near ? (idx === (jpIdx + 1) % WHEEL.length ? 'before' : 'after') : null };
  }

  // ---------- 連續簽到（斷一天就從第一天重來） ----------
  const STREAK = [100000, 200000, 300000, 500000, 800000, 1200000, 3000000];
  function streakState() {
    const st = S().streak;
    const today = dayKey();
    if (st.last === today) return { claimed: true, day: st.day, next: st.day };
    const cont = st.last === yesterday();
    const day = cont ? (st.day % 7) + 1 : 1;
    return { claimed: false, day: st.day, next: day, broken: !cont && st.day > 0 };
  }
  function claimStreak() {
    const s = streakState();
    if (s.claimed) return 0;
    S().streak = { day: s.next, last: dayKey() };
    const a = STREAK[s.next - 1];
    credit(a, 'streak');
    return a;
  }

  // ---------- 破產救濟 ----------
  const RESCUE = 500000, RESCUE_MAX = 3;
  function rescueState() { const r = S().rescue; const n = r.day === dayKey() ? r.n : 0; return { left: RESCUE_MAX - n, amount: RESCUE }; }
  const broke = () => S().coins < BETS[0];
  function claimRescue() {
    const st = rescueState();
    if (st.left <= 0 || !broke()) return 0;
    S().rescue = { day: dayKey(), n: RESCUE_MAX - st.left + 1 };
    credit(RESCUE, 'rescue');
    return RESCUE;
  }

  // ---------- 限時活動（每 3 小時一輪，前 45 分鐘） ----------
  const EVENTS = [
    { id: 'xp2', name: '經驗值 ×2', desc: '這段時間每一轉的經驗值加倍' },
    { id: 'drop2', name: '收集卡掉落 ×2', desc: '這段時間收集卡掉落機率加倍' },
    { id: 'win10', name: '中獎加碼 +10%', desc: '這段時間每一次中獎多送 10%' },
  ];
  const PERIOD = 3 * 3600 * 1000, ACTIVE = 45 * 60 * 1000;
  function currentEvent(t) {
    const now = t || Date.now();
    const k = Math.floor(now / PERIOD);
    const into = now - k * PERIOD;
    if (into < ACTIVE) return { ...EVENTS[k % EVENTS.length], endsAt: k * PERIOD + ACTIVE };
    return null;
  }
  function nextEvent(t) { const now = t || Date.now(); const k = Math.floor(now / PERIOD) + 1; return { ...EVENTS[k % EVENTS.length], startsAt: k * PERIOD }; }

  // ---------- 每日任務 ----------
  const MPOOL = [
    { type: 'spinOn', machine: 'gems', target: 40, text: '在霓虹寶石轉 40 次' },
    { type: 'spinOn', machine: 'eight', target: 40, text: '在烈焰八線轉 40 次' },
    { type: 'spinOn', machine: 'mary', target: 30, text: '在金幣小瑪莉玩 30 局' },
    { type: 'betSum', target: 20, text: '累積押注達 20 次最高押注', scaleBet: true },
    { type: 'winOver', target: 12, text: '贏過押注 12 次' },
    { type: 'big', target: 1, text: '拿到 1 次 BIG WIN 以上' },
    { type: 'fs', target: 1, text: '在霓虹寶石進入 1 次免費遊戲' },
    { type: 'lucky', target: 2, text: '小瑪莉開出 2 次 LUCKY' },
    { type: 'guess', target: 3, text: '比大小贏 3 次' },
    { type: 'allFruit', target: 1, text: '烈焰八線開出 1 次全盤水果' },
  ];
  function ensureMissions() {
    const m = S().missions;
    if (m.day === dayKey() && m.list.length) return m;
    const pool = R.shuffle(MPOOL.slice()).filter((x) => !(x.machine && S().level < UNLOCK[x.machine]) && !(x.type === 'lucky' && S().level < UNLOCK.mary) && !(x.type === 'allFruit' && S().level < UNLOCK.eight) && !(x.type === 'guess' && S().level < UNLOCK.mary));
    const lv = S().level;
    m.day = dayKey(); m.chest = false;
    m.list = pool.slice(0, 3).map((x) => ({ ...x, target: x.scaleBet ? BETS[maxBetIdx(lv)] * x.target : x.target, progress: 0, reward: 150000 + 30000 * lv + (x.type === 'big' || x.type === 'fs' ? 150000 : 0), done: false, claimed: false }));
    save();
    return m;
  }
  function progressMissions(machine, i) {
    const m = ensureMissions();
    const done = [];
    for (const x of m.list) {
      if (x.done) continue;
      let inc = 0;
      if (x.type === 'spinOn' && x.machine === machine && !i.extra) inc = 1;
      else if (x.type === 'betSum') inc = i.bet;
      else if (x.type === 'winOver' && i.win > i.bet) inc = 1;
      else if (x.type === 'big' && i.tier != null && i.tier >= 0) inc = 1;
      else if (x.type === 'fs' && i.fs) inc = 1;
      else if (x.type === 'lucky' && i.lucky) inc = 1;
      else if (x.type === 'allFruit' && i.allFruit) inc = 1;
      if (inc) { x.progress = Math.min(x.target, x.progress + inc); if (x.progress >= x.target) { x.done = true; done.push(x); } }
    }
    return done;
  }
  function guessWon() { const m = ensureMissions(); for (const x of m.list) if (x.type === 'guess' && !x.done) { x.progress++; if (x.progress >= x.target) x.done = true; } save(); }
  function claimMission(i) { const x = ensureMissions().list[i]; if (!x || !x.done || x.claimed) return 0; x.claimed = true; credit(x.reward, 'mission'); return x.reward; }
  const CHEST = 1000000;
  function claimChest() { const m = ensureMissions(); if (m.chest || !m.list.every((x) => x.claimed)) return 0; m.chest = true; credit(CHEST, 'mission'); return CHEST; }
  const missionBadge = () => { const m = ensureMissions(); return m.list.filter((x) => x.done && !x.claimed).length + (!m.chest && m.list.every((x) => x.claimed) ? 1 : 0); };

  // ---------- 收集冊 ----------
  const ALBUMS = [
    { id: 'gems', name: '霓虹寶石', items: [['A', '霓虹 A', 0], ['K', '霓虹 K', 0], ['P', '紫水晶', 0], ['T', '黃水晶', 0], ['E', '祖母綠', 0], ['B', '藍寶石', 1], ['W', 'WILD', 1], ['S', 'BONUS', 2], ['R', '紅寶石之心', 2]] },
    { id: 'eight', name: '烈焰八線', items: [['CH', '櫻桃', 0], ['GR', '葡萄', 0], ['WM', '西瓜', 0], ['BL', '鈴鐺', 0], ['ST', '星星', 1], ['BAR', 'BAR', 1], ['B7', '藍七', 1], ['R7', '紅七', 2], ['CR', '王冠', 2]] },
    { id: 'mary', name: '金幣小瑪莉', items: [['AP', '蘋果', 0], ['OR', '橘子', 0], ['MG', '芒果', 0], ['WM', '西瓜', 0], ['BL', '鈴鐺', 1], ['MST', '雙星', 1], ['77', '雙七', 1], ['BAR50', '小 BAR', 2], ['LUCKY', 'LUCKY', 2]] },
  ];
  const RW = [10, 3.5, 1]; // 普通、稀有、金卡
  const ALBUM_REWARD = 3000000, ALL_REWARD = 15000000;
  function maybeSticker(machine) {
    const ev = currentEvent();
    const p = (1 / 14) * (ev && ev.id === 'drop2' ? 2 : 1);
    if (R.random() >= p) return null;
    const al = ALBUMS.find((a) => a.id === machine);
    const it = al.items[R.weighted(al.items.map((x) => RW[x[2]]))];
    const key = al.id + ':' + it[0];
    const owned = S().album.owned;
    const isNew = !owned[key];
    owned[key] = (owned[key] || 0) + 1;
    return { album: al.id, albumName: al.name, sym: it[0], name: it[1], rarity: it[2], isNew };
  }
  function albumState(id) {
    const al = ALBUMS.find((a) => a.id === id);
    const owned = S().album.owned;
    const got = al.items.filter((x) => owned[al.id + ':' + x[0]]).length;
    return { got, total: al.items.length, complete: got === al.items.length, claimed: !!S().album.claimed[id] };
  }
  function claimAlbum(id) { const st = albumState(id); if (!st.complete || st.claimed) return 0; S().album.claimed[id] = true; credit(ALBUM_REWARD, 'album'); return ALBUM_REWARD; }
  function claimAll() { if (S().album.claimed.all || !ALBUMS.every((a) => albumState(a.id).complete)) return 0; S().album.claimed.all = true; credit(ALL_REWARD, 'album'); return ALL_REWARD; }
  const albumBadge = () => ALBUMS.filter((a) => { const s = albumState(a.id); return s.complete && !s.claimed; }).length;

  // ---------- 假的中獎跑馬燈 ----------
  const BOTS = ['阿明', '小美', '志明', '春嬌', '阿凱', '小芳', '老王', '阿嘉', '美玲', '阿德', '小龍', '佩佩', '阿豪', '曉晴', '大頭', '阿妹', '小胖', 'Kevin', 'Momo', '阿翔', '欣欣', '大偉', '小雨', '阿光'];
  const MNAME = { gems: '霓虹寶石', eight: '烈焰八線', mary: '金幣小瑪莉' };
  function fakeWin() {
    const who = R.pick(BOTS);
    const lvBet = BETS[3 + R.int(6)];
    const r = R.random();
    if (r < 0.07) return { who, text: `在烈焰八線中了 GRAND`, amount: Math.round(lvBet * (1000 + R.random() * 200)), hot: true };
    if (r < 0.14) return { who, text: `在霓虹寶石中了 GRAND`, amount: Math.round(lvBet * (1500 + R.random() * 300)), hot: true };
    if (r < 0.32) return { who, text: `在${MNAME.gems}免費遊戲贏得`, amount: Math.round(lvBet * (30 + R.random() * 220)) };
    if (r < 0.45) return { who, text: `在${MNAME.mary}開出滿天星`, amount: Math.round(lvBet * (40 + R.random() * 20)), hot: true };
    if (r < 0.7) return { who, text: `拿到 MEGA WIN`, amount: Math.round(lvBet * (25 + R.random() * 25)) };
    if (r < 0.85) return { who, text: `拿到 EPIC WIN`, amount: Math.round(lvBet * (100 + R.random() * 200)), hot: true };
    return { who, text: `在烈焰八線中了 MAJOR`, amount: Math.round(lvBet * (250 + R.random() * 60)) };
  }

  // ---------- 開局時的統計 ----------
  function sessionStart() {
    const st = S().stats;
    st.sessions++;
    // 計時金幣準備好之後 20 分鐘內回來＝被計時器叫回來
    const ready = S().timedNext;
    if (ready && Date.now() >= ready && Date.now() - ready < 20 * 60 * 1000) st.timerReturns++;
    save();
  }
  function tickPlay(ms) { S().stats.playMs += ms; }

  return {
    BETS, UNLOCK, HONEY_SPINS, maxBetIdx, xpNeed, levelInfo, levelReward, mode, debit, credit, recordSpin, recordBonus, gamble, bump,
    jpValue, jpWon, jpDrift, timedLeft, timedAmount, claimTimed, TIMED_MS,
    WHEEL, wheelReady, spinWheel, STREAK, streakState, claimStreak,

// ===== src/ui/hud.js =====
/* 頂端列：金幣、等級、經驗條、計時金幣。
   金幣數字可以暫時跟存檔不同步：中獎的錢已經入帳，但畫面上「扣住」，再一路跳上去，跳的過程才是爽點。 */
BYC.ui.hud = (function () {
  const St = () => BYC.ui.stage;
  const S = () => BYC.ui.save.data;
  let hold = 0;
  const coinEls = new Set();
  const lvEls = new Set();
  let rel = null;

  const value = () => S().coins - hold;
  // 還沒放進畫面的元素也要畫；曾經在畫面上、後來被拿掉的才清掉
  const alive = (set, el) => { if (el.isConnected) { el._seen = true; return true; } if (el._seen) { set.delete(el); return false; } return true; };
  function paint() {
    const n = value();
    const v = n >= 1e9 ? St().short(n) : St().fmt(n);
    for (const el of coinEls) if (alive(coinEls, el)) el.textContent = v;
  }
  function refresh() { paint(); paintLevel(); }
  function setHold(n) { hold = Math.max(0, n); paint(); }
  // 把扣住的金幣在 ms 內跳完（回傳 promise；finish() 可以直接跳到底）
  function release(ms) {
    if (rel) rel.finish();
    const h0 = hold;
    if (h0 <= 0) return Promise.resolve();
    const t0 = performance.now();
    let done = false, res;
    const step = (now) => {
      if (done) return;
      const t = Math.min(1, (now - t0) / ms);
      hold = Math.round(h0 * (1 - t));
      paint();
      if (t < 1) requestAnimationFrame(step); else finish();
    };
    const finish = () => { if (done) return; done = true; hold = 0; paint(); rel = null; pulse(); res(); };
    rel = { finish };
    requestAnimationFrame(step);
    return new Promise((r) => { res = r; });
  }
  function finishRelease() { if (rel) rel.finish(); }
  function pulse() {
    for (const el of coinEls) { const p = el.closest('.coin-pill'); if (p) { p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); } }
  }

  // ---------- 等級徽章 ----------
  function lvBadge(small) {
    const { h } = St();
    const R = 30, C = 2 * Math.PI * R;
    const el = h('div', { class: 'lv-badge' + (small ? ' sm' : ''), html: `<svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="${R}" class="lv-track"/><circle cx="38" cy="38" r="${R}" class="lv-prog" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" transform="rotate(-90 38 38)"/></svg><b class="lv-num">1</b><small>LV</small>` });
    el._C = C;
    lvEls.add(el);
    paintLevel();
    return el;
  }
  function xpBar() { const { h } = St(); const el = h('div', { class: 'xp-bar' }, h('i'), h('span')); lvEls.add(el); paintLevel(); return el; }
  function paintLevel() {
    const L = BYC.meta.levelInfo();
    for (const el of lvEls) {
      if (!alive(lvEls, el)) continue;
      if (el.classList.contains('lv-badge')) {
        el.querySelector('.lv-num').textContent = L.level;
        el.querySelector('.lv-prog').setAttribute('stroke-dashoffset', (el._C * (1 - L.pct)).toFixed(1));
      } else {
        el.querySelector('i').style.width = (L.pct * 100).toFixed(1) + '%';
        el.querySelector('span').textContent = St().short(L.xp) + ' / ' + St().short(L.need);
      }
    }
  }

  function coinPill(id) {
    const { h } = St();
    const num = h('b', { class: 'coin-num' }, '0');
    const el = h('div', { class: 'coin-pill', id: id || null, html: BYC.art.coinSVG(40) }, num, h('i', { class: 'shine' }));
    coinEls.add(num);
    paint();
    return el;
  }

  // 金幣從 from 飛到 to（DOM 元素或 {x,y}），第一顆抵達時 resolve
  function fly(from, to, n) {
    const { h, centerOf } = St();
    const a = from.nodeType ? centerOf(from) : from;
    const b = to.nodeType ? centerOf(to) : to;
    const count = Math.min(24, n || 12);
    BYC.ui.sound.play('coins', count);
    return new Promise((resolve) => {
      let first = true;
      for (let i = 0; i < count; i++) {
        const c = h('div', { class: 'fly-coin', html: BYC.art.coinSVG(46) });
        c.style.left = a.x + 'px'; c.style.top = a.y + 'px';
        St().fx.appendChild(c);
        const dx = b.x - a.x, dy = b.y - a.y;
        const mx = (Math.random() - 0.5) * 260, my = -120 - Math.random() * 160;
        const anim = c.animate([
          { transform: 'translate(-50%,-50%) scale(.4)', opacity: 0 },
          { transform: `translate(calc(-50% + ${mx * 0.6}px), calc(-50% + ${my * 0.6}px)) scale(1.15)`, opacity: 1, offset: 0.25 },
          { transform: `translate(calc(-50% + ${dx * 0.55 + mx * 0.4}px), calc(-50% + ${dy * 0.5 + my}px)) scale(1)`, opacity: 1, offset: 0.6 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.55)`, opacity: 0.9 },
        ], { duration: 820 + i * 22, delay: i * 38, easing: 'cubic-bezier(.4,.1,.5,1)', fill: 'forwards' });
        anim.onfinish = () => { c.remove(); if (first) { first = false; resolve(); } pulse(); };
      }
    });
  }

  return { refresh, setHold, release, finishRelease, pulse, lvBadge, xpBar, paintLevel, coinPill, fly, get hold() { return hold; }, value };
})();

// ===== src/ui/scene.js =====
/* 場景：夜空、探照燈、霓虹天際線、漂浮的光點；跑馬燈泡外框；標題畫面。 */
BYC.ui.scene = (function () {
  const St = () => BYC.ui.stage;

  // 固定種子，讓每次打開看到的是同一座城
  function prng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  function skyline() {
    const r = prng(20260606);
    const VW = 2400, VH = 460;
    let back = '', front = '', wins = '', signs = '';
    // 遠景：低彩度的樓
    for (let x = -20; x < VW;) {
      const w = 50 + r() * 90, h = 120 + r() * 210;
      back += `<rect x="${x.toFixed(0)}" y="${(VH - h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="#1b0b33"/>`;
      if (r() < 0.25) back += `<rect x="${(x + w / 2 - 2).toFixed(0)}" y="${(VH - h - 40).toFixed(0)}" width="4" height="40" fill="#1b0b33"/><circle cx="${(x + w / 2).toFixed(0)}" cy="${(VH - h - 42).toFixed(0)}" r="4" fill="#ff3b6b" class="beacon" style="animation-delay:${(r() * 2).toFixed(2)}s"/>`;
      x += w + 4 + r() * 10;
    }
    // 近景：亮著窗的樓
    const winC = ['#ffd98a', '#ffe9b8', '#9fe8ff', '#ff9be6', '#fff3d0'];
    for (let x = -10; x < VW;) {
      const w = 70 + r() * 120, h = 90 + r() * 230;
      const y = VH - h;
      front += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="#0d0420"/>`;
      if (r() < 0.35) front += `<path d="M${x.toFixed(0)} ${y.toFixed(0)}L${(x + w / 2).toFixed(0)} ${(y - 26 - r() * 30).toFixed(0)}L${(x + w).toFixed(0)} ${y.toFixed(0)}Z" fill="#0d0420"/>`;
      const cols = Math.floor((w - 14) / 14), rows = Math.floor((h - 20) / 18);
      const tone = winC[Math.floor(r() * winC.length)];
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        if (r() > 0.34) continue;
        const tw = r() < 0.08;
        wins += `<rect x="${(x + 8 + i * 14).toFixed(0)}" y="${(y + 12 + j * 18).toFixed(0)}" width="7" height="10" fill="${r() < 0.85 ? tone : winC[Math.floor(r() * winC.length)]}"${tw ? ` class="tw" style="animation-delay:${(r() * 6).toFixed(2)}s"` : ''}/>`;
      }
      if (r() < 0.22 && h > 160) {
        const sc = ['#ff2bd6', '#22e6ff', '#ffd34d', '#5dff9e'][Math.floor(r() * 4)];
        const sw = Math.min(w - 16, 60 + r() * 50), sx = x + (w - sw) / 2, sy = y + 18;
        signs += `<rect x="${sx.toFixed(0)}" y="${sy.toFixed(0)}" width="${sw.toFixed(0)}" height="22" rx="5" fill="none" stroke="${sc}" stroke-width="9" opacity=".25"/><rect x="${sx.toFixed(0)}" y="${sy.toFixed(0)}" width="${sw.toFixed(0)}" height="22" rx="5" fill="#0d0420" stroke="${sc}" stroke-width="3" class="sign" style="animation-delay:${(r() * 5).toFixed(2)}s"/>`;
      }
      x += w + 2 + r() * 8;
    }
    return `<svg class="skyline" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g>${back}</g><g opacity=".9">${front}</g><g>${wins}</g><g>${signs}</g></svg>`;
  }

  function init(frame) {
    const { h } = St();
    const bg = frame.querySelector('.bg');
    const bokeh = h('div', { class: 'bokeh' });
    const r = prng(77);
    const cols = ['#ff2bd6', '#22e6ff', '#ffd34d', '#a35cff', '#ff7a2e'];
    for (let i = 0; i < 16; i++) {
      const d = 40 + r() * 140;
      bokeh.appendChild(h('i', { style: { left: (r() * 100).toFixed(1) + '%', top: (10 + r() * 70).toFixed(1) + '%', width: d.toFixed(0) + 'px', height: d.toFixed(0) + 'px', background: `radial-gradient(circle, ${cols[i % cols.length]}55 0%, ${cols[i % cols.length]}00 70%)`, animationDelay: (-r() * 20).toFixed(1) + 's', animationDuration: (14 + r() * 16).toFixed(1) + 's' } }));
    }
    bg.append(h('div', { class: 'sky' }), h('div', { class: 'beams' }, h('i'), h('i')), bokeh, h('div', { class: 'city', html: skyline() }), h('div', { class: 'haze' }));
  }
  function setTheme(name) {
    const f = St().frame;
    f.className = f.className.replace(/\bscr-\S+/g, '').trim() + ' scr-' + name;
  }

  // ---------- 跑馬燈泡：沿著圓角矩形一圈 ----------
  function rrPoint(s, w, hgt, r) {
    const sw = w - 2 * r, sh = hgt - 2 * r, arc = (Math.PI * r) / 2;
    const segs = [
      [sw, (t) => [r + t, 0]], [arc, (t) => { const a = -Math.PI / 2 + t / r; return [w - r + Math.cos(a) * r, r + Math.sin(a) * r]; }],
      [sh, (t) => [w, r + t]], [arc, (t) => { const a = t / r; return [w - r + Math.cos(a) * r, hgt - r + Math.sin(a) * r]; }],
      [sw, (t) => [w - r - t, hgt]], [arc, (t) => { const a = Math.PI / 2 + t / r; return [r + Math.cos(a) * r, hgt - r + Math.sin(a) * r]; }],
      [sh, (t) => [0, hgt - r - t]], [arc, (t) => { const a = Math.PI + t / r; return [r + Math.cos(a) * r, r + Math.sin(a) * r]; }],
    ];
    for (const [len, f] of segs) { if (s <= len) return f(s); s -= len; }
    return [r, 0];
  }
  function bulbs(w, hgt, r, gap, size) {
    const L = 2 * (w - 2 * r) + 2 * (hgt - 2 * r) + 2 * Math.PI * r;
    const n = Math.max(8, Math.round(L / gap / 2) * 2);
    let out = '';
    for (let i = 0; i < n; i++) {
      const [x, y] = rrPoint((i / n) * L, w, hgt, r);
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size || 4}" class="b${i % 2}"/>`;
    }
    const pad = (size || 4) + 2;
    return `<svg class="bulbs" viewBox="${-pad} ${-pad} ${w + 2 * pad} ${hgt + 2 * pad}" style="left:${-pad}px;top:${-pad}px;width:${w + 2 * pad}px;height:${hgt + 2 * pad}px" aria-hidden="true">${out}</svg>`;
  }

  // 依照元素實際大小補上燈泡（版面算好之後、螢幕轉向之後都重畫）
  function fitBulbs(holder, r, gap, size) {
    const paint = () => {
      if (!holder.isConnected) return false;
      const w = holder.offsetWidth, hh = holder.offsetHeight;
      if (w && hh) holder.innerHTML = bulbs(w, hh, Math.min(r, hh / 2 - 1), gap, size);
      return true;
    };
    requestAnimationFrame(paint);
    St().onResize(() => { if (!holder.isConnected) return false; requestAnimationFrame(paint); return true; });
  }

  // ---------- 標題畫面 ----------
  function title(onStart) {
    const { h } = St();
    const A = BYC.art;
    const floaters = [['W', 64, 0.06, -14, 118], ['R7', 540, 0.085, 12, 120], ['S', 318, 0.025, 6, 86], ['BAR', 600, 0.17, -10, 88], ['R', 30, 0.155, 10, 92], ['LUCKY', 556, 0.81, -8, 112], ['CR', 300, 0.885, 0, 94], ['B7', 60, 0.8, 8, 98]];
    const fl = h('div', { class: 't-floaters' }, ...floaters.map(([id, x, y, rot, s], i) => h('div', { class: 't-fl', style: { left: x + 'px', top: (y * 100).toFixed(1) + '%', width: s + 'px', height: s + 'px', '--r': rot + 'deg', animationDelay: (-i * 0.9) + 's' }, html: A.sym(id) })));
    const sign = h('div', { class: 't-sign' },
      h('div', { class: 't-box', html: bulbs(600, 300, 46, 26, 5) }),
      h('div', { class: 't-zh' }, h('span', null, '不'), h('span', { class: 'flk' }, '夜'), h('span', null, '城')),
      h('div', { class: 't-en' }, 'CITY THAT NEVER SLEEPS'));
    const btn = h('button', { class: 'btn-gold t-start', id: 'btn-start', type: 'button' }, h('span', null, '進城'), h('i', { class: 'shine' }));
    const el = h('div', { class: 'title-scr' }, fl, h('div', { class: 't-mid' }, sign, h('div', { class: 't-slogan' }, '三台機台・二十四小時不打烊'), btn, h('div', { class: 't-hint' }, '點一下開始，有音樂和音效')));
    btn.addEventListener('click', () => onStart());
    return el;
  }

  return { init, setTheme, bulbs, fitBulbs, title, skyline };
})();

// ===== src/ui/reels.js =====
/* 轉輪：每一輪是一條「預先排好」的長紙帶（最上面是結果、最下面是目前畫面、中間是模糊的填充圖），
   用 Web Animations 一次往下捲到底。結果在按下去的那一刻就決定了，停輪的慢動作只是表演。
   框外上下各露出一小截（peek），用來表演「差一點」。 */
BYC.ui.Reels = class Reels {
  constructor(el, o) {
    const { h } = BYC.ui.stage;
    this.o = Object.assign({ peek: 0.32, gap: 8, speed: 24, lineExt: 0.5 }, o);
    this.el = el;
    el.classList.add('reels');
    const { cols, rows, cw, ch, gap, peek } = this.o;
    this.vh = (rows + 2 * peek) * ch;
    el.style.width = (cols * cw + (cols - 1) * gap) + 'px';
    el.style.height = this.vh + 'px';
    this.reels = [];
    for (let i = 0; i < cols; i++) {
      const strip = h('div', { class: 'strip' });
      const r = h('div', { class: 'reel', style: { left: i * (cw + gap) + 'px', width: cw + 'px', height: this.vh + 'px' } }, strip, h('div', { class: 'reel-shade' }));
      el.appendChild(r);
      this.reels.push({ el: r, strip, anim: null, cur: null });
    }
    // 中獎窗的上下框線：框外露出的那一截是「差一點」的舞台
    el.appendChild(h('div', { class: 'rwin', style: { top: peek * ch + 'px', height: rows * ch + 'px' } }));
    this.lineSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.lineSvg.setAttribute('class', 'win-lines');
    this.lineSvg.setAttribute('viewBox', `0 0 ${cols * cw + (cols - 1) * gap} ${this.vh}`);
    el.appendChild(this.lineSvg);
    this.spinning = false;
  }
  cellHTML(id, cls) { return `<div class="cell ${cls || ''}" data-s="${id}" style="height:${this.o.ch}px">${this.o.sym(id)}</div>`; }
  restY() { return -(1 - this.o.peek) * this.o.ch; }
  // 立即顯示：col = [peekAbove, r0, r1, r2, peekBelow]
  setColumn(i, cells) {
    const R = this.reels[i];
    if (R.anim) { R.anim.cancel(); R.anim = null; }
    R.strip.innerHTML = cells.map((s) => this.cellHTML(s)).join('');
    R.strip.style.transform = `translateY(${this.restY()}px)`;
    R.cur = cells.slice();
  }
  setGrid(grid, peeks) {
    for (let i = 0; i < this.o.cols; i++) {
      const p = peeks ? peeks[i] : [this.o.fill(i), this.o.fill(i)];
      this.setColumn(i, [p[0], ...grid[i], p[1]]);
    }
  }
  // 轉！opt: {slow:[], turbo, onStop(i), onSlow(i)}
  spin(grid, peeks, opt) {
    const o = opt || {};
    const { cols, ch, speed } = this.o;
    this.clearWins();
    this.el.querySelectorAll('.expand').forEach((x) => x.remove());
    this.spinning = true;
    const turbo = !!o.turbo;
    let t = 0;
    const plans = [];
    for (let i = 0; i < cols; i++) {
      const slow = o.slow && o.slow[i];
      const base = turbo ? 0.42 + i * 0.09 : 0.8 + i * 0.2;
      t = Math.max(t + (turbo ? 0.09 : 0.2), base);
      if (slow) t += turbo ? 1.0 : 1.35;
      plans.push({ T: t, slow });
    }
    const promises = plans.map((pl, i) => this.spinReel(i, [peeks[i][0], ...grid[i], peeks[i][1]], pl.T, pl.slow, turbo ? speed * 1.15 : speed, o));
    this._hurry = false;
    return Promise.all(promises).then(() => { this.spinning = false; });
  }
  spinReel(i, finalCells, T, slow, v, o) {
    const R = this.reels[i];
    const { ch } = this.o;
    const cur = R.cur || finalCells;
    const nFill = Math.max(6, Math.round(v * T * (slow ? 0.8 : 1)) - 5);
    const fills = [];
    for (let k = 0; k < nFill; k++) fills.push(this.o.fill(i));
    const cells = finalCells.concat(fills, cur);
    const html = cells.map((s, k) => this.cellHTML(s, k >= 5 + 3 && k < 5 + nFill - 2 ? 'blur' : '')).join('');
    R.strip.innerHTML = html;
    const rest = this.restY();
    const start = rest - (cells.length - 5) * ch;
    R.strip.style.transform = `translateY(${start}px)`;
    const end = rest;
    const D = end - start;
    const ms = T * 1000;
    const oWind = 0.05, oAcc = slow ? 0.1 : 0.16, oLin = slow ? 0.52 : 0.78, oOver = slow ? 0.95 : 0.93;
    const yWind = start - 0.22 * ch;
    const yAcc = start + 1.1 * ch;
    const vLin = (D * 0.6) / ((oLin - oAcc) * ms);
    let decel = (vLin * (oOver - oLin) * ms) / (slow ? 2.4 : 3.2);
    const overshoot = (slow ? 0.12 : 0.24) * ch;
    let yLin = end + overshoot - decel;
    if (yLin < yAcc + ch) yLin = yAcc + ch;
    const kf = [
      { transform: `translateY(${start}px)`, offset: 0, easing: 'ease-out' },
      { transform: `translateY(${yWind}px)`, offset: oWind, easing: 'ease-in' },
      { transform: `translateY(${yAcc}px)`, offset: oAcc, easing: 'linear' },
      { transform: `translateY(${yLin}px)`, offset: oLin, easing: slow ? 'cubic-bezier(.15,.55,.25,1)' : 'cubic-bezier(.2,.7,.35,1)' },
      { transform: `translateY(${end + overshoot}px)`, offset: oOver, easing: 'ease-in-out' },
      { transform: `translateY(${end}px)`, offset: 1 },
    ];
    let slowFired = false;
    return new Promise((resolve) => {
      const anim = R.strip.animate(kf, { duration: ms, fill: 'forwards' });
      R.anim = anim;
      if (this._hurry) anim.playbackRate = 4;
      if (slow && o.onSlow) {
        const at = ms * oLin - 350;
        R.slowTimer = setTimeout(() => { if (!slowFired) { slowFired = true; R.el.classList.add('antic'); o.onSlow(i); } }, Math.max(0, at / (this._hurry ? 4 : 1)));
      }
      anim.onfinish = () => {
        clearTimeout(R.slowTimer);
        R.el.classList.remove('antic');
        R.strip.innerHTML = finalCells.map((s) => this.cellHTML(s)).join('');
        R.strip.style.transform = `translateY(${rest}px)`;
        anim.cancel();
        R.anim = null;
        R.cur = finalCells.slice();
        R.el.classList.remove('bump'); void R.el.offsetWidth; R.el.classList.add('bump');
        if (o.onStop) o.onStop(i, slow);
        resolve();
      };
    });
  }
  // 快停：剩下的輪子加速停下
  hurry() {
    this._hurry = true;
    for (const R of this.reels) if (R.anim) R.anim.playbackRate = 4;
  }
  cell(c, r) { const R = this.reels[c]; return R && R.strip.children[r + 1]; }
  mark(c, r, cls) { const el = this.cell(c, r); if (el) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); } return el; }
  // 免費遊戲：百搭從自己那一格往上下長滿整輪
  expand(c, fromRow) {
    const R = this.reels[c];
    const { ch, peek, rows } = this.o;
    const ov = document.createElement('div');
    ov.className = 'expand';
    ov.style.top = (peek * ch) + 'px';
    ov.style.height = (rows * ch) + 'px';
    ov.style.transformOrigin = `50% ${((fromRow + 0.5) / rows) * 100}%`;
    ov.innerHTML = `<div class="xw-glow"></div><div class="xw-sym">${this.o.sym('W')}</div><div class="xw-txt">W<br>I<br>L<br>D</div>`;
    R.el.appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('in'));
    return ov;
  }
  // ---------- 中獎標示 ----------
  clearWins() {
    this.el.classList.remove('has-win');
    this.el.querySelectorAll('.cell.win').forEach((x) => x.classList.remove('win'));
    this.el.querySelectorAll('.cell.hot').forEach((x) => x.classList.remove('hot'));
    this.lineSvg.innerHTML = '';
    clearTimeout(this._cycle);
  }
  markCells(cells) {
    this.el.classList.add('has-win');
    for (const [c, r] of cells) { const el = this.cell(c, r); if (el) el.classList.add('win'); }
  }
  center(c, r) { const { cw, ch, gap, peek } = this.o; return [c * (cw + gap) + cw / 2, (r + peek) * ch + ch / 2]; }
  drawLine(points, color, label) {
    const pts = points.map(([c, r]) => this.center(c, r));
    const { cw, ch } = this.o;
    const a = pts[0], b = pts[pts.length - 1];
    let vx = b[0] - a[0], vy = b[1] - a[1];
    if (Math.abs(vx) > 1.5 * Math.abs(vy)) vy = 0; else if (Math.abs(vy) > 1.5 * Math.abs(vx)) vx = 0;
    const len = Math.hypot(vx, vy) || 1;
    const ux = vx / len, uy = vy / len, e = this.o.lineExt * (Math.abs(ux) * cw + Math.abs(uy) * ch);
    const ext = [[a[0] - ux * e, a[1] - uy * e], ...pts, [b[0] + ux * e, b[1] + uy * e]];
    const d = ext.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    const ns = 'http://www.w3.org/2000/svg';
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'wl');
    g.innerHTML = `<path d="${d}" stroke="${color}" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/><path d="${d}" stroke="${color}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>` +
      (label ? `<g transform="translate(${pts[pts.length - 1][0]} ${pts[pts.length - 1][1] - 34})"><rect x="-44" y="-18" width="88" height="30" rx="15" fill="#12051f" stroke="${color}" stroke-width="2"/><text x="0" y="3" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="'Orbitron','Noto Sans TC',sans-serif">${label}</text></g>` : '');
    this.lineSvg.appendChild(g);
  }
  // 依序輪播每一條中獎線
  showWins(list, colorOf) {
    this.clearWins();
    if (!list.length) return;
    const all = [];
    list.forEach((w) => all.push(...w.cells));
    this.markCells(all);
    list.forEach((w, k) => { if (w.path !== null) this.drawLine(w.path || w.cells, colorOf(w, k), list.length < 2 ? w.label : null); });
    if (list.length < 2) return;
    let k = 0;
    const cyc = () => {
      if (!this.el.isConnected) return;
      this.lineSvg.innerHTML = '';
      const w = list[k % list.length];
      if (w.path !== null) this.drawLine(w.path || w.cells, colorOf(w, k % list.length), w.label);
      if (this.onCycle) this.onCycle(w);
      this.el.querySelectorAll('.cell.win').forEach((x) => x.classList.remove('win'));
      this.markCells(w.cells);
      k++;
      this._cycle = setTimeout(cyc, 1300);
    };
    this._cycle = setTimeout(cyc, 1600);
  }
};

// ===== src/ui/overlays.js =====
/* 全螢幕演出：大獎分級、JP 轉盤、免費遊戲開場／結算、升級、收集卡、通用對話框。 */
BYC.ui.ov = (function () {
  const St = () => BYC.ui.stage;
  const snd = (n, a) => BYC.ui.sound.play(n, a);
  const layer = () => document.querySelector('#frame .ovl');
  const TIERS = [
    { at: 10, en: 'BIG WIN', zh: '大獎', cls: 't0' },
    { at: 25, en: 'MEGA WIN', zh: '超級大獎', cls: 't1' },
    { at: 50, en: 'SUPER WIN', zh: '驚天大獎', cls: 't2' },
    { at: 100, en: 'EPIC WIN', zh: '傳說級大獎', cls: 't3' },
  ];
  function tierOf(mult) { let t = -1; TIERS.forEach((x, i) => { if (mult >= x.at) t = i; }); return t; }
  const DURS = [3200, 4600, 6000, 7600];
  const durOf = (amount, bet) => DURS[Math.max(0, tierOf(amount / bet))];

  function shell(cls) {
    const { h } = St();
    const el = h('div', { class: 'ov ' + (cls || '') });

    requestAnimationFrame(() => el.classList.add('in'));

  }
  function close(el) { if (el.contains(St().canvas)) St().canvasHome(); el.classList.add('out'); setTimeout(() => el.remove(), 380); }
  const behind = (el, box) => St().canvasTo(el, box);
  const colCenter = () => { const s = St().size(); return { x: s.W / 2, y: s.H * 0.46 }; };

  // ---------- 大獎（數字往上跳，跨過門檻就升級：BIG → MEGA → SUPER → EPIC） ----------
  function bigWin(amount, bet, opt) {
    const o = opt || {};
    const { h, fmt } = St();
    const final = tierOf(amount / bet);
    if (final < 0 && !o.force) return Promise.resolve();
    BYC.ui.music.duck(true);
    const label = o.label ? { en: o.label, zh: o.sub || '', cls: o.cls || 't3' } : TIERS[0];
    const el = shell('bigwin ' + (o.cls ? o.cls : TIERS[Math.max(0, final)].cls));
    const rays = h('div', { class: 'rays' });
    const en = h('div', { class: 'bw-en' }, label.en);
    const zh = h('div', { class: 'bw-zh' }, label.zh);
    const num = h('div', { class: 'bw-num' }, '0');
    const tap = h('div', { class: 'bw-tap' }, '點一下跳過');
    const box = h('div', { class: 'bw-box' }, en, zh, num);
    el.append(rays, box, tap);
    St().canvasTo(el, box);
    const dur = o.dur || DURS[Math.max(0, final)];
    let cur = o.label ? -1 : 0;
    snd(o.label ? 'jackpot' : 'tier', 0);
    const stopTick = BYC.ui.sound.counting(60);
    const c = colCenter();
    const fount = setInterval(() => St().coins(c.x, c.y + 260, 6, { stagger: 0.5, min: 12, max: 24 }), 140);
    if (final >= 2 || o.label) St().confetti(120);
    let done = false, finishedAt = 0, resolveFn;
    const finish = () => {
      if (done) return;
      done = true; finishedAt = Date.now();
      clearInterval(fount); stopTick();
      num.textContent = fmt(amount);
      if (!o.label && final > cur) { cur = final; const T = TIERS[final]; en.textContent = T.en; zh.textContent = T.zh; el.className = 'ov bigwin in ' + T.cls; }
      el.classList.add('done');
      snd('fanfare'); snd('coins', 14);
      St().coins(c.x, c.y, 50, { spread: 1.3, max: 26 });
      setTimeout(() => { if (el.isConnected) end(); }, o.hold || 1800);
    };
    const end = () => { if (!el.isConnected) return; close(el); BYC.ui.music.duck(false); resolveFn(); };
    const counter = St().countTo(num, 0, amount, dur, {
      linear: true,
      onStep(v) {
        if (o.label) return;
        const t = tierOf(v / bet);
        if (t > cur && t >= 0) {
          cur = t;
          const T = TIERS[t];
          en.textContent = T.en; zh.textContent = T.zh;
          el.className = 'ov bigwin in ' + T.cls;
          en.classList.remove('pop'); void en.offsetWidth; en.classList.add('pop');
          if (t > 0) { snd('tier', t); St().shake(null, t >= 2); St().flash('rgba(255,236,170,.45)'); St().sparks(c.x, c.y - 80, 60); }
        }
      },
      done: finish,
    });
    el.addEventListener('click', () => { if (!done) counter.stop(); else if (Date.now() - finishedAt > 300) end(); });
    return new Promise((r) => { resolveFn = r; });
  }

  // ---------- JP 轉盤 ----------
  function jpWheel(segs, resultTier, values, opt) {
    const o = opt || {};
    const { h, fmt } = St();
    const el = shell('jpwheel');
    const n = segs.length;
    const R = 230;
    const colors = { MINI: ['#2ad6ff', '#0b5f9c'], MINOR: ['#5dff9e', '#0d7a3d'], MAJOR: ['#c06bff', '#4a138f'], GRAND: ['#ffe066', '#c26a00'] };
    let svg = `<svg viewBox="-260 -260 520 520" class="jw-svg"><defs>${Object.entries(colors).map(([k, [a, b]]) => `<radialGradient id="jw-${k}" cx="0" cy="0" r="${R}" gradientUnits="userSpaceOnUse"><stop offset=".25" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></radialGradient>`).join('')}</defs>`;
    svg += `<circle r="${R + 22}" fill="url(#g-gold)" stroke="#5a2a00" stroke-width="4"/><circle r="${R + 6}" fill="#14051f"/>`;
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2 - Math.PI / 2 - Math.PI / n, a1 = a0 + (Math.PI * 2) / n;
      const p = (a) => `${(Math.cos(a) * R).toFixed(1)} ${(Math.sin(a) * R).toFixed(1)}`;
      svg += `<path d="M0 0L${p(a0)}A${R} ${R} 0 0 1 ${p(a1)}Z" fill="url(#jw-${segs[i]})" stroke="#14051f" stroke-width="3"/>`;
      const am = (a0 + a1) / 2;
      svg += `<g transform="rotate(${(am * 180 / Math.PI + 90).toFixed(1)})"><text y="${-R + 52}" text-anchor="middle" font-family="${BYC.art.DISPLAY}" font-size="${segs[i] === 'GRAND' ? 30 : 24}" fill="#fff" stroke="#14051f" stroke-width="4" paint-order="stroke">${segs[i]}</text></g>`;
    }
    for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2; svg += `<circle cx="${(Math.cos(a) * (R + 14)).toFixed(1)}" cy="${(Math.sin(a) * (R + 14)).toFixed(1)}" r="5" class="jw-bulb" style="animation-delay:${(i % 2) * 0.3}s" fill="#fff6c8"/>`; }
    svg += '</svg>';
    const wheel = h('div', { class: 'jw-wheel', html: svg });
    const ptr = h('div', { class: 'jw-ptr', html: '<svg viewBox="0 0 60 70"><path d="M30 68L4 10Q30 -6 56 10Z" fill="url(#g-gold)" stroke="#5a2a00" stroke-width="3"/><circle cx="30" cy="20" r="8" fill="#e8202f"/></svg>' });
    const title = h('div', { class: 'jw-title' }, 'JACKPOT 轉盤');
    const vals = h('div', { class: 'jw-vals' }, ...['GRAND', 'MAJOR', 'MINOR', 'MINI'].filter((k) => values[k] != null).map((k) => h('div', { class: 'jv jv-' + k }, h('b', null, k), h('span', null, fmt(values[k])))));
    el.append(title, h('div', { class: 'jw-wrap' }, wheel, ptr, h('div', { class: 'jw-hub' }, 'JP')), vals);
    // 選一格結果；不是 GRAND 時優先停在 GRAND 旁邊（差一點）
    const idxs = segs.map((s, i) => (s === resultTier ? i : -1)).filter((i) => i >= 0);
    const gi = segs.indexOf('GRAND');
    let pick = idxs[Math.floor(Math.random() * idxs.length)];
    let near = false;
    if (resultTier !== 'GRAND') { const adj = idxs.filter((i) => Math.abs(i - gi) === 1 || Math.abs(i - gi) === n - 1); if (adj.length && Math.random() < 0.75) { pick = adj[0]; near = true; } }
    const spins = 6;
    const offset = (Math.random() - 0.5) * (360 / n) * (near ? 0.3 : 0.6) + (near ? (((pick - gi + n) % n) === 1 ? -1 : 1) * (360 / n) * 0.32 : 0);
    const deg = spins * 360 - (pick * 360) / n + offset;
    let ticks = 0;
    return new Promise((resolve) => {
      setTimeout(() => {
        snd('riser', 4.2);
        wheel.style.transition = 'transform 5.2s cubic-bezier(.12,.6,.12,1)';
        wheel.style.transform = `rotate(${deg}deg)`;
        const tick = setInterval(() => { if (ticks++ < 60) snd('wheelTick'); }, 85);
        setTimeout(() => clearInterval(tick), 5000);
        setTimeout(() => {
          clearInterval(tick);
          el.querySelectorAll('.jv').forEach((x) => x.classList.toggle('hit', x.classList.contains('jv-' + resultTier)));
          snd('jackpot');
          St().flash('rgba(255,240,180,.6)');
          setTimeout(() => { close(el); resolve({ near }); }, 1600);
        }, 5500);
      }, 700);
    });
  }

  // ---------- 免費遊戲 ----------
  function fsIntro(n, mult) {
    const { h } = St();
    const el = shell('fsintro');
    snd('fsStart');
    BYC.ui.music.setMood('free');
    const box = h('div', { class: 'fs-box' }, h('div', { class: 'fs-en' }, 'FREE SPINS'), h('div', { class: 'fs-zh' }, '免費遊戲'), h('div', { class: 'fs-n' }, n + ' 次'), h('div', { class: 'fs-rule' }, `所有獎金 ×${mult}　WILD 出現就擴展整輪`));
    el.append(h('div', { class: 'rays' }), box, h('div', { class: 'bw-tap' }, '點一下開始'));
    behind(el, box);
    const c = colCenter();
    St().sparks(c.x, c.y, 90); St().confetti(80);
    return new Promise((resolve) => {
      const go = () => { if (!el.isConnected) return; close(el); resolve(); };
      el.addEventListener('click', go);
      setTimeout(go, 2800);
    });
  }
  function fsOutro(total, bet) {
    const { h, fmt } = St();
    if (total / bet >= 10) return bigWin(total, bet, {});
    const el = shell('fsintro');
    el.append(h('div', { class: 'fs-box' }, h('div', { class: 'fs-zh' }, '免費遊戲結束'), h('div', { class: 'fs-n' }, fmt(total))), h('div', { class: 'bw-tap' }, '點一下繼續'));
    snd('win2');
    return new Promise((resolve) => { const go = () => { if (!el.isConnected) return; close(el); resolve(); }; el.addEventListener('click', go); setTimeout(go, 2200); });
  }

  // ---------- 升級 ----------
  function levelUp(up) {
    const { h, fmt } = St();
    const el = shell('lvup');
    snd('levelUp');
    const lines = [h('div', { class: 'lv-reward' }, '+' + fmt(up.reward))];
    if (up.cap) lines.push(h('div', { class: 'lv-line' }, '最高押注提高到 ' + fmt(up.cap)));
    for (const m of up.unlocked) lines.push(h('div', { class: 'lv-line hot' }, ({ gems: '霓虹寶石', eight: '烈焰八線', mary: '金幣小瑪莉' })[m] + ' 解鎖了！'));
    const box = h('div', { class: 'lv-box' }, h('div', { class: 'lv-en' }, 'LEVEL UP'), h('div', { class: 'lv-n' }, 'Lv ' + up.level), ...lines);
    el.append(h('div', { class: 'rays' }), box);
    behind(el, box);
    const c = colCenter();
    St().sparks(c.x, c.y - 60, 80); St().coins(c.x, c.y + 120, 30);
    return new Promise((resolve) => { const go = () => { if (!el.isConnected) return; close(el); resolve(); }; el.addEventListener('click', go); setTimeout(go, up.unlocked.length ? 3200 : 2300); });
  }

  // ---------- 收集卡掉落（不擋操作） ----------
  function sticker(st) {
    const { h } = St();
    const rar = ['普通', '稀有', '金卡'][st.rarity];
    const el = h('div', { class: 'stk-pop r' + st.rarity }, h('div', { class: 'stk-art', html: BYC.art.sym(st.sym) }), h('div', { class: 'stk-txt' }, h('small', null, st.albumName + '收集卡'), h('b', null, st.name), h('span', null, rar + (st.isNew ? '・NEW' : '・重複'))));
    St().fx.appendChild(el);
    snd(st.isNew ? 'unlock' : 'bet');
    setTimeout(() => el.classList.add('out'), 2300);
    setTimeout(() => el.remove(), 2800);
  }

  // ---------- 通用對話框 ----------
  function modal(title, body, opt) {
    const o = opt || {};
    const { h } = St();
    const el = h('div', { class: 'modal ' + (o.cls || '') });
    const card = h('div', { class: 'm-card' }, h('div', { class: 'm-head' }, h('h3', null, title), o.locked ? null : h('button', { class: 'm-x', 'aria-label': '關閉', id: 'm-close', onclick: () => api.close() }, '✕')), body);
    el.appendChild(card);
    el.addEventListener('click', (e) => { if (e.target === el && !o.locked) api.close(); });
    layer().appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    const api = { el, close() { if (!el.isConnected) return; snd('click'); el.classList.add('out'); setTimeout(() => el.remove(), 260); if (o.onClose) o.onClose(); } };
    return api;
  }

  return { TIERS, tierOf, durOf, bigWin, jpWheel, fsIntro, fsOutro, levelUp, sticker, modal, close };
})();

// ===== src/ui/slot.js =====
/* 機台共用零件：頂端列、JP 看板、贏分顯示、押注與 SPIN 按鈕、自動轉、揭密條。 */
BYC.ui.slot = (function () {
  const St = () => BYC.ui.stage;
  const M = () => BYC.meta;
  const S = () => BYC.ui.save.data;
  const snd = (n, a) => BYC.ui.sound.play(n, a);

  const ICON = {
    back: '<svg viewBox="0 0 40 40"><path d="M24 8L11 20L24 32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3.5"/><circle cx="20" cy="12.5" r="2.6" fill="currentColor"/><path d="M20 18V29" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/></svg>',
    gear: '<svg viewBox="0 0 40 40"><path d="M17 4h6l1 5 4 2 4-3 4 4-3 4 2 4 5 1v6l-5 1-2 4 3 4-4 4-4-3-4 2-1 5h-6l-1-5-4-2-4 3-4-4 3-4-2-4-5-1v-6l5-1 2-4-3-4 4-4 4 3 4-2z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="20" r="5.5" fill="none" stroke="currentColor" stroke-width="3"/></svg>',
  };

  function topbar(o) {
    const { h } = St();
    const hud = BYC.ui.hud;

    const el = h('div', { class: 'topbar m' }, back, hud.coinPill(), h('div', { class: 'tb-lv' }, hud.lvBadge(true), hud.xpBar()), pay, gear);
    hud.refresh();
    return el;
  }

  // ---------- JP 看板（數字一直在跑） ----------
  function jpBoard(machine, tiers, getBet) {
    const { h, countTo } = St();
    const plates = {};
    const shown = {};
    const order = tiers.slice().reverse(); // GRAND 在前
    for (const t of order) {
      const num = h('b', { class: 'jp-num' }, '0');
      plates[t.id] = h('div', { class: 'jp-plate jp-' + t.id }, h('span', { class: 'jp-lab' }, t.name), num);
      plates[t.id]._num = num;
    }
    const grand = plates[order[0].id];
    const rest = order.slice(1).map((t) => plates[t.id]);
    const el = h('div', { class: 'jp-board n' + rest.length }, grand, h('div', { class: 'jp-row' }, ...rest));
    const anims = {};
    function update(animate) {
      const bet = getBet();
      for (const t of tiers) {
        const v = M().jpValue(machine, t.id, t.mult, bet);
        const num = plates[t.id]._num;
        if (anims[t.id]) anims[t.id].cancel();
        if (animate && shown[t.id] != null) {
          const from = shown[t.id];
          const a = countTo(num, from, v, animate === true ? 700 : animate, { linear: true });
          anims[t.id] = a;
        } else num.textContent = St().fmt(v);
        shown[t.id] = v;
      }
    }
    let iv = setInterval(() => { if (!el.isConnected) { clearInterval(iv); return; } if (document.hidden) return; M().jpDrift(machine, 1); update(980); }, 1000);
    update(false);
    function flash(tier) { const p = plates[tier]; if (!p) return; p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit'); }
    return { el, update, flash, stop() { clearInterval(iv); } };
  }

  // ---------- 贏分顯示 ----------
  function winBar() {
    const { h, fmt, countTo } = St();
    const num = h('b', { class: 'wb-num' }, '0');

      el,
      clear(text) { if (anim) anim.stop(); el.classList.remove('hot', 'ldw', 'big'); num.textContent = '0'; msg.textContent = text || '祝你好運'; msg.className = 'wb-msg'; },
      count(amount, ms, cls) {
        el.classList.remove('hot', 'ldw', 'big'); void el.offsetWidth;
        el.classList.add('hot'); if (cls) el.classList.add(cls);
        return new Promise((r) => { anim = countTo(num, 0, amount, ms, { done: r }); });
      },
      set(amount, hot) { if (anim) anim.stop(); num.textContent = fmt(amount); if (hot) el.classList.add('hot'); },
      msg(text, cls) { msg.textContent = text; msg.className = 'wb-msg' + (cls ? ' ' + cls : ''); },
    };
  }

    // ---------- 畫面 ----------
    const top = slot.topbar({ onBack: back, onPay: payTable });

    const fsBar = h('div', { class: 'fs-bar' }, h('b', { class: 'fs-count' }, ''), h('span', { class: 'fs-mult' }, '全部獎金 ×' + E.FS_MULT), h('span', { class: 'fs-won' }, ''));
    const logo = h('div', { class: 'm-logo gems' }, h('div', { class: 'lg-box' }, h('div', { class: 'lg-bulbs' }), h('i', { class: 'lg-art l', html: BYC.art.sym('R') }), h('div', { class: 'lg-sign' }, h('b', null, '霓虹寶石'), h('small', null, 'NEON GEMS · 20 LINES')), h('i', { class: 'lg-art r', html: BYC.art.sym('W') })), fsBar);
    const reelsEl = h('div');

    const honeyNote = () => (M.mode() === 'honey' ? [{ text: `新手蜜月期還剩 ${S.honeyLeft} 轉：這段時間 BONUS 和百搭被調多了，之後會收回來。`, cls: 'honey' }] : []);
    rv.set(honeyNote());

    // ---------- 操作 ----------
    function back() {
      if (busy || fs) { auto = 0; St.toast('這一輪結束後再離開'); return; }
      app.go('lobby');
    }
    function spinPressed() {
      if (fs) { if (reels.spinning) reels.hurry(); return; }
      if (busy) {
        if (reels.spinning) { reels.hurry(); play('click'); }

      if (auto) { auto = 0; ctl.state('idle'); return; }

    }

    // ---------- 轉一次（主遊戲） ----------
    async function playOne() {
      const b = bet();
      if (S.coins < b) { auto = 0; ctl.state('idle'); await app.noMoney(b); return; }
      M.debit(b);
      hud.refresh();

      const slow = E.anticipation(res);

      const tier = ov.tierOf(res.total / b);
      const anticPaid = slow.some(Boolean) && (res.fsAward > 0 || res.wins.some((w) => w.n === 5 && E.HIGH.includes(w.sym)));
      const info = { ldw: res.total > 0 && res.total < b, near: dec.near.length > 0, antic: slow.some(Boolean), anticPaid, fs: res.fsAward > 0, jp: !!res.jp, tier };
      const rec = M.recordSpin(ID, b, res.total, info);
      slot.track(b, res.total, info);

    // 轉輪表演：BONUS 落下、放慢、心跳
    async function runReels(res, dec, slow) {
      const stopWhirr = snd.whirr();

      let susp = null, sc = 0;
      const lastSlow = slow.lastIndexOf(true);
      await reels.spin(res.raw, dec.peek, {
        slow, turbo: !!S.settings.turbo,
        onSlow() { if (!susp) susp = snd.suspense(); cab.classList.add('antic'); },

      if (res.fs && res.expanded.length) {
        for (const c of res.expanded) {
          const fromRow = res.raw[c].indexOf('W');
          reels.expand(c, Math.max(0, fromRow));
          play('expand');
          await sleep(560);
          const p = [reels.reels[c].cur[0], reels.reels[c].cur[4]];
          reels.setColumn(c, [p[0], 'W', 'W', 'W', p[1]]);
          reels.reels[c].el.classList.add('xcol');
        }
      }
    }

    // 中獎表演（線、跳錢、金幣、分級大獎）
    async function present(res, b, tier, notes, bonus, free) {
      const list = res.wins.map((w) => ({ cells: w.cells, path: E.LINES[w.line].map((row, c) => [c, row]), label: fmt(w.amount), line: w.line, sym: w.sym, n: w.n }));
      if (res.scat.length >= 3) list.push({ cells: res.scat, path: null, label: 'BONUS' });
      const total = res.total + (bonus || 0);
      if (!total && !list.length) { win.msg(res.scat.length === 2 ? 'BONUS 兩個了！' : '再來一次', res.scat.length === 2 ? 'tease' : ''); return; }
      reels.showWins(list, (w) => (w.path === null ? '#ffd34d' : LC[w.line % LC.length]));
      const mult = total / b;

      else if (best) win.msg(`${best.n} 個 ${E.NAMES[best.sym]}`, 'hot');
      if (total < b && free) {
        play('win1');
        await Promise.all([win.count(total, 600), hud.release(600)]);
        return;
      }
      if (total < b) {
        // 「贏了」但其實輸了：一樣有聲光

    // ---------- 免費遊戲 ----------
    async function freeSpins(n, b, honey) {

        h('div', { class: 'pt-feature' }, h('div', { class: 'pt-sym', html: BYC.art.sym('W') }), h('div', null, h('b', null, '百搭 WILD'), h('p', null, '只出現在第 2、3、4 輪，可以代替 BONUS 以外的任何圖案。免費遊戲中，百搭會往上下長滿整輪。'))),
        h('div', { class: 'pt-feature' }, h('div', { class: 'pt-sym', html: BYC.art.sym('S') }), h('div', null, h('b', null, 'BONUS'), h('p', null, `出現在任何位置都算。3／4／5 個：免費遊戲 10／15／20 次，另外贏總押注 ×2／×10／×50。免費遊戲裡所有獎金 ×${E.FS_MULT}，還能再加次數。`))),
        h('div', { class: 'pt-feature' }, h('div', { class: 'pt-jp' }, 'JP'), h('div', null, h('b', null, '神秘大獎'), h('p', null, '任何一轉都可能觸發 JP 轉盤，獎金依押注計算：押越大，JP 越大。'))),
        h('div', { class: 'pt-grid' }, ...rows),

    function unmount() {
      alive = false; auto = 0;
      jp.stop();
      hud.finishRelease(); hud.setHold(0);
      S.betIdx.gems = betIdx;
      BYC.ui.save.persist();
    }
    function onReveal() { rv.sync(); root.querySelectorAll('.rv-near').forEach((x) => x.classList.toggle('rv-hide', !S.reveal.on)); }
    function sidePanels() {
      const lb = bet() / E.LINES.length;
      const L = h('div', { class: 'side-card' }, h('h4', null, '賠率'), ...['R', 'B', 'E', 'T', 'P'].map((s) => h('div', { class: 'sp-row' }, h('i', { html: BYC.art.sym(s) }), h('span', null, '5 連'), h('b', null, fmt(E.PAY[s][5] * lb)))), h('div', { class: 'sp-tip' }, 'BONUS 三個以上進免費遊戲，獎金 ×3'));
      return { left: L };
    }
    return { unmount, onReveal, sidePanels, onTurbo: () => ctl.syncTurbo(), get busy() { return busy || !!fs; } };
  }
  return { mount };
})();

// ===== src/ui/m_eight.js =====
/* 烈焰八線：3×3 九宮格、8 條線。王冠連線轉 JP 轉盤，九格都是水果送全盤獎。 */
BYC.ui.mEight = (function () {

  function mount(app, col) {

    const RW = 3 * CW + 2 * GAP, RH = reels.vh;

    const badge = (no, x, y) => { const b = h('div', { class: 'lb', style: { left: x + 'px', top: y + 'px', '--c': LC[no] } }, String(no)); (badges[no] = badges[no] || []).push(b); return b; };
    const rowY = (r) => PADY + (r + PEEK) * CH + CH / 2;
    const colX = (c) => PADX + c * (CW + GAP) + CW / 2;
    const bl = [];
    [[2, 0], [1, 1], [3, 2]].forEach(([no, r]) => { bl.push(badge(no, PADX / 2, rowY(r))); bl.push(badge(no, PADX + RW + PADX / 2, rowY(r))); });
    bl.push(badge(4, PADX / 2, PADY + PEEK * CH - 6), badge(5, PADX / 2, PADY + (3 + PEEK) * CH + 6), badge(5, PADX + RW + PADX / 2, PADY + PEEK * CH - 6), badge(4, PADX + RW + PADX / 2, PADY + (3 + PEEK) * CH + 6));
    [6, 7, 8].forEach((no, c) => { bl.push(badge(no, colX(c), PADY / 2 + 2)); bl.push(badge(no, colX(c), PADY + RH + PADY / 2 - 2)); });
    const cabInner = h('div', { class: 'cab-win eight', style: { left: PADX + 'px', top: PADY + 'px' } }, reelsEl);
    const cab = slot.cabinet(h('div', { class: 'cab-in' }, cabInner, ...bl), RW + 2 * PADX, RH + 2 * PADY, 'eight');
    const win = slot.winBar();
    const rv = slot.revealStrip();
    const ctl = slot.controls({ betIdx, onBet: (i) => { betIdx = i; S.betIdx.eight = i; BYC.ui.save.persist(); jp.update(true); }, onSpin: spinPressed, onAutoBtn: autoPressed });
    const root = h('div', { class: 'mscr eight' }, top, jp.el, logo, cab, win.el, rv.el, ctl.el);
    col.appendChild(root);

    win.clear('王冠連線轉 JP 轉盤');
    const honeyNote = () => (M.mode() === 'honey' ? [{ text: `新手蜜月期還剩 ${S.honeyLeft} 轉：輸的那一把，有三分之一的機率會偷偷重抽一次。`, cls: 'honey' }] : []);
    rv.set(honeyNote());
    reels.onCycle = (w) => lightBadges(w.line ? [w.line] : []);

    function lightBadges(nos) {

    function back() { if (busy) { auto = 0; St.toast('這一轉結束後再離開'); return; } app.go('lobby'); }

    async function playOne() {
      const b = bet();
      if (S.coins < b) { auto = 0; ctl.state('idle'); await app.noMoney(b); return; }

      hud.refresh();
      busy = true; ctl.lock(true);

      const rec = M.recordSpin(ID, b, res.total, info);

        notes.push({ text: `安排的差一點：${n.why}。結果早在按下 SPIN 時就決定了，框外那顆王冠是擺給你看的。`, cls: 'near' });

      rv.set(notes);

    async function present(res, b, tier, notes, bonus) {

  async noMoney(bet) {
    const St = BYC.ui.stage, M = BYC.meta;
    if (!M.broke()) { BYC.ui.sound.play('error'); St.toast(`金幣不夠押 ${St.fmt(bet)}，先把押注調低`, { cls: 'lock' }); return; }
    await BYC.ui.panels.rescue();
  }
  onTurbo() { if (this.ctl && this.ctl.onTurbo) this.ctl.onTurbo(); }
  onReveal() {
    if (this.ctl && this.ctl.onReveal) this.ctl.onReveal();
    if (this.screen === 'lobby') this.show('lobby');
    this.paintSides();
  }
  revealLog(lines) {
    if (!lines || !lines.length) return;
    for (const l of lines) this.rvLog.unshift({ text: l.text, cls: l.cls, t: Date.now() });
    this.rvLog.length = Math.min(this.rvLog.length, 6);
    this.paintSides();
  }
  afterReset() { this.autoShown = ''; this.rvLog = []; this.show('lobby'); }

  // ---------- 橫向螢幕的側邊資訊板 ----------
  paintSides() {
    const St = BYC.ui.stage, { h, fmt, short } = St;
    const L = St.sideL, R = St.sideR;
    if (!L || !R) return;
    if (!document.body.classList.contains('land') || !this.screen || this.screen === 'title') { L.innerHTML = ''; R.innerHTML = ''; return; }
    const M = BYC.meta, S = BYC.ui.save.data;
    L.innerHTML = ''; R.innerHTML = '';
    if (this.screen === 'lobby') {
      const m = M.ensureMissions();
      L.appendChild(h('div', { class: 'side-card' }, h('h4', null, '今日任務'), ...m.list.map((x) => h('div', { class: 'sm-row' + (x.claimed ? ' done' : '') }, h('span', null, x.type === 'betSum' ? '累積押注 ' + short(x.target) : x.text), h('div', { class: 'ms-bar' }, h('i', { style: { width: Math.min(100, (100 * x.progress) / x.target).toFixed(1) + '%' } }))))));
      const st = M.streakState();
      L.appendChild(h('div', { class: 'side-card' }, h('h4', null, '連續簽到'), h('div', { class: 'sk-dots' }, ...M.STREAK.map((_, i) => h('i', { class: i < (st.claimed ? st.day : st.next - 1) ? 'on' : '' }))), h('div', { class: 'sp-tip' }, st.claimed ? `已連續 ${st.day} 天` : '今天還沒簽到')));
      R.appendChild(h('div', { class: 'side-card feed' }, h('h4', null, '大獎快訊'), ...this.winFeed.map((w) => h('div', { class: 'fd-row' + (w.hot ? ' hot' : '') }, h('b', null, w.who), h('span', null, w.text), h('em', null, short(w.amount)), S.reveal.on ? h('i', { class: 'tk-fake' }, '假的') : null))));
    } else {
      const sp = this.ctl && this.ctl.sidePanels ? this.ctl.sidePanels() : {};
      if (sp.left) L.appendChild(sp.left);
      const ss = BYC.ui.slot.session;
      const net = ss.won - ss.bet;
      R.appendChild(h('div', { class: 'side-card' }, h('h4', null, '這一輪'), h('div', { class: 'ss-grid' },
        h('div', null, h('small', null, '轉數'), h('b', null, fmt(ss.spins))), h('div', null, h('small', null, '押注'), h('b', null, short(ss.bet))),
        h('div', null, h('small', null, '贏回'), h('b', null, short(ss.won))), h('div', null, h('small', null, '輸贏'), h('b', { class: net >= 0 ? 'up' : 'down' }, (net >= 0 ? '+' : '') + short(net))))));
      if (S.reveal.on) R.appendChild(h('div', { class: 'side-card rv' }, h('h4', null, '揭密紀錄'), ...(this.rvLog.length ? this.rvLog.map((x) => h('div', { class: 'rv-line ' + (x.cls || '') }, x.text)) : [h('div', { class: 'sp-tip' }, '轉幾次，這裡會列出每一個機關')])));
    }
  }
};

// ===== boot =====
(function () {
  const start = (data) => {
    document.body.insertAdjacentHTML('beforeend', BYC.art.defs());
    window.BYC = BYC;
    const app = new BYC.ui.App(document.getElementById('app'));
    app.boot(data || {});
  };
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
