<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="觀戰">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>觀戰 SPECTATE</title>
<!--WEBHEAD-->
<style>
/*FONTS*/
/*CSS*/
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="pin"></i></div>

<header id="top">
  <a class="bug" href="#home" data-nav="home" aria-label="回轉播台">
    <span class="bug-logo">觀戰</span><span class="bug-en">SPECTATE</span>
    <span class="bug-clock" id="clock">--:--</span>
  </a>
  <span class="onair" id="onair" hidden><i></i>ON AIR <b id="onairN">0</b></span>
  <span class="top-sp"></span>
  <button class="ico-btn" id="btnSearch" aria-label="搜尋"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg></button>
  <button class="sync" id="sync" aria-label="同步狀態"><i></i></button>
</header>
<div id="ticker" aria-hidden="true"><div class="tk-in" id="tickerIn"></div></div>

<main id="view" tabindex="-1"></main>

<nav id="tabs">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 19h8v2H8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8l5 2.5-5 2.5z"/></svg><span>轉播台</span></a>
  <a href="#storm" data-tab="storm"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.7"/><path d="M12 3.6a8.4 8.4 0 0 1 8.3 7M20.4 12.2a8.4 8.4 0 0 1-7 8.2M11.8 20.4a8.4 8.4 0 0 1-8.2-7M3.6 11.8a8.4 8.4 0 0 1 7-8.2" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg><span>特別轉播</span><b class="tab-dot" id="tabStormDot" hidden></b></a>
  <a href="#live" data-tab="live"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4M8.8 8.8a4.5 4.5 0 0 0 0 6.4M15.2 8.8a4.5 4.5 0 0 1 0 6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>直播</span><b class="tab-dot" id="tabLiveDot" hidden></b></a>
  <a href="#games" data-tab="games"><svg viewBox="0 0 24 24"><path d="M7 8h10a4 4 0 0 1 3.9 4.8l-.9 4A2.6 2.6 0 0 1 15.6 18L14 16h-4l-1.6 2a2.6 2.6 0 0 1-4.4-1.2l-.9-4A4 4 0 0 1 7 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 11v3M6.5 12.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15.5" cy="11.5" r="1.1"/><circle cx="17.3" cy="13.6" r="1.1"/></svg><span>遊戲</span></a>
  <a href="#rookies" data-tab="rookies"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.1l6.1-.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>新秀</span><b class="tab-dot" id="tabRookDot" hidden></b></a>
  <a href="#me" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>我的</span></a>
</nav>

<!-- 導播台（播放器） -->
<section id="pgm" hidden aria-label="導播台">
  <div class="pgm-bar">
    <span class="pgm-tag">PGM</span><span class="pgm-live" id="pgmLive" hidden>LIVE</span>
    <span class="pgm-ttl" id="pgmTtl"></span>
    <button class="ico-btn" id="pgmFull" aria-label="全螢幕"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <button class="ico-btn" id="pgmClose" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>
  <div class="pgm-main">
    <div class="pgm-stage"><div class="pgm-frame" id="pgmFrame"><div id="ytp"></div><div class="pgm-wipe" id="pgmWipe"><i></i><i></i><i></i></div><div class="pgm-msg" id="pgmMsg" hidden></div><div class="pgm-next" id="pgmNext" hidden></div><div class="fsx-tip" id="pgmTip"></div><div class="fsx-rail" id="pgmRail"><div class="fr-g"><button id="fxExit" aria-label="退出全螢幕"><svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button><button id="fxFlip" aria-label="反過來"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="fr-g"><button id="fxNext" aria-label="下一支"><b>TAKE</b><svg viewBox="0 0 24 24"><path d="M7 5l11 7-11 7z" fill="currentColor"/></svg></button></div></div></div></div>
    <div class="pgm-side">
      <div class="pgm-info" id="pgmInfo"></div>
      <div class="pgm-pvw" id="pgmPvw"></div>
    </div>
  </div>
</section>

<div id="sheet" hidden></div>
<div id="stinger" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><div class="st-logo"><b>觀戰</b><small>SPECTATE</small></div></div>
<div id="toast" aria-live="polite"></div>
<div id="gate" hidden></div>

<!--WEBFLAG-->
<script>
/*JS*/
</script>
</body>
</html>
