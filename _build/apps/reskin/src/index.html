<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>耳目一新 RESKIN</title>
<meta name="description" content="痞子葳的換膚音樂播放器：九套 Skin 一鍵換裝，播自己的音樂檔，離線也能聽。">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="耳目一新">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff2bd6'/%3E%3Cstop offset='1' stop-color='%2322f3ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%2309061c'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='url(%23g)' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/*FONTS*/
/*CSS*/
</style>
</head>
<body>
<noscript><p style="color:#eee;padding:24px;font-family:sans-serif">耳目一新需要開啟 JavaScript 才能使用。</p></noscript>
<div id="app">
  <main id="stage" aria-label="播放器"></main>
  <nav id="dock" aria-label="功能">
    <button type="button" class="dk" data-act="lib" aria-label="歌庫"></button>
    <button type="button" class="dk" data-act="wardrobe" aria-label="衣櫃（換 Skin）"></button>
    <button type="button" class="dk" data-act="party" aria-label="派對模式"></button>
    <button type="button" class="dk" data-act="settings" aria-label="設定"></button>
  </nav>
  <section id="empty" hidden></section>
  <div id="partyTitle" aria-hidden="true"></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-act="sheet-close"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" tabindex="-1"><div class="sheet-grab" data-act="sheet-close" aria-hidden="true"><i></i></div><div id="sheetBody"></div></div>
  </div>
  <section id="wardrobe" hidden aria-label="衣櫃"></section>
  <div id="modal" hidden></div>
  <div id="busy" hidden><div class="busy-box"><div class="busy-ring"><i></i></div><b id="busyTitle"></b><span id="busyText"></span><div class="busy-bar"><i id="busyBar"></i></div></div></div>
  <div id="drop" hidden><div><b>放開就匯入</b><span>MP3、M4A、FLAC、WAV</span></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="splash" aria-hidden="true"><div class="sp-logo"><i></i><b>耳目一新</b><small>RESKIN</small></div></div>
  <input type="file" id="fileIn" hidden multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.aif,.aiff,.ogg,.oga,.opus,.webm,.caf">
  <input type="file" id="folderIn" hidden multiple webkitdirectory>
  <input type="file" id="photoIn" hidden accept="image/*">
  <div id="decks" hidden></div>
</div>
<script>
(function () {
'use strict';
/*JS*/
})();
</script>
</body>
</html>
