<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>下回分解</title>
<meta name="description" content="痞子葳的書房：連載小說寫完就上架，也能匯入自己的電子書；翻頁、聽說書都在這裡。">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0b1422">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="下回分解">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d2f4a'/%3E%3Crect x='14' y='12' width='22' height='40' rx='1.500' fill='%23ece4d2'/%3E%3Crect x='19' y='37' width='12' height='11' rx='1.500' fill='%23b3382c'/%3E%3Cpath d='M48 8v48' stroke='%23e4dcc8' stroke-width='2'/%3E%3Cpath d='M48 18h10M48 32h10M48 46h10' stroke='%23e4dcc8' stroke-width='2'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;500;700;900&display=swap">
<style>

<body>
<noscript><p style="color:#dfe6ee;padding:24px;font-family:serif">下回分解需要開啟 JavaScript 才能使用。</p></noscript>
<div id="app">
  <main id="lib" class="view" tabindex="-1"></main>
  <section id="bookv" class="view" hidden tabindex="-1"></section>

  <section id="reader" hidden aria-label="閱讀器">
    <div class="rd-stage" id="rdStage">
      <div class="leaf" id="leafA"><div class="leaf-in"><div class="vp"><div class="flow"></div></div><div class="pg-foot"><span class="pf-l"></span><span class="pf-r"></span></div></div></div>
      <div class="leaf" id="leafB"><div class="leaf-in"><div class="vp"><div class="flow"></div></div><div class="pg-foot"><span class="pf-l"></span><span class="pf-r"></span></div></div></div>
      <div class="flapc off" id="flapC"><div class="flap"><div class="ghost"><div class="vp"><div class="flow"></div></div></div></div></div>
      <div class="foldsh off" id="foldSh"></div>
      <div class="rd-ribbon" id="rdRibbon" aria-hidden="true"></div>
    </div>
    <div class="rd-scroll" id="rdScroll" hidden><div class="flow" id="scFlow"></div></div>
    <header class="rd-top">
      <button type="button" class="ib" data-act="rd-back" aria-label="回到書頁"></button>
      <div class="rd-title"><b id="rdBook"></b><span id="rdCh"></span></div>
      <button type="button" class="ib" data-act="rd-mark" aria-label="這一頁加書籤"></button>
      <button type="button" class="ib" data-act="rd-toc" aria-label="目錄、書籤、搜尋"></button>
      <button type="button" class="ib" data-act="rd-share" aria-label="複製或分享這一回"></button>
      <button type="button" class="ib" data-act="rd-look" aria-label="字體與外觀"></button>
    </header>
    <footer class="rd-bot">
      <div class="rd-seek">
        <button type="button" class="tb" data-act="rd-prevch">上一回</button>
        <input type="range" id="rdRange" min="0" max="0" step="1" value="0" aria-label="這一回的頁數">
        <button type="button" class="tb" data-act="rd-nextch">下一回</button>
      </div>
      <div class="rd-acts"><span id="rdPos"></span><button type="button" class="btn gilt" data-act="rd-narr"></button></div>
    </footer>
    <button type="button" class="rd-pill" id="rdFollow" data-act="rd-follow" hidden>回到說書的地方</button>
    <div class="rd-veil" id="rdVeil" aria-hidden="true"></div>
    <div class="rd-card" id="rdCard" data-act="card-close" hidden></div>
    <div class="coach" id="coach" hidden></div>
    <div class="rd-load" aria-hidden="true"><i></i></div>
  </section>

  <nav id="gbar" hidden aria-label="分類"></nav>
  <div id="mini" hidden></div>
  <div id="menu" hidden role="menu"></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-act="sheet-close"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" tabindex="-1"><div class="sheet-grab" data-act="sheet-close" aria-hidden="true"><i></i></div><div id="sheetBody"></div></div>
  </div>
  <div id="pop" hidden></div>
  <div id="opening" hidden aria-hidden="true"></div>
  <div id="busy" hidden><div class="busy-box"><i></i><span id="busyText"></span></div></div>
  <div id="drop" hidden><div><b>放開就匯入</b><span>EPUB、TXT、Markdown</span></div></div>
  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="file" hidden multiple accept=".epub,.txt,.md,.markdown,application/epub+zip,text/plain,text/markdown">
</div>

/*VENDOR*/
</script>

(function () {
'use strict';

})();
</script>
</body>
</html>
