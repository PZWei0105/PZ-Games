<!DOCTYPE html>
<html lang="zh-Hant-TW" class="sky-day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5fb8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="補番">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>補番 BINGE</title>
<!--WEBHEAD-->
<style>
/*FONTS*/
/*CSS*/
</style>
</head>
<body>
<div id="sky" aria-hidden="true">
  <i class="sky-grad"></i>
  <i class="stars s1"></i><i class="stars s2"></i>
  <i class="sun"></i>
  <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
  <i class="mote m1"></i><i class="mote m2"></i><i class="mote m3"></i><i class="mote m4"></i><i class="mote m5"></i>
  <svg class="town" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMax slice">
    <path class="wire" d="M-20 70 Q 300 120 640 64 Q 980 8 1300 70 Q 1460 100 1620 78 M-20 92 Q 320 140 640 86 Q 990 34 1300 92 Q 1460 120 1620 100"/>
    <path class="roofs" d="M0 220V150h60v-20h40v20h30v-36h70v36h22v-56l38-24 38 24v56h40v-28h56v28h18v-62h24v-14h12v14h30v62h44v-34h62v34h30v-48h22v-30h8v30h26v48h50v-22h80v22h24v-70h18v-20h10v20h44v70h40v-40h70v40h30v-30l35-22 35 22v30h28v-58h50v58h22v-26h60v26h36v-46h28v-18h8v18h34v46h48v-30h70v30h40v-52h26v52h32v-20h60v20h30v70z"/>
    <path class="pole" d="M1296 220V40h8v180zM1270 58h60v6h-60zM1276 74h48v5h-48zM300 220V60h7v160zM278 76h52v6h-52z"/>
    <rect class="win w1" x="226" y="134" width="8" height="10"/><rect class="win w2" x="512" y="118" width="8" height="10"/><rect class="win w3" x="742" y="152" width="8" height="10"/>
    <rect class="win w4" x="978" y="128" width="8" height="10"/><rect class="win w5" x="1188" y="140" width="8" height="10"/><rect class="win w6" x="1452" y="150" width="8" height="10"/>
  </svg>
</div>

<header id="top">
  <a class="logo" href="#home" aria-label="回放送"><b class="d">補番</b><span class="d">BINGE</span></a>
  <span class="ep-pill"><i id="skyLab">白天</i><b id="clock">--:--</b></span>
  <span class="top-sp"></span>
  <button class="ico-btn" id="btnSearch" aria-label="搜尋"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg></button>
  <button class="sync" id="sync" aria-label="同步狀態"><i></i></button>
</header>

<main id="view" tabindex="-1"></main>

<nav id="tabs">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 2.5l4 3.5 4-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 10l5 2.6-5 2.6z"/></svg><span>放送</span><b class="tab-dot" id="tabHomeDot" hidden></b></a>
  <a href="#ai" data-tab="ai"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M19 15.5l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/></svg><span>AI 動畫</span></a>
  <a href="#ani" data-tab="ani"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3.5 7l3-4h3l-3 4m4 0l3-4h3l-3 4m4 0l3-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="2.4"/></svg><span>番劇</span></a>
  <a href="#mine" data-tab="mine"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 7.2l1.2 2.5 2.7.3-2 1.8.6 2.7-2.5-1.4-2.5 1.4.6-2.7-2-1.8 2.7-.3z"/></svg><span>片單</span></a>
</nav>

<!-- 放映機 -->
<section id="theater" hidden aria-label="放映機">
  <div class="th-bar">
    <button class="ico-btn" id="thClose" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <i class="th-k" id="thKind"></i>
    <span class="th-ttl" id="thTtl"></span>
    <button class="ico-btn" id="thFull" aria-label="全螢幕"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
  </div>
  <div class="th-main">
    <div class="th-stage">
      <div class="th-frame" id="thFrame"><div id="ytp"></div><div class="th-msg" id="thMsg" hidden></div><div class="th-next" id="thNext" hidden></div><div class="th-sleep" id="thSleep" hidden></div></div>
      <div class="th-deck" id="thDeck"></div>
      <div class="th-time" id="thTime" hidden></div>
    </div>
    <div class="th-side">
      <div class="th-info" id="thInfo"></div>
      <div class="th-list" id="thList"></div>
    </div>
  </div>
</section>

<!-- 直式滑看 -->
<section id="swipe" hidden aria-label="直式短劇">
  <div class="sw-view">
    <div class="sw-track" id="swTrack">
      <div class="sw-poster prev" id="swPrev"></div>
      <div class="sw-poster cur" id="swCurPoster"></div>
      <div class="sw-poster next" id="swNext"></div>
      <div class="sw-player"><div id="swp"></div></div>
    </div>
    <div class="sw-pad" id="swPad"><i class="sw-pause d">❚❚</i></div>
  </div>
  <div class="sw-top"><button class="ico-btn" data-act="sw-close" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button><b class="d">直式短劇</b><span>上下滑換一集</span></div>
  <div class="sw-info" id="swInfo"></div>
  <div class="sw-rail" id="swRail"></div>
  <div class="sw-arrows"><button data-act="sw-up" aria-label="上一集">▲</button><button data-act="sw-down" aria-label="下一集">▼</button></div>
</section>

<div id="sheet" hidden></div>
<div id="iris" class="iris" aria-hidden="true"><i class="iris-dot"></i></div>
<div id="toast" aria-live="polite"></div>
<div id="gate" hidden></div>

<!--WEBFLAG-->
<script>
/*JS*/
</script>
</body>
</html>
