<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="轉機">
<meta name="description" content="痞子葳的轉機航廈：每天三班新點子航班，加上一架舊作品進廠檢修。">
<title>轉機 TURNAROUND</title>
<!--WEBHEAD-->
<style>/*FONTS*/</style>
<style>/*CSS*/</style>
</head>
<body>
<div id="app" aria-hidden="true">
  <header id="top">
    <a class="brand" href="#dep" aria-label="轉機">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path transform="rotate(45 12 12)" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span>
      <span class="brand-t"><b>轉機</b><i>TURNAROUND</i></span>
    </a>
    <div class="top-r">
      <button id="tower-dot" class="tower-dot" aria-label="塔台連線"><i></i><span>塔台</span></button>
      <div class="clock"><b id="clk">--:--</b><i id="clk-d">--.-- ---</i></div>
    </div>
  </header>
  <main id="views">
    <section id="v-dep" class="view" data-tab="dep"></section>
    <section id="v-hangar" class="view" data-tab="hangar"></section>
    <section id="v-manual" class="view" data-tab="manual"></section>
    <section id="v-me" class="view" data-tab="me"></section>
  </main>
  <nav id="tabs">
    <a href="#dep" data-tab="dep"><svg viewBox="0 0 24 24"><path transform="rotate(45 12 12)" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg><b>出發</b><i>DEPARTURES</i><em class="badge" id="tb-dep"></em></a>
    <a href="#hangar" data-tab="hangar"><svg viewBox="0 0 24 24"><path d="M12 2.8 1.5 8.4V21h3V11h15v10h3V8.4zM6.5 13h11v2h-11zm0 4h11v2h-11z"/></svg><b>機庫</b><i>HANGAR</i><em class="badge" id="tb-hangar"></em></a>
    <a href="#manual" data-tab="manual"><svg viewBox="0 0 24 24"><path d="M5 3h11.5A2.5 2.5 0 0 1 19 5.5V21H6.5A2.5 2.5 0 0 1 4 18.5V4a1 1 0 0 1 1-1zm1.5 15a.5.5 0 0 0 0 1H17v-1zM8 7v2h8V7zm0 4v2h6v-2z"/></svg><b>手冊</b><i>MANUAL</i><em class="badge" id="tb-manual"></em></a>
    <a href="#me" data-tab="me"><svg viewBox="0 0 24 24"><path d="M12 3c-4 0-7.5 1.2-9 2.4l1.3 3.4h15.4L21 5.4C19.5 4.2 16 3 12 3zm-4.6 7.2a4.6 4.6 0 0 0 9.2 0zM4 21c.8-3.6 4-5.6 8-5.6s7.2 2 8 5.6z"/></svg><b>機長</b><i>CAPTAIN</i><em class="badge" id="tb-me"></em></a>
  </nav>
</div>

<div id="pages"></div>
<div id="sheet" hidden></div>
<div id="lightbox" hidden></div>
<div id="toast" role="status"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="gate">
  <canvas id="runway" aria-hidden="true"></canvas>
  <div class="gate-in">
    <div class="gate-sign">
      <span class="gs-ico"><svg viewBox="0 0 24 24"><path transform="rotate(45 12 12)" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span>
      <b>轉機</b>
    </div>
    <div class="gate-en">TURNAROUND</div>
    <div class="gate-sub">PZ TERMINAL · 每日開題 · 舊作檢修</div>
    <button id="gate-go" class="gate-go"><div><span>點一下・登機</span><i>TAP TO BOARD</i></div><svg viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></svg></button>
    <div class="gate-note" id="gate-note">建議開聲音・手機直拿最順</div>
  </div>
</div>
<div id="intro" hidden></div>
<!--WEBFLAG-->
<script>/*JS*/</script>
</body>
</html>
