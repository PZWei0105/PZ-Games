<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="竊夢者">
<title>竊夢者 DREAMTHIEF</title>
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07060c; --lacquer:#110d18; --panel:rgba(17,13,25,.94); --panel2:rgba(26,20,37,.96);
  --gold:#d8b46a; --gold2:#f3dca0; --silver:#e3e7f6; --mute:#8d88a6; --dim:#5b5672;
  --teal:#53f0d6; --amber:#ffb24a; --red:#e8473d; --violet:#a184ff;
  --r0:#9aa0b4; --r1:#6fd18a; --r2:#5fb6ff; --r3:#b98aff; --r4:#ffc94a; --r5:#ff4d5e;
  --serif:"Noto Serif TC","Songti TC","STSong","Source Han Serif TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--silver);overflow:hidden;
  font-family:var(--sans);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}

/* ---------- 通用元件 ---------- */
.serif{font-family:var(--serif)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:46px;padding:0 1.3em;border:1px solid rgba(216,180,106,.55);border-radius:3px;
  background:linear-gradient(180deg,rgba(48,38,58,.92),rgba(22,17,30,.95));
  color:var(--gold2);font-family:var(--serif);font-size:16px;letter-spacing:.18em;
  box-shadow:inset 0 1px 0 rgba(255,235,190,.08),0 6px 18px rgba(0,0,0,.35);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(1px) scale(.985);filter:brightness(1.2)}
.btn.primary{border-color:rgba(83,240,214,.75);color:#dffff8;
  background:linear-gradient(180deg,rgba(26,74,72,.95),rgba(12,32,36,.97));
  box-shadow:0 0 22px rgba(83,240,214,.18),inset 0 1px 0 rgba(200,255,245,.15)}
.btn.danger{border-color:rgba(232,71,61,.7);color:#ffd9d4;background:linear-gradient(180deg,rgba(78,26,30,.95),rgba(34,12,16,.97))}
.btn.ghost{background:rgba(255,255,255,.03);border-color:rgba(227,231,246,.18);color:var(--silver)}
.btn.small{min-height:36px;font-size:14px;padding:0 .9em;letter-spacing:.1em}
.btn[disabled]{opacity:.38;pointer-events:none}
.gold{color:var(--gold2)} .teal{color:var(--teal)} .mute{color:var(--mute)} .red{color:#ff7d72} .amber{color:var(--amber)}
.money{font-family:var(--serif);color:var(--gold2);letter-spacing:.04em}
.money::before{content:"";display:inline-block;width:.78em;height:.78em;margin-right:.32em;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff3c8,#e6b450 45%,#8a5d1c);box-shadow:0 0 6px rgba(255,200,90,.6);vertical-align:-.05em}

/* 當票（記憶卡） */
.ticket{position:relative;display:flex;gap:12px;align-items:stretch;padding:12px 12px 12px 18px;border-radius:4px;
  background:linear-gradient(135deg,rgba(38,30,48,.96),rgba(20,15,28,.97));border:1px solid rgba(216,180,106,.22);
  box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ticket::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;border-left:2px dotted rgba(216,180,106,.35)}
.ticket .orb{flex:0 0 44px;height:44px;border-radius:50%;align-self:center;position:relative}
.ticket .body{flex:1;min-width:0}
.ticket .nm{font-family:var(--serif);font-size:16px;letter-spacing:.06em;line-height:1.3}
.ticket .fl{font-size:12.5px;color:#b5b0c9;line-height:1.5;margin-top:3px}
.ticket .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px;font-size:12px;color:var(--mute)}
.ticket .meta span{white-space:nowrap}
.ticket .acts{display:flex;flex-direction:column;gap:6px;justify-content:center}
.seal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:4px;
  font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;transform:rotate(-8deg);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 0 10px currentColor}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid rgba(255,255,255,.14);color:#c9c4dc}
.slotpips{display:flex;gap:3px}
.slotpips i{width:8px;height:10px;border-radius:2px;background:rgba(255,255,255,.18)}

/* ---------- 遊戲中 HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .pe{pointer-events:auto}
#wake{position:absolute;left:50%;top:calc(var(--sat) + 10px);transform:translateX(-50%);width:min(64vw,330px);text-align:center}
#wake .row{display:flex;align-items:center;gap:8px}
#wake svg{flex:0 0 30px;height:20px;overflow:visible}
#wake .bar{flex:1;height:10px;border-radius:6px;background:rgba(10,8,16,.78);border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}
#wake .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;
  background:linear-gradient(90deg,#5d4dd6,#a07cff 45%,#ff5d8a 80%,#ff3b30);box-shadow:0 0 12px rgba(180,120,255,.6)}
#wake .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28)}
#wake .lbl{margin-top:3px;font-family:var(--serif);font-size:12.5px;letter-spacing:.3em;color:#cfc8ec;text-shadow:0 1px 4px #000}
#wake.collapse .lbl{color:#ff8b80;font-size:15px;animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:.65}to{opacity:1}}
#hp{position:absolute;left:calc(var(--sal) + 12px);top:calc(var(--sat) + 10px);width:min(24vw,120px)}
#hp .nm{font-family:var(--serif);font-size:11px;letter-spacing:.25em;color:#c5bfdc;margin-bottom:3px;text-shadow:0 1px 3px #000}
#hp .bar{height:9px;border-radius:5px;background:rgba(10,8,16,.8);border:1px solid rgba(255,255,255,.14);overflow:hidden;position:relative}
#hp .fill{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#3fd7b8,#7af5d9);transition:width .15s}
#hp .lag{position:absolute;inset:0;width:100%;background:rgba(255,120,110,.65)}
#hp .num{font-size:11px;color:#9fe9da;margin-top:2px;text-shadow:0 1px 3px #000}
#depth{position:absolute;left:calc(var(--sal) + 12px);top:calc(var(--sat) + 62px);font-family:var(--serif);font-size:12px;letter-spacing:.22em;color:#d8cff5;text-shadow:0 1px 4px #000}
#pauseBtn{position:absolute;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 8px);width:38px;height:38px;border-radius:50%;
  background:rgba(14,11,22,.7);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
#pauseBtn i{display:block;width:3px;height:13px;background:#ddd;margin:0 2px;border-radius:1px}
#mini{position:absolute;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 54px);width:92px;height:92px;border-radius:6px;
  background:rgba(8,6,14,.62);border:1px solid rgba(255,255,255,.14)}
#radio{position:absolute;left:50%;top:calc(var(--sat) + 84px);transform:translateX(-50%);width:min(78vw,420px);
  padding:8px 12px;border-radius:4px;background:linear-gradient(180deg,rgba(14,11,22,.86),rgba(14,11,22,.72));
  border-left:2px solid var(--teal);font-size:13.5px;line-height:1.55;color:#ece8ff;opacity:0;transition:opacity .25s;text-shadow:0 1px 2px #000;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
#radio.show{opacity:1}
#radio b{font-family:var(--serif);font-weight:600;margin-right:.5em;letter-spacing:.12em}
#xp{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.5)}
#xp .fill{height:100%;width:0;background:linear-gradient(90deg,#3fd7b8,#b9fff0);box-shadow:0 0 8px #53f0d6}
#lvl{position:absolute;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 12px);font-family:var(--serif);font-size:12px;color:#aef3e4;letter-spacing:.15em;text-shadow:0 1px 3px #000}
#bag{position:absolute;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 34px);padding:7px 10px;border-radius:6px;
  background:rgba(14,11,22,.72);border:1px solid rgba(216,180,106,.35);display:flex;flex-direction:column;gap:4px;min-width:84px}
#bag .t{font-family:var(--serif);font-size:12px;letter-spacing:.15em;color:var(--gold2);display:flex;justify-content:space-between;gap:8px}
#bag .pips{display:flex;flex-wrap:wrap;gap:3px;max-width:112px}
#bag .pips i{width:9px;height:11px;border-radius:2px;background:rgba(255,255,255,.12)}
#bag .pips i.lock{outline:1px solid #fff}
#bag.full{border-color:rgba(255,120,100,.8)}
#btns{position:absolute;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 18px);width:170px;height:170px}
.rb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 50% 35%,rgba(60,48,80,.85),rgba(16,12,24,.88));border:1.5px solid rgba(255,255,255,.22);
  color:#efeaff;font-family:var(--serif);letter-spacing:.1em;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.rb .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(var(--cdc,rgba(0,0,0,.35)) calc(var(--p,0) * 1%),transparent 0)}
.rb .k{position:relative;font-size:15px}
.rb .s{position:relative;font-size:10px;color:#bdb6d6;letter-spacing:0}
.rb:active{filter:brightness(1.35)}
#bDash{right:0;bottom:0;width:78px;height:78px;border-color:rgba(83,240,214,.65)}
#bTool{right:86px;bottom:6px;width:58px;height:58px}
#bCandy{right:22px;bottom:90px;width:48px;height:48px}
#bAct{right:84px;bottom:86px;width:78px;height:78px;border-color:rgba(255,201,74,.9);background:radial-gradient(circle at 50% 35%,rgba(110,80,30,.9),rgba(40,26,8,.92));animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 6px rgba(255,201,74,.3)}to{box-shadow:0 0 22px rgba(255,201,74,.75)}}
#hint{position:absolute;left:50%;bottom:calc(var(--sab) + 130px);transform:translateX(-50%);padding:6px 12px;border-radius:14px;
  background:rgba(10,8,16,.78);border:1px solid rgba(255,255,255,.16);font-size:13px;color:#e8e3ff;white-space:nowrap;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.show{opacity:1}
#banner .a{font-family:var(--serif);font-size:30px;letter-spacing:.42em;color:#f2ecff;text-shadow:0 0 18px rgba(160,120,255,.8),0 2px 6px #000}
#banner .b{margin-top:8px;font-size:13px;letter-spacing:.5em;color:#b9b0dc}

/* ---------- 畫面（覆蓋層） ---------- */
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column}
.scrim{position:absolute;inset:0;background:rgba(5,4,9,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:relative;margin:auto;width:min(94vw,520px);max-height:calc(100% - 40px - var(--sat) - var(--sab));display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(216,180,106,.3);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet .hd{padding:16px 54px 10px 18px;border-bottom:1px solid rgba(216,180,106,.16);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sheet .hd h2{margin:0;font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.3em;color:var(--gold2)}
.sheet .hd .sub{font-size:12px;color:var(--mute);letter-spacing:.1em}
.sheet .bd{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;touch-action:pan-y}
.sheet .ft{padding:12px 16px calc(12px + var(--sab));border-top:1px solid rgba(216,180,106,.16);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;color:#cfc8ea;font-size:20px;line-height:36px;text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
.sec{font-family:var(--serif);font-size:13px;letter-spacing:.35em;color:var(--gold);margin:16px 2px 8px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(216,180,106,.4),transparent)}
.note{font-size:13px;line-height:1.7;color:#bdb7d4;text-wrap:pretty}

/* 標題 */
#title{align-items:center;justify-content:flex-end;padding-bottom:calc(9vh + var(--sab))}
#title .logo{position:absolute;left:0;right:0;top:calc(14vh + var(--sat));text-align:center;pointer-events:none}
#title .logo .cn{font-family:var(--serif);font-size:min(18vw,92px);font-weight:700;letter-spacing:.12em;color:#f4efff;
  text-shadow:0 0 30px rgba(140,110,255,.55),0 0 2px #fff,0 6px 20px #000;padding-left:.12em}
#title .logo .en{margin-top:4px;font-size:min(3.6vw,15px);letter-spacing:1.1em;color:#b8b0e0;padding-left:1.1em}
#title .logo .tl{margin-top:22px;font-family:var(--serif);font-size:min(3.9vw,16px);letter-spacing:.32em;color:#d9cfa8;opacity:.9}
#title .menu{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(78vw,300px)}
#title .menu .btn{width:100%}
#title .tap{font-family:var(--serif);letter-spacing:.6em;color:#d7cff7;font-size:15px;animation:pulse 1.2s infinite alternate;padding-left:.6em}
#title .ver{position:absolute;right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 8px);font-size:11px;color:#5d587a;letter-spacing:.1em}

/* 夜當 */
#hub{justify-content:flex-end}
#hub .top{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hub .top .place{font-family:var(--serif);letter-spacing:.4em;font-size:22px;color:#f1e3c0;text-shadow:0 0 14px rgba(255,180,80,.45),0 2px 6px #000}
#hub .top .place small{display:block;font-size:11px;letter-spacing:.3em;color:#a99b78;margin-top:2px}
#hub .top .cash{pointer-events:auto;padding:6px 12px;border-radius:16px;background:rgba(14,11,22,.75);border:1px solid rgba(216,180,106,.35);font-size:16px}
#hub .talk{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 78px);display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#hub .talk .bubble{max-width:min(80vw,420px);padding:10px 14px;border-radius:4px;background:rgba(12,9,18,.82);border-left:2px solid var(--amber);
  font-size:14px;line-height:1.65;color:#f3ecdc;box-shadow:0 6px 20px rgba(0,0,0,.4);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
#hub .talk .bubble b{font-family:var(--serif);color:var(--amber);letter-spacing:.15em;margin-right:.4em}
#hub .dock{position:relative;padding:12px 14px calc(14px + var(--sab));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  background:linear-gradient(180deg,transparent,rgba(5,4,9,.85) 30%)}
#hub .dock .go{grid-column:1/-1;min-height:58px;font-size:20px;letter-spacing:.5em}
.dockbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;border-radius:4px;
  background:linear-gradient(180deg,rgba(40,31,50,.9),rgba(18,14,26,.94));border:1px solid rgba(216,180,106,.3);position:relative}
.dockbtn .ic{font-family:var(--serif);font-size:20px;color:var(--gold2)}
.dockbtn .lb{font-size:11.5px;letter-spacing:.2em;color:#cfc6e4}
.dockbtn .dot{position:absolute;right:6px;top:6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}

/* 夢主檔案 */
.dossier{position:relative;display:flex;gap:12px;padding:14px;border-radius:5px;border:1px solid rgba(216,180,106,.25);
  background:linear-gradient(135deg,rgba(36,28,46,.95),rgba(18,13,25,.96));overflow:hidden}
.dossier.locked{opacity:.5}
.dossier.sel{border-color:var(--teal);box-shadow:0 0 0 1px rgba(83,240,214,.4),0 0 24px rgba(83,240,214,.15)}
.dossier canvas{flex:0 0 74px;height:96px;border-radius:3px}
.dossier .nm{font-family:var(--serif);font-size:18px;letter-spacing:.12em}
.dossier .who{font-size:12px;color:var(--mute);margin-top:2px}
.dossier .ds{font-size:12.5px;line-height:1.6;color:#c5bfda;margin-top:6px}
.dossier .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.contract{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:4px;background:rgba(255,255,255,.035);border:1px dashed rgba(216,180,106,.3);font-size:13px}
.loadrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x}
.pick{flex:0 0 auto;min-width:96px;padding:10px;border-radius:4px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);text-align:left}
.pick.sel{border-color:var(--teal);background:rgba(83,240,214,.08)}
.pick.off{opacity:.35}
.pick .n{font-family:var(--serif);font-size:15px;letter-spacing:.1em}
.pick .d{font-size:11px;color:var(--mute);margin-top:3px;line-height:1.45}

/* 工作台 */
.upg{display:flex;gap:12px;align-items:center;padding:12px;border-radius:4px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1)}
.upg .ic{flex:0 0 42px;height:42px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;
  color:#1a1222;background:linear-gradient(135deg,#f3dca0,#c89b4a);box-shadow:0 0 12px rgba(216,180,106,.3)}
.upg .tx{flex:1;min-width:0}
.upg .tx .n{font-family:var(--serif);font-size:15px;letter-spacing:.1em}
.upg .tx .d{font-size:12px;color:#b8b2cf;margin-top:2px;line-height:1.5}
.pipsL{display:flex;gap:3px;margin-top:5px}
.pipsL i{width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.pipsL i.on{background:var(--gold)}

/* 靈感三選一 */
#lvup{align-items:center;justify-content:center;padding:20px}
#lvup .t{font-family:var(--serif);font-size:24px;letter-spacing:.6em;color:#e9fff9;text-shadow:0 0 18px rgba(83,240,214,.7);padding-left:.6em}
#lvup .s{font-size:12px;color:#9fd8cc;letter-spacing:.3em;margin:6px 0 16px}
#lvup .cards{display:flex;flex-direction:column;gap:10px;width:min(92vw,440px)}
.card{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:5px;text-align:left;
  background:linear-gradient(135deg,rgba(30,44,52,.96),rgba(14,18,26,.97));border:1px solid rgba(83,240,214,.35);
  box-shadow:0 8px 24px rgba(0,0,0,.45);transform:translateY(14px);opacity:0;animation:cardIn .35s forwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cardIn{to{transform:none;opacity:1}}
.card .ic{flex:0 0 50px;height:50px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:26px;font-weight:700;color:#08201c;background:linear-gradient(135deg,#bffff0,#3fd7b8);box-shadow:0 0 16px rgba(83,240,214,.45)}
.card .n{font-family:var(--serif);font-size:17px;letter-spacing:.12em;color:#eafffa}
.card .lv{font-size:11px;color:#7fe9d4;margin-left:6px;letter-spacing:.1em}
.card .d{font-size:12.5px;color:#bcd9d3;margin-top:3px;line-height:1.5}
.card.max .ic{background:linear-gradient(135deg,#fff1c2,#ffc94a);color:#2a1a02;box-shadow:0 0 18px rgba(255,201,74,.6)}
.card.max{border-color:rgba(255,201,74,.6)}

/* 結算 */
#result .big{font-family:var(--serif);font-size:28px;letter-spacing:.5em;text-align:center;padding:6px 0 2px 0.5em}
#result .stat{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;color:#c9c3de;margin:10px 2px}
#result .stat b{color:#fff;font-weight:600;float:right}
.lost{opacity:.4;text-decoration:line-through}

/* 劇情 */
#scene{background:#000}
#scene canvas{position:absolute;inset:0;width:100%;height:100%}
#scene .txt{position:absolute;left:0;right:0;bottom:calc(10vh + var(--sab));padding:0 24px;text-align:center}
#scene .line{display:inline-block;max-width:560px;font-family:var(--serif);font-size:min(4.6vw,19px);line-height:1.9;letter-spacing:.08em;color:#f2eee4;
  text-shadow:0 2px 10px #000,0 0 2px #000;white-space:pre-wrap;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
#scene .tx i{font-style:normal;opacity:0;transition:opacity .22s}
#scene .tx i.on{opacity:1}
#scene .who{display:block;font-size:12px;letter-spacing:.5em;margin-bottom:6px;opacity:.85}
#scene .skip{position:absolute;right:calc(var(--sar) + 12px);top:calc(var(--sat) + 12px);padding:6px 12px;font-size:12px;letter-spacing:.3em;color:#aaa;border:1px solid #444;border-radius:14px}
#scene .next{position:absolute;left:50%;bottom:calc(4vh + var(--sab));transform:translateX(-50%);font-size:11px;letter-spacing:.5em;color:#777;animation:pulse 1s infinite alternate}

/* 小提示 */
#toast{position:absolute;left:50%;top:calc(var(--sat) + 18%);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:50}
.toast{padding:8px 16px;border-radius:18px;background:rgba(12,9,18,.9);border:1px solid rgba(255,255,255,.18);font-size:13.5px;color:#f1edff;
  animation:tin .25s ease-out,tout .4s ease-in 2.2s forwards;white-space:nowrap}
.toast.good{border-color:rgba(83,240,214,.6)} .toast.bad{border-color:rgba(232,71,61,.7)} .toast.gold{border-color:rgba(255,201,74,.8);color:#ffe9b0}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* 背包面板（遊戲中） */
.bagGrid{display:flex;flex-direction:column;gap:8px}
.itemrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:4px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1)}
.itemrow .orb{flex:0 0 30px;height:30px;border-radius:50%}
.itemrow .tx{flex:1;min-width:0}
.itemrow .tx .n{font-family:var(--serif);font-size:14px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemrow .tx .m{font-size:11px;color:var(--mute)}
.itemrow.new{border-color:rgba(255,201,74,.7);background:rgba(255,201,74,.06)}

@media (min-width:760px){ #hub .dock{max-width:640px;margin:0 auto;width:100%} #hub .talk{left:50%;transform:translateX(-50%);width:min(90vw,640px);justify-content:center} }
@media (orientation:landscape) and (max-height:520px){
  #title .logo{top:calc(6vh + var(--sat))}
  #title .logo .cn{font-size:min(11vh,72px)}
  #title{padding-bottom:calc(5vh + var(--sab))}
  #btns{transform:scale(.9);transform-origin:right bottom}
  #hub .talk{top:calc(var(--sat) + 60px)}
  #hub .dock{grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto;width:100%}
  #hub .dock .go{grid-column:auto;min-height:64px;font-size:18px;letter-spacing:.3em}
  .sheet{max-height:calc(100% - 16px)}
}
</style>
