<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>偷渡者 STOWAWAY</title>
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05080c; --navy:#0c1520; --navy2:#122030; --panel:rgba(10,16,24,.9); --panel2:rgba(16,26,38,.94);
  --cream:#ece4d2; --cream2:#bdb5a3; --dim:#7d8794; --line:rgba(236,228,210,.16);
  --orange:#ff6a1a; --amber:#ffb03a; --red:#ff3d3d; --cyan:#6fe8ff; --green:#86f0a0; --blue:#5aa8ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --f:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;
  --m:'Chakra Petch','Noto Sans TC',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ink);color:var(--cream);font-family:var(--f);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#020305}
.hide{display:none!important}
.mono{font-family:var(--m);letter-spacing:.04em}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#topbar{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 0 calc(var(--sal) + 8px);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#topbar>*{pointer-events:auto}
#actchip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--orange);padding:5px 9px 6px;min-width:118px;border-radius:2px 2px 8px 8px}
#actchip .an{font:600 10px var(--m);color:var(--orange);letter-spacing:.18em}
#actchip .at{font-weight:900;font-size:15px;line-height:1.15;letter-spacing:.06em}
#actchip .ck{font:600 11px var(--m);color:var(--cream2);margin-top:1px;display:flex;gap:8px;align-items:center}
#actchip .ck .stg{color:var(--cyan)}
#objbox{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:2px 2px 8px 8px;padding:5px 9px 6px;font-size:12px;line-height:1.45;max-height:88px;overflow:hidden;transition:max-height .25s;cursor:pointer}
#objbox:not(.open) .o span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}
#objbox:not(.open) .o.info{display:none}
#objbox .o span{flex:1;min-width:0}
#objbox.open{max-height:70vh;overflow:auto}
#objbox .oh{font:600 10px var(--m);letter-spacing:.18em;color:var(--cream2);display:flex;justify-content:space-between}
#objbox .oh .tm{color:var(--amber);letter-spacing:.04em}
#objbox .o{display:flex;gap:6px;align-items:flex-start}
#objbox .o i{font-style:normal;flex:0 0 auto;width:12px;color:var(--orange)}
#objbox .o.done{color:var(--dim);text-decoration:line-through}
#objbox .o.done i{color:var(--green)}
#objbox .o.opt i{color:var(--cyan)}
#objbox .o b{color:var(--amber);font-weight:700}
#tbr{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tbtn{width:44px;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font:700 13px var(--m)}
.tbtn svg{width:20px;height:20px}
#parts{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 7px;font:700 12px var(--m);color:var(--amber);white-space:nowrap}

#lbtns{position:absolute;left:calc(var(--sal) + 8px);top:calc(var(--sat) + 120px);display:flex;flex-direction:column;gap:8px}
.lbtn{width:52px;min-height:50px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cream2);border-radius:4px 10px 10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--cream)}
.lbtn svg{width:22px;height:22px}
.lbtn.on{border-left-color:var(--orange);background:rgba(60,26,10,.9)}
.lbtn.hot{animation:hot 1s infinite}
.lbtn.off{opacity:.42}
@keyframes hot{50%{border-left-color:var(--amber);box-shadow:0 0 14px rgba(255,140,40,.45)}}

#toasts{position:absolute;left:calc(var(--sal) + 68px);right:calc(var(--sar) + 10px);top:calc(var(--sat) + 104px);display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:flex-start;max-width:460px}
.toast{background:rgba(12,18,26,.93);border:1px solid var(--line);border-left:4px solid var(--orange);padding:6px 10px;border-radius:4px;font-size:12.5px;line-height:1.42;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .25s ease-out;max-width:100%}
.toast.good{border-left-color:var(--green)}
.toast.loot{border-left-color:var(--amber)}
.toast.loot.r2{border-left-color:var(--blue)}
.toast.loot.r3{border-left-color:var(--amber);background:linear-gradient(90deg,rgba(80,52,8,.96),rgba(12,18,26,.95));box-shadow:0 0 24px rgba(255,176,58,.35)}
.toast.bad{border-left-color:var(--red)}
.toast.learn{border-left-color:var(--cyan);background:rgba(8,26,34,.95)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

#subs{position:absolute;left:50%;transform:translateX(-50%);width:min(94vw,520px);display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:center}
.sub{background:rgba(4,7,10,.78);padding:6px 12px;border-radius:6px;font-size:14px;line-height:1.45;text-align:center;animation:tin .2s;max-width:100%}
.sub b{color:var(--amber);margin-right:6px;font-weight:700}
.sub.mimic b{color:var(--cyan)}
.sub.out{opacity:0;transition:.5s}

#grab{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,20,20,.0);transition:box-shadow .2s}
#grab.on{box-shadow:inset 0 0 140px rgba(255,20,20,.55)}
#grab .gbx{position:absolute;left:50%;top:calc(var(--sat) + 106px);transform:translateX(-50%);width:min(88vw,420px);background:rgba(60,4,4,.92);border:1px solid #ff5a5a;border-radius:10px;padding:8px 12px;text-align:center;font-size:15px;line-height:1.45;animation:tin .2s;box-shadow:0 0 30px rgba(255,30,30,.4)}
#grab .gbx b{color:#fff;font-weight:900}
#grab .gbx span{font-size:12px;color:#ffd0d0}
#grab .gbx.op{background:rgba(8,40,52,.94);border-color:var(--cyan);box-shadow:0 0 30px rgba(111,232,255,.35);animation:tin .2s,opp 1s infinite}
#grab .gbx.op span{color:#cff6ff}
@keyframes opp{50%{box-shadow:0 0 44px rgba(111,232,255,.6)}}

#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bottom>*{pointer-events:auto}
#actbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:0}
.abtn{min-width:58px;height:50px;padding:0 9px;background:var(--panel2);border:1px solid var(--line);border-bottom:3px solid var(--cream2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;letter-spacing:.04em;position:relative}
.abtn svg{width:20px;height:20px}
.abtn .ct{position:absolute;right:4px;top:2px;font:700 10px var(--m);color:var(--amber)}
.abtn.on{border-bottom-color:var(--orange);background:rgba(70,30,10,.95)}
.abtn.warn{border-bottom-color:var(--red)}
.abtn.r2{border-bottom-color:var(--blue)}
.abtn.r3{border-bottom-color:var(--amber)}
.abtn:disabled{opacity:.38}
.abtn.arm{animation:arm .9s infinite}
@keyframes arm{50%{background:rgba(100,46,10,.98)}}
#hint{font-size:12px;color:var(--cream2);text-align:center;background:rgba(4,7,10,.7);border-radius:6px;padding:4px 10px;align-self:center;max-width:94vw}
#crewbar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cc{position:relative;height:84px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:stretch}
.cc canvas{width:100%;height:46px;display:block}
.cc .nm{font-size:11px;font-weight:700;text-align:center;line-height:1.1;margin-top:1px;white-space:nowrap;overflow:hidden}
.cc .st{display:flex;justify-content:space-between;align-items:center;padding:1px 4px 0;font:700 10px var(--m)}
.cc .bpm{color:var(--green)}
.cc .bpm.y{color:var(--amber)}.cc .bpm.r{color:var(--red)}
.cc .hp{display:flex;gap:2px}
.cc .hp i{width:6px;height:6px;border-radius:1px;background:var(--green)}
.cc .hp i.x{background:#3a2626}
.cc .tk{position:absolute;left:0;right:0;top:0;font-size:9px;text-align:center;background:rgba(0,0,0,.55);color:var(--cream2);padding:1px 0;white-space:nowrap;overflow:hidden}
.cc .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--orange)}
.cc.sel{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange) inset,0 0 18px rgba(255,106,26,.35)}
.cc.grab{animation:grabb .35s infinite}
@keyframes grabb{50%{background:rgba(120,10,10,.9)}}
.cc.dead{opacity:.35;filter:grayscale(1)}
.cc.dead .tk{color:var(--red)}
.cc.panic .nm{color:var(--red)}
.cc .ico{position:absolute;right:3px;top:14px;display:flex;flex-direction:column;gap:1px}
.cc .ico span{width:13px;height:13px;border-radius:3px;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:8px}

/* landscape */
@media (min-aspect-ratio:13/10){
  #crewbar{position:fixed;left:calc(var(--sal) + 6px);top:calc(var(--sat) + 104px);bottom:calc(var(--sab) + 8px);width:128px;display:flex;flex-direction:column;gap:5px;overflow:auto}
  .cc{height:auto;min-height:62px;flex-direction:row;align-items:center}
  .cc canvas{width:48px;height:58px;flex:0 0 48px}
  .cc .meta{flex:1;min-width:0}
  #lbtns{left:calc(var(--sal) + 142px)}
  #bottom{padding-left:calc(var(--sal) + 140px)}
  #toasts{top:calc(var(--sat) + 60px)}
}

/* ---------- 面板 ---------- */
.panel{position:fixed;z-index:30;background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:4px 4px 12px 12px;box-shadow:0 18px 60px rgba(0,0,0,.6);padding:10px 12px 12px;max-width:94vw}
.panel h3{font-size:15px;font-weight:900;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h3 small{font:600 10px var(--m);color:var(--orange);letter-spacing:.2em}
.panel .x{width:36px;height:32px;border-radius:6px;background:rgba(255,255,255,.06);font-size:16px}
.panel p{font-size:12px;color:var(--cream2);line-height:1.5;margin-top:4px}
#pmenu{position:fixed;z-index:31;display:flex;flex-direction:column;gap:5px;min-width:136px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#pmenu .t{font:600 10px var(--m);letter-spacing:.14em;color:var(--orange);padding:2px 4px 0}
#pmenu button{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:7px;background:rgba(255,255,255,.05);font-size:14px;font-weight:700}
#pmenu button small{font-weight:400;color:var(--cream2);font-size:11px;margin-left:auto}
#pmenu button:disabled{opacity:.4}
#pmenu button.d{color:var(--red)}
#ppower{left:50%;top:50%;transform:translate(-50%,-50%);width:330px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.prow .pn{flex:1;font-size:13px;font-weight:700}
.prow .pn small{display:block;font-weight:400;color:var(--cream2);font-size:11px}
.prow .pp{display:flex;gap:3px}
.prow .pp i{width:12px;height:18px;border-radius:2px;background:#2a3340}
.prow .pp i.on{background:var(--amber);box-shadow:0 0 8px rgba(255,176,58,.6)}
.prow button{width:62px;height:34px;border-radius:7px;background:rgba(255,255,255,.07);font-weight:700;font-size:12px}
.prow button.on{background:var(--orange);color:#120800}
.pcap{display:flex;gap:4px;margin:8px 0 4px;align-items:center;font:700 12px var(--m)}
.pcap i{width:22px;height:14px;border-radius:2px;background:#2a3340}
.pcap i.u{background:var(--amber)}
#pcraft{left:50%;top:50%;transform:translate(-50%,-50%);width:340px}
.crow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .ci{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.06);display:grid;place-items:center}
.crow .ci svg{width:24px;height:24px}
.crow .cn{flex:1;font-size:13px;font-weight:700}
.crow .cn small{display:block;color:var(--cream2);font-weight:400;font-size:11px;line-height:1.35}
.crow button{min-width:64px;height:36px;border-radius:8px;background:var(--orange);color:#140900;font-weight:900;font-size:12px}
.crow button:disabled{background:#2a3340;color:var(--dim)}
#pbridge{left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);bottom:calc(var(--sab) + 96px);max-width:none;padding:7px 10px 8px}
#pbridge h3{font-size:13px}
#pbridge p{font-size:11px;margin-top:2px}
@media (min-aspect-ratio:13/10){#pbridge{left:calc(var(--sal) + 150px);bottom:calc(var(--sab) + 10px)}}
#pbridge .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#pbridge .row button{flex:1 1 auto;min-width:70px;height:40px;border-radius:8px;background:rgba(255,255,255,.07);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
#pbridge .row button small{font-weight:400;font-size:10px;color:var(--cream2)}
#pbridge .row button.go{background:var(--orange);color:#140900}
#pbridge .row button.go small{color:#3a1800}
#pbridge .row button:disabled{opacity:.35}

/* ---------- 全畫面 ---------- */
.screen{position:fixed;inset:0;z-index:50;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scr-in{min-height:100%;padding:calc(var(--sat) + 18px) calc(var(--sar) + 18px) calc(var(--sab) + 22px) calc(var(--sal) + 18px);display:flex;flex-direction:column}
.bigbtn{display:block;width:100%;padding:15px 14px;border-radius:12px;background:var(--orange);color:#140900;font-weight:900;font-size:17px;letter-spacing:.12em;text-align:center;box-shadow:0 8px 30px rgba(255,106,26,.35);position:relative;overflow:hidden}
.bigbtn small{display:block;font-weight:700;font-size:11px;letter-spacing:.1em;opacity:.75;margin-top:2px}
.bigbtn.sec{background:rgba(255,255,255,.07);color:var(--cream);box-shadow:none;border:1px solid var(--line);font-size:15px}
.bigbtn:disabled{opacity:.4}
.hz{height:8px;background:repeating-linear-gradient(-45deg,var(--orange) 0 10px,#140900 10px 20px);opacity:.9}
.lbl{font:600 10px var(--m);letter-spacing:.24em;color:var(--orange)}

#s-title{background:transparent;display:flex}
#s-title .scr-in{justify-content:flex-end;gap:10px;width:100%}
#s-title .logo{margin-bottom:auto;margin-top:12vh;text-align:center}
#s-title .logo .zh{font-weight:900;font-size:clamp(54px,16vw,96px);letter-spacing:.14em;line-height:1;text-shadow:0 0 40px rgba(255,106,26,.25);padding-left:.14em}
#s-title .logo .en{font:700 clamp(15px,4.4vw,22px) var(--m);letter-spacing:.62em;color:var(--orange);margin-top:10px;padding-left:.62em}
#s-title .logo .tag{margin-top:22px;font-size:15px;color:var(--cream2);letter-spacing:.3em;padding-left:.3em}
#s-title .meta{display:flex;justify-content:space-between;font:600 11px var(--m);color:var(--dim);letter-spacing:.1em;margin-top:6px}
.tmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-aspect-ratio:13/10) and (max-height:620px){
  #s-title .scr-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:26px;row-gap:8px;align-content:center;padding-top:calc(var(--sat) + 12px);padding-bottom:calc(var(--sab) + 12px)}
  #s-title .logo{grid-column:1;grid-row:1 / span 5;margin:0;align-self:center}
  #s-title .scr-in > :not(.logo){grid-column:2}
  #s-title .logo .zh{font-size:clamp(44px,15vh,88px)}
  #s-title .logo .tag{margin-top:14px}
  #s-title .bigbtn{padding:10px 14px;font-size:16px}
  .tmenu button{padding:8px 6px}
}
.tmenu button{padding:12px 6px;border-radius:10px;background:rgba(12,20,30,.85);border:1px solid var(--line);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tmenu button small{font-weight:400;font-size:10px;color:var(--cream2)}
.tmenu button .nb{color:var(--amber);font:700 10px var(--m)}

.sheet{background:rgba(5,8,12,.94);backdrop-filter:none}
.sheet .scr-in{max-width:620px;margin:0 auto;gap:12px}
.shead{display:flex;align-items:center;gap:10px}
.shead h2{font-size:22px;font-weight:900;letter-spacing:.1em;flex:1}
.shead button{width:44px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h4{font-size:15px;font-weight:900;letter-spacing:.06em}
.card p{font-size:13px;line-height:1.65;color:var(--cream2);margin-top:4px}
.perk{display:flex;gap:10px;align-items:center}
.perk .pi{width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,.06);display:grid;place-items:center;flex:0 0 auto}
.perk .pi svg{width:28px;height:28px}
.perk .pt{flex:1;min-width:0}
.perk button{min-width:76px;height:40px;border-radius:9px;background:var(--orange);color:#140900;font-weight:900;font-size:12px}
.perk button.eq{background:var(--green);color:#03140a}
.perk button.own{background:rgba(255,255,255,.1);color:var(--cream)}
.perk button:disabled{background:#2a3340;color:var(--dim)}
.money{font:700 14px var(--m);color:var(--amber)}
.files{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.file{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:86px;text-align:left}
.file .fn{font:600 10px var(--m);color:var(--orange);letter-spacing:.16em}
.file .ft{font-weight:900;font-size:14px;margin-top:3px}
.file .fs{font-size:11px;color:var(--cream2);margin-top:4px;line-height:1.4}
.file.lock{opacity:.4}
.file.new{border-color:var(--amber)}
.reader{white-space:pre-wrap;font-size:15px;line-height:1.9;color:var(--cream)}
.chron{font-size:13px;line-height:1.7;color:var(--cream2)}
.chron .tm{font:700 11px var(--m);color:var(--orange);margin-right:6px}
.chron .ln{padding:3px 0;border-bottom:1px dashed var(--line)}
.end-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.end{border-radius:10px;padding:12px;background:var(--panel);border:1px solid var(--line);min-height:80px}
.end .et{font-weight:900;font-size:15px}
.end .es{font-size:11px;color:var(--cream2);margin-top:4px;line-height:1.45}
.end.lock .et{color:var(--dim)}
.opt{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.opt span{flex:1}
.opt small{display:block;color:var(--cream2);font-size:11px}
.tog{width:56px;height:30px;border-radius:15px;background:#2a3340;position:relative;flex:0 0 auto}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--cream2);transition:.2s}
.tog.on{background:var(--orange)}
.tog.on::after{left:29px;background:#fff}
.seg{display:flex;gap:4px}
.seg button{padding:7px 10px;border-radius:7px;background:rgba(255,255,255,.07);font-size:12px;font-weight:700}
.seg button.on{background:var(--orange);color:#140900}

/* 劇情 */
#s-scene{background:rgba(3,5,8,.86)}
#s-scene .scr-in{justify-content:flex-end;max-width:640px;margin:0 auto;gap:10px}
.sc-head{margin-bottom:auto;padding-top:6vh}
.sc-head .lbl{display:block}
.sc-head h2{font-size:clamp(28px,8vw,40px);font-weight:900;letter-spacing:.12em;margin-top:6px}
.sc-head .sub2{color:var(--cream2);font-size:13px;margin-top:6px;letter-spacing:.1em}
.line{display:flex;gap:10px;align-items:flex-end;animation:tin .3s}
.line canvas{width:54px;height:66px;border-radius:8px;flex:0 0 auto;background:#0c1520}
.line .bub{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:9px 12px;font-size:15px;line-height:1.6}
.line .bub b{display:block;font-size:11px;color:var(--orange);letter-spacing:.12em;margin-bottom:2px}
.line.nar .bub{background:none;border:0;color:var(--cream2);font-size:14px;text-align:center;padding:4px 8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--orange)}
.choice b{font-size:15px;display:block}
.choice small{display:block;color:var(--cream2);font-size:12px;line-height:1.5;margin-top:3px}
.choice:disabled{opacity:.38}
.choice .req{color:var(--amber);font-size:11px;margin-top:4px;display:block}
.tapnext{font:600 11px var(--m);color:var(--dim);letter-spacing:.2em;text-align:center;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}

/* 結算 */
#s-result{background:rgba(3,5,8,.95)}
#s-result .scr-in{max-width:620px;margin:0 auto;gap:12px}
.rhead{text-align:center;padding-top:4vh}
.rhead .lbl{display:block}
.rhead h2{font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:.14em;margin-top:8px;padding-left:.14em}
.rhead p{font-size:14px;color:var(--cream2);line-height:1.8;margin-top:10px;text-align:left;white-space:pre-wrap}
.survivors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sv{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.sv canvas{width:100%;height:64px}
.sv .sn{font-weight:900;font-size:13px}
.sv .ss{font-size:10px;color:var(--cream2);line-height:1.35;margin-top:2px;min-height:26px}
.sv.d .sn{color:var(--red)}
.sv.d canvas{filter:grayscale(1) brightness(.6)}
.rew{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--cream2)}
.rew b{font-family:var(--m);color:var(--amber)}
.unl{border-left:4px solid var(--amber)}

/* 暫停 */
#s-pause{background:rgba(3,5,8,.78)}
#s-pause .scr-in{justify-content:center;max-width:420px;margin:0 auto;gap:10px}
#s-pause h2{text-align:center;font-size:26px;font-weight:900;letter-spacing:.2em;margin-bottom:6px}

#fade{position:fixed;inset:0;background:#000;z-index:90;pointer-events:none;opacity:0;transition:opacity .6s}
.askbox{position:fixed;inset:0;z-index:80;background:rgba(2,4,8,.74);display:flex;align-items:center;justify-content:center;padding:24px}
.askbox .ab{max-width:360px;width:100%;background:#0b1118;border:1px solid var(--line);border-radius:16px;padding:20px 18px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.askbox p{margin:0 0 18px;line-height:1.65;font-size:16px;color:var(--cream)}
.askbox .abr{display:flex;gap:10px}.askbox .abr .bigbtn{flex:1;letter-spacing:.06em}
#fade.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;z-index:89;pointer-events:none;opacity:0}
#boot{position:fixed;inset:0;z-index:99;background:#05080c;display:grid;place-items:center;font:600 12px var(--m);letter-spacing:.3em;color:var(--dim)}
</style>
</head>
