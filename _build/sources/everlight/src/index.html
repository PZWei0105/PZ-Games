<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="長明">
<title>長明 EVERLIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<!--MANIFEST-->
<style>
:root{
  --ink:#f2ead8; --muted:#a49c8a; --dim:#6f6a60; --gold:#d6b36a; --gold2:#f4d995; --line:rgba(214,179,106,.5); --line2:rgba(214,179,106,.22);
  --panel:rgba(9,12,19,.84); --panel2:rgba(16,21,32,.92); --day:#ffd27a; --night:#a9b8ff; --bad:#ff7a66; --good:#8fe4a8;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif; --latin:'Cinzel','Noto Serif TC',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070b;color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;background:#05070b}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5;font-size:15px}
.pe{pointer-events:auto}
.hide{display:none!important}
button{font-family:var(--serif);color:inherit}
/* ---------- 共用 ---------- */
.panel{background:linear-gradient(180deg,rgba(18,24,36,.92),rgba(8,11,18,.9));border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,240,200,.06);position:relative}
.panel.orn::before,.panel.orn::after{content:'';position:absolute;width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);background:#0b0f18}
.panel.orn::before{top:-5px;left:calc(50% - 5px)}
.panel.orn::after{bottom:-5px;left:calc(50% - 5px)}
.btn{pointer-events:auto;border:1px solid var(--line);background:linear-gradient(180deg,rgba(32,40,58,.95),rgba(14,18,28,.95));border-radius:5px;padding:10px 14px;font-weight:700;letter-spacing:.06em;font-size:15px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;position:relative;color:var(--ink)}
.btn:active{transform:scale(.96);background:linear-gradient(180deg,rgba(80,66,36,.95),rgba(40,32,18,.95))}
.btn.gold{border-color:var(--gold);color:var(--gold2)}
.btn[disabled],.btn.off{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 3px;border-radius:4px;font-size:13px;font-weight:900;line-height:1;background:#1a1e28;border:1px solid rgba(255,255,255,.18)}
.tag{font-size:11px;letter-spacing:.1em;color:var(--muted)}
/* ---------- 淡入淡出 ---------- */
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:30}
#fade.on{opacity:1;pointer-events:auto}
#flashv{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:29}
/* ---------- 標題 ---------- */
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(48px + var(--sab));pointer-events:auto;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(3,5,10,.75) 100%)}
#title .logo{position:absolute;top:calc(14vh + var(--sat));left:0;right:0;text-align:center}
#title .zh{font-size:min(26vw,150px);font-weight:900;letter-spacing:.12em;line-height:1;background:linear-gradient(180deg,#fff6dc 10%,#f0c870 55%,#a8702a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,200,110,.35));padding-left:.12em}
#title .en{font-family:var(--latin);font-size:min(6vw,30px);letter-spacing:.6em;color:#e9d7a8;margin-top:10px;padding-left:.6em;opacity:.9}
#title .sub{font-size:13px;letter-spacing:.3em;color:var(--muted);margin-top:16px}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(320px,80vw)}
#title .menu .btn{font-size:17px;padding:13px}
#title .tap{position:absolute;bottom:calc(20vh + var(--sab));left:0;right:0;text-align:center;font-size:15px;letter-spacing:.4em;color:var(--gold2);animation:pulse 2s infinite}
#title .ver{position:absolute;bottom:calc(10px + var(--sab));right:14px;font-size:11px;color:var(--dim);font-family:var(--latin)}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
/* ---------- 對話 ---------- */
#dialog{position:absolute;left:calc(10px + var(--sal));right:calc(10px + var(--sar));bottom:calc(12px + var(--sab));min-height:118px;padding:20px 20px 18px;pointer-events:auto;z-index:8;max-width:820px;margin:0 auto}
#dialog .name{position:absolute;top:-15px;left:16px;padding:4px 14px;font-weight:900;letter-spacing:.12em;font-size:15px;color:var(--gold2);background:#0d121c;border:1px solid var(--line);border-radius:4px}
#dialog .text{font-size:17px;line-height:1.75;letter-spacing:.03em;min-height:58px;white-space:pre-wrap}
#dialog .more{position:absolute;right:16px;bottom:8px;color:var(--gold);font-size:12px;animation:bob 1s infinite}
#dialog.narr{background:rgba(5,7,11,.72);border-color:transparent;box-shadow:none}
#dialog.narr .text{text-align:center;color:#e6dcc4;font-size:16px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
#choices{position:absolute;right:calc(14px + var(--sar));bottom:calc(150px + var(--sab));display:flex;flex-direction:column;gap:8px;z-index:9;pointer-events:auto;min-width:200px}
/* ---------- 橫幅、提示 ---------- */
#banner{position:absolute;top:calc(18% + var(--sat));left:0;right:0;text-align:center;opacity:0;transition:opacity .8s;z-index:6}
#banner.on{opacity:1}
#banner .b1{font-size:26px;font-weight:900;letter-spacing:.35em;text-shadow:0 2px 12px rgba(0,0,0,.8);padding-left:.35em}
#banner .b2{font-size:12px;letter-spacing:.5em;color:var(--gold2);font-family:var(--latin);margin-top:6px;padding-left:.5em}
#banner .line{width:180px;height:1px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#card{position:fixed;inset:0;background:#000;z-index:31;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s}
#card.on{opacity:1;pointer-events:auto}
#card .c1{font-size:14px;letter-spacing:.6em;color:var(--gold);padding-left:.6em}
#card .c2{font-size:34px;font-weight:900;letter-spacing:.3em;margin-top:14px;padding-left:.3em}
#card .c3{font-size:13px;color:var(--muted);margin-top:18px;letter-spacing:.2em;max-width:80vw;text-align:center;line-height:1.9}
#toasts{position:absolute;top:calc(64px + var(--sat));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:12}
.toast{padding:8px 16px;font-size:14px;letter-spacing:.05em;animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* ---------- 場景 HUD ---------- */
#hud{position:absolute;inset:0}
#hud .loc{position:absolute;top:calc(10px + var(--sat));left:calc(12px + var(--sal));display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;font-size:14px;font-weight:700;letter-spacing:.1em}
#hud .loc .ph{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
#hud .obj{position:absolute;top:calc(48px + var(--sat));left:calc(12px + var(--sal));max-width:62vw;font-size:12.5px;color:#e8dcc0;padding:5px 10px;letter-spacing:.04em;background:rgba(6,9,14,.6);border-left:2px solid var(--gold);border-radius:0 4px 4px 0}
#hud .mbtn{position:absolute;top:calc(10px + var(--sat));right:calc(12px + var(--sar));width:46px;height:46px;padding:0;font-size:20px;display:flex;align-items:center;justify-content:center}
#hud .acts{position:absolute;right:calc(14px + var(--sar));bottom:calc(26px + var(--sab));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#hud .act{min-width:92px;height:52px;font-size:16px;border-radius:26px;padding:0 20px;border-color:var(--gold);color:var(--gold2);box-shadow:0 0 18px rgba(240,200,110,.18)}
#hud .act.sec{min-width:74px;height:44px;font-size:14px;color:var(--ink);border-color:var(--line)}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(240,220,170,.35);background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.01));pointer-events:none;opacity:0;transition:opacity .15s;z-index:4}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,240,200,.55),rgba(214,179,106,.25));border:1px solid rgba(255,230,170,.6)}
.emote{position:absolute;transform:translate(-50%,-100%);font-size:16px;font-weight:900;padding:2px 8px;border-radius:10px;background:#f4ead2;color:#2a2030;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:pop .25s ease-out;z-index:3}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.4);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.nameplate{position:absolute;transform:translate(-50%,-100%);font-size:11px;color:#f3e6c8;text-shadow:0 1px 3px #000;white-space:nowrap;letter-spacing:.05em;opacity:.85}
.shadowtalk{position:absolute;transform:translate(-50%,-100%);max-width:240px;padding:8px 12px;font-size:13.5px;line-height:1.6;color:#d8ccff;background:rgba(20,14,40,.92);border:1px solid rgba(160,130,255,.6);border-radius:8px;box-shadow:0 0 24px rgba(120,90,255,.35);z-index:4}
/* ---------- 選單 ---------- */
#menu{position:absolute;inset:0;background:rgba(3,5,9,.84);display:flex;flex-direction:column;padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));z-index:10}
#menu .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#menu .tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
#menu .tabs::-webkit-scrollbar{display:none}
#menu .tab{flex:none;padding:9px 14px;font-size:14px}
@media (max-width:520px){#menu .tab{flex:1 1 0;min-width:0;padding:9px 0;font-size:13.5px;letter-spacing:0}}
#menu .tab.on{border-color:var(--gold);color:var(--gold2);background:linear-gradient(180deg,rgba(70,56,28,.9),rgba(30,24,14,.9))}
#menu .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:none}
.mrow .grow{flex:1;min-width:0}
.mrow .t1{font-weight:700;font-size:15px}
.mrow .t2{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.sec-h{font-size:12px;letter-spacing:.3em;color:var(--gold);margin:14px 4px 6px}
.card{padding:12px 14px;margin-bottom:10px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;font-size:13px;margin-top:8px}
.statgrid b{color:var(--gold2);font-weight:700;margin-left:4px}
.bar{height:6px;border-radius:3px;background:#20242e;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .35s}
.hpbar i{background:linear-gradient(90deg,#4fb37a,#9fe39a)}
.hpbar.low i{background:linear-gradient(90deg,#c04a3a,#ff8a6a)}
.expbar i{background:linear-gradient(90deg,#8a6a2a,#f4d995)}
.ultbar i{background:linear-gradient(90deg,#c27a2a,#ffd27a,#fff2c0)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;transform:rotate(45deg);border:1px solid #6a5a3a;background:#14161c}
.pips i.on{background:radial-gradient(circle,#fff6d0,#f0b84a);border-color:#ffe0a0;box-shadow:0 0 6px rgba(255,200,100,.8)}
.pips.night i.on{background:radial-gradient(circle,#f4f0ff,#9a8aff);border-color:#d0c8ff;box-shadow:0 0 6px rgba(160,140,255,.8)}
/* ---------- 戰鬥 UI ---------- */
#bui{position:absolute;inset:0}
#bui .topbar{position:absolute;top:calc(8px + var(--sat));left:calc(8px + var(--sal));right:calc(8px + var(--sar));display:flex;align-items:flex-start;gap:8px}
.phasedial{width:64px;height:64px;flex:none;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;border:1px solid var(--line);background:radial-gradient(circle,#1a1f2c,#090c13);box-shadow:0 0 24px rgba(0,0,0,.6)}
.phasedial .pz{font-size:24px;font-weight:900;line-height:1}
.phasedial .pc{display:flex;gap:3px;margin-top:4px}
.phasedial .pc i{width:6px;height:6px;border-radius:50%;background:#333;border:1px solid #666}
.phasedial .pc i.on{background:currentColor;border-color:currentColor}
.phasedial.L{color:var(--day);box-shadow:0 0 26px rgba(255,200,100,.35);border-color:rgba(255,210,120,.7)}
.phasedial.D{color:var(--night);box-shadow:0 0 26px rgba(140,150,255,.35);border-color:rgba(170,180,255,.6)}
.timeline{flex:1;display:flex;flex-direction:column;gap:3px;padding:6px 8px;min-width:0}
.timeline .row{display:flex;gap:4px;align-items:center;overflow:hidden}
.timeline .lbl{font-size:10px;color:var(--muted);width:28px;flex:none;letter-spacing:.1em}
.tl{width:30px;height:30px;flex:none;border-radius:5px;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;overflow:hidden;position:relative}
.tl canvas{image-rendering:pixelated;width:30px;height:30px}
.tl.p{border-color:rgba(140,220,170,.6);background:#122019}
.tl.e{border-color:rgba(255,120,100,.5);background:#24130f}
.tl.cur{outline:2px solid var(--gold2);outline-offset:1px}
.tl.br{opacity:.35}
.next .tl{width:22px;height:22px;opacity:.6}
.next .tl canvas{width:22px;height:22px}
.elabel{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;z-index:2;transition:opacity .2s}
.elabel .nm{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap}
.elabel .row{display:flex;gap:3px;align-items:center}
.elabel .shield{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;background:linear-gradient(180deg,#4a6aa0,#24345a);clip-path:polygon(50% 0,100% 18%,92% 70%,50% 100%,8% 70%,0 18%);text-shadow:0 1px 2px #000}
.elabel .shield.broken{background:linear-gradient(180deg,#a04a3a,#4a1a14)}
.elabel .wk{min-width:19px;height:19px;font-size:12px}
.elabel .wk.unk{color:#888;border-style:dashed}
.elabel .wk.none{color:#bbb;font-size:10px;padding:0 4px}
.elabel .hp{width:64px;height:4px}
.elabel .st{font-size:11px;font-weight:900;padding:1px 6px;border-radius:3px;letter-spacing:.08em}
.elabel .st.brk{background:#c0402a;color:#fff;animation:pulse .8s infinite}
.elabel .st.chg{background:#ffcc44;color:#2a1a00}
.elabel.sel .nm{color:var(--gold2)}
.elabel.dead{opacity:0;pointer-events:none}
#bui .party{position:absolute;left:calc(8px + var(--sal));right:calc(8px + var(--sar));bottom:calc(8px + var(--sab));display:flex;gap:6px}
.pcard{flex:1;min-width:0;padding:7px 9px 8px;transition:transform .2s,border-color .2s;pointer-events:auto}
.pcard.cur{border-color:var(--gold2);transform:translateY(-4px);box-shadow:0 0 18px rgba(255,210,120,.25)}
.pcard.ko{filter:grayscale(1);opacity:.55}
.pcard .h{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.pcard .h .lvl{font-size:10px;color:var(--muted);font-weight:400}
.pcard .hpn{font-size:12px;color:#cfe8d4;margin-left:auto;font-family:var(--latin);font-weight:700}
.pcard .bars{display:flex;flex-direction:column;gap:4px}
.pcard .aglow{font-size:10px;color:#ffe08a;margin-left:4px}
#cmd{position:absolute;left:calc(8px + var(--sal));right:calc(8px + var(--sar));bottom:calc(92px + var(--sab));padding:10px;pointer-events:auto}
#cmd .who{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-weight:900;font-size:15px;color:var(--gold2)}
#cmd .who .hint{font-size:12px;color:var(--muted);font-weight:400;flex:1;text-align:right}
#cmd .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
#cmd .grid .btn{padding:12px 4px;font-size:15px}
#cmd .grid .btn.lamp{border-color:#8fb0ff;color:#d8e2ff}
#cmd .grid .btn.ult{border-color:#ffd27a;color:#fff2c8;background:linear-gradient(180deg,#5a3a10,#2a1a08);animation:glowb 1.4s infinite}
@keyframes glowb{0%,100%{box-shadow:0 0 6px rgba(255,200,100,.4)}50%{box-shadow:0 0 20px rgba(255,210,120,.9)}}
#cmd .list{display:flex;flex-direction:column;gap:6px;max-height:min(46vh,330px);overflow-y:auto}
.skill{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px}
.skill .nm{font-size:15px;flex:none}
.skill .ds{font-size:11.5px;color:var(--muted);flex:1;line-height:1.4;font-weight:400}
.skill .cost{display:flex;gap:2px;flex:none}
.skill .cost i{width:8px;height:8px;transform:rotate(45deg);background:#f0c060;box-shadow:0 0 4px #f0c060}
.skill .ph{font-size:11px;padding:1px 5px;border-radius:3px;flex:none}
.skill.locked{opacity:.38}
.skill .wkhit{font-size:11px;color:#1a1000;background:#ffd76a;padding:1px 5px;border-radius:3px;font-weight:900}
.dmg{position:absolute;transform:translate(-50%,-50%);font-family:var(--latin);font-weight:900;font-size:26px;color:#fff;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.8);pointer-events:none;z-index:7;white-space:nowrap}
.dmg.weak{color:#ffe07a;font-size:32px}
.dmg.heal{color:#9ff0b0}
.dmg.crit{color:#ff9a6a}
.dmg.small{font-size:16px;font-family:var(--serif)}
.dmg .lbl{display:block;font-family:var(--serif);font-size:12px;text-align:center;letter-spacing:.1em}
#bbanner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:7}
#bbanner .bb{display:inline-block;padding:8px 40px;font-size:22px;font-weight:900;letter-spacing:.3em;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 20%,rgba(0,0,0,.75) 80%,transparent);text-shadow:0 0 12px currentColor;animation:bbin .3s ease-out;padding-left:calc(40px + .3em)}
@keyframes bbin{from{transform:scaleX(.3);opacity:0}to{transform:none;opacity:1}}
#bmsg{position:absolute;left:0;right:0;top:calc(84px + var(--sat));text-align:center;pointer-events:none;z-index:7}
#bmsg span{display:inline-block;padding:6px 14px;font-size:14px;background:rgba(0,0,0,.6);border-radius:4px;letter-spacing:.05em}
#cutin{position:absolute;left:0;right:0;top:40%;height:110px;margin-top:-55px;pointer-events:none;z-index:8;overflow:hidden;opacity:0}
#cutin.on{opacity:1}
#cutin .strip{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(20,12,4,.9) 15%,rgba(20,12,4,.9) 85%,rgba(0,0,0,0));border-top:1px solid #ffd27a;border-bottom:1px solid #ffd27a}
#cutin .nm{position:absolute;right:10%;top:50%;transform:translateY(-50%);font-size:34px;font-weight:900;letter-spacing:.35em;color:#fff4d0;text-shadow:0 0 18px #ffb040}
#cutin .who{position:absolute;right:10%;top:12px;font-size:12px;letter-spacing:.4em;color:#ffd27a}
#cutin canvas{position:absolute;left:6%;bottom:-30px;height:180px;image-rendering:pixelated}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);pointer-events:auto;z-index:9}
#result .box{width:min(440px,90vw);padding:20px}
#result h2{margin:0 0 12px;text-align:center;letter-spacing:.5em;color:var(--gold2);font-size:22px;padding-left:.5em}
.tut{position:absolute;left:50%;top:calc(110px + var(--sat));transform:translateX(-50%);width:min(420px,92vw);padding:14px 16px;font-size:14px;line-height:1.7;z-index:11;pointer-events:auto}
.tut b{color:var(--gold2)}
.tut .ok{display:block;margin:10px auto 0;padding:8px 26px}
/* ---------- 商店、釣魚 ---------- */
.overlay{position:absolute;inset:0;background:rgba(3,5,9,.7);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:10;padding:calc(10px + var(--sat)) 10px calc(10px + var(--sab))}
.overlay .box{width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;padding:14px}
.overlay .box .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.overlay .box .head h3{margin:0;flex:1;font-size:18px;letter-spacing:.2em;color:var(--gold2)}
.overlay .box .scroll{overflow-y:auto;flex:1;min-height:0}
.gold{color:var(--gold2);font-family:var(--latin);font-weight:700}
#fish{position:absolute;left:0;right:0;bottom:calc(30px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:9;pointer-events:auto}
#fish .meter{width:min(320px,80vw);height:22px;border:1px solid var(--line);border-radius:11px;background:#0b0f18;position:relative;overflow:hidden}
#fish .zone{position:absolute;top:0;bottom:0;background:rgba(120,220,150,.35);border-left:1px solid #8fe4a8;border-right:1px solid #8fe4a8}
#fish .needle{position:absolute;top:-2px;bottom:-2px;width:4px;background:#ffd27a;box-shadow:0 0 8px #ffd27a}
#fish .msg{font-size:16px;font-weight:900;letter-spacing:.2em;text-shadow:0 2px 6px #000}
@media (orientation:landscape) and (max-height:520px){
  #dialog{min-height:96px;padding:16px 18px 12px}
  #dialog .text{font-size:16px;min-height:48px}
  #bui .topbar{left:auto;width:min(430px,52vw);flex-direction:row-reverse}
  .phasedial{width:52px;height:52px}
  .phasedial .pz{font-size:20px}
  #cmd{left:auto;right:calc(8px + var(--sar));width:min(300px,37vw);bottom:calc(8px + var(--sab));padding:7px 8px}
  #cmd .who{margin-bottom:5px;font-size:13px}
  #cmd .grid{grid-template-columns:repeat(3,1fr);gap:5px}
  #cmd .grid .btn{padding:8px 2px;font-size:13.5px}
  #cmd .list{max-height:62vh}
  #bui .party{left:calc(8px + var(--sal));right:calc(min(300px,37vw) + 18px + var(--sar));flex-direction:row;gap:5px;bottom:calc(8px + var(--sab))}
  .pcard{padding:4px 7px 5px}
  .pcard .h{font-size:12px;margin-bottom:3px}
  .pcard.cur{transform:translateY(-3px)}
}

/* ---------- 結尾 ---------- */
#ending{position:fixed;inset:0;z-index:27;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(ellipse at 50% 38%,rgba(60,48,30,.55),rgba(4,5,9,.96) 70%);text-align:center}
#ending .e1{font-family:var(--latin);letter-spacing:.5em;color:var(--gold);font-size:13px;padding-left:.5em}
#ending .e2{font-size:min(7vw,32px);font-weight:900;letter-spacing:.22em;padding-left:.22em;background:linear-gradient(180deg,#fff6dc,#f0c870 60%,#a8702a);-webkit-background-clip:text;background-clip:text;color:transparent}
#ending .e3{font-size:12px;color:var(--muted);letter-spacing:.12em}
#ending .e4{font-size:15px;line-height:2;color:#e6dcc4;margin:10px 0}
#ending .e5{font-size:12px;letter-spacing:.3em;color:var(--gold2)}
#ending .eb{display:flex;gap:10px;margin-top:10px}
#ending .eb .btn{min-width:130px}

@media (orientation:landscape) and (max-height:560px){
  #title{align-items:flex-start;justify-content:center;padding:0 0 0 calc(7vw + var(--sal));background:linear-gradient(90deg,rgba(3,5,10,.72) 0%,rgba(3,5,10,.25) 48%,rgba(0,0,0,0) 70%)}
  #title .logo{position:static;text-align:left;margin-bottom:16px}
  #title .zh{font-size:min(24vh,110px);padding-left:0}
  #title .en{font-size:min(5vh,22px);letter-spacing:.55em;padding-left:.1em;margin-top:6px}
  #title .sub{margin-top:10px}
  #title .menu{width:min(290px,38vw);gap:8px}
  #title .menu .btn{font-size:15px;padding:10px}
  #title .tap{left:calc(7vw + var(--sal));right:auto;bottom:16vh;text-align:left}
}
</style>
