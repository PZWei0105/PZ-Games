/* 全知 OMNISCIENT v2 — 霓虹戰情牆（設計稿 1920×1080，1rem＝10 設計像素，等比放大到 4K） */
:root {
  --ink: #eaf3ff; --ink2: #a6b6d4; --ink3: #64739a; --line: rgba(120, 160, 255, .13);
  --n-cyan: #00e5ff; --n-mag: #ff3df0; --n-yel: #ffd23d; --n-vio: #8f6dff; --n-ora: #ff8a3d; --n-sky: #4db8ff; --n-pink: #ff5c9a; --n-teal: #2ef2d0;
  --up: #ff4d6d; --dn: #19e39b; --flat: #c8d2e6; --warn: #ffb02e; --bad: #ff4d4d; --ok: #2ef2d0;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', monospace;
  --f-hd: 'Oxanium', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --f-brand: 'Orbitron', 'Oxanium', sans-serif;
  --f-ui: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
}
html { font-size: calc(min(100vw / 192, 100vh / 108)); background: #02040a; }
html.stack { font-size: calc(min(100vw / 40, 11px)); }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-family: var(--f-ui); background: #02040a; overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; }
html.stack body { overflow: auto; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
.up { color: var(--up); } .dn { color: var(--dn); } .flat { color: var(--flat); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
canvas#gl, canvas#fallback { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; display: block; }

/* ------------------------------------------------------------------ 版面 */
#board { position: relative; z-index: 2; width: 100vw; height: 100vh; display: grid; grid-template-rows: 8.4rem 3.1rem minmax(0, 1fr) 22rem 3.2rem; gap: .8rem; padding: 1rem 1.4rem .6rem; opacity: 0; pointer-events: none; }
body.ready #board { opacity: 1; pointer-events: auto; }
#cols, #tabs { display: grid; grid-template-columns: 22rem 24rem minmax(0, 1fr) 33rem 38rem 25rem; column-gap: 3.2rem; min-height: 0; }
.col { display: flex; flex-direction: column; gap: .7rem; min-height: 0; overflow: hidden; position: relative; }
#bottom { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 1.4rem; min-height: 0; }

/* ------------------------------------------------------------------ 卡片 */
.cd { --c: var(--n-cyan); position: relative; flex: none; border-radius: .3rem; border: 1px solid color-mix(in srgb, var(--c) 82%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 9%, #060a16) 0%, #04070f 70%);
  box-shadow: 0 0 1rem -.25rem color-mix(in srgb, var(--c) 80%, transparent), inset 0 0 1.4rem -1rem var(--c), 0 0 0 1px rgba(0, 0, 0, .75);
  overflow: hidden; }
.cd .hd { display: flex; align-items: center; gap: .55rem; padding: .5rem .75rem .3rem; font: 500 1.06rem/1.25 var(--f-mono); color: var(--c); letter-spacing: .03em; white-space: nowrap; }
.cd .hd::before { content: ''; width: .55rem; height: .55rem; background: var(--c); box-shadow: 0 0 .7rem var(--c), 0 0 .2rem #fff; border-radius: 1px; flex: none; }
.cd .hd .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cd .hd .t em { font-style: normal; font-family: var(--f-ui); font-weight: 600; color: var(--ink); letter-spacing: .02em; }
.cd .hd .r { margin-left: auto; color: var(--ink2); font-weight: 400; }
.cd .ft { display: flex; gap: .9rem; padding: .2rem .75rem .45rem; font: 400 .95rem/1.3 var(--f-mono); color: var(--ink3); white-space: nowrap; overflow: hidden; }
.cd .ft b { color: var(--ink2); font-weight: 500; }
.cd .ft .ok { color: var(--ok); } .cd .ft .wr { color: var(--warn); } .cd .ft .bd { color: var(--bad); }
.cd canvas.ch { display: block; width: 100%; }
.cd.hit { animation: cdHit 1.05s cubic-bezier(.2, .7, .2, 1); }
.cd.hit::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--c) 35%, transparent) 48%, rgba(255, 255, 255, .5) 50%, color-mix(in srgb, var(--c) 35%, transparent) 52%, transparent 70%); background-size: 260% 100%; animation: sheen .8s ease-out forwards; mix-blend-mode: screen; }
@keyframes cdHit { 0% { box-shadow: 0 0 2.6rem .1rem var(--c), inset 0 0 2.4rem -.6rem var(--c), 0 0 0 1px #fff; border-color: #fff; } 100% { } }
@keyframes sheen { from { background-position: 120% 0; } to { background-position: -40% 0; } }
.cd.stale { filter: saturate(.25) brightness(.7); }
.cd.in { animation: cardIn .7s steps(1, end) both, cardFade .7s ease-out both; }
@keyframes cardIn { 0% { opacity: 0; } 12% { opacity: .9; } 18% { opacity: .1; } 30% { opacity: 1; } 38% { opacity: .35; } 46%, 100% { opacity: 1; } }
@keyframes cardFade { from { transform: translateY(.4rem) scale(.985); filter: brightness(2.2) saturate(1.6); } to { transform: none; filter: none; } }

/* 小元件 */
.row { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr) 5rem; align-items: center; gap: .6rem; padding: .12rem .75rem; font: 400 1rem/1.35 var(--f-mono); }
.row .k { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-mono); }
.row .k.zh { font-family: var(--f-ui); }
.row .v { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { position: relative; height: .62rem; background: rgba(255, 255, 255, .06); border-radius: .1rem; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--bc, var(--c)) 45%, transparent), var(--bc, var(--c))); box-shadow: 0 0 .7rem var(--bc, var(--c)); transition: width 1s cubic-bezier(.2, .8, .2, 1), left 1s, right 1s; }
.bar.mid::before { content: ''; position: absolute; left: 50%; top: -.2rem; bottom: -.2rem; width: 1px; background: rgba(255, 255, 255, .4); z-index: 1; }
.tag { display: inline-block; font: 500 .9rem/1.4 var(--f-mono); padding: 0 .45rem; border-radius: .2rem; border: 1px solid currentColor; white-space: nowrap; }
.tag.zh { font-family: var(--f-ui); }
.lamp { width: .7rem; height: .7rem; border-radius: 50%; flex: none; background: var(--ink3); }
.lamp.ok { background: var(--ok); box-shadow: 0 0 .6rem var(--ok); } .lamp.old { background: var(--warn); box-shadow: 0 0 .6rem var(--warn); }
.lamp.err { background: var(--bad); box-shadow: 0 0 .8rem var(--bad); animation: blink 1s infinite; } .lamp.idle { background: #2a3550; }
@keyframes blink { 50% { opacity: .3; } }

/* 滾動數字 */
.odo { display: inline-flex; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: none !important; filter: drop-shadow(0 0 .28em currentColor) drop-shadow(0 0 .06em currentColor); }
.odo .d, .odo .s { text-shadow: none; }
.odo .d { display: inline-block; height: 1em; overflow: hidden; position: relative; }
.odo .d > span { display: flex; flex-direction: column; transition: transform .75s cubic-bezier(.2, .9, .25, 1); }
.odo .d > span > i { font-style: normal; height: 1em; line-height: 1; }
.odo .s { display: inline-block; }

/* ------------------------------------------------------------------ 頂列 */
#top { display: grid; grid-template-columns: 31rem 29rem minmax(0, 1fr) 21rem 25rem; gap: 2rem; align-items: center; }
.brand { display: flex; align-items: center; gap: 1.2rem; }
.eye { width: 6.4rem; height: 4rem; overflow: visible; filter: drop-shadow(0 0 .6rem var(--n-cyan)) drop-shadow(0 0 1.6rem rgba(0, 229, 255, .45)); }
.eye path { fill: none; stroke: var(--n-cyan); stroke-width: 2.6; }
.eye .ir { fill: none; stroke: var(--n-yel); stroke-width: 2.2; stroke-dasharray: 3.2 1.6; animation: spin 18s linear infinite; transform-origin: 32px 20px; }
.eye .pupil { fill: #fff; filter: drop-shadow(0 0 3px #fff); }
@keyframes spin { to { transform: rotate(360deg); } }
.bt b { font-family: var(--f-ui); font-size: 3.4rem; letter-spacing: .32em; font-weight: 900; color: #fff; text-shadow: 0 0 1rem rgba(0, 229, 255, .8), 0 0 2.4rem rgba(0, 229, 255, .45); }
.bt i { font-style: normal; font-family: var(--f-brand); font-weight: 900; font-size: 1.45rem; letter-spacing: .48em; color: var(--n-cyan); text-shadow: 0 0 .8rem var(--n-cyan); margin-left: .3rem; }
.bt small { display: block; font: 400 .98rem var(--f-mono); color: var(--ink3); letter-spacing: .1em; margin-top: .3rem; white-space: nowrap; }
.rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; }
.ring { position: relative; display: grid; justify-items: center; }
.ring svg { width: 6rem; height: 6rem; transform: rotate(-90deg); overflow: visible; }
.ring .trk { fill: none; stroke: rgba(255, 255, 255, .07); stroke-width: 3; }
.ring .tk { fill: none; stroke: rgba(255, 255, 255, .18); stroke-width: 1; stroke-dasharray: 1 5.2; }
.ring .val { fill: none; stroke-width: 3.2; stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.2, .8, .2, 1), stroke .6s; filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 7px currentColor); }
.ring .rv { position: absolute; top: 1.85rem; left: 0; right: 0; text-align: center; font: 600 1.55rem var(--f-mono); text-shadow: 0 0 .6rem currentColor; }
.ring .rl { font: 500 .9rem var(--f-mono); color: var(--ink3); letter-spacing: .08em; margin-top: .25rem; white-space: nowrap; }
.stats { display: grid; grid-template-columns: 1.3fr 1fr 1.15fr 1fr; gap: 1.8rem; }
.stat { min-width: 0; position: relative; }
.stat .sl { font: 500 .98rem var(--f-mono); color: var(--ink3); letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .sl em { font-style: normal; font-family: var(--f-ui); color: var(--ink2); }
.stat svg.sq { width: 100%; height: 1.6rem; display: block; margin: .2rem 0 .1rem; overflow: visible; }
.stat .sv { font: 600 2.75rem/1.05 var(--f-mono); white-space: nowrap; text-shadow: 0 0 1.2rem currentColor; }
.stat .ss { font: 500 1.1rem var(--f-mono); white-space: nowrap; margin-top: .15rem; }
.heat { display: grid; grid-template-columns: repeat(26, 1fr); gap: 1px; align-content: center; height: 7.4rem; position: relative; padding-top: 1.5rem; }
.heat .hl { position: absolute; top: 0; left: 0; right: 0; font: 500 .92rem var(--f-mono); color: var(--ink3); display: flex; justify-content: space-between; white-space: nowrap; }
.heat i { display: block; aspect-ratio: 1.6; border-radius: 1px; background: #1a2238; transition: background-color .6s; }
.mode { text-align: right; }
.badge { display: inline-flex; align-items: center; gap: .7rem; font: 700 1.25rem var(--f-hd); letter-spacing: .22em; padding: .35rem 1rem; border-radius: .25rem; border: 1px solid currentColor; box-shadow: 0 0 1rem -.2rem currentColor, inset 0 0 .8rem -.4rem currentColor; white-space: nowrap; }
.badge .dot { width: .8rem; height: .8rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 .8rem currentColor; }
.badge.live { color: var(--up); } .badge.live .dot { animation: blink 1s infinite; }
.badge.replay { color: var(--n-yel); } .badge.closed { color: var(--ink2); } .badge.down { color: var(--bad); }
.clock { font: 600 3rem/1.1 var(--f-mono); letter-spacing: .04em; margin-top: .35rem; text-shadow: 0 0 1.2rem rgba(0, 229, 255, .35); white-space: nowrap; }
.clock small { font-size: 1.25rem; color: var(--ink3); }
.mode .age { font: 400 .95rem var(--f-mono); color: var(--ink3); white-space: nowrap; }

/* 流程階段 */
#tabs .tab { --c: var(--n-cyan); position: relative; display: flex; align-items: center; gap: .7rem; padding: 0 1rem; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: .25rem; font: 500 1.08rem var(--f-mono); color: var(--ink3); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 10%, #060a16), #04070f); overflow: hidden; white-space: nowrap; transition: all .4s; }
#tabs .tab b { font: 700 1.35rem var(--f-ui); color: var(--ink); letter-spacing: .14em; }
#tabs .tab .n { color: var(--c); }
#tabs .tab .e { font: 600 .95rem var(--f-hd); letter-spacing: .28em; }
#tabs .tab .pg { margin-left: auto; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
#tabs .tab .pr { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--c); box-shadow: 0 0 .8rem var(--c); transition: width .8s; }
#tabs .tab.on { color: #02040a; background: var(--c); border-color: var(--c); box-shadow: 0 0 1.8rem -.2rem var(--c); }
#tabs .tab.on b, #tabs .tab.on .n, #tabs .tab.on .pg { color: #02040a; }

/* ------------------------------------------------------------------ 01 蒐集 */
.src { --c: var(--n-sky); cursor: pointer; }
.src .hd { padding-bottom: .2rem; }
.src .sb { display: grid; grid-template-columns: 1fr auto; gap: .2rem .6rem; padding: 0 .75rem .45rem; font: 400 .98rem var(--f-mono); color: var(--ink2); align-items: center; }
.src .sb .w { font-family: var(--f-ui); color: var(--ink); font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src .sb .bar { grid-column: 1 / 3; height: .45rem; }
.src.idle { opacity: .5; }

/* 02 查證 */
.chk .big { font: 600 2rem var(--f-mono); text-shadow: 0 0 .8rem currentColor; }
.chk.pass { --c: var(--n-teal); } .chk.warn { --c: var(--warn); } .chk.fail { --c: var(--bad); } .chk.wait { --c: var(--n-vio); }
.chk .cd2 { padding: .1rem .75rem .35rem; font: 400 1rem/1.45 var(--f-ui); color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 03 過濾 */
.nsum { --c: var(--n-mag); }
.nsum .ks { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; padding: .2rem .75rem .5rem; }
.nsum .ks div { font: 400 .95rem var(--f-mono); color: var(--ink3); }
.nsum .ks b { display: block; font: 600 2.1rem var(--f-mono); text-shadow: 0 0 .9rem currentColor; }
.k-off { color: var(--n-cyan); } .k-fact { color: #e4ecff; } .k-op { color: var(--warn); }
.news { --c: var(--n-mag); cursor: pointer; }
.news.k-op { --c: var(--warn); } .news.k-off { --c: var(--n-cyan); } .news.k-fact { --c: #9fb3ff; }
.news .nt { padding: 0 6.4rem .2rem .75rem; font: 500 1.24rem/1.42 var(--f-ui); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news .nt mark { background: rgba(255, 176, 46, .18); color: var(--warn); box-shadow: inset 0 -1px 0 var(--warn); padding: 0 .1em; }
.news .stp { position: absolute; right: .7rem; bottom: .6rem; font: 700 1rem var(--f-ui); letter-spacing: .12em; padding: .15rem .55rem; border: 2px solid currentColor; border-radius: .2rem; transform: rotate(-5deg); color: var(--c); text-shadow: 0 0 .6rem currentColor; box-shadow: 0 0 .8rem -.2rem currentColor; background: rgba(0, 0, 0, .35); }
.news.new { animation: slidein .55s cubic-bezier(.2, .9, .2, 1) both; }
.news.new .stp { animation: stamp .6s cubic-bezier(.2, 1.7, .4, 1) .25s both; }
@keyframes stamp { 0% { transform: rotate(-22deg) scale(2.8); opacity: 0; } 55% { opacity: 1; } 100% { transform: rotate(-5deg) scale(1); } }
@keyframes slidein { from { transform: translateX(-1.2rem); opacity: 0; filter: brightness(2.5); } to { transform: none; opacity: 1; filter: none; } }
.empty { color: var(--ink3); font: 400 1.15rem/1.6 var(--f-ui); padding: 1.6rem 1rem; text-align: center; }

/* 04 判斷 */
.jk { --c: var(--n-yel); } .jr { --c: var(--n-ora); } .jv { --c: var(--n-pink); } .jf { --c: var(--n-vio); }
.jv .vb { display: grid; grid-template-columns: 9.6rem 1fr; gap: .9rem; padding: .1rem .75rem .5rem; align-items: center; }
.jv .dial { position: relative; width: 9.6rem; height: 7rem; }
.jv .dial svg { width: 100%; height: 100%; overflow: visible; }
.jv .dial .dt { position: absolute; left: 0; right: 0; bottom: .1rem; text-align: center; }
.jv .dial .dt b { display: block; font: 900 1.9rem var(--f-ui); letter-spacing: .15em; text-shadow: 0 0 1rem currentColor; }
.jv .dial .dt span { font: 500 1.05rem var(--f-mono); color: var(--ink2); }
.jv .va { font: 700 1.3rem/1.4 var(--f-ui); color: var(--ink); }
.jv .vm { font: 400 1rem/1.55 var(--f-mono); color: var(--ink2); margin-top: .3rem; }
.jv .vm b { color: var(--ink); font-weight: 600; }
.bull { color: var(--up); } .bear { color: var(--dn); } .neu { color: var(--flat); }
.jr .row { grid-template-columns: 5.4rem minmax(0, 1fr) 4rem; }

/* 05 結論：自選 */
.tiles { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: .8rem; flex: 1; min-height: 0; }
.tile { display: flex; flex-direction: column; min-height: 0; cursor: pointer; }
.tile:nth-child(6n+1) { --c: var(--n-cyan); } .tile:nth-child(6n+2) { --c: var(--n-mag); } .tile:nth-child(6n+3) { --c: var(--n-yel); }
.tile:nth-child(6n+4) { --c: var(--n-vio); } .tile:nth-child(6n+5) { --c: var(--n-ora); } .tile:nth-child(6n) { --c: var(--n-sky); }
.tile.focus { box-shadow: 0 0 2.2rem -.1rem var(--c), inset 0 0 2rem -1rem var(--c), 0 0 0 1px #fff; }
.tile .pxr { display: flex; align-items: baseline; gap: .8rem; padding: 0 .75rem; }
.tile .px { font: 600 2.45rem/1.05 var(--f-mono); letter-spacing: -.02em; text-shadow: 0 0 1.1rem currentColor; }
.tile .px.na { font: 500 1.5rem/1.6 var(--f-ui); color: var(--ink3); text-shadow: none; }
.tile .cg { font: 500 .98rem/1.3 var(--f-mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; min-width: 0; }
.tile canvas.ch { flex: 1; min-height: 2rem; }
.tile .tg { display: flex; gap: .4rem; padding: .25rem .75rem 0; flex-wrap: nowrap; overflow: hidden; }

/* 06 全局 */
.g1 { --c: var(--n-teal); } .g2 { --c: var(--n-sky); } .g3 { --c: var(--n-vio); } .g4 { --c: var(--n-ora); } .g5 { --c: var(--n-mag); } .g6 { --c: var(--n-yel); }
.gtemp .tv { padding: 0 .75rem .1rem; font: 900 2.6rem/1.2 var(--f-ui); letter-spacing: .2em; text-shadow: 0 0 1.2rem currentColor; }
.gtemp ul { margin: 0; padding: 0 .75rem .45rem 2rem; font: 400 1rem/1.5 var(--f-ui); color: var(--ink2); }
.gidx .gv { display: flex; align-items: baseline; justify-content: space-between; padding: 0 .75rem; font: 600 1.6rem var(--f-mono); }
.gidx .gv small { font-size: 1rem; }
.split { display: flex; height: 1.4rem; margin: .2rem .75rem .5rem; border-radius: .2rem; overflow: hidden; gap: 2px; }
.split i { display: block; height: 100%; transition: flex-grow 1s; }

/* ------------------------------------------------------------------ 下排 */
.pn { --c: var(--n-cyan); position: relative; display: flex; flex-direction: column; min-height: 0; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius: .35rem; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 6%, #050913), #03060d); box-shadow: 0 0 1.4rem -.6rem var(--c), inset 0 0 2rem -1.6rem var(--c); overflow: hidden; }
#pBook { --c: var(--n-teal); } #pTape { --c: var(--n-yel); }
.pn .ph { display: flex; align-items: baseline; gap: .8rem; padding: .6rem 1rem .45rem; border-bottom: 1px solid color-mix(in srgb, var(--c) 25%, transparent); white-space: nowrap; }
.pn .ph b { font: 700 1.3rem var(--f-ui); letter-spacing: .14em; color: var(--ink); }
.pn .ph .e { font: 600 .95rem var(--f-hd); letter-spacing: .3em; color: var(--c); }
.pn .ph .r { margin-left: auto; font: 400 .98rem var(--f-mono); color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
.pn .pb { flex: 1; min-height: 0; position: relative; }
.lg { display: grid; grid-template-columns: 1.15fr 1fr; height: 100%; }
.log { list-style: none; margin: 0; padding: .5rem .8rem; font: 400 1.05rem/1.62 var(--f-mono); overflow: hidden; border-right: 1px solid var(--line); }
.log li { display: grid; grid-template-columns: 4.4rem 6.6rem 1fr; gap: .5rem; white-space: nowrap; overflow: hidden; animation: slidein .45s ease-out both; }
.log .lt { color: var(--ink3); }
.log .lx { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; font-family: var(--f-ui); }
.log li.hl .lx { color: var(--ink); }
.ag-owl { color: var(--n-sky); } .ag-libra { color: var(--n-teal); } .ag-medusa { color: var(--n-mag); } .ag-judge { color: var(--n-yel); } .ag-core { color: #dfe8ff; }
.code { margin: 0; padding: .5rem .9rem; font: 400 1.05rem/1.62 var(--f-mono); color: var(--ink2); white-space: pre; overflow: hidden; position: relative; }
.code .cm { color: var(--ink3); } .code .kw { color: var(--n-mag); } .code .fn { color: var(--n-cyan); } .code .nb { color: var(--n-yel); } .code .st { color: var(--n-teal); }
.code .cur { display: inline-block; width: .6em; height: 1.1em; vertical-align: -.15em; background: var(--n-cyan); box-shadow: 0 0 .6rem var(--n-cyan); animation: blink 1s steps(1) infinite; }
.code .hdr { display: block; color: var(--ink3); border-bottom: 1px solid var(--line); margin: -.2rem 0 .3rem; padding-bottom: .2rem; }
.book { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: .5rem .9rem; height: 100%; }
.bk { font: 400 1.05rem/1.6 var(--f-mono); min-width: 0; }
.bk .bh { display: flex; justify-content: space-between; color: var(--ink3); font-size: .95rem; border-bottom: 1px solid var(--line); margin-bottom: .2rem; }
.bk .lv { position: relative; display: flex; justify-content: space-between; padding: 0 .4rem; }
.bk .lv i { position: absolute; top: .15em; bottom: .15em; border-radius: .1rem; opacity: .85; transition: width .6s; }
.bk.ask .lv i { right: 0; background: linear-gradient(270deg, rgba(255, 138, 61, .6), rgba(255, 138, 61, .08)); box-shadow: 0 0 .8rem -.3rem var(--n-ora); }
.bk.bid .lv i { left: 0; background: linear-gradient(90deg, rgba(46, 242, 208, .55), rgba(46, 242, 208, .06)); box-shadow: 0 0 .8rem -.3rem var(--n-teal); }
.bk .lv span { position: relative; }
.bk .tsl { margin-top: .4rem; font-size: .98rem; color: var(--ink2); }
.bk .tsl div { display: flex; justify-content: space-between; }
.tape { display: flex; flex-direction: column; height: 100%; padding: .4rem .6rem .5rem; }
.tape canvas { flex: 1; min-height: 0; width: 100%; display: block; }
.tape .il { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; font: 400 .95rem var(--f-mono); color: var(--ink3); padding: .3rem .3rem 0; }
.tape .il b { display: block; font: 600 1.4rem var(--f-mono); }

/* ------------------------------------------------------------------ 底列 */
#foot { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1.4rem; align-items: center; }
.rp { display: flex; align-items: center; gap: .9rem; min-width: 0; }
.rp .rb { width: 3rem; height: 3rem; border-radius: 50%; border: 1px solid var(--n-yel); color: var(--n-yel); display: grid; place-items: center; flex: none; box-shadow: 0 0 1rem -.3rem var(--n-yel); }
.rp .rb svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }
.rp .rs { font: 500 1.1rem var(--f-mono); padding: .25rem .7rem; border: 1px solid var(--line); border-radius: .25rem; color: var(--ink2); flex: none; }
.rp .rl2 { font: 600 1.2rem var(--f-mono); color: var(--n-yel); white-space: nowrap; flex: none; min-width: 16rem; text-shadow: 0 0 .8rem rgba(255, 210, 61, .5); }
.scrub { position: relative; flex: 1; height: 2.6rem; cursor: pointer; min-width: 10rem; }
.scrub .sk { position: absolute; left: 0; right: 0; top: 1.15rem; height: .3rem; background: rgba(255, 255, 255, .08); border-radius: .2rem; }
.scrub .sf { position: absolute; left: 0; top: 1.15rem; height: .3rem; background: linear-gradient(90deg, var(--n-cyan), var(--n-yel)); border-radius: .2rem; box-shadow: 0 0 1rem var(--n-yel); }
.scrub .sh { position: absolute; top: .7rem; width: 1.2rem; height: 1.2rem; margin-left: -.6rem; border-radius: 50%; background: #fff; box-shadow: 0 0 1rem var(--n-yel), 0 0 .3rem #fff; }
.scrub .mk { position: absolute; top: .5rem; width: 2px; height: .55rem; margin-left: -1px; background: var(--n-mag); box-shadow: 0 0 .4rem var(--n-mag); }
.scrub .mk.op { background: var(--warn); box-shadow: 0 0 .4rem var(--warn); }
.scrub .tk { position: absolute; top: 1.65rem; font: 400 .85rem var(--f-mono); color: var(--ink3); transform: translateX(-50%); }
.rp .golive { font: 600 1.1rem var(--f-mono); color: var(--up); border: 1px solid var(--up); padding: .25rem .8rem; border-radius: .25rem; white-space: nowrap; box-shadow: 0 0 1rem -.4rem var(--up); }
.fnote { font: 400 .95rem/1.35 var(--f-ui); color: var(--ink3); max-width: 64rem; text-align: right; }
.tools { display: flex; gap: .7rem; }
.tb { width: 3rem; height: 3rem; border-radius: .4rem; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink2); background: rgba(8, 14, 30, .8); }
.tb:hover { color: #fff; border-color: var(--n-cyan); box-shadow: 0 0 1rem -.3rem var(--n-cyan); }
.tb svg { width: 1.7rem; height: 1.7rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.tb.off { color: var(--ink3); } .tb.off .w { display: none; }

/* ------------------------------------------------------------------ 掃描光束（亮過卡片） */
#beam { position: fixed; top: 0; bottom: 0; left: 0; width: 1.2rem; z-index: 6; pointer-events: none; opacity: 0; mix-blend-mode: screen; background: linear-gradient(90deg, transparent, rgba(220, 250, 255, .95), transparent); box-shadow: 0 0 3rem 1rem rgba(120, 220, 255, .55), 0 0 10rem 3rem rgba(255, 200, 80, .12); }
#beam.go { animation: beam 1.3s cubic-bezier(.45, 0, .55, 1); }
@keyframes beam { 0% { transform: translateX(-3vw); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(103vw); opacity: 0; } }

/* ------------------------------------------------------------------ 輕觸喚醒（眼睛由 WebGL 畫在後面） */
#gate { position: fixed; inset: 0; z-index: 30; cursor: pointer; display: grid; place-items: end center; padding-bottom: 12vh; transition: opacity .6s; }
#gate.gone { opacity: 0; pointer-events: none; }
.gwrap { text-align: center; }
#gate h1 { margin: 0; font: 900 5.6rem/1 var(--f-ui); letter-spacing: .45em; padding-left: .45em; color: #fff; text-shadow: 0 0 1.4rem rgba(0, 229, 255, .8), 0 0 4rem rgba(0, 229, 255, .45); }
#gate h1 span { display: block; font: 900 1.7rem var(--f-brand); letter-spacing: 1em; padding-left: 1em; color: var(--n-cyan); margin-top: 1.2rem; text-shadow: 0 0 1rem var(--n-cyan); }
#gate .gl { font: 600 1.45rem var(--f-mono); letter-spacing: .32em; color: var(--n-yel); margin-top: 3.2rem; text-shadow: 0 0 1rem var(--n-yel); animation: breathe 2.4s ease-in-out infinite; }
#gate .gs { font: 400 1.2rem var(--f-ui); color: var(--ink3); margin-top: 1rem; letter-spacing: .3em; }
@keyframes breathe { 50% { opacity: .35; } }
html.stack #gate { padding-bottom: 16vh; }
html.stack #gate h1 { font-size: 4.2rem; }

/* ------------------------------------------------------------------ 開機 */
#boot { position: fixed; inset: 0; z-index: 25; transition: opacity .7s; }
#boot.out { opacity: 0; pointer-events: none; }
#boot .bt1 { position: absolute; left: 0; right: 0; top: 80%; text-align: center; font: 900 4.2rem/1 var(--f-brand); letter-spacing: .62em; padding-left: .62em; color: #fff; text-shadow: 0 0 1.4rem var(--n-cyan), 0 0 4rem var(--n-cyan); }
#boot .bt1 small { display: block; font: 900 2rem var(--f-ui); letter-spacing: 1.4em; padding-left: 1.4em; color: var(--n-yel); text-shadow: 0 0 1.2rem var(--n-yel); margin-top: 1.1rem; }
#boot .blog { position: absolute; left: 3.2rem; top: 3rem; margin: 0; padding: 0; list-style: none; font: 400 1.2rem/1.75 var(--f-mono); color: var(--ink2); max-width: 64rem; }
#boot .blog li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: slidein .3s ease-out both; }
#boot .blog .okk { color: var(--ok); text-shadow: 0 0 .6rem var(--ok); } #boot .blog .bad { color: var(--bad); } #boot .blog .wr { color: var(--warn); }
#boot .bbar { position: absolute; left: 30%; right: 30%; top: 95%; height: 2px; background: rgba(255, 255, 255, .08); }
#boot .bbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--n-cyan), var(--n-yel)); box-shadow: 0 0 1rem var(--n-cyan); transition: width .4s; }
#boot .bskip { position: absolute; right: 3rem; bottom: 2.4rem; font: 400 1.05rem var(--f-mono); color: var(--ink3); letter-spacing: .2em; }
html.stack #boot .blog { left: 1.4rem; right: 1.4rem; top: 2rem; font-size: 1rem; }
html.stack #boot .bt1 { font-size: 2.6rem; letter-spacing: .3em; padding-left: .3em; top: 74%; }

/* ------------------------------------------------------------------ 今日戰報 */
#report { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(1, 3, 9, .6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fadein .6s; }
#report[hidden] { display: none; }
@keyframes fadein { from { opacity: 0; } }
.rcard { --c: var(--n-yel); width: 96rem; max-width: 94vw; padding: 2.8rem 3.2rem; border-radius: .5rem; border: 1px solid var(--c); background: linear-gradient(160deg, rgba(24, 22, 10, .95), rgba(4, 7, 15, .97) 45%); box-shadow: 0 0 5rem -1rem var(--c), inset 0 0 4rem -3rem var(--c); position: relative; animation: rise .8s cubic-bezier(.2, 1.2, .4, 1); }
@keyframes rise { from { transform: translateY(3rem) scale(.96); opacity: 0; filter: brightness(2); } }
.rcard h3 { margin: 0; font: 700 1.3rem var(--f-hd); letter-spacing: .5em; color: var(--c); }
.rcard h4 { margin: .6rem 0 2rem; font: 900 3.2rem var(--f-ui); letter-spacing: .1em; }
.rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6rem 2.4rem; }
.rgrid .rl { font: 400 1.1rem var(--f-ui); color: var(--ink3); }
.rgrid .rv2 { font: 600 3rem var(--f-mono); text-shadow: 0 0 1.4rem currentColor; }
.rgrid .rs2 { font: 500 1.3rem var(--f-mono); }
.rlines { margin-top: 2rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem 2.4rem; font: 400 1.25rem var(--f-ui); }
.rlines div { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px dashed var(--line); padding: .3rem 0; white-space: nowrap; }
.rnote { margin-top: 1.6rem; font: 400 1.05rem/1.6 var(--f-ui); color: var(--ink3); }
.rbtns { margin-top: 1.8rem; display: flex; gap: 1rem; }

/** 日 K 線（跟著收盤批次） */

/** 某一天的盤中快照：[{m（距 09:00 分鐘）, p, h, l, v（累積股數）, dv（這一輪新增）, a, b（五檔）, q}] */
function tapeSnaps(code, day) {
  const T = D.tape[code];
  if (!T) return [];
  const rec = [T.cur, T.prev].find((r) => r && r.d === day);
  if (!rec || !rec.reg) return [];
  const R = rec.reg, out = [];
  const base = ymdToMs(day, 9, 0) / 1000;
  let pv = 0;
  for (let i = 0; i < (R.z || []).length; i++) {
    const p = R.z[i] != null ? R.z[i] : R.pz && R.pz[i];
    if (!isNum(p)) continue;
    const q = (R.q && R.q[i]) || (R.t && R.t[i]);
    const m = (q - base) / 60;
    if (!isFinite(m) || m < -5 || m > SESSION_MIN + 10) continue;
    const v = R.v && R.v[i];
    out.push({ m: Math.max(0, m), p, h: R.h && R.h[i], l: R.l && R.l[i], v, dv: isNum(v) ? Math.max(0, v - pv) : 0, a: R.a && R.a[i], b: R.b && R.b[i], q });
    if (isNum(v)) pv = v;
  }
  out.sort((x, y) => x.m - y.m);
  return out;
}
function tapeRef(code, day) { const T = D.tape[code]; const rec = T && [T.cur, T.prev].find((r) => r && r.d === day); return rec && isNum(rec.y) ? rec.y : refClose(code, day); }

/** 開機：先版本檔，再其他（任何一份失敗都照實回報，不擋住其他份） */
async function initialLoad(report) {
  const v = await loadFile('version');
  report('version', v);
  D.link = v.ok && !v.offline ? 'ok' : 'down';
  const key = (n) => (D.version && D.version.files && D.version.files[n] ? 'v=' + encodeURIComponent(D.version.files[n]) : undefined);
  const names = ['summary', 'live', 'news', 'global', 'spark', 'cal', 'track'];
  const res = await Promise.all(names.map((n) => loadFile(n, key(n)).then((r) => { report(n, r); return r; })));
  D.lastPoll = Date.now();
  return res;
}

/** 每分鐘看一次版本檔：哪一份的時間戳變了，就只重抓那一份（和冷眼同一套做法） */
async function poll() {
  D.lastPoll = Date.now();
  D.polls++;
  const changed = [];
  let v;
  try {
    v = await fetchJSON('version.json', minuteKey(), { allowCache: false });
    D.version = v.js; D.got.version = Date.now(); D.offline.version = false;
    D.failStreak = 0; D.link = 'ok';
  } catch {
    D.failStreak++;
    D.link = D.failStreak >= 2 ? 'down' : 'slow';
    bus.emit('poll', { ok: false, changed });
    return changed;
  }
  const files = (D.version && D.version.files) || {};
  for (const name of Object.keys(STAMP)) {
    const want = files[name];
    if (!want || (want === stampOf(name) && !D.offline[name])) continue;
    const prevStamp = stampOf(name);
    const r = await loadFile(name, 'v=' + encodeURIComponent(want));
    if (r.ok) changed.push({ name, prevStamp, stamp: stampOf(name), prev: r.prev });
  }
  // 日曆與戰績跟著收盤批次走
  if (changed.some((c) => c.name === 'summary')) { await loadFile('cal'); await loadFile('track'); }
  bus.emit('poll', { ok: true, changed });
  return changed;
}

// ================================================================ 日曆與時段
function isTradingDay(ymd) {
  const wd = weekday(ymd);
  if (wd === 0 || wd === 6) return false;
  const c = D.cal || {};
  if (Array.isArray(c.holidays) && c.holidays.includes(ymd)) return false;
  if (Array.isArray(c.closed) && c.closed.includes(ymd)) return false;
  return true;
}
function prevTradingDay(ymd, inclusive = false) { let d = inclusive ? ymd : addDays(ymd, -1); for (let i = 0; i < 30 && !isTradingDay(d); i++) d = addDays(d, -1); return d; }
function nextTradingDay(ymd, inclusive = false) { let d = inclusive ? ymd : addDays(ymd, 1); for (let i = 0; i < 30 && !isTradingDay(d); i++) d = addDays(d, 1); return d; }

/** 現在的市場時段：pre 開盤前／open 盤中／post 收盤後／closed 休市日 */
function marketPhase() {
  const t = tw();
  const trading = isTradingDay(t.ymd);
  let phase = 'closed';
  if (trading) phase = t.hm < 900 ? 'pre' : t.hm < 1335 ? 'open' : 'post';
  const nextDay = trading && t.hm < 900 ? t.ymd : nextTradingDay(t.ymd);
  return { trading, phase, today: t.ymd, next: nextDay, nextMs: ymdToMs(nextDay, 9, 0), lastDay: trading && t.hm >= 900 ? t.ymd : prevTradingDay(t.ymd) };
}

function watchCodes() {

  list = (list || []).filter((c) => D.map[c]);
  if (list.length < 1) list = DEFAULTS.watch.filter((c) => D.map[c]);

/** 一檔的報價：盤中用冷眼的盤中行情，否則用官方收盤；漲跌一律對「前一個交易日的官方收盤」 */
function quote(code) {
  const e = D.map[code];
  const L = D.live && D.live.etfs && D.live.etfs[code];
  if (!e && !L) return null;
  let px = null, date = null, time = null, src = 'close', nav = null, prem = null;
  if (L && isNum(L[0]) && L[5] && (!e || L[5] >= e.d)) { px = L[0]; date = L[5]; time = L[3]; src = 'live'; nav = L[1]; prem = L[2]; }
  else if (e) { px = e.p; date = e.d; }
  const ref = refClose(code, date);
  const chg = isNum(px) && isNum(ref) ? px - ref : null;
  return { code, px, date, time, src, ref, chg, pct: isNum(chg) && ref ? chg / ref * 100 : null, nav, prem };
}
/** 只看官方收盤（收盤批次那一天） */
function quoteClose(code) {
  const e = D.map[code];
  if (!e) return null;

  return { code, px: e.p, date: e.d, src: 'close', ref, chg: e.ch, pct: e.pc };
}
/** 某一天的「前一個交易日收盤」：那一天比收盤批次新→批次的收盤就是昨收；同一天→收盤減漲跌 */
function refClose(code, day) {
  const e = D.map[code];
  if (!e || !isNum(e.p)) return null;

  if (day === e.d && isNum(e.ch)) return +(e.p - e.ch).toFixed(4);

/** 今天（spark.d 那天）的走勢點：[[分鐘, 價], …] */
function sparkOf(code) {

  if (!s) return [];
  const out = [];
  for (let i = 0; i + 1 < s.length; i += 2) out.push([s[i], s[i + 1]]);

}
/** 回放用：某一分鐘那時候的價格（只用那一分鐘以前已經發生的成交） */
function quoteAt(code, minute) {
  const pts = sparkOf(code);
  let px = null, m = null;
  for (const [mm, p] of pts) { if (mm <= minute) { px = p; m = mm; } else break; }
  const ref = refClose(code, D.spark && D.spark.d);
  const chg = isNum(px) && isNum(ref) ? px - ref : null;
  return { code, px, m, ref, chg, pct: isNum(chg) && ref ? chg / ref * 100 : null, src: 'replay' };

/** 加權指數：盤中用冷眼盤中行情裡的指數，否則官方收盤 */

// ================================================================ 新鮮度（每一份資料一個燈號）
function freshness(name) {
  const o = D[name];
  if (!o) return { level: 'bad', label: D.fail[name] ? '斷線' : '尚未取得', ms: NaN };
  const ph = marketPhase();
  let ms = parseTs(stampOf(name) || (name === 'cal' ? o.generated : null));
  let level = 'ok', label = '';
  const age = now() - ms;
  if (name === 'live') {
    if (ph.phase === 'open') level = age <= 12 * 60e3 ? 'ok' : age <= 30 * 60e3 ? 'warn' : 'bad';
    else level = (o.date || 0) >= ph.lastDay || age < 18 * 3600e3 ? 'ok' : 'warn';
  } else if (name === 'spark') {
    level = (o.d || 0) >= ph.lastDay ? 'ok' : ph.phase === 'pre' || ph.phase === 'closed' ? 'ok' : 'warn';
    if (ph.phase === 'open' && age > 30 * 60e3) level = 'warn';
  } else if (name === 'summary') {
    const t = tw();
    const expect = ph.trading && t.hm >= 1600 ? ph.today : prevTradingDay(ph.today);
    const asof = o.asof || 0;
    level = asof >= expect ? 'ok' : asof >= prevTradingDay(expect) ? 'warn' : 'bad';
    if (level !== 'ok') label = '收盤批次還沒更新';
  } else if (name === 'news') {
    level = age <= 6 * 3600e3 ? 'ok' : age <= 36 * 3600e3 ? 'warn' : 'bad';
  } else if (name === 'global') {
    level = age <= 30 * 3600e3 ? 'ok' : age <= 80 * 3600e3 ? 'warn' : 'bad';
  }
  if (!isFinite(age) || age > 2 * 86400e3 && name !== 'summary' && name !== 'spark' && !(ph.phase === 'closed' && age < 4 * 86400e3)) level = level === 'ok' ? 'warn' : level;
  if (D.offline[name]) { level = 'warn'; label = '離線：上次的資料'; }
  return { level, label, ms };
}

// ================================================================ 交叉核對（全部用看板手上的真資料當場算；rows＝每一檔／每一份的明細，畫成長條）
function verifyChecks() {
  const out = [];
  const codes = watchCodes();
  const sp = D.spark, L = D.live, S = D.summary;
  // 1. 盤中價：冷眼的兩條行情線（證交所 ETF 即時淨值檔、證交所整股行情）各自的最新價互相比對
  {
    let n = 0, okN = 0, worst = 0, worstC = null;
    const rows = [];
    if (L && L.etfs && sp && sp.s) {
      for (const c of codes) {
        const a = L.etfs[c], pts = sparkOf(c);
        if (!a || !isNum(a[0]) || !pts.length || a[5] !== sp.d) continue;
        const b = pts[pts.length - 1][1];
        const diff = Math.abs(a[0] - b) / b * 100;
        n++; if (diff <= 0.5) okN++;
        if (diff > worst) { worst = diff; worstC = c; }
        rows.push({ k: c, f: Math.min(1, diff / 0.5), v: diff.toFixed(2) + '%', bad: diff > 0.5 });
      }
    }
    out.push({ id: 'dual', title: '盤中價雙來源', org: 'TWSE 淨值檔 × 整股行情', rows,
      st: n === 0 ? 'wait' : okN === n ? 'pass' : 'warn',
      big: n ? `${okN}/${n}` : '—',
      detail: n === 0 ? '今天還沒有兩邊都有的盤中價' : okN === n ? `自選 ${n} 檔兩邊價格一致（差距 ≤ 0.5%）` : `${worstC} 兩邊差 ${worst.toFixed(2)}%（抓取時間不同），以官方收盤為準`,
    });
  }
  // 2. 收盤價對帳：證交所官方收盤 vs 當天整股行情最後一筆
  {
    let n = 0, okN = 0, bad = null;
    const rows = [];
    const same = S && sp && sp.d === S.asof;
    if (same) {
      for (const c of codes) {
        const e = D.map[c], pts = sparkOf(c);
        if (!e || !pts.length) continue;
        const last = pts[pts.length - 1][1];
        const d = Math.abs(last - e.p);

        rows.push({ k: c, f: d < 0.0051 ? 1 : 0.3, v: fmtPx(e.p), bad: d >= 0.0051 });
      }
    } else {
      for (const c of codes.slice(0, 3)) { const e = D.map[c]; if (e) rows.push({ k: c, f: 0, v: dateText(e.d), wait: true }); }
    }
    out.push({ id: 'close', title: '收盤價對帳', org: 'TWSE 每日收盤行情', rows,
      st: !same ? 'wait' : n === 0 ? 'wait' : okN === n ? 'pass' : 'warn',
      big: same && n ? `${okN}/${n}` : 'WAIT',
      detail: !same ? `官方收盤批次是 ${dateText(S && S.asof)}；${dateText(sp && sp.d)} 的收盤出來後（約 14:30 以後）自動對帳` : okN === n ? `自選 ${n} 檔官方收盤＝當天最後一筆成交` : bad,
    });
  }
  // 3. 折溢價重算：拿市價與投信預估淨值自己算一次，和冷眼給的數字比
  {
    let n = 0, okN = 0;
    const rows = [];
    if (L && L.etfs) {
      for (const c of codes) {
        const a = L.etfs[c];
        if (!a || !isNum(a[0]) || !isNum(a[1]) || !isNum(a[2]) || !a[1]) continue;
        const mine = (a[0] - a[1]) / a[1] * 100;
        const ok = Math.abs(mine - a[2]) <= 0.03;
        n++; if (ok) okN++;
        rows.push({ k: c, f: Math.min(1, Math.abs(a[2]) / 1.5), v: (a[2] >= 0 ? '+' : '') + a[2].toFixed(2) + '%', bad: !ok, sign: a[2] });
      }
    }
    out.push({ id: 'prem', title: '折溢價重算', org: 'SITCA 投信預估淨值', rows,
      st: n === 0 ? 'wait' : okN === n ? 'pass' : 'warn', big: n ? `${okN}/${n}` : '—',
      detail: n === 0 ? '還沒有盤中預估淨值' : okN === n ? `自選 ${n} 檔自己重算的折溢價與冷眼一致` : `有 ${n - okN} 檔重算結果對不上，以投信公告為準`,
    });
  }
  // 4. 加權指數：收盤批次的指數 vs 全球市場檔裡的指數（兩條管線各自讀證交所）
  {
    const m = S && S.market, g = D.global && D.global.tw && D.global.tw.taiex;
