/* 全知 OMNISCIENT — 樣式（設計稿 1920×1080，1rem＝10 設計像素，整個畫面跟著螢幕等比放大到 4K） */
:root {
  --bg0: #02050b; --bg1: #060c19; --ink: #e6efff; --ink2: #a9b8d6; --ink3: #6f7f9f; --line: rgba(130, 170, 255, .14);
  --c0: #46d4ff; --c1: #9b7bff; --c2: #ff4fd8; --c3: #ffbf3c; --c4: #cfe3ff;
  --up: #ff4d6d; --dn: #22e39a; --flat: #c7d0e2; --warn: #ffb02e; --bad: #ff4d4d; --ok: #3cf0b4;
  --f-disp: 'Orbitron', 'Chakra Petch', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --f-mono: 'Share Tech Mono', ui-monospace, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', monospace;
  --f-ui: 'Chakra Petch', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
}
html { font-size: calc(min(100vw / 192, 100vh / 108)); background: var(--bg0); }
html.stack { font-size: calc(min(100vw / 40, 11px)); }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-family: var(--f-ui); background: radial-gradient(120rem 70rem at 50% 30%, #0a1630 0%, #050a17 55%, var(--bg0) 100%) fixed; overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; }
html.stack body { overflow: auto; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
.mono { font-family: var(--f-mono); }
.up { color: var(--up); } .dn { color: var(--dn); } .flat { color: var(--flat); }

#bg, #fg { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
#bg { z-index: 0; }
#fg { z-index: 5; }
html.stack #bg, html.stack #fg { position: fixed; }

/* ------------------------------------------------------------------ 版面 */
#board { position: relative; z-index: 2; width: 100vw; height: 100vh; display: grid; grid-template-rows: 9.2rem 3.6rem minmax(0, 1fr) 24rem 3.6rem; gap: .9rem; padding: 1.1rem 1.6rem .8rem; opacity: 0; transition: opacity .6s; }
body.ready #board { opacity: 1; }
#cols { display: grid; grid-template-columns: 28rem 29rem minmax(0, 1fr) 37rem 45rem; column-gap: 3.2rem; min-height: 0; }
#stages { display: grid; grid-template-columns: 28rem 29rem minmax(0, 1fr) 37rem 45rem; column-gap: 3.2rem; }
#bottom { display: grid; grid-template-columns: 1.05fr 1fr 1.05fr; gap: 1.6rem; min-height: 0; }

.panel { position: relative; background: linear-gradient(180deg, rgba(13, 22, 44, .80), rgba(5, 10, 22, .86)); border: 1px solid var(--line); border-radius: .7rem; min-height: 0; overflow: hidden; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 1.4rem 3rem -1.6rem rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .04); }
.panel::before, .panel::after { content: ''; position: absolute; width: 1.4rem; height: 1.4rem; border: 2px solid var(--acc, var(--c0)); opacity: .55; pointer-events: none; }
.panel::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: .7rem; }
.panel::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: .7rem; }
.col { display: flex; flex-direction: column; --acc: var(--c0); }
#c1 { --acc: var(--c1); } #c2 { --acc: var(--c2); } #c3 { --acc: var(--c3); } #c4 { --acc: var(--c4); }
.ph { display: flex; align-items: baseline; gap: .8rem; padding: 1rem 1.2rem .8rem; border-bottom: 1px solid var(--line); flex: none; }
.ph .no { font-family: var(--f-mono); font-size: 1.15rem; color: var(--acc); letter-spacing: .1em; }
.ph h2 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: .06em; }
.ph .en { font-family: var(--f-disp); font-size: 1rem; letter-spacing: .25em; color: var(--ink3); }
.ph .meta { margin-left: auto; font-family: var(--f-mono); font-size: 1.1rem; color: var(--ink3); white-space: nowrap; }
.shd { display: none; padding: 1.1rem 1.2rem .2rem; font-size: 1.6rem; font-weight: 700; letter-spacing: .1em; color: var(--acc); }
.shd span { font-family: var(--f-disp); font-size: 1rem; letter-spacing: .3em; color: var(--ink3); margin-left: .8rem; font-weight: 400; }
.pb { flex: 1; min-height: 0; overflow: hidden; padding: .9rem 1rem 1rem; position: relative; }
.pb.scroll { overflow-y: auto; scrollbar-width: none; }
.pb.scroll::-webkit-scrollbar { display: none; }

/* 卡片被資料打到時的閃光 */
.card { position: relative; border-radius: .5rem; background: linear-gradient(90deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .012)); border: 1px solid rgba(255, 255, 255, .05); border-left: 2px solid var(--acc); transition: box-shadow .5s, border-color .5s, background .5s; }
.card.hit { animation: hit 1.1s ease-out; }
@keyframes hit { 0% { box-shadow: 0 0 0 1px var(--acc), 0 0 2.6rem -0.2rem var(--acc), inset 0 0 1.6rem -0.6rem var(--acc); background: linear-gradient(90deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .02)); } 100% { box-shadow: 0 0 0 0 transparent; } }
.stale { filter: grayscale(.85) brightness(.75); }
.chip { display: inline-flex; align-items: center; gap: .4rem; font-family: var(--f-mono); font-size: 1rem; padding: .15rem .6rem; border-radius: 99rem; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.idle { color: var(--ink3); }
.lamp { width: .8rem; height: .8rem; border-radius: 50%; background: var(--ink3); flex: none; box-shadow: 0 0 .6rem currentColor; }
.lamp.ok { background: var(--ok); color: var(--ok); } .lamp.warn, .lamp.old { background: var(--warn); color: var(--warn); } .lamp.err, .lamp.bad { background: var(--bad); color: var(--bad); animation: blink 1.2s infinite; } .lamp.idle { background: #3a4660; color: transparent; }
@keyframes blink { 50% { opacity: .35; } }

/* ------------------------------------------------------------------ 頂列 */
#top { display: grid; grid-template-columns: 34rem 40rem minmax(0, 1fr) 30rem; gap: 2rem; align-items: center; padding: 0 .4rem; }
.brand { display: flex; align-items: center; gap: 1.4rem; }
.eye { width: 7.4rem; height: 4.6rem; overflow: visible; filter: drop-shadow(0 0 .8rem rgba(70, 212, 255, .6)); }
.eye path { fill: none; stroke: var(--c0); stroke-width: 2.6; }
.eye circle { fill: none; stroke: var(--c3); stroke-width: 2.4; }
.eye .pupil { fill: #fff; stroke: none; filter: drop-shadow(0 0 4px #fff); animation: pupil 7s ease-in-out infinite; transform-origin: 32px 20px; }
@keyframes pupil { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 60% { transform: translateX(3px); } }
.bt b { font-size: 3.6rem; letter-spacing: .3em; font-weight: 800; background: linear-gradient(90deg, #fff, #9fe9ff 60%, #ffd36b); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 1rem rgba(120, 220, 255, .45)); }
.bt i { font-style: normal; font-family: var(--f-disp); font-weight: 900; font-size: 1.5rem; letter-spacing: .5em; color: var(--c0); margin-left: .4rem; }
.bt small { display: block; font-size: 1.15rem; color: var(--ink3); letter-spacing: .12em; margin-top: .2rem; }
.rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; }
.ring { position: relative; display: grid; place-items: center; }
.ring svg { width: 6.4rem; height: 6.4rem; transform: rotate(-90deg); }
.ring .trk { fill: none; stroke: rgba(255, 255, 255, .08); stroke-width: 5; }
.ring .val { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2, .8, .2, 1), stroke .6s; filter: drop-shadow(0 0 4px currentColor); }
.ring .rv { position: absolute; top: 2.1rem; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 1.6rem; }
.ring .rl { font-size: 1rem; color: var(--ink3); letter-spacing: .1em; margin-top: .3rem; white-space: nowrap; }
.stats { display: grid; grid-template-columns: 1.35fr 1fr 1.1fr 1fr; gap: 1.6rem; }
.stat { min-width: 0; }
.stat .sl { font-size: 1.1rem; color: var(--ink3); letter-spacing: .12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .sv { font-family: var(--f-mono); font-size: 3rem; line-height: 1.15; white-space: nowrap; }
.stat .ss { font-family: var(--f-mono); font-size: 1.2rem; white-space: nowrap; }
.stat .sm { font-size: 1rem; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode { text-align: right; }
.badge { display: inline-flex; align-items: center; gap: .8rem; font-family: var(--f-disp); font-weight: 700; letter-spacing: .2em; font-size: 1.4rem; padding: .5rem 1.2rem; border-radius: .4rem; border: 1px solid currentColor; }
.badge .dot { width: 1rem; height: 1rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 1rem currentColor; }
.badge.live { color: var(--up); } .badge.live .dot { animation: blink 1s infinite; }
.badge.replay { color: var(--c3); } .badge.closed { color: var(--ink2); } .badge.down { color: var(--bad); }
.clock { font-family: var(--f-mono); font-size: 3.2rem; letter-spacing: .06em; margin-top: .4rem; }
.clock small { font-size: 1.3rem; color: var(--ink3); margin-left: .6rem; }
.mode .age { font-size: 1.1rem; color: var(--ink3); }

/* 流程階段列 */
#stages .st { display: flex; align-items: center; gap: .8rem; padding: 0 1.2rem; border-radius: .5rem; border: 1px solid var(--line); border-left: 3px solid var(--acc); font-family: var(--f-mono); font-size: 1.2rem; color: var(--ink3); letter-spacing: .12em; background: linear-gradient(90deg, rgba(14, 24, 48, .85), rgba(6, 12, 26, .7)); transition: all .4s; position: relative; overflow: hidden; white-space: nowrap; }
#stages .st .sn { color: var(--acc); }
#stages .st b { color: var(--ink); font-family: var(--f-ui); font-size: 1.6rem; letter-spacing: .12em; }
#stages .st .se { font-family: var(--f-disp); font-size: .95rem; letter-spacing: .3em; }
#stages .st .pg { margin-left: auto; font-size: 1.1rem; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
#stages .st.on { color: var(--acc); border-color: var(--acc); box-shadow: 0 0 1.6rem -0.4rem var(--acc), inset 0 0 1.2rem -0.6rem var(--acc); }
#stages .st.on::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .12), transparent); animation: sweep 1.2s linear; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ------------------------------------------------------------------ 01 蒐集：官方來源 */
.src { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .3rem .8rem; padding: .62rem .9rem; margin-bottom: .55rem; cursor: pointer; }
.src .on2 { font-size: 1.05rem; color: var(--ink3); letter-spacing: .06em; }
.src .wt { font-size: 1.32rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src .tm { font-family: var(--f-mono); font-size: 1.1rem; color: var(--ink2); text-align: right; }
.src .tm small { display: block; color: var(--ink3); font-size: .95rem; }
.src .lamp { grid-row: span 2; }
.src.idle { opacity: .45; }
.src .bar { grid-column: 2 / 4; height: 2px; background: rgba(255, 255, 255, .06); border-radius: 2px; overflow: hidden; }
.src .bar i { display: block; height: 100%; background: var(--c0); box-shadow: 0 0 .6rem var(--c0); }

/* 02 查證 */
.chk { padding: .85rem 1rem; margin-bottom: .7rem; display: grid; grid-template-columns: 1fr auto; gap: .2rem .8rem; }
.chk .ct { font-size: 1.45rem; font-weight: 600; }
.chk .co { font-size: 1.02rem; color: var(--ink3); }
.chk .cb { grid-row: 1 / 3; grid-column: 2; text-align: right; font-family: var(--f-mono); font-size: 2.2rem; align-self: center; }
.chk .cd { grid-column: 1 / 3; font-size: 1.12rem; color: var(--ink2); line-height: 1.45; }
.chk .cs { font-family: var(--f-mono); font-size: 1rem; letter-spacing: .1em; }
.chk.pass .cb, .chk.pass .cs { color: var(--ok); } .chk.warn .cb, .chk.warn .cs { color: var(--warn); } .chk.fail .cb, .chk.fail .cs { color: var(--bad); } .chk.wait .cb, .chk.wait .cs { color: var(--ink3); }
.chk .scan { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(155, 123, 255, .28), transparent); transform: translateX(-100%); }
.chk.hit .scan { animation: sweep .9s ease-out; }

/* 03 過濾：新聞 */
.nstat { display: flex; gap: .6rem; padding: 0 0 .8rem; flex-wrap: wrap; }
.nstat .chip { font-size: 1.05rem; }
.k-off { color: var(--c0); } .k-fact { color: #dfe8ff; } .k-op { color: var(--warn); }
.news { padding: .7rem .9rem .75rem 1rem; margin-bottom: .6rem; display: grid; grid-template-columns: 1fr auto; gap: .3rem .8rem; cursor: pointer; }
.news .nt { font-size: 1.36rem; line-height: 1.42; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news .nm { font-family: var(--f-mono); font-size: 1.05rem; color: var(--ink3); display: flex; gap: .8rem; align-items: center; }
.news .stp { grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 1.15rem; font-weight: 700; letter-spacing: .12em; padding: .3rem .7rem; border: 2px solid currentColor; border-radius: .3rem; transform: rotate(-6deg); white-space: nowrap; }
.news.k-op { border-left-color: var(--warn); }
.news.k-off { border-left-color: var(--c0); }
.news.k-fact { border-left-color: #b9c8ea; }
.news mark { background: rgba(255, 176, 46, .2); color: var(--warn); border-bottom: 1px solid var(--warn); padding: 0 .1em; }
.news.new .stp { animation: stamp .55s cubic-bezier(.2, 1.6, .4, 1) both; }
.news.new { animation: slidein .5s ease-out both; }
@keyframes stamp { 0% { transform: rotate(-20deg) scale(2.6); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(-6deg) scale(1); } }
@keyframes slidein { from { transform: translateY(-1.2rem); opacity: 0; } to { transform: none; opacity: 1; } }
.empty { color: var(--ink3); font-size: 1.3rem; padding: 2rem 1rem; text-align: center; line-height: 1.6; }

/* 04 判斷：規則判官 */
.jh { display: flex; align-items: baseline; gap: 1rem; }
.jh .jc { font-family: var(--f-mono); font-size: 1.5rem; color: var(--c3); }
.jh .jn { font-size: 2.2rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jsub { font-size: 1.1rem; color: var(--ink3); margin: .2rem 0 1rem; }
.verdict { display: grid; grid-template-columns: 11rem 1fr; gap: 1.2rem; align-items: center; margin-bottom: 1.1rem; }
.dial { position: relative; width: 11rem; height: 11rem; }
.dial svg { width: 100%; height: 100%; }
.dial .dt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .dt b { font-size: 2.4rem; letter-spacing: .1em; }
.dial .dt span { font-family: var(--f-mono); font-size: 1.3rem; color: var(--ink2); }
.bull { color: var(--up); } .bear { color: var(--dn); } .neu { color: var(--flat); }
.vinfo .va { font-size: 1.55rem; font-weight: 600; line-height: 1.4; }
.vinfo .vm { font-size: 1.1rem; color: var(--ink2); margin-top: .5rem; line-height: 1.5; }
.vinfo .vm b { font-family: var(--f-mono); font-weight: 400; color: var(--ink); }
.comp { display: grid; grid-template-columns: 6.6rem 1fr 4.4rem; gap: .2rem .8rem; align-items: center; margin-bottom: .62rem; }
.comp .cn { font-size: 1.3rem; }
.comp .cn small { display: block; font-family: var(--f-mono); font-size: .95rem; color: var(--ink3); }
.comp .cbar { position: relative; height: 1.1rem; background: rgba(255, 255, 255, .05); border-radius: .2rem; }
.comp .cbar::before { content: ''; position: absolute; left: 50%; top: -.3rem; bottom: -.3rem; width: 1px; background: rgba(255, 255, 255, .35); }
.comp .cbar i { position: absolute; top: 0; bottom: 0; border-radius: .2rem; transition: all 1s cubic-bezier(.2, .8, .2, 1); }
.comp .cbar i.p { left: 50%; background: linear-gradient(90deg, rgba(255, 77, 109, .4), var(--up)); box-shadow: 0 0 .8rem var(--up); }
.comp .cbar i.n { right: 50%; background: linear-gradient(270deg, rgba(34, 227, 154, .4), var(--dn)); box-shadow: 0 0 .8rem var(--dn); }
.comp .cv { font-family: var(--f-mono); font-size: 1.2rem; text-align: right; }
.comp .ctx { grid-column: 1 / 4; font-size: 1.05rem; color: var(--ink3); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jfoot { font-size: 1.05rem; color: var(--ink3); line-height: 1.5; margin-top: .4rem; border-top: 1px dashed var(--line); padding-top: .7rem; }
.jfoot b { color: var(--ink2); font-weight: 600; font-family: var(--f-mono); }
.jdots { display: flex; gap: .5rem; }
.jdots i { width: .7rem; height: .7rem; border-radius: 50%; background: rgba(255, 255, 255, .15); }
.jdots i.on { background: var(--c3); box-shadow: 0 0 .6rem var(--c3); }

/* 05 結論：自選 */
.tiles { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: .9rem; height: 100%; }
.tile { padding: .9rem 1rem .8rem; display: flex; flex-direction: column; min-height: 0; cursor: pointer; }
.tile.focus { border-color: var(--c3); box-shadow: 0 0 0 1px var(--c3), 0 0 2rem -0.6rem var(--c3); }
.tile .tt { display: flex; align-items: baseline; gap: .6rem; }
.tile .tc { font-family: var(--f-mono); font-size: 1.3rem; color: var(--c4); }
.tile .tn { font-size: 1.25rem; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tile .tp { font-family: var(--f-mono); font-size: 3rem; line-height: 1.1; margin-top: .3rem; transition: color .3s; }
.tile .tp.na { font-size: 1.9rem; color: var(--ink3); padding: .6rem 0 .3rem; }
.tile .tp.flash-up { animation: fu .8s; } .tile .tp.flash-dn { animation: fd .8s; }
@keyframes fu { 0% { text-shadow: 0 0 1.6rem var(--up); } }
@keyframes fd { 0% { text-shadow: 0 0 1.6rem var(--dn); } }
.tile .tq { font-family: var(--f-mono); font-size: 1.3rem; display: flex; gap: 1rem; }
.tile svg.spk { width: 100%; flex: 1; min-height: 3rem; margin: .4rem 0; overflow: visible; }
.tile .tb2 { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.pill { font-size: 1.05rem; padding: .12rem .6rem; border-radius: .3rem; border: 1px solid currentColor; white-space: nowrap; }
.tile .src2 { margin-left: auto; font-family: var(--f-mono); font-size: .95rem; color: var(--ink3); }

/* ------------------------------------------------------------------ 下排 */
#bottom .panel { display: flex; flex-direction: column; --acc: var(--c0); }
#pAgents { --acc: var(--c2) !important; }
#pPulse { --acc: var(--c3) !important; }
.log { list-style: none; margin: 0; padding: 0; font-family: var(--f-mono); font-size: 1.18rem; line-height: 1.62; }
.log li { display: grid; grid-template-columns: 4.6rem 7.4rem 1fr; gap: .6rem; white-space: nowrap; overflow: hidden; animation: slidein .4s ease-out both; }
.log li .lt { color: var(--ink3); }
.log li .la { letter-spacing: .05em; }
.log li .lx { overflow: hidden; text-overflow: ellipsis; color: var(--ink2); font-family: var(--f-ui); }
.log li.hl .lx { color: var(--ink); }
.ag-owl { color: var(--c0); } .ag-libra { color: var(--c1); } .ag-medusa { color: var(--c2); } .ag-judge { color: var(--c3); } .ag-core { color: var(--c4); }
.mesh { position: absolute; inset: 0; }
.mesh svg { width: 100%; height: 100%; }
.anode { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 13rem; }
.anode .ai { width: 5.4rem; height: 5.4rem; margin: 0 auto .4rem; border-radius: 1.2rem; display: grid; place-items: center; border: 1px solid currentColor; background: radial-gradient(circle, rgba(255, 255, 255, .08), rgba(0, 0, 0, .2)); box-shadow: 0 0 1.8rem -0.6rem currentColor, inset 0 0 1.2rem -0.6rem currentColor; transition: transform .3s; }
.anode.hit .ai { animation: pop .6s; }
@keyframes pop { 30% { transform: scale(1.18); box-shadow: 0 0 3rem currentColor; } }
.anode .ai svg { width: 3.2rem; height: 3.2rem; fill: none; stroke: currentColor; stroke-width: 1.6; }
.anode b { display: block; font-family: var(--f-disp); font-size: 1.1rem; letter-spacing: .2em; }
.anode span { display: block; font-size: 1.05rem; color: var(--ink2); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pulse { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: .8rem 1.2rem; height: 100%; }
.pchart { min-width: 0; display: flex; flex-direction: column; }
.pchart .pl { font-size: 1.1rem; color: var(--ink3); display: flex; justify-content: space-between; gap: .6rem; white-space: nowrap; }
.pchart .pl b { color: var(--ink2); font-weight: 600; }
.pchart svg { flex: 1; width: 100%; min-height: 0; overflow: visible; }
.insti { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.ib .il { font-size: 1.05rem; color: var(--ink3); }
.ib .iv { font-family: var(--f-mono); font-size: 1.55rem; }
.ib .ibar { height: .5rem; background: rgba(255, 255, 255, .06); border-radius: .3rem; position: relative; margin-top: .3rem; }
.ib .ibar i { position: absolute; top: 0; bottom: 0; border-radius: .3rem; }
.glob { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; }
.gq { font-size: 1.02rem; color: var(--ink3); white-space: nowrap; overflow: hidden; }
.gq b { display: block; font-family: var(--f-mono); font-size: 1.3rem; font-weight: 400; }

/* ------------------------------------------------------------------ 底列：回放控制 */
#foot { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1.6rem; align-items: center; }
.rp { display: flex; align-items: center; gap: 1rem; min-width: 0; }
.rp .rb { width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 1px solid var(--c3); color: var(--c3); display: grid; place-items: center; flex: none; }
.rp .rb svg { width: 1.4rem; height: 1.4rem; fill: currentColor; }
.rp .rs { font-family: var(--f-mono); font-size: 1.2rem; padding: .3rem .8rem; border: 1px solid var(--line); border-radius: .3rem; color: var(--ink2); flex: none; }
.rp .rl2 { font-family: var(--f-mono); font-size: 1.3rem; color: var(--c3); white-space: nowrap; flex: none; min-width: 15rem; }
.scrub { position: relative; flex: 1; height: 2.6rem; cursor: pointer; min-width: 10rem; }
.scrub .sk { position: absolute; left: 0; right: 0; top: 1.2rem; height: .3rem; background: rgba(255, 255, 255, .1); border-radius: .2rem; }
.scrub .sf { position: absolute; left: 0; top: 1.2rem; height: .3rem; background: linear-gradient(90deg, var(--c0), var(--c3)); border-radius: .2rem; box-shadow: 0 0 .8rem var(--c3); }
.scrub .sh { position: absolute; top: .75rem; width: 1.2rem; height: 1.2rem; margin-left: -.6rem; border-radius: 50%; background: #fff; box-shadow: 0 0 1rem var(--c3); }
.scrub .mk { position: absolute; top: .55rem; width: 2px; height: .55rem; margin-left: -1px; background: var(--c2); opacity: .8; }
.scrub .mk.op { background: var(--warn); }
.scrub .tk { position: absolute; top: 1.7rem; font-family: var(--f-mono); font-size: .9rem; color: var(--ink3); transform: translateX(-50%); }
.rp .golive { font-family: var(--f-mono); font-size: 1.2rem; color: var(--up); border: 1px solid var(--up); padding: .3rem .9rem; border-radius: .3rem; white-space: nowrap; }
.fnote { font-size: 1.02rem; color: var(--ink3); max-width: 62rem; line-height: 1.4; text-align: right; }
.tools { display: flex; gap: .8rem; }
.tb { width: 3.2rem; height: 3.2rem; border-radius: .6rem; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink2); background: rgba(10, 18, 36, .7); }
.tb:hover { color: #fff; border-color: var(--c0); }
.tb svg { width: 1.8rem; height: 1.8rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.tb.off { color: var(--ink3); } .tb.off .w { display: none; }

/* ------------------------------------------------------------------ 掃描光束 */
#beam { position: fixed; top: 0; bottom: 0; left: 0; width: 1.4rem; z-index: 6; pointer-events: none; opacity: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .9), transparent); box-shadow: 0 0 4rem 1.4rem rgba(140, 220, 255, .55), 0 0 12rem 4rem rgba(255, 191, 60, .18); }
#beam.go { animation: beam 1.3s cubic-bezier(.5, 0, .5, 1); }
@keyframes beam { 0% { transform: translateX(-4rem); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(calc(100vw + 4rem)); opacity: 0; } }

/* ------------------------------------------------------------------ 開機前：輕觸喚醒 */
#gate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: radial-gradient(60rem 40rem at 50% 45%, #0b1838 0%, #03060d 70%); cursor: pointer; transition: opacity .5s; }
#gate.gone { opacity: 0; pointer-events: none; }
html.stack #gate .gwrap { transform: scale(1.2); }
.gwrap { text-align: center; }
.geye { width: 26rem; height: 15.6rem; overflow: visible; filter: drop-shadow(0 0 2rem rgba(70, 212, 255, .5)); animation: breathe 3.4s ease-in-out infinite; }
.geye path { fill: none; stroke: var(--c0); stroke-width: 3; }
.geye circle { fill: none; stroke: var(--c3); stroke-width: 3; }
.geye .gp { fill: #fff; stroke: none; }
@keyframes breathe { 50% { filter: drop-shadow(0 0 4rem rgba(70, 212, 255, .85)); transform: scale(1.03); } }
#gate h1 { margin: 2rem 0 0; font-size: 6rem; letter-spacing: .4em; font-weight: 800; padding-left: .4em; background: linear-gradient(90deg, #fff, #9fe9ff 60%, #ffd36b); -webkit-background-clip: text; background-clip: text; color: transparent; }
#gate h1 span { display: block; font-family: var(--f-disp); font-size: 1.8rem; letter-spacing: .9em; color: var(--c0); -webkit-text-fill-color: var(--c0); margin-top: .6rem; }
#gate .gl { font-family: var(--f-mono); font-size: 1.6rem; letter-spacing: .3em; color: var(--c3); margin-top: 4rem; animation: blink 1.8s infinite; }
#gate .gs { font-size: 1.3rem; color: var(--ink3); margin-top: 1.2rem; letter-spacing: .15em; }

/* ------------------------------------------------------------------ 開機動畫 */
#boot { position: fixed; inset: 0; z-index: 25; background: #01030a; transition: opacity .8s; }
#boot.out { opacity: 0; pointer-events: none; }
#bootcv { position: absolute; inset: 0; width: 100%; height: 100%; }
#boot .bt1 { position: absolute; left: 0; right: 0; top: 66%; text-align: center; font-family: var(--f-disp); font-weight: 900; font-size: 4.6rem; letter-spacing: .6em; padding-left: .6em; color: #fff; text-shadow: 0 0 2rem var(--c0), 0 0 6rem var(--c0); }
#boot .bt1 small { display: block; font-family: var(--f-ui); font-size: 2.2rem; letter-spacing: 1.2em; color: var(--c3); text-shadow: 0 0 1.4rem var(--c3); margin-top: 1rem; font-weight: 700; }
#boot .blog { position: absolute; left: 4rem; bottom: 4rem; margin: 0; padding: 0; list-style: none; font-family: var(--f-mono); font-size: 1.45rem; line-height: 1.75; color: var(--ink2); max-width: 70rem; }
#boot .blog li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#boot .blog li .okk { color: var(--ok); } #boot .blog li .bad { color: var(--bad); } #boot .blog li .wr { color: var(--warn); }
#boot .bskip { position: absolute; right: 4rem; bottom: 4rem; font-family: var(--f-mono); font-size: 1.2rem; color: var(--ink3); letter-spacing: .2em; }
html.stack #boot .blog { left: 1.6rem; right: 1.6rem; bottom: 5rem; font-size: 1.05rem; line-height: 1.6; }
html.stack #boot .bt1 { font-size: 2.6rem; letter-spacing: .32em; padding-left: .32em; top: 57%; }
html.stack #boot .bt1 small { font-size: 1.6rem; letter-spacing: .8em; }
html.stack #boot .bskip { right: 1.6rem; bottom: 2rem; }

/* ------------------------------------------------------------------ 今日戰報 */
#report { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(2, 5, 12, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fadein .6s; }
#report[hidden] { display: none; }
@keyframes fadein { from { opacity: 0; } }
.rcard { width: 92rem; max-width: 94vw; padding: 3rem 3.4rem; border-radius: 1.2rem; border: 1px solid rgba(255, 191, 60, .4); background: linear-gradient(160deg, rgba(20, 26, 50, .96), rgba(6, 10, 22, .97)); box-shadow: 0 0 6rem -1rem rgba(255, 191, 60, .35); position: relative; animation: rise .7s cubic-bezier(.2, 1.2, .4, 1); }
@keyframes rise { from { transform: translateY(3rem) scale(.96); opacity: 0; } }
.rcard h3 { margin: 0; font-family: var(--f-disp); font-size: 1.4rem; letter-spacing: .5em; color: var(--c3); }
.rcard h4 { margin: .6rem 0 2rem; font-size: 3.2rem; letter-spacing: .1em; }
.rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6rem 2.4rem; }
.rgrid .rl { font-size: 1.15rem; color: var(--ink3); }
.rgrid .rv2 { font-family: var(--f-mono); font-size: 2.8rem; }
.rgrid .rs2 { font-family: var(--f-mono); font-size: 1.3rem; }
.rlines { margin-top: 2rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem 2.4rem; font-size: 1.3rem; }
.rlines div { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px dashed var(--line); padding: .3rem 0; white-space: nowrap; }
.rnote { margin-top: 1.8rem; font-size: 1.1rem; color: var(--ink3); line-height: 1.6; }
.rbtns { margin-top: 2rem; display: flex; gap: 1rem; }
.btn { font-size: 1.35rem; padding: .8rem 1.8rem; border-radius: .5rem; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); }
.btn.pri { border-color: var(--c3); color: var(--c3); }
.rcount { position: absolute; right: 3rem; top: 3rem; font-family: var(--f-mono); font-size: 1.1rem; color: var(--ink3); }

/* ------------------------------------------------------------------ 設定 */
#drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 46rem; max-width: 100vw; z-index: 22; background: linear-gradient(180deg, #0b1430, #050a17); border-left: 1px solid var(--line); box-shadow: -2rem 0 6rem rgba(0, 0, 0, .6); padding: 2.4rem 2.4rem 4rem; overflow-y: auto; animation: slide .35s ease-out; user-select: text; }
#drawer[hidden] { display: none; }
@keyframes slide { from { transform: translateX(100%); } }
html.stack #drawer { width: 100vw; }
#drawer h3 { margin: 0 0 1.6rem; font-size: 2.2rem; letter-spacing: .2em; display: flex; align-items: center; }
#drawer h3 button { margin-left: auto; font-size: 2.4rem; color: var(--ink3); width: 3.6rem; height: 3.6rem; }
.sg { margin-bottom: 2.2rem; }
.sg > label, .sg .sgt { display: block; font-size: 1.15rem; color: var(--ink3); letter-spacing: .15em; margin-bottom: .8rem; }
.seg { display: flex; gap: .5rem; flex-wrap: wrap; }
.seg button { font-size: 1.3rem; padding: .6rem 1.2rem; border-radius: .4rem; border: 1px solid var(--line); color: var(--ink2); }
.seg button.on { color: var(--c0); border-color: var(--c0); background: rgba(70, 212, 255, .08); }
.sg input[type=text] { width: 100%; font: inherit; font-family: var(--f-mono); font-size: 1.4rem; padding: .8rem 1rem; color: var(--ink); background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: .4rem; }
.sg input[type=range] { width: 100%; accent-color: var(--c0); }
.sg p { font-size: 1.15rem; color: var(--ink3); line-height: 1.6; margin: .6rem 0 0; }
.rulebox { font-size: 1.2rem; line-height: 1.7; color: var(--ink2); border: 1px solid var(--line); border-radius: .6rem; padding: 1.2rem 1.4rem; background: rgba(255, 255, 255, .02); }

/* ---- data.js ---- */
/* 全知 OMNISCIENT — 資料：只讀冷眼公開的資料檔，不自己另外抓、不補、不猜 */

// 冷眼的資料都在同一個網域（pzwei0105.github.io/coldeye-etf/data/）；本機測試可用 ?data= 指到別的地方
const DATA_BASE = (() => {
  const q = QS.get('data');

/** 每一份資料自己帶的時間戳（和冷眼的 version.json 用同一個欄位） */

async function fetchJSON(path, key, { allowCache = true } = {}) {

/** 現在的市場時段：pre 開盤前／open 盤中／post 收盤後／closed 休市日 */
function marketPhase() {
  const t = tw();
  const trading = isTradingDay(t.ymd);
  let phase = 'closed';
  if (trading) phase = t.hm < 900 ? 'pre' : t.hm < 1335 ? 'open' : 'post';
  const nextDay = trading && t.hm < 900 ? t.ymd : nextTradingDay(t.ymd);
  return { trading, phase, today: t.ymd, next: nextDay, nextMs: ymdToMs(nextDay, 9, 0), lastDay: trading && t.hm >= 900 ? t.ymd : prevTradingDay(t.ymd) };
}

function quote(code) {

/** 某一天的「前一個交易日收盤」：那一天比收盤批次新→批次的收盤就是昨收；同一天→收盤減漲跌 */
function refClose(code, day) {

function freshness(name) {
  const o = D[name];
  if (!o) return { level: 'bad', label: D.fail[name] ? '斷線' : '尚未取得', ms: NaN };
  const ph = marketPhase();
  let ms = parseTs(stampOf(name) || (name === 'cal' ? o.generated : null));
  let level = 'ok', label = '';
  const age = now() - ms;
  if (name === 'live') {
    if (ph.phase === 'open') level = age <= 12 * 60e3 ? 'ok' : age <= 30 * 60e3 ? 'warn' : 'bad';
    else level = (o.date || 0) >= ph.lastDay || age < 18 * 3600e3 ? 'ok' : 'warn';
  } else if (name === 'spark') {
    level = (o.d || 0) >= ph.lastDay ? 'ok' : ph.phase === 'pre' || ph.phase === 'closed' ? 'ok' : 'warn';
    if (ph.phase === 'open' && age > 30 * 60e3) level = 'warn';
  } else if (name === 'summary') {
    const t = tw();
    const expect = ph.trading && t.hm >= 1600 ? ph.today : prevTradingDay(ph.today);
    const asof = o.asof || 0;
    level = asof >= expect ? 'ok' : asof >= prevTradingDay(expect) ? 'warn' : 'bad';
    if (level !== 'ok') label = '收盤批次還沒更新';
  } else if (name === 'news') {
    level = age <= 6 * 3600e3 ? 'ok' : age <= 36 * 3600e3 ? 'warn' : 'bad';
  } else if (name === 'global') {
    level = age <= 30 * 3600e3 ? 'ok' : age <= 80 * 3600e3 ? 'warn' : 'bad';
  }
  if (!isFinite(age) || age > 2 * 86400e3 && name !== 'summary' && name !== 'spark' && !(ph.phase === 'closed' && age < 4 * 86400e3)) level = level === 'ok' ? 'warn' : level;
  if (D.offline[name]) { level = 'warn'; label = '離線：上次的資料'; }
  return { level, label, ms };
}

    });

const SFX = {

    comp.threshold.value = -16; comp.ratio.value = 4;
    comp.connect(c.destination);
    this.master = c.createGain();
    this.master.gain.value = settings.sound ? settings.vol : 0;
    this.master.connect(comp);
    // 簡單的空間感：回授延遲＋低通

  },
  get on() { return !!(this.ctx && settings.sound); },
  setVolume() {
    if (!this.master) return;
    this.master.gain.setTargetAtTime(settings.sound ? settings.vol : 0, this.ctx.currentTime, 0.05);
    if (this.padNodes) this.padNodes.g.gain.setTargetAtTime(settings.sound && settings.ambient ? 0.05 : 0, this.ctx.currentTime, 0.4);
  },
  /** 同一種聲音太密就略過（例如一大串資料封包同時到） */
  gate(k, ms) { const t = performance.now(); if (this.last[k] && t - this.last[k] < ms) return false; this.last[k] = t; return true; },

  tone({ f = 440, f2 = null, type = 'sine', dur = 0.2, gain = 0.2, at = 0, attack = 0.005, wet = 0.4, pan = 0 } = {}) {

  noise({ dur = 0.3, gain = 0.15, f = 1200, f2 = null, q = 1, type = 'bandpass', at = 0, wet = 0.3 } = {}) {
    if (!this.on) return;

    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const bq = c.createBiquadFilter(); bq.type = type; bq.Q.value = q; bq.frequency.setValueAtTime(f, t);
    if (f2) bq.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.04, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bq); bq.connect(g); g.connect(this.master);
    if (wet) { const w = c.createGain(); w.gain.value = wet; g.connect(w); w.connect(this.wet); }
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },

  // ---------------------------------------------------------------- 音色
  tick(col = 0) { if (!this.gate('tick', 70)) return; this.tone({ f: 1900 + col * 140, type: 'sine', dur: 0.05, gain: 0.035, wet: 0.15, pan: (col - 2) * 0.3 }); },
  blip(col = 0) {
    if (!this.gate('blip' + col, 90)) return;
    const base = [523.25, 587.33, 659.25, 783.99, 880][col % 5];
    this.tone({ f: base * 2, type: 'triangle', dur: 0.16, gain: 0.07, pan: (col - 2) * 0.35 });
    this.tone({ f: base * 3, type: 'sine', dur: 0.1, gain: 0.03, at: 0.03, pan: (col - 2) * 0.35 });
  },
  light(i = 0) { this.tone({ f: 330 * Math.pow(2, (i % 8) / 6), f2: 660 * Math.pow(2, (i % 8) / 6), type: 'sine', dur: 0.22, gain: 0.06, wet: 0.5 }); },
  stamp(kind) {
    if (!this.gate('stamp', 140)) return;
    this.tone({ f: kind === 'opinion' ? 150 : 110, f2: 55, type: 'sine', dur: 0.18, gain: 0.22, wet: 0.1 });
    this.noise({ dur: 0.08, gain: 0.08, f: 2400, q: 0.8 });
    if (kind === 'opinion') this.tone({ f: 740, type: 'square', dur: 0.08, gain: 0.025, at: 0.06 });
    if (kind === 'official') this.tone({ f: 1318.5, type: 'sine', dur: 0.3, gain: 0.04, at: 0.05 });
  },
  chime(dir = 1) {
    const maj = [523.25, 659.25, 783.99, 1046.5], min = [440, 523.25, 659.25, 880];
    (dir >= 0 ? maj : min).forEach((f, i) => this.tone({ f, type: 'triangle', dur: 0.9, gain: 0.07, at: i * 0.09, wet: 0.6 }));
  },
  beam() { if (!this.gate('beam', 600)) return; this.noise({ dur: 1.1, gain: 0.07, f: 300, f2: 4200, q: 3, wet: 0.5 }); this.tone({ f: 90, f2: 180, type: 'sine', dur: 0.9, gain: 0.08 }); },
  alert() { if (!this.gate('alert', 800)) return; this.tone({ f: 880, type: 'square', dur: 0.09, gain: 0.03 }); this.tone({ f: 660, type: 'square', dur: 0.12, gain: 0.03, at: 0.12 }); },
  hover() { if (!this.gate('hover', 60)) return; this.tone({ f: 2600, type: 'sine', dur: 0.03, gain: 0.015, wet: 0 }); },
  click() { this.tone({ f: 1200, f2: 800, type: 'triangle', dur: 0.07, gain: 0.05, wet: 0.1 }); },
  /** 開機：低頻嗡鳴慢慢升起 */
  bootDrone() {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 2.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 5.6);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(120, t); lp.frequency.exponentialRampToValueAtTime(2400, t + 4.6); lp.Q.value = 6;
    lp.connect(g); g.connect(this.master);
    const w = c.createGain(); w.gain.value = 0.5; g.connect(w); w.connect(this.wet);
    [55, 55.4, 82.4, 110.2].forEach((f, i) => { const o = c.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 2, t + 5); o.connect(lp); o.start(t); o.stop(t + 5.8); });
  },
  /** 眼睛睜開那一下 */
  awaken() {
    this.tone({ f: 55, f2: 38, type: 'sine', dur: 1.6, gain: 0.35, wet: 0.2 });
    this.noise({ dur: 1.4, gain: 0.12, f: 6000, f2: 200, q: 0.7, type: 'lowpass', wet: 0.6 });
    [261.63, 392, 523.25, 783.99, 1046.5].forEach((f, i) => this.tone({ f, type: 'sine', dur: 2.2, gain: 0.05, at: 0.05 + i * 0.05, wet: 0.8 }));
  },
  typeKey() { if (!this.gate('key', 35)) return; this.noise({ dur: 0.025, gain: 0.04, f: 3800 + Math.random() * 1500, q: 2, wet: 0 }); },

  /** 環境底噪：和弦跟著大盤方向（漲＝大調、跌＝小調、平＝懸掛），音量很小 */
  pad(mood = 0) {
    if (!this.ctx) return;
    this.mood = mood;
    const c = this.ctx, t = c.currentTime;
    const chords = { 1: [130.81, 196, 246.94, 329.63], '-1': [110, 164.81, 196, 261.63], 0: [123.47, 185, 246.94, 277.18] };
    const fs = chords[mood > 0 ? 1 : mood < 0 ? -1 : 0];
    if (!this.padNodes) {
      const g = c.createGain(); g.gain.value = 0.0001;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 0.7;
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 280; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
      lp.connect(g); g.connect(this.master);
      const w = c.createGain(); w.gain.value = 0.6; g.connect(w); w.connect(this.wet);
      const oscs = fs.map((f, i) => { const o = c.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = f; o.detune.value = (i - 1.5) * 4; o.connect(lp); o.start(); return o; });
      this.padNodes = { g, oscs };
    } else {
      this.padNodes.oscs.forEach((o, i) => o.frequency.setTargetAtTime(fs[i], t, 1.5));
    }
    this.padNodes.g.gain.setTargetAtTime(settings.sound && settings.ambient ? 0.05 : 0, t, 1.2);
  },
};

        + (showPts.length > 1 ? `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 3px ${col})"/>` : '')

/* ---- fx.js ---- */
/* 全知 OMNISCIENT — 特效：資料流線、封包、水母代理人、開機的眼睛
   規則：光點（封包）只在「真的有事件」時才發射——資料進來、核對完成、新聞蓋章、回放走到那一刻。
   背景線條只是很淡的底紋，不代表任何數字。 */

const FX = {
  bg: null, fg: null, b: null, f: null, dpr: 1, W: 0, H: 0,
  links: [], packets: [], jellies: [], layer: null, sprites: {},
  t: 0, last: 0, running: false, layoutDirty: true, stack: false,

  init() {
    this.bg = $('#bg'); this.fg = $('#fg');
    this.b = this.bg.getContext('2d'); this.f = this.fg.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => { this.resize(); this.layoutDirty = true; });
    this.jellies = AGENTS.map((a, i) => new Jelly(a, i));
  },
  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, settings.fx === 'low' ? 1 : 1.5);
    this.W = innerWidth; this.H = innerHeight;
    for (const c of [this.bg, this.fg]) { c.width = Math.round(this.W * this.dpr); c.height = Math.round(this.H * this.dpr); }
    this.b.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.f.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.stack = document.documentElement.classList.contains('stack');
    this.layer = null;
  },
  rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 10; },

  /** 光暈貼圖（避免每格用 shadowBlur） */
  sprite(color, size = 64) {
    const k = color + size;
    if (this.sprites[k]) return this.sprites[k];
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, color); g.addColorStop(0.45, hexA(color, 0.35)); g.addColorStop(1, hexA(color, 0));
    x.fillStyle = g; x.fillRect(0, 0, size, size);
    return (this.sprites[k] = c);
  },

  // ---------------------------------------------------------------- 底紋：欄與欄之間交織的線
  colCards(i) {
    const sel = ['#b0 .src', '#b1 .chk', '#b2 .news', '#b3 .comp, #b3 .verdict', '#b4 .tile'][i];
    const box = $('#c' + i);
    if (!box) return [];
    const br = box.getBoundingClientRect();
    return $$(sel).map((e) => e.getBoundingClientRect()).filter((r) => r.height > 0 && r.top >= br.top - 2 && r.bottom <= br.bottom + 2);
  },
  computeLinks() {
    this.links = [];
    this.layoutDirty = false;
    this.layer = null;
    if (this.stack) return;
    const cols = [0, 1, 2, 3, 4].map((i) => this.colCards(i));
    const pal = ['#46d4ff', '#9b7bff', '#ff4fd8', '#ffbf3c', '#cfe3ff'];
    const pair = (a, b, per) => {
      const L = cols[a], R = cols[b];
      if (!L.length || !R.length) return;
      L.forEach((l, i) => {
        const j0 = Math.floor(i * R.length / L.length);
        for (let k = 0; k < per; k++) {
          const j = (j0 + k * Math.max(1, Math.round(R.length / 3))) % R.length;
          const r = R[j];
          const y0 = l.top + l.height * (0.35 + 0.3 * ((i * 7 + k * 3) % 5) / 4), y1 = r.top + r.height * (0.3 + 0.4 * ((j * 5 + k) % 4) / 3);
          this.links.push({ a, b, x0: l.right, y0, x1: r.left, y1, c0: pal[a], c1: pal[b], ph: Math.random() });
        }
      });
    };
    pair(0, 1, 2); pair(1, 2, 2); pair(2, 3, 2); pair(3, 4, 2); pair(1, 3, 1);
  },
  bez(L, t) {
    const dx = (L.x1 - L.x0) * 0.5;
    const p0x = L.x0, p0y = L.y0, p1x = L.x0 + dx, p1y = L.y0, p2x = L.x1 - dx, p2y = L.y1, p3x = L.x1, p3y = L.y1;
    const u = 1 - t;
    return [u * u * u * p0x + 3 * u * u * t * p1x + 3 * u * t * t * p2x + t * t * t * p3x, u * u * u * p0y + 3 * u * u * t * p1y + 3 * u * t * t * p2y + t * t * t * p3y];
  },
  drawLayer() {
    const c = document.createElement('canvas'); c.width = this.bg.width; c.height = this.bg.height;
    const x = c.getContext('2d'); x.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    // 細格線
    const r = this.rem();
    x.strokeStyle = 'rgba(110,150,230,.045)'; x.lineWidth = 1;
    for (let gx = 0; gx < this.W; gx += r * 4) { x.beginPath(); x.moveTo(gx + .5, 0); x.lineTo(gx + .5, this.H); x.stroke(); }
    for (let gy = 0; gy < this.H; gy += r * 4) { x.beginPath(); x.moveTo(0, gy + .5); x.lineTo(this.W, gy + .5); x.stroke(); }
    // 欄與欄之間的線
    for (const L of this.links) {
      const g = x.createLinearGradient(L.x0, 0, L.x1, 0);
      g.addColorStop(0, hexA(L.c0, 0.45)); g.addColorStop(1, hexA(L.c1, 0.45));
      x.strokeStyle = g; x.lineWidth = 1.1;
      const dx = (L.x1 - L.x0) * 0.5;
      x.beginPath(); x.moveTo(L.x0, L.y0); x.bezierCurveTo(L.x0 + dx, L.y0, L.x1 - dx, L.y1, L.x1, L.y1); x.stroke();
      x.fillStyle = hexA(L.c0, 0.9); x.beginPath(); x.arc(L.x0, L.y0, 1.6, 0, 6.3); x.fill();
      x.fillStyle = hexA(L.c1, 0.9); x.beginPath(); x.arc(L.x1, L.y1, 1.6, 0, 6.3); x.fill();
    }
    this.layer = c;
  },

  // ---------------------------------------------------------------- 封包（真的事件才發）
  /** 從 a 元素送一顆光點到 b 元素（都可以是 null；null 就略過這一段） */
  send(a, b, color, { dur = 900, size = 1, onArrive } = {}) {
    if (!a || !b || this.stack || settings.fx === 'low' && this.packets.length > 12) { if (onArrive) onArrive(); return; }
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    if (!ra.height || !rb.height) { if (onArrive) onArrive(); return; }
    const fwd = rb.left >= ra.right - 4;
    const L = fwd
      ? { x0: ra.right, y0: ra.top + ra.height * (0.3 + Math.random() * 0.4), x1: rb.left, y1: rb.top + rb.height * (0.3 + Math.random() * 0.4) }
      : { x0: ra.left + ra.width / 2, y0: ra.top + ra.height / 2, x1: rb.left + rb.width / 2, y1: rb.top + rb.height / 2 };
    this.packets.push({ L, t: 0, dur: dur * (0.85 + Math.random() * 0.3), color, size, onArrive, trail: [] });
  },
  /** 一串元素依序傳下去：每到一站那一站就閃一下 */
  chain(els, color, opts = {}) {
    const list = els.filter(Boolean);
    const step = (i) => {
      if (i >= list.length - 1) { if (opts.done) opts.done(); return; }
      this.send(list[i], list[i + 1], color, {
        dur: opts.dur || 850, size: opts.size || 1,
        onArrive: () => {
          const n = list[i + 1];
          UI.hit(n.closest('.card') || n);
          const col = n.closest('[data-col]');
          if (col) { UI.stage(+col.dataset.col); SFX.tick(+col.dataset.col); }
          if (opts.each) opts.each(i + 1, n);
          step(i + 1);
        },
      });
    };
    step(0);
  },

  // ---------------------------------------------------------------- 主迴圈
  start() { if (this.running) return; this.running = true; this.last = performance.now(); requestAnimationFrame((t) => this.frame(t)); },
  stop() { this.running = false; },
  frame(now2) {
    if (!this.running) return;
    const dt = Math.min(0.05, (now2 - this.last) / 1000); this.last = now2; this.t += dt;
    if (this.layoutDirty) this.computeLinks();
    if (!this.layer) this.drawLayer();
    const b = this.b, f = this.f;
    b.clearRect(0, 0, this.W, this.H);
    b.drawImage(this.layer, 0, 0, this.W, this.H);
    // 極淡的流動底紋（裝飾，不代表資料）
    if (settings.fx === 'full' && !reducedMotion()) {
      b.globalCompositeOperation = 'lighter';
      for (const L of this.links) {
        const t = (this.t * 0.06 + L.ph) % 1;
        const [x, y] = this.bez(L, t);
        b.globalAlpha = 0.18;
        b.drawImage(this.sprite(L.c0, 32), x - 6, y - 6, 12, 12);
      }
      b.globalAlpha = 1; b.globalCompositeOperation = 'source-over';
    }
    // 封包
    b.globalCompositeOperation = 'lighter';
    for (let i = this.packets.length - 1; i >= 0; i--) {
      const p = this.packets[i];
      p.t += dt * 1000 / p.dur;
      const tt = Math.min(1, p.t);
      const e = tt < 0.5 ? 2 * tt * tt : 1 - Math.pow(-2 * tt + 2, 2) / 2;
      const [x, y] = this.bez(p.L, e);
      p.trail.push([x, y]); if (p.trail.length > 14) p.trail.shift();
      const sp = this.sprite(p.color, 64);
      p.trail.forEach(([tx, ty], k) => { const a = (k + 1) / p.trail.length; b.globalAlpha = a * 0.5; const s = 10 * a * p.size; b.drawImage(sp, tx - s, ty - s, s * 2, s * 2); });
      b.globalAlpha = 1;
      const s = 16 * p.size;
      b.drawImage(sp, x - s, y - s, s * 2, s * 2);
      if (p.t >= 1) { this.packets.splice(i, 1); if (p.onArrive) p.onArrive(); }
    }
    b.globalCompositeOperation = 'source-over'; b.globalAlpha = 1;
    // 水母代理人（在面板上面，半透明）
    f.clearRect(0, 0, this.W, this.H);
    if (settings.fx !== 'low' && !reducedMotion()) {
      const js = this.stack ? this.jellies.slice(0, 3) : this.jellies;
      for (const j of js) { j.update(dt, this); j.draw(f, this); }
    }
    requestAnimationFrame((t) => this.frame(t));
  },
  jelly(id) { return this.jellies.find((j) => j.a.id === id); },
  /** 代理人游到某個元素旁邊做事，頭上的標籤寫它正在做什麼 */
  seek(id, node, label, ms = 2600) { const j = this.jelly(id); if (j) j.seek(node, label, ms); },
};

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// ================================================================ 水母
class Jelly {
  constructor(a, i) {
    this.a = a; this.i = i;
    this.x = innerWidth * (0.12 + i * 0.19); this.y = innerHeight * (0.35 + (i % 2) * 0.25);
    this.vx = 0; this.vy = 0; this.ang = 0; this.ph = Math.random() * 6; this.tx = this.x; this.ty = this.y;
    this.mode = 'drift'; this.until = 0; this.label = '待命'; this.tag = `M-0${i + 1}`;
    this.nextWander = 0; this.alpha = 0;
    this.ten = [];
    for (let k = 0; k < 7; k++) { const seg = []; for (let s = 0; s < 13; s++) seg.push([this.x, this.y + s * 4]); this.ten.push(seg); }
  }
  home(fx) {
    // 在自己那一欄的左側縫隙附近游
    const col = $('#c' + this.a.col);
    if (!col) return [fx.W / 2, fx.H / 2];
    const r = col.getBoundingClientRect();
    const rem = fx.rem();
    return [r.left - rem * 1.6 + (Math.random() - 0.5) * rem * 6, r.top + r.height * (0.15 + Math.random() * 0.7)];
  }
  seek(node, label, ms) {
    if (!node) return;
    const r = node.getBoundingClientRect();
    if (!r.height) return;
    this.mode = 'seek'; this.until = performance.now() + ms; this.label = label || '處理中';
    this.tx = r.left + Math.min(r.width * 0.25, 60) ; this.ty = r.top + r.height / 2;
  }
  update(dt, fx) {
    const t = performance.now();
    this.alpha = Math.min(1, this.alpha + dt * 0.6);
    if (this.mode === 'seek' && t > this.until) { this.mode = 'drift'; this.label = '待命'; this.nextWander = 0; }
    if (this.mode === 'drift' && t > this.nextWander) { [this.tx, this.ty] = this.home(fx); this.nextWander = t + 5000 + Math.random() * 6000; }
    // 一縮一放往前推
    this.ph += dt * (this.mode === 'seek' ? 5.2 : 3.2);
    const pulse = Math.max(0, Math.sin(this.ph));
    const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy) || 1;
    const push = (this.mode === 'seek' ? 260 : 70) * pulse * Math.min(1, d / 120);
    this.vx += (dx / d) * push * dt; this.vy += (dy / d) * push * dt - 4 * dt;
    this.vx *= Math.pow(0.12, dt); this.vy *= Math.pow(0.12, dt);
    this.x += this.vx * dt; this.y += this.vy * dt;
    const want = Math.atan2(this.vy, this.vx) + Math.PI / 2;
    const sp = Math.hypot(this.vx, this.vy);
    const targetAng = sp > 6 ? want : 0;
    let da = targetAng - this.ang; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    this.ang += da * Math.min(1, dt * 2.2);
    // 觸手：跟著鐘罩下緣拖曳
    const R = fx.rem() * 2.1;
    const ca = Math.cos(this.ang), sa = Math.sin(this.ang);
    this.ten.forEach((seg, k) => {
      const off = (k / (this.ten.length - 1) - 0.5) * R * 1.4;
      const ax = this.x + ca * off - sa * R * 0.25, ay = this.y + sa * off + ca * R * 0.25;
      seg[0][0] = ax; seg[0][1] = ay;
      const len = R * (k % 3 === 1 ? 0.42 : 0.3);
      for (let s = 1; s < seg.length; s++) {
        const p = seg[s], q = seg[s - 1];
        p[0] += Math.sin(this.ph * 0.7 + s * 0.6 + k) * 0.35 + sa * 6 * dt * 10;
        p[1] += 9 * dt * 10 * ca * 0.2 + 0.4;
        const ddx = p[0] - q[0], ddy = p[1] - q[1], dd = Math.hypot(ddx, ddy) || 1;
        p[0] = q[0] + ddx / dd * len; p[1] = q[1] + ddy / dd * len;
      }
    });
  }
  draw(c, fx) {
    const R = fx.rem() * 2.1, col = this.a.color;
    const pulse = Math.sin(this.ph);
    c.save();
    if (fx.stack) { c.globalAlpha = 0.6; }
    c.globalCompositeOperation = 'lighter';
    // 光暈
    const g0 = fx.sprite(col, 128);
    c.globalAlpha = this.alpha * 0.32; c.drawImage(g0, this.x - R * 2.6, this.y - R * 2.6, R * 5.2, R * 5.2);
    // 觸手
    c.globalAlpha = this.alpha * 0.55;
    this.ten.forEach((seg, k) => {
      c.strokeStyle = hexA(col, k % 3 === 1 ? 0.75 : 0.45); c.lineWidth = k % 3 === 1 ? 1.8 : 0.9;
      c.beginPath(); c.moveTo(seg[0][0], seg[0][1]);
      for (let s = 1; s < seg.length - 1; s++) { const mx = (seg[s][0] + seg[s + 1][0]) / 2, my = (seg[s][1] + seg[s + 1][1]) / 2; c.quadraticCurveTo(seg[s][0], seg[s][1], mx, my); }
      c.stroke();
    });
    // 鐘罩
    c.translate(this.x, this.y); c.rotate(this.ang);
    const w = R * (1 + pulse * 0.08), h = R * (0.95 - pulse * 0.1);
    const bg = c.createRadialGradient(0, -h * 0.3, R * 0.1, 0, 0, R * 1.2);
    bg.addColorStop(0, 'rgba(255,255,255,.55)'); bg.addColorStop(0.35, hexA(col, 0.32)); bg.addColorStop(1, hexA(col, 0.05));
    c.globalAlpha = this.alpha;
    c.fillStyle = bg; c.strokeStyle = hexA(col, 0.85); c.lineWidth = 1.3;
    c.beginPath();
    c.moveTo(-w, R * 0.2);
    c.bezierCurveTo(-w, -h * 1.15, w, -h * 1.15, w, R * 0.2);
    for (let k = 6; k >= 0; k--) { const xx = -w + (2 * w) * k / 6; c.quadraticCurveTo(xx + w / 6, R * 0.42, xx, R * 0.2); }
    c.closePath(); c.fill(); c.stroke();
    // 內部器官
    c.strokeStyle = hexA(col, 0.5); c.lineWidth = 1;
    for (let k = 0; k < 4; k++) { c.beginPath(); c.ellipse((k - 1.5) * w * 0.32, -h * 0.25, w * 0.13, h * 0.24, 0, 0, 6.3); c.stroke(); }
    c.restore();
    // 標籤（它正在做的事）；小螢幕不畫，免得擋住字
    if (fx.stack) return;
    c.save();
    c.globalAlpha = this.alpha * (this.mode === 'seek' ? 1 : 0.3);
    const rem = fx.rem();
    const txt = `${this.tag} · ${this.label}`;
    c.font = `${rem * 1.05}px "Share Tech Mono", "Noto Sans TC", monospace`;
    const tw2 = c.measureText(txt).width + rem * 1.2;
    const lx = this.x + R * 1.1, ly = this.y - R * 1.3;
    c.fillStyle = 'rgba(4,8,18,.82)'; c.strokeStyle = hexA(col, 0.9); c.lineWidth = 1;
    c.beginPath(); c.rect(lx, ly - rem * 1.6, tw2, rem * 2.1); c.fill(); c.stroke();
    c.fillStyle = col; c.fillText(txt, lx + rem * 0.6, ly);
    c.beginPath(); c.moveTo(this.x + R * 0.5, this.y - R * 0.6); c.lineTo(lx, ly - rem * 0.3); c.strokeStyle = hexA(col, 0.5); c.stroke();
    c.restore();
  }
}

// ================================================================ 開機的眼睛
const BootFX = {
  cv: null, c: null, t0: 0, run: false, open: 0, flash: 0, zoom: 0, W: 0, H: 0, dpr: 1, ticks: [],
  start() {
    this.cv = $('#bootcv'); this.c = this.cv.getContext('2d');
    this.dpr = Math.min(devicePixelRatio || 1, 1.5);
    this.W = innerWidth; this.H = innerHeight;
    this.cv.width = this.W * this.dpr; this.cv.height = this.H * this.dpr;
    this.c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.t0 = performance.now(); this.run = true; this.open = 0; this.flash = 0; this.zoom = 0;
    this.ticks = Array.from({ length: 120 }, () => Math.random());
    const loop = (t) => { if (!this.run) return; this.draw((t - this.t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  },
  stop() { this.run = false; },
  draw(s) {
    const c = this.c, W = this.W, H = this.H, cx = W / 2, cy = H * 0.4;
    const R = Math.min(W, H) * 0.22;
    c.clearRect(0, 0, W, H);
    // 掃描線
    const sl = Math.min(1, s / 0.7);
    c.fillStyle = `rgba(120,220,255,${0.6 * (1 - this.open)})`;
    c.fillRect(cx - W * 0.5 * sl, cy - 1, W * sl, 2);
    // 眼睛張開的程度
    this.open += ((s > 0.6 ? 1 : 0) - this.open) * 0.035;
    const op = this.open;
    const z = 1 + this.zoom * 2.4;
    c.save(); c.translate(cx, cy); c.scale(z, z);
    // 眼眶（杏仁形，上下眼皮）
    c.save();
    c.beginPath();
    const ew = R * 2.1, eh = R * 1.15 * op;
    c.moveTo(-ew, 0); c.bezierCurveTo(-ew * 0.45, -eh * 1.25, ew * 0.45, -eh * 1.25, ew, 0); c.bezierCurveTo(ew * 0.45, eh * 1.25, -ew * 0.45, eh * 1.25, -ew, 0);
    c.strokeStyle = 'rgba(70,212,255,.9)'; c.lineWidth = 2.2; c.shadowColor = '#46d4ff'; c.shadowBlur = 18; c.stroke();
    c.shadowBlur = 0;
    c.clip();
    // 虹膜
    const rot = s * 0.25;
    c.lineWidth = 1.2;
    for (let k = 0; k < 3; k++) {
      const rr = R * (0.95 - k * 0.2);
      c.strokeStyle = k === 1 ? 'rgba(255,191,60,.85)' : 'rgba(120,220,255,.7)';
      c.setLineDash(k === 1 ? [R * 0.08, R * 0.04] : k === 2 ? [2, 6] : []);
      c.save(); c.rotate(rot * (k % 2 ? -1.4 : 1)); c.beginPath(); c.arc(0, 0, rr, 0, Math.PI * 2); c.stroke(); c.restore();
    }
    c.setLineDash([]);
    // 放射狀刻度：像資料一條條匯進來
    c.save(); c.rotate(-rot * 0.6);
    for (let k = 0; k < this.ticks.length; k++) {
      const a = k / this.ticks.length * Math.PI * 2, l = R * (0.08 + this.ticks[k] * 0.22) * Math.min(1, s / 1.6);
      c.strokeStyle = k % 9 === 0 ? 'rgba(255,191,60,.9)' : 'rgba(120,220,255,.45)';
      c.beginPath(); c.moveTo(Math.cos(a) * R * 0.98, Math.sin(a) * R * 0.98); c.lineTo(Math.cos(a) * (R * 0.98 + l), Math.sin(a) * (R * 0.98 + l)); c.stroke();
    }
    c.restore();
    // 瞳孔
    const pr = R * (0.32 + Math.sin(s * 2) * 0.02);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, pr * 2.2);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(160,240,255,.9)'); g.addColorStop(0.55, 'rgba(70,212,255,.35)'); g.addColorStop(1, 'rgba(70,212,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, pr * 2.2, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#01030a'; c.beginPath(); c.arc(0, 0, pr * 0.42, 0, Math.PI * 2); c.fill();
    c.restore();
    c.restore();
    // 睜眼那一下的白光
    if (this.flash > 0) { c.fillStyle = `rgba(230,250,255,${this.flash})`; c.fillRect(0, 0, W, H); this.flash = Math.max(0, this.flash - 0.03); }
  },
};

/* ---- replay.js ---- */
/* 全知 OMNISCIENT — 回放：把某一天真的發生過的事，照時間順序重新演一次
   - 價格：冷眼記下的當天每一輪整股行情（spark.json），回放到幾點就只顯示幾點以前的成交
   - 新聞：冷眼收到的公告與新聞，照發布時間出現
   - 官方資料：各來源當天實際同步成功的時間
   不在資料裡的東西（例如盤中的加權指數）不會被畫出來。 */

const RP = {
  active: false, playing: false, day: null, p: 0, events: [], fired: 0, endMin: 1440, raf: 0, last: 0,
  hi: {}, lo: {}, hiN: 0, opened: {}, reported: false, loopTimer: 0,
  // 進度（0～1）對應到當天幾點：盤前 07:00 起 5%、盤中 80%、盤後 15%（07:00 以前的新聞一開始就已經在畫面上）
  SEG: [[0, 0.05, 420, 540], [0.05, 0.85, 540, 810], [0.85, 1, 810, null]],
  get dur() { return 180 / (settings.speed || 1); },

  minuteOf(p) {
    for (const [a, b, m0, m1] of this.SEG) {
      const end = m1 == null ? this.endMin : m1;
      if (p <= b) return m0 + (end - m0) * clamp((p - a) / (b - a), 0, 1);
    }
    return this.endMin;
  },
  progressOf(m) {
    if (m < this.SEG[0][2]) return 0;
    for (const [a, b, m0, m1] of this.SEG) {
      const end = m1 == null ? this.endMin : m1;
      if (m <= end) return a + (b - a) * clamp((m - m0) / (end - m0 || 1), 0, 1);
    }
    return 1;
  },
  dayMin(ms) { const t = tw(ms); return t.hh * 60 + t.mi + t.ss / 60; },

  build(day) {
    const ev = [];
    const t = tw();
    this.endMin = day === t.ymd ? Math.max(820, Math.min(1440, t.hh * 60 + t.mi)) : 1440;
    // 時段
    ev.push({ m: 540, type: 'open' });
    ev.push({ m: 805, type: 'auction' });
    ev.push({ m: 810, type: 'close' });
    // 新聞與公告
    for (const x of newsOn(day)) {
      const m = x.timed ? this.dayMin(x.ms) : 480;
      if (m <= this.endMin) ev.push({ m, type: 'news', item: x });
    }
    // 官方來源當天同步成功的時間
    for (const s of sourcesList()) {
      if (isFinite(s.ok) && ymdOf(s.ok) === day) { const m = this.dayMin(s.ok); if (m <= this.endMin) ev.push({ m, type: 'src', src: s }); }
    }
    // 收盤批次（規則重新計算）
    if (D.summary && D.summary.asof === day) { const g = parseTs(D.summary.generated); if (isFinite(g) && ymdOf(g) === day) ev.push({ m: this.dayMin(g), type: 'eod' }); }
    // 自選每一檔的每一筆盤中紀錄
    for (const c of watchCodes()) for (const [mm, px] of sparkOf(c)) ev.push({ m: 540 + mm, type: 'px', code: c, px });
    ev.sort((a, b) => a.m - b.m || (a.type === 'px') - (b.type === 'px'));
    this.events = ev;
  },

  start(day, { at = 0, play = true } = {}) {
    this.stop(true);
    this.active = true; this.day = day; this.reported = false;
    this.build(day);
    $('#report').hidden = true;
    UI.view = { mode: 'replay', day, minute: -9999 };
    this.seek(at, true);
    this.playing = play;
    this.last = performance.now();
    this.loop();
    this.renderBar();
    bus.emit('replay-start', day);
  },
  stop(silent) {
    cancelAnimationFrame(this.raf); clearTimeout(this.loopTimer);
    const was = this.active;
    this.active = false; this.playing = false;
    if (was && !silent) { UI.view = { mode: 'live', minute: null, day: null }; bus.emit('replay-stop'); }
    this.renderBar();
  },
  toggle() { if (!this.active) return; if (this.p >= 1) { this.start(this.day); return; } this.playing = !this.playing; this.last = performance.now(); this.renderBar(); },
  loop() {
    cancelAnimationFrame(this.raf);
    const step = (t) => {
      if (!this.active) return;
      const dt = Math.min(0.1, (t - this.last) / 1000); this.last = t;
      if (this.playing && !document.hidden) {
        this.p = Math.min(1, this.p + dt / this.dur);
        this.fireUpTo(this.minuteOf(this.p), false);
        if (this.p >= 1) { this.playing = false; this.finish(); }
      }
      this.renderBar(true);
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  /** 走到 minute：把中間的事件依序觸發（silent＝拖動進度條時不放特效） */
  fireUpTo(minute, silent) {
    const prevSession = UI.view.minute;
    UI.view.minute = minute - 540;
    const fired = [];
    while (this.fired < this.events.length && this.events[this.fired].m <= minute) { fired.push(this.events[this.fired]); this.fired++; }
    const pxCodes = new Set();
    for (const ev of fired) {
      if (ev.type === 'px') { pxCodes.add(ev.code); this.trackExtremes(ev, silent); continue; }
      bus.emit('replay-event', { ev, silent });
    }
    if (pxCodes.size) bus.emit('replay-px', { codes: Array.from(pxCodes), silent });
    if (Math.floor(prevSession / 2) !== Math.floor(UI.view.minute / 2) || fired.length) bus.emit('replay-time', { silent });
  },
  trackExtremes(ev, silent) {
    const c = ev.code;
    if (!this.opened[c]) { this.opened[c] = ev.px; this.hi[c] = ev.px; this.lo[c] = ev.px; return; }
    const m = ev.m - 540;
    if (ev.px > this.hi[c] * 1.003 && m >= 30 && c === watchCodes()[0] && this.hiN < 4) { this.hiN++; bus.emit('replay-event', { ev: { m: ev.m, type: 'high', code: c, px: ev.px }, silent }); }
    if (ev.px < this.lo[c] * 0.997 && m >= 30 && c === watchCodes()[0] && this.hiN < 4) { this.hiN++; bus.emit('replay-event', { ev: { m: ev.m, type: 'low', code: c, px: ev.px }, silent }); }
    this.hi[c] = Math.max(this.hi[c], ev.px); this.lo[c] = Math.min(this.lo[c], ev.px);
  },
  seek(p, silent = true) {
    p = clamp(p, 0, 1);
    this.p = p;
    this.fired = 0; this.hi = {}; this.lo = {}; this.opened = {}; this.hiN = 0;
    UI.shownNews = new Set(); UI.newsReady = false;
    UI.clearLog();
    UI.view.minute = -9999;
    this.fireUpTo(this.minuteOf(p), true);
    UI.newsReady = true;
    bus.emit('replay-seek');
    this.renderBar();
    if (p < 1) { this.reported = false; $('#report').hidden = true; }
  },
  finish() {
    if (this.reported) return;
    this.reported = true;
    bus.emit('replay-end', this.day);
  },

  // ---------------------------------------------------------------- 底列的回放控制
  renderBar(light) {
    const rp = $('#rp');
    if (!rp) return;
    if (!this.active) {
      const ph = marketPhase();
      const day = D.spark && D.spark.d;
      const h = `${day ? `<button type="button" class="rb" data-act="replay" title="回放（R）"><svg viewBox="0 0 16 16"><path d="M4 3v10l9-5z"/></svg></button><span class="rl2">${ph.phase === 'open' ? '盤中即時 · 回看今天到現在' : `回放 ${dateText(day)}（${WD[weekday(day)]}）整天`}</span>` : '<span class="rl2">還沒有可以回放的交易日</span>'}`;
      if (rp.dataset.h !== h) { rp.innerHTML = h; rp.dataset.h = h; }
      return;
    }
    const minute = this.minuteOf(this.p);
    const label = `${minute < 540 ? '盤前' : minute <= 810 ? '盤中' : '盤後'} ${hmText(ymdToMs(this.day, 0, 0) + minute * 60e3)}`;
    if (light && rp.dataset.ready === this.day + ':' + settings.speed + ':' + this.playing + ':' + (this.p >= 1)) {
      $('.sf', rp).style.width = (this.p * 100).toFixed(2) + '%';
      $('.sh', rp).style.left = (this.p * 100).toFixed(2) + '%';
      $('.rl2', rp).textContent = `回放 ${dateText(this.day)} · ${label}`;
      return;
    }
    const marks = this.events.filter((e) => e.type === 'news').map((e) => `<i class="mk${e.item.kind === 'opinion' ? ' op' : ''}" style="left:${(this.progressOf(e.m) * 100).toFixed(2)}%"></i>`).join('');
    const ticks = [[540, '09:00'], [660, '11:00'], [810, '13:30'], [this.endMin, this.endMin >= 1440 ? '24:00' : hmText(ymdToMs(this.day, 0, 0) + this.endMin * 60e3)]].map(([m, t]) => `<span class="tk" style="left:${(this.progressOf(m) * 100).toFixed(1)}%">${t}</span>`).join('');
    const ph = marketPhase();
    rp.innerHTML = `<button type="button" class="rb" data-act="play" title="播放／暫停（空白鍵）">${this.playing ? '<svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>' : '<svg viewBox="0 0 16 16"><path d="M4 3v10l9-5z"/></svg>'}</button>`
      + `<button type="button" class="rs" data-act="speed" title="回放速度">${settings.speed}×</button>`
      + `<span class="rl2">回放 ${dateText(this.day)} · ${label}</span>`
      + `<div class="scrub" id="scrub"><i class="sk"></i>${marks}<i class="sf" style="width:${(this.p * 100).toFixed(2)}%"></i><i class="sh" style="left:${(this.p * 100).toFixed(2)}%"></i>${ticks}</div>`
      + `<button type="button" class="golive" data-act="live">${ph.phase === 'open' ? '● 回到即時' : '看最新資料'}</button>`;
    rp.dataset.ready = this.day + ':' + settings.speed + ':' + this.playing + ':' + (this.p >= 1);
    rp.dataset.h = '';
    const sc = $('#scrub', rp);
    const drag = (e) => { const r = sc.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; this.seek(x / r.width, true); };
    sc.addEventListener('pointerdown', (e) => { drag(e); sc.setPointerCapture(e.pointerId); const mv = (ev) => drag(ev); const up = () => { sc.removeEventListener('pointermove', mv); sc.removeEventListener('pointerup', up); }; sc.addEventListener('pointermove', mv); sc.addEventListener('pointerup', up); });
  },
};

/* ---- main.js ---- */
/* 全知 OMNISCIENT — 開機、即時／回放兩種模式、事件 → 畫面與聲光 */

const APP = { booted: false, wake: null, lastPricePacket: 0, liveNewsDay: null };

// ---------------------------------------------------------------- 版面：寬螢幕＝戰情室；直式／小螢幕＝由上往下排
function layoutMode() {
  const stack = innerWidth < 1000 || innerWidth / innerHeight < 1.15;
  document.documentElement.classList.toggle('stack', stack);
  if (FX.bg) { FX.resize(); FX.layoutDirty = true; }
}

// ---------------------------------------------------------------- 全部重畫
function currentNews() {
  if (RP.active) {
    const lim = RP.minuteOf(RP.p);
    return newsOn(RP.day).filter((x) => (x.timed ? RP.dayMin(x.ms) : 480) <= lim);
  }
  return newsAll();
}
function renderAll() {
  UI.renderTop();
  UI.renderSources();
  UI.renderVerify();
  const nl = currentNews();
  UI.renderNews(nl, RP.active ? RP.day : null);
  UI.renderTiles();
  UI.renderPulse();
  UI.renderAgents(RP.active ? nl : newsOn(marketPhase().today));
  RP.renderBar();
  FX.layoutDirty = true;
  const tx = taiex();
  if (SFX.ctx) SFX.pad(tx ? Math.sign(tx.chg || 0) : 0);
}

// ---------------------------------------------------------------- 事件 → 光點路線
const SRC_TO_CHECK = { mis_etf: 'chk-dual', twse_daily: 'chk-close', tpex_daily: 'chk-close', sitca: 'chk-prem', twse_mflows: 'chk-taiex', twse_flows: 'chk-taiex' };
const NEWS_SRC_CARD = { cna: 'src-cna', twse_news: 'src-twse_news', fsc: 'src-fsc', cbc: 'src-cbc' };
const byId = (id) => (id ? document.getElementById(id) : null);

function newsFx(x) {
  const card = byId('nw-' + x.i);
  const src = byId(NEWS_SRC_CARD[x.src]) || byId('src-cna');
  const tiles = (x.codes || []).filter((c) => watchCodes().includes(c)).map((c) => byId('tile-' + c));
  const path = [src, byId('chk-ver'), card];
  if (tiles.length) path.push($('#b3 .verdict'), tiles[0]);
  FX.chain(path, x.kind === 'opinion' ? '#ffb02e' : x.kind === 'official' ? '#46d4ff' : '#ff4fd8', { dur: 700 });
  FX.seek('medusa', card || $('#c2'), x.kind === 'opinion' ? `蓋章：觀點（${x.trig || '看法'}）` : x.kind === 'official' ? '蓋章：官方公告' : '蓋章：事實報導', 2800);
  setTimeout(() => SFX.stamp(x.kind), 1300);
}
function srcFx(s) {
  const card = byId('src-' + s.key);
  const chk = byId(SRC_TO_CHECK[s.key] || 'chk-src');
  FX.chain([card, chk, $('#b3 .verdict')], '#46d4ff', { dur: 800 });
  FX.seek('owl', card || $('#c0'), `同步 ${s.org}`, 2600);
}
function pricePackets(codes) {
  const t = performance.now();
  if (t - APP.lastPricePacket < (settings.fx === 'full' ? 320 : 900)) return;
  APP.lastPricePacket = t;
  const c = codes[Math.floor(Math.random() * codes.length)];
  FX.chain([byId('src-mis_etf'), byId('chk-dual'), byId('tile-' + c)], '#9b7bff', { dur: 650, size: 0.8 });
  if (Math.random() < 0.15) FX.seek('libra', byId('chk-dual'), `核對 ${c} 盤中價`, 1800);
}

// ---------------------------------------------------------------- 回放事件
function replayLog(agent, text, m, hl) { UI.log(agent, text, { time: ymdToMs(RP.day, 0, 0) + m * 60e3, hl }); }
function handleReplayEvent(ev, silent) {
  const first = watchCodes()[0];
  switch (ev.type) {
    case 'open': {
      replayLog('core', '開盤 09:00 · 證交所開始逐筆撮合', ev.m, true);
      if (!silent) { UI.beam(); SFX.blip(4); UI.stage(4); }
      break;
    }
    case 'auction': replayLog('core', '13:25 收盤前集合競價（最後 5 分鐘一起撮合）', ev.m); break;
    case 'close': {
      const q = quoteAt(first, 270);
      replayLog('core', `收盤 13:30 · ${first} 收 ${fmtPx(q.px)}（${fmtPct(q.pct)}）`, ev.m, true);
      const tx = taiex();
      if (tx && tx.date === RP.day) replayLog('owl', `加權指數收 ${fmtPx(tx.v)}（${fmtPct(tx.pct)}）· 證交所`, ev.m, true);
      if (!silent) { UI.beam(); SFX.chime(q && q.chg >= 0 ? 1 : -1); UI.renderTop(); }
      break;
    }
    case 'news': {
      const x = ev.item;
      replayLog('medusa', `［${KIND_INFO[x.kind].short}］${x.srcName}：${x.t}`, ev.m, x.kind === 'official');
      break;   // 畫面上的新聞卡與光點在 replay-time 統一處理（要等卡片畫出來）
    }
    case 'src': {
      replayLog('owl', `已同步：${ev.src.org} ${ev.src.what}`, ev.m);
      if (!silent) { UI.renderVerify(); srcFx(ev.src); }
      break;
    }
    case 'eod': {
      replayLog('judge', `收盤批次完成 · 規則重新計算 ${(D.summary.etfs || []).length} 檔 ETF`, ev.m, true);
      if (!silent) { UI.beam(); FX.chain([$('#b3 .verdict'), byId('tile-' + first)], '#ffbf3c', { dur: 900, size: 1.3 }); FX.seek('judge', $('#b3 .verdict'), '重新計算觀點', 3000); }
      break;
    }
    case 'high': case 'low': {
      replayLog('core', `${ev.code} ${ev.type === 'high' ? '衝上今日新高' : '跌到今日新低'} ${fmtPx(ev.px)}`, ev.m);
      if (!silent) { UI.hit(byId('tile-' + ev.code)); SFX.blip(ev.type === 'high' ? 3 : 1); FX.seek('core', byId('tile-' + ev.code), ev.type === 'high' ? '新高' : '新低', 2000); }
      break;
    }
    default:
  }
}
let lastTimeRender = 0, lastHeavy = 0;
bus.on('replay-event', ({ ev, silent }) => handleReplayEvent(ev, silent));
bus.on('replay-px', ({ codes, silent }) => { if (!silent) pricePackets(codes); });
bus.on('replay-time', ({ silent }) => {
  const t = performance.now();
  if (!silent && t - lastTimeRender < 120) return;
  lastTimeRender = t;
  UI.renderTiles();
  const nl = currentNews();
  const fresh = UI.renderNews(nl, RP.day);
  if (!silent) fresh.slice(0, 3).forEach((x, k) => setTimeout(() => newsFx(x), k * 350));
  if (silent || t - lastHeavy > 600) { lastHeavy = t; UI.renderPulse(); UI.renderAgents(nl); UI.renderTop(); }
});
bus.on('replay-seek', () => { renderAll(); });
bus.on('replay-start', (day) => { UI.toast(`回放 ${dateText(day)}（${WD[weekday(day)]}）· 照當天真實發生的順序重演`); renderAll(); });
bus.on('replay-stop', () => { renderAll(); });
bus.on('replay-end', (day) => showReport(day));
