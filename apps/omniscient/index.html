    const rows = [];
    if (m) rows.push({ k: '收盤批次', zh: true, f: 1, v: fmtPx(m.close, 0) });
    if (g) rows.push({ k: '市場溫度', zh: true, f: m && m.d === g.d ? (Math.abs(m.close - g.c) < 0.5 ? 1 : 0.3) : 0.5, v: fmtPx(g.c, 0), bad: m && m.d === g.d && Math.abs(m.close - g.c) >= 0.5 });
    if (m && g && m.d === g.d) {
      const ok = Math.abs(m.close - g.c) < 0.5;
      st = ok ? 'pass' : 'warn'; big = ok ? 'MATCH' : 'DIFF';
      detail = ok ? `${dateText(m.d)} 收 ${fmtPx(m.close)}，兩條管線完全相同` : `收盤批次 ${fmtPx(m.close)}／市場溫度 ${fmtPx(g.c)}`;
    }
    out.push({ id: 'taiex', title: '加權指數核對', org: 'TWSE 加權指數', st, big, detail, rows });
  }
  // 5. 官方來源健康
  {
    const h = sourceHealth();
    const by = {};
    for (const s of h.list) { if (s.st === 'idle') continue; const o = by[s.org] || (by[s.org] = { ok: 0, n: 0 }); o.n++; if (s.st === 'ok') o.ok++; }
    const rows = Object.entries(by).sort((a, b) => b[1].n - a[1].n).slice(0, 4).map(([k, o]) => ({ k, zh: true, f: o.ok / o.n, v: `${o.ok}/${o.n}`, bad: o.ok < o.n }));
    out.push({ id: 'src', title: '官方來源健康', org: 'COLDEYE 抓取紀錄', rows,
      st: h.total === 0 ? 'wait' : h.err ? 'warn' : h.ok === h.total ? 'pass' : 'warn', big: h.total ? `${h.ok}/${h.total}` : '—',
      detail: h.err ? `${h.err} 個來源最近一次抓取失敗，其餘正常` : h.ok === h.total ? '每個官方來源最近都抓取成功' : `${h.total - h.ok} 個來源超過 4 天沒有新資料（那份資料本來就不常更新）`,
    });
  }
  // 6. 版本同步：版本檔說的時間戳 = 看板手上那一份
  {
    const f = (D.version && D.version.files) || {};
    const names = Object.keys(STAMP).filter((n) => f[n]);
    const same = names.filter((n) => f[n] === stampOf(n));
    const down = D.link === 'down';
    const rows = names.slice(0, 5).map((n) => { const age = now() - parseTs(stampOf(n)); return { k: n, f: f[n] === stampOf(n) ? 1 : 0.2, v: isFinite(age) ? (age < 3600e3 ? Math.round(age / 60e3) + 'm' : Math.round(age / 3600e3) + 'h') : '—', bad: f[n] !== stampOf(n) }; });
    out.push({ id: 'ver', title: '資料版本同步', org: 'COLDEYE version.json', rows,
      st: down ? 'fail' : !names.length ? 'wait' : same.length === names.length ? 'pass' : 'warn',
      big: down ? 'OFFLINE' : names.length ? `${same.length}/${names.length}` : '—',
      detail: down ? '連不上冷眼，顯示的是上次的資料' : same.length === names.length ? '看板手上的每一份都是最新版' : '有新版本，正在下載',
    });
  }
  return out;
}

/** 全市場規則觀點分布 */
function breadth() {
  const c = { bull: 0, neutral: 0, bear: 0, n: 0 };
  for (const e of (D.summary && D.summary.etfs) || []) {
    if (e.young || !isNum(e.st)) continue;
    c.n++; if (e.st > 0) c.bull++; else if (e.st < 0) c.bear++; else c.neutral++;
  }
  return c;
}
const STANCE = { 1: { t: '偏多', cls: 'bull' }, 0: { t: '中性', cls: 'neu' }, '-1': { t: '偏空', cls: 'bear' } };
const POS_NAMES = { add: '可加碼', wait: '漲多分批', hold: '續抱', caution: '先不加碼', trim: '減碼' };
const CAT_NAMES = () => (D.summary && D.summary.cats) || {};

/* ---- audio.js ---- */
/* 全知 OMNISCIENT — 聲音：主題配樂（串流播放、循環）＋取樣音效（全部 D 小調、跟著音樂的節拍落下） */
const AU = {
  ctx: null, master: null, music: null, musicGain: null, sfxGain: null, an: null, fbuf: null,
  bufs: {}, info: { bpm: 100, beat: 0.6, bar: 2.4, sections: [] }, ready: false, energy: 0, lastSec: null, duckT: 0,

  /** 開頁就先準備（AudioContext 這時候是暫停的，可以先把音效解碼好） */
  prepare() { if (!this.ctx) this.init(true); },
  /** 使用者點下去的那一刻同步呼叫：解除靜音、開始放配樂 */
  unlock() {
    if (!this.ctx) this.init();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.playMusic(5.0);
  },
  init(early) {
    if (this.ctx) { if (!early && this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC({ latencyHint: 'interactive' }); } catch { try { this.ctx = new AC(); } catch { return; } }
    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = settings.sound ? 1 : 0;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -6; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(c.destination);
    this.musicGain = c.createGain(); this.musicGain.gain.value = 0;
    this.sfxGain = c.createGain(); this.sfxGain.gain.value = settings.sfxVol;
    this.an = c.createAnalyser(); this.an.fftSize = 1024; this.an.smoothingTimeConstant = 0.6;
    this.fbuf = new Uint8Array(this.an.frequencyBinCount);
    this.musicGain.connect(this.an); this.an.connect(this.master);
    this.sfxGain.connect(this.master);
    // 配樂：<audio> 串流（不必整首解碼進記憶體），接進 Web Audio 好控制音量
    const m = new Audio();
    m.src = 'audio/theme.mp3'; m.loop = true; m.preload = 'auto'; m.crossOrigin = 'anonymous';
    m.setAttribute('playsinline', '');
    this.music = m;
    try { c.createMediaElementSource(m).connect(this.musicGain); } catch { /* 舊瀏覽器：直接播 */ }
    if (!early && c.state === 'suspended') c.resume();
    fetch('audio/theme.json').then((r) => r.json()).then((j) => { this.info = j; }).catch(() => {});
    const names = ['boot_rise', 'boot_hit', 'tick1', 'tick2', 'tick3', 'blip1', 'blip2', 'stamp_official', 'stamp_fact', 'stamp_opinion', 'scan', 'chime_up', 'chime_down', 'alert', 'click', 'report', 'burst', 'panel1', 'panel2', 'panel3', 'panel4', 'panel5', 'panel6'];
    Promise.all(names.map((n) => fetch('audio/' + n + '.mp3').then((r) => r.arrayBuffer()).then((ab) => new Promise((res, rej) => c.decodeAudioData(ab, res, rej))).then((b) => { this.bufs[n] = { b, off: this.leadIn(b) }; }).catch(() => {})))
      .then(() => { this.ready = true; });
  },
  /** MP3 開頭有一小段編碼器補的靜音：找到第一個有聲音的樣本，從那裡開始播，才對得準拍子 */
  leadIn(b) {
    const d = b.getChannelData(0);
    const lim = Math.min(d.length, b.sampleRate * 0.2);
    for (let i = 0; i < lim; i++) if (Math.abs(d[i]) > 0.0015) return Math.max(0, i - 8) / b.sampleRate;
    return 0;
  },
  get on() { return !!(this.ctx && settings.sound); },

  // ---------------------------------------------------------------- 配樂
  playMusic(fade = 2.5) {
    if (!this.music || !settings.music) return;
    const p = this.music.play();
    if (p && p.catch) p.catch(() => {});
    const t = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, t);
    this.musicGain.gain.linearRampToValueAtTime(settings.musicVol, t + fade);
  },
  stopMusic(fade = 1.2) {
    if (!this.music) return;
    const t = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, t);
    this.musicGain.gain.linearRampToValueAtTime(0, t + fade);
    setTimeout(() => { if (!settings.music) this.music.pause(); }, fade * 1000 + 50);
  },
  /** 戰報、重要時刻：配樂先讓一點位置 */
  duck(amount = 0.45, hold = 1.6) {
    if (!this.ctx || !settings.music) return;
    const g = this.musicGain.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(settings.musicVol * amount, t + 0.15);
    g.setValueAtTime(settings.musicVol * amount, t + hold);
    g.linearRampToValueAtTime(settings.musicVol, t + hold + 1.2);
  },
  setVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(settings.sound ? 1 : 0, t, 0.05);
    this.sfxGain.gain.setTargetAtTime(settings.sfxVol, t, 0.05);
    if (settings.music) { if (this.music.paused && settings.sound) this.playMusic(1.5); else this.musicGain.gain.setTargetAtTime(settings.musicVol, t, 0.1); }
    else this.stopMusic(0.8);
  },
  musicTime() { return this.music && !this.music.paused ? this.music.currentTime : null; },
  /** 配樂現在在哪一段（給畫面跟著音樂呼吸用；不影響任何數字） */
  section() {
    const mt = this.musicTime();
    if (mt == null) return null;
    let cur = null;
    for (const s of this.info.sections || []) if (mt >= s.t) cur = s.name;
    return cur;
  },
  /** 低頻能量（0～1）：泛光跟著鼓點輕輕呼吸 */
  pulse(dt) {
    if (!this.an || !this.music || this.music.paused) { this.energy *= 0.95; return this.energy; }
    this.an.getByteFrequencyData(this.fbuf);
    const bin = this.ctx.sampleRate / this.an.fftSize;
    const hi = Math.max(2, Math.round(150 / bin));
    let s = 0;
    for (let i = 1; i < hi; i++) s += this.fbuf[i];
    const v = Math.min(1, Math.max(0, (s / (hi - 1) / 255 - 0.35) / 0.5));
    this.energy += (v - this.energy) * Math.min(1, dt * (v > this.energy ? 18 : 4));
    return this.energy;
  },

  // ---------------------------------------------------------------- 音效
  /** quant：對齊配樂的 32 分音符（最多延後 75ms）；pan：-1～1 */
  sfx(name, { gain = 1, pan = 0, quant = false, rate = 1, gate = 0 } = {}) {
    if (!this.on) return;
    const e = this.bufs[name];
    if (!e) return;
    if (gate) { const k = 'g_' + name, t = performance.now(); if (this[k] && t - this[k] < gate) return; this[k] = t; }
    const c = this.ctx;
    let when = c.currentTime + 0.005;
    const mt = this.musicTime();
    if (quant && mt != null) {
      const g = (this.info.beat || 0.6) / 8;
      const d = (g - (mt % g)) % g;
      if (d < 0.08) when += d;
    }
    const src = c.createBufferSource();
    src.buffer = e.b; src.playbackRate.value = rate;
    const gn = c.createGain(); gn.gain.value = gain;
    let node = gn;
    if (pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); gn.connect(p); node = p; }
    src.connect(gn); node.connect(this.sfxGain);
    src.start(when, e.off);
  },
  /** 依畫面上的位置決定左右（光點從左邊的卡片打到右邊的卡片，聲音也從左到右） */
  panOf(el) {
    if (!el || !el.getBoundingClientRect) return 0;
    const r = el.getBoundingClientRect();
    return clamp(((r.left + r.width / 2) / innerWidth) * 2 - 1, -1, 1) * 0.7;
  },
};

/* ---- charts.js ---- */
/* 全知 OMNISCIENT — 卡片裡的小圖（Canvas 2D，霓虹發光）。只有資料變了才重畫。 */
const NEON = {
  cyan: '#00e5ff', mag: '#ff3df0', yel: '#ffd23d', vio: '#8f6dff', ora: '#ff8a3d', sky: '#4db8ff', pink: '#ff5c9a', teal: '#2ef2d0',
  up: '#ff4d6d', dn: '#19e39b', flat: '#c8d2e6', ink3: '#64739a', grid: 'rgba(120,160,255,.10)',
};
const NEON_LIST = [NEON.cyan, NEON.mag, NEON.yel, NEON.vio, NEON.ora, NEON.sky, NEON.pink, NEON.teal];

const CH = {
  prep(cv) {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, r.width, r.height);
    c.lineJoin = 'round'; c.lineCap = 'round';
    return { c, w: r.width, h: r.height };
  },
  grid(c, w, h, nx = 6, ny = 3) {
    c.save();
    c.strokeStyle = NEON.grid; c.lineWidth = 1;
    c.setLineDash([2, 4]);
    for (let i = 1; i < ny; i++) { const y = Math.round(h * i / ny) + 0.5; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
    for (let i = 1; i < nx; i++) { const x = Math.round(w * i / nx) + 0.5; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
    c.restore();
  },
  /** 霓虹線：先畫一層粗而淡的光暈，再畫細而亮的線芯 */
  neonPath(c, pts, col, width = 1.6, glow = 10) {
    if (pts.length < 2) return;
    const path = () => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); };
    c.save();
    c.shadowColor = col; c.shadowBlur = glow;
    c.strokeStyle = hexA(col, 0.35); c.lineWidth = width * 3; path(); c.stroke();
    c.shadowBlur = glow * 0.6;
    c.strokeStyle = col; c.lineWidth = width; path(); c.stroke();
    c.shadowBlur = 0;
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = Math.max(0.6, width * 0.35); path(); c.stroke();
    c.restore();
  },
  area(c, pts, col, h, a0 = 0.32) {
    if (pts.length < 2) return;
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, hexA(col, a0)); g.addColorStop(1, hexA(col, 0));
    c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
    c.lineTo(pts[pts.length - 1][0], h); c.lineTo(pts[0][0], h); c.closePath();
    c.fillStyle = g; c.fill();
  },
  dot(c, x, y, col, r = 3) {
    c.save();
    c.shadowColor = col; c.shadowBlur = 14;
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
    c.fillStyle = hexA(col, 0.35); c.beginPath(); c.arc(x, y, r * 2.6, 0, 6.283); c.fill();
    c.restore();
  },
  dashLine(c, y, w, col = 'rgba(255,255,255,.3)') {
    c.save(); c.strokeStyle = col; c.setLineDash([3, 3]); c.lineWidth = 1; c.beginPath(); c.moveTo(0, y + 0.5); c.lineTo(w, y + 0.5); c.stroke(); c.restore();
  },

  /** K 線（最近 n 根）＋月線 */
  candles(cv, k, n = 30) {
    const { c, w, h } = this.prep(cv);
    if (!k || !k.d || k.d.length < 2) return;
    const L = k.d.length, i0 = Math.max(0, L - n);
    const C = k.c_ || k.c;
    const rows = [];
    for (let i = i0; i < L; i++) if (isNum(k.o[i]) && isNum(C[i])) rows.push({ o: k.o[i], h: k.h[i], l: k.l[i], c: C[i], i });
    if (!rows.length) return;
    const ma = rows.map((r) => { const a = Math.max(0, r.i - 19); let s = 0, m = 0; for (let j = a; j <= r.i; j++) if (isNum(C[j])) { s += C[j]; m++; } return m ? s / m : null; });
    const lo = Math.min(...rows.map((r) => r.l), ...ma.filter(isNum)), hi = Math.max(...rows.map((r) => r.h), ...ma.filter(isNum));
    const pad = 6, Y = (v) => pad + (hi - v) / (hi - lo || 1) * (h - pad * 2);
    this.grid(c, w, h, 6, 4);
    const bw = w / rows.length;
    rows.forEach((r, j) => {
      const x = j * bw + bw / 2;
      const up = r.c >= r.o;
      const col = up ? NEON.up : NEON.dn;
      c.save();
      c.shadowColor = col; c.shadowBlur = 8;
      c.strokeStyle = col; c.lineWidth = 1;
      c.beginPath(); c.moveTo(x, Y(r.h)); c.lineTo(x, Y(r.l)); c.stroke();
      const y0 = Y(Math.max(r.o, r.c)), y1 = Y(Math.min(r.o, r.c));
      c.fillStyle = up ? hexA(col, 0.9) : hexA(col, 0.85);
      c.fillRect(x - bw * 0.32, y0, bw * 0.64, Math.max(1, y1 - y0));
      c.restore();
    });
    const mpts = ma.map((v, j) => (isNum(v) ? [j * bw + bw / 2, Y(v)] : null)).filter(Boolean);
    this.neonPath(c, mpts, NEON.yel, 1.2, 6);
  },

  /** 走勢（點：[[x, y], …]；x 範圍 0..xmax） */
  wave(cv, pts, { xmax, ref, col, head = true, all = null, fill = true } = {}) {
    const { c, w, h } = this.prep(cv);
    const base = all || pts;
    if (!base.length) return;
    const ys = base.map((p) => p[1]).concat(isNum(ref) ? [ref] : []);
    const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
    const pad = 5;
    const X = (x) => (x / xmax) * w, Y = (v) => pad + (hi - v) / span * (h - pad * 2);
    this.grid(c, w, h, 4, 3);
    if (isNum(ref)) this.dashLine(c, Y(ref), w);
    const P = pts.map((p) => [X(p[0]), Y(p[1])]);
    const last = pts[pts.length - 1];
    const cc = col || (last && isNum(ref) ? (last[1] > ref ? NEON.up : last[1] < ref ? NEON.dn : NEON.flat) : NEON.cyan);
    if (fill) this.area(c, P, cc, h);
    this.neonPath(c, P, cc, 1.5, 9);
    if (head && P.length) this.dot(c, P[P.length - 1][0], P[P.length - 1][1], cc, 2.4);
    return cc;
  },
  /** 等距的一串值（例如近 60 日收盤） */
  series(cv, vals, { col = NEON.cyan, ref = null, fill = true } = {}) {
    const v = (vals || []).filter(isNum);
    if (v.length < 2) { this.prep(cv); return; }
    return this.wave(cv, v.map((y, i) => [i, y]), { xmax: v.length - 1, ref, col, fill });
  },
  /** 正負長條（例如外資＋投信每天的買賣超） */
  bars(cv, vals, { pos = NEON.up, neg = NEON.dn } = {}) {
    const { c, w, h } = this.prep(cv);
    const v = vals.map((x) => (isNum(x) ? x : 0));
    if (!v.length) return;
    const mx = Math.max(...v.map(Math.abs), 1e-9);
    const mid = h / 2, bw = w / v.length;
    this.grid(c, w, h, 5, 2);
    v.forEach((x, i) => {
      const hh = Math.abs(x) / mx * (h / 2 - 3);
      const col = x >= 0 ? pos : neg;
      c.save(); c.shadowColor = col; c.shadowBlur = 8; c.fillStyle = hexA(col, 0.85);
      c.fillRect(i * bw + bw * 0.18, x >= 0 ? mid - hh : mid, bw * 0.64, Math.max(1, hh));
      c.restore();
    });
  },
  /** 盤中：價格線＋成交量長條 */
  tape(cv, snaps, { xmax = SESSION_MIN, ref, upto = Infinity } = {}) {
    const { c, w, h } = this.prep(cv);
    if (!snaps.length) return;
    const vis = snaps.filter((s) => s.m <= upto);
    const ph = h * 0.68, vh = h - ph - 4;
    const ys = snaps.map((s) => s.p).concat(isNum(ref) ? [ref] : []);
    const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
    const X = (m) => (m / xmax) * w, Y = (v) => 4 + (hi - v) / span * (ph - 8);
    this.grid(c, w, ph, 9, 3);
    [60, 120, 180, 240].forEach((m) => { c.fillStyle = NEON.ink3; c.font = '10px "JetBrains Mono", monospace'; c.fillText(['10:00', '11:00', '12:00', '13:00'][[60, 120, 180, 240].indexOf(m)], X(m) + 3, ph - 3); });
    if (isNum(ref)) this.dashLine(c, Y(ref), w);
    const mv = Math.max(...snaps.map((s) => s.dv || 0), 1);
    vis.forEach((s, i) => {
      const x0 = i ? X(vis[i - 1].m) : X(0), x1 = X(s.m);
      const col = isNum(ref) && s.p >= ref ? NEON.up : NEON.dn;
      const bh = (s.dv || 0) / mv * vh;
      c.fillStyle = hexA(col, 0.55); c.fillRect(x0 + 0.5, h - bh, Math.max(1, x1 - x0 - 1), bh);
    });
    const P = vis.map((s) => [X(s.m), Y(s.p)]);
    const last = vis[vis.length - 1];
    const col = last && isNum(ref) ? (last.p >= ref ? NEON.up : NEON.dn) : NEON.cyan;
    this.area(c, P, col, ph, 0.25);
    this.neonPath(c, P, col, 1.8, 10);
    if (P.length) this.dot(c, P[P.length - 1][0], P[P.length - 1][1], col, 3);
  },
};

/** 頂列的小波浪（SVG，給 stat 用） */
function squiggle(vals, col) {
  const v = (vals || []).filter(isNum);
  if (v.length < 2) return '<svg class="sq" viewBox="0 0 100 16" preserveAspectRatio="none"></svg>';
  const lo = Math.min(...v), hi = Math.max(...v), sp = hi - lo || 1;
  const d = v.map((y, i) => `${i ? 'L' : 'M'}${(i / (v.length - 1) * 100).toFixed(2)} ${(14 - (y - lo) / sp * 12).toFixed(2)}`).join('');
  return `<svg class="sq" viewBox="0 0 100 16" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.3" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 2px ${col}) drop-shadow(0 0 5px ${col})"/></svg>`;
}

function hexA(hex, a) {
  if (hex.startsWith('rgba') || hex.startsWith('rgb')) return hex;
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function hexRGB(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

/** 滾動數字：數字一位一位地轉到新的值 */
function odo(el, text) {
  if (!el) return;
  text = String(text);
  el.classList.add('odo');
  if (el.dataset.v === text && el.querySelector('.d, .s')) return;
  const prev = el.dataset.v;
  el.dataset.v = text;
  const sameShape = prev && prev.length === text.length && Array.from(text).every((ch, i) => /\d/.test(ch) === /\d/.test(prev[i]));
  if (!sameShape || !el.querySelector('.d, .s') || reducedMotion()) {
    el.innerHTML = Array.from(text).map((ch) => (/\d/.test(ch) ? `<span class="d"><span style="transform:translateY(-${ch}em)">${'0123456789'.split('').map((d) => `<i>${d}</i>`).join('')}</span></span>` : `<span class="s">${esc(ch)}</span>`)).join('');
    return;
  }
  const cells = el.children;
  Array.from(text).forEach((ch, i) => {
    const cell = cells[i];
    if (!cell) return;
    if (/\d/.test(ch) && cell.classList.contains('d')) cell.firstElementChild.style.transform = `translateY(-${ch}em)`;
    else if (!cell.classList.contains('d')) cell.textContent = ch;
  });
}

/* ---- gl.js ---- */
/* 全知 OMNISCIENT — WebGL2 畫面引擎
   HDR 場景（背景格線、霓虹光纜、光點、掃描光束、開機的眼睛）→ 多層泛光（Dual-Kawase）→ 色調映射合成。
   光纜上緩慢流動的微光只是裝飾；明亮的光點（封包）只在真的事件發生時才發射。 */

const GLX = {
  ok: false, gl: null, cv: null, W: 0, H: 0, sc: 1, pw: 0, ph: 0, hdr: false, fmt: null,
  P: {}, fbo: {}, mips: [], buf: {}, vao: {},
  cables: [], nCab: 0, act: null, actTex: null, cableVerts: 0, cableKey: {},
  nodes: [], pts: [], packets: [], sparks: [], motes: [],
  t: 0, last: 0, running: false, energy: 0, beam: { t0: -1, dur: 1.3 }, flash: 0,
  boot: { on: true, idle: true, t0: 0, open: 0.1, zoom: 0, flash: 0 }, rem: 10,
  quality: 1, bloomN: 6, strength: 0.95, frameMs: [], lost: false,

  init(cv) {
    this.cv = cv;
    const gl = cv.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
    if (!gl) return false;
    this.gl = gl;
    this.hdr = !!gl.getExtension('EXT_color_buffer_float');
    gl.getExtension('EXT_color_buffer_half_float');
    this.fmt = this.hdr ? { internal: gl.RGBA16F, type: gl.HALF_FLOAT } : { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE };
    try { this.compile(); } catch (e) { console.error(e); return false; }
    this.buf.cable = gl.createBuffer();
    this.buf.pts = gl.createBuffer();
    this.vao.cable = gl.createVertexArray();
    this.vao.pts = gl.createVertexArray();
    this.vao.empty = gl.createVertexArray();
    this.actTex = gl.createTexture();
    cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.lost = true; this.ok = false; });
    this.quality = settings.fx === 'low' ? 0.5 : settings.fx === 'std' ? 0.75 : 1;
    this.resize();
    this.ok = true;
    return true;
  },

  // ---------------------------------------------------------------- 著色器
  compile() {
    const gl = this.gl;
    const FS_VERT = `#version 300 es
      const vec2 P[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
      out vec2 uv;
      void main(){ vec2 p = P[gl_VertexID]; uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
    const H = `#version 300 es
      precision highp float;
      in vec2 uv; out vec4 o;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }`;
    const src = {
      bg: [FS_VERT, H + `
        uniform vec2 res; uniform float time; uniform float grid; uniform float lift;
        void main(){
          vec2 px = uv*res;
          vec2 q = (uv - vec2(.5,.45))*vec2(res.x/res.y, 1.);
          vec3 c = mix(vec3(.0016,.0032,.0085), vec3(.006,.013,.034), smoothstep(1.25,0.,length(q)));
          vec2 g = abs(fract(px/grid - .5) - .5)*grid;
          float ln = exp(-min(g.x,g.y)*1.2);
          c += vec3(.010,.022,.055)*ln*.55;
          float dt = exp(-dot(g,g)*.25);
          c += vec3(.03,.07,.16)*dt*.6;
          c += lift*vec3(.004,.008,.02);
          o = vec4(c,1.);
        }`],
      cable: [`#version 300 es
        in vec2 a_pos; in vec2 a_uv; in vec3 a_col; in vec2 a_meta;
        uniform vec2 res;
        out vec2 v_uv; out vec3 v_col; out vec2 v_meta;
        void main(){ vec2 p = a_pos/res*2.-1.; p.y = -p.y; gl_Position = vec4(p,0.,1.); v_uv = a_uv; v_col = a_col; v_meta = a_meta; }`,
      `#version 300 es
        precision highp float;
        in vec2 v_uv; in vec3 v_col; in vec2 v_meta; out vec4 o;
        uniform float time; uniform sampler2D act; uniform float nCab; uniform float energy; uniform float flow;
        void main(){
          vec4 A = texture(act, vec2((v_meta.x+.5)/nCab, .5));
          float rev = A.g;
          if (v_uv.x > rev) discard;
          float d = abs(v_uv.y);
          float core = exp(-d*d*7.);
          float hair = exp(-d*d*60.);
          float s = v_uv.x*v_meta.y/110. - time*.42 + fract(v_meta.x*.618)*9.;
          float pulse = pow(.5+.5*sin(s*6.2831853), 24.) * flow;
          float head = smoothstep(rev-.06, rev, v_uv.x) * step(rev, .999) * 3.;
          float I = core*(.42 + .3*energy) + hair*1.35 + pulse*core*(1.1 + 2.4*A.r) + A.r*(core*2.4 + hair*2.4) + head*core;
          o = vec4(v_col*I, 1.);
        }`],
      pts: [`#version 300 es
        in vec2 a_pos; in float a_size; in vec4 a_col;
        uniform vec2 res;
        out vec4 v_col;
        void main(){ vec2 p = a_pos/res*2.-1.; p.y = -p.y; gl_Position = vec4(p,0.,1.); gl_PointSize = a_size; v_col = a_col; }`,
      `#version 300 es
        precision highp float;
        in vec4 v_col; out vec4 o;
        void main(){
          vec2 q = gl_PointCoord*2.-1.;
          float r2 = dot(q,q);
          if (r2 > 1.) discard;
          float core = exp(-r2*22.);
          float halo = exp(-r2*4.)*(1.-r2);
          o = vec4(v_col.rgb*v_col.a*(core*3.2 + halo*.55), 1.);
        }`],
      beam: [FS_VERT, H + `
        uniform vec2 res; uniform float x; uniform float a;
        void main(){
          float px = uv.x*res.x;
          float d = (px - x)/res.y;
          float core = exp(-d*d*9000.);
          float glow = exp(-d*d*260.);
          float wide = exp(-d*d*18.);
          vec3 c = vec3(.9,.97,1.)*core*14. + vec3(.35,.8,1.)*glow*1.8 + vec3(1.,.75,.3)*wide*.18;
          o = vec4(c*a, 1.);
        }`],
      eye: [FS_VERT, H + `
        uniform vec2 res; uniform float time; uniform float open; uniform float zoom; uniform float scan;
        #define TAU 6.2831853
        float ring(float r, float R, float w){ return exp(-pow((r-R)/w, 2.)); }
        void main(){
          vec2 p = (uv - vec2(.5,.56))*vec2(res.x/res.y, 1.);
          p /= (1. + zoom*3.2);
          float r = length(p);
          float an = atan(p.y, p.x);
          vec3 c = vec3(0.);
          // 掃描線
          c += vec3(.35,.85,1.)*exp(-pow(p.y/.0018,2.))*smoothstep(.0,.01,scan - abs(p.x)*1.2)*(1.-open)*2.5;
          // 眼眶（上下眼皮）
          float W = .44, Hh = .29*open;
          float xn = clamp(p.x/W, -1., 1.);
          float lid = Hh*pow(max(0.,1.-xn*xn), .85);
          float dl = abs(abs(p.y) - lid);
          float inside = step(abs(p.x), W)*step(abs(p.y), lid);
          c += vec3(.27,.83,1.)*exp(-dl*dl*70000.)*step(abs(p.x), W)*2.8*open;
          c += vec3(.15,.5,1.)*exp(-dl*dl*2500.)*step(abs(p.x), W)*.5*open;
          // 虹膜：三圈、方向相反地轉
          float R0 = .19;
          float rot = time*.25;
          float dash1 = step(.35, fract((an+rot)/TAU*48.));
          float dash2 = step(.5, fract((an-rot*1.6)/TAU*120.));
          float ir = ring(r, R0, .0016)*1.6 + ring(r, R0*.86, .0013)*dash1*1.8 + ring(r, R0*.72, .0011)*dash2*1.3;
          float ticks = 0.;
          float k = floor((an+3.14159)/TAU*96.);
          float len = .01 + .045*hash(vec2(k, 3.)) * (.5+.5*sin(time*1.7 + k));
          float ta = abs(fract((an+3.14159)/TAU*96.) - .5);
          ticks = step(ta, .12)*step(R0*1.02, r)*step(r, R0*1.02+len);
          vec3 irisCol = mix(vec3(.3,.85,1.), vec3(1.,.72,.2), step(.66, hash(vec2(k,9.))));
          c += (vec3(.3,.85,1.)*ir + irisCol*ticks*1.6)*inside;
          // 瞳孔
          float pr = .062 + .004*sin(time*2.);
          float po = smoothstep(.15, .9, open);
          c += vec3(.55,.9,1.)*exp(-pow(r/pr, 2.)*2.2)*(.35 + 1.1*po)*inside;
          c += vec3(.15,.5,1.)*exp(-pow(r/(pr*2.4), 2.))*(.15 + .35*po)*inside;
          c += vec3(.9,.98,1.)*exp(-pow((r - pr*.62)/(pr*.06), 2.))*1.6*po*inside;
          c *= 1. - smoothstep(pr*.5, pr*.42, r)*inside*.97;
          o = vec4(c, 1.);
        }`],
      pre: [FS_VERT, H + `
        uniform sampler2D src; uniform vec2 hp; uniform float th;
        void main(){
          vec3 c = texture(src, uv).rgb*.5 + (texture(src, uv+hp).rgb + texture(src, uv-hp).rgb + texture(src, uv+vec2(hp.x,-hp.y)).rgb + texture(src, uv-vec2(hp.x,-hp.y)).rgb)*.125;
          float br = max(c.r, max(c.g, c.b));
          float knee = th*.6;
          float s = clamp(br - th + knee, 0., 2.*knee);
          s = s*s/(4.*knee + 1e-4);
          o = vec4(c*max(s, br-th)/max(br, 1e-4), 1.);
        }`],
      down: [FS_VERT, H + `
        uniform sampler2D src; uniform vec2 hp;
        void main(){
          vec3 s = texture(src, uv).rgb*4. + texture(src, uv-hp).rgb + texture(src, uv+hp).rgb + texture(src, uv+vec2(hp.x,-hp.y)).rgb + texture(src, uv-vec2(hp.x,-hp.y)).rgb;
          o = vec4(s/8., 1.);
        }`],
      up: [FS_VERT, H + `
        uniform sampler2D src; uniform vec2 hp; uniform float w;
        void main(){
          vec3 s = texture(src, uv+vec2(-hp.x*2.,0.)).rgb + texture(src, uv+vec2(-hp.x,hp.y)).rgb*2. + texture(src, uv+vec2(0.,hp.y*2.)).rgb + texture(src, uv+vec2(hp.x,hp.y)).rgb*2.
                 + texture(src, uv+vec2(hp.x*2.,0.)).rgb + texture(src, uv+vec2(hp.x,-hp.y)).rgb*2. + texture(src, uv+vec2(0.,-hp.y*2.)).rgb + texture(src, uv+vec2(-hp.x,-hp.y)).rgb*2.;
          o = vec4(s/12.*w, 1.);
        }`],
      comp: [FS_VERT, H + `
        uniform sampler2D scene; uniform sampler2D bloom; uniform float strength; uniform float time; uniform vec2 res; uniform float flash;
        vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
        void main(){
          vec2 d = (uv-.5);
          float ca = dot(d,d)*.006;
          vec3 b = vec3(texture(bloom, uv+d*ca).r, texture(bloom, uv).g, texture(bloom, uv-d*ca).b);
          vec3 c = texture(scene, uv).rgb + b*strength;
          c += flash*vec3(.9,.97,1.);
          c = aces(c*1.05);
          c = pow(c, vec3(1./2.2));
          c *= mix(1., smoothstep(1.25, .35, length(d*vec2(1.,.9))), .55);
          c += (hash(uv*res + fract(time)*91.) - .5)/180.;
          o = vec4(c, 1.);
        }`],
    };
    const mk = (vs, fs) => {
      const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
      const p = gl.createProgram();
      gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
      return { p, u };
    };
    for (const k of Object.keys(src)) this.P[k] = mk(src[k][0], src[k][1]);
  },

  // ---------------------------------------------------------------- 畫布大小與緩衝
  tex(w, h) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, this.fmt.internal, w, h, 0, gl.RGBA, this.fmt.type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE && this.hdr) {
      this.hdr = false; this.fmt = { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE };
      gl.deleteTexture(t); gl.deleteFramebuffer(f);
      return this.tex(w, h);
    }
    return { t, f, w, h };
  },
  resize() {
    if (!this.gl) return;
    const gl = this.gl;
    const dpr = window.devicePixelRatio || 1;
    this.W = innerWidth; this.H = innerHeight;
    this.rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 10;
    // 解析度上限：太大的螢幕（4K）就降一點畫，光纜仍然銳利
    const maxPx = 2.6e6 * this.quality;
    let s = Math.min(dpr, 2) * this.quality;
    if (this.W * this.H * s * s > maxPx) s = Math.sqrt(maxPx / (this.W * this.H));
    this.sc = s;
    this.pw = Math.max(1, Math.round(this.W * s)); this.ph = Math.max(1, Math.round(this.H * s));
    this.cv.width = this.pw; this.cv.height = this.ph;
    for (const k of Object.keys(this.fbo)) { gl.deleteTexture(this.fbo[k].t); gl.deleteFramebuffer(this.fbo[k].f); }
    this.mips.forEach((m) => { gl.deleteTexture(m.t); gl.deleteFramebuffer(m.f); });
    this.fbo.scene = this.tex(this.pw, this.ph);
    this.mips = [];
    let w = this.pw >> 1, h = this.ph >> 1;
    this.bloomN = this.quality < 0.6 ? 4 : 6;
    for (let i = 0; i < this.bloomN && w > 4 && h > 4; i++) { this.mips.push(this.tex(w, h)); w >>= 1; h >>= 1; }
    if (this.cables.length) this.buildCables(this.cables);
  },

  // ---------------------------------------------------------------- 光纜
  /** list：[{x0,y0,x1,y1,col:[r,g,b],a,b}]（CSS 像素）；a/b＝兩端卡片的 id，送封包時用來找路 */
  setCables(list) {
    const old = this.cableKey;
    this.cables = list;
    this.cableKey = {};
    list.forEach((c, i) => { this.cableKey[c.a + '>' + c.b] = i; });
    const prev = this.act;
    this.nCab = Math.max(1, list.length);
    this.act = new Float32Array(this.nCab * 4);
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const j = old[c.a + '>' + c.b];
      this.act[i * 4 + 1] = prev && j != null ? prev[j * 4 + 1] : (this.revealAll ? 1 : 0);
      this.act[i * 4 + 0] = prev && j != null ? prev[j * 4] : 0;
      c.rd = c.rd || 0;
    }
    this.buildCables(list);
  },
  bez(c, t) {
    const dx = (c.x1 - c.x0) * 0.5;
    const u = 1 - t;
    const x = u * u * u * c.x0 + 3 * u * u * t * (c.x0 + dx) + 3 * u * t * t * (c.x1 - dx) + t * t * t * c.x1;
    const y = u * u * u * c.y0 + 3 * u * u * t * c.y0 + 3 * u * t * t * c.y1 + t * t * t * c.y1;
    return [x, y];
  },
  buildCables(list) {
    const gl = this.gl;
    const SEG = 44;
    const s = this.sc;
    const hw = 4.6 * s;
    const data = new Float32Array(list.length * SEG * 6 * 9);
    let k = 0;
    list.forEach((c, id) => {
      const pts = [];
      let len = 0;
      for (let i = 0; i <= SEG; i++) { const p = this.bez(c, i / SEG); pts.push([p[0] * s, p[1] * s]); if (i) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); }
      const nrm = pts.map((p, i) => {
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(SEG, i + 1)];
        let dx = b[0] - a[0], dy = b[1] - a[1];
        const l = Math.hypot(dx, dy) || 1;
        return [-dy / l, dx / l];
      });
      const col = c.col;
      const put = (p, n, u, v) => { data[k++] = p[0] + n[0] * hw * v; data[k++] = p[1] + n[1] * hw * v; data[k++] = u; data[k++] = v; data[k++] = col[0]; data[k++] = col[1]; data[k++] = col[2]; data[k++] = id; data[k++] = len / s; };
      for (let i = 0; i < SEG; i++) {
        const u0 = i / SEG, u1 = (i + 1) / SEG;
        put(pts[i], nrm[i], u0, -1); put(pts[i + 1], nrm[i + 1], u1, -1); put(pts[i + 1], nrm[i + 1], u1, 1);
        put(pts[i], nrm[i], u0, -1); put(pts[i + 1], nrm[i + 1], u1, 1); put(pts[i], nrm[i], u0, 1);
      }
    });
    this.cableVerts = k / 9;
    gl.bindVertexArray(this.vao.cable);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf.cable);
    gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, k), gl.STATIC_DRAW);
    const P = this.P.cable.p;
    const at = (name, size, off) => { const l = gl.getAttribLocation(P, name); if (l < 0) return; gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, 36, off * 4); };
    at('a_pos', 2, 0); at('a_uv', 2, 2); at('a_col', 3, 4); at('a_meta', 2, 7);
    gl.bindVertexArray(null);
    // 兩端的接點
    this.nodes = [];
    list.forEach((c) => { this.nodes.push([c.x0, c.y0, c.col], [c.x1, c.y1, c.col]); });
  },
  /** 開場：光纜依序畫出來 */
  revealCables(stagger = 0.9) {
    this.revealAll = true;
    this.cables.forEach((c, i) => { c.rd = this.t + (c.col0 || 0) * 0.22 + Math.random() * stagger * 0.4; c.rv = 0; });
    this.revealing = true;
  },

  // ---------------------------------------------------------------- 封包與火花
  /** 沿著 a→b 的光纜（沒有就臨時拉一條）送一顆光點 */
  packet(ax, ay, bx, by, col, { dur = 0.8, size = 1, onArrive, cable = -1 } = {}) {
    const path = cable >= 0 ? this.cables[cable] : { x0: ax, y0: ay, x1: bx, y1: by };
    this.packets.push({ path, cable, t: 0, dur: dur * (0.9 + Math.random() * 0.2), col, size, onArrive, trail: [] });
  },
  spark(x, y, col, n = 10, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (40 + Math.random() * 160) * power;
      this.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.4, age: 0, col, size: 3 + Math.random() * 4 });
    }
  },
  /** 開機：四周的光點往眼睛聚過去 */
  converge(n = 220) {
    const cx = this.W / 2, cy = this.H * 0.44;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.max(this.W, this.H) * (0.55 + Math.random() * 0.5);
      this.motes.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, tx: cx + Math.cos(a) * this.H * 0.2, ty: cy + Math.sin(a) * this.H * 0.2, d: 1.1 + Math.random() * 2.4, age: -Math.random() * 1.6, col: Math.random() < 0.75 ? [0.3, 0.85, 1] : [1, 0.72, 0.25] });
    }
  },
  fireBeam() { this.beam.t0 = this.t; },

  // ---------------------------------------------------------------- 每一格
  start() { if (this.running || !this.ok) return; this.running = true; this.last = performance.now(); requestAnimationFrame((t) => this.frame(t)); },
  stop() { this.running = false; },
  frame(now2) {
    if (!this.running) return;
    requestAnimationFrame((t) => this.frame(t));
    if (this.lost || document.hidden) { this.last = now2; return; }
    const dt = Math.min(0.05, (now2 - this.last) / 1000); this.last = now2; this.t += dt;
    const t0 = performance.now();
    this.update(dt);
    this.draw();
    this.adapt(performance.now() - t0, dt);
  },
  update(dt) {
    // 光纜的活化慢慢退、開場慢慢長出來
    const A = this.act;
    if (A) {
      for (let i = 0; i < this.cables.length; i++) {
        A[i * 4] = Math.max(0, A[i * 4] - dt * 0.9);
        if (this.revealing) {
          const c = this.cables[i];
          if (this.t > c.rd) A[i * 4 + 1] = Math.min(1, A[i * 4 + 1] + dt * 1.6);
        } else if (this.revealAll) A[i * 4 + 1] = 1;
      }
      if (this.revealing && this.cables.every((c, i) => A[i * 4 + 1] >= 1)) this.revealing = false;
    }
    // 封包
    for (let i = this.packets.length - 1; i >= 0; i--) {
      const p = this.packets[i];
      p.t += dt / p.dur;
      const tt = Math.min(1, p.t);
      const e = tt < 0.5 ? 2 * tt * tt : 1 - Math.pow(-2 * tt + 2, 2) / 2;
      const [x, y] = this.bez(p.path, e);
      p.trail.push([x, y]); if (p.trail.length > 16) p.trail.shift();
      p.x = x; p.y = y;
      if (p.cable >= 0 && A) A[p.cable * 4] = Math.min(1, A[p.cable * 4] + dt * 6);
      if (p.t >= 1) { this.packets.splice(i, 1); this.spark(x, y, p.col, 8, 0.7 * p.size); if (p.onArrive) p.onArrive(); }
    }
    for (let i = this.sparks.length - 1; i >= 0; i--) {
      const s = this.sparks[i];
      s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.9; s.vy *= 0.9;
      if (s.age > s.life) this.sparks.splice(i, 1);
    }
    for (let i = this.motes.length - 1; i >= 0; i--) {
      const m = this.motes[i];
      m.age += dt;
      if (m.age > m.d) this.motes.splice(i, 1);
    }
    // 開機的眼睛：還沒喚醒時半睜著呼吸；喚醒後慢慢睜開
    const B = this.boot;
    if (B.on) {
      const s = this.t - B.t0;
      const target = B.idle ? 0.15 + 0.045 * Math.sin(this.t * 1.3) : (s > 0.45 ? 1 : 0.15);
      B.open += (target - B.open) * Math.min(1, dt * (B.idle ? 3 : 2.1));
    }
    B.flash = Math.max(0, B.flash - dt * 2.4);
    this.flash = Math.max(0, this.flash - dt * 1.4);
    if (this.onFrame) this.onFrame(dt);
  },
  draw() {
    const gl = this.gl, S = this.fbo.scene;
    const res = [this.pw, this.ph];
    gl.bindFramebuffer(gl.FRAMEBUFFER, S.f);
    gl.viewport(0, 0, S.w, S.h);
    gl.disable(gl.BLEND);
    // 背景
    let P = this.P.bg;
    gl.useProgram(P.p);
    gl.uniform2f(P.u.res, S.w, S.h); gl.uniform1f(P.u.time, this.t); gl.uniform1f(P.u.grid, 4 * this.rem * this.sc); gl.uniform1f(P.u.lift, this.energy);
    gl.bindVertexArray(this.vao.empty);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    // 光纜
    if (this.cableVerts) {
      gl.bindTexture(gl.TEXTURE_2D, this.actTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.nCab, 1, 0, gl.RGBA, gl.FLOAT, this.act);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      P = this.P.cable;
      gl.useProgram(P.p);
      gl.uniform2f(P.u.res, S.w, S.h); gl.uniform1f(P.u.time, this.t); gl.uniform1i(P.u.act, 0); gl.uniform1f(P.u.nCab, this.nCab);
      gl.uniform1f(P.u.energy, this.energy); gl.uniform1f(P.u.flow, settings.fx === 'low' ? 0 : 1);
      gl.bindVertexArray(this.vao.cable);
      gl.drawArrays(gl.TRIANGLES, 0, this.cableVerts);
    }
    // 掃描光束
    const bt = (this.t - this.beam.t0) / this.beam.dur;
    if (this.beam.t0 >= 0 && bt >= 0 && bt <= 1) {
      const e = bt < 0.5 ? 2 * bt * bt : 1 - Math.pow(-2 * bt + 2, 2) / 2;
      P = this.P.beam;
      gl.useProgram(P.p);
      gl.uniform2f(P.u.res, S.w, S.h); gl.uniform1f(P.u.x, (-0.03 + 1.06 * e) * S.w); gl.uniform1f(P.u.a, Math.sin(Math.PI * bt) ** 0.6);
      gl.bindVertexArray(this.vao.empty);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    // 開機的眼睛
    if (this.boot.on) {
      P = this.P.eye;
      gl.useProgram(P.p);
      gl.uniform2f(P.u.res, S.w, S.h); gl.uniform1f(P.u.time, this.t); gl.uniform1f(P.u.open, this.boot.open); gl.uniform1f(P.u.zoom, this.boot.zoom);
      gl.uniform1f(P.u.scan, this.boot.idle ? 0.45 + 0.1 * Math.sin(this.t * 2.0) : Math.min(1, (this.t - this.boot.t0) / 0.7) * 0.6);
      gl.bindVertexArray(this.vao.empty);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    // 光點：接點、封包（含拖尾）、火花、開機聚光
    const s = this.sc;
    const pts = [];
    const push = (x, y, size, c, a) => { pts.push(x * s, y * s, size * s, c[0], c[1], c[2], a); };
    if (!this.boot.on) for (const [x, y, c] of this.nodes) push(x, y, 7, c, 0.55 + this.energy * 0.3);
    for (const p of this.packets) {
      p.trail.forEach(([x, y], k) => { const a = (k + 1) / p.trail.length; push(x, y, 10 * p.size * a + 2, p.col, a * 0.7); });
      push(p.x, p.y, 22 * p.size, p.col, 1.4);
    }
    for (const sp of this.sparks) { const a = 1 - sp.age / sp.life; push(sp.x, sp.y, sp.size * a + 1, sp.col, a * 1.2); }
    for (const m of this.motes) {
      if (m.age < 0) continue;
      const u = Math.min(1, m.age / m.d), e = u * u * u;
      for (let k = 0; k < 4; k++) {
        const uu = Math.max(0, e - k * 0.035);
        push(m.x + (m.tx - m.x) * uu, m.y + (m.ty - m.y) * uu, 6 - k, m.col, (1 - k * 0.22) * Math.sin(Math.PI * u) * 1.2);
      }
    }
    if (pts.length) {
      const arr = new Float32Array(pts);
      P = this.P.pts;
      gl.useProgram(P.p);
      gl.uniform2f(P.u.res, S.w, S.h);
      gl.bindVertexArray(this.vao.pts);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buf.pts);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
      const at = (name, size, off) => { const l = gl.getAttribLocation(P.p, name); if (l < 0) return; gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, 28, off * 4); };
      at('a_pos', 2, 0); at('a_size', 1, 2); at('a_col', 4, 3);
      gl.drawArrays(gl.POINTS, 0, arr.length / 7);
    }
    gl.disable(gl.BLEND);
    // 泛光
    const mips = this.mips;
    if (mips.length) {
      P = this.P.pre;
      gl.useProgram(P.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, mips[0].f); gl.viewport(0, 0, mips[0].w, mips[0].h);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, S.t);
      gl.uniform1i(P.u.src, 0); gl.uniform2f(P.u.hp, 0.5 / S.w, 0.5 / S.h); gl.uniform1f(P.u.th, this.hdr ? 0.55 : 0.35);
      gl.bindVertexArray(this.vao.empty);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      P = this.P.down;
      gl.useProgram(P.p);
      for (let i = 1; i < mips.length; i++) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, mips[i].f); gl.viewport(0, 0, mips[i].w, mips[i].h);
        gl.bindTexture(gl.TEXTURE_2D, mips[i - 1].t);
        gl.uniform1i(P.u.src, 0); gl.uniform2f(P.u.hp, 0.5 / mips[i - 1].w, 0.5 / mips[i - 1].h);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      P = this.P.up;
      gl.useProgram(P.p);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      for (let i = mips.length - 1; i > 0; i--) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, mips[i - 1].f); gl.viewport(0, 0, mips[i - 1].w, mips[i - 1].h);
        gl.bindTexture(gl.TEXTURE_2D, mips[i].t);
        gl.uniform1i(P.u.src, 0); gl.uniform2f(P.u.hp, 0.5 / mips[i].w, 0.5 / mips[i].h); gl.uniform1f(P.u.w, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      gl.disable(gl.BLEND);
    }
    // 合成到畫面
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.pw, this.ph);
    P = this.P.comp;
    gl.useProgram(P.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, S.t);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, mips.length ? mips[0].t : S.t);
    gl.uniform1i(P.u.scene, 0); gl.uniform1i(P.u.bloom, 1);
    gl.uniform1f(P.u.strength, mips.length ? this.strength * (1 + this.energy * 0.35) : 0);
    gl.uniform1f(P.u.time, this.t); gl.uniform2f(P.u.res, this.pw, this.ph); gl.uniform1f(P.u.flash, this.flash + this.boot.flash);
    gl.bindVertexArray(this.vao.empty);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.activeTexture(gl.TEXTURE0);
  },
  /** 太慢就自動降畫質（掛在電視上的瀏覽器有時候很弱） */
  adapt(ms, dt) {
    this.frameMs.push(dt * 1000);
    if (this.frameMs.length < 90) return;
    const avg = this.frameMs.reduce((a, b) => a + b, 0) / this.frameMs.length;
    this.frameMs = [];
    if (avg > 26 && this.quality > 0.5) { this.quality = Math.max(0.5, this.quality - 0.25); this.resize(); }
  },
};

  // ================================================================ 光纜路線
  cardsIn(i) {

  },
  computeCables() {
    if (document.documentElement.classList.contains('stack')) { GLX.ok && GLX.setCables([]); return; }
    const cols = [0, 1, 2, 3, 4, 5].map((i) => this.cardsIn(i));
    const list = [];
    const seen = new Set();
    const port = (el, side, k, n) => { const r = el.getBoundingClientRect(); return [side === 'r' ? r.right : r.left, r.top + r.height * (0.28 + 0.44 * (n > 1 ? k / (n - 1) : 0.5))]; };
    const link = (a, b, ci, col) => {
      if (!a || !b) return;
      const key = a.id + '>' + b.id;
      if (seen.has(key)) return; seen.add(key);
      list.push({ a: a.id, b: b.id, col, col0: ci, x0: 0, y0: 0, x1: 0, y1: 0, ea: a, eb: b });
    };
    const colorOf = (el, i) => { const c = getComputedStyle(el).getPropertyValue('--c').trim(); return c && c.startsWith('#') ? c : NEON_LIST[i % NEON_LIST.length]; };
    // 01 → 02：照真的資料流向（哪個來源餵哪一項核對）
    const SRC_LINKS = { mis_etf: ['dual', 'prem'], twse_daily: ['close', 'taiex'], tpex_daily: ['close'], twse_flows: ['taiex'], twse_mflows: ['taiex'], sitca: ['prem'], twse_margin: ['src'], tpex_flows: ['src'], tpex_margin: ['src'], tdcc: ['src'], ust: ['ver'], twse_div: ['ver'], tpex_div: ['ver'], twse_risk: ['src'], tpex_risk: ['src'], stocks: ['ver'] };
    const NEWS_SRC = ['twse_news', 'cna', 'fsc', 'cbc'];
    cols[0].forEach((el, i) => {
      const key = el.id.replace('src-', '');
      const col = colorOf(el, i);
      if (NEWS_SRC.includes(key)) { link(el, $('#nsum'), 0, col); return; }
      (SRC_LINKS[key] || ['src']).forEach((t) => link(el, $('#chk-' + t), 0, col));
    });
    // 其他相鄰兩欄：平均交錯地接起來
    const weave = (a, b, per) => {
      const L = cols[a], R = cols[b];
      if (!L.length || !R.length) return;
      L.forEach((el, i) => {
        const col = colorOf(el, i);
        const j0 = Math.floor(i * R.length / L.length);
        for (let k = 0; k < per; k++) link(el, R[(j0 + k * Math.max(1, Math.ceil(R.length / 3))) % R.length], a, col);
      });
    };
    weave(1, 2, 2); weave(2, 3, 2); weave(3, 4, 2); weave(4, 5, 2);
    // 算座標（同一張卡片的多條線錯開）
    const outs = {}, ins = {};
    list.forEach((c) => { (outs[c.a] = outs[c.a] || []).push(c); (ins[c.b] = ins[c.b] || []).push(c); });
    Object.values(outs).forEach((arr) => arr.forEach((c, k) => { [c.x0, c.y0] = port(c.ea, 'r', k, arr.length); }));
    Object.values(ins).forEach((arr) => arr.forEach((c, k) => { [c.x1, c.y1] = port(c.eb, 'l', k, arr.length); }));
    const out = list.map((c) => ({ a: c.a, b: c.b, col: hexRGB(c.col), col0: c.col0, x0: c.x0, y0: c.y0, x1: c.x1, y1: c.y1 }));
    if (GLX.ok) GLX.setCables(out);
    this.layoutDirty = false;
  },

  // ================================================================ 小工具
  hit(node) { if (!node || !node.classList) return; node.classList.remove('hit'); void node.offsetWidth; node.classList.add('hit'); },
  tab(i, text, frac) {

    const r = $('#tr' + i); if (r) r.style.width = (clamp(frac || 0, 0, 1) * 100).toFixed(0) + '%';
  },
  stage(i) { const s = $('#tab' + i); if (!s) return; s.classList.add('on'); clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove('on'), 900); },
  toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms); },
  beam(sound = true) {
    if (settings.fx === 'low' || reducedMotion()) return;
    const b = $('#beam'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
    if (GLX.ok) GLX.fireBeam();
    if (sound) AU.sfx('scan', { gain: 0.9 });
  },
};

/* ---- replay.js ---- */
/* 全知 OMNISCIENT — 回放：把某一天真的發生過的事，照時間順序重新演一次
   - 價格：冷眼記下的當天每一輪整股行情（spark.json），回放到幾點就只顯示幾點以前的成交
   - 新聞：冷眼收到的公告與新聞，照發布時間出現
   - 官方資料：各來源當天實際同步成功的時間
   不在資料裡的東西（例如盤中的加權指數）不會被畫出來。 */

const RP = {
  active: false, playing: false, day: null, p: 0, events: [], fired: 0, endMin: 1440, raf: 0, last: 0,
  hi: {}, lo: {}, hiN: 0, opened: {}, reported: false, loopTimer: 0,
  // 進度（0～1）對應到當天幾點：盤前 07:00 起 5%、盤中 80%、盤後 15%（07:00 以前的新聞一開始就已經在畫面上）
  SEG: [[0, 0.05, 420, 540], [0.05, 0.85, 540, 810], [0.85, 1, 810, null]],
  get dur() { return 180 / (settings.speed || 1); },

  minuteOf(p) {
    for (const [a, b, m0, m1] of this.SEG) {
      const end = m1 == null ? this.endMin : m1;
      if (p <= b) return m0 + (end - m0) * clamp((p - a) / (b - a), 0, 1);
    }
    return this.endMin;
  },
  progressOf(m) {
    if (m < this.SEG[0][2]) return 0;
    for (const [a, b, m0, m1] of this.SEG) {
      const end = m1 == null ? this.endMin : m1;
      if (m <= end) return a + (b - a) * clamp((m - m0) / (end - m0 || 1), 0, 1);
    }
    return 1;
  },
  dayMin(ms) { const t = tw(ms); return t.hh * 60 + t.mi + t.ss / 60; },

  build(day) {
    const ev = [];
    const t = tw();
    this.endMin = day === t.ymd ? Math.max(820, Math.min(1440, t.hh * 60 + t.mi)) : 1440;
    // 時段
    ev.push({ m: 540, type: 'open' });
    ev.push({ m: 805, type: 'auction' });
    ev.push({ m: 810, type: 'close' });
    // 新聞與公告
    for (const x of newsOn(day)) {
      const m = x.timed ? this.dayMin(x.ms) : 480;
      if (m <= this.endMin) ev.push({ m, type: 'news', item: x });
    }
    // 官方來源當天同步成功的時間
    for (const s of sourcesList()) {
      if (isFinite(s.ok) && ymdOf(s.ok) === day) { const m = this.dayMin(s.ok); if (m <= this.endMin) ev.push({ m, type: 'src', src: s }); }
    }
    // 收盤批次（規則重新計算）
    if (D.summary && D.summary.asof === day) { const g = parseTs(D.summary.generated); if (isFinite(g) && ymdOf(g) === day) ev.push({ m: this.dayMin(g), type: 'eod' }); }
    // 自選每一檔的每一筆盤中紀錄
    for (const c of watchCodes()) for (const [mm, px] of sparkOf(c)) ev.push({ m: 540 + mm, type: 'px', code: c, px });
    ev.sort((a, b) => a.m - b.m || (a.type === 'px') - (b.type === 'px'));
    this.events = ev;
  },

  start(day, { at = 0, play = true } = {}) {
    this.stop(true);
    this.active = true; this.day = day; this.reported = false;
    this.build(day);
    $('#report').hidden = true;
    UI.view = { mode: 'replay', day, minute: -9999 };
    this.seek(at, true);
    this.playing = play;
    this.last = performance.now();
    this.loop();
    this.renderBar();
    bus.emit('replay-start', day);
  },
  stop(silent) {
    cancelAnimationFrame(this.raf); clearTimeout(this.loopTimer);
    const was = this.active;
    this.active = false; this.playing = false;
    if (was && !silent) { UI.view = { mode: 'live', minute: null, day: null }; bus.emit('replay-stop'); }
    this.renderBar();
  },
  toggle() { if (!this.active) return; if (this.p >= 1) { this.start(this.day); return; } this.playing = !this.playing; this.last = performance.now(); this.renderBar(); },
  loop() {
    cancelAnimationFrame(this.raf);
    const step = (t) => {
      if (!this.active) return;
      const dt = Math.min(0.1, (t - this.last) / 1000); this.last = t;
      if (this.playing && !document.hidden) {
        this.p = Math.min(1, this.p + dt / this.dur);
        this.fireUpTo(this.minuteOf(this.p), false);
        if (this.p >= 1) { this.playing = false; this.finish(); }
      }
      this.renderBar(true);
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  /** 走到 minute：把中間的事件依序觸發（silent＝拖動進度條時不放特效） */
  fireUpTo(minute, silent) {
    const prevSession = UI.view.minute;
    UI.view.minute = minute - 540;
    const fired = [];
    while (this.fired < this.events.length && this.events[this.fired].m <= minute) { fired.push(this.events[this.fired]); this.fired++; }
    const pxCodes = new Set();
    for (const ev of fired) {
      if (ev.type === 'px') { pxCodes.add(ev.code); this.trackExtremes(ev, silent); continue; }
      bus.emit('replay-event', { ev, silent });
    }
    if (pxCodes.size) bus.emit('replay-px', { codes: Array.from(pxCodes), silent });
    if (Math.floor(prevSession / 2) !== Math.floor(UI.view.minute / 2) || fired.length) bus.emit('replay-time', { silent });
  },
  trackExtremes(ev, silent) {
    const c = ev.code;
    if (!this.opened[c]) { this.opened[c] = ev.px; this.hi[c] = ev.px; this.lo[c] = ev.px; return; }
    const m = ev.m - 540;
    if (ev.px > this.hi[c] * 1.003 && m >= 30 && c === watchCodes()[0] && this.hiN < 4) { this.hiN++; bus.emit('replay-event', { ev: { m: ev.m, type: 'high', code: c, px: ev.px }, silent }); }
    if (ev.px < this.lo[c] * 0.997 && m >= 30 && c === watchCodes()[0] && this.hiN < 4) { this.hiN++; bus.emit('replay-event', { ev: { m: ev.m, type: 'low', code: c, px: ev.px }, silent }); }
    this.hi[c] = Math.max(this.hi[c], ev.px); this.lo[c] = Math.min(this.lo[c], ev.px);
  },
  seek(p, silent = true) {
    p = clamp(p, 0, 1);
    this.p = p;
    this.fired = 0; this.hi = {}; this.lo = {}; this.opened = {}; this.hiN = 0;
    UI.shownNews = new Set(); UI.newsReady = false;
    UI.clearLog();
    UI.view.minute = -9999;
    this.fireUpTo(this.minuteOf(p), true);
    UI.newsReady = true;
    bus.emit('replay-seek');
    this.renderBar();
    if (p < 1) { this.reported = false; $('#report').hidden = true; }
  },
  finish() {
    if (this.reported) return;
    this.reported = true;
    bus.emit('replay-end', this.day);
  },

  // ---------------------------------------------------------------- 底列的回放控制
  renderBar(light) {
    const rp = $('#rp');
    if (!rp) return;
    if (!this.active) {
      const ph = marketPhase();
      const day = D.spark && D.spark.d;
      const h = `${day ? `<button type="button" class="rb" data-act="replay" title="回放（R）"><svg viewBox="0 0 16 16"><path d="M4 3v10l9-5z"/></svg></button><span class="rl2">${ph.phase === 'open' ? '盤中即時 · 回看今天到現在' : `回放 ${dateText(day)}（${WD[weekday(day)]}）整天`}</span>` : '<span class="rl2">還沒有可以回放的交易日</span>'}`;
      if (rp.dataset.h !== h) { rp.innerHTML = h; rp.dataset.h = h; }
      return;
    }
    const minute = this.minuteOf(this.p);
    const label = `${minute < 540 ? '盤前' : minute <= 810 ? '盤中' : '盤後'} ${hmText(ymdToMs(this.day, 0, 0) + minute * 60e3)}`;
    if (light && rp.dataset.ready === this.day + ':' + settings.speed + ':' + this.playing + ':' + (this.p >= 1)) {
      $('.sf', rp).style.width = (this.p * 100).toFixed(2) + '%';
      $('.sh', rp).style.left = (this.p * 100).toFixed(2) + '%';
      $('.rl2', rp).textContent = `回放 ${dateText(this.day)} · ${label}`;
      return;
    }
    const marks = this.events.filter((e) => e.type === 'news').map((e) => `<i class="mk${e.item.kind === 'opinion' ? ' op' : ''}" style="left:${(this.progressOf(e.m) * 100).toFixed(2)}%"></i>`).join('');
    const ticks = [[540, '09:00'], [660, '11:00'], [810, '13:30'], [this.endMin, this.endMin >= 1440 ? '24:00' : hmText(ymdToMs(this.day, 0, 0) + this.endMin * 60e3)]].map(([m, t]) => `<span class="tk" style="left:${(this.progressOf(m) * 100).toFixed(1)}%">${t}</span>`).join('');
    const ph = marketPhase();
    rp.innerHTML = `<button type="button" class="rb" data-act="play" title="播放／暫停（空白鍵）">${this.playing ? '<svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>' : '<svg viewBox="0 0 16 16"><path d="M4 3v10l9-5z"/></svg>'}</button>`
      + `<button type="button" class="rs" data-act="speed" title="回放速度">${settings.speed}×</button>`
      + `<span class="rl2">回放 ${dateText(this.day)} · ${label}</span>`
      + `<div class="scrub" id="scrub"><i class="sk"></i>${marks}<i class="sf" style="width:${(this.p * 100).toFixed(2)}%"></i><i class="sh" style="left:${(this.p * 100).toFixed(2)}%"></i>${ticks}</div>`
      + `<button type="button" class="golive" data-act="live">${ph.phase === 'open' ? '● 回到即時' : '看最新資料'}</button>`;
    rp.dataset.ready = this.day + ':' + settings.speed + ':' + this.playing + ':' + (this.p >= 1);
    rp.dataset.h = '';
    const sc = $('#scrub', rp);
    const drag = (e) => { const r = sc.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; this.seek(x / r.width, true); };
    sc.addEventListener('pointerdown', (e) => { drag(e); sc.setPointerCapture(e.pointerId); const mv = (ev) => drag(ev); const up = () => { sc.removeEventListener('pointermove', mv); sc.removeEventListener('pointerup', up); }; sc.addEventListener('pointermove', mv); sc.addEventListener('pointerup', up); });
  },
};

/* ---- main.js ---- */
/* 全知 OMNISCIENT v2 — 開機、即時／回放兩種模式、事件 → 光纜上的光點、聲音與畫面 */

const APP = { booted: false, wake: null, lastPx: 0, lastSec: null, stack: false };

// ---------------------------------------------------------------- 版面
function layoutMode() {
  const stack = innerWidth < 1000 || innerWidth / innerHeight < 1.15;
  APP.stack = stack;
  document.documentElement.classList.toggle('stack', stack);
}
let cableT = 0;
function scheduleCables() { cancelAnimationFrame(cableT); cableT = requestAnimationFrame(() => requestAnimationFrame(() => UI.computeCables())); }

// ---------------------------------------------------------------- 光點（沿著光纜送；兩張卡片之間沒有光纜就臨時拉一條）
const FX = {
  send(a, b, hex, { dur = 0.8, size = 1, onArrive } = {}) {
    if (!a || !b || !GLX.ok || APP.stack || settings.fx === 'low' && GLX.packets.length > 10) { if (onArrive) onArrive(); return; }
    const col = hexRGB(hex);
    const ci = GLX.cableKey[a.id + '>' + b.id];
    if (ci != null) { GLX.packet(0, 0, 0, 0, col, { cable: ci, dur, size, onArrive }); return; }
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    if (!ra.height || !rb.height) { if (onArrive) onArrive(); return; }
    const fwd = rb.left >= ra.right - 4;
    GLX.packet(fwd ? ra.right : ra.left + ra.width / 2, ra.top + ra.height / 2, fwd ? rb.left : rb.left + rb.width / 2, rb.top + rb.height / 2, col, { dur, size, onArrive });
  },
  /** 一站一站傳下去：每到一站，那張卡片就閃一下、發一聲很輕的「滴」（對齊配樂的拍子） */
  chain(els, hex, opts = {}) {
    const list = els.filter(Boolean);
    const step = (i) => {
      if (i >= list.length - 1) { if (opts.done) opts.done(); return; }
      this.send(list[i], list[i + 1], hex, {
        dur: opts.dur || 0.75, size: opts.size || 1,
        onArrive: () => {
          const n = list[i + 1];
          UI.hit(n.closest('.cd') || n);
          const col = n.closest('[data-col]');
          if (col) UI.stage(+col.dataset.col);
          AU.sfx('tick' + (1 + (i % 3)), { quant: true, gain: 0.55, pan: AU.panOf(n), gate: 45 });
          if (opts.each) opts.each(i + 1, n);
          step(i + 1);
        },
      });
    };
    step(0);
  },
};

function handleReplayEvent(ev, silent) {

  switch (ev.type) {
    case 'open':
      replayLog('core', '09:00 開盤 · 證交所開始逐筆撮合', ev.m, true);

    case 'auction': replayLog('core', '13:25 收盤前集合競價', ev.m); break;
    case 'close': {
      const q = quoteAt(first, 270);
      replayLog('core', `13:30 收盤 · ${first} ${fmtPx(q.px)}（${fmtPct(q.pct)}）`, ev.m, true);
      const tx = taiex();
      if (tx && tx.date === RP.day) replayLog('ingest', `加權指數收 ${fmtPx(tx.v)}（${fmtPct(tx.pct)}）`, ev.m, true);
      if (!silent) { UI.beam(); AU.sfx(q && q.chg >= 0 ? 'chime_up' : 'chime_down', { gain: 0.85 }); UI.renderTop(); }

    }
    case 'news': replayLog('filter', `［${KIND_INFO[ev.item.kind].short}］${ev.item.srcName}：${ev.item.t}`, ev.m, ev.item.kind === 'official'); break;
    case 'src':

    case 'eod':

      if (!silent) { UI.beam(); AU.sfx('burst', { gain: 0.8 }); FX.chain([byId('j-r'), byId('tile-' + first), byId('g-br')], '#ffd23d', { dur: 0.9, size: 1.3 }); }
      break;
    case 'high': case 'low':
      replayLog('core', `${ev.code} ${ev.type === 'high' ? '衝上今日新高' : '跌到今日新低'} ${fmtPx(ev.px)}`, ev.m);
      if (!silent) { UI.hit(byId('tile-' + ev.code)); AU.sfx(ev.type === 'high' ? 'blip2' : 'blip1', { gain: 0.7, quant: true, pan: AU.panOf(byId('tile-' + ev.code)) }); }
      break;
    default:
  }
}

  lsSet('bootDay', tw().ymd);

  let skipped = false, loaded = 0;

    if (!show) return;

    while (logEl.children.length > 12) logEl.firstChild.remove();
    AU.sfx('tick' + (1 + (logEl.children.length % 3)), { gain: 0.35, gate: 30 });
  };
  const t0 = performance.now();
  if (show) {
    bootEl.hidden = false;

  } else { GLX.boot.on = false; }

    loaded++;

    const tag = !r.ok ? '<span class="bad">OFFLINE</span>' : r.offline ? '<span class="wr">CACHE</span>' : '<span class="okk">OK</span>';

    else if (name === 'live' && D.live) say(`&gt; LOAD  盤中行情 ${stampText(parseTs(D.live.at))} · ${Object.keys(D.live.etfs || {}).length} 檔 ···· ${tag}`);
    else if (name === 'news' && D.news) { const c = kindCounts(newsAll()); say(`&gt; SCAN  公告與新聞 ${D.news.items.length} 則（官方 ${c.official}・事實 ${c.fact}・觀點 ${c.opinion}）···· ${tag}`); }
    else if (name === 'global' && D.global) say(`&gt; LOAD  全球市場 · 溫度「${esc((D.global.temp || {}).level || '—')}」···· ${tag}`);
    else if (name === 'spark' && D.spark) say(`&gt; LOAD  ${dateText(D.spark.d)} 盤中走勢 · ${Object.keys(D.spark.s || {}).length} 檔 ···· ${tag}`);
    else if (!r.ok) say(`&gt; ${FILE_NAMES[name] || name} ···· ${tag}`);
  });
  const ok = !!D.summary;
  const codes0 = ok ? watchCodes() : [];
  if (ok) {

    const C = verifyChecks();

function reveal(ok) {
  document.body.classList.add('ready');

  if (!ok) { UI.renderMode(); UI.toast('連不上冷眼的資料', 6000); schedule(); return; }

  else renderAll();
  UI.setFocus(codes[0]);
  // 卡片一欄一欄閃進來，光纜跟著畫出來
  requestAnimationFrame(() => {
    $$('#cols .col').forEach((col, ci) => $$('.cd', col).forEach((c, k) => { c.style.animationDelay = (ci * 0.11 + k * 0.035).toFixed(3) + 's'; c.classList.add('in'); }));
    $$('#bottom .pn, #top > *').forEach((c, k) => { c.style.animation = `cardIn .7s steps(1,end) ${(0.5 + k * 0.05).toFixed(2)}s both`; });
    setTimeout(() => { $$('.cd.in').forEach((c) => { c.classList.remove('in'); c.style.animationDelay = ''; }); }, 2200);
    for (let i = 0; i < 6; i++) setTimeout(() => { UI.stage(i); AU.sfx('panel' + (i + 1), { gain: 0.7, pan: -0.8 + i * 0.32 }); }, 90 + i * 115);
    UI.computeCables();
    if (GLX.ok) GLX.revealCables(0.8);
  });
  setTimeout(() => {
    UI.beam();
    if (!RP.active) {
      UI.log('core', `全知上線 · 盤中即時 · 自選 ${codes.join('、')}`, { hl: true });
      FX.chain([byId('src-mis_etf'), byId('chk-dual'), byId('nsum'), byId('j-k'), byId('tile-' + codes[0]), byId('g-tx')], '#00e5ff', { dur: 0.7 });
    } else { RP.playing = true; RP.last = performance.now(); RP.renderBar(); }
    APP.booted = true;
  }, 1100);
  schedule();
  requestWake();
}

// ---------------------------------------------------------------- 每一格：泛光跟著配樂呼吸、換段落時亮一下（純裝飾，不碰數字、不放光點）
GLX.onFrame = (dt) => {
  GLX.surge = Math.max(0, (GLX.surge || 0) - dt * 0.8);
  GLX.energy = settings.fx === 'low' ? 0 : Math.min(1.6, AU.pulse(dt) + GLX.surge);
  const sec = AU.section();
  if (sec && sec !== APP.lastSec) {
    if (APP.lastSec && APP.booted && (sec === 'A' || sec === 'B' || sec === 'drop')) GLX.surge = sec === 'drop' ? 1 : 0.6;
    APP.lastSec = sec;
  }
};

// ---------------------------------------------------------------- 定時工作
let scheduled = false;
function schedule() {
  if (scheduled) return; scheduled = true;
  setInterval(() => { UI.renderMode(); }, 1000);
  setInterval(async () => { if (!document.hidden) await poll(); }, 60e3);
  // 「判斷」那一欄輪流看每一檔自選（只是換顯示，不是新資料，所以不放光點）
  setInterval(() => { if (!document.hidden && APP.booted) UI.nextFocus(); }, 14e3);
  setInterval(() => { if (!document.hidden && APP.booted) { UI.renderSources(); UI.renderVerify(); UI.renderTop(); UI.renderGlobal(); scheduleCables(); } }, 30e3);
  let lastPhase = marketPhase().phase;
  setInterval(() => {
    const ph = marketPhase();
    if (ph.phase === lastPhase) return;
    const prev = lastPhase; lastPhase = ph.phase;
    if (ph.phase === 'open' && RP.active) { RP.stop(); UI.toast('開盤了，切到盤中即時'); poll(); }
    if (prev === 'open' && ph.phase === 'post') { UI.log('core', '收盤 · 等證交所收盤資料（約 14:30 以後）', { hl: true }); renderAll(); }
  }, 20e3);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && APP.booted) { poll(); requestWake(); } });
async function requestWake() {
  if (!settings.wake || !('wakeLock' in navigator) || document.hidden) return;
  try { APP.wake = await navigator.wakeLock.request('screen'); } catch { /* 不支援就算了 */ }
}
function toggleFullscreen() {
  const d = document, e = d.documentElement;
  const fs = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (fs) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (e.requestFullscreen) e.requestFullscreen({ navigationUI: 'hide' }).catch(() => UI.toast('這個瀏覽器不支援全螢幕'));
    else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen();
    else UI.toast('iPhone 可以「加入主畫面」後從主畫面打開');
  } catch { UI.toast('這個瀏覽器不支援全螢幕'); }
}
function toggleSound() {
  AU.unlock();
  settings.sound = !settings.sound; saveSettings(); AU.setVolumes();
  $('[data-act=snd]').classList.toggle('off', !settings.sound);
  UI.toast(settings.sound ? '聲音開' : '聲音關');
}
function goLive() {
  $('#report').hidden = true;
  clearTimeout(RP.loopTimer);
  if (RP.active) RP.stop(); else renderAll();
  UI.log('core', marketPhase().phase === 'open' ? '回到盤中即時' : '顯示最新資料', { hl: true });
}

// ---------------------------------------------------------------- 設定
function renderDrawer() {
  const dr = $('#drawer');
  const cw = coldeyeWatch();
  const seg = (key, opts) => `<div class="seg" data-key="${key}">${opts.map(([v, t]) => `<button type="button" data-v="${v}" class="${String(settings[key]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  dr.innerHTML = `<h3>設定<button type="button" data-act="close" aria-label="關閉">×</button></h3>
    <div class="sg"><span class="sgt">WATCH · 自選（「結論」那六格）</span>${seg('watchMode', [['coldeye', '跟冷眼一樣'], ['custom', '自己挑']])}
      ${settings.watchMode === 'coldeye' ? `<p>${cw ? `讀到這台裝置上冷眼的自選：${cw.map(esc).join('、')}（最多顯示 6 檔）` : '這個瀏覽器裡還沒有冷眼的自選（冷眼要在同一個瀏覽器打開過），先用預設：' + DEFAULTS.watch.join('、')}</p>` : `<input type="text" id="watchIn" value="${esc(settings.watch.join(', '))}" placeholder="例如 0050, 00878, 0056"><p>用逗號或空白分開，最多 6 檔；只認冷眼有收錄的 ETF。</p>`}</div>
    <div class="sg"><span class="sgt">SOUND · 聲音</span>${seg('sound', [['true', '開'], ['false', '關']])}
      <label>配樂</label>${seg('music', [['true', '主題配樂：開'], ['false', '關']])}<input type="range" id="musicVol" min="0" max="1" step="0.05" value="${settings.musicVol}">
      <label>音效</label><input type="range" id="sfxVol" min="0" max="1" step="0.05" value="${settings.sfxVol}"><p>配樂與音效都是全知自己的（D 小調、100 BPM）；音效會對齊配樂的拍子落下。</p></div>
    <div class="sg"><span class="sgt">FX · 特效</span>${seg('fx', [['full', '全開'], ['std', '標準'], ['low', '省電']])}<p>電視或比較弱的電腦卡卡的話選「標準」或「省電」；太慢時也會自動降一級。</p></div>
    <div class="sg"><span class="sgt">REPLAY · 回放</span>${seg('speed', [[0.5, '6 分鐘'], [1, '3 分鐘'], [2, '90 秒'], [4, '45 秒']])}${seg('loop', [['true', '播完自動重播'], ['false', '播完停住']])}</div>
    <div class="sg"><span class="sgt">BOOT · 開機動畫</span>${seg('boot', [['always', '每次'], ['daily', '每天第一次'], ['off', '不要']])}</div>
    <div class="sg"><span class="sgt">SCREEN · 螢幕</span>${seg('wake', [['true', '保持常亮'], ['false', '照系統設定']])}<p>快速鍵：F 全螢幕、M 聲音、空白鍵 播放／暫停、← → 快轉、R 回放、L 最新資料、S 設定、↑↓ 換焦點。</p></div>
    <div class="sg"><span class="sgt">INTEGRITY · 正確性鐵律</span><div class="rulebox"><ol>
      <li>每個數字都來自冷眼的公開資料，旁邊標來源與時間。</li>
      <li>資料過期會變色；抓不到就標「斷線」，不拿舊數字假裝新的、不用亂數補。</li>
      <li>動畫不產生數字：明亮的光點只在真的有事件時才出現（資料進來、核對完成、新聞蓋章、回放走到那一刻）；光纜上緩慢流動的微光、跟著配樂呼吸的泛光只是裝飾；「判斷」欄每 14 秒換看下一檔只是換顯示。</li>
      <li>回放只演當天真的發生過的事；盤中沒有逐筆紀錄的東西（例如盤中加權指數）不會畫出來。</li>
      <li>沒有任何假的獲利數字。</li></ol>
      <p style="margin-top:1rem">全知只讀冷眼公開出來的資料，不會修改冷眼，也不讀你在冷眼裡記的持股。要即時、要記帳，請用 <a href="${COLDEYE_URL}" target="_blank" rel="noopener">冷眼</a>。個人研究用途，不是投資建議。</p></div></div>
    <div class="sg"><p>全知 OMNISCIENT v${VERSION} · ${GLX.ok ? 'WebGL2' + (GLX.hdr ? ' HDR' : '') : '簡化畫面'} · 資料 ${esc(DATA_BASE)}</p></div>`;
  dr.hidden = false;
  $$('.seg', dr).forEach((s) => s.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const k = s.dataset.key; let v = b.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false; else if (k === 'speed') v = +v;
    settings[k] = v; saveSettings(); AU.sfx('click', { gain: 0.8 });
    if (k === 'sound' || k === 'music') { AU.unlock(); AU.setVolumes(); $('[data-act=snd]').classList.toggle('off', !settings.sound); }
    if (k === 'fx') { GLX.quality = v === 'low' ? 0.5 : v === 'std' ? 0.75 : 1; GLX.resize(); }
    if (k === 'watchMode') { UI.focus = watchCodes()[0]; renderAll(); UI.setFocus(UI.focus); if (RP.active) RP.start(RP.day, { at: RP.p }); }
    if (k === 'speed') RP.renderBar();
    if (k === 'wake' && v) requestWake();
    renderDrawer();
  }));
  const wi = $('#watchIn');
  if (wi) wi.addEventListener('change', () => {
    const list = wi.value.toUpperCase().split(/[\s,，、]+/).filter(Boolean).filter((c) => D.map[c]).slice(0, 6);
    if (!list.length) { UI.toast('沒有認得的代號，維持原本的自選'); return; }
    settings.watch = list; saveSettings();
    UI.focus = watchCodes()[0]; renderAll(); UI.setFocus(UI.focus);
    if (RP.active) RP.start(RP.day, { at: RP.p });
    UI.toast('自選已更新：' + list.join('、'));
  });
  const mv = $('#musicVol'); if (mv) mv.addEventListener('input', () => { settings.musicVol = +mv.value; saveSettings(); AU.setVolumes(); });
  const sv = $('#sfxVol'); if (sv) sv.addEventListener('input', () => { settings.sfxVol = +sv.value; saveSettings(); AU.setVolumes(); AU.sfx('tick2', { gain: 1 }); });
}

// ---------------------------------------------------------------- 輸入
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'fs') toggleFullscreen();
  else if (a === 'snd') toggleSound();
  else if (a === 'set') { AU.sfx('click'); if ($('#drawer').hidden) renderDrawer(); else $('#drawer').hidden = true; }
  else if (a === 'close') $('#drawer').hidden = true;
  else if (a === 'play') { AU.sfx('click'); RP.toggle(); }
  else if (a === 'speed') { const sp = [0.5, 1, 2, 4]; settings.speed = sp[(sp.indexOf(settings.speed) + 1) % sp.length]; saveSettings(); AU.sfx('click'); RP.renderBar(); }
  else if (a === 'replay') { AU.sfx('click'); if (D.spark && D.spark.d) RP.start(D.spark.d); }
  else if (a === 'live') { AU.sfx('click'); goLive(); }
  else if (a === 'again') { AU.sfx('click'); $('#report').hidden = true; RP.start(RP.day); }
});
document.addEventListener('keydown', (e) => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if ($('#gate') && !$('#gate').classList.contains('gone')) { if (k === ' ' || k === 'enter') { e.preventDefault(); awaken(); } return; }
  if (k === 'f') toggleFullscreen();
  else if (k === 'm') toggleSound();
  else if (k === 's') { if ($('#drawer').hidden) renderDrawer(); else $('#drawer').hidden = true; }
  else if (k === 'escape') { $('#drawer').hidden = true; $('#report').hidden = true; }
  else if (k === ' ') { e.preventDefault(); if (RP.active) RP.toggle(); else if (D.spark && D.spark.d) RP.start(D.spark.d); }
  else if (k === 'arrowright' && RP.active) RP.seek(RP.p + 0.04, true);
  else if (k === 'arrowleft' && RP.active) RP.seek(RP.p - 0.04, true);
  else if (k === 'r' && D.spark && D.spark.d) RP.start(D.spark.d);
  else if (k === 'l') goLive();
  else if (k === 'arrowdown') UI.nextFocus(true);
  else if (k === 'arrowup') { const c = watchCodes(); UI.setFocus(c[(c.indexOf(UI.focus) - 1 + c.length) % c.length], true); }
});

// ---------------------------------------------------------------- 啟動
function main() {
  layoutMode();
  UI.build();
  const ok = GLX.init($('#gl'));
  if (!ok) { $('#gl').hidden = true; document.body.style.background = 'radial-gradient(120rem 70rem at 50% 40%, #0a1630, #02040a)'; }
  else GLX.start();
  AU.prepare();
  $('[data-act=snd]').classList.toggle('off', !settings.sound);
  $('#gate').addEventListener('click', awaken);
  let rz = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      const was = APP.stack; layoutMode();
      if (GLX.ok) GLX.resize();
      if (was !== APP.stack && APP.booted) renderAll();
      scheduleCables();
      if (APP.booted) { UI.renderTiles(true); UI.renderTape(); if (UI.focus) UI.renderJudge(UI.focus); }
    }, 180);
  });
  if (!window.OMNI_NO_SW && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (QS.get('auto') === '1' && !IS_PROD) setTimeout(awaken, 60);
}
main();

</script>
