    L.dead = true;
    try { L.inst.destroy && L.inst.destroy(); } catch (e) { console.error(e); }
    for (const off of L.offs) { try { off(); } catch (e) { /* ignore */ } }
    L.root.remove();
  }

  async function show(id, opts) {
    opts = opts || {};

    const prev = top();

    return L;
  }

  function frame(dt, t) {
    for (const L of layers) {
      if (L.dead) continue;
      try { L.inst.frame && L.inst.frame(dt, t, R.viz); } catch (e) { console.error('frame', L.def.id, e); L.inst.frame = null; }

    current: () => (top() ? top().def : null),
    root: () => (top() ? top().root : null),
    sfx: (n) => { const L = top(); R.sfx.play(n, L ? L.def.sfx : null); },

R.loop = (() => {
  let last = 0, on = false;
  function frame(now) {
    if (!on) return;
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, Math.max(0.001, (now - (last || now - 16)) / 1000)); last = now;
    R.qualityMonitor(dt);
    R.viz.update(dt);
    R.stage.frame(dt, now / 1000);
  }
  const start = () => { if (on) return; on = true; last = 0; requestAnimationFrame(frame); };
  const stop = () => { on = false; };
  document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
  return { start, stop };
})();

      </div>`;
    const bg = api.canvas(root.querySelector('.gl-bg'), { dprMax: 1, scale: 0.5, alpha: false });
    const sp = api.canvas(root.querySelector('.gl-spec'));
    const blur = document.createElement('canvas'); blur.width = blur.height = 128;
    let pal = api.colors(), hasArt = false, fade = 0;
    const B = [0, 1, 2, 3].map((i) => ({ s: i * 13.7 }));

    function makeBlur(im) {
      // repeated down/up scaling is a cheap gaussian: no CSS blur filter on a full-screen layer
      const a = document.createElement('canvas'), b = document.createElement('canvas');

      const x = blur.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      const m = document.createElement('canvas'); m.width = m.height = 24;
      m.getContext('2d').drawImage(b, 0, 0, 24, 24);

      hasArt = true; fade = 0;
    }
    function onTrack(t) {
      pal = api.colors(t);
      api.setTheme({ accent: pal.vibrant, accent2: pal.light, bg: R.color.mix(pal.dark, '#000000', 0.3) });
      root.style.setProperty('--gl-acc', pal.vibrant);
      if (!t) { hasArt = false; return; }
      api.coverImage(t).then((im) => { if (im && api.track() && api.track().id === t.id) makeBlur(im); });
    }
    return {
      onTrack,
      resize() { bg.resize(); sp.resize(); },
      frame(dt, t, v) {
        const { ctx, w, h } = bg;
        fade = Math.min(1, fade + dt * 1.5);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = pal.dark; ctx.fillRect(0, 0, w, h);
        if (hasArt) {
          const s = Math.max(w, h) * (1.25 + v.bass * 0.06);
          ctx.globalAlpha = 0.85 * fade;
          ctx.drawImage(blur, (w - s) / 2 + Math.sin(t * 0.07) * w * 0.06, (h - s) / 2 + Math.cos(t * 0.05) * h * 0.05, s, s);
          ctx.globalAlpha = 1;
        }
        ctx.globalCompositeOperation = 'screen';
        const cols = [pal.vibrant, pal.light, pal.avg, pal.vibrant];
        for (let i = 0; i < 4; i++) {
          const b = B[i];
          const x = w * (0.2 + 0.6 * R.noise1(t * 0.05 + b.s, 1)), y = h * (0.15 + 0.7 * R.noise1(t * 0.04 + b.s, 2));

        const sx = sp.ctx; sp.clear();
        const W = sp.w, H = sp.h, n = 24, mid = H / 2;
        sx.beginPath();
        for (let i = 0; i <= n; i++) {
          const b = v.bands[Math.min(31, Math.round((i / n) * 28) + 1)];
          const x = (i / n) * W, y = mid - (2 + Math.min(1, b * 1.35) * mid * 0.95) * (0.3 + 0.7 * Math.sin((i / n) * Math.PI));
          if (i === 0) sx.moveTo(x, y); else { const px = ((i - 0.5) / n) * W; sx.quadraticCurveTo(px, y, x, y); }
        }
        for (let i = n; i >= 0; i--) {
          const b = v.bands[Math.min(31, Math.round((i / n) * 28) + 1)];
          const x = (i / n) * W, y = mid + (2 + Math.min(1, b * 1.35) * mid * 0.95) * (0.3 + 0.7 * Math.sin((i / n) * Math.PI));
          sx.lineTo(x, y);
        }
        sx.closePath();
        const g = sx.createLinearGradient(0, 0, W, 0);
        g.addColorStop(0, 'rgba(255,255,255,.15)'); g.addColorStop(0.5, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,.15)');
        sx.fillStyle = g; sx.fill();
        root.style.setProperty('--gl-pulse', (v.level * 0.6 + v.beat * 0.4).toFixed(3));
      },
    };
  },
});

/* ===================== DIY skins: own photo, colours, visualiser, layout, font + the editor ===================== */
(() => {
  const { esc, I, settings } = R;
  const FONTS = { round: '"Fredoka", var(--sans)', tech: '"Orbitron", var(--sans)', hand: '"Permanent Marker", var(--sans)', serif: '"Playfair Display", var(--sans)', sys: 'var(--sans)' };
  const VIZ = [['bars', '光柱'], ['wave', '波形'], ['ring', '光環'], ['particles', '粒子']];
  const LAYOUT = [['card', '卡片'], ['full', '滿版']];
  const FONT_L = [['round', '圓體'], ['tech', '科技'], ['hand', '手寫'], ['serif', '典雅'], ['sys', '系統']];
  const SW = ['#ff6fae', '#ff3b4a', '#ff8a3d', '#ffd23f', '#7cff6b', '#3ff0d0', '#22b8ff', '#7a6bff', '#c86bff', '#ffffff'];
  const blank = () => ({ id: 'diy-' + R.uid(), name: '我的 Skin', photo: null, dim: 0.45, blur: 0.35, accent: '#ff6fae', accent2: '#3ff0d0', viz: 'bars', layout: 'card', font: 'round', created: Date.now() });
  const photoUrls = new Map();
  async function photoUrl(id) {
    if (!id) return null;
    if (photoUrls.has(id)) return photoUrls.get(id);
    const b = await R.db.get('images', id).catch(() => null);
    if (!b) return null;
    const u = URL.createObjectURL(b); photoUrls.set(id, u); return u;
  }
  let preview = null;

  R.diySkin = (cfg) => {
    if (!cfg) return null;
    const dark = R.color.mix(cfg.accent, '#000000', 0.82);
    return {
      id: cfg.id, base: 'diy', diy: true, name: cfg.name || '我的 Skin', group: 'DIY', en: 'CUSTOM',
      desc: '你自己做的 Skin' + (cfg.photo ? '（用了你的照片）' : ''),
      theme: { bg: dark, fg: '#ffffff', accent: cfg.accent, accent2: cfg.accent2, ui: 'rgba(18,18,26,.97)', line: 'rgba(255,255,255,.12)', dock: 'rgba(0,0,0,.35)', dockfg: '#ffffff' },
      enterMs: 1100,
      emblem: `<svg class="em" viewBox="0 0 116 150"><defs><linearGradient id="dy-${cfg.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${cfg.accent}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs><rect width="116" height="150" fill="url(#dy-${cfg.id})"/>${cfg.photo ? '<g fill="none" stroke="#fff" stroke-width="3" opacity=".9"><rect x="30" y="34" width="56" height="44" rx="6"/><circle cx="46" cy="50" r="5"/><path d="M30 72l18-14 14 10 10-6 14 12"/></g>' : '<circle cx="58" cy="58" r="24" fill="none" stroke="#fff" stroke-width="4" opacity=".9"/><circle cx="58" cy="58" r="7" fill="#fff"/>'}<g fill="${cfg.accent2}">${[0, 1, 2, 3, 4, 5, 6].map((i) => `<rect x="${18 + i * 12}" y="${120 - (8 + ((i * 37) % 22))}" width="7" height="${8 + ((i * 37) % 22)}" rx="3.5"/>`).join('')}</g></svg>`,
      sfx: null,

    };
  };

  function mountDiy(root, api, cfg) {
    root.style.setProperty('--dy-font', FONTS[cfg.font] || FONTS.round);
    root.style.setProperty('--dy-a', cfg.accent); root.style.setProperty('--dy-b', cfg.accent2);
    root.classList.add('dy-' + cfg.layout);
    root.innerHTML = `<canvas class="dy-bg"></canvas><div class="dy-dim" style="background:rgba(0,0,0,${cfg.dim})"></div><canvas class="dy-viz"></canvas>
      <div class="dy-wrap">
        <div class="dy-art"><img data-bind="cover" alt="" draggable="false"></div>
        <div class="dy-info" data-ui><div class="dy-t" data-bind="title"></div><div class="dy-a" data-bind="artist"></div></div>
        ${R.ui.seek('dy-seek')}
        ${R.ui.ctrl('dy-ctrl')}
      </div>`;
    const bg = api.canvas(root.querySelector('.dy-bg'), { dprMax: 1.5, alpha: false });
    const vz = api.canvas(root.querySelector('.dy-viz'));
    const artEl = root.querySelector('.dy-art');
    let photo = null, blurred = null, A = { x: 0, y: 0, r: 80 };
    const parts = [];
    const measure = () => { const r = artEl.getBoundingClientRect(); A = { x: r.left + r.width / 2, y: r.top + r.height / 2, r: Math.max(r.width, r.height) / 2 }; };
    measure();
    function bake() {
      const { w, h } = bg;
      if (!photo) { blurred = null; return; }
      // shrink then grow = blur, without a CSS filter on a full-screen layer
      const k = 1 - Math.pow(cfg.blur, 0.6) * 0.97;
      const tw = Math.max(16, Math.round(Math.min(1400, w) * k)), s = Math.max(tw / photo.width, (tw * h / w) / photo.height);
      const c = document.createElement('canvas'); c.width = tw; c.height = Math.max(16, Math.round(tw * h / w));
      const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';

      else {
        const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, R.color.mix(cfg.accent, '#000000', 0.45)); g.addColorStop(0.55, R.color.mix(cfg.accent, '#000000', 0.82)); g.addColorStop(1, R.color.mix(cfg.accent2, '#000000', 0.6));

    const rr = (ctx, x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };

      resize() { bg.resize(); vz.resize(); measure(); bake(); paintBg(); },
      frame(dt, t, v) {
        const { ctx, w, h } = vz; vz.clear();

        const ca = cfg.accent, cb = cfg.accent2;
        if (cfg.viz === 'bars') {
          const n = 28, gap = 4, bw = (Math.min(w, 760) - gap * (n - 1)) / n, x0 = (w - (bw * n + gap * (n - 1))) / 2, base = h * (cfg.layout === 'full' ? 0.62 : 0.97);
          for (let i = 0; i < n; i++) {
            const b = v.bands[Math.min(31, i + 2)], hh = 4 + b * h * 0.22;

            ctx.fillStyle = g; rr(ctx, x0 + i * (bw + gap), base - hh, bw, hh, Math.min(bw / 2, 6)); ctx.fill();
          }
        } else if (cfg.viz === 'wave') {
          const n = 48, mid = h * (cfg.layout === 'full' ? 0.6 : 0.88), amp = h * 0.09;

            ctx.strokeStyle = R.color.rgba(i % 2 ? cb : ca, 0.85); ctx.lineWidth = Math.max(2, (R.TAU * r0 / n) * 0.5); ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(A.x + Math.cos(a) * r0, A.y + Math.sin(a) * r0); ctx.lineTo(A.x + Math.cos(a) * (r0 + len), A.y + Math.sin(a) * (r0 + len)); ctx.stroke();

  async function html() {

      <div class="sc">

        </div>
        <div class="btn-row" style="padding:4px 4px 14px">

    const cc = e.target.closest('[data-dcc]'); if (cc) { cur[cc.dataset.dcc] = cc.value; R.$$(`[data-dc="${cc.dataset.dcc}"]`, R.ui.body()).forEach((x) => x.classList.remove('on')); live(); }
  });
  R.diy = { edit, isPreview: (id) => id === PREV };
})();

/* ---- ui.js ---- */
/* ===================== shared UI: sheet, menus, prompts ===================== */
(() => {
  const { $, esc } = R;
  const sheet = $('#sheet'), body = $('#sheetBody'), panel = sheet.querySelector('.sheet-panel');
  let onClose = null, kind = null;

  let hideT = 0;
  R.ui.openSheet = (html, opts) => {
    opts = opts || {};
    clearTimeout(hideT); // reopened while the last one was still sliding away
    if (onClose) { const f = onClose; onClose = null; try { f(); } catch (e) { console.error(e); } }
    kind = opts.kind || null;
    body.innerHTML = html;
    sheet.classList.toggle('short', !!opts.short);
    sheet.classList.toggle('half', !!opts.half);
    panel.style.transform = '';
    const was = !sheet.hidden && sheet.classList.contains('on');
    sheet.hidden = false;
    if (!was) { requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('on'))); if (!opts.silent) R.sfx.play('open'); }
    onClose = opts.onClose || null;
    return body;
  };
  R.ui.closeSheet = (silent) => {
    if (sheet.hidden) return;
    sheet.classList.remove('on');
    panel.style.transform = '';
    if (!silent) R.sfx.play('close');
    const f = onClose; onClose = null; kind = null;
    clearTimeout(hideT);
    hideT = setTimeout(() => { if (!sheet.classList.contains('on')) { sheet.hidden = true; body.innerHTML = ''; } }, 420);
    if (f) { try { f(); } catch (e) { console.error(e); } }
  };
  R.ui.sheetKind = () => (sheet.hidden || !sheet.classList.contains('on') ? null : kind);
  R.ui.body = () => body;

  // drag the sheet down by its handle / header to close it
  let drag = null;
  panel.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('.sheet-grab, .sh-head');
    if (!h || e.target.closest('button, input')) return;
    drag = { y: e.clientY, dy: 0, id: e.pointerId };
    try { panel.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
    panel.style.transition = 'none';
  });
  panel.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dy = Math.max(0, e.clientY - drag.y);
    panel.style.transform = `translateY(${drag.dy}px)`;
  });
  const endDrag = () => {
    if (!drag) return;
    panel.style.transition = '';
    if (drag.dy > 110) R.ui.closeSheet(); else panel.style.transform = '';
    drag = null;
  };
  panel.addEventListener('pointerup', endDrag);
  panel.addEventListener('pointercancel', endDrag);

  const modal = $('#modal');
  function showModal(html, onClick) {
    return new Promise((res) => {
      modal.innerHTML = html; modal.hidden = false;
      const done = (v) => { modal.hidden = true; modal.innerHTML = ''; modal.onclick = null; modal.onkeydown = null; res(v); };
      modal.onclick = (e) => onClick(e, done);
      modal.onkeydown = (e) => { if (e.key === 'Escape') done(null); };
      const inp = modal.querySelector('input');
      if (inp) setTimeout(() => { inp.focus(); inp.select && inp.select(); }, 60);
    });
  }
  R.ui.menu = (items, opts) => {
    opts = opts || {};
    const html = `<div class="md" role="menu">${opts.title ? `<div class="md-t">${esc(opts.title)}</div>` : ''}${opts.sub ? `<div class="md-s">${esc(opts.sub)}</div>` : ''}${items.map((it, i) => `<button type="button" class="md-i${it.danger ? ' dng' : ''}${it.on ? ' on' : ''}" data-i="${i}">${it.icon || ''}<span>${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span></button>`).join('')}<button type="button" class="md-i" data-i="-1" style="justify-content:center;color:rgba(255,255,255,.6)">取消</button></div>`;
    R.sfx.play('tap');
    return showModal(html, (e, done) => {
      const b = e.target.closest('[data-i]');
      // it.now runs inside the tap itself: opening a file picker only works straight from a tap on iPhone
      if (b) { const i = +b.dataset.i; R.sfx.play('tap'); if (i >= 0 && items[i].now) items[i].now(); done(i < 0 ? null : items[i].key); }
      else if (e.target === modal) done(null);
    });
  };
  R.ui.prompt = (o) => {
    const html = `<div class="md"><div class="md-t">${esc(o.title || '')}</div>${o.sub ? `<div class="md-s">${esc(o.sub)}</div>` : ''}<input class="md-in" type="text" maxlength="60" value="${esc(o.value || '')}" placeholder="${esc(o.placeholder || '')}" enterkeyhint="done"><div class="md-b"><button type="button" class="btn sec" data-r="0">取消</button><button type="button" class="btn pri" data-r="1">${esc(o.ok || '確定')}</button></div></div>`;
    const p = showModal(html, (e, done) => {
      const b = e.target.closest('[data-r]');
      if (b) done(b.dataset.r === '1' ? modal.querySelector('input').value.trim() : null);
      else if (e.target === modal) done(null);
    });
    setTimeout(() => { const inp = modal.querySelector('input'); if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const b = modal.querySelector('[data-r="1"]'); if (b) b.click(); } }); }, 0);
    return p;
  };
  R.ui.confirm = (o) => {
    const html = `<div class="md"><div class="md-t">${esc(o.title || '')}</div>${o.sub ? `<div class="md-s">${esc(o.sub)}</div>` : ''}<div class="md-b"><button type="button" class="btn sec" data-r="0">${esc(o.cancel || '取消')}</button><button type="button" class="btn ${o.danger ? 'dng' : 'pri'}" data-r="1">${esc(o.ok || '確定')}</button></div></div>`;
    return showModal(html, (e, done) => {
      const b = e.target.closest('[data-r]');
      if (b) done(b.dataset.r === '1');
      else if (e.target === modal) done(false);
    });
  };
  R.ui.info = (title, rows) => {
    const html = `<div class="md"><div class="md-t">${esc(title)}</div><div class="md-s" style="padding-bottom:4px">${rows.map(([k, v]) => `<div style="display:flex;gap:12px;padding:6px 0;border-top:1px solid rgba(255,255,255,.06)"><span style="flex:none;width:84px;color:rgba(255,255,255,.45)">${esc(k)}</span><span style="color:#fff;word-break:break-all">${esc(v)}</span></div>`).join('')}</div><div class="md-b" style="grid-template-columns:1fr"><button type="button" class="btn sec" data-r="1">好</button></div></div>`;
    return showModal(html, (e, done) => { if (e.target.closest('[data-r]') || e.target === modal) done(true); });
  };
  R.ui.modalOpen = () => !modal.hidden;

  const busy = $('#busy');
  // opts.stop: show a stop button that calls it; opts.note: a small line under the progress bar
  R.ui.busy = (title, text, frac, opts) => {
    const stop = $('#busyStop'), note = $('#busyNote');
    if (title == null) { busy.hidden = true; stop.hidden = true; stop.onclick = null; note.hidden = true; return; }
    opts = opts || {};
    busy.hidden = false;
    $('#busyTitle').textContent = title;
    $('#busyText').textContent = text || '';
    $('#busyBar').style.width = frac == null ? '0%' : Math.round(frac * 100) + '%';
    $('#busyBar').parentNode.style.visibility = frac == null ? 'hidden' : 'visible';
    note.textContent = opts.note || ''; note.hidden = !opts.note;
    stop.hidden = !opts.stop;
    stop.onclick = opts.stop ? () => { R.sfx.play('tap'); opts.stop(); } : null;
  };
})();

/* ---- library.js ---- */
/* ===================== library sheet: songs, playlists, queue ===================== */
R.library = (() => {
  const { $, $$, esc, I, fmtTime, bus } = R;
  const st = { tab: 'songs', q: '', view: null, sel: null, pick: null };
  let io = null, offs = [];

  const SORTS = [['added', '最新加入'], ['title', '歌名'], ['artist', '歌手'], ['plays', '最常播放']];
  const sub = (t) => {
    const parts = [t.artist || '未知歌手'];
    if (t.duration) parts.push(fmtTime(t.duration));
    return esc(parts.join(' · ')) + (t.warn ? ' <span class="warn">· 這台可能播不了</span>' : '');
  };
  const row = (t, o) => {
    o = o || {};
    const cur = R.player.current();
    const isCur = cur && cur.id === t.id;
    const lead = o.check ? `<div class="r-chk">${I.check}</div>` : '';
    return `<div class="row${isCur ? ' cur' : ''}${o.check && st.sel && st.sel.has(t.id) ? ' sel' : ''}" data-tid="${t.id}" ${o.idx != null ? `data-idx="${o.idx}"` : ''} role="button" tabindex="0" style="${o.check ? 'grid-template-columns:26px 48px 1fr auto' : o.grip ? 'grid-template-columns:48px 1fr auto auto' : ''}">
      ${lead}<div class="r-art" data-art="${t.id}"></div>
      <div class="r-tx"><div class="r-t">${esc(t.title)}</div><div class="r-s">${sub(t)}</div></div>
      ${o.check ? '' : `<button type="button" class="r-m" data-more="${t.id}" aria-label="更多">${I.more}</button>`}
      ${o.grip ? `<div class="r-g" data-grip aria-label="拖動排序">${I.grip}</div>` : ''}
    </div>`;
  };
  const head = (title, left, right) => `<div class="sh-head">${left || ''}<h3>${title}</h3>${right || ''}<button type="button" class="ib" data-act="sheet-close" aria-label="關閉">${I.close}</button></div>`;
  const tabs = () => `<div class="tabs" role="tablist">${[['songs', '歌曲'], ['lists', '歌單'], ['queue', '播放佇列']].map(([k, l]) => `<button type="button" class="${st.tab === k ? 'on' : ''}" data-lt="${k}" role="tab">${l}</button>`).join('')}</div>`;
  const mosaic = (ids, cls) => {
    const a = ids.slice(0, 4);
    if (a.length < 4) return `<div class="pl-art one ${cls || ''}"><i data-art="${a[0] || ''}"></i></div>`;
    return `<div class="pl-art ${cls || ''}">${a.map((id) => `<i data-art="${id}"></i>`).join('')}</div>`;
  };

  // Long lists (a folder of thousands of songs) draw their first rows right away and the rest as they scroll into view.
  const FIRST = 150, MORE = 250;
  let lazy = null, keepRows = 0, moreIO = null;
  function rowsHTML(items, make) {
    const n = Math.min(items.length, Math.max(FIRST, keepRows));
    let h = '';
    for (let k = 0; k < n; k++) h += make(items[k], k);
    lazy = n < items.length ? { items, make, done: n } : null;
    return h + (lazy ? '<div class="more-rows" data-more-rows></div>' : '');
  }
  function watchMore(root) {
    if (moreIO) { moreIO.disconnect(); moreIO = null; }
    const s = $('[data-more-rows]', root), L = lazy;
    if (!s || !L) return;
    const sc = s.closest('.sc') || root;
    const add = () => {
      if (lazy !== L || !s.isConnected) return false;
      const end = Math.min(L.items.length, L.done + MORE);
      let h = '';
      for (let k = L.done; k < end; k++) h += L.make(L.items[k], k);
      s.insertAdjacentHTML('beforebegin', h);
      L.done = end;
      watchArts(sc);
      if (end < L.items.length) return true;
      s.remove(); lazy = null;
      if (moreIO) { moreIO.disconnect(); moreIO = null; }
      return false;
    };
    if (!('IntersectionObserver' in window)) { while (add()); return; }
    // keep adding while the end of the list is still near the bottom of the screen
    const near = () => s.isConnected && s.getBoundingClientRect().top < sc.getBoundingClientRect().bottom + 1500;
    const go = () => { if (add() && near()) requestAnimationFrame(go); };
    moreIO = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) go(); }, { root: sc, rootMargin: '0px 0px 1500px 0px' });
    moreIO.observe(s);
  }
  const pickRow = (t, inP) => `<div class="row${st.pick.has(t.id) ? ' sel' : ''}${inP.has(t.id) ? ' in' : ''}" data-pick="${t.id}" style="grid-template-columns:26px 48px 1fr" role="button" tabindex="0"><div class="r-chk">${I.check}</div><div class="r-art" data-art="${t.id}"></div><div class="r-tx"><div class="r-t">${esc(t.title)}</div><div class="r-s">${inP.has(t.id) ? '已在歌單裡' : sub(t)}</div></div></div>`;

  function songsHTML() {
    const all = R.lib.list(null, st.q);
    const n = R.lib.count();
    const sortL = (SORTS.find((s) => s[0] === R.settings.get('sort')) || SORTS[0])[1];
    const selMode = !!st.sel;
    const tools = selMode
      ? `<div class="tools"><button type="button" class="chipb" data-l="sel-all">${I.check}全選</button><button type="button" class="chipb" data-l="sel-pl">${I.playlist}加入歌單</button><button type="button" class="chipb" data-l="sel-del" style="color:#ff8a8a">${I.trash}刪除</button><button type="button" class="chipb pri" data-l="sel-end">完成（${st.sel.size}）</button></div>`
      : `<div class="tools"><button type="button" class="chipb pri" data-l="play-all">${I.play}全部播放</button><button type="button" class="chipb" data-l="shuf-all">${I.shuffle}隨機</button><button type="button" class="chipb" data-l="import">${I.upload}匯入</button><button type="button" class="chipb" data-l="sort">${I.sort}${esc(sortL)}</button>${n ? `<button type="button" class="chipb" data-l="sel">${I.check}選取</button>` : ''}</div>`;
    const list = !n
      ? `<div class="blank">歌庫還是空的。<br>把手機或電腦裡的音樂檔放進來，<br>${R.canFolder ? '一首首選或整個資料夾都可以，' : ''}放進來之後不用網路也能聽。<br><br><button type="button" class="btn pri" data-l="files">${I.upload}選擇音樂檔</button>${R.canFolder ? ` <button type="button" class="btn sec" data-l="folder">${I.folder}整個資料夾</button>` : ''}<br><br><button type="button" class="btn sec" data-l="demo">${I.sparkle}先放示範曲進來</button></div>`
      : all.length ? rowsHTML(all, (t) => row(t, { check: selMode })) : `<div class="blank">找不到「${esc(st.q)}」</div>`;
    return head(`歌庫 <small style="font-size:13px;color:rgba(255,255,255,.5);font-weight:600">${n} 首</small>`) + tabs() + tools + (n ? `<div class="search">${I.search}<input type="search" placeholder="搜尋歌名、歌手、專輯" value="${esc(st.q)}" data-l="q" enterkeyhint="search"></div>` : '') + `<div class="sc" data-list>${list}</div>`;
  }
  function listsHTML() {
    const pls = R.lib.pl.all();
    const skinName = (id) => { const d = id && R.skins.get(id); return d ? d.name : ''; };
    const body = pls.length
      ? pls.map((p) => `<div class="pl-card" data-pl="${p.id}" role="button" tabindex="0">${mosaic(p.ids)}<div style="min-width:0"><b>${esc(p.name)}</b><small>${p.ids.length} 首${p.ids.length ? ' · ' + fmtTime(R.lib.pl.duration(p.id)) : ''}${p.skin && skinName(p.skin) ? `<span class="badge">${I.hanger}${esc(skinName(p.skin))}</span>` : ''}</small></div><span style="color:rgba(255,255,255,.4);font-size:18px">${I.chev}</span></div>`).join('')
      : `<div class="blank">還沒有歌單。<br>做一個歌單，還可以幫它綁一套 Skin：<br>一播這個歌單，播放器就自動換上那套衣服。</div>`;
    return head('歌單') + tabs() + `<div class="tools"><button type="button" class="chipb pri" data-l="pl-new">${I.plus}新歌單</button></div><div class="sc">${body}</div>`;
  }
  function queueHTML() {
    const ids = R.player.queue(), i = R.player.index();
    const cur = R.player.current();
    const src = R.player.source();
    const srcName = src.type === 'playlist' ? (R.lib.pl.get(src.id) || {}).name || '歌單' : '歌庫';
    let body;
    if (!cur) body = `<div class="blank">現在沒有在播的歌。</div>`;
    else {
      const rest = ids.slice(i + 1).map(R.lib.get).filter(Boolean);
      body = `<div class="sec-t">正在播放 · 來自${esc(srcName)}</div>${row(cur)}<div class="sec-t">接下來（${rest.length}）</div>${rest.length ? rowsHTML(rest, (t, k) => row(t, { idx: i + 1 + k })) : '<div class="blank" style="padding:16px">這是最後一首' + (R.player.S.repeat === 'all' ? '，播完會從頭再來' : '') + '</div>'}`;
    }
    return head('播放佇列') + tabs() + `<div class="sc">${body}</div>`;
  }
  function playlistHTML(id) {
    const p = R.lib.pl.get(id);
    if (!p) { st.view = null; return listsHTML(); }
    const ts = R.lib.pl.tracks(id);
    const sk = p.skin ? R.skins.get(p.skin) : null;
    return head(esc(p.name), `<button type="button" class="ib" data-l="back" aria-label="返回">${I.back}</button>`, `<button type="button" class="ib" data-l="pl-more" aria-label="歌單選項">${I.more}</button>`)
      + `<div class="pl-hero">${mosaic(p.ids)}<div><b>${esc(p.name)}</b><small>${ts.length} 首 · ${fmtTime(R.lib.pl.duration(id))}</small><div style="margin-top:8px"><button type="button" class="chipb" data-l="pl-skin">${I.hanger}${sk ? '綁定：' + esc(sk.name) : '綁定 Skin'}</button></div></div></div>`
      + `<div class="tools"><button type="button" class="chipb pri" data-l="pl-play" ${ts.length ? '' : 'disabled'}>${I.play}播放</button><button type="button" class="chipb" data-l="pl-shuf" ${ts.length ? '' : 'disabled'}>${I.shuffle}隨機</button><button type="button" class="chipb" data-l="pl-add">${I.plus}加歌</button></div>`
      + `<div class="sc" data-plist="${id}">${ts.length ? rowsHTML(ts, (t, k) => row(t, { grip: true, idx: k })) : '<div class="blank">這個歌單還是空的，按「加歌」挑幾首進來。</div>'}</div>`;
  }
  function pickHTML(id) {
    const p = R.lib.pl.get(id);
    const all = R.lib.list(null, st.q), inP = new Set(p ? p.ids : []);
    return head('加歌到「' + esc(p ? p.name : '') + '」', `<button type="button" class="ib" data-l="pick-cancel" aria-label="返回">${I.back}</button>`)
      + `<div class="tools"><button type="button" class="chipb pri" data-l="pick-done">${I.check}加入（${st.pick.size}）</button></div>`
      + `<div class="search">${I.search}<input type="search" placeholder="搜尋" value="${esc(st.q)}" data-l="q"></div>`
      + `<div class="sc">${rowsHTML(all, (t) => pickRow(t, inP))}</div>`;
  }

  function html() {
    if (st.view && st.view.type === 'playlist') return playlistHTML(st.view.id);
    if (st.view && st.view.type === 'pick') return pickHTML(st.view.id);
    return st.tab === 'lists' ? listsHTML() : st.tab === 'queue' ? queueHTML() : songsHTML();
  }

  const loadArt = (el) => {
    const id = el.dataset.art; if (!id) return;
    const t = R.lib.get(id); if (!t) return;
    R.art.coverUrl(t, 'thumb').then((u) => { if (u) el.style.backgroundImage = `url("${u}")`; });
  };
  function arts(root) {
    if (io) { io.disconnect(); io = null; }
    watchArts(root);
  }
  // covers load as their rows come near the screen
  function watchArts(root) {
    const els = $$('[data-art]:not([data-aw])', root);
    for (const el of els) el.setAttribute('data-aw', '');
    if (!('IntersectionObserver' in window)) { els.forEach(loadArt); return; }
    if (!io) {
      const sc = $('.sc', R.ui.body());
      io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { io.unobserve(e.target); loadArt(e.target); } }, { root: sc, rootMargin: '300px' });
    }
    els.forEach((el) => (el.closest('.sc') ? io.observe(el) : loadArt(el)));
  }

  let scrollKeep = 0;
  function render(first, keepScroll) {
    const sc0 = $('.sc', R.ui.body());
    scrollKeep = keepScroll && sc0 ? sc0.scrollTop : 0;
    keepRows = keepScroll && sc0 ? $$('.row', sc0).length : 0;
    lazy = null;
    const h = html();
    keepRows = 0;
    if (first || R.ui.sheetKind() !== 'lib') R.ui.openSheet(h, { kind: 'lib', onClose });
    else R.ui.body().innerHTML = h;
    const b = R.ui.body();
    const sc = $('.sc', b); if (sc && scrollKeep) sc.scrollTop = scrollKeep;
    arts(b); watchMore(b);
    if (st.view && st.view.type === 'playlist') grips($('[data-plist]', b));
  }
  function onClose() {
    for (const f of offs) f(); offs = [];
    if (io) { io.disconnect(); io = null; }
    if (moreIO) { moreIO.disconnect(); moreIO = null; }
    lazy = null;
    st.sel = null; st.pick = null;
    if (st.view && st.view.type === 'pick') st.view = { type: 'playlist', id: st.view.id };
  }
  function open(tab) {
    if (tab) { st.tab = tab; st.view = null; }
    st.sel = null;
    render(true);
    const re = R.debounce(() => { if (R.ui.sheetKind() === 'lib') render(false, true); }, 120);
    offs.push(bus.on('library', re), bus.on('playlists', re), bus.on('queue', () => { if (st.tab === 'queue' && !st.view) re(); }),
      bus.on('track', () => { const b = R.ui.body(); const cur = R.player.current(); $$('.row', b).forEach((r) => r.classList.toggle('cur', !!cur && r.dataset.tid === cur.id)); if (st.tab === 'queue' && !st.view) re(); }),
      bus.on('track:update', R.debounce(() => { if (R.ui.sheetKind() === 'lib' && !st.sel) render(false, true); }, 400)));
  }

  // drag to reorder inside a playlist
  function grips(list) {
    if (!list) return;
    list.addEventListener('pointerdown', (e) => {
      const g = e.target.closest('[data-grip]'); if (!g) return;
      const rowEl = g.closest('.row'); const rows = $$('.row', list); const from = rows.indexOf(rowEl);
      const h = rowEl.getBoundingClientRect().height; const y0 = e.clientY; let to = from;
      rowEl.classList.add('dragging'); e.preventDefault();
      try { g.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
      const mv = (ev) => {
        const dy = ev.clientY - y0; rowEl.style.transform = `translateY(${dy}px)`;
        to = Math.max(0, Math.min(rows.length - 1, from + Math.round(dy / h)));
        rows.forEach((r, k) => { if (r === rowEl) return; let s = 0; if (from < to && k > from && k <= to) s = -h; if (from > to && k < from && k >= to) s = h; r.style.transform = s ? `translateY(${s}px)` : ''; r.style.transition = 'transform .15s'; });
      };
      const up = async () => {
        g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
        rows.forEach((r) => { r.style.transform = ''; r.style.transition = ''; }); rowEl.classList.remove('dragging');
        if (to !== from) {
          const p = R.lib.pl.get(list.dataset.plist); if (!p) return;
          const ids = p.ids.slice(); const [x] = ids.splice(from, 1); ids.splice(to, 0, x); p.ids = ids;

  async function trackMenu(id, ctx) {

    }
  }
  async function addToPlaylist(ids) {

  async function playlistMenu(id) {
    const p = R.lib.pl.get(id); if (!p) return;

    const k = await R.ui.menu(items, { title: '這個歌單要穿哪一套？', sub: '播這個歌單時，播放器會自動換上這套 Skin。' });

  // one click handler for the whole sheet (delegated)
  document.addEventListener('click', async (e) => {

    const lt = e.target.closest('[data-lt]');

      if (a === 'play-all' || a === 'shuf-all') {
        const all = R.lib.list(null, st.q); if (!all.length) return;
        R.player.prime();
        if (a === 'shuf-all' && !R.player.S.shuffle) R.player.setShuffle(true);
        if (a === 'play-all' && R.player.S.shuffle) R.player.setShuffle(false);

        R.player.playFrom(all.map((t) => t.id), start, { type: 'library' });
        R.ui.closeSheet(); return;
      }
      if (a === 'sort') {
        const k = await R.ui.menu(SORTS.map(([key, label]) => ({ key, label, on: R.settings.get('sort') === key, icon: I.sort })), { title: '排序' });
        if (k) { R.settings.set('sort', k); render(false); }
        return;

      if (a === 'sel-end') { st.sel = null; render(false, true); return; }
      if (a === 'sel-all') { const all = R.lib.list(null, st.q); st.sel = st.sel.size === all.length ? new Set() : new Set(all.map((t) => t.id)); render(false, true); return; }
      if (a === 'sel-pl') { if (!st.sel.size) return; if (await addToPlaylist(Array.from(st.sel))) { st.sel = null; render(false, true); } return; }
      if (a === 'sel-del') {

        if (await R.ui.confirm({ title: `刪除 ${st.sel.size} 首歌？`, sub: '只會從這個 App 的歌庫刪掉，不會動到原始檔。', ok: '刪除', danger: true })) { const ids = Array.from(st.sel); st.sel = null; await R.lib.remove(ids); R.toast(`已刪除 ${ids.length} 首`); }
        return;
      }
      if (a === 'pl-new') { const name = await R.ui.prompt({ title: '新歌單', placeholder: '例如：開車聽、深夜、健身', ok: '建立' }); if (name != null) { const p = await R.lib.pl.create(name); st.view = { type: 'playlist', id: p.id }; render(false); } return; }
      if (a === 'back') { st.view = null; st.tab = 'lists'; R.sfx.play('tap'); render(false); return; }
      if (a === 'pl-more') { playlistMenu(st.view.id); return; }
      if (a === 'pl-skin') { bindSkin(st.view.id); return; }
      if (a === 'pl-play' || a === 'pl-shuf') {

      return;
    }
    const pk = e.target.closest('[data-pick]');
    if (pk) { const id = pk.dataset.pick; if (st.pick.has(id)) st.pick.delete(id); else st.pick.add(id); pk.classList.toggle('sel'); const d = $('[data-l="pick-done"]', b); if (d) d.innerHTML = `${I.check}加入（${st.pick.size}）`; R.sfx.play('tick'); return; }
    const pl = e.target.closest('[data-pl]');
    if (pl) { st.view = { type: 'playlist', id: pl.dataset.pl }; R.sfx.play('tap'); render(false); return; }
    const r = e.target.closest('.row[data-tid]');
    if (r) {
      const id = r.dataset.tid;
      if (st.sel) { if (st.sel.has(id)) st.sel.delete(id); else st.sel.add(id); r.classList.toggle('sel'); const d = $('[data-l="sel-end"]', b); if (d) d.textContent = `完成（${st.sel.size}）`; R.sfx.play('tick'); return; }
      R.player.prime();
      if (st.view && st.view.type === 'playlist') { const p = R.lib.pl.get(st.view.id); R.player.playFrom(p.ids, id, { type: 'playlist', id: p.id }); }
      else if (st.tab === 'queue' && r.dataset.idx != null) R.player.jump(+r.dataset.idx);
      else if (st.tab === 'queue') { /* current song: nothing */ }
      else R.player.playFrom(R.lib.list(null, st.q).map((t) => t.id), id, { type: 'library' });
      $$('.row', b).forEach((x) => x.classList.toggle('cur', x === r));
      setTimeout(() => R.ui.closeSheet(), 180);
    }
  });
  document.addEventListener('input', (e) => {
    if (R.ui.sheetKind() !== 'lib' || !e.target.matches('[data-l="q"]')) return;
    st.q = e.target.value;
    const b = R.ui.body(); const sc = $('.sc', b);
    keepRows = 0;
    if (st.view && st.view.type === 'pick') {
      const all = R.lib.list(null, st.q), p = R.lib.pl.get(st.view.id), inP = new Set(p ? p.ids : []);
      sc.innerHTML = rowsHTML(all, (t) => pickRow(t, inP));
    } else {

      sc.innerHTML = all.length ? rowsHTML(all, (t) => row(t, { check: !!st.sel })) : `<div class="blank">找不到「${esc(st.q)}」</div>`;
    }

    arts(b); watchMore(b);
  });

  return { open, trackMenu, addToPlaylist };
})();

/* ---- wardrobe.js ---- */
/* ===================== wardrobe: swipe the rack, the player tries each skin on live ===================== */
R.wardrobe = (() => {
  const { $, $$, esc, I } = R;
  const el = $('#wardrobe');
  let orig = null, staged = null, isOpen = false, scT = 0, rack = null, lastMark = null;
  const HOOK = '<svg viewBox="0 0 40 26" aria-hidden="true" style="width:40px;height:26px"><path d="M20 12V9.6c0-1 .6-1.5 1.5-2 1.2-.7 2.2-1.6 2.2-3.2a3.7 3.7 0 0 0-7.4 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M20 12L4 24h32z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>';

  function emblemOf(d) {
    if (d.emblem) return d.emblem;
    const t = d.theme;
    return `<svg class="em" viewBox="0 0 116 150"><defs><linearGradient id="g-${d.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t.accent}"/><stop offset="1" stop-color="${t.bg}"/></linearGradient></defs><rect width="116" height="150" fill="url(#g-${d.id})"/><circle cx="58" cy="68" r="30" fill="none" stroke="${t.fg}" stroke-width="5" opacity=".9"/><circle cx="58" cy="68" r="8" fill="${t.fg}"/></svg>`;
  }
  const item = (d) => `<div class="wd-item" data-wid="${d.id}" role="button" tabindex="0" aria-label="${esc(d.name)}"><div class="wd-hook">${HOOK}</div><div class="wd-card" style="background:${d.theme.bg}">${emblemOf(d)}</div><div class="wd-name">${esc(d.name)}</div><div class="wd-grp">${esc(d.group || 'DIY')}</div></div>`;

  function render() {
    const mode = R.settings.get('skinMode');
    el.innerHTML = `<div class="wd-head"><h3>${I.hanger}衣櫃</h3><div class="seg" role="group" aria-label="換膚方式"><button type="button" data-wm="fixed" class="${mode === 'fixed' ? 'on' : ''}">固定這套</button><button type="button" data-wm="shuffle" class="${mode === 'shuffle' ? 'on' : ''}">每首換一套</button></div></div>
      <div class="wd-rod"></div>
      <div class="wd-rack">${R.skins.list().map(item).join('')}<div class="wd-item wd-add" data-wadd role="button" tabindex="0"><div class="wd-hook">${HOOK}</div><div class="wd-card">${I.plus}</div><div class="wd-name">自己做一套</div><div class="wd-grp">DIY</div></div></div>
      <div class="wd-desc" data-wdesc></div>
      <div class="wd-foot"><button type="button" class="btn sec" data-w="cancel">取消</button><button type="button" class="btn sec" data-w="edit" hidden>${I.edit}編輯</button><button type="button" class="btn pri" data-w="ok">${I.check}就穿這套</button></div>`;
    rack = $('.wd-rack', el);
    rack.addEventListener('scroll', onScroll, { passive: true });
  }
  function center(it, smooth) {
    if (!it || !rack) return;
    const left = it.offsetLeft - (rack.clientWidth - it.offsetWidth) / 2;
    if (smooth && rack.scrollTo) rack.scrollTo({ left, behavior: 'smooth' }); else rack.scrollLeft = left;
  }
  function nearest() {
    const c = rack.scrollLeft + rack.clientWidth / 2;
    let best = null, bd = 1e9;
    for (const it of $$('.wd-item', rack)) { const m = it.offsetLeft + it.offsetWidth / 2; const d = Math.abs(m - c); if (d < bd) { bd = d; best = it; } }
    return best;
  }
  function mark(it) {
    if (!it || it === lastMark) return;
    lastMark = it;
    $$('.wd-item', rack).forEach((x) => x.classList.toggle('on', x === it));
    const d = it.dataset.wid ? R.skins.get(it.dataset.wid) : null;
    const desc = $('[data-wdesc]', el);
    const mode = R.settings.get('skinMode');
    desc.textContent = d ? d.desc || '' : '用自己的照片、配色和視覺效果，做一套專屬的 Skin';
    if (mode === 'shuffle' && d) desc.textContent = '每首歌自動換一套（歌單綁定的 Skin 優先）';
    $('[data-w="edit"]', el).hidden = !(d && d.diy);
    $('[data-w="ok"]', el).hidden = !d;
  }
  function onScroll() {
    mark(nearest());
    clearTimeout(scT);
    scT = setTimeout(settle, 150);
  }
  function settle() {
    if (!isOpen) return;
    const it = nearest(); mark(it);
    if (!it || !it.dataset.wid) return;
    const id = it.dataset.wid;
    if (id !== staged) { staged = id; R.stage.show(id, { fast: true, x: '50%', y: '40%' }); }
  }

  function open() {
    if (isOpen) return;
    if (R.ui.sheetKind()) R.ui.closeSheet(true);
    isOpen = true;
    orig = (R.stage.current() || {}).id || R.settings.get('skin');
    staged = orig; lastMark = null;
    render();
    el.hidden = false;
    document.body.classList.add('wd-open');
    requestAnimationFrame(() => {
      center($(`[data-wid="${orig}"]`, el) || $('.wd-item', el), false);
      mark($(`[data-wid="${orig}"]`, el) || $('.wd-item', el));
      requestAnimationFrame(() => el.classList.add('on'));
    });
    R.sfx.play('open');
    if (!R.settings.get('seenWardrobe')) R.settings.set('seenWardrobe', true);
  }
  function close(revert) {
    if (!isOpen) return;
    isOpen = false;
    clearTimeout(scT);
    if (revert && staged !== orig) R.stage.show(orig, { fast: true, silent: true });
    el.classList.remove('on');
    document.body.classList.remove('wd-open');
    setTimeout(() => { if (!isOpen) { el.hidden = true; el.innerHTML = ''; rack = null; } }, 450);
    R.bus.emit('wardrobe:closed');
  }

  el.addEventListener('click', (e) => {
    const wm = e.target.closest('[data-wm]');
    if (wm) { R.settings.set('skinMode', wm.dataset.wm); $$('[data-wm]', el).forEach((b) => b.classList.toggle('on', b === wm)); lastMark = null; mark(nearest()); R.sfx.play('toggle'); if (wm.dataset.wm === 'shuffle') R.toast('之後每首歌都會換一套 Skin'); return; }
    const w = e.target.closest('[data-w]');
    if (w) {
      const a = w.dataset.w;
      if (a === 'cancel') { R.sfx.play('close'); close(true); }
      else if (a === 'ok') {
        R.settings.set('skin', staged);
        R.sfx.play('ok');
        const d = R.skins.get(staged);
        close(false);
        if (d) R.toast(`換上「${d.name}」`);
      } else if (a === 'edit') { const id = staged; close(false); R.diy.edit(id); }
      return;
    }
    if (e.target.closest('[data-wadd]')) { close(true); R.diy.edit(null); return; }
    const it = e.target.closest('.wd-item');
    if (it) { center(it, true); R.sfx.play('tick'); }
  });
  return { open, close, isOpen: () => isOpen };
})();

/* ===================== boot, actions, import, party mode ===================== */
R.app = (() => {
  const { $, $$, bus, settings, I, esc } = R;

  // dock icons
  const DOCK = { lib: I.lib, wardrobe: I.hanger, party: I.party, settings: I.gear };
  $$('#dock .dk').forEach((b) => { b.innerHTML = DOCK[b.dataset.act]; });

  /* ---------- first tap unlocks audio (iPhone) ---------- */
  const first = () => {
    R.player.unlock(); R.sfx.unlock();
    for (const ev of ['touchend', 'click', 'keydown']) window.removeEventListener(ev, first, true);
  };
  for (const ev of ['touchend', 'click', 'keydown']) window.addEventListener(ev, first, true);

  /* ---------- actions (data-act anywhere) ---------- */
  const A = {
    toggle() { R.player.toggle(); R.stage.sfx(R.player.wants() ? 'play' : 'pause'); },
    next() { R.player.prime(); R.player.next(); R.stage.sfx('next'); },
    prev() { R.player.prime(); R.player.prev(); R.stage.sfx('prev'); },
    shuffle() { R.player.setShuffle(!R.player.S.shuffle); R.stage.sfx('toggle'); R.toast(R.player.S.shuffle ? '隨機播放：開' : '隨機播放：關', { ms: 1600 }); },
    repeat() { const r = R.player.cycleRepeat(); R.stage.sfx('toggle'); R.toast({ all: '循環整個清單', one: '單曲循環', off: '播完就停' }[r], { ms: 1600 }); },
    lib() { if (R.wardrobe.isOpen()) R.wardrobe.close(true); if (R.ui.sheetKind() === 'lib') R.ui.closeSheet(); else R.library.open(); },
    wardrobe() { if (R.wardrobe.isOpen()) R.wardrobe.close(true); else R.wardrobe.open(); },
    party() { party.toggle(); },
    settings() { if (R.wardrobe.isOpen()) R.wardrobe.close(true); if (R.ui.sheetKind() === 'settings') R.ui.closeSheet(); else R.settingsUI.show(); },
    'sheet-close'() { R.ui.closeSheet(); },
    import() { importMenu(); },
    'import-files'() { pickFiles(false); },
    'import-folder'() { pickFiles(true); },
    demo() { R.player.prime(); addDemo(); },
  };
  R.actions = A;
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const f = A[b.dataset.act];
    if (!f) return;
    e.preventDefault();
    if (document.body.classList.contains('party')) party.peek();
    f(b, e);
  });

  /* ---------- import ---------- */
  const fileIn = $('#fileIn'), folderIn = $('#folderIn');
  function pickFiles(folder) { (folder && R.canFolder ? folderIn : fileIn).click(); }
  // the picked folder's name ("Suno/01.mp3" → "Suno"), or '' when the files are not from one folder
  const topFolder = (items) => {
    const ps = items.map((x) => (x.f ? x.path : x.webkitRelativePath) || '');
    if (!ps.length || !ps.every((p) => p.includes('/'))) return '';
    const t = ps[0].split('/')[0];
    return ps.every((p) => p.split('/')[0] === t) ? t : '';
  };
  for (const inp of [fileIn, folderIn]) inp.addEventListener('change', () => { const fs = Array.from(inp.files || []); inp.value = ''; if (fs.length) importFiles(fs, { folder: topFolder(fs) }); });
  // 「匯入」: songs or a whole folder (the picker has to open inside the tap, so the menu calls it right away)
  function importMenu() {
    if (!R.canFolder) { pickFiles(false); return; }
    R.ui.menu([
      { key: 'files', label: '選擇音樂檔', sub: '一首或一次選好幾首', icon: I.upload, now: () => pickFiles(false) },
      { key: 'folder', label: '整個資料夾', sub: '裡面的歌全部放進來，子資料夾也算', icon: I.folder, now: () => pickFiles(true) },
    ], { title: '匯入音樂' });
  }

  let importing = null;
  async function importFiles(files, opts) {
    opts = opts || {};
    if (importing) { R.toast('上一批還在匯入，等它好了再放'); return; }
    if (R.ui.sheetKind()) R.ui.closeSheet(true);
    const signal = { stop: false };
    importing = signal;
    const wasEmpty = R.lib.count() === 0;
    const title = opts.folder ? `匯入「${opts.folder}」` : '匯入中';
    R.ui.busy(title, '整理檔案中…', null);
    // a long import must not be cut off by the screen going dark
    let wake = null;
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; }
    let res;
    try {
      res = await R.lib.importFiles(files, (p) => {
        if (signal.stop) return;
        R.ui.busy(title, `${p.i + 1} / ${p.n}　${p.name}`, p.i / p.n, p.n < 5 ? null : {
          note: p.n >= 30 ? '歌很多會花幾分鐘，匯入時畫面請保持開著' : '',
          stop: () => { signal.stop = true; R.ui.busy(title, '這首放好就停…', p.i / p.n); },
        });
      }, { signal });
    } catch (e) {
      R.toast('匯入失敗：' + (e && e.message ? e.message : e)); R.sfx.play('err'); return;
    } finally {
      importing = null; R.ui.busy(null);
      if (wake) wake.release().catch(() => {});
    }
    updateEmpty();
    if (!res.total) {
      R.toast(res.cant ? `這些檔案這台裝置不能播（${res.cantExt.slice(0, 3).join('、')}），沒有放進來`
        : opts.folder ? `「${opts.folder}」裡沒有音樂檔（支援 MP3、M4A、FLAC、WAV）` : '沒有找到音樂檔（支援 MP3、M4A、FLAC、WAV）', { ms: 5000 });
      R.sfx.play('err'); return;
    }
    const parts = [];
    if (res.added.length) parts.push(`加入 ${res.added.length} 首`);
    if (res.dup) parts.push(`${res.dup} 首已經在歌庫`);
    if (res.failed.length) parts.push(`${res.failed.length} 首讀不了`);
    if (res.cant) parts.push(`${res.cant} 個 ${res.cantExt.slice(0, 3).join('、')} 檔這台裝置不能播，沒有放進來`);
    if (res.warn) parts.push(`${res.warn} 首這台裝置可能播不了`);
    let msg = parts.join('，') || '沒有加入新歌';
    if (res.stopped) msg = `已停止：${msg}。之後再匯入一次，放過的歌會自動跳過`;
    R.sfx.play(res.added.length ? 'ok' : 'err');
    // a folder can become a playlist (the songs already in the library included), in folder order
    const action = opts.folder && res.ids.length && !res.full && !res.stopped ? { label: '存成歌單', fn: () => folderPlaylist(opts.folder, res.ids) } : null;
    if (res.full) {

        title: '儲存空間不夠了',
        sub: `${msg}。還有 ${res.full} 首沒放進來：可以刪掉不聽的歌，或清出手機空間後再匯入一次（已經在歌庫的歌會自動跳過）。`,
        ok: '看儲存空間', cancel: '知道了',
      }).then((go) => { if (go) R.settingsUI.show(); });
    } else R.toast(msg, action ? { action, ms: 9000 } : { ms: 5000 });
    if (res.added.length && (wasEmpty || !R.player.current())) {
      R.player.playFrom(R.lib.list().map((t) => t.id), res.added[0], { type: 'library' }, { autoplay: false });
      setTimeout(() => { if (!R.player.wants()) R.toast('準備好了，按播放鍵開始 ▶'); }, 1800);
    }
  }
  async function folderPlaylist(name, ids) {
    const p = R.lib.pl.all().find((x) => x.name === name);
    if (p) {
      const n = await R.lib.pl.add(p.id, ids);

  }
  async function addDemo() {
    R.ui.busy('正在合成示範曲', '在你的裝置上現場合成，幾秒鐘就好', null);

  }

  /* drag & drop (computer): songs or whole folders */
  let dragN = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragN++; $('#drop').hidden = false; });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });

  /* ---------- which skin to wear ---------- */

  const party = (() => {
    let on = false, peekT = 0, wake = null;
    const lock = async () => { try { if (on && navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; } };
    function peek(ms) { if (!on) return; document.body.classList.add('peek'); clearTimeout(peekT); peekT = setTimeout(() => document.body.classList.remove('peek'), ms || 3200); }
    function title() {
      const el = $('#partyTitle'); const t = R.player.current();
      if (!on || !t) { el.classList.remove('on'); return; }
      el.innerHTML = `<b>${esc(t.title)}</b><span>${esc(t.artist || '')}</span>`;
      el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 5500);
    }
    function toggle(force) {
      const want = force != null ? !!force : !on;
      if (want === on) return;
      on = want;
      document.body.classList.toggle('party', on);
      R.stage.sfx('toggle');
      if (on) {
        if (R.ui.sheetKind()) R.ui.closeSheet(true);
        if (R.wardrobe.isOpen()) R.wardrobe.close(false);
        const de = document.documentElement;
        if (!R.isIOS && de.requestFullscreen && !document.fullscreenElement) { try { const p = de.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } }
        lock(); peek(2200); title();
        R.toast(R.isTouch ? '派對模式：點一下畫面叫出按鈕' : '派對模式：點一下畫面叫出按鈕，Esc 離開', { ms: 2600 });
      } else {
        document.body.classList.remove('peek');
        $('#partyTitle').classList.remove('on');
        if (document.fullscreenElement && document.exitFullscreen) { try { const p = document.exitFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } }
        if (wake) { wake.release().catch(() => {}); wake = null; }
      }
      R.bus.emit('party', on);
    }
    document.addEventListener('pointerdown', (e) => { if (on && !e.target.closest('#dock, [data-ui], #sheet, #modal, #wardrobe')) peek(); }, true);
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && on) toggle(false); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });
    bus.on('track', () => { if (on) title(); });
    return { toggle, peek, isOn: () => on };
  })();
  R.party = party;

  /* ---------- keyboard (computer) ---------- */
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea, select') || R.ui.modalOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === ' ' || e.code === 'Space') { e.preventDefault(); A.toggle(); }
    else if (k === 'ArrowRight') { e.preventDefault(); if (e.shiftKey) A.next(); else R.player.seek(R.player.time() + 5); }
    else if (k === 'ArrowLeft') { e.preventDefault(); if (e.shiftKey) A.prev(); else R.player.seek(R.player.time() - 5); }
    else if (k === 's' || k === 'S') A.wardrobe();
    else if (k === 'l' || k === 'L') A.lib();
    else if (k === 'f' || k === 'F') A.party();
    else if (k === 'Escape') { if (R.wardrobe.isOpen()) R.wardrobe.close(true); else if (R.ui.sheetKind()) R.ui.closeSheet(); else if (party.isOn()) party.toggle(false); }
  });

  /* ---------- boot ---------- */
  async function boot() {
    try { await R.db.open(); }
    catch (e) {
      $('#splash').innerHTML = '<div style="color:#fff;padding:30px;text-align:center;line-height:1.8">這個瀏覽器不讓 App 存歌（可能是私密瀏覽或空間不足）。<br>' +
        (R.CLAUDE ? `請改開網頁版：<br><a href="${R.WEB_URL}" target="_blank" rel="noopener" style="color:#ff8be8;word-break:break-all">${R.WEB_URL}</a>` : '請換一般模式打開，或改用 Safari／Chrome。') + '</div>';
      return;
    }
    await settings.load();
    R.player.S.shuffle = !!settings.get('shuffle');
    R.player.S.repeat = settings.get('repeat') || 'all';
    R.player.setVolume(settings.get('volume') == null ? 1 : settings.get('volume'));
    await R.lib.load();
    try { await R.player.restore(); } catch (e) { console.warn('restore', e); }
    lastTid = R.player.S.tid;
    const want = wantedSkin() || settings.get('skin');
    await R.stage.show(R.skins.get(want) ? want : R.skins.builtin()[0].id, { silent: true, instant: true });
    booted = true;
    R.loop.start();
    setTimeout(() => $('#splash').classList.add('off'), 120);
    setTimeout(() => $('#splash').remove(), 900);
    updateEmpty();
    setTimeout(() => R.analysis.resume(), 1500);
    if (R.lib.count()) {
      if (R.CLAUDE) { /* hint lives in settings */ }
      else if (R.embedded && (R.isIOS || R.isAndroid || R.isTouch) && !settings.get('embedHint')) { settings.set('embedHint', true); setTimeout(() => R.toast('想鎖屏也一直聽：把「耳目一新」單獨加到主畫面，鎖屏控制更完整', { ms: 6500 }), 2500); }
      else if (R.isIOS && !R.standalone && !R.embedded && !settings.get('homeHint')) { settings.set('homeHint', true); setTimeout(() => R.toast('用 Safari「分享 → 加入主畫面」，就能鎖屏一直聽', { ms: 6000 }), 2500); }
    }
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) && !R.CLAUDE) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  return { boot, pickFiles, importMenu, importFiles, addDemo, updateEmpty };
})();
R.app.boot();

})();
</script>
</body>
