/* 補番 BINGE — 動畫放映室：賽璐璐（粗墨線、硬陰影、網點）× 新海式的天空（跟著時間變：清晨、白天、黃昏、深夜）
   手機記憶體：不用 filter／backdrop-filter／模糊陰影；動畫只動 transform、opacity；粒子畫布用完就拿掉。 */
@property --hole { syntax: '<length>'; inherits: false; initial-value: 0px; }

:root {
  --ink: #17112a; --ink2: #2a2147;
  --sakura: #ff4f9a; --sun: #ffd23f; --sora: #2ec5ff; --leaf: #46dd88; --violet: #8b5cff; --fire: #ff5a36; --mint: #3ef0d0;
  --k-ai: #8b5cff; --k-sd: #ff9f1c; --k-mc: #23b8f0; --k-jp: #ff4f9a; --k-cn: #ff5a36; --k-toon: #f5c400;
  --panel: #fffaf0; --panel2: #f4ecdc; --card: #ffffff; --text: #17112a; --sub: #615878; --line: #17112a;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --top-h: 56px; --tab-h: 64px; --gut: 16px; --r: 14px;
  --body: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif;
  --disp: 'BingeD', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: light;
}
html.dark { --panel: #1c1636; --panel2: #251d47; --card: #241c46; --text: #fff6e8; --sub: #b8acd9; --line: #07040f; color-scheme: dark; }
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
html { overflow-x: clip; }
body { font-family: var(--body); color: var(--text); background: #5fb8ff; overflow-x: hidden; overflow-x: clip; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
html.watching body { overflow: hidden; }
.d { font-family: var(--disp); font-weight: 400; letter-spacing: .02em; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; }
img.noimg { opacity: 0; }
input { font: inherit; }
.red { color: var(--fire); } .gold { color: #ffb800; } .ok { color: var(--leaf); font-style: normal; } .bad { color: var(--fire); font-style: normal; }
.dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .5; margin: 0 7px; vertical-align: middle; }

/* ================================================================ 天空 */
#sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sky-grad { position: absolute; inset: 0; transition: opacity 1.2s; }
html.sky-dawn .sky-grad { background: linear-gradient(180deg, #5b6fd0 0%, #9c8ee0 30%, #e8a6c8 62%, #ffcf9e 100%); }
html.sky-day .sky-grad { background: linear-gradient(180deg, #1f7cf5 0%, #45a6ff 28%, #8fd0ff 64%, #dff3ff 100%); }
html.sky-dusk .sky-grad { background: linear-gradient(180deg, #1c1150 0%, #4a2378 26%, #a23a7e 52%, #ee6a6a 74%, #ffb45e 100%); }
html.sky-night .sky-grad { background: linear-gradient(180deg, #050719 0%, #0d1236 38%, #1d1a52 72%, #3a2468 100%); }
/* 星星：一層點陣，兩層錯開閃 */
.stars { position: absolute; inset: 0 0 30% 0; opacity: 0; transition: opacity 1.2s; }
.stars.s1 { background-image: radial-gradient(1.6px 1.6px at 12% 18%, #fff 60%, transparent), radial-gradient(1.2px 1.2px at 33% 8%, #fff 60%, transparent), radial-gradient(1.8px 1.8px at 58% 22%, #fff 60%, transparent), radial-gradient(1.2px 1.2px at 77% 12%, #fff 60%, transparent), radial-gradient(1.5px 1.5px at 90% 30%, #fff 60%, transparent), radial-gradient(1.1px 1.1px at 22% 40%, #fff 60%, transparent), radial-gradient(1.4px 1.4px at 46% 48%, #fff 60%, transparent), radial-gradient(1.2px 1.2px at 68% 40%, #fff 60%, transparent), radial-gradient(1.6px 1.6px at 84% 55%, #fff 60%, transparent), radial-gradient(1.1px 1.1px at 6% 62%, #fff 60%, transparent); }
.stars.s2 { background-image: radial-gradient(1.2px 1.2px at 18% 28%, #fff 60%, transparent), radial-gradient(1.6px 1.6px at 40% 16%, #ffe9b0 60%, transparent), radial-gradient(1.1px 1.1px at 63% 6%, #fff 60%, transparent), radial-gradient(1.3px 1.3px at 71% 30%, #fff 60%, transparent), radial-gradient(1.8px 1.8px at 95% 14%, #cfe6ff 60%, transparent), radial-gradient(1.2px 1.2px at 28% 58%, #fff 60%, transparent), radial-gradient(1.1px 1.1px at 52% 34%, #fff 60%, transparent), radial-gradient(1.4px 1.4px at 9% 8%, #fff 60%, transparent); animation: twinkle 3.6s ease-in-out infinite; }
html.sky-night .stars { opacity: 1; }
html.sky-dusk .stars.s1 { opacity: .35; }
@keyframes twinkle { 50% { opacity: .25; } }
/* 太陽／月亮 */
.sun { position: absolute; width: 140px; height: 140px; right: 8%; top: 14%; border-radius: 50%; transition: transform 1.2s, opacity 1.2s, background 1.2s; }
html.sky-day .sun { background: radial-gradient(circle, #fffbe6 0 34%, rgba(255, 251, 230, .5) 36%, rgba(255, 251, 230, 0) 70%); transform: translateY(-20px); }
html.sky-dawn .sun { background: radial-gradient(circle, #fff1d6 0 30%, rgba(255, 214, 170, .55) 34%, rgba(255, 200, 160, 0) 70%); top: 52%; }
html.sky-dusk .sun { background: radial-gradient(circle, #ffe0a0 0 30%, rgba(255, 160, 90, .6) 34%, rgba(255, 120, 80, 0) 70%); top: 58%; width: 190px; height: 190px; right: 14%; }
html.sky-night .sun { width: 74px; height: 74px; top: 12%; right: 12%; background: radial-gradient(circle at 38% 40%, #fffbe8 0 46%, #f2e9c8 47% 52%, rgba(255, 250, 220, .18) 54%, rgba(255, 250, 220, 0) 72%); }
/* 雲：賽璐璐的平塗雲，往右慢慢飄 */
.cloud { position: absolute; width: 360px; height: 110px; left: -380px; opacity: .95; animation: drift 120s linear infinite; }
.cloud::before, .cloud::after { content: ''; position: absolute; border-radius: 999px; }
.cloud::before { inset: 38px 0 0 0; background: var(--cloud-a, #fff); }
.cloud::after { width: 46%; height: 92px; left: 22%; top: 0; background: var(--cloud-a, #fff); box-shadow: 70px 18px 0 -6px var(--cloud-a, #fff), -58px 26px 0 -16px var(--cloud-a, #fff); }
.cloud.c1 { top: 9%; animation-duration: 140s; animation-delay: -40s; }
.cloud.c2 { top: 26%; transform: scale(.7); animation-duration: 180s; animation-delay: -120s; opacity: .8; }
.cloud.c3 { top: 44%; transform: scale(1.15); animation-duration: 210s; animation-delay: -10s; opacity: .7; }
html.sky-day { --cloud-a: #ffffff; }
html.sky-dawn { --cloud-a: #ffd9cf; }
html.sky-dusk { --cloud-a: #f79a8a; }
html.sky-night { --cloud-a: #2a2a63; }
html.sky-night .cloud { opacity: .55; }
@keyframes drift { to { transform: translateX(calc(100vw + 760px)); } }
.cloud.c2 { animation-name: drift2; } .cloud.c3 { animation-name: drift3; }
@keyframes drift2 { from { transform: translateX(0) scale(.7); } to { transform: translateX(calc(100vw + 760px)) scale(.7); } }
@keyframes drift3 { from { transform: translateX(0) scale(1.15); } to { transform: translateX(calc(100vw + 760px)) scale(1.15); } }
/* 光點：白天是花瓣、深夜是螢火蟲 */
.mote { position: absolute; width: 7px; height: 7px; border-radius: 50% 0 50% 0; background: #ffd3e6; opacity: 0; animation: mote 16s linear infinite; }
.mote.m1 { left: 12%; animation-delay: 0s; } .mote.m2 { left: 34%; animation-delay: -5s; } .mote.m3 { left: 56%; animation-delay: -9s; }
.mote.m4 { left: 74%; animation-delay: -3s; } .mote.m5 { left: 90%; animation-delay: -12s; }
html.sky-night .mote, html.sky-dusk .mote { border-radius: 50%; width: 5px; height: 5px; background: #fff3a6; box-shadow: 0 0 0 3px rgba(255, 243, 166, .18); }
@keyframes mote { 0% { transform: translate3d(0, 32vh, 0) rotate(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .7; } 100% { transform: translate3d(70px, 94vh, 0) rotate(380deg); opacity: 0; } }
html.sky-night .mote { animation-name: firefly; animation-duration: 9s; }
@keyframes firefly { 0%, 100% { transform: translate3d(0, 70vh, 0); opacity: 0; } 30% { opacity: .9; } 50% { transform: translate3d(26px, 62vh, 0); opacity: .3; } 70% { opacity: 1; } 90% { transform: translate3d(-18px, 54vh, 0); opacity: 0; } }
/* 街景剪影：屋頂、電線桿、電線 */
.town { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 180px; }
.town .roofs, .town .pole { fill: var(--town, #1b3d74); }
.town .wire { fill: none; stroke: var(--town, #1b3d74); stroke-width: 2.4; }
.town .win { fill: #ffd980; opacity: 0; }
html.sky-day { --town: #2b5fa6; } html.sky-dawn { --town: #4b4590; } html.sky-dusk { --town: #2a1238; } html.sky-night { --town: #04030c; }
html.sky-night .town .win, html.sky-dusk .town .win { opacity: .95; }
html.sky-night .town .win.w2, html.sky-night .town .win.w5 { animation: winOff 11s steps(1) infinite; }
@keyframes winOff { 60% { opacity: 0; } }
html.fx-lite .cloud, html.fx-lite .mote, html.fx-lite .stars.s2 { animation: none; }

/* ================================================================ 頂列 */
#top { position: fixed; z-index: 30; top: 0; left: 0; right: 0; height: calc(var(--top-h) + var(--safe-t)); padding: var(--safe-t) 12px 0 14px; display: flex; align-items: center; gap: 10px; }
#top::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, var(--top-bg, rgba(15, 50, 120, .55)), transparent); pointer-events: none; }
html.sky-day #top { --top-bg: rgba(18, 70, 160, .45); } html.sky-dawn #top { --top-bg: rgba(60, 50, 130, .5); } html.sky-dusk #top { --top-bg: rgba(20, 10, 50, .65); } html.sky-night #top { --top-bg: rgba(3, 3, 14, .8); }
#top > * { position: relative; }
#top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--ink); opacity: 0; transition: opacity .2s; }
html.scrolled #top::before { background: var(--top-solid, #1f7cf5); }
html.scrolled #top::after { opacity: 1; }
html.sky-day { --top-solid: #1f74e8; } html.sky-dawn { --top-solid: #5465c4; } html.sky-dusk { --top-solid: #1c1150; } html.sky-night { --top-solid: #070a20; }
.logo { display: flex; align-items: baseline; gap: 6px; }
.logo b { font-size: 27px; line-height: 1; color: #fff; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--sakura); transform: rotate(-4deg); display: inline-block; }
.logo span { font-size: 11px; color: var(--sun); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; letter-spacing: .14em; }
.ep-pill { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 99px; background: rgba(255, 255, 255, .92); border: 2px solid var(--ink); color: var(--ink); font-size: 11px; box-shadow: 2px 2px 0 var(--ink); }
.ep-pill i { font-style: normal; font-weight: 800; }
.ep-pill b { font-variant-numeric: tabular-nums; }
.top-sp { flex: 1; }
.ico-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: #fff; }
.ico-btn svg { width: 24px; height: 24px; fill: currentColor; }
#top .ico-btn { background: var(--ink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--sakura); }
.sync { width: 18px; height: 18px; display: grid; place-items: center; }
.sync i { width: 10px; height: 10px; border-radius: 50%; background: var(--leaf); border: 2px solid var(--ink); }
.sync.wait i { background: var(--sun); animation: blink 1.4s infinite; } .sync.bad i { background: var(--fire); }
@keyframes blink { 50% { opacity: .3; } }

/* ================================================================ 分頁列（手機在下，電腦在左） */
#tabs { position: fixed; z-index: 30; left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); height: var(--tab-h); display: flex; background: var(--panel); border: 3px solid var(--line); border-radius: 22px; box-shadow: 4px 4px 0 var(--line); padding: 4px; }
#tabs a { flex: 1; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--sub); font-size: 11.5px; font-weight: 800; border-radius: 16px; transition: color .2s; }
#tabs a svg { width: 24px; height: 24px; fill: currentColor; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
#tabs a.on { color: var(--ink); }
#tabs a.on svg { transform: translateY(-1px) scale(1.12) rotate(-6deg); }
#tabs .ink { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; border-radius: 16px; background: var(--sun); border: 2.5px solid var(--ink); transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), width .35s, height .35s; }
.tab-dot { position: absolute; top: 8px; right: 26%; width: 9px; height: 9px; border-radius: 50%; background: var(--sakura); border: 2px solid var(--ink); }

/* ================================================================ 內容 */
#view { position: relative; z-index: 1; padding: calc(var(--top-h) + var(--safe-t) + 4px) 0 calc(var(--tab-h) + 34px + var(--safe-b)); min-height: 100vh; }
#view.enter { animation: viewIn .38s cubic-bezier(.2, .8, .2, 1); }
@keyframes viewIn { from { opacity: 0; transform: translate3d(0, 14px, 0); } }
.sec { margin: 26px 0 0; }
.sh { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 7px 10px; padding: 0 var(--gut); margin-bottom: 12px; }
.sh::after { content: ''; order: 2; flex: 1 0 100%; height: 0; }
.sh:not(:has(.sh-note))::after { display: none; }
.sh h2 { order: 0; flex: none; } .sh-more { order: 1; } .sh-note { order: 3; }
.sh h2 { margin: 0; display: flex; align-items: baseline; gap: 8px; position: relative; }
.sh h2 b { position: relative; z-index: 1; font-size: 21px; line-height: 1.1; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
.sh h2::before { content: ''; position: absolute; z-index: 0; left: -6px; right: -8px; bottom: -3px; height: 13px; background: var(--sc); transform: skewX(-14deg) rotate(-1.4deg); border-radius: 3px; border: 2px solid var(--ink); }
.sh h2 i { position: relative; z-index: 1; font-style: normal; font-weight: 900; font-size: 10.5px; letter-spacing: .16em; color: #fff; text-shadow: 1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink); }
.sh-note { flex: 0 1 auto; min-width: 0; margin-bottom: 1px; padding: 3px 8px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-more { margin-left: auto; flex: none; display: flex; align-items: center; gap: 2px; height: 28px; padding: 0 11px; border-radius: 99px; background: var(--panel); color: var(--text); border: 2.5px solid var(--line); box-shadow: 2px 2px 0 var(--line); font-size: 12.5px; font-weight: 900; }
.sh-more span { font-size: 16px; line-height: 1; margin-top: -2px; }
.row { display: flex; gap: 14px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; padding: 4px var(--gut) 12px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.row > * { scroll-snap-align: start; flex: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px 12px; padding: 4px var(--gut) 8px; }
.grid.mgrid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.sgrid { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); }
.chips { display: flex; gap: 8px; padding: 4px var(--gut) 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 13px; border-radius: 99px; background: var(--panel); color: var(--text); border: 2.5px solid var(--line); box-shadow: 2px 2px 0 var(--line); font-size: 13px; font-weight: 800; white-space: nowrap; transition: transform .12s; }
.chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--line); }
.chip.on { background: var(--sun); color: var(--ink); }
.chip.fol.on { background: var(--sakura); color: #fff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px; border-radius: 12px; background: var(--panel); color: var(--text); border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--line); font-weight: 900; font-size: 14px; white-space: nowrap; transition: transform .12s, box-shadow .12s; }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--line); }
.btn.yel { background: var(--sun); color: var(--ink); } .btn.ink { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 3px 3px 0 var(--sakura); }
.btn.wide { display: flex; width: calc(100% - 2 * var(--gut)); margin: 10px var(--gut) 0; }
.kc { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--kc); color: #fff; border: 2px solid var(--ink); font-style: normal; font-size: 11px; font-weight: 900; text-shadow: 1px 1px 0 rgba(0, 0, 0, .35); white-space: nowrap; }
.kc.fol { background: var(--sakura); } .kc.done { background: var(--leaf); color: var(--ink); text-shadow: none; }

/* ---------------------------------------------------------------- 影片卡 */
.vc { width: 236px; display: flex; flex-direction: column; position: relative; background: var(--panel); border: 3px solid var(--line); border-radius: 15px; box-shadow: 5px 5px 0 var(--kc); overflow: hidden; transition: transform .18s cubic-bezier(.3, 1.4, .5, 1), box-shadow .12s; }
.grid .vc { width: auto; }
.vc-th { position: relative; display: block; aspect-ratio: 16/9; overflow: hidden; background: var(--panel2); border-bottom: 3px solid var(--line); }
.vc-th img { width: 100%; height: 100%; object-fit: cover; }
.vc:hover { transform: translateY(-3px) rotate(-.8deg); }
.vc:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--kc); }
.vc-k { position: absolute; top: 7px; left: 7px; display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--kc); color: #fff; border: 2px solid var(--ink); font-style: normal; font-size: 10.5px; font-weight: 900; text-shadow: 1px 1px 0 rgba(0, 0, 0, .4); }
.vc-ai { position: absolute; top: 7px; right: 7px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--k-ai); color: #fff; border: 2px solid var(--ink); font-style: normal; font-size: 10px; font-weight: 900; }
.vc-d { position: absolute; right: 7px; bottom: 7px; padding: 2px 6px; border-radius: 5px; background: var(--ink); color: #fff; font-style: normal; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; }
.vc-ep { position: absolute; left: 7px; bottom: 7px; padding: 2px 7px; border-radius: 5px; background: #fff; color: var(--ink); border: 2px solid var(--ink); font-style: normal; font-size: 10.5px; font-weight: 900; }
.vc-new { position: absolute; top: -2px; right: -2px; padding: 5px 9px 4px 11px; background: var(--sun); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 0 10px 0 12px; font-style: normal; font-size: 11px; transform: rotate(4deg); }
.vc-done { position: absolute; top: 7px; right: 7px; padding: 3px 8px 2px; background: var(--leaf); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 8px; font-style: normal; font-size: 11px; transform: rotate(6deg); }
.vc-pg { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(0, 0, 0, .45); }
.vc-pg::before { content: ''; position: absolute; inset: 0; right: auto; width: var(--p); background: repeating-linear-gradient(90deg, var(--sakura) 0 8px, #ff86bc 8px 11px); border-right: 2px solid #fff; }
.vc.seen .vc-th img { opacity: .55; }
.vc-t, .mc-t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 9px 11px 0; min-height: 2.76em; font-size: 13.5px; font-weight: 800; line-height: 1.38; color: var(--text); }
.vc-t b, .mc-t b { font-weight: 900; }
.vc-t small, .mc-t small { font-size: inherit; font-weight: 700; color: var(--sub); }
.vc-t b + small::before, .mc-t b + small::before { content: '｜'; color: var(--kc); font-weight: 900; }
.vc-m { display: flex; align-items: center; gap: 5px; margin: auto 11px 0; padding: 7px 0 10px; font-size: 11.5px; color: var(--sub); font-weight: 700; min-width: 0; }
.vc-m b { color: var(--text); }
.vc-m b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.vc-m span { white-space: nowrap; }
.av { display: inline-block; flex: none; border-radius: 50%; overflow: hidden; border: 2px solid var(--ink); background: var(--panel2); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av-t { display: inline-grid; place-items: center; background: hsl(var(--h), 70%, 62%); color: #fff; font-weight: 900; text-shadow: none; }
.dotlive { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
.more-card { width: 120px; display: grid; place-content: center; text-align: center; gap: 4px; aspect-ratio: 3/4; align-self: flex-start; border-radius: 14px; background: var(--panel); border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--line); color: var(--text); }
.more-card b { font-size: 30px; } .more-card span { font-size: 12px; font-weight: 900; color: var(--sub); }

/* ---------------------------------------------------------------- 長片合輯卡 */
.mc { width: 286px; display: flex; flex-direction: column; position: relative; background: var(--panel); border: 3px solid var(--line); border-radius: 16px; box-shadow: 6px 6px 0 var(--kc); overflow: hidden; transition: transform .18s cubic-bezier(.3, 1.4, .5, 1), box-shadow .12s; }
.grid .mc { width: auto; }
.mc-th { position: relative; display: block; aspect-ratio: 16/9; overflow: hidden; background: var(--panel2); border-bottom: 3px solid var(--line); }
.mc-th img { width: 100%; height: 100%; object-fit: cover; }
.mc-th::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(10, 6, 25, .55)); pointer-events: none; }
.mc:hover { transform: translateY(-3px) rotate(.8deg); }
.mc:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--kc); }
.mc-len { position: absolute; z-index: 1; left: 8px; top: 8px; display: grid; place-items: center; min-width: 64px; height: 40px; padding: 0 10px; background: var(--sun); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; transform: rotate(-5deg); font-style: normal; box-shadow: 3px 3px 0 var(--ink); }
.mc-len b { font-size: 19px; font-weight: 400; line-height: 1; }
.mc-rg { position: absolute; z-index: 1; right: 8px; bottom: 9px; padding: 3px 8px; border-radius: 6px; background: #fff; color: var(--ink); border: 2px solid var(--ink); font-style: normal; font-size: 11.5px; font-weight: 900; }
.mc .vc-new, .mc .vc-done { z-index: 1; }
.vc-ne { position: absolute; left: 6px; bottom: 8px; z-index: 1; padding: 3px 8px 2px; background: var(--ink); color: #fff; border: 2px solid var(--paper, #fff8ea); border-radius: 8px; font-style: normal; font-size: 11px; font-weight: 800; }
.vc-x { flex: none; font-style: normal; font-size: 10.5px; font-weight: 800; color: inherit; opacity: .8; border: 1.5px solid currentColor; border-radius: 5px; padding: 0 4px; line-height: 15px; margin-left: 3px; }
.mc .vc-pg { z-index: 1; }
.mc.seen .mc-th img { opacity: .5; }
.mc-t { font-size: 14.5px; margin-top: 10px; }
.mc-m { display: flex; align-items: center; gap: 6px; margin: auto 11px 0; padding: 7px 0 11px; font-size: 11.5px; color: var(--sub); font-weight: 700; min-width: 0; }
.mc-m b { color: var(--text); }
.mc-m b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; font-weight: 800; }
.mc-m em { font-style: normal; font-weight: 900; color: var(--sakura); }
.mc-m u { text-decoration: none; padding: 1px 6px; border-radius: 5px; background: var(--panel2); color: var(--text); border: 1.5px solid var(--line); font-weight: 800; font-size: 10.5px; }
.mc.wide { grid-column: span 2; }
@media (max-width: 600px) { .mc.wide { grid-column: auto; } }

/* ---------------------------------------------------------------- 作品卡 */
.sc { width: 168px; display: flex; flex-direction: column; background: var(--panel); border: 3px solid var(--line); border-radius: 15px; box-shadow: 5px 5px 0 var(--kc); overflow: hidden; transition: transform .18s cubic-bezier(.3, 1.4, .5, 1), box-shadow .12s; }
.grid .sc { width: auto; }
.sc-th { position: relative; display: block; aspect-ratio: 4/5; overflow: hidden; background: var(--panel2); border-bottom: 3px solid var(--line); }
.sc-th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.sc-th::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 38%, rgba(12, 6, 30, .88) 92%); }
.sc:hover { transform: translateY(-3px) rotate(-1deg); }
.sc:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--kc); }
.sc-n { position: absolute; z-index: 1; top: 7px; left: 7px; padding: 4px 8px 3px; border-radius: 9px; background: var(--kc); color: #fff; border: 2.5px solid var(--ink); font-style: normal; font-size: 15px; line-height: 1; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.sc-n small { font-size: 10px; margin-left: 1px; }
.sc-fol { position: absolute; z-index: 1; top: 7px; right: 8px; color: var(--sun); font-style: normal; font-size: 20px; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.sc .vc-new, .sc .vc-done { z-index: 1; top: 36px; right: 4px; }
.sc-name { position: absolute; z-index: 1; left: 9px; right: 9px; bottom: 12px; font-size: 15px; font-weight: 900; line-height: 1.3; color: #fff; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 2px 2px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink); }
.sc-pg { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(0, 0, 0, .5); }
.sc-pg::before { content: ''; position: absolute; inset: 0; right: auto; width: var(--p); background: var(--leaf); }
.sc.seen .sc-th img { opacity: .6; }
.sc-m { display: flex; gap: 6px; padding: 7px 10px 9px; font-size: 11.5px; color: var(--sub); font-weight: 700; min-width: 0; }
.sc-m b { color: var(--text); }
.sc-m b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; min-width: 0; }
.sc-m span { white-space: nowrap; flex: none; margin-left: auto; }

/* ---------------------------------------------------------------- 繼續補番卡 */
.cc { width: 250px; display: flex; flex-direction: column; background: var(--panel); border: 3px solid var(--line); border-radius: 15px; box-shadow: 5px 5px 0 var(--sora); overflow: hidden; }
.grid .cc { width: auto; }
.cc-th { position: relative; display: block; aspect-ratio: 16/9; overflow: hidden; border-bottom: 3px solid var(--line); background: var(--panel2); }
.cc-th img { width: 100%; height: 100%; object-fit: cover; }
.cc-play { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; display: grid; place-items: center; border-radius: 50%; background: var(--sun); color: var(--ink); border: 3px solid var(--ink); font-style: normal; font-size: 18px; box-shadow: 3px 3px 0 var(--ink); padding-left: 3px; }
.cc-dev { position: absolute; top: 7px; left: 7px; padding: 2px 7px; border-radius: 6px; background: var(--sora); color: var(--ink); border: 2px solid var(--ink); font-style: normal; font-size: 10.5px; font-weight: 900; }
.cc .vc-pg { height: 8px; }
.cc-t { display: block; margin: 9px 11px 0; font-size: 14px; font-weight: 900; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-m { display: flex; gap: 4px; margin: 4px 11px 0; padding-bottom: 10px; font-size: 12px; color: var(--sub); font-weight: 700; white-space: nowrap; }
.cc-m b { font-variant-numeric: tabular-nums; } .cc-m span { margin-left: auto; color: var(--sakura); font-weight: 900; }

/* ---------------------------------------------------------------- 今日放送（主視覺） */
.hero { position: relative; margin: 6px 0 0; }
.hero-slides { position: relative; height: calc(min(100vw, 760px) * .5625 + 128px); }
.hs { position: absolute; inset: 0; padding: 4px var(--gut) 0; opacity: 0; pointer-events: none; transition: opacity .5s; }
.hs.on { opacity: 1; pointer-events: auto; z-index: 1; }
.hs-frame { position: relative; display: block; contain: paint; aspect-ratio: 16/9; border-radius: 18px; overflow: hidden; border: 3.5px solid var(--line); box-shadow: 7px 7px 0 var(--kc); background: var(--panel2); }
.hs-img { width: 100%; height: 100%; object-fit: cover; }
.hs.on .hs-img { animation: kenburns 9s ease-out both; }
@keyframes kenburns { from { transform: scale(1.12) translate3d(2%, 1%, 0); } to { transform: scale(1); } }
.hs-lines { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, .5) 0 1.2deg, transparent 1.2deg 9deg); -webkit-mask: radial-gradient(circle, transparent 42%, #000 75%); mask: radial-gradient(circle, transparent 42%, #000 75%); opacity: 0; }
.hs.on .hs-lines { animation: speedIn .9s ease-out; }
@keyframes speedIn { 0% { opacity: .9; transform: scale(1.4); } 100% { opacity: 0; transform: scale(1); } }
.hs-card { position: relative; z-index: 2; display: block; margin: -34px 14px 0 26px; padding: 13px 15px 13px; background: var(--panel); color: var(--text); border: 3px solid var(--line); border-radius: 14px; box-shadow: 5px 5px 0 var(--line); transform: rotate(-1.6deg); }
.hs.on .hs-card { animation: cardIn .55s cubic-bezier(.2, 1.4, .4, 1) both .08s; }
@keyframes cardIn { from { transform: translate3d(40px, 10px, 0) rotate(4deg); opacity: 0; } }
.hs-kick { display: flex; align-items: center; gap: 8px; }
.hs-kick em { font-style: normal; font-size: 12.5px; color: var(--kc); -webkit-text-stroke: 0; }
.hs-kick u { margin-left: auto; text-decoration: none; font-size: 22px; line-height: 1; color: var(--text); opacity: .25; }
.hs-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 7px; font-size: 19px; font-weight: 900; line-height: 1.32; }
.hs-sub { display: block; margin-top: 5px; font-size: 12px; color: var(--sub); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-ctl { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 14px var(--gut) 0; }
.go-btn { display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 24px 0 18px; border-radius: 16px; background: var(--sun); color: var(--ink); border: 3.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font-size: 19px; white-space: nowrap; transition: transform .12s, box-shadow .12s; }
.go-btn b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--sun); font-size: 13px; padding-left: 2px; font-weight: 400; }
.go-btn small { font-family: var(--body); font-size: 12px; font-weight: 800; margin-left: 2px; opacity: .8; }
.go-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.ic-sq { width: 50px; height: 50px; border-radius: 16px; background: var(--panel); color: var(--text); border: 3.5px solid var(--line); box-shadow: 4px 4px 0 var(--line); font-size: 26px; font-weight: 900; }
.hero-dots { margin-left: auto; display: flex; gap: 6px; }
.hero-dots i { width: 22px; height: 10px; border-radius: 5px; background: var(--panel); border: 2px solid var(--ink); position: relative; overflow: hidden; cursor: pointer; }
.hero-dots i.on { width: 40px; background: var(--panel2); }
.hero-dots i.on b { position: absolute; inset: 0; background: var(--sakura); transform-origin: left; animation: dotfill 8s linear both; }
@keyframes dotfill { from { transform: scaleX(0); } }

/* ---------------------------------------------------------------- 抽一部（扭蛋機） */
.gacha { display: flex; align-items: center; gap: 16px; margin: 0 var(--gut); padding: 16px; background: var(--panel); border: 3px solid var(--line); border-radius: 20px; box-shadow: 5px 5px 0 var(--line); background-image: radial-gradient(rgba(0, 0, 0, .07) 1.2px, transparent 1.4px); background-size: 9px 9px; }
.g-machine { flex: none; position: relative; width: 112px; height: 150px; cursor: pointer; }
.gm-dome { position: absolute; left: 6px; top: 0; width: 100px; height: 92px; border-radius: 50% 50% 14px 14px; background: #e8f7ff; border: 3px solid var(--ink); overflow: hidden; }
html.dark .gm-dome { background: #2c3a6e; }
.cap { position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--ink); background: linear-gradient(180deg, var(--cc) 50%, #fff 50%); }
.cap.c1 { --cc: var(--sakura); left: 8px; top: 52px; } .cap.c2 { --cc: var(--sun); left: 34px; top: 58px; transform: rotate(40deg); } .cap.c3 { --cc: var(--sora); left: 60px; top: 50px; transform: rotate(-30deg); }
.cap.c4 { --cc: var(--leaf); left: 20px; top: 28px; transform: rotate(80deg); } .cap.c5 { --cc: var(--violet); left: 48px; top: 26px; transform: rotate(-60deg); } .cap.c6 { --cc: var(--fire); left: 66px; top: 6px; transform: rotate(20deg); }
.gm-body { position: absolute; left: 0; right: 0; top: 84px; height: 66px; border-radius: 14px; background: var(--sakura); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.gm-body b { position: absolute; left: 10px; top: 8px; font-size: 14px; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.gm-crank { position: absolute; right: 12px; top: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); }
.gm-crank i { position: absolute; left: 50%; top: 2px; bottom: 2px; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--ink); }
.gm-slot { position: absolute; left: 14px; bottom: 10px; width: 36px; height: 18px; border-radius: 6px; background: var(--ink); }
.gm-ball { position: absolute; left: 18px; top: 116px; width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink); background: linear-gradient(180deg, var(--sun) 50%, #fff 50%); opacity: 0; }
.gacha.spin .gm-crank { animation: crank .8s cubic-bezier(.4, 0, .4, 1); }
.gacha.spin .cap { animation: shake .2s linear 4; }
.gacha.spin .g-machine { animation: wobble .8s; }
.gacha.pop .gm-ball { animation: ballOut .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes crank { to { transform: rotate(720deg); } }
@keyframes shake { 50% { translate: 0 -6px; } }
@keyframes wobble { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
@keyframes ballOut { 0% { opacity: 1; transform: translate(0, -10px) scale(.5); } 60% { opacity: 1; transform: translate(10px, 8px) scale(1.15); } 100% { opacity: 0; transform: translate(14px, 0) scale(1); } }
.g-out { flex: 1; min-width: 0; }
.g-hint b { display: block; font-size: 22px; } .g-hint span { display: block; margin: 6px 0 12px; font-size: 13px; color: var(--sub); line-height: 1.5; }
.g-res { position: relative; animation: resIn .5s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes resIn { from { transform: scale(.6) rotate(-6deg); opacity: 0; } }
.g-tag { position: absolute; z-index: 2; top: -12px; right: 0; padding: 4px 10px 3px; background: var(--fire); color: #fff; border: 2.5px solid var(--ink); border-radius: 9px; transform: rotate(8deg); font-size: 14px; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.g-card { display: block; }
.g-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 11px; border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--kc); }
.g-card b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 9px 0 4px; font-size: 14.5px; line-height: 1.35; font-weight: 900; }
.g-card span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); font-weight: 700; }
.g-acts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
.g-acts .btn { height: 36px; padding: 0 14px; font-size: 13px; }

/* ---------------------------------------------------------------- AI 動畫 */
.swipe-entry { width: calc(100% - 2 * var(--gut)); margin: 0 var(--gut); display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 22px; text-align: left; background: linear-gradient(120deg, var(--k-ai), #c84fff 60%, var(--sakura)); border: 3.5px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); color: #fff; overflow: hidden; position: relative; }
.swipe-entry::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-55deg, rgba(255, 255, 255, .1) 0 2px, transparent 2px 13px); pointer-events: none; }
.se-fan { position: relative; flex: none; width: 112px; height: 134px; }
.se-fan i { position: absolute; top: 4px; width: 72px; height: 126px; border-radius: 12px; overflow: hidden; border: 3px solid var(--ink); background: #1c1340; box-shadow: 3px 3px 0 var(--ink); }
.se-fan i img { width: 100%; height: 100%; object-fit: cover; }
.se-fan .f0 { left: 0; transform: rotate(-12deg); } .se-fan .f1 { left: 20px; transform: rotate(-2deg); z-index: 1; } .se-fan .f2 { left: 40px; transform: rotate(9deg); z-index: 2; }
.swipe-entry:active .se-fan .f2 { transform: rotate(14deg) translateX(6px); }
.se-t { position: relative; z-index: 1; flex: 1; min-width: 0; }
.se-t b { display: block; font-size: 26px; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; }
.se-t span { display: block; margin: 6px 0 10px; font-size: 13px; font-weight: 800; line-height: 1.5; text-shadow: 1px 1px 0 var(--ink); }
.se-t em { display: inline-flex; height: 34px; align-items: center; padding: 0 14px; border-radius: 11px; background: var(--sun); color: var(--ink); border: 3px solid var(--ink); font-style: normal; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); }
.genres { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 var(--gut); }
.genre { display: flex; align-items: baseline; gap: 6px; height: 42px; padding: 0 14px; border-radius: 13px; background: var(--panel); color: var(--text); border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--sakura); transition: transform .14s; }
.genre:nth-child(3n+2) { box-shadow: 3px 3px 0 var(--sora); } .genre:nth-child(3n) { box-shadow: 3px 3px 0 var(--sun); }
.genre:active { transform: translate(3px, 3px); box-shadow: 0 0 0; }
.genre b { font-size: 16px; line-height: 36px; } .genre span { font-size: 12px; font-weight: 900; color: var(--sub); }
.lens { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 0 var(--gut); }
.len { display: flex; flex-direction: column; justify-content: center; height: 66px; padding: 0 14px; border-radius: 15px; background: var(--lc); color: var(--ink); border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--line); position: relative; overflow: hidden; }
.len::after { content: ''; position: absolute; right: -10px; top: -10px; width: 70px; height: 70px; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(0, 0, 0, .14) 0 1.5px, transparent 1.6px 7px); }
.len b { font-size: 17px; } .len span { font-size: 12px; font-weight: 900; opacity: .75; }
.chans { gap: 12px; }
.chc { width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 12px 6px 10px; border-radius: 16px; background: var(--panel); color: var(--text); border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--line); }
.chc b { font-size: 12px; font-weight: 900; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chc span { font-size: 10.5px; color: var(--sub); font-weight: 700; }
.chc.off { opacity: .45; }

/* ---------------------------------------------------------------- 頁首、返回、空、載入、頁尾 */
.ph { display: flex; align-items: flex-end; gap: 12px; padding: 14px var(--gut) 6px; }
.ph h1 { margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; position: relative; }
.ph h1 b { position: relative; z-index: 1; font-size: 34px; line-height: 1.05; color: #fff; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--sc); }
.ph h1 i { position: relative; z-index: 1; font-style: normal; font-weight: 900; font-size: 12px; letter-spacing: .18em; padding: 3px 8px; background: var(--ink); color: #fff; border-radius: 5px; transform: rotate(-2deg); }
.ph p { margin: 12px 0 0; max-width: 640px; padding: 9px 13px; font-size: 13px; line-height: 1.6; font-weight: 700; color: var(--text); background: var(--panel); border: 2.5px solid var(--line); border-radius: 4px 14px 14px 14px; box-shadow: 3px 3px 0 var(--line); }
.backbar { padding: 8px var(--gut) 0; }
.back { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 10px; border-radius: 99px; background: var(--panel); color: var(--text); border: 2.5px solid var(--line); box-shadow: 2px 2px 0 var(--line); font-weight: 900; font-size: 13px; }
.back span { font-size: 20px; line-height: 1; margin-top: -2px; }
.empty { margin: 20px var(--gut); padding: 26px 20px; text-align: center; background: var(--panel); border: 3px dashed var(--line); border-radius: 20px; color: var(--text); }
.empty-ic { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); }
.empty-ic i { font-style: normal; font-size: 32px; color: var(--ink); }
.empty b { display: block; font-size: 16px; font-weight: 900; } .empty p { margin: 8px auto 14px; max-width: 420px; font-size: 13px; line-height: 1.6; color: var(--sub); }
.empty-s { padding: 16px; color: var(--sub); font-size: 13px; }
.loading { display: grid; place-items: center; gap: 16px; padding: 120px 20px; text-align: center; }
.loading b { font-size: 20px; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
.ld-film { display: flex; gap: 8px; }
.ld-film i { width: 22px; height: 30px; border-radius: 5px; background: var(--panel); border: 3px solid var(--ink); animation: hop .9s ease-in-out infinite; }
.ld-film i:nth-child(2) { animation-delay: .12s; background: var(--sun); } .ld-film i:nth-child(3) { animation-delay: .24s; background: var(--sakura); } .ld-film i:nth-child(4) { animation-delay: .36s; background: var(--sora); }
@keyframes hop { 40% { transform: translateY(-14px) rotate(-8deg); } }
.foot { margin: 34px var(--gut) 0; padding: 12px 14px; font-size: 11.5px; line-height: 1.7; color: var(--sub); background: var(--panel); border: 2.5px solid var(--line); border-radius: 13px; }
.foot .d { color: var(--text); margin-right: 4px; }
.foot a { color: var(--sakura); font-weight: 900; }

/* ---------------------------------------------------------------- 片單：補番數據 */
.stats { margin: 14px var(--gut) 0; padding: 18px 16px 14px; background: var(--panel); color: var(--text); border: 3.5px solid var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--leaf); position: relative; overflow: hidden; }
.stats::before { content: ''; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(0, 0, 0, .08) 0 1.6px, transparent 1.8px 8px); }
.st-main { position: relative; }
.st-main > .st-title { display: inline-block; margin: 0; font-size: 14px; color: var(--sun); font-weight: 400; }
.st-title { display: inline-block; padding: 4px 11px 3px; border-radius: 9px; background: var(--ink); color: var(--sun); font-size: 14px; transform: rotate(-2deg); }
.st-main > b { display: flex; align-items: baseline; gap: 4px; margin-top: 10px; font-size: 50px; line-height: 1; }
.st-main > b i { font-style: normal; }
.st-main > b small { font-family: var(--body); font-size: 15px; font-weight: 900; margin-right: 6px; color: var(--sub); }
.st-main > span { display: block; margin-top: 4px; font-size: 12.5px; color: var(--sub); font-weight: 700; }
.st-bar { display: flex; height: 16px; margin-top: 14px; border-radius: 8px; overflow: hidden; border: 2.5px solid var(--ink); }
.st-bar i { background: var(--kc); border-right: 2px solid var(--ink); } .st-bar i:last-child { border-right: 0; }
.st-leg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11.5px; font-weight: 800; color: var(--sub); }
.st-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--kc); border: 1.5px solid var(--ink); margin-right: 4px; vertical-align: -1px; }
.st-cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.st-cells div { text-align: center; padding: 10px 4px 8px; border-radius: 13px; background: var(--panel2); border: 2.5px solid var(--line); }
.st-cells b { display: block; font-size: 24px; line-height: 1.1; } .st-cells b small { font-size: 12px; }
.st-cells span { display: block; margin-top: 3px; font-size: 11px; font-weight: 800; color: var(--sub); }
.st-hours { position: relative; display: grid; grid-template-columns: repeat(24, 1fr); align-items: end; gap: 3px; height: 54px; margin-top: 14px; padding-bottom: 16px; }
.st-hours i { height: calc(4px + var(--h) * 34px); border-radius: 3px 3px 0 0; background: var(--violet); border: 1.5px solid var(--ink); }
.st-hours span { position: absolute; bottom: 0; font-size: 9.5px; color: var(--sub); font-weight: 800; }
.st-hours span:nth-of-type(1) { left: 0; } .st-hours span:nth-of-type(2) { left: 25%; } .st-hours span:nth-of-type(3) { left: 50%; } .st-hours span:nth-of-type(4) { left: 75%; } .st-hours span:nth-of-type(5) { right: 0; }
.set-card { margin: 0 var(--gut); padding: 6px 16px 14px; background: var(--panel); color: var(--text); border: 3px solid var(--line); border-radius: 18px; box-shadow: 4px 4px 0 var(--line); }
.set-p { font-size: 13px; line-height: 1.6; color: var(--sub); margin: 10px 0; }
.set-sub { margin: 14px 0 6px; font-size: 12px; font-weight: 900; color: var(--sub); }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 11px; border: 3px solid var(--line); background: var(--card); color: var(--text); font-size: 14px; outline: none; }
.adds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.add { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 9px; background: var(--panel2); border: 2px solid var(--line); font-size: 12px; font-weight: 800; }
.add i { font-style: normal; font-size: 11px; color: var(--sub); }
.add.ok i { color: var(--leaf); } .add.fail i { color: var(--fire); }
.tg { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 2px dashed rgba(127, 110, 160, .3); cursor: pointer; }
.tg span { flex: 1; } .tg b { display: block; font-size: 14px; font-weight: 900; } .tg em { display: block; font-style: normal; font-size: 11.5px; color: var(--sub); margin-top: 2px; }
.tg input { display: none; }
.tg i { position: relative; flex: none; width: 50px; height: 28px; border-radius: 14px; background: var(--panel2); border: 2.5px solid var(--ink); transition: background .2s; }
.tg i::after { content: ''; position: absolute; left: 2px; top: 2px; width: 19px; height: 19px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transition: transform .25s cubic-bezier(.3, 1.5, .5, 1); }
.tg input:checked + i { background: var(--leaf); } .tg input:checked + i::after { transform: translateX(21px); }
.segset { padding: 12px 0; border-bottom: 2px dashed rgba(127, 110, 160, .3); }
.segset > b { display: block; font-size: 14px; font-weight: 900; margin-bottom: 8px; }
.segs { display: flex; flex-wrap: wrap; gap: 6px; }
.segs button { height: 32px; padding: 0 12px; border-radius: 10px; background: var(--panel2); border: 2.5px solid var(--line); font-size: 12.5px; font-weight: 800; }
.segs button.on { background: var(--sun); color: var(--ink); box-shadow: 2px 2px 0 var(--line); }
.rng { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 2px dashed rgba(127, 110, 160, .3); }
.rng b { font-size: 14px; font-weight: 900; } .rng input { flex: 1; accent-color: var(--sakura); }
.sys-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 2px dashed rgba(127, 110, 160, .3); font-size: 13px; }
.sys-row span { color: var(--sub); font-weight: 800; } .sys-row b { text-align: right; } .sys-row a { color: var(--sakura); }
.sys-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.sys-acts .btn { height: 36px; font-size: 13px; padding: 0 12px; }

/* ---------------------------------------------------------------- 作品頁 */
.kv { position: relative; margin: 10px var(--gut) 0; }
.kv-img { position: relative; display: block; contain: paint; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; border: 3.5px solid var(--line); box-shadow: 8px 8px 0 var(--kc); background: var(--panel2); }
.kv-img img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 10s ease-out both; }
.kv-lines { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, .45) 0 1deg, transparent 1deg 8deg); -webkit-mask: radial-gradient(circle, transparent 45%, #000 80%); mask: radial-gradient(circle, transparent 45%, #000 80%); animation: speedIn 1s ease-out both; opacity: 0; }
.kv-card { position: relative; z-index: 2; margin: -30px 6px 0 16px; padding: 14px 16px 16px; background: var(--panel); color: var(--text); border: 3.5px solid var(--line); border-radius: 18px; box-shadow: 6px 6px 0 var(--line); transform: rotate(-.8deg); animation: cardIn .55s cubic-bezier(.2, 1.4, .4, 1) both; }
.kv-kick { display: flex; flex-wrap: wrap; gap: 6px; }
.kv-title { margin: 10px 0 0; font-size: 24px; line-height: 1.28; font-weight: 900; }
.kv-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 9px; font-size: 12.5px; color: var(--sub); font-weight: 800; }
.kv-meta a { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
.kv-prog { margin-top: 12px; }
.kv-prog i { display: block; height: 12px; border-radius: 6px; border: 2.5px solid var(--ink); background: linear-gradient(90deg, var(--leaf) var(--p), var(--panel2) var(--p)); }
.kv-prog span { display: block; margin-top: 5px; font-size: 12px; font-weight: 900; color: var(--sub); }
.kv-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; padding: 0 var(--gut); }
.ep2 { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 15px; background: var(--panel); color: var(--text); border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--line); transition: transform .12s; }
.ep2:active { transform: translate(3px, 3px); box-shadow: 0 0 0; }
.ep2.next { box-shadow: 4px 4px 0 var(--kc); background: var(--card); }
.ep2-th { position: relative; flex: none; width: 128px; aspect-ratio: 16/9; border-radius: 9px; overflow: hidden; border: 2.5px solid var(--ink); background: var(--panel2); }
.ep2-th img { width: 100%; height: 100%; object-fit: cover; }
.ep2-th i { position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: var(--ink); color: #fff; font-style: normal; font-size: 10px; font-weight: 800; }
.ep2-th u { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0, 0, 0, .5); }
.ep2-th u::before { content: ''; position: absolute; inset: 0; right: auto; width: var(--p); background: var(--sakura); }
.ep2-th b { position: absolute; left: 4px; top: 4px; padding: 2px 6px; border-radius: 6px; background: var(--leaf); color: var(--ink); border: 2px solid var(--ink); font-size: 11px; }
.ep2-th b.nx { background: var(--sun); }
.ep2-t { min-width: 0; }
.ep2-t em { display: inline-block; font-style: normal; font-size: 13px; color: var(--text); background: linear-gradient(transparent 58%, var(--kc) 58% 92%, transparent 92%); padding: 0 2px; }
.ep2-t span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; font-size: 12.5px; line-height: 1.4; font-weight: 700; }
.ep2.seen .ep2-th img { opacity: .5; } .ep2.seen .ep2-t span { color: var(--sub); }
.chead { display: flex; gap: 16px; align-items: center; margin: 12px var(--gut) 0; padding: 16px; background: var(--panel); color: var(--text); border: 3.5px solid var(--line); border-radius: 20px; box-shadow: 6px 6px 0 var(--kc); }
.chead h1 { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.25; }
.chead p { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.ch-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* ================================================================ 放映機 */
#theater { position: fixed; inset: 0; z-index: 60; background: #0a0716; color: #fff6e8; display: flex; flex-direction: column; padding-top: var(--safe-t); opacity: 0; transform: translate3d(0, 24px, 0); transition: opacity .3s, transform .3s cubic-bezier(.2, .8, .2, 1); --line: #000; --panel: #1c1636; --panel2: #251d47; --card: #241c46; --text: #fff6e8; --sub: #b8acd9; }
#theater::before { content: ''; position: absolute; inset: 0; background: radial-gradient(rgba(255, 255, 255, .05) 1.2px, transparent 1.4px); background-size: 10px 10px; pointer-events: none; }
#theater.in { opacity: 1; transform: none; }
.th-bar { position: relative; flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px; }
.th-bar .ico-btn { background: transparent; }
.th-k { flex: none; padding: 3px 9px; border-radius: 7px; background: var(--kc); color: #fff; border: 2px solid #000; font-style: normal; font-size: 11.5px; font-weight: 900; }
.th-ttl { flex: 1; min-width: 0; font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th-main { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
.th-stage { flex: none; }
.th-frame { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-top: 3px solid #000; border-bottom: 3px solid #000; overflow: hidden; }
.th-frame iframe, .th-frame > div:first-child { position: absolute; inset: 0; width: 100%; height: 100%; }
/* 橫放全螢幕：iPhone 把播放器轉 90 度鋪滿（手機鎖直向也能橫著看）；Android 是真的全螢幕。位置由 Land.layout() 算好放在 --fx-* */
.fsx-rail, .fsx-tip { display: none; }
#theater.fsx .th-frame { position: fixed; left: 50%; top: 50%; z-index: 50; width: var(--fx-w, 100vw); height: var(--fx-h, 100vh); max-width: none; max-height: none; aspect-ratio: auto; border: 0; transform: translate(-50%, -50%) rotate(var(--fx-rot, 0deg)); background: #000; }
#theater.fsx .th-frame > iframe, #theater.fsx .th-frame > #ytp { inset: auto; left: var(--fx-vl); top: var(--fx-vt); width: var(--fx-vw); height: var(--fx-vh); }
#theater.fsx .fsx-rail { display: flex; position: absolute; z-index: 8; right: var(--fx-rr); top: var(--fx-rt); bottom: var(--fx-rb); width: 52px; flex-direction: column; justify-content: space-between; align-items: center; transition: opacity .35s; }
.fsx-rail .fr-g { display: flex; flex-direction: column; gap: 12px; }
.fsx-rail button { width: 46px; height: 46px; display: grid; place-items: center; align-content: center; gap: 2px; padding: 0; border-radius: 12px; background: #241c46; border: 2.5px solid #000; box-shadow: 3px 3px 0 #000; color: #fff; touch-action: manipulation; }
.fsx-rail button svg { width: 22px; height: 22px; }
.fsx-rail button b { font-size: 11px; font-weight: 900; line-height: 1; letter-spacing: .5px; }
.fsx-rail #fxSkip, .fsx-rail #fxComp, .fsx-rail #fxNext { height: 58px; }
.fsx-rail #fxSkip svg, .fsx-rail #fxComp svg, .fsx-rail #fxNext svg { width: 16px; height: 16px; }
.fsx-rail #fxComp, .fsx-rail #fxNext { background: var(--sakura); color: #17112a; }
.fsx-rail #fxSkip { background: var(--sun); color: #17112a; }
.fsx-rail.dim { opacity: .3; }
.fsx-rail.dim button { pointer-events: none; }
#theater.fsx:not(.fsx-rot) #fxFlip { display: none; }
#theater.fsx .fsx-tip { display: block; position: absolute; z-index: 9; left: calc(var(--fx-vl) + 14px); top: calc(var(--fx-vt) + 14px); max-width: calc(var(--fx-vw) - 28px); padding: 7px 14px; border-radius: 10px; background: #fff6e8; color: #17112a; border: 2.5px solid #000; box-shadow: 3px 3px 0 var(--sakura); font-size: 14px; font-weight: 900; opacity: 0; transform: translate3d(0, -6px, 0); transition: opacity .25s, transform .3s cubic-bezier(.2, 1.4, .4, 1); pointer-events: none; }
#theater.fsx .fsx-tip.on { opacity: 1; transform: none; }
html.fsx #toast { visibility: hidden; }
.th-deck { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 8px; padding: 12px 12px 4px; }
.th-deck::-webkit-scrollbar { display: none; }
.dk { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #241c46; border: 2.5px solid #000; box-shadow: 2px 2px 0 var(--kc); color: #fff; }
.dk svg { width: 20px; height: 20px; fill: currentColor; }
.dk .pz { display: none; }
.dk span { font-size: 13px; }
.dk.big { width: 52px; height: 52px; background: var(--sun); color: var(--ink); box-shadow: 3px 3px 0 var(--kc); }
.dk.big svg { width: 24px; height: 24px; }
.dk:active { transform: translate(2px, 2px); box-shadow: 0 0 0; }
.dk-sp { flex: 1 0 100%; height: 0; }
@media (min-width: 700px) { .th-deck { justify-content: flex-start; } .dk-sp { flex: 1 1 auto; min-width: 4px; } }
.th-deck .chip { height: 34px; background: #241c46; color: #fff; border-color: #000; box-shadow: 2px 2px 0 #000; }
.th-deck .chip.on { background: var(--violet); }
.th-time { padding: 8px 14px 2px; }
.tl { position: relative; height: 16px; border-radius: 8px; background: #241c46; border: 2.5px solid #000; overflow: hidden; cursor: pointer; }
.tl-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: repeating-linear-gradient(90deg, var(--kc) 0 10px, color-mix(in srgb, var(--kc) 70%, #fff) 10px 14px); transition: transform .9s linear; }
.tl i { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, .55); }
.tl i.r { background: rgba(255, 255, 255, .18); width: 1px; }
.tl-mark { position: absolute; top: -1px; bottom: -1px; width: 4px; margin-left: -2px; background: var(--sun); border-radius: 2px; }
.tl-cap { display: flex; flex-wrap: wrap; align-items: center; margin-top: 7px; font-size: 12px; color: #d8cdf2; font-variant-numeric: tabular-nums; }
.tl-cap b { color: #fff; font-size: 13px; } .tl-cap em { font-style: normal; font-weight: 900; color: var(--sun); }
.tl-cap .moon { font-style: normal; color: #b9c8ff; font-weight: 900; }
.th-side { flex: 1; padding: 6px 0 calc(20px + var(--safe-b)); }

.auto { flex: none; height: 28px; padding: 0 10px; border-radius: 9px; background: #241c46; border: 2px solid #000; color: #c6bbe6; font-size: 11.5px; font-weight: 900; }

.ep { flex: none; width: 168px; text-align: left; }

.ep-th u::before { content: ''; position: absolute; inset: 0; right: auto; width: var(--p); background: var(--sakura); }

.ep-t b { font-weight: 900; color: #fff; } .ep-t small { font-size: inherit; color: #b8acd9; } .ep-t b + small::before { content: '｜'; color: var(--kc); }
/* 放映機裡的蓋板：錯誤、次回預告、晚安、接著看 */
.th-msg, .th-next, .th-sleep { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 14px; background: rgba(10, 7, 22, .9); }

.msg-acts { display: flex; gap: 10px; justify-content: center; }
.th-next { background: linear-gradient(115deg, rgba(10, 7, 22, .95) 55%, color-mix(in srgb, var(--kc) 55%, transparent)); }

}
.nx-n { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--sun); color: var(--ink); border: 3px solid #000; font-size: 22px; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.th-sleep { background: linear-gradient(180deg, #0a0c2e, #1d1650); }
.sl-in { text-align: center; max-width: 440px; }

.resume { position: absolute; z-index: 4; left: 10px; bottom: 54px; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-radius: 12px; background: var(--panel); color: var(--text); border: 2.5px solid #000; box-shadow: 3px 3px 0 var(--sakura); font-size: 12.5px; animation: cardIn .4s cubic-bezier(.2, 1.4, .4, 1) both; transition: opacity .4s, transform .4s; }

/* ---------------------------------------------------------------- 眼睛貼 */

.ec-a { position: absolute; inset: -20%; background: var(--ec); transform: translateX(-62%) skewX(-18deg); animation: ecA .5s cubic-bezier(.2, .9, .2, 1) both; }
.ec-b { position: absolute; inset: -20%; background: var(--sun); transform: translateX(70%) skewX(-18deg); animation: ecB .5s cubic-bezier(.2, .9, .2, 1) .05s both; }
.ec-lines { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(23, 17, 42, .14) 0 1.4deg, transparent 1.4deg 8deg); animation: spin 18s linear infinite; }
@keyframes ecA { from { transform: translateX(-130%) skewX(-18deg); } } @keyframes ecB { from { transform: translateX(140%) skewX(-18deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
.ec-in { position: relative; z-index: 1; text-align: center; padding: 14px 22px; background: #fffaf0; border: 4px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); transform: rotate(-3deg); animation: ecIn .5s cubic-bezier(.2, 1.6, .4, 1) .1s both; max-width: 82%; }
@keyframes ecIn { from { transform: scale(.4) rotate(-14deg); opacity: 0; } }
.ec-logo { display: block; font-size: clamp(30px, 8vw, 54px); line-height: 1; color: var(--sakura); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; }
.ec-ep { display: inline-block; margin-top: 8px; padding: 3px 12px 2px; background: var(--ink); color: var(--sun); border-radius: 8px; font-size: clamp(14px, 3.4vw, 20px); }
.ec-t { display: block; margin-top: 7px; font-size: clamp(12px, 2.8vw, 15px); font-weight: 900; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ec-star { position: absolute; z-index: 1; font-style: normal; color: #fff; font-size: 34px; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; animation: twirl 1.6s ease-in-out infinite; }
.ec-star.s1 { left: 12%; top: 18%; } .ec-star.s2 { right: 14%; top: 24%; font-size: 26px; animation-delay: .3s; } .ec-star.s3 { right: 22%; bottom: 16%; font-size: 30px; animation-delay: .6s; }
@keyframes twirl { 50% { transform: rotate(30deg) scale(1.3); } }
.eyec.lite .ec-a, .eyec.lite .ec-b, .eyec.lite .ec-lines, .eyec.lite .ec-star { animation: none; }

/* ================================================================ 直式滑看 */
#swipe { position: fixed; inset: 0; z-index: 62; background: #07050f; color: #fff; opacity: 0; transition: opacity .3s; overflow: hidden; }
#swipe.in { opacity: 1; }
.sw-view { position: absolute; inset: 0; overflow: hidden; }
.sw-track { position: absolute; inset: 0; }
.sw-poster { position: absolute; left: 50%; width: min(100vw, calc(100vh * 9 / 16)); height: 100%; transform: translateX(-50%); overflow: hidden; background: #120d26; }
.sw-poster.prev { top: -100%; } .sw-poster.cur { top: 0; } .sw-poster.next { top: 100%; }
.sw-poster img { width: 100%; height: 100%; object-fit: cover; }
.sw-poster.cur::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .35), transparent 18%, transparent 55%, rgba(0, 0, 0, .7)); }
.sw-player { position: absolute; left: 50%; top: 0; width: min(100vw, calc(100vh * 9 / 16)); height: 100%; transform: translateX(-50%); opacity: 0; transition: opacity .25s; pointer-events: none; }
#swipe.playing .sw-player { opacity: 1; }
.sw-player iframe, .sw-player > div { width: 100%; height: 100%; border: 0; }
.sw-pad { position: absolute; inset: 0; z-index: 2; touch-action: none; display: grid; place-items: center; }
.sw-pause { width: 84px; height: 84px; display: grid; place-items: center; border-radius: 50%; background: rgba(0, 0, 0, .55); font-style: normal; font-size: 26px; opacity: 0; transition: opacity .2s, transform .2s; transform: scale(.8); }
#swipe.paused .sw-pause { opacity: 1; transform: none; }
.sw-track.bump { animation: bump .35s; }
@keyframes bump { 30% { transform: translate3d(0, -26px, 0); } }
.sw-top { position: absolute; z-index: 3; top: calc(8px + var(--safe-t)); left: 8px; right: 8px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
.sw-top > * { pointer-events: auto; }
.sw-top .ico-btn { background: rgba(0, 0, 0, .55); border: 2px solid #000; }
.sw-top b { font-size: 18px; -webkit-text-stroke: 5px #000; paint-order: stroke fill; }
.sw-top span { font-size: 12px; color: #d9d0f0; text-shadow: 1px 1px 0 #000; }
.sw-info { position: absolute; z-index: 3; left: 14px; right: 84px; bottom: calc(22px + var(--safe-b)); pointer-events: none; }
.sw-info > * { pointer-events: auto; }
.sw-ch { display: flex; align-items: center; gap: 8px; font-size: 14px; text-shadow: 1px 1px 0 #000; }
.sw-ch .ai { font-style: normal; padding: 1px 6px; border-radius: 5px; background: var(--k-ai); border: 2px solid #000; font-size: 10.5px; font-weight: 900; }
.sw-t { margin-top: 8px; font-size: 15px; font-weight: 800; line-height: 1.45; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sw-full { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 12px; border-radius: 12px; background: var(--sun); color: var(--ink); border: 3px solid #000; box-shadow: 3px 3px 0 #000; }
.sw-full b { font-size: 15px; } .sw-full span { font-size: 12px; font-weight: 900; }
.sw-bar { margin-top: 14px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .25); overflow: hidden; }
.sw-bar i { display: block; height: 100%; background: #fff; transform-origin: left; transform: scaleX(0); transition: transform .9s linear; }
.sw-rail { position: absolute; z-index: 3; right: 10px; bottom: calc(110px + var(--safe-b)); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.sr { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; text-shadow: 1px 1px 0 #000; }
.sr i { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 50%; background: rgba(0, 0, 0, .55); border: 2.5px solid #000; font-style: normal; font-size: 22px; }
.sr.on i { background: var(--sakura); }
.sr-n { font-size: 18px; -webkit-text-stroke: 4px #000; paint-order: stroke fill; } .sr-n small { font-size: 11px; }
.sw-arrows { position: absolute; z-index: 3; right: 18px; top: 50%; display: none; flex-direction: column; gap: 10px; transform: translateY(-50%); }
.sw-arrows button { width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, .12); border: 2.5px solid rgba(255, 255, 255, .4); font-size: 16px; }

/* ================================================================ 底板（搜尋、章節、定時） */
#sheet { position: fixed; inset: 0; z-index: 80; }
.sheet-bg { position: absolute; inset: 0; background: rgba(8, 5, 20, .55); opacity: 0; transition: opacity .25s; }
.sheet-in { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto; padding: 18px 0 calc(22px + var(--safe-b)); background: var(--panel); color: var(--text); border-top: 3.5px solid var(--line); border-radius: 24px 24px 0 0; transform: translate3d(0, 100%, 0); transition: transform .32s cubic-bezier(.2, .9, .2, 1); --line: #17112a; }

#sheet.in .sheet-bg { opacity: 1; } #sheet.in .sheet-in { transform: none; }
.sheet-h { padding: 0 18px 12px; } .sheet-h b { display: block; font-size: 22px; } .sheet-h span { display: block; margin-top: 4px; font-size: 12.5px; color: var(--sub); line-height: 1.5; }
.chap-list { display: flex; flex-direction: column; padding: 0 12px; }
.chap { display: flex; gap: 12px; align-items: center; text-align: left; padding: 11px 8px; border-bottom: 2px dashed rgba(127, 110, 160, .3); font-size: 14px; font-weight: 800; }
.chap i { flex: none; width: 70px; font-style: normal; font-variant-numeric: tabular-nums; color: var(--sakura); }
.chap.on { background: var(--sun); color: var(--ink); border-radius: 10px; }
.sleep-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 0 18px; }
.search { padding: 0 0 6px; }
.sq { display: flex; gap: 8px; padding: 0 var(--gut) 10px; }
.sq input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 13px; border: 3px solid var(--line); background: var(--card); color: var(--text); font-size: 16px; outline: none; }

.search .vc-t, .search .mc-t, .search .vc-m, .search .mc-m, .search .sc-m, .search .chc b { color: var(--text); text-shadow: none; }
.search .chc { box-shadow: 3px 3px 0 var(--line); }

/* ================================================================ 墨水圈轉場 */
.iris { position: fixed; inset: 0; z-index: 90; overflow: hidden; pointer-events: none; background: var(--ink); visibility: hidden; clip-path: circle(0 at var(--x, 50%) var(--y, 50%)); }
.iris.close { visibility: visible; transition: clip-path .3s cubic-bezier(.55, 0, .75, .4); clip-path: circle(var(--r, 150vmax) at var(--x, 50%) var(--y, 50%)); }
.iris.open { visibility: visible; clip-path: none; --hole: 0px; -webkit-mask: radial-gradient(circle at var(--x) var(--y), transparent var(--hole), #000 calc(var(--hole) + 1px)); mask: radial-gradient(circle at var(--x) var(--y), transparent var(--hole), #000 calc(var(--hole) + 1px)); animation: irisOpen .42s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes irisOpen { from { --hole: 0px; } to { --hole: var(--r); } }
.iris-dot { position: absolute; left: var(--x); top: var(--y); width: 26px; height: 26px; margin: -13px; border-radius: 50%; background: var(--sun); opacity: 0; }
.iris.close .iris-dot { animation: dotPop .3s ease-in both; }
@keyframes dotPop { 60% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0; transform: scale(.2); } }

/* ================================================================ 開場（OP） */
.gate { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; overflow: hidden; background: linear-gradient(180deg, #1c1150 0%, #4a2378 30%, #a23a7e 58%, #ee6a6a 78%, #ffb45e 100%); color: #fff; }
.g-burst { position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, .14) 0 2deg, transparent 2deg 10deg); animation: spin 40s linear infinite; }
.g-in { position: relative; z-index: 2; text-align: center; padding: 20px; transition: transform .4s cubic-bezier(.5, 0, .7, .3), opacity .3s; }
.g-ep { display: inline-block; padding: 5px 14px 4px; border-radius: 10px; background: var(--ink); color: var(--sun); font-size: 18px; transform: rotate(-3deg); box-shadow: 3px 3px 0 var(--sakura); animation: ecIn .5s cubic-bezier(.2, 1.6, .4, 1) both .1s; }
.g-logo { margin-top: 16px; line-height: .9; animation: ecIn .6s cubic-bezier(.2, 1.6, .4, 1) both .25s; }
.g-logo b { display: block; font-size: clamp(84px, 26vw, 170px); color: #fff; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-shadow: 9px 9px 0 var(--sakura); transform: rotate(-5deg); }
.g-logo span { display: inline-block; margin-top: 4px; font-size: clamp(22px, 6vw, 38px); color: var(--sun); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; letter-spacing: .2em; }
.g-sub { margin-top: 18px; font-size: 16px; font-weight: 900; text-shadow: 2px 2px 0 var(--ink); animation: viewIn .6s ease-out both .45s; }
.g-btn { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; height: 60px; padding: 0 30px 0 22px; border-radius: 20px; background: var(--sun); color: var(--ink); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); font-size: 26px; animation: ecIn .6s cubic-bezier(.2, 1.6, .4, 1) both .6s, float 2.4s ease-in-out infinite 1.2s; }
.g-btn i { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--sun); font-style: normal; font-size: 15px; padding-left: 3px; }
@keyframes float { 50% { transform: translateY(-6px); } }
.g-meta { margin-top: 18px; font-size: 12.5px; font-weight: 800; text-shadow: 1px 1px 0 var(--ink); opacity: .95; }
.g-flash { position: absolute; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; }
.g-cuts { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.cut { position: absolute; width: 74vw; max-width: 520px; aspect-ratio: 16/9; border: 5px solid var(--ink); border-radius: 16px; overflow: hidden; background: var(--ink); box-shadow: 10px 10px 0 var(--ink); opacity: 0; }
.cut img { width: 100%; height: 100%; object-fit: cover; }
.cut.c1 { left: 4%; top: 12%; transform: rotate(-6deg); } .cut.c2 { right: 4%; top: 34%; transform: rotate(5deg); } .cut.c3 { left: 10%; bottom: 12%; transform: rotate(-3deg); }
.gate.go .g-flash { animation: flash .5s ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
.gate.go .g-btn { animation: none; transform: scale(.9); }
.gate.cuts .g-in { transform: scale(.82); opacity: .35; }
.gate.cut1 .cut.c1, .gate.cut2 .cut.c2, .gate.cut3 .cut.c3 { animation: cutIn .32s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes cutIn { 0% { opacity: 0; transform: translate3d(-60px, 0, 0) rotate(-14deg) scale(1.3); } 100% { opacity: 1; } }
.gate.end .g-in { transform: scale(1.06); opacity: 1; }
.gate.end .cut { opacity: 0 !important; transition: opacity .2s; }

function titleParts(t) {

/* ------------------------------------------------------------ 追番同步（轉發站：手機、電腦共用片單） */
const SYNC = { out: store.get('out', []), base: store.get('base', null), fail: 0 };
let VIEW = null;

function emptyMe() { return { follow: {}, later: {}, blocks: {}, hides: {}, prog: {}, adds: [], seen: [] }; }
function applyEv(v, e) {
  switch (e.type) {
    case 'follow': v.follow[e.s] = { t: e.t, n: e.n }; delete v.hides[e.s]; break;
    case 'unfollow': delete v.follow[e.s]; break;
    case 'later': if (e.on === false) delete v.later[e.v]; else v.later[e.v] = e.t; break;
    case 'block': v.blocks[e.ch] = e.t; break;
    case 'unblock': delete v.blocks[e.ch]; break;
    case 'hide': v.hides[e.s] = e.t; delete v.follow[e.s]; break;
    case 'unhide': delete v.hides[e.s]; break;
    case 'prog': { const o = v.prog[e.v]; if (!o || o[2] < e.t) v.prog[e.v] = [e.pos, e.len, e.t, e.dev || '']; break; }
    case 'add': v.adds.push({ id: e.id, q: e.q, t: e.t, st: 'send' }); break;
    default: break;

}
function rebuildView() {
  const b = SYNC.base || emptyMe();

    follow: Object.assign({}, b.follow), later: Object.assign({}, b.later), blocks: Object.assign({}, b.blocks),
    hides: Object.assign({}, b.hides), prog: Object.assign({}, b.prog), adds: (b.adds || []).slice(),
  };
  const seen = new Set(b.seen || []);
  SYNC.out.filter((e) => !seen.has(e.id)).sort((a, z) => a.t - z.t).forEach((e) => applyEv(v, e));
  VIEW = v;
  MEMO.clear();
  return v;
}
function takeMe(me) {

  store.set('base', SYNC.base);
  const seen = new Set(SYNC.base.seen);
  const before = SYNC.out.length;
  SYNC.out = SYNC.out.filter((e) => !seen.has(e.id));
  if (SYNC.out.length !== before) store.set('out', SYNC.out);
  rebuildView();
  mergeRemoteProgress();
  if (typeof syncLight === 'function') syncLight();
}
function newEv(type, fields, quiet) {
  const seq = (store.get('seq', 0) | 0) + 1;
  store.set('seq', seq);
  const ev = Object.assign({ id: DEV + '-' + seq, type, t: Date.now() }, fields);
  // 進度只留最新一筆（同一支影片）
  if (type === 'prog') SYNC.out = SYNC.out.filter((e) => !(e.type === 'prog' && e.v === fields.v));
  SYNC.out.push(ev);
  store.set('out', SYNC.out);

}

function scheduleSend(ms) { clearTimeout(sendTimer); sendTimer = setTimeout(sendNow, ms == null ? 1500 : ms); }
async function sendNow() {
  const now = Date.now();

  if (!todo.length) return;
  for (let i = 0; i < todo.length; i += 14) {
    const chunk = todo.slice(i, i + 14);
    const evs = chunk.map((e) => { const c = Object.assign({}, e); delete c.sent; return c; });
    try {
      await fetch(RELAY, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ v: 1, dev: DEV, evs }) });
      chunk.forEach((e) => { e.sent = now; });
      SYNC.fail = 0;

      break;
    }

  if (typeof syncLight === 'function') syncLight();
}
function syncState() {
  if (SYNC.fail && SYNC.out.length) return 'bad';
  if (SYNC.out.some((e) => e.type !== 'prog')) return 'wait';

}

/* 動作 */
function follow(sid) { const s = IDX.showById.get(sid); if (!s || VIEW.follow[sid]) return; newEv('follow', { s: sid, n: (s.n || '').slice(0, 80) }); }
function unfollow(sid) { if (VIEW.follow[sid]) newEv('unfollow', { s: sid }); }
function setLater(v, on) { if (!!VIEW.later[v] === on) return; newEv('later', { v, on }); }

/* ------------------------------------------------------------ 觀看紀錄（這台裝置；長片的進度另外同步到別台） */
const HIST = store.get('hist', {});      // vid: [最後看的時間 ms, 看到第幾秒, 片長, 看完 0/1, 累積毫秒, 頻道, 作品 id]
const WT = store.get('wt', {});          // 'YYYY-MM-DD': { 類別: 毫秒 }
const SHOWSEEN = store.get('showseen', {});   // 作品 id: 上次打開作品頁的時間（秒）
let histDirty = 0;
function histOf(v) { return HIST[v] || null; }
function noteWatch(v, pos, len, addMs) {
  const h = HIST[v.i] || [0, 0, 0, 0, 0, v.c, ''];
  h[0] = Date.now(); h[1] = Math.round(pos || 0); h[2] = Math.round(len || h[2] || v.d || 0); h[5] = v.c;
  const s = showOf(v); if (s) h[6] = s.id;
  if (h[2] && h[1] / h[2] > 0.93) h[3] = 1;
  h[4] = (h[4] || 0) + (addMs || 0);
  HIST[v.i] = h;
  if (addMs) {
    const k = dayKey();
    WT[k] = WT[k] || {};
    const kd = kindOf(v);
    WT[k][kd] = (WT[k][kd] || 0) + addMs;
    const hr = 'h' + new Date().getHours();
    WT[k][hr] = (WT[k][hr] || 0) + addMs;

function flushHist() {

  if (keys.length > 1500) keys.sort((a, b) => HIST[a][0] - HIST[b][0]).slice(0, keys.length - 1500).forEach((k) => delete HIST[k]);
  const days = Object.keys(WT).sort();
  days.slice(0, Math.max(0, days.length - 120)).forEach((k) => delete WT[k]);

/* 長片看到哪：送一筆進度到轉發站（別台裝置打開時接著看） */
function pushProgress(v, pos, len) {
  if (!v || !len || len < 20 * 60 || pos < 60) return;
  const done = pos / len > 0.93;
  newEv('prog', { v: v.i, pos: Math.round(done ? len : pos), len: Math.round(len), dev: DEV }, true);
}
/* 別台裝置看得比較新：用那邊的進度 */
const REMOTE = {};   // vid: [pos, len, t, dev]
function mergeRemoteProgress() {
  for (const [vid, p] of Object.entries(VIEW.prog || {})) {
    if (!Array.isArray(p) || p[3] === DEV) continue;
    const h = HIST[vid];
    if (!h || h[0] < p[2] - 30e3) {
      REMOTE[vid] = p;
      const nh = h || [0, 0, 0, 0, 0, (IDX.byId.get(vid) || {}).c || '', ''];
      nh[0] = p[2]; nh[1] = p[0]; nh[2] = p[1]; if (p[1] && p[0] / p[1] > 0.93) nh[3] = 1;

    }
  }

/* 這週補了多少：時數、類別、時段、連續天數 */
function weekStats() {
  let total = 0;
  const kinds = {}, hours = new Array(24).fill(0);
  for (let i = 0; i < 7; i++) {
    const day = WT[dayKey(Date.now() - i * 86400e3)] || {};
    for (const [k, ms] of Object.entries(day)) {
      if (k[0] === 'h') hours[+k.slice(1)] += ms;
      else { kinds[k] = (kinds[k] || 0) + ms; total += ms; }
    }
  }
  let streak = 0;
  for (let i = 0; i < 400; i++) {
    const day = WT[dayKey(Date.now() - i * 86400e3)];
    const ms = day ? Object.entries(day).filter(([k]) => k[0] !== 'h').reduce((s, [, x]) => s + x, 0) : 0;
    if (ms > 60e3) streak++; else if (i > 0) break;
  }
  const night = hours.slice(0, 5).reduce((a, b) => a + b, 0) + hours[23];
  const done = Object.values(HIST).filter((h) => h[3]).length;
  let hoursAll = 0;
  for (const day of Object.values(WT)) for (const [k, ms] of Object.entries(day)) if (k[0] !== 'h') hoursAll += ms;
  return { total, kinds, hours, streak, night, done, all: hoursAll };
