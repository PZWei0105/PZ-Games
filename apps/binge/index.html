/* ------------------------------------------------------------ 清單 */
const MEMO = new Map();
function memo(key, fn) { if (!MEMO.has(key)) MEMO.set(key, fn()); return MEMO.get(key); }

function visible(v) {
  if (VIEW.blocks[v.c]) return false;
  const ch = IDX.ch[v.c];
  if (!ch) return false;
  if (ch.k === 'toon' && ch.kids && !SET.kids) return false;
  if (ch.l === 'en' && !SET.west) return false;
  const s = showOf(v);
  if (s && VIEW.hides[s.id]) return false;
  if (v.up && v.p && v.p < nowS() - 6 * 3600) return false;
  return true;
}
const base = () => memo('base', () => IDX.vids.filter(visible));
const inTab = (v, tab) => (KINDS[kindOf(v)] || KINDS.jp).tab === tab;

/* 熱度：觀看數相對這個頻道平常的表現＋新舊；中文優先時中文片加分 */
function heat(v) {
  const ch = IDX.ch[v.c] || {};
  const med = ch.vm || 3000;
  const rel = Math.log2(1 + (v.v || 0) / Math.max(200, med));
  const age = Math.max(0, nowS() - (v.p || nowS())) / 86400;
  const fresh = age < 2 ? 1.2 : age < 7 ? 0.7 : age < 30 ? 0.25 : 0;
  const zh = SET.zhFirst && !v.zh ? -0.8 : 0;
  return rel + fresh + zh + Math.log10(10 + (v.v || 0)) * 0.35;
}
function hot(list) { return list.map((v) => [v, heat(v)]).sort((a, b) => b[1] - a[1]).map((x) => x[0]); }
function newest(list) { return list.slice().sort((a, b) => b.p - a.p); }
/* 同一個頻道不要連續洗版 */
function spread(list, maxRun = 2, win = 6, cap = 240) {
  const head = list.slice(0, cap), tail = list.slice(cap), out = [];
  while (head.length) {
    let k = head.findIndex((it) => out.slice(-win).filter((o) => o.c === it.c).length < maxRun);
    if (k < 0) k = 0;
    out.push(head.splice(k, 1)[0]);
  }
  return out.concat(tail);
}
/* 同一部作品的多支合輯（不同頻道搬同一部）：只留一支 */
function onePerShow(list, n = 1) {
  const seen = new Map(), out = [];
  for (const v of list) {
    const key = v.show >= 0 && v.show != null ? 's' + v.show : (v.nk || v.i);
    const c = seen.get(key) || 0;
    if (c >= n) continue;
    seen.set(key, c + 1);
    out.push(v);
  }
  return out;
}

const L = {
  comps: (tab) => memo('comps:' + tab, () => spread(onePerShow(hot(base().filter((v) => (v.f === 'c' || v.f === 'm') && v.d >= 40 * 60 && (!tab || inTab(v, tab))))))),

/* 搜尋：作品、頻道、影片 */
function search(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return { shows: [], chans: [], vids: [] };
  const has = (s) => (s || '').toLowerCase().includes(q);
  const shows = IDX.shows.filter((s) => showVisible(s) && has(s.n)).slice(0, 12);

}

    if (pos === 0) ch.forEach((m, i) => rhodes(m, t + i * 0.012, S16 * 15, 0.028 - i * 0.002, B));
    if (pos === 10 && bar % 2 === 1) ch.slice(1).forEach((m, i) => rhodes(m + 12, t + i * 0.01, S16 * 5, 0.012, B));

    }
    // 腳踏鈸拿掉了：白噪音做的，一直嚓嚓嚓聽起來像雨聲（痞子葳 2026-11-18）
    // 貝斯：根音，第一拍與第三拍

/* ---- fx.js ---- */
'use strict';
/* 補番 BINGE — 畫面特效：墨水圈轉場（Iris）、眼睛貼（Eyecatch）、閃光（キラキラ）、蓋章、數字滾動、開場（OP） */

const Fx = (() => {
  const lite = () => SET.fx === 'lite' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;

  /* 墨水圈轉場：從點的位置暈開墨水蓋住畫面，換頁，再從畫面中間開一個圈露出新頁（卡通的 Iris） */
  function iris(mid, x, y) {
    const el = $('#iris');
    if (lite() || busy) { if (mid) mid(); return; }
    busy = true;
    Snd.play('tab');
    const W = innerWidth, H = innerHeight;
    x = x == null ? W / 2 : x; y = y == null ? H / 2 : y;
    const R = Math.hypot(Math.max(x, W - x), Math.max(y, H - y)) + 20;
    el.style.setProperty('--x', x + 'px');
    el.style.setProperty('--y', y + 'px');
    el.style.setProperty('--r', R + 'px');
    el.className = 'iris close';
    setTimeout(() => {
      try { if (mid) mid(); } catch (e) { console.error(e); }
      el.style.setProperty('--x', W / 2 + 'px');
      el.style.setProperty('--y', H * 0.45 + 'px');
      el.style.setProperty('--r', Math.hypot(W, H) / 2 + 30 + 'px');
      el.className = 'iris open';
      setTimeout(() => { el.className = 'iris'; busy = false; }, 420);
    }, 300);
  }

  /* 眼睛貼：放映前的一秒小卡（作品名＋第幾話），蓋住播放器載入的空檔 */
  function eyecatch(host, title, ep, color) {
    if (!host) return () => {};
    const el = document.createElement('div');
    el.className = 'eyec' + (lite() ? ' lite' : '');
    el.style.setProperty('--ec', color || 'var(--sakura)');
    el.innerHTML = `<i class="ec-a"></i><i class="ec-b"></i><i class="ec-lines"></i>
      <div class="ec-in"><b class="d ec-logo">補番</b><span class="ec-ep d">${esc(ep || '放映開始')}</span><span class="ec-t">${esc(title || '')}</span></div>
      <i class="ec-star s1">✦</i><i class="ec-star s2">✦</i><i class="ec-star s3">✧</i>`;
    host.appendChild(el);
    Snd.play('eyecatch');
    let gone = false;
    const off = () => {
      if (gone) return;
      gone = true;
      el.classList.add('out');
      setTimeout(() => el.remove(), 420);
    };
    setTimeout(off, 2600);
    return off;
  }

  /* 數字滾動 */
  function count(el, to, ms = 900) {
    if (!el) return;
    if (lite()) { el.textContent = to; return; }
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(to * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* キラキラ：四角星＋小圓點噴出來（追番、抽中） */
  function sparkle(x, y, colors = ['#ffd23f', '#ff4f9a', '#ffffff', '#2ec5ff'], n = 26) {
    if (lite()) return;
    const c = document.createElement('canvas');
    const dpr = Math.min(2, devicePixelRatio || 1);
    const S = 300;
    c.width = c.height = S * dpr;
    c.className = 'fx-burst';
    c.style.cssText = 'left:' + (x - S / 2) + 'px;top:' + (y - S / 2) + 'px;width:' + S + 'px;height:' + S + 'px';
    document.body.appendChild(c);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    const ps = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4, v = 2 + Math.random() * 4.5;
      ps.push({ x: S / 2, y: S / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, l: 1, s: 3 + Math.random() * 7, c: colors[i % colors.length], star: i % 3 !== 2, r: Math.random() * 3 });
    }
    const star = (s) => {
      g.beginPath();
      g.moveTo(0, -s); g.quadraticCurveTo(0, 0, s, 0); g.quadraticCurveTo(0, 0, 0, s); g.quadraticCurveTo(0, 0, -s, 0); g.quadraticCurveTo(0, 0, 0, -s);
      g.fill();
    };
    let f = 0;
    const tick = () => {
      g.clearRect(0, 0, S, S);
      ps.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.09; p.vx *= 0.965; p.vy *= 0.975; p.l -= 0.021; p.r += 0.08;
        if (p.l <= 0) return;
        g.save(); g.globalAlpha = Math.max(0, p.l); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
        if (p.star) star(p.s * (0.6 + p.l * 0.6)); else { g.beginPath(); g.arc(0, 0, p.s * 0.35, 0, 7); g.fill(); }
        g.restore();
      });
      if (++f < 54) requestAnimationFrame(tick); else c.remove();
    };
    requestAnimationFrame(tick);
  }

  /* 蓋章：完食！、抽中！ */
  function stamp(host, text, cls = '') {
    const s = document.createElement('div');
    s.className = 'stamp ' + cls;
    s.innerHTML = '<b class="d">' + esc(text) + '</b>';
    host.appendChild(s);
    setTimeout(() => s.remove(), 1600);
  }

  /* 標題卡：像動畫每一集開頭的「第 N 話『…』」 */
  function titleCard(ep, title, sub, ms = 2900) {
    if (lite()) { toast(title + (sub ? '：' + sub : '')); return; }
    const el = document.createElement('div');
    el.className = 'tcard';
    el.innerHTML = `<div class="tc-in"><span class="tc-ep d">${esc(ep)}</span><b class="tc-t d">${esc(title)}</b>${sub ? `<span class="tc-s">${esc(sub)}</span>` : ''}</div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); }, ms);
    setTimeout(() => el.remove(), ms + 700);
  }

  /* 開場（OP）：天空→點一下開播→白閃→集中線→大字砸下→三格快切（今天的精選）→墨水圈打開 */
  function boot(info) {
    const gate = $('#gate');
    gate.hidden = false;
    gate.className = 'gate';
    const ep = info.ep || 1;
    gate.innerHTML = `
      <i class="g-burst"></i>
      <div class="g-in">
        <div class="g-ep d">第 ${ep} 話</div>
        <div class="g-logo"><b class="d">補番</b><span class="d">BINGE</span></div>
        <div class="g-sub">「${esc(info.line || '今天也一口氣看完吧')}」</div>
        <button class="g-btn d" id="gateBtn"><i>▶</i>開播</button>
        <div class="g-meta">${esc(info.stats || '')}</div>
      </div>
      <div class="g-cuts" id="gCuts">${(info.cuts || []).slice(0, 3).map((id, i) => `<i class="cut c${i + 1}"><img src="${thumb(id, 'hqdefault')}" alt=""></i>`).join('')}</div>
      <i class="g-flash"></i>`;
    return new Promise((res) => {
      const go = () => {
        Snd.init();
        const btn = $('#gateBtn');
        if (btn) btn.disabled = true;
        if (lite()) { gate.hidden = true; gate.innerHTML = ''; res(); return; }
        gate.classList.add('go');
        Snd.play('slam');
        setTimeout(() => { gate.classList.add('cuts'); Snd.play('whoosh'); }, 520);
        [0, 1, 2].forEach((i) => setTimeout(() => { Snd.play('dodon'); gate.classList.add('cut' + (i + 1)); }, 640 + i * 260));
        setTimeout(() => {
          gate.classList.add('end');
          Snd.play('kira');
          setTimeout(() => {
            iris(() => { gate.hidden = true; gate.innerHTML = ''; gate.className = ''; }, innerWidth / 2, innerHeight / 2);
            res();
          }, 380);
        }, 1520);
      };
      $('#gateBtn').addEventListener('click', go, { once: true });
    });
  }
  return { iris, eyecatch, count, sparkle, stamp, titleCard, boot, lite };
})();

/* ---- player.js ---- */
'use strict';
/* 補番 BINGE — 放映機（YouTube 官方播放器＋自己的操作台）與直式滑看（Shorts 一滑一集）
   長片合輯的重點：接著看（這台或另一台看到的地方）、章節／約第幾集、跳到下一集、倍速、跳片頭、睡前定時、次回預告連播。 */

let YTAPI = null;
function loadYT() {
  if (YTAPI) return YTAPI;
  YTAPI = new Promise((res, rej) => {
    if (window.YT && window.YT.Player) { res(); return; }
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch (e) { /* */ } res(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    s.onerror = () => { YTAPI = null; rej(new Error('連不上 YouTube')); };
    document.head.appendChild(s);
    setTimeout(() => rej(new Error('YouTube 播放器載入逾時')), 15000);
  });
  return YTAPI;
}
const RATES = [0.75, 1, 1.25, 1.5, 1.75, 2];

const Player = (() => {
  let yt = null, ready = false, cur = null, ctxIds = [], ctxLabel = '', open_ = false, wantId = null;
  let tickT = 0, acc = 0, nTick = 0, nextT = 0, startedFor = null, ccFor = null, ecOff = null, lastPush = 0;
  let sleepAt = 0, sleepMode = '', fading = false, resumeHint = null;

  function startPos(v) {
    const h = histOf(v.i);
    if (!h || h[3] || v.live) return 0;
    const len = h[2] || v.d || 0;
    if (h[1] > 20 && (!len || h[1] < len - 25)) return h[1];
    return 0;
  }

  async function open(id, list, label) {
    const v = IDX.byId.get(id) || { i: id, c: '', t: 'YouTube 影片', d: 0, f: 'e', ghost: 1 };
    if (Swipe.isOpen()) Swipe.close(true);
    cur = v;
    ctxIds = (list && list.length ? list : [id]).slice(0, 300);
    if (!ctxIds.includes(id)) ctxIds.unshift(id);
    ctxLabel = label || '';
    const box = $('#theater');
    if (!open_) {
      open_ = true;
      box.hidden = false;
      document.documentElement.classList.add('watching');
      requestAnimationFrame(() => box.classList.add('in'));
      Snd.duck(true);
      Land.watch(true);
    }
    hideMsg(); hideNext();
    render();
    showEyecatch(v);
    try { await loadYT(); } catch (e) { showMsg('放映機打不開', e.message + '。可以直接到 YouTube 看。', true); return; }
    playId(v);
  }

  function showEyecatch(v) {
    if (ecOff) ecOff();
    const s = showOf(v);
    const k = KINDS[kindOf(v)] || KINDS.jp;
    ecOff = Fx.eyecatch($('#thFrame'), s ? s.n : v.t, epLabel(v) || FMTS[v.f] && FMTS[v.f].zh || '', k.c);
  }

  function playId(v) {
    wantId = v.i;
    if (v.ne) {
      try { if (yt && ready) yt.stopVideo(); } catch (e) { /* */ }
      if (ecOff) { ecOff(); ecOff = null; }
      showMsg('這支要到 YouTube 看', '頻道不開放在其他 App 播，或有年齡、地區限制。到 YouTube 看，有 Premium 一樣沒有廣告。', true);
      return;
    }

    resumeHint = start > 60 ? start : null;
    const zhSub = SET.zhSubs && !v.zh;
    ccFor = zhSub ? v.i : null;
    if (!yt) {
      ready = false;
      yt = new YT.Player('ytp', {
        videoId: v.i, width: '100%', height: '100%',
        playerVars: {
          autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: TOUCH ? 0 : 1, enablejsapi: 1,
          origin: location.origin, hl: 'zh-TW', cc_lang_pref: 'zh-Hant', cc_load_policy: zhSub ? 1 : 0, start: Math.floor(start) || undefined,
        },
        events: {
          onReady: () => { ready = true; try { yt.playVideo(); } catch (e) { /* */ } },
          onStateChange: onState, onError: onErr, onApiChange: () => { if (ccFor === (cur && cur.i)) tryCaptions(); },
        },
      });
    } else if (ready) {
      try { yt.loadVideoById({ videoId: v.i, startSeconds: Math.floor(start) || 0 }); } catch (e) { /* */ }
    } else {
      setTimeout(() => { if (wantId === v.i) playId(v); }, 400);
    }
  }

  function onState(e) {
    const st = e.data;
    if (st === 1) {
      hideMsg();
      Snd.duck(true);
      if (ecOff) { ecOff(); ecOff = null; }
      if (startedFor !== cur.i) {
        startedFor = cur.i; nTick = 0;
        try { if (SET.rate !== 1) yt.setPlaybackRate(SET.rate); } catch (err) { /* */ }
        if (resumeHint) showResume(resumeHint);
      }
      startTick();
      if (ccFor === cur.i) tryCaptions();
    } else if (st === 2) {
      stopTick(true);
      push(true);
    } else if (st === 0) {
      stopTick(true);
      try { noteWatch(cur, yt.getDuration(), yt.getDuration(), 0); } catch (err) { /* */ }
      push(true);
      renderList();
      if (sleepMode === 'end') { goodnight(); return; }
      if (SET.auto) countdownNext();
    }
  }
  function onErr(e) {
    const code = e.data;
    if ((code === 101 || code === 150) && cur) markNoEmbed(cur.i);
    const why = code === 101 || code === 150 ? '這支影片的頻道不允許在其他 App 播放，或只在特定地區能看。'
      : code === 100 ? '這支影片已經被刪除或設成私人。' : '播放器出了點問題。';
    if (ecOff) { ecOff(); ecOff = null; }
    Snd.play('err');
    showMsg('這支要到 YouTube 看', why, true);
  }
  function tryCaptions() {
    try {
      yt.loadModule('captions');
      const list = yt.getOption('captions', 'tracklist') || [];
      if (!list.length) return;
      const pick = list.find((t) => /^zh-(Hant|TW|HK)/i.test(t.languageCode)) || list.find((t) => /^zh/i.test(t.languageCode));

  /* ---- 每秒：時間軸、約第幾集、觀看紀錄、睡前定時 */
  function startTick() {
    clearInterval(tickT);
    tickT = setInterval(() => {
      if (!yt || !cur) return;
      let st = -1;
      try { st = yt.getPlayerState(); } catch (e) { /* */ }
      updateTime();
      if (sleepAt && !fading && Date.now() >= sleepAt) fadeOut();
      if (st !== 1) return;

      if (nTick % 5 === 0) flushTick();
      if (nTick % 300 === 0) push(false);

  }
  function stopTick(flush) { clearInterval(tickT); tickT = 0; if (flush) flushTick(); }
  function flushTick() {
    if (!cur || (cur.ghost && !cur.c)) { acc = 0; return; }
    try { noteWatch(cur, yt.getCurrentTime(), yt.getDuration(), acc); } catch (e) { /* */ }
    acc = 0;
  }
  function push(force) {
    if (!cur || !yt) return;
    if (!force && Date.now() - lastPush < 120e3) return;
    lastPush = Date.now();
    try { pushProgress(cur, yt.getCurrentTime(), yt.getDuration()); } catch (e) { /* */ }
  }
  function times() {
    let pos = 0, len = cur ? cur.d : 0;
    try { pos = yt.getCurrentTime() || 0; len = yt.getDuration() || len; } catch (e) { /* */ }
    return { pos, len };
  }
  function updateTime() {

    if (fill && len) fill.style.transform = 'scaleX(' + clamp(pos / len, 0, 1).toFixed(4) + ')';
    if (cap) {
      const ap = approxEp(cur, pos);
      const parts = [`<b>${clock(pos)}</b> / ${clock(len)}`];
      if (ap) parts.push(`<em>${esc(ap.label)}${ap.n ? ' / ' + ap.n + ' 集' : ''}</em>`);
      if (len - pos > 60) parts.push('剩 ' + span(len - pos));
      if (sleepAt) parts.push(`<i class="moon">☾ ${new Date(sleepAt).toTimeString().slice(0, 5)} 停</i>`);
      else if (sleepMode === 'end') parts.push('<i class="moon">☾ 這支看完就停</i>');
      cap.innerHTML = parts.join('<span class="dot"></span>');
    }

  }

  /* ---- 操作 */
  function seekBy(s) {
    if (!yt || !ready) return;
    try { const { pos, len } = times(); yt.seekTo(clamp(pos + s, 0, Math.max(0, len - 2)), true); Snd.play('seek'); updateTime(); } catch (e) { /* */ }
  }
  function seekTo(s) { if (!yt || !ready) return; try { yt.seekTo(Math.max(0, s), true); Snd.play('seek'); updateTime(); } catch (e) { /* */ } }
  /* 合輯裡跳到下一集：有章節照章節，沒有就照集數平均長度估 */
  function nextInComp() {
    const { pos, len } = times();

  let real = false;       // 有沒有開真的全螢幕（Android）
  let why = '';           // tilt（轉手機進來的）、btn（按鍵進來的）
  let dir = SET.landDir === -90 ? -90 : 90;   // 90：手機頂端朝左；-90：頂端朝右
  let uprightAt = 0, landAt = 0, cand = null, candT = 0;

  function enter(src, d) {
    if (mode || !Player.isOpen()) return;
    if (d) dir = d;
    mode = innerHeight > innerWidth ? 'rot' : 'fill';
    why = src;
    on(src);
  }
  async function enterReal() {
    const box = $('#theater'), req = box.requestFullscreen || box.webkitRequestFullscreen;
    try { await req.call(box); } catch (e) { /* 不給全螢幕：照樣轉 90 度 */ }
    real = isFs();
    if (real) { try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) { /* 系統不給轉：下面就轉 90 度 */ } }
    enter('btn');
  }
  function exit(silent) {
    if (!mode) return;
    mode = ''; why = ''; cand = null;
    clearTimeout(dimT); clearTimeout(tipT);
    if (real) {
      real = false;
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) { /* */ }
      if (isFs()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { /* */ } }
    }
    $('#theater').classList.remove('fsx', 'fsx-rot');
    document.documentElement.classList.remove('fsx');
    const f = frame();
    VARS.forEach((k) => f.style.removeProperty(k));
    const t = $('#thTip'); if (t) t.classList.remove('on');
    if (!silent) Snd.play('back');
  }
  function toggle() {
    if (mode) { exit(); return; }
    if (CAN_FS) enterReal(); else enter('btn');
  }
  /* 全螢幕時的提示（跳到第幾集、跳過片頭⋯）：寫在播放器裡，跟著轉 */
  function say(msg) {
    const t = $('#thTip');
    if (!t) return;
    t.textContent = msg;
    t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
    clearTimeout(tipT);
    tipT = setTimeout(() => t.classList.remove('on'), 2600);
  }
  /* 右邊的按鈕：進來 3.5 秒後變淡；變淡時第一下只是叫醒（橫拿時拇指常常碰到邊邊） */
  function wake() {
    const r = $('#thRail');
    if (!r) return;
    r.classList.remove('dim');
    const v = Player.cur;
    const comp = !!(v && ((v.chap && v.chap.length) || v.r));
    const sk = $('#thSkip');
    $('#fxSkip').hidden = !(sk && !sk.hidden);
    $('#fxComp').hidden = !comp;
    $('#fxNext').hidden = comp || !Player.hasNext();
    clearTimeout(dimT);
    dimT = setTimeout(() => r.classList.add('dim'), 3500);
  }

  /* 陀螺儀 */
  function onTilt(e) {
    if (e.beta == null || e.gamma == null) return;
    if (!watching || !SET.autoLand || !Player.isOpen()) return;
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    // 「上方」在手機座標裡的方向：x 朝手機右緣、y 朝手機頂端、z 朝螢幕外
    const ux = -Math.cos(b) * Math.sin(g), uy = Math.sin(b), uz = Math.cos(b) * Math.cos(g);
    let st = null;   // 0：直立；90：頂端朝左；-90：頂端朝右；null：平放或斜的，不算
    if (Math.abs(uz) < 0.62) { if (ux > 0.78) st = 90; else if (ux < -0.78) st = -90; else if (uy > 0.78) st = 0; }
    const now = Date.now();
    if (st === null) { cand = null; return; }
    if (st !== cand) { cand = st; candT = now; }
    const held = now - candT;
    if (st === 0) {
      // 轉手機進來的：很快轉回直的、停 0.65 秒 → 退出
      if (mode && why === 'tilt' && held > 650 && candT - landAt < QUICK) exit();
      uprightAt = now;
      return;
    }
    if (held < 400) { if (mode) landAt = now; return; }
    if (!mode) {
      if (candT - uprightAt < QUICK) enter('tilt', st);
      landAt = now;
      return;
    }
    landAt = now;
    if (mode === 'rot' && st !== dir) { dir = st; layout(); }   // 翻到另一邊：跟著轉
  }
  function sense() {
    if (sensing || !TOUCH || !SET.autoLand || !window.DeviceOrientationEvent) return;
    if (IS_IOS && typeof DeviceOrientationEvent.requestPermission === 'function' && store.get('motion') !== 'granted') return;   // iPhone：要先在點擊裡問過
    sensing = true;
    addEventListener('deviceorientation', onTilt);
  }
  function unsense() { sensing = false; removeEventListener('deviceorientation', onTilt); }
  // iPhone 要在點擊裡問「動作與方向」權限：點影片、按全螢幕的那一下順便問（同一次打開 App 只問一次）
  function ask() {
    if (!TOUCH || !SET.autoLand || asked || !window.DeviceOrientationEvent) return;
    if (!IS_IOS || typeof DeviceOrientationEvent.requestPermission !== 'function') { sense(); return; }   // Android 不用問
    if (store.get('motion') === 'denied') return;
    asked = true;
    try {
      DeviceOrientationEvent.requestPermission().then((r) => { store.set('motion', r); if (r === 'granted') sense(); }).catch(() => {});
    } catch (e) { /* */ }
  }
  function watch(v) {
    watching = v;
    cand = null; uprightAt = 0; landAt = 0;
    if (v) sense();
  }
  function onSetting() {
    if (SET.autoLand) { asked = false; if (store.get('motion') === 'denied') store.del('motion'); ask(); sense(); }
    else { unsense(); }
  }

  function init() {
    if (!TOUCH) return;
    document.addEventListener('click', (e) => {
      if (e.target.closest && e.target.closest('a[href^="#watch/"], [data-act="hero-play"], [data-act="gacha-play"], [data-act="sw-full"], [data-act="next"], [data-act="prev"], #thFull')) ask();
    }, true);
    const r = $('#thRail');
    if (r) r.addEventListener('click', (e) => {
      e.stopPropagation();
      if (r.classList.contains('dim')) { wake(); return; }
      const bt = e.target.closest('button');
      if (!bt) { wake(); return; }
      if (bt.id === 'fxExit') { exit(); return; }
      if (bt.id === 'fxFlip') { dir = -dir; SET.landDir = dir; saveSet(); layout(); Snd.play('tick'); }
      else if (bt.id === 'fxSkip') Player.skipOp();
      else if (bt.id === 'fxComp') { if (!Player.nextInComp()) Player.next(); }
      else if (bt.id === 'fxNext') Player.next();
      wake();
    });
    const re = () => { if (mode) layout(); };
    addEventListener('resize', re);
    addEventListener('orientationchange', () => setTimeout(re, 250));
    if (window.visualViewport) visualViewport.addEventListener('resize', re);
    const fsc = () => { if (real && !isFs()) exit(true); };
    document.addEventListener('fullscreenchange', fsc);
    document.addEventListener('webkitfullscreenchange', fsc);
  }
  return { init, toggle, enter, exit, watch, ask, onSetting, say, get mode() { return mode; }, get dir() { return dir; } };
})();

/* ================================================================ 直式滑看：AI 漫劇的 Shorts，一滑一集（紅果那種） */
const Swipe = (() => {
  let yt = null, ready = false, list = [], k = 0, open_ = false, sy = 0, dy = 0, drag = false, t0 = 0, watchMs = 0, tickT = 0;

  async function open(ids, start) {
    if (Player.isOpen()) Player.close(true);
    list = ids.map((x) => IDX.byId.get(x)).filter(Boolean);
    if (!list.length) { toast('現在沒有直式短劇'); return; }
    k = Math.max(0, list.findIndex((v) => v.i === start));
    const box = $('#swipe');
    open_ = true;
    box.hidden = false;
    document.documentElement.classList.add('watching');
    requestAnimationFrame(() => box.classList.add('in'));
    Snd.duck(true);
    render();
    try { await loadYT(); } catch (e) { toast('連不上 YouTube'); return; }
    play();
  }
  function play() {
    const v = list[k];
    if (!v) return;
    if (!yt) {
      yt = new YT.Player('swp', {
        videoId: v.i, width: '100%', height: '100%',
        playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, controls: 0, fs: 0, enablejsapi: 1, origin: location.origin, hl: 'zh-TW', loop: 0 },
        events: {
          onReady: () => { ready = true; try { yt.playVideo(); } catch (e) { /* */ } },
          onStateChange: (e) => {
            $('#swipe').classList.toggle('paused', e.data === 2);
            if (e.data === 1) { $('#swipe').classList.add('playing'); startTick(); }
            if (e.data === 0) { note(); go(1, true); }
          },
          onError: () => { toast('這支不能在這裡播，換下一支'); setTimeout(() => go(1, true), 600); },
        },
      });
    } else if (ready) {
      try { yt.loadVideoById(v.i); } catch (e) { /* */ }
    } else setTimeout(play, 300);
  }
  function startTick() {
    clearInterval(tickT);
    tickT = setInterval(() => {
      if (!yt || !open_) return;
      try { if (yt.getPlayerState() === 1) watchMs += 1000; const p = yt.getCurrentTime(), l = yt.getDuration(); const bar = $('#swBar'); if (bar && l) bar.style.transform = 'scaleX(' + clamp(p / l, 0, 1) + ')'; } catch (e) { /* */ }
    }, 1000);
  }
  function note() {
    const v = list[k];
    if (!v || !yt) return;
    try { noteWatch(v, yt.getCurrentTime(), yt.getDuration(), watchMs); } catch (e) { /* */ }
    watchMs = 0;
  }
  function render() {
    const v = list[k], nx = list[k + 1], pv = list[k - 1];
    const s = showOf(v);
    const full = fullFor(v);
    const later = !!VIEW.later[v.i];
    const img = (el, x) => { el.innerHTML = x ? `<img src="${thumb(x.i, 'hqdefault')}" alt="">` : ''; };
    img($('#swPrev'), pv); img($('#swCurPoster'), v); img($('#swNext'), nx);
    $('#swInfo').innerHTML = `
      <div class="sw-ch">${avatar(v.c, 34)}<b>${esc(chOf(v.c).n)}</b>${v.ai ? '<i class="ai">AI</i>' : ''}</div>
      <div class="sw-t">${esc(v.t)}</div>
      ${full ? `<button class="sw-full" data-act="sw-full" data-v="${full.i}"><b class="d">看完整版</b><span>${esc(full.r ? full.r[0] + '–' + full.r[1] + ' 集 · ' : '')}${span(full.d)}</span></button>` : ''}
      <div class="sw-bar"><i id="swBar"></i></div>`;
    $('#swRail').innerHTML = `
      <button class="sr ${later ? 'on' : ''}" data-act="sw-later" data-v="${v.i}"><i>${later ? '♥' : '♡'}</i><span>${later ? '已收' : '收藏'}</span></button>
      ${s ? `<button class="sr ${following(s.id) ? 'on' : ''}" data-act="${following(s.id) ? 'unfollow' : 'follow'}" data-s="${esc(s.id)}"><i>${following(s.id) ? '★' : '☆'}</i><span>追番</span></button>` : ''}
      <a class="sr" href="${ytUrl(v.i)}" target="_blank" rel="noopener"><i>↗</i><span>YouTube</span></a>
      <span class="sr-n d">${k + 1}<small>/${list.length}</small></span>`;
    $('#swipe').classList.remove('playing', 'paused');
  }
  /* 這支短劇有沒有完整版合輯（同一部作品的長片） */
  function fullFor(v) {
    const s = showOf(v);
    if (s) { const c = s.eps.find((x) => x.f === 'c' || x.d > 30 * 60); if (c) return c; }
    const name = (v.t.match(/《([^》]{2,30})》/) || [])[1];
    if (!name) return null;
    return L.comps('ai').find((x) => x.t.includes(name)) || null;
  }
  function go(d, auto) {
    const nk = k + d;
    if (nk < 0) { bounce(); return; }
    if (nk >= list.length) { toast('滑到底了：這批短劇看完了'); bounce(); return; }
    note();
    k = nk;
    Snd.play('swipe');
    const st = $('#swTrack');
    $('#swipe').classList.remove('playing');
    if (Fx.lite()) { render(); play(); return; }
    st.style.transition = 'transform .26s cubic-bezier(.3,.7,.2,1)';
    st.style.transform = `translate3d(0,${d > 0 ? -100 : 100}%,0)`;
    setTimeout(() => { st.style.transition = 'none'; st.style.transform = ''; render(); play(); }, 270);
  }
  function bounce() { const st = $('#swTrack'); st.style.transition = ''; st.classList.remove('bump'); void st.offsetWidth; st.classList.add('bump'); }
  function close(silent) {
    if (!open_) return;
    note();
    open_ = false;
    clearInterval(tickT);
    try { yt && yt.stopVideo(); } catch (e) { /* */ }
    const box = $('#swipe');
    box.classList.remove('in', 'playing');
    document.documentElement.classList.remove('watching');
    setTimeout(() => { if (!open_) box.hidden = true; }, 320);
    Snd.duck(false);
    if (!silent) Snd.play('back');
    if (typeof onPlayerClosed === 'function') onPlayerClosed();
  }
  function toggle() { if (!yt || !ready) return; try { if (yt.getPlayerState() === 1) yt.pauseVideo(); else yt.playVideo(); } catch (e) { /* */ } }
  function bind() {
    const st = $('#swTrack'), pad = $('#swPad');
    pad.addEventListener('pointerdown', (e) => { drag = true; sy = e.clientY; dy = 0; t0 = Date.now(); st.style.transition = 'none'; });
    pad.addEventListener('pointermove', (e) => { if (!drag) return; dy = e.clientY - sy; st.style.transform = `translate3d(0,${dy * 0.9}px,0)`; });
    const end = () => {
      if (!drag) return;
      drag = false;
      if (Math.abs(dy) > 70) { go(dy < 0 ? 1 : -1); return; }
      st.style.transition = 'transform .2s ease-out';
      st.style.transform = '';
      if (Math.abs(dy) < 8 && Date.now() - t0 < 300) toggle();
    };
    pad.addEventListener('pointerup', end);
    pad.addEventListener('pointercancel', end);
    let wheelAt = 0;
    $('#swipe').addEventListener('wheel', (e) => { e.preventDefault(); const t = Date.now(); if (t - wheelAt < 600 || Math.abs(e.deltaY) < 30) return; wheelAt = t; go(e.deltaY > 0 ? 1 : -1); }, { passive: false });
  }
  return { open, close, go, toggle, bind, isOpen: () => open_, render, get cur() { return list[k]; } };
})();

/* ---- views.js ---- */
'use strict';
/* 補番 BINGE — 畫面：放送（首頁）、AI 動畫、番劇、片單、作品頁、頻道頁、看全部、搜尋 */

const CTX = new Map();      // 每一排的影片清單（開放映機時，「接下來」就照這排）
function ctxOf(name, items) { CTX.set(name, items.map((x) => x.i)); return name; }

/* ------------------------------------------------------------ 元件 */
function avatar(c, size = 28) {
  const ch = chOf(c);
  const s = 'width:' + size + 'px;height:' + size + 'px';
  if (ch.a) return `<span class="av" style="${s}"><img loading="lazy" src="${esc(ch.a)}" alt="" referrerpolicy="no-referrer"></span>`;
  const n = (ch.n || '?').trim().charAt(0).toUpperCase();
  return `<span class="av av-t" style="${s};--h:${hash32(c || n) % 360};font-size:${Math.round(size * 0.46)}px">${esc(n)}</span>`;
}
function kchip(kind) { const k = KINDS[kind] || KINDS.jp; return `<i class="kc" style="--kc:${k.c}">${esc(k.zh)}</i>`; }
function secHead(zh, en, more, opt = {}) {
  return `<div class="sh" style="--sc:${opt.c || 'var(--sun)'}"><h2><b class="d">${esc(zh)}</b><i>${esc(en)}</i></h2>${opt.note ? `<span class="sh-note">${opt.note}</span>` : ''}${more ? `<a class="sh-more" href="${more}">全部<span>›</span></a>` : ''}</div>`;
}
function progOf(v) { const h = histOf(v.i); return h && !h[3] && h[2] ? clamp(h[1] / h[2], 0.02, 1) : 0; }
function isNew(v) { return v.p && v.p * 1000 > (store.get('visit', 0) || 0) && nowS() - v.p < 4 * 86400 && !histOf(v.i); }

/* 影片卡 */
function vcard(v, ctx, opt = {}) {
  const k = KINDS[kindOf(v)] || KINDS.jp, h = histOf(v.i), pg = progOf(v), ch = chOf(v.c);
  const ep = epLabel(v);
  const meta = [];
  if (v.live) meta.push(`<b class="red">${v.cv ? num(v.cv) + ' 人在看' : '直播中'}</b>`);
  else if (v.up) meta.push('<b class="gold">即將播出</b>');
  else if (v.p) meta.push(esc(ago(v.p)));
  if (v.v && !v.live) meta.push(num(v.v));
  return `<a class="vc${opt.big ? ' big' : ''}${h && h[3] ? ' seen' : ''}" href="#watch/${v.i}" data-v="${v.i}" data-ctx="${ctx || ''}" style="--kc:${k.c}">
    <span class="vc-th"><img loading="lazy" src="${thumb(v.i)}" alt="">
      <i class="vc-k">${v.live ? '<b class="dotlive"></b>LIVE' : esc(opt.kind === false ? (FMTS[v.f] || FMTS.e).zh : k.short)}</i>
      ${v.ai && kindOf(v) !== 'ai' ? '<i class="vc-ai">AI</i>' : ''}
      ${v.d && !v.live ? `<i class="vc-d">${clock(v.d)}</i>` : ''}
      ${ep && !opt.noep ? `<i class="vc-ep">${esc(ep)}</i>` : ''}
      ${h && h[3] ? '<i class="vc-done d">完食</i>' : isNew(v) ? '<i class="vc-new d">NEW!</i>' : ''}
      ${v.ne ? '<i class="vc-ne">到 YouTube 看 ↗</i>' : ''}
      ${pg ? `<i class="vc-pg" style="--p:${(pg * 100).toFixed(0)}%"></i>` : ''}
    </span>
    <span class="vc-t">${vtitle(v)}</span>
    <span class="vc-m">${opt.noch ? '' : avatar(v.c, 18) + `<b>${esc(ch.n || '')}</b>`}${v.ext ? '<em class="vc-x">名單外</em>' : ''}${meta.length ? '<span>' + meta.join(' · ') + '</span>' : ''}</span>
  </a>`;
}
/* 標題：作品的單集 → 作品名＋這一集；長片合輯 → 《》裡的名字放大 */
function vtitle(v) {
  const s = showOf(v);
  if (s) return `<b>${esc(s.n)}</b>${v.t && v.t !== s.n ? `<small>${esc(v.t)}</small>` : ''}`;
  const tp = titleParts(v.t);
  if (tp.name) return `<b>${esc(tp.name)}</b>${tp.rest ? `<small>${esc(tp.rest)}</small>` : ''}`;
  return esc(v.t);
}
/* 長片合輯卡：大大的片長＋集數範圍 */
function mcard(v, ctx, opt = {}) {
  const k = KINDS[kindOf(v)] || KINDS.jp, h = histOf(v.i), pg = progOf(v), ch = chOf(v.c);
  const ap = h && !h[3] ? approxEp(v, h[1]) : null;
  const gs = genreOf(v.t).slice(0, 2);
  return `<a class="mc${opt.wide ? ' wide' : ''}${h && h[3] ? ' seen' : ''}" href="#watch/${v.i}" data-v="${v.i}" data-ctx="${ctx || ''}" style="--kc:${k.c}">
    <span class="mc-th"><img loading="lazy" src="${thumb(v.i, opt.wide ? 'hqdefault' : 'mqdefault')}" alt="">
      <i class="mc-len d"><b>${hm(v.d)}</b></i>
      ${v.r ? `<i class="mc-rg">${v.r[0]}–${v.r[1]} 集</i>` : ''}
      ${h && h[3] ? '<i class="vc-done d">完食</i>' : isNew(v) ? '<i class="vc-new d">NEW!</i>' : ''}
      ${v.ne ? '<i class="vc-ne">到 YouTube 看 ↗</i>' : ''}
      ${pg ? `<i class="vc-pg" style="--p:${(pg * 100).toFixed(0)}%"></i>` : ''}
    </span>
    <span class="mc-t">${vtitle(v)}</span>
    <span class="mc-m">${avatar(v.c, 18)}<b>${esc(ch.n || '')}</b>${v.ext ? '<em class="vc-x">名單外</em>' : ''}${ap ? `<em>${esc(ap.label)}</em>` : pg ? `<em>剩 ${span((1 - pg) * v.d)}</em>` : gs.length ? gs.map((g) => `<u>${esc(g)}</u>`).join('') : `<span>${v.v ? num(v.v) + ' 次' : ''}</span>`}</span>
  </a>`;
}
/* 作品卡 */
function scard(s, opt = {}) {
  const k = KINDS[s.kind] || KINDS.jp;
  const cover = IDX.vids[s.cv] || s.eps[0];
  const pr = showProgress(s);
  const fol = following(s.id);
  const news = SL.news().find((x) => x.s === s);
  const unit = s.kind === 'jp' ? '話' : '集';
  return `<a class="sc${pr.done ? ' seen' : ''}" href="#show/${encodeURIComponent(s.id)}" style="--kc:${k.c}">
    <span class="sc-th"><img loading="lazy" src="${thumb(cover.i, 'mqdefault')}" alt="">
      <i class="sc-n d">${s.n_eps}<small>${unit}</small></i>
      ${fol ? '<i class="sc-fol">★</i>' : ''}
      ${news ? `<i class="vc-new d">+${news.n}</i>` : pr.done ? '<i class="vc-done d">完食</i>' : ''}
      ${pr.watched ? `<i class="sc-pg" style="--p:${(pr.watched / s.n_eps * 100).toFixed(0)}%"></i>` : ''}
      <b class="sc-name">${esc(s.n)}</b>
    </span>
    <span class="sc-m">${opt.noch ? '' : `<b>${esc(chOf(s.c).n)}</b>`}<span>${pr.watched ? '看到第 ' + (pr.last + 1) + ' ' + unit : s.dur > 3600 ? span(s.dur) : s.t ? ago(s.t) : ''}</span></span>
  </a>`;
}
function row(name, items, opt = {}, fn = vcard) {
  if (!items.length) return '';
  const ctx = ctxOf(name, items);
  const shown = items.slice(0, opt.max || 16);
  return `<section class="sec ${opt.cls || ''}">${secHead(opt.zh, opt.en, opt.more, opt)}
    <div class="row${opt.big ? ' big' : ''}">${shown.map((v) => fn(v, ctx, opt)).join('')}${opt.more && items.length > shown.length ? `<a class="more-card" href="${opt.more}"><b class="d">${items.length}</b><span>看全部</span></a>` : ''}</div></section>`;
}
function showRow(items, opt = {}) {
  if (!items.length) return '';
  const shown = items.slice(0, opt.max || 14);
  return `<section class="sec">${secHead(opt.zh, opt.en, opt.more, opt)}<div class="row">${shown.map((s) => scard(s, opt)).join('')}${opt.more && items.length > shown.length ? `<a class="more-card" href="${opt.more}"><b class="d">${items.length}</b><span>看全部</span></a>` : ''}</div></section>`;
}
function grid(name, items, fn = vcard, opt = {}) {

const LF = { limit: 48 };
function listOf(kind) {
  const [a, b] = kind.split(':');
  switch (a) {
    case 'comps': return { t: b === 'ai' ? '一口氣看完' : '番劇合輯', en: 'MARATHON', items: b === 'ai' ? aiList(() => L.comps('ai')) : L.comps(b || ''), card: mcard };
    case 'fresh': return { t: '新上架', en: 'JUST IN', items: b === 'ai' ? aiList(() => L.fresh('ai')) : L.fresh(b || '') };
    case 'eps': return { t: (KINDS[b] || KINDS.jp).zh + '・新集', en: 'NEW EPISODES', items: L.eps(b) };
    case 'kind': return { t: (KINDS[b] || KINDS.jp).zh, en: (KINDS[b] || KINDS.jp).en, items: L.kind(b) };
    case 'movies': return { t: '劇場版・動畫電影', en: 'MOVIES', items: L.movies() };
    case 'live': return { t: '直播馬拉松', en: 'ON AIR', items: L.live() };
    case 'xlive': return { t: '全天放送', en: '24H ON AIR', items: L.xlive() };
    case 'xcomp': return { t: '全網熱補', en: 'FOUND ONLINE', items: L.xcomps(), card: mcard };
    case 'genre': { const g = decodeURIComponent(b || ''); return { t: g, en: 'GENRE', items: L.genre(g, 'ai').filter((v) => AIF === 'all' || kindOf(v) === AIF), card: (v, ctx) => (v.f === 'c' || v.f === 'm' ? mcard(v, ctx) : vcard(v, ctx)) }; }
    case 'len': return { t: { 1: '1 小時以下', 3: '1～3 小時', 8: '3～8 小時', 99: '8 小時以上' }[b] || '片長', en: 'LENGTH', items: lenList(b), card: mcard };
    case 'later': return { t: '片單', en: 'SAVED', items: L.later() };
    case 'cont': return { t: '繼續補番', en: 'CONTINUE', items: L.cont(), card: contCard };
    case 'history': return { t: '看過的', en: 'HISTORY', items: L.history() };
    case 'shows': return { t: '系列作品', en: 'SERIES', shows: SL.all(b || '', '') };
    default: return { t: '全部', en: 'ALL', items: L.all('') };
  }
}
function vList(kind) {
  if (!D.cat) return loadingView();
  const m = listOf(kind);
  let h = backBar('返回') + pageHead(m.t, m.en, m.items ? m.items.length + ' 支' : m.shows.length + ' 部');
  if (m.shows) return h + `<div class="grid sgrid">${m.shows.slice(0, LF.limit).map((s) => scard(s)).join('')}</div>${m.shows.length > LF.limit ? `<button class="btn wide" data-act="more" data-n="${LF.limit + 48}">再載入</button>` : ''}`;

  return h + grid('list:' + kind, m.items, m.card || vcard, { cls: m.card === mcard ? 'mgrid' : '' });
}

function openSheet(html) {
  const s = $('#sheet');
  s.hidden = false;
  s.innerHTML = `<div class="sheet-bg" data-act="sheet-close"></div><div class="sheet-in">${html}</div>`;
  requestAnimationFrame(() => s.classList.add('in'));
}
function closeSheet() {
  const s = $('#sheet');
  if (s.hidden) return;
  s.classList.remove('in');
  setTimeout(() => { s.hidden = true; s.innerHTML = ''; }, 260);
}

/* ---- main.js ---- */
'use strict';
/* 補番 BINGE — 路由、點擊、天空、開場 */

let ROUTE = null, BASE = 'home', PENDING_CTX = '', LAST_TAB = 'home';
const SCROLL = new Map();
const TABS = ['home', 'ai', 'ani', 'mine'];
function tabOf(r) {
  if (TABS.includes(r)) return r;
  if (r === 'key') return 'mine';
  if (r.startsWith('list/')) { const k = r.slice(5); if (/^(comps:ai|fresh:ai|genre|len|shows:ai)/.test(k)) return 'ai'; if (/^(eps|comps:ani|movies|kind)/.test(k)) return 'ani'; if (/^(later|cont|history)/.test(k)) return 'mine'; }
  return LAST_TAB;
}
function parse() { return decodeURIComponent((location.hash || '').replace(/^#/, '')) || 'home'; }

function render(r) {
  const v = $('#view');
  let html;
  try {
    if (r === 'home') html = vHome();
    else if (r === 'ai') html = vAI();
    else if (r === 'ani') html = vAni();
    else if (r === 'mine') html = vMine();
    else if (r === 'key') html = vKey();
    else if (r.startsWith('show/')) html = vShow(r.slice(5));
    else if (r.startsWith('ch/')) html = vChannel(r.slice(3));
    else if (r.startsWith('list/')) html = vList(r.slice(5));
    else html = vHome();
  } catch (e) {
    console.error(e);
    html = empty('這頁打不開', esc(e.message), '<a class="btn" href="#home">回放送</a>');
  }
  v.innerHTML = html;
  v.className = 'r-' + r.split('/')[0];
  const t = tabOf(r);
  LAST_TAB = t;
  $$('#tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === t));
  moveTabInk();
  if (r === 'home') heroStart(); else clearInterval(heroTimer);
  if (r === 'mine') $$('[data-count]').forEach((el) => { const n = +el.dataset.count; if (Number.isInteger(n) && n > 0) Fx.count(el, n, 900); });
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
}

function route(ev) {
  const r = parse();
  if (r.startsWith('watch/')) {
    const id = r.slice(6);
    if (ROUTE == null) { ROUTE = BASE; render(BASE); }
    if (SET.play === 'yt' && !Player.isOpen()) { history.replaceState(null, '', '#' + (ROUTE || 'home')); window.open(ytUrl(id, (histOf(id) || [])[1]), '_blank'); return; }
    if (!Player.isOpen() || !Player.cur || Player.cur.i !== id) {
      const ctx = CTX.get(PENDING_CTX) || defaultCtx(id);
      Player.open(id, ctx, ctxLabel(PENDING_CTX, id));
    }
    PENDING_CTX = '';
    return;
  }
  if (Player.isOpen()) Player.close();
  if (Swipe.isOpen()) Swipe.close();
  if (r === ROUTE) return;
  if (ROUTE) SCROLL.set(ROUTE, scrollY);
  const prev = ROUTE;
  const go = () => { ROUTE = r; BASE = r; render(r); scrollTo(0, SCROLL.get(r) || 0); };
  if (prev && TABS.includes(r) && tabOf(prev) !== r) {
    const a = $('#tabs a[data-tab="' + r + '"]');
    const b = a && a.getBoundingClientRect();
    Fx.iris(go, b ? b.left + b.width / 2 : null, b ? b.top + b.height / 2 : null);
  } else { go(); if (prev) Snd.play('select'); }
}
function defaultCtx(id) {
  const v = IDX.byId.get(id);
  if (!v) return [id];
  const s = showOf(v);
  if (s) return s.eps.map((x) => x.i);
  return L.all(tabOf(ROUTE || 'home') === 'ai' ? 'ai' : '').map((x) => x.i);
}
function ctxLabel(name, id) {
  if (!name) { const s = showOf(IDX.byId.get(id)); return s ? s.n : ''; }
  const map = { hero: '今日放送', cont: '繼續補番', news: '追番更新', live: '直播馬拉松', comps: '一口氣看完', aicomps: '一口氣看完', jp: '日本動畫新集', cn: '國漫新集', anicomp: '番劇合輯', movies: '劇場版', toon: '卡通', later: '片單', aifresh: '新上架', search: '搜尋結果' };
  if (map[name]) return map[name];
  if (name.startsWith('show:')) { const s = IDX.showById.get(name.slice(5)); return s ? s.n : ''; }
  if (name.startsWith('ch:')) return chOf(name.slice(3)).n || '';
  if (name.startsWith('list:')) return listOf(name.slice(5)).t;
  return '';
}
function onPlayerTake(v) { history.replaceState(null, '', '#watch/' + v.i); }
function onPlayerClosed() {
  if (parse().startsWith('watch/')) {
    if (history.length > 1 && ROUTE) history.back(); else history.replaceState(null, '', '#' + BASE);
  }
  MEMO.delete('cont'); MEMO.delete('news'); MEMO.delete('hero');
  if (['home', 'mine', 'ai', 'ani'].includes(ROUTE) || (ROUTE || '').startsWith('show/') || (ROUTE || '').startsWith('list/')) softRefresh();
}
function softRefresh() { const y = scrollY; render(ROUTE || 'home'); scrollTo(0, y); }

function moveTabInk() {
  const on = $('#tabs a.on');
  let ink = $('#tabs .ink');
  if (!ink) { ink = document.createElement('i'); ink.className = 'ink'; $('#tabs').appendChild(ink); }
  if (!on) { ink.style.opacity = 0; return; }
  const r = on.getBoundingClientRect(), p = $('#tabs').getBoundingClientRect();
  const vertical = p.height > p.width;
  ink.style.opacity = 1;
  ink.style.transform = vertical ? `translate3d(0,${r.top - p.top}px,0)` : `translate3d(${r.left - p.left}px,0,0)`;
  ink.style[vertical ? 'height' : 'width'] = (vertical ? r.height : r.width) + 'px';
  ink.style[vertical ? 'width' : 'height'] = '';
}

/* ------------------------------------------------------------ 點擊 */
function hap() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* */ } }
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  const link = e.target.closest('a[href]');
  if (!a && link) {
    const href = link.getAttribute('href');
    if (href.startsWith('#watch/')) {
      PENDING_CTX = link.dataset.ctx || '';
      const tid = href.slice(7), tv = IDX.byId.get(tid);
      // 只能到 YouTube 看的：一點就直接開 YouTube，不用先進放映室看錯誤訊息
      if (SET.play === 'yt' || (tv && tv.ne)) { e.preventDefault(); window.open(ytUrl(tid, (histOf(tid) || [])[1]), '_blank'); Snd.play('tap'); return; }
      Snd.play('tap');
    } else if (link.target === '_blank') Snd.play('tap');
    else if (href.startsWith('#show/') || href.startsWith('#ch/') || href.startsWith('#list/')) { Snd.play('tap'); if (href.startsWith('#show/')) EPR = 0; }
    if (link.dataset.close && Player.isOpen()) { /* 換頁時路由會關掉放映機 */ }
    return;
  }
  if (!a) return;
  const act = a.dataset.act, v = a.dataset.v, k = a.dataset.k;
  switch (act) {
    case 'follow': {
      e.preventDefault();
      follow(a.dataset.s);
      Snd.play('kira'); hap();
      const r = a.getBoundingClientRect(); Fx.sparkle(r.left + r.width / 2, r.top + r.height / 2);
      toast('追番了：出新集會出現在放送頁最上面');
      afterAction();
      break;
    }
    case 'unfollow': e.preventDefault(); unfollow(a.dataset.s); Snd.play('unkira'); toast('不追了'); afterAction(); break;
    case 'later': case 'sw-later': {
      const on = !VIEW.later[v];
      setLater(v, on);
      Snd.play('later'); hap();
      toast(on ? '收進片單（手機、電腦都看得到）' : '從片單拿掉');
      if (act === 'sw-later') Swipe.render(); else afterAction();
      break;
    }
    case 'hide': hideShow(a.dataset.s); Snd.play('back'); toast('不會再出現這部'); history.back(); break;
    case 'unhide': unhideShow(a.dataset.s); Snd.play('select'); afterAction(); break;
    case 'block': block(a.dataset.c); Snd.play('back'); toast('封鎖了，這台的影片不會再出現'); afterAction(); break;
    case 'unblock': unblock(a.dataset.c); Snd.play('select'); toast('解除封鎖'); afterAction(); break;
    case 'copy': { const url = ytUrl(v); (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('連結複製好了'), () => toast(url)); Snd.play('select'); break; }
    case 'take': Player.take(v); break;
    case 'prev': Player.prev(); break;
    case 'next': Player.next(); break;
    case 'toggle': Player.toggle(); Snd.play('tap'); break;
    case 'back10': Player.seekBy(-10); break;
    case 'fwd10': Player.seekBy(10); break;
    case 'skipop': Player.skipOp(); break;
    case 'comp-next': if (!Player.nextInComp()) toast('這支沒有分集資訊'); break;
    case 'rate': Player.cycleRate(); break;
    case 'sleep-menu': Player.sleepSheet(); Snd.play('select'); break;
    case 'sleep-set': closeSheet(); Player.setSleep(k); break;
    case 'sleep-more': Player.sleepMore(); break;
    case 'chap-menu': Player.chapterSheet(); Snd.play('select'); break;
    case 'chap-go': closeSheet(); Player.seekTo(+a.dataset.s); break;
    case 'tl-seek': Player.tlSeek(e, a); break;
    case 'from-start': Player.fromStart(); break;
    case 'auto': SET.auto = !SET.auto; saveSet(); Snd.play('tick'); toast(SET.auto ? '連播開著：看完自動接下一集' : '連播關了'); Player.refresh(); $$('.auto').forEach((x) => { x.classList.toggle('on', SET.auto); x.textContent = '連播 ' + (SET.auto ? 'ON' : 'OFF'); }); break;
    case 'nx-cancel': Player.cancelNext(); Snd.play('back'); break;
    case 'th-close': Player.close(); break;
    case 'hero-play': { const id = heroCur(); if (id) { PENDING_CTX = 'hero'; location.hash = 'watch/' + id; } break; }
    case 'hero-later': { const id = heroCur(); if (id) { const on = !VIEW.later[id]; setLater(id, on); Snd.play('later'); toast(on ? '收進片單' : '從片單拿掉'); } break; }
    case 'hero-go': heroGo(+a.dataset.i); clearInterval(heroTimer); break;
    case 'gacha': spinGacha(a); break;
    case 'gacha-play': PENDING_CTX = ''; location.hash = 'watch/' + v; break;
    case 'aif': AIF = k; LF.limit = 48; Snd.play('tick'); MEMO.clear(); softRefresh(); break;
    case 'anif': ANIF = k; LF.limit = 48; Snd.play('tick'); softRefresh(); break;
    case 'anis': ANIS = k; Snd.play('tick'); softRefresh(); break;
    case 'epr': EPR = +k; Snd.play('tick'); softRefresh(); break;
    case 'swipe-open': { const ids = CTX.get(a.dataset.ctx) || []; Snd.play('whoosh'); Swipe.open(ids, ids[0]); break; }
    case 'sw-full': Swipe.close(true); PENDING_CTX = ''; location.hash = 'watch/' + v; break;
    case 'sw-close': Swipe.close(); break;
    case 'sw-up': Swipe.go(-1); break;
    case 'sw-down': Swipe.go(1); break;
    case 'more': LF.limit = +a.dataset.n || 96; softRefresh(); break;
    case 'back': Snd.play('back'); if (history.length > 1) history.back(); else location.hash = LAST_TAB || 'home'; break;
    case 'reload': Snd.play('select'); toast('重新接收片庫…'); refreshData(true).then(() => softRefresh()); break;
    case 'replay-op': store.del('boot'); bootSequence(true); break;
    case 'clear-hist': if (a.dataset.sure) { clearHistory(); toast('清掉了'); softRefresh(); } else { a.dataset.sure = 1; a.textContent = '再按一次確定清除'; } break;
    case 'set-seg': {
      const key = a.dataset.k, val = a.dataset.v;
      SET[key] = ['skipOp'].includes(key) ? +val : val;
      saveSet();
      Snd.play('tick');
      if (key === 'sky') applySky();
      if (key === 'fx') applyFx();
      softRefresh();
      break;
    }
    case 'add-ch': {
      const q = ($('#addQ') || {}).value || '';
      if (!q.trim()) { toast('先貼上頻道網址或 @代號'); Snd.play('err'); break; }
      addChannel(q.trim());
      Snd.play('kira');
      toast('送出了：下一次片庫更新（30 分鐘內）就會加入');
      afterAction();
      break;
    }
    case 'stip': { const q = $('#sq'); if (q) { q.value = k; renderSearch(k); } break; }
    case 'sheet-close': closeSheet(); Snd.play('back'); break;
    default: break;
  }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.set;
  if (!k) return;
  if (e.target.type === 'checkbox') SET[k] = e.target.checked;
  else if (e.target.type === 'range') SET[k] = +e.target.value;
  saveSet();
  if (k === 'bgm' || k === 'sfx' || k === 'vol') { Snd.init(); Snd.refresh(); }
  if (['zhFirst', 'kids', 'west'].includes(k)) MEMO.clear();
  if (k === 'autoLand') Land.onSetting();
  Snd.play('tick');
});
document.addEventListener('input', (e) => { if (e.target.dataset && e.target.dataset.set === 'vol') { SET.vol = +e.target.value; Snd.refresh(); } });
document.addEventListener('error', (e) => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG') return;
  if (t.dataset.fb && t.src !== t.dataset.fb) { t.src = t.dataset.fb; return; }
  t.classList.add('noimg');
}, true);
let hoverAt = 0;
document.addEventListener('pointerover', (e) => {
  if (e.pointerType !== 'mouse') return;
  const c = e.target.closest('.vc,.mc,.sc,.cc,.ep2,.go-btn,.genre,.len,.chc');
  if (!c || c === document.__lastHover) return;
  document.__lastHover = c;
  const t = performance.now();
  if (t - hoverAt > 60) { hoverAt = t; Snd.play('tick'); }
});
function afterAction() {
  MEMO.clear();
  if (Player.isOpen()) Player.refresh();
  if (Swipe.isOpen()) Swipe.render();
  softRefresh();
}

/* ------------------------------------------------------------ 其他 */
let toastT = 0;
let scrolledOn = false;
addEventListener('scroll', () => {
  const on = scrollY > 8;
  if (on !== scrolledOn) { scrolledOn = on; document.documentElement.classList.toggle('scrolled', on); }
}, { passive: true });
function toast(msg) {
  if (typeof Land !== 'undefined' && Land.mode) { Land.say(msg); return; }   // 橫放全螢幕時寫在播放器裡（跟著轉）
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 2600);
}
function syncLight() {
  const s = $('#sync');
  if (!s) return;
  s.className = 'sync ' + syncState();
  s.title = { ok: '片單都同步了', wait: '有動作等資料管線收件', bad: '送不出去，連上網路後重送' }[syncState()];
}
function applyFx() { document.documentElement.classList.toggle('fx-lite', Fx.lite()); }
function skyNow() {
  if (SET.sky && SET.sky !== 'auto') return SET.sky;
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (h >= 5 && h < 8) return 'dawn';
  if (h >= 8 && h < 16.5) return 'day';
  if (h >= 16.5 && h < 19) return 'dusk';
  return 'night';
}
function applySky() {
  const s = skyNow();
  const html = document.documentElement;
  ['dawn', 'day', 'dusk', 'night'].forEach((x) => html.classList.toggle('sky-' + x, x === s));
  html.classList.toggle('dark', s === 'night' || s === 'dusk');
  $('meta[name=theme-color]').setAttribute('content', { dawn: '#f6b7a6', day: '#5fb8ff', dusk: '#3a2470', night: '#0d0f2b' }[s]);
  const lab = $('#skyLab');
  if (lab) lab.textContent = { dawn: '清晨', day: '白天', dusk: '黃昏', night: '深夜' }[s];
  Snd.setMood(s === 'night' ? 'night' : s === 'dusk' ? 'dusk' : 'day');
}
function tickClock() {
  const d = new Date();
  $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
async function refreshData(fresh) {
  const changed = await loadAll(fresh);
  syncLight();
  return changed;
}

document.addEventListener('keydown', (e) => {
  if (e.target.matches && e.target.matches('input,textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (Swipe.isOpen()) {
    if (e.key === 'Escape') Swipe.close();
    else if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); Swipe.go(1); }
    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); Swipe.go(-1); }
    else if (e.key === ' ') { e.preventDefault(); Swipe.toggle(); }
    return;
  }
  if (Player.isOpen()) {
    if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else Player.close(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); Player.seekBy(e.shiftKey ? 60 : 10); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); Player.seekBy(e.shiftKey ? -60 : -10); }
    else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowDown') { e.preventDefault(); Player.next(); }
    else if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowUp') { e.preventDefault(); Player.prev(); }
    else if (e.key === ' ' || e.key === 'k') { e.preventDefault(); Player.toggle(); }
    else if (e.key === 'f' || e.key === 'F') Player.fullscreen();
    else if (e.key === 's' || e.key === 'S') Player.skipOp();
    else if (e.key === ']') Player.cycleRate();
    return;
  }
  if (e.key === '/') { e.preventDefault(); openSearch(); }
  else if (!$('#sheet').hidden && e.key === 'Escape') closeSheet();
  else if (e.key >= '1' && e.key <= '4') location.hash = TABS[+e.key - 1];
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    Snd.setHidden(true);
    flushHist();
    store.set('visit', Date.now());
    sendNow();
  } else {
    Snd.setHidden(false);
    applySky();
    if (Date.now() - D.at > 3 * 60e3) refreshData().then((ch) => { if (ch && !Player.isOpen() && !Swipe.isOpen() && TABS.includes(ROUTE)) softRefresh(); });
    sendNow();
  }
});
addEventListener('resize', () => moveTabInk());
addEventListener('hashchange', route);
addEventListener('online', () => { sendNow(); refreshData(); });
addEventListener('pagehide', () => { flushHist(); sendNow(); });

/* ------------------------------------------------------------ 開機 */
const OP_LINES = ['今天也一口氣看完吧', '補完計畫，開始', '放映室開門了', '下一集，馬上開播', '片頭曲，下！', '今天補什麼番'];
function opLine() {
  const h = new Date().getHours();
  if (h >= 0 && h < 5) return '深夜補番，記得留點睡眠';
  const news = D.cat ? SL.news().length : 0;
  if (news) return '你追的 ' + news + ' 部出新集了';
  const d = new Date().getDay();
  if (d === 0 || d === 6) return '週末，一口氣看完吧';
  return OP_LINES[hash32(dayKey()) % OP_LINES.length];
}
function episodeNo() {
  const days = store.get('days', { n: 0, last: '' });
  if (days.last !== dayKey()) { days.n++; days.last = dayKey(); store.set('days', days); }
  return days.n;
}
async function bootSequence(force) {
  const ep = episodeNo();
  const cuts = D.cat ? heroPicks().map((x) => x.v.i) : [];
  const nLive = D.cat ? L.live().filter((v) => v.live).length : 0;
  const stats = D.cat ? [IDX.shows.length + ' 部作品', L.comps('').length + ' 支長片合輯', nLive ? nLive + ' 場直播' : ''].filter(Boolean).join(' · ') : '';
  await Fx.boot({ ep, line: opLine(), cuts, stats });
  store.set('boot', dayKey());
  Snd.bgmStart();
  if (!force) welcome(ep);
}
async function start() {
  applyFx();
  applySky();
  tickClock();
  setInterval(tickClock, 15000);
  setInterval(applySky, 5 * 60e3);
  syncLight();
  Swipe.bind();
  $('#btnSearch').addEventListener('click', () => { Snd.play('select'); openSearch(); });
  $('#sync').addEventListener('click', () => { Snd.play('tick'); location.hash = 'mine'; setTimeout(() => { const s = $('.sys'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 500); });
  $('#thClose').addEventListener('click', () => Player.close());
  $('#thFull').addEventListener('click', () => Player.fullscreen());
  Land.init();
  const lastVisit = store.get('visit', 0);
  const showIntro = SET.intro === 'every' || (SET.intro === 'daily' && store.get('boot') !== dayKey());
  const loading = refreshData();
  if (showIntro && !QS.has('skip')) {
    await Promise.race([loading, new Promise((r) => setTimeout(r, 1800))]);
    route();
    await bootSequence();
  } else {
    episodeNo();
    route();
    const unlock = () => { Snd.init(); Snd.bgmStart(); };
    document.addEventListener('pointerdown', unlock, { once: true });
    document.addEventListener('keydown', unlock, { once: true });
  }
  await loading;
  if (!Player.isOpen() && !Swipe.isOpen()) softRefresh();
  sendNow();
  setInterval(() => { if (!document.hidden) refreshData().then((ch) => { if (ch && !Player.isOpen() && !Swipe.isOpen() && ROUTE === 'home' && scrollY < 80) softRefresh(); }); }, 6 * 60e3);
  setInterval(() => { if (SYNC.out.length) sendNow(); }, 10 * 60e3);
  if (window.BG_WEB && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* */ });
  void lastVisit;
}
function welcome(ep) {
  if (!D.cat) return;
  const sub = [];
  const news = SL.news();
  if (news.length) sub.push('追番更新 ' + news.reduce((s, x) => s + x.n, 0) + ' 集');
  const cont = L.cont();
  if (cont.length) sub.push('有 ' + cont.length + ' 支看到一半');
  const live = L.live().filter((v) => v.live).length;
  if (live) sub.push(live + ' 場直播馬拉松');
  if (!sub.length) sub.push('今天有 ' + L.fresh('').filter((v) => nowS() - v.p < 86400).length + ' 支新片');
  setTimeout(() => Fx.titleCard('第 ' + ep + ' 話', greet() + '，' + NAME, sub.join(' · ')), 300);
}
start();
