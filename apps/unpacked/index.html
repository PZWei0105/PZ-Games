/* 解包 UNPACKED — 遊戲狂想曲塗鴉風
   顏色：黃 #FFE600、粉 #FF2E88、黑 #111、白；紅 #e3001b 只給印章。
   手機記憶體：不用 filter／backdrop-filter／mix-blend-mode、不用模糊陰影；動畫只動 transform 與 opacity。 */
:root{
  --y:#FFE600;--p:#FF2E88;--k:#111;--w:#fff;--r:#e3001b;--g:#1b1b1b;--g2:#232323;--t2:#c9c9c9;--t3:#8d8d8d;
  --cjk:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
  --num:"Bebas Neue","Noto Sans TC",sans-serif;
  --hand:"Permanent Marker","Noto Sans TC",cursive;
  --drip:"Rubik Wet Paint","Bebas Neue",sans-serif;
  --top:56px;--tabs:64px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--k);color:#eee;font-family:var(--cjk);font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden;background:var(--k)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--y)}
input,textarea{font:inherit}
.hide{display:none!important}

/* ---------- 牆面 ---------- */
#wall{position:fixed;inset:0;z-index:0;pointer-events:none;background-color:#141414;
  background-image:radial-gradient(#ffffff0c 22%,transparent 24%),var(--noise,none);background-size:14px 14px,256px 256px}
#wall::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,transparent 40%,#000a 100%)}

#app{position:relative;z-index:1;min-height:100vh;padding-top:calc(var(--top) + var(--sat) + 30px);padding-bottom:calc(var(--tabs) + var(--sab) + 16px)}

/* ---------- 頂列 ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--top) + var(--sat));padding-top:var(--sat);background:var(--k);border-bottom:3px solid var(--y);display:flex;align-items:center;gap:10px;padding-left:14px;padding-right:8px}
.logo{display:flex;align-items:flex-end;gap:7px;cursor:pointer;user-select:none}
.logo b{font:900 27px/1 var(--cjk);color:var(--y);-webkit-text-stroke:2px var(--k);paint-order:stroke fill;text-shadow:2px 2px 0 var(--p),4px 4px 0 var(--p);transform:rotate(-3deg);letter-spacing:1px}
.logo i{font:400 17px/1 var(--drip);color:var(--p);font-style:normal;transform:rotate(-3deg) translateY(-2px)}
#top .sp{flex:1}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;color:#fff}
.ib svg{width:24px;height:24px}
.ib.on{color:var(--y)}
.ib.off{color:#666}
.ib:active{transform:scale(.92)}

#tapew{position:fixed;left:0;right:0;top:calc(var(--top) + var(--sat) - 3px);height:38px;z-index:29;overflow:hidden;pointer-events:none}
#tape{position:absolute;left:-20px;right:-20px;top:3px;height:30px;background:var(--y);color:var(--k);overflow:hidden;white-space:nowrap;transform:rotate(-.6deg);border-bottom:2px solid var(--k)}
#tape .in{display:inline-block;font:900 15px/30px var(--cjk);letter-spacing:2px;animation:tape 26s linear infinite;padding-left:20px}
#tape .in b{color:var(--p);-webkit-text-stroke:.6px var(--k)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- 分頁列 ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabs) + var(--sab));padding-bottom:var(--sab);background:var(--k);border-top:3px solid var(--p);display:flex;justify-content:space-around;align-items:center}
.tab{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#aaa;font:900 13px/1 var(--cjk);letter-spacing:1px;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--k)}
.tab.on::before{content:"";position:absolute;inset:7px 12%;background:var(--y);transform:rotate(-2deg);box-shadow:3px 3px 0 var(--p);z-index:-1;border-radius:3px}
.tab .dot{position:absolute;top:8px;right:28%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--p);color:#fff;font:400 14px/18px var(--num);text-align:center}

#view{max-width:880px;margin:0 auto;padding:6px 14px 10px}
#view.enter{animation:viewIn .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- 標題 ---------- */
.sec-h{display:flex;align-items:flex-end;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.spray-h{font:900 34px/1.05 var(--cjk);color:#fff;-webkit-text-stroke:5px var(--k);paint-order:stroke fill;text-shadow:3px 3px 0 var(--p),6px 6px 0 var(--p),9px 9px 0 var(--k);transform:rotate(-2deg);letter-spacing:2px;position:relative}
.spray-h.y{color:var(--y)}
.date-stk{font:400 22px/1 var(--num);letter-spacing:2px;background:var(--p);color:#fff;padding:6px 10px 4px;transform:rotate(4deg);box-shadow:3px 3px 0 var(--k);border:2px solid var(--k)}
.sub-note{color:var(--t2);font-size:13px;margin:-4px 0 10px}
.tape-h{display:inline-block;font:900 18px/1 var(--cjk);letter-spacing:2px;background:var(--k);color:var(--y);padding:8px 14px;margin:26px 0 12px;transform:rotate(-1.5deg);box-shadow:4px 4px 0 var(--y);border:2px solid var(--y)}
.tape-h.p{color:#fff;background:var(--p);box-shadow:4px 4px 0 var(--k);border-color:var(--k)}
.uline{display:block;width:180px;height:16px;margin-top:-2px}
.uline path{fill:none;stroke:var(--p);stroke-width:7;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240}
.in .uline path,.uline.in path{transition:stroke-dashoffset .6s ease-out;stroke-dashoffset:0}

/* ---------- 海報（首頁大卡） ---------- */
.posters{display:grid;gap:30px;padding:6px 4px 10px}
.poster{position:relative;background:#fff;color:var(--k);cursor:pointer;transform:rotate(var(--rot,0deg));box-shadow:8px 8px 0 var(--k);border:3px solid var(--k);transition:transform .18s}
.poster:active{transform:rotate(var(--rot,0deg)) scale(.985)}
.pimg{position:relative;aspect-ratio:16/9;background:#222 center/cover;overflow:hidden;border-bottom:3px solid var(--k)}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .ht,.ht{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#0000004d 26%,transparent 28%);background-size:7px 7px;-webkit-mask-image:linear-gradient(transparent 45%,#000);mask-image:linear-gradient(transparent 45%,#000)}
.pimg .ph{position:absolute;inset:0;display:grid;place-items:center;font:400 40px/1 var(--drip);color:var(--y);background:repeating-linear-gradient(-45deg,#1a1a1a 0 18px,#222 18px 36px)}
.kind-stk{position:absolute;left:-10px;top:-14px;z-index:3;background:var(--p);color:#fff;font:900 14px/1 var(--cjk);padding:8px 12px;border:2px solid var(--k);transform:rotate(-7deg);box-shadow:3px 3px 0 var(--k);letter-spacing:1px}
.k-upcoming .kind-stk{background:var(--y);color:var(--k)}
.k-exclusive .kind-stk{background:var(--k);color:var(--y);border-color:var(--y)}
.pbody{padding:14px 16px 18px;position:relative}
.ptitle{font:900 30px/1.12 var(--cjk);color:var(--k);-webkit-text-stroke:0;letter-spacing:1px}
.pen{font:400 16px/1.2 var(--hand);color:var(--p);margin-top:2px}
.phead{margin-top:8px;font-weight:700;font-size:15.5px;line-height:1.55;color:#222}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-right:96px}
.chip{font:700 12.5px/1 var(--cjk);padding:6px 8px;background:var(--k);color:#fff;border-radius:3px}
.chip.y{background:var(--y);color:var(--k);box-shadow:inset 0 0 0 2px var(--k)}
.chip.p{background:var(--p);color:#fff}
.chip.n{background:#ddd;color:#444}
.chip b{font:400 15px/1 var(--num);letter-spacing:.5px;margin-left:3px}
.tp{position:absolute;width:86px;height:24px;background:#ffffffc4;z-index:4;pointer-events:none}
.tp1{right:-14px;top:-10px;transform:rotate(28deg)}
.tp2{left:22%;bottom:-12px;transform:rotate(-4deg);width:70px;background:#fff59ec4}
.seal{position:absolute;right:12px;bottom:12px;z-index:3;width:92px;height:92px;border-radius:50%;border:6px solid var(--r);color:var(--r);display:grid;place-items:center;text-align:center;font:900 22px/1 var(--cjk);background:#ffffffd8;transform:rotate(-14deg);letter-spacing:1px}
.seal small{display:block;font-size:11px;margin-top:4px;letter-spacing:0}
.seal.s-mid{border-color:#111;color:#111}
.seal.s-no{border-color:#555;color:#555}

/* 小海報（庫存、之前解包） */
.hscroll{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 16px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 200px;scroll-snap-align:start;position:relative;background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:5px 5px 0 var(--p);cursor:pointer;transform:rotate(var(--rot,0deg))}
.mini .pimg{aspect-ratio:16/9;border-bottom-width:2px}
.mini .mb{padding:8px 10px 12px}
.mini h4{font:900 16px/1.25 var(--cjk);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .md{font:400 14px/1 var(--num);color:#666;letter-spacing:1px;margin-top:4px}
.mini .mstamp{position:absolute;right:6px;top:6px;z-index:3;font:900 12px/1 var(--cjk);padding:5px 6px;border:3px solid var(--r);color:var(--r);background:#fffe;transform:rotate(-10deg);border-radius:4px}
.mini .mstamp.s-mid{border-color:#111;color:#111}
.mini .mstamp.s-no{border-color:#555;color:#555}
.mini .mk{position:absolute;left:6px;top:6px;z-index:3;font:900 11px/1 var(--cjk);background:var(--y);color:var(--k);padding:4px 6px;border:2px solid var(--k)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;padding:4px 2px}
.grid .mini{flex:none}
.cmpbtn{position:absolute;right:6px;bottom:6px;z-index:4;width:34px;height:34px;border-radius:50%;background:var(--k);color:#fff;border:2px solid #fff;font:900 20px/30px var(--cjk);text-align:center}
.cmpbtn.on{background:var(--p);border-color:var(--k)}

/* 追蹤牆便利貼 */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:4px}
.note{position:relative;background:var(--y);color:var(--k);padding:14px 12px 12px;transform:rotate(var(--rot,0deg));box-shadow:4px 4px 0 var(--k);border:2px solid var(--k);cursor:pointer;min-height:96px}
.note.p{background:var(--p);color:#fff}
.note.w{background:#fff}
.note .nt{font:900 13px/1.2 var(--cjk);opacity:.75}
.note .nv{font:400 34px/1 var(--num);letter-spacing:1px;margin:6px 0 2px}
.note .nv small{font:900 14px var(--cjk);margin-left:3px}
.note .nd{font:700 12.5px/1.45 var(--cjk)}
.note::before{content:"";position:absolute;left:50%;top:-11px;width:54px;height:18px;margin-left:-27px;background:#ffffffb0;transform:rotate(-3deg)}
.empty{color:var(--t2);padding:20px 6px;font-size:14px;line-height:1.7}

/* ---------- 庫存 ---------- */
.search{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--k);box-shadow:5px 5px 0 var(--y);padding:4px 6px 4px 12px;margin:14px 2px 10px;transform:rotate(-.5deg)}
.search input{flex:1;border:0;outline:0;background:none;font:700 16px var(--cjk);color:var(--k);padding:9px 0}
.search svg{width:20px;height:20px;color:var(--k)}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px}
.fl{font:900 13px/1 var(--cjk);padding:8px 10px;border:2px solid #444;color:#ddd;background:#1d1d1d;border-radius:20px}
.fl.on{background:var(--y);color:var(--k);border-color:var(--k);box-shadow:2px 2px 0 var(--p)}
.fgroup{font:900 12px/1 var(--cjk);color:var(--p);margin:10px 2px 6px;letter-spacing:1px}
.sortrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 2px 14px;color:var(--t2);font-size:13px}
.sortrow .fl{white-space:nowrap;flex:none}
.tray{position:fixed;left:10px;right:10px;bottom:calc(var(--tabs) + var(--sab) + 10px);z-index:28;background:var(--k);border:3px solid var(--y);box-shadow:5px 5px 0 var(--p);padding:8px 8px 8px 12px;display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto;transform:translateY(30px);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility .25s}
.tray.on{transform:none;opacity:1;visibility:visible}
.tray .tl{flex:1;font:900 13px/1.4 var(--cjk);color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:900 14px/1 var(--cjk);padding:11px 14px;background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:3px 3px 0 var(--p);letter-spacing:1px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--p)}
.btn.y{background:var(--y)}
.btn.p{background:var(--p);color:#fff}
.btn.k{background:var(--k);color:var(--y);border-color:var(--y);box-shadow:3px 3px 0 var(--y)}
.btn.sm{font-size:12.5px;padding:8px 10px;border-width:2px}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}

/* ---------- 專題頁 ---------- */
.f-top{position:relative;margin:4px -14px 0}
.f-hero{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border-bottom:4px solid var(--y)}
.f-hero>img{width:100%;height:100%;object-fit:cover}
/* ---------- 動態主視覺：輪播（Ken Burns）＋ Steam 動態預告 ---------- */
.kb{position:absolute;inset:0;overflow:hidden}
.kb .kbi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.kb .kbi.on{opacity:1}
.kb .kbi:not([src]){display:none}
.kb .kbi.kbgo{animation:kbz 7.5s ease-out forwards}
@keyframes kbz{from{transform:scale(1.02)}to{transform:scale(var(--kz,1.12)) translate(var(--kx,0),var(--ky,0))}}
body:not(.calm) .poster:not(.act) .kbi.on{animation:kbp 18s ease-in-out infinite alternate}
@keyframes kbp{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.f-hero .hv,.pimg .pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease}
.f-hero .hv.on,.pimg .pv.on{opacity:1}
.hv-tag{position:absolute;right:10px;top:10px;z-index:4;font:900 12px/1 var(--cjk);letter-spacing:1px;background:var(--p);color:#fff;padding:6px 8px 5px;transform:rotate(2deg);box-shadow:3px 3px 0 var(--k)}
.hv-tag.k{background:var(--y);color:var(--k)}
.stale{margin:12px 0 0;background:var(--y);color:var(--k);font:700 14px/1.6 var(--cjk);padding:10px 12px;border:3px solid var(--k);box-shadow:4px 4px 0 var(--p);transform:rotate(-.6deg)}
.poster{transition:transform .18s,box-shadow .3s}
.poster.act{box-shadow:8px 8px 0 var(--p)}
.pv-tag{position:absolute;left:10px;bottom:10px;z-index:3;font:900 11px/1 var(--cjk);background:var(--k);color:var(--y);padding:5px 7px;border:2px solid var(--y);transform:rotate(-3deg)}
.poster.act .pv-tag{background:var(--p);color:#fff;border-color:#fff}
@keyframes slapIn{from{opacity:0;transform:rotate(calc(var(--rot,0deg) - 10deg)) scale(1.3) translateY(-26px)}to{opacity:1;transform:rotate(var(--rot,0deg)) scale(1)}}
.poster.drop,.pk.drop{animation:slapIn .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i,0) * 140ms + 60ms)}
/* ---------- 推坑：牆、卡片、推坑頁 ---------- */
.pk-intro{font:700 15px/1.75 var(--cjk);color:#ddd;margin:10px 2px 4px}
.pk-intro b{color:var(--y)}
.pk-intro .hl{background:var(--p);color:#fff;padding:1px 6px}
.pkf{margin-top:12px}
.pks{display:grid;gap:36px;margin-top:24px}
.pk{position:relative;background:#fff;color:var(--k);cursor:pointer;transform:rotate(var(--rot,0deg));box-shadow:8px 8px 0 var(--y);border:3px solid var(--k);transition:transform .18s,box-shadow .3s}
.pk:active{transform:rotate(var(--rot,0deg)) scale(.985)}
.pk.act{box-shadow:8px 8px 0 var(--p)}
.pk .pk-b{padding:14px 16px 18px;position:relative}
.pk .pk-lbl{display:inline-block;font:900 13px/1 var(--cjk);background:var(--k);color:var(--y);padding:6px 9px;transform:rotate(-2deg);margin-bottom:10px}
.pk .chips{padding-right:96px}
.pk .phead{padding-right:88px}
.chip .dsc{color:var(--r);font-weight:900}
.pk-year{position:absolute;left:10px;top:6px;z-index:3;font:400 46px/1 var(--num);color:var(--y);-webkit-text-stroke:2px var(--k);paint-order:stroke fill;text-shadow:3px 3px 0 var(--p);letter-spacing:1px}
.pk-off{position:absolute;right:10px;top:10px;z-index:3;font:900 13px/1 var(--cjk);background:var(--p);color:#fff;padding:6px 8px;border:2px solid #fff;transform:rotate(4deg);box-shadow:3px 3px 0 var(--k)}
.pk-stamp{position:absolute;right:12px;bottom:14px;z-index:3;width:90px;height:90px;border-radius:50%;border:6px solid var(--r);color:var(--r);display:grid;place-items:center;font:900 21px/1 var(--cjk);background:#ffffffd8;transform:rotate(-12deg);letter-spacing:1px}
.pk.pk-blind .pk-stamp{border-color:var(--p);color:var(--p)}
.pk.pk-sale .pk-stamp{border-color:var(--k);color:var(--k);background:#ffe600e8}
.pk.pk-gem .pk-stamp{border-color:var(--y);color:var(--y);background:#111e;font-size:17px}
.mini.pkm{box-shadow:5px 5px 0 var(--y)}
.mini.pkm .mstamp{border-color:var(--r);color:var(--r)}
.mini.pkm.pk-blind .mstamp{border-color:var(--p);color:var(--p)}
.mini.pkm.pk-sale .mstamp{border-color:var(--k);color:var(--k);background:var(--y)}
.mini.pkm.pk-gem .mstamp{border-color:var(--y);color:var(--y);background:#111}
.mini.pkm.more{display:grid;place-items:center;background:var(--k);color:var(--y);border-color:var(--y);min-height:150px}
.mini.pkm.more .mm{display:grid;justify-items:center;gap:6px;text-align:center}
.mini.pkm.more svg{width:34px;height:34px}
.mini.pkm.more b{font:900 17px/1.2 var(--cjk)}
.mini.pkm.more span{font:400 18px/1 var(--num);color:#fff;letter-spacing:1px}
.pk-tease{margin-top:6px}
.tape-h.y{background:var(--y);color:var(--k);box-shadow:4px 4px 0 var(--p);border-color:var(--k)}
.tape-h small{font:700 12px/1 var(--cjk);letter-spacing:0;margin-left:6px;opacity:.8}
.pk-kind{background:var(--y)!important;color:var(--k)!important}
.letter{position:relative;margin:24px 0 10px;background:#fffdf3;color:#151515;padding:22px 18px 20px;border:3px solid var(--k);box-shadow:6px 6px 0 var(--p);transform:rotate(-.6deg)}
.letter .lt-h{display:inline-block;font:900 19px/1 var(--cjk);background:var(--y);padding:7px 11px;transform:rotate(-2deg);border:2px solid var(--k);margin-bottom:12px}
.letter p{font:700 16.5px/1.95 var(--cjk)}
.letter .lt-sign{text-align:right;font:400 26px/1 var(--hand);color:var(--p);margin:12px 104px 0 0}
.letter .tp1{right:auto;left:40%;top:-12px;transform:rotate(-3deg)}
.letter .seal{right:-8px;bottom:-30px;top:auto;width:104px;height:104px;font-size:24px}
.letter .seal.wait{opacity:0}
.letter .seal.go{animation:slam .42s cubic-bezier(.3,1.6,.5,1) both}
.seal.pk-blind{border-color:var(--p);color:var(--p)}
.seal.pk-sale{border-color:var(--k);color:var(--k);background:#ffe600e8}
.seal.pk-gem{border-color:var(--y);color:var(--y);background:#111e;font-size:19px}
.rsns{display:grid;gap:14px;margin:40px 0 6px}
.rsn{position:relative;background:var(--g);border:2px solid #333;padding:14px 14px 14px 62px;transform:rotate(var(--rot,0deg))}
.rsn .rn{position:absolute;left:12px;top:6px;font:400 56px/1 var(--num);color:var(--y);-webkit-text-stroke:2px var(--k);paint-order:stroke fill;text-shadow:3px 3px 0 var(--p)}
.rsn h4{font:900 18px/1.3 var(--cjk);color:#fff;margin-bottom:6px}
.rsn p{font:700 15px/1.75 var(--cjk);color:#ddd}
body:not(.calm) .rsns .rsn{animation:glIn .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0) * 90ms + .15s)}
.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px;margin:16px 0 8px}
.sc{background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:4px 4px 0 var(--y);padding:10px 12px;transform:rotate(var(--rot,0deg))}
.sc .sk{display:block;font:900 12px/1.1 var(--cjk);opacity:.7}
.sc .sv{display:block;font:400 38px/1.05 var(--num);margin-top:6px}
.sc .sv.long{font:900 17px/1.35 var(--cjk);margin-top:8px}
.sc .ss{display:block;font:700 11.5px/1.35 var(--cjk);margin-top:5px;color:#555}
.deal{margin-top:18px;background:var(--y);color:var(--k);border:3px solid var(--k);box-shadow:5px 5px 0 var(--p);padding:12px 14px;transform:rotate(-.5deg)}
.deal b{font:900 16px/1 var(--cjk)}
.deal p{font:700 15px/1.75 var(--cjk);margin-top:6px}
#unpack.dig .box{color:#fff}
#unpack.dig .ok{color:var(--y)}
#unpack.dig .bar{border-color:var(--p)}
#unpack.dig .bar i{background:var(--y)}
/* ---------- 一眼看懂 ---------- */
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 9px;margin:20px 0 6px}
.gl-t{position:relative;background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:4px 4px 0 var(--k);padding:8px 8px 9px;transform:rotate(var(--rot,0deg));min-height:80px;display:flex;flex-direction:column}
.gl-t .gk{font:900 11px/1.1 var(--cjk);letter-spacing:1px;opacity:.72}
.gl-t .gv{font:900 19px/1.15 var(--cjk);margin-top:6px;word-break:break-word}
.gl-t .gv small{font-size:12px;margin-left:2px}
.gl-t .gv .nw{white-space:nowrap}
.gl-t .gs{font:700 11px/1.3 var(--cjk);margin-top:auto;padding-top:4px;opacity:.85}
.gl-t.c-y{background:var(--y)}
.gl-t.c-p{background:var(--p);color:#fff}
.gl-t.c-g{background:#2fd06a}
.gl-t.c-k{background:var(--k);color:var(--y);border-color:var(--y);box-shadow:4px 4px 0 var(--p)}
body:not(.calm) .glance .gl-t{animation:glIn .42s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 70ms + .22s)}
@keyframes glIn{from{opacity:0;transform:rotate(calc(var(--rot,0deg) + 9deg)) scale(.55)}to{opacity:1;transform:rotate(var(--rot,0deg)) scale(1)}}
.f-hero .ht{-webkit-mask-image:linear-gradient(transparent 30%,#000);mask-image:linear-gradient(transparent 30%,#000)}
.f-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000c);pointer-events:none}
.back{position:absolute;left:12px;top:12px;z-index:5;font:900 14px/1 var(--cjk);background:var(--y);color:var(--k);padding:9px 12px;border:2px solid var(--k);box-shadow:3px 3px 0 var(--k);transform:rotate(-3deg)}
.f-head{position:relative;padding:0 16px;margin-top:-58px;z-index:3}
.f-head .kind-stk{position:relative;left:0;top:0;display:inline-block;margin-bottom:10px}
.f-title{font:900 40px/1.08 var(--cjk);color:#fff;-webkit-text-stroke:7px var(--k);paint-order:stroke fill;text-shadow:4px 4px 0 var(--p),8px 8px 0 var(--p),12px 12px 0 var(--k);letter-spacing:1px;word-break:break-word}
.f-en{font:400 20px/1.2 var(--hand);color:var(--y);margin-top:8px;transform:rotate(-1deg)}
.f-zhnote{font-size:12px;color:var(--t3);margin-left:6px;font-family:var(--cjk)}
.f-headline{margin-top:12px;font:700 17px/1.6 var(--cjk);color:#fff;background:#000b;padding:10px 12px;border-left:6px solid var(--p)}
.hook{margin:18px 2px 0;font:700 17px/1.85 var(--cjk);color:#f2f2f2;position:relative;padding:4px 0 4px 18px}
.hook::before{content:"“";position:absolute;left:-6px;top:-18px;font:400 70px/1 var(--hand);color:var(--p)}

.ftabs{position:sticky;top:calc(var(--top) + var(--sat) + 30px);z-index:20;margin:20px -14px 0;background:var(--k);border-top:2px solid #333;border-bottom:2px solid #333;display:flex;overflow-x:auto;gap:2px;padding:6px 10px}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex:0 0 auto;font:900 14px/1 var(--cjk);color:#aaa;padding:9px 11px;border-radius:4px;white-space:nowrap;letter-spacing:.5px}
.ftab b{font:400 15px var(--num);color:var(--p);margin-right:2px}
.ftab.on{background:var(--y);color:var(--k)}
.ftab.on b{color:var(--k)}

.fsec{scroll-margin-top:calc(var(--top) + var(--sat) + 86px);padding-top:10px}
.fsec h2{display:flex;align-items:center;gap:10px;font:900 26px/1.1 var(--cjk);color:#fff;margin:26px 0 4px;letter-spacing:1px}
.fsec h2 .ttl{display:inline-block}
.fsec>h2.rv .path{clip-path:inset(0 100% 0 0)}
.fsec>h2.rv .ttl{opacity:0;transform:translateX(-16px) skewX(-10deg)}
.fsec>h2.rv.in .path{animation:sprayIn .42s steps(7,end) forwards}
.fsec>h2.rv.in .ttl{animation:ttlIn .42s .1s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes sprayIn{to{clip-path:inset(0 0 0 0)}}
@keyframes ttlIn{to{opacity:1;transform:none}}
.fsec h2 .path{font:400 18px/1 var(--num);color:var(--p);letter-spacing:1px;background:#000;border:2px solid var(--p);padding:4px 7px 2px}
.para{font-size:16.5px;line-height:1.9;color:#e9e9e9;margin:12px 0}
.para b{color:var(--y)}

/* 結論 */
.verdict{position:relative;margin:26px 0 8px;background:#fff;color:var(--k);border:4px solid var(--k);box-shadow:8px 8px 0 var(--p);padding:18px 16px 16px;transform:rotate(-.6deg)}
.verdict .vl{font:900 13px/1 var(--cjk);color:var(--p);letter-spacing:2px}
.verdict .vt{font:900 24px/1.3 var(--cjk);margin:6px 96px 8px 0}
.verdict .vs{font:700 15.5px/1.75 var(--cjk);color:#222;padding-right:4px}
.verdict .seal{right:-8px;top:-34px;bottom:auto;width:104px;height:104px;font-size:25px}
.verdict .seal.go{animation:slam .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slam{0%{transform:rotate(-30deg) scale(3.4);opacity:0}60%{transform:rotate(-12deg) scale(.88);opacity:1}100%{transform:rotate(-14deg) scale(1)}}
.verdict .seal.wait{opacity:0}
.fa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.fa .st{background:var(--y);color:var(--k);padding:12px 12px 10px;border:2px solid var(--k);transform:rotate(-1deg)}
.fa .st.p{background:var(--p);color:#fff;transform:rotate(1deg)}
.fa h4{font:900 14px/1 var(--cjk);margin-bottom:8px;letter-spacing:1px}
.fa li{list-style:none;font:700 13.5px/1.55 var(--cjk);padding-left:16px;position:relative;margin:5px 0}
.fa li::before{content:"✔";position:absolute;left:0;top:0;font-size:12px}
.fa .st.p li::before{content:"✘"}

/* 資訊卡 */
.facts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.fact{display:grid;grid-template-columns:96px 1fr 26px;align-items:start;gap:10px;background:var(--g);border:2px solid #2c2c2c;padding:10px 10px;cursor:pointer}
.fact .fk{font:900 12.5px/1.3 var(--cjk);background:var(--y);color:var(--k);padding:5px 6px;text-align:center;transform:rotate(-2deg)}
.fact .fv{font:700 14.5px/1.6 var(--cjk);color:#f2f2f2}
.fact .fs{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:900 12px/1 var(--cjk);background:#2f2f2f;color:#9cf09c;border:2px solid #3e5e3e}
.fact.pd .fs{color:var(--p);border-color:var(--p);background:#2a1620}
.fact.pd .fv::after{content:" 待確認";font-size:11px;color:var(--p);font-weight:900}
.fact .fsrc{grid-column:1/-1;font-size:12.5px;line-height:1.6;color:var(--t2);display:none;padding:2px 2px 0}
.fact.open .fsrc{display:block}
.fact .fsrc a{color:var(--y);word-break:break-all}

/* 即時數據 */
.live{margin-top:16px;background:var(--k);border:3px solid var(--y);box-shadow:6px 6px 0 var(--y);padding:12px}
.live .lh{display:flex;justify-content:space-between;align-items:center;font:900 13px/1 var(--cjk);color:var(--y);letter-spacing:1px;margin-bottom:10px}
.live .lh small{color:var(--t3);font-weight:700;letter-spacing:0}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lc{background:#1a1a1a;border:2px solid #333;padding:10px}
.lc .ll{font:900 12px/1 var(--cjk);color:var(--t2)}
.lc .lv{font:400 32px/1.05 var(--num);color:#fff;letter-spacing:1px;margin-top:6px}
.lc .lv small{font:900 13px var(--cjk);color:var(--t2);margin-left:4px;letter-spacing:0}
.lc .ld{font:700 12px/1.5 var(--cjk);color:var(--t2);margin-top:4px}
.lc .up{color:#7dff9a}.lc .dn{color:#ff7a9c}
.lc.wide{grid-column:1/-1}
.spark{width:100%;height:46px;margin-top:6px;display:block}
.spark polyline{fill:none;stroke:var(--p);stroke-width:2.2;vector-effect:non-scaling-stroke}
.spark .area{fill:#ff2e8826;stroke:none}
.live.counting .spark polyline{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.2s .1s ease-out forwards}
.live.counting .spark .area{animation:fadeUp 1.3s ease-out both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeUp{from{opacity:0}to{opacity:1}}
.shot-n{font:700 12px/1 var(--cjk);color:var(--t3);margin-left:8px;letter-spacing:0}
.disc{display:inline-block;background:var(--p);color:#fff;font:400 18px/1 var(--num);padding:3px 6px 1px;margin-left:6px;transform:rotate(-4deg)}
.lowtag{display:inline-block;background:var(--y);color:var(--k);font:900 11px/1 var(--cjk);padding:4px 5px;margin-left:6px}

/* 課金雷達、中文、台灣、SCAR 18 */
.cards2{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
.ic{position:relative;background:var(--g);border:2px solid #333;padding:14px 14px 12px}
.ic h4{display:flex;align-items:center;gap:8px;font:900 16px/1.2 var(--cjk);color:#fff;margin-bottom:8px}
.ic h4 .tagx{font:900 12px/1 var(--cjk);background:var(--p);color:#fff;padding:5px 7px;transform:rotate(-2deg)}
.ic h4 .tagx.y{background:var(--y);color:var(--k)}
.ic h4 .tagx.g{background:#2fd06a;color:var(--k)}
.ic h4 .tagx.k{background:#000;color:#fff;border:1px solid #555}
.ic p,.ic li{font:700 14.5px/1.7 var(--cjk);color:#ddd}
.ic ul{padding-left:0}
.ic li{list-style:none;padding-left:16px;position:relative;margin:6px 0}
.ic li::before{content:"";position:absolute;left:2px;top:.75em;width:7px;height:7px;background:var(--p);transform:rotate(45deg)}
.meter{display:flex;gap:5px;margin:4px 0 10px}
.meter i{flex:1;height:16px;background:#2c2c2c;transform:skewX(-14deg)}
.meter i.on{background:var(--p)}
.meter i.on.l0{background:#2fd06a}
.meter i.on.l1{background:#9be15d}
.meter i.on.l2{background:var(--y)}
.meter i.on.l3{background:#ff8a3d}
.meter i.on.l4{background:var(--r)}
.mlabels{display:flex;justify-content:space-between;font:700 10.5px/1.2 var(--cjk);color:var(--t3);margin-top:-6px;margin-bottom:8px}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flags span{font:900 12px/1 var(--cjk);border:2px solid var(--y);color:var(--y);padding:5px 7px}

/* 影像 */
.trailer{position:relative;margin-top:14px;background:#000;border:3px solid var(--k);box-shadow:6px 6px 0 var(--p)}
.trailer .tv{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.trailer .tv img{width:100%;height:100%;object-fit:cover;opacity:.85}
.trailer .tv iframe,.trailer .tv video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.playb{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:var(--p);border:5px solid var(--k);box-shadow:6px 6px 0 var(--y);display:grid;place-items:center;transform:rotate(-6deg)}
.playb svg{width:40px;height:40px;color:#fff;margin-left:6px}
.tvt{position:absolute;left:10px;bottom:10px;font:900 13px/1 var(--cjk);background:var(--y);color:var(--k);padding:6px 8px;border:2px solid var(--k)}
.vtabs{display:flex;gap:6px;overflow-x:auto;padding:8px}
.vtabs::-webkit-scrollbar{display:none}
.vtab{flex:0 0 auto;font:900 12.5px/1 var(--cjk);color:#ccc;border:2px solid #444;padding:7px 9px;background:#151515}
.vtab.on{background:var(--y);color:var(--k);border-color:var(--k)}
.shots{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 10px;scroll-snap-type:x mandatory}
.shots::-webkit-scrollbar{display:none}
.shot{flex:0 0 78%;max-width:420px;aspect-ratio:16/9;scroll-snap-align:center;background:#222;border:3px solid #fff;cursor:zoom-in;overflow:hidden;transform:rotate(var(--rot,0deg))}
.shot img{width:100%;height:100%;object-fit:cover}

/* 玩法循環 */
.loop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 4px;margin:14px 0 6px}
.loop .lp{font:900 14px/1.2 var(--cjk);background:#fff;color:var(--k);padding:9px 10px;border:2px solid var(--k);box-shadow:3px 3px 0 var(--p);transform:rotate(var(--rot,0deg))}
.loop .lp:nth-child(4n+1){background:var(--y)}
.loop .ar{font:400 22px/1 var(--hand);color:var(--p);margin:0 2px}
.loop .back2{font:400 15px/1 var(--hand);color:var(--y);margin-left:6px}

/* 第一小時（步驟） */
.steps{counter-reset:s;margin-top:10px}
.steps .stp{position:relative;padding:12px 12px 12px 54px;margin:10px 0;background:var(--g);border-left:5px solid var(--y);font:700 15px/1.75 var(--cjk);color:#e8e8e8}
.steps .stp::before{counter-increment:s;content:counter(s);position:absolute;left:10px;top:10px;width:34px;height:34px;display:grid;place-items:center;font:400 26px/1 var(--num);background:var(--p);color:#fff;transform:rotate(-6deg);border:2px solid var(--k)}

/* 比較 */
.cmp{display:grid;gap:12px;margin-top:12px}
.cmpc{background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:5px 5px 0 var(--y);padding:12px 14px;transform:rotate(var(--rot,0deg))}
.cmpc h4{font:900 18px/1.2 var(--cjk);margin-bottom:8px}
.cmpc .row{display:grid;grid-template-columns:44px 1fr;gap:8px;margin:6px 0;font:700 14px/1.6 var(--cjk)}
.cmpc .row b{font:900 12px/1 var(--cjk);background:var(--k);color:var(--y);padding:5px 4px;text-align:center;align-self:start}
.cmpc .row.d b{background:var(--p);color:#fff}

/* 劇情：撕開看雷 */
.spoil{position:relative;margin-top:14px;min-height:110px}
.spoil .inner{padding:14px;background:var(--g);border:2px dashed var(--p)}
.spoil .cover{position:absolute;inset:-4px;background:var(--y);color:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;z-index:2;clip-path:polygon(0 4%,8% 0,18% 3%,30% 0,42% 4%,55% 0,68% 3%,80% 0,92% 3%,100% 0,100% 96%,90% 100%,78% 97%,66% 100%,54% 96%,42% 100%,30% 97%,18% 100%,8% 96%,0 100%);transition:transform .45s cubic-bezier(.5,0,.8,.3),opacity .45s}
.spoil .cover b{font:900 20px/1 var(--cjk)}
.spoil .cover span{font:400 15px/1 var(--hand)}
.spoil.open .cover{transform:translateY(-30%) rotate(-8deg) scale(1.05);opacity:0;pointer-events:none}

/* 風向 */
.voices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.vc{padding:12px;border:3px solid var(--k);transform:rotate(-.8deg)}
.vc.pro{background:#c8ffd9;color:#0d2a16;box-shadow:4px 4px 0 #2fd06a}
.vc.con{background:#ffd0df;color:#3a0b19;box-shadow:4px 4px 0 var(--p);transform:rotate(.8deg)}
.vc h4{font:900 16px/1 var(--cjk);margin-bottom:8px}
.vc li{list-style:none;font:700 13.5px/1.6 var(--cjk);margin:7px 0;padding-left:14px;position:relative}
.vc li::before{content:"●";position:absolute;left:0;font-size:9px;top:.25em}
.debate{margin-top:14px;background:var(--k);border:2px solid var(--y);padding:12px 14px}
.debate h4{font:900 14px/1 var(--cjk);color:var(--y);margin-bottom:6px;letter-spacing:1px}
.debate p{font:700 14.5px/1.7 var(--cjk);color:#eee;margin:6px 0}

/* 時間軸 */
.tl{position:relative;margin:14px 0 0 8px;padding-left:22px;border-left:4px solid var(--p)}
.tli{position:relative;margin:0 0 14px}
.tli::before{content:"";position:absolute;left:-31px;top:4px;width:14px;height:14px;background:var(--y);border:3px solid var(--k);transform:rotate(45deg)}
.tli .td{font:400 19px/1 var(--num);color:var(--y);letter-spacing:1px}
.tli .tt{font:700 14.5px/1.6 var(--cjk);color:#e8e8e8;margin-top:3px}
.tli.fut .td{color:var(--p)}

/* 討論 */
.qs{display:grid;gap:14px;margin-top:12px}
.q{background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:5px 5px 0 var(--p);padding:14px;transform:rotate(var(--rot,0deg))}
.q h4{font:900 17px/1.45 var(--cjk)}
.q h4::before{content:"Q.";font:400 22px/1 var(--hand);color:var(--p);margin-right:6px}
.q p{font:700 14px/1.7 var(--cjk);color:#333;margin-top:6px}
.q textarea{width:100%;min-height:62px;margin-top:10px;border:2px dashed #999;padding:8px;font:700 14px/1.6 var(--cjk);color:#111;background:#fffbea;resize:vertical}

/* 我的標記 */
.marks{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.mkb{font:900 14px/1 var(--cjk);padding:10px 12px;border:3px solid #555;color:#ccc;background:#161616;transform:rotate(var(--rot,0deg))}
.mkb.on{background:var(--y);color:var(--k);border-color:var(--k);box-shadow:3px 3px 0 var(--p)}
.mynote{width:100%;min-height:70px;background:#161616;border:2px solid #444;color:#eee;padding:10px;font:700 14.5px/1.6 var(--cjk)}

.srcs{margin-top:10px}
.srcs li{list-style:none;font:700 13px/1.6 var(--cjk);color:var(--t2);margin:6px 0;padding-left:30px;position:relative}
.srcs li b{position:absolute;left:0;top:0;font:400 16px/1.4 var(--num);color:var(--p)}
.srcs a{color:#ddd;text-decoration:underline;text-decoration-color:#555;word-break:break-word}
.pend{margin-top:12px;background:#2a1620;border:2px solid var(--p);padding:10px 12px}
.pend h4{font:900 13px/1 var(--cjk);color:var(--p);margin-bottom:6px}
.pend li{list-style:none;font:700 13px/1.6 var(--cjk);color:#f3c6d6;margin:4px 0}

.endcta{margin:30px 0 10px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

/* ---------- 解包中（轉場） ---------- */
#unpack{position:fixed;inset:0;z-index:60;background:#0b0b0b;display:flex;align-items:center;justify-content:center;padding:20px}
#unpack .box{width:min(420px,92vw);font:700 15px/1.75 ui-monospace,Menlo,Consolas,monospace;color:var(--y)}
#unpack .ln{white-space:pre;overflow:hidden}
#unpack .ok{color:var(--p);font-weight:900}
#unpack .bar{height:16px;border:2px solid var(--y);margin-top:12px;position:relative;overflow:hidden}
#unpack .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--p);transform-origin:0 50%;transform:scaleX(0)}
#unpack .nm{font:900 24px/1.2 var(--cjk);color:#fff;margin-bottom:10px;-webkit-text-stroke:4px var(--k);paint-order:stroke fill;text-shadow:3px 3px 0 var(--p)}

/* ---------- 粉專出稿台 ---------- */
.brandbar{display:flex;align-items:center;gap:12px;margin:14px 0 6px;flex-wrap:wrap}
.brandstk{background:var(--k);border:3px solid var(--y);box-shadow:4px 4px 0 var(--p);padding:8px 12px;transform:rotate(-2deg)}
.brandstk b{display:block;font:900 20px/1 var(--cjk);color:#fff}
.brandstk i{display:block;font:400 15px/1 var(--num);color:var(--y);letter-spacing:2px;font-style:normal;margin-top:4px}
.drafts{display:grid;gap:14px;margin-top:10px}
.draft{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--g);border:2px solid #333;padding:10px;cursor:pointer;position:relative}
.draft .di{aspect-ratio:4/5;background:#222 center/cover;border:2px solid #fff}
.draft h4{font:900 16px/1.3 var(--cjk);color:#fff}
.draft p{font:700 12.5px/1.5 var(--cjk);color:var(--t2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-chip{position:absolute;right:8px;top:8px;font:900 11.5px/1 var(--cjk);padding:5px 7px;background:var(--y);color:var(--k);border:2px solid var(--k);transform:rotate(4deg)}
.st-chip.done{background:var(--r);color:#fff}
.fan-detail .cardwrap{position:relative;margin:14px auto 8px;max-width:440px}
.fan-detail canvas{width:100%;height:auto;display:block;border:3px solid var(--k);box-shadow:6px 6px 0 var(--p);background:#222}
.cardbusy{position:absolute;inset:0;display:grid;place-items:center;font:900 15px var(--cjk);color:var(--y);background:#000a}
.copybox{position:relative;background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:5px 5px 0 var(--y);padding:12px;margin:14px 0}
.copybox h4{font:900 13px/1 var(--cjk);color:var(--p);letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.copybox textarea{width:100%;min-height:240px;border:0;outline:0;resize:vertical;font:700 15px/1.8 var(--cjk);color:#111;background:#fffef5;padding:6px}
.copybox .cnt{font:400 15px/1 var(--num);color:#888;margin-left:auto;letter-spacing:1px}
.copybox .txt{font:700 15px/1.75 var(--cjk);white-space:pre-wrap}
.tline{display:flex;align-items:flex-start;gap:8px;margin:8px 0;padding:8px;background:#fff8c9;border:2px solid var(--k)}
.tline span{flex:1;font:900 15px/1.5 var(--cjk)}
.tline b{font:400 18px/1 var(--num);color:var(--p)}
.htags{display:flex;flex-wrap:wrap;gap:6px}
.htags span{font:900 14px/1 var(--cjk);background:var(--k);color:var(--y);padding:6px 8px}

/* ---------- 疊層（燈箱、比較、設定） ---------- */
#sheet{position:fixed;inset:0;z-index:70;display:none}
#sheet.on{display:block}
#sheet .sbg{position:absolute;inset:0;background:#000d}
#sheet .sbox{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#151515;border-top:4px solid var(--y);padding:16px 14px calc(20px + var(--sab));animation:sup .28s cubic-bezier(.2,.9,.3,1.15)}
@keyframes sup{from{transform:translateY(40%);opacity:.3}to{transform:none;opacity:1}}
#sheet .sbox.wide{max-width:980px;margin:0 auto}
#sheet .sclose{position:absolute;right:10px;top:10px}
#sheet h3{font:900 22px/1.2 var(--cjk);color:#fff;margin:2px 44px 12px 2px}
.lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100vw;max-height:84vh;object-fit:contain;border:3px solid #fff}
.lb .lbn{position:absolute;bottom:calc(16px + var(--sab));left:0;right:0;text-align:center;font:400 22px/1 var(--num);color:var(--y);letter-spacing:2px}
.lb .lbp,.lb .lbx{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;background:var(--y);color:var(--k);font:900 26px/52px var(--cjk);text-align:center}
.lb .lbp{left:10px}.lb .lbx{right:10px}
.ctable{width:100%;border-collapse:collapse;font:700 13.5px/1.5 var(--cjk)}
.ctable th,.ctable td{border:2px solid #333;padding:8px;vertical-align:top;text-align:left}
.ctable th{background:var(--y);color:var(--k);font-weight:900;white-space:nowrap}
.ctable td.k{background:#1f1f1f;color:var(--p);font-weight:900;white-space:nowrap}
.ctable td{color:#eee}
.ctwrap{overflow-x:auto}
.setrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #2a2a2a}
.setrow .st{flex:1}
.setrow .st b{display:block;font:900 15px/1.3 var(--cjk);color:#fff}
.setrow .st small{display:block;font:700 12px/1.5 var(--cjk);color:var(--t3);margin-top:3px}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{font:900 12.5px/1 var(--cjk);padding:8px 9px;border:2px solid #444;color:#ccc;background:#1d1d1d}
.seg button.on{background:var(--y);color:var(--k);border-color:var(--k)}
input[type=range]{width:120px;accent-color:#FF2E88}

#toast{position:fixed;left:50%;bottom:calc(var(--tabs) + var(--sab) + 22px);z-index:90;transform:translate(-50%,30px) rotate(-2deg);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;background:var(--y);color:var(--k);font:900 15px/1.3 var(--cjk);padding:10px 16px;border:3px solid var(--k);box-shadow:4px 4px 0 var(--p);max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0) rotate(-2deg)}
#toast.warn{background:var(--p);color:#fff}

/* ---------- 特效層 ---------- */
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:80;pointer-events:none}
#flash{position:fixed;inset:0;z-index:79;pointer-events:none;opacity:0;background:#111}

/* ---------- 開門畫面 ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--y);background-image:radial-gradient(#00000022 24%,transparent 26%);background-size:12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;user-select:none;padding:20px}
#gate .gl{font:900 72px/1 var(--cjk);color:var(--k);-webkit-text-stroke:6px #fff;paint-order:stroke fill;text-shadow:5px 5px 0 var(--p),10px 10px 0 var(--p),15px 15px 0 var(--k);transform:rotate(-4deg);letter-spacing:6px}
#gate .ge{font:400 30px/1 var(--drip);color:var(--p);transform:rotate(-4deg) translateY(-6px);text-shadow:3px 3px 0 var(--k)}
#gate .go{font:900 clamp(18px,5vw,30px)/1 var(--cjk);background:var(--k);color:var(--y);padding:14px 26px;transform:rotate(-3deg);box-shadow:6px 6px 0 var(--p);margin-top:16px;animation:pulse 1.4s ease-in-out infinite}
#gate .gm{font:900 14px/1 var(--cjk);color:var(--k);text-decoration:underline;padding:10px;opacity:.75}
#gate .gs{font:400 15px/1 var(--hand);color:var(--k);opacity:.75}
@keyframes pulse{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(-3deg) scale(1.05)}}

#intro{position:fixed;inset:0;z-index:99;background:#111;overflow:hidden;cursor:pointer}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .ht{-webkit-mask-image:none;mask-image:none;background-image:radial-gradient(#ffffff10 24%,transparent 26%);background-size:14px 14px}
#intro .rays{position:absolute;left:50%;top:44%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;opacity:0;background:repeating-conic-gradient(#FFE60018 0 6deg,transparent 6deg 12deg)}
#intro .rays.on{opacity:1;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#intro .solid{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;font:900 min(34vw,230px)/1 var(--cjk);color:var(--y);-webkit-text-stroke:min(1.6vw,10px) var(--k);paint-order:stroke fill;text-shadow:.03em .03em 0 var(--p),.06em .06em 0 var(--p),.09em .09em 0 var(--k);letter-spacing:.06em;opacity:0}
#intro .solid.go{animation:slam2 .26s cubic-bezier(.5,0,.75,0) forwards}
@keyframes slam2{from{opacity:0;transform:translateY(-50%) scale(1.9)}to{opacity:1;transform:translateY(-50%) scale(1)}}
#intro .stk{position:absolute;left:50%;top:62%;transform:translate(-50%,0) rotate(-6deg) scale(0);font:400 min(11vw,64px)/1 var(--drip);color:#fff;background:var(--p);padding:.12em .4em .08em;border:6px solid var(--k);box-shadow:8px 8px 0 var(--k);white-space:nowrap}
#intro .stk.go{animation:pop .5s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes pop{to{transform:translate(-50%,0) rotate(-6deg) scale(1)}}
#intro .drips{position:absolute;left:0;right:0;top:calc(40% + min(16vw,110px));height:0}
#intro .drips i{position:absolute;top:0;width:min(2.8vw,18px);background:var(--y);border-radius:0 0 12px 12px;transform-origin:50% 0;transform:scaleY(0)}
#intro .drips i.p{background:var(--p)}
#intro .drips.go i{transition:transform 1.1s cubic-bezier(.5,0,.9,.6)}
#intro .tline2{position:absolute;left:-30px;right:-30px;top:84%;height:54px;background:var(--y);color:var(--k);font:900 24px/54px var(--cjk);white-space:nowrap;overflow:hidden;transform:rotate(-3deg) translateX(-120%);letter-spacing:3px;border-top:3px solid var(--k);border-bottom:3px solid var(--k)}
#intro .tline2.go{transition:transform .38s cubic-bezier(.2,.9,.3,1.1);transform:rotate(-3deg) translateX(0)}
#intro .can{position:absolute;left:0;top:0;width:90px;z-index:3;transform-origin:30px 4px}
#intro .skip{position:absolute;right:14px;bottom:calc(14px + var(--sab));font:900 13px/1 var(--cjk);color:#777}
#intro.out{transition:clip-path .45s cubic-bezier(.7,0,.3,1);clip-path:polygon(0 0,100% 0,100% 0,0 0)}
#intro{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}

/* ---------- 大螢幕 ---------- */
@media (min-width:720px){
  #tabs{justify-content:center}
  .tab{flex:0 1 200px}
  .f-hero{aspect-ratio:21/9}
  .posters{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 26px}
  .posters .poster:first-child{grid-column:1/-1}
  .posters .poster:first-child .pimg{aspect-ratio:21/9}
  .posters .poster:first-child .ptitle{font-size:38px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .facts{grid-template-columns:1fr 1fr}
  .cards2{grid-template-columns:1fr 1fr}
  .cmp{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .f-title{font-size:52px}
  .f-top{margin:4px 0 0}
  .f-hero{border:4px solid var(--y)}
  .ftabs{margin:20px 0 0}
  .shot{flex-basis:46%}
  .glance{grid-template-columns:repeat(6,minmax(0,1fr))}
  .pks{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 28px}
  .rsns{grid-template-columns:repeat(3,minmax(0,1fr))}
  .scores{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:1100px){
  #view{max-width:1040px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:370px){
  .ptitle{font-size:26px}
  .f-title{font-size:34px}
  .fact{grid-template-columns:86px 1fr 24px}
  .voices,.fa{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
body.calm #tape .in{animation-duration:60s}
/* 手機橫拿：把跑馬燈收起來，留空間給內容 */
@media (max-height:500px) and (orientation:landscape){
  :root{--top:50px;--tabs:54px}
  #tapew{display:none}
  #app{padding-top:calc(var(--top) + var(--sat) + 6px)}
  .ftabs{top:calc(var(--top) + var(--sat))}
  .fsec{scroll-margin-top:calc(var(--top) + var(--sat) + 56px)}
  .tab{flex-direction:row;gap:6px}
  .f-hero{aspect-ratio:21/9}
  #gate .gl{font-size:54px}
}

/* 推坑：跟朋友玩、版本怎麼選 */
.multi{position:relative;margin:16px 0 4px;padding:14px 16px 12px;border:3px solid #0d0d0d;background:#fff;color:#0d0d0d;box-shadow:5px 5px 0 #0d0d0d;transform:rotate(-.6deg)}
.multi .mk{display:inline-block;font:800 12px/1 var(--fd,inherit);letter-spacing:.06em;background:#0d0d0d;color:#FFE600;padding:4px 8px;margin-bottom:8px}
.multi b{display:block;font-size:20px;font-weight:900;margin-bottom:4px}
.multi p{margin:0;font-size:15px;line-height:1.65}
.multi.m-g{background:#2fd06a}.multi.m-y{background:#FFE600}.multi.m-k{background:#f2efe6}
.eds{display:grid;gap:12px;margin:10px 0 6px}
.ed{position:relative;padding:14px 16px 12px;border:3px solid #0d0d0d;background:#fffdf3;color:#0d0d0d;box-shadow:4px 4px 0 var(--p,#ff2e88);transform:rotate(var(--rot,0deg))}
.ed.best{background:#FFE600;box-shadow:6px 6px 0 #0d0d0d}
.ed h4{margin:0 0 6px;font-size:17px;font-weight:900}
.ed p{margin:0;font-size:15px;line-height:1.65}
.ed .ed-t{margin-top:6px;font-weight:800;color:#c4005a}
.ed.best .ed-t{color:#0d0d0d}
.ed-b{position:absolute;top:-12px;right:10px;background:#ff2e88;color:#fff;font-weight:900;font-size:12px;padding:3px 8px;border:2px solid #0d0d0d;transform:rotate(3deg)}
@media (min-width:720px){.eds{grid-template-columns:repeat(3,1fr)}}

/* 手機上任何旋轉的貼紙、印章都不准把畫面撐寬（iPhone 會被拖得左右晃） */
#app{overflow-x:clip}
.pk .tp1{right:-9px}
@media (max-width:480px){.letter .seal{right:-2px}}

/* ================= 短影音：直式預告牆 ================= */
#shorts{position:fixed;left:0;right:0;top:0;bottom:calc(var(--tabs) + var(--sab));z-index:25;background:#050505;display:none;overflow:hidden;--sht:calc(50px + var(--sat))}
body.sh-on #shorts{display:block}
body.sh-on #top,body.sh-on #tapew,body.sh-on #view{display:none}
body.sh-on{overflow:hidden}
.sh-top{position:absolute;left:0;right:0;top:0;z-index:6;height:var(--sht);padding:var(--sat) 8px 0;display:flex;align-items:center;gap:8px;background:linear-gradient(#000e,#000a 62%,#0000);pointer-events:none}
.sh-top>*{pointer-events:auto}
.sh-fls{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
.sh-fls::-webkit-scrollbar{display:none}
.sh-fls .fl{flex:none;padding:7px 10px;font-size:12.5px;background:#000b;border-color:#ffffff40;color:#eee}
.sh-fls .fl.on{background:var(--y);color:var(--k);border-color:var(--k)}
.sh-auto{flex:none;display:flex;align-items:center;gap:6px;font:900 12.5px/1 var(--cjk);color:#bbb;padding:7px 9px;border:2px solid #ffffff40;border-radius:20px;background:#000b}
.sh-auto i{width:22px;height:12px;border-radius:6px;background:#555;position:relative;transition:background .2s}
.sh-auto i::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#ddd;transition:transform .2s}
.sh-auto.on{color:var(--k);background:var(--y);border-color:var(--k)}
.sh-auto.on i{background:var(--p)}
.sh-auto.on i::after{transform:translateX(10px);background:#fff}
.sh-n{flex:none;min-width:36px;text-align:right;font:400 17px/1 var(--num);color:#fff;letter-spacing:1px;opacity:.85}
.sh-x{display:none;flex:none;width:40px;height:40px;place-items:center;border-radius:50%;background:#000b;border:2px solid #ffffff40;color:#fff}
.sh-x svg{width:20px;height:20px}
.sh-nav{display:none;gap:6px}
.sh-nav button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#000b;border:2px solid #ffffff50;color:#fff;font:900 13px/1 var(--cjk)}
.sh-nav button:hover{background:var(--y);color:var(--k);border-color:var(--k)}

.sh-feed{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;outline:none}
.sh-feed::-webkit-scrollbar{display:none}
.sv{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;contain:layout paint;background:#0b0b0b repeating-linear-gradient(-45deg,#101010 0 18px,#151515 18px 36px);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sv-bg{position:absolute;left:-4%;top:-4%;width:108%;height:108%;opacity:0;transition:opacity .9s}
.sv-bg.on{opacity:.78}
.sv-shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(#ffffff0d 22%,transparent 24%) 0 0/8px 8px,linear-gradient(#000d,#0008 30%,#0006 55%,#000e)}
.sv-wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:calc(var(--sht) + 2px) 0 12px}

.sv-head{position:relative;flex:none;padding:4px 92px 6px 14px}
.sv-tags1{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.sv-kind{font:900 12.5px/1 var(--cjk);background:var(--p);color:#fff;padding:6px 9px 5px;border:2px solid var(--k);transform:rotate(-3deg);box-shadow:2px 2px 0 var(--k);letter-spacing:1px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.sv-kind.sp{background:var(--y);color:var(--k)}
.sv-date{font:400 17px/1 var(--num);color:var(--y);letter-spacing:1.5px}
.sv-new{font:400 14px/1 var(--num);background:var(--y);color:var(--k);padding:3px 6px 2px;transform:rotate(5deg);letter-spacing:1px;transition:opacity .5s,transform .5s}
.sv-new.gone{opacity:0;transform:rotate(5deg) scale(.6)}
.sv-title{font:900 clamp(25px,7.4vw,40px)/1.14 var(--cjk);color:#fff;-webkit-text-stroke:4px var(--k);paint-order:stroke fill;text-shadow:3px 3px 0 var(--p),6px 6px 0 var(--k);letter-spacing:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 6px 6px 0}
.sv-en{font:400 16px/1.2 var(--hand);color:var(--y);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-seal{position:absolute;right:12px;top:6px;width:70px;height:70px;border-radius:50%;border:5px solid var(--r);color:var(--r);background:#fffe;display:grid;place-items:center;text-align:center;font:900 15px/1.05 var(--cjk);transform:rotate(-14deg);letter-spacing:.5px;padding:4px}
.sv-seal.s-mid{border-color:#111;color:#111}
.sv-seal.s-no{border-color:#555;color:#555}
.sv-seal.pk-blind{border-color:var(--p);color:var(--p)}
.sv-seal.pk-sale{border-color:var(--k);color:var(--k);background:#ffe600}
.sv-seal.pk-gem{border-color:var(--y);color:var(--y);background:#111;font-size:13px}
.sv.act .sv-seal{animation:slamS .5s cubic-bezier(.2,.9,.3,1.3) .15s both}
.sv.act .sv-title{animation:svT .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes svT{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes slamS{from{opacity:0;transform:rotate(-34deg) scale(2.2)}to{opacity:1;transform:rotate(-14deg) scale(1)}}

.sv-stage{position:relative;flex:none;margin-top:4px}
.sv-vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-top:3px solid var(--y);border-bottom:3px solid var(--y)}
.sv-vid>video,.sv-vid>iframe,.sv-poster{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.sv-vid>video{object-fit:contain;opacity:.01;transition:opacity .3s;background:#000}
.sv-vid.on>video{opacity:1}
.sv-poster{object-fit:cover;transition:opacity .45s}
.sv-vid.on .sv-poster,.sv-vid.kbm .sv-poster{opacity:0}
.sv-ui{position:absolute;inset:0;z-index:3;pointer-events:none}
.sv-vid::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,#ffffff2e 0 2px,#0000 2px 4px),linear-gradient(90deg,#ff2e8840,#ffe60033)}
.sv-vid.zap::after{animation:zap .42s steps(5,end)}
@keyframes zap{0%{opacity:1;transform:translateY(-6%)}40%{opacity:.85;transform:translateY(4%)}70%{opacity:.5;transform:translateY(-2%)}100%{opacity:0;transform:none}}
.sv-vid.swl{animation:swl .32s cubic-bezier(.2,.9,.3,1)}
.sv-vid.swr{animation:swr .32s cubic-bezier(.2,.9,.3,1)}
@keyframes swl{from{transform:translateX(16%);opacity:.35}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-16%);opacity:.35}to{transform:none;opacity:1}}
.sv-load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);display:flex;align-items:center;gap:6px;background:var(--k);border:2px solid var(--y);padding:7px 10px;opacity:0;transition:opacity .2s}
.sv-load b{font:400 16px/1 var(--num);color:var(--y);letter-spacing:2px;margin-right:2px}
.sv-load i{width:7px;height:7px;border-radius:50%;background:var(--p);animation:ld .9s ease-in-out infinite}
.sv-load i:nth-of-type(2){animation-delay:.15s}.sv-load i:nth-of-type(3){animation-delay:.3s}
@keyframes ld{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}
.sv-vid.wait .sv-load{opacity:1;transition-delay:.35s}
.sv-big{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--p);border:4px solid var(--k);box-shadow:5px 5px 0 var(--y);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s}
.sv-big svg{width:32px;height:32px;color:#fff;margin-left:5px}
.sv-vid.paused .sv-big,.sv-vid.blocked .sv-big{opacity:1;transform:none;pointer-events:auto}
.sv-x2{position:absolute;left:50%;top:12px;transform:translateX(-50%);font:400 18px/1 var(--num);letter-spacing:1px;background:var(--y);color:var(--k);padding:5px 10px 3px;border:2px solid var(--k);opacity:0;transition:opacity .15s}
.sv-x2 b{color:var(--p)}
.sv-vid.x2 .sv-x2{opacity:1}
.sv-tap{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font:900 13px/1 var(--cjk);background:var(--k);color:#fff;border:2px solid var(--p);padding:7px 11px 7px 8px;border-radius:20px;opacity:0;transition:opacity .2s}
.sv-tap svg{width:18px;height:18px;color:var(--p)}
.sv-vid.need .sv-tap{opacity:1;pointer-events:auto;animation:pulseT 1.6s ease-in-out infinite}
@keyframes pulseT{50%{transform:scale(1.06)}}
.sv-ythint{position:absolute;left:10px;right:10px;top:10px;font:800 12.5px/1.3 var(--cjk);color:#fff;background:#000d;padding:7px 10px;border-left:4px solid var(--p);opacity:0;transition:opacity .3s}
.sv-vid.ythint .sv-ythint{opacity:1}
.sv-fs{position:absolute;right:8px;bottom:26px;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:#000a;color:#fff;pointer-events:auto;opacity:.85}
.sv-fs svg{width:18px;height:18px}
.sv-prog{position:absolute;left:0;right:0;bottom:0;height:24px;pointer-events:auto;touch-action:none;cursor:pointer}
.sv-prog::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff38;transition:height .15s}
.sv-prog i{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--y);transform-origin:0 50%;transform:scaleX(0);transition:height .15s}
.sv-prog.drag::before,.sv-prog.drag i{height:10px}
.sv-time{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font:400 18px/1 var(--num);letter-spacing:1px;color:var(--k);background:var(--y);padding:4px 8px 2px;border:2px solid var(--k);display:none;white-space:nowrap}
.sv-prog.drag .sv-time{display:block}
.sv-vid.yt .sv-fs,.sv-vid.kbm .sv-fs,.sv-vid.yt .sv-prog,.sv-vid.kbm .sv-prog,.sv-vid.yt .sv-big{display:none}
.sv-vid:fullscreen{border:0;width:100%;height:100%}
.sv-vid:-webkit-full-screen{border:0;width:100%;height:100%}

.sv-tr{display:flex;align-items:center;gap:10px;padding:8px 14px 0;min-height:26px}
.sv-tn{flex:1;min-width:0;font:700 12.5px/1.3 var(--cjk);color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-tn b{font:900 10.5px/1 var(--cjk);background:#fff;color:var(--k);padding:3px 5px 2px;margin-right:6px;vertical-align:1px;letter-spacing:.5px}
.sv-dots{display:flex;gap:5px;flex:none}
.sv-dots i{width:7px;height:7px;border-radius:4px;background:#ffffff55;transition:width .2s,background .2s}
.sv-dots i.on{width:18px;background:var(--y)}

.sv-foot{flex:1;min-height:0;display:flex;align-items:flex-end;gap:6px;padding:8px 6px 0 14px}
.sv-info{flex:1;min-width:0;max-height:100%;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.sv-cap{font:800 15px/1.5 var(--cjk);color:#fff;text-shadow:1px 1px 0 #000,0 0 6px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;flex:none}
.sv-more{display:none}
.sv-info.open{position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:calc(100% - var(--sht) - 8px);padding:40px 14px 16px;background:linear-gradient(#0000,#000e 60px);overflow-y:auto;overscroll-behavior:contain;justify-content:flex-start}
.sv-info.open .sv-cap{display:block;font-size:16px}
.sv-info.open .sv-more{display:block;margin-top:8px;padding:10px 12px;background:#0009;border-left:3px solid var(--p)}
.sv-more p{font:700 14px/1.75 var(--cjk);color:#eee}
.sv-mt{align-self:flex-start;font:900 12px/1 var(--cjk);color:var(--y);padding:6px 0 2px;letter-spacing:1px;flex:none}
.sv-info.open .sv-mt::before{content:"▴ 收起"}
.sv-info:not(.open) .sv-mt::before{content:"▾ 看更多"}
.sv .chips{padding-right:0;margin-top:8px;gap:5px;flex:none}
.sv .chip{font-size:12px;padding:5px 7px}
.sv-hash{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:7px;font:800 13px/1.3 var(--cjk);color:var(--y);text-shadow:1px 1px 0 #000;flex:none}
.sv-cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;flex:none}
.sv-rail{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:2px}
.sv-rail button{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font:800 11px/1 var(--cjk);text-shadow:1px 1px 0 #000;letter-spacing:.5px;white-space:nowrap}
.sv-rail svg{width:26px;height:26px;padding:10px;box-sizing:content-box;border-radius:50%;background:#000b;border:2px solid #ffffff40;transition:transform .15s}
.sv-rail button:active svg{transform:scale(.9)}
.sv-rail button.on svg{color:var(--p);border-color:var(--p);background:#2a0b18}
.sv-rail button.on svg path{fill:var(--p)}
.sv-rail button.off svg{color:#999}
.sv-rail button.pop svg{animation:hpop .45s cubic-bezier(.2,.9,.3,1.6)}
@keyframes hpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.sv-hrt{position:absolute;z-index:8;width:112px;height:112px;margin:-56px 0 0 -56px;pointer-events:none;color:var(--k);animation:hrt 1s cubic-bezier(.2,.9,.3,1) forwards}
.sv-hrt svg{position:absolute;inset:0;width:100%;height:100%;stroke-width:1.5}
.sv-hrt svg:first-child{transform:translate(7px,7px);color:var(--y)}
.sv-hrt svg:first-child path{fill:var(--y)}
.sv-hrt svg:last-child path{fill:var(--p)}
@keyframes hrt{0%{transform:rotate(var(--r)) scale(.2);opacity:0}15%{transform:rotate(var(--r)) scale(1.25);opacity:1}30%{transform:rotate(var(--r)) scale(.95)}45%{transform:rotate(var(--r)) scale(1.05)}70%{transform:rotate(var(--r)) scale(1) translateY(0);opacity:1}100%{transform:rotate(var(--r)) scale(1.3) translateY(-90px);opacity:0}}

.sv-end{display:grid;place-items:center;padding:calc(var(--sht) + 10px) 22px 20px;background:var(--y) radial-gradient(#00000022 24%,transparent 26%) 0 0/12px 12px}
.sv-endb{max-width:460px;text-align:center}
.sv-endt{display:inline-block;font:900 54px/1 var(--cjk);color:var(--k);-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:4px 4px 0 var(--p),8px 8px 0 var(--k);transform:rotate(-4deg);margin-bottom:22px;letter-spacing:4px}
.sv-endb p{font:800 15px/1.75 var(--cjk);color:var(--k)}
.sv-endb .btnrow{justify-content:center;margin-top:18px}

.sh-hint{position:absolute;left:50%;bottom:20px;z-index:9;transform:translateX(-50%) rotate(-1.5deg);width:min(330px,88vw);background:var(--k);border:3px solid var(--y);box-shadow:6px 6px 0 var(--p);padding:14px 16px 12px;animation:hintIn .45s cubic-bezier(.2,.9,.3,1.3);cursor:pointer}
.sh-hint.out{opacity:0;transform:translateX(-50%) translateY(20px);transition:opacity .35s,transform .35s}
.hh-t{font:900 16px/1 var(--cjk);color:var(--y);margin-bottom:10px;letter-spacing:1px}
.hh{display:flex;align-items:center;gap:10px;font:800 14px/1.4 var(--cjk);color:#fff;padding:4px 0}
.hh b{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--y);color:var(--k);font:900 15px/1 var(--cjk)}
.hh:nth-of-type(2) b{animation:upb 1.1s ease-in-out infinite}
@keyframes upb{50%{transform:translateY(-5px)}}
.hh-ok{margin-top:10px;text-align:center;font:900 14px/1 var(--cjk);background:var(--p);color:#fff;padding:9px;border:2px solid #fff}
@keyframes hintIn{from{opacity:0;transform:translateX(-50%) translateY(30px)}to{opacity:1;transform:translateX(-50%) rotate(-1.5deg)}}
body.calm .sv-vid.zap::after,body.calm .sv.act .sv-seal,body.calm .sv.act .sv-title,body.calm .sv-vid.swl,body.calm .sv-vid.swr{animation:none}

/* 直拿、比較矮的手機：收一點 */
@media (orientation:portrait) and (max-height:830px){
  .sv-en{display:none}
  .sv-rail{gap:7px}
  .sv-rail svg{width:22px;height:22px;padding:9px}
}
@media (orientation:portrait) and (max-height:700px){
  .sv-title{font-size:clamp(22px,6.6vw,30px);-webkit-line-clamp:1}
  .sv-hash{display:none}
  .sv-head{padding-right:78px}
  .sv-seal{width:58px;height:58px;font-size:13px;border-width:4px}
  .sv-cap{-webkit-line-clamp:2;font-size:14px}
  .sv-tags1{margin-bottom:5px}
  .sv-rail{gap:6px;width:48px}
  .sv-rail span{display:none}
  .sv-rail svg{width:20px;height:20px;padding:7px}
  .sv-cta{margin-top:8px}
  .sv-cta .btn{padding:7px 9px}
}
/* 手機橫拿：沉浸模式，影片吃滿高度，字和按鈕疊在上面，不動會自己淡掉 */
@media (orientation:landscape) and (max-height:500px){
  body.sh-on #tabs{display:none}
  body.sh-on #shorts{bottom:0}
  #shorts{--sht:calc(46px + var(--sat))}
  .sh-top{background:none;padding-left:calc(8px + env(safe-area-inset-left,0px));padding-right:calc(80px + env(safe-area-inset-right,0px))}
  .sh-fls{display:none}
  .sh-x{display:grid}
  .sh-top .sh-auto{margin-left:auto}
  .sv-wrap{display:block;padding:0}
  .sv-stage{position:absolute;top:0;bottom:0;left:env(safe-area-inset-left,0px);right:calc(72px + env(safe-area-inset-right,0px));margin:0;container-type:size;display:flex;align-items:center;justify-content:center}
  .sv-vid{width:min(100cqw,calc(100cqh * 16 / 9));border:0}
  .sv-tr{position:absolute;right:10px;top:calc(var(--sht) - 2px);max-width:44%;padding:5px 8px;background:#000a;z-index:5;min-height:0}
  .sv-head{position:absolute;left:env(safe-area-inset-left,0px);top:var(--sht);max-width:min(54%,560px);padding:6px 76px 10px 16px;z-index:5;pointer-events:none;background:linear-gradient(90deg,#000c,#0000)}
  .sv-title{font-size:24px;-webkit-line-clamp:1}
  .sv-en{display:none}
  .sv-seal{width:54px;height:54px;font-size:12px;border-width:4px;right:10px;top:4px}
  .sv-foot{position:absolute;inset:0;padding:0;display:block;pointer-events:none}
  .sv-info{position:absolute;left:env(safe-area-inset-left,0px);bottom:0;width:min(58%,580px);max-height:60%;padding:30px 16px 12px;background:linear-gradient(#0000,#000c 34%);pointer-events:auto}
  .sv-info.open{width:min(70%,640px);right:auto;max-height:92%}
  .sv-cap{-webkit-line-clamp:2}
  .sv-hash{display:none}
  .sv-rail{position:absolute;right:calc(4px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);pointer-events:auto;gap:8px}
  .sv-rail svg{width:22px;height:22px;padding:9px}
  .sv-head,.sv-info,.sv-tr,.sh-top{transition:opacity .45s}
  .sv-fs{transition:opacity .45s}
  body.sh-idle .sv-head,body.sh-idle .sv-info:not(.open),body.sh-idle .sv-tr,body.sh-idle .sh-top,body.sh-idle .sv-fs{opacity:0;pointer-events:none}
  .sh-hint{bottom:12px}
}
/* 電腦、平板橫放：劇院版，左邊影片、右邊資訊 */
@media (orientation:landscape) and (min-width:900px) and (min-height:501px){
  #shorts{--sht:62px}
  .sh-top{padding:0 26px}
  .sh-fls{flex:0 1 auto}
  .sh-top .sh-auto{margin-left:auto}
  .sv-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"stage head" "stage foot";column-gap:30px;padding:calc(var(--sht) + 4px) 30px 22px;max-width:1600px;margin:0 auto}
  .sv-stage{grid-area:stage;margin:0;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .sv-vid{width:min(100cqw - 10px,calc((100cqh - 50px) * 16 / 9));border:4px solid var(--y);box-shadow:8px 8px 0 var(--p)}
  .sv-tr{width:min(100cqw - 10px,calc((100cqh - 50px) * 16 / 9));padding:14px 2px 0}
  .sv-head{grid-area:head;padding:10px 90px 6px 0}
  .sv-title{font-size:40px;-webkit-line-clamp:3}
  .sv-en{font-size:18px}
  .sv .chip{font-size:13px;padding:6px 8px}
  .sv-hash{font-size:14px}
  .sv-tn{font-size:13.5px}
  .sv-seal{right:0;top:8px}
  .sv-foot{grid-area:foot;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:12px 0 0;gap:18px;min-height:0;overflow-y:auto;scrollbar-width:thin}
  .sv-info{flex:none;max-height:none;justify-content:flex-start;overflow:visible}
  .sv-info.open{position:static;background:none;padding:0;max-height:none;overflow:visible}
  .sv-cap{-webkit-line-clamp:5;font-size:17px}
  .sv-rail{flex-direction:row;width:auto;justify-content:flex-start;gap:16px}
  .sh-hint{bottom:28px}
}
@media (hover:hover) and (pointer:fine){
  .sh-nav{display:flex}
  .sv-rail button:hover svg{border-color:var(--y);transform:scale(1.06)}
  .sv-vid:hover .sv-prog::before,.sv-vid:hover .sv-prog i{height:7px}
}

/* ================= 獵價（Steam 願望單＋想玩） ================= */
.hsync{display:inline-block;margin-left:6px;color:var(--y);font-weight:900}
.hwarn{color:var(--p);font-weight:900}
.radarw{display:grid;gap:16px;margin:8px 0 6px}
.radar{position:relative;width:min(330px,88vw);aspect-ratio:1;margin:6px auto 0;border-radius:50%;background:#0c0c0c;border:4px solid var(--y);box-shadow:6px 6px 0 var(--p),inset 0 0 0 3px #000;overflow:hidden}
.rd-grid{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,transparent 0 23.6%,#ffe60033 23.6% 24.4%,transparent 24.4% 48.6%,#ffe60033 48.6% 49.4%,transparent 49.4% 73.6%,#ffe60026 73.6% 74.4%,transparent 74.4%),
  linear-gradient(transparent calc(50% - 1px),#ffe6002e calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(90deg,transparent calc(50% - 1px),#ffe6002e calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),
  radial-gradient(#ffffff10 1px,transparent 1.5px) 0 0/12px 12px}
.rd-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 270deg,#ffe6000a 290deg,#ffe60052 357deg,#ffe600cc 359.4deg,transparent 360deg);transform:rotate(0deg);will-change:transform}
.blip{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;display:grid;place-items:center;z-index:2;border-radius:50%}
.blip i{display:block;width:7px;height:7px;border-radius:50%;background:#bdbdbd;opacity:.75}
.blip.b-n i{width:5px;height:5px;background:#9a9a9a}
.blip.b-soon i{width:0;height:0;border-radius:0;background:none;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid #fff;opacity:.85}
.blip.b-sale i{width:11px;height:11px;background:var(--p);opacity:1;box-shadow:0 0 0 2px #000}
.blip.b-low i{width:14px;height:14px;background:var(--y);opacity:1;box-shadow:0 0 0 2px #000,0 0 0 4px var(--p)}
.blip.b-sale::after,.blip.b-low::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid var(--p);animation:bpulse 1.8s ease-out infinite;opacity:0}
.blip.b-low::after{border-color:var(--y)}
.blip.hit i{animation:bhit .5s ease-out}
@keyframes bpulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes bhit{0%{transform:scale(2.2)}100%{transform:scale(1)}}
.rd-tl,.rd-br{position:absolute;z-index:3;font:400 14px/1 var(--num);letter-spacing:2px;color:var(--y);pointer-events:none}
.rd-tl{left:18%;top:15%}.rd-tl b{display:block;font-size:30px;color:#fff}
.rd-br{right:18%;bottom:14%;color:var(--p)}
.rd-br i{font-style:normal;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hs{background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:4px 4px 0 var(--y);padding:8px 10px 6px;transform:rotate(-.8deg)}
.hs:nth-child(2){transform:rotate(.9deg)}
.hs>span{display:block;font:900 12px/1 var(--cjk);opacity:.7}
.hs b{font:400 38px/1.05 var(--num);letter-spacing:1px}
.hs small{font:900 13px var(--cjk);margin-left:3px}
.hs.p{background:var(--p);color:#fff;box-shadow:4px 4px 0 var(--k)}
.hs.y{background:var(--y)}
.hs.w{grid-column:1/-1;background:var(--k);color:var(--y);border-color:var(--y);box-shadow:4px 4px 0 var(--p);display:flex;align-items:baseline;gap:10px;transform:rotate(-.4deg)}
.hs.w>span{color:#fff;opacity:1;font-size:13px}
.hs.w b{white-space:nowrap}
.hs.w b{font-size:34px}
.hlegend{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font:700 12px/1.4 var(--cjk);color:var(--t2)}
.hlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:4px}
.lg-low{background:var(--y);box-shadow:0 0 0 2px var(--p)}.lg-sale{background:var(--p)}.lg-n{background:#9a9a9a}
.lg-soon{width:0!important;height:0!important;border-radius:0!important;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid #fff}
.hconn{margin:18px 2px 8px;background:#fff;color:var(--k);border:3px solid var(--k);box-shadow:6px 6px 0 var(--p);padding:14px 16px;transform:rotate(-.4deg)}
.hc-h{display:flex;align-items:center;gap:8px;font:900 19px/1.2 var(--cjk)}
.hc-h svg{width:26px;height:26px;color:var(--p)}
.hconn p{font:700 14.5px/1.7 var(--cjk);margin-top:8px}
.hconn ol{margin:10px 0 0 20px;font:700 14.5px/1.7 var(--cjk)}
.hconn li{margin:6px 0}
.hconn a{color:#c4005a;font-weight:900;margin-left:4px}
.hf{margin-top:18px}
.tape-h small{font:400 16px/1 var(--num);letter-spacing:1px;margin-left:6px;opacity:.8}
.hquiet{display:grid;gap:4px;margin:18px 2px;padding:14px 16px;border:3px dashed #555;color:var(--t2);font:700 13.5px/1.5 var(--cjk)}
.hquiet b{color:#fff;font-size:16px}

/* 懸賞單（正在特價） */
.bounties{display:grid;gap:30px;padding:8px 4px 6px}
.bounty{position:relative;background:#f3ead2;color:var(--k);border:3px solid var(--k);box-shadow:8px 8px 0 var(--p);transform:rotate(var(--rot,0deg));cursor:pointer}
.bounty::before{content:"";position:absolute;inset:6px;border:2px solid #0000002a;pointer-events:none}
.bounty.gold{background:#fff6b8;box-shadow:8px 8px 0 var(--k),0 0 0 4px var(--y)}
.bounty.drop{animation:slapIn .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i,0) * 140ms + 60ms)}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 14px 6px;border-bottom:3px solid var(--k)}
.bw{font:400 38px/1 var(--drip);color:var(--k);letter-spacing:2px}
.bn{font:900 22px/1 var(--cjk);color:#fff;background:var(--r);padding:6px 9px 5px;transform:rotate(3deg);border:2px solid var(--k);box-shadow:3px 3px 0 var(--k);white-space:nowrap}
.bounty.gold .bn{background:var(--k);color:var(--y)}
.bimg{position:relative;aspect-ratio:616/353;background:#222;overflow:hidden;border-bottom:3px solid var(--k)}
.bimg img{width:100%;height:100%;object-fit:cover}
.bimg .ph{position:absolute;inset:0;display:grid;place-items:center;font:400 34px var(--drip);color:var(--y);background:repeating-linear-gradient(-45deg,#1a1a1a 0 18px,#222 18px 36px)}
.bnew,.blow,.bend{position:absolute;z-index:2;font:900 13px/1 var(--cjk);padding:6px 8px;border:2px solid var(--k)}
.bnew{left:8px;top:8px;background:var(--y);color:var(--k);font:400 18px/1 var(--num);letter-spacing:2px;transform:rotate(-6deg);animation:bnew 1.1s ease-in-out infinite alternate}
@keyframes bnew{to{transform:rotate(-6deg) scale(1.12)}}
.blow{right:8px;bottom:8px;background:var(--k);color:var(--y);transform:rotate(-3deg)}
.blow.low{background:var(--y);color:var(--k);font-size:16px;box-shadow:3px 3px 0 var(--p)}
.blow.new{background:#fff;color:var(--k);font-size:12px}
.bend{left:8px;bottom:8px;background:#fff;color:var(--k)}
.bend.hot{background:var(--p);color:#fff;animation:bnew .7s ease-in-out infinite alternate}
.bb{padding:12px 16px 16px}
.bb h3{font:900 25px/1.15 var(--cjk);padding-right:70px}
.ben{font:400 15px/1.2 var(--hand);color:#c4005a;margin-top:2px}
.bprice{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:10px 0 8px}
.bprice s{font:400 22px/1 var(--num);color:#777;letter-spacing:1px}
.bprice b{font:400 44px/1 var(--num);letter-spacing:1px;color:var(--r)}
.bprice em{font:900 13px/1 var(--cjk);font-style:normal;background:var(--k);color:var(--y);padding:5px 7px}
.bounty .chips{padding-right:0}
.bstamp{position:absolute;right:12px;top:58px;z-index:3;width:78px;height:78px;border-radius:50%;border:5px solid var(--r);color:var(--r);display:grid;place-items:center;font:900 22px/1 var(--cjk);background:#ffffffd0;transform:rotate(-14deg);letter-spacing:2px}
.bounty.gold .bstamp{border-color:var(--k);color:var(--k);background:var(--y)}
/* 價格血條 */
.hp{position:relative;height:9px;background:#00000026;border:2px solid var(--k);margin-top:6px}
.hp .hpf{position:absolute;left:0;top:0;bottom:0;width:var(--cur);background:#e3001b}
.hp.mid .hpf{background:var(--p)}
.hp.low .hpf{background:#ff8a00}
.hp.crit .hpf{background:var(--y);animation:crit .6s steps(2) infinite}
@keyframes crit{50%{opacity:.45}}
.hp .hpl{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:var(--y);box-shadow:0 0 0 1.5px var(--k)}
.hp.big{height:16px;border-width:3px;margin-top:10px}
.hp.big::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#0000002e calc(10% - 2px) 10%);pointer-events:none}
.hpk{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font:900 11.5px/1.3 var(--cjk);color:#555}
.hpk .lw{color:#7a5a00}
.hinfo .hpk{color:#aaa}.hinfo .hpk .lw{color:var(--y)}
/* 目標清單（等降價、未上市） */
.trows{display:grid;gap:10px;padding:2px}
.trow{display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:center;background:var(--g);border:2px solid #333;padding:8px 10px 8px 8px;cursor:pointer}
.trow:active{transform:scale(.99)}
.tri{position:relative;aspect-ratio:460/215;background:#222;overflow:hidden;border:2px solid #000}
.tri img{width:100%;height:100%;object-fit:cover}
.tri .ph{position:absolute;inset:0;display:grid;place-items:center;font:400 22px var(--num);color:#666}
.trb{min-width:0}
.trb h4{font:900 15px/1.3 var(--cjk);color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trc{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.trc .chip{font-size:11px;padding:4px 6px}
.trow .hp{height:7px;border-color:#000;background:#ffffff1c}
.trr{display:grid;justify-items:end;gap:3px;text-align:right;font:700 11.5px/1.3 var(--cjk);color:var(--t2);white-space:nowrap}
.tr-p{font:400 22px/1 var(--num);color:var(--y);letter-spacing:1px}
.tr-cd{font:400 32px/1 var(--num);color:var(--p)}
.tr-cd small{font:900 12px var(--cjk);margin-left:2px}
/* 情報卡 */
#sheet .sbox.hsheet{max-width:620px;margin:0 auto}
.hinfo .hi-img{position:relative;aspect-ratio:616/353;background:#222;overflow:hidden;border:3px solid var(--y);margin:26px 0 12px;box-shadow:5px 5px 0 var(--p)}
.hinfo .hi-img img,.hinfo .hi-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hinfo .hi-v{opacity:0;transition:opacity .4s}.hinfo .hi-v.on{opacity:1}
.hinfo .hi-img .bn{position:absolute;right:10px;top:10px;z-index:2}
.hinfo h3{margin:0!important}
.hinfo .ben{color:var(--p)}
.hi-price{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0 4px}
.hi-price>div{background:#fff;color:var(--k);border:2px solid var(--k);padding:8px 10px;box-shadow:3px 3px 0 var(--y)}
.hi-price span{display:block;font:900 11.5px/1 var(--cjk);opacity:.65}
.hi-price b{font:400 30px/1.1 var(--num);letter-spacing:1px;color:var(--r)}
.hi-price b.sm{font-size:24px;color:var(--k)}
.hi-price s{display:block;font:400 17px/1 var(--num);color:#888}
.hi-price em{display:block;font:900 12px/1.3 var(--cjk);font-style:normal;color:#c4005a}
.hi-chart{margin:12px 0 4px}
.pchart{width:100%;height:110px;display:block;background:#0c0c0c;border:2px solid #333}
.pchart .pa{fill:#ff2e8826}.pchart .pl{fill:none;stroke:var(--p);stroke-width:1.4;vector-effect:non-scaling-stroke}
.pchart circle{fill:var(--y);stroke:#000;stroke-width:.4}
.pc-k{display:flex;justify-content:space-between;font:700 11.5px var(--cjk);color:var(--t3);margin-top:4px}
.hi-p{font:700 14.5px/1.75 var(--cjk);color:#ddd;margin:12px 0 6px}
/* 首頁：獵價膠帶 */
