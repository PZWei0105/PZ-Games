/* ---- deals.js ---- */
/* 解包 — 大特賣倒數＋免費補給站。
   data/events.json：官方公布的 Steam 大特賣、新品節、TGA（日期照官方；時間照 Steam 慣例的太平洋時間上午 10 點）。
   data/free.json：Epic、Steam、GOG 現在限時免費領的遊戲（GitHub Actions 每小時更新；Epic 還有下週預告）。 */
const DEAL = { cd: 0 };
S.freeGot = LS.get('freeGot', {});     // 領過的（只存在這台裝置）
S.freeSeen = LS.get('freeSeen', {});   // 看過的（分頁上的數字）
const STORE = { epic: ['Epic', 'ep'], steam: ['Steam', 'st'], gog: ['GOG', 'gg'] };

const evList = () => (S.events && S.events.items) || [];
function evState(e, now = Date.now()) { const s = Date.parse(e.start), en = e.end ? Date.parse(e.end) : s + 36e5; return now < s ? 'soon' : now < en ? 'on' : 'past'; }
/* 下一波（或正在進行的）大特賣 */
function nextSale() { return evList().filter((e) => e.kind === 'sale' && evState(e) !== 'past').sort((a, b) => (a.start < b.start ? -1 : 1))[0] || null; }
function cdTxt(ms, sec = true) {
  if (ms <= 0) return '00:00:00';
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  return `${d ? d + ' 天 ' : ''}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}${sec ? ':' + String(s).padStart(2, '0') : ''}`;
}
function twWhen(iso) { const d = new Date(Date.parse(iso) + 8 * 3600e3); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}（${WK[d.getUTCDay()]}）${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`; }
function daysTo(iso) { return Math.max(0, Math.ceil((Date.parse(iso) - Date.now()) / 864e5)); }

/* 判定是「等特價／等史低」的獵物：照 Claude 的目標價全部入手要多少 */
function warChest() {
  const t = huntTargets().filter((x) => x.buy && (x.buy.call === '等特價' || x.buy.call === '等史低') && x.buy.target != null && !x.hit);
  return { n: t.length, sum: t.reduce((a, x) => a + x.buy.target, 0), list: t };
}
/* 買不買卡：等特價的，順便告訴你下一波大特賣還有幾天 */
function saleHint(b) {
  if (!b || (b.call !== '等特價' && b.call !== '等史低')) return '';
  const e = nextSale(); if (!e) return '';
  const st = evState(e);
  return `<div class="bc-sale">${st === 'on' ? `🔥 ${esc(e.name)}進行中，到 ${esc(twWhen(e.end))}：現在正是等的那一波` : `⏳ 下一波大特賣：${esc(e.name)} ${esc(twWhen(e.start))} 開打（還有 ${daysTo(e.start)} 天）`}</div>`;
}
/* 獵價頁：大特賣倒數 */
function saleHtml() {
  const e = nextSale(); if (!e) return '';
  const st = evState(e); const ms = Date.parse(st === 'on' ? e.end : e.start) - Date.now();
  if (st !== 'on' && ms > 7 * 864e5) {   // 還早：一條就好，不擋住雷達
    const wc0 = warChest();
    return `<section class="dl-sale mini"><div class="dl-k">NEXT BIG SALE</div><div class="dl-row"><h3>${esc(e.name)}</h3><b id="dlcd" data-to="${esc(e.start)}">${esc(cdTxt(ms))}</b></div><div class="dl-cd"><span>${esc(twWhen(e.start))} 開打（台灣時間），連 ${Math.round((Date.parse(e.end) - Date.parse(e.start)) / 864e5)} 天${wc0.n ? `・備戰：${wc0.n} 款等特價，照目標價全收約 ${esc(fmtNT(wc0.sum))}` : ''}</span></div></section>`;
  }
  const wc = warChest(); const nx = evList().filter((x) => x.id !== e.id && evState(x) !== 'past' && (x.big || x.kind === 'sale')).sort((a, b) => (a.start < b.start ? -1 : 1)).slice(0, 3);
  return `<section class="dl-sale ${st}"><div class="dl-k">${st === 'on' ? '● 進行中' : 'NEXT BIG SALE'}</div><h3>${esc(e.name)}</h3>
    <div class="dl-cd"><b id="dlcd" data-to="${esc(st === 'on' ? e.end : e.start)}">${esc(cdTxt(ms))}</b><span>${st === 'on' ? `到 ${esc(twWhen(e.end))} 結束` : `${esc(twWhen(e.start))} 開打（台灣時間）`}${e.end && st !== 'on' ? `，連 ${Math.round((Date.parse(e.end) - Date.parse(e.start)) / 864e5)} 天` : ''}</span></div>
    ${wc.n ? `<div class="dl-war"><b>${ICON.target}備戰清單</b><span>${wc.n} 款 Claude 判定「等特價／等史低」：照目標價全收約 <em>${esc(fmtNT(wc.sum))}</em></span></div>` : ''}
    ${nx.length ? `<div class="dl-next">${nx.map((x) => `<span><b>${esc(mdDay(twDate(Date.parse(x.start))))}</b>${esc(x.name)}</span>`).join('')}</div>` : ''}
    <a class="dl-src" href="${esc((e.src || {}).u || '#')}" target="_blank" rel="noopener noreferrer">日期來源：${esc((e.src || {}).t || '')}</a></section>`;
}
/* 首頁的獵價膠帶：大特賣前 7 天、進行中才提 */
function saleLine() {
  const e = nextSale(); if (!e) return '';

function tgaPhase() {
  const t = S.tgaD; if (!t) return 'none';
  if (t.result_at || t.cats.some((c) => c.win != null)) return 'result';
  if (Date.now() >= Date.parse(t.show)) return 'live';
  return S.tgaMe.lock ? 'locked' : 'pick';
}
function tgaReveal() { const ph = tgaPhase(); return !!(S.tgaMe.lock || S.tgaMe.peek || ph === 'live' || ph === 'result'); }
function tgaPicked() { const t = S.tgaD; return t ? t.cats.filter((c) => S.tgaMe.picks[c.id] != null).length : 0; }
function tgaScore(who) {
  const t = S.tgaD; let pts = 0, hit = 0, done = 0, max = 0;
  for (const c of (t && t.cats) || []) {
    const p = who === 'me' ? S.tgaMe.picks[c.id] : c.claude.c; const k = who === 'me' && S.tgaMe.x2.includes(c.id) ? 2 : 1;
    max += c.pt * k;
    if (c.win == null) continue;

  return { pts, hit, done, max };
}

    if (k >= 0) { me.x2.splice(k, 1); sfx.scratch(); } else { if (me.x2.length >= 3) { toast('加倍卡只有 3 張，先收回一張', 'warn'); return true; } me.x2.push(c); sfx.lock(); burstAt(act, [PINK, YEL], 14, 8); }

    TGA.sure = false; me.lock = new Date().toISOString().replace(/\.\d+Z$/, 'Z'); tgaSave();

    TGA.justLocked = true; sfx.drop(); haptic(30); route(); return true;

    if (a === 'tgacm') TGA.card.mode = act.dataset.v; if (a === 'tgacr') TGA.card.ratio = act.dataset.v;
    if (a === 'tgaspray') { TGA.card.seed++; sfx.rattle(); setTimeout(() => sfx.hiss(0.6), 200); } else sfx.click();
    $$('[data-act="tgacm"]').forEach((x) => x.classList.toggle('y', x.dataset.v === TGA.card.mode)); $$('[data-act="tgacr"]').forEach((x) => x.classList.toggle('y', x.dataset.v === TGA.card.ratio));
    const pt = $('#posttxt'); if (pt) pt.value = tgaPost();

  return false;
}

  const c = cv.getContext('2d'); const R = rnd(opt.seed * 7919 + 2026); const sq = opt.ratio === '11'; const score = opt.mode === 'score' && tgaPhase() === 'result';
  const cats = t.cats; const goty = cats.find((x) => x.id === 'goty');
  const ORDER = ['direction', 'narrative', 'art', 'score', 'audio', 'performance', 'actadv', 'action', 'rpg', 'indie', 'sim', 'family', 'sports', 'multi', 'debut', 'impact', 'fighting', 'ongoing', 'community', 'anticipated', 'adapt', 'access', 'vr', 'mobile', 'ugc', 'esgame', 'esathlete', 'esteam', 'creator'];

/* 解包 — 2026/11/18 超級大更新：開場「今日頭條」連拍、VS 擂台（兩款遊戲正面對決＋粉專二選一圖卡）

   VS 擂台只比「看得到的數字」，每一列寫清楚誰贏、為什麼；不替你決定哪一款比較好玩。 */

/* ---------- 開場：噴完「解包」之後，今天的頭條一張張拍上牆 ---------- */

  try { free = freeNow().length; } catch (e) { /* */ }

  today.forEach((x, i) => at(3760 + i * 420, () => { const p = $$('.ih-p', wrap)[i]; if (!p) return; p.classList.add('st'); sfx.stamp(); }));

/* ---------- VS 擂台 ---------- */
const VS = { a: null, b: null, raf: 0, timers: [], full: {} };
/** 上擂台前先把兩款的完整稿載進來（遊玩時間在完整稿裡）；最多等 2.5 秒，拿不到就用目錄的資料 */
async function vsPrep(arg) {
  const refs = String(arg || '').split(',').filter(Boolean);
  await Promise.race([Promise.all(refs.map(async (r) => {
    if (VS.full[r]) return;
    const [k, id] = r.split(':');
    try { VS.full[r] = k === 'p' ? await loadPick(id) : await loadFeature(id); } catch (e) { /* 用目錄 */ }
  })), sleep(2500)]);
}
/** 一款遊戲：f:<專題 id> 或 p:<推坑 id> */
function vsGame(ref) {
  if (!ref) return null;
  const [k, id] = String(ref).split(':');
  const it = k === 'p' ? ((S.picks && S.picks.items) || []).find((x) => x.id === id) : ((S.index && S.index.items) || []).find((x) => x.id === id);
  if (!it) return null;
  const lv = liveOf(it.steam);
  return { ref: `${k}:${id}`, kind: k, id, it, lv, full: VS.full[`${k}:${id}`] || null, name: it.zh, en: it.en, img: headerOf(it, lv), hero: heroOf(it, lv) };
}
function vsAll() {
  const out = [];
  for (const it of (S.index && S.index.items) || []) out.push({ ref: 'f:' + it.id, it, k: '專題' });
  for (const it of (S.picks && S.picks.items) || []) out.push({ ref: 'p:' + it.id, it, k: '推坑' });
  return out;
}
const hoursNum = (t) => { const m = /(\d+(?:\.\d+)?)/.exec(t || ''); return m ? +m[1] : null; };
const ZHN = { tc: 2, sc: 1, none: 0 };
/** 對決的每一局：n＝拿來比的數字（null＝這一款沒有資料，這局不算）、better：high／low；沒有 better 的只並列、不分勝負 */
const VS_ROWS = [
  { k: 'stamp', t: 'Claude 的章', show: (g) => g.it.stamp || '—', note: '專題（推薦／觀望／不推薦）和推坑（必玩、閉眼入…）是兩套章，只並列不比' },
  { k: 'price', t: '現在價格', n: (g) => (g.lv && g.lv.free ? 0 : g.lv && g.lv.price && g.lv.price.final != null ? g.lv.price.final : null), better: 'low',
    show: (g) => { const p = g.lv && g.lv.price; return g.lv && g.lv.free ? '免費' : p && p.final != null ? fmtNT(p.final) + (p.disc > 0 ? `<em>-${p.disc}%</em>` : '') : esc(priceLabel(g.it, g.lv) || '—'); } },
  { k: 'rv', t: 'Steam 好評率', n: (g) => (g.lv && g.lv.rv && g.lv.rv.n >= 50 && g.lv.rv.pct != null ? g.lv.rv.pct : null), better: 'high',
    show: (g) => (g.lv && g.lv.rv && g.lv.rv.pct != null ? `${g.lv.rv.pct}%<em>${esc(g.lv.rv.label || '')}・${fmtN(g.lv.rv.n || 0)} 則</em>` : '—') },
  { k: 'recent', t: '近期好評率', n: (g) => { const r = g.lv && g.lv.rv && g.lv.rv.recent; return r && r.n >= 20 && r.pct != null ? r.pct : null; }, better: 'high',
    show: (g) => { const r = g.lv && g.lv.rv && g.lv.rv.recent; return r && r.pct != null ? `${r.pct}%<em>近 ${r.days || 30} 天 ${fmtN(r.n || 0)} 則</em>` : '—'; } },
  { k: 'players', t: '現在同上', n: (g) => (g.lv && g.lv.players && g.lv.players.n != null ? g.lv.players.n : null), better: 'high',
    show: (g) => (g.lv && g.lv.players && g.lv.players.n != null ? `${fmtN(g.lv.players.n)}<em>人</em>` : '—') },
  { k: 'zh', t: '中文', n: (g) => { const z = liveZh(g.lv, g.it.zhs); return z in ZHN ? ZHN[z] : null; }, better: 'high',
    show: (g) => { const z = liveZh(g.lv, g.it.zhs); return z === 'tc' ? '有繁中' : z === 'sc' ? '只有簡中' : z === 'none' ? '無中文' : '未知'; } },
  { k: 'money', t: '課金', n: (g) => (g.it.money != null ? g.it.money : null), better: 'low', show: (g) => esc(moneyLabel(g.it.money)) },
  { k: 'time', t: '遊玩時間', show: (g) => esc(g.it.hours || (g.full && g.full.time && g.full.time.text) || (g.full && g.full.game && g.full.game.hours) || '—'), note: '長短看你要什麼，不分勝負' },
  { k: 'rel', t: '上市', show: (g) => esc(g.it.release ? g.it.release.slice(0, 7).replace('-', '/') : (g.it.year ? String(g.it.year) : '—')) },
];
function vsScore(A, B) {
  return VS_ROWS.map((r) => {
    if (!r.better) return { r, w: 0 };
    const a = r.n(A), b = r.n(B);
    if (a == null || b == null || a === b) return { r, w: 0, na: a == null || b == null };
    return { r, w: (r.better === 'high' ? a > b : a < b) ? -1 : 1 };   // -1＝左邊贏、1＝右邊贏
  });
}

function renderVS(arg) {

    <div class="vs-stage" id="vsstage">${side(A, 'l')}<div class="vs-mid"><div class="vs-burst"></div><b class="vs-vs">VS</b></div>${side(B, 'r')}</div>
    <div class="vs-score" id="vsscore"><span class="l"><b data-n="${wa}">0</b>局</span><span class="t">數據對決</span><span class="r"><b data-n="${wb}">0</b>局</span></div>
    <div class="vs-rows">${sc.map(({ r, w, na }, i) => `<div class="vs-row ${w === -1 ? 'wl' : w === 1 ? 'wr' : 'tie'}" style="--i:${i}">
        <div class="vs-v l">${r.show(A)}${w === -1 ? '<i class="vs-win">WIN</i>' : ''}</div>
        <div class="vs-k">${esc(r.t)}${!r.better ? '<small>並列</small>' : na ? '<small>資料不足</small>' : w === 0 ? '<small>平手</small>' : ''}</div>
        <div class="vs-v r">${r.show(B)}${w === 1 ? '<i class="vs-win">WIN</i>' : ''}</div></div>`).join('')}</div>
    <div class="vs-verdict" id="vsverdict">${wa === wb ? '<b>平分秋色</b>' : `<b>${esc(wa > wb ? A.name : B.name)}</b> 數據上拿下 ${Math.max(wa, wb)} 局`}<small>只比看得到的數字（價格、評價、同上、中文、課金），不代表哪一款比較好玩；好不好玩看專題、看你的口味。</small></div>
    <div class="vs-card"><h3 class="tape-h p">出成粉專「二選一」</h3>
      <p class="sub-note">一張 4:5 的對決圖卡＋貼文，讓粉絲留言選邊站（只用「遊戲狂想曲」，不放你的名字）。</p>
      <div class="vs-cv"><canvas id="vscv" width="1080" height="1350"></canvas><div class="vs-busy" id="vsbusy">畫圖卡中…</div></div>
      <div class="btnrow"><button class="btn y sm" data-act="vssave">${ICON.dl}<span>存圖卡</span></button><button class="btn sm" data-act="vsshare">${ICON.share}<span>分享</span></button><button class="btn p sm" data-act="vscopy">${ICON.copy}<span>複製貼文</span></button></div>
      <textarea class="hide" id="vspost">${esc(vsPost(A, B))}</textarea></div>

  </div>`;
}
function vsLobby(A, B) {

    : `<button class="vs-slot ${s}" data-act="vspick" data-side="${s}" data-r="${esc((s === 'l' ? B : A) ? (s === 'l' ? B : A).ref : '')}"><b class="vs-q">?</b><small>${s === 'l' ? '選第一款' : '選對手'}</small></button>`;

/** 選對手：列出全部專題與推坑（可以搜尋），點了就上擂台 */

function vsSet(ref, other, side) {

function vsFx() {

/* ---------- 粉專二選一圖卡（1080×1350） ---------- */
function vsPost(A, B) {

/* 即時數據：數字從 0 跳上來、折線畫出來 */
function countUp(root) {
  const els = $$('.cu', root); root.classList.add('counting'); if (!els.length) return;
  const t0 = performance.now(), D = 950; let lastTick = 0, ticks = 0;
  const fmt = (el, v) => (el.dataset.f === 'i' ? String(Math.round(v)) : fmtN(Math.round(v)));
  const step = (now) => {
    const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
    els.forEach((el) => { el.textContent = fmt(el, +el.dataset.n * e); });
    if (k < 1) { if (now - lastTick > 90 && ticks < 9) { lastTick = now; ticks++; sfx.tick(); } requestAnimationFrame(step); }
    else { els.forEach((el) => { el.textContent = fmt(el, +el.dataset.n); }); sfx.pop(); }
  };
  setTimeout(() => root.classList.remove('counting'), 1600);   // 折線畫完就拿掉虛線設定，免得線斷掉
  requestAnimationFrame(step);
}

        if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: '遊戲狂想曲' }); sfx.ding(); } catch (e) { /* 取消 */ } return; }
      }
      const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
      sfx.stamp(); impact($('#cardcv'), ['#FF2E88', '#FFE600'], false); toast('圖卡已下載'); return;
    }
    if (a === 'copy') {
      const f = await loadFeature(fid); const fp = f.fanpage; const post = $('#posttxt') ? $('#posttxt').value : fp.post;
      const w = act.dataset.what;
      const text = w === 'post' ? post : w === 'full' ? post + '\n\n' + fp.tags.join(' ') : w === 'title' ? fp.titles[+act.dataset.i] : w === 'tags' ? fp.tags.join(' ') : fp.script;
      if (await copyText(text)) { sfx.stamp(); haptic(); burstAt(act, ['#FFE600', '#FF2E88', '#111'], 14, 8); toast('已複製'); } else toast('複製失敗，請長按文字自己複製', 'warn');
      return;
    }
    if (a === 'postreset') { delete S.edits[fid]; save('edits'); route(); return; }
    if (a === 'posted') {
      if (S.posted[fid]) delete S.posted[fid]; else S.posted[fid] = todayTW(); save('posted');
      act.textContent = S.posted[fid] ? '已發佈（點一下取消）' : '標記為已發佈'; act.classList.toggle('p', !S.posted[fid]);
      if (S.posted[fid]) { sfx.ding(); impact(act, ['#e3001b', '#FFE600', '#111'], true); toast('蓋章！已發佈'); } else sfx.scratch();
      setTabs('fan'); return;
    }
    return;
  }
  if (go) {
    ev.preventDefault(); const to = go.dataset.go;
    if (to === location.hash.replace('#', '')) return;
    if (to === 'shorts' && ROUTE.startsWith('shorts')) { shGo(0); sfx.whoosh(); return; }   // 已經在短影音：回到最上面
    sfx.slap(); haptic();
    NAVN++; location.hash = to;
  }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'libq') {
    LIBF.q = t.value; const g = $('#libgrid'); if (!g) return;
    const old = $('.more-s[data-more="lib"]'); if (old) old.remove();
    g.outerHTML = libGridHtml(true); moreFx(); return;
  }
  const a = t.dataset && t.dataset.act;
  if (a && a.startsWith('op') && opsInput(t)) return;
  if (a === 'thought') { S.thoughts[t.dataset.k] = t.value; save('thoughts'); return; }
  if (a === 'note') { S.notes[S.curId] = t.value; save('notes'); return; }
  if (a === 'postedit') {
    const fid = ROUTE.split('/')[1]; S.edits[fid] = t.value; save('edits'); const c = $('#postcnt'); if (c) c.textContent = t.value.length + ' 字';
    clearTimeout(OPS.pt); OPS.pt = setTimeout(() => opsPfRefresh(fid.startsWith('w:') ? fid : 'f:' + fid), 700);   // 三平台版本跟著原稿更新
    return;
  }
  if (a === 'vol') { S.settings[t.dataset.k] = +t.value; save('settings'); audioApply(); if (t.dataset.k === 'vol') sfx.blip(1200); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); if (shKeys(e)) return; if ($('#sheet.on .lb')) { if (e.key === 'ArrowRight') openLightbox(LBI + 1); if (e.key === 'ArrowLeft') openLightbox(LBI - 1); } });

function topIcons() {
  const a = $('[data-act="sfx"]'), b = $('[data-act="bgm"]');
  if (a) { a.innerHTML = S.settings.sfx && !S.muted ? ICON.can : ICON.canoff; a.classList.toggle('on', S.settings.sfx && !S.muted); a.classList.toggle('off', !(S.settings.sfx && !S.muted)); }
  if (b) { b.innerHTML = ICON.boom; b.classList.toggle('on', S.settings.bgm && !S.muted); b.classList.toggle('off', !(S.settings.bgm && !S.muted)); }
}

/* ---- 啟動 ---- */
async function boot() {
  fxInit();
  document.body.classList.toggle('calm', S.settings.fx !== 'full');
  $('#top').innerHTML = `<div class="logo" data-go="home"><b>解包</b><i>UNPACKED</i></div><span class="sp"></span>
    <button class="ib askb" data-go="ask" aria-label="點播台">${ICON.radio}<i class="dot hide"></i></button><button class="ib" data-act="sfx" aria-label="音效"></button><button class="ib" data-act="bgm" aria-label="背景鼓組"></button><button class="ib" data-act="settings" aria-label="設定">${ICON.gear}</button>`;
  $('#tabs').innerHTML = `<button class="tab" data-go="home">${ICON.home}<span>今日</span></button><button class="tab" data-go="picks">${ICON.gem}<span>推坑</span><i class="dot hide"></i></button><button class="tab" data-go="shorts">${ICON.shorts}<span>短影音</span><i class="dot hide"></i></button><button class="tab" data-go="hunt">${ICON.target}<span>獵價</span><i class="dot hide"></i></button><button class="tab" data-go="lib">${ICON.box}<span>庫存</span></button><button class="tab" data-go="fan">${ICON.mega}<span>粉專</span><i class="dot hide"></i></button>`;
  topIcons();
  let ok = true;
  try { await loadIndex(); } catch (e) { ok = false; console.error(e); }
  if (!ok) { S.index = { items: [], n: 0 }; S.live = { apps: {} }; }
  tapeText();
  if (ok) livePrefetch();
  const gate = $('#gate');
  const enter = async (muted) => {
    audioInit(); S.muted = !!muted; topIcons();
    gate.remove();
    const today = todayTW(); const mode = S.settings.intro;
    const want = mode === 'off' ? null : mode === 'always' ? 'full' : mode === 'short' ? 'short' : (LS.get('introDay', '') === today ? 'short' : 'full');
    LS.set('introDay', today);
    const nToday = S.index.items.filter((x) => x.date === (S.index.items[0] || {}).date).length;
    S.introPending = !!want;
    route();
    if (want) { try { await Promise.race([document.fonts.load('900 120px "Noto Sans TC"', '解包'), sleep(700)]); } catch (e) { /* */ } await runIntro(want, nToday); }
    S.introPending = false; if (ROUTE === 'home' || ROUTE === '') homeDrop();
    bgmStart();
    setTimeout(huntAlert, 500);
    if (!ok) toast('資料讀不到，檢查一下網路', 'warn');
  };
  gate.addEventListener('click', (e) => { e.stopPropagation(); enter(!!e.target.closest('.gm')); }, { once: true });
  addEventListener('hashchange', route);
  addEventListener('online', () => askFlush());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) askFlush(); });
  setTimeout(() => askFlush(), 2500);
  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
  // 每 20 分鐘看一次有沒有新資料（App 開著的時候）
  setInterval(async () => { try { const old = S.index && S.index.at; const unread = askUnread(); await loadIndex(); if (S.index.at !== old) { tapeText(); if (ROUTE === 'home' || ROUTE === '') route(); toast('有新的解包！'); } else if (askUnread() > unread) toast('點播台有新的回覆！'); setTabs(ROUTE.split('/')[0]); } catch (e) { /* */ } }, 20 * 60e3);
  // 自動測試用：?enter=1 直接進
  if (/[?&]enter=1/.test(location.search)) gate.click();
}
boot();

</script>
