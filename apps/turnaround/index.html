  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--text);font-family:var(--zh);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{background:
  radial-gradient(120% 60% at 50% -10%,rgba(255,210,26,.08),transparent 60%),
  radial-gradient(80% 50% at 100% 100%,rgba(76,157,255,.07),transparent 60%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 64px),
  var(--night);}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
b,strong{font-weight:800}
.hap{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.en{font-family:var(--en);letter-spacing:.06em;text-transform:uppercase}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* ---------- 頂列 ---------- */
#app{min-height:100%;padding-top:calc(var(--st) + 58px);padding-bottom:calc(var(--sb) + var(--tabh) + 18px)}
#top{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--st) + 56px);padding:var(--st) calc(14px + var(--sr)) 0 calc(14px + var(--sl));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(6,8,11,.97) 70%,rgba(6,8,11,.86));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--sign);display:grid;place-items:center}
.brand-mark svg{width:22px;height:22px;fill:var(--ink)}
.brand-t{display:flex;flex-direction:column;line-height:1}
.brand-t b{font-size:19px;letter-spacing:.12em}
.brand-t i{font-style:normal;font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:.32em;color:var(--sign);margin-top:3px}
.top-r{display:flex;align-items:center;gap:12px}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.clock b{font-family:var(--mono);font-size:19px;letter-spacing:.04em;color:var(--sign)}
.clock i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.08em}
.tower-dot{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:99px;border:1px solid var(--line2);font-size:11px;color:var(--dim)}
.tower-dot i{width:8px;height:8px;border-radius:50%;background:var(--dim2)}
.tower-dot.ok i{background:var(--go);box-shadow:0 0 0 3px rgba(47,224,127,.18)}
.tower-dot.wait i{background:var(--amber);animation:blink 1.1s steps(2) infinite}
.tower-dot.off i{background:var(--red)}
@keyframes blink{50%{opacity:.25}}

/* ---------- 分頁列 ---------- */
#tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--sb));padding:0 calc(8px + var(--sr)) var(--sb) calc(8px + var(--sl));display:flex;background:rgba(10,12,16,.97);border-top:1px solid var(--line)}
#tabs a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim)}
#tabs a svg{width:24px;height:24px;fill:currentColor;transition:transform .25s}
#tabs a b{font-size:12px;letter-spacing:.1em}
#tabs a i{font-style:normal;font-family:var(--en);font-weight:600;font-size:9px;letter-spacing:.2em;opacity:.7}
#tabs a.on{color:var(--sign)}
#tabs a.on svg{transform:translateY(-1px) scale(1.08)}
#tabs a.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--sign);border-radius:0 0 3px 3px}
.badge{position:absolute;top:7px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-family:var(--mono);font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center}
.badge.on{display:flex}

/* ---------- 畫面 ---------- */
#views{max-width:760px;margin:0 auto;padding:0 calc(14px + var(--sr)) 0 calc(14px + var(--sl))}
.view{display:none}
.view.on{display:block;animation:viewIn .42s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 指標牌（機場黃） */
.sign{display:flex;align-items:center;gap:12px;margin:16px 0 12px;padding:10px 14px;border-radius:8px;background:var(--sign);color:var(--ink);position:relative;overflow:hidden}
.sign svg{width:26px;height:26px;fill:var(--ink);flex:none}
.sign .s-zh{font-size:22px;font-weight:900;letter-spacing:.14em;white-space:nowrap}
.sign .s-en{font-family:var(--en);font-weight:800;font-size:15px;letter-spacing:.18em;text-transform:uppercase;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0}
.sign .s-r{white-space:nowrap;flex:none;margin-left:auto;font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.06em;padding:4px 8px;border:2px solid var(--ink);border-radius:5px}
.sign.hazard{background:repeating-linear-gradient(-45deg,var(--sign) 0 14px,var(--ink) 14px 28px)}
.sign.hazard>*{position:relative}
.sign.hazard .s-plate{display:flex;align-items:center;gap:10px;background:var(--sign);padding:4px 10px;border-radius:6px}
.sign.dark{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
.sign.dark svg{fill:var(--sign)}
.arrow-sweep{position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.6s 1s ease-in-out infinite}
@keyframes sweep{0%{left:-80px}38%,100%{left:110%}}

.h2{display:flex;align-items:baseline;gap:10px;margin:26px 2px 10px}
.h2 b{font-size:17px;letter-spacing:.08em}
.h2 i{font-style:normal;font-family:var(--en);font-weight:800;font-size:12px;letter-spacing:.24em;color:var(--sign)}
.h2 .r{margin-left:auto;font-size:12px;color:var(--dim)}
.muted{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}

/* ---------- 塔台 ---------- */
.tower{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:linear-gradient(135deg,#121822,#0d1015);border:1px solid var(--line2);position:relative}
.tower::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--sign)}
.tower .t-ico{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,210,26,.12);display:grid;place-items:center}
.tower .t-ico svg{width:24px;height:24px;fill:var(--sign)}
.tower .t-h{font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:.24em;color:var(--sign);margin-bottom:4px}
.tower p{margin:0;font-size:15px;line-height:1.65}
.tower .t-play{margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:99px;background:var(--sign);color:var(--ink);font-weight:800;font-size:13px}
.tower .t-play svg{width:18px;height:18px;fill:var(--ink)}
.tower .t-play.on{background:var(--go)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--ink);animation:eq .6s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{height:3px}to{height:14px}}

/* ---------- 進度 ---------- */
.progress{display:flex;gap:8px;margin:12px 0 4px}
.progress .pg{flex:1;padding:10px 10px 9px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.progress .pg i{display:block;font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.06em}
.progress .pg b{font-family:var(--mono);font-size:20px}
.progress .pg b em{font-style:normal;color:var(--dim);font-size:14px}
.progress .pg .bar{height:4px;border-radius:2px;background:var(--panel3);margin-top:7px;overflow:hidden}
.progress .pg .bar u{display:block;height:100%;background:var(--sign);transform-origin:left;transition:transform .6s}

/* ---------- 翻牌看板 ---------- */
.board{background:#0a0b0d;border-radius:14px;padding:12px 10px 6px;border:1px solid #1d2128;position:relative}
.board::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 30%)}
.b-head{display:flex;justify-content:space-between;padding:0 4px 8px;border-bottom:1px solid #1d2128;font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--amber)}
.b-row{display:block;width:100%;text-align:left;padding:12px 4px 12px;border-bottom:1px dashed #22262d;position:relative}
.b-row:last-child{border-bottom:0}
.b-row:active{background:rgba(255,255,255,.03)}
.b-l1{display:flex;align-items:center;gap:10px}
.b-l2{display:flex;align-items:center;gap:10px;margin-top:8px}
.b-hook{margin-top:9px;font-size:13px;line-height:1.55;color:#aab3bf;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-lane{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.b-lane i{width:9px;height:9px;border-radius:2px}
.lane-novel{--lc:var(--novel)}.lane-game{--lc:var(--game)}.lane-free{--lc:var(--free)}.lane-hangar{--lc:var(--sign)}
.b-lane i{background:var(--lc)}
.b-gate{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:14px;color:var(--ink);background:var(--lc);padding:3px 8px;border-radius:5px}
.chev{width:18px;height:18px;fill:var(--dim2);flex:none}

/* 翻牌字格 */
.flaps{display:inline-flex;gap:3px;vertical-align:middle}
.fc{position:relative;display:inline-block;width:var(--fw,22px);height:var(--fh,30px);font-family:var(--mono);font-weight:800;font-size:var(--fs,18px);line-height:var(--fh,30px);text-align:center;color:#f3efe2;perspective:300px}
.fc>span{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#1a1d22;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc>span>b{position:absolute;left:0;right:0;height:var(--fh,30px);font-weight:inherit}
.fc .fu,.fc .ft{top:0;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#22262c,#1b1e23)}
.fc .fl,.fc .fb{bottom:0;border-radius:0 0 4px 4px;background:linear-gradient(180deg,#16191d,#1d2026)}
.fc .fl>b,.fc .fb>b{top:calc(var(--fh,30px) / -2)}
.fc .ft{transform-origin:50% 100%;z-index:2}
.fc .fb{transform-origin:50% 0;z-index:2;transform:rotateX(90deg)}
.fc::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;margin-top:-.5px;background:#050607;z-index:3}
.flaps.zh .fc{--fw:40px;--fh:48px;--fs:31px;font-family:var(--zh);font-weight:900}
.flaps.zh .fc>span>b{letter-spacing:0}
.flaps.sm .fc{--fw:15px;--fh:22px;--fs:13px}
.flaps.amber .fc{color:var(--amber)}
.flaps.sign .fc{color:var(--sign)}

/* 狀態燈 */
.st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:.06em;border:1px solid currentColor;white-space:nowrap}
.st i{font-style:normal;font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:.14em}
.st.ontime{color:#cfd6df;border-color:#3a414b}
.st.boarding{color:var(--sign);animation:pulseB 1.2s ease-in-out infinite}
.st.board{color:var(--go)}
.st.delay{color:var(--amber)}
.st.cancel{color:var(--red)}
.st.service{color:var(--amber)}
.st.done{color:var(--go)}
@keyframes pulseB{50%{opacity:.45}}

/* ---------- 到站紀錄 ---------- */
.arrivals{display:flex;flex-direction:column;gap:8px}
.arr{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.arr .d{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--sign);min-width:52px}
.arr .ds{flex:1;font-size:13px;color:#c6cdd6;line-height:1.6}
.arr .ds b{color:var(--text)}
.arr.cur{border-color:rgba(255,210,26,.45)}

/* ---------- 全螢幕頁 ---------- */
#pages{position:fixed;inset:0;z-index:40;pointer-events:none}
.page{position:absolute;inset:0;background:var(--night);overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto;animation:pageIn .45s cubic-bezier(.2,.8,.2,1)}
.page.out{animation:pageOut .28s ease-in forwards}
@keyframes pageIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pageOut{to{transform:translateY(30px);opacity:0}}
.pg-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) calc(14px + var(--sr)) 10px calc(14px + var(--sl));background:rgba(6,8,11,.96);border-bottom:1px solid var(--line)}
.pg-x{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.pg-x svg{width:20px;height:20px;fill:var(--text)}
.pg-t{flex:1;min-width:0}
.pg-t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-t i{font-style:normal;font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--sign)}
.pg-a{display:flex;gap:8px}
.chip-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);font-size:13px;font-weight:700;white-space:nowrap}
.chip-btn svg{width:16px;height:16px;fill:currentColor}
.chip-btn.y{background:var(--sign);color:var(--ink);border-color:var(--sign)}
.pg-body{max-width:640px;margin:0 auto;padding:16px calc(14px + var(--sr)) calc(var(--sb) + 120px) calc(14px + var(--sl))}

/* ---------- 登機證 ---------- */
.pass{position:relative;border-radius:18px;background:var(--paper);color:var(--pink);overflow:hidden;box-shadow:0 18px 0 -10px rgba(0,0,0,.35)}
.pass-band{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--lc);color:var(--ink)}
.pass-band b{font-family:var(--en);font-weight:800;font-size:15px;letter-spacing:.16em}
.pass-band span{font-size:12px;font-weight:800;letter-spacing:.1em}
.pass-route{display:flex;align-items:center;gap:10px;padding:16px 16px 4px}
.pass-route .ap{display:flex;flex-direction:column}
.pass-route .ap b{font-family:var(--en);font-weight:800;font-size:46px;line-height:.9;letter-spacing:.02em}
.pass-route .ap i{font-style:normal;font-size:12px;color:var(--pdim);margin-top:4px}
.pass-route .ap.to{margin-left:auto;text-align:right}
.pass-route .fly{flex:1;position:relative;height:30px}
.pass-route .fly::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #c9c1ae}
.pass-route .fly svg{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;fill:var(--pink);background:var(--paper);padding:2px}
.pass-title{padding:8px 16px 0}
.pass-title b{font-size:30px;letter-spacing:.06em}
.pass-title i{font-style:normal;font-family:var(--en);font-weight:800;font-size:14px;letter-spacing:.16em;color:var(--pdim);margin-left:8px}
.pass-kind{padding:2px 16px 0;font-size:13px;color:var(--pdim)}
.pass-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:14px 16px}
.pass-grid div i{display:block;font-style:normal;font-family:var(--en);font-weight:800;font-size:10px;letter-spacing:.16em;color:var(--pdim)}
.pass-grid div b{font-family:var(--mono);font-size:15px}
.pass-grid div b.zh{font-family:var(--zh)}
.perf{position:relative;height:22px}
.perf::before{content:"";position:absolute;left:16px;right:16px;top:50%;border-top:2px dashed #cfc7b3}
.perf::after,.perf .n2{content:"";position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:var(--night)}
.perf::after{left:-11px}
.perf .n2{right:-11px}
.pass-hook{padding:6px 18px 2px;font-size:20px;line-height:1.6;font-weight:800;letter-spacing:.02em}
.pass-bc{display:flex;align-items:center;gap:12px;padding:14px 16px 16px}
.pass-bc svg{height:46px;flex:1}
.pass-bc .seq{font-family:var(--mono);font-size:11px;color:var(--pdim);text-align:right;line-height:1.5}
.stamp{position:absolute;right:14px;top:96px;z-index:4;padding:6px 14px;border:4px solid currentColor;border-radius:10px;font-weight:900;font-size:26px;letter-spacing:.12em;transform:rotate(-14deg);opacity:.86;pointer-events:none;background:rgba(244,239,227,.25)}
.stamp i{display:block;font-style:normal;font-family:var(--en);font-size:13px;letter-spacing:.3em;text-align:center}
.stamp.board{color:#0f9a4f}.stamp.delay{color:#c77c00}.stamp.cancel{color:#d62a1f}
.stamp.hit{animation:stampIn .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampIn{0%{transform:rotate(-24deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:.86}}
.ink{position:absolute;pointer-events:none;z-index:3;border-radius:50%;background:currentColor;opacity:.16}

/* 頁內段落（登機證下面的撕頁） */
.sect{margin-top:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:16px}
.sect-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sect-h .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,210,26,.12);flex:none}
.sect-h .ico svg{width:18px;height:18px;fill:var(--sign)}
.sect-h b{font-size:16px;letter-spacing:.06em}
.sect-h i{font-style:normal;font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-left:auto}
.sect p{margin:0;font-size:15px;line-height:1.75;color:#d7dce3}
.fun{list-style:none;margin:0;padding:0;counter-reset:f}
.fun li{counter-increment:f;position:relative;padding:10px 0 10px 40px;font-size:15px;line-height:1.7;color:#d7dce3;border-top:1px solid var(--line)}
.fun li:first-child{border-top:0}
.fun li::before{content:counter(f,decimal-leading-zero);position:absolute;left:0;top:11px;font-family:var(--mono);font-weight:800;font-size:13px;color:var(--ink);background:var(--lc,var(--sign));border-radius:5px;padding:2px 5px}
.turb{border-color:rgba(255,178,30,.35);background:linear-gradient(135deg,rgba(255,178,30,.08),var(--panel) 60%)}
.turb .ico{background:rgba(255,178,30,.15)}
.turb .ico svg{fill:var(--amber)}

/* 安檢 X 光 */
.xray{position:relative;border-radius:16px;padding:16px;margin-top:14px;background:#06121a;border:1px solid #13414f;overflow:hidden;color:#bfe9f5}
.xray::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(80,220,255,.05) 0 1px,transparent 1px 4px);pointer-events:none}
.xray .scan{position:absolute;left:0;right:0;height:70px;top:-80px;background:linear-gradient(180deg,transparent,rgba(64,230,255,.32),transparent);pointer-events:none}
.xray.go .scan{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{to{top:110%}}
.xray .sect-h b{color:#e7fbff}
.xray .sect-h .ico{background:rgba(64,230,255,.12)}
.xray .sect-h .ico svg{fill:#5fe3ff}
.xr-box{position:relative;border:1.5px solid #ff8a3d;border-radius:10px;padding:12px 12px 12px 14px;margin:6px 0 12px;background:rgba(255,138,61,.07)}
.xr-box::before{content:"⚠ 可疑物";position:absolute;top:-10px;left:10px;padding:0 6px;background:#06121a;font-size:11px;font-weight:800;color:#ff8a3d;letter-spacing:.1em}
.xr-box p,.xr-fix p{color:#e8f6fa}
.xr-v{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;font-weight:900;font-size:14px;letter-spacing:.08em;margin-bottom:10px}
.xr-v.clear{background:rgba(47,224,127,.14);color:var(--go)}
.xr-v.open{background:rgba(255,178,30,.15);color:var(--amber)}
.xr-v.deny{background:rgba(255,75,62,.15);color:var(--red)}
.xr-fix{border-left:3px solid #5fe3ff;padding:2px 0 2px 12px}
.xr-fix i{display:block;font-style:normal;font-size:12px;font-weight:800;color:#5fe3ff;letter-spacing:.12em;margin-bottom:4px}
.xray .reveal{opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.xray.done .reveal{opacity:1;transform:none}

/* 起飛前檢查表 */
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk .box{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:15px;border:2px solid var(--dim2);color:transparent;transition:all .3s}
.chk li.go .box.pass{background:var(--go);border-color:var(--go);color:var(--ink)}
.chk li.go .box.warn{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.chk li.go .box.fail{background:var(--red);border-color:var(--red);color:#fff}
.chk .tx b{display:block;font-size:14px}
.chk .tx span{display:block;font-size:13px;color:var(--dim);line-height:1.6;margin-top:2px}
.chk .rid{font-family:var(--mono);font-size:10px;color:var(--dim2);margin-left:6px;font-weight:500}

/* 轉機航線 */
.routes{display:flex;flex-direction:column;gap:10px}
.route{position:relative;text-align:left;width:100%;padding:14px 14px 14px 58px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line2);transition:border-color .2s,background .2s}
.route .rk{position:absolute;left:12px;top:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-weight:800;font-size:18px;border:2px solid var(--dim2);color:var(--dim)}
.route b{display:block;font-size:15px}
.route p{margin:5px 0 0;font-size:14px;line-height:1.6;color:#c9d0d9}
.route em{display:block;margin-top:6px;font-style:normal;font-size:12.5px;color:var(--amber)}
.route.on{border-color:var(--sign);background:rgba(255,210,26,.07)}
.route.on .rk{background:var(--sign);border-color:var(--sign);color:var(--ink)}
.route .arc{position:absolute;right:12px;top:12px;width:60px;height:26px}
.route .arc path{fill:none;stroke:var(--dim2);stroke-width:2;stroke-dasharray:3 4}
.route.on .arc path{stroke:var(--sign);stroke-dasharray:none}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);font-size:13px;color:#cfd6df}

/* 動作列 */
.actbar{position:fixed;z-index:45;left:0;right:0;bottom:0;padding:12px calc(14px + var(--sr)) calc(12px + var(--sb)) calc(14px + var(--sl));background:linear-gradient(180deg,rgba(6,8,11,0),rgba(6,8,11,.94) 30%);display:flex;justify-content:center}
.actbar .in{width:100%;max-width:640px;display:flex;gap:8px}
.act{flex:1;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:900;font-size:16px;letter-spacing:.1em;border:2px solid currentColor;background:rgba(10,12,16,.92);transition:transform .12s}
.act i{font-style:normal;font-family:var(--en);font-weight:800;font-size:10px;letter-spacing:.24em;opacity:.8}
.act:active{transform:scale(.96)}
.act.cancel{color:var(--red)}.act.delay{color:var(--amber)}
.act.board{color:var(--ink);background:var(--go);border-color:var(--go);flex:1.4}
.act.sel{box-shadow:0 0 0 3px rgba(255,255,255,.18) inset}
.act.cancel.sel{background:var(--red);color:#fff}.act.delay.sel{background:var(--amber);color:var(--ink)}
.undo{display:block;margin:14px auto 0;font-size:13px;color:var(--dim);text-decoration:underline}

/* ---------- 底部抽屜 ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sh{width:100%;max-width:640px;max-height:86vh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;border:1px solid var(--line2);border-bottom:0;padding:10px 16px calc(18px + var(--sb));animation:shIn .32s cubic-bezier(.2,.9,.2,1)}
@keyframes shIn{from{transform:translateY(100%)}}
.sh-grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sh h3{margin:0 0 4px;font-size:18px}
.sh .sub{margin:0 0 14px;font-size:13px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{padding:9px 13px;border-radius:99px;border:1.5px solid var(--line2);font-size:14px;color:#d3d9e1;background:var(--panel2)}
.chip.on{border-color:var(--sign);background:rgba(255,210,26,.12);color:var(--sign);font-weight:800}
.chip.red.on{border-color:var(--red);background:rgba(255,75,62,.12);color:#ff8a80}
textarea,input[type=text]{width:100%;border-radius:12px;border:1.5px solid var(--line2);background:var(--night);color:var(--text);font:inherit;font-size:16px;padding:12px;outline:none;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--sign)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-weight:900;font-size:16px;letter-spacing:.08em;background:var(--sign);color:var(--ink);margin-top:12px}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
.btn.red{background:var(--red);color:#fff}
.btn.go{background:var(--go);color:var(--ink)}
.btn:disabled{opacity:.4}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}

/* ---------- 機庫 ---------- */
.ac{position:relative;border-radius:18px;overflow:hidden;background:#0b0e12;border:1px solid var(--line2)}
.ac-img{position:relative;height:250px;background:#10151b center/cover no-repeat}
.ac-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,11,.1),rgba(6,8,11,.15) 50%,rgba(6,8,11,.92))}
.ac-img .lamp{position:absolute;top:-20%;bottom:-20%;width:38%;left:-45%;background:linear-gradient(90deg,transparent,rgba(255,236,170,.22),transparent);transform:skewX(-14deg);z-index:1;animation:lamp 5s ease-in-out infinite}
@keyframes lamp{0%{left:-45%}55%,100%{left:120%}}
.ac-img .tail{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:900;color:rgba(255,255,255,.1)}
.ac-meta{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 16px}
.plate{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:6px;background:#f4f4f0;color:#111;font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:.06em;border:2px solid #111;box-shadow:0 0 0 2px #f4f4f0}
.ac-meta h2{margin:8px 0 2px;font-size:32px;letter-spacing:.1em;line-height:1.15}
.ac-meta h2 i{font-style:normal;font-family:var(--en);font-weight:800;font-size:15px;letter-spacing:.2em;color:var(--sign);margin-left:10px}
.ac-meta .ty{font-size:13px;color:#c6cdd6}
.ac-stamp{position:absolute;right:14px;top:14px;z-index:3;padding:6px 12px;border:3px solid currentColor;border-radius:9px;font-weight:900;font-size:18px;letter-spacing:.14em;transform:rotate(8deg);background:rgba(6,8,11,.55)}
.ac-stamp i{display:block;font-style:normal;font-family:var(--en);font-size:10px;letter-spacing:.24em;text-align:center}
.v-airworthy{color:var(--go)}.v-service{color:var(--amber)}.v-overhaul{color:#ff8a3d}.v-retire{color:var(--red)}
.ac-sum{padding:14px 16px 16px;font-size:17px;line-height:1.7;font-weight:700;border-top:1px solid var(--line)}
.ac-act{display:flex;gap:8px;padding:0 16px 16px}
.ac-act .chip-btn{flex:1;justify-content:center}

.log{position:relative;margin-top:14px;border-radius:16px;background:#e9e6dc;color:#1c1e22;padding:22px 16px 16px}
.log::before{content:"";position:absolute;left:50%;top:-9px;width:90px;height:22px;margin-left:-45px;border-radius:6px;background:linear-gradient(180deg,#c9ced6,#8d949e);border:1px solid #6d737c}
.log-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1c1e22;padding-bottom:8px;margin-bottom:10px}
.log-h b{font-family:var(--en);font-weight:800;font-size:17px;letter-spacing:.16em}
.log-h span{font-family:var(--mono);font-size:12px}
.log-g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;font-size:13px}
.log-g i{display:block;font-style:normal;font-family:var(--en);font-weight:800;font-size:10px;letter-spacing:.16em;color:#6d6a62}
.log-g b{font-size:14px}
.log ol{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.7;color:#3a3d43}

.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gauge{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px;text-align:center}
.gauge svg{width:100%;max-width:120px;height:auto;display:block;margin:0 auto}
.gauge .needle{transform-origin:60px 60px;transform:rotate(-90deg);transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
.gauge b{display:block;font-size:13px;margin-top:2px}
.gauge span{display:block;font-size:12px;font-weight:800;margin-top:1px}
.gauge.v1 span,.gauge.v2 span{color:var(--red)}.gauge.v3 span{color:var(--amber)}.gauge.v4 span,.gauge.v5 span{color:var(--go)}
.gauge p{margin:6px 0 0;font-size:11.5px;line-height:1.5;color:var(--dim);text-align:left}

.tagline{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin-top:10px;font-size:14.5px;line-height:1.65}
.tagline svg{width:20px;height:20px;flex:none;margin-top:2px}
.tagline b{display:block;font-size:12px;letter-spacing:.12em;margin-bottom:2px}
.tagline.red{background:rgba(255,75,62,.09);border:1px solid rgba(255,75,62,.35)}
.tagline.red svg{fill:var(--red)}.tagline.red b{color:#ff8a80}
.tagline.amber{background:rgba(255,178,30,.08);border:1px solid rgba(255,178,30,.32)}
.tagline.amber svg{fill:var(--amber)}.tagline.amber b{color:var(--amber)}

.shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.shot{flex:none;width:132px;text-align:left}
.shot img{width:132px;height:228px;object-fit:cover;border-radius:12px;border:1px solid var(--line2);display:block;background:#10151b}
.shot span{display:block;font-size:12px;color:var(--dim);line-height:1.5;margin-top:6px}

.wo-g{margin-top:16px}
.wo-gh{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.wo-gh .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--ink)}
.wo-gh b{font-size:15px;letter-spacing:.08em}
.wo-gh i{font-style:normal;font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.k-fix{background:var(--red)}.k-polish{background:var(--blue)}.k-cut{background:#e8e3d6}.k-add{background:var(--go)}
.wo{position:relative;border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:10px;transition:border-color .25s}
.wo.approve{border-color:rgba(47,224,127,.55)}
.wo.reject{opacity:.5}
.wo-t{display:flex;gap:10px;align-items:flex-start}
.wo-t b{flex:1;font-size:15.5px;line-height:1.5}
.wo p{margin:8px 0 0;font-size:14px;line-height:1.7;color:#c9d0d9}
.wo-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wo-m span{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.wo-m span.w-high{color:var(--go);border-color:rgba(47,224,127,.35)}
.wo-m span.w-low{color:var(--dim2)}
.wo-b{display:flex;gap:8px;margin-top:12px}
.wo-b button{flex:1;height:40px;border-radius:10px;font-weight:800;font-size:14px;border:1.5px solid var(--line2);background:var(--panel2)}
.wo-b button.ap.on{background:var(--go);border-color:var(--go);color:var(--ink)}
.wo-b button.rj.on{background:var(--panel3);border-color:var(--dim2);color:var(--dim)}
.wo .ok-stamp{position:absolute;right:12px;top:10px;font-weight:900;font-size:12px;letter-spacing:.14em;color:var(--go);border:2px solid var(--go);border-radius:6px;padding:1px 6px;transform:rotate(6deg)}

.dispatch{margin-top:18px;border-radius:18px;padding:16px;background:linear-gradient(135deg,#1c1a0e,#101216 60%);border:1.5px solid rgba(255,210,26,.5)}
.dispatch h3{margin:0;font-size:18px;letter-spacing:.08em}
.dispatch h3 i{font-style:normal;font-family:var(--en);font-weight:800;font-size:12px;letter-spacing:.22em;color:var(--sign);margin-left:8px}
.dispatch p{margin:6px 0 0;font-size:13.5px;color:var(--dim);line-height:1.6}
.dispatch .cnt{display:flex;gap:16px;margin-top:12px}
.dispatch .cnt div{font-family:var(--mono);font-size:24px;font-weight:800}
.dispatch .cnt div i{display:block;font-style:normal;font-family:var(--zh);font-size:11px;color:var(--dim);font-weight:500}
.dispatch.done{border-color:var(--go)}

.pirep textarea{min-height:92px}
.pireps{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pr{padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.6}
.pr i{display:block;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:3px}

/* 機隊 */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.filters .chip{flex:none;padding:7px 12px;font-size:13px}
.fleet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fl{position:relative;text-align:left;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.fl .im{height:96px;background:#10151b center/cover no-repeat;position:relative}
.fl .im .gl{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:900;color:rgba(255,255,255,.85)}
.fl .tx{padding:7px 8px 8px}
.fl .tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .tx i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.fl .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--dim2);border:2px solid rgba(0,0,0,.5)}
.fl .dot.airworthy{background:var(--go)}.fl .dot.service{background:var(--amber)}.fl .dot.overhaul{background:#ff8a3d}.fl .dot.retire{background:var(--red)}
.fl.skip{opacity:.42}
.fl.q::after{content:"排隊";position:absolute;left:6px;top:6px;font-size:10px;font-weight:900;color:var(--ink);background:var(--sign);padding:1px 5px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--dim);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span i{width:9px;height:9px;border-radius:50%}

/* ---------- 手冊 ---------- */
.notam{position:relative;border-radius:14px;background:#f2efe6;color:#1c1e22;padding:14px 14px 12px;margin-bottom:12px;font-family:var(--mono)}
.notam::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,#d62a1f 0 18px,#f2efe6 18px 26px)}
.notam .nh{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.12em;margin-top:6px;color:#d62a1f}
.notam b{display:block;font-family:var(--zh);font-size:16px;margin:8px 0 4px}
.notam p{margin:0;font-family:var(--zh);font-size:14px;line-height:1.7;color:#33363c}
.notam .fr{font-family:var(--zh);font-size:12px;color:#6d6a62;margin-top:6px}
.notam .nb{display:flex;gap:8px;margin-top:12px}
.notam .nb button{flex:1;height:40px;border-radius:10px;font-family:var(--zh);font-weight:900;font-size:14px;border:2px solid #1c1e22}
.notam .nb .ag.on{background:#0f9a4f;border-color:#0f9a4f;color:#fff}
.notam .nb .dg.on{background:#1c1e22;color:#f2efe6}
.qrh{border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:var(--panel)}
.qrh-tabs{display:flex;overflow-x:auto;background:var(--panel2);border-bottom:1px solid var(--line2)}
.qrh-tabs button{flex:none;padding:11px 14px;font-size:14px;font-weight:700;color:var(--dim);border-bottom:3px solid transparent}
.qrh-tabs button.on{color:var(--sign);border-bottom-color:var(--sign)}
.rule{display:block;width:100%;text-align:left;padding:13px 14px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .rl{display:flex;align-items:center;gap:10px}
.rule .rl .id{font-family:var(--mono);font-size:11px;color:var(--dim2);min-width:44px}
.rule .rl b{flex:1;font-size:15px}
.rule .kd{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.06em}
.kd.law{background:rgba(255,210,26,.14);color:var(--sign)}
.kd.case{background:rgba(76,157,255,.14);color:var(--blue)}
.kd.prop{background:rgba(255,75,62,.14);color:#ff8a80}
.rule .rx{display:none;margin:10px 0 2px 54px;font-size:14px;line-height:1.75;color:#cfd6df}
.rule .rx em{display:block;font-style:normal;font-size:12.5px;color:var(--dim);margin-top:6px}
.rule.open .rx{display:block}
.mstats{display:flex;gap:8px;margin:0 0 12px}
.mstats div{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.mstats b{display:block;font-family:var(--mono);font-size:22px}
.mstats i{font-style:normal;font-size:11.5px;color:var(--dim)}

/* ---------- 機長 ---------- */
.passport{position:relative;border-radius:18px;padding:18px 16px;background:linear-gradient(140deg,#1d2b3f,#0f1622 55%,#0a0e15);border:1px solid #2a3a52;overflow:hidden}
.passport::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:24px solid rgba(255,210,26,.07)}
.passport .pp-h{font-family:var(--en);font-weight:800;font-size:12px;letter-spacing:.3em;color:var(--sign)}
.passport h2{margin:6px 0 2px;font-size:28px;letter-spacing:.12em}
.passport .pp-s{font-size:13px;color:#9fb0c6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.stats div{background:rgba(0,0,0,.25);border-radius:10px;padding:8px 4px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:20px}
.stats i{font-style:normal;font-size:11px;color:#9fb0c6}
.bars .br{display:flex;align-items:center;gap:10px;margin:8px 0}
.bars .br span{width:96px;font-size:13px;color:#cfd6df;flex:none}
.bars .br u{flex:1;height:10px;border-radius:5px;background:var(--panel3);position:relative;overflow:hidden}
.bars .br u i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:5px;transform-origin:left;transition:transform .8s}
.bars .br b{font-family:var(--mono);font-size:13px;width:24px;text-align:right}
.wallet{display:flex;flex-direction:column}
.wl{position:relative;text-align:left;width:100%;border-radius:14px;background:var(--paper);color:var(--pink);padding:12px 14px 12px 18px;margin-top:-8px;box-shadow:0 -6px 14px rgba(0,0,0,.35);border-left:8px solid var(--lc)}
.wl:first-child{margin-top:0}
.wl .wt{display:flex;align-items:center;gap:10px}
.wl .wt b{font-size:18px}
.wl .wt .cd{margin-left:auto;font-family:var(--en);font-weight:800;font-size:22px;letter-spacing:.04em}
.wl .wm{font-size:12px;color:var(--pdim);margin-top:2px}
.wl.sel{outline:3px solid var(--sign);outline-offset:2px}
.wl .ck{position:absolute;left:-4px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--sign);color:var(--ink);font-weight:900;font-size:13px;display:none;place-items:center}
.wl.sel .ck{display:grid}
.empty{padding:22px 14px;text-align:center;border-radius:14px;border:1.5px dashed var(--line2);color:var(--dim);font-size:14px;line-height:1.7}
.set{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .lb{flex:1}
.set .lb b{display:block;font-size:15px}
.set .lb i{display:block;font-style:normal;font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.tg{position:relative;width:52px;height:30px;border-radius:15px;background:var(--panel3);border:1px solid var(--line2);flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#c4cbd4;transition:transform .2s,background .2s}
.tg.on{background:var(--go)}
.tg.on::after{transform:translateX(22px);background:#fff}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line2)}
.seg button{padding:7px 12px;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--sign);color:var(--ink);font-weight:800}
.lanepick{display:flex;gap:8px;margin:4px 0 10px}
.lanepick button{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line2);font-weight:800;font-size:14px;color:var(--dim)}
.lanepick button.on{border-color:var(--lc);color:var(--lc);background:rgba(255,255,255,.04)}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.qlist div{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:10px;background:var(--panel2);font-size:13.5px;line-height:1.55}
.qlist div i{font-style:normal;flex:none;font-size:11px;font-weight:800;padding:2px 6px;border-radius:5px;color:var(--ink);background:var(--lc,var(--sign))}

/* ---------- 雜項 ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + var(--tabh) + 22px);z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:88vw;padding:12px 16px;border-radius:14px;background:#f4f4f0;color:#111;font-weight:800;font-size:14px;line-height:1.5;text-align:center;transition:all .28s cubic-bezier(.2,.9,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast a{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:99px;background:var(--ink);color:var(--sign);pointer-events:auto}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none;width:100%;height:100%}
#lightbox{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lightbox img{max-width:100%;max-height:78vh;border-radius:12px}
#lightbox p{color:#dfe5ec;font-size:14px;text-align:center;max-width:480px;line-height:1.6}

/* ---------- 開門 ---------- */
#gate{position:fixed;inset:0;z-index:100;background:#030405;display:flex;align-items:center;justify-content:center;transition:opacity .5s,transform .6s}
#gate.out{opacity:0;transform:scale(1.06);pointer-events:none}
#runway{position:absolute;inset:0;width:100%;height:100%}
.gate-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:24px;text-align:center}
.gate-sign{display:flex;align-items:center;gap:14px;background:var(--sign);color:var(--ink);padding:14px 26px 14px 18px;border-radius:12px;animation:signOn 1.2s steps(1) 1}
.gate-sign b{font-size:64px;letter-spacing:.14em;line-height:1}
.gs-ico{width:60px;height:60px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.gs-ico svg{width:40px;height:40px;fill:var(--sign)}
@keyframes signOn{0%{opacity:.1}12%{opacity:1}18%{opacity:.2}26%{opacity:1}31%{opacity:.4}38%,100%{opacity:1}}
.gate-en{margin-top:14px;font-family:var(--en);font-weight:800;font-size:26px;letter-spacing:.62em;color:#f4f1e8;padding-left:.62em}
.gate-sub{margin-top:10px;font-size:13px;letter-spacing:.2em;color:var(--dim)}
.gate-go{margin-top:44px;display:flex;align-items:center;gap:14px;padding:16px 20px 16px 24px;border-radius:14px;background:#0d0f12;border:2px solid var(--sign);color:var(--sign);text-align:left;animation:goPulse 2s ease-in-out infinite}
.gate-go span{display:block;font-size:21px;font-weight:900;letter-spacing:.14em;white-space:nowrap}
.gate-go i{display:block;font-style:normal;font-family:var(--en);font-weight:800;font-size:12px;letter-spacing:.3em;color:#f4f1e8;margin-top:2px}
.gate-go svg{width:30px;height:30px;fill:var(--sign);animation:nudge 1s ease-in-out infinite}
@keyframes goPulse{50%{box-shadow:0 0 0 8px rgba(255,210,26,.12)}}
@keyframes nudge{50%{transform:translateX(5px)}}
.gate-note{margin-top:16px;font-size:12px;color:var(--dim2);letter-spacing:.14em}

/* 開場：翻牌大字 */
#intro{position:fixed;inset:0;z-index:99;background:#050607;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s}
#intro.out{opacity:0;pointer-events:none}
#intro .ib{background:#0a0b0d;border:1px solid #1d2128;border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
#intro .flaps.big .fc{--fw:62px;--fh:80px;--fs:54px;font-family:var(--zh);font-weight:900}
#intro .flaps.mid .fc{--fw:24px;--fh:34px;--fs:22px}
#intro .il{font-family:var(--en);font-weight:800;font-size:12px;letter-spacing:.3em;color:var(--amber)}
#intro .skip{position:absolute;bottom:calc(var(--sb) + 26px);font-size:12px;color:var(--dim2);letter-spacing:.2em}

/* 塔台連線（Claude 版） */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.msg{padding:11px 13px;border-radius:14px;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.msg.me{align-self:flex-end;max-width:86%;background:var(--sign);color:var(--ink);font-weight:600}
.msg.tw{align-self:flex-start;max-width:94%;background:var(--panel2);border:1px solid var(--line2)}
.msg.tw::before{content:"塔台";display:block;font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--sign);margin-bottom:3px}
.chat-in{display:flex;gap:8px;margin-top:10px}
.chat-in textarea{min-height:48px;height:48px}
.chat-in button{flex:none;width:56px;border-radius:12px;background:var(--sign);color:var(--ink);font-weight:900}

@media (min-width:900px){
  .fleet{grid-template-columns:repeat(5,1fr)}
  .gauges{grid-template-columns:repeat(5,1fr)}
  .flaps.zh .fc{--fw:46px;--fh:56px;--fs:36px}
}
@media (max-width:360px){
  .flaps.zh .fc{--fw:34px;--fh:42px;--fs:26px}
  .gate-sign b{font-size:50px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (orientation:landscape) and (max-height:500px){
  :root{--tabh:52px}
  #tabs a i{display:none}
  .ac-img{height:180px}
}
.reduce *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){.arrow-sweep,.ac-img .lamp{display:none}}

<script>/* ---- core.js ---- */
/* 轉機 TURNAROUND — 核心：狀態、同步、聲音、震動、語音、小工具 */
const VERSION = '1.0.202611171539';
const IS_WEB = !!window.TA_WEB;
const RELAY = 'https://ntfy.sh/pz-turnaround-b53ef251972dad327450';
const KEY = 'turnaround.v1.state';
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const LANE = {
  novel: { zh: '小說', en: 'NOVEL', gate: 'N' },
  game: { zh: '遊戲', en: 'GAME', gate: 'G' },
  free: { zh: '自由', en: 'FREE', gate: 'F' },
};
const VERDICT = {
  airworthy: { zh: '適航', en: 'AIRWORTHY', st: 'done' },
  service: { zh: '需檢修', en: 'MAINTENANCE', st: 'service' },
  overhaul: { zh: '大修', en: 'OVERHAUL', st: 'cancel' },
  retire: { zh: '建議退役', en: 'RETIRE', st: 'cancel' },
};
const KIND = {
  fix: { zh: '修', name: '除錯', en: 'FIX' },
  polish: { zh: '磨', name: '打磨', en: 'POLISH' },
  cut: { zh: '減', name: '減重', en: 'CUT' },
  add: { zh: '加', name: '加裝', en: 'ADD' },
};
const WORTH = { high: '價值高', mid: '價值中', low: '價值低' };
const EFFORT = { S: '工時小', M: '工時中', L: '工時大' };
const REASONS = ['太悶', '不夠爽', '做過類似的', '不適合單人', '題材沒興趣', '太像別人的', '規模太大', '看不懂在幹嘛'];
const PIREP_CHIPS = ['手感很好', '想一直玩', '太難', '太簡單', '卡關了', '有點無聊', '畫面很讚', '操作不順', '有 Bug'];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const now = () => new Date().toISOString();
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(s) { const d = new Date(s + 'T00:00:00'); return String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); }
const WK = ['日', '一', '二', '三', '四', '五', '六'];
const WKE = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
function dayLabel(s) { const d = new Date(s + 'T00:00:00'); return fmtDate(s) + '（' + WK[d.getDay()] + '）'; }
function reduced() { return S.settings.fx === 'calm' || matchMedia('(prefers-reduced-motion: reduce)').matches; }

/* ---------- 狀態 ---------- */
const DEF = () => ({
  dev: 'd' + Math.random().toString(36).slice(2, 8),
  seq: 0,
  votes: {}, // flightId -> {v, reasons, note, t}
  routes: {}, // flightId -> routeId
  flights: {}, // flightId -> 航班快照（給登機證夾用）
  items: {}, // inspId -> {itemId: approve|reject}
  dispatched: {}, // inspId -> t
  pireps: [], // {id, work, text, chips, t}
  notams: {}, // ruleId -> agree|disagree
  queue: [], // {work, t}
  ideas: [], // {id, lane, text, t}
  merges: [], // {id, a, b, t}
  out: [], // 還沒確認送達的事件
  sent: {}, // eventId -> 送出時間
  delivered: 0,
  introDay: '',
  seenDay: '',
  settings: { sfx: true, music: true, announce: true, fx: 'full' },
  at: '',
});
let S = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(DEF(), JSON.parse(raw)); S.settings = Object.assign(DEF().settings, S.settings || {}); } catch (e) { /* 沒有儲存空間 */ }
let saveT = 0;
function save() {
  S.at = now();
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 存不了就算了 */ }
    Cloud.push();
  }, 250);
}

/* 每一個動作都是一筆事件：本機記一份，再送去塔台（每天的排程讀它） */
function emit(type, data) {
  S.seq += 1;
  const ev = Object.assign({ id: S.dev + '-' + S.seq, t: now(), type }, data);
  S.out.push(ev);
  if (S.out.length > 400) S.out = S.out.slice(-400);
  save();
  Sync.soon();
  return ev;
}

/* ---------- 塔台同步（網頁版：經由轉發站，GitHub 每小時收進 data/inbox.json） ---------- */
const Sync = {
  t: 0, state: 'ok', lastErr: 0,
  soon() { clearTimeout(this.t); this.t = setTimeout(() => this.flush(), 2500); },
  pending() { return S.out.length; },
  async flush(force) {
    if (!IS_WEB) { Cloud.push(); this.mark(); return; }
    if (!navigator.onLine) { this.mark(); return; }
    const ttl = 3 * 3600e3, nowMs = Date.now();
    const todo = S.out.filter((e) => force || !S.sent[e.id] || nowMs - Date.parse(S.sent[e.id]) > ttl);
    if (!todo.length) { this.mark(); return; }
    const chunks = []; let cur = [];
    for (const e of todo) {
      cur.push(e);
      if (JSON.stringify({ v: 1, dev: S.dev, ev: cur }).length > 3000) { cur.pop(); if (cur.length) chunks.push(cur); cur = [e]; }
    }
    if (cur.length) chunks.push(cur);
    try {
      for (const c of chunks) {
        await fetch(RELAY, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ v: 1, dev: S.dev, ev: c }) });
        const t = now(); c.forEach((e) => { S.sent[e.id] = t; });
      }
      this.lastErr = 0;
    } catch (e) { this.lastErr = Date.now(); }
    save(); this.mark();
  },
  ack(ids) {
    if (!ids || !ids.size) return;
    const before = S.out.length;
    S.out = S.out.filter((e) => !ids.has(e.id));
    const n = before - S.out.length;
    if (n) { S.delivered += n; Object.keys(S.sent).forEach((k) => { if (ids.has(k)) delete S.sent[k]; }); save(); }
    this.mark();
  },
  mark() {
    const el = $('#tower-dot'); if (!el) return;
    const p = S.out.length;
    this.state = this.lastErr && p ? 'off' : p ? 'wait' : 'ok';
    el.className = 'tower-dot ' + this.state;
    el.querySelector('span').textContent = p ? '待送 ' + p : '塔台';
  },
};

/* ---------- Claude 版：雲端存檔（db），排程也讀得到 ---------- */
const Cloud = {
  db: null, ready: false, t: 0, busy: false,
  async init() {
    if (IS_WEB || !window.claude || typeof window.claude.use !== 'function') return;
    try { this.db = await window.claude.use('db'); } catch (e) { this.db = null; }
    if (!this.db) return;
    try {
      this.ref = this.db.doc('state/main');
      const snap = await Promise.race([this.ref.get(), sleep(10000).then(() => null)]);
      if (!snap) { this.db = null; return; }
      const d = snap.exists ? snap.data() : null;
      if (d && d.state) {
        const remote = JSON.parse(d.state);
        if (!S.at || (remote.at && remote.at > S.at)) { S = Object.assign(DEF(), remote); S.settings = Object.assign(DEF().settings, remote.settings || {}); }
      }
      this.ready = true;
      if (window.App && App.refresh) App.refresh();
    } catch (e) { this.ready = true; }
  },
  push() {
    if (!this.db || !this.ready) return;
    clearTimeout(this.t);
    this.t = setTimeout(async () => {
      if (this.busy) { this.push(); return; }
      this.busy = true;
      try {
        const keep = Object.assign({}, S, { sent: {} });
        await this.ref.set({ state: JSON.stringify(keep), at: S.at, out: S.out.slice(-300) });
      } catch (e) { /* 下次再存 */ }
      this.busy = false;
    }, 1500);
  },
};

/* ---------- 聲音（全部即時合成） ---------- */
const Snd = {
  ctx: null, master: null, sfx: null, mus: null, noise: null, lastClack: 0, musT: 0, musOn: false, chordAt: 0, ci: 0, duckN: 0,
  init() {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 舊瀏覽器 */ }
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.gain.value = 0; this.mus.connect(this.master);
    const len = c.sampleRate; const b = c.createBuffer(1, len, c.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    document.addEventListener('visibilitychange', () => { if (!this.ctx) return; if (document.hidden) this.ctx.suspend(); else this.resume(); });
  },
  resume() { try { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); } catch (e) { /* 忽略 */ } },
  ok() { return this.ctx && S.settings.sfx; },
  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  nz(t, dur, type, f, q, peak, out) {
    const c = this.ctx; const s = c.createBufferSource(); s.buffer = this.noise;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q || 1;
    const g = c.createGain(); this.env(g, t, 0.002, peak, dur);
    s.connect(fl); fl.connect(g); g.connect(out || this.sfx);
    s.start(t, Math.random() * 0.5, dur + 0.05);
    return { s, fl, g };
  },
  tone(t, f, dur, type, peak, out, slideTo) {
    const c = this.ctx; const o = c.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);

/* 翻牌字格（Solari 機場看板）：每一格上下兩半，翻過去時先翻上半、再落下半 */
const Flap = {
  ZH: '轉機航班登機出發延誤檢修簽派塔台點子遊戲小說自由天光雲海星辰風雨沙城夜潮界層組',
  EN: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
  NUM: '0123456789',
  cell(c) {
    const b = '<b>' + esc(c) + '</b>';
    return '<span class="fc"><span class="fu">' + b + '</span><span class="fl">' + b + '</span><span class="ft">' + b + '</span><span class="fb">' + b + '</span></span>';
  },
  html(text, cls, blank) {
    const cs = Array.from(String(text));
    return '<span class="flaps ' + (cls || '') + '" data-t="' + esc(text) + '" aria-label="' + esc(text) + '">' + cs.map((c) => this.cell(blank === false ? c : ' ')).join('') + '</span>';
  },
  pool(c) {
    if (/[0-9]/.test(c)) return this.NUM;
    if (/[A-Za-z]/.test(c)) return this.EN;
    if (c === ' ' || /[^㐀-鿿]/.test(c)) return this.EN;
    return this.ZH;
  },
  setFace(cell, part, c) { const b = cell.querySelector('.' + part + ' b'); if (b) b.textContent = c; },
  flip(cell, from, to, dur) {
    return new Promise((res) => {
      const ft = cell.querySelector('.ft'), fb = cell.querySelector('.fb');
      this.setFace(cell, 'fu', to); this.setFace(cell, 'fl', from); this.setFace(cell, 'ft', from); this.setFace(cell, 'fb', to);
      const h = dur / 2;
      const a1 = ft.animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(-90deg)' }], { duration: h, easing: 'ease-in', fill: 'forwards' });
      Snd.clack();
      a1.onfinish = () => {
        const a2 = fb.animate([{ transform: 'rotateX(90deg)' }, { transform: 'rotateX(0deg)' }], { duration: h, easing: 'ease-out', fill: 'forwards' });
        a2.onfinish = () => {
          this.setFace(cell, 'fl', to); this.setFace(cell, 'ft', to);
          a1.cancel(); a2.cancel();
          res();
        };
      };
    });
  },
  async spinCell(cell, target, steps, delay, dur) {
    if (delay) await sleep(delay);
    let cur = cell.querySelector('.fl b').textContent;
    const pool = this.pool(target);
    for (let i = 0; i < steps; i++) {
      const nx = pool[Math.floor(Math.random() * pool.length)];
      await this.flip(cell, cur, nx, dur); cur = nx;
    }
    if (cur !== target) await this.flip(cell, cur, target, dur + 30);
  },
  // 把 root 裡所有還沒翻過的看板翻上去
  run(root, opts) {
    const o = Object.assign({ base: 0, step: 38, dur: 74, min: 2, max: 6 }, opts || {});
    const sets = $$('.flaps[data-t]:not(.ran)', root);
    const jobs = [];
    sets.forEach((el, si) => {
      el.classList.add('ran');
      const target = Array.from(el.getAttribute('data-t'));
      const cells = $$('.fc', el);
      if (reduced() || !Snd.ctx && o.quiet) { cells.forEach((c, i) => this.paint(c, target[i] || ' ')); return; }
      cells.forEach((c, i) => {
        const steps = o.min + Math.floor(Math.random() * (o.max - o.min + 1));
        jobs.push(this.spinCell(c, target[i] || ' ', steps, o.base + si * 90 + i * o.step, o.dur));
      });
    });
    return Promise.all(jobs);
  },
  paint(cell, c) { ['fu', 'fl', 'ft', 'fb'].forEach((p) => this.setFace(cell, p, c)); },
  // 換字（例如狀態變了）：長度一樣就直接翻，不一樣就重畫
  async set(el, text, cls) {
    if (!el) return;
    const cs = Array.from(text), cells = $$('.fc', el);
    if (cells.length !== cs.length) {
      const tmp = document.createElement('span'); tmp.innerHTML = this.html(text, cls || el.className.replace(/\bflaps\b|\bran\b/g, '').trim());
      const n = tmp.firstChild; el.replaceWith(n); return this.run(n.parentNode, { min: 1, max: 3 });
    }
    el.setAttribute('data-t', text);
    return Promise.all(cells.map((c, i) => this.spinCell(c, cs[i], reduced() ? 0 : 1 + Math.floor(Math.random() * 2), i * 40, 70)));
  },
};

function snapFlight(f, date) { const c = Object.assign({}, f); c._date = date; S.flights[f.id] = c; }
function vote(f, date, v, pg) {
  Snd.init();
  if (v === 'cancel') { reasonSheet(f, date, pg); return; }
  applyVote(f, date, { v, t: now() }, pg);
}
function applyVote(f, date, rec, pg) {
  const prev = S.votes[f.id];
  S.votes[f.id] = rec; snapFlight(f, date);
  emit('vote', { card: f.id, v: rec.v, reasons: rec.reasons || [], note: rec.note || '', lane: f.lane, zh: f.zh, prev: prev ? prev.v : null });
  // 蓋章
  const pass = $('#pass', pg); const old = $('.stamp', pass); if (old) old.remove();
  pass.insertAdjacentHTML('beforeend', stampHtml(rec.v, true));
  Snd.stamp(); haptic(rec.v === 'board' ? 30 : 18);
  $$('.act', pg).forEach((b) => b.classList.toggle('sel', b.dataset.vote === rec.v));
  if (rec.v === 'board') { setTimeout(() => { Snd.whoosh(); FX.takeoff($('.act.board', pg)); }, 260); toast('已登機！收進「機長」的登機證夾'); }
  else if (rec.v === 'delay') toast('延誤：先放著，想好再回來');
  else toast('已取消。塔台記下原因了，明天的航班會避開');
  if (!$('[data-undo]', pg)) $('.pg-body', pg).insertAdjacentHTML('beforeend', '<button class="undo" data-undo>改變主意：撤回表態</button>');
  App.refresh(true);
}
function undoVote(f, pg) {
  delete S.votes[f.id];
  emit('vote', { card: f.id, v: 'none', lane: f.lane, zh: f.zh });
  const st = $('.stamp', pg); if (st) st.remove();
  $$('.act', pg).forEach((b) => b.classList.remove('sel'));
  const u = $('[data-undo]', pg); if (u) u.remove();
  Snd.tear(); toast('已撤回，重新選一次'); App.refresh(true);
}
function reasonSheet(f, date, pg) {
  const pick = new Set((S.votes[f.id] && S.votes[f.id].reasons) || []);
  const sh = openSheet('<h3>為什麼取消這班？</h3><p class="sub">點一個或幾個原因。塔台會照你的原因調整明天出的題。</p>' +
    '<div class="chips">' + REASONS.map((r) => '<button class="chip red' + (pick.has(r) ? ' on' : '') + '" data-r="' + r + '">' + r + '</button>').join('') + '</div>' +
    '<textarea id="rs-note" rows="2" placeholder="想多說一句也可以（選填）"></textarea>' +
    '<div class="row2"><button class="btn ghost" data-close>先不要</button><button class="btn red" id="rs-ok">確認取消</button></div>');
  sh.addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (c) { c.classList.toggle('on'); c.classList.contains('on') ? pick.add(c.dataset.r) : pick.delete(c.dataset.r); Snd.tick(); haptic(8); }
  });
  $('#rs-ok', sh).onclick = () => {
    closeSheet();
    applyVote(f, date, { v: 'cancel', reasons: Array.from(pick), note: ($('#rs-note', sh).value || '').trim().slice(0, 300), t: now() }, pg);
  };
}
function pickRoute(f, rid, pg) {
  Snd.init(); const same = S.routes[f.id] === rid;
  if (same) delete S.routes[f.id]; else S.routes[f.id] = rid;
  snapFlight(f, f._date || f.id.slice(0, 10));
  $$('.route', pg).forEach((b) => b.classList.toggle('on', !same && b.dataset.route === rid));
  emit('route', { card: f.id, route: same ? null : rid, zh: f.zh });
  Snd.beep(true); haptic(10);
  if (!same) { const r = f.routes.find((x) => x.id === rid); toast('航線記下了：' + esc(r.name)); }
}
function flightContext(f, date) {
  const v = S.votes[f.id]; const r = S.routes[f.id] ? f.routes.find((x) => x.id === S.routes[f.id]) : null;
  const vs = v ? STATUS[v.v][0] + (v.reasons && v.reasons.length ? '（原因：' + v.reasons.join('、') + (v.note ? '；' + v.note : '') + '）' : '') : '還沒決定';
  return '我在《轉機》看到 ' + fmtDate(date) + ' 的' + LANE[f.lane].zh + '航班《' + f.zh + '》（' + f.en + '），想跟你聊聊。\n' +
    '我的表態：' + vs + '；想走的航線：' + (r ? r.name : '還沒選') + '。\n\n' +
    '【鉤子】' + f.hook + '\n【航程】' + f.pitch + '\n【亮點】\n' + (f.fun || []).map((x) => '・' + x).join('\n') +
    '\n【亂流】' + f.fail + '\n【安檢】' + (f.xray ? f.xray.threat + ' → 處置：' + f.xray.fix : '') +
    '\n【航線】\n' + (f.routes || []).map((x, i) => String.fromCharCode(65 + i) + '「' + x.name + '」' + x.line + '（取捨：' + x.trade + '）').join('\n') +
    '\n【同航線】' + (f.like || []).join('、') + '\n【規模】' + f.scope + (f.seed ? '\n【補充】' + f.seed : '');

function talkFlight(f, date, pg) {

function lastVerdict(w) { const a = w.inspections || []; return a.length ? a[a.length - 1].verdict : ''; }

    : '<div class="empty" style="grid-column:1/-1">這裡還沒有作品。</div>';

function coverUrl(w) { if (!IS_WEB) return (window.TA_DATA && TA_DATA.covers && TA_DATA.covers[w.id]) || null; return w.cover || null; }
function workUrl(w) {

/* ---------- 特效：起飛（畫在一張全螢幕畫布上，飛完就停） ---------- */
const FX = {
  takeoff(fromEl) {
    if (reduced()) return;
    const cv = $('#fx'); const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = fromEl ? fromEl.getBoundingClientRect() : { left: W / 2, top: H - 100, width: 0, height: 0 };
    const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2, x1 = W + 60, y1 = -60, cx = x0 + (x1 - x0) * 0.15, cy = y0 - 40;
    const trail = []; const t0 = performance.now(); const dur = 1100;
    const plane = new Path2D('M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z');
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur); const e = k * k * (3 - 2 * k) * 0.6 + k * k * 0.4;
      const x = (1 - e) * (1 - e) * x0 + 2 * (1 - e) * e * cx + e * e * x1;
      const y = (1 - e) * (1 - e) * y0 + 2 * (1 - e) * e * cy + e * e * y1;
      trail.push({ x, y, a: 1 });
      g.clearRect(0, 0, W, H);
      trail.forEach((p) => { p.a -= 0.028; if (p.a > 0) { g.globalAlpha = p.a * 0.5; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(p.x, p.y, 2.2, 0, 7); g.fill(); } });
      const nx = trail.length > 1 ? trail[trail.length - 2] : { x: x0, y: y0 };
      const ang = Math.atan2(y - nx.y, x - nx.x) + Math.PI / 2;
      g.globalAlpha = 1; g.save(); g.translate(x, y); g.rotate(ang); g.scale(1.6 + e, 1.6 + e); g.translate(-12, -12); g.fillStyle = '#ffd21a'; g.fill(plane); g.restore();
      if (k < 1 || trail.some((p) => p.a > 0)) requestAnimationFrame(step); else g.clearRect(0, 0, W, H);
    };
    requestAnimationFrame(step);
  },
};

/* ---------- 塔台連線（只有 Claude 版：直接問 Claude） ---------- */
const Tower = {
  sample: null, threads: {},
  ok() { return !!this.sample; },
  async init() {
    if (IS_WEB || !window.claude || typeof window.claude.use !== 'function') return;
    try { this.sample = await window.claude.use('sample'); } catch (e) { this.sample = null; }
    if (this.sample && App.ready) App.refresh(true);
  },
  sys() {
    const law = D.manual.rules.filter((r) => r.status === 'official').map((r) => '・' + r.title + '：' + r.rule).join('\n');
    return '你是《轉機》航廈的塔台，也是痞子葳的創作夥伴。一律用繁體中文、稱呼他「痞子葳」，口吻像可靠的塔台：簡潔、直接、有判斷；該唱反調就唱反調，不拍馬屁。只討論、不開工（他說「開工」才動手）。回答控制在 250 字內，必要時用條列。\n\n飛行手冊（他定下的創作守則）：\n' + law;
  },
  bind(box, key, ctxFn) {
    if (!box) return;
    const th = this.threads[key] || (this.threads[key] = []);
    const list = $('.chat', box), ta = $('textarea', box), btn = $('.chat-in button', box);
    const paint = () => { list.innerHTML = th.map((m) => '<div class="msg ' + (m.role === 'user' ? 'me' : 'tw') + '">' + esc(m.content) + '</div>').join('') || '<p class="muted" style="margin:0;font-size:13.5px">直接問塔台。例如：「這個點子最弱的地方怎麼補？」「三條航線你會選哪條？」</p>'; };
    paint();
    btn.onclick = async () => {
      const q = (ta.value || '').trim(); if (!q || this.busy) return;
      Snd.init(); this.busy = true; ta.value = '';
      th.push({ role: 'user', content: q }); paint();
      const live = document.createElement('div'); live.className = 'msg tw'; live.textContent = '…'; list.appendChild(live);
      const msgs = [{ role: 'user', content: this.sys() + '\n\n【這次要聊的】\n' + ctxFn() + '\n\n痞子葳問：' + th[0].content }];
      th.slice(1).forEach((m) => msgs.push({ role: m.role, content: m.content }));
      try {
        const r = await this.sample(msgs, { cache: false, onText: ({ text }) => { live.textContent = text; } });
        th.push({ role: 'assistant', content: r.text || live.textContent }); Snd.beep(true);
      } catch (e) {
        th.pop(); ta.value = q;
        live.textContent = e && e.code === 'rate_limited' ? '塔台忙線中，等一下再問。' : e && e.code === 'not_granted' ? '塔台連線沒有開放。' : '塔台沒有回應，再試一次。';
      }
      this.busy = false; paint();
    };
  },
};

  },
  async load() {
    const [index, fleet, manual] = await Promise.all([this.getJSON('data/index.json'), this.getJSON('data/fleet.json'), this.getJSON('data/manual.json')]);
    D.index = index; D.fleet = fleet; D.manual = manual;
    D.fleetBy = {}; fleet.works.forEach((w) => { D.fleetBy[w.id] = w; });
    D.ruleBy = {}; manual.rules.forEach((r) => { D.ruleBy[r.id] = r; });
    if (index.latest) await this.loadDay(index.latest);
    const li = latestInspection(); if (li && li.date !== index.latest) await this.loadDay(li.date);
    this.ready = true;
  },
  async checkInbox(force) {
    if (!IS_WEB || !navigator.onLine) return;
    try {
      const r = await fetch('data/inbox.json', { cache: 'no-cache' }); if (!r.ok) return;
      const j = await r.json(); D.inboxAt = j.at || '';
      Sync.ack(new Set((j.events || []).map((e) => e.id)));
      if (force) App.refresh(true);
    } catch (e) { /* 收不到就下次 */ }
  },
  async freshen() {
    if (!IS_WEB) return;
    try {
      const idx = await this.getJSON('data/index.json');
      if (idx && idx.latest && D.index && idx.latest !== D.index.latest) {
        D.index = idx; await this.loadDay(idx.latest);
        const [fleet, manual] = await Promise.all([this.getJSON('data/fleet.json'), this.getJSON('data/manual.json')]);
        D.fleet = fleet; D.manual = manual; D.fleetBy = {}; fleet.works.forEach((w) => { D.fleetBy[w.id] = w; }); D.ruleBy = {}; manual.rules.forEach((r) => { D.ruleBy[r.id] = r; });
        Snd.chime(); toast('新航班到站了！');
        this.dirty = { dep: 1, hangar: 1, manual: 1, me: 1 }; this.show(this.tab, true);
      }
    } catch (e) { /* 下次再看 */ }
  },
  refresh(soft) {
    if (!this.ready) return;
    this.badges(); Sync.mark();
    this.dirty = { dep: 1, hangar: 1, manual: 1, me: 1 };
    if (!soft || !$('#pages .page')) this.show(this.tab, true);
  },
  badges() {
    const latest = D.days[D.index.latest];
    const set = (id, n) => { const b = $(id); if (!b) return; b.textContent = n || ''; b.classList.toggle('on', n > 0); };
    set('#tb-dep', latest ? latest.flights.filter((f) => !S.votes[f.id]).length : 0);
    const li = latestInspection(); const ins = li && D.days[li.date] ? D.days[li.date].inspection : null;
    set('#tb-hangar', ins && !S.dispatched[ins.id] && (ins.items || []).length ? 1 : 0);
    set('#tb-manual', D.manual.rules.filter((r) => r.status === 'proposed' && !S.notams[r.id]).length);
  },
  show(tab, keepScroll) {
    const changed = tab !== this.tab;
    this.tab = tab;
    $$('#tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab));
    $$('.view').forEach((v) => v.classList.toggle('on', v.dataset.tab === tab));
    if (changed || this.dirty[tab] || !$('#v-' + tab).innerHTML) {
      this.dirty[tab] = 0;
      if (tab === 'dep') renderDep(D.view && D.view !== D.index.latest && !changed ? D.view : null);
      if (tab === 'hangar') renderHangar();
      if (tab === 'manual') renderManual();
      if (tab === 'me') renderMe();
    }
    if (changed && !keepScroll) window.scrollTo(0, 0);
    this.badges();
  },
};

function go(h) { if (location.hash === h) route(); else { App.pushed = true; location.hash = h; } }
function back() {
  if (App.pushed && history.length > 1) { App.pushed = false; history.back(); }
  else { location.hash = '#' + App.tab; }
}
function route() {
  if (!App.ready) return;
  const h = decodeURIComponent(location.hash || '#dep');
  let m;
  if ((m = h.match(/^#f\/(.+)$/))) { if (!$('#v-' + App.tab).innerHTML) App.show(App.tab); flightPage(m[1]); return; }
  if ((m = h.match(/^#i\/(\d{4}-\d{2}-\d{2})\/(.+)$/))) { if (!$('#v-' + App.tab).innerHTML) App.show(App.tab); inspPage(m[2], m[1]); return; }
  closePages(false);
  if ((m = h.match(/^#d\/(\d{4}-\d{2}-\d{2})$/))) { App.tab = 'dep'; $$('#tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === 'dep')); $$('.view').forEach((v) => v.classList.toggle('on', v.dataset.tab === 'dep')); renderDep(m[1]); window.scrollTo(0, 0); return; }
  const tab = h.replace('#', '');
  App.show(['dep', 'hangar', 'manual', 'me'].includes(tab) ? tab : 'dep');
}
window.addEventListener('hashchange', route);

/* 點擊：看板列、到站紀錄、分頁 */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-f],[data-i],[data-day],[data-go],[data-insp],[data-w],#tabs a,#tower-dot');
  if (!t) return;
  Snd.init();
  if (t.closest('#tabs')) { Snd.tick(); haptic(8); if (location.hash === t.getAttribute('href')) { window.scrollTo({ top: 0, behavior: 'smooth' }); } return; }
  if (t.id === 'tower-dot') { go('#me'); setTimeout(() => { const n = $('#sync-now'); if (n) n.scrollIntoView({ block: 'center' }); }, 300); return; }
  if (t.dataset.f) { e.preventDefault(); haptic(10); go('#f/' + t.dataset.f); return; }
  if (t.dataset.i) { e.preventDefault(); haptic(10); go('#hangar'); return; }
  if (t.dataset.day) { e.preventDefault(); Snd.tick(); go('#d/' + t.dataset.day); return; }
  if (t.dataset.go) { e.preventDefault(); Snd.tick(); go(t.dataset.go); return; }
  if (t.dataset.insp && !t.closest('#sheet')) { e.preventDefault(); Snd.tick(); go('#i/' + t.dataset.date + '/' + t.dataset.insp); return; }
  if (t.dataset.w) { e.preventDefault(); workSheet(t.dataset.w); }
});

/* ---------- 時鐘 ---------- */
function tickClock() {
  const d = new Date();
  const c = $('#clk'); if (c) c.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const cd = $('#clk-d'); if (cd) cd.textContent = String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') + ' ' + WKE[d.getDay()];
}

/* ---------- 開門：跑道進場燈 ---------- */
const Runway = {
  on: false, raf: 0,
  start() {
    const cv = $('#runway'); if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const fit = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
    fit(); addEventListener('resize', fit);
    const g = cv.getContext('2d'); this.on = true; const t0 = performance.now(); let last = 0;
    const draw = (now) => {
      if (!this.on) return;
      this.raf = requestAnimationFrame(draw);
      if (now - last < 33) return; last = now;
      const W = cv.width, H = cv.height, vx = W / 2, vy = H * 0.34, t = (now - t0) / 1000;
      g.fillStyle = '#030405'; g.fillRect(0, 0, W, H);
      const sky = g.createLinearGradient(0, 0, 0, vy); sky.addColorStop(0, '#05070b'); sky.addColorStop(1, '#0d1420'); g.fillStyle = sky; g.fillRect(0, 0, W, vy);
      g.fillStyle = 'rgba(255,190,90,.06)'; g.fillRect(0, vy - 2 * dpr, W, 3 * dpr);
      for (let i = 0; i < 26; i++) {
        const z = ((i / 26) + (t * 0.18) % (1 / 26)) % 1; const p = z * z; const y = vy + (H - vy) * p; const spread = (W * 0.08) + (W * 0.9) * p; const r = (0.6 + 3.2 * p) * dpr;
        g.globalAlpha = 0.25 + 0.75 * p;
        g.fillStyle = '#ffd56a'; g.beginPath(); g.arc(vx - spread / 2, y, r, 0, 7); g.arc(vx + spread / 2, y, r, 0, 7); g.fill();
        if (i % 2 === 0) { g.fillStyle = '#eaf2ff'; g.fillRect(vx - r * 0.6, y - r * 2.4, r * 1.2, r * 4.8); }
      }
      const rp = (t * 1.25) % 1; const rz = rp * rp; const ry = vy + (H - vy) * rz; const rr = (2 + 9 * rz) * dpr;
      g.globalAlpha = 1 - rp * 0.6; const gr = g.createRadialGradient(vx, ry, 0, vx, ry, rr * 4); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(vx, ry, rr * 4, 0, 7); g.fill();
      g.globalAlpha = 1;
    };
    this.raf = requestAnimationFrame(draw);
  },
  stop() { this.on = false; cancelAnimationFrame(this.raf); },
};

/* ---------- 開場：翻牌大字＋鈴聲＋廣播 ---------- */
App.intro = async function (day, replay) {
  const el = $('#intro');
  const d = new Date(day.date + 'T00:00:00');
  const no = D.index.days.find((x) => x.date === day.date);
  el.innerHTML = '<div class="il">PZ TERMINAL · DAY ' + String(no ? no.no : 1).padStart(3, '0') + '</div><div class="ib">' + Flap.html('轉機', 'big') + Flap.html('TURNAROUND', 'mid amber') + Flap.html(fmtDate(day.date) + ' ' + WKE[d.getDay()], 'mid') + '</div>' +
    '<div class="il" style="color:#c8d0da">今日 ' + day.flights.length + ' 班航班' + (day.inspection ? '・1 架進廠檢修' : '') + '</div><button class="skip">點一下跳過</button>';
  el.hidden = false; el.classList.remove('out');
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    el.classList.add('out'); setTimeout(() => { el.hidden = true; el.innerHTML = ''; }, 460);
    Snd.music(true);
    if (S.settings.announce) setTimeout(() => announce(day), 500);
  };
  el.onclick = finish;
  Snd.chime();
  Flap.run(el, { min: 3, max: 7, step: 55, dur: 80 });
  setTimeout(finish, reduced() ? 600 : 3300);
};

/* ---------- 開機 ---------- */
async function boot() {
  document.documentElement.classList.toggle('reduce', reduced());
  tickClock(); setInterval(tickClock, 10000);
  Sync.mark();
  const skipGate = /[?&]enter=1/.test(location.search);
  if (!skipGate) Runway.start();
  let loadErr = null;
  const loading = App.load().catch((e) => { loadErr = e; });
  Cloud.init(); Voice.init(); Tower.init();
  const enter = async (gesture) => {
    if (App.entered) return; App.entered = true;
    if (gesture) {
      Snd.init();
      try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) { /* 解鎖語音 */ }
      haptic(20);
    }
    await loading;
    if (loadErr || !D.index) { $('#gate-note').textContent = '航班資料讀不到，請確認網路後重新打開'; App.entered = false; Snd.beep(false); return; }
    $('#app').removeAttribute('aria-hidden');
    route();
    const g = $('#gate'); g.classList.add('out'); setTimeout(() => { g.remove(); Runway.stop(); }, 650);
    const today = D.days[D.index.latest];
    if (today && S.introDay !== D.index.latest && !skipGate) { S.introDay = D.index.latest; save(); App.intro(today); }
    else { Snd.music(true); }
    App.badges();
  };
  $('#gate-go').addEventListener('click', () => enter(true));
  $('#gate').addEventListener('click', (e) => { if (!e.target.closest('#gate-go')) enter(true); });
  if (skipGate) enter(false);
  App.checkInbox(); Sync.flush();
  setInterval(() => { if (!document.hidden) { Sync.flush(); App.checkInbox(); } }, 5 * 60e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickClock(); Sync.flush(); App.checkInbox(); App.freshen(); } });
  addEventListener('online', () => { Sync.flush(); Sync.mark(); });
  if (IS_WEB && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { /* 沒有離線 */ } }
}
window.App = App;
boot();
