if (HAS_DOM) {

/* ---- 05_screen.js ---- */
/* ==========================================================================
   05 螢幕
   建立 #pz-root（整個遊戲）、#pz-canvas（畫布）、#pz-ui（介面層，放 DOM 介面），
   處理大小、裝置像素比（DPR）、iPhone 瀏海安全區、直橫、全螢幕、螢幕常亮。
   畫布解析度 = min(DPR, 2) × 畫質倍率，並限制總像素（手機 320 萬、電腦 840 萬），
   避免 iPhone 的畫布記憶體上限與發燙。
   ========================================================================== */
const Screen = PZ.screen = {
  w: 0, h: 0, dpr: 1, res: 1, pw: 0, ph: 0,
  portrait: true, landscape: false, short: 0, long: 0,
  safe: { t: 0, r: 0, b: 0, l: 0 },
  root: null, canvas: null, ui: null, touch: null,
  resCap: 2, pixelCap: Env.mobile ? 3.2e6 : 8.4e6, resScale: 1,
  orientation: 'any', bg: '#000',
  _probe: null, _dirty: true, _rotating: false,

/** 取得或建立 DOM 結構 */
Screen.init = (cfg = {}) => {
  if (!HAS_DOM) return;
  Screen.orientation = cfg.orientation || 'any';
  if (cfg.background) Screen.bg = cfg.background;
  let root = document.getElementById('pz-root');
  if (!root) { root = el('div'); root.id = 'pz-root'; document.body.appendChild(root); }
  Screen.root = root;
  let cv = document.getElementById('pz-canvas');
  if (!cv) { cv = document.createElement('canvas'); cv.id = 'pz-canvas'; root.insertBefore(cv, root.firstChild); }
  Screen.canvas = cv;
  let touch = document.getElementById('pz-touch');
  if (!touch) { touch = el('div'); touch.id = 'pz-touch'; root.appendChild(touch); }
  Screen.touch = touch;
  let ui = document.getElementById('pz-ui');
  if (!ui) { ui = el('div'); ui.id = 'pz-ui'; root.appendChild(ui); }
  else root.appendChild(ui); // 確保介面層在觸控層上面
  Screen.ui = ui;
  root.style.background = Screen.bg;
  document.documentElement.style.background = Screen.bg;
  // 安全區探針
  const p = el('div'); p.id = 'pz-safe-probe';
  p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';

  const watchDpr = () => {
    if (!window.matchMedia) return;

  Screen._dirty = false;
  const r = Screen.root.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));

  Screen.root.classList.toggle('pz-landscape', Screen.landscape);
  Screen.root.classList.toggle('pz-mobile', Env.mobile);
  Screen.checkRotate();

/* 收藏庫的 PZ 圓鈕選單打開時：引擎暫停（原因 'hub'）、放開所有輸入，並發出 PZ.on('hub', open)。
   遊戲想在這時候叫出自己的暫停選單，就聽 'hub'。 */
if (HAS_DOM) window.addEventListener('pzhub', (e) => {
  const open = !!(e && e.detail && e.detail.open);
  if (open) { PZ.pause('hub'); if (PZ.input && PZ.input.releaseAll) PZ.input.releaseAll(); } else PZ.resume('hub');
  PZ.emit('hub', open);

/** 收藏庫的 PZ 圓鈕位置（遊戲在 PZ 遊戲收藏裡開時才有）；HUD 不要放在這裡 */
Screen.hub = () => {
  if (!HAS_DOM || !document.querySelector('script[data-game][src*="hub.js"]') || Env.inFrame) return null;
  const p = Store.getJSON('pzgc.v1.handle', null), W = Screen.w, H = Screen.h;
  let x = p ? clamp(p.x * W, 6, W - 50) : W - 52;
  const y = p ? clamp(p.y * H, 50, H - 104) : H * 0.42;
  x = x + 22 < W / 2 ? 6 : W - 50;
  return { x, y, w: 44, h: 44, side: x < W / 2 ? 'left' : 'right' };
};

/* ---------- 直橫限制：手機拿錯方向時蓋一層提示並暫停 ---------- */
Screen.checkRotate = () => {
  if (!Env.mobile || Screen.orientation === 'any') return;
  const wrong = (Screen.orientation === 'portrait' && Screen.landscape) || (Screen.orientation === 'landscape' && Screen.portrait);
  if (wrong === Screen._rotating) return;
  Screen._rotating = wrong;
  let ov = document.getElementById('pz-rotate');
  if (wrong) {
    if (!ov) {
      ov = el('div', 'pz-rotate', `<div class="pz-rotate-icon"></div><div>${Screen.orientation === 'portrait' ? '請把手機轉成直的' : '請把手機轉成橫的'}</div>`);

    }
    ov.classList.add('on'); PZ.pause('rotate');

    if (ov) ov.classList.remove('on');
    PZ.resume('rotate');
  }

/* ---------- 全螢幕（iPhone 不支援，會回傳 false）---------- */
Screen.canFullscreen = () => HAS_DOM && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
Screen.isFullscreen = () => HAS_DOM && !!(document.fullscreenElement || document.webkitFullscreenElement);
Screen.fullscreen = async (on = !Screen.isFullscreen()) => {
  if (!Screen.canFullscreen()) return false;
  try {
    if (on) {
      const d = document.documentElement;
      await (d.requestFullscreen ? d.requestFullscreen({ navigationUI: 'hide' }) : d.webkitRequestFullscreen());
      if (Screen.orientation !== 'any' && screen.orientation && screen.orientation.lock) { try { await screen.orientation.lock(Screen.orientation); } catch (e) { /* 不支援 */ } }
    } else await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
    return true;
  } catch (e) { return false; }
};

/* ---------- 螢幕常亮（玩的時候不要自己暗掉）---------- */
const Wake = { want: false, lock: null };
Screen.keepAwake = async (on = true) => {
  Wake.want = on;
  if (!HAS_DOM || !('wakeLock' in navigator)) return false;
  try {
    if (on && !Wake.lock) { Wake.lock = await navigator.wakeLock.request('screen'); Wake.lock.addEventListener('release', () => { Wake.lock = null; }); }

PZ.on('visible', () => { if (Wake.want) Screen.keepAwake(true); });

addSystem({ name: 'screen', order: -100, frame() { Screen.measure(); } });

/* ---- 06_input.js ---- */

/* ---- 15_fx.js ---- */
/* ==========================================================================
   15 手感特效（打擊感）
   一行就有完整的打擊感：
     PZ.fx.hit(x, y, { power: 0.6, dir: 角度, crit: true, kill: false, sound: 'hit' })
       → 打擊停頓 + 震屏 + 鏡頭頓一下 + 火花 + （爆擊）閃光、色差、星芒 + 手機震動 + 音效
     PZ.fx.explode(x, y, { power: 1, radius: 120 })   爆炸：衝擊波扭曲、閃白、火球、碎片、煙
     PZ.fx.number(x, y, 128, { crit: true })          傷害數字（跳出來、彈一下、淡出）
     PZ.fx.hurt(0.5)    主角受傷：紅色暗角、色差、震動
   單項：shake / kick / punch / freeze / slowmo / flash / shockwave / chroma / vignette / text / haptic / rumble
   設定裡「畫面震動」「閃光」「傷害數字」會自動套用（照顧怕暈、怕閃的人）。
   ========================================================================== */
const Fx = PZ.fx = {
  nums: [], _vig: null, _chroma: 0, _chromaT: 0, _chromaD: 0, _flashT: 0, _flashD: 0, _flashA: 0, _waves: [],
  numStyle: { size: 18, weight: 900, color: '#fff', outline: 3, outlineColor: 'rgba(0,0,0,.85)', align: 'center', baseline: 'middle' },
  critStyle: { size: 26, weight: 900, color: '#ffd84a', outline: 4, outlineColor: '#3a0a00', align: 'center', baseline: 'middle' },
  healStyle: { size: 18, weight: 900, color: '#7dffa8', outline: 3, outlineColor: 'rgba(0,40,20,.9)', align: 'center', baseline: 'middle' },
};
Fx.shake = (t) => Cam.shake(t);
Fx.kick = (angle, px) => Cam.kick(angle, px);
Fx.punch = (z) => Cam.punch(z);
Fx.freeze = (ms) => PZ.freeze(ms);
Fx.slowmo = (s, sec, back) => PZ.slowmo(s, sec, back);
Fx.haptic = (k) => Haptics.tap(k);
Fx.rumble = (s, w, ms) => Input.rumble(s, w, ms);
/** 全畫面閃一下：color、強度 a（0～1）、秒數 */
Fx.flash = (color = '#fff', a = 0.5, dur = 0.12) => {
  const c = toColor(color); Post.flash[0] = cR(c) / 255; Post.flash[1] = cG(c) / 255; Post.flash[2] = cB(c) / 255;
  Fx._flashA = Math.max(Fx._flashA * (Fx._flashD > 0 ? 1 - Fx._flashT / Fx._flashD : 0), a); Fx._flashT = 0; Fx._flashD = dur;
};
/** 色差（爆擊、受傷）：amount 約 0.006～0.02 */
Fx.chroma = (amount = 0.012, dur = 0.25) => { Fx._chroma = Math.max(Fx._chroma, amount); Fx._chromaT = 0; Fx._chromaD = dur; };
/** 暗角脈衝：受傷變紅、低血量 */
Fx.vignette = (color = '#a00010', amount = 0.6, dur = 0.5) => { const base = Fx._vig ? Fx._vig.base : null; Fx._vig = { color: toColor(color), amount, dur, t: 0, base }; };
/** 衝擊波扭曲（世界座標）：strength 0.01～0.05、radius 擴散到多大（世界單位） */
Fx.shockwave = (x, y, o = {}) => {
  if (!Post.enabled) return;
  Fx._waves.push({ x, y, t: 0, dur: o.dur || 0.55, radius: o.radius || 260, strength: o.strength != null ? o.strength : 0.03, thick: o.thick || 50 });
  if (Fx._waves.length > 4) Fx._waves.shift();
};
/** 跳出文字（世界座標） */
Fx.text = (x, y, str, style, o = {}) => {
  const n = { x, y, vx: o.vx != null ? o.vx : Rand.spread(20), vy: o.vy != null ? o.vy : -70, t: 0, life: o.life || 0.9, str: String(str), st: style || Fx.numStyle, pop: o.pop != null ? o.pop : 1, grav: o.grav != null ? o.grav : 120 };
  Fx.nums.push(n); if (Fx.nums.length > 160) Fx.nums.shift();
  return n;
};
/** 傷害數字：o { crit, heal, color, size, miss } */
Fx.number = (x, y, value, o = {}) => {
  if (!Settings.get('numbers')) return null;
  const st = o.heal ? Fx.healStyle : o.crit ? Fx.critStyle : Fx.numStyle;
  const style = (o.color || o.size) ? Object.assign({}, st, o.color ? { color: o.color } : null, o.size ? { size: o.size } : null) : st;
  const txt = o.miss ? 'MISS' : (o.heal ? '+' : '') + (typeof value === 'number' ? Math.round(value) : value) + (o.crit ? '!' : '');
  return Fx.text(x, y, txt, style, { vy: o.crit ? -110 : -80, life: o.crit ? 1.05 : 0.8, pop: o.crit ? 1.6 : 1.15 });
};

/** 一次完整的「打中了」 */
Fx.hit = (x, y, o = {}) => {
  const p = clamp01(o.power != null ? o.power : 0.4), dir = o.dir != null ? o.dir : Rand.angle(), crit = !!o.crit, kill = !!o.kill;
  const fz = o.freeze != null ? o.freeze : Math.min(140, 18 + p * 50 + (crit ? 40 : 0) + (kill ? 45 : 0));
  if (fz > 0) PZ.freeze(fz);
  Cam.shake(o.shake != null ? o.shake : 0.06 + p * 0.22 + (crit ? 0.14 : 0) + (kill ? 0.1 : 0));
  Cam.kick(dir, 2 + p * 7 + (crit ? 4 : 0));
  const col = o.color;
  Particles.emit('hit', x, y, { angle: dir, scale: 0.8 + p * 0.6, colors: col ? ['#fff', col, Color.alpha(col, 0)] : undefined });
  if (p > 0.45 || crit) Particles.emit('sparks', x, y, { angle: dir, count: Math.round(4 + p * 10), scale: 0.8 + p * 0.5 });
  if (crit) { Particles.emit('flare', x, y, { scale: 1 + p }); Particles.emit('ring', x, y, { scale: 0.8 + p }); Fx.chroma(0.008 + p * 0.008, 0.22); Cam.punch(0.025 + p * 0.02); }
  if (kill) { Particles.emit('ring', x, y, { scale: 0.7 + p * 0.6 }); }
  if (o.blood) Particles.emit('blood', x, y, { angle: dir, scale: 0.8 + p * 0.5, colors: o.blood === true ? undefined : [o.blood, Color.darken(o.blood, 0.5), Color.alpha(o.blood, 0)] });
  if (crit || kill || p > 0.7) Fx.flash('#fff', 0.06 + p * 0.08 + (crit ? 0.06 : 0), 0.07);
  Haptics.tap(crit || kill ? 'medium' : p > 0.6 ? 'medium' : 'light');
  Input.rumble(0.2 + p * 0.6, 0.3 + p * 0.4, 60 + p * 80);
  if (o.sound !== false) { const s = o.sound || 'hit'; if (Sfx.has(s)) Sfx.at(s, x, y, { pitch: 1.08 - p * 0.18 + Rand.spread(0.06), vol: 0.75 + p * 0.35 }); if (crit && Sfx.has('crit')) Sfx.at('crit', x, y); if (kill && Sfx.has('kill')) Sfx.at('kill', x, y, { vol: 0.8 }); }
};
/** 爆炸 */
Fx.explode = (x, y, o = {}) => {
  const p = clamp01(o.power != null ? o.power : 0.8), rad = o.radius || 120;
  PZ.freeze(o.freeze != null ? o.freeze : 40 + p * 70);
  Cam.shake(0.3 + p * 0.5); Cam.punch(0.03 + p * 0.04);
  Fx.shockwave(x, y, { radius: rad * 2.4, strength: 0.018 + p * 0.025, dur: 0.5 + p * 0.2 });
  Fx.flash(o.flashColor || '#fff2d8', 0.18 + p * 0.25, 0.1 + p * 0.06);
  Fx.chroma(0.008 + p * 0.01, 0.3);
  Particles.emit('explosion', x, y, { scale: (0.6 + p * 0.8) * (rad / 120), colors: o.colors });
  Haptics.tap('heavy'); Input.rumble(1, 0.8, 220);
  if (o.sound !== false) { const s = o.sound || 'explosion'; if (Sfx.has(s)) Sfx.at(s, x, y, { vol: 0.8 + p * 0.3, pitch: 1.1 - p * 0.25 }); }
};
/** 主角受傷 */
Fx.hurt = (amount = 0.5, o = {}) => {
  const a = clamp01(amount);
  // 紅暗角要短、要淡：被一群怪連續咬時才不會整個畫面一直是紅的（o.vignette: false 不要暗角）
  if (o.vignette !== false) Fx.vignette(o.color || '#b0001a', 0.28 + a * 0.3, 0.25 + a * 0.25);
  Fx.chroma(0.006 + a * 0.012, 0.25); Cam.shake(0.18 + a * 0.35);
  if (o.dir != null) Cam.kick(o.dir, 4 + a * 8);
  PZ.freeze(o.freeze != null ? o.freeze : 25 + a * 50);
  Haptics.tap(a > 0.5 ? 'heavy' : 'medium'); Input.rumble(0.6 + a * 0.4, 0.5, 140);
  if (o.sound !== false) { const s = o.sound || 'hurt'; if (Sfx.has(s)) Sfx.play(s, { pitch: 1 - a * 0.15 }); }
};
/** 撿到東西 */
Fx.pickup = (x, y, o = {}) => { Particles.emit('pickup', x, y, { colors: o.color ? ['#fff', o.color, Color.alpha(o.color, 0)] : undefined }); if (o.sound !== false) { const s = o.sound || 'pickup'; if (Sfx.has(s)) Sfx.at(s, x, y, { pitch: o.pitch || 1 }); } };
/** 升級、過關的慶祝 */
Fx.celebrate = (x, y, o = {}) => {
  Particles.emit('confetti', x, y, { scale: o.scale || 1 }); Particles.emit('flare', x, y, { scale: 2 }); Particles.emit('shockring', x, y, { scale: 1.5 });
  Fx.flash('#fff', 0.35, 0.18); Cam.punch(0.05); Haptics.tap('success');
  if (o.sound !== false) { const s = o.sound || 'levelup'; if (Sfx.has(s)) Sfx.play(s); }
};

/** 畫傷害數字與跳字（世界座標）；場景沒畫的話 g.hud() 前會自動畫 */
Fx.drawNumbers = (g) => {
  Fx._numsDrawn = true;
  for (const n of Fx.nums) {
    const k = n.t / n.life, popT = Math.min(1, n.t / 0.16);
    const s = (n.pop > 1 ? lerp(n.pop, 1, Ease.outBack(popT)) : 1) * (k > 0.75 ? lerp(1, 0.7, (k - 0.75) / 0.25) : 1);
    const a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    g.save(); g.translate(n.x, n.y); g.scale(s, s); g.alpha(a);
    g.text(n.str, 0, 0, n.st);
    g.restore();
  }
};
/** g.hud() 會呼叫：場景沒自己畫的粒子（over 層）與數字，在這裡補畫 */
Fx._drawAuto = (g) => {
  if (g.space !== 'world') g.world();
  if (!Particles.drawn[1]) Particles.draw(g, 'over');
  if (!Fx._numsDrawn) Fx.drawNumbers(g);
};
addSystem({
  name: 'fx', order: 70,
  update(dt) {
    for (let i = 0; i < Fx.nums.length; i++) { const n = Fx.nums[i]; n.t += dt; n.vy += n.grav * dt; n.x += n.vx * dt; n.y += n.vy * dt; n.vx *= Math.exp(-3 * dt); if (n.t >= n.life) { Fx.nums.splice(i--, 1); } }
  },
  frame(rdt) {
    // 閃光、色差、暗角、衝擊波用真實時間：打擊停頓時照樣在變化
    if (Fx._flashD > 0) { Fx._flashT += rdt; const k = clamp01(Fx._flashT / Fx._flashD); Post.flash[3] = Fx._flashA * (1 - Ease.outQuad(k)); if (k >= 1) { Fx._flashD = 0; Fx._flashA = 0; Post.flash[3] = 0; } }
    if (Fx._chromaD > 0) { Fx._chromaT += rdt; const k = clamp01(Fx._chromaT / Fx._chromaD); Post.chroma = Fx._chroma * (1 - k); if (k >= 1) { Fx._chromaD = 0; Fx._chroma = 0; Post.chroma = 0; } }
    const v = Fx._vig;
    if (v) {
      if (!v.base) v.base = { vig: Post.vignette, col: Post.vignetteColor };
      v.t += rdt; const k = clamp01(v.t / v.dur), e = Math.sin(Math.min(1, k * 4) * Math.PI / 2) * (1 - Ease.inQuad(k));
      Post.vignette = lerp(v.base.vig, Math.max(v.base.vig, v.amount), e); Post.vignetteColor = Color.css(Color.mix(toColor(v.base.col), v.color, e));
      if (k >= 1) { Post.vignette = v.base.vig; Post.vignetteColor = v.base.col; Fx._vig = null; }
    }
    Post.waves.length = 0;
    for (let i = 0; i < Fx._waves.length; i++) {
      const w = Fx._waves[i]; w.t += rdt; const k = w.t / w.dur;
      if (k >= 1) { Fx._waves.splice(i--, 1); continue; }
      const z = Cam.ez || 1;
      Post.waves.push({ x: Cam.toScreenX(w.x, w.y), y: Cam.toScreenY(w.x, w.y), r: w.radius * Ease.outCubic(k) * z, strength: w.strength * (1 - k) * Settings.get('shake'), thick: w.thick * z * (1 - k * 0.5) });
    }
  },
  render() { Particles.drawn[0] = Particles.drawn[1] = false; Fx._numsDrawn = false; },
});

/* ---- 16_audio.js ---- */
/* ==========================================================================
   16 聲音：音訊核心＋合成音效
   - 第一次點擊／按鍵時「同步」建立 AudioContext（放在 await 後面會被瀏覽器擋）。
   - iPhone 側邊靜音鍵打開時網頁遊戲會沒聲音：設 navigator.audioSession.type = 'playback' 解決
     （設定裡「跟其他 App 的音樂一起播」打開時改成 'ambient'：會跟著靜音鍵）。
   - 音效全部用純 JavaScript 合成成聲音片段（可重現、不用檔案、手機也省電），播的時候只是放片段：
       PZ.sfx.play('hit', { vol, pitch, pan })     PZ.sfx.at('explosion', x, y)（依畫面位置左右聲道、遠近音量）
       PZ.sfx.define('myShot', { layers: [...], vol: 0.8, pitchVar: 0.06, max: 4, gap: 0.03 })
   - 同一個音效同時最多幾個聲部（max）、最短間隔（gap），機槍不會疊成爆音；總輸出有限幅器。
   - 匯流排：sfx（音效）、music（配樂）、ui（介面）、amb（環境）；設定裡的音量直接套用。
   ========================================================================== */
const Aud = PZ.audio = { ctx: null, ready: false, failed: false, bus: {}, duckV: 1, _duckT: 0, _unlockers: [], sampleRate: 44100 };

function setSession() {
  try { if (HAS_DOM && navigator.audioSession) navigator.audioSession.type = Settings.get('mixOthers') ? 'ambient' : 'playback'; } catch (e) { /* 不支援 */ }
}
/** 建立音訊（一定要在使用者手勢裡同步呼叫；引擎已經自動掛好了） */
Aud.unlock = () => {
  if (!HAS_DOM || Aud.failed) return false;
  if (Aud.ctx) { if (Aud.ctx.state !== 'running') { try { Aud.ctx.resume(); } catch (e) { /* ignore */ } } return true; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { Aud.failed = true; return false; }
  setSession();
  let c;
  try { c = new AC({ latencyHint: 'interactive' }); } catch (e) { try { c = new AC(); } catch (er) { Aud.failed = true; return false; } }
  Aud.ctx = c; Aud.sampleRate = c.sampleRate;
  const master = c.createGain(), comp = c.createDynamicsCompressor();
  comp.threshold.value = -10; comp.knee.value = 6; comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.18;
  master.connect(comp); comp.connect(c.destination);
  Aud.master = master; Aud.comp = comp;
  for (const k of ['sfx', 'music', 'ui', 'amb']) { const g = c.createGain(); g.connect(master); Aud.bus[k] = g; }
  // 配樂多過一個低通（暫停選單、水底、被打暈時「悶住」：PZ.music.muffle）
  Aud.musicLP = c.createBiquadFilter(); Aud.musicLP.type = 'lowpass'; Aud.musicLP.frequency.value = 20000; Aud.musicLP.Q.value = 0.6;
  Aud.bus.music.disconnect(); Aud.bus.music.connect(Aud.musicLP); Aud.musicLP.connect(master);
  // 殘響（短的房間感，給需要的音效加一點空間）
  Aud.rev = c.createConvolver(); Aud.rev.buffer = makeIR(c, 1.6, 2.6); Aud.revIn = c.createGain(); Aud.revIn.gain.value = 1;
  Aud.revIn.connect(Aud.rev); Aud.rev.connect(Aud.bus.sfx);
  // iOS：先放一段無聲，正式解鎖
  try { const b = c.createBuffer(1, 1, c.sampleRate), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { /* ignore */ }
  try { c.resume(); } catch (e) { /* ignore */ }
  c.onstatechange = () => PZ.emit('audiostate', c.state);
  Aud.ready = true;
  Aud.applyVolumes();
  Sfx.prewarm();
  PZ.emit('audio', c);
  return true;
};
function makeIR(c, sec, decay) {
  const len = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, len, c.sampleRate), r = makeRng(99);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); let lp = 0; for (let i = 0; i < len; i++) { lp += ((r.next() * 2 - 1) - lp) * 0.35; d[i] = lp * Math.pow(1 - i / len, decay) * 0.6; } }
  return b;
}
Aud.applyVolumes = () => {
  if (!Aud.ctx) return;
  const t = Aud.ctx.currentTime, set = (g, v) => { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(v, t, 0.03); };
  const mute = Settings.get('mute') ? 0 : 1;
  set(Aud.master, mute * Settings.get('master'));
  set(Aud.bus.sfx, Settings.get('sfx')); set(Aud.bus.ui, Settings.get('sfx') * 0.9); set(Aud.bus.amb, Settings.get('sfx') * 0.85);
  set(Aud.bus.music, Settings.get('music') * Aud.duckV);
};

/* ==========================================================================
   17 配樂：用文字寫譜、引擎即時演奏
     PZ.music.define('battle', {
       bpm: 128, swing: 0,                   // steps：每小節幾格（預設 16）
       tracks: [
         { inst: 'kick',  pat: 'x...x...x...x...' },
         { inst: 'snare', pat: '....x.......x...' },
         { inst: 'hat',   pat: 'x.x.x.x.x.x.x.x.', vol: 0.35, min: 0.4 },   // 緊張度 ≥ 0.4 才出現
         { inst: 'bass',  notes: 'A1 . A1 . . . G1 . F1 - - . F1 . G1 .' },  // 一格一個字：音名、. 休止、- 延長
         { inst: 'pad',   chords: 'Am F C G', vol: 0.3 },                     // 一小節一個和弦
         { inst: 'pluck', notes: 'A4 . C5 . E5 . C5 . …', min: 0.7 },
       ],
     });
     PZ.music.play('battle', { fade: 1.5 });   PZ.music.intensity(0.8);   PZ.music.stop({ fade: 2 });
     PZ.music.stinger('win')（播一次、自動壓低主配樂）   PZ.music.file('theme', 'music.mp3')（用音檔）
   鼓的字：x 一般、X 重音、o 輕；數字 1～9 是力度。音名：C4＝中央 Do，可寫 C#4、Eb3。
   和弦：A、Am、A7、Am7、Amaj7、Asus2、Asus4、Adim、Aaug、A6、Am6、A9、Aadd9，可加 /E 指定低音。
   樂器（取樣式，便宜）：kick snare hat ohat clap tom crash shaker rim bass sub pluck harp zither keys bell marimba arp stab epiano piano guitar kalimba
   樂器（即時合成，長音）：pad strings lead choir flute organ brass supersaw
   聲部效果：{ delay: 0.35（跟拍子對齊的回音）, lp: 1800 或 [600, 6000]（低通；給兩個值＝緊張度越高越亮）, pump: 0.6（跟著大鼓一縮一放）, rev, pan }
     歌曲：{ delaySteps: 3（回音隔幾格，預設附點八分）, feedback: 0.38, delayTone: 2600 }
   換歌對拍子：PZ.music.play('boss', { sync: 'bar' | 'half' | 'beat' })   下一小節（半小節、下一拍）才切過去，不會亂拍
   PZ.music.muffle(0.8)  配樂悶住（暫停選單、水底）；muffle(0) 恢復      PZ.music.phase()  這一拍走到哪（0～1，畫面跟著節奏跳）
   ========================================================================== */
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteToMidi(tok) {
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(tok); if (!m) return null;
  return 12 * (+m[3] + 1) + NOTE_IDX[m[1].toUpperCase()] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const CHORD_Q = { '': [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11], sus2: [0, 2, 7], sus4: [0, 5, 7], dim: [0, 3, 6], aug: [0, 4, 8], 6: [0, 4, 7, 9], m6: [0, 3, 7, 9], 9: [0, 4, 7, 10, 14], add9: [0, 4, 7, 14], m9: [0, 3, 7, 10, 14] };
function chordNotes(name, base = 52) {
  const m = /^([A-G])([#b]?)([a-z0-9]*)(?:\/([A-G][#b]?))?$/.exec(name); if (!m) return null;
  const root = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0), q = CHORD_Q[m[3]] || CHORD_Q[''];
  // 把根音放在 base 附近（聲部不要一直跳）
  let r = base - ((base - root) % 12 + 12) % 12; if (r < base - 6) r += 12;
  const notes = q.map((iv) => r + iv);
  if (m[4]) { const b = NOTE_IDX[m[4][0]] + (m[4][1] === '#' ? 1 : m[4][1] === 'b' ? -1 : 0); notes.unshift(r - 12 + ((b - root + 12) % 12)); }
  return notes;
}
PZ.noteToMidi = noteToMidi; PZ.chordNotes = chordNotes;

const INST = {};
const buf = (name, render) => { INST[name] = { kind: 'buf', render }; };
const node = (name, play) => { INST[name] = { kind: 'node', play }; };
function ks(f, dur, sr, bright = 0.5, damp = 0.996, seed = 1) {
  const N = Math.max(2, Math.round(sr / f)), d = new Float32Array(N), r = makeRng(seed);

      if (!local || lts === synced) { c.adopt(R.d); return; }                          // 雲端比較新、這台沒有別的進度
      // 兩邊都有沒同步過的進度：問玩家
      c.asking = true;
      const yes = await UI.confirm({ title: '有兩份進度', body: `<div class="pz-two">這台裝置：${describe(local)}<br>另一台裝置：${describe(R.d)}</div><div class="pz-hint">只能留一份，沒選的那份會被蓋掉。</div>`, ok: '接另一台的', cancel: '留這台的' });

        const uid = await user.id(); if (!uid) throw new Error('no id');

    const raw = save.ready; save.ready = Promise.race([raw, new Promise((r) => setTimeout(r, 5000))]);
    /** 設定頁的一行說明 */
    c.note = () => {
      if (c.state === 'wait') return '正在連上你的帳號……';
      if (c.state !== 'on') return '這次沒連上你的帳號：進度先只存在這台裝置。';
      const m = c.okAt ? Math.floor((Date.now() - c.okAt) / 60000) : -1;
      return '進度也跟著你的 Claude 帳號走：換一台裝置打開會自己接上。' + (m >= 0 ? `（${m < 1 ? '剛剛' : m + ' 分鐘前'}同步過）` : '');
    };
    return c;
  },
};

/** 一句一句播（回傳 Promise）；每句可以是 [名字, 文字, {face, side, voice}] 或字串（旁白） */
UI.say = async (lines, o = {}) => {
  if (!Array.isArray(lines)) lines = [lines];
  const S = sayBox(); S.skip = false;
  if (o.pause !== false) PZ.pause('say');
  Input.releaseAll();
  const layer = UI.push(S.wrap, null);
  const advKey = Input.onPress('confirm', () => { S.holdT = Time.real; if (UI.top() === layer && S.onAdv) S.onAdv(); });
  try {
    for (const ln of lines) {
      const L = typeof ln === 'string' ? [null, ln, {}] : Array.isArray(ln) ? [ln[0], ln[1], ln[2] || {}] : [ln.name, ln.text, ln];
      const [name, text, lo] = L;
      if (lo.do) { await lo.do(); continue; }
      S.wrap.classList.toggle('narr', !name); S.wrap.classList.toggle('right', lo.side === 'right');
      S.name.style.display = name ? '' : 'none'; S.name.textContent = name || '';
      const face = lo.face || (o.faces && name && o.faces[name]) || null;
      S.face.innerHTML = ''; const fe = faceEl(face); if (fe) S.face.appendChild(fe);

    S.onAdv = finish;

/* ---- 24_boot.js ---- */
/* ==========================================================================
   24 啟動
     PZ.start({
       id: 'last-order', title: '最後一單', version: '2.0.0',
       orientation: 'any',               // 'portrait' | 'landscape' | 'any'
       background: '#07090d',
       fit: 420,                         // 畫面短邊看得到的世界單位（相機自動縮放）
       step: 0,                          // 0＝可變步長；1/60＝固定步長
       theme: 'night' 或 { accent: '#f5a', … },
       fonts: ['PZ Sans'],               // 嵌入字型：等它載好才畫字
       settings: { music: 0.6 },         // 這款遊戲的預設設定
       binds: { fire: ['Space', 'PadA'] },
       async load(progress) { … 畫圖、定義音效 … progress(0.5) },
       scenes: { title: {...}, play: {...} },   // 也可以另外用 PZ.scene() 定義
       first: 'title',
     });
   ========================================================================== */
PZ.cfg = null;
PZ.start = async (cfg = {}) => {
  if (!HAS_DOM) throw new Error('PZ.start 需要瀏覽器');
  PZ.cfg = cfg;
  if (document.readyState === 'loading') await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
  Screen.init(cfg);
  Debug.init(cfg);
  UI.init(cfg);
  Input.init();
  if (cfg.binds) Input.bind(cfg.binds);
  // 畫質起點：手機「精細」、電腦「極致」、記憶體小的手機「平衡」；之前在這台自動降過就從那一階開始
  const start = cfg.quality != null ? cfg.quality : Env.lowMemory ? 1 : Env.mobile ? 2 : 3;
  const dev = Store.getJSON('pz.device.tier', null);
  Quality.start = start; Quality.tier = dev != null ? Math.min(start, dev + 1) : start;
  PZ.on('quality', (t, why) => { if (why === 'slow' || why === 'fast') Store.setJSON('pz.device.tier', t); });
  Settings.load(cfg.id || 'game', cfg.settings);
  if (cfg.step) Time.step = cfg.step;
  if (cfg.fit) Cam.fitSize = cfg.fit;
  if (cfg.post === false) Post.enabled = false;
  if (cfg.post && typeof cfg.post === 'object') { const p = cfg.post; for (const k in p) { if (k === 'bloom' && typeof p.bloom === 'object') Object.assign(Post.bloom, p.bloom); else Post[k] = p[k]; } }
  if (cfg.title && !document.title) document.title = cfg.title;
  Screen.measure(true);
  Gfx.create(cfg.renderer || (/[?&]c2d\b/.test(location.href) ? 'canvas2d' : 'webgl2'));
  Art.init();
  if (cfg.scenes) for (const k in cfg.scenes) PZ.scene(k, cfg.scenes[k]);
  Loop.start();
  let L = null;
  if (cfg.load) {
    L = cfg.loading === false ? null : UI.loading(cfg.title || '', '載入中');
    const progress = (p, note) => { if (L) L.progress(p, note); };
    await Text.ready(cfg.fonts || []);
    try { await cfg.load(progress); } catch (e) { reportError(e, 'load'); }
    progress(1);
  } else await Text.ready(cfg.fonts || []);
  PZ.emit('ready');
  if (L) L.done();
  if (cfg.first) await PZ.go(cfg.first, cfg.firstParams, { type: cfg.firstTransition || 'fade', time: 0.5 });
  return PZ;
};

/* ---- 25_light.js ---- */
/* ==========================================================================
   25 光影：動態光源、柔和陰影、投影、光束
     PZ.light.on({ ambient: '#1b2333' })     打開光影；ambient＝沒被照到的地方剩多亮（'#fff'＝白天，看起來跟沒開一樣）
     const lamp = PZ.light.add({ x, y, r: 260, color: '#ffb547', intensity: 1.2, flicker: 0.25, glow: 0.6 })

     g.beam(x, y, 角度, 長度, 起點寬, 終點寬, color, { a, end })   光束（窗戶透進來的光、探照燈、舞台燈）

   陰影：擋光的東西先畫成遮光圖，用 JFA 算出「到最近牆的距離」，每個像素往燈的方向跳著走，順便量擦邊多近 → 柔和的半影。

const Light = PZ.light = {
  active: false, ambient: '#ffffff', soak: 10, haze: 0, shadows: true,
  sun: { angle: 0.9, len: 0.75, a: 0.4 },          // 沒有燈的時候，角色投影的方向（白天的太陽）
  lights: [], shapes: [], zones: [], fn: null,
  _list: [], _vis: [], _flash: 0, _flashColor: [0.8, 0.86, 1], _wHaze: 0, _amb: [1, 1, 1],
  /** 每一階畫質：光照圖解析度（scale）、遮光圖解析度（mask，0＝不算陰影）、陰影追蹤步數、距離場最遠量幾格（reach：JFA 從這個步長開始） */
  tiers: [
    { scale: 0.25, mask: 0, steps: 0, reach: 0 },
    { scale: 0.34, mask: 0.25, steps: 14, reach: 32 },
    { scale: 0.5, mask: 0.34, steps: 20, reach: 32 },
    { scale: 0.5, mask: 0.5, steps: 28, reach: 64 },
  ],
};
Light.quality = () => Light.tiers[clamp(Quality.tier, 0, Light.tiers.length - 1)];

/** 打開光影。o: { ambient, soak（光滲進牆面幾單位，預設 10）, shadows（false＝全部不算陰影） } */
Light.on = (o = {}) => {
  Light.active = true;

  if (o.soak != null) Light.soak = o.soak;

};
Light.off = () => { Light.active = false; return Light; };
/** 全部清掉（場景切換時引擎會自動呼叫） */
Light.reset = () => {

  Light.lights.length = 0; Light.shapes.length = 0; Light.zones.length = 0; Light.fn = null;
  Light.active = false; Light.ambient = '#ffffff'; Light.soak = 10; Light.haze = 0; Light.shadows = true; Light._flash = 0;

/* ---------- 燈 ---------- */
let LightSeed = 1;

/* ---------- 擋光的東西 ---------- */
class PZShape {
  constructor(kind, o) { this.kind = kind; Object.assign(this, o); this.dead = false; }

/** 方塊（左上角 x, y） */
Light.box = (x, y, w, h) => { const s = new PZShape('box', { x, y, w, h }); Light.shapes.push(s); return s; };
/** 圓柱 */
Light.circle = (x, y, r) => { const s = new PZShape('circle', { x, y, r }); Light.shapes.push(s); return s; };

Light.poly = (pts) => { const s = new PZShape('poly', { pts: pts.slice() }); Light.shapes.push(s); return s; };

Light.occluders = (fn) => { Light.fn = fn; return () => { if (Light.fn === fn) Light.fn = null; }; };

/** 環境光區塊（世界座標的方塊；screen: true 用螢幕座標）。o: { ambient（預設白＝不變暗）, soft（邊緣柔和幾單位，預設 40）, a（0～1 蓋過多少）}。回傳的物件可以改 x/y/w/h/ambient、.remove() */

/** 打雷、爆炸：環境光短暫變亮（amount 0～1，time 秒，color 預設冷白） */
Light.flash = (amount = 0.8, time = 0.25, color) => {

/* ---------- 每格 ---------- */

function drawOccluders() {
  withSpace(G, 'world', (g) => {
    for (const s of Light.shapes) {
      if (s.dead) continue;
      if (s.kind === 'box') g.rect(s.x, s.y, s.w, s.h, WHITE);
      else if (s.kind === 'circle') g.circle(s.x, s.y, s.r, WHITE);

  const c = toColor(Light.ambient), a = Light._amb, f = Light._flash, k = Light._flashColor;

addSystem({
  name: 'light', order: 72,

  }

  if (anyGlow) {

      for (const L of Light.lights) {

      }
    });

/**
 * defs = { idle: { frames: ['hero:0', …] 或 'hero'（自動找 hero:0、hero:1…）, fps: 8, loop: true },
 *          attack: { frames: 'atk', fps: 16, loop: false, next: 'idle', events: { 3: 'hit' } } }

/* 樣品館：共用小工具 */
const Lab = { demos: [] };
/** 每個示範頁上方的返回列 */
Lab.bar = (title, sub) => `<div class="lab-bar"><button class="lab-back pz-btn ghost" data-ui aria-label="返回" style="padding:0">‹</button><div class="lab-title">${title}<small>${sub || ''}</small></div></div>`;
/** 把 [data-chip] 綁成開關：state 物件的 key 對應 chip 的值 */
Lab.chips = (root, state, onChange) => {
  root.querySelectorAll('[data-chip]').forEach((b) => {
    const k = b.dataset.chip; b.classList.toggle('on', !!state[k]);
    b.addEventListener('click', () => { state[k] = !state[k]; b.classList.toggle('on', !!state[k]); PZ.uiSound(state[k] ? 'confirm' : 'cancel'); if (onChange) onChange(k, state[k]); });
  });
};
Lab.range = (input, onInput) => { const paint = () => input.style.setProperty('--v', ((input.value - input.min) / (input.max - input.min)) * 100 + '%'); paint(); input.addEventListener('input', () => { paint(); onInput(+input.value); }); };
Lab.bindBack = (root) => { const b = root.querySelector('.lab-back'); if (b) b.addEventListener('click', () => PZ.go('hub', null, { type: 'iris', time: 0.4 })); };
/** 手機橫拿（矮螢幕）時控制面板在右邊（見 00_lab.css）：回傳鏡頭要往右挪幾個世界單位，內容才會置中在左邊空出來的地方 */
Lab.side = () => PZ.screen.landscape && PZ.screen.h <= 520;
Lab.shift = () => { if (!Lab.side()) return 0; PZ.cam.compute(); const pw = Math.min(320, PZ.screen.w * 0.44) + 20; return pw / 2 / (PZ.cam.ez || 1); };
/** 畫重複的地板（只畫看得到的範圍） */
Lab.floor = (g, frame = 'floor', size = 96) => {
  const v = PZ.cam.view, x0 = Math.floor(v.x / size) * size - size, y0 = Math.floor(v.y / size) * size - size;
  g.tile(frame, x0, y0, v.w + size * 3, v.h + size * 3, { ox: -x0, oy: -y0 });
};
/** 有影子的角色 */
Lab.actor = (g, f, x, y, o = {}) => {
  g.ellipse(x, y, (o.shadow || 15) * (o.sx || 1), (o.shadow || 15) * 0.36, 'rgba(0,0,0,.45)');
  g.spr(f, x, y + (o.oy || 0), o.r || 0, (o.sx || 1) * (o.flip ? -1 : 1), o.sy || o.sx || 1, o.a == null ? 1 : o.a, o.color, o.add || 0, o.flash || 0);
};

    <div class="lab-panel" data-ui>
      <div class="lab-row">${IMPACT_KEYS.map(([k, l]) => `<button class="lab-chip" data-chip="${k}">${l}</button>`).join('')}</div>
      <div class="lab-row"><button class="lab-chip cyan big" data-a="none">全部關掉</button><button class="lab-chip cyan big" data-a="all">全部打開</button><button class="lab-chip big" data-a="auto">自動攻擊</button></div>
      <div class="lab-row"><span class="lab-label">力道</span><input class="lab-range" type="range" min="0.1" max="1" step="0.05" value="0.55"></div>
      <div class="lab-row"><button class="lab-chip big" data-a="crit">爆擊</button><button class="lab-chip big" data-a="boom">爆炸</button><button class="lab-chip big" data-a="slow">終結慢動作</button></div>
    </div>`,
  enter() {
    const box = PZ.scenes.uiEl; Lab.bindBack(box);
    this.fx = Object.fromEntries(IMPACT_KEYS.map(([k]) => [k, true]));
    this.power = 0.55; this.auto = false; this.autoT = 0;
    Lab.chips(box, this.fx);
    const sync = () => box.querySelectorAll('[data-chip]').forEach((b) => b.classList.toggle('on', !!this.fx[b.dataset.chip]));
    box.querySelector('[data-a="none"]').onclick = () => { for (const k in this.fx) this.fx[k] = false; sync(); PZ.uiSound('cancel'); };
    box.querySelector('[data-a="all"]').onclick = () => { for (const k in this.fx) this.fx[k] = true; sync(); PZ.uiSound('confirm'); };
    const ab = box.querySelector('[data-a="auto"]'); ab.onclick = () => { this.auto = !this.auto; ab.classList.toggle('on', this.auto); };
    box.querySelector('[data-a="crit"]').onclick = () => { const e = this.pick(); if (e) this.attack(e, true); };
    box.querySelector('[data-a="boom"]').onclick = () => this.boom();
    box.querySelector('[data-a="slow"]').onclick = () => { const e = this.pick(); if (e) { e.hp = 1; PZ.slowmo(0.2, 0.9, 0.4); this.attack(e, true); } };
    Lab.range(box.querySelector('.lab-range'), (v) => { this.power = v; });
    this.hero = { x: -120, y: 12, swing: 0, face: 1 };
    this.foes = [];
    const spots = [[30, -70], [110, 10], [30, 95], [190, -60], [190, 85], [245, 12]];
    spots.forEach(([x, y], i) => this.foes.push(this.foe(x, y, i === 5 ? 'brute' : i % 2 ? 'husk2' : 'husk')));
    // 直拿時下方有控制面板：鏡頭往下挪，讓戰場在上面三分之二
    // 直拿：整排往中間收（主角、怪物都不出畫面，也不用把鏡頭拉遠讓角色變小）
    let first = true;
    const layout = () => {
      const port = PZ.screen.portrait, k = port ? 0.8 : 1;
      this.hero.x = port ? -96 : -120;
      for (const e of this.foes) { e.ox = e.bx * k; if (first) e.x = e.ox; }
      first = false;
      const side = Lab.side();
      PZ.cam.fit(port || side ? 380 : 420); PZ.cam.x = (port ? 52 : 50) + Lab.shift(); PZ.cam.y = port ? 70 : side ? 12 : 20;
    };
    layout(); this.offResize = PZ.on('resize', layout);
    this.offTap = PZ.on('tap', (t) => { const wx = t.wx, wy = t.wy; let best = null, bd = 70 * 70; for (const e of this.foes) { if (e.dead) continue; const d = PZ.math.dist2(wx, wy, e.x, e.y - e.h * 0.4); if (d < bd) { bd = d; best = e; } } if (best) this.attack(best); else { this.hero.swing = 1; if (this.fx.sound) PZ.sfx.play('whoosh'); } });
    PZ.music.play('drive', { intensity: 0.6, fade: 1.5 });
  },
  exit() { this.offTap(); this.offResize(); },
  foe(x, y, kind) { const big = kind === 'brute'; return { x, y, ox: x, oy: y, bx: x, vx: 0, vy: 0, kind, hp: big ? 260 : 100, max: big ? 260 : 100, back: 1, flash: 0, sq: PZ.spring(1, { k: 520, d: 14 }), h: big ? 84 : 52, big, dead: false, t: PZ.rand.next() * 6, spawn: 0 }; },
  pick() { const live = this.foes.filter((e) => !e.dead); return live.length ? PZ.rand.pick(live) : null; },
  attack(e, forceCrit) {
    const F = this.fx, p = this.power, crit = forceCrit || PZ.rand.chance(0.22);
    const dir = Math.atan2(e.y - this.hero.y, e.x - this.hero.x);
    this.hero.swing = 1; this.hero.face = Math.sign(e.x - this.hero.x) || 1;
    let dmg = Math.round((10 + p * 34) * (crit ? 2.2 : 1) * PZ.rand.range(0.85, 1.15));
    e.hp -= dmg; const kill = e.hp <= 0;
    const hx = e.x - Math.cos(dir) * 12, hy = e.y - e.h * 0.45;
    // ↓ 這一段就是 PZ.fx.hit() 裡面做的事，拆開來才能逐項開關
    if (F.stop) PZ.freeze(Math.min(140, 18 + p * 50 + (crit ? 40 : 0) + (kill ? 45 : 0)));
    if (F.shake) PZ.cam.shake(0.06 + p * 0.22 + (crit ? 0.14 : 0) + (kill ? 0.1 : 0));
    if (F.kick) { PZ.cam.kick(dir, 2 + p * 7 + (crit ? 4 : 0)); if (crit) PZ.cam.punch(0.03 + p * 0.02); }
    if (F.spark) { PZ.particles.emit('hit', hx, hy, { angle: dir, scale: 0.8 + p * 0.6 }); PZ.particles.emit('sparks', hx, hy, { angle: dir, count: Math.round(4 + p * 12) }); if (crit) { PZ.particles.emit('flare', hx, hy, { scale: 1 + p }); PZ.particles.emit('ring', hx, hy, { scale: 0.8 + p }); } }
    if (F.flash) { e.flash = 1; if (crit || kill) PZ.fx.flash('#fff', 0.08 + p * 0.1, 0.07); }
    if (F.knock) { e.vx += Math.cos(dir) * (220 + p * 420) * (e.big ? 0.4 : 1); e.vy += Math.sin(dir) * (220 + p * 420) * (e.big ? 0.4 : 1); e.sq.kick(-6 - p * 6); }
    if (F.nums) PZ.fx.number(hx, hy - 10, dmg, { crit });
    if (F.chroma && crit) PZ.fx.chroma(0.01 + p * 0.008, 0.22);
    if (F.sound) { PZ.sfx.at(p > 0.6 ? 'hitHeavy' : 'hit', hx, hy, { pitch: 1.08 - p * 0.18 }); if (crit) PZ.sfx.at('crit', hx, hy); if (kill) PZ.sfx.at('kill', hx, hy); }
    if (F.haptic) PZ.haptic.tap(crit || kill ? 'medium' : 'light');
    if (kill) this.kill(e, dir);
  },
  kill(e, dir) {
    e.dead = true; e.respawn = 1.4;
    if (this.fx.spark) { PZ.particles.emit('explosion', e.x, e.y - e.h * 0.4, { scale: e.big ? 1.2 : 0.7 }); PZ.particles.emit('magic', e.x, e.y - e.h * 0.4, { colors: ['#fff', '#d6a8ff', 'rgba(150,80,255,0)'] }); }
    if (this.fx.shake) PZ.cam.shake(e.big ? 0.5 : 0.25);
    if (this.fx.flash && e.big) PZ.fx.shockwave(e.x, e.y - 30, { radius: 300, strength: 0.03 });
    if (this.fx.sound && e.big) PZ.sfx.at('explosion', e.x, e.y, { vol: 0.8 });
  },
  boom() {
    const live = this.foes.filter((e) => !e.dead); if (!live.length) return;
    let cx = 0, cy = 0; for (const e of live) { cx += e.x; cy += e.y; } cx /= live.length; cy /= live.length;
    PZ.fx.explode(cx, cy - 20, { power: 1, radius: 150 });
    for (const e of live) { const d = Math.atan2(e.y - cy, e.x - cx); e.vx += Math.cos(d) * 520; e.vy += Math.sin(d) * 520; e.flash = 1; e.hp -= 60; PZ.fx.number(e.x, e.y - e.h, 60, {}); if (e.hp <= 0) this.kill(e, d); }
  },
  update(dt) {
    const H = this.hero; H.swing = Math.max(0, H.swing - dt * 5);
    if (this.auto) { this.autoT -= dt; if (this.autoT <= 0) { this.autoT = 0.42; const e = this.pick(); if (e) this.attack(e); } }
    for (const e of this.foes) {
      e.t += dt; e.flash = Math.max(0, e.flash - dt * 7);
      if (e.dead) { e.respawn -= dt; if (e.respawn <= 0) { Object.assign(e, { dead: false, hp: e.max, x: e.ox, y: e.oy, vx: 0, vy: 0, spawn: 1 }); e.sq.set(0.2); e.sq.target = 1; PZ.particles.emit('magic', e.x, e.y - 20); } continue; }
      e.spawn = Math.max(0, e.spawn - dt * 3);
      e.x += e.vx * dt; e.y += e.vy * dt; const k = Math.exp(-7 * dt); e.vx *= k; e.vy *= k;
      e.x = PZ.damp(e.x, e.ox, 2.2, dt); e.y = PZ.damp(e.y, e.oy, 2.2, dt);
      e.back = Math.max(e.hp / e.max, e.back - dt * 0.6);
    }
  },
  render(g) {
    Lab.floor(g);
    PZ.particles.draw(g, 'under');
    const list = [...this.foes.filter((e) => !e.dead), this.hero].sort((a, b) => a.y - b.y);
    for (const e of list) {
      if (e === this.hero) {
        const H = this.hero, sw = H.swing;
        Lab.actor(g, 'hero', H.x, H.y, { flip: H.face < 0, sx: 1 + sw * 0.08, sy: 1 - sw * 0.06 });
        if (sw > 0) { g.save(); g.translate(H.x + H.face * 18, H.y - 30); g.rotate(H.face > 0 ? -1.4 + (1 - sw) * 2.6 : Math.PI + 1.4 - (1 - sw) * 2.6); g.alpha(sw); g.rect(0, -3, 46, 6, '#ffe6b0', { add: 1, ax: 0, ay: 0.5 }); g.restore(); }
        continue;
      }
      const sq = e.sq.value, bob = Math.sin(e.t * 3) * 1.5;
      Lab.actor(g, e.kind, e.x, e.y, { sx: (2 - sq), sy: sq, oy: bob, flash: e.flash, shadow: e.big ? 26 : 15 });
      g.glow(e.x, e.y - e.h * 0.75, e.big ? 40 : 24, e.kind === 'husk2' ? 'rgba(255,190,80,.35)' : e.big ? 'rgba(255,60,60,.35)' : 'rgba(255,80,220,.35)');
      if (e.hp < e.max) g.bar(e.x - 22, e.y - e.h - 12, 44, 5, e.hp / e.max, { back: e.back, fg: '#ff3b5c' });
    }
    g.glow(this.hero.x, this.hero.y - 30, 70, 'rgba(70,212,255,.22)');
  },
});

      let dx = H.x - f.x, dy = H.y - f.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      let px = 0, py = 0; const near = G.query(f.x, f.y, 16, this.tmp);
      for (let k = 0, m = 0; k < near.length && m < 4; k++) { const o = near[k]; if (o === f) continue; m++; const ox = f.x - o.x, oy = f.y - o.y, od = Math.hypot(ox, oy) || 1; px += ox / od; py += oy / od; }
      f.x += (dx * f.sp + px * 40) * dt; f.y += (dy * f.sp + py * 40) * dt;
      if (d < 20) { f.x -= dx * (20 - d); f.y -= dy * (20 - d); }
      f.flash = Math.max(0, f.flash - dt * 8); f.t += dt;
    }
    // 自動射擊：最近的怪
    H.fire -= dt;
    if (H.fire <= 0) {
      const tgt = G.nearest(H.x, H.y, 420);
      if (tgt) { H.fire = 0.07; const a = Math.atan2(tgt.y - H.y, tgt.x - H.x) + R.spread(0.05); this.shots.push({ x: H.x + Math.cos(a) * 14, y: H.y - 22 + Math.sin(a) * 14, vx: Math.cos(a) * 900, vy: Math.sin(a) * 900, life: 0.55, a }); PZ.particles.emit('muzzle', H.x + Math.cos(a) * 18, H.y - 22 + Math.sin(a) * 18, { angle: a }); PZ.sfx.play('rifle', { vol: 0.35 }); }
    }
    for (let i = 0; i < this.shots.length; i++) {
      const s = this.shots[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      const hit = s.life > 0 && G.nearest(s.x, s.y + 22, 12, (f) => f.hp > 0);
      if (hit) {
        hit.hp--; hit.flash = 1; hit.x += s.vx * 0.012; hit.y += s.vy * 0.012;
        PZ.particles.emit('hit', s.x, s.y, { angle: s.a + Math.PI, scale: 0.7 });
        if (hit.hp <= 0) { this.kills++; PZ.particles.emit('sparks', hit.x, hit.y - 20, { count: 6, colors: ['#fff', '#e3b5ff', 'rgba(160,80,255,0)'] }); PZ.particles.emit('dust', hit.x, hit.y); this.gems.push({ x: hit.x, y: hit.y, t: 0 }); PZ.sfx.at('kill', hit.x, hit.y, { vol: 0.4 }); PZ.cam.shake(0.03); }
        s.life = 0;
      }
      if (s.life <= 0) { this.shots[i] = this.shots[this.shots.length - 1]; this.shots.pop(); i--; }
    }
    this.foes = this.foes.filter((f) => f.hp > 0);
    for (let i = 0; i < this.gems.length; i++) {
      const g = this.gems[i]; g.t += dt; const d = PZ.math.dist(g.x, g.y, H.x, H.y);
      if (d < 140) { const k = Math.min(1, dt * 9); g.x += (H.x - g.x) * k; g.y += (H.y - 20 - g.y) * k; }
      if (d < 18) { PZ.fx.pickup(g.x, g.y, { sound: 'xp', color: '#46d4ff' }); this.gems[i] = this.gems[this.gems.length - 1]; this.gems.pop(); i--; }
    }
    if (this.foes.length < 60) this.spawn(80);
    if (PZ.time.frame % 15 === 0) { const r = PZ.gfx.r.stats; this.stat.textContent = `${Math.round(PZ.time.fps)} FPS\n怪物 ${this.foes.length}\n子彈 ${this.shots.length}  粒子 ${PZ.particles.n}\n繪圖批次 ${r.draws}\n畫質 ${PZ.quality.cur.name}${PZ.quality.auto ? '（自動）' : ''}\n擊倒 ${this.kills}`; }
  },
  render(g) {
    Lab.floor(g);
    PZ.particles.draw(g, 'under');
    for (const gm of this.gems) { const b = Math.sin(gm.t * 6) * 2; g.glow(gm.x, gm.y - 6, 14, 'rgba(70,212,255,.5)'); g.spr('gem', gm.x, gm.y - 8 + b, 0, 0.8); }
    const list = this.foes; PZ.sortBy(list, (f) => f.y);
    for (const f of list) { if (!g.visible(f.x, f.y, 50)) continue; g.ellipse(f.x, f.y, 11, 4, 'rgba(0,0,0,.4)'); g.spr(f.kind, f.x, f.y + Math.sin(f.t * 8) * 0.8, 0, (f.x > this.hero.x ? -0.82 : 0.82), 0.82, 1, null, 0, f.flash); }
    const H = this.hero; Lab.actor(g, 'hero', H.x, H.y, { flip: H.face < 0 });
    g.glow(H.x, H.y - 24, 90, 'rgba(70,212,255,.18)');
    for (const s of this.shots) g.spr('bolt', s.x, s.y, s.a, 1.1, 1, 1, null, 1);
  },
});

  },
  update(dt) {

    if (H.dash > 0) { H.ghosts.push({ x: H.x, y: H.y, a: 0.6 }); }
    for (const g of H.ghosts) g.a -= dt * 3; H.ghosts = H.ghosts.filter((g) => g.a > 0);
    H.fireT -= dt;

      this.shots.push({ x: H.x + Math.cos(a) * 20, y: H.y - 24 + Math.sin(a) * 20, vx: Math.cos(a) * 820, vy: Math.sin(a) * 820, life: 0.7, a });
      PZ.particles.emit('muzzle', H.x + Math.cos(a) * 22, H.y - 24 + Math.sin(a) * 22, { angle: a }); PZ.sfx.play('shoot', { vol: 0.5 }); PZ.cam.kick(a + Math.PI, 1.5);
    }
    for (const s of this.shots) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
    this.shots = this.shots.filter((s) => s.life > 0);
    this.acts.querySelectorAll('[data-act]').forEach((c) => c.classList.toggle('on', I.down(c.dataset.act)));
    this.bD.cooldown(Math.max(0, H.cd / 0.5));
  },
  render(g) {
    Lab.floor(g);
    PZ.particles.draw(g, 'under');
    const H = this.H;
    for (const gh of H.ghosts) g.spr('hero', gh.x, gh.y, 0, 1, 1, gh.a, '#46d4ff', 0.6);

    g.glow(H.x, H.y - 24, 80, 'rgba(70,212,255,.2)');
  },
});

      const x = -half + i * this.B + 20, y = -half + j * this.B + 20;
      if (R.chance(0.12)) { for (let k = 0; k < 6; k++) this.trees.push({ x: x + R.range(10, 110), y: y + R.range(10, 110), s: R.range(0.8, 1.3) }); this.blocks.push({ x, y, park: true }); }

  },

const GRADES = { 原色: { sat: 1, contrast: 1, bright: 0, tint: [1, 1, 1] }, 恐怖: { sat: 0.45, contrast: 1.15, bright: -0.06, tint: [0.92, 1, 0.95] }, 暖: { sat: 1.1, contrast: 1.05, bright: 0.02, tint: [1.1, 0.98, 0.82] }, 冷: { sat: 0.9, contrast: 1.08, bright: 0, tint: [0.82, 0.95, 1.12] }, 黑白: { sat: 0, contrast: 1.2, bright: 0, tint: [1, 1, 1] } };
PZ.scene('post', {
  bg: '#04050a',
  ui: () => `${Lab.bar('後製特效', '點畫面任何地方：衝擊波')}
    <div class="lab-panel" data-ui>
      <div class="lab-row"><button class="lab-chip" data-p="bloom">泛光</button><button class="lab-chip" data-p="vignette">暗角</button><button class="lab-chip" data-p="grain">顆粒</button><button class="lab-chip" data-p="scan">掃描線</button><button class="lab-chip" data-p="warp">老電視</button><button class="lab-chip" data-p="chroma">色差</button></div>
      <div class="lab-row"><span class="lab-label">調色</span>${Object.keys(GRADES).map((k, i) => `<button class="lab-chip cyan${i ? '' : ' on'}" data-g="${k}">${k}</button>`).join('')}</div>
    </div>`,
  enter() {
    const box = PZ.scenes.uiEl; Lab.bindBack(box);
    const P = PZ.post;
    this.base = { vignette: P.vignette, grain: P.grain, bloom: P.bloom.on };
    const st = this.st = { bloom: P.bloom.on, vignette: P.vignette > 0, grain: P.grain > 0, scan: false, warp: false, chroma: false };
    Lab.chips(box, st, () => this.apply());
    box.querySelectorAll('[data-g]').forEach((b) => b.addEventListener('click', () => { box.querySelectorAll('[data-g]').forEach((x) => x.classList.toggle('on', x === b)); const gr = GRADES[b.dataset.g]; PZ.tween(P, { sat: gr.sat, contrast: gr.contrast, bright: gr.bright }, 0.5, 'inOutQuad', { real: true }); P.tint = gr.tint.slice(); PZ.uiSound('click'); }));
    this.offTap = PZ.on('tap', (t) => { PZ.fx.shockwave(t.wx, t.wy, { radius: 420, strength: 0.045 }); PZ.particles.emit('shockring', t.wx, t.wy, { scale: 2 }); PZ.fx.flash('#cfe8ff', 0.12, 0.08); PZ.sfx.play('explosion', { vol: 0.5, pitch: 1.4 }); PZ.cam.shake(0.25); });
    this.t = 0; this.orbs = [];
    const R = PZ.rng(3); for (let i = 0; i < 40; i++) this.orbs.push({ a: R.angle(), r: R.range(60, 330), s: R.range(0.2, 0.7) * R.sign(), c: R.pick(['#ff3db8', '#46d4ff', '#ffb547', '#8cff6a']), z: R.range(3, 9), trail: [] });
    const lay = () => { PZ.cam.fit(640); PZ.cam.x = Lab.shift(); }; lay(); this.offR = PZ.on('resize', lay);
    PZ.music.play('dread', { intensity: 0.6, fade: 1.5 });
  },
  apply() {
    const P = PZ.post, s = this.st;
    P.bloom.on = s.bloom; P.vignette = s.vignette ? 0.55 : 0; P.grain = s.grain ? 0.07 : 0; P.scan = s.scan ? 0.18 : 0; P.warp = s.warp ? 0.22 : 0; P.chroma = s.chroma ? 0.006 : 0;
  },
  exit() { this.offTap(); this.offR(); const P = PZ.post; P.bloom.on = this.base.bloom; P.vignette = this.base.vignette; P.grain = this.base.grain; P.scan = 0; P.warp = 0; P.chroma = 0; P.sat = 1; P.contrast = 1; P.bright = 0; P.tint = [1, 1, 1]; },
  update(dt) {
    this.t += dt;
    for (const o of this.orbs) { o.a += o.s * dt; const x = Math.cos(o.a) * o.r, y = Math.sin(o.a) * o.r * 0.6; o.trail.unshift({ x, y }); if (o.trail.length > 16) o.trail.pop(); o.x = x; o.y = y; }
    if (this.st.chroma) PZ.post.chroma = 0.004 + Math.sin(this.t * 3) * 0.003;
  },
  render(g) {
    for (let i = -12; i <= 12; i++) { g.line(i * 60, -500, i * 60, 500, 1.5, '#1c2848', { a: 0.6 }); g.line(-800, i * 50, 800, i * 50, 1.5, '#1c2848', { a: 0.6 }); }
    g.glow(0, 0, 160, 'rgba(255,60,200,.25)');
    for (const o of this.orbs) {
      if (o.trail.length > 2) g.trail(o.trail, o.z * 1.6, 0, o.c, PZ.color.alpha(o.c, 0), { add: 1, a: 0.8 });
      g.glow(o.x, o.y, o.z * 5, o.c, { a: 0.7, core: 0.8 });
      g.circle(o.x, o.y, o.z * 0.7, '#fff');
    }
    g.text('後製', 0, 0, { size: 64, weight: 900, color: '#fff', align: 'center', baseline: 'middle', outline: 6, outlineColor: '#ff3db8', add: 0 });
  },
});

const LT = {

  crates: [[-500, -420], [-436, -420], [-500, -356], [470, 400], [406, 400], [470, 336], [150, 380], [-470, 300]],
  barrels: [[-380, -420], [500, -60], [-160, 400], [60, -400]],

  husks: [[-420, 110, 'husk'], [420, -160, 'husk2'], [0, 300, 'brute'], [-120, -380, 'husk']],
  oil: [[-150, 120, 1.1, 0.4], [170, -40, 0.8, 2.1], [80, 230, 1.3, 1]],

  path: (t) => ({ x: Math.cos(t) * 330, y: 40 + Math.sin(t) * 190 }),

LT.art = () => {
  if (PZ.art.has('lt.floor')) return;
  const A = PZ.art;
  // 石板地：2×2 塊，每塊有色差、裂縫、苔蘚、髒污（燈一照細節就出來）
  A.make('lt.floor', 128, 128, (c, w, h) => {
    const R = PZ.rng(21);
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
      const x = i * 64, y = j * 64, base = R.range(30, 42);
      const g = c.createLinearGradient(x, y, x + 64, y + 64); g.addColorStop(0, `hsl(220,10%,${base + 4}%)`); g.addColorStop(1, `hsl(225,12%,${base - 6}%)`);
      c.fillStyle = g; c.fillRect(x + 1.5, y + 1.5, 61, 61);
      for (let k = 0; k < 60; k++) { c.fillStyle = `rgba(${R.chance(0.5) ? '255,255,255' : '0,0,0'},${R.range(0.02, 0.07)})`; c.fillRect(x + R.range(2, 60), y + R.range(2, 60), R.range(1, 4), R.range(1, 4)); }
      c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(x + 1.5, y + 1.5, 61, 1.5); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x + 1.5, y + 61, 61, 1.5);
      if (R.chance(0.6)) { c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 1; c.beginPath(); let px = x + R.range(10, 54), py = y + R.range(6, 20); c.moveTo(px, py); for (let s = 0; s < 4; s++) { px += R.spread(10); py += R.range(6, 12); c.lineTo(px, py); } c.stroke(); }
      if (R.chance(0.45)) { const mg = c.createRadialGradient(x + R.range(8, 56), y + R.range(8, 56), 0, x + 32, y + 32, 30); mg.addColorStop(0, 'rgba(70,110,60,.22)'); mg.addColorStop(1, 'rgba(70,110,60,0)'); c.fillStyle = mg; c.fillRect(x, y, 64, 64); }
    }
    c.fillStyle = '#0b0d12'; c.fillRect(0, 0, w, 1.5); c.fillRect(0, 0, 1.5, h); c.fillRect(0, 63, w, 2); c.fillRect(63, 0, 2, h);
  });
  // 牆頂（深色石材，邊緣有斜面光）與牆面（磚）
  A.make('lt.top', 64, 64, (c, w, h) => {
    const R = PZ.rng(4); c.fillStyle = '#2b2f38'; c.fillRect(0, 0, w, h);
    for (let k = 0; k < 90; k++) { c.fillStyle = `rgba(${R.chance(0.5) ? '255,255,255' : '0,0,0'},${R.range(0.02, 0.06)})`; c.fillRect(R.range(0, w), R.range(0, h), R.range(1, 5), R.range(1, 3)); }
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1; c.strokeRect(0.5, 0.5, w - 1, h - 1);
  });
  A.make('lt.brick', 64, 28, (c, w, h) => {
    c.fillStyle = '#1d1f26'; c.fillRect(0, 0, w, h);
    const R = PZ.rng(8);
    for (let row = 0; row < 2; row++) for (let i = -1; i < 3; i++) {
      const x = i * 32 + (row ? 16 : 0), y = row * 14, l = R.range(26, 36);
      c.fillStyle = `hsl(18,${R.range(14, 24)}%,${l}%)`; c.fillRect(x + 1, y + 1, 30, 12);
      c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(x + 1, y + 1, 30, 1.5); c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(x + 1, y + 11.5, 30, 1.5);
    }
  });
  // 柱子（俯視：圓頂有刻紋）
  A.make('lt.pillar', 72, 72, (c, w, h) => {
    const g = c.createRadialGradient(w * 0.4, h * 0.38, 2, w / 2, h / 2, 34); g.addColorStop(0, '#6d7180'); g.addColorStop(0.7, '#3d414c'); g.addColorStop(1, '#22252c');

    c.strokeStyle = '#3a2614'; c.lineWidth = 5; c.strokeRect(4.5, 4.5, w - 9, h - 9);
    c.strokeStyle = '#8a6440'; c.lineWidth = 4; c.beginPath(); c.moveTo(8, 8); c.lineTo(w - 8, h - 8); c.stroke();
    c.fillStyle = '#b8b0a0'; for (const [x, y] of [[7, 7], [w - 7, 7], [7, h - 7], [w - 7, h - 7]]) { c.beginPath(); c.arc(x, y, 1.8, 0, Math.PI * 2); c.fill(); }
  });
  A.make('lt.barrel', 46, 46, (c, w, h) => {
    const g = c.createRadialGradient(w * 0.42, h * 0.4, 2, w / 2, h / 2, 22); g.addColorStop(0, '#8a4a3a'); g.addColorStop(1, '#3a1c16');
    c.fillStyle = g; c.beginPath(); c.arc(w / 2, h / 2, 21, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#2a2a30'; c.lineWidth = 3; for (const r of [20, 13]) { c.beginPath(); c.arc(w / 2, h / 2, r, 0, Math.PI * 2); c.stroke(); }
    c.fillStyle = 'rgba(255,220,180,.18)'; c.beginPath(); c.ellipse(w * 0.4, h * 0.36, 8, 4, -0.6, 0, Math.PI * 2); c.fill();
  });
  // 火把座
  A.make('lt.torch', 14, 26, (c, w, h) => {
    c.fillStyle = '#2a1f18'; c.fillRect(w / 2 - 2, 8, 4, h - 8);
    c.fillStyle = '#5a4030'; c.beginPath(); c.moveTo(1, 4); c.lineTo(w - 1, 4); c.lineTo(w - 3, 10); c.lineTo(3, 10); c.closePath(); c.fill();
    c.fillStyle = '#8a6a4a'; c.fillRect(1, 3, w - 2, 2);
  }, { anchor: [0.5, 0.2] });
  // 地上的油漬（帶一點虹彩）、警示斑馬線、散落的紙、發電機
  A.make('lt.oil', 90, 56, (c, w, h) => {
    const R = PZ.rng(13);
    for (let i = 0; i < 9; i++) { const x = w / 2 + R.spread(w * 0.25), y = h / 2 + R.spread(h * 0.2), r = R.range(10, 24), g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(8,8,12,.55)'); g.addColorStop(0.75, 'rgba(8,8,12,.35)'); g.addColorStop(1, 'rgba(8,8,12,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); }
    const g2 = c.createLinearGradient(10, 10, w - 10, h - 10); g2.addColorStop(0, 'rgba(120,60,200,0)'); g2.addColorStop(0.4, 'rgba(60,160,200,.18)'); g2.addColorStop(0.6, 'rgba(200,180,60,.14)'); g2.addColorStop(1, 'rgba(200,60,120,0)');
    c.globalCompositeOperation = 'source-atop'; c.fillStyle = g2; c.fillRect(0, 0, w, h);
  });
  A.make('lt.stripes', 64, 16, (c, w, h) => {
    c.fillStyle = '#c99a1e'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#16140f'; for (let x = -16; x < w; x += 16) { c.beginPath(); c.moveTo(x, h); c.lineTo(x + 8, 0); c.lineTo(x + 16, 0); c.lineTo(x + 8, h); c.closePath(); c.fill(); }
    const R = PZ.rng(3); for (let i = 0; i < 40; i++) { c.fillStyle = `rgba(30,30,34,${R.range(0.2, 0.6)})`; c.fillRect(R.range(0, w), R.range(0, h), R.range(1, 5), R.range(1, 3)); }
  });
  A.make('lt.paper', 18, 24, (c, w, h) => { c.fillStyle = '#d9d4c6'; c.fillRect(1, 1, w - 2, h - 2); c.fillStyle = 'rgba(40,40,50,.35)'; for (let y = 5; y < h - 3; y += 3) c.fillRect(3, y, w - 6 - (y % 6), 1); c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.moveTo(w - 1, 1); c.lineTo(w - 6, 1); c.lineTo(w - 1, 6); c.fill(); });
  A.make('lt.gen', 76, 54, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#4c5560'); g.addColorStop(1, '#262c33'); c.fillStyle = g; c.beginPath(); c.roundRect(2, 2, w - 4, h - 4, 5); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(2.5, 2.5, w - 5, h - 5, 5); c.stroke();
    c.fillStyle = '#15191e'; for (let i = 0; i < 6; i++) c.fillRect(8 + i * 7, 10, 4, 22);
    c.fillStyle = '#c99a1e'; c.fillRect(w - 26, 10, 16, 10); c.fillStyle = '#16140f'; c.font = '900 8px sans-serif'; c.fillText('⚡', w - 22, 18);
    c.fillStyle = '#0d1014'; c.fillRect(w - 28, h - 18, 20, 8);
  });
  // 照明彈
  A.make('lt.flare', 10, 22, (c, w, h) => { c.fillStyle = '#b02a2a'; c.fillRect(2, 4, w - 4, h - 4); c.fillStyle = '#e8d8c0'; c.fillRect(2, h - 5, w - 4, 3); c.fillStyle = '#fff'; c.fillRect(3, 0, w - 6, 4); });
};
const LT_TIMES = { 深夜: { amb: '#1a2234', bloom: 0.75, k: 1 }, 黃昏: { amb: '#5d4a5e', bloom: 0.6, k: 0.85 }, 白天: { amb: '#ffffff', bloom: 0.45, k: 0.3 } };

  collide(H) {

      const cx = PZ.clamp(H.x, x, x + w), cy = PZ.clamp(H.y, y, y + h + 12), dx = H.x - cx, dy = H.y - cy, d = Math.hypot(dx, dy);
      if (d < r) { if (d > 0.01) { H.x = cx + (dx / d) * r; H.y = cy + (dy / d) * r; } else H.y = y + h + 12 + r; }
    }
    for (const [x, y] of LT.pillars.concat(LT.barrels)) { const dx = H.x - x, dy = H.y - y, d = Math.hypot(dx, dy), R = 34 + r * 0.5; if (d < R && d > 0.01) { H.x = x + (dx / d) * R; H.y = y + (dy / d) * R; } }
    for (const [x, y] of LT.crates.concat([LT.gen])) { const cx = PZ.clamp(H.x, x - 28, x + 28), cy = PZ.clamp(H.y, y - 28, y + 30), dx = H.x - cx, dy = H.y - cy, d = Math.hypot(dx, dy); if (d < r && d > 0.01) { H.x = cx + (dx / d) * r; H.y = cy + (dy / d) * r; } }

  update(dt) {

      H.vx = (p.x - H.x) * 6; H.vy = (p.y - H.y) * 6; H.x = p.x; H.y = p.y; H.dir = Math.atan2(q.y - p.y, q.x - p.x);
    } else {

  },
  drawWall(g, x, y, w, h) {
    g.tile('lt.brick', x, y + h, w, 28, { color: '#c9c0b8' });
    g.rect(x, y + h + 22, w, 6, 'rgba(0,0,0,.35)');

    const hull = c.createLinearGradient(0, 40, 0, h); hull.addColorStop(0, '#7a2e2a'); hull.addColorStop(1, '#3a1412');
    c.fillStyle = hull; c.beginPath(); c.moveTo(4, 46); c.lineTo(w - 2, 42); c.quadraticCurveTo(w - 16, h - 6, w - 40, h - 4); c.lineTo(26, h - 4); c.quadraticCurveTo(10, h - 10, 4, 46); c.closePath(); c.fill();

  render(g) {

    if (A.fire) { const fl = this.fireL._fi || 1; for (let i = 0; i < 3; i++) g.spr('hd.flame', (i - 1) * 7, -6, Math.sin(t * 8 + i * 2) * 0.12, 0.7 + i % 2 * 0.25, (0.85 + 0.25 * Math.sin(t * 11 + i)) * fl, 0.95, null, 1); g.glow(0, -16, 46 * fl, '#ff9a46', { a: 0.55 }); }
    for (const f of this.fly) { g.glow(f.x, f.y, f.i === 1 ? 20 : 16, f.col, { a: 0.95, core: 1 }); g.glow(f.x, f.y, 40, f.col, { a: 0.3 }); }
    if (A.forest || A.night) for (const f of this.flies) g.glow(f.x, f.y, 4, '#d8ff7a', { a: 0.4 + 0.5 * Math.max(0, Math.sin(t * 2 + f.ph * 3)), core: 1 });
    for (const ex of [-5, 5]) g.glow(D.x - ex * 1.25, D.y - 4 - 32 * 1.25, 4, '#ffd04f', { a: 0.8, core: 1 });
    PZ.particles.draw(g);
    g.hud();
    this.drawHud(g);
  },
  drawHud(g) {
    const S = PZ.screen, sf = S.safe, side = Lab.side(), t = this.t;
    // 左上：頭像＋經驗值環＋血條、魔力條
    const px = 16 + sf.l + 30, py = 66 + sf.t + 30, pr = 27;
    g.circle(px, py, pr + 5, 'rgba(6,8,16,.8)');
    g.arc(px, py, pr + 2.5, 3.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2, 'rgba(255,255,255,.12)');
    g.arc(px, py, pr + 2.5, 3.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * PZ.clamp(this.xpShown, 0, 1), '#c48bff', { cap: 'round' });
    g.circle(px, py, pr, '#1a2440');
    g.spr('face_wei', px, py + 5, 0, 0.225, 0.225);
    g.rrect(px + 12, py + 14, 24, 15, 7, '#c48bff'); g.text(String(this.level), px + 24, py + 21.5, { size: 11, weight: 900, color: '#1a0c2e', align: 'center', baseline: 'middle' });
    const bw = Math.min(side ? 180 : 210, S.w * 0.5), bx = px + pr + 26;
    g.text('魏子葳', bx, py - 30, { size: 13, weight: 900, color: '#fff', baseline: 'middle', outline: 3, outlineColor: 'rgba(0,0,0,.6)' });
    g.meter(this.hp, bx, py - 17, bw, 15, { color: '#ff3b55', color2: '#ff8a5a', segments: 10, low: 0.3, text: true });
    g.meter(this.mp, bx - 6, py + 4, bw * 0.78, 9, { color: '#2f7bff', color2: '#46d4ff', frame: true });
    // 右上：分數、連擊
    const rx = S.w - 16 - sf.r - (side ? Math.min(320, S.w * 0.44) + 12 : 0), ry = 22 + sf.t + (side ? 0 : 36);
    g.text('SCORE', rx, ry - 10, { size: 10, weight: 900, color: 'rgba(255,255,255,.55)', align: 'right', baseline: 'middle', letterSpacing: 2 });
    g.count(this.score, rx, ry + 10, { size: 26, align: 'right', color: '#ffe9b0' });
    if (this.combo > 1) {
      const k = this.comboPop, s = 1 + k * 0.45, hot = Math.min(1, this.combo / 20), col = PZ.color.mix('#7fe8ff', '#ff5a3d', hot);
      g.save(); g.translate(rx, ry + 52); g.scale(s, s); g.rotate(-0.06);
      g.text(this.combo + '', 0, 0, { size: 34, weight: 900, color: PZ.color.css(col), align: 'right', baseline: 'middle', outline: 4, outlineColor: 'rgba(0,0,0,.6)' });
      g.restore();
      g.text('連擊', rx, ry + 76, { size: 12, weight: 900, color: '#fff', align: 'right', baseline: 'middle', outline: 3, outlineColor: 'rgba(0,0,0,.6)' });
      g.rect(rx - 60, ry + 88, 60, 3, 'rgba(255,255,255,.18)'); g.rect(rx - 60 * (this.comboT / 2.2), ry + 88, 60 * (this.comboT / 2.2), 3, PZ.color.css(col));
    }
    // 技能列
    const rs = this.skillRects();
    rs.forEach((r, i) => {
      const k = this.sk[i], S2 = k.s, s = 1 - k.press * 0.12, ready = k.cd <= 0 && this.mp.value >= S2.mp;
      g.circle(r.x, r.y + 3, r.r + 3, 'rgba(0,0,0,.45)');
      g.circle(r.x, r.y, (r.r + 2) * s, ready ? S2.color : '#3a4258', { a: ready ? 0.85 : 0.6 });
      g.circle(r.x, r.y, r.r * s, '#141b2e');
      g.spr(S2.icon, r.x, r.y, 0, (r.r / 30) * s, (r.r / 30) * s, ready ? 1 : 0.45);
      g.cooldown(r.x, r.y, r.r * s, k.cd / S2.cd, { color: S2.color, flash: k.flash });
      if (k.cd > 0) g.text(k.cd >= 1 ? Math.ceil(k.cd) + '' : k.cd.toFixed(1), r.x, r.y + 1, { size: 15, weight: 900, color: '#fff', align: 'center', baseline: 'middle', outline: 3, outlineColor: 'rgba(0,0,0,.7)' });
      if (S2.mp) g.text(S2.mp + '', r.x + r.r * 0.7, r.y + r.r * 0.75, { size: 10, weight: 900, color: this.mp.value >= S2.mp ? '#8fd0ff' : '#ff6b6b', align: 'center', baseline: 'middle', outline: 3, outlineColor: 'rgba(0,0,0,.8)' });
      if (!PZ.env.touch) g.text(S2.key, r.x - r.r * 0.72, r.y - r.r * 0.72, { size: 10, weight: 900, color: 'rgba(255,255,255,.75)', align: 'center', baseline: 'middle', outline: 3, outlineColor: 'rgba(0,0,0,.8)' });
    });
    void t;
  },
});
