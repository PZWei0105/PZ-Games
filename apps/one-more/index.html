<!DOCTYPE html>
<html lang="zh-Hant-TW" data-skin="matcha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一集就好">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>一集就好 ONE MORE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* 一集就好 ONE MORE — 手帳感：奶油紙、圓角卡、細線、實心淡陰影（不用 filter、backdrop-filter、模糊陰影） */
:root, [data-skin="matcha"] {
  --bg: #f3efe4; --bg2: #ebe5d6; --card: #fffdf7; --ink: #2e3a33; --ink2: #5d6b62; --mute: #97a198;
  --line: rgba(46, 58, 51, .10); --line2: rgba(46, 58, 51, .18);
  --ac: #6f9a7a; --ac-d: #4f7a5c; --ac-l: #d7e5d4; --ac-ll: #e9f0e4; --tape: rgba(196, 214, 160, .78); --tape2: rgba(239, 214, 170, .8);
  --sh: rgba(79, 122, 92, .16); --warm: #d9a36b; --leaf: #a9c39a;
}
[data-skin="rose"] {
  --bg: #f7efe9; --bg2: #f0e4dc; --card: #fffaf7; --ink: #3d2f33; --ink2: #6e5a5f; --mute: #a8979a;
  --line: rgba(61, 47, 51, .10); --line2: rgba(61, 47, 51, .18);
  --ac: #c57d86; --ac-d: #a65f69; --ac-l: #f2d9d8; --ac-ll: #f8e9e6; --tape: rgba(240, 196, 190, .8); --tape2: rgba(224, 205, 170, .8);
  --sh: rgba(166, 95, 105, .16); --warm: #c99a6b; --leaf: #e2b7b3;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; overflow-x: clip; }
html { background: var(--bg); color: var(--ink); transition: background .4s; }
body {
  font: 15px/1.55 "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
  min-height: 100vh; padding-bottom: calc(74px + env(safe-area-inset-bottom));
  background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 22px 22px;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
img { display: block; }
i, em { font-style: normal; }
.serif, .logo b, h1, h2, .hero-t, .pin-n { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; }

/* 背景的小葉子 */
#paper { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.leaf { position: absolute; width: 46px; height: 22px; border-radius: 0 100% 0 100%; background: var(--leaf); opacity: .35; animation: drift 18s ease-in-out infinite; }
.l1 { left: 6%; top: 18%; transform: rotate(-20deg); }
.l2 { right: 8%; top: 46%; width: 34px; height: 16px; animation-delay: -6s; }
.l3 { left: 40%; bottom: 12%; width: 28px; height: 13px; animation-delay: -11s; }
@keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(-18deg); } 50% { transform: translate(14px, -18px) rotate(8deg); } }

/* 頂端 */
#top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .2s; }
html.scrolled #top { border-bottom-color: var(--line); }
.logo { display: flex; align-items: baseline; gap: 8px; }
.logo b { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
.logo span { font-size: 10.5px; font-weight: 800; letter-spacing: 2.5px; color: var(--ac-d); }
.top-sp { flex: 1; }
.ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); transition: background .2s, transform .15s; }
.ico:active { transform: scale(.92); }
.ico svg { width: 21px; height: 21px; fill: currentColor; }
#btnMusic.on { color: var(--ac-d); background: var(--ac-ll); }
#btnSkin { position: relative; }
#btnSkin .dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--card); }
#btnSkin .g { background: #6f9a7a; left: 8px; top: 10px; }
#btnSkin .p { background: #c57d86; right: 8px; bottom: 10px; }

/* 分頁 */
#tabs { position: fixed; z-index: 25; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; background: var(--card); border: 1px solid var(--line2); border-radius: 999px; box-shadow: 0 4px 0 var(--sh); }
#tabs a { display: flex; align-items: center; gap: 6px; padding: 9px 18px; white-space: nowrap; border-radius: 999px; color: var(--mute); font-size: 14px; font-weight: 700; transition: background .25s, color .25s; }
#tabs a svg { width: 19px; height: 19px; fill: currentColor; }
#tabs a.on { background: var(--ac); color: #fff; }
@media (min-width: 900px) {
  body { padding-bottom: 30px; }
  #tabs { top: 9px; bottom: auto; box-shadow: none; padding: 4px; }
  #tabs a { padding: 7px 16px; }
}

main { max-width: 1180px; margin: 0 auto; padding: 4px 0 20px; }
.pad { padding: 0 16px; }

/* 問候 */
.hello { padding: 10px 16px 4px; }
.hello h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
.hello p { margin: 4px 0 0; color: var(--ink2); font-size: 14px; }
.hello .cnt { display: inline-block; margin-left: 4px; padding: 0 8px; border-radius: 999px; background: var(--ac-ll); color: var(--ac-d); font-weight: 800; }

/* 區塊 */
.sec { margin-top: 22px; }
.sh { display: flex; align-items: baseline; gap: 10px; padding: 0 16px; margin-bottom: 10px; }
.sh h2 { margin: 0; font-size: 19px; letter-spacing: 1px; position: relative; }
.sh h2::after { content: ''; position: absolute; left: -4px; right: -4px; bottom: 1px; height: 8px; background: var(--ac-l); z-index: -1; border-radius: 4px; }
.sh small { color: var(--mute); font-size: 12.5px; }
.sh .more { margin-left: auto; color: var(--ac-d); font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.row { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 8px; scroll-snap-type: x proximity; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.row > * { scroll-snap-align: start; flex: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 220px), 1fr)); gap: 14px 12px; padding: 0 16px; }

/* 影片卡 */
.vc { width: 236px; display: block; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 3px 0 var(--sh); transition: transform .2s; }
.grid .vc { width: auto; }
.vc:active { transform: translateY(2px); }
@media (hover: hover) { .vc:hover { transform: translateY(-3px); } }
.vc-th { position: relative; display: block; aspect-ratio: 16 / 9; background: var(--bg2); overflow: hidden; }
.vc-th img { width: 100%; height: 100%; object-fit: cover; }
.vc-len { position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(255, 253, 247, .94); color: var(--ink); font-size: 12px; font-weight: 800; }
.vc-ep { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: var(--ac); color: #fff; font-size: 11.5px; font-weight: 800; }
.vc-ne { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(46, 40, 40, .78); color: #fff; font-size: 11px; font-weight: 700; }
.vc-new { position: absolute; right: 8px; top: 8px; padding: 1px 8px; border-radius: 999px; background: var(--warm); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
.vc-pg { position: absolute; left: 0; bottom: 0; height: 4px; width: var(--p); background: var(--ac); }
.vc-seen { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 253, 247, .55); color: var(--ac-d); font-weight: 800; font-size: 13px; }
.vc-t { display: block; padding: 10px 12px 2px; font-size: 14px; font-weight: 700; line-height: 1.42; min-height: 50px; }
.vc-t .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vc-t .nm.one { -webkit-line-clamp: 1; }
.vc-t small { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink2); font-weight: 500; font-size: 12.5px; }
.vc-m { display: flex; align-items: center; gap: 6px; padding: 4px 12px 11px; color: var(--mute); font-size: 12px; white-space: nowrap; overflow: hidden; }
.vc-m b { font-weight: 600; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
.tag { flex: none; padding: 0 7px; border-radius: 999px; background: var(--ac-ll); color: var(--ac-d); font-weight: 700; font-size: 11px; }
.vc.wide { width: 300px; }

/* 直式短劇卡 */
.vs { width: 132px; display: block; }
.vs-th { position: relative; display: block; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: var(--bg2); box-shadow: 0 3px 0 var(--sh); }
.vs-th img { position: absolute; top: 50%; left: 50%; height: 100%; width: auto; max-width: none; transform: translate(-50%, -50%); }
.vs b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 7px; font-size: 13px; font-weight: 700; line-height: 1.4; }

/* 置頂：站長的頻道 */
.pin { position: relative; margin: 14px 16px 0; padding: 16px; background: var(--card); border: 1px solid var(--line2); border-radius: 22px; box-shadow: 0 4px 0 var(--sh); }
.pin::before, .pin::after { content: ''; position: absolute; top: -9px; width: 74px; height: 20px; background: var(--tape); transform: rotate(-4deg); border-radius: 2px; }
.pin::before { left: 22px; }
.pin::after { right: 26px; background: var(--tape2); transform: rotate(5deg); }
.pin-h { display: flex; align-items: center; gap: 12px; }
.pin-av { width: 52px; height: 52px; flex: none; border-radius: 50%; overflow: hidden; background: var(--ac-l); border: 2px solid var(--card); box-shadow: 0 0 0 2px var(--ac-l); display: grid; place-items: center; font-weight: 800; color: var(--ac-d); }
.pin-av img { width: 100%; height: 100%; object-fit: cover; }
.pin-k { font-size: 11.5px; font-weight: 800; letter-spacing: 1.5px; color: var(--ac-d); }
.pin-n { font-size: 19px; font-weight: 700; }
.pin-s { font-size: 12.5px; color: var(--mute); }
.pin-go { margin-left: auto; flex: none; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--ac); color: var(--ac-d); font-size: 13px; font-weight: 800; }
.pin-v { display: flex; gap: 12px; margin-top: 12px; padding: 10px; border-radius: 16px; background: var(--ac-ll); align-items: center; }
.pin-v .th { position: relative; width: 132px; flex: none; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--bg2); }
.pin-v .th img { width: 100%; height: 100%; object-fit: cover; }
.pin-v .th i { position: absolute; inset: 0; display: grid; place-items: center; }
.pin-v .th i::before { content: ''; width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 253, 247, .92); }
.pin-v .th i::after { content: ''; position: absolute; border-left: 11px solid var(--ac-d); border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 4px; }
.pin-v b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; line-height: 1.45; }
.pin-v span { display: block; margin-top: 3px; font-size: 12px; color: var(--ink2); }
@media (min-width: 900px) { .pin { display: flex; gap: 20px; align-items: center; } .pin-h { flex: 1; } .pin-v { margin-top: 0; flex: 1.3; } }

/* 今天就這部 */
.hero { margin: 18px 16px 0; display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: 0 4px 0 var(--sh); }
.hero-th { position: relative; aspect-ratio: 16 / 9; background: var(--bg2); overflow: hidden; }
.hero-th img { width: 100%; height: 100%; object-fit: cover; transition: opacity .35s; }
.hero-th .stamp { position: absolute; left: 12px; top: 12px; padding: 4px 12px; border-radius: 999px; background: var(--card); color: var(--ac-d); font-size: 12px; font-weight: 800; letter-spacing: 1px; }
.hero-in { padding: 14px 16px 16px; }
.hero-t { font-size: 20px; font-weight: 700; line-height: 1.35; }
.hero-s { margin-top: 4px; color: var(--ink2); font-size: 13px; }
.hero-b { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
@media (min-width: 900px) { .hero { grid-template-columns: 1.4fr 1fr; align-items: center; } .hero-in { padding: 24px 28px; } .hero-t { font-size: 24px; } }
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 999px; background: var(--ac); color: #fff; font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 var(--ac-d); transition: transform .15s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ac-d); }
.btn.ghost { background: var(--card); color: var(--ac-d); border: 1.5px solid var(--ac-l); box-shadow: none; }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.spin { display: inline-block; transition: transform .5s; }
.spinning .spin { transform: rotate(360deg); }

/* 標籤 */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 7px 15px; border-radius: 999px; background: var(--card); border: 1px solid var(--line2); color: var(--ink2); font-size: 13.5px; font-weight: 700; transition: background .2s, color .2s; }
.chips button.on { background: var(--ac); border-color: var(--ac); color: #fff; }
.ph { padding: 8px 16px 6px; }
.ph h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
.ph p { margin: 2px 0 0; color: var(--ink2); font-size: 13.5px; }
.empty { margin: 30px 16px; padding: 28px 18px; text-align: center; border: 1.5px dashed var(--line2); border-radius: 20px; color: var(--ink2); }
.empty b { display: block; font-family: "Noto Serif TC", serif; font-size: 17px; color: var(--ink); margin-bottom: 4px; }
.foot { margin: 30px 16px 10px; text-align: center; color: var(--mute); font-size: 12px; }
.loadmore { display: block; margin: 16px auto 0; }

/* 設定 */
.set { margin: 12px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.set-r { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
.set-r:first-child { border-top: 0; }
.set-r > span:first-child { flex: 1; min-width: 0; }
.set-r .seg { flex: none; }
.set-r small { display: block; color: var(--mute); font-size: 12px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--bg2); }
.seg button { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--ac-d); box-shadow: 0 1px 0 var(--line2); }
input[type=range] { width: 120px; accent-color: var(--ac); }

/* 播放器 */
#player { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--bg); transform: translateY(100%); transition: transform .38s cubic-bezier(.2, .8, .2, 1); }
#player.in { transform: none; }
.pl-bar { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; }
.pl-x { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); }
.pl-x svg { width: 24px; height: 24px; }
#plTitle { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-yt { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line2); font-size: 12.5px; font-weight: 800; color: var(--ink2); }
.pl-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #1f1c1c; flex: none; }
.pl-frame.tall { aspect-ratio: 9 / 16; height: min(62vh, 620px); width: auto; margin: 0 auto; border-radius: 16px; overflow: hidden; }
#ytp, .pl-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pl-msg { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 20px; background: rgba(31, 28, 28, .92); color: #fff; text-align: center; }
.pl-msg b { display: block; font-size: 17px; margin-bottom: 6px; }
.pl-msg p { margin: 0 0 14px; font-size: 13.5px; opacity: .85; }
.pl-next { position: absolute; z-index: 3; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--card); color: var(--ink); max-width: min(92%, 380px); box-shadow: 0 3px 0 var(--sh); }
.pl-next img { width: 92px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; flex: none; }
.pl-next b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.35; }
.pl-next small { display: block; color: var(--ac-d); font-weight: 800; font-size: 12px; }
.pl-body { flex: 1; overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.pl-h { font-family: "Noto Serif TC", serif; font-size: 19px; font-weight: 700; line-height: 1.4; }
.pl-sub { margin-top: 4px; color: var(--ink2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pl-acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.pl-acts .on { background: var(--ac-ll); color: var(--ac-d); border-color: var(--ac); }
.eps { margin-top: 18px; }
.eps h3 { margin: 0 0 8px; font-family: "Noto Serif TC", serif; font-size: 16px; }
.ep-list { display: grid; gap: 8px; }
.ep { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.ep.cur { border-color: var(--ac); background: var(--ac-ll); }
.ep img { width: 104px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 9px; flex: none; background: var(--bg2); }
.ep span { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; }
.ep span b { display: block; color: var(--ac-d); font-size: 12px; }
.ep span i { font-style: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ep.seen span i { color: var(--mute); }
@media (min-width: 900px) {
  #player { inset: 4vh 0 auto; margin: 0 auto; width: min(1100px, 94vw); height: 92vh; border-radius: 24px; border: 1px solid var(--line2); box-shadow: 0 6px 0 var(--sh); }
  #player.in { transform: none; }
  .pl-frame { width: auto; margin: 0 16px; border-radius: 16px; overflow: hidden; }
}
@media (orientation: landscape) and (max-height: 520px) {
  #player { flex-direction: row; flex-wrap: wrap; }
  .pl-bar { width: 100%; padding-top: 6px; padding-bottom: 4px; }
  .pl-frame { width: 58%; height: calc(100vh - 54px); aspect-ratio: auto; margin-left: env(safe-area-inset-left); }
  .pl-frame.tall { width: auto; aspect-ratio: 9 / 16; height: calc(100vh - 54px); max-height: none; }
  .pl-body { flex: 1; height: calc(100vh - 54px); padding-top: 4px; }
}
html.watching body { overflow: hidden; }

/* 底部選單（搜尋、第一次問 Premium） */
#sheet { position: fixed; inset: 0; z-index: 50; background: rgba(46, 40, 40, .32); display: flex; align-items: flex-end; justify-content: center; }
.sh-in { width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
#sheet.in .sh-in { transform: none; }
@media (min-width: 900px) { #sheet { align-items: center; } .sh-in { border-radius: 26px; } }
.sh-in h2 { margin: 0 0 4px; font-family: "Noto Serif TC", serif; font-size: 20px; }
.sh-in p { margin: 0 0 14px; color: var(--ink2); font-size: 14px; }
.ask { display: grid; gap: 10px; }
.ask button { text-align: left; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1.5px solid var(--line2); }
.ask button b { display: block; font-size: 15px; }
.ask button span { font-size: 13px; color: var(--ink2); }
.ask button:active { border-color: var(--ac); }
.search { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--ac-l); }
.search input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: var(--ink); }
.sr { margin-top: 14px; display: grid; gap: 8px; }

#toast { position: fixed; z-index: 60; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13.5px; font-weight: 700; white-space: nowrap; animation: pop .25s ease; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } }

/* 換色的那一下 */

/* ---- sound.js ---- */
'use strict';
/* 一集就好 — 配樂與音效（Web Audio 即時合成）
   溫柔的 lo-fi：電鋼琴和弦、木琴旋律、圓圓的低音、很輕的大鼓。
   規則：不用任何白噪音（沒有黑膠底噪、腳踏鈸、噪音小鼓、雨聲）；影片一播就停，收起播放器再慢慢回來。 */
const Snd = (() => {
  let ctx = null, master = null, bus = null, timer = 0, on = false, ducked = false, step = 0, nextT = 0, vol = 0.35, skin = 'matcha';
  const BPM = 74, SPB = 60 / BPM / 2;          // 一格＝八分音符
  const PROG = {
    matcha: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]],      // Fmaj7 Em7 Dm7 Cmaj7
    rose: [[51, 55, 58, 62], [50, 53, 57, 60], [48, 51, 55, 58], [46, 50, 53, 57]],        // Ebmaj7 Dm7 Cm7 Bbmaj7
  };
  const SCALE = { matcha: [72, 74, 76, 79, 81, 84], rose: [70, 72, 74, 77, 79, 82] };
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.4;
    bus = ctx.createGain();
    bus.gain.value = 1;
    bus.connect(lp); lp.connect(comp); comp.connect(master); master.connect(ctx.destination);
    return true;
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function voice(type, f, t, a, peak, d, dest) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    env(g, t, a, peak, d);
    o.connect(g); g.connect(dest || bus);
    o.start(t); o.stop(t + a + d + 0.05);
  }
  function chord(notes, t) {
    for (const m of notes) {
      voice('triangle', hz(m), t, 0.04, 0.035, 2.6);
      voice('sine', hz(m) * 1.003, t, 0.06, 0.03, 3.0);
      voice('sine', hz(m + 12), t, 0.01, 0.008, 0.9);        // 電鋼琴的「叮」
    }
  }
  function pluck(m, t, peak) {
    voice('sine', hz(m), t, 0.005, peak, 0.7);
    voice('sine', hz(m) * 4, t, 0.002, peak * 0.18, 0.12);  // 木琴的木頭聲
  }
  function bass(m, t) { voice('sine', hz(m - 12), t, 0.02, 0.09, 0.9); }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(110, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.18);
    env(g, t, 0.004, 0.16, 0.24);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + 0.3);
  }
  let lastNote = 2;
  function tick() {
    if (!ctx) return;
    while (nextT < ctx.currentTime + 0.25) {
      const bar = Math.floor(step / 8), s = step % 8, prog = PROG[skin] || PROG.matcha;
      const ch = prog[bar % prog.length];
      if (s === 0) { chord(ch, nextT); bass(ch[0], nextT); kick(nextT); }
      if (s === 4) { bass(ch[0] + 7, nextT); kick(nextT); }
      if (s === 6 && Math.random() < 0.35) bass(ch[0] + 5, nextT);
      // 旋律：多數格子留白，只在偶爾冒出一兩個音
      const want = (s % 2 === 0 ? 0.42 : 0.16) * (bar % 4 === 3 ? 0.5 : 1);
      if (Math.random() < want) {
        const sc = SCALE[skin] || SCALE.matcha;
        lastNote = Math.max(0, Math.min(sc.length - 1, lastNote + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]));
        pluck(sc[lastNote], nextT + (s % 2 ? 0.02 : 0), 0.05 + Math.random() * 0.02);
      }
      nextT += SPB;
      step++;
    }
  }
  function level() {
    if (!master) return;
    const target = on && !ducked ? vol * 0.9 : 0.0001;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(target, ctx.currentTime, ducked ? 0.25 : 1.2);
  }
  return {
    get on() { return on; },
    start() {
      if (!init()) return;
      if (ctx.state === 'suspended') ctx.resume();
      on = true;
      if (!timer) { nextT = ctx.currentTime + 0.1; step = 0; timer = setInterval(tick, 90); }
      level();
    },
    stop() {
      on = false; level();
      clearTimeout(this._st);
      this._st = setTimeout(() => { if (!on) { clearInterval(timer); timer = 0; } }, 3000);
    },
    duck(d) { ducked = !!d; level(); },
    setVol(v) { vol = Math.max(0, Math.min(1, v)); level(); },
    setSkin(s) { skin = s; },
    tap() { if (!init() || !SET.sfx) return; if (ctx.state === 'suspended') ctx.resume(); const t = ctx.currentTime; const g = ctx.createGain(); g.gain.value = 0.6; g.connect(ctx.destination); voice('sine', 880, t, 0.003, 0.05, 0.12, g); },
    pop() { if (!init() || !SET.sfx) return; const t = ctx.currentTime; const g = ctx.createGain(); g.gain.value = 0.7; g.connect(ctx.destination); voice('sine', 660, t, 0.004, 0.06, 0.18, g); voice('sine', 990, t + 0.07, 0.004, 0.05, 0.25, g); },
    chime() { if (!init() || !SET.sfx) return; const t = ctx.currentTime; const g = ctx.createGain(); g.gain.value = 0.7; g.connect(ctx.destination); [0, 4, 7, 12].forEach((k, i) => voice('sine', hz((skin === 'rose' ? 75 : 77) + k), t + i * 0.07, 0.004, 0.045, 0.5, g)); },
  };
})();

function hash32(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ------------------------------------------------------------ 題材 */
const GENRES = [
  ['甜寵', /甜寵|甜宠|寵妻|宠妻|戀|恋|嫁|老公|老婆|夫人|王妃|萌寶|萌宝|團寵|团宠|閃婚|闪婚|追妻/],

  ['修仙', /修仙|仙尊|仙帝|渡劫|築基|筑基|元嬰|元婴|靈根|灵根|宗門|宗门|飛升|飞升|仙門|仙门/],

const genreMemo = new Map();
function genreOf(t) {
  if (!genreMemo.has(t)) genreMemo.set(t, GENRES.filter(([, rx]) => rx.test(t || '')).map(([g]) => g).slice(0, 2));
  return genreMemo.get(t);
}

/* ------------------------------------------------------------ 片庫 */
const D = { cat: null, mine: null, err: null };
const IDX = { vids: [], byId: new Map(), ch: {}, shows: [], showById: new Map() };

function indexCat() {
  const c = D.cat || {};
  const chs = c.chs || [];
  const keep = new Set();
  IDX.ch = {};
  (c.ch || []).forEach((x, i) => {
    const k = x.k === 'auto' ? 'ai' : x.k;
    if (AI_KINDS[k]) { keep.add(i); IDX.ch[chs[i]] = { id: chs[i], n: x.n, a: x.a, k }; }
  });
  const all = c.vids || [];
  const pos = new Map();
  IDX.vids = [];
  all.forEach((a, n) => {
    if (!keep.has(a[1])) return;
    const f = a[6] || 'e';
    if (f !== 'c' && f !== 'e' && f !== 'm' && f !== 's') return;
    const v = { i: a[0], c: chs[a[1]], t: a[2], d: a[3] || 0, p: a[4] || 0, v: a[5] || 0, f, ne: !!((a[7] | 0) & F_NE), show: -1, e: a[9] || 0, r: a[10] && a[11] ? [a[10], a[11]] : null };
    pos.set(n, v);
    IDX.vids.push(v);
  });
  IDX.byId = new Map(IDX.vids.map((v) => [v.i, v]));
  IDX.shows = [];
  for (const s of c.shows || []) {
    const ch = chs[s.c];
    if (!IDX.ch[ch]) continue;
    const eps = (s.eps || []).map((x) => pos.get(x)).filter(Boolean);
    if (!eps.length) continue;
    const k = IDX.shows.length;
    const o = { id: s.id, n: s.n, c: ch, eps, t: s.t || 0, cover: pos.get(s.cv) || eps[0], k };
    eps.forEach((v) => { if (v.show < 0) v.show = k; });
    IDX.shows.push(o);
  }
  IDX.showById = new Map(IDX.shows.map((s) => [s.id, s]));
  MEMO.clear();
}
const showOf = (v) => (v && v.show >= 0 ? IDX.shows[v.show] : null);
const chOf = (c) => IDX.ch[c] || { n: '' };
function epLabel(v) {
  if (v.r) return '第 ' + v.r[0] + '–' + v.r[1] + ' 集';
  const s = showOf(v);
  if (v.e) return '第 ' + v.e + ' 集';
  if (s && s.eps.length > 1) { const k = s.eps.indexOf(v); if (k >= 0) return '第 ' + (k + 1) + ' 集'; }

function titleParts(v) {
  const s = showOf(v);
  if (s) return { name: s.n, rest: v.t && v.t !== s.n ? v.t : '' };
  const m = /《([^《》]{2,40})》/.exec(v.t || '');
  if (m) return { name: m[1], rest: (v.t.slice(0, m.index) + ' ' + v.t.slice(m.index + m[0].length)).replace(/^[\s｜|:：,，、]+|[\s｜|:：,，、]+$/g, '').replace(/\s{2,}/g, ' ') };

async function getJSON(url) {
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 300000), { cache: 'no-cache' });
  if (!r.ok) throw new Error('HTTP ' + r.status);

}

  if (cat.status === 'fulfilled') { D.cat = cat.value; store.set('catAt', D.cat.at); D.err = null; } else D.err = cached ? null : '片單暫時讀不到，等一下再試試看。';

/* ------------------------------------------------------------ 清單 */
const MEMO = new Map();
const memo = (k, fn) => { if (!MEMO.has(k)) MEMO.set(k, fn()); return MEMO.get(k); };
function heat(v) {
  const age = Math.max(0, nowS() - (v.p || nowS())) / 86400;
  return Math.log10(10 + (v.v || 0)) + (age < 3 ? 1 : age < 14 ? 0.5 : age < 60 ? 0.15 : 0);
}
const byHeat = (a, b) => heat(b) - heat(a);
/* 同一部作品只放一支、同一台不要連續 */
function tidy(list, perShow = 1) {
  const seen = new Map(), out = [];
  for (const v of list) {
    const key = v.show >= 0 ? 's' + v.show : v.i;
    const n = seen.get(key) || 0;
    if (n >= perShow) continue;
    seen.set(key, n + 1);
    out.push(v);
  }
  const res = [];
  while (out.length) {
    let k = out.findIndex((x) => res.slice(-3).filter((o) => o.c === x.c).length < 2);
    if (k < 0) k = 0;
    res.push(out.splice(k, 1)[0]);
  }
  return res;
}
const L = {
  comps: () => memo('comps', () => tidy(IDX.vids.filter((v) => (v.f === 'c' || v.f === 'm') && v.d >= 40 * 60).sort(byHeat))),
  fresh: () => memo('fresh', () => tidy(IDX.vids.filter((v) => v.f !== 's' && nowS() - v.p < 14 * 86400).sort((a, b) => b.p - a.p), 2)),
  shorts: () => memo('shorts', () => tidy(IDX.vids.filter((v) => v.f === 's').sort(byHeat), 2)),
  shows: () => memo('shows', () => IDX.shows.filter((s) => s.eps.length >= 3).map((s) => [s, Math.log10(10 + s.eps.reduce((t, v) => t + (v.v || 0), 0)) + (nowS() - s.t < 7 * 86400 ? 0.8 : 0)]).sort((a, b) => b[1] - a[1]).map((x) => x[0])),

/* ------------------------------------------------------------ 播放器 */
const Player = (() => {

    const v = IDX.byId.get(id) || mineVideo(id);
    if (!v) return;
    try { if (yt && ready && cur) note(yt.getCurrentTime(), yt.getDuration()); } catch (e) { /* */ }
    if (!list.includes(id) && !showOf(v)) list = [id];
    history.replaceState(null, '', '#w/' + id);
    Snd.tap();
    play(v);
  }
  return {
    get isOpen() { return open_; },
    get cur() { return cur; },
    open(id, ctx) {
      const v = IDX.byId.get(id) || mineVideo(id);
      if (!v) return false;
      list = (ctx && ctx.length ? ctx : [id]).slice(0, 120);
      if (!list.includes(id)) list.unshift(id);
      if (!open_) {
        open_ = true;
        const p = $('#player');
        p.hidden = false;
        document.documentElement.classList.add('watching');
        requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('in')));
        Snd.duck(true);
      }
      play(v);
      return true;
    },
    close() {
      if (!open_) return;
      try { if (yt && ready) { note(yt.getCurrentTime(), yt.getDuration()); yt.pauseVideo(); } } catch (e) { /* */ }
      clearInterval(tickT); hideNext();
      open_ = false;
      const p = $('#player');
      p.classList.remove('in');
      document.documentElement.classList.remove('watching');
      setTimeout(() => { if (!open_) p.hidden = true; }, 400);
      Snd.duck(false);
      render();
    },
    take, hideNext, body: () => cur && body(),
  };
})();
/* 站長頻道的影片（不在 AI 片庫裡） */
function mineVideo(id) {
  for (const ch of (D.mine && D.mine.ch) || []) {
    const it = (ch.items || []).find((x) => x.i === id);
    if (it) return { i: it.i, c: '_mine', t: it.tz || it.t, d: it.d || 0, p: it.p || 0, v: it.v || 0, f: 'e', ne: !!it.ne, show: -1, e: 0, r: null, mine: 1 };
  }
  return null;
}
IDX.ch._mine = { n: MY_CH.n };

/* ------------------------------------------------------------ 第一次在 iPhone 點影片：問有沒有 Premium */
function sheet(html) {
  const s = $('#sheet');
  $('#sheetIn').innerHTML = html;
  s.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('in')));
}
function closeSheet() { const s = $('#sheet'); s.classList.remove('in'); setTimeout(() => { s.hidden = true; }, 320); }
let pendingWatch = null;
function askPremium(id, ctx) {
  pendingWatch = [id, ctx];
  sheet(`<h2>先問一件小事</h2><p>你有 YouTube Premium 嗎？iPhone 的關係，有 Premium 的話交給 YouTube App 播才不會有廣告。</p>
    <div class="ask"><button data-act="ask" data-v="yt"><b>有，交給 YouTube App</b><span>沒廣告、可以背景播放；這裡會記得你看過哪幾集</span></button>
    <button data-act="ask" data-v="app"><b>沒有，在這裡看就好</b><span>會記住看到第幾分鐘，下次接著看</span></button></div>
    <p style="margin:14px 0 0;font-size:12.5px">之後可以在「收藏」頁的設定隨時改。</p>`);
}
function watch(id, ctx) {
  const v = IDX.byId.get(id) || mineVideo(id);
  if (!v) return;
  if (IS_IOS && !SET.asked && !v.ne) { askPremium(id, ctx); return; }
  if (SET.play === 'yt' || v.ne) {
    window.open(ytUrl(id, (HIST[id] || [])[1]), '_blank');
    countToday(id);
    HIST[id] = [Date.now(), (HIST[id] || [])[1] || 0, v.d, (HIST[id] || [])[3] || 0];
    store.set('hist', HIST);
    Snd.tap();
    setTimeout(render, 300);
    return;
  }
  history.pushState({ om: 1 }, '', '#w/' + id);
  Player.open(id, ctx);
}

/* ------------------------------------------------------------ 搜尋 */
function openSearch() {
  sheet(`<div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><input id="q" type="search" placeholder="找片名，例如：重生、王妃、修仙" autocomplete="off"></div><div class="sr" id="sr"><p>輸入片名或關鍵字。</p></div>`);
  setTimeout(() => { const q = $('#q'); if (q) q.focus(); }, 350);
}
function runSearch(q) {
  q = q.trim().toLowerCase();
  const box = $('#sr');
  if (!box) return;
  if (!q) { box.innerHTML = '<p>輸入片名或關鍵字。</p>'; return; }
  const shows = IDX.shows.filter((s) => s.eps.length > 1 && s.n.toLowerCase().includes(q)).slice(0, 6);
  const vids = tidy(IDX.vids.filter((v) => v.f !== 's' && (v.t || '').toLowerCase().includes(q)).sort(byHeat)).slice(0, 18);
  const ctx = ctxOf('search', vids);
  box.innerHTML = (shows.length || vids.length) ? `<div class="grid" style="padding:0">${shows.map(scard).join('')}${vids.map((v) => vcard(v, ctx)).join('')}</div>` : '<p>找不到，換個關鍵字試試。</p>';
}

/* ------------------------------------------------------------ 路由 */
let ROUTE = 'home';
function parse() { return (location.hash || '#home').slice(1); }
function render() {
  const r = ROUTE, [base, sub] = r.split('/');
  const v = $('#view');
  let h;
  if (base === 'browse') h = vBrowse(sub);
  else if (base === 'saved') h = vSaved();
  else h = vHome();
  v.innerHTML = h;
  $$('#tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === (base === 'browse' || base === 'saved' ? base : 'home')));
}
function route() {
  const r = parse();
  if (r.startsWith('w/')) {
    const id = r.slice(2);
    if (!Player.isOpen || !Player.cur || Player.cur.i !== id) {
      if (!Player.open(id, CTX.get(PENDING_CTX) || [id])) { history.replaceState(null, '', '#' + ROUTE); }
    }
    return;
  }
  if (r.startsWith('s/')) {
    const s = IDX.showById.get(decodeURIComponent(r.slice(2)));
    history.replaceState(null, '', '#' + ROUTE);
    if (s) { const v = s.eps.find((e) => !(HIST[e.i] && HIST[e.i][3])) || s.eps[0]; watch(v.i, s.eps.map((e) => e.i)); }
    return;
  }
  if (Player.isOpen) Player.close();
  const changed = r !== ROUTE;
  ROUTE = r;
  render();
  if (changed) window.scrollTo(0, 0);
}
let PENDING_CTX = '';

/* ------------------------------------------------------------ 換色 */
function applySkin(s, x, y) {
  document.documentElement.dataset.skin = s;
  Snd.setSkin(s);
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.content = s === 'rose' ? '#f7efe9' : '#f3efe4';
  if (x != null) {
    let w = $('#swirl');
    if (!w) { w = document.createElement('i'); w.id = 'swirl'; document.body.appendChild(w); }
    w.style.left = (x - 20) + 'px'; w.style.top = (y - 20) + 'px';
    w.style.background = s === 'rose' ? '#f2d9d8' : '#d7e5d4';
    w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
  }
}

/* ------------------------------------------------------------ 事件 */
function firstTouch() {
  if (SET.music) { Snd.setVol(SET.vol); Snd.start(); if (Player.isOpen) Snd.duck(true); }
  $('#btnMusic').classList.toggle('on', SET.music);
}
document.addEventListener('pointerdown', function once() { document.removeEventListener('pointerdown', once, true); firstTouch(); }, true);
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  const link = e.target.closest('a[href]');
  if (!a && link) {
    const href = link.getAttribute('href');
    if (href.startsWith('#w/')) {
      e.preventDefault();
      if ($('#sheet').classList.contains('in')) closeSheet();
      const id = href.slice(3);
      const ctx = link.dataset.mine ? [id] : (CTX.get(link.dataset.ctx || '') || [id]);
      watch(id, ctx);
      return;
    }
    if (href.startsWith('#s/') && $('#sheet').classList.contains('in')) closeSheet();
    if (link.target === '_blank') Snd.tap();
    return;
  }
  if (!a) { if (e.target.id === 'sheet') closeSheet(); return; }
  const act = a.dataset.act;
  switch (act) {
    case 'close':
      if (history.state && history.state.om) history.back();
      else { history.replaceState(null, '', '#' + ROUTE); route(); }
      break;
    case 'take': e.preventDefault(); Player.take(a.dataset.v); break;
    case 'nx-x': Player.hideNext(); break;
    case 'fav': {
      const k = a.dataset.k;
      if (FAV[k]) delete FAV[k]; else { FAV[k] = Date.now(); Snd.pop(); toast('收進收藏了'); }
      store.set('fav', FAV);
      Player.body();
      break;
    }
    case 'reroll': {
      heroShift++;
      const h = $('#hero');
      if (h) { const tmp = document.createElement('div'); tmp.innerHTML = heroHtml(); h.replaceWith(tmp.firstElementChild); $('#hero').classList.add('spinning'); }
      Snd.pop();
      break;
    }
    case 'fmt': BF.fmt = a.dataset.k; BF.limit = 40; history.replaceState(null, '', '#browse/' + BF.fmt); ROUTE = 'browse/' + BF.fmt; Snd.tap(); render(); break;
    case 'genre': BF.g = a.dataset.k; BF.limit = 40; Snd.tap(); render(); break;
    case 'len': BF.len = a.dataset.k; BF.limit = 40; Snd.tap(); render(); break;
    case 'more': BF.limit += 40; render(); break;
    case 'set': {
      const k = a.dataset.k;
      let v = a.dataset.v;
      if (v === 'true') v = true; else if (v === 'false') v = false;
      SET[k] = v;
      if (k === 'play') SET.asked = true;
      saveSet();
      if (k === 'skin') { applySkin(v, e.clientX, e.clientY); Snd.chime(); }
      if (k === 'music') { if (v) { Snd.setVol(SET.vol); Snd.start(); } else Snd.stop(); $('#btnMusic').classList.toggle('on', v); }
      if (k !== 'skin') Snd.tap();
      render();
      break;
    }
    case 'clear': Object.keys(HIST).forEach((k) => delete HIST[k]); store.set('hist', HIST); CNT.n = 0; CNT.ids = []; store.set('cnt', CNT); toast('紀錄清掉了'); render(); break;
    case 'ask': {
      SET.play = a.dataset.v; SET.asked = true; saveSet();
      closeSheet();
      const p = pendingWatch; pendingWatch = null;
      if (p) setTimeout(() => watch(p[0], p[1]), 50);
      break;
    }
    default: break;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.act === 'vol') { SET.vol = e.target.value / 100; saveSet(); Snd.setVol(SET.vol); }
  if (e.target.id === 'q') { clearTimeout(runSearch._t); runSearch._t = setTimeout(() => runSearch(e.target.value), 180); }
});
$('#btnSearch').addEventListener('click', () => { Snd.tap(); openSearch(); });
$('#btnSkin').addEventListener('click', (e) => { SET.skin = SET.skin === 'rose' ? 'matcha' : 'rose'; saveSet(); applySkin(SET.skin, e.clientX, e.clientY); Snd.chime(); toast(SET.skin === 'rose' ? '換成乾燥玫瑰' : '換成抹茶綠'); if (ROUTE.startsWith('saved')) render(); });
$('#btnMusic').addEventListener('click', () => {
  SET.music = !SET.music; saveSet();
  if (SET.music) { Snd.setVol(SET.vol); Snd.start(); toast('音樂開了'); } else { Snd.stop(); toast('音樂關了'); }
  $('#btnMusic').classList.toggle('on', SET.music);
  if (ROUTE.startsWith('saved')) render();
});
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => { document.documentElement.classList.toggle('scrolled', window.scrollY > 8); }, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) Snd.duck(true);
  else { if (!Player.isOpen) Snd.duck(false); if (Date.now() - (D.loadedAt || 0) > 20 * 60e3) refresh(); }
});
async function refresh() {
  await load();
  D.loadedAt = Date.now();
  if (!Player.isOpen) render();
}

/* ------------------------------------------------------------ 開始 */
applySkin(SET.skin);
if (SET.play == null) SET.play = 'app';
ROUTE = parse().startsWith('w/') || parse().startsWith('s/') ? 'home' : parse();
render();
refresh().then(() => { if (parse().startsWith('w/') || parse().startsWith('s/')) route(); });
if (window.OM_WEB && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
</body>
