/* 觀戰 SPECTATE — 電競賽事轉播風：黑底、斜切字卡、直播紅燈、導播台的 PGM 紅與 PVW 綠 */
:root {
  --bg: #06070b; --bg2: #0a0d15; --panel: #0f131d; --panel2: #151a27; --panel3: #1c2232;
  --line: rgba(255, 255, 255, .07); --line2: rgba(255, 255, 255, .14);
  --ink: #f2f4fa; --dim: #a1a9bd; --mute: #687088;
  --red: #ff2d55; --red2: #d3123d; --gold: #ffc229; --cyan: #35d3ff; --green: #34e39a; --violet: #ab86ff; --orange: #ff8a2b; --ice: #dfe7ff; --lime: #c4ff3d;
  --pvw: #2bf07a;
  --f-num: 'Teko', 'Chakra Petch', 'Arial Narrow', sans-serif;
  --f-lat: 'Chakra Petch', system-ui, sans-serif;
  --f-zh: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Heiti TC', system-ui, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --toph: 50px; --tkh: 26px; --tabh: 60px; --rail: 0px;
  --pad: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--f-zh); font-size: 15px; line-height: 1.45; overscroll-behavior-y: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; }
input { font: inherit; color: inherit; }
code { font-family: ui-monospace, Menlo, monospace; background: var(--panel3); padding: 1px 6px; border-radius: 3px; }
.red { color: var(--red); } .gold { color: var(--gold); } .lime { color: var(--lime); } .green { color: var(--green); }
html.watching body { overflow: hidden; }

/* ---------------- 背景：場館光束＋細斜紋 ---------------- */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: radial-gradient(120% 70% at 50% -10%, #141a2b 0%, var(--bg) 60%); }
#bg .beam { position: absolute; top: -40vh; width: 34vmax; height: 180vh; opacity: .5; transform-origin: 50% 0; will-change: transform; }
#bg .b1 { left: 8%; background: linear-gradient(180deg, rgba(255, 45, 85, .22), rgba(255, 45, 85, 0) 70%); transform: rotate(24deg); animation: beam1 16s ease-in-out infinite alternate; }
#bg .b2 { left: 52%; background: linear-gradient(180deg, rgba(223, 231, 255, .13), rgba(223, 231, 255, 0) 62%); transform: rotate(-20deg); animation: beam2 19s ease-in-out infinite alternate; }
#bg .b3 { left: 78%; background: linear-gradient(180deg, rgba(53, 211, 255, .12), rgba(53, 211, 255, 0) 60%); transform: rotate(-34deg); animation: beam3 23s ease-in-out infinite alternate; }
@keyframes beam1 { to { transform: rotate(8deg) translateX(8vw); } }
@keyframes beam2 { to { transform: rotate(-4deg) translateX(-10vw); } }
@keyframes beam3 { to { transform: rotate(-18deg) translateX(-6vw); } }
#bg .pin { position: absolute; inset: 0; background: repeating-linear-gradient(-60deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 9px); }
.fx-lite #bg .beam { animation: none; }

/* ---------------- 頂列：比分條式台標 ---------------- */
#top { position: fixed; z-index: 30; top: 0; left: 0; right: 0; height: calc(var(--toph) + var(--st)); padding: var(--st) calc(10px + var(--sr)) 0 calc(10px + var(--sl) + var(--rail)); display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(6, 7, 11, .97) 70%, rgba(6, 7, 11, .9)); }
.bug { display: flex; align-items: stretch; height: 30px; transform: skewX(-12deg); margin-left: 4px; }
.bug > span { display: flex; align-items: center; padding: 0 9px; }
.bug > span > * { transform: skewX(12deg); }
.bug-logo { background: #fff; color: #07080d; font-weight: 900; font-size: 17px; letter-spacing: 2px; }
.bug-en { background: var(--red); color: #fff; font-family: var(--f-num); font-size: 19px; font-weight: 600; letter-spacing: 2px; padding-top: 3px !important; }
.bug-clock { background: #151a27; color: var(--ice); font-family: var(--f-num); font-size: 20px; letter-spacing: 1px; padding-top: 3px !important; min-width: 54px; justify-content: center; }
.bug .bug-logo, .bug .bug-en, .bug .bug-clock { transform: none; }
.onair { display: flex; align-items: center; gap: 6px; padding: 3px 9px 1px; background: rgba(255, 45, 85, .14); border: 1px solid rgba(255, 45, 85, .5); color: #ff7894; font-family: var(--f-num); font-size: 17px; letter-spacing: 1.5px; transform: skewX(-12deg); }
.onair i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1.2s steps(2) infinite; }
.onair b { color: #fff; font-weight: 600; }
@keyframes blink { 50% { opacity: .25; } }
.top-sp { flex: 1; }
.ico-btn { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ice); border-radius: 50%; }
.ico-btn svg { width: 22px; height: 22px; fill: currentColor; }
.ico-btn:active { background: var(--panel3); }
.sync { width: 34px; height: 40px; display: grid; place-items: center; }
.sync i { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(52, 227, 154, .16); }
.sync.wait i { background: var(--gold); box-shadow: 0 0 0 3px rgba(255, 194, 41, .18); animation: blink 1.4s steps(2) infinite; }
.sync.bad i { background: var(--red); box-shadow: 0 0 0 3px rgba(255, 45, 85, .2); }

/* ---------------- 跑馬燈 ---------------- */
#ticker { position: fixed; z-index: 29; left: 0; right: 0; top: calc(var(--toph) + var(--st)); height: var(--tkh); padding-left: var(--rail); background: #0b0e16; border-top: 1px solid var(--line); border-bottom: 1px solid rgba(255, 45, 85, .35); overflow: hidden; white-space: nowrap; }
.tk-in { height: 100%; display: flex; align-items: center; font-size: 12.5px; color: var(--dim); }
.tk-run { display: inline-flex; align-items: center; gap: 14px; padding-left: 14px; animation: tk var(--tk, 40s) linear infinite; will-change: transform; }
@keyframes tk { to { transform: translate3d(-50%, 0, 0); } }
.tk-run b { color: #fff; font-family: var(--f-num); font-size: 16px; font-weight: 600; }
.tk-lbl { color: #fff; font-weight: 800; }
.tk-red { color: #ff6b88; font-weight: 800; }
.tk-lime { color: var(--lime); font-weight: 700; }
.tk-dim { color: var(--mute); }
.tk-sep { color: var(--red); font-style: normal; font-size: 9px; }
.fx-lite .tk-run { animation-duration: calc(var(--tk, 40s) * 1.6); }

/* ---------------- 主畫面 ---------------- */
#view { position: relative; z-index: 1; min-height: 100vh; padding: calc(var(--toph) + var(--tkh) + var(--st)) 0 calc(var(--tabh) + var(--sb) + 28px) var(--rail); outline: none; }
#view.enter > * { animation: rise .42s cubic-bezier(.2, .8, .2, 1) both; }
#view.enter > *:nth-child(2) { animation-delay: .04s; } #view.enter > *:nth-child(3) { animation-delay: .08s; } #view.enter > *:nth-child(4) { animation-delay: .12s; } #view.enter > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translate3d(0, 14px, 0); } }
.fx-lite #view.enter > * { animation: none; }

/* 段落標題：斜切字卡 */
.sec { margin: 22px 0 6px; }
.sh { display: flex; align-items: center; gap: 10px; padding: 0 var(--pad); margin-bottom: 10px; }
.sh h2 { margin: 0; display: flex; align-items: baseline; gap: 8px; position: relative; padding-left: 14px; white-space: nowrap; flex: 0 0 auto; }
.sh h2::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 6px; background: var(--red); transform: skewX(-14deg); }
.sh h2 b { font-size: 19px; font-weight: 900; letter-spacing: .5px; }
.sh h2 i { font-style: normal; font-family: var(--f-num); font-size: 17px; color: var(--mute); letter-spacing: 2px; transform: translateY(1px); }
.sh-note { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.sh-more { margin-left: auto; display: flex; align-items: center; gap: 3px; font-size: 13px; color: var(--dim); padding: 6px 2px 6px 10px; white-space: nowrap; }
.sh-more span { font-size: 18px; color: var(--red); line-height: 1; }

/* 橫向排 */
.row { display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden; padding: 2px var(--pad) 8px; scroll-snap-type: x proximity; scroll-padding: var(--pad); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.row::-webkit-scrollbar { display: none; }
.row > * { scroll-snap-align: start; flex: 0 0 auto; }

/* ---------------- 影片卡 ---------------- */
.vc { width: min(68vw, 290px); display: flex; flex-direction: column; gap: 6px; position: relative; }
.row.big .vc, .vc.big { width: min(84vw, 380px); }
.vc-th { position: relative; display: block; aspect-ratio: 16 / 9; background: var(--panel2); overflow: hidden; clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px); }
.vc-th img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
.vc-th::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--lc); }
.vc:active .vc-th img { transform: scale(1.04); }
@media (hover: hover) { .vc:hover .vc-th img { transform: scale(1.05); } .vc:hover .vc-t { color: #fff; } }
.vc-lane { position: absolute; left: 0; top: 0; padding: 3px 10px 2px 14px; background: var(--lc); color: #07080d; font-style: normal; font-size: 11.5px; font-weight: 900; letter-spacing: 1px; clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 100%, 0 100%); display: flex; align-items: center; gap: 5px; }
.dotlive { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1s steps(2) infinite; display: inline-block; }
.vc-d { position: absolute; right: 6px; bottom: 9px; padding: 1px 6px 0; background: rgba(5, 6, 10, .88); font-style: normal; font-family: var(--f-num); font-size: 16px; line-height: 18px; letter-spacing: .5px; }
.vc-dh { position: absolute; right: 6px; top: 6px; padding: 1px 7px 0; background: var(--lime); color: #0b0d06; font-style: normal; font-family: var(--f-num); font-size: 16px; line-height: 18px; font-weight: 600; transform: skewX(-12deg); }
.vc-rp { position: absolute; left: 6px; bottom: 9px; padding: 1px 6px 0; background: rgba(5, 6, 10, .88); color: var(--dim); font-style: normal; font-family: var(--f-num); font-size: 14px; letter-spacing: 1.5px; }
.vc-new { position: absolute; right: 6px; top: 6px; padding: 1px 6px 0; background: var(--red); font-style: normal; font-family: var(--f-num); font-size: 14px; letter-spacing: 1.5px; }
.vc-dh + .vc-d + .vc-new, .vc-dh ~ .vc-new { top: 30px; }
.vc-pg { position: absolute; left: 0; bottom: 0; height: 3px; width: var(--p); background: var(--red); z-index: 1; }
.vc.seen .vc-th img { opacity: .62; }
.vc-t { font-size: 14.5px; font-weight: 700; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #e9edf7; }
.vc-m { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); min-width: 0; }
.vc-m b { color: var(--dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.vc-m > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vc-lg { margin-left: auto; font-style: normal; font-family: var(--f-num); font-size: 14px; color: var(--mute); border: 1px solid var(--line2); padding: 0 4px; line-height: 16px; }
.vc.more { justify-content: center; align-items: center; aspect-ratio: auto; width: 140px; }
.vc.more span { width: 100%; aspect-ratio: 16 / 12; display: grid; place-items: center; align-content: center; gap: 2px; background: var(--panel); border: 1px dashed var(--line2); font-size: 13px; color: var(--dim); }
.vc.more b { display: block; font-family: var(--f-num); font-size: 34px; color: #fff; font-weight: 600; }
.av { display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden; background: var(--panel3); flex: 0 0 auto; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av-t { background: hsl(var(--h) 45% 32%); color: #fff; font-weight: 900; }
img.noimg { opacity: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(44%, 260px), 1fr)); gap: 18px 12px; padding: 4px var(--pad); }
@media (max-width: 520px) { .grid .vc-t { font-size: 13.5px; } .grid .vc-m b { max-width: 70%; } .grid .vc-m > span { display: none; } .grid .vc-lg { display: none; } }
.grid .vc { width: auto; }

/* ---------------- 焦點（Hero） ---------------- */
.hero { position: relative; margin: 0 0 6px; }
.hero-slides { position: relative; aspect-ratio: 16 / 10; max-height: 64vh; width: 100%; overflow: hidden; background: #000; }
.hs { position: absolute; inset: 0; display: block; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s .6s; }
.hs.on { opacity: 1; visibility: visible; transition: opacity .6s ease; z-index: 2; }
.hs.off { visibility: visible; z-index: 1; }
.hs-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: transform 7.5s linear; }
.hs.on .hs-img { transform: scale(1.0); }
.fx-lite .hs-img { transition: none; transform: none; }
.hs-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 7, 11, .35) 0%, rgba(6, 7, 11, 0) 30%, rgba(6, 7, 11, .25) 55%, rgba(6, 7, 11, .96) 100%), linear-gradient(90deg, rgba(6, 7, 11, .55), rgba(6, 7, 11, 0) 60%); }
.hs-txt { position: absolute; left: var(--pad); right: var(--pad); bottom: 62px; display: flex; flex-direction: column; gap: 8px; }
.hs-kick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hs-kick em { font-style: normal; font-family: var(--f-num); font-size: 17px; letter-spacing: 2px; color: rgba(255, 255, 255, .78); }
.hs-kick .hs-g { font-family: var(--f-zh); font-size: 12px; letter-spacing: 0; padding: 2px 8px; border: 1px solid rgba(255, 255, 255, .3); color: #fff; }
.lane { font-style: normal; display: inline-flex; align-items: center; gap: 5px; padding: 3px 12px 2px 10px; background: var(--lc); color: #07080d; font-size: 12px; font-weight: 900; letter-spacing: 1px; clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 100%, 0 100%); }
.bug-live { font-style: normal; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 0 9px; background: var(--red); color: #fff; font-family: var(--f-num); font-size: 17px; letter-spacing: 2px; clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 100%, 0 100%); }
.hs-title { font-size: clamp(20px, 5.6vw, 34px); font-weight: 900; line-height: 1.22; letter-spacing: .3px; text-shadow: 0 2px 0 rgba(0, 0, 0, .55); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 900px; }
.hs-l3 { display: flex; align-items: stretch; height: 32px; transform: skewX(-12deg); align-self: flex-start; max-width: 100%; }
.hs-l3 > span { display: flex; align-items: center; gap: 7px; padding: 0 12px; }
.hs-l3 .l3a { background: #fff; color: #07080d; font-weight: 900; font-size: 13.5px; min-width: 0; }
.hs-l3 .l3a b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: skewX(12deg); }
.hs-l3 .l3a .av { transform: skewX(12deg); }
.hs-l3 .l3b { background: rgba(9, 11, 18, .92); color: var(--ice); font-size: 12.5px; white-space: nowrap; }
.hero-ctl { position: absolute; z-index: 3; left: var(--pad); right: var(--pad); bottom: 14px; display: flex; align-items: center; gap: 10px; }
.go-btn { display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 20px 0 16px; background: var(--red); color: #fff; font-weight: 900; font-size: 15px; letter-spacing: 1px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: transform .15s; }
.go-btn b { font-size: 13px; }
.go-btn:active { transform: scale(.96); }
.go-btn.sm { height: 36px; font-size: 14px; padding: 0 16px 0 13px; }
.ic-sq { width: 42px; height: 42px; background: rgba(255, 255, 255, .14); color: #fff; font-size: 24px; font-weight: 300; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.hero-dots { margin-left: auto; display: flex; gap: 5px; }
.hero-dots i { width: 22px; height: 16px; display: flex; align-items: center; cursor: pointer; }
.hero-dots i b { display: block; width: 100%; height: 3px; background: rgba(255, 255, 255, .28); position: relative; overflow: hidden; }
.hero-dots i.on b::after { content: ''; position: absolute; inset: 0; background: #fff; transform-origin: 0 50%; animation: dotrun 7s linear both; }
@keyframes dotrun { from { transform: scaleX(0); } }

/* 提示條 */
.cta { display: flex; align-items: center; gap: 12px; margin: 14px var(--pad) 4px; padding: 12px 14px; background: linear-gradient(90deg, rgba(255, 45, 85, .16), rgba(255, 45, 85, .04)); border: 1px solid rgba(255, 45, 85, .4); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.cta.warn { background: linear-gradient(90deg, rgba(196, 255, 61, .14), rgba(196, 255, 61, .03)); border-color: rgba(196, 255, 61, .45); }
.cta-tag { flex: 0 0 auto; padding: 2px 9px 0; background: var(--red); font-family: var(--f-num); font-size: 16px; letter-spacing: 1.5px; transform: skewX(-12deg); }
.cta.warn .cta-tag { background: var(--lime); color: #0c0f05; font-family: var(--f-zh); font-size: 13px; font-weight: 900; padding: 3px 9px 2px; }
.cta-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cta-t b { font-size: 15px; }
.cta-t span { font-size: 12.5px; color: var(--dim); }
.cta-go { margin-left: auto; color: #fff; font-weight: 800; white-space: nowrap; font-size: 14px; }

/* 遊戲磚 */
.gt { display: flex; flex-direction: column; gap: 5px; width: min(62vw, 250px); }
.gt-img { position: relative; aspect-ratio: 460 / 215; background: var(--panel2); overflow: hidden; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
.gt-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
.gt:active .gt-img img { transform: scale(1.05); }
.gt-rank { position: absolute; left: 0; bottom: 0; padding: 4px 9px 0 8px; background: rgba(6, 7, 11, .9); font-style: normal; font-family: var(--f-num); font-size: 22px; line-height: 24px; color: var(--gold); }
.gt-name { font-weight: 800; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gt-en { font-family: var(--f-lat); font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -3px; }
.gt-stat { font-size: 12px; color: var(--dim); }
.gt-stat b { font-family: var(--f-num); font-size: 17px; color: #fff; font-weight: 600; }
.gt-bar { display: flex; gap: 2px; height: 4px; }
.gt-bar i { background: var(--lc); }
.gt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 230px), 1fr)); gap: 18px 12px; padding: 4px var(--pad); }
.gt-grid .gt { width: auto; }

/* 新秀小卡（首頁） */
.rk-mini { width: 150px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 10px 12px; background: linear-gradient(180deg, rgba(196, 255, 61, .1), var(--panel) 60%); border: 1px solid rgba(196, 255, 61, .25); text-align: center; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
.rk-mini .av { box-shadow: 0 0 0 2px var(--lime); }
.rk-mini b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.rk-mini span { font-size: 11.5px; color: var(--dim); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 頁首 */
.ph { padding: 20px var(--pad) 6px; display: flex; align-items: flex-end; gap: 12px; }
.ph h1 { margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ph h1 b { font-size: 30px; font-weight: 900; letter-spacing: 1px; position: relative; padding-left: 16px; }
.ph h1 b::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 8px; background: var(--red); transform: skewX(-14deg); }
.ph h1 i { font-style: normal; font-family: var(--f-num); font-size: 24px; color: var(--red); letter-spacing: 3px; }
.ph p { margin: 4px 0 0; color: var(--dim); font-size: 13.5px; }
.backbar { padding: 12px var(--pad) 0; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 14px; padding: 6px 12px 6px 6px; }
.back span { font-size: 24px; line-height: 1; color: var(--red); }
.note { margin: 8px var(--pad); font-size: 12.5px; color: var(--mute); }
.foot { text-align: center; color: var(--mute); font-size: 12px; margin: 28px var(--pad) 0; }
.foot a { color: var(--gold); }
.right { display: flex; justify-content: flex-end; padding: 0 var(--pad); }

/* 按鈕、標籤 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px; background: var(--panel3); color: #fff; font-weight: 800; font-size: 14px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.btn.red { background: var(--red); }
.btn.wide { display: flex; margin: 18px auto 0; min-width: 220px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 13px; background: var(--panel2); border: 1px solid var(--line2); font-size: 13px; font-weight: 700; color: var(--ice); white-space: nowrap; }
.chip.on { background: rgba(255, 45, 85, .14); border-color: rgba(255, 45, 85, .55); color: #fff; }
.chip.unp { border-color: rgba(255, 194, 41, .55); color: var(--gold); }
.mini { font-size: 12px; padding: 4px 10px; border: 1px solid var(--line2); color: var(--dim); white-space: nowrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px var(--pad) 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: 0 0 auto; height: 32px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line2); font-size: 13px; font-weight: 700; color: var(--dim); transform: skewX(-10deg); }
.chips button.on { background: #fff; color: #07080d; border-color: #fff; }
.chips.sm button { height: 28px; font-size: 12px; }
.sub-btn { flex: 0 0 auto; height: 36px; padding: 0 16px; background: var(--red); color: #fff; font-weight: 900; font-size: 13.5px; clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%); transition: transform .12s; }
.sub-btn.on { background: var(--panel3); color: var(--dim); }
.sub-btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
.sub-btn:active { transform: scale(.94); }

/* 頻道條 */
.cc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; padding: 0 var(--pad); }
.cc { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.cc.on { border-color: rgba(255, 45, 85, .35); background: linear-gradient(90deg, rgba(255, 45, 85, .08), var(--panel) 60%); }
.cc-l { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.cc-n { display: flex; flex-direction: column; min-width: 0; }
.cc-n b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-n span { font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rg { margin: 12px 0 18px; }
.rg-h { display: flex; align-items: center; gap: 10px; padding: 0 var(--pad) 8px; }
.rg-h b { font-size: 15px; }
.rg-h span { font-family: var(--f-num); font-size: 18px; color: var(--mute); }
.rg-h .mini { margin-left: auto; }

/* 空白、載入 */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 46px 24px; color: var(--dim); }
.empty b { color: #fff; font-size: 17px; }
.empty p { margin: 0; font-size: 13.5px; max-width: 460px; }
.empty .btn { margin-top: 10px; }
.empty-ic { display: flex; gap: 5px; margin-bottom: 6px; }
.empty-ic i { width: 10px; height: 26px; background: var(--panel3); transform: skewX(-14deg); }
.empty-ic i:nth-child(2) { background: var(--red); }
.loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 90px 0; color: var(--dim); }
.bars { display: flex; gap: 5px; height: 34px; align-items: flex-end; }
.bars i { width: 7px; background: var(--red); animation: bar .9s ease-in-out infinite; transform-origin: 50% 100%; height: 100%; }
.bars i:nth-child(2) { animation-delay: .1s; background: #fff; } .bars i:nth-child(3) { animation-delay: .2s; } .bars i:nth-child(4) { animation-delay: .3s; background: #fff; } .bars i:nth-child(5) { animation-delay: .4s; }
@keyframes bar { 50% { transform: scaleY(.25); } }
.keycard { display: flex; align-items: center; gap: 12px; margin: 10px var(--pad); padding: 12px 14px; background: var(--panel); border: 1px dashed rgba(255, 194, 41, .5); }
.kc-ic { flex: 0 0 auto; font-family: var(--f-num); font-size: 17px; letter-spacing: 1.5px; padding: 2px 8px 0; background: var(--gold); color: #0c0a02; transform: skewX(-12deg); }
.keycard b { display: block; font-size: 14px; }

/* 遊戲頁 */

/* ---------------- 新秀選秀會 ---------------- */
.deck { position: relative; height: clamp(400px, calc(100svh - var(--toph) - var(--tkh) - var(--st) - var(--tabh) - var(--sb) - 230px), 540px); margin: 12px auto 0; max-width: 440px; padding: 0 var(--pad); touch-action: pan-y; }
.draft { position: absolute; left: var(--pad); right: var(--pad); top: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; overflow: hidden; background: linear-gradient(170deg, #1a2213 0%, var(--panel) 34%, #0c0f17 100%); border: 1px solid rgba(196, 255, 61, .32); clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px); transform: translate3d(0, calc(var(--k) * 12px), 0) scale(calc(1 - var(--k) * .04)); transform-origin: 50% 0; transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .35s; user-select: none; -webkit-user-select: none; cursor: grab; }
.draft:not(:last-child) { pointer-events: none; }

.draft.fly-r { transform: translate3d(130%, -30px, 0) rotate(18deg) !important; opacity: 0; transition: transform .55s cubic-bezier(.5, 0, .7, 1) .25s, opacity .4s .4s; }
.draft.fly-l { transform: translate3d(-130%, 10px, 0) rotate(-16deg) !important; opacity: 0; transition: transform .45s cubic-bezier(.5, 0, .7, 1) .2s, opacity .35s .3s; }
.dr-top { display: flex; align-items: center; gap: 10px; }
.dr-no { font-family: var(--f-num); font-size: 34px; line-height: .8; color: var(--lime); font-weight: 700; }
.dr-src { font-family: var(--f-num); font-size: 15px; letter-spacing: 2px; color: var(--dim); }
.dr-day { margin-left: auto; font-family: var(--f-num); font-size: 16px; color: var(--mute); }
.dr-id { display: flex; align-items: center; gap: 14px; }
.dr-id .av { box-shadow: 0 0 0 3px var(--lime), 0 0 0 6px rgba(196, 255, 61, .18); }
.dr-n { display: block; font-size: 21px; font-weight: 900; line-height: 1.2; }
.dr-st { display: flex; gap: 14px; margin-top: 4px; }

.dr-st b { font-family: var(--f-num); font-size: 22px; color: #fff; font-weight: 600; line-height: 1; }
.dr-why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.dr-why li { position: relative; padding-left: 16px; font-size: 13.5px; color: var(--ice); }
.dr-why li::before { content: ''; position: absolute; left: 0; top: 7px; width: 8px; height: 8px; background: var(--lime); transform: skewX(-14deg); }
.dr-ds { margin: 0; font-size: 12.5px; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.dr-sample { margin-top: auto; display: flex; flex-direction: column; gap: 6px; flex-shrink: 1; min-height: 0; }
.dr-chip { display: inline-block; margin-top: 6px; padding: 1px 8px; border: 1px solid rgba(196, 255, 61, .5); color: var(--lime); font-size: 11.5px; font-weight: 800; }
.dr-th { position: relative; aspect-ratio: 16 / 9; max-height: 34vh; overflow: hidden; background: #000; }
.dr-th img { width: 100%; height: 100%; object-fit: cover; }
.dr-play { position: absolute; left: 10px; bottom: 10px; padding: 3px 10px 2px; background: var(--lime); color: #0b0d06; font-style: normal; font-weight: 900; font-size: 12.5px; clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.dr-st2 b { display: block; font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dr-st2 span { font-size: 11.5px; color: var(--mute); }
.deck-acts { display: flex; justify-content: center; gap: 14px; margin: 18px var(--pad) 6px; }
.dk { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 92px; padding: 10px 0 8px; font-size: 12.5px; font-weight: 800; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: transform .12s; }

.stamp { position: absolute; left: 50%; top: 38%; z-index: 5; pointer-events: none; transform: translate(-50%, -50%) rotate(-14deg); animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.stamp b { display: block; padding: 6px 18px 4px; border: 4px solid var(--lime); color: var(--lime); font-size: 34px; font-weight: 900; letter-spacing: 3px; background: rgba(6, 7, 11, .85); white-space: nowrap; }
.stamp.dim b { border-color: #aab2c6; color: #aab2c6; font-family: var(--f-num); font-weight: 600; letter-spacing: 6px; }
@keyframes stamp { from { opacity: 0; transform: translate(-50%, -50%) rotate(-14deg) scale(2.2); } }
.pick-bar { position: sticky; bottom: calc(var(--tabh) + var(--sb) + 10px); z-index: 5; display: flex; align-items: center; justify-content: space-between; margin: 14px var(--pad) 0; padding: 10px 10px 10px 16px; background: #0b0e16; border: 1px solid rgba(255, 45, 85, .45); }
.pick-bar b { font-family: var(--f-num); font-size: 24px; color: #fff; }

/* ---------------- 我的 ---------------- */
.me-card { margin: 18px var(--pad) 6px; padding: 16px; background: linear-gradient(140deg, #22101a 0%, var(--panel) 45%, #0b0f18 100%); border: 1px solid rgba(255, 45, 85, .3); clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); display: grid; gap: 14px; }

.me-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.me-dial { display: grid; grid-template-columns: 120px 1fr; grid-template-rows: auto auto; column-gap: 14px; align-items: center; }
.me-dial svg { grid-row: 1 / 3; width: 120px; height: 70px; }
.dl-bg { fill: none; stroke: var(--panel3); stroke-width: 10; }

.me-dial p { margin: 0; font-size: 12.5px; color: var(--dim); }
.addch { display: flex; gap: 8px; padding: 14px var(--pad) 0; }
.addch .btn { flex: 0 0 auto; height: 44px; }
.adds { display: flex; flex-direction: column; gap: 4px; padding: 6px var(--pad); }
.add-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 10px; background: var(--panel); border-left: 3px solid var(--gold); }
.add-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.add-row.ok { border-color: var(--green); } .add-row.fail { border-color: var(--red); }
.set { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--pad); }
.tg { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.tg > span { flex: 1; display: flex; flex-direction: column; }
.tg b { font-size: 14.5px; }
.tg > span > span { font-size: 12px; color: var(--mute); }
.tg input { position: absolute; opacity: 0; pointer-events: none; }
.tg i { flex: 0 0 auto; width: 50px; height: 26px; background: var(--panel3); position: relative; transform: skewX(-12deg); transition: background .2s; }
.tg i::after { content: ''; position: absolute; left: 4px; top: 4px; width: 18px; height: 18px; background: var(--dim); transition: transform .2s, background .2s; }
.tg input:checked + i { background: rgba(255, 45, 85, .35); }
.tg input:checked + i::after { transform: translateX(24px); background: var(--red); }
.rg2 { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.rg2 input { flex: 1; accent-color: var(--red); }
.seg { padding: 11px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.seg b { font-size: 14.5px; }
.seg > div { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { height: 32px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line2); font-size: 13px; color: var(--dim); font-weight: 700; transform: skewX(-10deg); }
.seg button.on { background: #fff; color: #07080d; border-color: #fff; }
.set .note { margin: 10px 0 0; }
.sys { display: flex; flex-direction: column; gap: 6px; padding: 0 var(--pad); }
.sys-r { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); flex-wrap: wrap; }

.lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex: 0 0 auto; }
.lamp.wait { background: var(--gold); } .lamp.bad { background: var(--red); }
.steps { list-style: none; counter-reset: s; margin: 10px 0; padding: 0 var(--pad); display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; position: relative; display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 14px 58px; background: var(--panel); border: 1px solid var(--line); }
.steps li::before { content: counter(s, decimal-leading-zero); position: absolute; left: 12px; top: 10px; font-family: var(--f-num); font-size: 34px; color: var(--red); line-height: 1; }

.steps .btn { align-self: flex-start; }

/* ---------------- 分頁列 ---------------- */
#tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: calc(var(--tabh) + var(--sb)); padding: 0 var(--sr) var(--sb) var(--sl); display: flex; background: #080a11; border-top: 1px solid var(--line2); }

#tabs a.on { color: #fff; }

#tabs .ink { position: absolute; top: 0; left: 0; height: 3px; background: var(--red); transition: transform .35s cubic-bezier(.2, .9, .2, 1), width .35s, height .35s; pointer-events: none; }

/* ---------------- 導播台 ---------------- */

.pgm-main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.pgm-stage { flex: 0 0 auto; background: #000; }
.pgm-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
.pgm-frame iframe, #ytp { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pgm-frame::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 2px rgba(255, 45, 85, .65); }
.pgm-wipe { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }

.pgm-msg, .pgm-next { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(4, 5, 8, .9); padding: 16px; }

.msg-in b { font-size: 18px; }
.msg-in p { margin: 0; color: var(--dim); font-size: 13.5px; }
.msg-acts { display: flex; gap: 8px; margin-top: 6px; }
.pgm-next { background: rgba(4, 5, 8, .82); }
.nx-in { display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'tag tag' 'img n' 't t' 'go x'; gap: 8px 12px; width: min(90%, 420px); align-items: center; }
.nx-tag { grid-area: tag; font-family: var(--f-num); font-size: 20px; letter-spacing: 3px; color: var(--pvw); }

/* ---------------- 轉場（Stinger） ---------------- */
#stinger { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; visibility: hidden; }

#stinger i { position: absolute; top: -30vh; height: 160vh; left: -150vmax; transform: skewX(-24deg); }
#stinger .s1 { width: 120vmax; background: var(--red); }
#stinger .s2 { width: 26vmax; background: #fff; }
#stinger .s3 { width: 140vmax; background: #07080d; }
#stinger.go i { animation: sting .86s cubic-bezier(.75, 0, .25, 1) both; }
#stinger.go .s2 { animation-delay: .04s; } #stinger.go .s3 { animation-delay: .08s; }
@keyframes sting { from { transform: translate3d(0, 0, 0) skewX(-24deg); } to { transform: translate3d(calc(300vmax + 150vw), 0, 0) skewX(-24deg); } }
.st-logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) skewX(-12deg); display: flex; align-items: stretch; opacity: 0; }
.st-logo b { padding: 6px 18px 4px; background: #fff; color: #07080d; font-size: 44px; font-weight: 900; letter-spacing: 6px; }
.st-logo small { display: flex; align-items: center; padding: 8px 16px 0; background: var(--red); color: #fff; font-family: var(--f-num); font-size: 40px; letter-spacing: 6px; }
#stinger.go .st-logo { animation: stlogo .86s ease both; }
@keyframes stlogo { 0%, 22% { opacity: 0; transform: translate(-50%, -50%) skewX(-12deg) scale(1.4); } 36%, 62% { opacity: 1; transform: translate(-50%, -50%) skewX(-12deg) scale(1); } 80%, 100% { opacity: 0; transform: translate(-50%, -50%) skewX(-12deg) scale(.92); } }
#stinger.wipe .s1 { width: 18vmax; background: linear-gradient(90deg, rgba(255, 45, 85, 0), rgba(255, 45, 85, .85) 60%, #fff 62%, rgba(255, 255, 255, 0) 70%); animation: sting .5s cubic-bezier(.6, 0, .3, 1) both; }
#stinger.wipe .s2, #stinger.wipe .s3, #stinger.wipe .st-logo { display: none; }

/* ---------------- 開場 ---------------- */
.gate { position: fixed; inset: 0; z-index: 95; background: #030406; display: grid; place-items: center; overflow: hidden; }
.gate-grid { position: absolute; inset: -50% -50% 0; background: linear-gradient(transparent 0 96%, rgba(255, 45, 85, .25) 96%) 0 0 / 100% 46px, linear-gradient(90deg, transparent 0 97%, rgba(255, 45, 85, .18) 97%) 0 0 / 46px 100%; transform: perspective(500px) rotateX(62deg) translateY(30%); transform-origin: 50% 100%; animation: grid 3.2s linear infinite; opacity: .6; }
@keyframes grid { to { background-position: 0 46px, 0 0; } }
.gate-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 20px; }
.gate-brand { display: flex; align-items: stretch; transform: skewX(-12deg); white-space: nowrap; }
.gate-brand b { padding: 8px clamp(12px, 4vw, 20px) 6px; background: #fff; color: #07080d; font-size: clamp(34px, 11vw, 56px); font-weight: 900; letter-spacing: clamp(3px, 1.4vw, 8px); line-height: 1.05; }
.gate-brand span { display: flex; align-items: center; padding: 10px clamp(10px, 3.5vw, 18px) 0; background: var(--red); font-family: var(--f-num); font-size: clamp(30px, 9.5vw, 48px); letter-spacing: clamp(2px, 1.2vw, 6px); }
.gate-sub { color: var(--dim); font-size: 14px; letter-spacing: 3px; }
.gate-btn { margin-top: 18px; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px; border: 2px solid #fff; font-size: 16px; font-weight: 900; letter-spacing: 2px; animation: gpulse 1.6s ease-in-out infinite; }
.gate-btn i { width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
@keyframes gpulse { 50% { border-color: rgba(255, 255, 255, .35); } }

.gate-corner { position: absolute; font-family: var(--f-num); font-size: 18px; letter-spacing: 3px; color: rgba(255, 255, 255, .55); display: flex; align-items: center; gap: 8px; }
.gate-corner.tl { left: calc(18px + var(--sl)); top: calc(16px + var(--st)); } .gate-corner.tr { right: calc(18px + var(--sr)); top: calc(16px + var(--st)); }
.gate-corner.bl { left: calc(18px + var(--sl)); bottom: calc(16px + var(--sb)); } .gate-corner.br { right: calc(18px + var(--sr)); bottom: calc(16px + var(--sb)); }
.gate-corner.tr i { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: blink 1s steps(2) infinite; }
.gate-corner::before { content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, .5); }
.gate-corner.tl::before { left: -10px; top: -8px; border-right: 0; border-bottom: 0; } .gate-corner.tr::before { right: -10px; top: -8px; border-left: 0; border-bottom: 0; }
.gate-corner.bl::before { left: -10px; bottom: -8px; border-right: 0; border-top: 0; } .gate-corner.br::before { right: -10px; bottom: -8px; border-left: 0; border-top: 0; }
.gate-count { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
.gate-count svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.gc-bg { fill: none; stroke: rgba(255, 255, 255, .1); stroke-width: 5; }
.gc-ring { fill: none; stroke: var(--red); stroke-width: 5; stroke-dasharray: 327; stroke-dashoffset: 0; }
#gcNum { position: relative; font-family: var(--f-num); font-size: 92px; line-height: 1; padding-top: 10px; font-weight: 600; }
#gcNum.pop { animation: gpop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
#gcNum.air { font-size: 40px; letter-spacing: 4px; color: #fff; background: var(--red); padding: 8px 14px 2px; transform: skewX(-12deg); }
@keyframes gpop { from { opacity: 0; transform: scale(1.8); } }
.gate.counting .gate-brand, .gate.counting .gate-sub { opacity: .25; transform: skewX(-12deg) scale(.86); transition: all .4s; }
.gate.counting .gate-sub { transform: none; }

/* 字卡 */
.l3 { position: fixed; z-index: 70; left: calc(12px + var(--sl) + var(--rail)); bottom: calc(var(--tabh) + var(--sb) + 18px); display: flex; align-items: stretch; transform: translate3d(-110%, 0, 0) skewX(-12deg); transition: transform .5s cubic-bezier(.2, .9, .2, 1); max-width: calc(100vw - 24px); }

.l3-main span { font-size: 12.5px; color: #3a4154; }

/* 提示泡泡、搜尋層、火花 */
#toast { position: fixed; z-index: 99; left: 50%; bottom: calc(var(--tabh) + var(--sb) + 18px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); padding: 10px 18px; background: #fff; color: #07080d; font-weight: 800; font-size: 14px; transition: opacity .2s, transform .25s; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
html.watching #toast { bottom: calc(24px + var(--sb)); }
#sheet { position: fixed; inset: 0; z-index: 80; background: #05060a; opacity: 0; transition: opacity .2s; }
#sheet.in { opacity: 1; }
.sheet-in { height: 100%; display: flex; flex-direction: column; padding-top: var(--st); }
.sr-bar { display: flex; gap: 6px; align-items: center; padding: 10px calc(8px + var(--sr)) 10px calc(var(--pad) + var(--sl)); }
.sr-r { flex: 1; overflow-y: auto; padding-bottom: 40px; }
.sr-sec { margin: 14px 0; }
.sr-sec > b { display: block; padding: 0 var(--pad) 8px; font-size: 14px; color: var(--dim); }
.sr-games { display: flex; gap: 10px; overflow-x: auto; padding: 0 var(--pad); }
.sr-g { flex: 0 0 auto; width: 170px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; }

.sr-tips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px var(--pad); align-items: center; }
.sr-tips b { width: 100%; font-size: 13px; color: var(--dim); }
.fx-burst { position: fixed; z-index: 98; pointer-events: none; }

/* ---------------- 大螢幕：左側導播鍵 ---------------- */
@media (min-width: 900px) {

  #top { z-index: 31; }

}
@media (min-width: 1400px) { :root { --pad: 40px; } .vc { width: 320px; } }

/* 手機橫拿：頂列變矮、分頁變左側 */
@media (orientation: landscape) and (max-height: 520px) {

  #tabs { top: 0; bottom: 0; right: auto; width: var(--rail); height: auto; flex-direction: column; justify-content: center; padding: var(--st) 0 var(--sb) var(--sl); border-top: 0; border-right: 1px solid var(--line2); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

<script>
/* ---- core.js ---- */
'use strict';
/* 觀戰 SPECTATE — 核心：設定、資料、同步、清單 */

const VERSION = '1.0.0';

const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) { /* 空間滿了就算了 */ } },

let DEV = store.get('dev');
if (!DEV || !/^d[a-z0-9]{3,10}$/.test(DEV)) { DEV = 'd' + Math.random().toString(36).slice(2, 8).replace(/[^a-z0-9]/g, 'x').padEnd(6, '0'); store.set('dev', DEV); }

/* ------------------------------------------------------------ 小工具 */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const nowS = () => Date.now() / 1000;

function ago(p) {
  if (!p) return '';
  const s = nowS() - p;
  if (s < 0) return '即將';
  if (s < 90) return '剛剛';
  if (s < 3600) return Math.floor(s / 60) + ' 分鐘前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小時前';
  if (s < 2 * 86400) return '昨天';
  if (s < 7 * 86400) return Math.floor(s / 86400) + ' 天前';
  const d = new Date(p * 1000);
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function until(p) {
  const s = p - nowS();
  if (s <= 0) return '開播中';
  if (s < 3600) return Math.ceil(s / 60) + ' 分鐘後';
  if (s < 86400) return Math.floor(s / 3600) + ' 小時 ' + Math.floor((s % 3600) / 60) + ' 分後';
  const d = new Date(p * 1000);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function num(n) {
  if (n == null) return '';
  if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '億';
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + '萬';
  return n.toLocaleString('en-US');
}
function dur(s) {
  if (!s && s !== 0) return '';
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
function dayKey(t = Date.now()) {
  const d = new Date(t);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function greet() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return '早安';
  if (h >= 11 && h < 14) return '午安';
  if (h >= 14 && h < 18) return '下午好';
  if (h >= 18 && h < 23) return '晚上好';
  return '夜深了';
}
function hash32(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed) { let x = seed || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; }; }

const thumb = (id, q) => 'https://i.ytimg.com/vi/' + id + '/' + (q || 'mqdefault') + '.jpg';
const ytUrl = (id) => 'https://www.youtube.com/watch?v=' + id;
const chUrl = (c) => 'https://www.youtube.com/channel/' + c;

/* ------------------------------------------------------------ 車道（節目類型） */
const LANES = {
  live: { zh: '直播', en: 'LIVE', c: 'var(--red)' },
  trailer: { zh: '預告', en: 'TRAILER', c: 'var(--gold)' },
  review: { zh: '評測', en: 'REVIEW', c: 'var(--cyan)' },
  guide: { zh: '攻略', en: 'GUIDE', c: 'var(--green)' },
  news: { zh: '新聞', en: 'NEWS', c: 'var(--ice)' },
  deep: { zh: '深度', en: 'DEEP', c: 'var(--violet)' },
  play: { zh: '實況', en: 'PLAY', c: 'var(--orange)' },
};
const KINDS = { official: '官方', media: '媒體', creator: '創作者', stream: '實況主' };
const LANGS = { zh: '中', en: 'EN', ja: '日', ko: '韓' };

/* ------------------------------------------------------------ 資料 */
const D = { feed: null, games: null, disc: null, me: null, status: null, at: 0, ok: false, err: null, busy: false };
const IDX = { items: [], byId: new Map(), ch: {}, games: {}, gameList: [], gameMap: new Map(), rev: 0 };

async function getJSON(base, name, fresh) {
  const bust = fresh ? Date.now() : Math.floor(Date.now() / 60000);
  const r = await fetch(base + name + '?t=' + bust, { cache: 'no-store' });
  if (!r.ok) throw new Error(name + ' ' + r.status);
  return r.json();
}

async function loadAll(fresh) {
  if (D.busy) return false;
  D.busy = true;
  const [feed, games, disc, status, me] = await Promise.allSettled([
    getJSON(DATA_URL, 'feed.json', fresh), getJSON(DATA_URL, 'games.json', fresh), getJSON(DATA_URL, 'discover.json', fresh),
    getJSON(DATA_URL, 'status.json', fresh), getJSON(MAIN_URL, 'me.json', fresh),
  ]);
  D.busy = false;
  let changed = false;
  if (feed.status === 'fulfilled' && feed.value && feed.value.items) {
    if (!D.feed || D.feed.at !== feed.value.at) { D.feed = feed.value; changed = true; }
    D.ok = true; D.err = null;
  } else if (!D.feed) {
    D.err = '轉播資料還沒到：' + ((feed.reason && feed.reason.message) || '連不上');
  }
  if (games.status === 'fulfilled' && games.value) { const was = D.games && D.games.at; D.games = games.value; if (was !== D.games.at) changed = true; }
  if (disc.status === 'fulfilled') D.disc = disc.value;
  if (status.status === 'fulfilled') D.status = status.value;
  if (me.status === 'fulfilled' && me.value) takeMe(me.value);
  D.at = Date.now();
  if (changed) indexFeed();
  return changed;
}

function indexFeed() {
  const f = D.feed || {};
  IDX.items = f.items || [];
  IDX.byId = new Map(IDX.items.map((it) => [it.i, it]));
  IDX.ch = f.ch || {};
  IDX.games = f.games || {};
  IDX.gameList = (D.games && D.games.games) || [];
  IDX.gameMap = new Map(IDX.gameList.map((g) => [g.k, g]));
  IDX.rev++;
  MEMO.clear();
}

/* ------------------------------------------------------------ 訂閱同步（轉發站） */
const SYNC = { out: store.get('out', []), base: store.get('base', null), fail: 0, sentAt: 0 };
let VIEW = null;

function emptyMe() { return { subs: {}, blocks: {}, passes: {}, later: {}, adds: [], seen: [] }; }
function applyEv(v, e) {
  switch (e.type) {
    case 'sub': v.subs[e.ch] = { t: e.t, n: e.n, src: e.src }; delete v.blocks[e.ch]; delete v.passes[e.ch]; break;
    case 'unsub': delete v.subs[e.ch]; break;
    case 'block': v.blocks[e.ch] = e.t; delete v.subs[e.ch]; break;
    case 'unblock': delete v.blocks[e.ch]; break;
    case 'pass': v.passes[e.ch] = e.t; break;
    case 'unpass': delete v.passes[e.ch]; break;
    case 'later': if (e.on === false) delete v.later[e.v]; else v.later[e.v] = e.t; break;
    case 'add': v.adds.push({ id: e.id, q: e.q, t: e.t, st: 'send' }); break;
    default: break;
  }
}
function rebuildView() {
  const b = SYNC.base || emptyMe();
  const v = { subs: Object.assign({}, b.subs), blocks: Object.assign({}, b.blocks), passes: Object.assign({}, b.passes), later: Object.assign({}, b.later), adds: (b.adds || []).slice() };
  const seen = new Set(b.seen || []);
  SYNC.out.filter((e) => !seen.has(e.id)).sort((a, z) => a.t - z.t).forEach((e) => applyEv(v, e));
  VIEW = v;
  MEMO.clear();
  return v;
}
function takeMe(me) {
  if (!me || typeof me !== 'object') return;
  SYNC.base = { subs: me.subs || {}, blocks: me.blocks || {}, passes: me.passes || {}, later: me.later || {}, adds: me.adds || [], seen: me.seen || [], at: me.at };
  store.set('base', SYNC.base);
  const seen = new Set(SYNC.base.seen);
  const before = SYNC.out.length;
  SYNC.out = SYNC.out.filter((e) => !seen.has(e.id));
  if (SYNC.out.length !== before) store.set('out', SYNC.out);
  rebuildView();
  if (typeof syncLight === 'function') syncLight();
}
function newEv(type, fields) {
  const seq = (store.get('seq', 0) | 0) + 1;
  store.set('seq', seq);
  const ev = Object.assign({ id: DEV + '-' + seq, type, t: Date.now() }, fields);
  SYNC.out.push(ev);
  store.set('out', SYNC.out);
  rebuildView();
  scheduleSend();
  if (typeof syncLight === 'function') syncLight();
  return ev;
}
let sendTimer = 0;
function scheduleSend(ms) { clearTimeout(sendTimer); sendTimer = setTimeout(sendNow, ms == null ? 1500 : ms); }
async function sendNow() {
  const now = Date.now();
  const todo = SYNC.out.filter((e) => !e.sent || now - e.sent > 3 * 3600e3);
  if (!todo.length) return;
  for (let i = 0; i < todo.length; i += 12) {
    const chunk = todo.slice(i, i + 12);
    const evs = chunk.map((e) => { const c = Object.assign({}, e); delete c.sent; return c; });
    try {
      await fetch(RELAY, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ v: 1, dev: DEV, evs }) });
      chunk.forEach((e) => { e.sent = now; });
      SYNC.fail = 0;
    } catch (err) {
      SYNC.fail = now;
      break;
    }
  }
  SYNC.sentAt = now;
  store.set('out', SYNC.out);
  if (typeof syncLight === 'function') syncLight();
}
function syncState() {
  if (SYNC.fail && SYNC.out.length) return 'bad';
  if (SYNC.out.length) return 'wait';
  return 'ok';
}

/* 動作 */
function subscribe(c, src) { if (!c || VIEW.subs[c]) return; const ch = IDX.ch[c] || {}; newEv('sub', { ch: c, n: (ch.n || '').slice(0, 80), src: src || 'app' }); }
function unsubscribe(c) { if (VIEW.subs[c]) newEv('unsub', { ch: c }); }
function block(c) { const ch = IDX.ch[c] || {}; newEv('block', { ch: c, n: (ch.n || '').slice(0, 80) }); }
function unblock(c) { newEv('unblock', { ch: c }); }
function pass(c) { newEv('pass', { ch: c }); }
function unpass(c) { newEv('unpass', { ch: c }); }
function setLater(v, on) { if (!!VIEW.later[v] === on) return; newEv('later', { v, on }); }
function addChannel(q) { newEv('add', { q: q.slice(0, 300) }); }

/* ------------------------------------------------------------ 觀看紀錄（只在這台裝置） */
const HIST = store.get('hist', {});      // vid: [最後看的時間 ms, 看到第幾秒, 片長, 看完 0/1, 累積毫秒, 頻道]

let histDirty = 0;
function histOf(v) { return HIST[v] || null; }
function noteWatch(it, pos, len, addMs) {
  const h = HIST[it.i] || [0, 0, 0, 0, 0, it.c];
  h[0] = Date.now(); h[1] = Math.round(pos || 0); h[2] = Math.round(len || h[2] || 0); h[5] = it.c;
  if (len && pos / len > 0.9) h[3] = 1;
  h[4] = (h[4] || 0) + (addMs || 0);
  HIST[it.i] = h;
  if (addMs) {
    const k = dayKey();
    WT[k] = WT[k] || {};
    WT[k][it.c] = (WT[k][it.c] || 0) + addMs;
  }
  if (!histDirty) histDirty = setTimeout(flushHist, 4000);
}
function flushHist() {
  histDirty = 0;
  const keys = Object.keys(HIST);
  if (keys.length > 900) keys.sort((a, b) => HIST[a][0] - HIST[b][0]).slice(0, keys.length - 900).forEach((k) => delete HIST[k]);
  const days = Object.keys(WT).sort();
  days.slice(0, Math.max(0, days.length - 35)).forEach((k) => delete WT[k]);
  store.set('hist', HIST);
  store.set('wt', WT);
}
function clearHistory() { Object.keys(HIST).forEach((k) => delete HIST[k]); Object.keys(WT).forEach((k) => delete WT[k]); flushHist(); }

/* 這週的觀戰數據：看了幾個頻道、前三名佔多少、有幾個是最近才選進來的 */
function weekStats() {
  const per = {};
  let total = 0;
  for (let i = 0; i < 7; i++) {
    const k = dayKey(Date.now() - i * 86400e3);
    for (const [c, ms] of Object.entries(WT[k] || {})) { per[c] = (per[c] || 0) + ms; total += ms; }
  }
  const rows = Object.entries(per).sort((a, b) => b[1] - a[1]);
  const top3 = rows.slice(0, 3).reduce((s, r) => s + r[1], 0);
  const fresh = rows.filter(([c]) => VIEW.subs[c] && Date.now() - (VIEW.subs[c].t || 0) < 30 * 86400e3).length;
  const explore = total ? Math.round(100 * (1 - top3 / total)) : 0;
  return { total, chans: rows.length, rows, top3: total ? top3 / total : 0, fresh, explore };
}

/* ------------------------------------------------------------ 清單 */
const MEMO = new Map();
function memo(key, fn) { if (!MEMO.has(key)) MEMO.set(key, fn()); return MEMO.get(key); }
const zf = (it) => it.z === 'zh' || !!it.tz;
const chOf = (c) => IDX.ch[c] || { n: '頻道', k: 'creator' };
const titleOf = (it) => it.tz || it.t || '';

function visible(it) {
  if (VIEW.blocks[it.c]) return false;
  if (it.s && !SET.shorts) return false;
  if (it.x && !SET.filtered) return false;
  if (it.lv === 'upcoming' && it.st && it.st < nowS() - 2 * 3600) return false;
  if (it.g && !SET.gacha && gameOf(it.g) && gameOf(it.g).gacha) return false;
  return true;
}
function baseList() {
  return memo('base', () => dedupeLang(IDX.items.filter(visible)));
}

'use strict';
/* 觀戰 SPECTATE — 畫面特效：轉場（Stinger）、開場倒數、字卡、蓋章、火花、數字滾動 */

const Fx = (() => {
  const lite = () => SET.fx === 'lite' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;

  /* 整頁轉場：三條斜帶掃過，蓋住的那一刻換畫面 */
  function stinger(mid, sound = true) {
    const st = $('#stinger');
    if (lite() || busy) { if (mid) mid(); return Promise.resolve(); }
    busy = true;
    if (sound) Snd.play('stinger');
    st.classList.remove('go'); void st.offsetWidth; st.classList.add('go');
    return new Promise((res) => {
      setTimeout(() => { try { if (mid) mid(); } catch (e) { console.error(e); } }, 330);
      setTimeout(() => { st.classList.remove('go'); busy = false; res(); }, 860);
    });
  }
  /* 分頁切換：一條斜光刷過 */
  function wipe(mid) {
    const st = $('#stinger');
    if (lite() || busy) { if (mid) mid(); return; }
    Snd.play('tab');
    st.classList.remove('go', 'wipe'); void st.offsetWidth; st.classList.add('wipe');
    setTimeout(() => { if (mid) mid(); }, 150);
    setTimeout(() => st.classList.remove('wipe'), 520);
  }
  /* 數字滾動 */
  function count(el, to, ms = 900) {
    if (!el) return;
    if (lite()) { el.textContent = to; return; }
    const from = 0, t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  /* 火花：按鈕位置噴一圈（訂閱、選秀） */
  function burst(x, y, colors = ['#ff2d55', '#ffc229', '#ffffff']) {
    if (lite()) return;
    const c = document.createElement('canvas');
    const dpr = Math.min(2, devicePixelRatio || 1);
    const S = 260;
    c.width = c.height = S * dpr;
    c.className = 'fx-burst';
    c.style.cssText = 'left:' + (x - S / 2) + 'px;top:' + (y - S / 2) + 'px;width:' + S + 'px;height:' + S + 'px';
    document.body.appendChild(c);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    const ps = [];
    for (let i = 0; i < 34; i++) {
      const a = Math.random() * Math.PI * 2, v = 2.2 + Math.random() * 4.6;
      ps.push({ x: S / 2, y: S / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, l: 1, w: 2 + Math.random() * 4, c: colors[i % colors.length], r: Math.random() * 6 });
    }
    let f = 0;
    const tick = () => {
      g.clearRect(0, 0, S, S);
      ps.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.vx *= 0.97; p.l -= 0.025; p.r += 0.2;
        if (p.l <= 0) return;
        g.save(); g.globalAlpha = Math.max(0, p.l); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
        g.fillRect(-p.w, -p.w * 0.3, p.w * 2, p.w * 0.6); g.restore();
      });
      if (++f < 44) requestAnimationFrame(tick); else c.remove();
    };
    requestAnimationFrame(tick);
  }
  /* 蓋章：選秀、訂閱 */
  function stamp(host, text, cls = '') {
    const s = document.createElement('div');
    s.className = 'stamp ' + cls;
    s.innerHTML = '<b>' + esc(text) + '</b>';
    host.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  }
  /* 字卡（Lower third）：開場問候、提示 */
  function lowerThird(title, sub, ms = 3600) {
    const el = document.createElement('div');
    el.className = 'l3';
    el.innerHTML = '<div class="l3-tag">ON AIR</div><div class="l3-main"><b>' + esc(title) + '</b><span>' + esc(sub || '') + '</span></div>';
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); }, ms);
    setTimeout(() => el.remove(), ms + 700);
  }

  /* 開場：點一下 → 3、2、1 → ON AIR → 斜帶轉場進轉播台 */
  function boot(stats) {
    const gate = $('#gate');
    gate.hidden = false;
    gate.className = 'gate';
    gate.innerHTML = `
      <div class="gate-grid"></div>
      <div class="gate-in">
        <div class="gate-brand"><b>觀戰</b><span>SPECTATE</span></div>
        <div class="gate-sub">${esc(NAME)}的遊戲轉播台</div>
        <div class="gate-count" id="gateCount" hidden><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="gc-bg"/><circle cx="60" cy="60" r="52" class="gc-ring" id="gcRing"/></svg><b id="gcNum">3</b></div>
        <button class="gate-btn" id="gateBtn"><i></i>點一下・開始轉播</button>
        <div class="gate-meta">${stats ? esc(stats) : ''}</div>
      </div>
      <div class="gate-corner tl">CAM 01</div><div class="gate-corner tr"><i></i>REC</div><div class="gate-corner bl">${new Date().toLocaleDateString('zh-TW')}</div><div class="gate-corner br">STANDBY</div>`;
    return new Promise((res) => {
      const go = () => {
        Snd.init();
        $('#gateBtn').remove();
        if (lite()) { gate.hidden = true; gate.innerHTML = ''; res(); return; }
        gate.classList.add('counting');
        const cnt = $('#gateCount'), numEl = $('#gcNum'), ring = $('#gcRing');
        cnt.hidden = false;
        let n = 3;
        const tick = () => {
          if (n > 0) {
            numEl.textContent = n;
            numEl.classList.remove('pop'); void numEl.offsetWidth; numEl.classList.add('pop');
            ring.style.transition = 'none'; ring.style.strokeDashoffset = '0'; void ring.offsetWidth;
            ring.style.transition = 'stroke-dashoffset .62s linear'; ring.style.strokeDashoffset = '327';
            Snd.play('beep');
            n--;
            setTimeout(tick, 640);
          } else {
            numEl.textContent = 'ON AIR';
            numEl.classList.add('air');
            gate.classList.add('air');
            Snd.play('go');
            // 2026/11/18：ON AIR 之後先播「今晚節目單」（真實數字＋三款焦點遊戲），再斜帶轉場
            setTimeout(() => {
              const card = typeof playMatchCard === 'function' ? playMatchCard(gate).catch(() => {}) : Promise.resolve();
              card.then(() => {
                Snd.play('onair');
                stinger(() => { gate.hidden = true; gate.innerHTML = ''; gate.className = ''; }, false).then(res);
                Snd.play('whoosh');
              });
            }, 520);
          }
        };
        tick();
      };
      $('#gateBtn').addEventListener('click', go, { once: true });

})();

'use strict';
/* 觀戰 SPECTATE — 導播台：YouTube 官方播放器（PGM）＋預覽排（PVW）＋ TAKE 切換＋ AUTO 連播 */

const Player = (() => {
  let yt = null, apiP = null, ready = false, cur = null, ctxIds = [], ctxLabel = '', mode = 'next';

  function loadAPI() {
    if (apiP) return apiP;
    apiP = new Promise((res, rej) => {
      if (window.YT && window.YT.Player) { res(); return; }
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch (e) { /* */ } res(); };
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.async = true;
      s.onerror = () => { apiP = null; rej(new Error('連不上 YouTube')); };
      document.head.appendChild(s);
      setTimeout(() => rej(new Error('YouTube 播放器載入逾時')), 15000);
    });
    return apiP;
  }

  function startPos(it) {
    const h = histOf(it.i);
    if (!h || h[3] || it.lv === 'live') return 0;
    if (h[1] > 20 && (!h[2] || h[1] < h[2] - 20)) return h[1];
    return 0;
  }

  async function open(id, list, label) {
    const it = IDX.byId.get(id) || { i: id, c: '', t: 'YouTube 影片', p: 0, l: 'play', ghost: 1 };
    cur = it;
    ctxIds = (list && list.length ? list : [id]).slice(0, 80);
    if (!ctxIds.includes(id)) ctxIds.unshift(id);
    ctxLabel = label || '';
    mode = 'next';
    const box = $('#pgm');
    if (!open_) {
      open_ = true;
      box.hidden = false;
      document.documentElement.classList.add('watching');
      requestAnimationFrame(() => box.classList.add('in'));
      Snd.duck(true);
    }
    hideMsg();
    hideNext();
    renderInfo();
    renderPvw();
    try {
      await loadAPI();

      showMsg('播放器打不開', e.message + '。可以直接到 YouTube 看。', true);

  function playId(it) {

/* 觀戰 — 2026/11/18 超級大更新：開場「今晚節目單」、每日「破圈任務」
   - 今晚節目單：ON AIR 之後、斜帶轉場之前，像賽前節目的對戰卡：今晚新片、你的頻道新片、新預告（真實數字），加上三款焦點遊戲。
   - 破圈任務：痞子葳做這個 App 的起因就是不想被演算法綁在同幾台（資訊繭房）。每天三個小任務，全部在鼓勵「看沒看過的」：
     新頻道、沒看過的遊戲、深度內容……完成拿經驗、升轉播員等級、連續天數。
     只看這台裝置上的觀看紀錄（HIST、WT），不上傳、不拿來推片（觀戰本來就不照觀看紀錄推片）。 */

/* ---------- 今晚節目單（開場） ---------- */
function matchCard() {
  if (!D.feed) return null;
  const day = 86400;
  const fresh = baseList().filter((it) => nowS() - it.p < day && it.lv !== 'upcoming');
  const zh = fresh.filter(zf).length;
  const mine = subsOn() ? L.subs().filter((it) => nowS() - it.p < day).length : null;
  const trailers = fresh.filter((it) => it.l === 'trailer').length;
  const games = gamesList().slice(0, 3);
  if (!fresh.length && !games.length) return null;
  return { n: fresh.length, zh, mine, trailers, games };
}
function matchCardHtml(mc) {
  const d = new Date();
  const stat = (n, t, cls = '') => `<div class="mc-s ${cls}"><b data-to="${n}">0</b><span>${esc(t)}</span></div>`;
  return `<div class="mc">
    <div class="mc-top"><span class="mc-tag">MATCH DAY</span><b>今晚節目單</b><span class="mc-date">${d.getMonth() + 1}/${d.getDate()}・${['日', '一', '二', '三', '四', '五', '六'][d.getDay()]}</span></div>
    <div class="mc-stats">${stat(mc.n, '24 小時新片')}${stat(mc.zh, '其中中文', 'zh')}${mc.mine != null ? stat(mc.mine, '你的頻道新片', 'me') : stat(mc.trailers, '新預告')}</div>
    ${mc.games.length ? `<div class="mc-vs-h">焦點對戰・今晚最多台在聊</div><div class="mc-teams n${mc.games.length}">${mc.games.map((g, i) => {
      const yt = g.cover ? thumb(g.cover, 'mqdefault') : ''; const img = g.img || yt;
      return `<div class="mc-team" style="--i:${i}"><span class="mc-img">${img ? `<img src="${esc(img)}" alt="" ${g.img && yt ? `onerror="this.onerror=null;this.src='${yt}'"` : 'onerror="this.remove()"'}>` : ''}<i>${String(i + 1).padStart(2, '0')}</i></span><b>${esc(gameName(g))}</b><span>${g.chs || 0} 台在聊 · ${g.n || 0} 支</span></div>`;
    }).join('')}</div>` : ''}
  </div>`;
}
/** ON AIR 之後播節目單（約 2.6 秒），回傳 Promise；沒有資料就直接過 */
function playMatchCard(gate) {
  const mc = matchCard();
  if (!mc) return Promise.resolve();
  return new Promise((res) => {
    const box = document.createElement('div');
    box.className = 'mc-wrap';
    box.innerHTML = matchCardHtml(mc);
    gate.appendChild(box);
    gate.classList.add('carded');
    requestAnimationFrame(() => box.classList.add('in'));
    Snd.play('impact');
    $$('.mc-s b', box).forEach((b, i) => setTimeout(() => { Fx.count(b, +b.dataset.to, 700); Snd.play('stat'); }, 260 + i * 140));
    $$('.mc-team', box).forEach((t, i) => setTimeout(() => { t.classList.add('in'); Snd.play('take'); }, 820 + i * 260));
    const skip = () => { gate.removeEventListener('click', skip); clearTimeout(tm); res(); };
    const tm = setTimeout(skip, 1500 + mc.games.length * 260 + 500);
    gate.addEventListener('click', skip);
  });
}

/* ---------- 破圈任務 ---------- */
const Q_POOL = {
  rookie: { t: '新秀試鏡', d: '看一個你還沒訂閱的頻道滿 2 分鐘', g: 'break' },
  newgame: { t: '沒看過的遊戲', d: '看一支你以前沒看過的遊戲的片滿 2 分鐘', g: 'break' },
  variety: { t: '換台三連', d: '今天看 3 個不同的頻道（每台至少 1 分鐘）', g: 'break' },
  deep: { t: '深度時間', d: '看一支深度或評測滿 3 分鐘', g: 'depth' },
  finish: { t: '看到最後', d: '完整看完一支影片（看到 9 成以上）', g: 'depth' },
  trailer: { t: '預告巡禮', d: '看 3 支不同的預告（每支至少 30 秒）', g: 'fun' },
  news: { t: '情報員', d: '看 2 支新聞或節目（每支至少 1 分鐘）', g: 'fun' },
};
const Q_XP = 100, Q_BONUS = 100;
const Q_TITLES = [[0, '見習觀眾'], [300, '場邊觀眾'], [900, '轉播助理'], [1800, '現場導播'], [3000, '主播'], [4500, '總導播'], [6300, '傳奇評論席']];
const QST = store.get('quest', { xp: 0, days: {} });   // days: { 'YYYY-MM-DD': [完成的任務 id] }
function saveQ() { store.set('quest', QST); }
/** 今天的三個任務：每組各挑一個，照日期決定（同一天打開幾次都一樣） */
function questsOf(dk = dayKey()) {
  const rnd = seeded(hash32('q' + dk));
  const pick = (g) => { const ids = Object.keys(Q_POOL).filter((k) => Q_POOL[k].g === g); return ids[Math.floor(rnd() * ids.length)]; };
  return [pick('break'), pick('depth'), pick('fun')];
}
const dayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
/** 每個任務現在的進度 { id, t, d, now, need, done } —— 只用這台裝置的觀看紀錄 */
function questProgress(dk = dayKey()) {
  const t0 = dayStart();
  const wt = WT[dk] || {};
  const today = Object.entries(HIST).filter(([, h]) => h[0] >= t0).map(([v, h]) => ({ v, h, it: IDX.byId.get(v) }));
  const before = new Set(Object.entries(HIST).filter(([, h]) => h[0] < t0).map(([v]) => (IDX.byId.get(v) || {}).g).filter(Boolean));
  const ms = (x) => x.h[4] || 0;
  const cnt = {
    rookie: () => [Object.entries(wt).some(([c, m]) => !VIEW.subs[c] && m >= 120e3) ? 1 : 0, 1],
    newgame: () => [today.some((x) => x.it && x.it.g && !before.has(x.it.g) && ms(x) >= 120e3) ? 1 : 0, 1],
    variety: () => [Math.min(3, Object.values(wt).filter((m) => m >= 60e3).length), 3],
    deep: () => [today.some((x) => x.it && (x.it.l === 'deep' || x.it.l === 'review') && ms(x) >= 180e3) ? 1 : 0, 1],
    finish: () => [today.some((x) => x.h[3]) ? 1 : 0, 1],
    trailer: () => [Math.min(3, today.filter((x) => x.it && x.it.l === 'trailer' && ms(x) >= 30e3).length), 3],
    news: () => [Math.min(2, today.filter((x) => x.it && x.it.l === 'news' && ms(x) >= 60e3).length), 2],
  };
  return questsOf(dk).map((id) => { const [now, need] = cnt[id](); return { id, ...Q_POOL[id], now, need, done: now >= need }; });
}
function levelOf(xp) {
  let i = 0; while (i + 1 < Q_TITLES.length && xp >= Q_TITLES[i + 1][0]) i++;
  const [base, title] = Q_TITLES[i], next = Q_TITLES[i + 1];
  return { lv: i + 1, title, base, next: next ? next[0] : null, pct: next ? (xp - base) / (next[0] - base) : 1 };
}
function streakOf() {
  let n = 0;
  for (let i = 0; i < 400; i++) {
    const k = dayKey(Date.now() - i * 86400e3); const d = QST.days[k] || [];
    if (d.length >= 3) n++; else if (i === 0) continue; else break;   // 今天還沒做完不算斷
  }
  return n;
}
/** 看完片回來時檢查：新完成的任務發經驗、跳字卡 */
function questCheck(quiet = false) {
  const dk = dayKey();
  const got = QST.days[dk] || [];
  const ps = questProgress(dk);
  const fresh = ps.filter((q) => q.done && !got.includes(q.id));
  if (!fresh.length) return;
  QST.days[dk] = got.concat(fresh.map((q) => q.id));
  let add = fresh.length * Q_XP;
  const all = QST.days[dk].length >= 3;
  if (all) add += Q_BONUS;
  const lv0 = levelOf(QST.xp).lv;
  QST.xp += add;
  const ks = Object.keys(QST.days).sort(); ks.slice(0, Math.max(0, ks.length - 60)).forEach((k) => delete QST.days[k]);
  saveQ();
  if (quiet) return;
  const up = levelOf(QST.xp);
  setTimeout(() => {
    Snd.play('sub');
    Fx.lowerThird(all ? '今日破圈任務全部完成！' : `任務完成：${fresh.map((q) => q.t).join('、')}`, `+${add} XP${up.lv > lv0 ? `・升級「${up.title}」` : ''}${all ? `・連續 ${streakOf()} 天` : ''}`, 4200);
    if (!Fx.lite()) Fx.burst(innerWidth / 2, innerHeight * 0.72, ['#ff2d55', '#ffc229', '#22e3a0', '#ffffff']);
  }, 400);
}
const Q_ICON = { break: '◎', depth: '◆', fun: '▶' };
/** 首頁的一條：今天三個任務的進度 */
function questStripHtml() {
  const ps = questProgress();
  const done = ps.filter((q) => q.done).length;
  const lv = levelOf(QST.xp);
  return `<a class="qs" href="#me" data-qs="1"><span class="qs-tag">破圈任務</span><span class="qs-list">${ps.map((q) => `<i class="qs-q ${q.done ? 'ok' : ''}" title="${esc(q.d)}"><em>${Q_ICON[q.g]}</em>${esc(q.t)}<b>${q.done ? '✓' : `${q.now}/${q.need}`}</b></i>`).join('')}</span><span class="qs-lv">Lv.${lv.lv}<small>${done}/3</small></span></a>`;
}
/** 我的：完整的任務卡 */
function questPanelHtml() {
  const ps = questProgress();
  const lv = levelOf(QST.xp);
  const st = streakOf();
  const week = Array.from({ length: 7 }, (_, i) => { const k = dayKey(Date.now() - (6 - i) * 86400e3); const n = (QST.days[k] || []).length; return `<i class="qw-d n${Math.min(3, n)}" title="${k}：${n}/3"><b>${k.slice(5).replace('-', '/')}</b></i>`; }).join('');
  return `<section class="sec qp" id="quests">${secHead('破圈任務', 'DAILY MISSIONS')}
    <div class="qp-card">
      <div class="qp-lv"><span class="qp-badge"><b>${lv.lv}</b><small>LV</small></span><span class="qp-t"><b>${esc(lv.title)}</b><span>${QST.xp} XP${lv.next ? `・再 ${lv.next - QST.xp} 升級` : '・最高等級'}</span><i class="qp-bar"><i style="--p:${Math.round(lv.pct * 100)}%"></i></i></span><span class="qp-st"><b>${st}</b><small>連續天數</small></span></div>
      <div class="qp-list">${ps.map((q, i) => `<div class="qp-q ${q.done ? 'ok' : ''}" style="--i:${i}"><span class="qp-ic">${Q_ICON[q.g]}</span><span class="qp-qt"><b>${esc(q.t)}</b><span>${esc(q.d)}</span><i class="qp-pb"><i style="--p:${Math.round(100 * q.now / q.need)}%"></i></i></span><span class="qp-qs">${q.done ? '<b class="qp-ok">完成</b>' : `<b>${q.now}/${q.need}</b>`}<small>+${Q_XP} XP</small></span></div>`).join('')}</div>
      <div class="qp-week">${week}</div>
      <p class="note">三個都完成再加 ${Q_BONUS} XP。任務每天換一組，全部在鼓勵「看沒看過的」：新頻道、沒看過的遊戲、深度內容。只看這台裝置的觀看紀錄，不會上傳，也不會拿來推片。</p>
    </div></section>`;
}

'use strict';
/* 觀戰 SPECTATE — 路由、點擊、開場 */

let ROUTE = null, BASE = 'home', PENDING_CTX = '';
const SCROLL = new Map();
const TAB_OF = (r) => (r.startsWith('live') ? 'live' : r.startsWith('games') || r.startsWith('g/') ? 'games' : r.startsWith('rookies') ? 'rookies' : r.startsWith('me') || r === 'key' ? 'me' : 'home');

function parse() { return decodeURIComponent((location.hash || '').replace(/^#/, '')) || 'home'; }

function render(r) {
  const v = $('#view');
  let html;
  try {
    if (r === 'home') html = vHome();
    else if (r === 'live') html = vLive();
    else if (r === 'games') html = vGames();
    else if (r.startsWith('g/')) html = vGame(r.slice(2));
    else if (r === 'rookies') html = vRookies();
    else if (r === 'me') html = vMe();
    else if (r === 'pick') html = vPick();
    else if (r === 'key') html = vKey();
    else if (r.startsWith('ch/')) html = vChannel(r.slice(3));
    else if (r.startsWith('list/')) html = vList(r.slice(5));
    else html = vHome();
  } catch (e) {
    console.error(e);
    html = empty('這頁打不開', esc(e.message), '<a class="btn" href="#home">回轉播台</a>');
  }
  v.innerHTML = html;
  v.className = 'r-' + r.split('/')[0];
  $$('#tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === TAB_OF(r)));
  moveTabInk();
  if (r === 'home') heroStart(); else clearInterval(heroTimer);
  if (r === 'games') { const q = $('#gameQ'); if (q) q.addEventListener('input', () => { gameFilter = q.value; const pos = q.selectionStart; render('games'); const q2 = $('#gameQ'); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) { /* */ } }); }
