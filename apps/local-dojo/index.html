<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本機道場 LOCAL DOJO</title>
<meta name="description" content="給 RTX 5090 筆電的本機 AI 修煉課：六關六條腰帶，從看懂模型到 Agent 流水線。">
<meta name="theme-color" content="#05060c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="本機道場">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060c'/%3E%3Cpath d='M6 26 Q32 20 58 26 L58 34 Q32 28 6 34 Z' fill='%23ffd23f'/%3E%3Cpath d='M29 33 L21 52 L27 53 L33 36 Z M35 33 L43 52 L37 53 L31 36 Z' fill='%23ffd23f'/%3E%3Crect x='25' y='21' width='14' height='15' rx='4' fill='%23ffd23f' stroke='%23000' stroke-opacity='.3'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #05060c; --bg2: #0b0d18;
  --panel: rgba(255,255,255,.035); --panel2: rgba(255,255,255,.065); --panel3: rgba(255,255,255,.1);
  --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.15);
  --text: #eceef7; --dim: #9aa0b6; --dim2: #6a7088;
  --acc: #ffd23f; --acc2: #ffd23f33; --good: #3ee08f; --bad: #ff5468; --info: #4aa8ff; --violet: #b27cff;
  --r: 18px; --r2: 12px;
  --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.65 var(--font); background: var(--bg);
  -webkit-font-smoothing: antialiased; overflow-x: hidden; letter-spacing: .01em;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
b { color: #fff; font-weight: 700; }
a { color: var(--acc); }
::selection { background: var(--acc); color: #000; }

/* ── ambient background ── */
#bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
#bg::before {
  content: ''; position: absolute; inset: -20% -20% 30% -20%;
  background:
    radial-gradient(40% 35% at 20% 10%, color-mix(in srgb, var(--acc) 22%, transparent), transparent 70%),
    radial-gradient(35% 30% at 85% 0%, color-mix(in srgb, var(--acc) 12%, transparent), transparent 70%),
    radial-gradient(60% 50% at 50% 100%, rgba(74,168,255,.06), transparent 70%);
  transition: background 1.2s;
}
#bg::after {
  content: ''; position: absolute; left: -50%; right: -50%; bottom: -10%; height: 46%;
  background-image:
    linear-gradient(color-mix(in srgb, var(--acc) 26%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--acc) 26%, transparent) 1px, transparent 1px);
  background-size: 64px 64px; transform: perspective(420px) rotateX(62deg); transform-origin: 50% 100%;
  mask-image: linear-gradient(to top, rgba(0,0,0,.55), transparent 85%);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.55), transparent 85%);
  opacity: .5;
}

/* ── top bar ── */
#top {
  position: sticky; top: 0; z-index: 30; padding: calc(var(--st) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(to bottom, rgba(5,6,12,.92), rgba(5,6,12,.72));
  backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
#top .back { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--panel2); flex: none; }
#top .back svg { width: 20px; height: 20px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand .logo { width: 34px; height: 34px; flex: none; }
.brand .nm { min-width: 0; }
.brand .nm b { display: block; font-size: 17px; letter-spacing: .12em; line-height: 1.15; white-space: nowrap; }
.brand .nm small { display: block; font: 600 10px/1.2 var(--mono); letter-spacing: .32em; color: var(--acc); opacity: .9; }
.brand .ttl { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .ttl small { display: block; font-weight: 500; font-size: 11.5px; color: var(--dim); letter-spacing: .06em; }
.hud { display: flex; align-items: center; gap: 6px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font: 600 12.5px/1 var(--mono); white-space: nowrap; }
.pill svg { width: 14px; height: 14px; }
.pill.xp { color: var(--acc); }
.pill.fire { color: #ff9a3e; }

/* ── layout ── */
#view { max-width: 780px; margin: 0 auto; padding: 16px 16px calc(96px + var(--sb)); min-height: 70vh; }
#view.enter > * { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
#view.enter > *:nth-child(2) { animation-delay: .04s; } #view.enter > *:nth-child(3) { animation-delay: .08s; }
#view.enter > *:nth-child(4) { animation-delay: .12s; } #view.enter > *:nth-child(5) { animation-delay: .16s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c, var(--acc)) 55%, transparent); } 70% { box-shadow: 0 0 0 14px transparent; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }

/* ── tab bar ── */
#tabs {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--sb)); z-index: 40;
  display: flex; gap: 4px; padding: 6px; border-radius: 22px; width: min(440px, calc(100% - 24px));
  background: rgba(14,16,28,.86); border: 1px solid var(--line2);
  backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: 0 12px 40px rgba(0,0,0,.55);
}
#tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 16px; color: var(--dim); font-size: 11.5px; font-weight: 600; position: relative; transition: color .2s, background .2s; }
#tabs button svg { width: 22px; height: 22px; }
#tabs button.on { color: #0a0a0a; background: var(--acc); }
#tabs .badge { position: absolute; top: 3px; right: calc(50% - 22px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font: 700 10.5px/17px var(--mono); }
#tabs button.on .badge { background: #111; color: var(--acc); }
body.inlesson #tabs { transform: translateX(-50%) translateY(140%); }
#tabs { transition: transform .35s cubic-bezier(.2,.8,.2,1); }

/* ── generic ── */
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.sec { margin: 26px 0 12px; display: flex; align-items: baseline; gap: 10px; }
.sec h2 { margin: 0; font-size: 19px; letter-spacing: .06em; }
.sec small { color: var(--dim); font-size: 13px; }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 14px; font-weight: 700; background: var(--acc); color: #0b0b0b; transition: transform .15s, filter .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn.big { padding: 15px 22px; font-size: 17px; border-radius: 16px; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); }
.btn.sm { padding: 8px 12px; font-size: 13.5px; border-radius: 11px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
.chip.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.chip.acc { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 40%, transparent); background: color-mix(in srgb, var(--acc) 10%, transparent); }
.chip svg { width: 13px; height: 13px; }
.bar { height: 8px; border-radius: 9px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--acc)) 70%, #fff), var(--c, var(--acc))); width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

/* ── home hero ── */
.hero { position: relative; overflow: hidden; padding: 20px 18px 18px; border-radius: 24px; background: linear-gradient(160deg, color-mix(in srgb, var(--acc) 16%, #0d1020) 0%, #0b0d18 55%); border: 1px solid color-mix(in srgb, var(--acc) 30%, transparent); }
.hero::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--acc) 30%, transparent), transparent 70%); pointer-events: none; }
.hero .top { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
.hero .beltwrap { width: 112px; flex: none; filter: drop-shadow(0 6px 18px color-mix(in srgb, var(--belt, #fff) 35%, transparent)); }
.hero .rank small { display: block; color: var(--dim); font-size: 12.5px; letter-spacing: .12em; }
.hero .rank b { display: block; font-size: 26px; letter-spacing: .14em; line-height: 1.25; }
.hero .rank span { display: block; font-size: 13px; line-height: 1.5; color: var(--dim); }
.hero .prog { margin: 16px 0 6px; position: relative; z-index: 1; }
.hero .prog .lbl { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
.hero .next { position: relative; z-index: 1; margin-top: 14px; display: flex; gap: 10px; align-items: stretch; }
.hero .next .btn { flex: 1; }
.hero .nexthint { margin-top: 10px; font-size: 13px; color: var(--dim); position: relative; z-index: 1; }
.hero .nexthint b { color: var(--text); }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.quick button { padding: 12px 8px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); text-align: center; position: relative; }
.quick button b { display: block; font: 700 20px/1.2 var(--mono); }
.quick button span { font-size: 12px; color: var(--dim); }
.quick button.hot { border-color: color-mix(in srgb, var(--bad) 60%, transparent); }
.quick button.hot b { color: var(--bad); }

/* ── path ── */
.stage { margin-top: 30px; position: relative; --c: var(--acc); }
.stage .shead { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 20px; background: linear-gradient(120deg, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); border: 1px solid color-mix(in srgb, var(--c) 28%, transparent); position: relative; overflow: hidden; }
.stage .shead .num { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--c); color: #0b0b0b; font: 800 22px/1 var(--mono); flex: none; }
.stage.black .shead .num { background: #121212; color: var(--c); border: 1px solid var(--c); }
.stage .shead .tx { min-width: 0; flex: 1; }
.stage .shead .tx small { display: block; font: 600 10.5px/1.3 var(--mono); letter-spacing: .3em; color: var(--c); }
.stage .shead .tx b { display: block; font-size: 17px; line-height: 1.35; }
.stage .shead .tx span { font-size: 12.5px; color: var(--dim); }
.stage .shead .bt { width: 64px; flex: none; }
.stage.locked .shead { filter: grayscale(.7); opacity: .6; }
.stage .intro { margin: 10px 4px 0; font-size: 13.5px; color: var(--dim); }
.path { position: relative; padding: 16px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.path svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node { position: relative; display: flex; align-items: center; gap: 12px; width: min(340px, 92%); padding: 10px 12px 10px 10px; border-radius: 20px; background: rgba(12,14,26,.85); border: 1px solid var(--line); text-align: left; transition: transform .15s, border-color .2s; z-index: 1; }
.node:active { transform: scale(.98); }
.node .orb { width: 50px; height: 50px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--panel2); border: 2px solid var(--line2); color: var(--dim); font: 800 15px/1 var(--mono); position: relative; }
.node .orb svg { width: 22px; height: 22px; }
.node .t { min-width: 0; flex: 1; }
.node .t b { display: block; font-size: 15px; line-height: 1.35; }
.node .t span { display: block; font-size: 12px; color: var(--dim); }
.node .mk { display: flex; gap: 4px; flex: none; }
.node .mk i { width: 9px; height: 9px; border-radius: 3px; background: rgba(255,255,255,.12); }
.node .mk i.on { background: var(--c); box-shadow: 0 0 8px var(--c); }
.node.open { border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.node.open .orb { border-color: var(--c); color: var(--c); animation: pulse 2.2s infinite; }
.node.done .orb { background: var(--c); border-color: var(--c); color: #0b0b0b; }
.node.locked { opacity: .45; }
.node.boss { width: min(360px, 96%); background: linear-gradient(120deg, color-mix(in srgb, var(--c) 20%, #0c0e1a), #0c0e1a); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.node.boss .orb { border-radius: 16px; width: 54px; height: 54px; }
.node.boss.done .orb { background: var(--c); }
.l0 { transform: translateX(-34px); } .l1 { transform: translateX(0); } .l2 { transform: translateX(34px); } .l3 { transform: translateX(0); }
@media (max-width: 420px) { .l0 { transform: translateX(-16px); } .l2 { transform: translateX(16px); } }

/* ── lesson ── */
.lhero { padding: 6px 2px 4px; --c: var(--acc); }
.lhero .kick { font: 700 11px/1.3 var(--mono); letter-spacing: .3em; color: var(--c); }
.lhero h1 { margin: 6px 0 4px; font-size: 27px; line-height: 1.3; letter-spacing: .03em; }
.lhero .sub { color: var(--dim); font-size: 15px; }
.lhero .goal { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--c) 9%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); font-size: 14.5px; display: flex; gap: 10px; }
.lhero .goal svg { width: 20px; height: 20px; flex: none; color: var(--c); margin-top: 2px; }
.lhero .meta { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.stepnav { position: sticky; top: calc(var(--st) + 59px); z-index: 20; margin: 16px -16px 6px; padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(to bottom, rgba(5,6,12,.95), rgba(5,6,12,.75)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.stepnav::-webkit-scrollbar { display: none; }
.stepnav a { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--dim); background: var(--panel); border: 1px solid var(--line); text-decoration: none; }
.stepnav a i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.18); }
.stepnav a.ok i { background: var(--good); box-shadow: 0 0 6px var(--good); }
.blk { margin-top: 26px; scroll-margin-top: 130px; }
.blk > h3 { margin: 0 0 12px; font-size: 18px; display: flex; align-items: center; gap: 10px; letter-spacing: .05em; }
.blk > h3 .n { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--c, var(--acc)); color: #0b0b0b; font: 800 14px/1 var(--mono); }
.blk > h3 small { font-size: 12.5px; color: var(--dim); font-weight: 500; letter-spacing: 0; }
.cc { position: relative; padding: 16px 16px 15px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 12px; font-size: 15.5px; }
.cc h4 { margin: 0 0 6px; font-size: 16.5px; display: flex; align-items: center; gap: 8px; }
.cc h4 .tag { font: 700 10.5px/1 var(--mono); letter-spacing: .12em; padding: 4px 7px; border-radius: 6px; background: var(--panel3); color: var(--dim); }
.cc p { margin: 0; color: #d5d8e6; }
.cc.analogy { border-color: rgba(178,124,255,.35); background: linear-gradient(140deg, rgba(178,124,255,.1), var(--panel) 60%); }
.cc.analogy h4 .tag { background: rgba(178,124,255,.22); color: #d4b8ff; }
.cc.key { border-color: color-mix(in srgb, var(--c, var(--acc)) 40%, transparent); background: linear-gradient(140deg, color-mix(in srgb, var(--c, var(--acc)) 11%, transparent), var(--panel) 60%); }
.cc.key h4 .tag { background: color-mix(in srgb, var(--c, var(--acc)) 25%, transparent); color: var(--c, var(--acc)); }
.cc.warn { border-color: rgba(255,84,104,.35); background: linear-gradient(140deg, rgba(255,84,104,.1), var(--panel) 60%); }
.cc.warn h4 .tag { background: rgba(255,84,104,.2); color: #ff8c99; }
.cc.num { border-color: rgba(74,168,255,.35); background: linear-gradient(140deg, rgba(74,168,255,.1), var(--panel) 60%); }
.cc.num h4 .tag { background: rgba(74,168,255,.2); color: #8cc8ff; }
.cc.hid { display: none; }
.cc.new { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
.reveal { display: flex; gap: 10px; align-items: center; }
.reveal .cnt { font: 600 13px/1 var(--mono); color: var(--dim); }
.wbox { padding: 16px; border-radius: 20px; background: linear-gradient(160deg, #0f1222, #0a0c17); border: 1px solid var(--line2); position: relative; overflow: hidden; }
.wbox .wt { font-size: 13px; color: var(--dim); margin-bottom: 10px; display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; row-gap: 2px; }
.wbox .wt b { color: var(--text); font-size: 15px; }
.wbox canvas { width: 100%; display: block; border-radius: 12px; background: #000; }

/* ── task ── */
.task { border-radius: 20px; border: 1px solid color-mix(in srgb, var(--c, var(--acc)) 35%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--c, var(--acc)) 10%, #0b0d18), #0b0d18 60%); padding: 16px; }
.task h4 { margin: 0 0 4px; font-size: 18px; }
.task .why { color: var(--dim); font-size: 14px; margin-bottom: 12px; }
.task .before { font-size: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(255,210,63,.08); border: 1px dashed rgba(255,210,63,.35); margin-bottom: 12px; }
.prompt { position: relative; border-radius: 14px; background: #04050a; border: 1px solid var(--line2); }
.prompt .ph { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--dim); }
.prompt .ph .grow { min-width: 0; }
.prompt pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; font: 14px/1.7 var(--font); color: #dfe3f2; max-height: 340px; overflow: auto; }
.prompt pre mark { background: color-mix(in srgb, var(--acc) 22%, transparent); color: #fff; border-radius: 4px; padding: 0 3px; }
.checks { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.ck { display: flex; gap: 12px; align-items: flex-start; padding: 11px 12px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; font-size: 14.5px; transition: background .2s, border-color .2s; text-align: left; width: 100%; }
.ck .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line2); flex: none; display: grid; place-items: center; margin-top: 1px; transition: all .2s; }
.ck .box svg { width: 14px; height: 14px; opacity: 0; color: #0b0b0b; }
.ck.on { border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 8%, transparent); }
.ck.on .box { background: var(--good); border-color: var(--good); }
.ck.on .box svg { opacity: 1; }
details.stuck { margin-top: 12px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); }
details.stuck summary { padding: 11px 14px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--dim); list-style: none; display: flex; align-items: center; gap: 8px; }
details.stuck summary::-webkit-details-marker { display: none; }
details.stuck summary svg { width: 18px; height: 18px; flex: none; }
details.stuck[open] summary { color: var(--text); }
details.stuck .it { padding: 0 14px 12px; font-size: 14px; }
details.stuck .it b { display: block; color: #ffb3bd; font-size: 13.5px; }
.donebar { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--good) 12%, transparent); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); display: flex; gap: 10px; align-items: center; font-weight: 600; }
.donebar svg { width: 22px; height: 22px; color: var(--good); flex: none; }
textarea.note, input.inp, select.inp { width: 100%; padding: 12px 14px; border-radius: 13px; background: #04050a; border: 1px solid var(--line2); outline: none; font-size: 15px; line-height: 1.6; resize: vertical; }
textarea.note:focus, input.inp:focus, select.inp:focus { border-color: var(--acc); }
textarea.note { min-height: 96px; }

/* ── quiz ── */
.quiz { border-radius: 20px; background: var(--panel); border: 1px solid var(--line); padding: 16px; }
.qhead { display: flex; justify-content: space-between; align-items: center; font: 600 12.5px/1 var(--mono); color: var(--dim); margin-bottom: 12px; }
.qdots { display: flex; gap: 5px; }
.qdots i { width: 22px; height: 6px; border-radius: 4px; background: rgba(255,255,255,.12); }
.qdots i.r { background: var(--good); } .qdots i.w { background: var(--bad); } .qdots i.cur { background: var(--acc); }
.qq { font-size: 17px; font-weight: 700; line-height: 1.5; margin-bottom: 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); text-align: left; font-size: 15px; transition: all .18s; width: 100%; }
.opt .k { width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center; font: 700 12px/1 var(--mono); background: var(--panel3); color: var(--dim); margin-top: 1px; }
.opt:not([disabled]):active { transform: scale(.98); }
.opt.right { background: color-mix(in srgb, var(--good) 14%, transparent); border-color: var(--good); }
.opt.right .k { background: var(--good); color: #0b0b0b; }
.opt.wrong { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: var(--bad); animation: shake .4s; }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt[disabled] { cursor: default; }
.opt.fade { opacity: .45; }
.why { margin-top: 12px; padding: 12px 14px; border-radius: 14px; font-size: 14.5px; animation: fadeUp .3s both; }
.why.r { background: color-mix(in srgb, var(--good) 9%, transparent); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
.why.w { background: color-mix(in srgb, var(--bad) 9%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.why b.hd { display: block; margin-bottom: 2px; }
.qres { text-align: center; padding: 8px 0 4px; }
.qres .score { font: 800 46px/1.1 var(--mono); color: var(--acc); }
.qres p { color: var(--dim); margin: 4px 0 14px; }

/* ── review ── */
.seg { display: flex; gap: 6px; padding: 5px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; padding: 9px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--dim); white-space: nowrap; }
.seg button.on { background: var(--panel3); color: var(--text); }
.seg button .n { font: 700 11px/1 var(--mono); margin-left: 4px; color: var(--bad); }
.flash { perspective: 1200px; margin: 18px auto 0; max-width: 460px; }
.flash .in { position: relative; height: 290px; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; cursor: pointer; }
.flash.flip .in { transform: rotateY(180deg); }
.flash .face { position: absolute; inset: 0; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line2); }
.flash .front { background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--acc) 20%, #12152a), #0b0d18 75%); }
.flash .front b { font-size: 30px; letter-spacing: .06em; line-height: 1.35; }
.flash .front small { margin-top: 12px; color: var(--dim); font-size: 13px; }
.flash .back { background: linear-gradient(160deg, #141831, #0b0d18); transform: rotateY(180deg); }
.flash .back p { margin: 0; font-size: 16.5px; }
.flash .back .ex { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(178,124,255,.12); color: #d9c3ff; font-size: 14.5px; }
.flash .box5 { position: absolute; top: 14px; right: 16px; display: flex; gap: 4px; }
.flash .box5 i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.15); }
.flash .box5 i.on { background: var(--acc); }
.fbtns { display: flex; gap: 10px; max-width: 460px; margin: 14px auto 0; }
.fbtns .btn { flex: 1; }
.empty { text-align: center; padding: 34px 16px; color: var(--dim); }
.empty .ic { font-size: 42px; margin-bottom: 8px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.li { padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.li .h { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
.li .q { font-weight: 700; }

/* ── tools ── */
.tgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.tcard { padding: 16px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); text-align: left; position: relative; overflow: hidden; min-height: 140px; display: flex; flex-direction: column; }
.tcard .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: color-mix(in srgb, var(--tc) 18%, transparent); color: var(--tc); margin-bottom: 10px; }
.tcard .ic svg { width: 24px; height: 24px; }
.tcard b { font-size: 16px; }
.tcard span { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
.tcard::after { content: ''; position: absolute; right: -30px; bottom: -30px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--tc) 22%, transparent), transparent 70%); }
.fld { margin-bottom: 14px; }
.fld label { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
.fld label b { font-family: var(--mono); color: var(--text); }
input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 30px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--acc); margin-top: -9px; box-shadow: 0 0 0 4px rgba(0,0,0,.4), 0 0 14px color-mix(in srgb, var(--acc) 60%, transparent); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--acc); border: 0; }
.opts2 { display: flex; flex-wrap: wrap; gap: 6px; }
.opts2 button { padding: 7px 12px; border-radius: 11px; font-size: 13.5px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
.opts2 button.on { background: color-mix(in srgb, var(--acc) 18%, transparent); border-color: var(--acc); color: var(--text); }
.meter { margin: 6px 0 4px; }
.meter .lane { position: relative; height: 34px; border-radius: 10px; background: rgba(255,255,255,.05); overflow: hidden; border: 1px solid var(--line); }
.meter .lane i { position: absolute; top: 0; bottom: 0; left: 0; transition: width .5s cubic-bezier(.2,.8,.2,1), left .5s; }
.meter .lane .cap { position: absolute; top: 0; bottom: 0; border-left: 2px dashed rgba(255,255,255,.55); }
.meter .lane span { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 10px; font: 600 12.5px/1 var(--mono); text-shadow: 0 1px 3px #000; }
.meter .legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 4px; }
.verdict { margin-top: 12px; padding: 14px; border-radius: 16px; display: flex; gap: 12px; align-items: center; }
.verdict .big { font: 800 28px/1 var(--mono); }
.verdict .tx b { display: block; font-size: 16px; }
.verdict .tx span { font-size: 13.5px; color: var(--dim); }
.verdict.ok { background: color-mix(in srgb, var(--good) 10%, transparent); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); }
.verdict.mid { background: rgba(255,170,60,.1); border: 1px solid rgba(255,170,60,.4); }
.verdict.no { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.kv div { padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.kv small { display: block; font-size: 11.5px; color: var(--dim); }
.kv b { font: 700 18px/1.3 var(--mono); }
.stream { min-height: 150px; padding: 14px; border-radius: 14px; background: #04050a; border: 1px solid var(--line2); font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
.stream .cur { display: inline-block; width: 8px; height: 17px; background: var(--acc); vertical-align: -3px; animation: blink 1s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.decode { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.decode .part { padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); flex: 1 1 200px; }
.decode .part code { font: 700 14px/1.3 var(--mono); color: var(--acc); }
.decode .part small { display: block; color: var(--dim); font-size: 11.5px; letter-spacing: .1em; }
.decode .part p { margin: 3px 0 0; font-size: 14px; }
.gloss { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.gloss .g { padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.gloss .g b { font-size: 15.5px; }
.gloss .g .l { float: right; font: 600 11.5px/1.6 var(--mono); color: var(--dim); }
.gloss .g p { margin: 3px 0 0; font-size: 14px; color: #d0d3e2; }
.gloss .g .ex { font-size: 13px; color: #c9b3f5; margin-top: 3px; }
.gloss .g.lock { opacity: .4; }

/* ── me ── */
.belthero { text-align: center; padding: 22px 16px 18px; border-radius: 24px; background: radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--belt, #fff) 22%, #10132a), #0a0c17 70%); border: 1px solid var(--line2); position: relative; overflow: hidden; }
.belthero .bw { width: 220px; margin: 0 auto; filter: drop-shadow(0 10px 30px color-mix(in srgb, var(--belt, #fff) 40%, transparent)); }
.belthero b { display: block; font-size: 28px; letter-spacing: .2em; margin-top: 6px; }
.belthero span { color: var(--dim); font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.stats div { padding: 12px 8px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
.stats b { display: block; font: 800 21px/1.2 var(--mono); }
.stats span { font-size: 11.5px; color: var(--dim); }
.belts { display: flex; justify-content: space-between; gap: 4px; margin-top: 12px; padding: 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.belts div { flex: 1; text-align: center; font-size: 11px; color: var(--dim); }
.belts div svg { width: 100%; max-width: 54px; }
.belts div.off { opacity: .25; filter: grayscale(1); }
.wall { display: flex; flex-direction: column; gap: 10px; }
.wall .w { padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--acc)); }
.wall .w .h { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--dim); }
.wall .w b { display: block; font-size: 15.5px; margin: 2px 0; }
.wall .w p { margin: 4px 0 0; font-size: 14px; color: #d0d3e2; white-space: pre-wrap; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.bdg { padding: 12px 6px 10px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
.bdg .m { width: 52px; height: 52px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 800; background: conic-gradient(from 200deg, #ffd23f, #ff5468, #b27cff, #4aa8ff, #3ee08f, #ffd23f); color: #0b0b0b; box-shadow: 0 0 18px rgba(255,210,63,.3); }
.bdg b { display: block; font-size: 13px; }
.bdg span { display: block; font-size: 11px; color: var(--dim); line-height: 1.4; }
.bdg.off { opacity: .35; }
.bdg.off .m { background: rgba(255,255,255,.08); color: var(--dim); box-shadow: none; }
.setrow { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; }
.setrow .tx { flex: 1; }
.setrow .tx b { display: block; }
.setrow .tx span { font-size: 13px; color: var(--dim); }
.tog { width: 52px; height: 30px; border-radius: 99px; background: rgba(255,255,255,.14); position: relative; transition: background .2s; flex: none; }
.tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.tog.on { background: var(--good); }
.tog.on::after { transform: translateX(22px); }
.about { text-align: center; color: var(--dim2); font-size: 12.5px; margin: 26px 0 0; line-height: 1.8; }

/* ── overlays ── */
#toasts { position: fixed; top: calc(var(--st) + 66px); left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(420px, calc(100% - 24px)); }
.toast { padding: 10px 16px; border-radius: 14px; background: rgba(18,20,36,.96); border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 14px; font-weight: 600; display: flex; gap: 10px; align-items: center; animation: pop .35s both; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: all .3s; }
.toast .x { font: 800 15px/1 var(--mono); color: var(--acc); }
.xpf { position: fixed; z-index: 95; pointer-events: none; font: 800 18px/1 var(--mono); color: var(--acc); text-shadow: 0 0 12px color-mix(in srgb, var(--acc) 70%, transparent); animation: xpup 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes xpup { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
#sheet { position: fixed; inset: 0; z-index: 80; display: none; }
#sheet.on { display: block; }
#sheet .bk { position: absolute; inset: 0; background: rgba(0,0,0,.6); animation: fadeIn .25s both; }
@keyframes fadeIn { from { opacity: 0; } }
#sheet .pn { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(560px, 100%); max-height: 86vh; overflow: auto; padding: 22px 18px calc(22px + var(--sb)); border-radius: 26px 26px 0 0; background: #0f1222; border: 1px solid var(--line2); border-bottom: 0; animation: up .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes up { from { transform: translate(-50%, 100%); } }
#sheet h3 { margin: 0 0 6px; font-size: 20px; }
#sheet p { margin: 0 0 14px; color: var(--dim); }
#sheet .acts { display: flex; flex-direction: column; gap: 8px; }
#cere { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--belt) 35%, #05060c), #05060c 70%); }
#cere.on { display: grid; animation: fadeIn .4s both; }
#cere .rays { position: absolute; left: 50%; top: 45%; width: 180vmax; height: 180vmax; margin: -90vmax 0 0 -90vmax; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--belt) 22%, transparent) 0deg 8deg, transparent 8deg 20deg); animation: spin 26s linear infinite; mask-image: radial-gradient(circle, #000 0%, transparent 55%); -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%); }
#cere canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#cere .ct { position: relative; text-align: center; padding: 24px; max-width: 520px; }
#cere .ct small { font: 700 12px/1 var(--mono); letter-spacing: .5em; color: var(--belt2, var(--belt)); }
#cere .ct .bw { width: min(300px, 76vw); margin: 18px auto 6px; animation: pop .9s cubic-bezier(.2,.8,.2,1) .2s both; filter: drop-shadow(0 14px 40px color-mix(in srgb, var(--belt) 60%, transparent)); }
#cere .ct h2 { margin: 6px 0; font-size: 40px; letter-spacing: .3em; animation: pop .7s .55s both; }
#cere .ct p { color: #d8dbea; font-size: 16px; margin: 0 0 22px; animation: fadeUp .6s .8s both; }
#cere .ct .btn { animation: fadeUp .6s 1s both; }
.cert { width: 100%; border-radius: 16px; border: 1px solid var(--line2); display: block; }

/* ── widgets ── */
.probs { display: flex; flex-direction: column; gap: 7px; }
.prob { display: grid; grid-template-columns: 1fr; position: relative; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); text-align: left; overflow: hidden; font-size: 15px; width: 100%; }
.prob i { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--acc) 22%, transparent); transition: width .45s cubic-bezier(.2,.8,.2,1); }
.prob span { position: relative; display: flex; justify-content: space-between; gap: 10px; }
.prob span em { font: 700 13px/1.6 var(--mono); font-style: normal; color: var(--acc); }
.sent { padding: 14px; border-radius: 14px; background: #04050a; border: 1px solid var(--line2); font-size: 17px; line-height: 1.7; margin-bottom: 12px; min-height: 60px; }
.sent .nw { color: var(--acc); animation: pop .35s both; display: inline-block; }
.nodesgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.nd { padding: 10px; border-radius: 12px; border: 1px solid var(--line2); background: #121628; text-align: left; font-size: 13.5px; font-weight: 600; position: relative; }
.nd small { display: block; font: 600 10px/1.4 var(--mono); color: var(--dim); letter-spacing: .08em; }
.nd.used { opacity: .25; pointer-events: none; }
.nd.bad { animation: shake .4s; border-color: var(--bad); }
.chain { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 40px; padding: 10px; border-radius: 12px; background: #04050a; border: 1px dashed var(--line2); }
.chain .cn { padding: 6px 10px; border-radius: 9px; background: color-mix(in srgb, var(--acc) 16%, transparent); border: 1px solid color-mix(in srgb, var(--acc) 50%, transparent); font-size: 12.5px; font-weight: 700; animation: pop .3s both; }
.chain .ar { color: var(--dim); font-size: 12px; }
.chain .hint { color: var(--dim2); font-size: 13px; }
.cks2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cnt2 { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 13.5px; }
.cnt2 .grow { min-width: 0; }
.cnt2 button { width: 28px; height: 28px; border-radius: 9px; background: var(--panel3); font-weight: 800; }
.cnt2 b { font-family: var(--mono); min-width: 20px; text-align: center; }
.term { padding: 12px 14px; border-radius: 12px; background: #04050a; border: 1px solid var(--line2); font: 13px/1.7 var(--mono); white-space: pre-wrap; word-break: break-word; min-height: 140px; max-height: 300px; overflow: auto; }
.term .th { color: #d4b8ff; } .term .dd { color: #7ad7ff; } .term .ss { color: #a7f3c8; } .term .fin { color: var(--acc); font-weight: 700; }
.term .ln { animation: fadeUp .3s both; display: block; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .grid2, .cks2 { grid-template-columns: 1fr; } .tgrid { grid-template-columns: 1fr 1fr; } }
.pick { display: flex; flex-direction: column; gap: 8px; }
.pick button { padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line2); text-align: left; font-size: 14.5px; }
.pick button b { display: block; font-size: 15.5px; }
.pick button.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 12%, transparent); }
.res { margin-top: 12px; padding: 14px; border-radius: 14px; background: color-mix(in srgb, var(--acc) 9%, transparent); border: 1px solid color-mix(in srgb, var(--acc) 35%, transparent); animation: fadeUp .35s both; }
.res b.big { display: block; font-size: 19px; color: var(--acc); margin-bottom: 4px; }
.small { font-size: 13px; color: var(--dim); }
.scatter { width: 100%; display: block; border-radius: 14px; background: #04050a; border: 1px solid var(--line2); }

      '<div class="res" data-o="ex" style="margin-top:4px"></div>';
    const cv = $('canvas', el), g = cv.getContext('2d');
    const bstep = (img, b) => { const w = img.width, h = img.height, s = img.data, o = new Uint8ClampedArray(s.length); for (let y = 0; y < h; y += b) for (let x = 0; x < w; x += b) { let r = 0, gg = 0, bb = 0, n = 0; for (let yy = y; yy < Math.min(h, y + b); yy++) for (let xx = x; xx < Math.min(w, x + b); xx++) { const i = (yy * w + xx) * 4; r += s[i]; gg += s[i + 1]; bb += s[i + 2]; n++; } r /= n; gg /= n; bb /= n; for (let yy = y; yy < Math.min(h, y + b); yy++) for (let xx = x; xx < Math.min(w, x + b); xx++) { const i = (yy * w + xx) * 4; o[i] = r; o[i + 1] = gg; o[i + 2] = bb; o[i + 3] = 255; } } return o; };

      for (let i = 0; i < nz.length; i += 4) { const v = r() * 255; nz[i] = v * (0.7 + r() * 0.6); nz[i + 1] = v * (0.7 + r() * 0.6); nz[i + 2] = v * (0.7 + r() * 0.6); nz[i + 3] = 255; }

    const QR = /(UD-)?(IQ\d_[A-Z]+|Q\d_K_[SMLX]{1,2}|Q\d_K|Q\d_[01]|MXFP4|NVFP4|FP8|FP16|BF16|F16|INT8|INT4|AWQ|GPTQ|EXL2)/i;

    $('[data-f=t]', el).value = txt;
    function parse(s) {
      const P = []; let total = 0, active = 0, qk = '';
      const fam = FAM.find((f) => f[0].test(s)); if (fam) { const v = s.match(new RegExp(fam[1].replace(/[-\s]/g, '.?') + '[-_ ]?(\\d+(?:\\.\\d+)?)(?![\\d.]*[bB])', 'i')); P.push([fam[1] + (v ? ' ' + v[1] : ''), '家族', fam[2] + (v ? '，第 ' + v[1] + ' 代' : '')]); }
      const oss = /gpt-oss-20b/i.test(s) ? [21, 3.6] : /gpt-oss-120b/i.test(s) ? [117, 5.1] : null;

      if (oss) { total = oss[0]; active = oss[1]; P.push([oss[0] + 'B（每次 ' + oss[1] + 'B）', '大小', 'gpt-oss 是 MoE：總參數約 ' + oss[0] + 'B，每個字只啟用約 ' + oss[1] + 'B']); }

      TAG.forEach((t) => { const m = s.match(t[0]); if (m && !P.some((p) => p[1] === t[1] || p[0] === t[1])) P.push([m[0].replace(/^[-_]/, ''), t[1], t[2]]); });
      const qmap = (k) => qinfo(k) || (k === 'BF16' ? Q('FP16') : /^Q8/.test(k) ? Q('Q8_0') : /^Q6/.test(k) ? Q('Q6_K') : /^Q5/.test(k) ? Q('Q5_K_M') : /^IQ4/.test(k) ? Q('IQ4_XS') : /^Q4/.test(k) ? Q('Q4_K_M') : /^I?Q3/.test(k) ? Q('Q3_K_M') : /^I?Q2/.test(k) ? Q('Q2_K') : /^INT8/.test(k) ? Q('Q8_0') : /^(INT4|AWQ|GPTQ)/.test(k) ? Q('Q4_K_M') : null);

      if (/\.gguf$/i.test(s)) P.push(['.gguf', '格式', '給 Ollama、LM Studio、llama.cpp 用']);
      if (/\.safetensors$/i.test(s)) P.push(['.safetensors', '格式', '原始權重格式，ComfyUI、訓練工具用']);
      return { P, total, active: active || total, qk };
    }
    function draw() {
      const r = parse(txt); api.set('dec', txt);
      let sum = '';
      if (r.total && r.qk) {
        const e = est({ total: r.total, active: r.active, q: r.qk, ctx: 8192, kv: 96 }); const v = verdictOf(e);
        sum = '<div class="verdict ' + v.c + '"><div class="big">' + (e.real ? fmt(e.real, 0) : '✗') + '</div><div class="tx"><b>約 ' + fmt(e.w, 1) + 'GB · ' + v.t + (e.real ? ' · 約 ' + fmt(e.real, 0) + ' tok/s' : '') + '</b><span>以 8K 上下文估算</span></div></div><button class="btn ghost sm" data-a="calc" style="margin-top:10px">用計算機細算 →</button>';
        el._calc = { p: 'custom', total: r.total, active: r.active, q: r.qk, ctx: 8192, kv: 96 };
      } else if (r.total) sum = '<div class="small" style="margin-top:10px">沒看到量化等級：如果是原版（FP16），檔案約 ' + fmt(r.total * 2, 1) + 'GB。</div>';
      $('[data-o=o]', el).innerHTML = (r.P.length ? '<div class="decode">' + r.P.map((p) => '<div class="part"><small>' + esc(p[1]) + '</small><code>' + esc(p[0]) + '</code><p>' + esc(p[2]) + '</p></div>').join('') + '</div>' : '<div class="small" style="margin-top:10px">認不出來。試試貼完整的檔名，例如 Qwen3.8-27B-Q4_K_M.gguf</div>') + sum;
    }
    el.addEventListener('input', (e) => { if (e.target.dataset.f === 't') { txt = e.target.value; draw(); api.done(); } });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;

      if (b.dataset.a === 'calc' && el._calc) { api.set('calcIn', el._calc); api.go('#tool-vram'); }
    });

  };
})();

  function stepOk(k, on) { const a = $('.stepnav a[data-jump="b-' + k + '"]'); if (a) a.classList.toggle('ok', !!on); }
  function drawCards(l) {

  /* ───────── 測驗引擎 ───────── */
  const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  function qget(qid) {
    const [src, ix] = qid.split(':'); const i = +ix;
    if (src[0] === 'E') { const st = D.stages.find((s) => s.id === src.slice(1)); return st && Object.assign({ qid, from: '第 ' + st.n + ' 關考驗' }, st.exam[i]); }
    const l = BYID[src]; return l && Object.assign({ qid, from: l.id + ' ' + l.title }, l.quiz[i]);
  }
  function runQuiz(box, qs, o) {
    let k = 0; const res = [];
    const keys = 'ABCD';
    function show() {
      const q = qs[k]; const order = shuffle(q.o.map((t, i) => ({ t, i })));
      box.innerHTML = '<div class="quiz"><div class="qhead"><span>' + esc(o.title || '驗收') + ' · 第 ' + (k + 1) + ' / ' + qs.length + ' 題</span><span class="qdots">' + qs.map((_, i) => '<i class="' + (i < res.length ? (res[i] ? 'r' : 'w') : i === k ? 'cur' : '') + '"></i>').join('') + '</span></div>' +
        (q.from && o.showFrom ? '<div class="small" style="margin-bottom:6px">出自：' + esc(q.from) + '</div>' : '') +
        '<div class="qq">' + esc(q.q) + '</div><div class="opts">' + order.map((x, j) => '<button class="opt" data-i="' + x.i + '"><span class="k">' + keys[j] + '</span><span>' + esc(x.t) + '</span></button>').join('') + '</div><div data-why></div></div>';
      box.onclick = (e) => {
        const b = e.target.closest('.opt'); if (!b || b.disabled) return;
        const right = +b.dataset.i === 0; res.push(right);
        $$('.opt', box).forEach((x) => { x.disabled = true; if (+x.dataset.i === 0) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); else x.classList.add('fade'); });
        S.st.ans++; if (right) S.st.right++;
        if (!right && !o.noWrong) { if (!S.wrong[q.qid]) S.st.wrongEver++; S.wrong[q.qid] = { t: Date.now() }; }
        if (right && o.onRight) o.onRight(q);
        Sound.play(right ? 'good' : 'bad'); saveSoon();
        $('[data-why]', box).innerHTML = '<div class="why ' + (right ? 'r' : 'w') + '"><b class="hd">' + (right ? '答對了！' : '差一點。正確答案是：「' + esc(q.o[0]) + '」') + '</b>' + esc(q.why || '') + '</div><div class="row" style="margin-top:12px"><button class="btn" data-nx>' + (k + 1 < qs.length ? '下一題 ▸' : '看結果') + '</button></div>';
        $('[data-nx]', box).onclick = (ev) => { ev.stopPropagation(); k++; if (k < qs.length) show(); else o.end(res); };
        $('[data-why]', box).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
    }
    show();
  }
  function drawQuiz(l) {

  /* ───────── 複習 ───────── */
  const IV = [0, 1, 3, 7, 16, 35];

    if (n) {
      const l = BYID[n.dataset.l]; Sound.play('tap');
      if (!stageOpen(l.si)) return sheet('<h3>這一關還沒解鎖</h3><p>建議先通過第 ' + l.si + ' 關的關主考驗。這一關會用到前面學過的東西。</p><div class="acts"><button class="btn" data-s="go">還是先偷看</button><button class="btn ghost" data-x>好，先回去</button></div>', () => go('#l-' + l.id));
      if (!lessonOpen(l)) return sheet('<h3>先完成上一課</h3><p>「' + esc(l.stage.lessons[l.li - 1].title) + '」看完卡片、通過驗收，就會解鎖這一課。</p><div class="acts"><button class="btn" data-s="prev">去上一課</button><button class="btn ghost" data-s="go">還是先偷看</button></div>', (s) => go('#l-' + (s === 'prev' ? l.stage.lessons[l.li - 1].id : l.id)));
      return go('#l-' + l.id);
    }
    const x = e.target.closest('[data-exam]');
    if (x) { const st = D.stages.find((s) => s.id === x.dataset.exam); Sound.play('tap'); if (!stageOpen(st.si) || !examOpen(st)) return sheet('<h3>關主考驗還沒開放</h3><p>這一關四課都學懂（看完卡片＋通過驗收）後才開放。想先挑戰也可以：答錯的題目會收進錯題本，通過的話一樣算晉升。</p><div class="acts"><button class="btn ghost" data-s="go">先試試看</button><button class="btn" data-x>好，先回去</button></div>', () => go('#exam-' + st.id)); return go('#exam-' + st.id); }
  });

  /* ───────── 第一次打開 ───────── */
  function intro() {
    sheet('<div style="width:120px;margin:0 auto 8px">' + belt(0) + '</div><h3 style="text-align:center">歡迎來到本機道場</h3><p style="text-align:center">把那本 DGX Spark 書的內容，改寫成給你的 RTX 5090 筆電的修煉課。</p>' +
      '<div class="list" style="margin-bottom:16px"><div class="li"><b>六關，六條腰帶</b><div class="small">從白帶開始。每關四課，通過關主考驗就晉升：黃、綠、藍、紫、紅，最後是黑帶。</div></div>' +
      '<div class="li"><b>每一課五個步驟</b><div class="small">看懂（白話卡片）→ 動手（互動模擬）→ 實作（複製指令給筆電的 Claude Code）→ 驗收（小測驗）→ 想一想。</div></div>' +
      '<div class="li"><b>會反覆出現的複習卡</b><div class="small">學過的術語照遺忘曲線排程；答錯的題目進錯題本，直到你答對。</div></div></div>' +
      '<div class="acts"><button class="btn big" data-s="go">開始修煉</button></div>', () => { S.intro = true; save(); go('#l-1-1'); });
    S.intro = true; save();
  }

  /* ───────── 獨立網頁版：加到主畫面、離線 ───────── */
  try {
    const host = location.hostname;
    if (window.DOJO_WEB && 'serviceWorker' in navigator && ((location.protocol === 'https:' && /github\.io$/.test(host)) || host === 'localhost' || host === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { /* ignore */ }

  /* ───────── 更新提示：打開時用一句話說最新改了什麼（每筆只說一次） ───────── */
  const LOG = D.changelog || [];
  const LOG_ID = LOG.length ? LOG[0].d : '';
  function whatsNew() {
    if (!LOG_ID || (S.seenLog || '') >= LOG_ID) return;
    S.seenLog = LOG_ID; save();
    setTimeout(() => toast('更新：' + LOG[0].t, '新', 7000), 900);
  }

  route();
  if (!S.intro) { S.seenLog = LOG_ID; setTimeout(() => { if (!S.intro) intro(); }, window.DOJO_WEB ? 350 : 1200); }
  else whatsNew();
  checkBadges();
  Cloud.init();
})();

</script>
</body>
</html>
