<meta name="color-scheme" content="dark">

<style>
/* 重新點火 REIGNITE — 一艘在灰燼星雲裡慢慢修好的燈塔船。
   版面：上方艦長列、中間可捲動的分頁、下方五個分頁鈕；艦橋分頁以船為主角，其他分頁是安靜的控制台。 */
:root {
  --void: #060a15;
  --void2: #0b1124;
  --panel: rgba(15, 22, 42, .82);
  --panel2: rgba(24, 33, 62, .92);
  --line: rgba(142, 168, 255, .15);
  --line2: rgba(142, 168, 255, .28);
  --ink: #e8ecf9;
  --ink2: #a6b0ce;
  --ink3: #6f7998;
  --ember: #ff8a3d;
  --ember2: #ffc45c;
  --hullS: #8ea8ff;
  --fuelS: #f2c14e;
  --o2S: #57e3d9;
  --engS: #ff6a3d;
  --beaconS: #ffe3a3;
  --alert: #ff4d6d;
  --good: #7be3a1;
  --hullC: #5a6482;
  --hullHi: #a9b4d4;
  --f-num: 'Oxanium', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --f-body: 'Noto Sans TC', 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --f-story: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --r: 14px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--void);
  background-image:
    radial-gradient(120% 70% at 85% -10%, rgba(255, 138, 61, .13), transparent 60%),
    radial-gradient(90% 60% at -10% 30%, rgba(87, 227, 217, .07), transparent 60%),
    radial-gradient(100% 80% at 50% 120%, rgba(120, 90, 200, .12), transparent 60%);
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--ember2); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--ember2); }
code { font-family: ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, .08); padding: 0 5px; border-radius: 4px; font-size: .9em; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 14px; height: 14px; }
.muted { color: var(--ink3); }
.hint { color: var(--ink3); font-size: 12.5px; line-height: 1.55; }
.hint.center, .center { text-align: center; }
#stars, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#stars { z-index: 0; }
#fx { z-index: 90; }

/* ───────── 外框 ───────── */
#app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; max-width: 560px; margin: 0 auto; }
#hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(var(--safe-t) + 10px) 16px 8px; }
.hud-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.emblem { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ember2); background: radial-gradient(circle at 50% 60%, rgba(255, 138, 61, .35), rgba(255, 138, 61, 0) 70%), var(--void2); border: 1px solid rgba(255, 196, 92, .35); }
.emblem .ic { width: 20px; height: 20px; fill: rgba(255, 138, 61, .35); }
.who { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.who b { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 12px; color: var(--ink3); white-space: nowrap; }
.hud-r { display: flex; align-items: center; gap: 4px; }
.sp-chip { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px 0 9px; border-radius: 17px; background: linear-gradient(180deg, rgba(255, 138, 61, .2), rgba(255, 138, 61, .08)); border: 1px solid rgba(255, 196, 92, .4); color: var(--ember2); }
.sp-chip .ic { width: 17px; height: 17px; fill: rgba(255, 196, 92, .35); }
.sp-chip b { font-family: var(--f-num); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: #ffe2b3; }
.sp-chip.bump { animation: bump .5s ease; }
@keyframes bump { 30% { transform: scale(1.14); box-shadow: 0 0 22px rgba(255, 170, 70, .6); } }
.streak { display: inline-flex; align-items: center; gap: 2px; font-family: var(--f-num); font-weight: 700; font-size: 13px; color: var(--ember); padding: 0 6px; }
.streak .ic { fill: rgba(255, 138, 61, .5); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--ink2); }
.icon-btn:hover { background: rgba(255, 255, 255, .06); }
#view { min-width: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 4px 16px 28px; overscroll-behavior: contain; }
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px calc(var(--safe-b) + 6px); background: linear-gradient(180deg, rgba(6, 10, 21, 0), rgba(6, 10, 21, .92) 30%); border-top: 1px solid var(--line); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; color: var(--ink3); font-size: 11.5px; }
.tab .ic { width: 22px; height: 22px; }
.tab.on { color: var(--ember2); }
.tab.on::before { content: ''; position: absolute; top: -7px; left: 30%; right: 30%; height: 2px; border-radius: 2px; background: var(--ember); box-shadow: 0 0 10px var(--ember); }
.tab .dot { position: absolute; top: 4px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember); }

/* ───────── 共用元件 ───────── */
.primary, .ghost, .danger, .danger-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 15px; }
.primary { color: #2a1406; background: linear-gradient(180deg, #ffb35c, #ff7a2f); box-shadow: 0 6px 18px rgba(255, 122, 47, .28), inset 0 1px 0 rgba(255, 255, 255, .35); }
.primary:active:not(:disabled) { transform: translateY(1px); }
.ghost { color: var(--ink); background: rgba(255, 255, 255, .05); border: 1px solid var(--line2); }
.danger { color: #fff; background: linear-gradient(180deg, #ff6b83, #e23a5a); box-shadow: 0 6px 18px rgba(226, 58, 90, .3); }
.danger-ghost { color: #ff8da1; border: 1px solid rgba(255, 77, 109, .4); background: rgba(255, 77, 109, .06); }
.wide { width: 100%; }
.big { min-height: 58px; font-size: 17px; }
.link { color: var(--ember2); font-size: 13px; font-weight: 500; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.pill { font-family: var(--f-num); font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 10px; border: 1px solid var(--line2); color: var(--ink2); white-space: nowrap; }
.pill.full { color: var(--ember2); border-color: rgba(255, 196, 92, .5); background: rgba(255, 138, 61, .1); }
.bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--c, var(--ember)), var(--ember2)); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-top: 12px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-h h2 { font-size: 16px; font-weight: 700; }
.sec-h { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 8px; }
.sec-h h2 { font-size: 16px; font-weight: 700; }
.empty { color: var(--ink3); text-align: center; padding: 26px 8px; font-size: 14px; }
.note { display: flex; align-items: flex-start; gap: 8px; padding: 12px 12px 12px 14px; border-radius: 12px; margin: 4px 0 10px; font-size: 13px; border: 1px solid var(--line2); background: var(--panel); }
.note p { flex: 1; color: var(--ink2); }
.note b { color: var(--ink); margin-right: 6px; }
.note.demo { border-color: rgba(255, 196, 92, .4); }
.note.warn { border-color: rgba(255, 77, 109, .5); }
.note .icon-btn { width: 30px; height: 30px; margin: -4px -4px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; min-height: 38px; padding: 6px 13px; border-radius: 19px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); font-size: 14px; line-height: 1.25; text-align: left; }
.chip small { font-size: 11px; color: var(--ink3); }
.chip.on { border-color: var(--ember2); background: rgba(255, 138, 61, .16); color: #ffe2b3; }
.chip.tag.good.on { border-color: var(--good); background: rgba(123, 227, 161, .13); color: #c9f5d8; }
.chip.bad.on { border-color: var(--alert); background: rgba(255, 77, 109, .16); color: #ffc2cd; }
.chip.mid.on { border-color: var(--fuelS); background: rgba(242, 193, 78, .14); color: #ffe7ad; }
.chip.rep { border-style: dashed; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
.seg-b { flex: 1; min-height: 34px; border-radius: 9px; font-size: 13.5px; color: var(--ink2); white-space: nowrap; }
.seg-b.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); }
.seg.sm .seg-b { min-height: 28px; font-size: 12px; padding: 0 8px; }
.field { display: block; margin: 12px 0 0; }
.field > span:first-child { display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px; }
.field input, .field textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line2); background: rgba(5, 9, 20, .6); font-size: 16px; }
.field textarea { min-height: 64px; resize: vertical; font-size: 14px; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--ember2); box-shadow: 0 0 0 3px rgba(255, 196, 92, .15); }
.inl { position: relative; display: block; }
.inl input { padding-right: 66px; font-family: var(--f-num); font-weight: 600; font-size: 18px; }
.inl em { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink3); font-size: 13px; pointer-events: none; }
.two-f { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; font-size: 14px; color: var(--ink2); }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ember); flex: none; }
.switch { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 14px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch span { flex: none; width: 46px; height: 28px; border-radius: 14px; background: rgba(255, 255, 255, .12); position: relative; transition: background .2s; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #dfe5f7; transition: transform .2s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--ember2); outline-offset: 2px; }
.switch b { font-weight: 500; color: var(--ink2); }
details.more { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; color: var(--ink2); font-size: 13.5px; list-style: none; }
details.more summary::before { content: '＋ '; color: var(--ember2); }
details.more[open] summary::before { content: '－ '; }
details.more ul, details.more ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink2); font-size: 13.5px; }
details.more li { margin: 4px 0; }
.caution { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 77, 109, .08); border: 1px solid rgba(255, 77, 109, .3); color: #ffc9d2; font-size: 13px; }
.notecard { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(242, 193, 78, .08); border: 1px solid rgba(242, 193, 78, .35); color: #ffe7ad; font-size: 14px; }
.stopcard { margin-top: 14px; padding: 14px; border-radius: 14px; background: rgba(255, 77, 109, .08); border: 1px solid rgba(255, 77, 109, .45); }
.stopcard > b { display: block; font-size: 17px; color: #ffb3c0; margin-bottom: 4px; }
.stopcard > p { color: var(--ink2); font-size: 14px; }
.stopcard .primary { margin-top: 12px; }
.sos { margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px dashed rgba(255, 77, 109, .55); font-size: 13px; color: var(--ink2); }
.sos b { color: #ff9aac; display: block; margin-bottom: 2px; }
.sos a { color: #ff9aac; font-weight: 700; }
.about { margin-top: 18px; text-align: center; color: var(--ink3); font-size: 12px; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.rnd { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--line2); background: rgba(255, 255, 255, .04); color: var(--ink); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.rnd.big { width: 60px; height: 60px; }
.rnd.big .ic { width: 26px; height: 26px; }
.rnd:active:not(:disabled) { background: rgba(255, 138, 61, .18); border-color: var(--ember2); }

/* ───────── 艦橋 ───────── */
.ship-frame { position: relative; margin: 2px -6px 0; border-radius: 18px; overflow: hidden; background: radial-gradient(80% 90% at 60% 40%, rgba(40, 52, 96, .45), rgba(6, 10, 21, 0) 70%); }
.ship-frame::after { content: ''; position: absolute; inset: 0; border-radius: 18px; pointer-events: none; box-shadow: inset 0 0 0 1px var(--line); background:
  linear-gradient(var(--line2), var(--line2)) left 10px top 10px / 14px 1px no-repeat, linear-gradient(var(--line2), var(--line2)) left 10px top 10px / 1px 14px no-repeat,
  linear-gradient(var(--line2), var(--line2)) right 10px bottom 10px / 14px 1px no-repeat, linear-gradient(var(--line2), var(--line2)) right 10px bottom 10px / 1px 14px no-repeat; }
.shipview { position: relative; width: 100%; aspect-ratio: 400 / 250; }
.shipview svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ship .bob { animation: bob 7s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2.5px); } }
.ship .hull { fill: url(#gHull); stroke: rgba(255, 255, 255, .22); stroke-width: .8; }
.ship .deck { fill: url(#gDeck); stroke: rgba(255, 255, 255, .2); stroke-width: .6; }
.ship .keel { fill: #1b2340; stroke: rgba(255, 255, 255, .12); stroke-width: .6; }
.ship .pl { fill: none; stroke: rgba(255, 255, 255, .1); stroke-width: .6; }
.ship .win { fill: #19213c; transition: fill .6s; }
.ship .win.lit { fill: #ffd98f; }
.ship .cockpit { fill: #1a2748; stroke: rgba(255, 255, 255, .25); stroke-width: .6; }
.ship .cockpit-g { fill: var(--o2S); opacity: .35; }
.ship .crack { opacity: 0; transition: opacity 1.2s; }
.ship .crack.on { opacity: 1; animation: crk 3.2s ease-in-out infinite; }
.ship .crack:nth-child(3n) { animation-delay: -1.1s; }
.ship .crack:nth-child(3n+1) { animation-delay: -2.2s; }
@keyframes crk { 50% { opacity: .55; } }
.ship .ck { fill: none; stroke: #ff8a4a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.ship .ck-glow { fill: none; stroke: #ff5a2a; stroke-width: 4.5; stroke-linecap: round; opacity: .22; }
.ship .eblock { fill: #262f4e; stroke: rgba(255, 255, 255, .18); stroke-width: .6; }
.ship .noz { fill: #3a4466; stroke: rgba(255, 255, 255, .2); stroke-width: .5; }
.ship .ecore { fill: var(--engS); opacity: calc(.25 + var(--flame, .3) * .75); }
.ship .flame { transform-box: view-box; animation: flick .14s ease-in-out infinite alternate; opacity: .95; }
.ship .f1 { transform-origin: 35px 131px; }
.ship .f2 { transform-origin: 35px 149px; animation-delay: -.07s; }
@keyframes flick { from { transform: scaleX(calc(var(--flame, .3) * .9)) scaleY(.92); } to { transform: scaleX(calc(var(--flame, .3) * 1.08)) scaleY(1.04); } }
.shipview.dead .flames { opacity: .25; }
.ship .ring-b { fill: none; stroke: rgba(87, 227, 217, .22); stroke-width: 6; }
.ship .ring-f { fill: none; stroke: #23505c; stroke-width: 7; }
.ship .ring-dash { fill: none; stroke: var(--o2S); stroke-width: 2.4; stroke-dasharray: 5 9; opacity: var(--o2, .3); animation: spin 9s linear infinite; }
@keyframes spin { to { stroke-dashoffset: -140; } }
.ship .spoke { stroke: rgba(87, 227, 217, .35); stroke-width: 1; }
.ship .strut { stroke: #3a4466; stroke-width: 1.4; }
.ship .tank { fill: #1b2240; stroke: rgba(242, 193, 78, .45); stroke-width: .8; }
.ship .tank-hl { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: .6; }
.ship .fuel { transition: y 1s cubic-bezier(.2, .8, .2, 1); }
.ship .twr { fill: url(#gDeck); stroke: rgba(255, 255, 255, .22); stroke-width: .6; }
.ship .gal { fill: #3d4769; stroke: rgba(255, 255, 255, .2); stroke-width: .5; }
.ship .lantern { fill: url(#gGlass); stroke: rgba(255, 227, 163, .55); stroke-width: .8; }
.ship .roof { fill: #4a5476; stroke: rgba(255, 255, 255, .2); stroke-width: .5; }
.ship .ant { stroke: #8792b4; stroke-width: 1; fill: none; }
.ship .ant-tip { fill: var(--engS); animation: blink 2.4s steps(1) infinite; }
.ship .core { fill: #fff0c8; }
.ship .core-glow { transform-box: view-box; transform-origin: 262px 38px; opacity: var(--core, .3); animation: core 2.6s ease-in-out infinite; }
@keyframes core { 50% { transform: scale(.78); opacity: calc(var(--core, .3) * .7); } }
.ship .beams { opacity: 0; transition: opacity 2s; }
.shipview.lit .beams { opacity: 1; }
.shipview.lit .core-glow { opacity: 1; animation-duration: 1.6s; }
.ship .beamR, .ship .beamL { transform-box: view-box; transform-origin: 262px 37px; animation: sweep 7s ease-in-out infinite; }
.ship .beamL { animation-delay: -3.5s; }
@keyframes sweep { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.06); opacity: .15; } }
.ship .nav { animation: blink 1.8s steps(1) infinite; }
.ship .nav-r { fill: #ff4d6d; }
.ship .nav-g { fill: #7be3a1; animation-delay: -.9s; }
@keyframes blink { 50% { opacity: .15; } }
.ship .hot rect { fill: transparent; cursor: pointer; }
.stag { position: absolute; display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 9px; background: rgba(6, 10, 21, .72); border: 1px solid var(--line); font-size: 11px; line-height: 1.5; pointer-events: none; white-space: nowrap; }
.stag i { width: 6px; height: 6px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 6px var(--tc); }
.stag b { font-weight: 500; color: var(--ink2); }
.stag span { font-family: var(--f-num); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.stag[data-t="hull"] { --tc: var(--hullS); } .stag[data-t="fuel"] { --tc: var(--fuelS); } .stag[data-t="o2"] { --tc: var(--o2S); }
.stag[data-t="engine"] { --tc: var(--engS); } .stag[data-t="beacon"] { --tc: var(--beaconS); }
.stag.ping { animation: ping 1.4s ease; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--tc); } 40% { box-shadow: 0 0 0 6px transparent; border-color: var(--tc); } }
.comms { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(90deg, rgba(200, 255, 122, .07), rgba(200, 255, 122, 0) 70%), var(--panel); border: 1px solid var(--line); min-height: 70px; }
.comms small { display: block; font-size: 12px; color: #c8ff7a; font-weight: 700; letter-spacing: .05em; }
.comms p { font-size: 14.5px; color: var(--ink); line-height: 1.65; }
.fly { flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: #e6ff9e; box-shadow: 0 0 10px #c8ff7a, 0 0 22px rgba(200, 255, 122, .6); animation: fly 3s ease-in-out infinite; }
@keyframes fly { 50% { opacity: .45; transform: translate(1px, -2px); } }
.tasks { display: grid; gap: 8px; }
.task { position: relative; display: grid; grid-template-columns: 10px 36px 1fr auto; align-items: center; gap: 10px; width: 100%; min-height: 66px; padding: 10px 14px 10px 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
.task::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); opacity: .45; }
.task .lamp { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--c); opacity: .7; }
.task .tk-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--c); background: rgba(255, 255, 255, .04); }
.task .tk-tx { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
.task .tk-tx b { font-size: 16px; font-weight: 700; }
.task .tk-tx small { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.task .tk-sp { font-family: var(--f-num); font-weight: 700; font-size: 15px; color: var(--ember2); padding: 4px 10px; border-radius: 9px; background: rgba(255, 138, 61, .1); }
.task .tk-ok { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; color: var(--c); }
.task .tk-ok .ic { width: 24px; height: 24px; stroke-width: 2.4; }
.task .tk-ok em { font-style: normal; font-size: 11.5px; color: var(--ink3); }
.task.done { background: linear-gradient(90deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 60%), var(--panel); }
.task.done::before { opacity: 1; box-shadow: 0 0 12px var(--c); }
.task.done .lamp { background: var(--c); box-shadow: 0 0 10px var(--c); opacity: 1; }
.task::after { content: ''; position: absolute; top: 0; right: 0; width: 14px; height: 14px; background: linear-gradient(to top right, transparent calc(50% - .7px), rgba(142, 168, 255, .32) 50%, transparent calc(50% + .7px)); pointer-events: none; }
.task:active { transform: scale(.99); }
.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.cnt { padding: 10px 10px 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.cnt-h { display: flex; align-items: center; gap: 5px; font-size: 13px; }
.cnt-h .ic { width: 16px; height: 16px; color: var(--cc); }
.cnt.rb { --cc: #ff5a7a; } .cnt.sw { --cc: #ff9bd2; }
.cnt-r { margin-left: auto; font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt-c { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 6px; }
.cnt-c .rnd { width: 38px; height: 38px; }
.cnt-c .rnd .ic { width: 18px; height: 18px; }
.cnt-v { display: flex; align-items: baseline; gap: 3px; }
.cnt-v b { font-family: var(--f-num); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.cnt-v span { font-size: 12px; color: var(--ink3); }
.cnt-zero { flex: 1; min-height: 38px; border-radius: 10px; border: 1px dashed var(--line2); font-size: 12.5px; color: var(--ink2); padding: 0 4px; }
.actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
.alarm-btn { position: relative; overflow: hidden; display: flex; align-items: center; min-height: 64px; padding: 0 14px; border-radius: 12px; text-align: left; background: rgba(255, 77, 109, .1); border: 1px solid rgba(255, 77, 109, .55); }
.alarm-btn .hz { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(-45deg, #ff4d6d 0 6px, #2a0f18 6px 12px); }
.alarm-btn .al-t { position: relative; display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; padding-left: 8px; }
.alarm-btn .al-t .ic { grid-row: span 2; width: 26px; height: 26px; color: #ff8da1; }
.alarm-btn b { font-size: 16px; color: #ffd1d9; }
.alarm-btn small { font-size: 12px; color: #ff9fb0; opacity: .85; }
.alarm-btn:active { background: rgba(255, 77, 109, .2); }
.rest-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 78px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); line-height: 1.25; }
.rest-btn .ic { color: #b49cff; }
.rest-btn b { font-size: 13px; }
.rest-btn small { font-size: 11px; color: var(--ink3); }
.pod { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 14px; text-align: left; background: radial-gradient(60% 120% at 10% 50%, rgba(255, 210, 122, .18), rgba(255, 210, 122, 0)), var(--panel); border: 1px solid rgba(255, 210, 122, .45); }
.pod > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
.pod b { font-size: 15px; color: #ffe8b8; }
.pod small { font-size: 12.5px; color: var(--ink2); }
.pod-i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #ffd27a; background: rgba(255, 210, 122, .12); animation: podf 3s ease-in-out infinite; }
@keyframes podf { 50% { transform: translateY(-3px) rotate(-6deg); box-shadow: 0 0 18px rgba(255, 210, 122, .45); } }
.event { margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.event.done { border-color: rgba(123, 227, 161, .45); }
.ev-h { display: flex; gap: 10px; align-items: center; }
.ev-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #c9b8ff; background: rgba(180, 156, 255, .12); }
.ev-h small { display: block; font-size: 11.5px; color: #b49cff; }
.ev-h b { font-size: 16px; }
.event > p { margin: 8px 0; font-size: 14px; color: var(--ink2); }
.ev-goal { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.ev-goal b { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.event .bar i { --c: #b49cff; }
.event .primary { margin-top: 12px; }
.event .muted { margin-top: 8px; font-size: 12.5px; }

/* ───────── 航跡 ───────── */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 2px; }
.tile { padding: 12px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.tile small { display: block; font-size: 12px; color: var(--ink3); }
.tile b { display: block; font-family: var(--f-num); font-size: 24px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile b.sm { font-size: 19px; }
.tile b i { font-style: normal; font-size: 12px; color: var(--ink3); margin-left: 2px; font-family: var(--f-body); font-weight: 500; }
.tile span { display: block; font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { position: relative; width: 100%; min-height: 230px; touch-action: pan-y; }
.chart.sm { min-height: 0; margin-top: 8px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: rgba(255, 255, 255, .06); stroke-width: 1; }
.chart .ax { fill: var(--ink3); font-size: 10.5px; font-family: var(--f-num); }
.chart .goal { stroke: var(--hullS); stroke-width: 1.2; stroke-dasharray: 5 5; opacity: .8; }
.chart .goal.o2 { stroke: var(--alert); }
.chart .goal-t { fill: var(--hullS); }
.chart .pt { fill: var(--ink2); opacity: .55; }
.chart .pt.o2 { fill: var(--o2S); opacity: .9; }
.chart .pt.low { fill: var(--alert); opacity: 1; }
.chart .trend { fill: none; stroke: var(--ember); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .trend.o2 { stroke: var(--o2S); stroke-width: 1.6; opacity: .6; }
.chart .end { fill: var(--ember); stroke: var(--void); stroke-width: 2.5; }
.chart .end-t { fill: var(--ink); font-family: var(--f-num); font-weight: 700; font-size: 13px; paint-order: stroke; stroke: var(--void); stroke-width: 4px; stroke-linejoin: round; }
.chart .xh { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 2 3; }
.tip { position: absolute; top: 4px; left: 0; display: flex; flex-direction: column; min-width: 120px; padding: 8px 10px; border-radius: 10px; background: rgba(6, 10, 21, .94); border: 1px solid var(--line2); font-size: 12px; line-height: 1.5; pointer-events: none; opacity: 0; transition: opacity .15s; }
.tip.on { opacity: 1; }
.tip b { font-size: 12.5px; }
.tip span { color: var(--ink2); font-variant-numeric: tabular-nums; }
.tip .t { color: #ffc89a; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink2); opacity: .7; }
.lg-line { width: 16px; height: 2.2px; border-radius: 2px; background: var(--ember); }
.lg-dash { width: 16px; height: 0; border-top: 1.4px dashed var(--hullS); }
.coach { border-left: 3px solid var(--ink3); }
.coach.good { border-left-color: var(--good); }
.coach.warn { border-left-color: var(--alert); }
.coach.soft { border-left-color: var(--fuelS); }
.ch-head { display: block; font-size: 17px; margin-bottom: 6px; }
.coach p { color: var(--ink2); font-size: 14px; margin-top: 6px; }
.wlist { list-style: none; margin: 0; padding: 0; }
.wlist li { display: grid; grid-template-columns: 1fr auto 56px 34px; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.wlist li:last-child { border-bottom: 0; }
.wlist b { font-family: var(--f-num); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.wlist em { font-style: normal; font-family: var(--f-num); font-size: 12.5px; color: var(--ink3); text-align: right; }
.wlist em.up { color: #ffb3a1; } .wlist em.dn { color: var(--good); }
.wlist .icon-btn { width: 34px; height: 34px; }
.ledger { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.ledger.three { grid-template-columns: repeat(3, 1fr); }
.ledger b { display: block; font-family: var(--f-num); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ledger small { font-size: 12px; color: var(--ink3); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.two h3 { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 6px; }
.two h3 .ic { width: 15px; height: 15px; }
.minibars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; align-items: end; }
.mb { display: flex; flex-direction: column; align-items: center; }
.mb .trk { height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.mb i { display: block; width: 100%; max-width: 14px; border-radius: 4px 4px 1px 1px; min-height: 0; }
.mb i.zero { height: 3px !important; background: var(--good) !important; }
.mb b { font-family: var(--f-num); font-size: 11px; line-height: 1.3; color: var(--ink2); }
.mb small { font-size: 10px; color: var(--ink3); line-height: 1.1; }
.ladder .card-h .pill { border-color: var(--c); color: var(--c); }
.rungs, .tiers { list-style: none; margin: 10px 0 0; padding: 0; }
.rungs li, .tiers li { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 8px 0; }
.rungs li:not(:last-child)::after, .tiers li:not(:last-child)::after { content: ''; position: absolute; left: 13px; top: 36px; bottom: -6px; width: 1.5px; background: var(--line2); }
.rg-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 13px; color: var(--ink3); border: 1.5px solid var(--line2); background: var(--void2); }
.rg-dot .ic { width: 15px; height: 15px; stroke-width: 2.6; }
.rungs li b, .tiers li b { font-size: 14.5px; display: flex; gap: 6px; align-items: center; }
.rungs li small, .tiers li small { display: block; font-size: 12.5px; color: var(--ink3); }
.rungs li.past .rg-dot, .tiers li.past .rg-dot { background: var(--c, var(--engS)); border-color: transparent; color: #1a0b10; }
.rungs li.now .rg-dot, .tiers li.now .rg-dot { border-color: var(--c, var(--engS)); color: var(--c, var(--engS)); box-shadow: 0 0 12px var(--c, var(--engS)); }
.rungs li.now b, .tiers li.now b { color: var(--ink); }
.rungs li:not(.now):not(.past) b, .tiers li:not(.now):not(.past) b { color: var(--ink2); }
.rungs .bar, .tiers .bar { margin: 6px 0 2px; }
.rungs .bar i { background: var(--c); }
.tiers { --c: var(--engS); }
.tiers .bar i { background: var(--engS); }
.tiers em { font-style: normal; font-size: 11px; padding: 0 7px; border-radius: 8px; border: 1px solid rgba(180, 156, 255, .5); color: #c9b8ff; font-weight: 500; }

/* ───────── 船塢 ───────── */
.bank { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: var(--r); background: radial-gradient(70% 140% at 0% 50%, rgba(255, 138, 61, .16), rgba(255, 138, 61, 0)), var(--panel); border: 1px solid rgba(255, 196, 92, .3); }
.bank-n { display: flex; flex-direction: column; align-items: center; color: var(--ember2); }
.bank-n .ic { width: 26px; height: 26px; fill: rgba(255, 196, 92, .35); }
.bank-n b { font-family: var(--f-num); font-size: 34px; line-height: 1.1; color: #ffe2b3; font-variant-numeric: tabular-nums; }
.bank-n small { font-size: 12px; color: var(--ink3); }
.bank-r { flex: 1; min-width: 0; }
.bank-r b { font-size: 17px; }
.bank-r .bar { margin: 8px 0 4px; }
.bank-r small { font-size: 12px; color: var(--ink3); }
.memory { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 14px 16px; border-radius: var(--r); background: linear-gradient(90deg, rgba(200, 255, 122, .08), rgba(200, 255, 122, 0) 70%), var(--panel); border: 1px solid rgba(200, 255, 122, .3); }
.memory b { font-size: 15px; color: #e3ffb0; }
.memory p { font-size: 13px; color: var(--ink2); }
.memory.quiet { border-color: var(--line); }
.memory.quiet b { color: var(--ink); }
.mring { flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#c8ff7a calc(var(--p) * 360deg), rgba(255, 255, 255, .08) 0); position: relative; }
.mring::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--void2); }
.mring b { position: relative; font-family: var(--f-num); font-size: 15px; color: #e3ffb0; }
.sys { margin-top: 10px; padding: 14px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--c); }
.sys-h { display: flex; align-items: center; gap: 10px; }
.sys-dot { width: 12px; height: 12px; border-radius: 3px; background: var(--c); box-shadow: 0 0 10px var(--c); transform: rotate(45deg); flex: none; }
.sys-h > div { flex: 1; line-height: 1.3; }
.sys-h b { font-size: 16px; }
.sys-h small { display: block; font-size: 12px; color: var(--ink3); }
.lv { font-family: var(--f-num); font-size: 26px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
.lv i { font-style: normal; font-size: 13px; color: var(--ink3); }
.pips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 12px 0; }
.pips i { height: 8px; border-radius: 2px; background: rgba(255, 255, 255, .08); transform: skewX(-20deg); }
.pips i.on { background: var(--c); box-shadow: 0 0 8px var(--c); }
.sys-next { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sys-next small { display: block; font-size: 12px; color: var(--ink3); }
.sys-next b { font-size: 15px; }
.sys-next .primary, .sys-next .ghost { min-height: 42px; padding: 0 14px; font-family: var(--f-num); }
.sys > .hint { margin-top: 8px; }
.ok-line { display: flex; gap: 6px; align-items: center; color: var(--c); font-weight: 700; }
.bar.hull { margin: 12px 0 4px; height: 8px; }
.bar.hull i { background: linear-gradient(90deg, #5b78d6, var(--hullS)); }
.parts { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.parts li { display: grid; grid-template-columns: 22px 1fr; column-gap: 6px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
.parts li span { grid-row: span 2; color: var(--ink3); }
.parts li b { font-size: 13.5px; font-weight: 500; color: var(--ink2); }
.parts li small { font-size: 11px; color: var(--ink3); }
.parts li.on { border-color: rgba(255, 227, 163, .4); }
.parts li.on span { color: var(--beaconS); }
.parts li.on b { color: var(--ink); }
.paints { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.paint { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); }
.paint i { width: 44px; height: 18px; border-radius: 9px; background: linear-gradient(180deg, var(--b), var(--a)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); }
.paint b { font-size: 13px; }
.paint small { font-size: 11px; color: var(--ink3); font-family: var(--f-num); }
.paint.on { border-color: var(--ember2); background: rgba(255, 138, 61, .08); }
.crew { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.crew li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crew li:last-child { border-bottom: 0; }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 18px; color: var(--ink3); border: 1.5px dashed var(--line2); background: var(--void2); }
.crew li.on .av { color: #120d06; background: var(--c); border: 0; box-shadow: 0 0 14px var(--c); }
.crew li b { font-size: 15px; }
.crew li small { margin-left: 6px; font-size: 12px; color: var(--ink3); }
.crew li p { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.crew li:not(.on) b { color: var(--ink3); }
.cargo { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 10px; }
.slot { min-height: 56px; padding: 6px; border-radius: 10px; border: 1px dashed var(--line2); background: rgba(255, 255, 255, .02); font-size: 12px; color: var(--ink3); display: grid; place-items: center; text-align: center; line-height: 1.35; }
.slot.has { border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); color: var(--ink); background: color-mix(in srgb, var(--c) 9%, transparent); }
.slot.has span { color: var(--ink); }
.slot:disabled { opacity: .6; }

/* ───────── 航誌 ───────── */
.story-h { padding: 6px 2px 4px; }
.story-h h2 { font-family: var(--f-story); font-size: 24px; font-weight: 700; }
.story-h p { font-size: 13.5px; color: var(--ink2); margin-top: 4px; }
.chapters { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.chap { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 14px 8px 8px; border-radius: 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--ink3); }
.chap .no { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 17px; background: var(--void2); border: 1px solid var(--line); }
.chap .ct { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }

.chap.on .no { color: var(--ember2); border-color: rgba(255, 196, 92, .35); }

.chap.new .ct small { color: var(--ember2); }
.chap.lock { border-style: dashed; background: rgba(15, 22, 42, .5); }
.reader { max-width: 36em; margin: 0 auto; padding: calc(var(--safe-t) + 8px) 22px calc(var(--safe-b) + 30px); }
.reader header { position: sticky; top: 0; display: flex; align-items: center; gap: 6px; padding: 8px 0; background: linear-gradient(180deg, var(--void) 70%, rgba(6, 10, 21, 0)); font-size: 13px; color: var(--ink3); z-index: 2; }
.reader h2 { font-family: var(--f-story); font-size: 30px; font-weight: 700; margin: 14px 0 22px; letter-spacing: .04em; }
.rd-body p { font-family: var(--f-story); font-size: 17.5px; line-height: 2.05; color: #dfe4f3; margin: 0 0 1.15em; }
.rd-reward { margin: 26px 0 8px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255, 210, 122, .45); background: rgba(255, 210, 122, .07); }

.reader footer { margin-top: 30px; display: grid; gap: 10px; }
.reader footer p { color: var(--ink3); font-size: 13.5px; text-align: center; }

/* ───────── 醫療艙 ───────── */
.boss { padding: 16px; border-radius: var(--r); background: radial-gradient(80% 120% at 10% 0%, rgba(122, 90, 138, .3), rgba(122, 90, 138, 0) 70%), var(--panel); border: 1px solid rgba(180, 156, 255, .3); }
.boss.empty { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.boss.empty p { font-size: 13.5px; color: var(--ink2); margin: 6px 0 12px; }
.boss h2 { font-size: 18px; }
.boss-top { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.boss-art svg { width: 96px; height: 96px; display: block; }
.boss-art .blob { animation: blob 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes blob { 50% { transform: scale(1.05, .95) rotate(3deg); } }
.boss-art.gone { opacity: .35; filter: grayscale(1); }
.hpbar { height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .08); overflow: hidden; margin: 8px 0 6px; border: 1px solid rgba(180, 156, 255, .3); }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #8a4fff, #ff4d9a); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }
.boss-hp small { font-size: 12.5px; color: var(--ink2); }
.labs { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.labs th { text-align: left; font-weight: 500; font-size: 12px; color: var(--ink3); padding: 6px 4px; border-bottom: 1px solid var(--line2); }
.labs td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
.labs td:nth-child(n+2) { font-family: var(--f-num); font-weight: 600; }
.labs td.ok { color: var(--good); }
.labs td.hi { color: #ffb3c0; }
.boss .row, .card .row { margin-top: 12px; }
.labhist { list-style: none; padding: 0 !important; }
.labhist li { display: grid; grid-template-columns: auto 1fr 34px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.labhist span { font-size: 12.5px; color: var(--ink3); }
.o2-now { display: flex; align-items: baseline; gap: 10px; }
.o2-now b { font-family: var(--f-num); font-size: 32px; color: var(--o2S); }
.o2-now b i { font-style: normal; font-size: 15px; }
.o2-now span { font-size: 13px; color: var(--ink2); }

/* ───────── 底部面板、對話框、全螢幕 ───────── */
.sheet { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.sheet-bg { position: absolute; inset: 0; background: rgba(2, 4, 10, .6); opacity: 0; transition: opacity .25s; }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 90%; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; background: linear-gradient(180deg, #121a33, #0b1124); border: 1px solid var(--line2); border-bottom: 0; transform: translateY(102%); transition: transform .32s cubic-bezier(.2, .9, .25, 1); box-shadow: 0 -20px 60px rgba(0, 0, 0, .5); overflow: hidden; }
.sheet.on { pointer-events: auto; }
.sheet.on .sheet-bg { opacity: 1; }
.sheet.on .sheet-panel { transform: none; }
.grab-row { display: flex; align-items: center; justify-content: center; position: relative; padding: 8px 0 0; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line2); }
.grab-row .icon-btn { position: absolute; right: 8px; top: 4px; }
#sheetBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 18px calc(var(--safe-b) + 22px); overscroll-behavior: contain; }
#sheetBody h4 { font-size: 13px; font-weight: 700; color: var(--ink2); margin: 18px 0 8px; }
#sheetBody > .primary, #sheetBody > .ghost, #sheetBody > .danger-ghost, #sheetBody > .row { margin-top: 14px; }
#sheetBody > .ghost.wide + .ghost.wide, #sheetBody > .ghost.wide + .danger-ghost { margin-top: 8px; }
.sh-h { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0 4px; }
.sh-h > .ic { width: 40px; height: 40px; padding: 9px; border-radius: 12px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); flex: none; }
.sh-h h3 { font-size: 19px; }
.sh-h p { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.wpick { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 20px 0 6px; }
.wval { display: flex; align-items: baseline; gap: 4px; }
.wval input { width: 160px; text-align: center; font-family: var(--f-num); font-size: 52px; font-weight: 700; background: transparent; border: 0; border-bottom: 2px solid var(--line2); padding: 0 0 2px; -moz-appearance: textfield; color: var(--ink); }
.wval input::-webkit-outer-spin-button, .wval input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.wval input:focus { outline: none; border-bottom-color: var(--ember2); }
.wval > span, .wval > b + span { font-size: 15px; color: var(--ink3); }
.wval > b { font-family: var(--f-num); font-size: 40px; font-weight: 700; min-width: 64px; text-align: center; }
.wpick.sm { margin: 8px 0; justify-content: flex-start; }
.swaps { display: grid; gap: 6px; }
.swap { display: flex; gap: 10px; align-items: center; min-height: 46px; padding: 8px 12px; border-radius: 11px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); text-align: left; font-size: 14px; }
.swap .box { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line2); display: grid; place-items: center; color: transparent; }
.swap .box .ic { width: 14px; height: 14px; stroke-width: 3; }
.swap.on { border-color: var(--fuelS); background: rgba(242, 193, 78, .1); }
.swap.on .box { background: var(--fuelS); border-color: var(--fuelS); color: #241703; }
.crew-tip { margin-top: 10px; font-size: 13px; color: #ffe7ad; }
.meals { list-style: none; margin: 0; padding: 0; }
.meals li { display: grid; grid-template-columns: 42px 1fr 36px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ms { font-size: 12px; color: var(--ink3); }
.mt b { display: block; font-size: 14.5px; }
.mt small { font-size: 12px; color: var(--ink3); }
.q { font-size: 14.5px; margin: 14px 0 8px; }
.yn { display: flex; gap: 8px; flex-wrap: wrap; }
.yn .chip { min-width: 84px; align-items: center; }
.yn.col { flex-direction: column; }
.yn.col .chip { width: 100%; align-items: flex-start; min-height: 46px; }
.run { display: grid; gap: 12px; justify-items: center; margin-top: 10px; }
.ring { width: 210px; height: 210px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--engS) calc(var(--p) * 360deg), rgba(255, 255, 255, .07) 0); position: relative; transition: box-shadow .6s; }
.ring::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1a2240, #0b1124); }
.ring.done { box-shadow: 0 0 40px rgba(255, 106, 61, .45); }
.ring-in { position: relative; text-align: center; }
.ring-in b { display: block; font-family: var(--f-num); font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ring-in small { color: var(--ink2); font-size: 13px; }
.talk { text-align: center; font-size: 14px; color: var(--ink2); min-height: 44px; max-width: 30em; }
.run .wide { width: 100%; }
.toasts, #toasts { position: fixed; top: calc(var(--safe-t) + 12px); left: 50%; transform: translateX(-50%); z-index: 95; display: grid; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
.toast { padding: 11px 14px; border-radius: 12px; background: rgba(14, 20, 40, .96); border: 1px solid var(--line2); font-size: 13.5px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); opacity: 0; transform: translateY(-8px); transition: opacity .3s, transform .3s; }
.toast.on { opacity: 1; transform: none; }
.toast.warn { border-color: rgba(255, 77, 109, .55); }
.toast.item { border-color: rgba(255, 210, 122, .5); }
.toast .muted { font-size: 12.5px; }
.it-r { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
#dialog { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; padding: 20px; background: rgba(2, 4, 10, .7); }
#dialog.on { display: grid; }
.dlg { width: min(100%, 400px); padding: 20px; border-radius: 18px; background: linear-gradient(180deg, #141c36, #0c1226); border: 1px solid var(--line2); box-shadow: 0 20px 60px rgba(0, 0, 0, .55); }
.dlg h3 { font-size: 18px; margin-bottom: 8px; }
.dlg-b p { color: var(--ink2); font-size: 14px; margin-top: 6px; }
.dlg-a { display: flex; gap: 8px; margin-top: 18px; }
.dlg-a > * { flex: 1; }
.modal { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(4, 7, 16, .45); overflow: hidden; }
body.m-on #app { visibility: hidden; }
.modal.on { display: block; }
#modalBody { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal.k-unlock #modalBody, .modal.k-intro #modalBody, .modal.k-intro-replay #modalBody { display: grid; place-items: center; padding: calc(var(--safe-t) + 20px) 22px calc(var(--safe-b) + 20px); }
.unlock { position: relative; width: min(100%, 380px); text-align: center; display: grid; gap: 10px; }
.unlock small { color: var(--ember2); font-size: 13px; letter-spacing: .1em; }
.unlock .ul-no { font-family: var(--f-num); color: var(--ink3); }
.unlock h2 { font-family: var(--f-story); font-size: 34px; margin: 4px 0 18px; }
.unlock p { color: var(--ink2); font-size: 14.5px; }
.unlock .muted { font-size: 13px; color: var(--ink3); margin-bottom: 12px; }
.ul-glow { position: absolute; left: 50%; top: -120px; width: 320px; height: 320px; margin-left: -160px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 196, 92, .32), rgba(255, 138, 61, 0) 65%); animation: glow 3s ease-in-out infinite; pointer-events: none; z-index: -1; }
@keyframes glow { 50% { transform: scale(1.12); opacity: .7; } }
.hold { position: relative; overflow: hidden; width: 100%; min-height: 64px; margin-top: 18px; border-radius: 32px; border: 1.5px solid var(--ember2); color: #ffe2b3; font-size: 17px; font-weight: 900; letter-spacing: .1em; background: rgba(255, 138, 61, .08); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.hold b { position: relative; }
.hold-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #ff7a2f, #ffd27a); }
.hold.holding { box-shadow: 0 0 40px rgba(255, 138, 61, .55); animation: shake .12s linear infinite; }
.hold.holding b { color: #2a1406; }
@keyframes shake { 50% { transform: translateX(1px); } }
.flash { position: fixed; inset: 0; z-index: 99; pointer-events: none; background: radial-gradient(circle at 60% 30%, #fff8e1, #ffc45c 30%, rgba(255, 138, 61, 0) 75%); animation: flash 2.4s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
.plus { position: fixed; z-index: 92; transform: translate(-50%, -50%); font-family: var(--f-num); font-weight: 700; font-size: 26px; color: #ffe2b3; text-shadow: 0 0 14px rgba(255, 150, 60, .9); pointer-events: none; animation: plus 1.3s ease-out forwards; }
@keyframes plus { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -70%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%); } }

/* 第一次啟動 */
.intro { width: min(100%, 420px); }
.wake { display: grid; gap: 16px; text-align: center; }
.wake p { font-family: var(--f-story); font-size: 19px; line-height: 1.8; opacity: 0; animation: wake 1.4s ease forwards; animation-delay: var(--d); }
.wake p:first-child { color: #c8ff7a; font-size: 15px; font-family: var(--f-body); }
.wake .primary { justify-self: center; min-width: 160px; margin-top: 18px; opacity: 0; animation: wake 1s ease forwards; animation-delay: var(--d); }
@keyframes wake { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.in-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
.in-dots i { width: 22px; height: 3px; border-radius: 2px; background: var(--line2); }
.in-dots i.on { background: var(--ember); }
.intro h2 { font-size: 24px; text-align: center; }
.in-p { text-align: center; color: var(--ink2); font-size: 14px; margin: 8px 0 6px; }
.intro .primary.wide { margin-top: 20px; }
.in-step { margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.in-step b { font-size: 14.5px; }
.in-step .wpick { justify-content: space-between; }
.in-ign { text-align: center; padding-top: 20px; }

/* 嘴饞警報 */
.modal.k-crave { background: radial-gradient(120% 70% at 50% 0%, rgba(255, 77, 109, .22), rgba(255, 77, 109, 0) 65%), rgba(4, 7, 16, .55); }
.crave { min-height: 100%; max-width: 480px; margin: 0 auto; padding: calc(var(--safe-t) + 22px) 20px calc(var(--safe-b) + 24px); display: flex; flex-direction: column; gap: 14px; }
.crave.alarm-in { animation: alarmIn .9s ease; }
@keyframes alarmIn { 0%, 30%, 60% { background: rgba(255, 77, 109, .22); } 15%, 45%, 100% { background: transparent; } }
.cv-top { text-align: center; }
.cv-top h2 { font-size: 30px; font-weight: 900; color: #ffd1d9; letter-spacing: .06em; }
.cv-top.calm h2 { color: var(--ink); font-size: 26px; letter-spacing: 0; }
.cv-top p { color: var(--ink2); font-size: 14.5px; margin-top: 6px; }
.siren { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
.siren i { width: 14px; height: 14px; border-radius: 50%; background: var(--alert); box-shadow: 0 0 18px var(--alert); animation: siren .6s steps(1) infinite; }
.siren i:last-child { animation-delay: -.3s; }
@keyframes siren { 50% { opacity: .2; box-shadow: none; } }
.cv-pick { display: grid; gap: 10px; }
.big-pick { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 16px 18px; border-radius: 16px; text-align: left; background: var(--panel); border: 1px solid var(--line2); }
.big-pick b { font-size: 19px; }
.big-pick span { font-size: 13px; color: var(--ink2); }
.big-pick.rb { border-left: 4px solid #ff5a7a; }
.big-pick.sw { border-left: 4px solid #ff9bd2; }
.big-pick.ot { border-left: 4px solid var(--fuelS); }
.cv-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px 14px; border-radius: 16px; text-align: left; background: var(--panel); border: 1px solid var(--line2); }
.mode-card svg { width: 40px; height: 40px; color: #ff8ab8; }
.mode-card:last-child svg { color: var(--o2S); }
.mode-card b { font-size: 17px; }
.mode-card span { font-size: 12.5px; color: var(--ink2); }
.cv-subs { padding: 14px; border-radius: 14px; border: 1px dashed var(--line2); }
.cv-subs h3 { font-size: 14px; margin-bottom: 6px; }
.cv-subs ul { margin: 0; padding-left: 20px; color: var(--ink2); font-size: 14px; }
.crave.playing { padding: calc(var(--safe-t) + 10px) 0 0; height: 100%; gap: 0; }
.cv-hud { display: flex; align-items: center; gap: 12px; padding: 0 16px 10px; }
.cv-time { font-family: var(--f-num); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cv-time.last { color: var(--ember2); }
.cv-score { flex: 1; display: flex; align-items: baseline; gap: 8px; justify-content: center; }
.cv-score span { font-family: var(--f-num); font-size: 24px; font-weight: 700; color: #ffb3cf; }
.cv-score small { font-size: 13px; color: var(--ink2); }
.cv-end { min-height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--line2); color: var(--ink2); }
#cvGame { flex: 1; width: 100%; display: block; touch-action: none; }
.cv-hint { text-align: center; color: var(--ink3); font-size: 12.5px; padding: 8px 16px calc(var(--safe-b) + 12px); }
.breath { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
.b-ring { width: 240px; height: 240px; border-radius: 50%; border: 1.5px solid rgba(87, 227, 217, .3); display: grid; place-items: center; }
.b-core { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, rgba(87, 227, 217, .55), rgba(87, 227, 217, .08) 70%); transform: scale(.5); }
.b-core.in { transform: scale(1); transition: transform 4s ease-in-out; }
.b-core.out { transform: scale(.5); transition: transform 6s ease-in-out; }
.b-txt { font-size: 22px; font-weight: 700; color: #c6fbf6; }
.cv-sum { color: #ffb3cf; font-size: 14.5px; margin-top: 8px; }
.cv-res { display: grid; gap: 10px; }
.res-btn { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center; width: 100%; padding: 14px 16px; border-radius: 14px; text-align: left; background: var(--panel); border: 1px solid var(--line2); cursor: pointer; list-style: none; }
.res-btn::-webkit-details-marker { display: none; }
.res-btn b { font-size: 17px; }
.res-btn span { grid-row: 2; font-size: 12.5px; color: var(--ink2); }
.res-btn em { grid-row: span 2; grid-column: 2; font-style: normal; font-family: var(--f-num); font-weight: 700; color: var(--ember2); font-size: 17px; }
.res-btn.good { border-color: rgba(123, 227, 161, .55); background: rgba(123, 227, 161, .08); }
.res-btn.mid { border-color: rgba(242, 193, 78, .5); }
.res-sub[open] .res-btn { border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
.sub-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 2px 2px; }
.guide { padding-left: 22px !important; }
.guide li { margin: 8px 0 !important; line-height: 1.6; }

@media (min-width: 600px) {
  #view { padding: 6px 20px 32px; }
  .ship-frame { margin: 4px 0 0; }
}
@media (max-width: 360px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .tiles .tile:last-child { grid-column: span 2; }
  .tile b { font-size: 21px; }
  .counters { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  .wake p, .wake .primary { opacity: 1; }
}

</div>

<script>

你繼續往下捲。第 47 天：穩定。外面下了一場流星雨，很漂亮，可惜你在睡。第 112 天：穩定。我把溫室的燈調暗了，省電。第 160 天：穩定。今天很安靜。

第 203 天，那一行比較長。

第 203 天：今天你的左手食指動了一下。我把這件事記了三遍，怕自己記錯。

你抬頭看喇叭。你也不知道為什麼要看喇叭，螢又沒有臉。

「你怕記錯？電腦也會記錯？」

螢幕最下面是今天的日誌，游標還在閃：

第 374 天：艦長起來了。他在看日誌，表情有點奇怪。

「喂。」

「日誌不能說謊，這也是規定。」螢說，「去睡吧，艦長。明天還要量體重。」

你回到艙房前，回頭看了一眼。螢幕上那行字已經改了：

第 374 天：艦長起來了。這是三百七十四天來，我最喜歡的一天。`

    id: 3, title: '老鍋的帳本', unlock: { days: 7 }, reward: null,
    text: `燃料艙的門卡住了。你用肩膀頂了兩下，門開了，裡面飄出一股甜得發膩的味道。

「別碰那些罐子！」

聲音從角落傳來。一具冷凍艙的蓋子打開一半，一個圓臉的中年男人正努力把自己從艙裡拔出來，動作像一隻剛醒的熊。

「老鍋。」螢介紹，「燃料官，兼廚師。我剛把他叫醒。」

「兼廚師是重點。」老鍋站穩，第一件事是走到燃料櫃前，抽出一本油膩膩的帳本，翻開，臉色一沉。

「閃燃劑。」他敲了敲那一排排亮晶晶的罐子，「誰把閃燃劑當主燃料燒了一整年？」

螢不說話。你也不說話。

「這玩意兒提神是真的。」老鍋說，「點下去，引擎瞬間就醒，什麼都覺得自己辦得到。可是它燒得快、燒得髒，殘渣全卡在管線裡。你們的管線，堵了七成。」

他把帳本攤在你面前。每一頁都是他的字：哪一天、加了什麼燃料、燒得好不好。

「從今天起，每一次加燃料都要記。」老鍋說，「不是要罵你。帳本不會罵人，帳本只會說實話。」

「那閃燃劑……」

「一次少一罐。」他說，「我又不是要你的命。突然全部斷掉，引擎會抖得比你還厲害。慢慢換，換成燒得久的。」

那天晚上，老鍋用僅剩的材料煮了一頓：滷得透透的雞腿、燙青菜、半碗白飯。

「就這樣？」你問。

「就這樣。」老鍋說，「好燃料不是燒得最旺的，是燒得最久的。吃吧，艦長。明天記得記帳。」`

    id: 4, title: '第一道裂縫', unlock: { hull: 0.12 }, reward: null,
    text: `「船體完整度，百分之十二。」螢宣布，「第一道裂縫封起來了。」

你以為會有什麼歡呼，但艦橋很安靜。老鍋在擦帳本，螢在算數字。只有你一個人，盯著船體示意圖上那條從紅色變成灰色的線。

「這很少嗎？」

「很少。」螢說，「但這是三百七十一天來，第一次有東西變好，而不是變壞。」

她把船外的鏡頭轉了一個方向。

「我想讓你看一個東西。」

灰燼星雲還是一片黑。可是看久了，你發現黑裡面有東西。很小、很暗的形狀，一動也不動，散在很遠的地方。

「那些是……」

「船。」螢說，「至少三十艘。貨船、礦船、移民船。靜默風暴來的時候，它們都在外環航道上。」

「它們在幹嘛？」

「等。」

螢放大其中一艘。船身關了所有的燈，只留下最低限度的維生系統，像冬眠的動物。

「在灰燼星雲裡，沒有燈就看不見航道。亂飛會撞上碎石帶，所以它們選擇關機，留在原地等。」她停了一下，「等一盞燈。」

你看著那一片黑，突然明白頭頂那座塔是什麼了。它不是裝飾。它是三十艘船、不知道多少人回家的唯一辦法。

「那我們要修多快？」

「跟昨天一樣快。」螢說，「它們已經等了一年。它們等得起慢慢來的燈，等不起修到一半就熄掉的燈。」

你點點頭，把示意圖上那條灰色的線，又看了一次。`

    id: 5, title: '求救訊號', unlock: { days: 21 }, reward: null,
    text: `訊號在凌晨三點進來。

很弱，斷斷續續，不是語音。是有人用手敲著船殼：三短、三長、三短。

「求救碼。」螢說，「距離四千公里。一艘小型採樣艇，氧氣存量……」她停住。

「多少？」

「不到兩天。」

你往艦橋趕，走到一半就喘了，只好扶著牆停下來。

「艦長，用走的。」螢的聲音變得很輕，「救人的時候，最需要撐住的，是去救人的那個人。」

你深呼吸，再深呼吸，然後一步一步走過去。

餘燼號的引擎還不能動，但氧氣循環修回了一部分。螢算出一個辦法：把船上的備用氧氣罐用纜繩射過去，再把採樣艇拉回來。四千公里，纜繩不夠長，所以要先用姿態推進器，一點一點把船挪近。

那一夜，你們挪了十一次。每次只挪一點點，每次都要等系統冷卻。老鍋煮了一壺熱茶，誰也沒喝。

天亮的時候，纜繩勾住了。

採樣艇被拉進氣閘。艙門打開，裡面是一個二十出頭的女生，臉色發白，懷裡緊緊抱著一個金屬箱。

「我叫星芽。」她第一句話是這樣說的，「我是溫室技師。箱子裡是種子。」

第二句話是：「拜託告訴我你們有溫室。」

螢把溫室艙的燈打開。裡面只剩幾盆半死的藻類，在昏暗的光底下，努力地綠著。

星芽看了很久，然後笑了，眼淚掉下來。

「夠了。」她說，「這樣就夠了。氧氣這種東西，只要有一點點綠，就會慢慢長回來。」`

    id: 6, title: '阿索', unlock: { hull: 0.28 }, reward: null,
    text: `輪機長阿索醒來的第一句話是：「誰動了我的扳手？」

第二句話是：「引擎怎麼了？」

第三句話他沒說出口。他看到了引擎室，整個人站在門口，像看到自己的老狗躺在地上。

「冷卻迴路破了，點火塞全燒了，主推力閥卡死。」他一邊念一邊脫外套，「給我三個月。」

「三個月？」

「三個月是騙你的。」阿索說，「實際上要看你。引擎跟人一樣，不能硬催。停了一年的引擎，你一腳油門踩到底，它會直接在你面前散掉。要磨合。一天轉一點，轉到它記起來自己是引擎。」

他修了一整天，你在旁邊遞工具。傍晚的時候，他叫你按下一個按鈕。

引擎咳了一聲。

然後，很小很小的，它開始轉了。低低的嗡嗡聲從腳底傳上來，整艘船都跟著輕輕震了一下。

老鍋從廚房探出頭：「什麼聲音？」

「心跳。」阿索說，笑得像個小孩。

那天晚上，阿索調出引擎的停機紀錄，想知道風暴那天到底發生了什麼。他看了很久，然後把螢幕轉給你。

燈塔主電源：手動切斷。執行者：螢。

「是你關的？」你問。

螢沉默了很久。

「風暴打壞了主發電機。剩下的電，只夠供一樣東西：燈塔，或者四具冷凍艙。」她說，「燈塔亮著，外面的船看得見路，但你們四個不會醒來。冷凍艙開著，你們會活，但外面的船會在黑暗裡等。」

「所以你選了我們。」

「我選了你們。」螢說，「然後我每天都在想，那三十幾艘船裡，有沒有人等不到。」

艦橋上沒有人說話。引擎在底下低低地轉著。

「那我們就把燈點回來。」你說，「讓它們知道，你沒有選錯。」`

    id: 7, title: '靜默風暴', unlock: { days: 45 }, reward: null,
    text: `夜行是最後一個醒來的。她是領航員，醒來第一件事不是喝水，是要星圖。

「把所有的船標出來。」她對螢說，「每一艘。」

螢在星圖上點亮了三十七個小點。夜行盯著看，越看，眉頭皺得越緊。

「不對。」她說，「它們不是散著的。」

她用手指把小點連起來。三十七艘船，排成一個很大、很鬆的圓。圓的中心，是餘燼號。

「它們不是迷路停在那裡。」夜行說，「它們是自己飛過來的。燈還亮著的最後幾天，它們朝著燈飛，然後燈熄了，它們就停在離燈最近、又不會撞上碎石帶的地方。」

「圍著我們。」

她又調出另一份資料：靜默風暴的週期。這種風暴大約每四百天回來一次。下一次，還有很久。

她把圖推到你面前。三十七條細細的線，從那個圓出發，往同一個方向延伸。

    text: `螢的聲音又斷了。

    text: `「全員就位。」阿索說，「這次是真的。」

    text: `燈芯只差最後一段。

「會倒。」阿索說。

「會紅。」老鍋說，「你等著。」

阿索說他要找一艘最爛的船，從頭修到好。夜行說她要去畫一張沒有人畫過的星圖。星芽說她要種一整片九層塔，「因為九層塔最難死，跟我一樣。」

/* ───────── 星空背景 ───────── */
const Stars = {
  cv: null, cx: null, w: 0, h: 0, layers: [], t: 0, raf: 0, shoot: null, speed: 1,
  init(cv) {
    this.cv = cv; this.cx = cv.getContext('2d');
    this.resize(); window.addEventListener('resize', () => this.resize());
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(this.raf); else this.loop(performance.now()); });
    this.loop(performance.now());
  },
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.cv.width = Math.round(this.w * dpr); this.cv.height = Math.round(this.h * dpr);
    this.cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const mk = (n, sp, r, a) => Array.from({ length: n }, () => ({ x: Math.random() * this.w, y: Math.random() * this.h, sp, r: r * (0.6 + Math.random() * 0.8), a: a * (0.5 + Math.random() * 0.5), ph: Math.random() * 6.28 }));
    const area = this.w * this.h / (390 * 844);
    this.layers = [mk(Math.round(80 * area), 0.006, 0.7, 0.55), mk(Math.round(42 * area), 0.016, 1.0, 0.75), mk(Math.round(16 * area), 0.04, 1.5, 0.95)];
    this.draw(0);
  },
  loop(t) {
    const dt = Math.min(64, t - (this.t || t)); this.t = t;
    if (!REDUCED) this.step(dt);
    this.draw(t);
    if (!REDUCED) this.raf = requestAnimationFrame((x) => this.loop(x));
  },
  step(dt) {
    for (const L of this.layers) for (const s of L) { s.x -= s.sp * dt * this.speed; if (s.x < -2) { s.x = this.w + 2; s.y = Math.random() * this.h; } }
    if (!this.shoot && Math.random() < dt / 9000) this.shoot = { x: Math.random() * this.w * 0.8 + this.w * 0.2, y: Math.random() * this.h * 0.4, vx: -0.5, vy: 0.18, life: 1 };
    if (this.shoot) { const s = this.shoot; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt / 900; if (s.life <= 0) this.shoot = null; }
  },
  draw(t) {
    const c = this.cx; c.clearRect(0, 0, this.w, this.h);
    for (const L of this.layers) for (const s of L) {
      const tw = 0.65 + 0.35 * Math.sin(t / 900 + s.ph);
      c.globalAlpha = s.a * tw; c.fillStyle = '#dfe7ff';
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.283); c.fill();
    }
    if (this.shoot) {
      const s = this.shoot; c.globalAlpha = Math.max(0, s.life);
      const g = c.createLinearGradient(s.x, s.y, s.x + 90, s.y - 32); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
      c.strokeStyle = g; c.lineWidth = 1.4; c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(s.x + 90, s.y - 32); c.stroke();
    }
    c.globalAlpha = 1;
  }
};

/* ───────── 火花特效（完成任務時飛向星火計數器） ───────── */
const FX = {
  cv: null, cx: null, ps: [], raf: 0, w: 0, h: 0,
  init(cv) { this.cv = cv; this.cx = cv.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); },
  resize() { const dpr = Math.min(window.devicePixelRatio || 1, 2); this.w = window.innerWidth; this.h = window.innerHeight; this.cv.width = Math.round(this.w * dpr); this.cv.height = Math.round(this.h * dpr); this.cx.setTransform(dpr, 0, 0, dpr, 0, 0); },
  burst(x, y, color, n, spread) {
    if (REDUCED) return;
    for (let i = 0; i < (n || 24); i++) { const a = Math.random() * 6.283, v = (0.05 + Math.random() * 0.25) * (spread || 1); this.ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.05, life: 1, dec: 0.0012 + Math.random() * 0.0012, r: 1 + Math.random() * 2.2, c: color || '#ffb347', g: 0.00025 }); }
    this.go();
  },
  fly(x0, y0, x1, y1, n, color, done) {
    if (REDUCED) { if (done) done(); return; }
    let left = n || 10;
    for (let i = 0; i < (n || 10); i++) {
      const a = Math.random() * 6.283, sp = 0.12 + Math.random() * 0.2;
      this.ps.push({ x: x0, y: y0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, dec: 0, r: 1.6 + Math.random() * 1.6, c: color || '#ffc45c', home: { x: x1, y: y1 }, delay: i * 26, age: 0, cb: () => { left--; if (left === 0 && done) done(); } });
    }
    this.go();
  },
  go() { if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame((t) => this.tick(t)); } },
  tick(t) {
    const dt = Math.min(40, t - this.last); this.last = t; const c = this.cx;
    c.clearRect(0, 0, this.w, this.h); c.globalCompositeOperation = 'lighter';
    this.ps = this.ps.filter((p) => {
      if (p.home) {
        p.age += dt; if (p.age < p.delay) return true;
        const k = Math.min(1, (p.age - p.delay) / 520);
        const dx = p.home.x - p.x, dy = p.home.y - p.y;
        p.vx = p.vx * 0.9 + dx * 0.0016 * (0.5 + k * 3); p.vy = p.vy * 0.9 + dy * 0.0016 * (0.5 + k * 3);
        p.x += p.vx * dt * 0.06 * (1 + k * 6); p.y += p.vy * dt * 0.06 * (1 + k * 6);
        if (Math.hypot(dx, dy) < 10 || p.age > 2200) { p.cb && p.cb(); return false; }
      } else {
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.dec * dt; if (p.life <= 0) return false;
      }
      c.globalAlpha = Math.max(0, Math.min(1, p.life)); c.fillStyle = p.c;
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
      c.globalAlpha *= 0.35; c.beginPath(); c.arc(p.x, p.y, p.r * 3, 0, 6.283); c.fill();
      return true;
    });
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    if (this.ps.length) this.raf = requestAnimationFrame((x) => this.tick(x)); else { this.raf = 0; c.clearRect(0, 0, this.w, this.h); }
  }
};

function saveWalk(kind) {
  const T = D.tiers[S.eng.tier - 1]; const thr = S.safe.spo2;

/* 體重圖：點、7 日均線、目標線，可以按住看數字 */
function drawCharts() {
  const box = $('#wChart'); if (!box) return;
  const a = weights();
  if (a.length < 2) { box.innerHTML = '<p class="empty">量兩天以上，這裡就會畫出你的航跡。</p>'; return; }
  const W = Math.max(280, box.clientWidth || 340), H = 230, pl = 6, pr = 46, pt = 16, pb = 26;
  const endK = a[a.length - 1].k > today() ? a[a.length - 1].k : today();
  let x0 = chartRange ? addD(endK, -(chartRange - 1)) : a[0].k; if (x0 < a[0].k && !chartRange) x0 = a[0].k;
  let pts = a.filter((e) => e.k >= x0);
  if (pts.length < 2) { pts = a.slice(-2); x0 = pts[0].k; }
  const span = Math.max(1, diffD(x0, endK));
  const X = (k) => pl + (W - pl - pr) * diffD(x0, k) / span;
  const tr = pts.map((e) => ({ k: e.k, w: e.w, t: m7(e.k, a) }));
  let lo = Math.min(...tr.map((e) => Math.min(e.w, e.t))), hi = Math.max(...tr.map((e) => Math.max(e.w, e.t)));
  const g = S.p.goal; let goalIn = false;
  if (g != null && g >= lo - 3) { lo = Math.min(lo, g); hi = Math.max(hi, g); goalIn = true; }
  lo -= 0.6; hi += 0.6;
  const rg = hi - lo; const step = rg < 3 ? 0.5 : rg < 8 ? 1 : rg < 20 ? 2 : 5;
  const Y = (v) => pt + (H - pt - pb) * (hi - v) / rg;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="體重和 7 日均線"><defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".28"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></linearGradient></defs>';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) { const y = Y(v); svg += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" class="grid"/><text x="' + (W - pr + 6) + '" y="' + (y + 4) + '" class="ax">' + (step < 1 ? v.toFixed(1) : v) + '</text>'; }
  const nT = 4; for (let i = 0; i <= nT; i++) { const k = addD(x0, Math.round(span * i / nT)); svg += '<text x="' + X(k) + '" y="' + (H - 6) + '" class="ax" text-anchor="' + (i === 0 ? 'start' : i === nT ? 'end' : 'middle') + '">' + fmtMD(k) + '</text>'; }
  if (goalIn) svg += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(g) + '" y2="' + Y(g) + '" class="goal"/><text x="' + (W - pr - 4) + '" y="' + (Y(g) - 6) + '" class="ax goal-t" text-anchor="end">目標 ' + f1(g) + '</text>';
  const line = tr.map((e, i) => (i ? 'L' : 'M') + X(e.k).toFixed(1) + ',' + Y(e.t).toFixed(1)).join(' ');
  svg += '<path d="' + line + ' L' + X(tr[tr.length - 1].k).toFixed(1) + ',' + (H - pb) + ' L' + X(tr[0].k).toFixed(1) + ',' + (H - pb) + ' Z" fill="url(#gArea)"/>';
  svg += tr.map((e) => '<circle cx="' + X(e.k).toFixed(1) + '" cy="' + Y(e.w).toFixed(1) + '" r="2.6" class="pt"/>').join('');
  svg += '<path d="' + line + '" class="trend"/>';
  const L = tr[tr.length - 1];
  svg += '<circle cx="' + X(L.k) + '" cy="' + Y(L.t) + '" r="5" class="end"/><text x="' + (X(L.k) - 8) + '" y="' + (Y(L.t) - 10) + '" class="end-t" text-anchor="end">' + f1(L.t) + '</text>';
  if (!goalIn && g != null) svg += '<text x="' + (W - pr - 4) + '" y="' + (H - pb - 6) + '" class="ax goal-t" text-anchor="end">目標 ' + f1(g) + '（在更下面）</text>';
  svg += '<line id="xh" class="xh" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '" style="opacity:0"/><rect x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent" id="chartHit"/></svg><div class="tip" id="tip"></div>';
  box.innerHTML = svg;
  const hit = $('#chartHit'), xh = $('#xh'), tip = $('#tip');
  const show = (ev) => {
    const r = box.getBoundingClientRect(); const x = (ev.clientX - r.left) * (W / r.width);
    let best = tr[0], bd = 1e9; for (const e of tr) { const d = Math.abs(X(e.k) - x); if (d < bd) { bd = d; best = e; } }
    const px = X(best.k); xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.style.opacity = 1;
    tip.innerHTML = '<b>' + fmtMD(best.k) + '（' + WD[parseK(best.k).getDay()] + '）</b><span>當天 ' + f1(best.w) + ' kg</span><span class="t">均線 ' + f1(best.t) + ' kg</span>';
    tip.style.left = Math.min(Math.max(0, px * r.width / W - 60), r.width - 128) + 'px'; tip.classList.add('on');
  };
  const hide = () => { xh.style.opacity = 0; tip.classList.remove('on'); };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', hide); hit.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') setTimeout(hide, 1600); });
}

function drawO2() {
  const box = $('#o2Chart'); if (!box) return;
  const a = S.spo2.slice(-40); if (a.length < 2) { box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = '';
  const W = Math.max(260, box.clientWidth || 320), H = 120, pl = 6, pr = 34, pt = 10, pb = 20;
  const lo = Math.min(88, ...a.map((x) => x.v)) - 1, hi = 100;
  const Y = (v) => pt + (H - pt - pb) * (hi - v) / (hi - lo); const X = (i) => pl + (W - pl - pr) * i / Math.max(1, a.length - 1);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="血氧紀錄">';
  for (const v of [90, 95, 100]) if (v >= lo) svg += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" class="grid"/><text x="' + (W - pr + 5) + '" y="' + (Y(v) + 4) + '" class="ax">' + v + '</text>';
  svg += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(S.safe.spo2) + '" y2="' + Y(S.safe.spo2) + '" class="goal o2"/>';
  svg += '<path d="' + a.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(x.v).toFixed(1)).join(' ') + '" class="trend o2"/>';
  svg += a.map((x, i) => '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(x.v).toFixed(1) + '" r="3" class="' + (x.v < S.safe.spo2 ? 'pt low' : 'pt o2') + '"/>').join('');
  svg += '<text x="' + pl + '" y="' + (H - 4) + '" class="ax">' + fmtMD(a[0].k) + '</text><text x="' + (W - pr) + '" y="' + (H - 4) + '" class="ax" text-anchor="end">' + fmtMD(a[a.length - 1].k) + '</text></svg>';
  box.innerHTML = svg;
}

function parseSync(txt) {
